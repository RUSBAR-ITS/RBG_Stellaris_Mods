l_russian:

 tass_no_buff: "§gБез изменений§!"
 tass_enhance: "$tass_mod$ Усиление"
 
#Category
 policy_category_tass_cheat_resources: "$tass_mod$ §dРесурсы§!"
 policy_category_tass_cheat_resources_desc: "Производство и ежемесячное получение ресурсов, затраты, содержание и вместимость хранилищ."
 policy_category_tass_cheat_construction: "$tass_mod$ §dСтроительство§!"
 policy_category_tass_cheat_construction_desc: "Скорость и варианты исследований, эффективность рабочей силы, гражданское и военное строительство, мегасооружения, развитие колоний и терраформирование."
 policy_category_tass_cheat_pop: "$tass_mod$ §dПоселения§!"
 policy_category_tass_cheat_pop_desc: "Рост и сборка поселений, рост вида-основателя и стоимость модификации видов."
 policy_category_tass_cheat_colony: "$tass_mod$ §dКолония§!"
 policy_category_tass_cheat_colony_desc: "Жильё, блага, преступность, стабильность, принятие решений и эффекты вознесения колоний."
 policy_category_tass_cheat_army: "$tass_mod$ §dАрмия§!"
 policy_category_tass_cheat_army_desc: "Урон и защита сухопутных армий, выход из боя и получение опыта."
 policy_category_tass_cheat_fleet: "$tass_mod$ §dФлот§!"
 policy_category_tass_cheat_fleet_desc: "Боевые характеристики, восстановление, сенсоры и перемещения кораблей; развитие биологических кораблей и лимиты флота и обороны."
 policy_category_tass_cheat_leader: "$tass_mod$ §dЛидеры§!"
 policy_category_tass_cheat_leader_desc: "Действующий навык лидеров, варианты черт и скорость получения опыта."
 policy_category_tass_cheat_country: "$tass_mod$ §dГосударство§!"
 policy_category_tass_cheat_country_desc: "Штрафы от размера государства, усталость от войны, принципы, программы совета и эффективность указов."
 policy_category_tass_cheat_psionic: "$tass_mod$ §dПсионика§!"
 policy_category_tass_cheat_psionic_desc: "Погружение в Покров, резонанс послов с покровителями, псионические ауры и сопротивление им."
 policy_category_tass_cheat_espionage: "$tass_mod$ §dШпионаж§!"
 policy_category_tass_cheat_espionage_desc: "Разведданные, агентурные сети, контрразведка и тайные операции."
 policy_category_tass_cheat_technique: "$tass_mod$ §dТехнологии и исследования§!"
 policy_category_tass_cheat_technique_desc: "Изучение космоса, первый контакт, шифровка и взлом кодов, маскировка и обнаружение, приручение космической фауны."
 policy_category_tass_cheat_diplomacy: "$tass_mod$ §dДипломатия§!"
 policy_category_tass_cheat_diplomacy_desc: "Действия послов, доверие, дипломатическое одобрение и вес, федерации, вето и чрезвычайные меры."
 policy_category_tass_cheat_nomadic: "$tass_mod$ §dКочевники§!"
 policy_category_tass_cheat_nomadic_desc: "Действия кораблей-ковчегов, логистические корабли, сбор и хранение ресурсов, оперативные резервы кочевников."
 
#Policy
 policy_tass_policy_cheat_all_production: "01. Ежемесячное производство"
 policy_tass_policy_cheat_all_production_desc: "Увеличивает производство ресурсов государства; отдельные политики позволяют усилить выбранный ресурс."
 tass_policy_cheat_all_production_0: "$tass_no_buff$"
 tass_policy_cheat_all_production_0_desc: "Политика «$policy_tass_policy_cheat_all_production$» не даёт дополнительных модификаторов. Эффекты других политик и действий сохраняются."
 tass_policy_cheat_all_production_1: "$tass_enhance$ ур. 1"
 tass_policy_cheat_all_production_1_desc: "Повышает производство ресурсов государства на +100%."
 tass_policy_cheat_all_production_2: "$tass_enhance$ ур. 2"
 tass_policy_cheat_all_production_2_desc: "Повышает производство ресурсов государства на +200%."
