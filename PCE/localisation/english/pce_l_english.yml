 pce_multilayered_cities:0 "Multilevel Cities"
 pce_multilayered_cities_desc:0 "New tiers rise above the rooftops of established neighborhoods, each with streets and squares of its own. Homes and workshops line the elevated roads, with lifts connecting them to the neighborhoods below."
 pce_tiered_nests:0 "Tiered Nests"
 pce_tiered_nests_desc:0 "Above the vaulted nest, drones build another tier of storerooms and brood chambers. Wide passages connect it to the heart of the hive. Workers are already carrying food up for the first brood."
 pce_modular_quarters:0 "Modular Quarters"
 pce_modular_quarters_desc:0 "Residents add modules above their workshops to recharge, make repairs, and store spare chassis. Standard fittings let neighbors link their buildings with walkways. Gradually, another neighborhood takes shape overhead."
 pce_distributed_nodes:0 "Distributed Nodes"
 pce_distributed_nodes_desc:0 "Drones assemble new floors of production lines and repair bays around the coordination nodes. As each floor comes online, the machine intelligence routes parts to it and assigns drones to their stations."
 pce_biosphere_layers:0 "Biosphere Layers"
 pce_biosphere_layers_desc:0 "In the canopy of mature groves, branches intertwine and soil collects. New gardens take root high above the ground. Symbionts cross living bridges to colonize them, while the spreading roots nourish both layers."
 pce_volcanic_multilayered_cities:0 "$pce_multilayered_cities$"
 pce_volcanic_multilayered_cities_desc:0 "Houses rise in terraces on either side of a lava channel. Builders span the gap with broad bridges above the rooftops. In time the bridges become streets, uniting the neighborhoods on both slopes in a single intricate work of architecture and engineering."
 pce_volcanic_tiered_nests:0 "$pce_tiered_nests$"
 pce_volcanic_tiered_nests_desc:0 "Scout drones find another tier of lava tubes above the nest. Builders follow, shoring up the vaults, lining warm niches for the brood, and cutting passages to the chambers below."
 pce_volcanic_modular_quarters:0 "$pce_modular_quarters$"
 pce_volcanic_modular_quarters_desc:0 "Workshop owners assemble new living modules on their upper decks. Neighbors link them with walkways and run a shared power cable from the nearest geothermal plant. Soon the new tier has workshops of its own."
 pce_volcanic_distributed_nodes:0 "$pce_distributed_nodes$"
 pce_volcanic_distributed_nodes_desc:0 "Above the geothermal wells, drones stack assembly floors and connect each one to the power grid. While production runs on one floor, a lift in the next shaft is already hauling deck sections up for the next."
 pce_ecumenopolis_upper_city:0 "The Upper City"
 pce_ecumenopolis_upper_city_desc:0 "The roofs of old arcologies become the foundations of new neighborhoods. Express trains run between the tower tops. Homes, shops, and small parks spring up around their stations, high above the streets of the old city."
 pce_ecumenopolis_modular_arcologies:0 "Modular Arcologies"
 pce_ecumenopolis_modular_arcologies_desc:0 "On the upper floors of the arcologies, each machine fits out a workshop to suit its own chassis. Behind one door there is room to swing a heavy manipulator. Behind another, the owner assembles delicate components under a magnifying lens. A common freight gallery serves the workshops along the entire tier."
 pce_ecumenopolis_nest_towers:0 "Nest Towers"
 pce_ecumenopolis_nest_towers_desc:0 "Drones build vaulted brood chambers above the arcology rooftops. In the old lift shafts they fashion spiral passages and carry the brood up from the depths of the towers to the new nests."
 pce_ecumenopolis_assembly_towers:0 "Assembly Towers"
 pce_ecumenopolis_assembly_towers_desc:0 "Drones anchor new assembly floors to the load-bearing columns of the arcologies. Each chassis travels upward as it takes shape. The finished machine rolls off the topmost line straight onto a transit platform."
 pce_ecumenopolis_garden_arcologies:0 "Garden Arcologies"
 pce_ecumenopolis_garden_arcologies_desc:0 "On the tower roofs, servitors lay out gardens and build homes for their wards. An entire service tier runs beneath the promenades. Long before dawn, drones travel its corridors to deliver everything the residents have ordered for the morning."
 pce_hive_world_deep_hive_cells:0 "Deep Hive Cells"
 pce_hive_world_deep_hive_cells_desc:0 "Beneath the inhabited nests, layers of living tissue slowly draw apart. While the walls are still soft, drones widen the cavities and cut passages between neighboring chambers. By the time the vaults harden, vessels pulse within them, nourishing an entire tier."
 pce_hive_world_reclaimed_galleries:0 "Reclaimed Galleries"
 pce_hive_world_reclaimed_galleries_desc:0 "Deep in the old nest, sealed chambers survive. Doors in the living walls still open at a drone's touch. Freight tracks follow the newly opened passages as another tier comes back into use."
 pce_machine_world_layers_of_the_planetary_machine:0 "Layers of the Planetary Machine"
 pce_machine_world_layers_of_the_planetary_machine_desc:0 "Beneath the freight main line, drones assemble a new belt of workshops. Lifts link it to the foundries on the surface. A casting can now descend for machining and return to the assembly yards thousands of kilometers from the furnace that poured it."
 pce_machine_world_quiet_decks:0 "Quiet Decks"
 pce_machine_world_quiet_decks_desc:0 "Above the freight tracks, servitors suspend residential decks on shock absorbers. Before signing off on a deck, a drone places a glass of water on a bedside table and waits for a heavy train to pass below. If the water stays still, the rooms are ready for their occupants."
 pce_machine_world_artisans_quarters:0 "Artisans’ Quarters"
 pce_machine_world_artisans_quarters_desc:0 "On either side of the freight line, machines cut workshop doors into the planet’s outer shell. One owner needs a tall bay for a bridge crane. The neighbor fits three working floors into the same height. Both loading platforms meet the same track."
 pce_machine_world_habitation_sections:0 "Habitation Sections"
 pce_machine_world_habitation_sections_desc:0 "The old cable galleries beneath the surface are wide enough to carry a passenger line. Homes occupy the upper decks of the adjoining machine halls. The old freight platforms serve as stations for the new neighborhoods."
 pce_machine_world_heat_exchanger_nests:0 "Heat Exchanger Nests"
 pce_machine_world_heat_exchanger_nests_desc:0 "The hive spreads into deep shafts that carry heat away from the planetary machinery. Drones fasten brood chambers along the warm pipes. Wide passages between tiers let them carry the brood to the temperatures it needs as it grows."
 pce_nanite_tiers:0 "Nanite Tiers"
 pce_nanite_tiers_desc:0 "At the foot of the settled platforms, the silvery surface gathers into folds. Pillars rise from them, and nanites weave floor after floor between the supports. The first transit lines take shape along their edges as a new tier rises above the old districts."
 pce_habitat_modular_quarters:0 "$pce_modular_quarters$"
 pce_habitat_modular_quarters_desc:0 "Crews dock new modules to the station hull one by one. The first families are settling into one, the smell of fresh bread drifts from another each morning, and beyond the next bulkhead the fitters are still running cable. A corridor that once ended at an airlock becomes the main street of a new neighbourhood."
 pce_habitat_brood_compartments:0 "Brood Compartments"
 pce_habitat_brood_compartments_desc:0 "Drones build brood chambers around warm pipes, leaving narrow passages between the clutches. When the time comes to move the brood, a steady rustle fills the new deck. It carries clear through the bulkhead."
 pce_habitat_rack_mounted_decks:0 "Rack-Mounted Decks"
 pce_habitat_rack_mounted_decks_desc:0 "Manipulator arms slide a prefabricated deck along guides in the hull. As it locks into place, the power contacts engage. The first shift of drones rides the rails down to the deck while its lights are still dark."
 pce_habitat_airlock_workshops:0 "Airlock Workshops"
 pce_habitat_airlock_workshops_desc:0 "Workshop owners attach modules of their own design to the freight locks. One has fitted an entire foundry behind the doors. Another has barely enough bench space to lay out a clockwork movement. Each workshop still gives the old airlock number as its address."
 pce_habitat_starlight_cabins:0 "Starlight Cabins"
 pce_habitat_starlight_cabins_desc:0 "Servitors reserve the outer hull of each new deck for cabins and run pipes and freight lines along the inner side. Before the residents arrive, drones visit every cabin and shift the bed until the stars are visible from the pillow."
 pce_habitat_galleries_of_the_order:0 "Galleries of the Order"
 pce_habitat_galleries_of_the_order_desc:0 "Squires extend covered galleries from the Order’s Hall to new cells and armouries. On the inner plating of each passage they engrave the names of the knights who stood the first watch there."
 pce_ringworld_cities_above_the_main_line:0 "Cities Above the Main Line"
 pce_ringworld_cities_above_the_main_line_desc:0 "Long-distance trains follow the curve of the ring. Builders span the tracks with broad vaults, and whole neighbourhoods rise above them. Where passengers once stepped out onto a lonely platform, stairs now lead straight from the train to a city square."
 pce_ringworld_nests_in_the_ring_frame:0 "Nests in the Ring Frame"
 pce_ringworld_nests_in_the_ring_frame_desc:0 "Between the ribs of the ring, the hive grows sleeping chambers in tiers. A trough of warm nutrient broth runs the length of each tier. Sated after their shift, the drones settle beneath the vaults, where they can hear the whole nest breathing through the walls."
 pce_ringworld_maintenance_tiers:0 "Maintenance Tiers"
 pce_ringworld_maintenance_tiers_desc:0 "Assembly units suspend rows of repair cradles beneath the tracks that bring drones back from their shifts. A lift takes a drone off the line, lowers it into an empty cradle and brings a serviced unit back up. Traffic keeps its pace along the entire arc."
 pce_ringworld_settlements_on_the_outer_rim:0 "Settlements on the Outer Rim"
 pce_ringworld_settlements_on_the_outer_rim_desc:0 "A power bus and a freight rail run along the outer skin of the ring. At each stop, machines assemble homes of their own design. A strip of steel runs past their front doors for those who like to walk home on magnetic soles."
 pce_ringworld_garden_quays:0 "Garden Quays"
 pce_ringworld_garden_quays_desc:0 "Servitors raise broad terraces above the inhabited belt of the ring. They lay out houses and gardens on each and carry a river along the terraces on an aqueduct. From the quays, the future residents will see treetops on the tier below and the distant arc of the ring overhead."
 pce_synaptic_lathe_pod_galleries:0 "Pod Galleries"
 pce_synaptic_lathe_pod_galleries_desc:0 "A new tier rises above the Lathe’s working halls. Rows of pods line the aisle, and coolant murmurs beneath the floor. At the head of each pod, a small display glows with the network address of its future occupant."
 pce_arkship_streets_between_decks:0 "Streets Between Decks"
 pce_arkship_streets_between_decks_desc:0 "Shipwrights lay an extra deck across the tall bays of the hull. Cabin doors open onto a common gallery and shops spring up at the foot of the companionway. The ship’s register still gives the new street a number. Its residents already have a name for it."
 pce_arkship_brood_nests_under_way:0 "Brood Nests Under Way"
 pce_arkship_brood_nests_under_way_desc:0 "Drones sling new brood chambers between the ribs of the hull on springy fibres. The chambers sway gently when the arkship changes course. The drones feel each fibre to check its tension before returning to the brood."
 pce_arkship_rotary_racks:0 "Rotary Racks"
 pce_arkship_rotary_racks_desc:0 "Deep in the hull, assembly drones fit tiers of racks around a common shaft. At the end of its watch a drone locks into an empty berth. The rack turns, bringing its relief to the very same companionway."
 pce_arkship_custom_built_cabins:0 "Custom-Built Cabins"
 pce_arkship_custom_built_cabins_desc:0 "Machines build cabins to their own designs and slide them along guide rails into the new residential tiers. The power couplings are standard. When two friends decide to live next door, a crane simply moves their homes at the next port of call."
 pce_arkship_family_decks:0 "Family Decks"
 pce_arkship_family_decks_desc:0 "Servitors fit out cabins on the new deck for families who have outgrown their old ones. Before the move, a drone measures the old doorframe. On the new one it carefully copies every pencil mark where the family recorded a child’s height."
 pce_arkship_promenade_decks:0 "Promenade Decks"
 pce_arkship_promenade_decks_desc:0 "A new promenade follows the curve of the liner’s hull, with cabins and an observation lounge. A service corridor runs beneath the floor. While the guests admire an unfamiliar star, the crew delivers luggage to the doors of those who came aboard at the last stop."
 pce_arkship_cabins_with_a_private_dawn:0 "Cabins with a Private Dawn"
 pce_arkship_cabins_with_a_private_dawn_desc:0 "Servitors add another tier of cabins along the observation gallery. Each has its own lighting and climate. While the bridge keeps the night watch, dawn is already breaking in one cabin. Next door, a passenger sleeps on to the soft sound of rain."
 pce_arkship_pilgrims_courts:0 "Pilgrims’ Courts"
 pce_arkship_pilgrims_courts_desc:0 "The new tier is divided into courts with cells around common refectories. Beside each companionway the pilgrims set a stone from a shrine they have visited into the bulkhead. On the way to table the elders trace the arkship’s journey for the newcomers."
 pce_arkship_galleries_of_the_order:0 "$pce_habitat_galleries_of_the_order$"
 pce_arkship_galleries_of_the_order_desc:0 "$pce_habitat_galleries_of_the_order_desc$"
 pce_resort_terraces:0 "Resort Terraces"
 pce_resort_terraces_desc:0 "Guest pavilions rise in tiers around the square. Each roof serves as a promenade for the tier above. Towards evening, guests draw their chairs up to the rail to watch the lights come on for the performance in the square below."
 pce_resort_spectrum_galleries:0 "Spectrum Galleries"
 pce_resort_spectrum_galleries_desc:0 "Tiers of viewing galleries rise above the resort pavilions. On one level the optics reveal the heat patterns of the landscape. On another they show the sky in ultraviolet. Towards evening, guests make their way from floor to floor, debating which part of the spectrum best suits tonight’s sunset."
 pce_penal_tiered_prison_yards:0 "Tiered Prison Yards"
 pce_penal_tiered_prison_yards_desc:0 "Several new storeys rise above the old cell blocks. Each tier has an exercise yard on the roof of the neighbouring wing. In the cells below, prisoners tell the time by the footsteps overhead."
 pce_penal_subterranean_cell_blocks:0 "Subterranean Cell Blocks"
 pce_penal_subterranean_cell_blocks_desc:0 "Beneath the working prison, tunnelling machines cut new halls out of the bedrock. Assembly units follow, fitting rows of cells with lighting and ventilation. By the time the lift brings down the first prisoners, the drills are already at work one floor below."
 pce_thrall_barrack_tiers:0 "Barrack Tiers"
 pce_thrall_barrack_tiers_desc:0 "The barracks rise storey by storey. Doors open onto shared galleries linked by flights of outside stairs. When the shift begins, an overseer is already waiting on each landing with the gang roster."
 pce_thrall_numbered_barracks:0 "Numbered Barracks"
 pce_thrall_numbered_barracks_desc:0 "A crane sets a new dormitory block on top of the barracks. While welding units fasten it to the tier below, the mechanical overseer assigns bunks by work shift. The first gang arrives to find the bunks already marked with the numbers on their passes."
