 pce_remove_9:0 "-9"
 pce_add_10:0 "+10"
 pce_remove_10:0 "-10"
 pce_multilayered_cities:0 "Многоярусные города"
 pce_multilayered_cities_desc:0 "Над крышами обжитых кварталов вырастают новые ярусы со своими улицами и площадями. Вдоль эстакад строят дома и мастерские, а подъёмники связывают их с кварталами внизу."
 pce_tiered_nests:0 "Ярусные гнёзда"
 pce_tiered_nests_desc:0 "Над сводами гнезда трутни возводят новый ярус из кладовых и выводковых камер. Широкие ходы связывают его с сердцевиной улья. По ним наверх уже несут корм для первого расплода."
 pce_modular_quarters:0 "Модульные кварталы"
 pce_modular_quarters_desc:0 "Жители надстраивают над своими мастерскими модули для подзарядки, ремонта и хранения сменных корпусов. Стандартные крепления позволяют соседям соединять постройки переходами. Так над кварталом постепенно складывается ещё один."
 pce_distributed_nodes:0 "Распределённые узлы"
 pce_distributed_nodes_desc:0 "Вокруг координационных узлов дроны монтируют новые этажи со сборочными линиями и ремонтными постами. Как только очередной этаж подключён к сети, машинный разум направляет туда детали и распределяет дронов по рабочим местам."
 pce_biosphere_layers:0 "Ярусы биосферы"
 pce_biosphere_layers_desc:0 "В кронах зрелых рощ переплетаются ветви и постепенно накапливается почва. Высоко над землёй пускают корни новые сады. Симбионты заселяют их по живым мостам, а разросшаяся корневая сеть питает оба яруса."
 pce_volcanic_multilayered_cities:0 "$pce_multilayered_cities$"
 pce_volcanic_multilayered_cities_desc:0 "По обе стороны лавового русла дома поднимаются уступами. Над крышами строители перебрасывают широкие мосты. Со временем мосты превращаются в улицы и объединяют кварталы на обоих склонах в сложный архитектурно-инженерный ансамбль."
 pce_volcanic_tiered_nests:0 "$pce_tiered_nests$"
 pce_volcanic_tiered_nests_desc:0 "Разведочные трутни находят над гнездом новый ряд лавовых трубок. За ними идут строители. Они укрепляют своды, выстилают тёплые ниши для расплода и прокладывают ходы к камерам нижнего яруса."
 pce_volcanic_modular_quarters:0 "$pce_modular_quarters$"
 pce_volcanic_modular_quarters_desc:0 "На верхних площадках мастерских владельцы собирают новые жилые модули. Соседи соединяют модули переходами и сообща прокладывают силовой кабель от ближайшей геотермальной станции. Вскоре у нового яруса появляются собственные мастерские."
 pce_volcanic_distributed_nodes:0 "$pce_distributed_nodes$"
 pce_volcanic_distributed_nodes_desc:0 "Над геотермальными скважинами дроны возводят этажи сборочных цехов. Каждый ярус подключается к общей энергосети. Пока на одном этаже идёт сборка, по соседней шахте уже поднимают секции перекрытий для следующего."
 pce_ecumenopolis_upper_city:0 "Верхний город"
 pce_ecumenopolis_upper_city_desc:0 "Крыши старых аркологий становятся основанием для новых кварталов. Между вершинами башен прокладывают линии скоростных поездов. Вокруг станций строят дома, открывают лавки и разбивают скверы высоко над улицами прежнего города."
 pce_ecumenopolis_modular_arcologies:0 "Модульные аркологии"
 pce_ecumenopolis_modular_arcologies_desc:0 "На верхних этажах аркологий каждая машина обустраивает мастерскую под собственный корпус. За одной дверью хватает места для тяжёлого манипулятора, за другой хозяин под увеличительной оптикой собирает тончайшие детали. Мастерские целого яруса выходят в общую грузовую галерею."
 pce_ecumenopolis_nest_towers:0 "Башни-гнёзда"
 pce_ecumenopolis_nest_towers_desc:0 "Над крышами аркологий трутни наращивают своды выводковых камер. В старых лифтовых шахтах они прокладывают спиральные ходы, по которым из глубины башен переносят расплод в новые гнёзда."
 pce_ecumenopolis_assembly_towers:0 "Сборочные башни"
 pce_ecumenopolis_assembly_towers_desc:0 "Дроны крепят к несущим колоннам аркологий новые этажи сборочных цехов. По мере сборки корпус поднимается от одного яруса к другому. С верхнего конвейера готовая машина сходит прямо на транспортную платформу."
 pce_ecumenopolis_garden_arcologies:0 "Садовые аркологии"
 pce_ecumenopolis_garden_arcologies_desc:0 "На крышах башен служители разбивают сады и строят дома для своих подопечных. Под прогулочными террасами проходит целый служебный ярус. По его галереям дроны ещё до рассвета развозят к домам всё, что жители заказали на утро."
 pce_hive_world_deep_hive_cells:0 "Глубинные соты"
 pce_hive_world_deep_hive_cells_desc:0 "Под обжитыми гнёздами медленно расходятся слои живой ткани. Пока стенки ещё мягкие, трутни расширяют полости и соединяют соседние камеры ходами. Когда своды твердеют, в их толще уже пульсируют сосуды, питающие целый ярус."
 pce_hive_world_reclaimed_galleries:0 "Обжитые галереи"
 pce_hive_world_reclaimed_galleries_desc:0 "В глубине старого гнезда сохранились запечатанные камеры. Створки в живых стенах по-прежнему раскрываются от прикосновения трутней. Вдоль открытых проходов прокладывают грузовые пути и постепенно обживают ещё один ярус."
 pce_machine_world_layers_of_the_planetary_machine:0 "Ярусы планетарного механизма"
 pce_machine_world_layers_of_the_planetary_machine_desc:0 "Под грузовой магистралью дроны собирают новый пояс цехов. Подъёмники связывают его с литейными линиями на поверхности. Теперь заготовка спускается на обработку в глубину и возвращается к сборочным стапелям за тысячи километров от первой печи."
 pce_machine_world_quiet_decks:0 "Тихие ярусы"
 pce_machine_world_quiet_decks_desc:0 "Над грузовыми путями служители подвешивают жилые палубы на амортизаторах. Перед сдачей каждой палубы дрон ставит на прикроватный столик стакан воды и ждёт, пока внизу пройдёт тяжёлый состав. Если вода осталась неподвижной, комнаты готовы принять подопечных."
 pce_machine_world_artisans_quarters:0 "Кварталы мастеров"
 pce_machine_world_artisans_quarters_desc:0 "По обеим сторонам грузовой магистрали машины врезают в обшивку планеты ворота собственных мастерских. Одному мастеру нужен высокий пролёт для мостового крана, другой делит ту же высоту на три рабочих этажа. Обе погрузочные площадки выходят к одному пути."
 pce_machine_world_habitation_sections:0 "Обитаемые секции"
 pce_machine_world_habitation_sections_desc:0 "Старые кабельные галереи под поверхностью планеты достаточно широки, чтобы провести по ним пассажирскую линию. Дома занимают верхние площадки соседних машинных залов, а бывшие грузовые платформы служат станциями новых кварталов."
 pce_machine_world_heat_exchanger_nests:0 "Гнёзда у теплообменников"
 pce_machine_world_heat_exchanger_nests_desc:0 "Улей осваивает глубокие шахты, по которым отводится тепло планетарных машин. Вдоль тёплых труб трутни крепят выводковые камеры. Между ярусами оставляют широкие ходы, чтобы переносить расплод туда, где температура лучше подходит для его роста."
 pce_nanite_tiers:0 "Нанитовые ярусы"
 pce_nanite_tiers_desc:0 "У подножия застроенных платформ серебристая поверхность собирается в складки. Из них поднимаются опоры, между которыми наниты постепенно сплетают перекрытия. Вдоль их кромок тянутся первые транспортные линии, и над прежней застройкой вырастает новый ярус."
 pce_habitat_modular_quarters:0 "$pce_modular_quarters$"
 pce_habitat_modular_quarters_desc:0 "К корпусу станции один за другим пристыковывают новые модули. В одном уже обживаются первые семьи, из другого по утрам пахнет свежим хлебом, а за следующей переборкой монтажники ещё тянут кабели. Коридор, который прежде заканчивался шлюзом, становится главной улицей нового квартала."
 pce_habitat_brood_compartments:0 "Выводковые отсеки"
 pce_habitat_brood_compartments_desc:0 "Трутни наращивают вокруг тёплых труб выводковые камеры, оставляя между кладками узкие ходы. Когда приходит пора переносить расплод, весь новый ярус наполняется ровным шорохом. Его слышно даже по ту сторону переборки."
 pce_habitat_rack_mounted_decks:0 "Кассетные палубы"
 pce_habitat_rack_mounted_decks_desc:0 "Манипуляторы вдвигают готовую палубу в направляющие корпуса. В конце хода замыкаются силовые контакты, и по рельсам на ещё тёмную палубу уже спускается первая смена дронов."
 pce_habitat_airlock_workshops:0 "Мастерские у шлюзов"
 pce_habitat_airlock_workshops_desc:0 "Владельцы мастерских крепят к грузовым шлюзам секции собственной сборки. У одного за воротами уместился целый литейный цех, у другого едва хватает места разложить на верстаке часовой механизм. В адресе каждой мастерской до сих пор значится номер старого шлюза."
 pce_habitat_starlight_cabins:0 "Палубы с видом на звёзды"
 pce_habitat_starlight_cabins_desc:0 "Служители отводят внешний борт нового яруса под жилые каюты, а трубы и грузовые пути проводят с внутренней стороны. Перед заселением дроны обходят каюты и в каждой придвигают кровать так, чтобы с подушки были видны звёзды."
 pce_habitat_galleries_of_the_order:0 "Галереи ордена"
 pce_habitat_galleries_of_the_order_desc:0 "Оруженосцы протягивают от зала ордена крытые галереи к новым кельям и оружейным. На внутренней обшивке каждого перехода они выбивают имена рыцарей, чья вахта в этих стенах была первой."
 pce_ringworld_cities_above_the_main_line:0 "Города над магистралью"
 pce_ringworld_cities_above_the_main_line_desc:0 "Вдоль дуги кольца ходят поезда дальнего следования. Над путями строители возводят широкие своды, на которых вырастают целые кварталы. Там, где пассажиры прежде выходили к одинокой платформе, лестницы с перрона теперь ведут прямо на городскую площадь."
 pce_ringworld_nests_in_the_ring_frame:0 "Гнёзда в каркасе кольца"
 pce_ringworld_nests_in_the_ring_frame_desc:0 "Между рёбрами кольца улей выращивает один над другим своды спальных камер. Вдоль каждого яруса тянется желоб с тёплой питательной смесью. Насытившись после смены, трутни забираются под своды, где сквозь стенки слышно дыхание всего гнезда."
 pce_ringworld_maintenance_tiers:0 "Ярусы обслуживания"
 pce_ringworld_maintenance_tiers_desc:0 "Под путями, по которым дроны возвращаются со смены, монтажные автоматы подвешивают ряды ремонтных стендов. Подъёмник снимает дрона с линии, опускает на свободный стенд и подаёт наверх уже обслуженную машину. На всём протяжении дуги поток идёт с прежней скоростью."
 pce_ringworld_settlements_on_the_outer_rim:0 "Посёлки на внешнем ободе"
 pce_ringworld_settlements_on_the_outer_rim_desc:0 "Вдоль внешней обшивки кольца прокладывают силовую шину и грузовой рельс. У остановок машины собирают себе дома по собственным чертежам. Вдоль фасадов оставляют стальную дорожку для тех, кто любит возвращаться домой на магнитных подошвах."
 pce_ringworld_garden_quays:0 "Садовые набережные"
 pce_ringworld_garden_quays_desc:0 "Служители поднимают над жилой полосой кольца широкие террасы. На каждой они устраивают дома с садами, а вдоль террас пускают реку по акведуку. С набережной будущим жильцам будут видны кроны деревьев ярусом ниже и далёкая дуга кольца над ними."
 pce_synaptic_lathe_pod_galleries:0 "Капсульные ярусы"
 pce_synaptic_lathe_pod_galleries_desc:0 "Над действующими залами станка собирают новый ярус. Вдоль прохода тянутся ряды капсул, под настилом тихо шумит хладагент. У изголовья каждой капсулы горит табличка с сетевым адресом её будущего обитателя."
 pce_arkship_streets_between_decks:0 "Межпалубные улицы"
 pce_arkship_streets_between_decks_desc:0 "В высоких пролётах корпуса корабелы настилают ещё одну палубу. Двери кают выходят в общую галерею, у трапа открываются лавки. В корабельном реестре у новой улицы пока только номер, а у жителей уже есть для неё имя."
 pce_arkship_brood_nests_under_way:0 "Походные гнёзда"
 pce_arkship_brood_nests_under_way_desc:0 "В промежутках между рёбрами корпуса трутни подвешивают на упругих волокнах новые выводковые камеры. Когда ковчег меняет курс, камеры плавно покачиваются. Трутни на ощупь проверяют натяжение волокон и возвращаются к расплоду."
 pce_arkship_rotary_racks:0 "Поворотные стеллажи"
 pce_arkship_rotary_racks_desc:0 "В глубине корпуса сборочные дроны монтируют стеллажи в несколько ярусов вокруг общего вала. Закончив вахту, дрон закрепляется в свободной ячейке. Стеллаж поворачивается, и к тому же трапу выходит машина, готовая его сменить."
 pce_arkship_custom_built_cabins:0 "Каюты собственной сборки"
 pce_arkship_custom_built_cabins_desc:0 "Машины собирают каюты по своим чертежам и вдвигают их по направляющим в новые жилые ярусы. Силовые разъёмы у всех одинаковые. Когда двое друзей решают поселиться рядом, на ближайшей стоянке кран просто переставляет их дома."
 pce_arkship_family_decks:0 "Семейные палубы"
 pce_arkship_family_decks_desc:0 "На новой палубе служители обустраивают каюты для семей, которым стало тесно в прежних. Перед переездом дрон снимает со старого дверного косяка мерки. На новом косяке он бережно воспроизводит все чёрточки, которыми семья отмечала рост детей."
 pce_arkship_promenade_decks:0 "Прогулочные палубы"
 pce_arkship_promenade_decks_desc:0 "Вдоль борта лайнера надстраивают прогулочную палубу с каютами и обзорным салоном. Под настилом проходит служебный коридор. Пока гости любуются новой звездой, экипаж успевает доставить к дверям багаж тех, кто поднялся на борт на последней стоянке."
 pce_arkship_cabins_with_a_private_dawn:0 "Каюты с личным рассветом"
 pce_arkship_cabins_with_a_private_dawn_desc:0 "Вдоль обзорной галереи служители надстраивают ещё один ярус кают. У каждой своё освещение и свой климат. Пока на мостике идёт ночная вахта, в одной каюте уже светает. За соседней дверью пассажир ещё спит под тихий шум дождя."
 pce_arkship_pilgrims_courts:0 "Паломнические подворья"
 pce_arkship_pilgrims_courts_desc:0 "Новый ярус делят на подворья с кельями вокруг общих трапезных. У каждого трапа паломники вделывают в переборку камень из посещённого святилища. По дороге к столу старшие показывают новичкам, каким путём сюда пришёл ковчег."
 pce_arkship_galleries_of_the_order:0 "$pce_habitat_galleries_of_the_order$"
 pce_arkship_galleries_of_the_order_desc:0 "$pce_habitat_galleries_of_the_order_desc$"
 pce_resort_terraces:0 "Курортные террасы"
 pce_resort_terraces_desc:0 "Вокруг площади уступами поднимаются гостевые павильоны. Крыша каждого служит прогулочной террасой для яруса выше. К вечеру отдыхающие придвигают кресла к перилам, откуда видно, как на площади внизу зажигают огни перед представлением."
 pce_resort_spectrum_galleries:0 "Спектральные галереи"
 pce_resort_spectrum_galleries_desc:0 "Над курортными павильонами строят ярусы смотровых галерей. На одном оптика открывает глазу тепловой рисунок ландшафта, на другом позволяет увидеть небо в ультрафиолете. К вечеру гости переходят с этажа на этаж и спорят, в каком спектре сегодняшний закат красивее."
 pce_penal_tiered_prison_yards:0 "Ярусные тюремные дворы"
 pce_penal_tiered_prison_yards_desc:0 "Старые тюремные корпуса вырастают на несколько этажей. У каждого яруса свой прогулочный двор на крыше соседнего крыла. В камерах внизу время узнают по шагам над головой."
 pce_penal_subterranean_cell_blocks:0 "Подземные изоляторы"
 pce_penal_subterranean_cell_blocks_desc:0 "Под действующей тюрьмой проходческие машины вырубают в породе новые залы. Следом монтажные автоматы собирают ряды камер и подводят к ним свет и воздух. Когда лифт привозит первых заключённых, буры уже работают этажом ниже."
 pce_thrall_barrack_tiers:0 "Барачные ярусы"
 pce_thrall_barrack_tiers_desc:0 "Бараки надстраивают этаж за этажом. Двери жилых ярусов выходят на общие галереи, связанные наружными лестницами. К началу смены на каждой площадке уже стоит надсмотрщик со списком бригады."
 pce_thrall_numbered_barracks:0 "Номерные бараки"
 pce_thrall_numbered_barracks_desc:0 "Подъёмный кран ставит над бараком новый жилой блок. Пока сварочные автоматы крепят его к нижнему ярусу, механический надсмотрщик распределяет спальные места по рабочим сменам. Первой бригаде остаётся найти койки с номерами своих пропусков."
