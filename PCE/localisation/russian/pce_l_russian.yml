l_russian:
 pce_mod_name:0 "Planetary Capacity Extender"
 decision_pce_extend_planetary_capacity:0 "Планирование инфраструктуры колонии"
 decision_pce_extend_planetary_capacity_desc:0 "Открыть генеральный план колонии и изменить прибавку к лимиту районов.\n$pce_capacity_delay$"
 pce_capacity_delay:0 "Индекс меняется сразу. Новый лимит районов вступает в силу в течение нескольких игровых дней."
 pce_open_planner_tt:0 "Откроется центр планирования инфраструктуры выбранной колонии."
 pce_menu_title:0 "Центр планирования инфраструктуры"
 pce_main_desc:0 "[Root.pce_welcome]\n$pce_capacity_delay$"
 pce_open_add:0 "[Root.pce_increase]"
 pce_open_remove:0 "[Root.pce_decrease]"
