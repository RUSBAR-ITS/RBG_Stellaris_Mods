 pce_remove_desc:0 "$pce_main_desc$\n\nВыберите, на сколько уменьшить индекс.[Root.pce_district_context]"
 pce_remove_all:0 "Снять всё"
 pce_add_tt:0 "Прибавка к лимиту районов увеличится с [Root.pce_display_index] до [Root.$RESULT$]."
 pce_remove_tt:0 "Прибавка к лимиту районов уменьшится с [Root.pce_display_index] до [Root.$RESULT$]."
 pce_context_district_craglands:0 "\nРайон колонии: $district_craglands$"
 pce_context_district_ark_city:0 "\nРайон колонии: $district_ark_city$"
 pce_planet_welcome:0 "Добро пожаловать в центр планирования планетарной инфраструктуры.\nГенеральный план колонии открыт для корректировки.\n\nТекущий индекс планетарной вместимости: [Root.pce_display_index]"
 pce_planet_increase:0 "Увеличить индекс планетарной вместимости"
 pce_planet_decrease:0 "Уменьшить индекс планетарной вместимости"
 pce_ark_welcome:0 "Добро пожаловать в центр планирования инфраструктуры ковчега.\nНа экране развёрнут план палуб.\n\nТекущий индекс вместимости ковчега: [Root.pce_display_index]"
 pce_ark_increase:0 "Увеличить индекс вместимости ковчега"
 pce_ark_decrease:0 "Уменьшить индекс вместимости ковчега"
