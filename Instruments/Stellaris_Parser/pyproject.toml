[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stellaris-parser"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["stellaris-document-package==1.0.0", "jsonschema==4.26.0"]

[project.scripts]
stellaris-parser = "stellaris_parser.__main__:main"

[tool.setuptools.packages.find]
include = ["stellaris_parser*"]
namespaces = false

[tool.setuptools.package-data]
stellaris_parser = ["config/*.json", "schemas/*.json"]
