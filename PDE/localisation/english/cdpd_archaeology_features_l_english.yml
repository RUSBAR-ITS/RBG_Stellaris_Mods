 cdpd_archaeology_add_d_mutation_vats: "Add: $d_mutation_vats$"
 cdpd_archaeology_tt_d_mutation_vats: "§H$d_mutation_vats$§!\n\n$d_mutation_vats_desc$\n\n§HSource:§!\narchaeological site “$mutation_vats$”, event “$ancrel.2047.name$”.\n\n§HType:§! archaeology planetary feature.\n\n§HEffects:§!\n• Produces £society£ Society Research\n• Produces £exotic_gases£ Exotic Gases\n\n§HCharacteristics:§!\n• Planetary feature.\n• Produces: £society£ $society_research$ §G+12§!, £exotic_gases£ $exotic_gases$ §G+1§!"
 cdpd_archaeology_add_d_sentinels: "Add: $d_sentinels$"
 cdpd_archaeology_tt_d_sentinels: "§H$d_sentinels$§!\n\n$d_sentinels_desc$\n\n§HSource:§!\narchaeological chain “$ancrel.4051.name$” / “$sentinels_digsite$”.\n\n§HType:§! archaeology planetary feature.\n\n§HEffects:§!\n• Adds the Sentinels as the peaceful outcome of the archaeological chain\n• The Sentinels defend the planet during invasions\n\n§HCharacteristics:§!\n• Planetary feature.\n• District limit: §R-1§!\n• Unity from jobs: §G+10%§!"
 cdpd_archaeology_add_d_sentinels_metal: "Add: $d_sentinels_metal$"
 cdpd_archaeology_tt_d_sentinels_metal: "§H$d_sentinels_metal$§!\n\n$d_sentinels_metal_desc$\n\n§HSource:§!\narchaeological chain “$sentinels_digsite$”, result of defeating the Sentinels or liberating the planet.\n\n§HType:§! archaeology planetary feature.\n\n§HEffects:§!\n• Produces £sr_living_metal£ Living Metal\n• Represents the metallic remains of the Sentinels\n\n§HCharacteristics:§!\n• Planetary feature.\n• Produces: £sr_living_metal£ $sr_living_metal$ §G+2§!"
 cdpd_archaeology_add_d_alloys_25: "Add: $d_alloys_25$"
 cdpd_archaeology_tt_d_alloys_25: "§H$d_alloys_25$§!\n\n$d_alloys_25_desc$\n\n§HSource:§!\narchaeological site “$ancrel.12090.name$”.\n\n§HType:§! archaeology orbital deposit for small orbital bodies: junk moons, asteroids, and moons.\n\n§HEffects:§!\n• Adds an £alloys£ Alloy orbital deposit for a mining station\n• If an orbital settlement already exists in the system, adds the corresponding $d_hab_alloy_25$ service feature to it\n\n§HCharacteristics:§!\n• Orbital deposit for a mining station.\n• Produces: £alloys£ $alloys$ §G+25§!\n• Orbital deposit for small orbital bodies; syncs $d_hab_alloy_25$ if a habitat link is present."
