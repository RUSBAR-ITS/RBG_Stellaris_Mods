 cdpd_event_chain_tt_d_ancient_bombardment_craters: "§H$d_ancient_bombardment_craters$§!\n\n$d_ancient_bombardment_craters_desc$\n\n§HИсточник:§!\nколониальные события: древние следы и кратеры.\n\n§HТип:§! планетарная особенность событийной цепочки.\n\n§HХарактеристики:§!\n• Планетарная особенность.\n• $mod_planet_jobs_physics_research_produces_mult$: §G+20%§!\n• Условно: $mod_job_physicist_add$: §G+200§!\n• Условно: $mod_job_calculator_physicist_add$: §G+200§!\n\n§HОбщее предупреждение:§!\nCDPD добавляет только выбранную особенность напрямую. Это не запускает соответствующее событие, ситуацию или развитие происхождения оригинальной игры."
 cdpd_event_chain_add_d_ancient_battlefield: "Добавить: $d_ancient_battlefield$"
 cdpd_event_chain_tt_d_ancient_battlefield: "§H$d_ancient_battlefield$§!\n\n$d_ancient_battlefield_desc$\n\n§HИсточник:§!\nколониальные события: древние следы и кратеры.\n\n§HТип:§! планетарная особенность событийной цепочки.\n\n§HХарактеристики:§!\n• Планетарная особенность.\n• $mod_planet_jobs_engineering_research_produces_mult$: §G+20%§!\n• Условно: $mod_job_engineer_add$: §G+200§!\n• Условно: $mod_job_calculator_engineer_add$: §G+200§!\n\n§HОбщее предупреждение:§!\nCDPD добавляет только выбранную особенность напрямую. Это не запускает соответствующее событие, ситуацию или развитие происхождения оригинальной игры."
 cdpd_event_chain_add_d_ancient_particle_accelerator: "Добавить: $d_ancient_particle_accelerator$"
 cdpd_event_chain_tt_d_ancient_particle_accelerator: "§H$d_ancient_particle_accelerator$§!\n\n$d_ancient_particle_accelerator_desc$\n\n§HИсточник:§!\nколониальные события: древние следы и кратеры.\n\n§HТип:§! планетарная особенность событийной цепочки.\n\n§HХарактеристики:§!\n• Планетарная особенность.\n• $mod_planet_jobs_physics_research_produces_mult$: §G+20%§!\n• Условно: $mod_job_physicist_add$: §G+200§!\n• Условно: $mod_job_calculator_physicist_add$: §G+200§!\n\n§HОбщее предупреждение:§!\nCDPD добавляет только выбранную особенность напрямую. Это не запускает соответствующее событие, ситуацию или развитие происхождения оригинальной игры."
 cdpd_event_chain_add_d_impact_crater: "Добавить: $d_impact_crater$"
 cdpd_event_chain_tt_d_impact_crater: "§H$d_impact_crater$§!\n\n$d_impact_crater_desc$\n\n§HИсточник:§!\nколониальные события: древние следы и кратеры.\n\n§HТип:§! планетарная особенность событийной цепочки.\n\n§HХарактеристики:§!\n• Планетарная особенность.\n• $mod_district_mining_max_add$: §G+3§!\n\n§HОбщее предупреждение:§!\nCDPD добавляет только выбранную особенность напрямую. Это не запускает соответствующее событие, ситуацию или развитие происхождения оригинальной игры.\n\n§HВажное предупреждение:§!\n• $d_crater$ и $d_impact_crater$ имеют похожие названия, но это разные ID и разные типы: $d_crater$ — блокер, $d_impact_crater$ — обычная особенность."
 cdpd_event_chain_add_d_crater: "Добавить: $d_crater$"
 cdpd_event_chain_tt_d_crater: "§H$d_crater$§!\n\n$d_crater_desc$\n\n§HИсточник:§!\nколониальные события: древние следы и кратеры.\n\n§HТип:§! планетарный блокер событийной цепочки.\n\n§HХарактеристики:§!\n• Планетарный блокер.\n• $MOD_PLANET_MAX_DISTRICTS_ADD$: §R-1§!\n• Стоимость расчистки: £energy£ $energy$ §G+300§!\n• Время расчистки: §Y100§!\n\n§HОбщее предупреждение:§!\nCDPD добавляет только выбранную особенность напрямую. Это не запускает соответствующее событие, ситуацию или развитие происхождения оригинальной игры.\n\n§HВажное предупреждение:§!\n• $d_crater$ и $d_impact_crater$ имеют похожие названия, но это разные ID и разные типы: $d_crater$ — блокер, $d_impact_crater$ — обычная особенность."
 cdpd_event_chain_add_d_underground_contact_zone: "Добавить: $d_underground_contact_zone$"
 cdpd_event_chain_tt_d_underground_contact_zone: "§H$d_underground_contact_zone$§!\n\n$d_underground_contact_zone_desc$\n\n§HИсточник:§!\nцепочка подземной цивилизации.\n\n§HТип:§! планетарная особенность событийной цепочки.\n\n§HХарактеристики:§!\n• Планетарная особенность.\n• $MOD_PLANET_MAX_DISTRICTS_ADD$: §G+2§!\n• Условно: $mod_job_trader_add$: §G+200§!\n• Условно: $mod_job_logistics_drone_add$: §G+200§!\n• $trader_is_subterranean_tt$\n\n§HОбщее предупреждение:§!\nCDPD добавляет только выбранную особенность напрямую. Это не запускает соответствующее событие, ситуацию или развитие происхождения оригинальной игры."
