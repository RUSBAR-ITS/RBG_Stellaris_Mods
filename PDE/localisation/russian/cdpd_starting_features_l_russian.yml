 cdpd_starting_tt_d_tomb_world_ruins: "§H$d_tomb_world_ruins$§!\n\n$d_tomb_world_ruins_desc$\n\n§HИсточник:§!\nпроисхождение $origin_post_apocalyptic$ / стартовая настройка постапокалиптического родного мира.\n\n§HТип:§! стартовый планетарный блокер.\n\n§HЭффекты:§!\n• Добавляет блокер, используемый стартовой настройкой\n• При нормальной расчистке могут сработать эффекты расчистки, если они заданы у этого блокера\n\n§HХарактеристики:§!\n• Планетарный блокер.\n• Лимит районов: §R-1§!\n• Стоимость расчистки: £energy£ $energy$ 300\n• Время расчистки: 120\n• При нормальной расчистке запускает дополнительный эффект."
