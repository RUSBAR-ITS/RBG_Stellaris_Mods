 cdpd_archaeology_add_d_mutation_vats: "Добавить: $d_mutation_vats$"
 cdpd_archaeology_tt_d_mutation_vats: "§H$d_mutation_vats$§!\n\n$d_mutation_vats_desc$\n\n§HИсточник:§!\nархеологический раскоп «$mutation_vats$», событие «$ancrel.2047.name$».\n\n§HТип:§! планетарная особенность археологии.\n\n§HЭффекты:§!\n• Производит £society£ социологические исследования\n• Производит £exotic_gases£ экзотические газы\n\n§HХарактеристики:§!\n• Планетарная особенность.\n• Производит: £society£ $society_research$ §G+12§!, £exotic_gases£ $exotic_gases$ §G+1§!"
 cdpd_archaeology_add_d_sentinels: "Добавить: $d_sentinels$"
 cdpd_archaeology_tt_d_sentinels: "§H$d_sentinels$§!\n\n$d_sentinels_desc$\n\n§HИсточник:§!\nархеологическая цепочка «$ancrel.4051.name$» / «$sentinels_digsite$».\n\n§HТип:§! планетарная особенность археологии.\n\n§HЭффекты:§!\n• Добавляет Стражей как итог мирного разрешения археологической цепочки\n• Стражи выступают защитниками планеты при вторжении\n\n§HХарактеристики:§!\n• Планетарная особенность.\n• Лимит районов: §R-1§!\n• Единство от рабочих мест: §G+10%§!"
 cdpd_archaeology_add_d_sentinels_metal: "Добавить: $d_sentinels_metal$"
 cdpd_archaeology_tt_d_sentinels_metal: "§H$d_sentinels_metal$§!\n\n$d_sentinels_metal_desc$\n\n§HИсточник:§!\nархеологическая цепочка «$sentinels_digsite$», результат победы над Стражами или освобождения планеты.\n\n§HТип:§! планетарная особенность археологии.\n\n§HЭффекты:§!\n• Производит £sr_living_metal£ живой металл\n• Представляет металлические останки Стражей\n\n§HХарактеристики:§!\n• Планетарная особенность.\n• Производит: £sr_living_metal£ $sr_living_metal$ §G+2§!"
 cdpd_archaeology_add_d_alloys_25: "Добавить: $d_alloys_25$"
 cdpd_archaeology_tt_d_alloys_25: "§H$d_alloys_25$§!\n\n$d_alloys_25_desc$\n\n§HИсточник:§!\nархеологический раскоп «$ancrel.12090.name$».\n\n§HТип:§! орбитальная залежь археологии для малых орбитальных тел: мусорных лун, астероидов и лун.\n\n§HЭффекты:§!\n• Добавляет орбитальную залежь £alloys£ сплавов для добывающей станции\n• Если в системе уже есть орбитальное поселение, добавляет на него соответствующую служебную особенность $d_hab_alloy_25$\n\n§HХарактеристики:§!\n• Орбитальная залежь для добывающей станции.\n• Производит: £alloys£ $alloys$ §G+25§!\n• Орбитальная залежь для малых орбитальных тел; при наличии habitat-связи синхронизирует $d_hab_alloy_25$."
