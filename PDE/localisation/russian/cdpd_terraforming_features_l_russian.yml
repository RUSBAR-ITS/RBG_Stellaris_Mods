 cdpd_terraforming_add_d_radiotrophic_preserve: "Добавить: $d_radiotrophic_preserve$"
 cdpd_terraforming_tt_d_radiotrophic_preserve: "§H$d_radiotrophic_preserve$§!\n\n$d_radiotrophic_preserve_desc$\n\n§HИсточник:§!\nсобытие терраформирования «$terra.80.name$».\n\n§HТип:§! планетарная особенность терраформирования.\n\n§HЭффекты:§!\n• Добавляет заповедник радиотрофов\n• Создаёт несапиентные радиотрофные растения по логике события оригинальной игры\n\n§HХарактеристики:§!\n• Планетарная особенность.\n• Социологические исследования от рабочих мест: §G+5%§!\n• Условный эффект — Должности артистов: §G+300§!\n• Условный эффект — Должности биотрофеев: §G+2500§!\n• Условный эффект — Единство от рабочих мест: §G+5%§!\n• Создаёт несапиентные радиотрофные растения по -логике события."
 cdpd_terraforming_add_d_lava_tubes: "Добавить: $d_lava_tubes$"
 cdpd_terraforming_tt_d_lava_tubes: "§H$d_lava_tubes$§!\n\n$d_lava_tubes_desc$\n\n§HИсточник:§!\nсобытие терраформирования «$strange_worlds.1000.name$».\n\n§HТип:§! планетарная особенность терраформирования.\n\n§HЭффекты:§!\n• Добавляет планетарную особенность лавовых трубок\n\n§HХарактеристики:§!\n• Минералы от шахтёров: §G+3§!\n• Содержание шахтёров энергией: §R+$@lava_tubes_mining_job_upkeep$§!\n• Лимит добывающих районов: §G+3§!"
 cdpd_terraforming_add_d_hydroactive_eggs: "Добавить: $d_hydroactive_eggs$"
 cdpd_terraforming_tt_d_hydroactive_eggs: "§H$d_hydroactive_eggs$§!\n\n$d_hydroactive_eggs_desc$\n\n§HИсточник:§!\nсобытие терраформирования «$strange_worlds.1005.name$».\n\n§HТип:§! планетарная особенность терраформирования.\n\n§HЭффекты:§!\n• Добавляет планетарную особенность водолюбивых яиц\n\n§HХарактеристики:§!\n• Пища от рабочих мест: §G+30%§!\n• Социологические исследования от рабочих мест: §G+15%§!"
 cdpd_terraforming_add_d_mountains_of_steel: "Добавить: $d_mountains_of_steel$"
 cdpd_terraforming_tt_d_mountains_of_steel: "§H$d_mountains_of_steel$§!\n\n$d_mountains_of_steel_desc$\n\n§HИсточник:§!\nсобытие терраформирования «$strange_worlds.1015.name$».\n\n§HТип:§! планетарная особенность терраформирования.\n\n§HЭффекты:§!\n• Добавляет планетарную особенность стальных гор\n\n§HХарактеристики:§!\n• Минералы от рабочих мест: §G+15%§!\n• Сплавы от рабочих мест: §G+15%§!\n• Лимит районов: §R-2§!"
 cdpd_terraforming_add_d_explosive_atmosphere: "Добавить: $d_explosive_atmosphere$"
 cdpd_terraforming_tt_d_explosive_atmosphere: "§H$d_explosive_atmosphere$§!\n\n$d_explosive_atmosphere_desc$\n\n§HИсточник:§!\nсобытие терраформирования «$strange_worlds.1020.name$».\n\n§HТип:§! планетарная особенность терраформирования.\n\n§HЭффекты:§!\n• Добавляет взрывоопасную атмосферу\n• Вместе с особенностью добавляет связанную залежь: £volatile_motes£ $volatile_motes$\n• Если в системе уже есть орбитальное поселение, добавляет соответствующую служебную особенность $d_hab_mote_1$\n\n§HХарактеристики:§!\n• Урон от орбитальной бомбардировки: §G+25%§!\n• Лимит генераторных районов: §G+$@DISTRICTS_FROM_SR_DEPOSITS_SMALL$§!\n• Условный эффект — Летучие пылинки от техников: §G+$@SR_SMALL$§!\n• Вместе с особенностью добавляется связанная залежь: £volatile_motes£ $volatile_motes$.\n• Если в системе уже есть орбитальное поселение, синхронизирует $d_hab_mote_1$."
 cdpd_terraforming_add_d_blue_lava: "Добавить: $d_blue_lava$"
 cdpd_terraforming_tt_d_blue_lava: "§H$d_blue_lava$§!\n\n$d_blue_lava_desc$\n\n§HИсточник:§!\nсобытие терраформирования «$strange_worlds.1025.name$».\n\n§HТип:§! планетарная особенность терраформирования.\n\n§HЭффекты:§!\n• Добавляет планетарную особенность синей лавы\n\n§HХарактеристики:§!\n• Пригодность / переносимость среды: §R-10%§!\n• Лимит районов: §R-2§!\n• Производит: £alloys£ $alloys$ §G+5§!, £exotic_gases£ $exotic_gases$ §G+3§!"
 cdpd_terraforming_add_d_crystaline_growths: "Добавить: $d_crystaline_growths$"
 cdpd_terraforming_tt_d_crystaline_growths: "§H$d_crystaline_growths$§!\n\n$d_crystaline_growths_desc$\n\n§HИсточник:§!\nсобытие терраформирования «$strange_worlds.1030.name$».\n\n§HТип:§! планетарная особенность терраформирования.\n\n§HЭффекты:§!\n• Добавляет планетарную особенность кристаллических наростов\n\n§HХарактеристики:§!\n• Лимит добывающих районов: §G+$@DISTRICTS_FROM_SR_DEPOSITS_SMALL$§!\n• Условный эффект — Редкие кристаллы от шахтёров: §G+$@SR_SMALL$§!\n• Производит: £rare_crystals£ $rare_crystals$ §G+2§!"
 cdpd_terraforming_add_d_space_junk_hazards: "Добавить: $d_space_junk_hazards$"
 cdpd_terraforming_tt_d_space_junk_hazards: "§H$d_space_junk_hazards$§!\n\n$d_space_junk_hazards_desc$\n\n§HИсточник:§!\nсобытие терраформирования «$strange_worlds.1050.name$».\n\n§HТип:§! планетарная особенность терраформирования.\n\n§HЭффекты:§!\n• Добавляет планетарную особенность опасного космического мусора\n\n§HХарактеристики:§!\n• Условный эффект — Должности: $job_drone_space_junk_collector$: §G+400§!\n• Условный эффект — Должности: $job_space_junk_collector$: §G+400§!"
 cdpd_terraforming_add_d_terraforming_blocker: "Добавить: $d_terraforming_blocker$"
 cdpd_terraforming_tt_d_terraforming_blocker: "§H$d_terraforming_blocker$§!\n\n$d_terraforming_blocker_desc$\n\n§HИсточник:§!\nсобытие терраформирования «$terra.25.name$».\n\n§HТип:§! планетарный блокер терраформирования.\n\n§HЭффекты:§!\n• Добавляет один экземпляр блокера за один клик\n• В событии оригинальной игры может появляться несколько отдельных экземпляров этого блокера\n\n§HХарактеристики:§!\n• Планетарный блокер.\n• Лимит районов: §R-1§!\n• Стоимость расчистки: £energy£ $energy$ 500\n• Время расчистки: 180\n• добавляет один экземпляр блокера за клик."
