l_russian:
 cdpd_remove_menu: "Удаление"
 cdpd_remove_root_title: "Удаление особенностей и залежей"
 cdpd_remove_root_desc: "Выберите тип удаляемых особенностей или залежей. В меню отображаются только те пункты, которые реально присутствуют на выбранном объекте."
 cdpd_remove_planetary_menu: "Планетарные"
 cdpd_remove_planetary_title: "Удаление планетарных особенностей"
 cdpd_remove_planetary_desc: "Выберите, что нужно удалить с выбранной обитаемой планеты, мира-кольца или орбитального поселения."
 cdpd_remove_planetary_features_menu: "Особенности"
 cdpd_remove_planetary_features_title: "Удаление планетарных особенностей"
 cdpd_remove_planetary_features_desc: "Здесь перечислены самостоятельные планетарные особенности, которые сейчас есть на выбранном объекте. Вычисляемые особенности орбитальных поселений в это меню не включаются."
 cdpd_remove_planetary_blockers_menu: "Блокеры"
 cdpd_remove_planetary_blockers_title: "Удаление блокеров"
 cdpd_remove_planetary_blockers_desc: "Здесь перечислены блокеры, которые сейчас есть на выбранном объекте. Удаление выполняется напрямую и не запускает игровую расчистку."
 cdpd_remove_orbital_menu: "Орбитальные"
 cdpd_remove_orbital_title: "Удаление орбитальных залежей"
 cdpd_remove_orbital_desc: "Выберите раздел орбитальных залежей для выбранного небесного тела."
 cdpd_remove_orbital_features_menu: "Особенности"
 cdpd_remove_orbital_features_title: "Удаление орбитальных залежей"
 cdpd_remove_orbital_features_desc: "Здесь перечислены орбитальные залежи, которые сейчас есть на выбранном небесном теле."
