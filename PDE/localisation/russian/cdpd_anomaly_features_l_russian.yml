 cdpd_anomaly_add_d_hyperfertile_valley: "Добавить: $d_hyperfertile_valley$"
 cdpd_anomaly_tt_d_hyperfertile_valley: "§H$d_hyperfertile_valley$§!\n\n$d_hyperfertile_valley_desc$\n\n§HИсточник:§!\nПоявляется как результат аномалии «Живописное изобилие».\n\n§HТип:§! редкая планетарная особенность.\n\n§HЭффекты:§!\n• Лимит сельскохозяйственных районов: §G+5§!\n\n§HХарактеристики:§!\n• Планетарная особенность.\n• Лимит сельскохозяйственных районов: §G+5§!"
 cdpd_anomaly_add_d_ancient_mining_site: "Добавить: $d_ancient_mining_site$"
 cdpd_anomaly_tt_d_ancient_mining_site: "§H$d_ancient_mining_site$§!\n\n$d_ancient_mining_site_desc$\n\n§HИсточник:§!\nПоявляется как результат аномалий «Фабрика минералов» и «Древние автоматы».\n\n§HТип:§! редкая планетарная особенность.\n\n§HЭффекты:§!\n• Лимит добывающих районов: §G+5§!\n\n§HХарактеристики:§!\n• Планетарная особенность.\n• Лимит добывающих районов: §G+5§!"
 cdpd_anomaly_add_d_toy_factory_complex: "Добавить: $d_toy_factory_complex$"
 cdpd_anomaly_tt_d_toy_factory_complex: "§H$d_toy_factory_complex$§!\n\n$d_toy_factory_complex_desc$\n\n§HИсточник:§!\nПоявляется как результат аномалии «Фабрика игрушек».\n\n§HТип:§! редкая планетарная особенность.\n\n§HЭффекты:§!\n• Инженеры производят дополнительное £society£ социологическое исследование: §G+0.5§!\n• Для обычных империй добавляет рабочие места инженеров\n• Для гештальт-империй добавляет аналогичные инженерные рабочие места\n\n§HХарактеристики:§!\n• Планетарная особенность.\n• Социологические исследования от инженеров: §G+50%§!\n• Условный эффект — Должности инженеров: §G+200§!\n• Условный эффект — Должности вычислителей-инженеров: §G+200§!"
 cdpd_anomaly_add_d_metal_boneyard: "Добавить: $d_metal_boneyard$"
 cdpd_anomaly_tt_d_metal_boneyard: "§H$d_metal_boneyard$§!\n\n$d_metal_boneyard_desc$\n\n§HИсточник:§!\nПоявляется как результат аномалии «Упавшие исполины».\n\n§HТип:§! редкая планетарная особенность.\n\n§HЭффекты:§!\n• Лимит добывающих районов: §G+4§!\n• Производство £society£ социологических исследований от рабочих мест: §G+10%§!\n\n§HХарактеристики:§!\n• Планетарная особенность.\n• Лимит добывающих районов: §G+4§!\n• Социологические исследования от рабочих мест: §G+10%§!"
 cdpd_anomaly_add_d_ancient_one: "Добавить: $d_ancient_one$"
 cdpd_anomaly_tt_d_ancient_one: "§H$d_ancient_one$§!\n\n$d_ancient_one_desc$\n\n§HИсточник:§!\nПоявляется как результат аномалии «Эхо из глубины».\n\n§HТип:§! редкая планетарная особенность.\n\n§HЭффекты:§!\n• Производит £society£ социологические исследования: §G+4§!\n\n§HХарактеристики:§!\n• Планетарная особенность.\n• Производит: £society£ $society_research$ §G+4§!"
 cdpd_anomaly_add_d_hab_lonely_bot_deposit: "Добавить: $d_hab_lonely_bot_deposit$"
 cdpd_anomaly_tt_d_hab_lonely_bot_deposit: "§H$d_hab_lonely_bot_deposit$§!\n\n$d_hab_lonely_bot_deposit_desc$\n\n§HИсточник:§!\nПоявляется как результат аномалии «Загадочный робот».\n\n§HТип:§! редкая планетарная особенность.\n\n§HЭффекты:§!\n• Производит £alloys£ сплавы: §G+5§!\n\n§HХарактеристики:§!\n• Планетарная особенность.\n• Производит: £alloys£ $alloys$ §G+5§!"
 cdpd_anomaly_add_d_nano_corpses: "Добавить: $d_nano_corpses$"
 cdpd_anomaly_tt_d_nano_corpses: "§H$d_nano_corpses$§!\n\n$d_nano_corpses_desc$\n\n§HИсточник:§!\nПоявляется как результат аномалии «От орбитальной бомбардировки не уйдёшь».\n\n§HТип:§! редкая планетарная особенность.\n\n§HЭффекты:§!\n• Лимит добывающих районов: §G+3§!\n• Шахтёры производят дополнительные £alloys£ сплавы: §G+0.25§!\n\n§HХарактеристики:§!\n• Планетарная особенность.\n• Лимит добывающих районов: §G+3§!\n• Сплавы от шахтёров: §G+25%§!"
 cdpd_anomaly_add_d_red_desert: "Добавить: $d_red_desert$"
 cdpd_anomaly_tt_d_red_desert: "§H$d_red_desert$§!\n\n$d_red_desert_desc$\n\n§HИсточник:§!\nПоявляется как результат аномалии «Красная пустыня».\n\n§HТип:§! редкая планетарная особенность.\n\n§HЭффекты:§!\n• Лимит добывающих районов: §G+2§!\n• Производит £minerals£ минералы: §G+2§!\n\n§HХарактеристики:§!\n• Планетарная особенность.\n• Лимит добывающих районов: §G+2§!\n• Производит: £minerals£ $minerals$ §G+2§!"
 cdpd_anomaly_add_d_geocentric_experiment: "Добавить: $d_geocentric_experiment$"
 cdpd_anomaly_tt_d_geocentric_experiment: "§H$d_geocentric_experiment$§!\n\n$d_geocentric_experiment_desc$\n\n§HИсточник:§!\nПоявляется как результат аномалии «Небесная модель».\n\n§HТип:§! редкая планетарная особенность.\n\n§HЭффекты:§!\n• Скорость исследований в категории $field_manipulation$: §G+5%§!\n• Скорость исследований в категории $particles$: §G+5%§!\n• Для обычных империй добавляет рабочие места физиков\n• Для гештальт-империй добавляет аналогичные физические исследовательские рабочие места\n\n§HХарактеристики:§!\n• Планетарная особенность.\n• Скорость исследований категории $field_manipulation$: §G+5%§!\n• Скорость исследований категории $particles$: §G+5%§!\n• Условный эффект — Должности: $job_physicist$: §G+200§!\n• Условный эффект — Должности: $job_calculator_physicist$: §G+200§!"
 cdpd_anomaly_add_d_radioactive_ruins: "Добавить: $d_radioactive_ruins$"
 cdpd_anomaly_tt_d_radioactive_ruins: "§H$d_radioactive_ruins$§!\n\n$d_radioactive_ruins_desc$\n\n§HИсточник:§!\nПоявляется как результат аномалии «Вспышка гамма-излучения».\n\n§HТип:§! планетарный блокер.\n\n§HЭффекты:§!\n• Максимум районов: §R-1§!\n• Стоимость расчистки: £energy£ §Y300§!\n• При нормальной расчистке даёт £society£ социологическое исследование\n\n§HХарактеристики:§!\n• Планетарный блокер.\n• Лимит районов: §R-1§!\n• Стоимость расчистки: £energy£ $energy$ 300\n• Время расчистки: 120\n• При нормальной расчистке запускает дополнительный эффект."
 cdpd_anomaly_add_d_hab_lonely_bot_deposit_2: "Добавить: $d_hab_lonely_bot_deposit_2$"
 cdpd_anomaly_tt_d_hab_lonely_bot_deposit_2: "§H$d_hab_lonely_bot_deposit_2$§!\n\n$d_hab_lonely_bot_deposit_2_desc$\n\n§HИсточник:§!\nаномалия «Загадочный робот»\n\n§HТип:§! планетарная особенность.\n\n§HХарактеристики:§!\n• Планетарная особенность.\n• Производит: £alloys£ $alloys$ §G+5§!\n• Производит: £volatile_motes£ $volatile_motes$ §G+1§!\n• Производит: £exotic_gases£ $exotic_gases$ §G+1§!\n\n§HОбщее предупреждение:§!\nCDPD добавляет только выбранную особенность или блокер напрямую. Связанные события, ситуации, флаги, проекты и цепочки не запускаются автоматически."
 cdpd_anomaly_add_d_hab_lonely_bot_deposit_3: "Добавить: $d_hab_lonely_bot_deposit_3$"
 cdpd_anomaly_tt_d_hab_lonely_bot_deposit_3: "§H$d_hab_lonely_bot_deposit_3$§!\n\n$d_hab_lonely_bot_deposit_3_desc$\n\n§HИсточник:§!\nаномалия «Загадочный робот»\n\n§HТип:§! планетарная особенность.\n\n§HХарактеристики:§!\n• Планетарная особенность.\n• Условно: $mod_job_robot_caretaker_add$: §G+100§!\n• Производит: £alloys£ $alloys$ §G+5§!\n• Производит: £volatile_motes£ $volatile_motes$ §G+1§!\n• Производит: £exotic_gases£ $exotic_gases$ §G+1§!\n\n§HОбщее предупреждение:§!\nCDPD добавляет только выбранную особенность или блокер напрямую. Связанные события, ситуации, флаги, проекты и цепочки не запускаются автоматически."
