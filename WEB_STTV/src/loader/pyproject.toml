[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sttv-loader"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = ["stellaris-document-package==1.0.0", "pymongo==4.19.0"]

[project.optional-dependencies]
images = ["Pillow>=12.2,<13"]

[project.scripts]
sttv-loader = "sttv_loader.__main__:main"

[tool.setuptools]
packages = ["sttv_loader"]
