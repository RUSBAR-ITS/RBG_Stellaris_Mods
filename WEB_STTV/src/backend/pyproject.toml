[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sttv-mongodb"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = ["stellaris-document-package==1.0.0", "pymongo==4.19.0"]

[project.scripts]
sttv-server = "sttv.server.__main__:main"

[tool.setuptools]
packages = ["sttv.mongo", "sttv.server"]
