[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sttv-server"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = ["pymongo==4.19.0"]

[project.scripts]
sttv-server = "sttv_server.__main__:main"

[tool.setuptools]
packages = ["sttv_server", "sttv_server.tree"]
