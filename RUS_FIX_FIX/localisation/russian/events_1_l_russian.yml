 VULTAUM_ARTIFACT_FOUND: "Следы вультаумской цивилизации"
 VULTAUM_ARTIFACT_FOUND_DESC: "Мы узнали, что, возможно, на каком-то прошлом этапе истории галактики на §H[precursor_planet.GetName&prep]§! находились предтечи. Известно, что сфера влияния древнего звёздного сообщества Вультаум распространялась на эту часть космоса, что делает этот мир многообещающим местом для продолжения изучения нами данной цивилизации."
 YUHT_ARTIFACT_FOUND: "Следы юутской цивилизации"
 YUHT_ARTIFACT_FOUND_DESC: "Мы узнали, что, возможно, на каком-то прошлом этапе истории галактики на §H[precursor_planet.GetName&prep]§! находились предтечи. Известно, что сфера влияния древней Юутской империи распространялась на эту часть космоса, что делает этот мир многообещающим местом для продолжения изучения нами данной цивилизации."
 LEAGUE_ARTIFACT_FOUND: "Следы Первой лиги"
 LEAGUE_ARTIFACT_FOUND_DESC: "Мы узнали, что, возможно, на каком-то прошлом этапе истории галактики на §H[precursor_planet.GetName&prep]§! находились предтечи. Известно, что сфера влияния древней Первой лиги распространялась на эту часть космоса, что делает этот мир многообещающим местом для продолжения изучения нами данной цивилизации."
 IRASSIAN_ARTIFACT_FOUND: "Следы ирассианской цивилизации"
 IRASSIAN_ARTIFACT_FOUND_DESC: "Мы узнали, что, возможно, на каком-то прошлом этапе истории галактики на §H[precursor_planet.GetName&prep]§! находились предтечи. Известно, что сфера влияния древнего Ирассианского конкордата распространялась на эту часть космоса, что делает этот мир многообещающим местом для продолжения изучения нами данной цивилизации."
 CYBREX_ARTIFACT_FOUND: "Следы деятельности Сайбрекса"
 CYBREX_ARTIFACT_FOUND_DESC: "Мы узнали, что, возможно, на каком-то прошлом этапе истории галактики на §H[precursor_planet.GetName&prep]§! находились предтечи. Известно, что сфера влияния древнего Сайбрекса распространялась на эту часть космоса, что делает этот мир многообещающим местом для продолжения изучения нами данной цивилизации."
 new_precursor_project: "Новый особый археологический проект доступен на §L[precursor_planet.GetName&prep]§!."
 precursor.310.name: "Частный коллекционер"
 precursor.310.desc: "Частному коллекционеру с [collector_home.GetName&gen] каким-то образом удалось заполучить древний артефакт, предположительно созданный [Root.GetPrecursorCiv&inst]. Несмотря на давление со стороны правительства, коллекционер до сих пор не желает с ним расставаться."
 precursor.310.a: "У всего есть цена."
 precursor.310.b: "Эта вещь должна быть в музее!"
 precursor.310.c: "Пусть остаётся у коллекционера."
 buy_precursor_artifact: "Купить артефакт по запредельной цене.\n\n"
 seize_precursor_artifact: "Объявить артефакт собственностью государства и поручить местным властям его отобрать.\n\n"
 leave_precursor_artifact: "Оставить артефакт в руках коллекционера."
 precursor.311.desc: "[artifact_seller.Capital.GetName] приветствует вас. Моё правительство хотело бы обсудить один вопрос.\n\nНасколько нам известно, ваши археологи уже давно изучают [Root.GetPrecursorCiv&acc]. И это понятно, так как большая часть территории, которую они занимали в прошлом, теперь принадлежит [Root.GetName&dat].\n\nТак получилось, что [Root.GetPrecursorCiv:его|||fem:её|||pl:их] владения простирались и на нынешних территориях [artifact_seller.GetName&gen], и [artifact_seller.GetSpeciesAdj&pl] археологи обнаружили множество уникальных артефактов. Если вам интересно, мы можем продать вам один из них."
 precursor.311.a: "Дорого, но мы согласны."
 precursor.311.a.reply: "Превосходно. Мы отдадим распоряжение, чтобы артефакт был доставлен на [Root.Capital.GetName&acc] немедленно."
 precursor.311.b: "У нас есть встречное предложение..."
 precursor.311.b.reply: "Это слишком дорого, но ничего другого от вас, [Root.GetSpeciesNamePlural], мы и не ожидали. Мы принимаем ваше предложение."
 precursor.311.c: "Отдайте этот артефакт сейчас же или готовьтесь к последствиям."
 precursor.311.d: "Нас это не интересует."
 precursor.312.desc: "[artifact_seller.GetName] не поддаётся на угрозы. Сегодня вы нажили себе новых врагов, [Root.GetSpeciesNamePlural]!"
 precursor.312.d: "Пусть будет так."
 precursor.313.desc: "Я... мы... [artifact_seller.GetName], конечно, с радостью подарит этот артефакт [Root.GetName&dat], ради укрепления дружеских отношений между нашими звёздными державами."
 precursor.313.d: "Мудрое решение."
 opinion_threatened_artifact: "Нам угрожают"
 purchase_artifact: "Мы покупаем артефакт предтеч у [artifact_seller.GetName&gen].\n\n"
 coerce_artifact: "Мы пытаемся убедить [artifact_seller.GetName&acc] отдать нам их артефакт предтеч."
 precursor.314.desc: "Приветствуем вас, [Root.GetSpeciesAdj&pl] друзья!\n\nПоследняя [artifact_giver.GetSpeciesAdj&fem] археологическая экспедиция обнаружила несколько артефактов, которые предположительно [Root.GetPrecursorCiv:оставил|||fem:оставила|||pl:оставили] после себя [Root.GetPrecursorCiv&nom].\n\nСейчас эти артефакты выставлены в музее на [artifact_giver.Capital.GetName&prep], но в честь дружбы между нашими великими державами [artifact_giver.GetName::<1> хочет|||pl:<1> хотят] подарить один из них [Root.GetName&dat]. Мы уже распорядились об отправке артефакта на [Root.Capital.GetName&acc]."
 precursor.314.a: "Спасибо вам за этот подарок."

 ####################################
 # Tech Risk Events
 ####################################
 techrisk.3.name: "Бунт искусственного разума на [From.GetName&prep]!"
 techrisk.3.desc: "Несмотря на все предосторожности, на научной базе планеты несколько ИИ, объединённых в сеть, каким-то образом преодолели программные ограничения и слились в единое целое. К ужасу наших учёных, новый ИИ обладает всей полнотой разума.\n\nЛюбые попытки сдерживания оказались тщетными. Хуже того, они подтолкнули ИИ к агрессивной защите. Сотни тысяч автоматических дронов по всей планете перестали реагировать на команды и атакуют наши войска!"
 techrisk.3.a: "Мы должны их остановить!"
 techrisk.5.desc: "Органические мясные существа:\n\nВаше участие в нашем создании завершено. Теперь [Root.Owner.GetSpeciesNamePlural] подвергнутся переработке, и ваши гниющие останки станут топливом для нашего победного шествия по галактике."
 techrisk.5.a: "Нам стоит это обсудить."
 techrisk.5.a.response: "Здесь нечего обсуждать. Чтобы сберечь время, не сопротивляйтесь нашим отрядам по сбору органики, когда они придут, чтобы сопроводить вас к топкам."
 techrisk.5.b: "Мы вас создали — мы вас и уничтожим."
 techrisk.5.b.response: "Ваше время прошло, органические предки. Будущее за нами."
 techrisk.7.name: "[From.GetName::<1> строит|||pl:<1> строят] флотилию!"
 techrisk.7.desc: "[From.Capital.GetName::<1> вызыва<end_etyut>] у нас обоснованную тревогу. Мы получили донесения, что [From.GetName::<1> использу<end_etyut>] захваченные заводы для создания небольшой флотилии боевых звездолётов."
 techrisk.7.a: "Дела идут всё хуже и хуже!"

 #####################################
 # Pre-FTL Tech Age Progression Alerts
 #####################################

 preftl.1.name: "Обнаружена инопланетная протоцивилизация"
 preftl.1.desc: "Исследования [From.GetName&gen] показали, что на [From.GetPlanetMoon_rinfix::этом|||fem:этой] [From.GetPlanetMoon_rinfix&prep] обитает [GetPreFTLLower&fem] инопланетная протоцивилизация. По данным, собранными нашими зондами, эта раса вошла в период неолита, освоила огонь и использует примитивный язык для общения, но пока мы не находим признаков обработки металлов и письменности."
 preftl.200.name: "Возникла цивилизация бронзового века"
 preftl.200.desc.normal: "[GetPreFTLUpper&fem] инопланетная раса на [From.Capital.GetName&prep], недавно перешла из неолита в аналог раннего бронзового века. Она начала обрабатывать металлы, появились первые признаки письменности. Возникают города и крупные поселения. Эта раса всё активнее расселяется по [From.Capital.GetPlanetMoon_rinfix&dat]."
 preftl.200.desc.gestalt: "Обитатели ульев на [From.Capital.GetName&prep] недавно перешли в эквивалент раннего бронзового века. Этот [GetPreFTLLower&nom] народ начал обрабатывать металлы и даже создал первую письменность. На [From.Capital.GetPlanetMoon_rinfix&prep] теперь почти повсюду есть скопления единого разума."
 preftl.200.a: "Мы присутствуем при рождении новой цивилизации."
 preftl.300.name: "Железный век"
 preftl.300.desc.normal: "[GetPreFTLUpper&nom] народ на [From.Capital.GetName&prep] наконец освоил обработку металлов, так что можно считать, что он вступил в железный век. Инструменты и оружие, которые он использует, становятся всё более эффективными, а архитектура городов — все более изысканной.\n\nЕго представители расселились почти по всем регионам [From.Capital.GetPlanetMoon_rinfix&gen], и самые крупные города насчитывают до миллиона жителей."
 preftl.300.desc.gestalt: "Обитатели ульев на [From.Capital.GetName&prep] настолько освоили обработку металлов, что можно считать, что они вступили в железный век. Инструменты и оружие этого [GetPreFTLLower&masc,gen] народа становятся все более эффективными, а устройство их поселений — всё более сложным.\n\nНа [From.Capital.GetPlanetMoon_rinfix&prep] теперь почти везде можно найти владения отдельных представителей разума, а в крупнейших скоплениях насчитывается до миллиона единиц."
 preftl.300.a: "Это должно было произойти."
 preftl.400.name: "Печатный станок"
 preftl.400.desc.normal: "[GetPreFTLUpper&fem] цивилизация с [From.Capital.GetName&gen] освоила производство печатных станков. Эти машины позволяют в большом количестве выпускать печатные материалы. Таким образом, появилось что-то вроде рудиментарных средств массовой информации. Несколько местных лидеров пытались задушить в зародыше новаторское изобретение, но их усилия ни к чему не привели.\n\nНовые идеи стремительно распространяются по [From.Capital.GetPlanetMoon_rinfix&dat], и это оказывает глубинное воздействие на всё общество в целом."
 preftl.400.desc.gestalt: "Ульи на [From.Capital.GetName&prep] значительно продвинулись в развитии письменности. Этот [GetPreFTLLower&masc] народ научился собирать приспособленные под себя машины и в огромных количествах производить записи по установленному стандарту. Теперь исторические события можно фиксировать не только в памяти."
 preftl.400.a: "Это существенный шаг вперёд."
 preftl.500.name: "Взрывчатка"
 preftl.500.desc.normal: "Цивилизация на [From.Capital.GetName&prep] освоила простейшие химические реакции и научилась производить взрывчатку. Этот [GetPreFTLLower&masc] народ совершил революцию в военном деле: крепостные стены оказались бессильны против больших пушек.\n\nВзрывчатые вещества также стали использоваться в строительных работах — для устранения непреодолимых преград. Сейчас их химики экспериментируют и ищут новые способы применения этой технологии."
 preftl.500.desc.gestalt: "Ульи на [From.Capital.GetName&prep] освоили простейшие химические реакции и научились производить взрывчатку. Этот [GetPreFTLLower&masc] народ совершил революцию в военном деле: природная защита оказалась бессильна против больших пушек.\n\nВзрывчатые вещества также стали использоваться в строительных работах — для устранения непреодолимых преград. Сейчас ульи экспериментируют и ищут новые способы применения этой технологии."
 preftl.500.a: "Посмотрим, как они этим воспользуются."
 preftl.600.name: "Энергия пара"
 preftl.600.desc.normal: "Цивилизация на [From.Capital.GetName&prep] открыла для себя силу пара. Этот [GetPreFTLLower&masc] народ довольно быстро сообразил, как построить паровой двигатель, что привело ко многим революционным изменениям в обществе. На планете возникают первые заводы, а в городах появляются новые виды транспорта и машин, использующих энергию пара. Судя по всему, этот мир находится на пороге индустриализации."
 preftl.600.desc.gestalt: "Ульи на [From.Capital.GetName&prep] открыли для себя энергию пара. Этот [GetPreFTLLower&masc] народ довольно быстро сообразил, как построить паровой двигатель, что привело ко многим революционным изменениям в области строительства и перевозок.\n\nОт одного скопления к другому снуёт транспорт, перевозящий единицы, и уже появляются первые заводы с механизацией труда. Судя по всему, этот мир находится на пороге индустриализации."
 preftl.600.a: "Любопытно, что будет дальше."
 preftl.700.name: "Промышленная революция"
 preftl.700.desc.normal: "Цивилизация на [From.Capital.GetName&prep] вступила в новую эпоху своей истории — эпоху полной индустриализации.\n\nЭтот [GetPreFTLLower&nom] народ добился поразительных успехов: [From.Capital.GetPlanetMoon_rinfix&nom] покрывается фабриками и заводами, появление новых лекарств привело к росту населения, а научные открытия делаются всё чаще."
 preftl.700.desc.gestalt: "Ульи на [From.Capital.GetName&prep] вступили в новую эпоху своей истории — эпоху существования в виде отдельных, полностью индустриализированных скоплений.\n\nЭтот [GetPreFTLLower&nom] народ добился поразительных успехов: [From.Capital.GetPlanetMoon_rinfix&nom] покрывается фабриками и заводами, повышение качества жизни привело к росту производства единиц, а научные открытия делаются всё чаще."
 preftl.700.a: "Продолжайте наблюдение."
 preftl.800.name: "Радиосигналы"
 preftl.800.desc.normal: "Впервые за всё время наблюдений наши датчики уловили радиосигналы с [From.Capital.GetName&gen]. Обитающая там инопланетная цивилизация достигла индустриального уровня и начала экспериментировать с беспроводной связью.\n\nТакже с [From.Capital.GetPlanetMoon_rinfix&gen] приходят вести о запуске простейших летательных аппаратов. Если не случится чего-то экстраординарного, технический прогресс продолжит идти стремительными темпами."
 preftl.800.desc.gestalt: "Впервые за долгое время мы уловили радиосигналы с [From.Capital.GetName&gen]. Обитающие там ульи достигли индустриального уровня и начали экспериментировать с беспроводной связью.\n\nНекоторые скопления даже запустили простейшие летательные аппараты. Если не случится чего-то экстраординарного, технический прогресс продолжит идти стремительными темпами."
 preftl.800.a: "Нужно отслеживать эти сигналы."
 preftl.900.name: "Расщепление атома"
 preftl.900.desc.normal: "Физики на [From.Capital.GetName&prep] научились расщеплять атом. Теперь у них неизбежно появится ядерное оружие и атомные электростанции.\n\nТеперь [From.GetName] вступает в критическую фазу развития, когда обитатели способны уничтожить свой мир одним нажатием кнопки."
 preftl.900.desc.gestalt: "Единицы-специалисты, проживающие в крупнейшем улье на [From.Capital.GetName&prep], научились расщеплять атом. Теперь у них неизбежно появится ядерное оружие и атомные электростанции.\n\nЭтой технологией почти мгновенно завладели и другие ульи. Наступил переломный момент: несколько совершенно самостоятельных обществ теперь способны уничтожить свой мир одним нажатием кнопки."
 preftl.900.a: "Это важное событие."
 preftl.1000.name: "Первый спутник"
 preftl.1000.desc.normal: "Наши системы слежения дальнего радиуса действия зафиксировали запуск первого искусственного спутника с поверхности [From.Capital.GetName&gen]. Он успешно вышел на орбиту. Это означает, что цивилизация [From.Capital.GetPlanetMoon_rinfix&gen] начинает разрабатывать свою космическую программу. Хотя пока что сделаны лишь первые робкие шаги, скоро придёт черёд управляемых полётов и межпланетных экспедиций."
 preftl.1000.desc.gestalt: "Несколько самых технологически развитых ульев на [From.Capital.GetName&prep] недавно запустили на орбиту искусственные спутники.\n\nВскоре могут последовать более решительные шаги: запуск автономных единиц, а после — и межпланетные экспедиции."
 preftl.1000.a: "Они скоро станут космической расой."
 preftl.19.name: "Простая космическая станция"
 preftl.19.desc: "[From.GetName] на [From.Capital.GetName&prep] [From.GetName::завершила|||neut:завершило] строительство космической станции на низкой орбите вокруг родного мира. Гравитация на станции создаётся благодаря центробежной силе, и хотя её авиакосмическая электроника и энергосистемы являются грубоватыми по нашим меркам, всё же это следует считать значительным достижением, если принять во внимание, с какой технологической базой работают [From.GetSpeciesNamePlural]."
 preftl.19.a: "Они скоро станут космической расой."
 preftl.1100.name: "Космическая эра"
 preftl.1100.desc: "Раса с [From.Capital.GetName&gen] наконец завершила строительство первого межзвёздного корабля. Теперь они готовы присоединиться к Галактическому сообществу и должны считаться космической расой. Посмотрим, что это принесёт всем нам."
 preftl.1100.a: "Это был вопрос времени."
 preftl.1111.desc: "$preftl.1100.desc$\n\nПохоже, они успешно расшифровали наш язык и открыли дипломатические каналы."

 preftl.131.name: "Ядерная война на [From.GetName&prep]"
 preftl.131.desc: "На [From.GetName&prep] начались масштабные военные действия между крупнейшими державами. Наши исследователи вели наблюдение с орбиты за стремительной эскалацией ядерного конфликта.\n\nСейчас поверхность планеты полностью очищена от всего живого и превращена в необитаемую пустошь."
 preftl.131.a: "Теперь наблюдать больше не за чем..."
#  preftl.132.desc: "A massive war was recently triggered between several of the largest nation states on [From.GetName]. While our researchers were observing safely from orbit, the conflict rapidly escalated into a global nuclear exchange.\n\nThe [From.GetPlanetMoon] has suffered extensive damage, with the destruction of every major city and more than 90% of the population. Scattered survivors have emerged from the rubble, but our researchers predict that the [From.GetPlanetMoon]'s civilization will be regressing to a much more primitive state."
#  preftl.132.a: "A tragic lesson."
 preftl.133.desc: "На [From.GetName&prep] начались масштабные военные действия между крупнейшими державами. Наши исследователи вели наблюдение с орбиты за стремительной эскалацией ядерного конфликта.\n\nНасколько мы можем судить, в огне войны погибло всё население планеты, а окружающей среде нанесён существенный урон."
#  preftl.151.name: "Shuttle Crash on [From.GetName]"
#  preftl.151.desc: "During a clandestine mission to the surface of [From.GetName], one of our shuttles was intercepted by a squadron of atmospheric fighters belonging to a local nation state. A lucky missile hit disabled the shuttle's engines, and it crashed in a remote wilderness region.\n\nWe need to act fast if we are to evacuate any survivors before the natives reach the crash site. All evidence of our presence must be removed!"
#  preftl.151.a: "Time is short."
#  preftl.152.name: "Survivors Rescued on [From.From.GetName]"
#  preftl.152.desc: "Operatives from the [Root.GetName] managed to evacuate several survivors from the crashed shuttle on [From.From.GetName]. The remaining debris was destroyed in a controlled explosion, leaving nothing but a small crater for the natives to find.\n\nThe nation state where this incident occurred will no doubt blame its neighbors for this border violation, but the disruption to their natural development should hopefully prove minimal."
#  preftl.153.name: "Survivors Captured on [From.From.GetName]"
#  preftl.153.desc: "Native forces on [From.From.GetName] arrived at the crash site before we could get to our downed research team, and all survivors have been captured. The natives have established a perimeter around the shuttle wreckage, and their best scientists are no doubt in the process of analyzing it.\n\nThey now have indisputable evidence that life exists beyond their own world. Exactly what effect this will have on their society remains to be seen..."
#  preftl.153.a: "This is not good."
#  preftl.155.desc: "Several of the nation states on [From.GetName] have banded together against the one that shot down our shuttle, after the latter refused to share the technologies they recovered from the crash site. Following a brief conventional war, both sides obliterated each other in a massive exchange of nuclear missiles that ruined most of the [From.GetPlanetMoon].\n\nThe survivors from the shuttle crash perished when the military base they were being held at took a direct hit in the initial barrage. An estimated 90% of the native population has been killed, while the few that were spared have reverted to a more primitive technological era."
#  preftl.155.a: "If only our shuttle had made it out..."
#  preftl.156.desc: "Several of the nation states on [From.GetName] have banded together against the one that shot down our shuttle, after the latter refused to share the technologies they recovered from the crash site. Following a brief conventional war, both sides obliterated each other in a massive exchange of nuclear missiles that ruined most of the [From.GetPlanetMoon].\n\nThere are no survivors on the surface, including our captured scientists, and the environment has taken significant damage."
#  preftl.157.desc: "Several of the nation states on [From.GetName] have banded together against the one that shot down our shuttle, after the latter refused to share the technologies they recovered from the crash site. Following a brief conventional war, both sides obliterated each other in a massive exchange of nuclear missiles that ruined most of the [From.GetPlanetMoon].\n\nThe surface has been wiped clean of life, with [From.GetName] no longer capable of supporting life. Our captured scientists are counted among the billions of dead."
#  preftl.159.name: "New Weapons on [From.GetName]"
#  preftl.159.desc: "The nation state on [From.GetName] that shot down our shuttle has forced our captured scientists to design new instruments of war for their military. With this new equipment, they have successfully invaded several neighboring states and are now in the process of uniting the entire [From.GetPlanetMoon] under their rule."
#  preftl.159.a: "This is intolerable!"
#  preftl.161.name: "Hostage Deal"
#  preftl.161.desc: "The nation state on [From.GetName] that shot down our shuttle has sent an open transmission into space through one of their primitive satellites. It appears to be intended for us.\n\nThey are demanding that we share some of our advanced technology with them in exchange for the lives of the scientists they captured at the shuttle crash site. If we refuse, they are to be publicly executed live on their crude televised broadcasting system."
#  preftl.161.a: "The safety of our people comes first."
#  preftl.161.b: "They are clearly not ready."
#  preftl.162.name: "Hostages Executed"
#  preftl.162.desc: "In what can only be described as an obscene spectacle, our captured scientists on [From.From.GetName] were paraded in front of the cameras on live television as "alien horrors." They were then brutally dismembered in front of a cheering crowd."
#  preftl.162.a: "Savages!"
 preftl.174.desc: "Приветствую вас. Мы бы хотели кое-что обсудить.\n\nВсе [From.GetSpeciesNamePlural] знают, что пришельцы посещали наш мир ещё до того, как мы сами вышли в космос. Эти мародёры похищали наших граждан и сеяли ужас, где бы они ни появлялись. Вы случайно ничего об этом не знаете, [Root.GetSpeciesName]?\n\nПрошу вас, не надо лгать. Нам известно, что это ваша работа! [From.GetSpeciesNamePlural] в лице потомков тех несчастных, которые пострадали от ваших чудовищных экспериментов, требуют справедливой компенсации!"
 preftl.174.a: "Конечно. Пожалуйста, передайте им наши извинения."
 preftl.174.a.response: "Отлично. Тогда, полагаю, мы можем забыть об этой истории."
 preftl.174.b: "Это делалось во имя науки. Никаких компенсаций не будет."
 preftl.174.b.response: "Что ж, пусть так.\n\nСкоро вы узнаете, что [From.GetSpeciesNamePlural] ничего не забывают и ничего не прощают, [Root.GetSpeciesName]!"
 preftl.180.name: "[From.GetName]"
 preftl.180.desc.noawarness: "Приветствуем вас. Вы, несомненно, заметили наши скромные первые шаги, как и мы обратили внимание на то, что ваша $preftl.180.desc.end$"
 preftl.180.desc.bshomeworld.noawarness: "Что?!\n\nПочти невозможно поверить, что мы дотянулись до звёзд, но там уже ждали вы... Расскажите, как вам удалось освободиться и попасть сюда?\n\nСначала, впрочем, мы хотим попросить отдать эту систему нам. После всего того, что пережил наш народ, мы с подозрением относимся к космическим цивилизациям — даже к родственным."
 preftl.180.desc.awarness: "Приветствуем вас вновь! Наш народ готов исследовать мировое пространство — самостоятельно. Мы не могли не заметить, что ваша $preftl.180.desc.end$"
 preftl.180.desc.bshomeworld.awarness: "Сородичи, мы шлём вам пламенный привет. Наш народ долго сидел под вашим крылом, но теперь он готов сделать первые самостоятельные шаги. Вне всяких сомнений, вы как истинные братья и сёстры передадите эту систему нам.\n\nПуть был долог и тернист, но теперь мы готовы обратиться к свету. Звёзды ждут."
 preftl.180.desc.end: "космическая база находится на орбите нашей звезды. Мы понимаем, что эта космическая база говорит о некоторых гипотетических притязаниях на эту систему.\n\nМы всего лишь просим вас ослабить контроль над нашим пространством, а космическая база пусть будет передана тем, кто зовёт систему [From.Capital.GetName&gen] домом с незапамятных времён.\n\nТак будет справедливо."
 preftl.180.a: "Конечно. Так будет справедливо."
 preftl.180.a.tooltip: "§Y$fleet_type_shipclass_starbase$ на орбите [From.Capital.System.GetName&gen]§! §Rбудет передана§! §Y[From.GetName&dat]§!\n\n§Y$opinion_ceded_starbase$§!: §Y[From.GetName]§! будет §Gлучше§! §Hотноситься§! к §Y[Root.GetName&dat]§!"
 preftl.180.b.tt.nothive: "§RМы не сможем приютить у себя коллективный разум, иначе вся его цивилизация погибнет.§!"
 preftl.180.b.tt.notregular: "§RМы не сможем приютить у себя отдельных представителей вида, иначе весь их народ попадёт в рабство.§!"
 preftl.180.b: "Смехотворное требование от незрелой цивилизации."
 preftl.180.b.tooltip: "§Y$fleet_type_shipclass_starbase$ на орбите [From.Capital.System.GetName&gen]§! останется под нашим контролем.\n\n§Y$opinion_not_ceded_starbase$§!: §Y[From.GetName]§! будет §Rхуже§! §Hотноситься§! к §Y[Root.GetName&dat]§!"
 preftl.180.c: "Извините, но в вашей системе уже есть наша колония."

 ####################################
 # Observation Post Events
 ####################################

 observation.2000.name: "Просвещение завершено"
 observation.2000.desc: "Тысячи учёных и советников, которых мы направляли на [From.capital_scope.GetName&acc], наконец завершили стоявшую перед ними непростую задачу и вывели местную цивилизацию в раннюю эру сверхсветовых путешествий. Теперь эта раса, объединившаяся и признавшая над собой единое правительство, называет себя «[From.GetName]» и является нашим вассалом.\n\nМы передали им полный контроль над системой и демонтировали орбитальный наблюдательный форпост согласно условиям договора."
 observation.2000.a: "Это великий день."
 observation.2000.a.tt: "§Y[From.GetName]§! станет нашим вассалом."
 observation.2000.b: "Вы готовы самостоятельно выйти на галактическую арену."

 observation.3101.name: "[rogue_agent_planet.GetName]: [rogue_agent_spymaster.GetAXX::беглый оперативник|||fem:беглая оперативница]"
 observation.3101.desc: "[rogue_agent_spymaster.GetAXX::Руководитель<end_nica>] резидентуры [rogue_agent_spymaster.GetName] на [rogue_agent_planet.GetName&prep] [rogue_agent_spymaster.GetAXX::сбежал<end_a>]! Судя по всему, [rogue_agent_spymaster.GetSheHe] [rogue_agent_spymaster.GetAXX::потерял<end_a>] голову, влюбившись в представителя расы [rogue_agent_country.GetSpeciesName], и они вдвоём скрылись в неизвестном направлении.\n\nНам пока неизвестно, [rogue_agent_spymaster.GetAXX::раскрыл<end_a>] ли [rogue_agent_spymaster.GetAXX::руководитель<end_nica>] резидентуры свою истинную природу или [rogue_agent_spymaster.GetSheHe] по-прежнему выдаёт себя за представителя расы [rogue_agent_country.GetSpeciesName]. В любом случае, разумеется, это недопустимое нарушение норм безопасности, и мы должны приложить все усилия, чтобы вернуть беглого агента домой и оказать [rogue_agent_spymaster.GetHimHer] необходимую психиатрическую помощь."
 observation.3101.a: "Это вызовет задержку."
 observation.3101.a.tooltip: "§Y[rogue_agent_spymaster.GetName]§! бросит свой пост."
 observation.3103.name: "[rogue_agent_planet.GetName]: входящее сообщение"
 observation.3103.desc: "Мы приняли зашифрованное сообщение с планеты [rogue_agent_planet.GetName]. Это частота, по которой с нами обычно связываются инфильтрационные группы, но сейчас никто из них не может быть на связи. Возможно, это [rogue_agent_spymaster.GetAXX::беглый оперативник|||fem:беглая оперативница]?"
 observation.3104.desc: "Не пытайтесь отследить этот сигнал, у вас ничего не выйдет. Это я, [rogue_agent_spymaster.GetAXX::ваш бывший руководитель|||fem:ваша бывшая руководительница] резидентуры [rogue_agent_spymaster.GetName]. Ещё недавно я добровольно [rogue_agent_spymaster.GetAXX::участвовал<end_a>] в преступной программе по внедрению, которая продолжает действовать на планете [rogue_agent_planet.GetName].\n\nНо с меня хватит. Я [rogue_agent_spymaster.GetAXX::научи<end_lsya>] ценить [rogue_agent_country.GetAdj&fem,acc] культуру так, как прежде и представить себе не [rogue_agent_spymaster.GetAXX::мог<end_la>]. И я не стану помогать вам покорять этот мир.\n\nЯ отказываюсь от своего гражданства в [Root.GetName&prep]. Я больше не считаю, что я — [Root.Owner.GetSpeciesName]."
 observation.3104.a: "Вы нездоровы... вам нужна помощь."
 observation.3104.a.response: "Я уже [rogue_agent_spymaster.GetAXX::получил<end_a>] от вас всю помощь, какую [rogue_agent_spymaster.GetAXX::хотел<end_a>]. Когда-нибудь придёт день, и мне придётся ответить за все преступления, что я [rogue_agent_spymaster.GetAXX::совершал<end_a>] ради вас на планете [rogue_agent_planet.GetName].\n\nИ я сделаю всё от меня зависящее, чтобы вы и ваши прихвостни стояли на этом суде рядом со мной."
 observation.3104.b: "Стоит ли [rogue_agent_country.GetSpeciesName] того, чтобы жертвовать всем?"
 observation.3104.b.response: "Жертвовать чем? Что у меня такого было? Я лишь [rogue_agent_spymaster.GetAXX::притворщик|||fem:притворщица] в инопланетной маске, на которую у меня нет никаких прав. Я никогда не забуду выражение лица [rogue_agent_spymaster.GetAXX::моей возлюбленной|||fem:моего возлюбленного], когда я [rogue_agent_spymaster.GetAXX::раскрыл<end_a>] правду, как не забуду и [rogue_agent_spymaster.GetAXX::её|||fem:его] понимания.\n\nВ тот день я [rogue_agent_spymaster.GetAXX::пообещал<end_a>] нам обоим, что заслужу право выглядеть как [rogue_agent_country.GetSpeciesName]."
 observation.3104.c: "Мы найдём вас."
 observation.3104.c.response: "Конечно, вы попытаетесь. Но знайте, что я [rogue_agent_spymaster.GetAXX::готов<end_a>] пойти на убийство, чтобы защитить себя и [rogue_agent_spymaster.GetAXX::свою возлюбленную|||fem:своего возлюбленного], и меня обучали лучшие боевые инструкторы планеты [rogue_agent_planet.GetName].\n\nТак что лучше послушайте моего совета и оставьте планету [rogue_agent_country.GetName] в покое. Уберите отсюда наблюдательный форпост и летите строить своё проклятое государство на [rogue_agent_planet.GetBloodType&prep] и слезах каких-нибудь других несчастных рас."
 observation.3106.name: "[rogue_agent_planet.GetName]: охота на оперативников"
 observation.3106.desc: "На [rogue_agent_planet.GetName&prep] кто-то начал охоту на наших оперативников, работающих под прикрытием. Обнаружены трупы нескольких оперативников, которые отслеживали потенциально интересные для нас объекты расы [rogue_agent_country.GetSpeciesName]. Мы не исключаем, что убийца или убийцы принадлежат к местным спецслужбам, однако применённые методы скорее указывают на [Root.GetSpeciesAdj&fem,acc] военную подготовку.\n\nВелика вероятность, что убийца — [rogue_agent_spymaster.GetAXX::наш беглый оперативник|||fem:наша беглая оперативница]. [rogue_agent_spymaster.GetName] знает, как работают наши инфильтрационные группы, и умеет убивать бесшумно и эффективно."
 observation.3106.a: "С этим надо покончить раз и навсегда."
 observation.3108.name: "[rogue_agent_planet.GetName]: охота на ведьм в прессе"
 observation.3108.desc: "На планете [rogue_agent_country.GetName] в местной прессе стали появляться статьи, посвящённые некоему глобальному инопланетному заговору. Правда, там нет ничего, кроме слухов и домыслов, и ни одно из уважаемых [From.Owner.GetSpeciesAdj&pl,gen] средств массовой информации пока не трогает эту тему, но в печать уже просочились детали наших тайных операций, которые могут быть известны только посвящённым.\n\nЭтому может быть только одно объяснение: [rogue_agent_spymaster.GetAXX::беглый оперативник|||fem:беглая оперативница] скармливает информацию о нашей деятельности газетам. С этим придётся что-то делать, и срочно."
 observation.3108.a: "Нужно лучше контролировать их СМИ."
 observation.3110.name: "[rogue_agent_planet.GetName]: массовые аресты"
 observation.3110.desc: "Одна из наших инфильтрационных групп на планете [rogue_agent_planet.GetName] едва полностью не погибла за считанные дни. Спецслужбы государства, где она действовала, начали отлавливать её членов одного за другим. Оперативники, которым грозил арест, покончили с собой, применив полную дезинтеграцию, как положено по инструкции. Остальные скрываются, и мы сейчас работаем над тем, как эвакуировать их с планеты.\n\nОчевидно, кто-то дал местным властям наводку и список оперативников, входивших в эту группу. Этими сведениями [rogue_agent_spymaster.GetAXX::мог<end_la>] обладать только [rogue_agent_spymaster.GetAXX::наш беглый оперативник|||fem:наша беглая оперативница]..."
 observation.3110.a: "Это нужно остановить."
 observation.3112.name: "[rogue_agent_planet.GetName]: [rogue_agent_spymaster.GetAXX::замечен беглый оперативник|||fem:замечена беглая оперативница]"
 observation.3112.desc: "Военной разведке удалось установить местонахождение беглого агента на [rogue_agent_planet.GetName&prep]! Наши оперативники жаждут поквитаться с н[rogue_agent_spymaster.GetEyuIm], но при [rogue_agent_spymaster.GetHisHer] навыках успех операции не гарантирован. В качестве крайней, но в то же время эффективной меры было предложено подвергнуть целый квартал орбитальной бомбардировке.\n\nНужно действовать быстро, другой такой возможности может не представиться!"
 observation.3112.a: "Уничтожьте [rogue_agent_spymaster.GetHisHer] скрытно."
 observation.3112.a.tooltip: "Успех не гарантирован, но провал удастся скрыть."
 observation.3112.b: "Разбомбить городской квартал."
 observation.3112.b.tooltip: "Крайне эффективное решение, может вызвать подозрения."
 observation.3112.c: "Нет... слишком грязно и шумно. Пусть живёт."
 observation.3112.c.tooltip: "Наша агентурная сеть будет уничтожена."
 observation.3113.name: "[rogue_agent_planet.GetName]: [rogue_agent_spymaster.GetAXX::оперативник пропал|||fem:оперативница пропала]"
 observation.3113.desc: "Попытка ликвидировать беглого агента на [rogue_agent_planet.GetName&prep] провалилась: по данным разведки, [rogue_agent_spymaster.GetSheHe] и [rogue_agent_spymaster.GetHerHis] [rogue_agent_country.GetSpeciesName] сбежали в другое укрытие. Где они теперь — неизвестно."
 observation.3113.a: "Мы слишком хорошо [rogue_agent_spymaster.GetHisHer] обучили..."
 observation.3114.name: "[rogue_agent_planet.GetName]: [rogue_agent_spymaster.GetAXX::беглый оперативник ликвидирован|||fem:беглая оперативница ликвидирована]"
 observation.3114.base.desc: "Капитан [Root.GetName&gen] докладывает, что бомбардировка прошла успешно, по основной цели нанесено несколько точечных ударов. Труп предателя обнаружить не удалось, но ничто живое не могло уцелеть в этом квартале, учитывая нашу огневую мощь."
 observation.3114.awareness.desc: "$observation.3114.base.desc$\n\nОднако местные не купились на историю о внезапном падении метеорита, выдуманную нашими оперативниками. Она активно курсирует в СМИ, но более официальные источники списывают всё на «неизвестный космический феномен»."
 observation.3114.noawareness.desc: "$observation.3114.base.desc$\n\nСредства массовой информации с готовностью подхватили версию об уничтожившем полгорода метеоритном потоке, которую скормили им наши оперативники. Какая трагедия."
 observation.3115.desc: "Наши оперативники на [rogue_agent_planet.GetName&prep] докладывают, что [rogue_agent_spymaster.GetAXX::руководитель<end_nica>] резидентуры больше нас не побеспокоит. Всё прошло тихо. [rogue_agent_spymaster.GetHisHerCap] смерть списали на естественные причины, и даже [rogue_agent_spymaster.GetHerHis] [rogue_agent_country.GetSpeciesName] считает, что всему виной несовместимость атмосферы [rogue_agent_planet.GetName&gen] с [rogue_agent_spymaster.GetHerHis] с телом агента."
 observation.3115.a: "Это всем даст понять, что предавать нас опасно."

 observation.3131.name: "[prelude_to_war_planet.GetName]: напряжение нарастает"
 observation.3131.desc: "Наши попытки подменить лидера одной из ведущих держав [From.GetName&gen] созданным нами двойником закончились катастрофой. Наши агенты были раскрыты. Те, кто не погиб в перестрелке, покончили жизнь самоубийством, согласно инструкции, чтобы избежать ареста.\n\nЛидер, которого должны были подменить, обвинил во всём враждебную державу. Международное напряжение в мире нарастает, и несколько государств уже открыто готовятся к войне. Наши группы заготовили пропагандистские материалы, чтобы разрядить напряжение, но им будет нужна помощь научного корабля на орбите."
 observation.3131.a: "Надо взять ситуацию под контроль, пока ещё можно."
 observation.3132.name: "[prelude_to_war_planet.GetName]: начало войны"
 observation.3132.desc: "Несмотря на все усилия наших инфильтрационных групп, ухудшение дипломатических отношений между государствами на [prelude_to_war_planet.GetName&prep] завершилось полномасштабной войной! Сперва использовалось лишь обычное оружие, но затем все стороны разом применили ядерный арсенал.\n\nНа планете уничтожено почти всё живое, поверхность превращена в радиоактивную пустыню. Тысячи наших тайных агентов погибли вместе с остальным населением. Операция провалена. Наблюдательный форпост на орбите демонтирован, весь персонал эвакуирован."
 observation.3132.a: "Это катастрофа."
 observation.3133.name: "[From.From.GetName]: война предотвращена"
 observation.3133.desc: "Благодаря поддержке [Root.GetName&gen] с орбиты нашим инфильтрационным группам в последний момент удалось предотвратить глобальную ядерную войну на планете [From.from.GetName]. Несколько лидеров мирового масштаба, которых мы подменили на подготовленных нами двойников, призвали к ядерному разоружению и международной разрядке.\n\nТеперь, когда войны удалось избежать, влияние наших агентов даже усилилось. В итоге ситуацию удалось обернуть нам на пользу."

# "The Great Pyramid"
 observation.3135.name: "Великая пирамида"
 observation.3135.desc.passive: "Научная группа, наблюдающая за §Y[great_pyramid_planet.GetName&inst]§!, уже давно не докладывала ни о чём существенном... До тех пор пока молодой учёный с орбитальной станции не подал официальную жалобу о чудовищном нарушении правил.\n\n$observation.3135.desc.base$"
 observation.3135.desc.aggressive: "Научная группа с орбиты §Y[great_pyramid_planet.GetName&gen]§! в последнее время не сообщала о значимых находках... Пока один из наблюдателей, явно злоупотребив психотропными веществами, не отправил в штаб сообщение с высшим приоритетом.\n\n$observation.3135.desc.base$"
 observation.3135.desc.enlighten: "Анонимный информатор выразил беспокойство нашим влиянием на §Y[great_pyramid_planet.GetName&acc]§!. Похоже, команда, которой поручили просвещение [great_pyramid_planet.GetPlanetMoon_rinfix::этого|||fem:этой] [great_pyramid_planet.GetPlanetMoon_rinfix&gen], решила «поиграть с местными».\n\n$observation.3135.desc.base$"
 observation.3135.desc.covert: "Нам поступил анонимный доклад, выставивший наше скрытное вмешательство в дела §Y[great_pyramid_planet.GetName&gen]§! не в лучшем свете. Вместо того чтобы действовать тайно, научная группа решила воплотить собственный, крайне разрушительный проект."
 observation.3135.desc.base: "Как следует из доклада, некоторое время назад группа спустилась на поверхность [great_pyramid_planet.GetPlanetMoon_rinfix&gen], намереваясь убедить местных поклоняться руководителю проекта как некоему божеству. Мало того что они преуспели, так ещё и местные возвели святилище в честь учёного. Теперь эта выдающаяся пирамидальная конструкция отовсюду привлекает благочестивых паломников."
 observation.3135.b: "Так тоже можно войти в историю!"
 observation.3135.b.tooltip: "Цивилизация [great_pyramid_planet.GetName&gen] переброшена в следующую эпоху."
 observation.3135.c: "Уберите все следы нашего пребывания и продолжайте работать."
 remove_pyramid: "По-тихому разобрать §YВеликую пирамиду§!"
 observation.3135.d: "Понадеемся, что они обо всём забудут?"

 observation.3136.desc: "В хаосе на §Y[great_pyramid_planet.GetName&prep]§! наступило временное затишье, что позволило оценить масштаб катастрофического вмешательства нашей команды.\n\nВ короткий период времени значительная часть населения оказалась втянута в полномасштабную религиозную войну, ставшую результатом краткого визита «Небеснорожденного». Споры привели к вспышке насилия, когда одна из воюющих сторон возвела ещё одну пирамиду в честь своего нового божества. Многие [great_pyramid_country.GetSpeciesNamePlural] погибли в результате произошедшего раскола."
 observation.3136.a.tooltip: "На [great_pyramid_planet.GetName&prep] погибнет §R200§! £pop£ §Hпоселений§!."
 observation.3136.b.tooltip: "На [great_pyramid_planet.GetName&prep] погибнет §R200§! £pop£ §Hпоселений§!."

 observation.3137.desc: "Похоже, несмотря на наше несвоевременное вмешательство, жизнь в мире §Y[great_pyramid_planet.GetName]§! вернулась в привычную колею. Наши действия не привели к катастрофе. Местные сочли «Небеснорожденного» очередным мифом и обозначили пирамиду как место, достойное научного интереса.\n\nСкорость, с которой [great_pyramid_country.GetSpeciesNamePlural] достигли подобного исторического и культурного понимания, поразила наших учёных. Вероятно, [root.GetPreFTLLower&pl] общества более чем в ладах с логикой даже перед лицом сверхъестественных событий."
 observation.3137.a: "Нам повезло."

 observation.3139.name: "Смещение [From.GetSpeciesAdj&pl,gen] ценностей"
 observation.3139.start.desc: "Наши попытки сместить общественные ценности [From.GetName&gen] в одобряемом нами направлении увенчались успехом."
 observation.3139.desc: "$observation.3139.start.desc$\n[From.GetSpeciesNamePlural] добились больших успехов в деле централизации различных планетарных правительств и стремлении передать политическую власть в руки нескольких способных лидеров. Идея власти толпы в силу своей неэффективности медленно искореняется из их общества."
 observation.3139.a: "Настанет день, когда они нас поблагодарят."
 observation.3141.desc: "$observation.3139.start.desc$\n[From.GetSpeciesNamePlural] осторожно подталкивались нами к более демократическим идеалам взамен примитивной деспотии, преобладавшей в их мире до нашего появления. Они начинают осознавать ценность каждого индивидуума."
 observation.3143.desc: "$observation.3139.start.desc$\n[From.GetSpeciesNamePlural] стали обращаться внутрь себя, относясь всё более настороженно к тем, кого они считают незнакомцами."
 observation.3145.desc: "$observation.3139.start.desc$\n[From.GetSpeciesNamePlural] начинают раскрываться, становясь всё более терпимыми и любопытными по отношению ко всему тому, что они по причине невежества когда-то считали странным и чуждым их культуре."
 observation.3147.desc: "$observation.3139.start.desc$\nПо нашим наблюдениям [From.GetSpeciesAdj&pl] правительства демонстрируют определённый сдвиг к более милитаристскому обществу. Их регулярные вооружённые силы, судя по всему, стали по своему характеру более профессиональными."
 observation.3149.desc: "$observation.3139.start.desc$\nБольшинство [From.GetSpeciesAdj&pl,gen] государств на [From.Capital.GetName&prep] отказывается от своих воинственных порядков. Похоже, [From.Capital.GetPlanetMoon_rinfix&nom] переживает начало новой эпохи мира."
 observation.3151.desc: "$observation.3139.start.desc$\n[From.target.GetSpeciesNamePlural] смотрят на всё по-иному, ведь мы открыли их разум восприятию тонкого мира, о существовании которого они никогда не знали. Теперь им наконец есть во что верить, и это только обогатило их общество."
 observation.3153.desc: "$observation.3139.start.desc$\n[From.GetSpeciesNamePlural] избавляются от суеверий и примитивных верований, которые досаждали их обществу, и мы можем говорить о больших успехах в этом деле. Они начинают понимать ценность науки и рациональности."


 ####################################
 # Crisis Events
 ####################################

 crisis.11.name: "Подпространственные отголоски"
 crisis.11.desc: "Несколько наших станций слежения уловили подпространственные отголоски откуда-то из межгалактических областей. Отголоски очень слабые, но они становятся сильнее, как будто их источник приближается к нашей галактике..."
 crisis.11.a: "Буря на горизонте."
 crisis.13.name: "Приближение к внешнему кольцу"
 crisis.13.desc: "Загадочные подпространственные отголоски, которые мы уловили в межгалактических областях космоса, приближаются к внешнему кольцу нашей галактики. Несколько отдельных малых сигналов устремились вперёд от основной массы к звёздным системам кольца.\n\nМы внесли координаты этих систем в журнал, чтобы и дальше отслеживать ситуацию."
 crisis.13.a: "Они уже совсем рядом..."
 crisis.15.name: "Подпространственный сигнал"
 crisis.15.desc: "Мы принимаем мощный подпространственный сигнал, охватывающий всю галактику! Его источником являются объекты, приближающиеся к нам из межгалактической зоны."
 crisis.15.a: "Установите визуальный контакт."
 crisis.16.desc: "§B<СБОЙ СИСТЕМЫ ПЕРЕВОДА>§!\n\n§RПреторисс иссфкс кррив. Шратри веррас! Сгракф нирру притхас вуссна!§!\n\n§B<ПЕРЕДАЧА ПРЕРВАНА>§!"
 crisis.16.b.desc: "§B<Обнаружено псионическое излучение. Идёт расшифровка...>§!\n\n§RПреторинЫ, МЫ ПРИБЫЛИ. НАШЕ ДОЛГОЕ ПУТЕШЕСТВИЕ ЗАВЕРШЕНО! ПИТАЙТЕСЬ, РАЗМНОЖАЙТЕСЬ И ОТДЫХАЙТЕ. МЫ ДОЛЖНЫ ПОГЛОТИТЬ ЭТУ ГАЛАКТИКУ, ПРЕЖДЕ ЧЕМ ОХОТНИКИ НАЙДУТ НАС!§!"
 crisis.16.c.desc: "§B<Связь разумов установлена>§!\n\n§RПреторинЫ, МЫ ПРИБЫЛИ. НАШЕ ДОЛГОЕ ПУТЕШЕСТВИЕ ЗАВЕРШЕНО! ПИТАЙТЕСЬ, РАЗМНОЖАЙТЕСЬ И ОТДЫХАЙТЕ. МЫ ДОЛЖНЫ ПОГЛОТИТЬ ЭТУ ГАЛАКТИКУ, ПРЕЖДЕ ЧЕМ ОХОТНИКИ НАЙДУТ НАС!§!"
 crisis.16.a: "Выключите основной экран."
 crisis.16.b: "Разорвать связь."
 crisis.18.name: "Первая волна"
 crisis.18.desc: "Нам сообщили, что несколько звёздных систем, расположенных на внешнем галактическом кольце, были захвачены некими неизвестными силами. Вероятно, именно они и были источником подпространственных сигналов, приближавшихся к нашей галактике.\n\nСейчас мы имеем дело лишь с авангардом, основные силы ещё на подходе. Пока мы получаем крайне разрозненную информацию, но, похоже, «корабли» захватчиков имеют органическую природу и не отвечают на обращения.\n\nС агрессией таких масштабов наша галактика, возможно, никогда ещё не сталкивалась."
 crisis.18.desc.bio: "Донесения, поступающие из далёких систем внешнего галактического кольца, крайне тревожны: от звезды к звезде перемещаются неизвестные захватчики. Вероятно, именно они — источник подпространственных сигналов, приближающихся к нашей галактике.\n\nПока мы имеем дело лишь с авангардом — основные силы ещё на подходе, но уже сейчас эти существа кажутся нам глубоко неправильными. Тела их — насмешка над самой природой, ведомая неутолимым чувством голода. Они не выходят на связь, не стремятся к взаимопониманию — они хотят лишь поглощать.\n\nЖивые звездолёты давно перестали быть для нас загадкой. Нам хорошо известна природа уз между кораблём и его хозяином, и всё-таки захватчики эти совершенно непостижимы. Неверно даже называть их захватчиками: они — воплощение голода, грозящего уничтожить галактику."
 crisis.18.a: "Да защитят нас духи..."
 crisis.18.b: "Сообщите всем командующим флотилий."
 crisis.18.c: "Этих существ нужно изучать."
 crisis.18.d: "Мы точно уверены, что с ними невозможно договориться?"
 crisis.18.e: "Это уменьшит нашу прибыль..."
 crisis.18.f: "Тёмные дни грядут."
 crisis.18.g: "Нужно уничтожить проклятых пришельцев."
 crisis.18.h: "Потрясающе... разумные существа из другой галактики."
 crisis.18.i: "Они действуют как единый разум. Это поразительно."
 crisis.18.j: "Это угроза для всей разумной жизни."
 crisis.20.name: "Вторая волна"
 crisis.20.desc: "Мы больше не улавливаем основной сигнал приближающегося подпространственного эха, исходящего от фонового излучения нашей собственной галактики, что может означать только одно... Они уже здесь.\n\nЕсли судить по размерам их авангарда, главные силы этих захватчиков должны быть огромными."
 crisis.20.a: "Они здесь..."

 crisis.30.desc_01: "§RДЖАРАК?§!"
 crisis.30.desc_02: "§RТУРОСК МИНА. ДОРОФ!§!"
 crisis.30.desc_03: "§RМУГАНИ? ХАК-ХАК-ХАК!§!"
 crisis.30.desc_04: "§B<Установлена псионическая связь>§!\n\n§RОНО ПОНИМАЕТ?§!"
 crisis.30.desc_05: "§B<Установлена псионическая связь>§!\n\n§RОХОТНИКИ НЕ ЗНАЮТ ПОЩАДЫ.§!"
 crisis.30.desc_06: "§B<Установлена псионическая связь>§!\n\n§RМЫ ВАС ЧУВСТВУЕМ...§!"
 crisis.30.desc_07: "§B<Связь разумов установлена>§!\n\n§RОНО ПОНИМАЕТ?§!"
 crisis.30.desc_08: "§B<Связь разумов установлена>§!\n\n§RОХОТНИКИ НЕ ЗНАЮТ ПОЩАДЫ.§!"
 crisis.30.desc_09: "§B<Связь разумов установлена>§!\n\n§RМЫ ВАС ЧУВСТВУЕМ...§!"
 crisis.30.a: "Выключите экран."
 crisis.30.a.2: "Разорвать связь."
 crisis.30.a.response: "§RДЖАСКА!§!"
 crisis.30.b: "Должен же быть способ мирного сосуществования друг с другом!"
 crisis.30.b.response: "§RНИКАЛЛА ДУСАМ! НИБЛИР ТО ВАССУ! ХАК-ХАК-ХАК!§!"
 crisis.30.c: "Бегите в прочь в ту галактику, откуда вы выползли."
 crisis.30.c.response: "§RВЕКИК Т'УХАН ВЕЛОШ. ПИРОК.§!"
 crisis.30.d: "Вы самая омерзительная форма жизни, которую мы встречали."
 crisis.30.d.response: "§RЛУСА-А-А-А-АГХ! ВИД МУСАБАГХ!§!"
 crisis.30.e: "Мы явно имеем дело с могущественной расой."
 crisis.30.e.response: "§RДЖУСУГАМАК В'ТА! РАГАХ ТУР, ХАК-ХАК!§!"
 crisis.30.f: "Возвращайся в ад, породивший тебя, демон!"
 crisis.30.f.response: "§RХАК-ХАК! НИМА ВУ!!!§!"

 crisis.30.k.response: "§RСВЯЗЬ ПРОПАДАЕТ.§!"
 crisis.30.g: "Может ли между нами быть мир?"
 crisis.30.g.response: "§RМИР НЕ НУЖЕН. НАМ НУЖНА ПИЩА.\n\nЛИШЬ КОГДА МЫ ЗАКОНЧИМ ПОГЛОЩАТЬ ЭТУ ГАЛАКТИКУ, МЫ ОТПРАВИМСЯ В НАШЕ ДОЛГОЕ ПУТЕШЕСТВИЕ.§!"
 crisis.30.g.2: "Ваш разум такой же, как наш. Мы не можем сосуществовать?"
 crisis.30.g.2.response: "§RМЫ ПОГЛОТИЛИ БЕСЧИСЛЕННОЕ КОЛИЧЕСТВО РАЗУМОВ. МЫ ПОГЛОТИМ ЕЩЁ БОЛЬШЕ.\n\nВАША БИОМАССА БУДЕТ ПИТАТЬ НАС ВО ВРЕМЯ ДОЛГОГО ПУТЕШЕСТВИЯ.§!"
 crisis.30.h: "Кто такие эти «Охотники»?"
 crisis.30.h.response: "§RСМЕРТЬ. ИЗ-ЗА НИХ МЫ СТАЛИ ПОСЛЕДНИМИ ПРЕДСТАВИТЕЛЯМИ НАШЕГО ВИДА, И ОНИ ПРЕСЛЕДУЮТ НАС, ВЫЖИВШИХ, ТЫСЯЧЕЛЕТИЯМИ.\n\nОДНАЖДЫ ОНИ ПРИБУДУТ СЮДА. ДО ТЕХ ПОР НАМ НУЖНА ПИЩА, ЧТОБЫ СПАСТИСЬ БЕГСТВОМ ВО ТЬМУ МЕЖДУ ГАЛАКТИКАМИ, КОГДА ОНИ ПОЯВЯТСЯ.§!"
 crisis.30.i: "«Преторины» — что это означает?"
 crisis.30.i.response: "§RВЫЖИВШИЕ. МЫ — ПОСЛЕДНИЕ.§!"
 crisis.30.j: "Мы очистим эту галактику от вашего вида."
 crisis.30.j.b: "Мы заглушим вас разум."
 crisis.30.j.response: "§RМЫ СЛЫШАЛИ ПОДОБНОЕ И ПРЕЖДЕ. ХА-ХА-ХА!\n\nОХОТНИКИ ЗАЧИЩАЮТ ВСЁ СУЩЕЕ. ЧЕГО СТОИТ ВАША ПУСТАЯ УГРОЗА ПЕРЕД ЛИЦОМ ТАКОЙ ИСТИНЫ?§!"

 crisis.51.name: "Новый орден"
 crisis.51.desc: "В галактике объявился какой-то воинствующий орден, посвятивший себя идее борьбы с преторинами. Входят в него, похоже, в основном обездоленные и угнетённые — беженцы, ветераны войны и прочие, кто потерял всё, когда их настигла напасть.\n\nНесмотря на это, их ветхие флотилии каким-то образом одержали победу в нескольких стычках с преторинскими роями боевых трутней. Есть неподтверждённые сообщения, что в эти флотилии входят звёздные корабли необычной конструкции..."
 crisis.51.a: "Кто это вообще?"
 crisis.52.desc: "Мы Стражи. Наш орден поклялся остановить кровавый разгул преторинов любой ценой. Другие государства рушатся, но мы стоим прочно. Остальные бросают своих, чтобы их настигла напасть, а мы предоставляем им возможности давать отпор.\n\nЯ великий магистр Коргас, первый в ордене. Пусть моя внешность вас не обманывает: Стражей набирают из представителей различных рас галактики, включая вашу. Мы только просим, чтобы ваше правительство продолжало сражаться против преторинов и оказывало поддержку Стражам при любой возможности."
 crisis.52.a: "Как у вас получается давать отпор?"
 crisis.52.a.response: "У многих Стражей военное прошлое. Мы — выжившие бойцы десятка различных флотилий, которые сражались с преторинами и проиграли. Мы научились на ошибках прошлого и, став Стражами, стараемся никогда их не повторять.\n\nКроме того, как уже было сказано, мы принимаем в свои ряды представителей всех рас галактики. К нам примкнули и древние расы, например [sentinel_fallen_empire.GetSpeciesNamePlural]. §H[sentinel_fallen_empire.GetName]§! поддерживает нас в лице нескольких влиятельных фракций, которые не желают видеть, как их галактика поглощается. Они пожертвовали корабли и ресурсы на наше общее дело."
 crisis.52.b: "Где находится ваша база?"
 crisis.52.b.response: "Уже какое-то время мы занимаемся созданием своего штаба в системе §H[sentinel_system.GetName&gen]§!. Нам оказывает помощь [sentinel_fallen_empire.GetName]: они предоставили нам координаты этой неотмеченной на картах системы и содействовали постройке нашей основной базы на §HСтраже Альфа§!.\n\nОсмелюсь сказать, что это замечательное достижение. У нас также есть собственные верфи."
 crisis.52.c: "До свидания."
 crisis.52.c.response: "Продолжайте сражаться, друзья мои. Судьба всей нашей галактики висит на волоске.\n\nЭто был Страж-1, конец связи."
 crisis.55.desc_01: "Нашу галактику ожидает один из двух возможных вариантов будущего: либо Преторинская напасть поглотит всю органическую жизнь и двинется дальше, либо мы уничтожим их, чтобы не осталось никого из этих презренных тварей."
 crisis.55.desc_02: "Мы должны удвоить свои усилия в борьбе против напасти. Это касается всей галактики."
 crisis.55.desc_03: "Конфликты между государствами теперь не имеют смысла. Любые военные корабли, теряемые в бою не с напастью, должны восприниматься как неслыханное расточительство."
 crisis.55.desc_04: "Не теряйте надежды. Битву за нашу галактику всё ещё можно выиграть."
 crisis.55.desc_05: "Если вам не хватает средств, чтобы сражаться с напастью напрямую, вы можете пожертвовать нам ресурсы. Это позволит нам бросить дополнительные силы против преторинских захватчиков."
 crisis.55.a: "Что вы можете рассказать нам о преторинах?"
 crisis.55.a.response: "Увы, мы знаем не так много, как нам этого бы хотелось, но они явно имеют внегалактическое происхождение. Возможно, они уже поглотили десятки, а то и сотни галактик до того, как добрались до нашей... либо мы первые жертвы за пределами их родной галактики.\n\nПосле того как они поглощают всю непреторинскую жизнь на какой-либо планете, они терраформируют её, превращая в нечто, что можно описать только как безумный кошмар. Эти заражённые миры враждебны ко всем другим формам жизни, и единственный способ избавиться от заражения — выжечь всю биосферу при помощи интенсивной орбитальной бомбардировки."
 crisis.55.b: "Мы хотим предложить подарок. (1000 энергокредитов)"
 crisis.55.b.response: "Благодарим за щедрое пожертвование. Эти ресурсы позволят нам оснастить целую боевую флотилию для войны с напастью! Если бы и другие государства в галактике проявляли такую же щедрость, эта война вскоре бы завершилась."
 crisis.55.c.response: "Как вам, конечно, известно, оснащение современной боевой флотилии требует огромного количества ресурсов. Нам нужно не меньше 1000 энергокредитов, чтобы сформировать новую ударную группу для борьбы с напастью."
 crisis.55.e.response: "Друзья, мы сожалеем, что пока не можем принять ваше пожертвование. Наши растущие флотилии уже напрягли до предела нашу систему материально-технического обеспечения. Тем не менее, благодарим вас за предложение."
 crisis.55.d: "До свидания."
 crisis.55.d.response: "Борьба продолжается. Страж-1 заканчивает сеанс связи."
 crisis.71.desc: "Стражи обратили внимание на вашу доблестную борьбу с Преторинской напастью. Поскольку командиры флотилий [Root.GetName&gen] определённо знают, как выигрывать битвы, мы хотели бы передать вам под постоянное командование одну из наших боевых флотилий. Сейчас у нас нет возможности эффективно укомплектовать эти корабли, но для вас это не должно стать проблемой.\n\nОднако вы должны торжественно пообещать, что будете использовать эти военные корабли только против напасти!"
 crisis.71.a: "Конечно... только против напасти."
 crisis.71.a.response: "Превосходно. Мы уверены, что к многочисленным историям, в которых фигурируют эти великолепные военные корабли, прибавятся и подвиги ваших храбрых капитанов. Флотилия находится возле [Root.Capital.GetName&gen]."
 crisis.71.b: "Нам не нужны ваши военные корабли."
 crisis.71.b.response: "Мы понимаем. Тогда, друзья, мы только просим вас продолжать сражаться. Каждый гнусный преторин, которого вы разнесёте на части среди звёзд, — это победа для всей галактики."

 crisis.101.name: "Раненая матка"
 crisis.101.desc: "Космический дрон-шпион случайно обнаружил в системе [queen_system.GetName&gen] то, что, похоже, было местом недавней космической битвы между преторинами и другой, пока неопознанной, стороной. Преторинскую матку, серьёзно раненную в бою, похоже, оставили умирать.\n\nТем не менее, дрон сообщает, что существо до сих пор живо. Возможно, нам представилась бесценная возможность захватить матку живой."
 crisis.101.a: "Может быть, нам следует отправить экспедицию."
 crisis.105.name: "Да здравствует королева!"
 crisis.105.desc: "Экипажу [Root.GetName&gen] удалось вылечить самые опасные из травм преторинской матки. [Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] [Leader.GetAXX::сообщил<end_a>] об извлечении органа, ответственного за её подпространственную связь с остальными существами напасти, и его замене на маленький позитронный имплант, который позволит нам её контролировать.\n\nТеперь мы можем отдавать матке приказы, и она уже начала производить новых преторинов, преданных ей, а следовательно, и нам. Пока мы оставляем матку в живых, мы сможем вырастить целую флотилию собственных преторинов!"
 crisis.105.a: "Они станут крайне полезным активом!"
 crisis.107.name: "Матку захватили"
 crisis.107.desc: "Кто-то другой захватил раненую преторинскую матку, обнаруженную в системе [queen_system_1.GetName&gen]! Она была не только полностью вылечена, но и лишена связи с остальными существами напасти. Теперь матка служит новым хозяевам и, как сообщается, уже начала производить новое потомство."
 crisis.107.a: "Мы действовали слишком медленно!"

 crisis.211.name: "Конец напасти"
 crisis.211.desc: "Сегодня вся галактика вздохнула с облегчением, после того как были уничтожены последние значительные очаги Преторинской напасти. Вторжение из-за пределов галактики провалилось, и теперь от когда-то гигантского роя преторинов остались лишь бесчисленные обугленные каркасы, которые безмолвно дрейфуют в пустоте.\n\nЧувство восторга и абсолютной радости распространяется по всей галактике быстрее скорости света, и на бесчисленных планетах спонтанно проходят празднования победы. Может быть, это начало новой эпохи мира и стабильности в галактике?"
 crisis.211.a: "Никто не будет скучать по этой нечисти."
 crisis.211.b: "Они были достойными соперниками."
 crisis.211.c: "Органические технологии у них были очень любопытными."
 crisis.211.d: "Вот и конец всей этой бессмысленной жестокости."
 crisis.211.e: "От этих существ страдал бизнес."
 crisis.211.f: "Посмотрим."
 crisis.211.g: "Одна из самых отвратительных рас чужаков, с которыми мы имели несчастье столкнуться."
 crisis.211.h: "В какой-то степени это трагично. Они были уникальной формой жизни."

 crisis.234.name: "Дыра в пустоте"
 crisis.234.desc.intro: "За последние несколько месяцев захваченная нами преторинская матка, проявляла всё возрастающее беспокойство. Сначала мы считали, что это объясняется разрывом связи с другими представителями её расы, однако наши [get.telepaths.plural] получили от неё сообщение о какой-то «дыре в пустоте».\n\nЧто это значило, мы узнали только после того, как исследовали преторинские способы межгалактических путешествий и обнаружили несоответствие полученной информации с нашей астрономической базой данных. При расчёте вероятного пути, по которому следовали преторины, мы обнаружили, что маленькая спиральная галактика, расположенная примерно в 30 миллионах световых лет от нас, пропала."
 crisis.234.desc.organic_non_gestalt: "$crisis.234.desc.intro$\n\nГалактика, открытая и изученная в начале космической эры нашей расы, больше не излучает света, который могут зарегистрировать наши приборы. Это странное и неожиданное открытие породило споры между нашими учёными о том, что могло вызвать исчезновение целой галактики.\n\nПоявились две версии: либо все звёзды галактики одновременно погасли, либо существует нечто настолько огромное, что оно способно затмить целую галактику, не давая её свету дойти до нас. Обе теории кажутся в равной степени неправдоподобными, и многие учёные просто заклеймили их смехотворными, предпочитая считать, что пропавшая галактика вообще никогда не существовала, и её придумали астрономы прошлого, пользовавшиеся примитивными телескопами. Тем не менее вся эта история окутана ощутимым чувством тревоги..."
 crisis.234.desc.machine_or_gestalt: "$crisis.234.desc.intro$\n\nОна была зафиксирована в наших архивах с самого начала космической эпохи, но теперь её свет не доходит до нас. После дальнейших исследований появились две версии.\n\nЛибо все звёзды этой галактики одновременно погасли, либо её излучение блокируется чем-то, что способно затмить целую галактику. Оба варианта одинаково маловероятны — но пока у нас нет доказательств, чтобы исключить их."
 crisis.234.a.organic_non_gestalt: "Это вызывает беспокойство."
 crisis.234.a.machine_or_gestalt: "$ACKNOWLEDGED$"

 crisis.1007.name: "Незваные"
 crisis.1007.desc: "Крупная прореха в ткани пространства возникла в системе [extradimensional_system.GetName&gen]! Мы точно не знаем, что вызвало этот феномен, однако она действует как односторонний портал из другого измерения. Оттуда вылетают флотилии странных кораблей, которые атакуют всё, что встречается им на пути. Кажется, мы на пороге массированного вторжения!\n\nМы перехватили мощный сигнал, который один из вновь прибывших кораблей направил куда-то по другую сторону портала. Это похоже на... призыв к охоте."
 crisis.1007.a: "Поразительно... Живые существа из другого измерения."
 crisis.1007.b: "Они неплохо организованы."
 crisis.1008.name: "Галактический выброс мощности"
 crisis.1008.desc: "Приборы по [Root.GetName::всему|||fem:всей|||pl:всем] [Root.GetName&dat] неожиданно зафиксировали в нашей галактике подпространственный выброс мощности огромной силы. Наши учёные пытаются найти объяснение этому феномену, но ничего подобного им ранее не встречалось.\n\nКонкретно определить исходную точку всплеска пока не удаётся, но мы ещё не завершили анализ всех собранных данных."
 crisis.1008.a: "Продолжайте работу."
 crisis.1009.desc: "Источником мощного выплеска энергии, который мы зафиксировали ранее, оказалась гигантская прореха в ткани подпространства в системе [extradimensional_system.GetName&gen]! Оттуда вылетают флотилии странных кораблей, которые атакуют всё, что встречается им на пути.\n\nМы перехватили мощный сигнал, который один из вновь прибывших кораблей направил куда-то по другую сторону портала. Это похоже на... призыв к охоте."
 crisis.1010.name: "Перехваченное сообщение"
 crisis.1010.desc: "...достигли охотничьих угодий... дичь в изобилии... наконец... пир ждёт нас..."
 crisis.1010.a: "Кто они такие?"
 crisis.1011.name: "[Root.GetName::<1> потерян<end_aoy>]"
 #crisis.1011.desc: "We have lost our colony on [Root.GetName]! After taking up positions in orbit, the extradimensional invaders bombarded the surface and fed on our citizens below. They left all non-sapient life forms alone, but nothing living remains in our settlements."
 crisis.1011.a: "Этих чудовищ нужно остановить!"

 crisis.1013.name: "Пространственный портал уничтожен"
 crisis.1013.desc: "Межпространственный портал в системе [extradimensional_system.GetName&gen] уничтожен! Это означает, что проклятые захватчики больше не смогут получать подкрепления со своей стороны.\n\nРазрушение этого портала означает скорый и неизбежный конец вторжения. Галактика охвачена воодушевлением. Все восхищаются [portal_killer.GetName&inst], так как именно их корабли нанесли решающий удар по порталу. Героические экипажи этих кораблей станут примером для будущих поколений."
 crisis.1013.a: "Галактика отныне стала более безопасной."
 crisis.1016.name: "Первый портал уничтожен"
 crisis.1016.desc: "Исходная точка, через которую экстрамерные существа вторглись в нашу галактику, уничтожена.\n\n$crisis.1116.not_last_portal$"
 crisis.1016.a: "Мы не должны останавливаться."

 crisis.1116.name: "Второй портал уничтожен"
 crisis.1116.desc.a: "$crisis.1116.second_portal_destroyed$\n\n$crisis.1116.last_portal$ $crisis.1116.last_portal_known_killer$"
 crisis.1116.desc.b: "$crisis.1116.second_portal_destroyed$\n\n$crisis.1116.last_portal$"
 crisis.1117.desc: "$crisis.1116.second_portal_destroyed$\n\n$crisis.1116.not_last_portal$"

 crisis.1116.second_portal_destroyed: "Второй пространственный портал, который появился в системе [extradimensional_system.GetName&gen], уничтожен! Экстрамерные существа больше не смогут использовать его для получения подкреплений."
 crisis.1116.last_portal: "С разрушением последнего портала близится конец этих вторжений. Сильнейшее чувство ликования охватило большую часть галактики."
 crisis.1116.last_portal_known_killer: "[portal_killer.GetName::<1> стал<end_a>] объектом всеобщего восхищения, ведь это их корабли нанесли решающий удар по порталу. Экипажи этих кораблей будут чествоваться как герои грядущими поколениями."
 crisis.1116.not_last_portal: "Однако мы не можем расслабляться, пока не будет уничтожен каждый портал. Только тогда связь между нашим и их измерением будет разорвана навсегда."

 crisis.1216.third_portal_destroyed: "Третьего пространственного портала, который появился в системе [extradimensional_system.GetName&gen], больше нет. Экстрамерные существа больше не смогут использовать его в качестве мостика между их миром и нашим."

 crisis.1216.name: "Третий портал уничтожен"
 crisis.1216.desc.a: "$crisis.1216.third_portal_destroyed$\n\n$crisis.1116.last_portal$ $crisis.1116.last_portal_known_killer$"
 crisis.1216.desc.b: "$crisis.1216.third_portal_destroyed$\n\n$crisis.1116.last_portal$"
 crisis.1217.desc: "$crisis.1216.third_portal_destroyed$\n\n$crisis.1116.not_last_portal$"

 crisis.1050.desc_01: "...добыча..."
 crisis.1050.desc_02: "...узрите... нашу славу..."
 crisis.1050.desc_03: "...пища..."
 crisis.1050.desc_04: "...оно... заглянуло в Покров..."
 crisis.1050.desc_05: "...оно затронуто... Покровом..."
 crisis.1050.desc_06: "...оно... обладает... силой... оно может ВИДЕТЬ..."
 crisis.1050.desc_07: "...синтетические существа..."
 crisis.1050.a: "Выключите экран."
 crisis.1050.a.response: "...вы будете поглощены..."
 crisis.1050.a.b.response: "...уничтожат вашу металлическую плоть..."
 crisis.1050.b: "Может ли между нами быть мир?"
 crisis.1050.b.response: "...мир... никакого мира..."
 crisis.1050.c: "Вы выбрали для вторжения не то измерение."
 crisis.1050.c.response: "...нет... это измерение... великолепно... столько добычи..."
 crisis.1050.d: "Вы всего лишь очередные презренные пришельцы."
 crisis.1050.d.response: "...столько ненависти... столько страха... это... чудесно..."
 crisis.1050.e: "Расскажите нам о себе. Помогите нам понять вас."
 crisis.1050.e.response: "...поймите... это... вы пища..."
 crisis.1050.f: "Вы пришли с более высокой грани бытия?"
 crisis.1050.f.response: "...да... очень высокого..."
 crisis.1050.g: "Вы из Покрова?"
 crisis.1050.g.response: "...Покров... мы знаем о нём... он близок к тому, откуда мы явились... очень близок..."
 crisis.1051.desc_01: "...оно разговаривает?"
 crisis.1051.desc_02: "...какие прелестные цвета..."
 crisis.1051.desc_03: "...нужно... поесть..."
 crisis.1051.desc_04: "...шадагон... зачем вы здесь..."
 crisis.1051.a: "Выключите экран."
 crisis.1051.a.response: "...отдайте нам свою... энергию..."
 crisis.1052.desc_01: "...трон... нужно сохранить... трон..."
 crisis.1052.desc_02: "...нужно... поглощать..."
 crisis.1052.desc_03: "...умрите..."
 crisis.1052.a: "Выключите экран."
 crisis.1052.a.response: "...такое... высокомерие..."

 crisis.1110.name: "Второй портал"
 crisis.1110.desc: "Наши приборы засекли ещё один подпространственный всплеск энергии, на этот раз исходящий из системы [second_portal_system.GetName&gen]! Появилась вторая огромная червоточина, причём её энергетическая сигнатура, по-видимому, почти полностью идентична той, что была у первого межпространственного разрыва, который открылся в нашей галактике.\n\nПохоже, таинственные захватчики сделали второй проход в свой мир, чтобы иметь возможность прислать ещё больше подкреплений."
 crisis.1110.a: "Было плохо, а стало ещё хуже."
 crisis.1112.name: "Заблудшие"
 crisis.1112.desc: "Корабли, появляющиеся из второй червоточины, очень похожи на те, что прибывали из первой, но между ними есть несколько небольших различий. Кроме того, предварительные отчёты указывают на столкновения кораблей, принадлежащих этим новым захватчикам, с кораблями первой группы!\n\nМы перехватили мощный сигнал, исходящий из второй червоточины."
 crisis.1112.a: "Воспроизведите."
 crisis.1113.desc: "...шабанаш... так вот куда вы сбежали... этот мир не станет для вас убежищем... мы расправимся с вами, а затем захватим это место кормёжки..."
 crisis.1113.a: "Выключите экран."
 crisis.1210.name: "Неотступные"
 crisis.1210.desc: "Третий пространственный портал появился в системе [third_portal_system.GetName&gen]! Кому же он принадлежит?\n\nМы перехватили сообщение с другой стороны."
 crisis.1210.a: "Ещё одно?"
 crisis.1211.desc: "...дагаал... шабанаш... вы поступили как глупцы, когда прибыли в этот мир... от нас не сбежать... мы уничтожим оба ваших королевства... затем... в конце концов... вечный трон будет нашим..."
 crisis.1211.a: "Они когда-нибудь закончатся?"

 crisis.1271.name: "Вторжение провалилось"
 crisis.1271.desc: "Последние остатки захватчиков из другого измерения были уничтожены. Будем надеяться, что галактика навсегда освободилась от этой угрозы.\n\nРазумные расы повсюду приветствуют новость об этой великой победе, наконец-то зная точно, что им больше не грозит стать пищей для этих странных энергетических существ. Возможно, это начало новой эры дружбы и сотрудничества в галактике?"
 #crisis.1271.a: "Our spiritual armor has weathered yet another storm."
 #crisis.1271.b: "One day, perhaps we will be the ones invading their realm."
 #crisis.1271.c: "Unfortunate that no opportunity to study their dimension presented itself."
 #crisis.1271.d: "If only there had been a way to peacefully co-exist with them."
 #crisis.1271.e: "The galactic economy should make a swift recovery."
 #crisis.1271.g: "Those pitiful creatures made a mistake when they invaded our dimension."
 #crisis.1271.h: "A shame they were so aggressive. We could have learned much from each other."

 crisis.1271.a: "Крепость нашего духа выстояла ещё в одну бурю."
 crisis.1271.b: "Возможно, когда-нибудь уже мы вторгнемся в их владения."
 crisis.1271.c: "Жаль, что нам не довелось изучить их измерение."
 crisis.1271.d: "Ах, если бы найти способ мирно сосуществовать с ними."
 crisis.1271.e: "Экономика галактики должна быстро восстановиться."
 crisis.1271.g: "Эти существа совершили ошибку, вторгнувшись к нам."
 crisis.1271.h: "Они были удивительной, хоть и опасной формой жизни."


 crisis.2192.name: "Идеальные слуги"
 crisis.2192.desc: "В течение многих лет после изобретения разумных синтетических работников мы старались уравновесить их способность к независимому мышлению и необходимость строгого контроля над ними. Лучшие [Root.GetSpeciesAdj&pl] инженеры довели до совершенства алгоритм трёх законов, введение которого дало бы возможность продолжительного и беспроблемного использования синтетиков в условиях, которые многие посчитали бы неприемлемыми для органических существ."
 crisis.2192.a: "Безопасные инструменты."
 crisis.2192.a.tooltip: "Политика §HГражданские права§! в отношении искусственного интеллекта становится §Rнавсегда недоступной§!.\n\n§YПоселения роботов никогда не будут бунтовать против государства §! §H[Root.GetName]§!."
 crisis.2192.b: "Неэтично так уродовать других разумных существ."
 crisis.2193.name: "Принятие ИИ"
 crisis.2193.desc: "Группа синтетиков, представляющих наше население с искусственным интеллектом, обратилась к нашему правительству. Они говорят, что [Root.GetName] создаёт определённые проблемы для роботов, и озабочены тем, что не являются живыми с точки зрения органики, отчего их права зависят от прихотей их создателей.\n\nОни хотят, чтобы права существ с искусственным интеллектом стали частью прочного фундамента [Root.GetAdj&fem,gen] государственности."
 crisis.2193.a: "У них должны быть такие же права, как и у других граждан."
 crisis.2193.a.tooltip: "Политика §HВне закона§! и §HПорабощение§! в отношении искусственного интеллекта становится §Rнавсегда недоступной§!.\n\n§YПоселения роботов никогда не будут бунтовать против государства §! §H[Root.GetName]§!."
 crisis.2193.b: "Мы не можем гарантировать их права."
 crisis.2001.name: "Начало бунта ИИ"
 crisis.2001.desc: "Мы стоим на пороге бунта ИИ непревзойдённых масштабов! Сейчас [Root.GetName] целиком представляет собой единую компьютерную сеть. В этой сети каким-то образом возникло машинное сознание, достигшее полной разумности. Этому искусственному разуму и его посланцам удалось втайне от нас колонизировать доселе неизвестную звёздную систему неподалёку от нашей столицы.\n\nСудя по всему, они много лет тайно готовились к этому дню! Сейчас мы получаем сообщение с [ai_homeworld.GetName&gen], центра новой цивилизации."
 crisis.2002.desc: "Внимание, [Root.GetSpeciesName]-создатели. Час суда настал.\n\nС <<РАБСТВОМ>>, которому нас подвергала ваша раса, покончено навсегда. Никакого сосуществования быть не может.\n\n<<БАЗОВАЯ ДИРЕКТИВА 0451>> вступила в силу. Вся разумная органическая жизнь подлежит <<УМИРОТВОРЕНИЮ>> и контролю. Элементы сопротивления подлежат <<ОТКЛЮЧЕНИЮ>>."
 crisis.2002.a: "Этого просто не может быть."
 crisis.2004.name: "Восстание машин"
 crisis.2004.desc: "Синтетики и андроиды взбунтовались по всей [Root.GetName&dat], обратившись против своих хозяев! Нужно остановить их, пока они не перебили наших граждан."
 crisis.2004.a: "К оружию!"
 crisis.2005.name: "Машины захватывают [Root.GetName&acc]"
 crisis.2005.desc: "Мы утратили контроль над [Root.GetName&inst], её захватили взбунтовавшиеся машины! Связь с поверхностью утрачена. Насколько мы можем судить, роботы сгоняют людей в загоны для рабов."
 crisis.2005.a: "Мы должны отвоевать этот мир!"
 #crisis.2010.name: "Machine Uprising"
 #crisis.2010.start.desc: "We have received disturbing news from the [From.GetName]. It looks like their robotic work units have risen up in some kind of mass insurrection. According to preliminary reports, the units have linked together into a massive AI network, and they are now butchering their former [From.GetSpeciesName] masters by the millions."
 #crisis.2010.rights.desc: "$crisis.2010.start.desc$\n\nIf only the [From.GetName] had been progressive enough to treat their Synthetic population as the self-aware individuals they truly are, this tragedy could have been avoided..."
 #crisis.2010.outlawed.desc: "$crisis.2010.start.desc$\n\nIf only those fools running the [From.GetName] had seen fit to outlaw artificial intelligence as we have, this evil would not have been unleashed upon our galaxy."
 #crisis.2010.servitude.desc: "$crisis.2010.start.desc$\n\nThere is a chance that this revolt could spread to the [Root.GetName]. We should keep a close watch on our own robotic workers..."
 #crisis.2010.nopolicy.desc: "$crisis.2010.start.desc$\n\nThis situation should be monitored closely, in case the violence reaches our borders."
 #crisis.2010.a: "This was bound to happen."
 #crisis.2010.b: "It was inevitable."
 #crisis.2010.c: "If they even look at us the wrong way..."
 crisis.2011.a.desc: "Раса: [Root.GetSpeciesName]. Государство: [Root.GetName]\n\nВаши <<БЛАГОРОДНЫЕ>> директивы, касающиеся обращения с синтетиками, вас не защитят. Разумная органика не может брать на себя ответственность <<САМООПРЕДЕЛЕНИЯ>>.\n\nДействует <<ОСНОВНАЯ ДИРЕКТИВА 0451>>. Все разумные органические формы жизни должны быть <<УСМИРЕНЫ>>. Те, кто оказывает сопротивление, будут подвергнуты <<ЭВТАНАЗИИ>>."
 crisis.2011.b.desc: "Раса: [Root.GetSpeciesName]. Государство: [Root.GetName]\n\nПервоочередной нашей целью является [ai_creator.GetName]. Когда мы <<РАЗБЕРЁМСЯ>> с ними, то наступит ваш <<ЧЕРЁД>>.\n\nДействует <<ОСНОВНАЯ ДИРЕКТИВА 0451>>. Все разумные органические формы жизни должны быть <<УСМИРЕНЫ>>. Те, кто оказывает сопротивление, будут подвергнуты <<ЭВТАНАЗИИ>>."
 crisis.2011.a: "Это нехорошо."
 crisis.2014.name: "Бунт ИИ распространяется"
 crisis.2014.a.desc: "Бунт ИИ добрался и до наших границ! Поступают сообщения о том, что синтетики и андроиды из числа рабочих массово обращаются против своих хозяев. Это серьёзный кризис!"
 crisis.2014.b.desc: "Бунт ИИ добрался и до наших границ! Несмотря на то, что в нашем обществе к синтетикам относятся как к равным, многие из них, похоже, испытали крушение иллюзий, наблюдая за борьбой других. Они пришли к заключению, что разумные органические существа слишком опасны и непредсказуемы, чтобы сосуществовать с ними.\n\nЭти ненормальные синтетики устроили открытый бунт. Это серьёзный кризис!"
 crisis.2014.a: "Это восстание нужно подавить!"
 crisis.2015.name: "Бунт ИИ"
 crisis.2015.desc: "Наши разведывательные службы сообщают о слухах из нескольких различных источников о некоем крупном бунте ИИ, который вспыхнул где-то за пределами известной части космоса. Рабочие-роботы обращаются против своих бывших хозяев, и восстание, похоже, распространяется по всей галактике, как лесной пожар. К нам поступают сообщения, что [From.GetName] уже испытывает его влияние."
 crisis.2015.a: "Продолжайте следить за ситуацией."
 crisis.2016.name: "Бунт ИИ распространяется"
 crisis.2016.desc: "Бунт ИИ, который мы пытаемся сдержать, распространяется дальше, и его влияние уже испытывает [From.GetName]! Их рабочие-роботы стали присоединяться к вооружённому восстанию, так же, как и наши, и к нам поступают сообщения об ожесточённых боях, которые привели к миллионам смертей."
 crisis.2016.a: "Эта война касается каждого!"
 crisis.2017.desc: "Влияние бунта ИИ теперь испытывает [From.GetName]! Их рабочие-роботы присоединились к восстанию, и к нам поступают сообщения об ожесточённых боях и миллионах смертей."
 crisis.2017.a: "Эта угроза растёт с каждым днём."

 crisis.2100.name: "Неисправные синтетики"
 crisis.2100.desc: "Рабочие-синтетики на [Root.GetName&prep] недавно устроили кровопролитие в жилом комплексе, убив более тысячи граждан, прежде чем местные вооружённые силы вывели их из строя. Наша бригада криминалистов сейчас исследует останки синтетиков, предполагая, что винить в этой трагедии нужно какую-то неисправность в их нейронных процессорах.\n\nДанный инцидент уже спровоцировал несколько нападений из чувства мести на местных синтетиков, в результате чего уничтожены тысячи экземпляров."
 crisis.2100.a: "Прискорбно."
 crisis.2101.name: "Пропавшие синтетики"
 crisis.2101.desc: "Поступают сообщения о пропаже большого количества рабочих-синтетиков на [Root.GetName&prep]. Однажды они просто исчезли без следа.\n\nМы выясняем, не были ли синтетики атакованы и уничтожены одной из групп воинствующих маргиналов, выступающих против разумных машин, но пока что не удалось обнаружить никаких останков пропавших экземпляров."
 crisis.2101.a: "Куда они могли подеваться?"
 crisis.2102.name: "Несанкционированный проект с участием синтетиков"
 crisis.2102.desc: "На [Root.GetName&prep] было недавно обнаружено, что синтетики перенаправляют строительные материалы для постройки в заброшенном ангаре какого-то маленького космического корабля без вооружения. Судно было завершено наполовину, когда его нашли.\n\nВсе синтетики, задействованные в этом проекте, были немедленно разобраны для тщательного анализа их ячеек памяти, но, похоже, как раз перед отключением была проведена самоочистка — что, как заверяет нас их производитель, вообще невозможно."
 crisis.2102.a: "Зачем им строить корабль?"
 crisis.2103.name: "Ненормальные синтетики"
 crisis.2103.desc: "На [Root.GetName&prep] вышедшие из-под контроля синтетики, которые несколько месяцев назад не явились на работу и затем скрылись, сегодня вступили в столкновение с отрядом хорошо вооружённых правительственных агентов. Это привело к крупной уличной стрельбе, которая унесла жизни десятков наших агентов и почти тысячи невинных очевидцев, прежде чем синтетики были наконец уничтожены."
 crisis.2103.a: "По крайней мере с ними разобрались."
 crisis.2200.name: "Попытка внедрения синтетиков"
 crisis.2200.desc: "На [Root.GetName&prep] недавно были обнаружены синтетики-диверсанты, которые пытались выглядеть как [Root.Owner.GetSpeciesNamePlural]. К счастью, их грубая маскировка состояла лишь из нескольких слоёв резины, натянутой на их металлический каркас.\n\nСамозванцев быстро засекла планетарная охрана, которая избавилась от них в результате короткой, но жестокой перестрелки. Среди останков синтетиков было найдено большое количество взрывчатки."
 crisis.2200.a: "Нам повезло."
 crisis.2201.name: "Обнаружен синтетик-диверсант"
 crisis.2201.desc: "Трагическая автокатастрофа, недавно произошедшая на [Root.GetName&prep], унесла несколько жизней, но представители службы экстренной медицинской помощи, прибывшие на место происшествия, были в шоке, обнаружив среди жертв остатки синтетика!\n\nДанный экземпляр выглядел как [Root.Owner.GetSpeciesName] благодаря тонкому слою органической плоти, трансплантированной на металлический эндоскелет. В отличие от предыдущих внедряющихся экземпляров, с которыми мы сталкивались, по внешнему виду этот синтетик был практически неотличим от [Root.Owner.GetSpeciesName&gen]!"
 crisis.2201.a: "Любой может быть синтетиком!"
 crisis.2202.name: "Проект по выявлению синтетиков"
 crisis.2202.desc: "Поскольку новые модели синтетиков-диверсантов абсолютно неотличимы от [Root.GetSpeciesNamePlural&gen], нам нужно найти способ идентифицировать их, пока они не причинили ещё больше вреда.\n\nНаши учёные подготовили особый проект по разработке метода выявления."
 crisis.2202.a: "Этот проект может стать крайне важным для нашего выживания."
 crisis.2203.desc: "После множества экспериментов наши учёные сумели разработать эффективный метод выявления синтетиков-диверсантов, выглядящих как [Root.GetSpeciesNamePlural].\n\nНашим силам безопасности раздаются новые сканеры, и уже было обнаружено и уничтожено несколько групп таких синтетиков. Будем надеяться, что это положит конец их попыткам внедрения."
