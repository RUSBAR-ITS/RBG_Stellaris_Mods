 admiral_trait_gain: "Командир [officer.GetAXX::получил<end_a>] черту"
 admiral_trait_loss: "Командир [officer.GetAXX::потерял<end_a>] черту"
 leader.1.name: "Многообещающий офицер"
 leader.1.desc: "Капитан [officer.GetName], командир [ship.GetName&gen], [officer.GetAXX::отличи<end_lsya>] во время недавнего сражения в системе [system.GetName&gen]. Адмиралтейство [Root.Capital.GetName&gen], отдавая должное талантам многообещающего офицера, решило повысить [officer.GetHerHis] в звании."
 leader.1.desc.machine: "[officer.GetName] [officer.GetAXX::получил<end_a>] повышение в результате успешной обработки повышенной нагрузки во время боя на [ship.GetName&prep] в системе [system.GetName&gen]."
 leader.1.desc.hive: "[officer.GetName] [officer.GetAXX::получил<end_a>] [GetLeaderStatusAdj] статус после регистрации аномально эффективных реакций во время недавнего боевого столкновения [ship.GetName&gen] в системе [system.GetName&gen]."
 new_admiral: "К нам присоединяется новый §Hкомандир§!."
 leader.newadmiraltrait.desc.machine: "[officer.GetName] [officer.GetAXX::получил<end_a>] новый тактический набор данных, проанализировав векторы признаков в недавнем боевом столкновении в системе [system.GetName&gen]."
 leader.lostadmiraltrait.desc.machine: "После анализа недавнего боевого столкновения в системе [system.GetName&gen] [officer.GetName] [officer.GetAXX::пересмотрел<end_a>] свои боевые протоколы."
 leader.newadmiraltrait.desc.hive: "Сражение в системе [system.GetName&gen] положило начало новой экспрессии генов у офицера [officer.GetName]."
 leader.lostadmiraltrait.desc.hive: "Битва в системе [system.GetName&gen] послужила причиной снижения поведенческих аномалий у офицера [officer.GetName]."
 leader.5.desc: "После недавней победы в системе [system.GetName&gen] командир [officer.GetName], похоже, [officer.GetAXX::заинтересова<end_lsya>] военной теорией. Теперь [officer.GetSheHe] экспериментирует с совершенно новыми стратегиями и тактиками."
 leader.6.desc: "Похоже, командир [officer.GetName] почувствовала себя [officer.GetAXX::охотником|||fem:охотницей] после недавней победы в системе [system.GetName&gen] и ведёт себя гораздо более агрессивно, чем раньше."
 leader.7.desc: "Приведя флотилию «[From.From.GetName]» к победе в системе [system.GetName&gen], командир [officer.GetName] теперь необычайно [officer.GetAXX::уверен<end_a>] в себе и не допускает даже мысли об отступлении из будущих сражений."
 leader.8.desc: "После своей недавней победы в системе [system.GetName&gen] командир [officer.GetName] всё время подчёркивает важность скорости и быстрых манёвров, проводя инструктаж флотилии. [officer.GetSheHeCap] экспериментирует с новыми вариантами боевого порядка и построениями, чтобы добиться наибольшей манёвренности от космических кораблей под [officer.GetHerHis] командованием."
 leader.9.desc: "Приведя флотилию «[From.From.GetName]» к победе в системе [system.GetName&gen], командир [officer.GetName] [officer.GetAXX::стал<end_a>] вести себя гораздо энергичнее и инициативнее, чем раньше. [officer.GetHerHisCap] боевые качества значительно улучшились."
 leader.10.desc: "После недавнего поражения в системе [system.GetName&gen] командир [officer.GetName] [officer.GetAXX::начал<end_a>] проявлять крайнюю осмотрительность. Теперь [officer.GetSheHe] ведёт себя гораздо более осторожно и дотошно при размещении кораблей, находящихся под [officer.GetHerHis] командованием."
 leader.11.desc: "После своего недавнего поражения в системе [system.GetName&gen] командир [officer.GetName] [officer.GetAXX::начал<end_a>] проявлять чрезмерную робость и неуверенность в себе. Очевидно, что [officer.GetSheHe] уже не сможет командовать столь же крупными войсковыми соединениями, как раньше."
 leader.12.desc: "Флотилия «[Root.GetName]» переживает не лучшие дни, и командир [officer.GetName], похоже, слишком близко к сердцу [officer.GetAXX::принял<end_a>] отступление из сражения в системе [system.GetName&gen]. [officer.GetName] [officer.GetAXX::решил<end_a>] больше никогда не покидать поле боя и в своём следующем сражении намеревается сражаться до последнего."
 leader.13.desc: "[officer.GetName] [officer.GetAXX::сообщил<end_a>], что [officer.GetHerHim] пришлось разогнать двигатели кораблей до предела во время отступления флотилии «[Root.GetName]» из боя в системе в системе [system.GetName&gen]. Благодаря этому [officer.GetName] [officer.GetAXX::научи<end_lsya>] выжимать дополнительную скорость из кораблей под [officer.GetHerHis] командованием."
 leader.14.desc: "После своего поражения в недавней битве в системе [system.GetName&gen] командир [officer.GetName] почти [officer.GetAXX::перестал<end_a>] с кем-либо общаться и всё время находится в угнетённом состоянии. Офицеры под [officer.GetHerHis] командованием докладывают, что теперь [officer.GetSheHe] выполняет свои обязанности с гораздо меньшим рвением, чем раньше."
 leader.optimizations.desc.machine: "[officer.GetName] [officer.GetAXX::обновил<end_a>] свои эвристические алгоритмы командования флотом."
 leader.optimizations.desc.hive: "[officer.GetName] [officer.GetAXX::стал<end_a>] искуснее в обращении с флотилиями."
 leader.15.desc: "Наблюдая за ремонтом флотилии «[Root.GetName]», командир [officer.GetName] [officer.GetAXX::приобрел<end_a>] новые технические навыки. Ремонтные бригады под [officer.GetHerHis] командованием теперь могут чинить корабли прямо на поле боя."
 leader.16.desc: "Получив опыт командования такой крупной флотилией, как «[Root.GetName]», командир [officer.GetName] теперь [officer.GetAXX::открыл<end_a>] в себе бесценные организаторские способности и теперь может эффективно управлять ещё большими флотилиями."
 leader.17.desc: "Приведя флотилию «[From.From.GetName]» к победе в системе [system.GetName&gen], командир [officer.GetName] вновь [officer.GetAXX::почувствовал<end_a>] уверенность в себе. Теперь [officer.GetSheHe] вполне справится с командованием крупной флотилией."
 leader.18.desc: "Командуя флотилией «[Root.GetName]», командир [officer.GetName] [officer.GetAXX::научи<end_lsya>] экономить ресурсы, чтобы значительно снизить расходы на эксплуатацию всех кораблей."
 leader.19.desc: "После недавнего сканирования системы [system.GetName&gen] командир [officer.GetName] [officer.GetAXX::научи<end_lsya>] размещать свои корабли таким образом, чтобы максимально увеличить дальность действия их сенсоров. Немногие командиры флотилий могут мастерски выполнять столь сложные манёвры."

 leader.newtrait: "Благодаря трудолюбию и опыту §H[From.From.GetName]§! [From.From.GetAXX::приобр<end_yolla>] новые навыки."
 leader.substanceabuser: "Мы получили довольно тревожные сообщения о том, что §H[From.From.GetName]§! показывает признаки ухудшающегося здоровья. Из-за [From.From.GetHerHis] измождённого вида кажется, будто [From.From.GetSheHe] старше почти на 20 лет. Служебные обязанности могут быть тяжким бременем."
 leader.arresteddevelopment: "Несмотря на недавнее улучшение навыков в связи с накопленным опытом, §H[From.From.GetName]§!, похоже, [From.From.GetAXX::близок|||fem:близка] к пределу своих возможностей."
 leader.lethargic: "Несмотря на недавнее улучшение навыков, §H[From.From.GetName]§!, похоже, [From.From.GetAXX::утратил<end_a>] былую инициативность и решимость, которые двигали [From.From.GetHerHis] вперёд. Они постепенно сошли на нет."
 leader.stubborn: "§H[From.From.GetName]§! [From.From.GetAXX::стал<end_a>] гораздо опытнее, но вместе с тем выросло [From.From.GetHerHis] упрямство. Ум [From.From.GetHerHis] закоснел, и теперь [From.From.GetSheHe] крайне неохотно принимает новые идеи."


 leader.30.name: "ИИ-помощники устранены"
 leader.30.desc: "В соответствии с недавними изменениями в нашей политике, связанными с объявлением искусственного интеллекта вне закона, все [Root.GetAdj&pl] учёные с §Yразумными ИИ-помощниками§! обязаны сдать их для утилизации."

 ##########################
 # Diplomatic Events
 ##########################

 diplomatic.2.name: "[From.From.Owner.GetAdj&masc] командир оскорбляет нас"
 diplomatic.2.desc: "Хорошо известно, что [From.From.Owner.GetSpeciesNamePlural] не слишком лестно отзываются об инопланетных формах жизни. Те, кто занимается дипломатией в [From.From.Owner.GetName&prep], должны уметь держать себя в руках, ведь они редко могут надеяться на что-то большее, чем абсолютный минимум уважения, да и то не всегда. Когда [From.From.Owner.GetSpeciesNamePlural] пересекают [Root.GetAdj&fem,acc] территорию, то при обмене сообщениями они обычно придерживаются официальных протоколов.\n\nОднако буквально сегодня, ведя флотилию через систему [From.From.System.GetName&gen],[broadcasted_insult_leader.GetName] вдруг решает обрушить на нашу ничего не подозревающую общественность абсолютно издевательское сообщение. Командир, похоже, настроился на радиоволну одной с наших колоний и завёл долгую проповедь о нашей культуре и эволюционных истоках. Это услышали миллионы, как явно и планировалось. Повсюду негодование."
 diplomatic.2.a: "Пусть [From.From.Owner.GetName] немедленно уволит этого негодяя!"
 diplomatic.2.b: "Пусть командир доставят нам! [broadcasted_insult_leader.GetName] заслуживает казни!"
 diplomatic.2.c: "Это всего лишь слова. Мы не можем позволить себе быть мелочными."
 diplomatic.3.name: "Командир оскорбляет расу [From.GetSpeciesNamePlural]"
 diplomatic.3.desc: "Хотя [From.GetSpeciesNamePluralInsult] или чужаки вообще — это те, в чьём обществе мало кому из нас нравится находиться, всё же большинство старается не объявлять о своей неприязни в неподходящее время. Командир [broadcasted_insult_leader.GetName], очевидно, не имеет подобных соображений, иначе как объяснить злобные нападки в радиоэфире на [From.GetAdj&fem,acc] расу, при пересечении [From.GetAdj&fem,gen] территории? Целый набор утверждений об их неполноценности вызвал не только ожидаемые пересуды на [Root.GetHomeWorldName], но также привёл к дипломатическому конфликту с местным населением.\n\n[Root.GetHomeWorldName&dat], но также привёл к дипломатическому конфликту с местным населением.\n\n[broadcasted_insult_leader.GetName] тут же в частном порядке приносит извинения, утверждая, что причиной раздражения стало прослушивание местного радиоканала. [From.GetAdj&neut] правительство призывает к тому, чтобы оскорбивший их командир немедленно подал в отставку."
 diplomatic.3.a: "Не подобает командиру обладать таким неуправляемым темпераментом."
 diplomatic.3.b: "Это был забавный радиоэфир. Мы не можем увольнять за такое!"
 diplomatic.4.desc: "Хотя [From.GetSpeciesNamePluralInsult] или чужаки вообще — это те, в чьём обществе мало кому из нас нравится находиться, всё же большинство старается не объявлять о своей неприязни в неподходящее время. Командир [broadcasted_insult_leader.GetName], очевидно, не имеет подобных соображений, иначе как объяснить злобные нападки в радиоэфире на [From.GetAdj&fem,acc] расу, при пересечении [From.GetAdj&fem,gen] территории? Целый набор утверждений об их неполноценности вызвал не только ожидаемые пересуды на [Root.GetHomeWorldName], но также привёл к дипломатическому конфликту с местным населением.\n\n[Root.GetHomeWorldName&dat], но также привёл к дипломатическому конфликту с местным населением.\n\n[broadcasted_insult_leader.GetName] тут же в частном порядке приносит извинения, утверждая, что причиной раздражения стало прослушивание местного радиоканала. [From.GetAdj&neut] правительство призывает к тому, чтобы оскорбивший их командир был казнён после экстрадиции на [From.GetHomeWorldName&acc]."
 diplomatic.4.a: "Одна жизнь — это малая цена за решение конфликта миллионов."
 diplomatic.4.b: "Мы не выдадим одного из наших чужакам, жаждущим убийства!"
 diplomatic.5.name: "[From.GetName] увольняет командира"
 diplomatic.5.desc: "После настоятельной просьбы наших дипломатов выбирать своих лидеров более тщательно [From.GetRulerName] решает, что [broadcasted_insult_leader.GetName] больше не будет занимать свою должность. Командир не уходит молча, а клянётся, что восстановит своё доброе имя, надеясь, что в будущем [Root.GetName] увидит к себе более агрессивное [From.GetSpeciesName]crjt отношение.\n\nТем не менее, [From.GetName] чётко заявляет о своих будущих экспедициях на нашу территорию следующее: даже если им, возможно, и не нравится иметь дело с чужими расами, но [Root.GetSpeciesNamePlural] заслуживают уважения хотя бы на собственной территории."
 diplomatic.5.a: "Надеемся, они будут придерживаться этого курса."
 diplomatic.6.name: "[From.GetName] экстрадирует командира"
 diplomatic.6.desc: "После непродолжительных переговоров [broadcasted_insult_leader.GetName] передаётся нам для осуществления наказания. Тщательно взвесив, каким может быть адекватное наказание за оскорбление нашей расы, мы, [Root.GetSpeciesName], считаем, что в этом случае можно выбрать только смерть и полное уничтожение.\n\nТак и не раскаявшись в своём поступке до последних мгновений жизни, дерзкий командир завёл страстную речь о том, какие мы дикари, но она прервалась, как только шлюзовая камера закрылась и капсула с преступником была запущена на околосветовой скорости в самое сердце звезды [Root.Capital.StarName]. Чудесный огонь, светивший по ночам нашим предкам, сожжёт всё, не оставив и следа от любого, кто смеет плохо высказываться о них."
 diplomatic.6.a: "Больше мы не услышим такие клеветнические слова."
 diplomatic.7.name: "[From.GetName] защищает командира"
 diplomatic.7.desc: "Наше требование о том, что командир [broadcasted_insult_leader.GetName] должен быть снят с должности, было встречено с шокирующим отсутствием понимания. [From.GetRulerTitle] [From.GetRulerName] и [From.GetAdj&neut] правительство ответили тем, что в основном пытались извиниться за поведение командира, в то же время намекая — возможно, непреднамеренно — на то, что среди высказываний, которые услышали в свой адрес [Root.GetSpeciesNamePlural], что-то могло быть и правдой.\n\nМы полагали, что это был поступок одного глупца, а оказалось, что [From.GetName] одобряет такие вещи. Очевидно, они считают, что наш народ можно оскорблять и порочить безо всяких последствий."
 diplomatic.7.a: "Крона прогнила так же, как и ветки."
 diplomatic.8.name: "Возвращение опального командира"
 diplomatic.8.desc: "Командир, которого однажды изгнали из нашего флота из-за дипломатического скандала, вызванного оскорбительной речью в радиоэфире, пытается организовать своё возвращение. Теперь, когда идёт война, многие из утверждений, имевшихся в оригинальном сообщении, являются пропагандистскими штампами, которые народ слышит каждый день, что оправдывает поступки командира, особенно для военных.\n\nИ хотя изменение нашего решения теперь может подорвать доверие к правительству, но, возможно, лучшего командира для этой войны нам не найти."
 diplomatic.8.a: "Нам нужен кто-то, кто сможет сплотить народ!"
 diplomatic.8.b: "Когда-то мы приняли правильное решение и от него не отступим."
 diplomatic.10.name: "Исследователи подозревают чужие корабли"
 diplomatic.10.desc: "[Root.GetName] — это место, прославившееся своими научно-образовательными стандартами и стремлением к инновациям, но нахождение на передовом крае требует осмотрительности не только в том, как проводятся исследования, но и в том, кто получит их результаты. Наши коммерческие тайны высоко ценятся как на внутреннем рынке, так и по всей галактике, и некоторые учёные сильно остерегаются незаконных попыток доступа к их данным.\n\nПрисутствие на нашей территории [From.From.Owner.GetAdj&pl,gen] научных кораблей заставило многие исследовательские учреждения подозревать их в шпионаже. Некоторые исследователи заявили, что не могут продолжать работать при наличии такой ощутимой угрозы, и потребовали, чтобы эти подозрительные [From.From.Owner.GetSpeciesNamePlural] были выдворены, а границы для них — закрыты."
 diplomatic.10.a: "Наши учёные должны быть в безопасности. Закрыть границы."
 diplomatic.10.b: "На научных кораблях работают такие же исследователи, как и у нас."
 diplomatic.11.name: "[From.GetName] закрывает границы"
 diplomatic.11.desc: "Присутствие ваших научных кораблей на [From.GetAdj&fem,gen] территории заставило нас сомневаться в ваших мотивах. Наши исследователи считают, что ваши учёные не проводят изыскания, а воруют исследовательские данные. Чтобы сохранить наши ценные коммерческие тайны, мы вынуждены запретить вам доступ на нашу территорию."
 diplomatic.11.a: "Тревожные времена наступили, раз учёные не доверяют друг другу."
 diplomatic.12.name: "[From.From.GetName] подозревается в картировании генома"
 diplomatic.12.desc: "Бдительность в отношении угроз со стороны чужаков всегда была одним из наших приоритетов с тех пор, как мы впервые покинули родной дом под названием [Root.GetHomeWorldName]. [From.From.GetAdj&pl] научные корабли, которые шныряют по нашей территории, не остались незамеченными, но до сих пор предполагалось, что они мирно изучают планеты. Однако недавно появилась теория, заставляющая в этом усомниться.\n\nИзвестно, что [From.From.GetSpeciesName] используют картирование генома в своих медицинских исследованиях. А что если они картируют наш геном с целью обнаружения каких-то слабых мест, а [Root.GetSpeciesNamePlural] ничего не подозревают об этом? И хотя конкретных доказательств этому так и не появилось, но данная теория привела к призывам закрыть наши границы для [From.From.GetName&gen], чтобы помешать успешной реализации любых планов, которые у них могут быть."
 diplomatic.12.a: "Будущие враги не должны получить эти данные. Закрыть границы."
 diplomatic.12.b: "Мы не будем основывать внешнюю политику на теориях заговора."
 diplomatic.12.c: "В качестве ответа запустим проект по картированию их генома."
 diplomatic.13.name: "[From.GetName] закрывает границы"
 diplomatic.13.desc: "Нам докладывают о подозрительной деятельности ваших научных кораблей на нашей территории. Ходят слухи, что вы изучаете наше генетическое строение, пытаясь найти информацию, которую можно использовать для обнаружения слабых мест или для производства биологического оружия. Мы не можем подвергать [From.GetSpeciesAdj&fem,acc] расу такому риску."
 diplomatic.13.a: "Беспочвенные обвинения!"
 diplomatic.14.name: "Генетическое картирование даёт результаты"
 diplomatic.14.desc: "Хотя мы не выяснили по изучаемому геному конкретные детали, на которые надеялись, но наши исследования пролили свет на многие особенности нашей собственной генетики. Некоторые виды оружия, доказавшие свою пользу в войнах на [Root.GetHomeWorldName&prep] в прошлом, могут оказаться совершенно неэффективными против инопланетных форм жизни. Эти новые идеи помогли нам пересмотреть основные принципы ведения боевых действий."
 diplomatic.14.a: "Если мы действительно мишень для них, это может нам пригодиться."
 diplomatic.15.name: "Назойливый [From.From.GetAdj&masc] учёный"
 diplomatic.15.desc: "[Root.GetName] старается не позволять духовным вопросам становиться на пути исследования и изучения всего мирского, но мы умеем обращать должное внимание на метафизические озарения и традиции в любых делах. [From.From.GetName] в лице своих учёных, похоже, демонстрирует несколько большую легкомысленность в погоне за новыми астрономическими открытиями.\n\nВозьмём, например, ближайшие звёзды, которые образуют созвездия, играющие важную роль в [Root.GetSpeciesAdj&fem,gen] мифологии. [encroaching_research_leader.GetName] обвиняется в попытке «опровергнуть» некоторые из легенд, связанных с ними. Хотя мы уверены, что мирские открытия едва ли могут затронуть духовное значение созвездий, многие выступили против этих исследований, стараясь убедить учёного покинуть [Root.GetSpeciesAdj&fem,acc] территорию."
 diplomatic.15.a: "Этих подозрений достаточно для запрета доступа на нашу землю."
 diplomatic.15.b: "Наша вера выходит за пределы этого мира, ей нельзя навредить."
 diplomatic.15.b.tooltip: "[encroaching_research_leader.GetName] продолжает свои исследования."
 diplomatic.16.name: "[From.GetName] закрывает границы"
 diplomatic.16.desc: "[encroaching_research_leader.GetAXX::Ваш учёный|||fem:Ваша учёная] [encroaching_research_leader.GetName] обращает излишнее внимание на звёзды в созвездиях, которые являются священными для нашей расы. Мы не можем позволить работать на нашей территории тому, кто не проявляет надлежащего уважения к нашей вере и легендам."
 diplomatic.16.a: "Должно быть, это какое-то недоразумение."
 diplomatic.17.name: "[From.GetName] сообщает о еретическом открытии"
 diplomatic.17.desc: "Проведение исследований на территории, контролируемой другой державой, требует тактичности — качества, на которое мы не всегда обращаем внимание при подборе наших учёных. Недавно это стало очевидным, когда перед исследователем по имени [encroaching_research_leader.GetName] возникла проблема изучения некоторых звёзд в созвездиях, которые [From.GetSpeciesNamePlural] считают священными. Местные стали возражать против подробного того, чтобы [encroaching_research_leader.GetAXX::учёный занимался|||fem:учёная занималась] этой темой, не давали [encroaching_research_leader.GetHimHer] покоя, пока их [From.GetRulerTitle] [From.GetRulerName] не выступил с заявлением, запретив проводить эти [encroaching_research_leader.GetAXX::исследования.\n\nУчён<end_yi>], явно [encroaching_research_leader.GetAXX::разозленн<end_yi>] протестами, [encroaching_research_leader.GetAXX::обнаружил<end_a>] доказательства того, что некоторые из связанных со звёздами [From.GetAdj&pl,gen] легенд могут полностью противоречить их реальному возрасту и эволюции. Вероятно, если материалы будут опубликованы, они вызовут дальнейшее возмущение."
 diplomatic.17.a: "[encroaching_research_leader.GetSheHe] намеренно пытается вызвать скандал? Уволить."
 diplomatic.17.b: "Подобные вещи иногда имеют место при проведении исследований."
 diplomatic.18.name: "[encroaching_research_leader.GetName] публикует еретические материалы"
 diplomatic.18.desc: "Мы верили, что исследователь из [From.GetName&gen] руководствуется самыми лучшими намерениями, изучая наши древние созвездия. Однако после проведения переоценки возраста звёзд [encroaching_research_leader.GetSheHe] утверждает, что изменения их яркости и видимости вступают в противоречие с нашими легендами об этих созвездиях, и это очень расстраивает наших граждан.\n\nТе, кто изначально возражал против этого проекта, заявляют, что данный поступок намеренно совершён учёным со злым умыслом, так как они требовали положить конец подобным исследованиям. [From.GetAdj&neut] правительство решило замять это дело и отказалось принять меры, чтобы предотвратить гнев и боль, которые этот доклад, скорее всего, вызовет у наших граждан."
 diplomatic.18.a: "Мы никогда не должны были верить в то, что они нас уважают."
 diplomatic.19.name: "Экзотический духовой инструмент"
 diplomatic.19.desc: "Среди существ, с которыми мы столкнулись с тех пор, как покинули нашу родную [Root.GetHomeWorldName], музыка принимает множество разных форм, а разнообразие методов и предпочтений до сих пор озадачивает. Иногда инопланетная музыка для нас не слышна, а иногда звуковые волны настолько сильны, что мы можем оглохнуть. В общем-то, нечасто удаётся встретить такую музыку, которая бы нам понравилась больше, чем её создателям.\n\nНедавно такую редкую возможность подарила нам планета [Root.GetHomeWorldName&acc], музыка принимает множество разных форм, а разнообразие методов и предпочтений до сих пор озадачивает. Иногда инопланетная музыка для нас не слышна, а иногда звуковые волны настолько сильны, что мы можем оглохнуть. В общем-то, нечасто удаётся встретить такую музыку, которая бы нам понравилась больше, чем её создателям.\n\nНедавно такую редкую возможность подарила нам планета [music_listening_planet.GetName]. Недалеко от границ [music_origin_country.GetAdj&masc,gen] государства расположены ставшие необычайно популярными радиостанции, воспроизводящие музыку с той стороны. Оказывается, какой-то инструмент с [music_origin_country.GetHomeWorldName&gen] не просто приятно слушать, но его музыка входит в резонанс с [Root.GetSpeciesAdj&pl,inst] телами, отчего их [Root.GetSpeciesOrganName] ощущает подлинное расслабление. Чем бы ни был этот инструмент, у нас ничего подобного нет."
 diplomatic.19.a: "Превосходный шанс изучить их культуру."
 diplomatic.19.b: "Давайте будем осторожными при изучении этого инструмента."
 diplomatic.20.name: "Инструментальная биология"
 diplomatic.20.desc: "При более внимательном взгляде на музыку чужаков мы обнаружили, что её источником является духовой инструмент, изготовленный из одного из растений их родного мира. Необычная внутренняя структура растения полностью отличается от всего того, что можно найти на [Root.GetHomeWorldName&prep], в том числе на молекулярном уровне. Воздействие проходящего через растение воздуха на [Root.GetSpeciesAdj&masc] организм позволило нам лучше понять биологию инопланетной флоры."
 diplomatic.20.a: "Кто знает, что мы найдём?"
 diplomatic.21.name: "[neighbor_contesting_colony.GetName] возражает против экспансии"
 diplomatic.21.desc: "Ваша новая колония на [Root.GetName&prep] расположена очень близко к нашим границам. Мы бы хотели, чтобы вы удалили её оттуда во избежание будущих конфликтов относительно того, где должна проходить наша граница."
 diplomatic.21.a: "Мы немедленно прекратим её развитие."
 diplomatic.21.b: "Колония является частью нашего будущего. Она останется."

 diplomatic.1000.name: "Манёвры флотилии"
 diplomatic.1000.desc: "Командир [exercise_admiral.GetName] [exercise_admiral.GetAXX::составил<end_a>] план крупных учений с задействованием значительной части нашего флота. Для манёвров выбрана система [exercise_system.GetName&gen], расположенная на границе с [exercise_neighbor.GetName&inst].\n\n[exercise_neighbor.GetSpeciesNamePlural] могут посчитать это крупной провокацией, но если мы отменим учения, то наши военные воспримут это как признак слабости. В конце концов, [exercise_system.GetName] — это наша территория, и [exercise_neighbor.GetName] не имеет права указывать, что нам можно и чего нельзя делать у себя дома."
 diplomatic.1000.a: "Выполнять манёвры согласно плану."
 diplomatic.1000.b: "Отменить учения."
 FLEET_MANEUVERS_1_PROJECT: "Манёвры флотилии"
 FLEET_MANEUVERS_1_PROJECT_DESC: "Крупные учения флотилии запланированы в системе [exercise_system.GetName&gen] вблизи границы с соседом [exercise_neighbor.GetName]. Целью данных учений является моделирование разведки боем, выполняемой на нашей территории значительными силами противника, принадлежащего к расе [exercise_neighbor.GetSpeciesName], перед возможным вторжением.\n\nУчения начнутся, как только все выделенные силы достигнут начальной зоны сосредоточения на орбите [exercise_location.GetName&gen]."
 FLEET_MANEUVERS_2_PROJECT: "$FLEET_MANEUVERS_1_PROJECT$"
 FLEET_MANEUVERS_2_PROJECT_DESC: "$FLEET_MANEUVERS_1_PROJECT_DESC$"
 FLEET_MANEUVERS_3_PROJECT: "$FLEET_MANEUVERS_1_PROJECT$"
 FLEET_MANEUVERS_3_PROJECT_DESC: "$FLEET_MANEUVERS_1_PROJECT_DESC$"
 diplomatic.1001.name: "Манёвры флотилии отменены"
 diplomatic.1001.desc: "Планы по проведению крупных учений флотилии отменены. Из-за постоянных задержек в перемещении выделенных сил на указанную позицию продолжение подобных действий серьёзно ухудшило бы уровень готовности всей флотилии."
 diplomatic.1002.desc: "Поскольку [Root.GetName] теперь участвует в настоящей войне, запланированные нами крупные учения флотилии отменены. Теперь экипажам наших кораблей придётся получать опыт на поле боя."
 diplomatic.1002.a: "Боевое крещение."

 diplomatic.1006.name: "Активность кораблей в системе [exercise_system.GetName&gen]"
 diplomatic.1006.desc: "Нам сообщают о перемещениях значительных флотилий в границах [From.Owner.GetName&gen]. Сосредоточены они, похоже, в системе [exercise_system.GetName&gen], подозрительно близко к нашей границе. Что эти [From.Owner.GetSpeciesNamePlural] замышляют?"
 diplomatic.1006.a: "Продолжайте следить за ситуацией."

 diplomatic.1011.name: "Манёвры флотилии: Столкновения"
 diplomatic.1011.desc: "Сложные манёвры, которые [exercise_admiral.GetAXX::задумал<end_a>] командир [exercise_admiral.GetName], привели к нескольким незначительным столкновениям во время учений флотилии, проводимых в настоящее время в системе [exercise_system.GetName&gen]. Потери среди экипажей были минимальными, и ни один из столкнувшихся кораблей не получил критических повреждений, но после завершения учений им потребуется определённый ремонт."
 diplomatic.1011.a: "По крайней мере, ни один корабль не потерян."
 exercise_collision_tooltip: "Несколько наших кораблей получили повреждения при столкновениях."
 diplomatic.1012.name: "Манёвры флотилии: Потерянные корабли"
 diplomatic.1012.desc: "В результате столкновения при выполнении высокоскоростного манёвра во время учений флотилии, проводимых в системе [exercise_system.GetName&gen], корабли [destroyed_ship_1.GetName] и [destroyed_ship_2.GetName] были уничтожены вместе с экипажами. Ближайшие родственники извещены об этой трагедии."
 diplomatic.1012.a: "Печальный день."
 exercise_ships_lost: "Два наших корабля потеряны в результате случайного столкновения."
 diplomatic.1013.name: "Манёвры флотилии: Многообещающий офицер"
 diplomatic.1013.desc: "[exercise_officer.GetName], капитан [officer_ship.GetName&gen], подаёт большие надежды в ходе учений флотилии в системе [exercise_system.GetName&gen]. Молодой офицер проявил инициативу наряду со значительными лидерскими качествами, и Адмиралтейство решило незамедлительно присвоить [exercise_officer.GetHerHim] командирское звание."
 diplomatic.1013.a: "Флоту всегда нужны способные командиры."
 exercise_officer_tooltip: "Командир [exercise_officer.GetName] [exercise_officer.GetAXX::доступ<end_enna>] для назначения."
 diplomatic.1014.name: "Манёвры флотилии: Общественный интерес"
 diplomatic.1014.desc: "Учения флотилии, проводимые сейчас в системе [exercise_system.GetName&gen], привлекли внимание многих СМИ в столице [Root.Capital.GetName] и колониях. Благодаря имеющимся в общем доступе голографическим записям, показывающим некоторые из наиболее драматических манёвров, общественность прямо-таки влюбилась в доблестных защитников [Root.GetName&gen], служащих во флотилии. В наши пункты для призыва новобранцев на флот стекаются добровольцы!"
 diplomatic.1014.a: "Это должно снизить расходы."
 diplomatic.1020.name: "Разведданные о [From.Owner.GetSpeciesAdj&pl,prep] манёврах"
 diplomatic.1020.desc: "Наша разведка выяснила подробнее о повышенной активности [From.Owner.GetSpeciesAdj&pl,gen] кораблей в системе [exercise_system.GetName&gen]. Похоже, [From.Owner.GetName::<1> собрало|||pl:<1> собрали] достаточно большую флотилию для проведения беспрецедентно крупномасштабных учений.\n\nПока нет никаких признаков того, что они перейдут в прямые военные действия против [Root.GetName&gen], но их близость к нашей границе можно рассматривать только как сознательную провокацию! Как мы отреагируем?"
 diplomatic.1020.a: "Выразить дипломатический протест!"
 diplomatic.1020.b: "Мы проигнорируем их провокации."
 exercise_diplomatic_protest: "Мы поставим [From.Owner.GetName&acc] в известность о своём недовольстве этими учениями."
 diplomatic.1021.desc: "[From.GetName] самым решительным образом возражает против провокационных военных учений, которые [Root.GetSpeciesNamePlural] сейчас проводят в системе [exercise_system.GetName&gen].\n\nОрганизация манёвров столь небывалого масштаба так близко к нашим границам может быть истолкована только как тонко завуалированная угроза. Наши собственные войска приведены в максимальную боевую готовность, а командирам нашей флотилии даны указания реагировать на любые нарушения границы с удвоенной силой."
 diplomatic.1021.a: "Пусть [From.GetSpeciesNamePlural] не вмешиваются в наши дела! Так им и скажите."
 diplomatic.1021.b: "Мы не можем допустить какой-либо инцидент... Отменить учения."
 diplomatic.1021.c: "Наши дипломаты всё уладят."
 exercise_diplomatic_hardline: "Мы даём жёсткий дипломатический ответ на их оскорбительный мелкий протест."
 exercise_diplomatic_canceled: "Мы отменяем проводимые сейчас манёвры нашей флотилии, чтобы улучшить отношения с [From.GetName&inst]. Военные будут недовольны.\n\n"
 exercise_diplomatic_conciliatory: "Мы даём примирительный ответ, чтобы уменьшить урон дипломатическим отношениям, но учения продолжаются."
 diplomatic.1022.desc: "Мы получили ваше плохо сформулированное возражение против военных учений, проводимых в настоящее время нашими славными кораблями в системе [exercise_system.GetName&gen]. Поскольку данная система, как вам, несомненно, известно, находится на суверенной территории [From.GetName&gen], мы не понимаем, каким образом происходящее там касается вас.\n\n[Root.GetName] поступит благоразумно, если не станет больше делать таких провокационных и необдуманных заявлений в дипломатической корреспонденции в будущем.\n\nКонец сообщения."
 diplomatic.1022.a: "Это недопустимо!"
 diplomatic.1023.desc: "В свете возражений, высказанных [Root.GetName&inst] против манёвров наших кораблей в системе [exercise_system.GetName&gen], [From.GetName] прерывает все текущие учения с целью содействия улучшению отношений между нашими звёздными державами.\n\nМы искренне надеемся, что подобные действия помогут разрядить межзвёздную напряжённость и в то же время, без сомнения, докажут, что [From.GetSpeciesNamePlural] заинтересованы в сохранении прочного мира в галактике."
 diplomatic.1023.a: "Возможно, они искренни в своём стремлении к миру..."
 diplomatic.1024.desc: "[From.GetName] выражает искреннее сожаление по поводу любых недоразумений, которые могли быть вызваны военными учениями, проводимыми в системе [exercise_system.GetName&gen].\n\nЭти манёвры кораблей были запланированы заранее, а место проведения было выбрано нашими командирами случайным образом. Никоим образом не следует истолковывать их как угрозу или провокацию по отношению к [Root.GetName&dat]."
 diplomatic.1024.a: "Эти [From.GetSpeciesNamePlural] опять задумали какую-то хитрость?"
 diplomatic.1025.name: "Манёвры завершены"
 diplomatic.1025.desc: "Манёвры флотилии, проводимые флотилией [exercise_fleet.GetName] в системе [exercise_system.GetName&gen], завершены. Командир [exercise_admiral.GetName] докладывает, что мы многому научились в ходе этих учений, в основном благодаря их масштабности. Несмотря на любые возможные дипломатические последствия, военные выгоды, по крайней мере, являются существенными."
 diplomatic.1025.a: "Хорошая работа."
 diplomatic.1026.name: "[From.Owner.GetSpeciesNamePlural] завершили манёвры"
 diplomatic.1026.desc: "Судя по внезапному уменьшению зашифрованных военных сообщений, которые [From.Owner.GetSpeciesNamePlural] передавали из системы [exercise_system.GetName&gen], учения кораблей, проводившиеся там [From.Owner.GetName&inst], наконец-то завершились."
 diplomatic.1026.a: "Давно пора."

 precursor_1: "Вультаум"
 precursor_2: "Юуты"
 precursor_3: "Первая лига"
 precursor_4: "Ирассианцы"
 precursor_5: "Сайбрекс"
 precursor_baol_1: "Баол"
 precursor_zroni_1: "Зрони"
 precursor_inetian: "Исстианские торговцы"
 precursor_adakkaria: "Ад'Аккария"

 precursor_1_desc: "Их знание было безграничным, их теории — всеобъемлющими. Но к чему привёл их поиск абсолютной истины: к просветлению или погибели?"
 precursor_2_desc: "Они странствовали среди звёзд, в вечном поиске, вечно расширяясь. Теперь лишь оставшиеся после них руины шепчут о непредвиденных последствиях."
 precursor_3_desc: "Единство хрупко. Какая сила разорвала некогда процветающую федерацию, чьё влияние простиралось на целые секторы галактики?"
 precursor_4_desc: "Даже величайшие цивилизации могут пасть перед незримым врагом. Ослепила ли их гордыня — или невежество предопределило их судьбу?"
 precursor_5_desc: "Когда-то им не было равных. Но что сломило их решимость и положило конец их крестовому походу?"
 precursor_baol_1_desc: "Они возделывали целые миры, тщательно формируя экосистемы. Но даже самые глубокие корни можно выкорчевать."
 precursor_zroni_1_desc: "Разум безграничен. Их мысли несли их через звёзды, перекраивая реальность. Но даже те, кто заглянул за грань, не всегда видят одно и то же."
 precursor_inetian_desc: "Процветание рождает амбиции, а амбиции влекут за собой гибель. Какая сила разрушила их паутину, остаётся неизвестным — но одной жадности оказалось недостаточно для спасения."
 precursor_adakkaria_desc: "Они скользили по волнам космоса, не зная оков, не зная покоя. Но даже странники не могут скитаться вечно."
