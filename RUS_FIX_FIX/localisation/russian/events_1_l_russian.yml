 VULTAUMAR: "Вультаумар Прайм&!masc|||gen:Вультаумара Прайм|||dat:Вультаумару Прайм|||acc:Вультаумар Прайм|||inst:Вультаумаром Прайм|||prep:Вультаумаре Прайм"
 VULTAUMAR_DESC: "Древняя родина народа вультаум. Она видела лучшие времена."
 YUHTAAN: "Большой Юутаан&!masc|||gen:Большого Юутаана|||dat:Большому Юутаану|||acc:Большой Юутаан|||inst:Большим Юутааном|||prep:Большом Юутаане"
 YUHTAAN_DESC: "Этот мир, служивший столицей древней Юутской империи, когда-то имел всё для обеспечения жизни. Всё изменилось."
 FEN_HABBANIS: "Фен Хаббанис&!masc|||gen:Фен Хаббаниса|||dat:Фен Хаббанису|||acc:Фен Хаббанис|||inst:Фен Хаббанисом|||prep:Фен Хаббанисе"
 FEN_HABBANIS_DESC: "Фен Хаббанис III, или просто Фен Хаббанис, ибо под таким именем он был известен его древним обитателям, был столицей Первой лиги."
 IRASSIA: "Ирассия&!fem|||gen:Ирассии|||dat:Ирассии|||acc:Ирассию|||inst:Ирассией|||prep:Ирассии"
 IRASSIA_DESC: "Какой бы ни была биосфера в этом мире, её уже давным-давно нет."
 CYBREX: "Мир-кольцо Сайбрекса&!masc|||gen:Мира-кольца Сайбрекса|||dat:Миру-кольцу Сайбрекса|||acc:Мир-кольцо Сайбрекса|||inst:Миром-кольцом Сайбрекса|||prep:Мире-кольце Сайбрекса"
 CYBREX_DESC: "Полностью опустошённый мир-кольцо, последнее убежище цивилизации Сайбрекса."

