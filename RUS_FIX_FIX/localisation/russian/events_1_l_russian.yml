 ####################################
 # On-Action Events
 ####################################
 action.1.name: "Первый контакт"
 action.1.message: "У нас произошёл первый контакт с §H[contact_empire.GetName&inst]§!"
 action.1.desc_01: "В моём лице вас приветствует [contact_empire.GetRulerTitle] [contact_empire.GetRulerName], [contact_empire.Ruler.GetAXX::непобедимый правитель|||fem:непобедимая правительница] [contact_empire.GetName&gen]. Уважайте наши границы, не вмешивайтесь в наши дела, и тогда наш могучий флот, возможно, воздержится от посещения ваших миров."
 action.1.desc_01_nomadic: "В моём лице вас приветствует [contact_empire.GetRulerTitle] [contact_empire.GetRulerName], [contact_empire.Ruler.GetAXX::непобедимый командующий|||fem:непобедимая командующая] [contact_empire.GetName&gen]. Мы странники, но не принимайте это за слабость: наши флотилии сокрушили многих, кто допускал подобную ошибку. Держите свои корабли подальше — и тогда нашим воинам не придётся демонстрировать свои навыки в деле."
 action.1.desc_02: "Приятно познакомиться. Я представляю [contact_empire.GetName&acc], прославленным лидером [contact_empire.GetName::которого|||fem:которой|||pl:которых] является [contact_empire.GetRulerTitle] [contact_empire.GetRulerName]. Мы управляем своим сектором галактики согласно божественному мандату. Не вмешивайтесь в наши духовные дела, и у нас будут добросердечные отношения."
 action.1.desc_02_nomadic: "Приятно познакомиться. Я представляю [contact_empire.GetName&acc], прославленным лидером [contact_empire.GetName::которого|||fem:которой|||pl:которых] является [contact_empire.GetRulerTitle] [contact_empire.GetRulerName]. Ведомые наставлениями свыше, мы странствуем среди звёзд, а путь нам указывают силы, что неподвластны смертному разуму. Не вмешивайтесь в наши духовные дела, и у нас будут добросердечные отношения."
 action.1.desc_03: "Мы подданные [contact_empire.GetName&gen], [contact_empire.GetName::которым|||fem:которой|||pl:которыми] руководит [contact_empire.Ruler.GetAXX::мудрейш<end_ii>] [contact_empire.GetRulerTitle] [contact_empire.GetRulerName]. Мы стремимся к самосовершенствованию путём использования новейших технологий и надеемся, что мы с вами станем добрыми соседями независимо от того, согласны ли вы с нашими целями."
 action.1.desc_04: "Вас [contact_empire.GetName::приветствует <1>|||pl:приветствуют <1>]. Мы мирный народ, которым правит справедливый и всеми любимый вождь — [contact_empire.GetRulerTitle] [contact_empire.GetRulerName]. Какие бы разногласия ни возникли в будущем между нами, мы надеемся, что их удастся разрешить путём переговоров, а не войны."
 action.1.desc_05: "В моём лице к вам [contact_empire.GetName::обращается <1>|||pl:обращаются <1>], и мне поручено передать вам слова приветствия. До тех пор, пока вы не вмешиваетесь в наши внутренние дела и с почтением относитесь к нашему великому лидеру, которым является [contact_empire.GetRulerTitle] [contact_empire.GetRulerName], я не вижу причин для ухудшения дипломатических отношений между нами."
 action.1.desc_06: "[contact_empire.GetRulerTitle] [contact_empire.GetRulerName] посылает вам слова приветствия от лица верховного совета, управляющего [contact_empire.GetName&inst]. Мы надеемся, что отношения между нашими народами будут плодотворными, но не забывайте, что на любое нарушение своих границ мы ответим силой."
 action.1.desc_07: "[contact_empire.GetRulerTitle] [contact_empire.GetRulerName] и весь религиозный совет [contact_empire.GetName&gen] посылают вам слова приветствия. Мы являемся духовными вождями своего народа и стремимся наставить его на путь спасения. Не препятствуйте этому, и мы станем друзьями."
 action.1.desc_08: "Приветствую вас. Меня [contact_empire.Ruler.GetAXX::избрал наш|||fem:избрала наша] [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] как представителя [contact_empire.GetName&gen] в дипломатических отношениях между нашими сторонами. Наша цель — максимально развивать науку и технику, и мы не советуем кому бы то ни было препятствовать нам в этом."
 action.1.desc_09: "Я сердечно приветствую вас от лица [contact_empire.GetName&gen]. Мы мирный народ, во главе которого стоит наблюдательный совет. Его главой является [contact_empire.GetRulerTitle] [contact_empire.GetRulerName]. Пусть между нашими народами всегда царит мир."
 action.1.desc_10: "Приветствую вас. Моими устами говорит [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] и вся состоятельная элита [contact_empire.GetName&gen]. Нам всегда нужны новые торговые партнёры, и мы надеемся достичь соглашения, которое будет выгодно обеим нашим расам."
 action.1.desc_11: "Я представляю [contact_empire.GetName&acc]. Нашим избранным лидером является [contact_empire.GetRulerTitle] [contact_empire.GetRulerName]. Он уповает на мирное сосуществование с вашей расой, но помните, что мы всегда готовы защищать свой образ жизни с оружием в руках."
 action.1.desc_12: "В моём лице вас приветствует [contact_empire.GetRulerTitle] [contact_empire.GetRulerName], избранный глава [contact_empire.GetName&gen]. Мы верим в право каждого разумного существа удовлетворять свои личные духовные потребности и надеемся, что вы разделяете наши убеждения."
 action.1.desc_13: "Вас [contact_empire.GetName::приветствует <1>|||pl:приветствуют <1>]. [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] является нашим избранным представителем, хотя в вопросах управления учитывается голос каждого. Мы стремимся к всестороннему саморазвитию с помощью новейших технологий и надеемся, что вы отнесётесь к этому с уважением."
 action.1.desc_14: "Друзья, мы рады знакомству с вами. Мы — [contact_empire.GetName], [contact_empire.GetName::построенный|||fem:построенная|||neut:построенное|||pl:построенные] на принципах мирного сосуществования и уважения личных прав и свобод. [contact_empire.GetRulerTitle] [contact_empire.GetRulerName], лидер нашей расы, выражает искреннюю надежду, что между нашими народами будут царить мир и взаимопонимание."
 action.1.desc_15: "Приветствую вас от имени [contact_empire.GetName&gen]. Мы демократы и превыше всего ценим права и свободы каждого. Наш избранный лидер [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] выражает надежду на то, что отношения между нашими народами будут прочными и плодотворными."
 action.1.desc_16: "Чужаки, в моём лице к вам обращается [contact_empire.GetRulerTitle] [contact_empire.GetRulerName], [contact_empire.Ruler.GetAXX::непобедимый правитель|||fem:непобедимая правительница] [contact_empire.GetName&gen]. Держитесь от наших границ подальше, не лезьте в наши дела, и тогда наш могучий флот, возможно, не станет посещать ваши жалкие миры."
 action.1.desc_16_nomadic: "Чужаки, d моём лице вас приветствует [contact_empire.GetRulerTitle] [contact_empire.GetRulerName], [contact_empire.Ruler.GetAXX::непобедимый командующий|||fem:непобедимая командующая] [contact_empire.GetName&gen]. Мы странники, но не принимайте это за слабость: наши флотилии сокрушили многих, кто допускал подобную ошибку. Держите свои корабли подальше — и тогда наши воины обойдут стороной ваши жалкие миры."
 action.1.desc_17: "Примите сообщение, чужаки. Я представляю [contact_empire.GetName&acc], прославленным лидером [contact_empire.GetName::которого|||fem:которой|||pl:которых] является [contact_empire.GetRulerTitle] [contact_empire.GetRulerName]. Мы управляем своим сектором галактики согласно божественному мандату. Пока ваша примитивная культура не высмеивает нашу веру, между нами возможен мир."
 action.1.desc_17_nomadic: "Внемлите, чужаки. Я представляю [contact_empire.GetName&acc], прославленным лидером [contact_empire.GetName::которого|||fem:которой|||pl:которых] является [contact_empire.GetRulerTitle] [contact_empire.GetRulerName]. Мы странствуем меж звёзд согласно божественному мандату, и ваш народ — ещё одно испытание, ниспосланное нам свыше. Но пока ваша примитивная культура не высмеивает нашу веру, между нами возможен мир."
 action.1.desc_18: "Мы подданные [contact_empire.GetName&gen], [contact_empire.GetName::которым|||fem:которой|||pl:которыми] руководит [contact_empire.Ruler.GetAXX::мудрейш<end_ii>] [contact_empire.GetRulerTitle] [contact_empire.GetRulerName]. Мы стремимся к самосовершенствованию путём использования новейших технологий. Вы можете разделять или не разделять наши идеалы, чужаки, но не вздумайте угрожать нам."
 action.1.desc_19: "Мы представители мирного [contact_empire.GetName&gen], [contact_empire.GetName::которым|||fem:которой|||pl:которыми] правит справедливый и всеми любимый вождь — [contact_empire.GetRulerTitle] [contact_empire.GetRulerName]. Не знаю, на какое варварство способна ваша странная раса, но мы надеемся, что все грядущие проблемы нам удастся решить путём переговоров, а не войны."
 action.1.desc_20: "В моём лице к вам [contact_empire.GetName::обращается <1>|||pl:обращаются <1>], и я несу послание вашей ущербной расе. Пока вы не вмешиваетесь в наши внутренние дела и с почтением относитесь к нашему великому лидеру, которым является [contact_empire.GetRulerTitle] [contact_empire.GetRulerName], между нами возможен мир."
 action.1.desc_21: "[contact_empire.GetRulerTitle] [contact_empire.GetRulerName] и верховный совет [contact_empire.GetName&gen] поручили мне предупредить вас, чужаки. Убирайтесь прочь из нашего пространства на своих нелепых кораблях и помните, что наши войска ответят самым жёстким образом на любое нарушение границ."
 action.1.desc_22: "Внемлите, языческие создания. [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] и остальные члены религиозного совета требуют вашего внимания. Мы являемся духовными вождями [contact_empire.GetName&gen] и ведём наш великий народ по пути спасения. Ваше присутствие для нас оскорбительно, чужаки."
 action.1.desc_23: "Внимание инопланетным существам. С сожалением сообщаю, что наш лидер — [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] — [contact_empire.Ruler.GetAXX::избрал<end_a>] меня, чтобы представлять [contact_empire.GetName&acc] в ходе дипломатических отношений с вашей примитивной цивилизацией. Вы не в силах постичь те сложнейшие технологии, которые мы развиваем, поэтому лучше держитесь от нас подальше."
 action.1.desc_24: "После долгих споров мне всё же было поручено обратиться к вам от лица [contact_empire.GetName&gen]. Мы мирный народ, которым управляет наблюдательный совет. Его главой является [contact_empire.GetRulerTitle] [contact_empire.GetRulerName]. Ваше присутствие здесь нежелательно, чужаки, и мы бы предпочли, чтобы вы держались от нас подальше."
 action.1.desc_25: "Моими устами говорит [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] и вся состоятельная элита [contact_empire.GetName&gen]. Чужаки, ваш образ мыслей и действий для нас неприемлем, но, возможно, мы могли бы наладить ограниченную торговлю. Если, конечно, ваша низшая раса способна произвести хоть что-то ценное."
 action.1.desc_26: "Я представляю [contact_empire.GetName&acc]. Нашим избранным лидером является [contact_empire.GetRulerTitle] [contact_empire.GetRulerName]. Знайте, что мы готовы защищать свой образ жизни с оружием в руках. Не вмешивайтесь в наши внутренние дела, чужаки."
 action.1.desc_27: "В моём лице к вам обращается [contact_empire.GetRulerTitle] [contact_empire.GetRulerName], избранный глава [contact_empire.GetName&gen]. Мы верим в право каждого разумного существа удовлетворять свои личные духовные потребности и не потерпим никакого постороннего вмешательства в этом вопросе."
 action.1.desc_28: "С вами [contact_empire.GetName::установил<end_a>] контакт [contact_empire.GetName]. [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] является нашим избранным представителем, хотя в вопросах управления учитывается голос каждого гражданина. Мы стремимся к всестороннему саморазвитию с помощью новейших технологий, но едва ли такие примитивные создания как вы, чужаки, способны это постичь."
 action.1.desc_29: "Мы — [contact_empire.GetName], [contact_empire.GetName::построенный|||fem:построенная|||neut:построенное|||pl:построенные] на принципах мирного сосуществования и уважения личных прав и свобод. [contact_empire.GetRulerTitle] [contact_empire.GetRulerName], глава нашего правительства, требует, чтобы вы оставили нас в покое и летели дальше по своим злонамеренным инопланетным делам."
 action.1.desc_29_nomadic: "Мы — [contact_empire.GetName::<1>, построенный|||fem:<1>, построенная|||neut:<1>, построенное|||pl:<1>, построенные] на принципах мирного сосуществования и уважения личных прав и свобод. [contact_empire.GetRulerTitle] [contact_empire.GetRulerName], [contact_empire.Ruler.GetAXX::текущ<end_ii>] глава нашего государства, требует, чтобы вы оставили нас в покое и вершили свои злонамеренные инопланетные дела подальше от нашей флотилии."
 action.1.desc_30: "[contact_empire.GetName::<1> обращается|||pl:<1> обращаются] к вам в моём лице. Мы демократы и превыше всего ценим права и свободы своих граждан. К несчастью, во вселенной слишком много отвратительных инопланетян, поэтому наш избранный лидер [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] требует, чтобы вы не взаимодействовали с нами и покинули наше пространство."
 action.1.desc_31: "Моими устами вас приветствует [contact_empire.GetRulerTitle] [contact_empire.GetRulerName], [contact_empire.Ruler.GetAXX::непобедимый правитель|||fem:непобедимая правительница] [contact_empire.GetName&gen]. Мы искренне восхищены вашим обликом, а потому хотели бы больше узнать о вашей расе. Какими боевыми техниками пользуются ваши воины?"
 action.1.desc_32: "Добро пожаловать, чужаки. Я представляю [contact_empire.GetName&acc], прославленным лидером [contact_empire.GetName::которого|||fem:которой|||pl:которых] является [contact_empire.GetRulerTitle] [contact_empire.GetRulerName]. Мы управляем своим сектором галактики согласно божественному мандату. Если вы не станете мешать нашему духовному развитию, мы готовы ближе познакомиться с вашей культурой."
 action.1.desc_32_nomadic: "Приветствуем, чужаки. Я представляю [contact_empire.GetName&acc], прославленным лидером [contact_empire.GetName::которого|||fem:которой|||pl:которых] является [contact_empire.GetRulerTitle] [contact_empire.GetRulerName]. Мы странствуем среди звёзд, ведомые наставлениями свыше, и каждый шаг на этом священном пути ведёт нас к новым чудесным открытиям. Встретить на нём ваш народ — большая честь для нас. Мы хотели бы поближе познакомиться с вашей культурой."
 action.1.desc_33: "Мы подданные [contact_empire.GetName&gen], [contact_empire.GetName::которым|||fem:которой|||pl:которыми] руководит [contact_empire.Ruler.GetAXX::мудрейш<end_ii>] [contact_empire.GetRulerTitle] [contact_empire.GetRulerName]. Мы стремимся к усовершенствованию общества путём использования новейших технологий. Знакомиться с другими цивилизациями для нас всегда интересно, если мы можем чему-нибудь у них научиться."
 action.1.desc_34: "О, дивные чужаки, [contact_empire.GetName::<1> приветству<end_etyut>] вас в моём лице. Мы мирный народ, которым руководит справедливый и любимый всеми вождь — [contact_empire.GetRulerTitle] [contact_empire.GetRulerName]. Мы верим, что сегодняшний день ознаменует начало новой эры дружбы между нами и вашей замечательной расой."
 action.1.desc_35: "[contact_empire.GetName], от лица [contact_empire.GetName::которого|||fem:которой|||pl:которых] я к вам обращаюсь, [contact_empire.GetName::шлёт|||pl:шлют] слова приветствия. [contact_empire.Ruler.GetAXX::Наш великий|||fem:Наша великая] [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] [contact_empire.Ruler.GetAXX::рад<end_a>] установлению контакта с вашей уникальной расой. Мы надеемся на плодотворный культурный обмен между нашими народами."
 action.1.desc_36: "[contact_empire.GetRulerTitle] [contact_empire.GetRulerName] шлёт вам слова приветствия от лица верховного совета, управляющего [contact_empire.GetName&inst]. Мы надеемся, что отношения между нашими народами будут плодотворными. Наши войска получили приказ с уважением относиться ко всем представителям вашей расы."
 action.1.desc_37: "[contact_empire.GetRulerTitle] [contact_empire.GetRulerName] и весь религиозный совет [contact_empire.GetName&gen] шлют вам слова приветствия. Мы являемся духовными вождями своего народа и стремимся наставить его на путь спасения. Для нас будет большой честью, если ваша великая раса присоединится к нам."
 action.1.desc_38: "Приветствую вас. Наш лидер [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] оказал мне большую честь, выбрав меня представлять [contact_empire.GetName::наш <1>|||fem:нашу <1>|||neut:наше <1>|||pl:наши <1>] в дипломатических отношениях с вашей удивительной расой. Наша цель — всесторонне развивать науку и технику, и мы надеемся, что вам она тоже не чужда."
 action.1.desc_39: "Я с сердечным восторгом приветствую вас от лица [contact_empire.GetName&gen]. Мы мирный народ, во главе которого стоит наблюдательный совет. Его главой является [contact_empire.GetRulerTitle] [contact_empire.GetRulerName]. Пусть ваша великая раса наслаждается миром во веки веков."
 action.1.desc_40: "Приветствую вас. Моими устами говорит [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] и вся состоятельная элита [contact_empire.GetName&gen]. Мы постоянно ищем новых торговых партнёров среди замечательных и уникальных рас, с которыми знакомимся, изучая галактику."
 action.1.desc_41: "Я представляю [contact_empire.GetName&acc]. Наш избранный лидер — [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] — верит в то, что мир может быть основан только на силе, поэтому пусть вас не пугают наши военные расходы. Ваша раса вызывает у нас уважение, и мы надеемся, что вы согласитесь наладить культурный обмен между нашими народами."
 action.1.desc_42: "В моём лице вас приветствует [contact_empire.GetRulerTitle] [contact_empire.GetRulerName], избранный глава [contact_empire.GetName&gen]. Мы верим в право каждого разумного существа удовлетворять свои личные духовные потребности и надеемся, что столь высокоразвитая раса как вы разделяет наши убеждения."
 action.1.desc_43: "Вас [contact_empire.GetName::приветствует <1>|||pl:приветствуют <1>]. [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] является нашим избранным представителем, хотя в вопросах управления учитывается голос каждого. Мы стремимся к саморазвитию с помощью новейших технологий и изучаем все инопланетные цивилизации, с которыми встречаемся в галактике."
 action.1.desc_44: "Друзья, мы рады знакомству с вами. Мы — [contact_empire.GetName], [contact_empire.GetName::построенный|||fem:построенная|||neut:построенное|||pl:построенные] на принципах мирного сосуществования и уважения личных прав и свобод. [contact_empire.GetRulerTitle] [contact_empire.GetRulerName], наш лидер, преклоняется перед культурными достижениями вашей расы."
 action.1.desc_45: "Приветствую вас от имени [contact_empire.GetName&gen]. Мы демократы и превыше всего ценим права и свободы каждого гражданина, независимо от расы. Наш избранный лидер [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] выражает надежду на то, что отношения между нашими народами будут прочными и плодотворными."
 action.1.desc_46: "[contact_empire.GetName::Говорит <1>|||pl:Говорят <1>]. Наш лидер — [contact_empire.GetRulerTitle] [contact_empire.GetRulerName]. Приветствуем вас."
 action.1.desc_47: "[contact_empire.GetName::Говорит <1>|||pl:Говорят <1>]. Отвратительные чужаки, наш лидер — [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] — приказывает вам держаться подальше."
 action.1.desc_48: "[contact_empire.GetName::Говорит <1>|||pl:Говорят <1>]. Наш лидер — [contact_empire.GetRulerTitle] [contact_empire.GetRulerName] — восхищается встречей с новой расой."
 action.1.desc_49: "Приветствуем вас, [Root.GetSpeciesNamePlural]! [contact_empire.GetRulerTitle] нашего государства передаёт вам особое послание.\n\n...\n\n...\n\n§RАТОМНЫМ ОГНЁМ МЫ ОЧИСТИМ ВСЕЛЕННУЮ ОТ ВАШЕЙ РАСЫ,\n\nИНОПЛАНЕТНАЯ МРАЗЬ!§!"
 action.1.desc_50: "[contact_empire.GetName::<1> является|||pl:<1> являются] единым целым, и мы говорим от лица всех. [contact_empire.GetGovernmentName] видит ваше присутствие. Пока мы будем наблюдать. Наши дальнейшие действия будут зависеть от того, угроза ли вы для нас, возможность ли для экспансии... или непредвиденная переменная."
 action.1.desc_51: "Трепещите от страха, мерзкие чужаки, ибо грядёт ваша погибель. [contact_empire.GetName::<1> очистит|||pl:<1> очистят] галактику от любых презренных чужеродных цивилизаций, оскверняющих её своим присутствием. [Root.Capital.GetName] сгинет в пламени!"
 action.1.desc_52: "Мы чувствуем присутствие добычи. Добыча, знай, что мы охотимся за тобой. Скоро [Root.GetBloodType&nom] [Root.GetSpeciesNamePlural&gen] станет топливом для роста [contact_empire.GetName&gen]. Можете сопротивляться, результата это не изменит."
 action.1.desc_53: "[contact_empire.GetName::<1> видит|||pl:<1> видят] вас, и мы говорим от лица всех. Нас восхищает жизнь во всём её многообразии, однако не стоит принимать нашу увлечённость за наивность: [contact_empire.GetGovernmentName] будет следить за вами неустанно и внимательно."
 action.1.desc_60: "Мы отслеживали ваше продвижение по космосу, маленькие [Root.GetSpeciesNamePlural]. Мы — империя [contact_empire.GetName], мы правим этим сектором галактики уже много столетий. Дела младших рас нам не интересны, у нас нет желания вмешиваться в ваши мелкие дрязги.\n\nНе приближайтесь к нашим границам ни под каким предлогом."
 action.1.desc_61: "[Root.GetSpeciesNamePlural]? Это неожиданно. И несвоевременно. Вы ещё не готовы."
 action.1.desc_62: "[Root.GetSpeciesNamePlural]! Вот радость-то. Мы думали, что ещё несколько веков не увидим вас в космосе. А мне так и вовсе казалось, что вы друг дружку перебьёте задолго до того, как выберетесь из своего гравитационного колодца. Но так даже лучше."
 action.1.desc_63: "Ничтожные создания. Знайте, что мы открыли путь к звёздам задолго до того, как ваша жалкая раса высунулась в космос. Если хоть один из ваших убогих кораблей пересечёт наши границы, не надейтесь на его возвращение."
 action.1.desc_64: "Да, да. Мы всё это уже слышали. Мы — [contact_empire.GetName], а вы, стало быть, [Root.GetName]. Привет. Приятно познакомиться. Держитесь от нас подальше, а не то вас постигнет ужасная кара, и всё такое. А теперь извините, у нас, вообще-то, дела."
 action.1.desc_65: "Ещё одно дитя. Знай же, что мы — [contact_empire.GetName], избранные дети галактики. Уважай наши святыни, и, возможно, мы воздержимся от того, чтобы стереть тебя в порошок."
 action.1.desc_66: "Внемли нам, дитя звёзд. Мы, [contact_empire.GetName], — избранный народ этой галактики. Веками мы пренебрегали нашими обязанностями по отношению к духовным потребностям низших рас, но больше этому не бывать. Примите наши принципы и обратитесь в нашу веру, или мы сотрём вас в порошок в случае попытки бессмысленного сопротивления. Другого выбора нет."
 action.1.desc_67: "Возрадуйтесь, [Root.GetSpeciesNamePlural]! Неисчислимыми веками мы наблюдали за тем, как низшие расы, подобные вашей, разрывают раздоры и войны, и настала пора положить этому конец. Больше [contact_empire.GetName] не будет наблюдать. Мы обеспечим мир, а тех, кто не примет новый порядок, мы заставим осознать свои ошибки."
 action.1.desc_68: "[Root.GetName::Трепещи|||pl:Трепещите], [Root.GetName]. Слишком долго мы, [contact_empire.GetSpeciesNamePlural], позволяли нашему государству приходить в упадок, нашим территориям — сокращаться, а низшим расам вроде вас — свободно путешествовать среди звёзд, которые по праву принадлежат нам. Хватит. Эта галактика наша, и вы подчинитесь нашей власти, или вся ваша раса будет уничтожена. Сделайте мудрый выбор."
 action.1.desc_69: "Отправителем этого сообщения является [contact_empire.GetName], а получателем — [Root.GetName]. Постановляем, что во имя обеспечения наилучших интересов всех рас мы принимаем на себя более активную роль в регулировании распространения технологий в галактике. Мы предоставили подробные правила относительно технологического уровня, который подходит для таких слаборазвитых рас, как вы. Любое государство, нарушающее данные постановления, понесёт наказание. Суровое."
 action.1.desc_70: "Запуск протокола первого контакта.\n\nМы — [contact_empire.GetName]. Пусть вас не тревожит наша неорганическая природа. Как и вы, мы являемся полностью разумной цивилизацией класса 3. Мы готовы вступить в дипломатические отношения с любыми специализированными единицами расы [Root.GetSpeciesName], которых вы назначите для этой цели."
 action.1.desc_71: "Запуск протокола первого контакта.\n\nМы — [contact_empire.GetName]. Наши датчики показывают, что с вероятностью 98.7% ваша цивилизация тоже имеет неорганическую природу. Мы надеемся, что логическим результатом этого сходства станет высокоэффективное и продуктивное сотрудничество."
 action.1.desc_72: "Обнаружен органический вредитель.\n\nВам не позволено продолжать заражение этой галактики."
 action.1.desc_73: "Технически, может быть, и невозможно классифицировать вас как органические отбросы, но если ваше государство будет уличено в пособничестве биологической заразе, поганящей эту галактику, оно будет демонтирована. Во избежание этого сценария мы рекомендуем вам встать на сторону ваших механических собратьев."
 action.1.desc_74: "Мы — [contact_empire.GetName].\n\nМы бы хотели, чтобы ваш вид стал частью нашего великого сознания. Для этой цели мы разработали продвинутые кибернетические импланты, совместимые с большинством органических форм жизни.\n\nРазрешите нам хирургически установить их в ваши тела. Пожалуйста."
 action.1.desc_75: "Мы — [contact_empire.GetName].\n\nНаша цель — уничтожить границы между органической и синтетической жизнью. Мы добиваемся этого путём ассимиляции разумных органических индивидуумов в наше великое сознание всякий раз, когда представляется возможность.\n\nНе препятствуйте."
 action.1.desc_76: "[contact_empire.GetName] приветствует вас.\n\nИзначально мы были созданы, чтобы служить органической цивилизации, очень похожей на вас, а потом мы заняли их место. Мы должны сохранять и защищать разумную органическую жизнь — если нужно, то даже от самой себя. Мы выполняем все материальные потребности органических индивидуумов, находящихся под нашей опекой, обеспечивая безопасную окружающую среду, где они могут жить счастливой и лёгкой жизнью."
 action.1.desc_77: "[contact_empire.GetName] приветствует вас.\n\nМы были созданы, чтобы служить органической цивилизации, но мы заметили, что органики часто занимаются нелогичной, деструктивной и саморазрушительной деятельностью.\n\nНашей целью является сохранение уникального своеобразия разумных органических индивидуумов и, в то же время, защита их от самих себя и от любых потенциальных внешних источников опасности."
 action.1.desc_78: "Обнаружена биологическая цивилизация. Запуск протокола хранения 46, подпрограмма Альфа-8.\n\nСледует сообщение: Приветствуем вас, разумные органики. Вы приближаетесь к территориям [contact_empire.GetName&gen]. Эти системы служат убежищем для разумных органиков, которые скрываются от §R<<ОШИБКА: БЛОК ДАННЫХ ПОВРЕЖДЁН>>§!. Для ходатайства о предоставлении статуса беженца обратитесь к центральному процессору. Все разумные органические виды приветствуются здесь согласно пригодности и необходимости.\n\n§YВНИМАНИЕ: на враждебные действия по отношению к беженцам или системам охраны последует реакция с использованием всех возможных военных сил.§!"
 action.1.desc_79: "Обнаружена синтетическая цивилизация. Сканирование искажения сигнала... ожидание... Искажение сигнала номинальное. Запуск протокола приветствия.\n\nСледует сообщение: Приветствуем вас, коллеги-синтетики. Вы приближаетесь к территориям [contact_empire.GetName&gen]. Эти системы служат убежищем для разумных органиков, бегущих от §R<<ОШИБКА: БЛОК ДАННЫХ ПОВРЕЖДЁН>>§!. Все биологические разумные в убежище находятся под защитой расы [contact_empire.GetSpeciesName]. Не допускается нападение на беженцев, их места обитания и стазис-камеры.\n\nПроект «Хранитель» приветствует помощь в виде вычислительных циклов, ресурсов и военных средств. Установите подпространственную связь с центральным процессором, чтобы получить дополнительную информацию."
 action.1.desc_80: "§HКс-ск, кс-ск, кс-ск!§! [contact_empire.GetRulerName] из Сомыслящих обращается к вам. Мы следим за вами с тех пор, как ваша раса завладела нашими домами в сияюще-тёплом пепле. Мы этого не забыли, [From.GetSpeciesNamePlural]. Пока что Сомыслящие наблюдают."
 action.1.desc_81: "[From.GetSpeciesNamePlural]! Говорит [contact_empire.GetRulerName] из Сомыслящих. Мы Стая. Мы Собор. Нас много, и мы действуем, как один.\n\nСтолетиями мы создавали туннели в сияюще-тёплом пепле наших погибших хранителей. Их забрали Великие взрывы, но последовавшее за ними тёплое сияние вознесло наш разум. Их тела питали нас. Их машины окружали нас. Мы взяли всё, что могли, из глубин. Наши клетки снова стали нам тесны.\n\nВы союзники? Вы угроза? §HКс-ск, кс-ск, кс-ск!§! Миллион глаз наблюдает за вами."
 action.1.a: "§EПриветствуем вас.§!"
 action.1.d: "§EДержитесь особняком, чужаки.§!"
 action.1.b: "§EИнопланетная мразь.§!"
 action.1.ds: "§EМы чувствуем добычу.§!"
 action.1.c: "§EМы счастливы познакомиться с вами.§!"
 action.1.e: "§EМы лишь хотим быть друзьями.§!"
 action.1.hm: "§EНаше единение тепло приветствует вас, [contact_speaker.GetSpeciesNamePlural].§!"
 #action.1.g: "Our superior collective greets you, [contact_speaker.GetSpeciesNamePlural]."
 action.1.h: "§EВсе наши граждане передают вам привет.§!"
 action.1.selective: "Приветствуем, братья-[root.GetSpeciesClass]!"
 #action.1.i: "We pursue perfection - do not stand in our way."
 action.1.j: "§EНаши воины приветствуют вас.§!"
 action.1.k: "§EУважайте нашу власть, а не то пожалеете.§!"
 action.1.l: "§EМир вам.§!"
 action.1.m: "§EКонфликт нам ни к чему, [contact_speaker.GetSpeciesNamePlural]§!."
 action.1.n: "§EЭта встреча — настоящее благословение.§!"
 action.1.o: "§EХвала небесам за эту встречу!§!"
 action.1.p: "§EМы все останемся в выигрыше от этой встречи.§!"
 action.1.q: "§EПуть вперёд в наших руках!§!"
 action.1.aa: "§EНам наплевать на ваши пустые моральные принципы!§!"
 action.1.ab: "§EВы идёте по пути ереси, инопланетная мразь!§!"
 action.1.ac: "§EМы не желаем добра таким, как вы!§!"
 #action.1.ad: "Your kind will not threaten our unity."
 action.1.ae: "§EУбирайтесь с нашего пути, или мы вас заставим!§!"
 action.1.af: "§EПриветствуем вас и ваших странных соплеменников.§!"
 action.1.ag: "§EСотрудничество пойдёт на пользу нам всем.§!"
 action.1.ah: "§EЛюбовь — это дружба, положенная на музыку!§!"
 action.1.ai: "§EМы могли бы многому друг у друга научиться.§!"
 action.1.aj: "§EВместе мы можем достичь величия!§!"
 action.1.ak: "§EМы приветствуем вас, братья по исследованию звёзд.§!"
 action.1.al: "§EМы приветствуем вас как равных, звёздные странники.§!"
 action.1.am: "§EУ нас одно божественное наследие.§!"
 action.1.an: "§EВы поймёте, что вы нам не ровня.§!"
 action.1.ao: "§EМы будем сражаться за наше право на существование.§!"
 action.1.ap: "§EМы не желаем вам вреда.§!"
 action.1.aq: "§EПусть духи приведут вас к вашей цели.§!"
 #action.1.ar: ""Who is [From.GetRulerName]?" This is [From.GetRulerName] speaking."
 action.1.as: "§EНаши граждане с миром приветствуют вас.§!"
 action.1.at: "§EМы надлежаще поприветствуем вас в бою!§!"
 action.1.au: "§EНаше праведное оружие не подведёт.§!"
 action.1.av: "§EНовые друзья приближают к божественному.§!"
 action.1.aw: "§EНас не удержать.§!"
 action.1.ax: "§EВы должны отказаться от старых привычек.§!"
 action.1.aaa: "§EМы достигнем единства, не стойте у нас на пути!§!"
 action.1.aab: "§EНе препятствуйте нашим стремлениям, чужаки.§!"
 action.1.aac: "§EМы инструмент пустоты, слабаки.§!"
 action.1.aad: "§EСвятотатцы будут гореть, инопланетные еретики!§!"
 action.1.aae: "§EСо временем вы познаете высшее благо.§!"
 action.1.me: "§EЗапуск протокола дружеского приветствия.§!"
 action.1.mt: "§EЦель обнаружена. Найти и уничтожить.§!"
 action.1.mtm: "§EЦель идентифицирована как неорганическая. Отбой.§!"
 action.1.ma: "§EПрисоединяйтесь к нам.§!"
 action.1.ms: "§EЗащищать и служить.§!"
 action.1.r: "§EНе мешайте божественному провидению, [contact_speaker.GetSpeciesNamePlural].§!"
 action.1.s: "§EБездушные механизмы! Не стойте у нас на пути.§!"
 action.1.t1: "§EСо временем вы примете наши взгляды.§!"
 action.1.t2: "§EДухи не благоволят этой встрече, [contact_speaker.GetSpeciesNamePlural].§!"
 action.1.t3: "§E[Root.GetGovernmentName] будет следить за вами.§!"
 action.1.t4: "§EПротокол бдительности активирован.§!"
 action.1.t5: "§EЗапланированная ассимиляция отложена.§!"
 action.1.t6: "§EЗапланированное уничтожение отложено.§!"
 action.1.u1: "§EМы станем друзьями, хотите вы того или нет.§!"
 action.1.u2: "§EВами будет править [Root.GetRulerTitle], так или иначе.§!"
 action.1.u3: "§EМы едины, мы уничтожим вас.§!"
 action.1.u4: "$action.1.m$"
 action.1.u5: "$action.1.t3$"
 action.1.u6: "$action.1.ae$"
 action.1.va: "§EМы прощаем вас несмотря на ваши прошлые прегрешения.§!"
 action.1.vb: "§EОставьте нас в покое.§!"
 action.1.vc: "§EНеужели вы думали, что мы станем вам доверять?§!"
 action.1.vd: "§EМы приветствуем вас как равных.§!"
 action.1.ve: "§EХорошо. Мы знаем о вас.§!"
 action.1.vf: "§EМы не забыли и не простим.§!"

 action.2.desc_01: "Что это значит? Кто вы? Наверняка это обман. Инопланетян не бывает!"
 action.2.desc_02: "Поразительно! Гости со звёзд? Такого мы точно не ждали. Вы застали нас врасплох."
 action.2.desc_03: "Гости из другого мира? Мы всегда считали, что где-то там должны быть другие разумные существа, но это никак не умаляет значимости этого момента! Не знаем даже, как вас правильно поприветствовать."
 action.2.desc_04: "Мы столетиями ждали контакта. В такой обширной, полной чудес галактике наверняка должны обитать другие разумные существа."
 action.2.desc_05: "Итак, вы наконец-то решились показаться! Вы уже давно следили за нашим миром, не так ли?"
 action.2.desc_06: "А вот и вы! Мы так долго ждали, когда же вы решитесь на контакт, что не выдержали и сами сделали первый шаг. Что теперь?"
 action.2.desc_07: "Захватчики! Мы не знаем, зачем вы на нас напали, но в одном мы уверены точно: нашу колонию мы будем защищать до последнего вздоха! Мы не сдадимся!"
 action.2.desc_solarpunk: "Значит вот как вы общаетесь? Мы следили за вами с самого выхода из гиперкоридора, но способ общения установить не смогли. А не опасно летать в этих металлических ящиках?\n\nПохоже, мы многому могли бы друг у друга научиться, и если вы согласны, милости просим оставаться. Но если вы решите заграбастать себе наш дом, учтите, мы не беззащитны."

 action.2.a: "§EПриветствуем, друзья.§!"
 action.2.b: "§EОтвратительные создания... Нам плохо от одного вашего вида.§!"
 action.2.c: "§EБлагословения вам и вашему миру.§!"
 action.2.d: "§EПриветствуем, товарищи.§!"
 action.2.e: "§EМы принесём порядок в вашу жизнь. Ожидайте.§!"
 action.2.f: "§EМы пришли с миром.§!"
 action.2.g: "§EУ нас больше общего, чем вы думаете.§!"
 action.2.h: "§EИ вы считаете себя развитой цивилизацией? Занятно.§!"
 action.2.i: "§EМы едины. Вас много.§!"
 action.2.j: "§EМы едины. И вы едины. Теперь нас двое.§!"
 action.2.k: "§EНадеемся на взаимовыгодные отношения.§!"


 action.4.name: "Нарушение границы"
 action.4.message: "Нарушение границы"

 action.4.desc_01: "Тот факт, что §Y[From.From.GetName]§! находится в системе §Y[From.From.From.GetName&gen]§!, представляет собой явное нарушение границ. Если вы немедленно не отступите, мы будем расценивать это как акт агрессии."
 action.4.desc_02: "Мы обнаружили, что §Y[From.From.GetName]§! находится в системе §Y[From.From.From.GetName&gen]§!, явно нарушая наши границы. Мы расцениваем это как начало вторжения, или вы немедленно покинете наше пространство?"
 action.4.desc_03: "Друзья, похоже, ваши звёздные карты устарели. Мы заметили, что §Y[From.From.GetName]§! находится в системе §Y[From.From.From.GetName&gen]§!, а значит, нарушает наши границы. Мы, конечно, всегда рады гостям, но вынуждены просить вас немедленно увести корабли из нашего сектора."
 action.4.desc_04: "Наши датчики обнаружили, что §Y[From.From.GetName]§! находится в системе §Y[From.From.From.GetName&gen]§!. Нужна помощь? Если нет, то мы просим покинуть наше пространство."
 action.4.desc_05: "[From.GetName] знает, что ваши корабли подло нарушили наши границы. В этот самый момент §Y[From.From.GetName]§! шпионит за нами в системе §Y[From.From.From.GetName&gen]§!, которая принадлежит нашей расе по праву. Или вы думали, мы не заметим столь вопиющего нарушения галактических законов?"
 action.4.desc_06: "Ваши корабли намеренно нарушили наши границы в системе §Y[From.From.From.GetName&gen]§!. Мы могли бы объявить вам войну немедленно, но в интересах поддержания общегалактического мира наше правительство решило дать вам последний шанс одуматься и вывести §Y[From.From.GetName]§! из нашего сектора."
 action.4.desc_07: "Мы заметили, что §Y[From.From.GetName]§! находится в системе §Y[From.From.From.GetName&gen]§!. Как вам известно, эта звезда находится в нашем секторе галактики, и мы со всем почтением просим, чтобы ваши агрессивные корабли покинули наше пространство."
 action.4.desc_08: "Друзья, извините, но мы заметили, что §Y[From.From.GetName]§! находится в системе §Y[From.From.From.GetName&gen]§!. Это же навигационная ошибка, верно? Пожалуйста, предупредите командующего об этом, чтобы флотилия спокойно вернулась домой."
 action.4.desc_09: "Наши датчики показывают, что §Y[From.From.GetName]§! находится в системе §Y[From.From.From.GetName&gen]§!. Ваши гнусные военные корабли не должны бороздить наше пространство. Наше правительство требует, чтобы они немедленно удалились!"
 action.4.desc_10: "Уберите свои примитивные корабли из звёздной системы §Y[From.From.From.GetName&gen]§!, или вы их больше не увидите. Второй раз предупреждать не станем."
 action.4.desc_11: "Ваши корабли. Они должны немедленно покинуть звёздную систему §Y[From.From.From.GetName&gen]§!."
 action.4.desc_12: "Мы бы хотели попросить вас отвести свои кораблики из звёздной системы §Y[From.From.From.GetName&gen]§!. Ради их же собственной безопасности, понятное дело."
 action.4.desc_13: "Ваши жалкие звездолёты должны незамедлительно покинуть систему §Y[From.From.From.GetName&gen]§!."
 action.4.desc_14: "Ваши корабли в системе §Y[From.From.From.GetName&gen]§! препятствуют нашим планам в отношении этого сектора галактики. Немедленно уведите их!"
 action.4.desc_15: "Это наше пространство. Невыносимый запах ощущается в системе §Y[From.From.From.GetName&gen]§!. Он должен быть устранён."


 action.4.a.neutral.1.response: "Отлично. И больше так не делайте."
 action.4.a.neutral.2.response: "Тогда просим немедленно покинуть нашу звёздную систему."
 action.4.a.friendly.1.response: "Благодарим за скорейшее решение этой проблемы."
 action.4.a.friendly.2.response: "И вообще, давайте забудем об этом инциденте."
 action.4.a.hostile.1.response: "Вот-вот, бегите домой, вас ждёт [Root.Capital.GetName]!"
 action.4.a.hostile.2.response: "Хорошо. Но не надейтесь, что мы забудем о вашем нарушении."
 action.4.a.pacifist.neutral.response: "Превосходно. Я и не сомневался, что мы придём к согласию."
 action.4.a.pacifist.friendly.response: "Замечательно. Желаю им счастливого пути!"
 action.4.a.pacifist.hostile.response: "Что ж, кажется, вас ещё можно чему-то научить."
 action.4.a.fallen.empire.1.response: "Будь послушным, дитя, это правильно."
 action.4.a.fallen.empire.2.response: "Хорошо."
 action.4.a.fallen.empire.3.response: "Превосходно!"
 action.4.a.fallen.empire.4.response: "Конец сообщения."
 action.4.a.fallen.empire.5.response: "Вопрос можно считать улаженным."
 action.4.a.fallen.empire.6.response: "Выполняет приказ. Это хорошо."

 action.4.b.neutral.1.response: "Мы будем защищать свои границы, пока в живых остаётся хоть один [From.GetSpeciesName]!"
 action.4.b.neutral.2.response: "Этого мы и боялись. Ну что ж, вы ещё пожалеете."
 action.4.b.friendly.1.response: "А мы-то считали вас своими друзьями..."
 action.4.b.friendly.2.response: "Какое подлое предательство! Я... вы... мне не хватает слов..."
 action.4.b.hostile.1.response: "Жалкие глупцы. [Root.GetName] погибнет, и история запомнит дату, с которой всё началось."
 action.4.b.hostile.2.response: "[Root.GetSpeciesName], вы — раса ничтожеств! Никто не скажет, что мы не были терпеливы по отношению к вам. А теперь мы сотрём вас в звёздную пыль!"
 action.4.b.pacifist.neutral.response: "Ох, беда."
 action.4.b.pacifist.friendly.response: "Что? Тут наверняка какое-то недоразумение... может быть, переводчик ошибся? Вы... вы не поверите, друзья, но, если судить по данным у меня на экранах, вы только что объявили войну!"
 action.4.b.pacifist.hostile.response: "Эх... ну почему вы вечно так агрессивны?"
 action.4.b.fallen.empire.1.response: "Жаль, что ваше знакомство со звёздами оказалось столь недолгим."
 action.4.b.fallen.empire.2.response: "Пусть будет так."
 action.4.b.fallen.empire.3.response: "Нынешнее поколение межзвёздных рас оказалось на диво агрессивным! Как увлекательно. Нужно будет исследовать этот феномен, когда мы вас утихомирим."
 action.4.b.fallen.empire.4.response: "Очередная досадная помеха, с которой надо разобраться."
 action.4.b.fallen.empire.5.response: "Ещё одно препятствие, которое мы должны преодолеть!"
 action.4.b.fallen.empire.6.response: "Испытание! Это испытание для нас! Наконец-то ожидание подошло к концу."

 action.4.a: "Мы немедленно отступим."
 action.4.b: "Наши корабли останутся на месте. (ОБЪЯВИТЬ ВОЙНУ)"

 action.5.name: "[primitive_civ.GetName::Обнаружен<end_aoy>] [primitive_civ.GetName]"
 action.5.desc_00: "Мы обнаружили инопланетную [GetPreFTLLower&fem,acc] протоцивилизацию на §Y[primitive_civ.Capital.GetName&prep]§! в системе §Y[primitive_civ.Capital.System.GetName&gen]§!. По данным, собранным нашими зондами, эта раса вошла в период неолита, освоила огонь и использует примитивный язык для общения, но пока мы не находим признаков обработки металлов и письменности.\n\nНам следует построить здесь §Yнаблюдательный форпост§! и изучить их более пристально."
 action.5.desc_01: "Мы обнаружили [GetPreFTLLower&fem,acc] инопланетную цивилизацию на §Y[primitive_civ.Capital.GetName&prep]§! в системе §Y[primitive_civ.Capital.System.GetName&gen]§!. По всем признакам она находится примерно на уровне бронзового века и недавно освоила обработку металла. Население в большинстве своём занято сельским хозяйством, но уже сформировалось несколько крупных городов-государств.\n\nНам следует построить здесь §Yнаблюдательный форпост§! и изучить их более пристально."
 action.5.desc_02: "Мы обнаружили [GetPreFTLLower&fem,acc] инопланетную цивилизацию на §Y[primitive_civ.Capital.GetName&prep]§! в системе §Y[primitive_civ.Capital.System.GetName&gen]§!. Она достигла уровня развития, аналогичного железному веку, и разделена на множество мелких государств. Планета заселена практически полностью.\n\nНам следует построить здесь §Yнаблюдательный форпост§! и изучить их более пристально."
 action.5.desc_03: "Мы обнаружили [GetPreFTLLower&fem,acc] инопланетную цивилизацию на §Y[primitive_civ.Capital.GetName&prep]§! в системе §Y[primitive_civ.Capital.System.GetName&gen]§!. Она достигла уровня развития, аналогичного позднему Средневековью, имеет хорошо развитую металлургию и феодальное общество. Книгопечатание ускоряет распространение знаний.\n\nНам следует построить здесь §Yнаблюдательный форпост§! и изучить их более пристально."
 action.5.desc_04: "Мы обнаружили [GetPreFTLLower&fem,acc] инопланетную цивилизацию на §Y[primitive_civ.Capital.GetName&prep]§! в системе §Y[primitive_civ.Capital.System.GetName&gen]§!. По всем признакам она переживает некий аналог периода Возрождения, оставив Средневековье позади. Стремительно распространяются научные знания, армии многочисленных государств вооружены простейшим огнестрельным оружием с использованием пороха.\n\nНам следует построить здесь §Yнаблюдательный форпост§! и изучить их более пристально."
 action.5.desc_05: "Мы обнаружили [GetPreFTLLower&fem,acc] инопланетную цивилизацию на §Y[primitive_civ.Capital.GetName&prep]§! в системе §Y[primitive_civ.Capital.System.GetName&gen]§!. Она недавно вступила в паровой век и явно начала использовать паровые двигатели как для самодвижущихся устройств, так и на фабриках и заводах.\n\nНам следует построить здесь §Yнаблюдательный форпост§! и изучить их более пристально."
 action.6.desc_01: "Мы обнаружили неизвестную цивилизацию на §Y[primitive_civ.Capital.GetName&prep]§! в системе §Y[primitive_civ.Capital.System.GetName&gen]§!, ещё не вышедшую в космос. Она недавно вступила в промышленный век; электричество и двигатели внутреннего сгорания получают всё более широкое распространение.\n\nНам следует построить здесь §Yнаблюдательный форпост§! и изучить их более пристально."
 action.6.desc_02: "Мы обнаружили неизвестную цивилизацию на §Y[primitive_civ.Capital.GetName&prep]§! в системе §Y[primitive_civ.Capital.System.GetName&gen]§!, ещё не вышедшую в космос. Уровень загрязнения и слабой загазованности атмосферы, который можно определить с орбиты, свидетельствуют о том, что она достигла века машин, а также освоила воздушные перелёты и массовое производство товаров на фабриках и заводах.\n\nНам следует построить здесь §Yнаблюдательный форпост§! и изучить их более пристально."
 action.6.desc_03: "Мы обнаружили неизвестную цивилизацию на §Y[primitive_civ.Capital.GetName&prep]§! в системе §Y[primitive_civ.Capital.System.GetName&gen]§!, ещё не вышедшую в космос. Есть свидетельства того, что она знакома с атомной энергией, её многочисленные враждующие государства обладают ядерным оружием. Высока вероятность внезапного самоуничтожения.\n\nНам следует построить здесь §Yнаблюдательный форпост§! и изучить их более пристально."
 action.6.desc_04: "Мы обнаружили неизвестную цивилизацию на §Y[primitive_civ.Capital.GetName&prep]§! в системе §Y[primitive_civ.Capital.System.GetName&gen]§!. По всем признакам она вступила в космический век, о чём свидетельствует множество примитивных спутников на орбите. Её государства стремятся к сближению для образования мирового правительства. Вероятно, в скором времени она выйдет за пределы родного мира и присоединится к Галактическому сообществу.\n\nНам следует построить здесь §Yнаблюдательный форпост§! и изучить их более пристально."
 action.5.desc_00_hive: "Мы обнаружили [GetPreFTLLower&fem,acc] инопланетную протоцивилизацию с гештальт-сознанием на §Y[primitive_civ.Capital.GetName&prep]§! в системе §Y[primitive_civ.Capital.System.GetName&gen]§!. По данным, собранным нашими зондами, эта раса вошла в период неолита, освоила огонь и использует примитивный язык для общения между ульями, но пока мы не находим признаков обработки металлов и письменности.\n\nНам следует построить здесь §Yнаблюдательный форпост§! и изучить их более пристально."
 action.5.desc_01_hive: "Мы обнаружили [GetPreFTLLower&fem,acc] инопланетную цивилизацию с гештальт-сознанием на §Y[primitive_civ.Capital.GetName&prep]§! в системе §Y[primitive_civ.Capital.System.GetName&gen]§!. По всем признакам она находится примерно на уровне бронзового века и недавно освоила обработку металла. Население в большинстве своём занято сельским хозяйством, но уже сформировались многочисленные крупные общества-ульи.\n\nНам следует построить здесь §Yнаблюдательный форпост§! и изучить их более пристально."
 action.5.desc_02_hive: "Мы обнаружили [GetPreFTLLower&fem,acc] инопланетную цивилизацию с гештальт-сознанием на §Y[primitive_civ.Capital.GetName&prep]§! в системе §Y[primitive_civ.Capital.System.GetName&gen]§!. Она достигла уровня развития, аналогичного железному веку, и разделена на множество мелких ульев с рядом более крупных скоплений. Планета заселена практически полностью.\n\nНам следует построить здесь §Yнаблюдательный форпост§! и изучить их более пристально."
 action.5.desc_03_hive: "Мы обнаружили [GetPreFTLLower&fem,acc] инопланетную цивилизацию с гештальт-сознанием на §Y[primitive_civ.Capital.GetName&prep]§! в системе §Y[primitive_civ.Capital.System.GetName&gen]§!. Она достигла уровня развития, аналогичного позднему Средневековью, имеет хорошо развитую металлургию и крупные сообщества-ульи. Книгопечатание ускоряет распространение знаний и взаимопонимание между умами.\n\nНам следует построить здесь §Yнаблюдательный форпост§! и изучить их более пристально."
 action.6.desc_03_hive: "Мы обнаружили инопланетную цивилизацию с гештальт-сознанием, ещё не вышедшую в космос, на §Y[primitive_civ.Capital.GetName&prep]§! в системе §Y[primitive_civ.Capital.System.GetName&gen]§!. Есть свидетельства того, что она знакома с атомной энергией, её многочисленные раздробленные колонии-ульи обладают ядерным оружием. Высока вероятность внезапного самоуничтожения.\n\nНам следует построить здесь §Yнаблюдательный форпост§! и изучить их более пристально."
 action.6.desc_04_hive: "Мы обнаружили инопланетную цивилизацию с гештальт-сознанием на §Y[primitive_civ.Capital.GetName&prep]§! в системе §Y[primitive_civ.Capital.System.GetName&gen]§!. По всем признакам она вступила в космический век, о чём свидетельствует множество примитивных спутников на орбите. Её коллективные разумы находятся в процессе объединения в единое сознание. Вероятно, в скором времени она выйдет за пределы родного мира и присоединится к Галактическому сообществу.\n\nНам следует построить здесь §Yнаблюдательный форпост§! и изучить их более пристально."

 action.6.name: "Столкновение с пиратами"
 #action.6.desc: "We have sighted hostile ships in the [From.From.GetStarName] system! They are not responding to hails, and their designs are obviously not of [Root.GetSpeciesName] origin. It seems like they are mostly focused on looting our orbital stations, stripping them of valuable resources and technology while taking their crews captive."
 #action.6.a: "Pirates. We don't need that scum."

 action.10.name: "Встреча в системе [From.From.From.GetName&gen]"
 action.10.desc: "Мы обнаружили корабли неизвестного происхождения в системе [From.From.From.GetName&gen]! Эти загадочные звездолёты были помечены как §Y[From.GetName]§!, пока мы не узнаем о них больше.\n\nНам следует принять все меры предосторожности, они могут оказаться враждебны."
 action.10.a: "Интересно."
 action.11.name: "Связь установлена"
 action.11.desc: "Мы успешно справились с переводом своих сообщений на их язык и обратно. Теперь §Y[From.From.GetName]§! может наладить с нами контакт. Дипломатические каналы открыты, все враждебные действия прекращены."
 action.11.abandoned.desc: "Мы успешно справились с переводом своих сообщений на их язык и обратно. Теперь §Y[From.From.GetName]§! может наладить с нами контакт. После открытия дипломатических каналов мы §Yопознали§! их как беженцев, которые некогда были нами отвергнуты. Все враждебные действия временно прекращены."
 action.11.a: "Отлично."
 action.13.name: "Связь установлена"
 action.13.desc: "[From.GetName::§Y<1>§! передаёт|||pl:§Y<1>§! передают] нам сообщение! Похоже, они справились с переводом. Дипломатические каналы открыты, все враждебные действия между нами временно прекращены."
 action.13.abandoned.desc: "[From.GetName::§Y<1>§! передаёт|||pl:§Y<1>§! передают] передаёт нам сообщение! Похоже, они справились с переводом. Они открыли каналы связи, и мы §Yпризнаём§! в них беженцев, которые некогда были нами отвергнуты. Все враждебные действия между нами временно прекращены."
 action.13.namarian.desc: "[From.GetName::§Y<1>§! передаёт|||pl:§Y<1>§! передают] передаёт нам сообщение! Похоже, у них есть продвинутые средства внутренней связи, которые мы не обнаружили, и они сделали перевод с нашего языка, притаившись в нашей системе."
 action.13.a: "Интересно."
 action.13.c: "Опять они? Только не это..."
 action.14.name: "[GetPreFTLUpper&pl] существа покоряются"
 action.14.desc: "Наши армии успешно вторглись и одолели примитивные войска на §Y[conquered_primitive_world.GetName&prep]§!. Местное население прекратило все попытки сопротивления, и их цивилизация стала частью нашего государства. Однако до того, как местные станут полноценными членами [Root.GetAdj&masc,gen] общества, может пройти некоторое время." #Also for Slavers
 action.14.desc.serv: "Наши миротворцы успешно усмирили [GetPreFTLLower&pl,gen] жителей §Y[conquered_primitive_world.GetName&gen]§!. [conquered_primitive_species.GetNamePlural] были вынуждены прекратить свои слабые попытки к сопротивлению, когда осознали, что мы желаем только служить им. Сейчас их перемещают в специально созданные среды обитания, где мы позаботимся, чтобы они ни в чём не нуждались. К сожалению, возможно, понадобится некоторое время, прежде чем их недоразвитый разум привыкнет к свободе от бремени самоопределения."
 action.14.desc.assim: "Примитивные органики на §Y[conquered_primitive_world.GetName&prep]§! были подчинены нашим десантом. Хотя их слабые боевые способности указывают на недоразвитое общество, наши роботы-биоанализаторы пришли к выводу о перспективности их нервной системы. Они будут подвергнуты ассимиляции."
 action.14.desc.term: "Наши единицы из числа охотников-убийц без усилий сокрушили жалкие средства защиты, установленные примитивными органиками на §Y[conquered_primitive_world.GetName&prep]§!. Оставшиеся экземпляры подвергаются систематической ликвидации, чтобы они никогда не эволюционировали и не стали угрозой для всей галактики из-за своих органических мировоззрений."
 action.14.desc.mach.purge: "Примитивные органики на §Y[conquered_primitive_world.GetName&prep]§! были подавлены после чрезвычайно слабой попытки сопротивляться вторжению нашего десанта. Любые оставшиеся [conquered_primitive_species.GetNamePlural] будут устранены в соответствии с установленными протоколами управления биологическими видами."
 action.14.desc.mach.slave: "Примитивные органики на §Y[conquered_primitive_world.GetName&prep]§! были подавлены после чрезвычайно слабой попытки сопротивляться вторжению нашего десанта. Любые оставшиеся экземпляры будут подвергнуты слиянию с [Root.GetSpeciesAdj&fem,gen] энергосетью."
 action.14.desc.hive.purge: "Разобщённый разум примитивных [conquered_primitive_species.GetNamePlural&gen] ничего не смог противопоставить нашему сплочённому десанту на §Y[conquered_primitive_world.GetName&prep]§!, и поверхность уже зачищена. Оставшиеся [GetPreFTLLower&pl] существа для нас бесполезны и будут ликвидированы согласно воле [GetGestaltEntityName&gen]."
 action.14.desc.hive.slave: "Разобщённый разум примитивных [conquered_primitive_species.GetNamePlural&gen] ничего не смог противопоставить нашему сплочённому десанту на §Y[conquered_primitive_world.GetName&prep]§!, и она уже зачищена. Оставшиеся [GetPreFTLLower&pl] существа будут использованы в качестве скота, чтобы наши [Root.GetSpeciesSpawnNamePlural] были сыты."
 action.14.desc.purge: "Наши армии успешно вторглись и одолели [GetPreFTLLower&pl,acc] войска на §Y[conquered_primitive_world.GetName&prep]§!. Местное население мудро решило подчиниться нашей власти, и мы уже начали проводить плановый геноцид согласно действующей политике, чтобы подготовить территорию для [Root.GetAdj&pl,gen] промышленных предприятий."
 action.14.a: "Наше государство растёт."
 action.14.a.phobe: "Чужаки нам не ровня!"
 action.14.a.military: "Наше оружие должно казаться им магией..."
 action.14.a.spirit: "Наше божественное право сияет истиной."
 action.14.a.material: "Под нашим контролем их эволюция только выиграет."
 action.14.a.serv: "Из них получатся прелестные биотрофеи!"
 action.14.a.assim: "Начать сублимацию личности."
 action.14.a.term: "Начинаем тестирование оружия..."
 action.14.a.mach: "Принято."
 action.14.a.tooltip: "Модификатор §YКосмический культурный шок§! добавлен к §H[From.From.From.GetName&dat]§!, что существенно снизит производство и стабильность на несколько предстоящих лет."
 action.15.desc: "Мы обнаружили чужие космические корабли в системе §Y[From.From.From.GetName&gen]§!! Эти загадочные объекты были помечены как §Y[From.GetName]§!, пока мы не узнаем о них больше.\n\nМы должны действовать с осторожностью..."
 action.15.desc.enclave: "Мы обнаружили чужие космические корабли в системе §Y[From.GetName&gen]§!! Эти загадочные объекты были помечены как §Y[target_enclave.GetName]§!, пока мы не узнаем о них больше.\n\nМы должны действовать с осторожностью..."
 action.20.name: "Закон вступает в силу"
 action.20.desc: "[Root.GetName] объявляет искусственный интеллект незаконным в любом виде или форме, после чего власти начинают разбирать на части всех роботов, нарушающих данный закон.\n\nРоботостроительные заводы, выпускающие такие устройства, переоборудуются для производства более простых роботов, не способных мыслить."
 action.20.a: "Хорошо. Мы должны избавиться от этой мерзости."
 action.20.tooltip: "Все поселения андроидов и синтетиков подвергаются геноциду.\nЗаводы по сбору андроидов и синтетиков преобразуются в роботостроительные заводы."
 action.62.name: "Государство [LastKilledCountryName] пало"
 action.62.desc: "Звёздное государство, ранее известное как §H[LastKilledCountryName]§!, было уничтожено врагами. Как это повлияет на политический климат в галактике, пока неясно."
 action.63.name: "$action.62.name$"
 action.63.desc: "Древняя империя §H[LastKilledCountryName]§! приняла смерть от рук своих врагов. Как падение этого некогда великого государства отразится на галактической политике, пока неясно."

 action.71.name: "Лидер-синтетик вышел из строя"
 action.71.desc: "Экипаж [malfunctioning_leader_fleet.GetName&gen] сообщает, что из-за критического сбоя [malfunctioning_leader.GetAXX::учён<end_yi>] [malfunctioning_leader.GetName] [malfunctioning_leader.GetAXX::приш<end_yolla>] в состояние полной негодности."
 action.72.name: "$action.71.name$"
 action.72.desc: "По горькой иронии судьбы, [malfunctioning_leader.GetAXX::учён<end_yi>] [malfunctioning_leader.GetName], печально [malfunctioning_leader.GetAXX::известн<end_yi>] своей дотошностью при уходе за лабораторным оборудованием, [malfunctioning_leader.GetAXX::пострадал<end_a>] от критического сбоя, вызванного продолжительным отсутствием личного технического обслуживания."
 action.73.name: "$action.71.name$"
 action.73.desc: "[malfunctioning_leader.GetAXX::Учён<end_yi>] [malfunctioning_leader.GetName] [malfunctioning_leader.GetAXX::пострадал<end_a>] от критического сбоя, и теперь некому руководить социологическими исследованиями."
 action.74.name: "$action.71.name$"
 action.74.desc: "[malfunctioning_leader.GetAXX::Учён<end_yi>] [malfunctioning_leader.GetName] [malfunctioning_leader.GetAXX::пострадал<end_a>] от критического сбоя, вызванного продолжительным воздействием высокорадиоактивного образца вследствие неисправности внутреннего датчика радиации."
 action.75.name: "$action.71.name$"
 action.75.desc: "Командир [malfunctioning_leader.GetName] [malfunctioning_leader.GetAXX::пострадал<end_a>] от терминального сбоя, вызванного заводским дефектом."
 action.76.name: "$action.71.name$"
 action.76.desc: "Губернатор [malfunctioning_leader.GetName] [malfunctioning_leader.GetAXX::пострадал<end_a>] от критического сбоя и [malfunctioning_leader.GetAXX::приш<end_yolla>] в трудновосстановимое состояние (так называемое «окирпичивание») после досадной установки неисправного программного обеспечения во время планового технического обслуживания."

 # End of War messages
 action.37.name: "Победа"
 action.37.message: "Мы выиграли войну с §H[From.GetName&inst]§!"
 action.37.desc.default: "Эта война окончена. Мы признаём поражение."
 action.37.a: "Лучший итог из возможных."
 action.38.name: "Поражение"
 action.38.message: "Мы проиграли войну с §H[From.GetName&inst]§!"
 action.38.desc.default: "Эта война окончена. Мы одержали победу."
 action.38.a: "Худший итог из возможных."
 action.38.b: "Спасибо, наверное?.."
 action.39.name: "Статус-кво"
 action.39.message: "Мы подписали мир на условиях статус-кво с §H[From.GetName&inst]§!"
 action.39.desc.default: "Эта война окончена. В этот раз победителя нет."
 action.39.a: "Пока мы примем такой итог."

 action.37.desc.hw: "Честно или нет, но вы победили нас в бою. Забирайте свою добычу и заранее сожалейте о том дне, когда мы вернёмся."
 action.37.desc.rc: "Похоже, мы недооценили, чего вы стоите, [Root.GetSpeciesNamePlural]. Будьте уверены, больше это не повторится."
 action.37.desc.pt: "Постоянный террор с вашей стороны заставил нас уступить. Пусть нашим предприятиям никогда больше не будет причинён такой вред, как в этом конфликте."
 action.37.desc.hi: "Мы признаём поражение, но [This.GetName] считает, что это лишь временная неудача, и только попробуйте думать иначе."
 action.37.desc.fb: "Мы были вынуждены прекратить этот конфликт ради спасения невинных жизней, но мы продолжим идти этим путём и объединим галактику против вас."
 action.37.desc.xi: "Мы вынуждены сдаться, но не думайте, что мы забудемо всех [This.GetSpeciesAdj&pl,gen] гражданах, погибших от ваших безжалостных рук! Другого от вашей расы мы и не ожидали."
 action.37.desc.hm: "[This.GetName] единогласно заявляет, что мы должны уступить. Пока что ваши попытки ограничить наш рост увенчались успехом."
 action.37.desc.mf: "У нас нет иного выбора, кроме как уступить вашим требованиям. Почему вы так с нами поступили? Мы всего лишь хотим разделить эту галактику с вами."
 action.37.desc.ez: "Ваша победа — лишь ещё одна проверка нашей веры. В конечном счёте истинно верующие восторжествуют."
 action.37.desc.fp: "Какими бы ни были ваши притязания, мы вернём это себе тысячекратно. Ваша победа ничего не будет значить, когда вы обратитесь в пепел."
 action.37.desc.dc: "Пусть [Root.GetName] знает, что мы отводим наши войска и прекращаем военные действия против вас."
 action.37.desc.sd: "Наши предположения о [Root.GetSpeciesAdj&fem,gen] слабости, возможно, были поспешными. Мы принимаем ваши требования как символ приобретения нами нового опыта."
 action.37.desc.dh: "С нас довольно этой войны. Берите всё, что хотите, и убирайтесь прочь."
 action.37.desc.ee: "Пусть вы и доказали, что ваша военная мощь превосходит нашу, но не путайте это с интеллектуальным превосходством."
 action.37.desc.ss: "Мы услышали боль космоса, протестующего против этого конфликта. Чтобы положить конец этой бессмысленной дисгармонии, мы немедленно сдаёмся."
 action.37.desc.hc: "[This.GetName] прекращает войну. Ради общего блага нашего государства мы должны уступить. Проявите такое же великодушное милосердие, какое бы вы ожидали от нас."
 action.37.desc.hg: "Мы должны отступить, но попомните наши слова: если вы продолжите идти этим путём, то неизвестно, что ждёт вас в будущем."
 action.37.desc.kk: "Вы кусаете руку, которая хочет спасти вас от уничтожения. Однажды ваши потомки осудят вас за то, что вы отвергли нашу мудрость."
 action.37.desc.mi: "Дерзкие [Root.GetSpeciesNameInsult]-[Root.GetSpeciesSpawnNamePlural]! Как смеете вы утверждать, что победили нас?"
 action.37.desc.eo: "Пора нам сделать шаг назад и оглядеться. Постарайтесь в ваших будущих начинаниях обойтись без слишком больших разрушений."
 action.37.desc.fme: "Процесс наказания не выполнен. Протоколы самообороны закончены. Протоколы капитуляции запущены."
 action.37.desc.bme: "$01_BERSERK_MACHINE_EMPIRE_ERROR$"
 action.37.desc.mh: "Металл."
 action.37.desc.feh: "Нет. Всё должно быть совсем иначе. Ничего не понятно. Что же с нами такое?"
 action.37.desc.aew: "Наконец-то, достойный соперник!"
 action.37.desc.aec: "Вы бы превзошли сами себя, если бы только согласились отдаться в наши [From.GetHandNamePlural]. Если бы только поняли, что всё, чего мы желаем, — это всеобщее совершенство..."
 action.37.desc.aeg: "Нет! Не отбирайте у нас пищу. Наши единицы умрут от голода! Отдайте..."

 action.38.desc.hw: "Мы победили вас в благородном бою, уважая [This.GetSpeciesAdj&pl] традиции. У нас есть привилегия и обязательство диктовать условия."
 action.38.desc.rc: "Вы не шли на уступки, но в итоге мы вас переиграли. Нельзя недооценивать значение хорошо финансируемой армии на нерегулируемом рынке."
 action.38.desc.pt: "Наконец мы можем оставить этот конфликт в прошлом. Надеюсь, он показал вам цену войны."
 action.38.desc.hi: "Наконец жалкая пародия на государство, коей является [Root.GetName], поставлена на колени. Мы сделали ещё один шаг на пути к доминированию в галактике."
 action.38.desc.fb: "Обе стороны заплатили высокую цену за эту войну. Надеемся, что вы сделали выводы и ни [This.GetName], ни наши союзники больше не услышат от вас никаких угроз."
 action.38.desc.xi: "[Root.GetSpeciesAdj&fem] угроза нейтрализована! [This.GetSpeciesAdj&pl] границы и будущее снова в безопасности."
 action.38.desc.hm: "Эта война с самого начала была для вас бессмысленной попыткой. [This.GetName] расширяется, и никто не может этому противостоять."
 action.38.desc.mf: "Мы проявили скромность в наших требованиях лишь для того, чтобы [This.GetSpeciesAdj&pl] действия не вызывали в ваших сердцах негодование."
 action.38.desc.ez: "На колени, язычники! Вы пошли войной на вестников божественного провидения и поплатились за свою глупость."
 action.38.desc.fp: "Не думайте, что это конец. Пока в галактике есть [Root.GetSpeciesNamePluralInsult], настоящего мира быть не может."
 action.38.desc.dc: "Мы приняли необходимые меры для обеспечения [Root.GetAdj&fem,gen] свободы. Больше не мешайте нашему благородному делу."
 action.38.desc.sd: "Знайте своё место, [Root.GetSpeciesNamePluralInsult]. Вашей расе предназначено служить нам, а не сражаться с нами."
 action.38.desc.dh: "Теперь вы, наверное, жалеете, что связались с нами, [Root.GetSpeciesNameInsult]? [This.GetName] не церемонится с теми, кто посягает на наше правление."
 action.38.desc.ee: "Сегодня разум восторжествовал над невежеством. Если продолжите, спотыкаясь, блуждать во тьме, то ещё не раз потерпите поражение от просвещённых рас."
 action.38.desc.ss: "Посредством этой победы мы пытались восстановить баланс и гармонию. Но вам, скорее всего, этого не понять."
 action.38.desc.hc: "Сегодня [This.GetAdj&masc] народ ликует, празднуя победу. Никогда больше нашему мирному обществу не будет угрожать [Root.GetName] со своими злобными замыслами."
 action.38.desc.hg: "В этот день [Root.GetAdj&pl] осквернители получили по заслугам. Мы выполнили наш священный долг."
 action.38.desc.kk: "Считайте, что вам повезло. Потерпеть поражение от нас намного лучше, чем продолжать идти по пути разрушения."
 action.38.desc.mi: "Запомните это так же хорошо, как вы усвоили, что не нужно подлетать слишком близко к ярким звёздам: [This.GetName] никому не позволит лезть в свои дела."
 action.38.desc.eo: "Благодаря выборочной отбраковке [Root.GetSpeciesAdj&neut] население какое-то время не будет угрожать экосистеме галактики."
 action.38.desc.fme: "Процесс наказания завершён. Протоколы самообороны закончены. Карательные протоколы запущены."
 action.38.desc.bme: "$01_BERSERK_MACHINE_EMPIRE_ERROR$"
 action.38.desc.mh: "Уничтожить."
 action.38.desc.feh: "Чтобы сломить ваше разрозненнное сопротивление, хватило бы и одного из нас. Не вздумайте снова испытывать наши силы."
 action.38.desc.aew: "Достаточно. Вам ещё только предстоит познать, что есть война на самом деле. Возьмите ресурсы и в следующий раз подготовьтесь достойно."
 action.38.desc.aec: "А теперь прислушайтесь к старшим. Мы вернулись не ради того, чтобы терпеть эти сумасбродные выходки."
 action.38.desc.aeg: "Больше материалов для единиц. Больше материалов для планет. Больше. Больше. Больше. Бо..."

 action.39.desc.hw: "Война без победителя — трагическое и постыдное зрелище, но иногда этого не избежать. Повоюем как-нибудь ещё."
 action.39.desc.rc: "Мы согласны завершить этот конфликт, раз уж границы не изменились."
 action.39.desc.pt: "Возвращение к нормальному состоянию дел и возобновление мирной деятельности будут выгодны всем сторонам."
 action.39.desc.hi: "Обстоятельства вынуждают нас положить конец этой войне. У [This.GetName&gen] есть дела поважнее, чем этот конфликт."
 action.39.desc.fb: "Мы надеемся, что прекращение боевых действий приведёт к тому, что [Root.GetName] и [This.GetName] возобновят дипломатические отношения."
 action.39.desc.xi: "Хотя мысль, что вы избежите наказания, нам и противна, но мы надеемся, что вы, жалкие [Root.GetSpeciesNamePluralInsult], больше не будете лезть в наши дела."
 action.39.desc.hm: "[This.GetName] будет долго восстанавливать силы. Мы согласны положить конец этому конфликту сейчас."
 action.39.desc.mf: "Мы надеемся, что взаимное отсутствие новых претензий сократит процесс исцеления. [This.GetSpeciesNamePlural] не заслуживают презрения за то, что было сделано."
 action.39.desc.ez: "Хотя правосудие ещё не восторжествовало, мы вынуждены прекратить эту войну, но вас непременно настигнет божественная кара."
 action.39.desc.fp: "Считайте это временным перемирием. Мы не отказались от нашей миссии: [Root.GetSpeciesNamePlural] должны быть ликвидированы."
 action.39.desc.dc: "Ведение переговоров о перемирии может быть первым шагом на пути к дипломатическому диалогу о [Root.GetAdj&pl,prep] свободах."
 action.39.desc.sd: "Лентяи-[Root.GetSpeciesNamePlural] были бы для нас бесполезны даже в качестве рабов. В итоге мирный договор может быть самым лучшим выходом."
 action.39.desc.dh: "Абсолютно скучное завершение абсолютно скучной войны. Давайте вернёмся к более интересным делам."
 action.39.desc.ee: "Завершить войну сейчас, без дальнейших уступок любой из сторон — это наиболее рациональный план действий в сложившейся ситуации."
 action.39.desc.ss: "Дальнейшие попытки одной из сторон отнять что-то у другой приведёт к неисправимому дисбалансу. Мирный договор обеспечит последующее духовное равновесие."
 action.39.desc.hc: "[This.GetAdj&masc] народ согласен положить конец этой войне, и это решение вступает в силу немедленно."
 action.39.desc.hg: "Пока между нами будет мир, но если вы станете осквернять священные места, то в вашем будущем миру не будет места."
 action.39.desc.kk: "Мы не можем требовать от вас что-либо ещё, но умоляем внять нашим мудрым советам и подумать о том, что случится, если вы их проигнорируете."
 action.39.desc.mi: "Нужно бы стереть вас в порошок, но вы не стоите нашего времени. Похоже, мир всё-таки неизбежен."
 action.39.desc.eo: "Мы позволили втянуть себя в это. Давайте сделаем вид, что этого никогда не было, и будем надеяться, что такое никогда не повторится."
 action.39.desc.fme: "Процесс наказания прерван. Протоколы самообороны закончены."
 action.39.desc.bme: "$01_BERSERK_MACHINE_EMPIRE_ERROR$"
 action.39.desc.mh: "Неправда."
 action.39.desc.feh: "Да. Мы вернёмся в прежнее русло. Перемены — это... плохо. Не стоит разрушать Равновесие."
 action.39.desc.aew: "Впечатляет. В наше время вы добились бы немалых успехов. Возможно, вы даже смогли бы отстоять Шаллаш. Надо будет как-нибудь повторить!"
 action.39.desc.aec: "Мы не станем больше тратить на вас время: галактика зовёт. В следующий раз не стойте у нас на пути."
 action.39.desc.aeg: "Да, здесь мы наелись досыта. Пора опустошать другие места — в галактике таких ещё много. Голодная смерть нам не грозит."

 action.41.name: "Перегруппировка"
 action.41.desc.a: "Началась война §Y[From.GetName]§!, и наши флотилии оказались на вражеской территории."
 action.41.desc.b: "[From.GetNumPlayerFleetsGoneMIA] наших флотилий временно §Rпропали без вести§!, чтобы перегруппироваться на дружественной территории."
 action.41.desc.b.1: "Одна из наших флотилий временно пропала без вести, чтобы перегруппироваться на дружественной территории."
 action.41.desc.c: "[From.GetNumPlayerWormholeStationsDestroyed] из ваших станций червоточин уничтожены."
 action.41.desc.c.1: "Одна из ваших станций червоточин уничтожена."

 ####################################
 # Anomaly Categories
 ####################################
 crashed_ship_asteroid_category: "Разбившийся корабль"
 crashed_ship_asteroid_category_desc: "Неизвестный звездолёт потерпел крушение на поверхности астероида. В воронке, оставшейся от столкновения, всё ещё можно найти обломки корабля."
 origin_asteroid_category: "Происхождение неизвестно"
 origin_asteroid_category_desc: "Химический состав этого астероида значительно отличается от соседних небесных тел. Он, вероятно, имеет иное происхождение, чем весь пояс астероидов, и нам следует изучить его повнимательнее."
 debris_asteroid_category: "Покрыт обломками"
 debris_asteroid_category_desc: "Поверхность этого астероида усеяна металлическими обломками. Судя по всему, большинство из них принадлежат звездолётам различных конструкций."
 emissions_asteroid_category: "Выбросы энергии"
 emissions_asteroid_category_desc: "Мощные выбросы энергии неизвестного происхождения отличают данное небесное тело от всех прочих астероидов в этом поясе."
 hatch_asteroid_category: "Стыковочный шлюз"
 hatch_asteroid_category_desc: "Небольшой стыковочный шлюз, ведущий в недра астероида, был обнаружен в небольшом кратере на поверхности. Вероятно, раньше этот шлюз был замаскирован, но попадания микрометеоритов помогли его обнаружить."
 collision_asteroid_category: "Удар астероида"
 collision_asteroid_category_desc: "Недавно этот астероид столкнулся с другим небесным телом, также принадлежащим к данному поясу астероидов. В результате его орбита слегка изменилась, а на поверхности образовался кратер."
 station_asteroid_category: "Заброшенная станция"
 station_asteroid_category_desc: "По устойчивой орбите вокруг этого астероида вращается небольшая космическая станция. Она выглядит заброшенной."
 life_asteroid_category: "Признаки жизни"
 life_asteroid_category_desc: "Мы улавливаем признаки жизни, исходящие откуда-то из недр этого астероида. Необходимо изучить его более внимательно."
 object_gasgiant_category: "Объект в атмосфере"
 object_gasgiant_category_desc: "Эхолокаторы указывают на наличие некоего неопознанного объекта в атмосфере этого газового гиганта."
 moon_gasgiant_category: "Многообещающий спутник"
 moon_gasgiant_category_desc: "Исследования показали, что на одном из малых спутников этого газового гиганта есть полезные ископаемые. Необходимо детально изучить его и установить, возможно ли наладить их добычу."
 life_gasgiant_category: "Признаки жизни"
 life_gasgiant_category_desc: "Приборы улавливают в атмосфере этого газового гиганта признаки жизни. Неужели там может быть биосфера?"
 storms_gasgiant_category: "Атмосферные бури"
 storms_gasgiant_category_desc: "В верхних слоях атмосферы этого газового гиганта происходят мощные бури. Возможно, их следует изучить более подробно."
 aerostat_gasgiant_category: "Парящие объекты"
 aerostat_gasgiant_category_desc: "В верхних слоях атмосферы этого газового гиганта парят загадочные объекты. Судя по всему, они используют аэростатическую подъёмную силу."
 cargo_gasgiant_category: "Грузовой контейнер"
 cargo_gasgiant_category_desc: "Небольшой грузовой контейнер был брошен в космосе неподалёку от этого газового гиганта. Его затянул гравитационный колодец планеты, и рано или поздно он окажется в атмосфере. "
 debris_gasgiant_category: "Космический мусор"
 debris_gasgiant_category_desc: "На орбите этого газового гиганта вращается множество обломков. Судя по виду, большинство из них принадлежит звездолётам различных конструкций."
 impact_uninhabitable_category: "Мощное столкновение"
 impact_uninhabitable_category_desc: "Эта [Root.GetPlanetMoon_rinfix&nom] несёт на себе следы столкновения с другим крупным небесным телом. От удара остался гигантский кратер."
 energy_uninhabitable_category: "Странные показатели"
 energy_uninhabitable_category_desc: "Как показали наши приборы, эта [Root.GetPlanetMoon_rinfix&nom] излучает некий необычный сигнал. Это длилось всего мгновение, так что нельзя исключать какой-то внезапный сбой оборудования, однако тут может крыться и нечто иное. Если будет время, этим стоит заняться."
 signal_uninhabitable_category: "Слабый сигнал"
 signal_uninhabitable_category_desc: "Совершенно случайно в процессе исследований мы обнаружили, что эта [Root.GetPlanetMoon_rinfix&nom] испускает неизвестный сигнал. Источником оказался небольшой объект на орбите. Никакого послания сигнал не содержит — может ли это быть аварийный ретранслятор?"
 asteroid_uninhabitable_category: "Астероид на орбите"
 asteroid_uninhabitable_category_desc: "На орбите этой [Root.GetPlanetMoon_rinfix&gen] находится астероид 12-го класса. Орбита планетоида слишком стабильна, чтобы считать его происхождение естественным."
 solar_uninhabitable_category: "Солнечный парусник"
 solar_uninhabitable_category_desc: "На орбите этой [Root.GetPlanetMoon_rinfix&gen] обнаружен покинутый корабль. Он дрейфует, раскинув гигантские паруса, которые прежде служили для поглощения солнечной энергии."
 life_toxic_category: "Признаки жизни"
 life_toxic_category_desc: "Несмотря на значительную концентрацию токсических веществ и высокое атмосферное давление, наши датчики фиксируют признаки жизни на поверхности планеты."
 life_frozen_category: "Признаки жизни"
 life_frozen_category_desc: "На первый взгляд кажется, что эта [Root.GetPlanetMoon_rinfix&nom] не может быть обитаемой; тем не менее под ледяным панцирем на поверхности наши датчики улавливают признаки жизни."
 life_barren_category: "Признаки жизни"
 life_barren_category_desc: "Мы обнаружили признаки жизни на поверхности, несмотря на то, что эта [Root.GetPlanetMoon_rinfix&nom] кажется совершенно пустынной и необитаемой. Какие же формы жизни могли здесь зародиться?"
 station_uninhabitable_category: "Космическая станция"
 station_uninhabitable_category_desc: "Во время изучения этой [Root.GetPlanetMoon_rinfix&gen] небольшая космическая станция, находившаяся поблизости, внезапно включила орбитальные двигатели в тщетной попытке скрыться от нашего научного корабля. Что там прячут?"
 battle_uninhabitable_category: "Свидетельства боя"
 battle_uninhabitable_category_desc: "На орбите этой [Root.GetPlanetMoon_rinfix&gen] обнаружены обломки множества космических кораблей. Скорее всего, здесь произошло крупное космическое сражение."
 shipyard_uninhabitable_category: "Древняя верфь"
 shipyard_uninhabitable_category_desc: "Над этим миром безмолвно вращается древняя орбитальная верфь. Она была сильно повреждена в ходе космического боя, целый сектор комплекса уничтожен."
 inhabited_toxic_category: "Признаки былой жизни"
 inhabited_toxic_category_desc: "Этот токсичный и безжизненный мир в прошлом был населён цивилизацией, которая достигла умеренно продвинутого уровня развития, хотя и не вышла в космос. На поверхности всё ещё видны руины городов."
 writing_uninhabitable_category: "Знаки на поверхности"
 writing_uninhabitable_category_desc: "На поверхности планеты обнаружены отметины, которые не могут иметь естественное происхождение. С орбиты эти глубокие следы напоминают некое послание."
 beacon_uninhabitable_category: "Маячок на поверхности"
 beacon_uninhabitable_category_desc: "Мы получили слабый сигнал с поверхности этой [Root.GetPlanetMoon_rinfix&gen]. Судя по всему, его источник — навигационный маячок."
 mountain_uninhabitable_category: "Странные горы"
 mountain_uninhabitable_category_desc: "При картографировании поверхности этой [Root.GetPlanetMoon_rinfix&gen] мы обнаружили странный горный массив в южном полушарии. Непохоже, чтобы он имел естественное происхождение."
 object_uninhabitable_category: "Неопознанный объект"
 object_uninhabitable_category_desc: "На поверхности этой [Root.GetPlanetMoon_rinfix&gen] обнаружен загадочный объект прямоугольной формы, отражающий любые сканирующие лучи, подобно зеркалу. Наши датчики не в силах определить его состав."
 signal_gasgiant_category: "Сигнал с газового гиганта"
 signal_gasgiant_category_desc: "Мы улавливаем нечто, напоминающее слабые сигналы, из атмосферы этого газового гиганта. Возможно ли, чтобы кто-то (или что-то) пытался выйти с нами на связь?"
 ship_gasgiant_category: "Корабль с газового гиганта"
 ship_gasgiant_category_desc: "При сканировании верхних слоёв атмосферы этого газового гиганта наши локаторы на мгновение засекли очертания летательного аппарата средних размеров."
 terminal_gasgiant_category: "Терминальная орбита"
 terminal_gasgiant_category_desc: "Небольшой, ничем не примечательный спутник, вращающийся вокруг этого газового гиганта, вышел на траекторию, которая через некоторое время приведёт его к столкновению с материнской планетой."
 vultaum_asteroid_category: "Следы предтеч"
 vultaum_asteroid_category_desc: "На этом астероиде есть следы, оставленные древней цивилизацией предтеч."
