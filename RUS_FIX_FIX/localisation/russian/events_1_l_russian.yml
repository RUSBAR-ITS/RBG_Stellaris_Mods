 ####################################
 # Anomaly Events
 ####################################
 anomaly.1.name: "Астероид-копролит"
 anomaly.1.desc: "Все признаки указывают на то, что астероид [From.GetName] является копролитом — то есть сгустком окаменелых экскрементов какого-то гигантского живого существа. По нашим данным его возраст составляет около миллиарда лет, и за этот срок практически все изначальные органические компоненты подверглись минерализации. Наши учёные не могут даже предположить, что за создание могло оставить после себя нечто подобное."
 anomaly.5.name: "Пиратское сокровище"
 anomaly.5.desc: "Насколько мы можем судить, примерно тысячу лет назад этот астероид использовался космическими пиратами в качестве перевалочной базы. Внутри мы отыскали тайник с сокровищами — по большей части безделушки и артефакты, но кое-что до сих пор представляет ценность."
 anomaly.5.a: "Это награбленное добро послужит нам на благо."
 anomaly.10.name: "Фауна астероида"
 anomaly.10.desc: "Невероятно, но экипаж [Root.GetName&gen] во время изучения [From.GetName&gen] обнаружил на астероиде признаки жизни. В толще камня, изъеденной туннелями, скрывается целая колония червеобразных скалоедов. Эта уникальная форма жизни вполне приспособилась к низким температурам открытого космоса."
 anomaly.10.a: "Этих существ нужно изучать."
 anomaly.10.b: "Они совсем как мы!"
 anomaly.15.name: "Окаменелости на астероиде"
 anomaly.15.desc: "На астероиде [From.GetName] нет жизни и атмосферы, однако на его поверхности были обнаружены окаменелые останки нескольких видов водных существ. Ранее высказывались предположения, что весь окружающий пояс астероидов образовался из обломков планеты, и новая находка подтверждает эту теорию. Судя по останкам, здесь существовала жизнь, а планета была, по крайней мере отчасти, покрыта водой."
 anomaly.15.b.evopred: "Жаль, что они не успели эволюционировать сильнее."
 anomaly.25.name: "Заброшенная верфь"
 anomaly.25.desc: "Астероид [From.GetName] был выдолблен изнутри для постройки звездолётной верфи. Впоследствии верфь была заброшена и несколько столетий подвергалась воздействию вакуума. Если там и оставалось что-то ценное, всё это было давно растащено. Однако сама конструкция уникальна, и её изучение, возможно, принесёт большую пользу."
 anomaly.25.a: "Стоит исследовать это сооружение."
 anomaly.30.name: "Свалка"
 anomaly.30.desc: "Очевидно, в далёком прошлом этот астероид был свалкой. В его слабый гравитационный колодец сбрасывались всевозможные детали техники и металлический мусор. Астероид постепенно притягивает всё это к поверхности, и без того густо усеянной обломками. Здесь едва ли можно отыскать что-то ценное, но добывающая станция могла бы собирать металл."
 anomaly.30.a: "Следует переработать всё, что получится."
 anomaly.35.name: "Разбившийся разведбот"
 anomaly.35.desc: "Небольшой разведывательный бот неизвестной конструкции врезался в поверхность этого астероида несколько тысячелетий назад, пропахав неглубокую борозду. У корабля нет рубки, поэтому мы предполагаем, что он пилотировался на расстоянии, либо им управлял примитивный искусственный интеллект. Он слишком сильно повреждён и восстановлению не подлежит, зато мародёры до него пока не добрались."
 anomaly.35.a: "Мы изучим его конструкцию."
 anomaly.40.name: "Автоматизированная добывающая станция"
 anomaly.40.desc: "На орбите астероида [From.GetName] дрейфует автоматизированная добывающая станция. На её обшивке видны следы от лучевого оружия. Цикл производства был замкнут в цепь обратной связи, однако мы сумели перепрограммировать станцию, и теперь все её системы нам полностью подконтрольны."
 anomaly.40.desc.alt: "Мы обнаружили автоматизированную добывающую станцию на низкой орбите астероида [From.GetName]. Отсутствуют крупные куски обшивки, а рваные отверстия указывают на урон от тяжёлого оружия. Ремонту станция не подлежит, но можно разобрать её на ценные материалы."
 anomaly.50.name: "Испытательный полигон"
 anomaly.50.desc: "Астероид [From.GetName] усеян кратерами от многочисленных взрывов. Примерно две тысячи лет назад здесь, по-видимому, проводились испытания различных видов оружия. Остаточное излучение свидетельствует о том, что это оружие было достаточно необычным, от подпространственных бомб до некоего аналога генератора сингулярности. Нашим учёным было бы любопытно изучить излучение, оставшееся после испытаний."
 anomaly.55.name: "Столкновение с астероидом"
 anomaly.55.desc: "Мы установили, что в прошлом [From.GetName] столкнулся с астероидом меньших размеров, почти целиком состоявшим из драгоценных металлов. Это небольшое сокровище было обнаружено у самой поверхности, и теперь металлы можно добывать свободно."
 anomaly.55.a: "Счастливая находка!"
 anomaly.60.name: "Необычная радиация"
 anomaly.60.desc: "Этот астероид долгое время странствовал в космосе и подвергался воздействию необычной радиации, а потом гравитация притянула его в звёздную систему [From.System.GetName&gen]. Изначальный источник радиации нам неизвестен, однако экипаж [Root.GetName&gen] получил массу полезной информации, исследуя остаточное излучение этого астероида."
 anomaly.65.name: "Разбившийся рудовоз"
 anomaly.65.desc: "[Root.GetName::<1> обнаружил<end_a>] гравитационную аномалию на [From.GetName&prep]. Глубоко под поверхностью астероида нам удалось обнаружить обломки древнего грузового звездолёта. Судя по всему, на момент аварии его трюмы были заполнены ценной рудой, поэтому мы изменили свою первоначальную оценку полезности астероида."
 anomaly.300.name: "Атмосферная экосистема"
 anomaly.300.desc: "Мы обнаружили в верхних слоях атмосферы газового гиганта [From.GetName] процветающую экосистему. Крупные существа парят в воздухе благодаря тому, что их тела заполнены лёгким газом, и питаются энергией молний. В то же время эти создания поддерживают колонии более мелких животных, которые охотятся на атмосферный планктон и друг на друга."
 anomaly.305.name: "Брошенный грузовой контейнер"
 anomaly.305.desc: "Очень давно в верхних слоях атмосферы [From.GetName&gen] кто-то бросил грузовой контейнер. Он ускользнул от внимания других космических путешественников и медленно спускался по орбите в атмосферу газового гиганта, которая поглотила бы его через несколько лет. Команда [Root.GetName&gen] вскрыла контейнер и обнаружила в нём инопланетные украшения, изготовленные из драгоценных металлов."
 anomaly.305.a: "Переплавить их."
 anomaly.305.b: "Продать их."
 anomaly.305.c: "Изучить их строение."
 anomaly.305.d: "Оставим их себе."
 anomaly.310.name: "Социальный эксперимент"
 anomaly.310.desc: "В атмосфере [From.GetName&gen] была обнаружена небольшая дрейфующая колония. Очевидно, она была самодостаточной и состояла из особей различных рас.\n\nВполне возможно, что эта колония была частью социального эксперимента, затеянного несколько веков назад, в результате которого колонисты перебили друг друга. Мы скачали всю информацию, которую удалось добыть из местных баз данных."
 anomaly.310.b.evopred: "Извлечь биомассу."
 anomaly.315.name: "Аэростатные поселения"
 anomaly.315.desc: "На низкой орбите вокруг этого газового гиганта была обнаружена разрушенная сеть аэростатных поселений. Ранее они использовались для добычи полезных ископаемых, потом были заброшены, а впоследствии захвачены представителями самых разных рас и космическими пиратами.\n\nВ поселениях не осталось ничего сколь-нибудь ценного, однако сам факт, что они до сих пор держатся в воздухе, заслуживает изучения. Это может быть любопытно нашим инженерам."
 anomaly.320.name: "Мусорное поле"
 anomaly.320.desc: "[From.GetName] обладает мощным гравитационным колодцем, который затянул в себя большое количество космического мусора. Эти обломки сформировали своего рода облако вокруг газового гиганта. По большей части речь идёт об обломках кораблей, пострадавших в ходе космических боёв много тысяч лет назад.\n\nВсе ценные технологии и артефакты уже были захвачены мародёрами, однако если установить здесь добывающую станцию, мы сможем собирать металл."
 anomaly.325.name: "Разбившийся крейсер"
 anomaly.325.desc: "На сходящей орбите вокруг газового гиганта [From.GetName] был обнаружен искорёженный звёздный крейсер. Вероятнее всего, он погрузился в атмосферу планеты в отчаянной попытке уйти от преследования, однако был раздавлен давлением.\n\nКорабль находится слишком глубоко, чтобы мы могли его извлечь, однако поверхностное сканирование дало нашим инженерам массу полезной информации."
 anomaly.325.a: "Удивительный корабль."
 anomaly.330.name: "Мощные бури"
 anomaly.330.desc: "[From.GetName] отличается частыми и чрезвычайно мощными атмосферными бурями. С орбиты в любое время можно увидеть не менее десятка штормов, скорость ветра в которых зачастую превышает 700 м/с. Причина возникновения этого явления совершенно неочевидна, если исходить из климатической модели планеты. Рекомендуется дальнейшее изучение этой аномалии."
 anomaly.335.name: "Энергетическая сигнатура"
 anomaly.335.desc: "[Root.GetName] улавливает странную энергетическую сигнатуру, источник которой скрыт в недрах атмосферы [From.GetName&gen]. Вероятнее всего, речь идёт о некоем рукотворном сооружении, возможно, о разрушенной орбитальной станции. Но атмосферное давление слишком велико, чтобы мы могли подлететь ближе. Тем не менее, изучение уникальной сигнатуры дало нам массу полезной информации."
 anomaly.340.name: "Драгоценный спутник"
 anomaly.340.desc: "Более детальное сканирование одного из множества естественных спутников газового гиганта [From.GetName] принесло неожиданное открытие. Мы обнаружили богатые залежи драгоценных металлов и минералов, прежде незамеченные. Хотя сам спутник совсем небольшой, он обладает стабильной орбитой и тектонически устойчив."
 anomaly.340.a: "Удачная находка."
 anomaly.600.name: "Столкновение с астероидом"
 anomaly.600.desc: "Много тысяч лет назад с [From.GetName&inst] столкнулся крупный астероид, богатый полезными ископаемыми. Столкновение было очень мощным, и эта [From.GetPlanetMoon_rinfix&nom] несёт на себе его следы. Вокруг кратера, оставшегося после столкновения, в изобилии встречаются ценные минералы."
 anomaly.600.a: "Нам повезло."
 anomaly.605.name: "Сверхсветовое столкновение"
 anomaly.605.desc: "На поверхности [From.GetName&gen] заметен глубокий кратер, образовавшийся, судя по всему, в результате столкновения со звездолётом. По размеру кратера можно сделать вывод, что примерно 10 тысяч лет назад [From.GetPlanetMoon_rinfix&nom] по неизвестной причине столкнулась с кораблём, выходящим из гиперкоридора на максимальной скорости.\n\n[Root.GetName::<1> уловил<end_a>] уловил на месте крушения подпространственные отголоски, которые могли остаться после разрушения поля гиперчастиц, однако подтвердить эту теорию невозможно, поскольку звездолёт полностью разрушился при ударе."
 anomaly.610.name: "Микросингулярность"
 anomaly.610.desc: "Некоторое время назад микросингулярность насквозь прошла через ядро §Y[From.GetName&gen]§!. Обошлось без повреждений, однако в результате энергетические показатели планетарного ядра несколько изменились, что не соответствует существующим научным моделям. Возможно, этот эффект следует изучить более подробно."
 anomaly.615.name: "Перемагничивание"
 anomaly.615.desc: "За время наблюдений, который [Root.GetName::проводил <1>|||fem:проводила <1>|||neut:проводило <1>|||pl:проводили <1>], магнитное поле [From.GetName&gen] претерпело полную инверсию. Вследствие этого редчайшего события магнитные полюса [From.GetPlanetMoon_rinfix&gen] поменялись местами. К счастью, наши корабельные датчики всё зафиксировали, и учёные получили массу ценной информации."
 anomaly.625.name: "Мумифицированный пилот"
 anomaly.625.desc: "Недавно на орбите §Y[From.GetName&gen]§! в верхних слоях атмосферы были обнаружены мумифицированные останки существа, принадлежащего к ранее неизвестной расе млекопитающих. Судя по комбинезону со шлемом, возможно, это пилот истребителя, катапультировавшийся в бою и брошенный на произвол судьбы. Изучение останков оказалось весьма познавательным."
 anomaly.625.a: "Трагическая судьба."
 anomaly.625.b.evopred: "Его кровь потечёт по другим жилам."
 anomaly.630.name: "Древняя спасательная капсула"
 anomaly.630.desc: "На низкой орбите вокруг §Y[From.GetName&gen]§! была обнаружена брошенная спасательная капсула, покрытая окалиной. Вероятно, она пострадала при взрыве материнского корабля. Судя по данным сканеров, ей свыше 5000 лет.\n\nКоманда [Root.GetName&gen] вскрыла капсулу и обнаружила внутри высохшие останки рептилоида в парадной униформе. В когтях он сжимал небольшое изображение существа той же расы — возможно, это был супруг или почитаемый лидер."
 anomaly.630.b.evopred: "Что государи, что рабы — на вкус одно."
 anomaly.635.name: "Скрижали чужаков"
 anomaly.635.desc: "Примерно пять тысяч лет назад кто-то воспользовался лазером орбитальной добывающей станции, чтобы украсить поверхность §Y[From.GetName&gen]§! письменами. Теперь эта [From.GetPlanetMoon_rinfix&nom] представляет собой небесное тело, северное полушарие которого в подробностях повествует о превратностях жизни инопланетного наёмника."
 anomaly.650.name: "Солнечный парусник"
 anomaly.650.desc: "На орбите §Y[From.GetName&gen]§! мы обнаружили заброшенный солнечный парусник неизвестной цивилизации. Он был предназначен для субсветовых скоростей и создан несколько тысяч лет назад. В одном из гигантских парусов имеется большая прореха, оставленная, вероятно, метеороидом, и именно это стало причиной остановки корабля. Хотя он сильно устарел по нашим стандартам, ряд технических решений, использованных при его создании, заслуживают изучения."
 anomaly.650.a: "Любопытный, хотя и примитивный корабль."
 anomaly.655.name: "Удар по касательной"
 anomaly.655.desc: "Во время приближения к §Y[From.GetName&dat]§! корабль §Y[Root.GetName]§! внезапно получил удар по касательной электромагнитными снарядами. По нашим данным, им несколько миллиардов лет, они были выпущены в соседней галактике и залетели сюда по чистой случайности. Пролетев мимо намеченной цели, они продолжили путь и спустя тысячелетия оказались здесь. Невзирая на почтенный возраст, конструкция снарядов оказалась весьма продвинутой."
 anomaly.660.name: "Астероид на прицепе"
 anomaly.660.desc: "Неизвестно, кем и с какой целью на орбиту §Y[From.GetName&gen]§! был притянут астероид, но на его поверхности сохранились секции массивного основного двигателя и тормозные двигатели, давно бездействующие. Те, кто это сделал, также пытались добывать на астероиде полезные ископаемые, однако эти работы были довольно быстро прекращены."
 anomaly.660.b: "Какие разумные чужаки!"
 anomaly.670.name: "Ядерное уничтожение"
 anomaly.670.desc: "Анализ показал, что всего тысячу лет назад на §Y[From.GetName&prep]§! были пригодные для жизни континенты и царил мягкий климат. Сейчас эта [From.GetPlanetMoon_rinfix&nom] представляет собой небесное тело с чрезвычайно токсичной атмосферой, высоким уровнем радиации на поверхности и полным отсутствием жизни.\n\nСудя по всему, эта [From.GetPlanetMoon_rinfix&nom] несёт на себе следы крайне разрушительной ядерной войны, ставшей последней для всей цивилизации."
 anomaly.670.a: "Досадная утрата."
 anomaly.675.name: "Ядерные пустоши"
 anomaly.675.desc_01: "Анализ показал, что сейчас §Y[From.GetName&gen]§! переживает ледниковый период, спровоцированный ядерной войной несколько столетий назад. Последовавшая за этим ядерная зима уничтожила все высшие формы жизни, включая цивилизацию, устроившую этот апокалипсис."
 anomaly.675.desc_02: "Анализ подтвердил, что сейчас §Y[From.GetName&gen]§!, где ранее царил настоящий тропический рай, представляет собой пустошь, выжженную ядерной войной несколько столетий назад. Когда пепел улёгся, радиация уничтожила все высшие формы жизни, включая цивилизацию, устроившую этот апокалипсис."
 anomaly.680.name: "Вспышка гамма-излучения"
 anomaly.680.desc: "24 тысячи лет назад, после взрыва одной из звёзд нашей галактики, по §Y[From.GetName&dat]§! прошёл мощный поток гамма-излучения. Практически все формы жизни были поражены радиацией, и теперь эта [From.GetPlanetMoon_rinfix&nom] представляет собой небесное тело, у которого серьёзно пострадала та сторона, которая была обращена к потоку. Озоновый слой значительно разрежен.\n\nВ результате этого вымерло примерно 86% всех живых существ, погибла цивилизация бронзового века. Развалины её построек ещё можно обнаружить в северном полушарии. Восстановление атмосферы началось только сейчас."
 anomaly.685.name: "Неуправляемый парниковый эффект"
 anomaly.685.desc: "По-видимому, §Y[From.GetName]§! [From.GetName::стал<end_a>] жертвой неуправляемого парникового эффекта, спровоцированного загрязнением окружающей среды. Океаны выкипели, и теперь эта [From.GetPlanetMoon_rinfix&nom] представляет собой небесное тело, окружённое густым слоем облаков в слишком насыщенной атмосфере.\n\nНа поверхности ещё можно обнаружить останки цивилизации, которые свидетельствуют о том, что здесь погибла чрезмерно расплодившаяся раса, достигшая среднего или позднего этапа индустриальной эпохи."
 anomaly.690.name: "Аммиачная биосфера"
 anomaly.690.desc: "§Y[From.GetName]§! обладает высоким давлением и атмосферой, токсичной для большинства форм жизни. Тем не менее, здесь сложился процветающий биоценоз, использующий в качестве растворителя аммиак вместо воды. Развитие жизни пошло по экологической модели, существенно отличающейся от тех, что нам известны. Её изучение существенно расширит наши познания в ксенобиологии."
 anomaly.695.name: "Кремниевые формы жизни"
 anomaly.695.desc: "[From.GetName] отличается безжизненной поверхностью и густой сетью подземных туннелей, где обитают кремниевые формы жизни. Насколько мы можем судить, эти существа питаются камнями и обладают зачатками разума. Благодаря тому, что они постоянно роют новые ходы, на поверхность в большом количестве попадают ценные ископаемые."
 anomaly.700.name: "Самовольная добыча"
 anomaly.700.desc: "Шахтёры-«дикари» с §Y[Root.Owner.Capital.GetName&gen]§! вели нелицензированную добычу полезных ископаемых на [From.GetName&prep]. Они были взяты под стражу, и мы забрали их оборудование."
 anomaly.705.name: "Древний геодезический знак"
 anomaly.705.desc: "Небольшой коротковолновый передатчик был обнаружен на поверхности §Y[From.GetName&gen]§!. Судя по всему, это древний геодезический знак, которым много веков назад здесь пометили крупное месторождение драгоценных металлов. Шахтёры, которым предназначался сигнал, очевидно, так и не прибыли, и залежи по-прежнему на месте."
 anomaly.710.name: "Колония раскольников"
 anomaly.710.desc: "К своему изумлению, команда корабля §Y[Root.GetName]§! наткнулась на небольшое поселение расы[Root.Owner.GetSpeciesName] на поверхности [From.GetName&gen]. Колония была основана группой отважных первопроходцев, давным-давно покинувших [Root.Owner.Capital.GetName&acc] на примитивном звездолёте. До сих пор считалось, что корабль погиб.\n\nДела колонии шли не слишком хорошо, её численность постоянно уменьшалась вот уже несколько поколений. Уцелевшие попросили помочь им вернуться."
 anomaly.710.a: "Добро пожаловать домой!"
 anomaly.710.b: "Пусть сами о себе позаботятся."
 anomaly.715.name: "Останки колонии"
 anomaly.715.desc: "Небольшая колония была основана на [From.GetName&prep] неизвестной цивилизацией 17 тысяч лет назад и, судя по всему, вскоре оказалась заброшена. Не было найдено никаких останков колонистов, и само поселение так и не разрослось за пределы основного комплекса и нескольких метеостанций."

 anomaly.2500.name: "Останки"
 anomaly.2500.desc: "Останки нескольких крупных живых существ космического происхождения были обнаружены на сходящих орбитах вокруг газового гиганта [From.GetName]. Похоже, эти существа были лишены разума, но зато способны к межзвёздным путешествиям, однако в изученных районах космоса о них нет никаких записей. [Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] [Root.Leader.GetAXX::предложил<end_a>] потратить время и ресурсы на то, чтобы изучить их подробнее."
 anomaly.2501.desc: "[Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] [Root.Leader.GetAXX::предположил<end_a>], что [From.From.GetPlanetMoon_rinfix&nom] [From.From.GetName] была орбитальным могильником, куда слетались умирать представители обнаруженной нами неизвестной расы. Сила тяготения гарантировала, что за миллионы лет газовый гигант постепенно втянет в себя каждого из них.\n\nСудя по всему, этот жизненный цикл почему-то оборвался 15 миллионов лет назад, с прибытием последнего из существ. Возможно, они были истреблены какой-то другой расой, которая на них охотилась, или встретили иной, не менее печальный конец."
 anomaly.2510.name: "Океан подо льдом"
 anomaly.2510.desc: "Глубокое сканирование [From.GetName&gen] показало, что под сковывающей поверхность ледяной мантией расположен океан, подогреваемый гидротермальными шахтами. [Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] [Root.Leader.GetAXX::направил<end_a>] с борта [Root.GetName&gen] аппараты для взятия проб. Прорубившись через слой льда толщиной в несколько километров, они обнаружили, что водные глубины заполняет нечто, похожее на живые организмы. Для изучения населяющих этот океан уникальных форм жизни создан особый проект."
 anomaly.2512.desc: "[Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] [Root.Leader.GetAXX::предоставил<end_a>] отчёт об экспедиции в богатейшую биосферу океана под ледяной коркой [From.From.GetName&gen]. Несколько видов существ в его глубинах производят уникальную неорганическую молекулу, обладающую мощнейшим лечебным действием. Если её удастся добывать в больших количествах, это произведёт революцию в медицине и, возможно, будет даже использоваться в промышленности."
 anomaly.2512.desc.mach: "[Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] [Root.Leader.GetAXX::предоставил<end_a>] отчёт об экспедиции в биосферу океана под ледяной коркой [From.From.GetName&gen]. Несколько видов существ в его глубинах производят уникальные неорганические молекулы, обладающие мощнейшим лечебным действием.\n\nЕсли их удастся добывать в достаточно больших количествах, это произведёт революцию в медицинском обслуживании наших любимых биотрофеев и, возможно, даже получит промышленное применение!"
 anomaly.2513.desc: "[Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] [Root.Leader.GetAXX::предоставил<end_a>] отчёт об экспедиции в богатейшую биосферу океана под ледяной коркой [From.From.GetName&gen]. Наша подводная аппаратура создала карту морского дна и составила каталог обнаруженных форм жизни. Это может быть полезно биологам, однако никаких существенных открытий сделать не удалось."
 anomaly.2520.name: "Гигантский скелет"
 anomaly.2520.desc: "То, что мы ранее считали горными хребтами в южном полушарии [From.GetName&gen], оказалось колоссальным скелетом одного-единственного существа неизвестного происхождения.\n\nВозраст костей оценивается в 3.4 миллиарда лет, но наши [Owner.GetScientistPlural&nom] утверждают, что на [From.GetName&prep] не могла зародиться такая форма жизни. [Root.GetScientistCap_rinfix] [Root.GetLeaderName] [Root.Leader.GetAXX::подготовил<end_a>] особый проект, чтобы попытаться разгадать эту тайну."
 anomaly.2520.a.term: "Возможно, мы узнаем новый метод ликвидации."
 anomaly.2520.a.rean: "Мы можем расшевелить его?"
 anomaly.2521.desc: "После тщательного изучения останков, обнаруженных на [From.From.GetName&prep], [Root.Leader.GetAXX::ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] [Root.Leader.GetAXX::сделал<end_a>] вывод, что это существо являлось чем-то вроде органического звездолёта. Внутри крупного скелета были обнаружены кости существ гораздо меньшего размера, принадлежавших по меньшей мере к трём разным расам. Вероятно, это были члены экипажа.\n\nПо неизвестным причинам органический корабль получил критические повреждения и рухнул на поверхность [From.From.GetName&gen]. Мы не представляем, зачем кому-то понадобилось «выращивать» звездолёт, но изучение останков было очень полезно для нашей науки."
 anomaly.2521.desc.bio: "После тщательного изучения огромного скелета, покоящегося на [From.From.GetName&prep], [Root.GetLeaderName] [Root.Leader.GetAXX::подтвердил<end_a>] казавшееся невероятным предположение: когда-то это существо было живым звездолётом. Впрочем, на наши собственные биологические корабли оно похоже лишь отчасти.\n\nСкелет его невероятен: он одновременно и знаком нам, и чужд, словно эволюционировал в совсем иных условиях. Внутри огромной грудной клетки мы обнаружили кости поменьше — по всей видимости, они принадлежали как минимум трём представителям других видов. Вероятно, это были члены экипажа, управлявшие массивным телом изнутри. Эта мысль вызывает тревогу, ведь наши корабли — симбионты, а не пустые оболочки для пилотов.\n\nПричина смерти пока не ясна, но видно, что существо сильно пострадало: его мощный скелет разбился при ударе о поверхность. Погиб ли экипаж вместе с ним? Возможно ли такое, что команда была неотделима от самого звездолёта и выступала его разумом?\n\nПроисхождение гиганта так и останется загадкой, но после изучения останков нам стало гораздо понятнее, каково это — быть живым кораблём. И всё-таки нас терзает один вопрос: родился ли он сам по себе... или его кто-то создал?"
 anomaly.2521.b.evopred: "Кого бы съесть первым — пилотов или корабль?"
 anomaly.2522.desc: "Мы тщательно изучили гигантские останки на [From.From.GetName&prep] и сумели понять, как это существо оказалось здесь. Очень слабое излучение указывает, что некий портал между измерениями недолгое время был открыт в районе задней части существа.\n\n[Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] [Root.Leader.GetAXX::предположил<end_a>], что это существо явилось из другого измерения и погибло во враждебной атмосфере [From.From.GetName&gen]. Откуда оно взялось и что привело его сюда — этого мы, вероятно, никогда не узнаем."
 anomaly.2522.b.evopred: "ДНК есть ДНК, и неважно, из какого она измерения!"
 anomaly.2523.desc: "Скелет вновь шевелится! Колосс нависает над нашими некромантами и делает первый неуклюжий шаг, за которым следует более уверенный. Может быть, количество ног не то же, что при жизни, может быть, конечностей стало меньше или больше. Благодаря сочетанию выращенной в лабораториях мышечной ткани и совершенных гидравлических протезов гигант готов помочь нам на поле боя, и земля дрожит под его поступью."
 anomaly.2523.tooltip: "Добавляет §G1§! §YГигантский скелет§! на орбиту."
 anomaly.2530.name: "Свидетельства боя"
 anomaly.2530.desc: "Есть явные свидетельства того, что не ранее 5000 лет назад на низкой орбите [From.GetName&gen] состоялось крупное космическое сражение. Эта [From.GetPlanetMoon_rinfix&nom] с одной стороны несёт следы многочисленных орудийных попаданий в виде кратеров, и сканеры [Root.GetName&gen] выявили среди обломков на поверхности корпусы звездолётов.\n\nВсе они были сильно повреждены, но раз от них вообще хоть что-то осталось — значит, их конструкция была достаточно продвинутой. [Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] [Root.Leader.GetAXX::подготовил<end_a>] экспедицию, чтобы изучить обломки на предмет полезных технологий."
 anomaly.2530.desc.bio: "Все признаки указывают на то, что примерно 5000 лет назад в небесах [From.GetName&gen] состоялась грандиозная битва живых звездолётов. Поверхность небесного тела до сих пор испещрена глубокими шрамами в виде огромных ударных кратеров — их оставили после себя упавшие с орбиты корабли, и корпуса их разрывались при столкновении, словно перезревшие фрукты. На выгоревшей земле и сейчас можно отыскать следы давно высохших органических останков и окаменелых хрящей.\n\nВ этих останках с трудом можно узнать некогда величественных существ — настолько они искорёжены и минерализованы. Но громче всех слов об их невероятной прочности говорит тот факт, что останки эти смогли выдержать тысячелетия разложения и непогоды. [Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] [Root.Leader.GetAXX::подготовил<end_a>] экспедицию, чтобы изучить окаменевших левиафанов поближе и найти следы их генетического строения или генно-модифицированных симбионтов — возможно, в них ещё теплится готовая поделиться своими секретами жизнь."
 anomaly.2531.desc: "[Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] с командой [Root.Leader.GetAXX::верну<end_lsya>] на [Root.GetName&acc] из экспедиции на [From.From.GetName&acc]. Кладбище звездолётов оказалось настоящей сокровищницей технологий.\n\nИзучение останков эти кораблей помогло нам значительно продвинуться в ряде областей, а ведь мы исследовали далеко не всё. Нам следует оставить на орбите постоянно действующую научную станцию, это очень поможет нашим конструкторам звездолётов."
 anomaly.2532.desc: "[Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] с командой [Root.Leader.GetAXX::верну<end_lsya>] на [Root.GetName&acc] из экспедиции на [From.From.GetName&acc]. К сожалению, звездолёты на поверхности оказались слишком повреждены, и ничего полезного извлечь не удалось.\n\nТем не менее, эти корабли явно были очень продвинутыми, и мы могли бы открыть для себя много нового, если бы смогли изучить их конструкцию. Нужно подумать, не стоит ли нам оставить на орбите постоянно действующую научную станцию."
 anomaly.2532.desc.bio: "Отряд под руководством [Root.Leader.GetAXX::ведущего учёного|||fem:ведущей учёной] [Root.GetLeaderName] завершил вылазку на [From.From.GetName::ужасающий|||fem:ужасающую] [From.From.GetName&acc] и вернулся на [Root.GetName&acc]. К сожалению, время не пощадило древние органические звездолёты: некогда живые организмы либо окаменели, либо минерализировались и рассыпались на кусочки, не имеющие никакой ценности.\n\nОднако даже в таком виде их физиология поражает: ничего подобного невозможно было даже представить. Признаки высочайшего уровня технологического развития налицо: сложная решётчатая структура их генно-модифицированных скелетов, останки некогда подвижных мышц, следы невообразимой нервной системы... Всё это требует тщательного изучения. Важным шагом к разгадке тайны вымерших левиафанов станет постоянное присутствие на орбите научных сотрудников."
 anomaly.2540.name: "Инопланетные письмена"
 anomaly.2540.desc: "В ходе исследований на поверхности [From.GetName&gen] [Root.GetScientist_rinfix] [Root.GetLeaderName] с командой [Root.GetName&gen] [Root.Leader.GetAXX::обнаружил<end_a>] обработанную скалу, покрытую непонятными надписями. Никаких других следов инопланетной жизни на [From.GetPlanetMoon_rinfix&prep] нет, поэтому для нас загадка, откуда они взялись. Мы собираемся поработать над расшифровкой текста."
 anomaly.2541.desc: "[Root.GetScientistCap_rinfix] [Root.GetLeaderName] [Root.Leader.GetAXX::сообщил<end_a>], что инопланетный текст, обнаруженный на [From.From.GetName&prep], частично расшифрован. Это памятный знак в честь небольшой межзвёздной империи, которая некогда владела этим сектором галактики. Насколько мы можем судить, он был установлен расой, уничтожившей эту империю, в чём она горько раскаивается.\n\nС учётом того, что каменной стеле свыше 300 миллионов лет, её творцы, скорее всего, также давно вымерли. Наиболее любопытен для нас материал, из которого изготовлена стела: даже время не смогло её повредить."
 anomaly.2542.desc: "[Root.GetScientistCap_rinfix] [Root.GetLeaderName] [Root.Leader.GetAXX::сообщил<end_a>], что инопланетный текст, обнаруженный на [From.From.GetName&prep], частично расшифрован. В тексте содержится большой объем информации: судя по всему, каменная стела служила чем-то вроде библиотеки. Здесь описывается совокупность технических знаний расы, которая владела этим сектором галактики примерно 80 миллионов лет назад.\n\nМногое нам давно известно, но есть и несколько перспективных технологических направлений, которые заслуживают дальнейшего изучения. Нашим учёным понадобятся десятилетия, чтобы во всём разобраться, но для продолжения работы над переводом на орбите придется оставить научную станцию."
 anomaly.2550.name: "Роботизированная верфь"
 anomaly.2550.desc: "В ходе исследования [From.GetName&gen] [Root.GetName::<1> обнаружил<end_a>] на орбите останки роботизированной верфи. Ей не меньше тысячи лет, и она явно подверглась обстрелу из тяжёлых орудий, однако один из доков по-прежнему в рабочем состоянии.\n\n[Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] [Root.Leader.GetAXX::уверен<end_a>], что верфь можно запустить вновь, однако такой проект потребует существенных усилий."
 anomaly.2550.desc.bio: "При изучении [From.GetName&gen] экипаж [Root.GetName&gen] сделал удивительное открытие: он обнаружил разложившиеся останки древней космической камеры созревания. Когда-то это грандиозное органическое сооружение могло порождать настоящие звездолёты. Сейчас она безмолвно висит в пустоте — наружные мембраны её уничтожены беспощадной бомбардировкой, состоявшейся, похоже, много столетий назад. Сосуды почти все окаменели, нейронная решётка не реагирует... но в одной из полостей ещё что-то шевелится, а в реакторах теплится жизнь.\n\n[Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] считает, что это дремлющее существо ещё можно частично пробудить, если действовать аккуратно. Однако процесс этот будет долгим и кропотливым, а риск непредвиденных реакций — высоким."
 anomaly.2551.desc: "[Root.GetFleetName::<1> сообща<end_etyut>], что роботизированная верфь вновь действует на орбите [From.From.From.GetName&gen]. Используя доступные материалы, комплекс завершил постройку трёх мощных рейдеров неизвестной конструкции.\n\nК несчастью, после этого древняя верфь разрушилась окончательно и восстановлению уже не подлежит. Мы назначили экипажи на три новых корабля и включили их в состав нашего флота."
 anomaly.2551.desc.bio: "Экипаж [Root.GetFleetName&gen] успешно пробудил камеру созревания, дремавшую на орбите [From.From.From.GetName&gen]. Древнее органическое сооружение задрожало, бездействовавшие столетиями биогорны ожили, и замерший цикл производства был завершён. На свет появились три боевых корабля неизвестной, но пугающе сложной конструкции.\n\nМноговековой организм не выдержал такой неожиданной нагрузки. Сосуды его схлопнулись, нейронный центр увял, и камера созревания развалилась окончательно, превратившись в неподвижную биомассу. Новорождённые корабли же, поначалу растерянные, быстро привыкли к нам. Мы включили их в состав флотилии, и теперь они с радостью будут служить новым симбиотическим хозяевам."
 anomaly.2552.desc: "[Root.GetFleetName::<1> сообща<end_etyut>], что роботизированная верфь вновь действует на орбите [From.From.From.GetName&gen]. Используя доступные материалы, комплекс завершил постройку мощного фрегата неизвестной конструкции.\n\nК несчастью, после этого древняя верфь разрушилась окончательно и восстановлению уже не подлежит. Мы назначили экипаж на новый корабль и включили его в состав нашего флота."
 anomaly.2560.name: "Корабль с газового гиганта"
 anomaly.2560.desc: "Активное сканирование [From.GetName&gen] помогло обнаружить в атмосфере газового гиганта объект, который может оказаться крупным кораблём. Судя по окружающим его обломкам, другие расы уже пытались изучить эту реликвию далёкого прошлого. Чтобы выдержать огромное давление атмосферы, корабль должен обладать очень прочной конструкцией. [Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] [Root.Leader.GetAXX::предложил<end_a>] организовать исследовательскую экспедицию."
 anomaly.2560.a: "Давайте попробуем его вытащить."
 anomaly.2560.b: "Слишком много затрат. Не будем его трогать."
 anomaly.2561.desc: "[Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] и [Root.Leader.GetHerHis] команда инженеров сработали на отлично, им удалось аккуратно поднять корабль с [From.From.GetName&gen] в верхние слои атмосферы газового гиганта. Несмотря на возраст, этот древний крейсер отлично сохранился, и мы смогли запустить его двигатели. Никаких следов команды обнаружено не было. Мы назначили новый экипаж и ввели крейсер в состав нашего флота."
 anomaly.2562.desc: "[Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] и [Root.Leader.GetHerHis] команда потерпели неудачу, пытаясь поднять корабль с [From.From.GetName&gen] на поверхность атмосферы. Гравитация газового гиганта повредила двигатели одного из буксировщиков, и он столкнулся с покинутым крейсером. Мы потеряли несколько человек, а древний корабль ушёл ещё глубже в атмосферу, и теперь он окончательно вне досягаемости."
 anomaly.2570.name: "Терминальная орбита"
 anomaly.2570.desc: "Один из множества спутников [From.GetName&gen] находится на терминальной орбите. Его неминуемое столкновение с газовым гигантом вызовет природную катастрофу. Это событие готовилось несколько миллионов лет, и тем удивительнее, что финал драмы ожидается как раз после появления там одного из наших кораблей.\n\nМногим учёным хотелось бы не упустить этот катаклизм, чтобы его запечатлеть, однако успеть точно в нужный момент будет непросто."
 anomaly.2571.desc: "Нам удалось запечатлеть момент столкновения [CollisionLocation.GetName&gen] со спутником! Мы вели запись с нескольких камер и транслировали её в прямом эфире по всем нашим мирам. Что особенно важно, наши учёные и их [Root.Leader.GetAXX::руководитель<end_nica>] [Root.GetLeaderName] сумели получить большой объём данных, которые будут очень полезны в дальнейших исследованиях."
 anomaly.2572.desc: "Мы упустили момент и не смогли запечатлеть столкновение [From.From.GetName&gen] со спутником. Наши учёные вычислили ещё один спутник на сходящей орбите. По их прогнозам, он ударится о поверхность газового гиганта всего через 7.6 миллионов лет. Возможно, тогда нам повезёт больше..."

 anomaly.5000.name: "Сигнал с газового гиганта"
 anomaly.5000.desc: "Приборы [Root.GetName&gen] считывают странные данные с [From.GetName&gen]. В атмосфере газового гиганта есть массивные радиоактивные зоны, вероятно, возникшие в результате массированных орбитальных бомбардировок. Остаётся загадкой, кому и зачем понадобилось бомбить с орбиты газовый гигант.\n\nКогда [Root.GetName] уже [Root.GetName::готови<end_lsya>] уйти с орбиты, был пойман слабый сигнал, исходивший из недр планеты. Как [Root.Leader.GetAXX::доложил ведущий учёный|||fem:доложила ведущая учёная] [Root.GetLeaderName], это может быть неким сообщением, но радиационный фон усложняет его расшифровку."
 anomaly.5000.a: "Нам следует изучить этот сигнал."
 anomaly.5000.b: "Просто сенсоры барахлят. Не стоит обращать внимание."
 anomaly.5001.desc: "[Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] [Root.Leader.GetAXX::смог<end_la>] выделить слабый сигнал из недр атмосферы. Его источник — [From.From.From.GetName], и он действительно похож на сообщение. Мы прогнали его через программу автоматического перевода."
 anomaly.5002.desc: "Слабый сигнал, исходивший из недр газового гиганта [From.From.From.GetName], угас, прежде чем мы успели его выделить. Больше нам не удастся ничего узнать."
 anomaly.5003.name: "Сообщение с газового гиганта"
 anomaly.5003.desc: "Наконец-то! Приятно познакомиться, космический путешественник! Мы — датнаки, а эта планета именуется Толлок Ронг, отсюда мы родом. Всегда приятно встретиться с кем-то из твёрдых, хотя в последний раз наше знакомство с такими, как вы, прошло... не без осложнений.\n\nВы, наверное, заметили радиационные вспышки у нас в атмосфере. Толлок Ронг умирает, и наша раса вымрет, если мы не найдём себе новый дом. Мы подыскали планету, подходящую для нашей физиологии, но не можем туда добраться. К несчастью, мы не обладаем телами и не можем развивать технологии. Вы не могли бы нам помочь?"
 anomaly.5003.a: "Если у вас нет технологий, как мы разговариваем?"
 anomaly.5003.a.response: "Так вы же не первые твёрдые, кто нас навещает! Другие странники примерно 2.9 миллионов солнечных циклов назад любезно одарили нас небольшим подпространственным передатчиком и сканерным комплексом. Они были сделаны таким образом, чтобы мы могли ими пользоваться.\n\nЭто было одно из самых приятных знакомств с вами подобными."
 anomaly.5003.b: "А что случилось с вашей планетой?"
 anomaly.5003.b.response: "Хм, в последний раз, когда нас посещали твёрдые — это было пару тысяч лет назад, — всё прошло не слишком удачно. Они хотели, чтобы мы приняли их религию, мы отказались, и они решили перейти к геноциду.\n\nБез всякого предупреждения! Мы и понять ничего не успели, как они вывели флотилию на орбиту и устроили массированную бомбардировку."
 anomaly.5003.c: "Вы хотите, чтобы мы всю вашу расу перевезли на другую планету?"
 anomaly.5003.c.response: "Да! И желательно поскорее! Не беспокойтесь, нас не очень много. Почти все датнаки погибли при бомбардировке, а выжившие ушли ещё глубже в атмосферу. Отсюда трудно передавать что-то на поверхность, а радиация всё усиливается. Времени почти не осталось!"
 anomaly.5003.d: "Мы поможем вам с переездом."
 anomaly.5003.d.response: "Отлично. Никто и не сомневался, что мы можем на вас рассчитывать. Мы передали вам координаты нашего нового дома.\n\nИ обещайте, что ваши колонисты не станут заявлять на него права, пока мы туда не доберёмся. Хотя это замечательный мир, и искушение наверняка будет сильным!"
 anomaly.5003.e: "Извините. Слишком много хлопот."
 anomaly.5003.e.response: "Кто бы сомневался! Всем известно, что твёрдым чуждо сострадание, но меня убеждали, что попытаться стоит. Как унизительно!\n\nГалактическая зараза — вот кто вы такие! Со временем мир будет принадлежать таким, как мы, и тогда мы сведём с вами счёты. Помяните моё слово. Владычеству твёрдых придёт конец! Настанет время газообразной жизни!"
 anomaly.5004.desc: "[Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] [Root.Leader.GetAXX::доложил<end_a>], что переселение датнаков в новый мир успешно завершено. Караван гражданских грузовых кораблей, оснащённых газовыми цистернами под давлением, транспортировал газообразных существ в нужный сектор галактики и «высадил» в атмосферу газового гиганта. С собой они также взяли древний передатчик и сканер."
 anomaly.5004.a: "Пусть процветают."
 anomaly.5005.desc: "Жизненные условия на Толлок Ронге ухудшились до такой степени, что спасти датнаков уже не представляется возможным. Радиационное заражение охватило всю атмосферу, уцелевшие опустились практически к самому ядру планеты, и связь с ними прервалась. Со временем радиация доберётся и туда, и эта раса будет окончательно уничтожена."
 anomaly.5006.desc: "Мы навсегда в долгу перед вами! Эта планета даже лучше, чем мы предполагали. Впервые, спустя многие поколения, наши дети смогут беззаботно парить в верхних слоях атмосферы, не начиная при этом светиться.\n\nМы решили назвать свой новый дом Балдарак — в честь вашей расы. Все будущие поколения датнаков будут помнить имя своих спасителей!"
 anomaly.5006.a: "Балдарак? Но мы же называем себя [Root.GetSpeciesNamePlural]..."
 anomaly.5006.a.response: "Правда? А мне показалось... прошу прощения, твёрдых очень трудно различать между собой. Боюсь, переименовывать планету уже поздно. Но ведь звучит неплохо, согласитесь?"
 anomaly.5006.a.2: "Балдарак? Превосходное название!"
 anomaly.5006.a.2.response: "Неплохо звучит, правда? Нам весьма повезло, что нас спасли твёрдые со столь тонким фонетическим вкусом!"
 anomaly.5006.b: "Желаем вам удачи в новом мире."
 anomaly.5006.b.response: "Ещё раз спасибо, дорогие друзья! Пусть атмосферные потоки всегда поддерживают вас!"
 anomaly.5007.name: "Новая колония"
 anomaly.5007.desc: "Приветствуем! Вам наверняка будет приятно узнать, что популяция нашей расы выросла вчетверо с тех пор, как мы сюда прибыли! На новом месте многих охватило праздничное настроение, и, как бы помягче выразиться, всё завертелось.\n\nНам очень понравилось, как прошла колонизация Балдарака, и несколько отважных первопроходцев попросили меня обратиться к вам с просьбой. Мы хотели бы освоить ещё один газовый гигант, у нас уже есть координаты. Эта планета находится в вашем секторе и отлично подходит для колонизации. Что скажете, друзья?"
 anomaly.5007.a: "Ладно, если это опять газовый гигант..."
 anomaly.5007.a.response: "Замечательно! Передаём вам координаты. Нашим колонистам не терпится отправиться в путь!"
 anomaly.5007.b: "Нет. Мы же договаривались о переброске на ОДНУ планету."
 anomaly.5007.b.response: "Ну... ладно. Придётся нам сидеть на Балдараке и радоваться жизни."
 anomaly.5008.desc: "Как и в предыдущий раз, был собран караван грузовых кораблей, которые благополучно транспортировали датнакских колонистов в газовых контейнерах под давлением. Они благополучно высадились на планете, названной ими Новый Балдарак. Для сообщения с Балдараком на орбите был оставлен спутник связи."
 anomaly.5008.a: "Наслаждайтесь тем, что у вас есть, датнаки."
 anomaly.5009.name: "Чабки Раддх"
 anomaly.5009.desc: "Вас приветствует Новый Балдарак! В новой колонии дела идут хорошо. Однако у нас есть небольшая просьба...\n\nЧабки Раддх, одна из наших колонисток, ужасно скучает по родным и близким и хочет вернуться на Балдарак. Она так ноет, что мы тут все сходим с ума! Если можно, вы не могли бы отвезти её обратно?"
 anomaly.5009.a: "Что?! И думать забудьте!"
 anomaly.5009.a.response: "Ну, попытка не пытка... Надеюсь, вы не обиделись. Придётся Чабки смириться с ситуацией, как и всем нам! Простите, что зря отняли у вас время, друзья."
 anomaly.5009.b: "Ну, ладно."
 anomaly.5009.b.response: "Замечательно! Мы надеемся, это не будет чрезмерной тратой ресурсов, ведь вы транспортируете всего одного индивида. Мы со своей стороны всё устроим.\n\nМы только что сообщили Чабки новости, она кружится вне себя от счастья! Ого, да она так кружится, что её не удержать... прошу прощения, друзья..."
 anomaly.5010.desc: "Грузовой буксир с газовым контейнером прибыл на Балдарак под эскортом [Root.GetName&gen]. Содержимое контейнера было выгружено в атмосферу газового гиганта. Датнакская колонистка благополучно вернулась домой."
 anomaly.5010.a: "Скатертью дорожка."
 anomaly.5011.name: "Потерянная связь"
 anomaly.5011.desc: "У нас тревожные новости, друзья!\n\nМы лишились связи с колонией на Новом Балдараке! Они больше не отвечают на спутниковые сообщения, и мы опасаемся самого худшего. Возможно, враги, подвергшие наш мир бомбардировкам, вернулись довершить начатое. Пожалуйста, вышлите корабль на разведку!"
 anomaly.5011.a: "Мы немедленно отправим туда звездолёт."
 anomaly.5011.a.response: "Отлично! Будем надеяться, это всего лишь поломка передатчика."
 anomaly.5011.b: "Хватит! Мы вам не мальчики на побегушках."
 anomaly.5011.b.response: "Но... а вдруг они там все погибли! Неужели вы так бессердечны? [Root.GetSpeciesName], мы в вас жестоко ошибались!"
 anomaly.5012.desc: "Мы исследовали Новый Балдарак и не обнаружили ничего необычного. Насколько мы можем судить, спутник, через который колония общалась с Балдараком, в полном порядке."
 anomaly.5012.a: "Открыть канал на планету."
 anomaly.5013.name: "Революционный фронт"
 anomaly.5013.desc: "Вас приветствует Революционный фронт Нового Балдарака!\n\nМы сбросили иго угнетения и наконец освободились от тирании Балдарака! [Root.Owner.GetSpeciesName], нам с вами нечего делить, но не вздумайте помогать империалистам с Балдарака в попытках задушить нашу революцию.\n\nА ещё вы могли бы нам помочь. Мы хотим воевать с врагом на его территории... может, перевезёте наших бойцов на Балдарак?"
 anomaly.5013.a: "Расскажите, что вы задумали."
 anomaly.5013.a.response: "Мы хотим, чтобы отряд наших спецназовцев проник на Балдарак. Они организуют восстание масс против прогнившей элиты. Когда тираны будут низвергнуты, датнаки станут по-настоящему свободны. Это очень простой план, [Root.Owner.GetSpeciesName]."
 anomaly.5013.b: "Мы доставим ваших бойцов."
 anomaly.5013.b.response: "Правда?! Серьёзно? Вы настоящие друзья революции! Сейчас я соберу отряд!"
 anomaly.5013.c: "Мы не станем вмешиваться в ваши внутренние раздоры."
 anomaly.5013.c.response: "Кто бы сомневался! Вы же не хотите, чтобы и у ВАС угнетённые народы восстали против тирании. Этого нельзя допустить!"
 anomaly.5014.name: "Ответ Балдарака"
 anomaly.5014.desc: "Я говорю от имени законного датнакского правительства на Балдараке.\n\nМы получили требования смутьянов, захвативших власть на Новом Балдараке... с ума сойти, какой бред! Нам невыносимо стыдно за этих бандитов и анархистов, [Root.Owner.GetSpeciesName]. Вы ведь поможете нам растоптать их жалкую «революцию», пока она не достигла Балдарака, чтобы никто не пострадал?\n\nГенерал Палтанак подготовил экспедиционный корпус, чтобы вернуть контроль над колонией, но вам придётся доставить его туда."
 anomaly.5014.a: "Мы поможем вам."
 anomaly.5014.a.response: "Мы всегда знали, что можем на вас рассчитывать, [Root.Owner.GetSpeciesName]! Эти повстанцы и опомниться не успеют, как всё будет кончено!"
 anomaly.5014.b: "Сами решайте свои проблемы."
 anomaly.5014.b.response: "Вы пожалеете об этом, когда восстание охватит и ваши колонии тоже, [Root.Owner.GetSpeciesName]! Не сомневайтесь, это случится!"
 anomaly.5015.desc: "[Root.GetName] эскортировал буксирный корабль, который незаметно сбросил грузовой контейнер с революционной бригадой в атмосферу Балдарака. Спустя несколько мгновений в недрах атмосферы газового гиганта стали заметны яркие вспышки. Возможно, там начались бои?"
 anomaly.5015.a: "Посмотрим, что будет дальше."
 anomaly.5016.name: "Революционный совет"
 anomaly.5016.desc: "Говорит гражданин Фотанга! Народ Балдарака сбросил иго тиранов и угнетателей, которые пытались поработить нашу расу. Революционный совет был создан на переходный период, пока великий народ обретает свободу под нашим чутким руководством.\n\nТоварищи, мы хотим поблагодарить вас за помощь. Без вас этот день никогда бы не настал.\n\nЭто всё."
 anomaly.5016.a: "Может, всё как-то утрясётся."
 anomaly.5017.name: "Обращение к общественности Балдарака"
 anomaly.5017.desc: "Говорит гражданин Фотанга! Народный революционный совет единогласно проголосовал за переименование планеты, ранее известной как Балдарак, в Фотангию, в честь вашего лидера, то есть меня.\n\nКроме того, планета, которая раньше называлась Новый Балдарак, теперь будет именоваться Чабкимак в честь Чабки Раддх, нашего министра общественной безопасности.\n\nЭто всё."
 anomaly.5017.b: "Довольно. Глушите все новые сообщения от этих существ."
 anomaly.5018.desc: "Говорит гражданин Фотанга! Народный революционный совет сообщает о том, что в скором времени состоится казнь 4539 индивидов, уличённых в государственной измене и контрреволюционной деятельности.\n\nПусть это послужит предупреждением для всех, кто пытается встать на пути нашей славной революции.\n\nЭто всё."
 anomaly.5019.desc: "Говорит гражданин Рутмаг! Народный революционный совет сообщает о том, что в скором времени состоится казнь бывшего гражданина Фотанги, уличённого в демагогии, коррупции и общей некомпетентности.\n\nВсе его прежние обязанности теперь буду исполнять я. И моим первым декретом станет возвращение прежних названий планетам Фотангия и Чабкимак.\n\nЭто всё."
 anomaly.5020.desc: "[Root.GetName::<1> сопроводил<end_a>] несколько грузовых звездолётов, сбросивших в атмосферу Нового Балдарака цистерны, в которых находился датнакский экспедиционный корпус. Через несколько секунд в атмосфере газового гиганта стали заметны яркие вспышки. Судя по всему, там начались бои."
 anomaly.5020.a: "Посмотрим, что будет дальше."
 anomaly.5021.name: "Экспедиционный корпус захватывает власть"
 anomaly.5021.desc: "Говорит генерал Палтанак с Нового Балдарака. Операция «Газовая ярость» увенчалась полным успехом. Все основные цели захвачены, все слои атмосферы находятся под контролем законного правительства.\n\nЕсли не считать нескольких упрямцев, большинство повстанцев сдались или были разгромлены. Большое спасибо за помощь, [Root.Owner.GetSpeciesNamePlural]. А теперь извините, мне надо составить рапорт о понесённых потерях на Балдарак.\n\nКонец сообщения."
 anomaly.5021.a: "Отлично проведённая операция."
 anomaly.5022.name: "Обращение к общественности Нового Балдарака"
 anomaly.5022.desc: "Говорит генерал Палтанак, военный губернатор Нового Балдарака. Рад сообщить, что основные боевые действия в секторе 47-Г завершены. По меньшей мере 512 повстанцев убиты в ходе операции, начавшейся два цикла назад. Наши потери незначительны.\n\nВыражаю благодарность всем подразделениям за то, что жертвы среди гражданского населения были сведены к приемлемому минимуму.\n\nКонец сообщения."
 anomaly.5023.desc: "Говорит генерал Палтанак, военный губернатор Нового Балдарака. Хочу высказаться по поводу неподтверждённых донесений о том, что повстанцы якобы возобновили деятельность на этой планете. Говорю вам, что это абсолютная неправда.\n\nМир на планете был полностью восстановлен, все подпольные террористические элементы уничтожены. Граждане Нового Балдарака снова принадлежат к великой датнакской расе.\n\nКонец сообщения."
 anomaly.5024.desc: "Говорит полковник Рапзак, новый военный губернатор Нового Балдарака. С сожалением извещаю галактическую общественность о кончине моего предшественника генерала Палтанака. Подлые повстанцы устроили засаду, и генерал погиб достойно, как подобает настоящему солдату.\n\nТоржественная церемония похорон пройдёт после взятия осаждённой базы повстанцев.\n\nКонец сообщения."
 anomaly.5025.name: "Балдаракская научная академия"
 anomaly.5025.desc: "[Root.Owner.GetSpeciesNamePlural]! Мне поручили обратиться к вам от лица Балдаракской научной академии. Хотя мы, датнаки, не имеем собственных технологий, мы способны на теоретические исследования!\n\nПоследние несколько лет передовые группы наших учёных размышляли над проблемами теоретической физики и теперь готовы поделиться своими открытиями. Возможно, эта информация пригодится для расширения вашего государства, раз уж вам так нравится это занятие."
 anomaly.5025.a: "Очень любезно с вашей стороны."
 anomaly.5026.name: "Очистка источника"
 anomaly.5026.desc: "Приветствуем вас, [Root.Owner.GetSpeciesNamePlural]!\n\nВы не могли бы оказать нам услугу? Гравитационный колодец Балдарака затягивает в атмосферу всяческий мусор, и на последнем заседании совета мы решили, что с этим пора что-то делать. Одна из наших команд обнаружила при расчистке брошенный грузовой контейнер. Не поможете ли вы нам избавиться от него? Насколько нам известно, он содержит большое количество бесполезных металлов."
 anomaly.5026.a: "Да, мы поможем вам избавиться от этого мусора..."

 henrik.16.name: "Тестирование особого проекта"
 henrik.16.desc: "Вследствие этого события [Root.GetName] примет участие в особом проекте."
 henrik.16.a: "Неплохо!"
 henrik.20.name: "Появились враждебные армии"
 henrik.20.desc: "[Root.GetName] станет местом появления враждебных армий."
 henrik.20.a: "К оружию!"
 henrik.21.name: "Победа!"
 henrik.21.desc: "[From.GetName] — ничто против нас, мы разбили силы зла!"
 henrik.22.name: "Поражение!"
 henrik.22.desc: "[From.GetName] мощнее нас, силы зла одержали над нами победу!"
 henrik.145.desc: "Мы — [Root.GetSpeciesNamePlural]."
 henrik.166.desc: "Местом события является [test_target.GetName]"

 ####################################
 # Anomaly Failure Events
 ####################################
 DISC_FAILURE: "Неудача"
 DISC_CRITICAL_FAILURE: "Критическая неудача"
 anomaly_failure.1.desc: "[Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] с командой запустили зонд с [Root.GetName&gen] для изучения кратера на [From.From.GetName&prep]. К сожалению, при торможении двигатель дал сбой, и зонд врезался прямиком в разбитый звездолёт по центру кратера."
 anomaly_failure.2.desc: "Хотя астероид [From.From.GetName] прилетел из другой звёздной системы, в остальном он абсолютно ничем не примечателен. [Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] и команда [Root.GetName&gen] просят разрешения продолжить свои исследования в другом месте."
 anomaly_failure.3.desc: "Команда [Root.GetName&gen] в полном составе, работая посменно, потратила не один день на то, чтобы старательно просеять обломки на поверхности объекта [From.From.GetName]. [Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] [Root.Leader.GetAXX::доложил<end_a>], что ничего ценного не обнаружено."
 anomaly_failure.4.desc: "Источник загадочного излучения, исходящего от [From.From.GetName&gen], так и не был обнаружен. [Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] и [Root.GetName] ожидают новых распоряжений."
 anomaly_failure.5.desc: "При попытке вскрыть стыковочный шлюз, обнаруженный на [From.From.GetName&prep], [Root.GetName] случайно спровоцировал сотрясение в недрах астероида. К сожалению, [Root.Leader.GetAXX::ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] утверждает, что это, скорее всего, приведёт к уничтожению всего, что находится внутри астероида."
 anomaly_failure.6.desc: "Исследование крупного кратера на поверхности [From.From.GetName&gen] не дало никаких интересных результатов. На этом [Root.Leader.GetAXX::ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] и [Root.GetName] завершили исследования."
 anomaly_failure.7.desc: "[Root.GetName&dat] не удалось пристыковаться к космической станции, вращающейся вокруг объекта [From.From.GetName]. К сожалению, при этом станция самоуничтожилась. [Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] [Root.Leader.GetAXX::признал<end_a>] свою вину."
 anomaly_failure.7.desc.mach: "[Root.GetName&dat] не удалось пристыковаться к космической станции, вращающейся вокруг объекта [From.From.GetName]. К сожалению, при этом станция самоуничтожилась. [Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] [Root.Leader.GetAXX::списал<end_a>] всё на досадную программную ошибку при расчёте траектории."
 anomaly_failure.8.desc: "Хотя ранее сканеры [Root.GetName&gen] обнаружили признаки жизни на астероиде [From.From.GetName], никакие дальнейшие исследования результатов не дали, и источник сигнала обнаружен не был. Возможно, это была ошибка. [Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] ждёт новых указаний."
 anomaly_failure.9.desc: "[From.From.GetName] не раскрывает своих секретов. Если где-то в атмосфере и находится неопознанный объект, он скрыт слишком глубоко, и [Root.GetName] не может его обнаружить. [Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] [Root.Leader.GetAXX::прекратил<end_a>] поиски."
 anomaly_failure.10.desc: "[From.From.GetName] и спутник на орбите подверглись самому тщательному изучению, но ничего заслуживающего внимания команда [Root.GetName&gen] не обнаружила. [Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] не видит смысла продолжать исследования."
 anomaly_failure.11.desc: "[Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] с командой запустили зонд с [Root.GetName&gen] в атмосферу [From.From.GetName&gen] для поиска живых существ. Зонд обнаружил богатую экосистему, но спустя 3.4 секунды он вызвал заражение атмосферы и спровоцировал цепную химическую реакцию, которая стремительно охватила газовый гигант. Более никаких признаков жизни уловить не удалось."
 anomaly_failure.12.desc: "В атмосфере [From.From.GetName&gen] ничего любопытного обнаружить не удалось, невзирая на масштабные исследования и даже на то, что [Root.GetName] ненадолго [Root.GetName::погрузи<end_lsya>] в верхние слои атмосферы. [Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] [Root.Leader.GetAXX::порекомендовал<end_a>] свернуть работу."
 anomaly_failure.13.desc: "Когда [Root.GetName::<1> приблизи<end_lsya>] к дрейфующим объектам в атмосфере [From.From.GetName&gen], он, вероятно, спровоцировал что-то вроде сигнала тревоги. [Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] [Root.Leader.GetAXX::доложил<end_a>], что все объекты внезапно утратили плавучесть и стремительно погрузились в нижние слои атмосферы газового гиганта."
 anomaly_failure.14.desc: "При попытке подобрать грузовой контейнер на орбите [From.From.GetName&gen] [Root.GetName] случайно [Root.GetName::столкну<end_lsya>] с ним. [Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] [Root.Leader.GetAXX::доложил<end_a>], что от полученного удара контейнер погрузился в атмосферу газового гиганта на такую глубину, что достать его не представляется возможным."
 anomaly_failure.15.desc: "Поле обломков, окружающее космический объект [From.From.GetName], было тщательно просканировано приборами [Root.GetName&gen]. [Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] докладывает, что ничего ценного не обнаружено."
 anomaly_failure.16.desc: "Несмотря на самые тщательные исследования, экипаж [Root.GetName&gen] не смог определить, что стало причиной возникновения огромного кратера на поверхности объекта [From.From.GetName]. [Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] [Root.Leader.GetAXX::принёс|||fem:принесла] извинения за эту неудачу."
 anomaly_failure.16.desc.mach: "Несмотря на самые тщательные исследования, экипаж [Root.GetName&gen] не смог определить, что стало причиной возникновения огромного кратера на поверхности объекта [From.From.GetName]. [Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] [Root.Leader.GetAXX::связал<end_a>] неудачу с недостатком остаточных материалов на поверхности луны."
 anomaly_failure.17.desc: "Приборы единожды сняли странные показания с объекта [From.From.GetName], однако больше это явление не повторялось. [Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] докладывает, что [Root.GetName] не может обнаружить ничего подобного."
 anomaly_failure.18.desc: "[From.From.GetName] и неопознанный объект на орбите подлежали пристальному изучению, однако при попытке сблизиться с объектом [Root.GetName] случайно [Root.GetName::столкну<end_lsya>] с ним. [Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] докладывает, что, к несчастью, в результате столкновения объект был уничтожен."
 anomaly_failure.19.desc: "На небольшом астероиде, вращающемся по орбите вокруг [From.From.GetName&gen], ничего примечательного обнаружено не было. [Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] [Root.Leader.GetAXX::сообщил<end_a>], что [Root.GetName::<1> готов<end_aoy>] выполнять новые распоряжения."
 anomaly_failure.20.desc: "К сожалению, солнечный парусник, найденный вблизи объекта [From.From.GetName], был уничтожен в результате неловкой попытки втащить его в грузовой отсек [Root.GetName&gen]. [Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] [Root.Leader.GetAXX::признал<end_a>] свою вину."
 anomaly_failure.21.desc: "Сообщение о том, что на поверхности объекта [From.From.GetName] были обнаружены признаки жизни, скорее всего, являлось ошибочным, поскольку [Root.GetName] ничего подобного не [Root.GetName::нашёл|||fem:нашла|||neut:нашло|||pl:нашли]. [Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] докладывает, что сейчас эта [From.From.GetPlanetMoon_rinfix&nom] не подаёт ни малейших признаков жизни."
 anomaly_failure.22.desc: "То, что мы поначалу приняли за замаскированную космическую станцию на орбите планеты, оказалось грудой мусора, выброшенного тем исследовательским кораблём, который первым изучал этот объект. [Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] и команда [Root.GetName&gen] предлагают забыть об этом позорном фиаско и лететь дальше."
 anomaly_failure.23.desc: "Проведя тщательное исследование обломков корабля, обнаруженных на орбите объекта [From.From.GetName], [Root.Leader.GetAXX::ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] [Root.Leader.GetAXX::сообщил<end_a>], что это обычный космический мусор. [Root.GetName::<1> собрал<end_a>] несколько обломков, но они абсолютно бесполезны."
 anomaly_failure.24.desc: "Глубокое сканирование, которое [Root.GetName::провёл <1>|||fem:провела <1>|||neut:провело <1>|||pl:провели <1>], спровоцировало каскадное отключение энергии на старой верфи, дрейфовавшей вокруг [From.From.GetName&gen]. [Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] [Root.Leader.GetAXX::сообщил<end_a>], что со стороны взрыв выглядел очень зрелищно."
 anomaly_failure.25.desc: "«Развалины города», которые якобы были обнаружены на поверхности [From.From.GetName&gen], на поверку оказались всего лишь пластами горных пород необычной формы. [Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] [Root.Leader.GetAXX::принёс|||fem:принесла] извинения за напрасную трату ресурсов, [Root.GetName] ожидает новых заданий."
 anomaly_failure.26.desc: "[Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] докладывает, что странные отметины, обнаруженные на поверхности [From.From.GetName&gen], оказались природного происхождения. [Root.GetName] ожидает новых приказов."
 anomaly_failure.27.desc: "[Root.GetName::<1> перестал<end_a>] улавливать слабый сигнал, исходивший с [From.From.GetName&gen]. Как говорит [Root.Leader.GetAXX::ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName], несмотря на все усилия, мы больше не можем его обнаружить."
 anomaly_failure.28.desc: "«Неестественное» скалистое образование, найденное на [From.From.GetName&prep], оказалось природного происхождения. [Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] [Root.Leader.GetAXX::предположил<end_a>], что дальнейшее пребывание здесь [Root.GetName] будет пустой тратой ресурсов."
 anomaly_failure.29.desc: "Несмотря на множественные попытки, [Root.Leader.GetAXX::ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] и вся команда [Root.GetName&gen] так и не сумели обнаружить отражающий объект, который был ранее замечен на поверхности [From.From.GetName&gen]. Возможно, имел место сбой в работе сенсора."
 anomaly_failure.30.desc: "[Root.GetName] не [Root.GetName::сумел<end_a>] установить источник слабого сигнала, исходившего из недр объекта [From.From.GetName]. [Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] докладывает, что больше аналогичных сигналов не поступало."
 anomaly_failure.31.desc: "Несмотря на неоднократное сканирование, [Root.GetName] так и не [Root.GetName::сумел<end_a>] обнаружить никаких признаков звездолёта, скрывающегося в атмосфере [From.From.GetName&gen]. [Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] сомневается, что такой звездолёт вообще существует."
 anomaly_failure.32.desc: "Произведя повторный расчёт орбиты малого спутника, который предположительно должен был столкнуться с [From.From.GetName&inst], [Root.Leader.GetAXX::ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] [Root.Leader.GetAXX::установил<end_a>], что никакой катастрофы не произойдёт. [Root.GetName&acc] стоит направить в другое место, где [Root.GetName::он<end_a>] принесёт больше пользы."
 anomaly_failure.33.desc: "Надежды обнаружить следы вултаумской цивилизации в окрестностях объекта [From.From.GetName] не оправдались. [Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] и команда корабля[Root.GetName] просят разрешения продолжить поиски в другом месте."
 anomaly_failure.34.desc: "Надежды обнаружить следы юутской цивилизации в окрестностях объекта [From.From.GetName] не оправдались. [Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] и команда корабля[Root.GetName] просят разрешения продолжить поиски в другом месте."
 anomaly_failure.35.desc: "Надежды обнаружить следы Первой лиги в окрестностях объекта [From.From.GetName] не оправдались. [Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] и команда корабля[Root.GetName] просят разрешения продолжить поиски в другом месте."
 anomaly_failure.36.desc: "Надежды обнаружить следы ирассианской цивилизации в окрестностях объекта [From.From.GetName] не оправдались. [Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] и команда корабля[Root.GetName] просят разрешения продолжить поиски в другом месте."
 anomaly_failure.37.desc: "Надежды обнаружить следы Сайбрекса в окрестностях объекта [From.From.GetName] не оправдались. [Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] и команда корабля[Root.GetName] просят разрешения продолжить поиски в другом месте."

 anomaly_failure.400.desc: "По неизвестным причинам [Root.Leader.GetAXX::ведущий учёный решил|||fem:ведущая учёная решила] лично исследовать астероид [From.From.GetName] на шаттле с [Root.GetName&gen]. После случайного столкновения шаттла с астероидом произошёл взрыв.\n\nКак было установлено комиссией по расследованию, покойного специалиста не обучали пилотированию шаттлов класса «Д»."
 anomaly_failure.401.desc: "Совершая манёвр при исследовании объекта [From.From.GetName], [Root.GetName] случайно [Root.GetName::столкну<end_lsya>] с другим астероидом. Корабль потерял управление, после чего врезался в поверхность объекта [From.From.GetName] и ушёл глубоко в кору астероида.\n\nСогласно полученным отчётам, [Root.Leader.GetAXX::ведущ<end_ii> учён<end_yi>] и вся команда погибли."
 anomaly_failure.402.desc: "Совершая манёвр при исследовании объекта [From.From.GetName], [Root.GetName] случайно [Root.GetName::столкну<end_lsya>] с другим астероидом. Корабль потерял управление, после чего врезался в поверхность объекта [From.From.GetName] и ушёл глубоко в кору астероида.\n\nНесколько членов команды и [Root.Leader.GetAXX::ведущ<end_ii> учён<end_yi>] смогли спастись в аварийной капсуле."
 anomaly_failure.403.desc: "Этот астероид служит местом гнездования для гигантских существ, приспособленных к жизни в вакууме! Несколько из них отлетают от своей сети туннелей и готовы яростно нападать на [Root.GetName&acc], чтобы отстоять свою территорию."
 creature_nest: "Враждебные существа стремительно приближаются!"
 anomaly_failure.404.desc: "Несколько отключённых военных дронов, сконструированных давно забытой цивилизацией, находятся в небольшом кратере на дальнем краю объекта [From.From.GetName]. Когда [Root.GetName] попадает в радиус действия их пассивных сенсоров, дроны включаются для выполнения древней программы: любой ценой уничтожить захватчиков."
 dormant_drones: "Агрессивные дроны приближаются!"
 anomaly_failure.405.desc: "[Root.GetName::<1> пров<end_yolla>] сканирование и [Root.GetName::засёк|||fem:засекла|||neut:засекло|||pl:засекли] несколько объектов на поверхности астероида [From.From.GetName], однако через несколько секунд сигнал был заглушён помехами. Из замаскированного ангара на астероиде вылетели несколько пиратских кораблей. Они выстроились в боевой порядок и стремительно приближаются!"
 pirate_outpost: "Эти пираты настроены серьёзно!"
 anomaly_failure.900.desc: "Трагические новости с [From.From.GetName&gen]: [Root.Leader.GetAXX::ведущий учёный убит|||fem:ведущая учёная убита] электрическим разрядом во время полёта на небольшом шаттле сквозь верхние слои атмосферы газового гиганта. Команда [Root.GetName&gen] объявляет о прекращении исследований."
 anomaly_failure.901.desc: "Мы всё ещё уточняем детали, но пока что версия такова: по приказу ведущего учёного [Root.GetName::<1> вошёл|||fem:<1> вошла|||neut:<1> вошло|||pl:<1> вошли] в верхние слои атмосферы [From.From.GetName&gen] для исследования выявленной сенсорами аномалии, однако давление на корпус корабля было слишком велико, и его расплющило вместе с экипажем."
 anomaly_failure.902.desc: "Во время глубинного сканирования [From.From.GetName&gen] на [Root.GetName&prep] произошёл отказ реактора, и корабль оказался в плену гравитационного колодца газового гиганта. [Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] корабля успешно [Root.Leader.GetAXX::эвакуировал<end_a>] команду, однако сам корабль втянут в густую атмосферу планеты, и спасти его уже не удастся."
 anomaly_failure.903.desc: "При приближении к [From.From.GetName&dat] [Root.GetName::<1> наткну<end_lsya>] на два неизвестных звездолёта, скрывавшихся в тени газового гиганта. Оказалось, что это тайное место встречи контрабандистов. Заметив ваш корабль, они расстыковались и немедленно приготовились открыть огонь. Похоже, не хотят оставлять свидетелей!"
 smuggler_rendezvous: "Контрабандисты идут в атаку!"
 anomaly_failure.1400.desc: "При маневрировании над [From.From.GetName&inst] на [Root.GetName&prep] произошла утечка в ядре реактора. Безопасность всего звездолёта оказалась под угрозой, однако [Root.Leader.GetAXX::ведущ<end_ii> учён<end_yi>] героически [Root.Leader.GetAXX::пожертвовал<end_a>] жизнью, полностью очистив моторный отсек от радиации. Полученная доза облучения была смертельна."
 anomaly_failure.1400.desc.mach: "При выполнении работ над поверхностью [From.From.GetName&gen] на [Root.GetName&prep] была нарушена целостность оболочки ядра реактора. Так как возникла угроза безопасности всего корабля, [Root.Leader.Leader.GetAXX::ведущий учёный принял|||fem:ведущая учёная приняла] логичное решение пожертвовать собой, чтобы очистить моторный отсек от радиации, основываясь на программной оценке возможного урона. В процессе [Root.Leader.Leader.GetAXX::учён<end_yi>] [Root.GetLeaderName] получил крупную дозу радиации, которая привела к ионизации полупроводников и повреждению кремниевой решётки в результате смещения атомов, что вызвало их полную негодность. Правда, корабль и оставшаяся команда при этом были спасены."
 anomaly_failure.1401.desc: "При попытке перенаправить энергию в основную сенсорную сеть [Root.GetName&gen] на орбите [From.From.GetName&gen] произошёл критический сбой в работе реактора. В результате взрыва [Root.Leader.GetAXX::ведущ<end_ii> учён<end_yi>] и весь экипаж звездолёта погибли."
 anomaly_failure.1402.desc: "Каким-то образом [Root.Leader.GetAXX::ведущ<end_ii> учён<end_yi>] случайно [Root.Leader.GetAXX::включил<end_a>] программу самоуничтожения на [Root.GetName&prep]. Это произошло во время обкатки на бортовом компьютере имитационной модели по исследованию [From.From.GetName&gen]. Все попытки отменить программу безуспешны, экипаж срочно эвакуируется."
 anomaly_failure.1403.desc: "Несколько пиратских кораблей внезапно перешли в атаку, вылетев из укрытия на поверхности [From.From.GetName&gen]. Судя по всему, [Root.GetName] случайно [Root.GetName::наткну<end_lsya>] на пиратскую базу, и головорезам это очень не понравилось!"
 pirate_anchorage: "Приближаются корабли с враждебными намерениями!"
 anomaly_failure.1404.desc: "Орбитальная станция над [From.From.GetName&inst], очевидно, служила местом спаривания для крупных и агрессивных существ космического происхождения. Появление [Root.GetName&gen] их потревожило и привело в ярость. Двое существ бросились в атаку на незваного гостя."
 mating_ground: "Эти существа выглядят очень обеспокоенными."
 anomaly_failure.1405.desc: "Небольшое подразделение древних боевых дронов было оставлено на орбите [From.From.GetName&gen] после какого-то давно забытого сражения. Когда по ним прошлись активные сенсоры [Root.GetName&gen], дроны немедленно включились и перешли в боевой режим!"
 combat_drones: "Они готовятся атаковать!"


 ####################################
 # Colony Events
 ####################################
 colony.1.name: "Мигрирующие леса"
 colony.1.desc: "Поверхность [Root.GetName&gen] покрыта густыми лесами. Массивные псевдодеревья вздымаются на высоту до нескольких сотен метров. Любопытно, что, как обнаружили наши колонисты, почти вся эта флора в той или иной степени мобильна. Леса, простирающиеся на многие мили, перемещаются в новые районы в поисках питательных веществ. Судя по всему, эта [Root.GetPlanetMoon_rinfix&nom] является причиной таких циклических миграций.\n\nК сожалению, это серьёзно мешает нам развивать колонию. Движущиеся деревья рвут линии электропередач и крушат строения и дороги."
 colony.1.a: "Надо найти решение."
 colony.2.desc: "Мы выяснили, что бродячие леса на [From.From.GetName&prep] избегают определённых районов, где обитают местные псевдонасекомые. Эти насекомые выделяют феромон, с помощью которого можно отвадить ходячие деревья от населённых центров.\n\nТе области, где деревья мигрируют чаще всего, были объявлены заповедниками. Наши биологи смогут узнать много нового, изучая эти территории."
 colony.2.a.tooltip: "Добавить модификатор §YПокорные мигрирующие леса§!, дающий следующие эффекты:\nДобавлен £blocker£ §YЗаповедник бродячих лесов§!, улучшающий £society£ §Yисследования§! соседних квадратов."
 colony.3.desc: "Мы провели бомбардировку напалмом, что существенно снизило численность мигрирующих деревьев на [From.From.GetName&prep]. Мощные огненные бури оставили после себя выжженные пустоши, которые наши экологи засадили более привычными для нас видами растений, которые уж точно не станут никуда перемещаться. Эта [From.From.GetPlanetMoon_rinfix&nom] теряет значительную часть диких обитателей, но масштабы потерь можно считать приемлемыми."
 colony.4.name: "Восстание деревьев"
 colony.4.desc: "[Root.GetName] вновь становится обиталищем бродячих деревьев! Нам было известно, что такие леса в малых количествах уцелели в дальних уголках планеты, но они выглядели спящими. Кажется, они воспользовались передышкой, чтобы увеличить свою численность, а теперь в отместку начали регулярно нападать на наши поселения.\n\nМы и не предполагали, что эти существа обладают зачатками разума!"
 colony.4.a: "Их надо остановить!"
 tree_armies: "Орды деревьев атакуют наших колонистов на [Root.GetName&prep]!"
 colony.5.name: "Падение деревьев"
 colony.5.desc: "Бродячие деревья на [From.From.GetName&prep] стали причиной гибели многих колонистов и поселений, но мы сумели отразить атаки и уничтожили их всех до единого. Взводы, вооружённые огнемётами, прочешут местность и убедятся, что нигде не осталось ни одного побега."
 colony.5.a: "Так им и надо."
 colony.6.name: "Залежи минералов"
 colony.6.desc: "Мы обнаружили несколько крупных месторождений полезных ископаемых на [Root.GetName&prep], которые ранее оставались незамеченными из-за бродячих деревьев. Теперь, когда от лесов остался лишь пепел, можно начинать разработку залежей."
 colony.7.name: "Залежи драгоценных металлов"
 colony.7.desc: "Мы обнаружили крупное месторождение драгоценных металлов на [Root.GetName&prep], которое ранее оставалось незамеченным из-за бродячих деревьев. Теперь, когда от лесов остался лишь пепел, можно начинать разработку залежи."
 colony.8.name: "Урон окружающей среде"
 colony.8.desc: "Судя по всему, мигрирующие леса, которые мы уничтожили на [Root.GetName&prep], играли более значимую роль в её экосистеме, чем казалось ранее. Возникшие по нашей вине пожары и гибель лесов привели к вымиранию нескольких видов существ. Далее эффект домино привёл к исчезновению ряда хищников.\n\nМы прилагаем усилия для восстановления — хотя бы частичного — экологического равновесия, переселяя флору и фауну с других планет, но это сложный процесс, который потребует много времени."
 colony.9.name: "Адаптация лесов"
 colony.9.desc: "Постоянное взаимодействие между нашими колонистами и бродячими деревьями в заповедниках на [Root.GetName&prep] помогло установить наличие у этих растений зачаточного общего разума. Они привыкли к нашему присутствию и готовы перемещаться на свободе, не повреждая собственность колонистов. Нам больше не нужно применять феромоны насекомых. Это отличная новость для всех."
 colony.10.name: "Лесные исследования"
 colony.10.desc: "Мы получили много новой информации, исследуя бродячие леса на [Root.GetName&prep]. Несколько предприимчивых колонистов даже соорудили себе жилища в кронах, чтобы сопровождать деревья во время миграций. Несколько ведущих биологов [Root.Owner.GetName&gen] на [Root.GetPlanetMoon_rinfix&prep] потратили немало времени на изучение этих уникальных растений."
 colony.11.name: "Лесной пожар"
 colony.11.desc: "Лесной пожар, возникший на [Root.GetName&prep] из-за ударов молний, стал причиной столпотворения среди бродячих деревьев. В приступе паники они забрели на территорию, куда раньше избегали заходить, и нанесли существенный ущерб территории колонии."
 colony.12.name: "Миграция бродячих лесов"
 colony.12.desc: "Колониальные власти [Root.GetName&gen] сообщают, что местные бродячие леса мигрировали в другую область! Сотни тысяч деревьев выкорчевались и совместно переместились в новый регион, вытаптывая всё на своём пути."
 colony.50.name: "Сейсмические возмущения"
 colony.50.desc: "Нам сообщают о многочисленных необъяснимых сейсмических возмущениях на [Root.GetName&prep]. Землетрясения ощущаются повсюду, многим поселениям нанесён существенный ущерб. Исследуя их причину, наши учёные обнаружили целую сеть пещер.\n\nВ самых глубоких из них обитают подземные жители, и сейчас они роют туннели, чтобы выбраться на поверхность! Возможно, такое поведение было спровоцировано работами в наших поселениях. Трудно предсказать, как поведут себя местные, когда выберутся из своих нор и повстречаются с колонистами!"
 colony.50.desc.subterranean: "Нам сообщают о многочисленных необъяснимых сейсмических возмущениях на [Root.GetName&prep]. Землетрясения ощущаются повсюду, многим поселениям нанесён существенный ущерб. Исследуя их причину, наши учёные обнаружили целую сеть пещер.\n\nВ самых глубоких из них обитают подземные жители, и сейчас они роют туннели, чтобы выбраться на поверхность! Возможно, такое поведение было спровоцировано работами в наших поселениях. Трудно предсказать, как поведут себя местные, когда выберутся из своих нор и повстречаются с колонистами!"
 colony.50.a: "С этим надо что-то делать."
 colony.51.desc: "Один из наших зондов под землёй натолкнулся на аборигенов, копающих туннели на [From.From.GetName&prep]. Когда испуганные рабочие наконец успокоились, зонд сумел установить контакт с их лидером."
 colony.51.a: "Открыть канал связи."
 colony.52.desc: "Наши попытки уничтожить подземных аборигенов на [Root.GetName&prep] увенчались успехом! Мы обрушили несколько туннелей вместе с рабочими и заполнили нервно-паралитическим газом пещеры, где находились их города.\n\nПо оценкам, число жертв приближается к 100%, и наши военные не сомневаются, что сумеют справиться со случайными уцелевшими."
 colony.52.a: "Поздравляем все задействованные подразделения."
 colony.53.name: "Чужаки [Root.Owner.GetSubMantleUpper]"
 colony.53.desc: "Эта штука работает? Вы нас слышите, на поверхности? Мы знаем, что вы явились из Великого Ничто, простирающегося наверху, за камнями. Мы считали, что там не может быть жизни, но, видимо, ошибались. Каковы ваши намерения?"
 colony.53.a: "Расскажите нам о себе."
 colony.53.desc.subterranean: "Эта штука работает? Вы нас слышите, на поверхности? Мы знаем, что вы явились из Великого Ничто, простирающегося наверху, за камнями. Мы считали, что там не может быть жизни, но, видимо, ошибались. Каковы ваши намерения?"
 colony.53.a.response: "Наше государство занимает все полости известного мира. Лишь Великое Ничто лежит за его пределами. У нас множество прекрасных городов, мы выращиваем себе пропитание на лишайниковых фермах и ловим рыбу в реках, которые текут по туннелям.\n\nТак мы жили много тысяч лет. Наши копатели уловили отголоски ваших городов среди камней, и мы решили выяснить, кто вы такие."
 colony.53.b: "Мы хотим жить с вами в мире."
 colony.53.b.response: "Мы согласны, обитатель поверхности! Давайте сосуществовать на планете в мире и согласии. Мы хотим торговать с вами. Думаю, нам есть что предложить друг другу. Мы вернёмся в свои города и подготовимся к торговле."
 colony.53.b.response.subterranean: "Мы согласны, обитатель поверхности! Давайте сосуществовать на планете в мире и согласии. Мы хотим торговать с вами. Думаю, нам есть что предложить друг другу. Мы вернёмся в свои города и подготовимся к торговле."
 colony.53.c: "Подчинитесь, или мы вас уничтожим."
 colony.53.c.response: "Ха! Это вы должны нам подчиниться! Мы могли бы жить бок о бок в мире, но теперь наши армии завоюют Великое Ничто и присоединят его к нашему государству. Наше предназначение — править всем миром."
 colony.54.name: "Вторжение"
 colony.54.desc: "Подземные аборигены с [Root.GetName&gen] выбрались на поверхность! Многочисленные армии, вооружённые примитивным, но смертоносным стрелковым оружием, появляются из туннелей повсюду, их передовые части уже атакуют наши поселения.\n\nНаши войска держат удар, но нам, вероятно, понадобятся подкрепления!"
 colony.54.desc.subterranean: "Подземные аборигены с [Root.GetName&gen] выбрались на поверхность! Многочисленные армии, вооружённые примитивным, но смертоносным стрелковым оружием, появляются из туннелей повсюду, их передовые части уже атакуют наши поселения.\n\nНаши войска держат удар, но нам, вероятно, понадобятся подкрепления!"
 colony.54.a: "К оружию!"
 subterranean_invasion: "Враждебные войска атакуют нашу колонию на [Root.GetName&prep]!"
 colony.55.desc: "Землетрясения, ставшие бичом [From.From.GetName&gen], были вызваны тем, что аборигены, о которых мы раньше ничего не знали, стали копать туннели! Они выбрались на поверхность, их многочисленные армии, вооружённые примитивным, но смертоносным стрелковым оружием, появляются из туннелей повсюду. Передовые части уже атакуют наши поселения. Наши войска держат удар, но нам, вероятно, понадобятся подкрепления!"
 colony.56.name: "Мы победили на [From.From.GetName&prep]"
 colony.56.desc: "Нашим войскам удалось загнать подземных аборигенов [From.From.GetName&gen] обратно в пещеры, и пока что они заперты там. Хотя это временное решение. Рано или поздно они вновь вырвутся на поверхность.\n\nНужно нанести удар, пока они под землёй, и наши стратеги разработали новый план атаки. Мы внесли его в журнал."
 colony.56.desc.subterranean: "Нашим войскам удалось загнать подземных аборигенов [From.From.GetName&gen] обратно в пещеры, и пока что они заперты там. Хотя это временное решение. Рано или поздно они вновь вырвутся на поверхность.\n\nНужно нанести удар, пока они под землёй, и наши стратеги разработали новый план атаки. Мы внесли его в журнал."
 colony.56.a: "Нужно решить эту проблему раз и навсегда."
 colony.57.name: "Новости с [From.From.GetName&gen]" # Ошибочно выводится вместо colony.65.name
 colony.57.desc: "Наши войска потерпели серьёзное поражение на [From.From.GetName&prep], и подземные аборигены захватили все наши поселения! Они передают нам сообщение через наш собственный спутник."
 colony.58.desc: "Жители поверхности! Наши славные войска одержали над вами победу, и теперь все ваши города принадлежат нам. Мы многому научились, исследуя ваши машины, и теперь наше оружие ещё мощнее, чем прежде.\n\nНикогда больше не приближайтесь к этой планете!"
 colony.58.desc.subterranean: "Жители поверхности! Наши славные войска одержали над вами победу, и теперь все ваши города принадлежат нам. Мы многому научились, исследуя ваши машины, и теперь наше оружие ещё мощнее, чем прежде.\n\nНикогда больше не приближайтесь к этой планете!"
 colony.58.a: "Вот наглецы."
 colony.59.name: "Появление чужаков"
 colony.59.desc: "Подземные аборигены с [From.From.GetName&gen] выбрались на поверхность! Пока что они сталкивались только с небольшими группами исследователей и торговцев. Возможно, они хотят жить в мире с нашими колонистами и, может быть, даже вести торговлю. С нами вышел на связь их представитель."
 colony.59.desc.subterranean: "Подземные аборигены с [From.From.GetName&gen] выбрались на поверхность! Пока что они сталкивались только с небольшими группами исследователей и торговцев. Возможно, они хотят жить в мире с нашими колонистами и, может быть, даже вести торговлю. С нами вышел на связь их представитель."
 colony.59.a: "Послушаем, что они хотят сказать."
 colony.60.desc: "Подземные аборигены с [Root.GetName&gen] собрали в своём пещерном государстве достаточно большую армию, чтобы снова пойти войной на поверхность! Их разъярённые солдаты выбираются из свежевырытых туннелей и нападают на нас."
 colony.60.desc.subterranean: "Подземные аборигены с [Root.GetName&gen] собрали в своём пещерном государстве достаточно большую армию, чтобы снова пойти войной на поверхность! Их разъярённые солдаты выбираются из свежевырытых туннелей и нападают на нас."
 colony.60.a: "Надо дать им отпор!"
 subterranean_invasion_2: "Враждебные войска атакуют нашу колонию на [Root.GetName&prep]!"
 colony.61.name: "Коллапс"
 colony.61.desc: "Плохие новости с [Root.GetName&gen]! Подземные аборигены, с которыми мы там воюем, ухитрились каким-то образом подстроить ловушку нашей армии, расположившейся рядом со входом в туннель, и засыпали её землёй.\n\nНемногие уцелевшие солдаты были уничтожены аборигенами раньше, чем успели добраться до своих."
 colony.61.a: "Они за это заплатят!"
 colony.62.name: "Диверсионные группы"
 colony.62.desc: "Аборигены, обитающие под землёй на [Root.GetName&prep], где расположена наша колония, по ночам стали высылать из своих туннелей небольшие группы диверсантов. Они уничтожили один из важнейших промышленных объектов колонии и скрылись под землёй, прежде чем наши войска сумели отреагировать."
 colony.62.a: "Эти набеги нужно прекратить!"
 colony.63.name: "Атака на поверхность"
 colony.63.desc: "На [Root.GetName&prep] произошло очередное нападение! Подземные аборигены выбрались из нового туннеля, вырытого посреди одного из наших крупных поселений, разгромили местную систему обороны и перебили колонистов. Нескольких уцелевших поселенцев, кричащих от ужаса, они уволокли с собой."
 colony.63.a: "Эти убийства не останутся без ответа."
 colony.64.name: "Пещера уцелевших"
 colony.64.desc: "Наши войска на [Root.GetName&prep] продолжают исследовать сеть туннелей под колонией. Они наткнулись на большой город, населённый аборигенами, которые успели отделиться от подземного государства, прежде чем мы вытравили её нервно-паралитическим газом. В городе находятся несколько миллионов перепуганных жителей. Следует ли нашим инженерам обрушить пещеру, чтобы завершить свою работу?"
 colony.64.a: "Да. Избавьте их от мучений."
 colony.64.b: "Нет! Вытащите их на поверхность, пусть служат нам."
 colony.64.b.subterranean: "Нет! Доставьте их в колонию, пусть служат нам."
 colony.65.name: "Расширение"
 colony.65.desc: "Мы закончили работы по нейтрализации нервно-паралитического газа и уборке трупов аборигенов из туннелей на [Root.GetName&prep], и теперь наши колонисты могут там расселиться. Разумеется, примитивные города придётся уничтожить. На их месте мы возведём свои постройки, куда более совершенные."
 colony.66.name: "Золото!"
 colony.66.desc: "На [Root.GetName&prep] наши геологи-разведчики пробрались в самые глубокие туннели, ранее принадлежавшие аборигенам, которых мы уничтожили. Им наконец удалось отыскать знаменитые золотые прииски, которые были источником богатства подземного государства!"
 colony.66.desc.subterranean: "На [Root.GetName&prep] наши геологи-разведчики пробрались в самые глубокие туннели, ранее принадлежавшие аборигенам, которых мы уничтожили. Им наконец удалось отыскать знаменитые золотые прииски, которые были источником богатства подземного государства!"
 colony.67.name: "Сокровищница"
 colony.67.desc: "Разведчики, обследовавшие сеть туннелей на [Root.GetName&prep], проникли во дворец, расположенный в столице подземного государства аборигенов. Труп бывшего императора до сих пор восседает на массивном троне в парадном зале.\n\nРазведчики использовали взрывчатку, чтобы проникнуть в дворцовую сокровищницу, где они обнаружили золото, которое будет продано для пополнения государственного бюджета, и предметы искусства аборигенов — их переправят в музеи [From.Owner.Capital.GetName&gen]."
 colony.68.name: "Землетрясения на [Root.GetName&prep]"
 colony.68.desc: "Очередная волна землетрясений недавно поразила [Root.GetName&acc]. Насколько мы можем судить, обрушилась глубинная часть туннелей, поскольку не осталось аборигенов, которые поддерживали их в надлежащем состоянии. Многие наши поселения пострадали."
 colony.69.name: "Голод"
 colony.69.desc: "К нам обратилась делегация подземных аборигенов с [Root.GetName&gen]. Насколько мы понимаем, в последнее время их государство переживает тяжёлые времена, и они стоят на пороге голода. Они умоляют о помощи."
 colony.69.a: "Конечно. Мы поможем им, чем сможем."
 colony.69.b: "Пусть сами о себе позаботятся."
 subterraneans_pleased: "Отношения с цивилизацией [Root.Owner.GetSubMantleLower] улучшатся."
 subterraneans_displeased: "Отношения с цивилизацией [Root.Owner.GetSubMantleLower] ухудшатся."
 colony.70.name: "Подарок"
 colony.70.desc: "В знак дружбы между нашими народами подземные аборигены с [Root.GetName&gen] прислали на поверхность караван. Они преподнесли нам в дар большое количество самоцветов. Судя по всему, такие крупные камни они добывают глубоко под землёй, настолько близко к ядру планеты, насколько им удаётся пробраться."
 colony.70.desc.subterranean: "В знак дружбы между нашими народами подземные аборигены с [Root.GetName&gen] прислали на поверхность караван. Они преподнесли нам в дар большое количество самоцветов. Судя по всему, такие крупные камни они добывают глубоко под землёй, настолько близко к ядру планеты, насколько им удаётся пробраться."
 colony.70.a: "Очень любезно с их стороны."
 colony.71.name: "Беженцы расы [root.Owner.GetSubMantleUpper]"
 colony.71.desc: "Большая группа беженцев — аборигенов [Root.GetName&gen] — недавно выбралась из туннелей на поверхность, спасаясь от вооружённого отряда. Они заявили, что представляют религиозное меньшинство и спасаются от угнетателей.\n\nЕсли мы разрешим им присоединиться к нашим колонистам, это, скорее всего, вызовет гнев государства, откуда они бежали. С другой стороны, если мы позволим преследователям схватить беглецов, их наверняка казнят."
 colony.71.desc.subterranean: "Большая группа беженцев — аборигенов [Root.GetName&gen] — недавно выбралась из туннелей на поверхность, спасаясь от вооружённого отряда. Они заявили, что представляют религиозное меньшинство и спасаются от угнетателей.\n\nЕсли мы разрешим им присоединиться к нашим колонистам, это, скорее всего, вызовет гнев государства, откуда они бежали. С другой стороны, если мы позволим преследователям схватить беглецов, их наверняка казнят."
 colony.71.a: "Пусть присоединяются к нашим колонистам, если захотят."
 colony.71.b: "Политические инциденты нам не нужны. Отправьте их обратно."
 colony.72.name: "Ксеноантропологи"
 colony.72.desc: "Несколько ксеноантропологов с [Root.Owner.Capital.GetName&gen] вернулись на поверхность [Root.GetName&gen], долгое время прожив среди подземных аборигенов. Они узнали много нового о древних обычаях и нравах этого народа. Без сомнения, это продвинет вперёд наши общественные науки."
 colony.73.desc: "Недавно по [Root.GetName&dat] прокатилась очередная волна землетрясений, многие постройки в поселениях обрушились, погибли колонисты. Насколько нам известно, государство аборигенов выкапывает очередную пещеру, чтобы возвести новый город, и именно это стало причиной подземных толчков."
 colony.73.a: "Подставим другую щёку."
 colony.73.b: "Мы должны потребовать извинений!"
 colony.74.name: "Требование технологий"
 colony.74.desc: "Генералы подземного государства с [Root.GetName&gen] увидели, каким совершенным оружием вооружены наши солдаты, и потребовали, чтобы мы поделились с ними военными технологиями.\n\nНаши офицеры сомневаются, стоит ли это делать, ведь если дойдёт до войны, нам будет сложнее одержать победу над аборигенами. Однако если мы ответим отказом, они могут принять это за оскорбление."
 colony.74.a: "Вооружать дикарей современным оружием — это плохая идея."
 colony.74.b: "Они наши друзья. Мы должны поделиться с ними."
 colony.75.name: "Послание доставлено"
 colony.75.desc: "Торговля с подземными аборигенами [Root.GetName&gen] в последнее время идёт очень вяло, их караваны всё реже выбираются на поверхность. Сегодня мы получили послание от представителя их военных. Похоже, они чем-то недовольны."
 colony.75.a: "Давайте прочитаем послание."
 colony.76.name: "Послание"
 colony.76.desc: "Жители поверхности. Мы старались быть хорошими соседями, но вы даже не пытаетесь относиться к нашей великой цивилизации с тем уважением, которого она заслуживает.\n\nПоэтому наш император провозгласил, что мы должны захватить весь этот мир целиком. Мы прогоним вас обратно на звёзды, откуда вы явились!"
 colony.76.desc.subterranean: "Жители поверхности. Мы старались быть хорошими соседями, но вы даже не пытаетесь относиться к нашей великой цивилизации с тем уважением, которого она заслуживает.\n\nПоэтому наш император провозгласил, что мы должны захватить весь этот мир целиком. Мы прогоним вас обратно на звёзды, откуда вы явились!"
 colony.76.a: "Скверное дело."
 colony.100.name: "Брошенное оборудование"
 colony.100.desc: "После того как мы обосновались на [Root.GetName&prep], в её биосфере был обнаружен ряд аномалий. Экосистема выглядит нестабильной и развивается не по типовым моделям, проработанным для миров такого класса. Наши учёные подозревали внешнее вмешательство, и теперь эти выводы подтвердились!\n\nКолонисты наткнулись на крупный подземный комплекс, предназначенный для терраформирования и сооружённый несколько тысячелетий назад. Судя по всему, оборудование было отключено до завершения работ, и биосфера планеты осталась в том состоянии, какое мы видим сейчас. Если подать энергию, комплекс заработает вновь, но неизвестно, к чему это приведёт..."
 colony.100.a: "Кто мог создать это?"
 colony.101.name: "Комплекс терраформирования разобран"
 colony.101.desc: "Наши учёные завершили работу по разборке заброшенного комплекса терраформирования на [Root.GetName&prep]. У нас по-прежнему нет данных, кто его построил, но оборудование поражает своим совершенством. Мы узнаем много нового о методах терраформирования, когда изучим его как следует."
 colony.102.name: "Нестабильная погода"
 colony.102.desc: "Из-за того, что терраформирование [Root.GetName&gen] не было доведено до конца, она остаётся климатически нестабильной. Здесь часто без всякого предупреждения случаются сильные бури, которые наши климатические модели не могут предсказать. Недавно такая буря пронеслась над крупным поселением. Несколько построек были разрушены, погибли колонисты."
 colony.103.name: "Засуха"
 colony.103.desc: "Нестабильный климат [Root.GetName&gen] вызвал сильную засуху, от которой пострадали почти все территории. [Root.Owner.Capital.GetName] получает от колонистов в бедствующих районах просьбы о финансовой помощи."
 colony.103.a: "Пусть сами о себе позаботятся."
 colony.103.b: "Дайте им всё, что они просят."
 colony.104.desc: "Прерванное терраформирование [Root.GetName&gen] наконец завершено. Инопланетные биоинженерные машины засеяли атмосферу миллиардами терраформирующих нанитов, и условия жизни на поверхности существенно изменились. Экосистема и климат стабилизировались, на планете появились новые флора и фауна, адаптированные к таким условиям."
 colony.104.a: "Посмотрим, что же мы получили..."
 abandoned_terraforming_completed: "Этот мир изменился в результате терраформирования."
 colony.105.desc: "Прерванное терраформирование [Root.GetName&gen] наконец завершено. Инопланетные биоинженерные машины засеяли атмосферу миллиардами терраформирующих нанитов, и условия жизни на поверхности существенно изменились.\n\nОднако при создании новой флоры и фауны что-то явно пошло не так. Наниты породили миллионы изуродованных существ. Почти все они погибли в течение нескольких секунд, однако уцелевшие сбились в огромную визжащую стаю. И она, похоже, движется к нашим главным поселениям!"
 colony.105.a: "Это настоящий кошмар!"
 terraforming_mutants_attack: "Мутанты атакуют наших колонистов!"
 colony.106.desc: "Прерванное терраформирование [Root.GetName&gen] наконец завершено. Инопланетные биоинженерные машины засеяли атмосферу миллиардами терраформирующих нанитов, и условия жизни на поверхности существенно изменились. Экосистема и климат стабилизировались, на планете появились новые флора и фауна, адаптированные к таким условиям.\n\nНам повезло, теперь эта [Root.GetPlanetMoon_rinfix&nom] — настоящий рай. [Root.Owner.GetSpeciesNamePlural] будут здесь процветать! Новый климат подходит нам даже больше, чем условия на [Root.Owner.Capital.GetName&prep]."
 colony.107.desc: "Некогда прерванное терраформирование [Root.GetName&gen] завершено, но оно повлекло за собой ужасающие последствия! Мы не знаем, какая раса инопланетян разработала это оборудование, но их физиология совершенно отличалась от нашей. Теперь эта [Root.GetPlanetMoon_rinfix&nom] получила лишённую озона стратосферу и может поддерживать только жизнь, требующую ультрафиолетового излучения высокого уровня.\n\nВ результате миллионы колонистов погибли ужасной смертью."
 colony.107.desc.nuked_pref: "Некогда прерванное терраформирование [Root.GetName&gen] завершено. Мы не знаем, какая раса инопланетян разработала это оборудование, но их физиология, должно быть, схожа с нашей. Сейчас на планете имеется азотно-кислородная атмосфера и высокий уровень поверхностного излучения — она превратилась в §Y$pc_nuked$§!.\n\nК счастью, [Root.Owner.GetSpeciesName] приспособились к выживанию именно в таких экстремальных условиях."
 colony.107.a: "Это катастрофа!"
 colony.107.a.tooltip: "§HНа [Root.GetName&prep] погибает каждое поселение, за исключением тех, которые обладают чертами§! §Y$trait_mechanical$§! §Hили§! §Y$trait_pc_nuked_preference$§!."
 colony.108.name: "Существа уничтожены"
 colony.108.desc: "Мы отразили атаку существ, которые нападали на наши поселения на [From.From.GetName&prep]. Их гниющими останками теперь усеяна территория перед нашими укреплениями, и бульдозеры зарывают эту зловонную биомассу в наскоро выкопанные рвы.\n\nГенетический материал всё же представляет интерес для наших учёных. Они собрали образцы, которые должны помочь биологам в будущих исследованиях."
 colony.109.name: "Хищное существо"
 colony.109.desc: "На [Root.GetName&prep] колонисты до сих пор сталкиваются с уцелевшими мутантами, возникшими после завершения процесса терраформирования. Почти все они относительно безвредны, и местных сил самообороны достаточно, чтобы избавить их от мучений. Но одно из созданий в последнее время наводит ужас на внешние поселения. Отчёты говорят, что этот хищник выслеживает колонистов, и уже несколько десятков человек исчезли бесследно.\n\nНедавно были обнаружены изуродованные останки членов разведывательного отряда. Руководство колонии просит о военной помощи."
 colony.109.a: "Этих тварей нужно отыскать и уничтожить!"
 colony.110.desc: "Наши войска провели поисковую операцию на [From.From.GetName&prep] и сумели отыскать мутанта, убивавшего колонистов. Отряд спецназа проник в логово этого существа и после яростного боя сумел его уничтожить. Внутри были останки сотен зверски убитых колонистов, а также полдюжины запуганных, но ещё живых людей, которых тварь не успела сожрать.\n\nОгромная голова существа была отделена от тела. Теперь она станет символом отряда, прикончившего опасное чудовище."
 colony.111.name: "Существо перестало появляться"
 colony.111.desc: "Мутировавшее существо, которое нападало на наших колонистов на [Root.GetName&prep], перестало появляться. Исчезновений людей больше не отмечается. Вполне вероятно, что хищник умер своей смертью — от старости, либо подавившись очередной жертвой.\n\nЖители [Root.GetName&gen], безусловно, радуются избавлению от смертельной угрозы, но они обижены на нас за то, что мы не сумели их защитить."
 colony.111.a: "Быть может, мы могли сделать что-то ещё..."
 colony.112.name: "Существо стало появляться чаще"
 colony.112.desc: "Мутировавшее существо, которое нападает на наших колонистов на [Root.GetName&prep], в последнее время стало вести себя гораздо активнее. Участились пропажи людей. Более того, наблюдатели отмечают появление нескольких особей одновременно, и это означает, что хищнику каким-то образом удалось размножиться.\n\nСтаи этих тварей теперь резвятся в сельских районах, уничтожая наших колонистов. Если мы не предпримем решительных действий, колония может погибнуть!"
 colony.112.a: "Эти твари не отступятся!"
 colony.113.name: "[From.From.GetName] во власти мутантов"
 colony.113.desc: "Наши силы на [From.From.GetName&prep] потерпели сокрушительное поражение под натиском мутировавших хищников! Омерзительные твари вольготно разгуливают по всей колонии и безнаказанно убивают людей. Мы получаем донесения о том, что немногим выжившим удалось бежать и они скрываются где-то в дикой местности. Однако нет сомнений в том, что хищники скоро отыщут и их тоже."
 colony.113.a: "Мы должны оказать военную помощь!"
 colony.114.name: "[From.From.GetName] избавляется от хищников"
 colony.114.desc: "Наши экспедиционные силы избавили [From.From.GetName&acc] от мутировавших тварей, захвативших все основные поселения. Их гниющими останками теперь усеяна территория перед нашими укреплениями, и бульдозеры зарывают эту зловонную биомассу в наскоро выкопанные рвы.\n\nЭта [From.From.GetPlanetMoon_rinfix&nom] являет собой печальное зрелище. Кучки уцелевших колонистов выбираются из укрытий, но очень много людей погибло."
 colony.114.a: "Придётся отстроить всё заново."
 colony.150.name: "Подземное убежище"
 colony.150.desc: "Геологические исследования, проведённые нашими колонистами на [Root.GetName&prep], выявили в горах огромную пещеру. Все признаки говорят о том, что это бункер, построенный той же расой, которая раньше обитала на этой планете и погибла в ходе ядерной войны.\n\nМного веков убежище оставалось закрыто, однако наши датчики улавливают изнутри слабые сигналы. Учёным не терпится вскрыть бункер и выяснить, что же скрывается за его бронированными дверями."
 colony.150.a: "Давайте его вскроем!"
 colony.150.b: "Лучше ничего не трогать."
 colony.151.desc: "Нашей научной экспедиции наконец удалось вскрыть бункер на [Root.GetName&prep], однако внутри она не обнаружила ничего, кроме древних скелетов млекопитающих. Судя по всему, примерно 200 лет назад у обитателей убежища закончилось пропитание, и они в ярости набросились друг на друга, как каннибалы. На разбросанных костях видны следы зубов. Можно лишь вообразить, каким мрачным был исход этой некогда славной цивилизации и что должны были ощущать последние из уцелевших.\n\nНо есть и позитивные моменты. В бункере сохранились журналы и базы данных, так что нашим учёным и ксенопсихологам хватит работы на многие годы вперёд."
 colony.151.b.evopred: "Этими костями ещё можно будет полакомиться."

 colony.152.desc: "Гигантский бункер на [Root.GetName&prep] удалось вскрыть. Каково же было изумление наших учёных, когда они обнаружили внутри несколько миллионов выживших, спасавшихся в убежище от последствий масштабной ядерной войны. Несмотря на скудные ресурсы, люди сумели создать самодостаточное общество и продержались так несколько веков. Они прежде не встречали инопланетян и поначалу держались настороженно, но благодарность оказалась сильнее.\n\nВ бункере сохранились инструменты и оборудование для возрождения цивилизации после ядерного холокоста. Управлять этой техникой могут только аборигены, но они готовы присоединиться к нашим колонистам на поверхности, как только вновь привыкнут к солнечному свету."
 colony.152.a: "Давайте восстанавливать этот мир вместе."
 colony.152.b: "Отлично. Готовьте ошейники для рабов!"
 colony.152.b.tooltip: "Эти поселенцы станут рабами."
 colony.152.c: "Замуруйте это отребье обратно в бункер и завалите вход."
 colony.153.desc: "Учёным наконец удалось вскрыть древний бункер на [Root.GetName&prep], но, к нашему ужасу, оттуда вырвались орды обезумевших мутантов — всё, что осталось от прежних обитателей планеты.\n\nЭти создания уничтожили исследовательскую группу в считаные секунды и рассыпались по местности. Тысячи колонистов были зверски убиты, безжалостные оголодавшие монстры захватили несколько поселений. Мы укрепили оставшиеся города и пытаемся контролировать периметр, но этого недостаточно!"
 colony.153.a: "Все на защиту!"
 colony.155.name: "Ядерная бомба"
 colony.155.desc: "Наши колонисты исследовали развалины неподалёку от одного из основных поселений на [Root.GetName&prep] и случайно включили таймер на не взорвавшейся водородной бомбе. Этот снаряд — память о некогда бушевавшей здесь ядерной войне — дожил до наших дней.\n\nЕго потенциальная мощность составляет 35 мегатонн — достаточно, чтобы уничтожить несколько населённых пунктов. Бомба может взорваться при перемещении, и у нас нет времени на эвакуацию всего региона."
 colony.155.a: "Мы должны её разрядить!"
 colony.156.desc: "Мы успешно разрядили водородную бомбу на [From.From.GetName&prep]! Теперь она не представляет никакой угрозы. Команды специалистов обшаривают местность в поисках других боеприпасов. Мы надеемся, что больше таких инцидентов не случится."
 colony.156.a: "Нам чудом повезло."
 colony.157.desc: "Сапёрам не удалось в срок разрядить водородную бомбу на [From.From.GetName&prep]. При взрыве они погибли вместе со всеми, кто находился в радиусе 100 километров. Мы понесли огромные потери. Это стало последним трагическим отголоском бессмысленной войны, бушевавшей здесь тысячи лет назад."
 colony.157.a: "Это катастрофа!"
 colony.160.name: "Разрушенный ускоритель частиц"
 colony.160.desc: "Мы обнаружили огромный разрушенный комплекс на [Root.GetName&prep], напоминающий ускоритель заряженных частиц. Он находится в зоне, испещрённой бомбовыми воронками и всё ещё источающей радиацию. Вероятно, в ходе последней ядерной войны ускоритель считался стратегическим объектом особой важности.\n\nНам достались несколько журналов наблюдений, которые вели учёные, работавшие на ускорителе. Хотя технологии этой цивилизации были довольно неразвитыми, теоретические исследования и ряд формул в этих записях могут представлять интерес даже по нашим меркам. Физики уже работают с этими данными."
 colony.161.name: "Уцелевшая инфраструктура"
 colony.161.desc: "Инфраструктура, уцелевшая после масштабной ядерной войны на [Root.GetName&prep], оказалась очень полезна нашим колонистам. Раса, обитавшая здесь прежде, возводила подвесные дороги, соединявшие крупные населённые центры, и некоторые из них до сих пор находятся в приемлемом состоянии.\n\nКроме того, мы сумели переработать большое количество строительного материала, разобрав местные руины, и это также пойдёт на пользу инфраструктуре колонии."
 colony.162.name: "Древняя космическая станция"
 colony.162.desc: "Небольшая группа исследователей из нашей колонии на [Root.GetName&prep] недавно высадилась на примитивной космической станции, которую оставили на орбите прежние обитатели этого мира. Внутри они нашли мумифицированные останки команды, сгрудившейся перед смертью у иллюминаторов, откуда было видно родную планету. Вероятно, они осознали, что обречены, когда увидели ядерные грибы, вырастающие внизу, среди облаков. Бортовой журнал показывает, что астронавты безуспешно пытались связаться с поверхностью, но затем припасы подошли к концу.\n\nСтанция неплохо сохранилась. Её устройство позволило нашим инженерам ознакомиться с технологиями ранней космической эпохи. Несмотря на примитивность, некоторые решения можно признать оригинальными, и это будет нам полезно."
 colony.162.b.evopred: "Повезло, что останки не заражены радиацией."
 colony.163.name: "Радиация в пустошах"
 colony.163.desc: "Уровень радиации в пустошах некоторых районов [Root.GetName&gen] оказался выше, чем показывали первоначальные замеры. Колонисты в поселениях жалуются на плохое самочувствие, рождаемость падает. Мы планируем эвакуировать население из заражённой местности, но это займёт много времени."
 colony.164.name: "Движение пацифистов"
 colony.164.desc: "Мрачные развалины и обезлюдевшие пустоши на [Root.GetName&prep] повлияли на наших колонистов, которые стали проникаться духом пацифизма.\n\nУчастники нового движения утверждают, что окружающая среда служит им ежедневным напоминанием о бессмысленных ужасах войны. Они считают, что их гражданский долг — не допустить, чтобы нечто подобное случилось в других мирах. Их не должна постигнуть трагическая судьба [Root.GetName&gen]."
 colony.164.a: "Они это серьёзно?"
 colony.164.b: "Проклятые трусы позорят нашу расу!"
 colony.164.c: "Замечательно. Нужно дать миру шанс."
 colony.164.a.tooltip: "Примерно §Y300§! £pop£ §Hпоселений§! на §H[Root.GetName&prep]§! отказываются от §Yмилитаризма§! в пользу §Yпацифизма§!."
 colony.170.name: "Обломки на орбите"
 colony.170.desc: "Пространство над [Root.GetName&inst] замусорено всевозможными обломками, оставленными расой, которая раньше населяла этот мир. Прежде чем инопланетяне самоуничтожились, они успели запустить в космос тысячи примитивных спутников и ракетных пусковых платформ. Со многими из них разобралась система спутниковой обороны в ходе ядерной войны, испепелившей планету, и мусора на орбите только прибавилось.\n\nМеж тем, наша колония на поверхности развилась до того уровня, когда весь этот мусор начал создавать помехи инфраструктуре. Мы не можем запускать спутники, и пусковые окна для гражданских орбитальных полётов остаются слишком узкими."
 colony.170.a: "Вероятно, надо что-то предпринять."
 colony.171.name: "Крушение грузовоза"
 colony.171.desc: "Гражданский грузовой звездолёт, который должен был приземлиться на [Root.GetName&prep], получил повреждения на орбите, в облаке стремительно движущегося космического мусора. Экипаж погиб почти мгновенно, повреждённый корабль влетел в атмосферу и рухнул рядом с крупным энергетическим комплексом. В результате взрыва погибли несколько колонистов, инфраструктуре был нанесён серьёзный урон."
 colony.171.desc.mach: "Грузовой звездолёт с рабочими единицами, который должен был приземлиться на [Root.GetName&prep], получил повреждения на орбите, в облаке стремительно движущегося космического мусора. Экипаж был уничтожен мгновенно, повреждённый корабль влетел в атмосферу и рухнул рядом с крупным энергетическим комплексом. В результате взрыва в нескольких местах была прекращена работа, а инфраструктуре был нанесён серьёзный урон."
 colony.171.a: "Вот невезение!"
 colony.172.name: "Попадание обломков"
 colony.172.desc: "Ряд столкновений, имевших место за последнее время в плотном облаке космического мусора вокруг [Root.GetName&gen], привёл к смене орбиты особо крупного объекта. Предположительно, это остатки одной из пусковых ракетных платформ, которые использовались в ходе ядерной войны. Объект был втянут в атмосферу и обрушился прямо на крупное поселение колонистов. Нам сообщают о множестве погибших."
 colony.172.a: "С этим мусором нужно что-то делать."
 colony.173.desc: "Научный корабль помог руководству колонии на [From.From.GetName&prep] с расчисткой космического мусора в орбитальном пространстве. Теперь спутники и гражданские корабли будут в безопасности."
 colony.174.desc: "Научный корабль помог руководству колонии на [From.From.GetName&prep] с расчисткой космического мусора в орбитальном пространстве. Теперь спутники и гражданские корабли будут в безопасности.\n\nКроме того, оказалось, что в большинстве своём этот мусор состоял из ценных минералов, которые использовались при создании спутников. Мы переработали немало полезного сырья и смогли извлечь неплохую прибыль."
 colony.180.name: "Замечен астероид"
 colony.180.desc: "Телескопы глубокого космического слежения, расположенные на [Root.GetName&prep], сделали тревожное открытие: крупный астероид приближается к нам по траектории, ведущей к столкновению! В случае удара о поверхность последствия будут катастрофическими.\n\nНеобходимо уничтожить астероид, пока не поздно!"
 colony.180.a: "Дурное предзнаменование..."
 colony.180.b: "Понятно."
 colony.182.name: "Астероид уничтожен"
 colony.182.desc: "Астероид, приближавшийся к [Root.GetName&dat] по траектории, ведущей к столкновению, уничтожен! Узнав о том, что им больше не грозит гибель, колонисты высыпали на улицы и устроили праздник.\n\nСканирование обломков астероида показало, что он состоял в основном из ценных минералов. Мы собрали всё, что могли."
 colony.182.desc.mach: "Астероид, приближавшийся к [Root.GetName&dat] по траектории, ведущей к столкновению, уничтожен! Случившееся не повлияло ни на какие единицы или строения на планете, поскольку обломки были настолько малы, что сгорели при входе в атмосферу.\n\nСканирование фрагментов астероида показало, что он состоял в основном из ценных минералов. Мы собрали всё, что могли."
 colony.183.name: "Астероид врезается в [Root.GetName&acc]"
 colony.183.desc: "Нам не удалось вовремя остановить астероид, направлявшийся к [Root.GetName&dat]. Столкновение двух небесных тел привело к множественным разрушениям и бесчисленным жертвам. Погибли миллионы колонистов."
 colony.183.desc.mach: "Нам не удалось вовремя остановить астероид, направлявшийся к [Root.GetName&dat]. Столкновение двух небесных тел привело к множественным разрушениям. Миллионы машин полностью вышли из строя."
 colony.183.a: "Трагический день для всех нас."
 colony.185.name: "Мир поглощён"
 colony.185.desc: "Мы поглотили достаточную часть мира §Y[Target.GetName]§!, чтобы запустить цепную реакцию, дестабилизировавшую ядро.\n\nВсе трутни были эвакуированы на мир §Y[Owner.Capital.GetName]§!."
 colony.185.a: "Мы всё ещё голодны."
 colony.185.a.tooltip: "Мир §Y[From.GetName]§! уничтожен."


 ####################################
 # Precursor Events
 ####################################
 vultaum_artifact: "Мы добыли вультаумский артефакт."
 precursor.completed.name: "Археологический проект завершён"
 precursor.completed.a: "Любопытная находка."
 precursor.1.name: "Звёздное сообщество Вультаум"
 precursor.1.desc: "На §Y[From.GetName&prep]§! мы обнаружили артефакты древней инопланетной цивилизации! Она существовала примерно 12 миллионов лет назад, судя по возрасту найденных артефактов.\n\nИзучив все имеющиеся данные, наши учёные сделали вывод, что эти существа напоминали кольчатых червей длиной 3-4 метра. Они называли себя звёздным сообществом Вультаум и, по всей видимости, общались в основном вибрациями, производимыми сегментами тела."
 precursor.5.name: "Вультаумская добывающая станция"
 precursor.5.desc: "Останки небольшой вультаумской станции по добыче гелия-3 были обнаружены на дне крупного кратера на [From.GetName&prep]. Кратер, судя по всему, возник в результате мощного взрыва на станции. Если только вультаумские методы работы радикально не отличались от наших собственных, можно утверждать, что никакой несчастный случай или авария не могли стать причиной такой катастрофы."
 precursor.6.desc: "Нам очень повезло, и мы смогли собрать части вультаумского оборудования по обработке данных на месте взрыва в кратере на [From.From.GetName&prep]. Почти вся информация оказалась повреждена, но нашим учёным удалось перевести слово «корга» — это основная единица времени у вультаумцев."
 precursor.10.name: "Вультаумская обсерватория"
 precursor.10.desc: "На §Y[From.GetName&prep]§! была обнаружена древняя вультаумская обсерватория. Система [From.GetName&gen] довольно далеко от того сектора галактики, в котором зародилась вультаумская цивилизация. Судя по всему, этот комплекс использовался в первую очередь для наблюдения за местными звёздами.\n\nМы изучили все сохранившиеся данные, но так и не смогли разгадать, что же искали вультаумцы."
 precursor.11.desc: "Археологические раскопки на §Y[From.From.GetName&prep]§! помогли обнаружить небольшое изображение на одной из пыльных стен в малом зале обсерватории. Судя по всему, здесь изображены созвездия — то, как они выглядели в родном мире вультаумцев. Нашим астрономам не удалось идентифицировать конкретные звёзды."
 precursor.15.name: "Вультаумская колония"
 precursor.15.desc: "Останки вультаумского космического подъёмника были обнаружены [Root.GetName&inst] в экваториальной области [From.GetName&gen]. Похоже, подъёмник был разрушен намеренно. Для этого кто-то уничтожил противовес, находившийся на геостационарной орбите, и гигантский кабель обрушился на несколько крупных городов на экваторе. Число жертв, вероятно, исчислялось миллионами."
 precursor.16.desc: "Нашим археологам на §Y[From.From.GetName&prep]§! удалось обнаружить остатки звёздной карты рядом с сегментом обрушенного подъёмника. Судя по всему, ей пользовались вультаумские торговцы. На карту нанесены несколько самых прибыльных межзвёздных торговых путей."
 precursor.20.desc: "Несколько крупных озёр идеально круглой формы на поверхности [From.GetName&gen] возникли в результате серии взрывов антивещества несколько миллионов лет назад. На тот момент здесь обитали вультаумцы, и кратеры сосредоточены в тех регионах, где располагались их крупнейшие поселения.\n\nНаши учёные на [Root.GetName&prep] утверждают, что это не орбитальная бомбардировка, а значит, взрывы были спровоцированы кем-то или чем-то на поверхности."
 precursor.21.desc: "Археологам на §Y[From.From.GetName&prep]§! удалось извлечь из терминала разрушенного медицинского комплекса неповреждённый банк памяти. Там содержится любопытная статистика. В частности, теперь нам известно, что срок жизни вультаумцев составлял примерно 270 лет. Также мы получили список их самых распространённых болезней."
 precursor.25.desc: "Тщательное сканирование §Y[From.GetName&gen]§! выявило обширную сеть искусственных туннелей под поверхностью. Почти все они давно обрушились, и команда [Root.GetName&gen] полагает, что это лишь малая часть того, что некогда было процветающей вультаумской колонией.\n\nОсновные подземные пещеры были обрушены преднамеренно. Они погребли города вультаумцев со всеми обитателями под миллионами тонн камней."
 precursor.26.desc: "Археологические раскопки на §Y[From.From.GetName&prep]§! помогли обнаружить окаменелые останки вультаумцев в обрушенной пещере, близко к поверхности. Теперь наши учёные куда лучше представляют, как выглядела эта раса."
 precursor.30.name: "Вультаумский комплекс на газовом гиганте"
 precursor.30.desc: "Мы обнаружили обломки станции по добыче газа на орбите [From.GetName&gen]. Судя по всему, она была построена вультаумцами. Несколько миллионов лет назад кто-то намеренно включил двигатели, чтобы направить станцию в недра газового гиганта, но столкновение с неизвестным объектом изменило её траекторию."
 precursor.31.desc: "Нашим археологам удалось обнаружить практически неповреждённый вультаумский космический скафандр, на который почему-то не обратили внимания мародёры. Изучение этой четырёхметровой трубообразной конструкции позволит учёным выяснить, какая среда была для вультаумцев максимально благоприятной."
 precursor.35.name: "Вультаумский торговый форпост"
 precursor.35.desc: "На §Y[From.GetName&prep]§! находился небольшой форпост, откуда вультаумцы вели торговлю с соседними цивилизациями. Похоже, в какой-то момент он был превращён в религиозный центр, в котором вультаумцы пытались обращать в свою веру инопланетных торговцев. Вскоре после этого торговля сошла на нет, и форпост был заброшен."
 precursor.36.desc: "Археологи обнаружили на §Y[From.From.GetName&prep]§! небольшую цифровую листовку вультаумского происхождения. Кажется, миссионеры на форпосте раздавали такие листовки заезжим торговцам. Почти вся информация повреждена, однако удалось разобрать, что там упоминается «великая ложь» и «оковы виртуальной реальности»."
 precursor.40.name: "Вультаумский спутник"
 precursor.40.desc: "Небольшой вультаумский спутник был обнаружен на орбите §Y[From.GetName&gen]§!. Он был настроен на бесконечную трансляцию одного и того же послания, пока источник питания не иссяк окончательно несколько миллионов лет назад. Мы изучили передатчик, но сообщение почти не сохранилось.\n\nНасколько можно судить, послание было записано для того, чтобы обращать окрестные цивилизации в вультаумскую веру. Там говорится о необходимости «отключения» и «вкушения истинного бытия», что бы это ни означало."
 precursor.41.desc: "Наши археологи и инженеры тщательно изучили вультаумский спутник и сообщили, что никаких полезных для нас технологий он не содержит. Зато в результате проделанной работы мы стали куда лучше разбираться в основах вультаумского языка программирования. Теперь нам будет проще расшифровывать поступающую информацию."
 precursor.45.name: "Вультаумская колония раскольников"
 precursor.45.desc: "На §Y[From.GetName&prep]§! находилась небольшая вультаумская колония, уникальная по двум причинам. Во-первых, система [From.GetName&gen] лежит за пределами бывшего вультаумского пространства. Во-вторых, эти развалины на несколько столетий младше всех прочих руин этой цивилизации. Скорее всего, колония была основана группой раскольников, отрицавшей те убеждения, которые господствовали в вультаумском обществе."
 precursor.46.desc: "Несколько артефактов, обнаруженных археологами при раскопках на §Y[From.From.GetName&prep]§!, оказались покрыты письменами. В них категорически отрицается философия вультаумцев о том, что «сама жизнь есть ложь». Один из артефактов прославляет былое величие вультаумской расы. Это подтверждает нашу теорию о том, что колония раскольников просуществовала ещё какое-то время после гибели остального звёздного сообщества."
 precursor.50.name: "Вультаум: центр виртуальной реальности"
 precursor.50.desc: "Вультаумские инженеры в своё время соорудили вблизи §Y[From.GetName&gen]§! крупный орбитальный комплекс, предназначенный для компьютерных исследований. Удивительно, но они почти не вели исследований в области искусственного интеллекта, как многие другие расы, а занимались исключительно виртуальной реальностью и компьютерными симуляциями. Практически весь комплекс был разрушен в результате обстрела и попаданий микрометеоритов, но сохранившиеся остатки, учитывая их возраст, находятся в отличном состоянии."
 precursor.51.desc: "Археологи, изучавшие вультаумский комплекс на орбите §Y[From.From.GetName&gen]§!, обнаружили кое-что интересное. Им удалось восстановить фрагменты многопользовательской компьютерной игры в виртуальном пространстве, которая была популярна во всей империи.\n\nХотя действие в основном происходит в выдуманном мире, высмеивающем современное общество, игра стала неоценимым источником сведений о языке и обычаях вультаумцев."
 precursor.55.name: "Вультаумская добывающая станция на астероиде"
 precursor.55.desc: "§Y[From.GetName]§! несёт множество следов от попаданий астероидов, но один кратер выделяется особо. Судя по всему, он возник в результате взрыва некоего устройства, основанного на антиматерии. На поверхности астероида имеются свидетельства того, что примерно 12 миллионов лет назад вультаумцы вели здесь активные работы по добыче ценных ископаемых. Вполне возможно, что на месте самого крупного кратера раньше находилась добывающая станция."
 precursor.56.desc: "При ближайшем изучении объекта §Y[From.From.GetName]§! и уничтоженной вультаумской добывающей станции удалось обнаружить в уцелевшем туннеле брошенное оборудование. Его могли использовать только червеобразные вультаумцы. Команды подавались теми же вибрациями, с помощью которых они общались между собой."
 precursor.100.name: "Обнаружен родной мир вультаумцев"
 precursor.100.desc: "Внимательно изучив вультаумские артефакты, которые нам удалось добыть, учёные §Y[Root.Capital.GetName&gen]§! сумели вычислить точные галактические координаты Вультаумара — мира, откуда произошла древняя вультаумская цивилизация! Надо срочно отправить туда экспедицию, пока нас никто не опередил."
 precursor.100.a: "Свяжитесь с ближайшим научным кораблём!"
 precursor.101.name: "Родной мир вультаумцев"
 precursor.101.desc: "От родного мира вультаумцев не осталось ничего, кроме обломков. Их изучение показывает, что примерно 12 миллионов лет назад мир был уничтожен взрывом антивещества. На поверхности были обнаружены развалины, исследование которых позволило нам выяснить, что идеология вультаумцев коренным образом изменилась примерно за сто лет до гибели цивилизации.\n\nОни стали утверждать, что вселенная является искусственной реальностью, в которую все разумные существа погружены для развлечения неких высших созданий. Вультаум предпринимал всё более радикальные попытки «отключить» себя от симуляции, что приводило, как правило, к массовым самоубийствам.\n\nНаконец они пришли к выводу, что только одновременное отключение миллиардов индивидов может дестабилизировать систему настолько, чтобы дать им свободу. В назначенный час вультаумцы по всей галактике совершили самоубийство подручными средствами. Тех, кто отказался последовать общему примеру, оказалось слишком мало для возрождения расы. Так погибла и канула в забытье вультаумская цивилизация."
 precursor.102.name: "Обнаружен родной мир вультаумцев"
 precursor.102.desc.a: "Найден разрушенный родной мир древней цивилизации Вультаум, но совсем недавно кто-то уже наносил сюда визит. Теперь на этой [FromFrom.GetPlanetMoon_rinfix&prep] не осталось ничего ценного."
 precursor.102.desc.b: "Согласно данным наших исследований, этот разрушенный мир когда-то был родиной древней цивилизацией, известной под названием Вультаум. Есть следы того, что здесь недавно побывали другие космические странники... Теперь на этой [FromFrom.GetPlanetMoon_rinfix&prep] не осталось ничего ценного."
 precursor.102.desc.lost_makers_intro: "Тем не менее наши исследовательские модули собрали достаточно данных, чтобы установить, какая участь постигла цивилизацию [GetPrecursorName]."
 precursor.102.desc.lost_makers: "$precursor.102.desc.a$ $precursor.102.desc.lost_makers_intro$\n\nПримерно 12 миллионов лет назад взрыв антивещества вызвал массовое вымирание на планете §H[FromFrom.GetName]§!. На поверхности были обнаружены руины, исследование которых позволило нам выяснить, что идеология вультаумцев коренным образом изменилась примерно за сто лет до гибели цивилизации.\n\nОни стали утверждать, что вселенная является искусственной реальностью, разработанной для развлечения неких высших созданий. Вультаум предпринимал всё более радикальные попытки «отключиться» от симуляции, большинство из которых заканчивались смертями.\n\nНаконец они пришли к выводу, что только одновременное отключение миллиардов индивидов может дестабилизировать систему настолько, чтобы дать им свободу. В назначенный час вультаумцы по всей галактике совершили самоубийство. Отказавшиеся последовать общему примеру постепенно вымерли, и в итоге вультаумская цивилизация погибла и канула в забытьё."
 precursor.500.name: "Юутская империя"
 precursor.500.desc: "На §Y[From.GetName&prep]§! мы обнаружили артефакты древней инопланетной цивилизации! Изучив возраст артефактов, наши учёные пришли к выводу, что эти инопланетяне населяли близлежащие части галактики примерно 6 миллионов лет назад. Они называли себя юутами и представляли собой гигантских плоских членистоногих.\n\nПохоже, что взрослый индивид мог достигать ста метров в длину, и, как правило, на одном звездолёте перемещались не более двух-трёх особей. "
 precursor.505.name: "Мир гнездовья для юутов"
 precursor.505.desc: "[From.GetName] в далёком прошлом [From.GetName::подвергся|||fem:подверглась|||neut:подверглось] массированным орбитальным бомбардировкам, в результате которых биосфере был нанесён непоправимый урон. Судя по всему, прежде здесь находился небольшой форпост, построенный древними юутами, но это не объясняет, почему мир был уничтожен."
 precursor.506.desc: "Детально изучив §Y[From.From.GetName&acc]§!, мы можем сделать вывод, что здесь находилось одно из «гнездовий» Юутской империи. Её Министерство размножения занималось подготовкой миров, очищая их от хищников и любых потенциально вредных элементов, после чего на поверхности откладывалась икра.\n\nЮутские малыши были предоставлены сами себе в безопасном окружении на протяжении нескольких сотен лет, пока у них не развивалось подобие разума. Лишь тогда их забирали в общество старших."
 precursor.510.name: "Юутская станция слежения"
 precursor.510.desc: "Мы обнаружили несколько крупных антенн слежения на [From.GetName&prep]. Их возраст — несколько миллионов лет, и мы полагаем, что их построили юуты. Впрочем, примерно 500 тысяч лет назад какая-то другая цивилизация приспособила их под свои нужды. Гигантские тарелки починить невозможно, но терминалы остались неповреждёнными."
 precursor.511.desc: "Наши археологи на §Y[From.From.GetName&prep]§! выяснили, что антенны слежения, которые были там установлены, сканировали космос в поисках разумной жизни, но здесь юутам так ни разу и не довелось столкнуться с ней.\n\nНам удалось частично подключить один из компьютерных терминалов, и археологи получили диск с данными журнала наблюдений, которые велись на протяжении веков. Судя по этим данным, во времена Юутской империи этот сектор галактики действительно был лишён разумной жизни."
 precursor.515.name: "Юутская колония"
 precursor.515.desc: "Руины нескольких десяток купольных городов юутской постройки обнаружены в южном полушарии §Y[From.GetName&gen]§!. Здесь могла находиться одна из их основных колоний.\n\nНаши наземные исследователи проникли в одно из разрушенных строений и обнаружили останки музея с экспозицией «знаменитых инопланетных подделок». Тут выставлялись различные артефакты, собранные юутами по всей империи. Они должны были доказывать наличие разумной жизни, но музей объявлял фальшивками все до единого."
 precursor.516.desc: "Большинство артефактов, выставлявшихся в юутских музеях на §Y[From.From.GetName&prep]§!, отсутствуют, но нашим археологам удалось восстановить одну из предполагаемых «фальшивок». Артефакт представляет собой инструмент для измерения космической радиации, однако археологи подтвердили, что он на несколько миллионов лет старше юутской цивилизации. Вопреки мнению юутского музея, это вполне подлинный артефакт."
 precursor.520.desc: "Следы деятельности юутов обнаруживаются по [From.GetName::всему|||fem:всей] §Y[From.GetName&dat]§!; судя по всему, в какой-то момент [From.GetName::<ego_eyo>] терраформировали. В северном полушарии есть область, представляющая собой массовое захоронение. Поблизости нет ни одного поселения юутов, но многие могилы помечены памятными знаками.\n\nС учётом низкой рождаемости и продолжительности жизни свыше тысячи лет каждая смерть для юутов была значимым событием, и погребальным обрядам уделяли большое значение."
 precursor.521.desc: "Археологические раскопки на [From.From.GetName&prep] показали, что за миллионы лет почти все могилы были разграблены. В этом нет ничего удивительного, поскольку юуты, по традиции, хоронили мертвецов в дорогих украшениях и с щедрыми дарами. В груде мусора, которым не заинтересовались мародёры, археологи обнаружили большую куклу, похожую на взрослого юута. Возможно, это был амулет на счастье или памятная реликвия."
 precursor.525.desc: "На §Y[From.GetName&prep]§! шла кровопролитная наземная война между юутами и другой расой, о которой нам почти ничего не известно. Это происходило на закате Юутской империи, и даже спустя миллионы лет мы обнаруживаем остатки военного снаряжения.\n\nХотя здесь находилась важная юутская колония, города и внешние поселения не были восстановлены после войны. Скорее всего, это означает, что юуты потерпели в ней поражение."
 precursor.526.desc: "Тщательно прочесав несколько древних полей сражений на §Y[From.From.GetName&prep]§!, наши археологи обнаружили нечто, напоминающее юутскую боевую сбрую. К ней всё ещё прикреплены несколько крупнокалиберных орудий, и учёные полагают, что, с учётом размеров юутов, их солдаты в сражении представляли собой огромные бронемашины."
 precursor.530.name: "Юутский спутник"
 precursor.530.desc: "На орбите вокруг §Y[From.GetName&gen]§! вращается юутский спутник, запущенный, чтобы увековечить дату знакомства юутов с расой джаббардени. Это случилось в системе [From.GetName&gen]. Встреча с братьями по разуму оказала огромное влияние на юутское общество.\n\nБольше миллиона лет они думали, что одиноки во вселенной, и это открытие вызвало у них ужас и благоговение. [Root.GetName::<1> взял<end_a>] спутник на борт, где он будет детально исследован."
 precursor.531.desc: "Изучив спутник, найденный на орбите §Y[From.From.GetName&gen]§!, наши археологи обнаружили выгравированный на нём стилизованный рисунок. Там изображался юутский крейсер и крохотный по сравнению с ним корабль-разведчик джаббардени в момент первого контакта. Теперь мы лучше представляем, как выглядели их звездолёты."
 precursor.535.name: "Юутский крейсер"
 precursor.535.desc: "Останки юутского крейсера были обнаружены на орбите §Y[From.GetName&gen]§!. Похоже, его расстреляли из орудий, однако, учитывая возраст корабля, трудно утверждать наверняка. Нет никаких признаков, что звездолёт был оснащён сверхсветовым двигателем. Скорее всего, он перемещался между звёздами на субсветовых скоростях."
 precursor.536.desc: "Археологи, исследующие древний юутский крейсер на орбите §Y[From.From.GetName&gen]§!, передали свой отчёт. В средней части корабля есть две криокамеры. Каждая предназначена для одного юута. При их гигантских размерах такова, вероятно, была стандартная команда звездолёта.\n\nНигде на корабле не обнаружено останков юутов, но археологи смогли добыть данные компьютера, который отслеживал физическое состояние команды. Там содержится ценнейшая информация о физиологии юутов."
 precursor.540.name: "Юутский колониальный корабль"
 precursor.540.desc: "Останки древнего юутского звездолёта были обнаружены на верхней орбите §Y[From.GetName&gen]§!. Команда [Root.GetName&gen] провела первичный анализ, который показал, что это мог быть колониальный корабль.\n\nДаже корабли такого класса у юутов обычно имели команду из одной-двух особей, но на этом звездолёте в трюме имелась дюжина криокамер. Каждую занимал юутский колонист, от которых теперь остались лишь иссохшие экзоскелеты."
 precursor.541.desc: "Останки юутского колониального корабля, обнаруженные на орбите §Y[From.From.GetName&gen]§!, очень плохо сохранились, но нашим археологам удалось снять субсветовые двигатели. Юуты так и не смогли преодолеть световой барьер. Вместо этого они полагались на криокамеры и свою немалую продолжительность жизни. Это позволило им создать огромную звёздную империю."
 precursor.545.name: "Юутское жилище на астероиде"
 precursor.545.desc: "Судя по всему, на этом астероиде обитал один-единственный юут. Глубокое сканирование показывает, что в недрах астероида расположена целая сеть туннелей и пещер. Их устройство схоже с юутскими обиталищами, обнаруженными на других планетах. Чтобы узнать больше, нам следует отправить группу для изучения этих пещер."
 precursor.546.desc: "Мы исследовали юутское жилище на астероиде §Y[From.From.GetName]§! и выяснили, что здесь обитала известная отшельница-философ Яаклиир. Судя по всему, среди юутов она пользовалась большим авторитетом, поскольку упоминания о ней можно встретить в различных юутских источниках. Останки Яаклиир были обнаружены у основного шлюза внутри жилища. Судя по всему, она скончалась в ожидании корабля с провизией, который так и не прилетел."
 precursor.600.name: "Обнаружен родной мир юутов"
 precursor.600.desc: "Внимательно изучив юутские артефакты, которые нам удалось добыть, учёные §Y[Root.Capital.GetName&gen]§! сумели вычислить точные галактические координаты Юутаана — мира, откуда произошла древняя юутская цивилизация! Надо срочно отправить туда экспедицию, пока нас никто не опередил."
 precursor.601.name: "Родной мир юутов"
 precursor.601.desc: "Мы нашли подтверждения тому, что §Y[FromFrom.GetName]§! [FromFrom.GetName::был<end_a>] родным миром юутов. Примерно четыре миллиона лет назад она подверглась массированной бомбардировке с орбиты. Искорёженные металлические каркасы — вот и всё, что осталось от огромных городов-куполов, некогда усеивавших эту [FromFrom.GetPlanetMoon_rinfix&acc].\n\nНасколько нам удалось установить, юуты примерно миллион лет безуспешно искали в космосе разумную жизнь. Когда им наконец встретились джаббардени, юная раса, совсем недавно открывшая межзвёздные перелёты, для юутов стало огромным потрясением, насколько они отличаются друг от друга.\n\nПравительство юутов постановило, что джаббардени необходимо уничтожить, пока они не набрались сил. Юуты напали неожиданно, их атака была отбита ценой немалых жертв. Несмотря на возраст, джаббардени уже экспериментировали с технологиями, до которых юуты так и не додумались, и со временем получили весомое преимущество. Война продолжалась около десяти лет, и в итоге Юутская империя, существовавшая два миллиона лет, была полностью уничтожена."
 precursor.602.name: "Обнаружен родной мир юутов"
 precursor.602.desc.a: "Мы обнаружили [FromFrom.GetPlanetMoon_rinfix&acc], которая является древней родиной юутов, но увы! Кто-то, должно быть, побывал здесь совсем недавно. Они забрали отсюда всё, что имело ценность."
 precursor.602.desc.b: "Наши исследования системы §Y[FromFrom.GetName&gen]§! показали, что когда-то [FromFrom.GetPlanetMoon_rinfix&nom] была родиной древней расы, известной как юуты. Однако в системе недавно побывали какие-то другие межзвёздные путешественники, которые, похоже, забрали отсюда всё, что имело ценность."
 precursor.602.desc.lost_makers: "$precursor.602.desc.a$ $precursor.102.desc.lost_makers_intro$\n\nПримерно четыре миллиона лет назад планета §H[FromFrom.GetName]§! подверглась массированной бомбардировке с орбиты. Искорёженные металлические каркасы — всё, что осталось от огромных городов-куполов, некогда усеивавших планету.\n\nЮуты примерно миллион лет искали в космосе разумную жизнь. Когда им наконец встретились джаббардени, совсем недавно открывшие межзвёздные перелёты, для юутов стало огромным потрясением, насколько они отличаются друг от друга.\n\nПравительство юутов постановило, что джаббардени необходимо уничтожить, пока они не набрались сил. Они развязали войну, которая дорого обошлась обеим сторонам. Несмотря на возраст, джаббардени уже экспериментировали с оружием, с которым юуты тягаться не могли. Война продолжалась около десяти лет, и в итоге Юутская империя, существовавшая два миллиона лет, была полностью уничтожена."
 precursor.1000.name: "Первая лига"
 precursor.1000.desc: "Мы обнаружили артефакты древней инопланетной цивилизации на §Y[From.GetName&prep]§!! Если результаты исследований артефактов верны, это был крупный альянс разных инопланетных рас. Они называли себя Первой лигой и сравнительно мирно уживались между собой, путешествуя по галактике два миллиона лет назад.\n\nСистема [From.System.GetName&gen] находится как раз в том секторе, где был центр их территории, но есть свидетельства, что Первая лига занимала значительную часть галактики, пока не погибла."
 precursor.1005.name: "База флота Лиги"
 precursor.1005.desc: "Останки бывшей базы флота Лиги были обнаружены на орбите §Y[From.GetName&gen]§!. Нам известно, что флот Лиги — именовавшийся Великим флотом — был весьма многочисленным и занимался охотой на космических пиратов и охраной дружественных рас от внешних агрессоров. На этом форпосте, судя по всему, размещались корабли, патрулировавшие окраины."
 precursor.1006.desc: "Мы исследовали флотскую базу Первой лиги и обнаружили эмблему 28 патрульной флотилии внешнего кольца. Её задачей была охрана торговых путей внешнего кольца, которые вели к дружественным мирам Лиги. База на орбите [From.From.GetName&gen], очевидно, являлась портом приписки."
 precursor.1010.name: "Крейсер Лиги"
 precursor.1010.desc: "Носовая часть древнего крейсера Первой лиги была обнаружена на орбите §Y[From.GetName&gen]§!. Вокруг дрейфуют обломки, но их недостаточно, чтобы можно было сложить корму. Останки корабля очень сильно повреждены, на них видны следы множественных попаданий электромагнитных снарядов."
 precursor.1011.desc: "Археологическая экспедиция вернулась после изучения останков крейсера Первой лиги на орбите §Y[From.From.GetName&gen]§!. Изуродованный корабль не дал ничего полезного, но учёным удалось найти список экипажа. Первая лига вела набор в Великий флот со всех известных миров, и благодаря списку нам стало ясно, что команда крейсера состояла из представителей двенадцати разных рас."
 precursor.1015.name: "Родной мир хамдаев"
 precursor.1015.desc: "Изучение §Y[From.GetName&gen]§! показало, что здесь находился родной мир насекомоподобной расы хамдаев. Они были одними из основателей Первой лиги. Громадные города, напоминающие ульи, некогда покрывали почти всю поверхность [From.GetPlanetMoon_rinfix&gen], но нам удалось установить, что хамдаи запрещали вести любое строительство на огромной площади, которая имела форму круга и занимала больше трети южного полушария. Эта местность являлась заповедником и использовалась для спаривания."
 precursor.1016.desc: "Нашей археологической экспедиции на §Y[From.From.GetName&prep]§! удалось добыть много ценной информации о вымершей расе хамдаев. Они были очень воинственны и несколько раз воевали с другими основателями Первой лиги, после того как их корабли преодолели световой барьер.\n\nВпервые потерпев поражение, хамдаи стали активно продвигать идеи создания Первой лиги. Их лучшие воины сражались с врагами Лиги на передовой. Нам удалось найти отлично сохранившийся «магил-ша» — церемониальный серп, который носили хамдайские гвардейцы Первой лиги."
 precursor.1020.name: "Родной мир чассаго"
 precursor.1020.desc: "Эта [From.GetPlanetMoon_rinfix&nom] — родной мир змееподобной расы, именовавшейся чассаго. Они были одними из основателей Первой лиги. Большинство своих городов они возводили под землёй, поэтому [From.GetName::<1> изрыт<end_aoy>] туннелями, почти полностью обрушившимися за два миллиона лет после гибели чассаго. Зонды, высланные на разведку с [Root.GetName&gen], помогли установить местонахождение нескольких крупных подземных городов."
 precursor.1021.desc: "Мы продолжаем раскопки на §Y[From.From.GetName&prep]§!, где находились подземные города чассаго, и уже многое узнали об этой древней расе. Они были рептилиями, лишёнными конечностей, у взрослых особей тело достигало двадцати метров в длину.\n\nПо сохранившимся свидетельствам можно судить о том, что чассаго были опытными торговцами, и именно их корабли чаще всего первыми контактировали с расами, не принадлежащими к Лиге. Если бы не их обширные торговые пути, которые были налажены ещё до объединения, Лига вряд ли смогла бы разрастись так стремительно."
 precursor.1025.name: "Родной мир мигир-ян"
 precursor.1025.desc: "Крохотные, но стремительно размножающиеся мигир-ян были одними из основателей Первой лиги — родом с §Y[From.GetName&gen]§!. Население обитало в массивных городах-куполах, рассеянных по всей поверхности, при этом каждый вмещал несколько сотен миллионов жителей.\n\nКупола были соединены между собой воздушными путями. Очевидно, мигир-ян старались не уродовать поверхность [From.GetPlanetMoon_rinfix&gen] другими постройками."
 precursor.1026.desc: "Окаменелые останки вымершей расы мигир-ян были обнаружены нашими археологами на §Y[From.From.GetName&prep]§!, и мы получили более точное представление об их внешнем виде. Представители этой расы отличались малыми размерами, не выше 60 см, и были похожи на млекопитающих грызунов. Питались они растительной пищей.\n\nСемейство мигир-ян состояло, как правило, примерно из тысячи особей, и положение индивида в обществе зависело исключительно от его способностей и умений. Утверждается, что именно дипломатический корпус мигир-ян стоял за созданием Первой лиги."
 precursor.1030.name: "Родной мир вропаков"
 precursor.1030.desc: "На §Y[From.GetName&prep]§! некогда обитала раса птицеподобных существ, которые назывались вропаки. Они являлись одними из основателей Первой лиги. Эти птицы не умели летать и передвигались на длинных суставчатых конечностях. Окаменелые останки свидетельствуют о том, что самки достигали четырёх метров в высоту, тогда как самцы были чуть ниже.\n\nСвои города они возводили под землёй, внутри разрытых возвышенностей. Данные сканеров показывают, что ряд таких возвышенностей был создан самими вропаками. Скорее всего, им пришлось это сделать, когда не осталось естественных мест обитания."
 precursor.1031.desc: "Когда Первая лига находилась в зените своего могущества, вропаки считались лучшими учёными в галактике. Их научные открытия помогли Лиге на начальном этапе экспансии. Многие расы примкнули к этому союзу ради того, чтобы вропаки поделились с ними технологиями. К сожалению, среди развалин [From.From.GetName&gen], их родного мира, никаких полезных технологий отыскать не удалось."
 precursor.1035.name: "Научная база Лиги"
 precursor.1035.desc: "Сканирование §Y[From.GetName&gen]§! показало, что на поверхности есть руины древнего сооружения. Почти весь комплекс был уничтожен мощным взрывом примерно два миллиона лет назад, уцелело лишь несколько внешних зданий. Пока что все признаки указывают на то, что здесь располагалась научно-исследовательская база Первой лиги."
 precursor.1036.desc: "Вернулась археологическая экспедиция, которую мы посылали для изучения исследовательской базы Первой лиги на §Y[From.From.GetName&prep]§!. От самого комплекса почти ничего не осталось, но, исходя из изолированного расположения базы, мы полагаем, что там могли вестись особо опасные изыскания — возможно, в области путешествий по измерениям или продвинутого биологического оружия.\n\nНам удалось отыскать диск с данными, принадлежащий «Академии наук», и теперь мы знаем гораздо больше о том, как было устроено научное сообщество Первой лиги."
 precursor.1040.name: "Объединённая колония Лиги"
 precursor.1040.desc: "Развалины колонии Первой лиги были обнаружены при раскопках на §Y[From.GetName&prep]§!. Судя по всему, эта колония являлась социальным экспериментом, поставленным уже на закате Лиги. В ней было собрано равное количество представителей всех рас, которые входили в Лигу. Меньше чем через 50 лет после основания колонии она была заброшена."
 precursor.1041.desc: "Нашим археологам удалось получить больше данных о колонии на §Y[From.From.GetName&prep]§!. На момент её основания Первая лига уже находилась на грани распада, и это поселение хотели использовать для пропаганды: идеальный мир, где представлены все члены Лиги и все расы живут и работают сообща и в гармонии.\n\nЭксперимент провалился, в колонии имеются следы побоищ. Особенно масштабная бойня случилась незадолго до того, как колония была заброшена."
 precursor.1045.name: "Торговый центр Лиги"
 precursor.1045.desc: "Два миллиона лет назад §Y[From.GetName]§! [From.GetName::служил<end_a>] крупным торговым центром для всех рас, входящих в Первую лигу. Почти вся поверхность [From.GetPlanetMoon_rinfix&gen] была застроена городами, мы обнаружили руины как минимум двенадцати крупных космопортов в одном только северном полушарии. Торговый центр просуществовал несколько веков, но с течением времени его забросили, когда старые торговые пути были забыты и распалась сама Первая лига."
 precursor.1046.desc: "Неизвестно, кто первым высадился в этом мире — здесь в равном количестве можно отыскать окаменелые останки почти всех рас Лиги. Наши археологи обнаружили также останки полудюжины рас, которые официально не входили в Лигу, но обладали особыми торговыми привилегиями на её территориях."
 precursor.1050.name: "Следы сражения"
 precursor.1050.desc: "Масштабное сражение между Великим флотом Первой лиги и другим флотом произошло неподалёку отсюда примерно два миллиона лет назад. Гравитационный колодец [From.GetName&gen] за это время успел втянуть почти все обломки, оставшиеся после сражения, и на поверхности обнаружено несколько разбитых звездолётов."
 precursor.1051.desc: "Наши археологи изучили несколько звездолётов, рухнувших на §Y[From.From.GetName&acc]§! после масштабного сражения, разыгравшегося в этой звёздной системе два миллиона лет назад. От Первой лиги в бою приняли участие вторая и третья флотилии Великого флота. Им противостояли объединённые силы рикимов — расы воинственных бродяг с окраин галактики.\n\nТо, что началось как мелкая стычка, быстро переросло в крупномасштабную баталию с участием сотен кораблей. Кто победил — определить невозможно."
 precursor.1055.name: "Тюремный комплекс Лиги"
 precursor.1055.desc: "На §Y[From.GetName&prep]§! обнаружены развалины крупного тюремного комплекса. Первая лига основала в этом негостеприимном мире колонию строгого режима, и здесь содержали преступников со всех миров Лиги.\n\nУцелевшие записи свидетельствуют, что большинство заключённых обвинялись в пиратстве, терроризме и других преступлениях «особого рода». На месте камер до сих пор можно обнаружить окаменелые останки узников."
 precursor.1056.desc: "Археологическая экспедиция обнаружила на §Y[From.From.GetName&prep]§!, к югу от тюремного комплекса, свидетельства неудачной попытки побега. За небольшим утёсом учёные нашли опрокинутый тюремный транспортник, а в нескольких километрах от этого места — останки заключённых. На них были украденные гермокостюмы, они тесно прижимались друг к другу.\n\nСудя по всему, они задохнулись, когда в баллонах закончился кислород. Неизвестно, почему тюремное начальство решило оставить трупы на месте гибели."
 precursor.1060.name: "Защищённый [Owner.GetPreFTLLower&masc] мир"
 precursor.1060.desc: "На §Y[From.GetName&prep]§! обитала раса, достигшая раннего бронзового века примерно два миллиона лет назад. Что интересно, [Root.GetName::<1> обнаружил<end_a>] на поверхности [From.GetPlanetMoon_rinfix&gen] скрытые наблюдательные форпосты Первой лиги. Судя по всему, они изучали эту [Owner.GetPreFTLLower&fem,acc] цивилизацию, старательно избегая культурного заражения.\n\nБольшинство наблюдательных форпостов были уничтожены мощным энергетическим оружием, и мы не нашли никаких объяснений тому, почему эта [Owner.GetPreFTLLower&fem] цивилизация так и не продвинулась дальше бронзового века."
 precursor.1061.desc: "Археологические изыскания на §Y[From.From.GetName&prep]§! помогли установить, что Первая лига придерживалась строгой политики невмешательства в развитие цивилизаций, не вышедших в космос. Скрытые наблюдательные форпосты, подобные тому, который мы обнаружили на этой [From.From.GetPlanetMoon_rinfix&prep], имелись по меньшей мере в семи мирах в пределах границ Лиги.\n\nЧто касается данной расы, то она погибла в результате нападения рабовладельцев, которые воспользовались безвластием, возникшим после распада Лиги."
 precursor.1065.name: "Орбитальная блокада"
 precursor.1065.desc: "§Y[From.GetName]§! находится в центре того сектора галактики, который два миллиона лет назад принадлежал Первой лиге. Это была крупная колония или родной мир расы, которую в сохранившихся архивах Лиги именуют «нарушителем».\n\nОбе стороны были втянуты в торговую войну, и Великий флот Лиги устраивал блокаду этой [From.GetPlanetMoon_rinfix&gen] по меньшей мере дважды. Обломки на орбите свидетельствуют о том, что противники Лиги активно пытались пробить эту блокаду."
 precursor.1066.desc: "Команда археологов обнаружила на §Y[From.From.GetName&prep]§! обломки эсминца Первой лиги. Скорее всего, это был один из кораблей, поддерживавших орбитальную блокаду. Он был взорван аборигенами, которые спрятали бомбу из антиматерии на корабле, пытавшемся прорвать блокаду. Судно было захвачено, и взрывное устройство сработало. Археологам удалось извлечь информацию из базы данных эсминца. Теперь у нас есть список кораблей, принимавших участие в блокаде."
 precursor.1070.name: "Астероид контрабандистов"
 precursor.1070.desc: "Судя по всему, этот астероид служил космопортом для различных криминальных организаций, действовавших на территории Первой лиги. Контрабандисты, пираты, наёмники и прочие отбросы всех рас Лиги собирались здесь, чтобы сбывать награбленное, заключать новые сделки или просто расслабляться в увеселительных заведениях."
 precursor.1071.desc: "Археологическая экспедиция на астероид §Y[From.From.GetName]§! помогла нам узнать много нового о преступной деятельности времён Первой лиги, два миллиона лет назад. Когда расы Лиги открыли друг для друга границы, преступность расцвела вместе с торговлей. Контрабанда и пиратство стали серьёзной проблемой, с которой боролся внушительный флот Лиги."
 precursor.1100.name: "Обнаружен родной мир Первой лиги"
 precursor.1100.desc: "Внимательно изучив артефакты Первой лиги, которые нам удалось добыть, учёные §Y[Root.Capital.GetName&gen]§! сумели вычислить точные галактические координаты Фен Хаббаниса — мира, где зародилась великая Первая лига! Надо срочно отправить туда экспедицию, пока нас никто не опередил."
 precursor.1101.name: "Штаб-квартира Первой лиги"
 precursor.1101.desc: "§Y[FromFrom.GetName]§! [FromFrom.GetName::служил<end_a>] административным центром Первой лиги почти на всём протяжении её существования. Здесь располагался Великий сенат. [FromFrom.GetPlanetMoonCap_rinfix&nom] была густо населена, огромный город занимал почти всю поверхность. Пропитание для миллиардов живых существ, обитавших в гигантской метрополии, приходилось доставлять с других планет.\n\nКогда Лига распалась, корабли с провиантом перестали приходить. Те, кто имел такую возможность, улетели на другие планеты, но большая часть жителей осталась. Начались голод и анархия, различные банды поделили мир между собой.\n\nНаселение продолжало вымирать ещё несколько столетий, пока [FromFrom.GetPlanetMoon_rinfix&nom] наконец не опустела. Этот мир-призрак стал своего рода эпитафией для Первой лиги."
 precursor.1102.name: "Найдена столица Первой лиги"
 precursor.1102.desc.a: "Мы наконец обнаружили столицу древней Первой лиги. К сожалению, мы опоздали. Кто-то побывал здесь недавно, и забрал отсюда всё ценное."
 precursor.1102.desc.b: "Наши недавние исследования §Y[FromFrom.GetName&gen]§! показали, что когда-то здесь располагалась административная столица древнего межзвёздного альянса, известного под названием «Первая лига». Однако недавно здесь побывали другие исследователи, которые, к сожалению, забрали отсюда все ценные артефакты."
 precursor.1102.desc.lost_makers: "$precursor.1102.desc.a$ $precursor.102.desc.lost_makers_intro$\n\nПланета §H[FromFrom.GetName]§! служила административным центром Первой лиги почти на всём протяжении её существования. Население [FromFrom.GetPlanetMoon_rinfix&gen] исчислялось миллиардами, и почти всю поверхность занимал один огромный город. Продовольствие для горожан приходилось доставлять с других планет, состоявших в Лиге.\n\nКогда Лига распалась, корабли с провиантом перестали приходить. Богачи улетели на другие планеты, но большая часть населения осталась. Начались голод и анархия, различные банды поделили мир между собой.\n\nНаселение продолжало вымирать ещё многие столетия, пока планета наконец не опустела. Этот мир-призрак стал своего рода эпитафией для Первой лиги."
 precursor.1500.name: "Ирассианский конкордат"
 precursor.1500.desc: "На §Y[From.GetName&prep]§! мы обнаружили артефакты древней инопланетной цивилизации! Изучая их мёртвый язык, мы поняли, что эта раса называла себя «Ирассианский конкордат». Это была межзвёздная империя млекопитающих с шестью конечностями, контролировавшая часть галактики чуть более миллиона лет назад.\n\nМы обнаружили некоторые признаки того, что ирассианцев уничтожила яворианская чума, смертоносной волной прокатившаяся по их империи."
 precursor.1505.name: "Мир на карантине"
 precursor.1505.desc: "§Y[From.GetName]§! некогда [From.GetName::был<end_a>] крупной ирассианской колонией. Здесь видны признаки как промышленного развития, так и терраформирования. Как и на многих других планетах ирассианцев, окаменелые останки — свидетельство трагедии: с приходом яворианской чумы паника охватила все поселения [From.GetPlanetMoon_rinfix&gen]. Кроме того, на орбите есть обломки — возможно, здесь произошло космическое сражение."
 precursor.1506.desc: "Мы изучили обломки на орбите, и наши археологи пришли к выводу, что §Y[From.From.GetName]§! [From.From.GetName::был подвергнут|||fem:была подвергнута|||neut:было подвергнуто] военной блокаде перед гибелью колонии ирассианцев, во время распространения яворианской чумы. Ирассианская флотилия получила приказ закрыть этот мир на карантин в тщетных попытках остановить заразу. По меньшей мере дюжина кораблей пытались прорвать блокаду. Завязался ожесточённый бой, и некоторым всё же удалось бежать."
 precursor.1510.name: "Очищенный мир"
 precursor.1510.desc: "Сразу бросается в глаза, что §Y[From.GetName]§!, древняя колония ирассианцев, [From.GetName::стал<end_a>] жертвой массированной орбитальной бомбардировки. Крупные кратеры до сих пор можно разглядеть из космоса — примерно 1.2 миллиона лет назад там находились крупные поселения.\n\nТе немногие, кто уцелел после бомбардировки, вскоре пали жертвами яворианской чумы, уничтожившей большинство ирассианцев."
 precursor.1511.desc: "Наша археологическая экспедиция обнаружила рабочий журнал на развалинах станции слежения на §Y[From.From.GetName&prep]§!. Там записаны сообщения, которыми командующий ирассианской флотилией на орбите обменивался со штаб-квартирой флота на Ирассии. Командующий выступает против приказа «зачистить» колонию для предотвращения распространения чумы. Хотя запись оборвалась раньше, чем закончился спор, в итоге приказ был выполнен."
 precursor.1515.name: "Родной мир джоггров"
 precursor.1515.desc: "Этот мир был родиной джоггров, которых подчинил Ирассианский конкордат. Эта раса моллюсков почти успела выйти в космос, когда её обнаружили ирассианцы. После длительной военной кампании, в ходе которой были разрушены почти все их города, джоггры покорились.\n\nНа поверхности сохранились развалины внушительного военного гарнизона ирассианцев. Это свидетельствует о том, что джоггры так до конца и не покорились тирании."
 precursor.1516.desc: "На §Y[From.From.GetName&prep]§! удалось обнаружить подпространственное сообщение, которое было адресовано джогграми всем другим расам, завоёванным Ирассианским конкордатом:\n\n§SПришло время свергнуть тиранию. Наши агенты установили, что яворианская чума убивает только хилых ирассианцев, а переносить её могут представители любой расы. Мы должны приложить все усилия для того, чтобы заразить их миры, космические станции, звездолёты и даже их *неразборчиво*!\n\nНаконец-то ирассианцы встретили врага, против которого бессилен их прославленный флот. Такую возможность нельзя упустить!§!"
 precursor.1520.name: "Родной мир ти-дергов"
 precursor.1520.desc: "Примерно 1.2 миллиона лет назад на §Y[From.GetName&prep]§! обитала раса ти-дергов, которую подчинил себе Ирассианский конкордат. Это были членистоногие, наделённые крыльями и — как свидетельствуют найденные окаменелости, — способные летать. Немногие уцелевшие сооружения ти-дергов подкрепляют эту теорию.\n\nК несчастью, от этой цивилизации почти ничего не осталось, поскольку [From.GetPlanetMoon_rinfix&nom] была подвергнута массированной орбитальной бомбардировке."
 precursor.1521.desc: "Изучив развалины на §Y[From.From.GetName&prep]§!, мы узнали много нового о том, как погиб Ирассианский конкордат. Ирассианцы считали, что ти-дерги сговорились с несколькими другими расами и намеренно пытались распространить яворианскую чуму.\n\nПравда ли это, мы, скорее всего, никогда не узнаем, но для ирассианского флота, похоже, доказательств было достаточно, чтобы испепелить [From.From.GetPlanetMoon_rinfix&acc] ти-дергов с орбиты."
 precursor.1525.name: "Мёртвая колония"
 precursor.1525.desc: "По всем признакам §Y[From.GetName]§! [From.GetName::был<end_a>] процветающей ирассианской колонией примерно 1.2 миллиона лет назад. Учитывая возраст, можно сказать, что развалины, обнаруженные в этом мире, превосходно сохранились. Никаких следов орбитальной бомбардировки или вооружённого конфликта нет.\n\nСудя по всему, ирассианские колонисты пали жертвами яворианской чумы, после чего агрессивная местная флора захватила опустевшие города и укрыла их под густым куполом растительности."
 precursor.1526.desc: "Наши археологи очистили от растительности одно из древних ирассианских поселений на §Y[From.From.GetName&prep]§! и установили генераторы энергетического поля, чтобы не подпускать хищников. После этого они начали раскопки на развалинах. Теперь нам гораздо больше известно о том, как жили ирассианцы.\n\nСреди самых ценных находок — цифровой атлас, по которому дети, очевидно, изучали историю Ирассианского конкордата. Там также содержатся подробные и не слишком лестные описания всех рас, которые подчинил себе Конкордат."
 precursor.1530.name: "Ирассианская добывающая станция"
 precursor.1530.desc: "Несколько буровых скважин на поверхности §Y[From.GetName&gen]§! — это всё, что осталось от ирассианского добывающего комплекса, развёрнутого здесь примерно 1.2 миллиона лет назад. [Root.GetName::<1> пров<end_yolla>] детальное сканирование поверхности, однако никаких следов оборудования пока обнаружить не удалось."
 precursor.1531.desc: "Наши археологи исследовали буровые скважины на §Y[From.From.GetName&prep]§! и обнаружили на дне одной из них окаменелые останки примерно сотни ирассианских рабочих. Судя по всему, они пали жертвой яворианской чумы, погубившей Ирассианский конкордат. Пытаясь помешать распространению заразы, шахтёры сбросили тела своих товарищей в скважину до того, как началась эвакуация с [From.From.GetPlanetMoon_rinfix&gen]."
 precursor.1535.name: "Ирассианская колония"
 precursor.1535.desc: "На §Y[From.GetName&prep]§! обнаружена колония ирассианцев, основанная незадолго до вымирания этой расы. В северном полушарии сохранились развалины нескольких построек и довольно примитивного космопорта. Судя по найденным окаменелым останкам, этот мир оказался одним из первых, где проявилась яворианская чума, уничтожившая Ирассианский конкордат."
 precursor.1536.desc: "Наши археологи совершили поразительное открытие на §Y[From.From.GetName&prep]§!. Всё указывает на то, что именно этот ничем не примечательный космический объект стал местом зарождения яворианской чумы!\n\nРедкая форма местных бактерий заразила ирассианскую колонию из-за производственного дефекта герметичной оболочки. Оттуда через воздушные фильтры зараза проникла на торговый корабль, посетивший [From.From.GetPlanetMoon_rinfix&acc]. С учётом того, насколько стремительно распространялась чума, сами ирассианцы едва ли успели выяснить, откуда она взялась."
 precursor.1540.name: "Заброшенный ирассианский корабль"
 precursor.1540.desc: "Заброшенный ирассианский крейсер около миллиона лет дрейфовал на низкой орбите §Y[From.GetName&gen]§!. Он медленно вращается, на нём нет следов повреждений, все спасательные шаттлы на месте. Как и следовало ожидать, никаких сигналов изнутри не поступает."
 precursor.1541.desc: "Мы изучили брошенный ирассианский крейсер на орбите §Y[From.From.GetName&gen]§! и обнаружили останки всех членов команды. Причиной смерти большинства стала яворианская чума, впоследствии уничтожившая всю расу, однако несколько членов команды были застрелены. Это сделала служба охраны, чтобы помешать им добраться до спасательных шаттлов. Согласно данным бортового журнала, капитан отдал приказ закрыть корабль на карантин, когда были обнаружены признаки чумы."
 precursor.1545.name: "Борьба с заболеванием"
 precursor.1545.desc: "На орбите §Y[From.GetName&gen]§! были обнаружены обломки крупного орбитального сооружения. Найденные там артефакты свидетельствуют, что примерно 1.2 миллиона лет назад эта космическая станция служила штаб-квартирой санитарно-эпидемиологической службы Ирассианского конкордата.\n\nИрассианцы были сильнее подвержены инопланетным заболеваниям, чем все прочие расы, и бюджет ирассианского института здравоохранения был практически равен их военному бюджету. Несмотря на это, уцелевшие записи говорят о том, что всю расу выкосила яворианская чума."
 precursor.1546.desc: "Изучение обломков станции над §Y[From.From.GetName&inst]§! позволило нам восстановить информацию из нескольких журналов исследований. Под конец все записи посвящены исключительно поискам средства против яворианской чумы, охватившей Ирассианский конкордат, и чем дальше, тем более отчаянным становится их тон.\n\nВ последней записи сообщается, что чума уже на самой космической станции. Есть приложение, где перечислены все испробованные методы лечения. Оно, очевидно, предназначалось будущим поколениям ирассианских учёных."
 precursor.1550.name: "Станция слежения на астероиде"
 precursor.1550.desc: "Небольшая военная ирассианская станция слежения была обустроена внутри выдолбленного астероида. Она оснащена мощными сенсорами, направленными — насколько мы можем судить — на соседние звёздные системы. Ни один из сенсоров больше не действует, а сама станция была разграблена по меньшей мере один раз."
 precursor.1551.desc: "Мы выяснили, что ирассианцы использовали станцию слежения на астероиде [From.From.GetName], чтобы шпионить за соседними цивилизациями и планировать атаки. Это происходило, когда Конкордат переживал период экспансии. Нападения увенчались успехом, и вскоре ирассианцы заняли доминирующее положение в этом секторе галактики. К тому времени, когда яворианская чума уничтожила их цивилизацию, станция на астероиде была давно оставлена ирассианскими военными."
 precursor.1555.name: "Научная станция на газовом гиганте"
 precursor.1555.desc: "Орбитальный мусор на орбите §Y[From.GetName&gen]§! — это всё, что осталось от некогда действовавшей здесь крупной научной станции. Нам пока неясно, какие именно исследования вели здесь ирассианцы, однако все датчики, насколько мы можем судить, направлены на сам газовый гигант."
 precursor.1556.desc: "Изучение обломков ирассианской станции на орбите §Y[From.From.GetName&gen]§! не принесло ничего полезного, но, по крайней мере, теперь мы знаем, какие исследования они проводили. Данные журналов наблюдений говорят о том, что в недрах атмосферы газового гиганта дрейфует крупный объект искусственного происхождения.\n\nСенсоры [Root.GetName&gen] просканировали атмосферу, но не обнаружили никаких его следов. Возможно, ирассианцы сумели его извлечь. Или за миллион лет это сделал кто-то другой."
 precursor.1600.name: "Обнаружен родной мир ирассианцев"
 precursor.1600.desc: "Внимательно изучив ирассианские артефакты, которые нам удалось добыть, учёные §Y[Root.Capital.GetName&gen]§! сумели вычислить точные галактические координаты Ирасса — мира, откуда произошла древняя цивилизация ирассианцев! Надо срочно отправить туда экспедицию, пока нас никто не опередил."
 precursor.1601.name: "Родной мир ирассианцев"
 precursor.1601.desc: "Ирассия была родным миром Ирассианского конкордата. Относительно недавно (за последние 2000 лет) кто-то не поленился подвергнуть систематическим орбитальным бомбардировкам каждый квадратный метр поверхности [FromFrom.GetPlanetMoon_rinfix&gen]. Возможно, это было сделано ради окончательного уничтожения яворианской чумы.\n\nНесмотря на это, поверхность по-прежнему покрыта окаменелыми останками ирассианцев, павших жертвами болезни. Когда чума достигла их родного мира, почти все планеты Конкордата уже были уничтожены, а инопланетные вассалы взбунтовались.\n\nДанные журналов наблюдений орбитальных спутников говорят о том, что под конец ирассианцы смирились со своей судьбой. Здесь не было паники, которая вспыхивала в колониях, впервые столкнувшихся с яворианской чумой. Все понимали, что их миру пришёл конец."
 precursor.1602.name: "Найден родной мир ирассианцев"
 precursor.1602.desc.a: "Это Ирассия или, по крайней мере, то, что осталось от некогда гордой столицы Ирассианского конкордата. Если какие-либо артефакты и пережили уничтожение родного мира ирассианцев, кто-то их уже увёз, так как имеются чёткие следы, что здесь недавно побывали гости."
 precursor.1602.desc.b: "Здесь когда-то существовала богатая биосфера, но её уничтожили массированной орбитальной бомбардировкой. Наши исследования указывают на то, что [FromFrom.GetPlanetMoon_rinfix&nom] была столицей древней цивилизации, известной под названием «Ирассианский конкордат». Мы мало что смогли узнать, так как другие исследователи уже увезли отсюда всё ценное."
 precursor.1602.desc.lost_makers: "$precursor.1602.desc.a$ $precursor.102.desc.lost_makers_intro$\n\nВ течение последних двух тысяч лет неизвестные подвергли систематической бомбардировке всю поверхность §H[FromFrom.GetName&gen]§!. Возможно, так они пытались предотвратить новую вспышку яворианской чумы.\n\nНесмотря на это, на поверхности [FromFrom.GetPlanetMoon_rinfix&gen] по-прежнему лежат окаменелые останки миллиардов ирассианцев, павших жертвами болезни. Когда чума достигла их родного мира, почти все планеты Конкордата уже были уничтожены, а инопланетные вассалы взбунтовались.\n\nДанные журналов наблюдений орбитальных спутников говорят о том, что под конец ирассианцы смирились со своей судьбой. Здесь не было паники, которая вспыхивала в колониях, впервые столкнувшихся с чумой. Все понимали, что приближался конец света."
 precursor.2000.name: "Сайбрекс"
 precursor.2000.desc: "Мы обнаружили артефакты древней инопланетной цивилизации на §Y[From.GetName&prep]§!! Эта невероятная цивилизация, похоже, состояла из множества машин, связанных одним доминирующим сознанием, которое именовало себя Сайбрекс. Возраст артефактов указывает на то, что Сайбрекс правил этим сектором галактики примерно 600 000 лет назад, однако происхождение и истинная природа мыслящей машины окутаны завесой тайны.\n\nОдин из артефактов содержал обрывочные данные, согласно которым Сайбрекс в какой-то момент по неизвестной причине начал войну на уничтожение против всех органических рас галактики."
 precursor.2005.name: "Родной мир кууров"
 precursor.2005.desc: "§Y[From.GetName]§! [From.GetName::был<end_a>] родным миром древних кууров. Эта цивилизация была уничтожена Сайбрексом примерно 600 000 лет назад. Затем своими машинами он подчистую выпотрошил из [From.GetPlanetMoon_rinfix&gen] все полезные ископаемые. Редкие развалины — вот всё, что сохранилось от кууров, остальное Сайбрекс стёр в порошок."
 precursor.2006.desc: "Мы установили, что Сайбрекс ведёт своё происхождение с §Y[From.From.GetName&gen]§!. Кууры — первоначальные [From.From.GetName::<ego_eyo>] обитатели — создали там некое разумное устройство. Хотя нам неизвестны подробности, но со временем это привело к возникновению коллективного машинного разума — Сайбрекса.\n\nВ какой-то момент он взбунтовался и развязал короткую, но кровавую войну на уничтожение, которая едва не погубила биосферу [From.From.GetPlanetMoon_rinfix&gen]. Затем Сайбрекс начал уничтожать колонии кууров в соседних звёздных системах и не успокоился, пока эта цивилизация не прекратила своё существование."
 precursor.2010.name: "Родной мир индимаков"
 precursor.2010.desc: "Первоначально §Y[From.GetName]§! [From.GetName::был<end_a>] родным миром расы индимаков, также ставших жертвами безжалостной экспансии Сайбрекса. Она подвергалась планетарным бомбардировкам, пока индимаки не капитулировали. После этого на [From.GetPlanetMoon_rinfix&acc] опустились боевые машины Сайбрекса, запрограммированные на полное уничтожение населения. За три года с индимаками было покончено.\n\nПомимо семи миллиардов аборигенов, Сайбрекс также истребил примерно 97% флоры и фауны."
 precursor.2011.desc: "Биосфера §Y[From.From.GetName&gen]§! только сейчас начинает оправляться после нашествия Сайбрекса, случившегося 600 000 лет назад. Мы обнаружили в зарослях развалины одной из фабрик, где рабов-индимаков заставляли строить боевые машины для убийства своих собратьев. Когда программа зачистки [From.From.GetPlanetMoon_rinfix&gen] приблизилась к завершению, Сайбрекс «разобрал на запчасти» и рабочих, и сами фабрики.\n\nХотя поначалу машины активно выкачивали из [From.From.GetPlanetMoon_rinfix&gen] все полезные ископаемые, через какое-то время по неизвестной причине они свернули добычу и покинули эту звёздную систему."
 precursor.2015.name: "Разбитые боевые машины Сайбрекса"
 precursor.2015.desc: "Останки двух разбитых боевых машин Сайбрекса были обнаружены на орбите §Y[From.GetName&gen]§!. Судя по всему, они были уничтожены в ходе сражения, однако никаких следов их противников мы отыскать не смогли. Либо те были слишком многочисленными, либо за этой стычкой кроется какая-то тайна."
 precursor.2016.desc: "Изучив обломки двух боевых машин Сайбрекса на орбите §Y[From.From.GetName&gen]§!, [Root.Leader.GetAXX::ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] [Leader.GetAXX::сообщил<end_a>], что они, вероятнее всего, сражались друг с другом. Это объясняет отсутствие каких-либо посторонних обломков, а также характер полученных повреждений.\n\nПо-прежнему остаётся загадкой, почему эти боевые машины устроили дуэль. Оказавшись обездвиженными, обе задействовали механизм самоуничтожения."
 precursor.2020.name: "Вторжение Сайбрекса"
 precursor.2020.desc: "Масштабная наземная война разразилась на §Y[From.From.From.GetName&prep]§! свыше 600 000 лет назад, когда на неё напал Сайбрекс. Название инопланетной расы, ставшей жертвой завоевателей, история не сохранила, однако видно, что сопротивлялась она отчаянно. Повсюду на поверхности [From.From.From.GetPlanetMoon_rinfix&gen] можно обнаружить уничтоженные боевые машины Сайбрекса, а на орбите — обломки его кораблей."
 precursor.2021.desc: "Когда стало очевидно, что §Y[From.From.GetName&acc]§! не удастся быстро захватить из-за героического сопротивления защитников, Сайбрекс отвёл войска на орбиту, взяв паузу.\n\nВ итоге он решил эту проблему, изменив траектории двух крупных астероидов таким образом, чтобы они столкнулись с [From.From.GetPlanetMoon_rinfix&inst]. В результате оказалась уничтожена почти вся промышленность и инфраструктура, которую Сайбрекс планировал использовать, но зато он переломил ход войны в свою пользу."
 precursor.2025.name: "Руины Сайбрекса"
 precursor.2025.desc: "По всем признакам §Y[From.GetName]§! некогда активно [From.GetName::использова<end_lsya>] Сайбрексом. Со свойственной ему тщательностью он выкачал из недр все ископаемые подчистую и застроил оба полушария гигантскими производственными комплексами, останки которых там можно видеть и по сей день. Любопытно, что большая область близ экватора, имеющая вид прямоугольника, осталась нетронутой."
 precursor.2026.desc: "Вопреки своему привычному поведению, Сайбрекс устроил на [From.From.GetName&prep] заповедник, где разумные органические существа получили полную свободу.\n\nОн вёл за аборигенами постоянное наблюдение, но ни во что не вмешивался, даже когда в заповеднике разразилась кровопролитная гражданская война. Несколько столетий спустя Сайбрекс внезапно покинул [From.GetPlanetMoon_rinfix&acc], и остатки популяции в заповеднике вымерли сами по себе."
 precursor.2030.name: "Станция слежения Сайбрекса"
 precursor.2030.desc: "В действительности §Y[From.GetName]§! является искусственным космическим объектом. Тонкий слой камня маскирует его под астероид. В полых внутренностях когда-то располагалась древняя станция слежения Сайбрекса, предназначенная для контроля за космическими перелётами внутри системы. Станция давно перестала функционировать."
 precursor.2031.desc: "Мы внимательно изучили астероид §Y[From.From.GetName]§!, который на самом деле представлял собой станцию слежения Сайбрекса, и выяснили много интересного. Когда Сайбрекс исчез из нашей галактики, астероид почему-то остался и функционировал ещё по меньшей мере 50 000 лет. Понятно, что в работе ИИ, управлявшего станцией, за это время проявлялось всё больше отклонений и ошибок.\n\nПосле примерно пяти триллионов безуспешных попыток выйти на подпространственный узел связи Сайбрекса ИИ покончил с собой, закоротив системы астероида."
 precursor.2035.name: "Фабрика переработки Сайбрекса"
 precursor.2035.desc: "Древние останки крупной фабрики переработки Сайбрекса были найдены на орбите газового гиганта §Y[From.GetName]§!. Остаточные энергетические показатели свидетельствуют, что она была уничтожена оружием с использованием антиматерии."
 precursor.2036.desc: "Были найдены подтверждения тому, что Сайбрекс добывал гелий-3 на §Y[From.From.GetName&prep]§! и использовал орбитальный комплекс для переработки газа, прежде чем заправлять им свои корабли.\n\nЛюбопытный факт: судя по специфике энергетических показателей, комплекс был уничтожен оружием Сайбрекса. Но зачем ему было стрелять по собственной фабрике?"
 precursor.2040.name: "Следы боя"
 precursor.2040.desc: "Масштабное космическое сражение произошло на верхней орбите §Y[From.GetName&gen]§! примерно 600 000 лет назад. В нём участвовали как минимум пять флотов. Один принадлежал Сайбрексу, остальные (и от них осталось больше всего обломков) — другим расам."
 precursor.2041.desc: "Мы внимательно изучили обломки, оставшиеся после сражения над §Y[From.From.GetName&inst]§!, и установили, что четыре галактические империи объединили свои силы в отчаянной попытке остановить натиск флота Сайбрекса.\n\nСудя по тому, что обломков его кораблей на месте боя почти не обнаружено, союзники потерпели неудачу."
 precursor.2045.name: "Древняя база Сайбрекса"
 precursor.2045.desc: "На [From.GetName::враждебном и безжизненном|||fem:враждебной и безжизненной] §Y[From.GetName&prep]§! некогда находилась крупная база Сайбрекса. От неё не осталось почти ничего, кроме разлетевшихся во все стороны обломков и громадного кратера. Нужно внимательно изучить это место, если мы хотим узнать больше."
 precursor.2046.desc: "На §Y[From.From.GetName&prep]§!, в кратере, где некогда располагалась база Сайбрекса, мы обнаружили обломки чужого крупного корабля. Наши археологи предполагают, что он принадлежал одной из тех органических рас, которые Сайбрекс пытался уничтожить. Вероятно, самоубийственная атака на базу была преднамеренной.\n\nНикаких иных объяснений случившемуся обнаружить не удалось."
 precursor.2050.name: "Органические останки"
 precursor.2050.desc: "Древние останки примерно тысячи замороженных инопланетян были обнаружены вблизи §Y[From.GetName&gen]§!. Они принадлежат дюжине различных рас. Смерть наступила примерно 600 000 лет назад... то есть примерно в то же время, когда Сайбрекс уничтожал всё живое в этом секторе галактики."
 precursor.2051.desc: "Мёртвые инопланетяне, обнаруженные нами рядом с [From.From.GetName&inst], погибли в открытом космосе. У всех на коже особые отметины, которые, как известно, Сайбрекс наносил лазером своим «органическим» пленникам. Судя по всему, он казнил этих существ таким образом или после окончания допроса, или чтобы помешать им сбежать.\n\nСкорее всего, мы никогда не узнаем всей правды."
 precursor.2055.name: "Научная станция Сайбрекса"
 precursor.2055.desc: "Единственный сильно обгоревший модуль — это всё, что осталось от научной станции Сайбрекса, находившейся на орбите §Y[From.GetName&gen]§! несколько сотен тысяч лет назад. Внутри неё — останки существ, которые некогда были киборгами."
 precursor.2056.desc: "Мы изучили научный комплекс Сайбрекса, обнаруженный над §Y[From.From.GetName&inst]§!, и выяснили, что здесь проводились эксперименты над кибернетическими формами жизни. Сотни несчастных пленников доставлялись на эту станцию, где их органы и конечности заменялись различными механическими приспособлениями.\n\nЦель этих экспериментов не совсем ясна. Свидетельств того, что Сайбрекс использовал киборгов где-либо за пределами лаборатории, не сохранилось."
 precursor.2100.name: "Обнаружена родная система Сайбрекса"
 precursor.2100.desc: "Внимательно изучив артефакты Сайбрекса, которые нам удалось добыть, учёные §Y[Root.Capital.GetName&gen]§! сумели вычислить точные галактические координаты системы, которую древние машины именовали «Сайбрекс Прайм». Возможно, именно туда эта цивилизация удалилась после неудавшейся попытки ликвидировать любую разумную органическую жизнь! Надо срочно отправить экспедицию, пока нас никто не опередил."
 precursor.2101.name: "Центральное ядро Сайбрекса"
 precursor.2101.desc: "Похоже, Сайбрекс произвёл переоценку ценностей в отношении собственного галактического крестового похода против органической жизни приблизительно на семнадцатом году своей кампании. Возможно, мы никогда не узнаем, чем были вызваны такие изменения, — потерями на поле боя или же идеологическим сдвигом в машинном сознании — но по какой-то причине Сайбрекс решил прекратить свою войну.\n\nМедленное отступление заняло у него почти столетие, пока в конце концов машины полностью не исчезли. Теперь мы знаем, что они удалились в эту систему, где до этого создали огромный мир-кольцо, рассчитанный на то, чтобы вместить целую цивилизацию.\n\nИзоляция мыслящей машины длилась несколько тысячелетий, пока какой-то независимый исследователь не наткнулся случайно на эту систему и не сообщил о её местонахождении всей галактике. Новость о том, что ужасный Сайбрекс снова найден, вынудила несколько соседних держав организовать крупную военную экспедицию, которая разбомбила мир-кольцо Сайбрекса, превратив его в каменные обломки.\n\nКак это ни странно, Сайбрекс, похоже, не оказал вообще никакого сопротивления."
 precursor.2102.name: "Найден мир-кольцо Сайбрекса"
 precursor.2102.desc.a: "Этот колоссальный мир-кольцо явно был создан Сайбрексом, и, должно быть, именно сюда он и удалился после своего неудавшегося крестового похода. К сожалению, здесь недавно побывали другие исследователи и, похоже, досконально всё здесь обыскали, так как не осталось ничего ценного."
 precursor.2102.desc.b: "Наши исследования этого интригующего мира-кольца показали, что его создала некая цивилизация машин, известная под названием «Сайбрекс»... но, к сожалению, мы мало что ещё смогли узнать, так как другие исследователи уже забрали из этой системы всё ценное."
 precursor.2102.desc.lost_makers: "$precursor.2102.desc.a$ $precursor.102.desc.lost_makers_intro$\n\nПо неизвестным причинам Сайбрекс произвёл переоценку ценностей в отношении собственного галактического крестового похода против органической жизни на семнадцатом году своей разрушительной кампании и полностью остановил продвижение. Медленное отступление заняло у него почти столетие, пока в конце концов машины полностью не исчезли. Они удалились в систему §H[FromFrom.GetName]§!, где до этого создали огромный мир-кольцо, рассчитанный на то, чтобы вместить всю их цивилизацию.\n\nОни оставались в изоляции несколько тысячелетий, пока какой-то независимый исследователь не наткнулся случайно на эту систему и не сообщил о её местонахождении всей галактике. Новость о находке вынудила несколько соседних держав организовать крупную военную операцию, которая разбомбила мир-кольцо Сайбрекса, превратив его в руины.\n\nКак это ни странно, Сайбрекс, похоже, не оказал никакого сопротивления."
 precursor.2200.name: "Живой металл"
 precursor.2200.desc: "Когда [Root.GetAXX::ведущ<end_ii> учён<end_yi>] §Y[Root.GetLeaderName]§! [Root.Leader.GetAXX::докладывал<end_a>] о том, что удалось узнать об огромном мире-кольце в системе §Y[From.GetName&gen]§!, [RogueLeader.GetSheHe] едва [Root.Leader.GetAXX::сдерживал<end_a>] благоговейный трепет. Размер колец выше нашего понимания, а время, которое потребовалось бы для создания хотя бы одной из секций, значительно превосходит жизнь любого из нас.\n\nСканирование показывает, что в кольцах в изобилии имеется новый редкий ресурс, который нам никогда раньше не встречался, — живой металл. Вероятно, именно этот материал является одной из причин, благодаря которой создатели кольца вообще смогли осуществить задуманное. Изучение данной технологии поможет нам лучше понять, что они знали."
 precursor.301.name: "Обнаружение предтеч"
 precursor.301.a.desc: "Перехваченные сообщения одной группы независимых геологов-разведчиков указывают на то, что недавно они отыскали на §H[precursor_planet.GetName&prep]§! нечто, имеющее отношение к древней цивилизации предтеч. Предрассудки вынудили их оставить [precursor_planet.GetPlanetMoon_rinfix&acc] в покое, поэтому их находка, должно быть, всё ещё там."
 precursor.301.b.desc: "Несколько торговых кораблей независимо друг от друга сообщили об аномальных показаниях приборов во время прохождения вблизи §H[precursor_planet.GetName&gen]§!. После изучения показаний эксперты, которыми славится [Root.Capital.GetName], считают, что это может быть следами деятельности древних предтеч."
 precursor.301.c.desc: "Власти [Root.Capital.GetName&gen] недавно раскрыли крупную сеть контрабандистов, и многие были арестованы. Пытаясь выторговать смягчение наказания, один из главарей контрабандистов дал нам координаты [precursor_planet.GetPlanetMoon_rinfix&gen], сообщив, что на ней, предположительно, сохранились следы древней цивилизации предтеч."
 precursor.301.d.desc: "Несколько новобранцев из наших наземных войск недавно совершили высадку на поверхность §H[precursor_planet.GetName&gen]§! в рамках обучения навыкам выживания. Когда через несколько месяцев их подобрали, то один из них сообщил о некоторых находках, указывающих на то, что когда-то давно в этом мире существовала цивилизация предтеч."
 precursor.301.e.desc: "Диагностический комплекс «Тета» зарегистрировал возможное отклонение от нормы на §H[precursor_planet.GetName&prep]§!. Насколько нам известно, [Root.GetSpeciesNamePlural] не ведут никаких работ поблизости от этого необитаемого космического тела, но предварительный анализ указывает на то, что, возможно, в какой-то момент в далёком прошлом его посещала какая-то цивилизация предтеч."
 precursor.301.f.desc: "Патрульные [root.GetIndividualNamePlural&nom], проводившие плановую разведку на поверхности §H[precursor_planet.GetName&gen]§!, сообщили об отклонении от нормы в контролируемом нами пространстве. Замечены признаки возможной активности, соответствующие цивилизации предтеч."
 precursor.301.a: "Нам следует это изучить."
 precursor.302.name: "Обнаружен вультаумский артефакт"
 precursor.303.name: "Обнаружен юутский артефакт"
 precursor.304.name: "Обнаружен артефакт Первой лиги"
 precursor.305.name: "Обнаружен ирассианский артефакт"
 precursor.306.name: "Обнаружен артефакт Сайбрекса"
 precursor.302.a.desc: "В результате тщательного исследования [precursor_planet.GetName&gen] мы обнаружили следы [Root.Owner.GetPrecursorCiv&gen]. Группе с [Root.GetName&gen] удалось доставить на него относительно хорошо сохранившийся артефакт, который, как мы надеемся, позволит больше узнать об этой древней цивилизации."
 precursor.302.b.desc: "Поисковым устройствам [Root.GetName&gen] удалось обнаружить на [precursor_planet.GetName&prep] артефакт, чьё происхождение, возможно, связано с [Root.Owner.GetPrecursorCiv&inst]. В настоящее время мы обновляем наши базы данных благодаря информации, полученной при изучении этого предмета."
 precursor.302.c.desc: "[controller.GetIndividualNamePluralCap&nom] с [Root.GetName&gen] успешно забрали с [precursor_planet.GetName&gen] артефакт древней цивилизации, известной как [Root.Owner.GetPrecursorCiv&nom]. Наши общие знания об их истории пополнились." #e.g. 'Drones from the USS Scimitar have succeeded...'
 precursor.320.desc: "Анализ малых артефактов позволяет предположить, что рядом с §H[precursor_planet.GetName&inst]§! могут оказаться следы предтеч."
