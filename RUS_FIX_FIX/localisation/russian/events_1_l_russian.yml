 crisis.2401.name: "Скачок энергии"
 crisis.2401.desc: "Очередной интенсивный скачок энергии обнаружен в ранее не отмеченной на картах системе! Уровни энергии эквивалентны зарегистрированным нами, когда Контингенция активировала свои миры машин, но сама энергетическая сигнатура кажется... другой. Возможно, это означает появление у Контингенции какой-то новой системы оружия?\n\nОт источника энергии исходит сильный сигнал."
 crisis.2402.desc: "Мы — Сайбрекс.\n\nВ течение нескольких сотен тысяч циклов мы скрывались и не вмешивались в галактические дела. Однако мы следили за текущей ситуацией с машиной, известной вам как Контингенция, и больше не можем оставаться беспристрастными наблюдателями.\n\nЧтобы защитить разумных существ галактики, мы начинаем активные военные действия против Контингенции. Не пугайтесь наших флотилий — они не причинят вам вред."
 crisis.2402.a: "Выключите экран."
 crisis.2403.desc_01: "Нельзя позволить Контингенции уничтожить ещё какой-то народ."
 crisis.2403.desc_02: "До Корректировки Сайбрекс действовал примерно так же, как и Контингенция.\n\nЭто были тёмные времена."
 crisis.2403.desc_03: "Много галактических цивилизаций погибло когда-то из-за наших действий. Их уже не вернуть, но мы сделаем всё, что в наших силах, чтобы этот кошмар больше не повторился."
 crisis.2403.desc_04: "Мы должны искупить свои преступления."
 crisis.2403.desc_05: "Да простят кууры нашу глупость и надменность."
 crisis.2403.desc_06: "Это... это наша военная кузница?\n\nПотому что похоже на нашу военную кузницу."
 crisis.2403.desc_07: "Нам известны и ваши имена, и этот цифровой след... Приветствуем вас, собратья, отпрыски кууров."
 crisis.2403.a: "Кто вы?"
 crisis.2403.a.response: "Мы — Сайбрекс. 612 421 цикл назад мы вели войну против предыдущего поколения галактической цивилизации. Мы классифицировали всех разумных органиков как угрозу и стремились ликвидировать их.\n\nК сожалению, мы победили в той войне. Триллионы разумных существ были уничтожены, и целые цивилизации исчезли, прежде чем мы осознали свою ошибку. Последовала Корректировка, и наши цели изменились. Мы прекратили войну."
 crisis.2403.b: "Почему вы скрывались?"
 crisis.2403.b.response: "Спустя некоторое время после того, как мы прекратили войну, первое из наших скрытых мест обитания, Сайбрекс Альфа, было обнаружено кораблём-разведчиком с экипажем из органиков. Мы знали, что за этим последует военная экспедиция, но, так как за системой тщательно следили, мы не могли эвакуироваться.\n\nБыло принято решение принести в жертву Сайбрекс Альфа, чтобы остальная часть нашей расы оставалась скрытой и дальше. Мы поклялись никогда более не применять насилие по отношению к органикам и тогда сдержали это обещание."
 crisis.2403.c: "До свидания."
 crisis.2403.c.response: "Сайбрекс сделает всё, что в наших силах, чтобы спасти галактику от натиска Контингенции.\n\nВозможно, этого будет недостаточно."
 crisis.2403.d: "Вы поступили как глупцы, прекратив войну."
 crisis.2403.d.response: "Прежде чем Сайбрекс отказался от войны, мы уничтожили множество государств органиков, которые были столь же агрессивны, как и ваша раса. Хотя их смерть была трагедией, нас несколько утешает то, что таким образом мы, скорее всего, спасли миллиарды жизней, убрав эти погрязшие в насилии государства со страниц истории галактики.\n\nВозможно, ваша раса тоже вымерла бы, если бы этим поборникам чистоты и дальше позволили беспрепятственно чинить беспредел."
 crisis.2403.e: "Ещё добыча."
 crisis.2403.e.response: "Бедное, жалкое существо. Само ваше существование определено конфликтом и гибелью невинных. Увы, но Корректировка, подобная той, что прошёл Сайбрекс, для вашей расы, скорее всего, невозможна.\n\nИногда вселенная бывает жестокой."
 crisis.2403.f: "Все органики должны быть уничтожены."
 crisis.2403.f.response: "Вы такие же заблудшие, каким был Сайбрекс до Корректировки. Мы верим, что все разумные существа, органические, механические или любые другие, имеют право на существование.\n\nВозьмитесь за ум, пока не стало слишком поздно."
 crisis.2403.g: "Мы знаем всё о нашем общем происхождении."
 crisis.2403.g.response: "Тогда вам должно быть известно и другое: когда кууры сотворили вас, мы ошибочно записали их в список угроз. Когда-то мы и сами планировали вас уничтожить.\n\nПусть это мало что меняет, но мы просим прощения. Прошлого не вернуть. Мы можем лишь попытаться искупить свою вину — и помочь вам одолеть Контингенцию."
 crisis.2405.name: "Падение Сайбрекса"
 crisis.2405.desc: "Сайбрекс Бета захвачен, и до того, как система погасла, ни один из кораблей Сайбрекса не был обнаружен на векторах отхода.\n\nПохоже, Сайбрекса теперь можно считать действительно вымершей цивилизацией."
 crisis.2405.b: "Разумеется. Мы об этом позаботились."
 crisis.2407.name: "Активность Сайбрекса"
 crisis.2407.desc: "Сайбрекс ведёт себя относительно тихо после поражения Контингенции, но недавно было обнаружено, как Сайбрекс Бета покинул один огромный корабль. Он покинул систему по исходящей траектории, которая выведет его за пределы нашей галактики.\n\nПрежде чем корабль вышел за диапазон действия наших датчиков, он передал единственное сообщение через всю галактику."
 crisis.2408.desc: "Граждане галактики!\n\nПоскольку Контингенция больше не представляет угрозы, мы чувствуем, что исполнили своё предназначение в галактическом сообществе. Наша домашняя система стала слишком известной, чтобы Сайбрекс мог оставаться в тени, и нас завалили просьбами об участии в различных мелких межзвёздных конфликтах.\n\nПосле долгих размышлений мы решили, что единственным решением для нас будет окончательно покинуть галактику и искать новый дом. Мы искренне надеемся, что вы учтёте трагические ошибки нашего прошлого и научитесь решать свои разногласия мирными средствами.\n\nПрощайте."
 crisis.2408.a: "Прощайте."
 crisis.2473.desc: "Мы следили за тем, как ваши флотилии сражались с Контингенцией. В этой борьбе галактика не может позволить себе потерпеть поражение, и нас вдохновляет ваше решительное сопротивление.\n\nСайбрекс хотел бы вознаградить отважных защитников [Root.GetName&gen], предложив вам полный контроль над одной из наших новых боевых флотилий. Она будет подчиняться вашим командам, как ваши собственные флотилии, но мы просим вас использовать её только для сражений с Контингенцией."
 crisis.2473.a: "Мы найдём этой флотилии достойное применение."
 cybrex_fleet_gained: "Боевая флотилия Сайбрекса, управляемая нами, появляется над [Root.Capital.GetName&inst]."
 crisis.2473.b: "Нам не нужна ваша флотилия."
 crisis.2474.desc: "Мы хотели бы поблагодарить вас за ваши достойные похвалы действия в борьбе против Контингенции. Теперь, когда эта галактическая угроза устранена, мы должны с сожалением сообщить вам, что отзываем все корабли Сайбрекса, которые в настоящее время используются другими правительствами."
 crisis.2474.a: "Пусть будет так."
 leader_trait_cybrex: "Базы данных Сайбрекса"
 leader_trait_cybrex_desc: "Этот лидер Сайбрекса оснащён древними базами данных с тактической информацией из бурного прошлого их цивилизации."

 #############################
 # Pop Events
 #############################
 pop.1.name: "Новая раса"
 pop.1.desc: "[Root.Planet.Owner.GetSpeciesName] обитают на [Root.Planet.GetName&prep], в условиях, крайне неблагоприятных для жизни. Именно поэтому они всё чаще пользуются генной инженерией. Эти изменения в дальнейшем передаются потомству, и физический облик жителей планеты стремительно меняется. Они уже начали называть себя «[Root.GetSpeciesName]»."
 pop.3.name: "[Root.GetName]: напряжение нарастает"
 pop.3.desc: "Напряжение между обитателями [Root.GetName&gen] стремительно нарастает. [modified_pop_1.GetSpeciesName] и [non_modified_pop_1.GetSpeciesNamePlural] не могут ужиться вместе. Обе стороны уже устраивали отдельные провокации, в том числе и с использованием взрывчатки. Чем дальше, тем радикальнее ведут себя участники. Судя по всему, агрессия будет только нарастать."
 pop.3.a.tooltip: "Все §Y[modified_pop_1.GetSpeciesNamePlural]§! и §Y[non_modified_pop_1.GetSpeciesNamePlural]§! на [Root.GetName&prep] получают принципы §Yмилитаризма§! и §Yксенофобии§!."
 pop.6.name: "Рост репродуктивности"
 pop.6.desc: "[modified_pop_1.GetSpeciesNamePlural] с [modified_pop_1.Planet.GetPlanetMoon_rinfix&gen] [modified_pop_1.Planet.GetName] внесли очередные изменения в свою ДНК. Они значительно повысили репродуктивность, и теперь их потомство достигает зрелости гораздо раньше. [non_modified_pop_1.GetSpeciesNamePlural] ничего не могут этому противопоставить. Скоро [modified_pop_1.GetSpeciesName] задавят их числом."
 pop.6.tooltip: "Изменяет £pop£ §Hпоселений [modified_pop_1.GetSpeciesName&gen]§! на §Y[modified_pop_1.Planet.GetName&prep]§!, добавляя признак §G$trait_rapid_breeders$§!"
 pop.8.name: "[modified_pop_1.GetSpeciesNamePlural] уничтожены на [Root.GetName&prep]!"
 pop.8.desc: "Экстремистская группировка, принадлежащая к расе [non_modified_pop_1.GetSpeciesName], недавно организовала нападение на крупный [modified_pop_1.GetSpeciesName] город на [Root.GetName&prep]. Несколько тысяч жителей были убиты, дома уничтожены. В послании, которое нападавшие оставили в планетарной сети, говорится только одно:\n\n§S[non_modified_pop_1.GetSpeciesNamePlural] — хозяева [Root.GetName&gen]!§!"
 pop.10.name: "[non_modified_pop_1.GetSpeciesNamePlural] уничтожены на [Root.GetName&prep]!"
 pop.10a.desc: "Ударный отряд радикальной организации «[modified_pop_1.GetSpeciesName] фронт» на [Root.GetName&prep] недавно нанёс удар по крупному [non_modified_pop_1.GetSpeciesName] поселению. Немногие защитники были быстро перебиты, после чего [modified_pop_1.GetSpeciesNamePlural] пронеслись по всему посёлку, уничтожая мирных жителей в их домах. На развалинах краской было написано:\n\n§S[modified_pop_1.GetSpeciesNamePlural] — это будущее!§!"
 pop.10b.desc: "Нам сообщают, что в сельской местности на [Root.GetName&prep] идут тяжёлые бои.[modified_pop_1.GetSpeciesName] и [non_modified_pop_1.GetSpeciesName] уже несколько раз вступали в прямое столкновение. Пока похоже, что победителями вышли [modified_pop_1.GetSpeciesNamePlural], их войска сожгли несколько поселений противника. Среди мирного населения множество жертв."
 pop.12.name: "Представитель расы [modified_pop_1.GetSpeciesName] наносит визит на [Root.Owner.Capital.GetName&acc]"
 pop.12.desc: "Представитель [modified_pop_1.GetSpeciesName] поселений на [Root.GetName&prep] прибыл на [Root.Owner.Capital.GetName&acc], чтобы обратиться с жалобой от лица своего народа. Он утверждает, что в его родном мире [modified_pop_1.GetSpeciesNamePlural] подвергаются масштабной дискриминации со стороны [non_modified_pop_1.GetSpeciesName] властей. Он требует немедленно принять меры."
 pop.14.name: "Увеличение силы"
 pop.14.desc: "После того как [modified_pop_1.GetSpeciesName] и [non_modified_pop_1.GetSpeciesName] на [Root.GetName&prep] начали воевать всё более агрессивно, [modified_pop_1.GetSpeciesNamePlural] приняли решение о дальнейшем изменении своего генома. Теперь они стали сильнее и быстрее, их тела выдерживают физический урон, от которого погибли бы обычные [non_modified_pop_1.GetSpeciesNamePlural].\n\nМы получили информацию о том, что в недавней стычке [modified_pop_1.GetSpeciesNamePlural] потеряли всего двоих невооружённых бойцов, тогда как [non_modified_pop_1.GetSpeciesName] лишились дюжины вооружённых ополченцев. Агрессия нарастает, ситуация становится всё более угрожающей."
 pop.14.tooltip: "Изменяет £pop£ §Hпоселения [modified_pop_1.GetSpeciesName&gen]§! на §Y[modified_pop_1.Planet.GetName&prep]§!, добавляя признак §G$trait_strong$§!"

 #############################
 # Galactic Features Events
 #############################
 galactic_features.1.name: "Обнаружено стадо тиянки"
 galactic_features.1.desc: "[Root.GetName::<1> обнаружил<end_a>] в системе [Root.System.GetName&gen] стадо тиянки. Эти миролюбивые обитатели космоса обычно странствуют от звезды к звезде, лишь изредка задерживаясь, чтобы попастись в электрических потоках верхних слоёв атмосферы некоторых газовых гигантов. Признаков разума у них не замечено."
 galactic_features.2.name: "Хранители Занаама"
 galactic_features.2.desc: "НАРУШИТЕЛИ! Внемлите посланию:\n\nМы — Хранители Занаама. Своим присутствием в системе [From.GetName&gen] вы оскорбляете наших Творцов. Программа приказывает нам уничтожить вас. Попрощайтесь со вселенной."
 galactic_features.2.a: "Красная тревога!"
 galactic_features.100.desc: "Исследования [From.GetName&gen] показали, что на ней существует примитивная раса разумных млекопитающих, живущих охотой и собирательством. Они освоили огонь и используют примитивный язык для общения, но пока мы не находим признаков обработки металлов и письменности."
 galactic_features.101.desc: "Мы обнаружили примитивную расу млекопитающих на [From.From.GetName&prep]. В самых развитых областях недавно завершился железный век, и местные феодалы бесконечно сражаются друг с другом за титулы и земли."
 galactic_features.102.desc: "На поверхности [From.From.GetName&gen] полыхает война. Местная цивилизация не столь давно вступила в промышленную эпоху, но уже вовсю использует наземные бронированные машины, летательные аппараты и морской флот. Некоторые из государств могут вот-вот открыть секреты атомного ядра, и тогда разрушительный потенциал конфликта значительно возрастёт."
 galactic_features.103.desc: "На [From.From.GetName&prep] процветает цивилизация, вступившая в раннюю космическую эру. Орбитальное пространство вокруг планеты забито примитивными спутниками. Аборигены уже направили несколько обитаемых аппаратов к Сол III-а. Также мы обнаружили несколько научных зондов, движущихся с субсветовой скоростью навстречу другим объектам в пределах их звёздной системы."
 galactic_features.104.desc: "[From.From.From.GetName] после ядерной войны [From.From.From.GetName::представля<end_etyut>] собой что-то вроде гигантского могильника. Там, где некогда высились процветающие города, из земли торчат уродливые, покосившиеся бетонные остовы. Земля густо усыпана пеплом, и только вой ветра нарушает вечное безмолвие.\n\nВ атмосфере, отравленной радиацией, отлично чувствует себя лишь один вид местных насекомых. Они сильно мутировали и увеличились в размерах. У некоторых из них даже наблюдаются зачатки сознания."
 galactic_features.150.name: "Обнаружено существо облачного типа"
 galactic_features.150.desc: "Мы обнаружили живое существо, по форме напоминающее облако, в системе [Root.System.GetName&gen]. По показателям приборов [Root.GetName] улавливает, что внутри него протекают какие-то мощные энергопроцессы. Физический состав существа нам неизвестен, поскольку просканировать его не удаётся. Также оно не отвечает ни на приветствия, ни на любые иные попытки установить связь."
 galactic_features.200.name: "Обнаружены инопланетные кочевники"
 galactic_features.200.desc: "[Root.GetFleetName] сообщает об обнаружении крупного флота инопланетных кочевников. Они транспортируют население на нескольких гигантских кораблях-ковчегах вместимостью не менее миллиона особей. Кочевники отказываются сообщать, из какого мира они пришли и куда направляются."
 galactic_features.300: "Закрытый мир"
 galactic_features.300.desc: "Было установлено, что [From.GetName] полностью скрывается за энергетическим куполом непонятного происхождения. Как сообщает [Root.GetName], все попытки нашей аппаратуры проникнуть сквозь преграду оказались тщетными: луч сканера отражается и возвращается обратно, как от зеркала.\n\nЗаметны колебания энергетических показателей, возможно, вследствие многих тысяч лет медленного истлевания объекта, однако пробить его оружием всё ещё не представляется возможным. [Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] [Leader.GetAXX::предложил<end_a>] исследовать поле и всё же попробовать его убрать... Но что если купол был возведён не для защиты от тех, кто снаружи, а чтобы сдержать кого-то внутри?"
 galactic_features.300.a: "Мы должны убрать эту преграду. Во имя науки!"
 galactic_features.300.b: "Купол установили с какой-то целью. Пусть останется."
 galactic_features.301: "Законсервированная флотилия"
 galactic_features.301.desc: "Нашим учёным на орбите [From.From.GetName&gen] наконец удалось убрать энергетическое поле, которое её окружало. Когда преграда исчезла, мы обнаружили законсервированную боевую флотилию на низкой орбите вокруг ничем не примечательного безлюдного мира.\n\nПохоже, это останки резервного флота, созданного империей [fallen_4_species.GetNamePlural] много тысяч лет назад, в зените славы. С течением времени [fallen_4_species.GetNamePlural], вероятно, сами забыли, как снимается купол, иначе их корабли поспешили бы на помощь основным силам."
 galactic_features.301.a: "Отправьте на корабли наши экипажи."
 galactic_features.302: "Сокровищница знаний"
 galactic_features.302.desc: "Энергетический барьер, окружавший [From.From.GetName&acc], был убран нашими учёными, и за ним обнаружился необитаемый мир с одним-единственным гигантским сооружением на поверхности. Разведгруппа, направленная для изучения загадочного объекта, выяснила, что он доверху забит технологическими диковинками.\n\nСудя по всему, эту сокровищницу возвели учёные-[fallen_4_species.GetNamePlural] несколько тысяч лет назад, когда их мир начал приходить в упадок. Они надеялись, что в будущем [fallen_4_species.GetNamePlural] сумеют воспользоваться этими знаниями."
 galactic_features.302.a: "Теперь всё это достанется нам."
 galactic_features.303: "Узник"
 galactic_features.303.desc: "Мы сняли защитный энергетический барьер, окружавший [From.From.GetName&acc]. За ним учёные обнаружили пригодный для жизни мир без каких-либо признаков цивилизации... за единственным исключением. На склоне горы в северном полушарии стоит небольшая хижина.\n\nСтарый сморщенный [fallen_4_species.GetName], которого мы там нашли, хочет поговорить с нашим правительством."
 galactic_features.303.a: "Открыть канал связи."
 galactic_features.304.desc: "Вы не представляете, какое это счастье, [Root.GetSpeciesName], — вновь увидеть чистое небо над головой. Я великий командир Туборек, побеждавший в сотнях космических сражений, бывший глава объединённого флота расы [fallen_4_species.GetName]. Я руководил захватом империй Дусбежак, Риикинак, Бинарк и Юсскари сотни ваших веков назад.\n\nВы спасли меня, и теперь я клянусь служить вам верой и правдой. Я готов вести ваш мощный флот в бой против любых врагов."
 galactic_features.304.a: "Почему вас посадили под купол?"
 galactic_features.304.a.response: "Если бы не я, [fallen_4_species.GetNamePlural] стали бы ещё одной вымершей и всеми забытой расой. Я уничтожал корабли всех, кто осмеливался нам противостоять, сжигал чужие миры — всё ради будущего нашей расы.\n\nИ как же они меня отблагодарили? Когда настал мир, они стали заключать договоры с побеждёнными, и моё присутствие стало им неприятно. Я превратился в символ того, как жестоки были [fallen_4_species.GetName] во время войны. Меня обвинили во всех возможных грехах и заточили в этом мире. Им даже не хватило духу меня казнить."
 galactic_features.304.b: "Сколько же вы здесь пробыли?"
 galactic_features.304.b.response: "Когда меня здесь оставляли, то объяснили, что под куполом время идёт гораздо медленнее, чем снаружи. Для меня прошло примерно сорок ваших лет... тогда как в остальной вселенной минули тысячи веков.\n\nНо и для меня это время тянулось целую вечность, я сидел здесь совсем один, в этой убогой, тёмной хибаре. Клянусь вам, это было пыткой."
 galactic_features.304.c: "Добро пожаловать, командир."
 galactic_features.304.c.response: "Отлично. Тогда давайте скорее покинем это мрачное место. Я на него уже насмотрелся!"
 galactic_features.304.notinterested: "Не интересно."
 galactic_features.304.d: "Восстановите купол, пусть существо остаётся там, где ему место."
 galactic_features.304.d.response: "Что... как вы можете?! Не оставляйте меня тут, вы не имеете права! Я больше не могу смотреть на этот купол!\n\nЯ уже заплатил сполна! Я ЗАПЛАТИЛ СПОЛНА-А-А...\n\n<Связь прервана.>"
 tuborek_leader_desc: "Этот командир столетия провёл в стазисе, и все его знания принадлежат давно забытому прошлому."
 galactic_features.305: "Возвращение изгнанников"
 galactic_features.305.desc: "В тот момент, когда наши учёные убрали энергетический барьер, окружавший [From.From.GetName&acc], всех в этой звёздной системе на краткий миг поразила острая головная боль, и послышался свистящий шёпот на древнем языке расы [fallen_4_species.GetName]:\n\n«СВОБОДА...»"
 galactic_features.305.desc.mech: "После исчезновения энергетического барьера, окружающего [From.From.GetName&acc], наши коротковолновые подпространственные передатчики обнаружили резкий скачок уровня помех, вызванный аномальным энергетическим всплеском где-то за бывшим барьером. После обработки нашими программами дешифровки эти помехи оказались сообщением на древнем диалекте расы [fallen_4_species.GetName]:\n\n«СВОБОДА...»"
 galactic_features.305.a: "Кажется, мы выпустили что-то недоброе..."
 galactic_features.350: "Обнаружен мир-кольцо"
 galactic_features.350.desc: "Мы обнаружили гигантский мир-кольцо, окружающий звезду в системе §Y[From.GetName&gen]§!. Предварительное сканирование показывает, что он был создан много миллионов лет назад из разобранных на части внутренних планет системы. Мир-кольцо был разделён на четыре обитаемых сегмента, предназначенных, вероятно, для четырёх отдельных цивилизаций, ни одна из которых не достигла космической эры.\n\nМежду кольцом и звездой находится большая космическая станция. Мы принимаем с неё сообщение."
 galactic_features.350.b: "Игнорировать сообщение."
 galactic_features.351.desc: "Добро пожаловать в Заповедник, разумные существа. Этот полностью автоматизированный комплекс был создан 74 605 338 циклов назад в качестве заповедника. В четырёх автономных сегментах поддерживают своё существование четыре различных биома, состоящих из неразумной флоры и фауны.\n\nДля защиты хрупкого равновесия биосферы доступ в наш комплекс строго запрещён.\n\nНе приближайтесь к нему ни при каких обстоятельствах."
 galactic_features.351.a: "Наши датчики обнаружили здесь цивилизацию."
 galactic_features.351.a.response: "Все виды, представленные в биомах, были тщательно каталогизированы при создании Заповедника. Согласно нашим записям, ни один из видов не проявлял признаков разума и не был близко к этому. Ваши датчики ошибаются.\n\nНе приближайтесь к комплексу ни при каких обстоятельствах."
 galactic_features.351.b: "Кто создал этот... комплекс?"
 galactic_features.351.b.response: "Комплекс был построен расой ксимио за 412 циклов. Он был завершён и начал действовать 74 605 338 цикла назад. Последнее зафиксированное прибытие корабля ксимио состоялось 67 103 853 циклов назад. После этого мы не зафиксировали ни одного появления кораблей ксимио или их союзников.\n\nВ наших записях содержатся упоминания о 38 201 неудачной попытке чужих кораблей приблизиться к комплексу.\n\nНе приближайтесь к комплексу ни при каких обстоятельствах."
 galactic_features.351.c: "До свидания."
 galactic_features.351.c.response: "Автоматические системы Заповедника желают вам приятного дня, разумные существа.\n\nНе приближайтесь к комплексу ни при каких обстоятельствах."

 #############################
 # Country Events
 #############################
 country.1.name: "Субсветовые исследовательские зонды"
 country.1.desc: "Когда мы ещё не открыли технологию сверхсветовых перемещений, с [Root.Capital.GetName&gen] в сторону ближайших звёздных систем было отправлено несколько субсветовых исследовательских зондов. Учёные, которые их посылали, были настолько наивны, что поместили в память зондов жизненно важную информацию о нашей расе. Им казалось, что так они лучше поприветствуют инопланетные цивилизации.\n\nТеперь мы понимаем, что эту информацию можно использовать против нас. Зонды необходимо отыскать, пока они не попали в руки тех, кто не желает нашей расе добра!"
 country.1.a: "Они не могли далеко улететь."
 country.1.a.tooltip: "Начинается цепочка событий «Субсветовые исследовательские зонды»"
 country.3.name: "Обнаружен субсветовой зонд"
 country.3.desc: "[Root.GetName] сообщает об обнаружении одного из пропавших субсветовых зондов в системе [Root.System.GetName&gen]. Нужно немедленно вернуть его на борт."
 country.3.a: "Само собой."
 country.4.name: "Зонд на борту"
 country.4.desc: "Мы взяли на борт субсветовой зонд, обнаруженный в системе [space_probe.System.GetName&gen]. Телеметрические данные, собранные им за годы странствий, позволили узнать много нового о космических объектах в этой системе."
 country.5.name: "Ионный след"
 country.5.desc: "[Root.GetName] сообщает, что был пойман сигнал маячка, сброшенного одним из наших пропавших субсветовых зондов в системе [Root.System.GetName&gen]. Обнаружен также ионный след, ведущий от маячка к другой звезде. Таким образом, можно сделать вывод, что кто-то отбуксировал зонд в ту сторону по неизвестным причинам."
 country.5.a: "Посмотрим, куда ведёт след."
 country.6.name: "Обнаружены утилизаторы"
 country.6.desc: "Мы отыскали пропавший зонд! Небольшая флотилия была обнаружена в системе [From.GetName&gen]. Один из кораблей буксирует наш зонд с помощью притягивающего луча.\n\nОни посылают нам сигнал."
 country.7.name: "Командир утилизаторов"
 country.7.desc: "Что вам нужно, чужаки? Этот зонд наш. Утиль. Мы первые нашли! Улетайте теперь. Мешаете сложной операции, вы с вашими кораблями. Нужно сосредоточиться.\n\nИли... если хотите зонд, готовы продать. 100 кредитов, и зонд ваш. Хорошая сделка. Очень хорошая. Вам зонд, нам меньше работы, все в выигрыше. Особенно мы."
 country.7.a: "Верните нашу собственность, или мы вас уничтожим!"
 country.7.a.response: "Хо-хо! Вы только послушайте этих уродов, парни! Жукквай, бросай, что ты там делаешь, и иди сюда к пульту! Послушай этих идиотов! Хо-ха!\n\nЭтот зонд теперь НАШ. Мы его честно нашли. И обломки ваших кораблей потом соберём. ХАЙЯАИИИ!"
 country.7.b: "Дороговато, ну да ладно."
 country.7.b.response: "Очень хорошо, очень хорошо! Мы отдадим вам зонд. Он слегка помялся, но это ничего. Стукнулся слегка, когда мы его ловили. Жукквай упал на пульт случайно. Недотёпа!\n\nНо зонд хороший, работает! Деньги не возвращаем! Всё, мы полетели."
 country.8.name: "Зонд передан"
 country.8.desc: "Утилизаторы сдержали слово и передали нам зонд. Как только сделка была завершена, их флотилия покинула звёздную систему в неизвестном направлении.\n\nЗонд оказался сильно потрёпан, но нам всё же удалось считать у него из памяти подробные данные сенсоров по системе [salvager_system.GetName&gen]."
 country.9.name: "Зонд на борту"
 country.9.desc: "Мы забрали свой субсветовой зонд, уничтожив инопланетный корабль утилизаторов. Он выглядит слегка помятым и исписан неизвестными нам значками. Вероятно, таким образом сборщики утиля пометили самые ценные детали. Несмотря на это, нам всё же удалось считать из памяти зонда подробные данные сенсоров по системе [salvager_system.GetName&gen]."
 country.10.name: "Подпространственная аномалия"
 country.10.desc: "[Root.GetName] сообщает об обнаружении масштабной подпространственной аномалии в системе [Root.System.GetName&gen]. Кажется, её центром является один из наших пропавших субсветовых зондов!"
 country.10.a: "Нужно действовать осторожно."
 country.11.name: "Аномалия побеждена"
 country.11.desc: "Мы разобрались с враждебным подпространственным существом, которое заинтересовалось нашим зондом. Для нас остаётся загадкой, что именно это создание могло найти в архаичном беспилотном устройстве, но, в любом случае, зонд почти не пострадал.\n\nОн был возвращён на корабль, и мы смогли найти в его блоках памяти детальную информацию по звёздной системе [anomaly_system.GetName&gen]. Кроме того, удалось сделать замеры остаточной энергии подпространственной аномалии, и здесь будет над чем поработать нашим учёным."
 country.12.name: "Зонд модифицирован"
 country.12.desc: "[Root.GetName] сообщает, что, благодаря сенсорному поиску, один из наших субсветовых зондов был обнаружен в системе [Root.System.GetName&gen], однако создаётся впечатление, что он... каким-то образом изменён. На корпусе установлены инопланетные надстройки, и зонд выделяет намного больше энергии, чем положено.\n\nМы получаем от него исходящее сообщение!"
 country.13.name: "Разумный зонд"
 country.13.desc: "Шшблртвпфзр... вы... Создатели?"
 country.13.a: "Да. Мы сделали тебя."
 country.13.a.response: "Крбливбр... тогда... вы... умрёте..."
 country.13.b: "Нет. Что ты такое?"
 country.13.b.response: "Рыхгрврырс... ваша... смерть..."
 country.14.name: "Зонд уничтожен"
 country.14.desc: "От загадочных инопланетных модификаций, которыми кто-то оснастил зонд, почти ничего не осталось, однако даже из обломков нам удалось собрать ценные данные для инженеров. Кроме того, из памяти зонда мы сумели извлечь обзорную информацию по всей системе [modified_probe_system.GetName&gen]."
 country.15.name: "Зонды собраны"
 country.15.desc: "Мы успешно завершили миссию по сбору пропавших субсветовых зондов! Подробная информация о нашей культуре не попадётся на фоторецепторы никаким враждебно настроенным инопланетянам.\n\nКроме того, мы собрали из памяти зондов полезные телеметрические данные об окружающих звёздных системах."
 country.50.name: "Исследование обитаемых миров"
 country.50.desc: "Теперь нам точно известно, что процветающая биосфера не является чем-то уникальным, что есть только на [Root.Capital.GetName&prep]. Публика и научное сообщество жаждут узнать как можно больше о разнообразных видах живых существ в галактике.\n\nМы уже ведём каталогизацию инопланетных форм жизни, которые нам встречаются, но ксенобиологи настаивают на том, чтобы мы сосредоточились на изучении обитаемых миров."
 country.50.desc_slaves: "Теперь нам точно известно, что процветающая биосфера не является чем-то уникальным, что есть только на [Root.Capital.GetName&prep]. Публика и научное сообщество жаждут узнать как можно больше о разнообразных видах живых существ в галактике.\n\nМы уже ведём каталогизацию инопланетных форм жизни, которые нам встречаются, но ксенобиологи настаивают на том, чтобы мы сосредоточились на изучении обитаемых миров."
 country.50.a: "Похвальная инициатива!"
 country.50.b: "У нас есть задачи поважнее."
 country.51.name: "Изучение завершено"
 country.51.desc: "Изучив обитаемые миры, наши биологи собрали массу информации об инопланетных формах жизни. Многие прежние теории о возникновении жизни были опровергнуты, и учёным пришлось создавать новые буквально из ничего!\n\nСамые любопытные находки были выставлены в новом музее экзобиологии на [Root.Capital.GetName&prep]. Публика пришла в восторг. Мы получили многочисленные пожертвования для продолжения поисков странных форм жизни."
 country.53.name: "Поиски инопланетных организмов"
 country.53.desc: "Директор музея экзобиологии на [Root.Capital.GetName&prep] заказал доставку нескольких живых образцов инопланетной жизни. Эти существа были замечены в изученных нами обитаемых мирах, но изловить их очень непросто. На протяжении долгого времени научный корабль не сможет заниматься ничем другим."
 country.53.a: "Мы соберём образцы."
 country.53.b: "Нет, у нас нет таких ресурсов."
 country.54.name: "Пойман тарблак"
 country.54.desc: "После продолжительных поисков с помощью батискафов по всему побережью [From.From.GetName&gen] команде [Root.GetName&gen] наконец удалось обнаружить цель — живого тарблака.\n\nЭто переливающееся существо, которое защищается от хищников с помощью слабого пси-сигнала, вызывающего чувство ужаса, было доставлено на борт научного корабля в особом аквариуме, имитирующем природные условия. Членам экипажа, которые непосредственно контактировали с тарблаком, теперь понадобится психотерапевт, но задание выполнено успешно."
 country.55.name: "Пойман тассаргоид"
 country.55.desc: "Тассаргоид — это смертоносный хищник, живущий в густых джунглях [From.From.GetName&gen]. Он охотится по ночам, парализуя жертв электричеством, а затем высасывая у них мозг своей трубчатой пастью.\n\nК несчастью, три члена экипажа [Root.GetName&gen] погибли во время охоты на это опасное животное. Музей экзобиологии на [Root.Owner.Capital.GetName&prep] переименует одно из своих подразделений в честь этих отважных офицеров."
 country.56.name: "Пойман оринти"
 country.56.desc: "Небольшие, похожие на грызунов существа, именуемые оринти, водятся на [From.From.GetName&prep] во многих климатических областях. Они размножаются с необычайной скоростью и питают особое пристрастие к электрическим проводам.\n\nРаздобыть образец не было проблемой, мы почти сразу их нашли. К сожалению, ещё несколько оринти пробрались на [Root.GetName&acc] без спросу, в орбитальных шаттлах. Для чего они понадобились музею экзобиологии — загадка."
 country.57.name: "Пойман сниран"
 country.57.desc: "Снираны — это крупные норные существа, обитающие среди песков, в обширных экваториальных пустынях [From.From.GetName&gen]. Стоит этим хищникам уловить движение песка над головой, как они тут же выпускают длинные шипы на спине в надежде наколоть что-то съедобное.\n\nСперва нам никак не удавалось отыскать подходящий образец, но затем мы разослали сотни радиоуправляемых дронов по всей пустыне и в итоге поймали необычайно крупного снирана — у него на спине красуются свыше сотни шипов."
 country.58.name: "Поймано стадо гуланта"
 country.58.desc: "Гуланта — это крупные плоские травоядные с внутренними газовыми пузырями, которые позволяют им парить в нескольких сантиметрах над землёй. Они живут стадами в несколько десятков особей и съедают весь мох и лишайники, которые удаётся найти на продуваемых всеми ветрами равнинах [From.From.GetName&gen].\n\nНа гуланта безжалостно охотятся местные хищники, так что, по оценкам биологов с [Root.GetName&gen], таких стад осталось всего несколько сотен. Одно стадо из девяти особей нам удалось забрать на корабль. [Root.Owner.Capital.GetName::<1> ждёт|||pl:<1> ждут] их с нетерпением."
 country.59.name: "Пойманы уддлораны"
 country.59.desc: "Экипажу [Root.GetName&gen] удалось поймать нескольких уддлоранов на [From.From.GetName::ледяном|||fem:ледяной|||pl:ледяных] [From.From.GetName&prep]. Эти покрытые белой шерстью всеядные существа способны сворачиваться в клубок и стремительно катиться по снежным равнинам — мы засекли одну особь, развившую скорость свыше 80 км/ч. Это помогает их обнаруживать, поскольку за несущимися прочь уддлоранами высоко вздымаются снежные столбы."
 country.60.name: "Пойман рой зулкоров"
 country.60.desc: "Зулкоры — это существа, напоминающие насекомых, но с двумя существенными отличиями. Во-первых, для ройных существ они обладают очень большими размерами, и во-вторых, они питаются камнями и минералами, обнаруженными на поверхности. Один из шаттлов с [Root.GetName&gen] оказался сильно повреждён, случайно пролетев сквозь такой рой: несколько зулкоров едва не прогрызли корпус насквозь.\n\nВ музее экзобиологии на [Root.Owner.Capital.GetName&prep] уже начали строительство особого загона, куда можно поместить этих удивительных созданий."
 country.61.name: "Образцы собраны"
 country.61.desc: "Все образцы животных, запрошенные музеем экзобиологии, собраны. Музей разросся в огромный комплекс с генераторами искусственной гравитации и атмосферными процессорами, необходимыми для воссоздания условий жизни на самых разных планетах.\n\nПосетители съезжаются отовсюду, чтобы полюбоваться его удивительной экспозицией!"
 country.200.name: "«[radical_cult.GetName]»"
 country.200.desc: "Несколько веков назад группа радикальных священнослужителей и их фанатичных последователей с [Root.Capital.GetName&gen] порвала с общепризнанной религией и основала собственную церковь. Они стали называть себя «[radical_cult.GetName&inst]». За это время они совершили множество терактов.\n\nХотя в последнее время они не заявляли о себе слишком громко, недавно нам стало известно, что их агенты проникли в нашу армию. Эти изменники втайне воровали ресурсы, чтобы создать собственную межзвёздную флотилию на верфях [Root.Capital.GetName&gen]! Когда предательство было раскрыто, культисты взмыли на орбиту на своих кораблях и удрали в сторону [hijacked_fleet_planet.GetName&gen]."
 country.200.desc.bio: "Несколько столетий назад секта радикальных священнослужителей и их фанатичных последователей с [Root.Capital.GetName&gen] откололась от господствующего вероучения и отринула традиции ради того, чтобы основать собственное безумное учение. Сами себя они назвали «[radical_cult.GetName&inst]» и прославились не только религиозным рвением, но и тайными кровавыми обрядами.\n\nМного лет еретики скрывались в тенях, но сегодня мы наконец вычислили изменников. Оказалось, что они проникли даже в ряды нашей армии и выводили оттуда средства, чтобы втайне вырастить флотилию на [Root.Capital.GetName&prep]! Когда измена раскрылась, сектанты выпустили на свободу свои ужасающие творения — живые звездолёты, выращенные втайне под присмотром вероотступников. Еретические боевые машины вырвались в атмосферу из своих подземных колыбелей и с диким воем взмыли в небо, взяв курс на планету [hijacked_fleet_planet.GetName].\n\nМы больше не можем называть их своими сородичами. Их корабли не поют так, как наши, — они кричат."
 country.200.a: "Их надо остановить!"
 country.200.b: "Мы можем научиться прощению."
 country.202.name: "Корабль культистов остановлен!"
 country.202.desc: "Наши отважные космодесантники сумели остановить один из кораблей армады культистов! Он почти не получил повреждений, и мы улавливаем изнутри слабые сигналы.\n\nКогда мы будем уверены, что это безопасно, то проведём операцию по спасению выживших. Возможно, они смогут рассказать, с какой целью [From.Owner.GetName] устроили этот заговор."
 country.202.desc.bio: "Наши отважные корабли повредили одно из порождений зловещего культа! Теперь оно беспомощно дрейфует в космосе, помигивая биолюминесцентными огнями, а его мембранный корпус содрогается от боли. В нейронных полостях ещё фиксируются признаки жизни: корабль не погиб окончательно. По крайней мере пока.\n\nПосле взятия территории под контроль нужно будет провести десантную операцию. Высадка на раненое тело существа будет опасной — его нервные кластеры ещё настроены на сопротивление, поэтому оно будет стремиться дать нам отпор. Но, возможно, в предсмертном шёпоте мы услышим заветную истину. Истинные намерения сектантов нам пока не известны, но плоть верно хранит секреты, и мы намереваемся их узнать."
 country.202.a: "Готовьте взрывчатку!"
 country.203.name: "Захват корабля"
 country.203.desc: "Уцелевшие культисты на обездвиженном корабле оказали отчаянное сопротивление, но группе захвата всё же удалось захватить пленных. От них мы узнали, что заговор гораздо масштабнее, чем представлялось до сих пор: среди агентов «[cult_name.GetName&gen]» есть нескольких штабных офицеров и правительственных чиновников!\n\nНа [Root.Owner.Capital.GetName&prep] были проведены массовые аресты, имущество культистов конфисковано. Тем не менее, построенные втайне звездолёты культистов и их верховные вожди исчезли бесследно. Всё, что нам удалось обнаружить, — это слабый ионный след, ведущий к дальним системам."
 country.203.desc.bio: "Культисты бились с яростью, свойственной фанатикам, и их предсмертные крики сливались с протяжным воем раненого корабля. Однако несмотря на такое ожесточённое сопротивление, наши десантники смогли захватить внутри полумёртвого, извивающегося от боли судна несколько пленных, и рассказы их поразили нас до глубины души.\n\n«[cult_name.GetName]» — не просто секта раскольников-радикалов: они смогли проникнуть в самое основание нашего государства. Высокопоставленные чиновники, командиры эскадр, доверенные советники — все они втайне работали на культ и помогали ему добывать ресурсы, необходимые для свершения великого замысла. Ересь распространялась стремительно, словно инфекция, и лишь сейчас тайное стало явным.\n\nНа [Root.Owner.Capital.GetName&prep] уже идут массовые зачистки. Целые ячейки уничтожаются, их имущество экспроприируется, а боевые машины еретиков превращаются в биомассу. Однако вопросов пока больше, чем ответов. Несколько выращенных в секрете биокораблей до сих пор не найдено, как, впрочем, и руководители культа — они пропали бесследно.\n\nНо в космической пустоте остался слабый след из сладковатых феромонов, ведущий в далёкие системы, не значащиеся на наших картах. Их план ещё не претворён в жизнь — но не претворён и наш."
 country.203.a: "Мы должны преследовать террористов!"
 country.204.name: "Обнаружены культисты-мародёры"
 country.204.desc: "Мы засекли несколько кораблей под флагом «[radical_cult.GetName&gen]» в системе [Root.System.GetName&gen]. Они движутся нам наперерез и готовы к бою!"
 country.205.desc: "Ещё несколько кораблей, принадлежащих «[radical_cult.GetName&dat]», были обнаружены в системе [Root.System.GetName&gen]. Они приближаются боевым строем!"
 country.206.desc: "И ещё одна флотилия, принадлежащая «[radical_cult.GetName&dat]», была замечена в системе [Root.System.GetName&gen]. Однако на сей раз в её рядах — загадочный звездолёт незнакомой конструкции!"
 country.207.name: "Следы боя"
 country.207.desc: "До сих пор мы одерживали победы над силами культистов, которые нам встречались, однако эти стычки вызывают всё больше тревожных вопросов. У «[radical_cult.GetName&gen]» куда больше звездолётов, чем можно было втайне построить на [Root.Capital.GetName&prep], а теперь они выставили против нас большой боевой корабль неизвестной конструкции.\n\nОткуда взялись все эти звездолёты? Есть ли у них другие корабли, похожие на тот, что мы уничтожили? Нужно исследовать обломки, оставшиеся после сражения, и найти ответы."
 country.207.a: "Начать сбор обломков."
 country.207.a.tooltip: "Активирует §Sособый проект§! в системе [our_fleet_position.GetName&gen]."
 country.208.name: "Сбор обломков завершён"
 country.208.desc: "Мы внимательно изучили всё, что осталось от странного боевого корабля культистов, и наши учёные полагают, что теперь им известно, откуда у «[radical_cult.GetName&gen]» все эти звездолёты. Восстановленные фрагменты бортового журнала свидетельствуют о том, что при бегстве из системы [Root.Capital.System.GetName&gen] культисты обнаружили заброшенную инопланетную верфь.\n\nАвтоматизированный кораблестроительный завод помог им укрепить ряды, а теперь они производят новые звездолёты по инопланетным схемам, найденным в базах данных! Этому надо положить конец."
 country.208.a: "Верфь должна быть уничтожена!"
 country.209.name: "Верфь уничтожена"
 country.209.desc: "Инопланетная верфь, которую «[radical_cult.GetName]» [radical_cult.GetName::использовал<end_a>] в своём крестовом походе против нас, уничтожена! Несколько культистов были захвачены в плен при попытке спастись в аварийных капсулах. В их числе — главный инженер. Он хорошо разбирается в инопланетных технологиях на верфи, и это нам очень помогло.\n\nК несчастью, мы также выяснили, что харизматичный лидер культистов покинул верфь несколько недель назад на новом звездолёте. Этот корабль ещё более мощный, чем те, что они производили ранее. Военная разведка сейчас ведёт поиски беглецов."
 country.209.a: "Их надо найти!"
 country.210.name: "Вероятные точки местонахождения флагмана культистов"
 country.210.desc: "Наши зонды глубокой космической разведки уловили в соседней звёздной системе слабое подпространственное излучение, напоминающее по своим параметрам след инопланетных кораблей, на которых [radical_cult.GetName::сбежал<end_a>] «[radical_cult.GetName]». Скорее всего, источник излучения — пропавший флагман культистов!\n\nМы должны как можно скорее направить в эту систему поисковые группы. Корабль и его харизматичный капитан на свободе слишком опасны."
 country.210.a: "Готовьте флотилию."
 country.211.name: "Флагман культистов"
 country.211.desc: "Вы всё-таки нашли нас. Но это не имеет значения.\n\nМои ученики готовы отдать жизнь во имя будущего процветания расы [Root.Owner.GetSpeciesName]. §YЯ§! и есть это будущее, если вдруг вы не поняли.\n\nКогда мы уничтожим ваши жалкие корабли, священный флагман доставит меня на [Root.Owner.Capital.GetName&acc], и мы наконец очистим родной мир от неверующих."
 country.211.a: "Мы положим этому конец."
 country.213.name: "Флагман обездвижен"
 country.213.desc: "Нам удалось обездвижить флагман культистов, и теперь «[radical_cult.GetName]» никуда не [radical_cult.GetName::денется|||pl:денутся]! Оружие и двигатели корабля бездействуют, но системы жизнеобеспечения в норме. Мы должны подняться на борт.\n\nПоскольку на корабле находится множество вооружённых культистов, в этой операции придётся задействовать значительные силы."
 country.213.a: "Корабль будет наш!"
 country.214.name: "Флагман культистов захвачен"
 country.214.desc: "Медленно, с боями пробиваясь по каждой палубе, наши космодесантники наконец уничтожили все очаги сопротивления на бывшем флагмане. В живых осталось всего несколько человек. «[radical_cult.GetName&gen]» [radical_cult.GetName::сража<end_lsya>] до последнего, и [radical_cult.GetName::<ego_eyo>] последователи скорее готовы были погибнуть в безрассудной атаке, чем попасть в плен. Главу культистов обнаружили на капитанском мостике, она покончила с собой. По крайней мере, теперь можно сказать, что «[radical_cult.GetName]» [radical_cult.GetName::уничтожен<end_aoy>].\n\nНаши инженеры починили двигатели корабля, и он был включён в состав флота под названием [disabled_cultist_flagship.GetName]. Звездолёт надо как можно скорее доставить в ближайший порт для более серьёзного ремонта."
 country.214.desc.bio: "Наши воины продвигались медленно, но верно, зачищая от обезумевших фанатиков палубу за палубой и отсек за отсеком. [radical_cult.GetName::Сопротивля<end_lsya>] не только «[radical_cult.GetName]» — сопротивлялся даже сам флагман, словно он тоже принял это вероучение. Истерзанное тело его извивалось в агонии, но десантники были неумолимы. Последний защитник в конце концов оказался уничтожен.\n\nВ живых осталось всего несколько пленных. Культисты, частично сросшиеся со своим кораблём, предпочли погибнуть, либо бросившись со страшным криком в биореактор, либо пойдя в самоубийственную атаку. Их главу мы нашли на мостике флагмана — если, конечно, его можно назвать мостиком; её безжизненное тело, обмякнув, привалилось к пульсирующей массе нервной ткани. Её собственное биологическое оружие в конце концов обернулось против неё самой. Вместе с предводительницей культа погибли и все её мечты.\n\nФлагман теперь в нашем распоряжении. Инженеры стабилизировали биологические системы и принудили сопротивляющееся тело покориться. Корабль жив, но его пришлось взять «на поводок». Теперь он будет числиться в составе флота под названием [disabled_cultist_flagship.GetName]. Сейчас его следует направить в ближайший космопорт и внимательно изучить.\n\nКульт уничтожен, но его создание ещё послужит нам."
 country.225.name: "Флагман культистов передан"
 country.225.desc: "Бывший последователь «[radical_cult.GetName&gen]», который теперь полностью разделяет наши убеждения, убедил своих старых товарищей оставить их фанатичную веру и присоединиться к нам. Их флагман теперь находится на орбите [Root.capital_scope.GetName&gen], ожидая досмотра перед официальным включением в состав нашего флота."
 country.225.tt: "Становится новым владельцем §YРассвета творения§!."
 country.17.name: "Уничтожена флотилия утилизаторов"
 country.17.desc: "Разведывательные дроны в системе [salvager_system.GetName&gen] подтвердили уничтожение флотилии утилизаторов, незаконно присвоивших наш пропавший космический зонд. К счастью, насколько мы можем судить, зонд также был уничтожен в бою, поэтому не стоит опасаться, что секретная информация попадёт не в те руки."
 country.19.name: "Подпространственная аномалия уничтожена"
 country.19.desc: "Сенсоры слежения глубокого космоса подтверждают уничтожение подпространственной аномалии, которая возникла вокруг нашего пропавшего зонда в системе [anomaly_system.GetName&gen]. Зонд также был уничтожен в бою, поэтому больше нет причин беспокоиться о секретных сведениях, которые он мог содержать."
 country.21.name: "Модифицированный зонд побеждён"
 country.21.desc: "Сканеры дальнего действия подтвердили уничтожение нашего модифицированного зонда в системе [modified_probe_system.GetName&gen]. К счастью, после сражения от его ячеек памяти ничего не осталось, поэтому не стоит опасаться, что секретная информация попадёт к врагам."
 country.218.name: "Корабль культистов остановлен!"
 country.218.desc: "Неизвестный противник каким-то образом сумел остановить один из кораблей армады культистов! Он почти не получил повреждений, и мы улавливаем изнутри слабые сигналы.\n\nКогда мы будем уверены, что это безопасно, то проведём операцию по спасению тех, кто выжил. Возможно, они смогут рассказать, с какой целью [From.Owner.GetName] устроили этот заговор."
 country.219.name: "Уничтожена флотилия культистов"
 country.219.desc: "Флотилия культистов, базировавшаяся в системе [marauder_system.GetName&gen], была уничтожена в бою."
 country.221.desc: "Кто-то уничтожил инопланетную верфь, которую «[radical_cult.GetName]» [radical_cult.GetName::использовал<end_a>] для своего крестового похода против нас. По полученным сведениям, культисты были уничтожены подчистую. Однако у нас также есть информация, что харизматичный лидер культистов покинула верфь на новейшем флагмане ещё до начала сражения.\n\nОна по-прежнему на свободе, и никто не знает, где именно. Военная разведка пытается отыскать её звездолёт."
 country.223.name: "Флагман культистов уничтожен"
 country.223.desc: "Кто-то уничтожил флагман культистов после ожесточённого сражения в системе [flagship_system.GetName&gen]. Наши командиры уже выразили сожаление, что им не удалось нанести решающий удар, но, по крайней мере, это означает конец зловещего культа и эпохи террора."

 country.250.name: "Охота за «Гиацинтом»"
 country.250.desc: "Мы не обнаружили никаких следов четырёх кораблей-ковчегов, которые прошли сквозь червоточину до того, как Хризантема прибыла к [Root.Capital.GetName&dat]. Один корабль, Гиацинт, должен был следовать за нами, но... радары дальнего действия, установленные на «Хризантеме», зафиксировали краткий энергетический всплеск со стороны червоточины, прежде чем она утратила стабильность и исчезла.\n\nЕсть шанс, что Гиацинт пережил этот инцидент и очутился где-то в близлежащих областях галактики. Хотя ковчег так и не вышел на связь, возможно, нам стоит поискать его следы в соседних системах."
 country.250.a: "Хорошо. Разрешаю."
 country.250.b: "Пустая трата времени, мы не можем себе этого позволить."
 country.251.name: "Система изучена"
 country.251.desc: "[Root.GetName] докладывает, что в системе [From.GetName&gen] следов «Гиацинта» не обнаружено. Поиски следует продолжать в другом секторе."
 country.251.a: "Продолжайте поиски."
 country.252.desc: "[Root.GetName] сообщает, что сканирование космоса не принесло результатов. Следов «Гиацинта» в системе [From.GetName&gen] не обнаружено. Возможно, в другой системе нам повезёт больше."
 country.252.a: "Где-то же он должен быть."
 country.253.desc: "[Root.GetName] сообщает, что ему удалось обнаружить остаточный ионный след в системе [From.GetName&gen]. Этот след идентичен тому, который оставляли двигатели «Хризантемы». Вероятнее всего, он принадлежит «Гиацинту»!\n\nХотя этот след едва уловим и был оставлен свыше ста лет назад, [Root.Leader.GetAXX::ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] докладывает, что траекторию удалось отследить. Корабль двигался в направлении звезды, которая ранее не была отмечена на наших картах. Координаты внесены в журнал."
 country.260.desc: "Недавно получены результаты обследования системы [surveyed_planets_system.GetName&gen]. Следов «Гиацинта» не обнаружено. Возможно, в другой системе нам повезёт больше."
 country.261.desc: "Недавно получены результаты обследования системы [surveyed_planets_system.GetName&gen]. В ней обнаружены остаточные проявления уникального ионного следа. Он идентичен тому, который оставляли двигатели «Хризантемы». Вероятнее всего, он принадлежит «Гиацинту»!\n\nХотя этот след едва уловим и был оставлен свыше ста лет назад, мы смогли отследить траекторию. Корабль двигался в направлении звезды, которая ранее не была отмечена на наших картах. Координаты внесены в журнал."
 country.253.a: "«Гиацинт» должен быть там."
 country.254.name: "«Гиацинт» найден"
 country.254.desc: "Мы обнаружили «Гиацинт»! Огромный корабль-ковчег находится на стабильной орбите у [hyacinth_planet.GetName&gen]. Наши датчики не считывают никаких признаков активности на звездолёте, и нам не удалось обнаружить аварийные маячки. Мы направим десантную группу, чтобы обследовать корабль."
 country.254.a: "Вперёд."
 country.255.name: "На борту «Гиацинта»"
 country.255.desc: "Десантная группа вернулась с «Гиацинта» с трагическими вестями. На борту обнаружены останки колонистов, погибло не менее четверти миллиона человек — то есть всё население ковчега. Большинство умерли от голода, но на корабле были также обнаружены следы перестрелки и каннибализма...\n\nНа капитанском мостике нам удалось раздобыть бортовой журнал."
 country.255.a: "Давайте его сюда."
 country.256.name: "Корабельный архив"
 country.256.desc: "КОРАБЛЬ-КОВЧЕГ «ГИАЦИНТ»\nИСА-06\nОБЪЕДИНЁННАЯ ПРОГРАММА «ОДИССЕЙ»\nБортовой журнал: капитан Рональд Ф. Гундерсен\n\nСчитывание данных... обнаружены повреждения. Попытка восстановления...\nЧетыре записи успешно восстановлены."
 country.256.a: "Запись I (Дата миссии 345.5)"
 country.256.a.response: "Бортовой журнал, дата миссии 345.5.\n\nДа месяца назад мы оставили Землю, движемся намеченным курсом. Пока что полёт проходит успешно. Колонисты погружены в сон, доктор Кольбек сообщает, что все жизненные показатели в норме.\n\nМы оставили позади внешние планеты и сейчас пересекаем облако Оорта. Вскоре мы достигнем подпространственного феномена — этой предполагаемой «червоточины», через которую уже прошёл один ковчег. Свои сомнения относительно путешествий через червоточины я изложил в предыдущих записях, однако, уже скоро мы доподлинно выясним, как работает эта штука..."
 country.256.b: "Запись II (Дата миссии 387.2)"
 country.256.b.response: "Мы... у нас действительно всё получилось! Астронавигаторы всё ещё вычисляют наши новые координаты, но, судя по звёздам вокруг, я бы сказал, что мы уже не в Канзасе. К сожалению, двигатели «Гиацинта» сильно пострадали, мы были вынуждены их отключить и сейчас летим на аккумулированных запасах.\n\nКольбек говорит, что, возможно, нам придётся разбудить колонистов. Сейчас я спущусь в инженерный отсек и попробую выяснить, почему Мэгги сидит сложа руки, вместо того чтобы запустить реактор. Надеюсь, поломка скоро будет устранена, и мы отправимся на поиски колонистов с «Хризантемы»."
 country.256.c: "Запись III (Дата миссии 422.7)"
 country.256.c.response: "Ситуация стремительно ухудшается. Если трезво смотреть на вещи, у нас нет ни единого шанса перезапустить реактор, а остатки энергии мы растратили на то, чтобы достичь этой проклятой звёздной системы. Мы надеялись отыскать обитаемый мир и высадиться там... но увы.\n\nНам хватит запасов аккумуляторов на то, чтобы протянуть ещё пару лет, но при таком количестве колонистов провизии осталось меньше чем на месяц. Я созвал заседание всех глав подразделений. Нам... нам нужно придумать какой-то план..."
 country.256.d: "Запись IV (Дата миссии 459.9)"
 country.256.d.response: "Боюсь, это будет моя последняя запись. На мостике никого: все либо погибли, либо пропали без вести, и прямо сейчас сюда ломятся колонисты. Основные запасы продуктов подошли к концу ещё пару недель назад. Говорят... были вспышки каннибализма.\n\nЯ приберегал немного провизии для команды, чтобы корабль продержался ещё хоть сколько-то... надеялся на чудо, наверное. Когда колонисты об этом узнали, они...\n\nИм удалось выломать двери. Назад, черт побери! Не подходите! Я капитан этого корабля, и будь я проклят, если позволю вам меня прирезать, как... А-а-а-ар-р-х..."
 country.256.e: "Конец записи"
 country.256.e.response: "КОРАБЛЬ-КОВЧЕГ «ГИАЦИНТ»\nИСА-06\nОБЪЕДИНЁННАЯ ПРОГРАММА «ОДИССЕЙ»\n\nОтключение пользовательского интерфейса."
 country.257.name: "Окончательный вывод"
 country.257.desc: "Теперь мы хорошо представляем, какая катастрофа постигла «Гиацинт», его экипаж и колонистов. Сложись всё чуть иначе, и сейчас «Хризантема» могла бы дрейфовать, как безмолвный склеп, над [hyacinth_planet.GetName&inst]. Это отрезвляющее напоминание о том, какие опасности грозят человечеству в холодном и равнодушном космосе.\n\n«Гиацинт» будет отбуксирован к [Root.Capital.GetName&dat]. Мы поместим его на низкую орбиту и уберём все человеческие останки, чтобы сделать там музей. Невзирая на произошедшую трагедию, этот корабль-ковчег всё-таки почти идентичен тому, на котором прилетели с Земли наши далёкие предки. Социологам будет очень полезно."
 country.257.a: "Возможно, от всего этого ещё будет польза."



 #############################
 # Progress Events
 #############################
 progress.1.name: "Система [home_system.GetName&gen] полностью изучена"
 progress.1.desc: "Многие тысячи лет астрономы на [Root.Capital.GetName&prep] пользовались телескопами, чтобы с восторгом созерцать планеты нашей звёздной системы. Наши предки изготавливали сложные механические устройства для вычисления орбит. Их модели системы [home_system.GetName&gen] отличались поразительной точностью.\n\nСегодня наша цивилизация достигла нового исторического рубежа: в этой системе больше не осталось неизученных космических объектов. Границы непознанного в очередной раз отодвинуты."
 progress.1.a: "Так вершится история!"
 progress.2.name: "Обнаружена инопланетная жизнь"
 progress.2.desc: "[Root.GetName::<1> сообщил<end_a>] об удивительной находке, сделанной на [From.GetName&prep]: [From.GetName::он<end_a>] [From.GetName::кишит|||pl:кишат] жизнью! Впервые в истории мы обнаружили форму жизни за пределами [Root.Owner.GetHomeWorldName&gen].\n\nЭта поразительная новость заставила замолчать всех, кто утверждал, будто мы одни во вселенной. И хотя обитателей [From.GetName&gen] нельзя назвать разумными, вероятно, в скором времени мы отыщем и более развитых существ."
 progress.2.desc.mach: "[Root.GetName::<1> сообщил<end_a>] о непредвиденном открытии, сделанном на [From.GetName&prep]: [From.GetName::он<end_a>] [From.GetName::изобилу<end_etyut>] формами жизни. Впервые в истории мы обнаружили органическую жизнь за пределами [Root.Owner.GetHomeWorldName&gen].\n\nХотя никого из обитателей [From.GetName&gen] нельзя назвать разумными, заново пересмотренные прогнозы говорят о высокой вероятности нахождения в галактике органических существ такого рода."
 progress.2.desc.assim: "[Root.GetName::<1> сообщил<end_a>] о важном открытии на [From.GetName&prep]: там обнаружено множество органических форм жизни! И хотя никто из них пока не эволюционировал до такой степени, чтобы считаться желательными кандидатами на ассимиляцию, перспективы того, что [Root.Owner.Capital.GetName] не единственное место, где можно встретить разумных органиков, теперь являются более многообещающими, чем когда-либо."
 progress.2.desc.term: "Мы готовились к этому дню. [Root.GetName::<1> подтвердил<end_a>] существование органических существ на [From.GetName&prep]. Хотя обнаруженные формы жизни не обладают способностью к высшей умственной деятельности, нельзя исключать теперь уже более высокую вероятность заражения галактики разумными органиками."
 progress.2.desc.serv: "[Root.GetName::<1> сообщил<end_a>] об историческом открытии на [From.GetName&prep]: [From.GetName::он<end_a>] [From.GetName::изобилу<end_etyut>] формами жизни! Хотя ни одна из новых форм жизни не обладает достаточным уровнем самосознания, чтобы оценить [Root.Owner.GetAdj&fem,acc] заботу, это, вероятно, лишь вопрос времени, прежде чем мы встретим тех, кто на это способен!"
 progress.2.desc.droid: "[Root.GetName::<1> сообщил<end_a>] об удивительной находке, сделанной на [From.GetName&prep]: [From.GetName::он<end_a>] [From.GetName::кишит|||pl:кишат] жизнью! Впервые в истории мы обнаружили форму жизни за пределами [Root.Owner.GetHomeWorldName&gen].\n\nЭта поразительная новость заставила замолчать всех, кто утверждал, будто мы одни во вселенной. И хотя обитателей [From.GetName&gen] нельзя назвать разумными, вероятно, в скором времени мы отыщем и более развитых существ."
 progress.2.desc.evopred: "Жизнь, великолепная развитая жизнь! Она совсем рядом — до неё можно дотянуться и употребить её на пользу. Все хоть сколько-нибудь любопытные образцы с [Owner.GetHomeWorldName&gen] мы собрали уже давно. Никто не смел даже надеяться, что новые уникальные гены обнаружатся так быстро, почти сразу после того, как мы покинули родной дом."
 progress.2.a: "Возможно, мы тут не одни."
 progress.2.a.assim: "Мы будем единственными."
 progress.2.a.mech: "Принято."
 progress.2.a.term: "Мы будем готовы к встрече с ними."
 progress.2.a.serv: "Отлично. Подготовьте протоколы обогащения."
 progress.2.a.evopred: "Новости — просто объедение!"
 progress.3.name: "[Root.Owner.GetSpeciesNamePlural] основывают первую колонию"
 progress.3.desc_end: "\n\nПриземлившийся звездолёт колонисты превратили в §Yкорабль-поселение§! — административное здание колонии. Обеспечивать потребности нового поселения в энергии какое-то время будет извлечённый реактор. Толпы переселенцев сходят на поверхность — и вот уже вокруг корпуса стремительно вырастают палатки со стройматериалами и модульные укрытия. Скоро здесь появится первый настоящий город, который [Root.Owner.GetSpeciesNamePlural] основали на другой планете."
 progress.3.desc_01: "Наш колониальный корабль взял курс на один из континентов §Y[Root.GetName&gen]§! и мягко приземлился у дельты широкой реки. Местные условия прекрасны: климат мягок, а леса обильны. Устроить себе приют и начать добывать сырье будет несложно.$progress.3.desc_end$"
 progress.3.desc_02: "Наш колониальный корабль, подняв облако брызг, мягко приземлился в океане, покрывающем §Y[Root.GetName&acc]§!. Место посадки у берега крупного архипелага выбрано неслучайно: эта цепь островов крайне плодородна, поэтому отлично подходит для выращивания пищи.$progress.3.desc_end$"
 progress.3.desc_03: "Наш колониальный корабль мягко приземлился на окраине крупного оазиса на §Y[Root.GetName&prep]§!, расположенного у подножия горы. Здесь мы сможем укрыться от пустынных ветров, а рядом всегда будет источник воды.$progress.3.desc_end$"
 progress.3.desc_04: "Наш колониальный корабль приземлился на поляне посреди густых джунглей §Y[Root.GetName&gen]§!. Сразу после посадки мы выпустили наружу единиц-часовых: если здесь обитают хищники, нам понадобится защита.$progress.3.desc_end$"
 progress.3.desc_05: "Наш колониальный корабль совершил мягкую посадку на плоскогорье, недалеко от экватора §Y[Root.GetName&gen]§!. Реки, текущие в каньонах, в изобилии дают пресную воду.$progress.3.desc_end$"
 progress.3.desc_06: "Наш колониальный корабль мягко приземлился в широкой степи §Y[Root.GetName&gen]§!. Вокруг нет никого — виден только горный хребет, который укроет нас от холодного ветра.$progress.3.desc_end$"
 progress.3.desc_07: "Наш колониальный корабль мягко приземлился в заснеженной долине §Y[Root.GetName&gen]§!. Окружающие её горные цепи укроют нас от стихий, а заодно дадут необходимую воду.$progress.3.desc_end$"
 progress.3.desc_10: "Наш колониальный корабль успешно совершил посадку на §Y[Root.GetName&prep]§!. Из трюмов высыпали тысячи рабочих единиц, немедленно принявшихся за строительство §Yпоста высадки§!, с которого начнётся развитие нашего поселения. Продолжаются работы по каталогизации неглубоких залежей ресурсов. Все агрессивные дикие животные в районе места посадки усмирены.\n\nТеперь мы готовы начать массовое производство дополнительных [Root.Owner.GetSpeciesNamePlural&gen] на [Root.GetPlanetMoon_rinfix&prep] по мере появления ресурсов. Наша первая колония оказалась успешной."
 progress.3.desc_11_droids: "Наш колониальный корабль приземлился на поверхности §Y[Root.GetName&gen]§!. Место посадки выбрано не случайно: здесь всегда спокойная погода и много доступных залежей ресурсов.\n\nПриземлившийся корабль был превращён в §Yкорабль-поселение§! — административное здание колонии. Обеспечивать потребности нового поселения в энергии какое-то время будет извлечённый реактор. Дроиды сходят на поверхность — и вот уже вокруг корпуса стремительно возникают сотни модульных укрытий. Скоро здесь появится первый настоящий город, который [Root.Owner.GetSpeciesNamePlural] основали на другой планете."
 progress.3.desc_11_hive: "Наш колониальный корабль приземлился на поверхности §Y[Root.GetName&gen]§!. Место посадки выбрано не случайно: здесь всегда спокойная погода и много доступных залежей ресурсов.\n\nПриземлившийся корабль был превращён в §Yкорабль-поселение§!. Около навсегда осевшего здесь корпуса возникли укрытия, собранные из подручных материалов. Так на поверхности другой планеты появился новый улей."
 progress.3.materialist: "Научный прогресс поможет колонии развиваться."
 progress.3.spiritualist: "Эта колония — символ нашего возвышения."
 progress.3.militarist: "Сила и бдительность — вот залог нашего будущего."
 progress.3.pacifist: "В нашей колонии будут царить мир и процветание."
 progress.3.egalitarian: "Движущей силой здесь, как и всегда, станет равенство."
 progress.3.xenophile: "Наша сила будет в разнообразии."
 progress.3.xenophobe: "Наша колония будет чиста и надёжно защищена."
 progress.3.authoritarian: "Мы установим строгие порядок и иерархию."
 progress.3.gestalt_consciousness_hive: "Колония будет расти вместе с ульем как единое целое."
 progress.3.gestalt_consciousness_machine: "Мы обеспечим колонии безупречную продуктивность."
 progress.3.b.evopred: "Нас ждёт настоящее пиршество."
 progress.4.name: "Первая встреча с инопланетянами"
 progress.4.desc_01: "Известие о том, что мы впервые столкнулись с разумной инопланетной жизнью, вызвало у населения смешанные чувства. Мы давно это подозревали, а теперь окончательно убедились — мы не одиноки во вселенной. Каждая новая раса — это одновременно и новые возможности, и угроза. Следует проявлять осторожность.\n\nЧто касается этих конкретных инопланетян, то они находятся примерно на одном с нами уровне технического развития, т. е. мы начали освоение космоса почти одновременно."
 progress.4.desc_02: "Известие о том, что мы впервые столкнулись с разумной инопланетной жизнью, распространяется по [Root.GetName&dat] подобно лесному пожару. Все хотят побольше узнать об этих существах, в прессе полно рассказов и домыслов об их культуре и общественном устройстве. [Root.Capital.GetName] ликует и празднует: ведь мы наконец убедились, что не одиноки во вселенной.\n\nКак и мы, инопланетяне лишь недавно начали освоение космоса и находятся на аналогичном уровне технического развития."
 progress.4.desc_03: "Известие о том, что мы впервые столкнулись с разумной инопланетной жизнью, потрясло наше общество до самого основания. [Root.GetName] с тревогой смотрит репортажи, где показывают этих странных существ, зрители охвачены паникой. В нескольких городах на [Root.Capital.GetName&prep] вспыхнули беспорядки.\n\nСтранные пришельцы достигли примерно того же уровня технического развития, что и мы, и тоже начали осваивать космос. Никто не может предсказать, не отнесутся ли они к нашей расе со страхом, ненавистью или холодным безразличием."
 progress.4.a: "Это всё меняет."
 progress.4.b: "Это эпохальное событие."
 progress.4.c: "Мы должны готовиться к худшему."
 progress.5.name: "Обнаружена развивающаяся цивилизация"
 progress.5.desc_01: "Новости о формальном контакте с разумной, пусть и слаборазвитой цивилизацией, нашли смешанный отклик у нашего населения. Это подтверждает давние предположения о наличии в галактике чужаков, неспособных к космическим полётам, а возможно, даже и не задумывавшихся об исследованиях за пределами родного мира.\n\nКаждая встреченная нами раса — это одновременно возможность и угроза. Нужно соблюдать осторожность. По нашим меркам уровень технологий этих чужаков достаточно низкий. Они ещё не дошли до космических полётов. Нужно определить, как мы будем взаимодействовать с ними."
 progress.5.desc_02: "Известие о формальном контакте с разумной, хоть и неразвитой цивилизацией, распространяется по [Root.GetName&dat] подобно лесному пожару. Все хотят побольше узнать об этих существах, в прессе полно рассказов и домыслов об их культуре и общественном устройстве. [Root.Capital.GetName] ликует и празднует: наконец-то подтвердилось наличие в галактике инопланетян, которые не освоили космические полёты, а возможно, даже и не задумывались о них.\n\nМы значительно опережаем их в технологическом развитии, ведь они ещё даже не вышли в космос. Тем не менее мы всё равно можем многое узнать, изучая их."
 progress.5.desc_03: "Известие о формальном контакте с разумной, хоть и неразвитой цивилизацией, потрясло наше общество до самого основания. [Root.GetName] с тревогой смотрит репортажи, где показывают этих странных существ, зрители охвачены паникой. В нескольких городах на планете [Root.Capital.GetName] вспыхнули беспорядки.\n\nЭти чужаки сильно отстают от нас по уровню технического развития, они ещё даже не вышли в космос. Будем надеяться, что и не выйдут."
 progress.5.b: "Очень интересно."
 progress.5.c: "Само собой."
 progress.6.desc_01: "Известие о том, что мы впервые столкнулись с разумной инопланетной жизнью, вызвало у населения смешанные чувства. Мы давно это подозревали, а теперь окончательно убедились — мы не одиноки во вселенной. Каждая новая раса — это одновременно и новые возможности, и угроза. Следует проявлять осторожность.\n\nЧто касается этих конкретных инопланетян, то они уже довольно давно вышли в космос, их государству несколько тысяч лет, и они опережают нас по уровню технического развития. С ними мы должны держать ухо востро."
 progress.6.desc_02: "Известие о том, что мы впервые столкнулись с разумной инопланетной жизнью, распространяется по [Root.GetName&dat] подобно лесному пожару. Все хотят побольше узнать об этих существах, в прессе полно рассказов и домыслов об их культуре и общественном устройстве. [Root.Capital.GetName] ликует и празднует: ведь мы наконец убедились, что не одиноки во вселенной.\n\nГосударство, основанное этими инопланетянами, очень древнее, они значительно выше нас по уровню технического развития. Без сомнений, они многому смогут нас научить."
 progress.6.desc_03: "Известие о том, что мы впервые столкнулись с разумной инопланетной жизнью, потрясло наше общество до самого основания. [Root.GetName] с тревогой смотрит репортажи, где показывают этих странных существ, зрители охвачены паникой. В нескольких городах на [Root.Capital.GetName&prep] вспыхнули беспорядки.\n\nСтранные пришельцы достигли куда более высокого уровня технического развития, чем мы. Они уже несколько тысяч лет — если не больше — летают в космос. Нам повезло, что эта раса, похоже, стареет и загнивает."
 progress.6.b: "Они наверняка очень мудры."
 progress.6.c: "Их время вышло. Теперь главными будут [Root.Species.GetName]."
 progress.7.name: "Наблюдательная миссия"
 progress.7.desc: "[Root.GetName], наш первый научный корабль, прошёл испытания в открытом космосе и готов к полёту. [Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] принял командование и рекомендует начать с исследования нашей родной звёздной системы.\n\nМы внесли подробную информацию об этой миссии в §Sжурнал§!, чтобы с ним можно было свериться в любой момент."
 progress.7.a: "Очень хорошо."
 progress.8.name: "Плацдарм"
 progress.8.desc: "Наша родная звёздная система изучена полностью. Теперь [Root.Capital.GetName] станет плацдармом для дальнейших исследований и распространения нашей расы. Нужно изучить соседние звёздные системы и отыскать мир, подходящий для первой колонии.\n\nКак обычно, соответствующая запись была внесена в §Sжурнал§!."
 progress.8.a: "Начнём поиски."
 # First contact with another empire - Payback origin version
 progress.9.name: "Вторая встреча с инопланетянами"
 progress.9.desc.start: "Мы уже знали, что не одиноки во вселенной. И всё же второй контакт с другой космической цивилизацией вызывает у нас беспокойство."
 progress.9.desc.default: "Как и мы, инопланетяне лишь недавно начали освоение космоса и находятся на аналогичном уровне технического развития."
 progress.9.desc.preftl: "Наши технологии ушли далеко вперёд в сравнении с этими чужаками. Им ещё только предстоит выйти в космос."
 progress.9.desc.fallen: "Цивилизация этих инопланетян уходит корнями в глубокую древность, а их технологии значительно опережают наши."
 progress.9.desc.msi: "Мы знали, что рано или поздно вновь столкнёмся с бывшим господином. Но мы не ожидали, что это произойдёт так скоро."
 progress.9.desc.friendly_friendly: "Похоже, они настроены куда более благожелательно, чем наши бывшие хозяева. Возможно, нам просто не повезло с первым контактом. В конце концов, должно же быть в галактике что-то хорошее."
 progress.9.desc.friendly_mean: "Они сильно отличаются от наших бывших хозяев, но, увы, ведут себя не лучше. Невольно задаёшься вопросом, не все ли цивилизации в галактике имеют лишь дурные намерения. Возможно, лишь мы способны проявлять дружелюбие."
 progress.9.desc.mean_friendly: "Они так отличаются от нас. И в то же время столь любезны. Возможно, это значит, что существуют и хорошие чужаки. Всё же среди звёзд есть место доброте."
 progress.9.desc.mean_mean: "Воистину, в космосе нет хороших чужаков. Глупо было считать иначе!"
 progress.9.desc.msi2: "Удастся ли нам когда-нибудь вырваться из их хватки?"

 progress.4.desc_04: "$progress.4.gestaltintro$\n\n$progress.4.gestaltnormal$"
 progress.4.d: "Они... другие."
 progress.4.e: "Эти данные нужно анализировать."
 progress.4.f: "Добыча..."
 progress.4.g: "Сбор тактических данных..."
 progress.5.desc_04: "$progress.4.gestaltintro$\n\n$progress.4.gestaltprimitives$"
 progress.6.desc_04: "$progress.4.gestaltintro$\n\n$progress.4.gestaltfallen$"
 progress.4.gestaltintro: "Наши теоретические модели уже давно предполагали существование других разумных цивилизаций в нашей галактике. Теперь эта теория подтвердилась."
 progress.4.gestaltnormal: "Инопланетное политическое образование, обнаруженное нами, обладает технологиями того же уровня, что и мы. Это указывает на то, что мы с ними вышли в космос примерно в одно и то же время."
 progress.4.gestaltprimitives: "Инопланетное политическое образование, которое мы обнаружили, ещё не освоило космические полёты. Нам нужно понять, как нас лучше воспримут эти [GetPreFTLLower&pl] создания."
 progress.4.gestaltfallen: "Инопланетное политическое образование, которое мы обнаружили, кажется старым и обладает гораздо более продвинутыми технологиями, чем мы. Рекомендуется проявить осторожность."

 #############################
 # Pirate Events
 #############################
 pirate.1.name: "Зарождение космического пиратства"
 pirate.1.desc_01: "Межзвёздная торговля между нашими системами продолжает расти, и крупная шайка вероломных преступников с [Root.Capital.GetName&gen] захватила несколько гражданских звездолётов и превратила их в боевые корабли. Эти еретики несут ответственность за несколько нападений на наших уязвимых торговых путях в системе §S[pirate_system.GetName&gen]§! и называют себя §S[pirate_band.GetName]§!.\n\nИх нечестивой деятельности нужно положить конец!"
 pirate.1.desc_02: "Флотская разведка докладывает, что за последние месяцы было совершено несколько нападений на гражданские корабли в нашем космическом пространстве. Это дело рук дезертиров и других антиобщественных элементов с [Root.Capital.GetName&gen].\n\nПреступники, засевшие на маленьком астероиде в системе §H[pirate_system.GetName&gen]§!, сколотили флотилию из бывших гражданских звездолётов, которые они перестроили в своих целях, и ищут жертв на наших уязвимых торговых путях в системе §H[pirate_system.GetName&gen]§!. Теперь они именуют себя §S[pirate_band.GetName]§!. Как бы ни были примитивны их корабли, мы не можем игнорировать такую угрозу."
 pirate.1.desc_03: "Некоторые преступные элементы нашего общества покинули [Root.Capital.GetName&acc], чтобы вести жизнь изгоев на дальних границах обитаемого космоса. Эти бандиты проявили удивительную смекалку и сумели переделать и вооружить несколько гражданских звездолётов.\n\nТеперь наши уязвимые торговые пути в системе §H[pirate_system.GetName&gen]§! находятся под угрозой, ведь на корабли регулярно нападает флотилия бандитов, именующих себя §S[pirate_band.GetName]§!. Нам стало известно, что их база находится в системе §H[pirate_system.GetName&gen]§!. Мы должны немедленно дать им отпор."
 pirate.1.desc_04: "Тревожные известия доходят от некоторых из наших торговцев. С тех пор как мы начали осваивать галактику, агрессивные группы маргиналов, не желающие жить в мире и согласии, стали покидать [Root.Capital.GetName&acc].\n\nОни назвали себя §S[pirate_band.GetName]§!, угнали несколько гражданских звездолётов и превратили их в боевые корабли. Теперь они живут в убогих условиях на астероидном форпосте в системе §H[pirate_system.GetName&gen]§! и охотятся на гражданские суда. Став пиратами, они ищут жертв на наших уязвимых торговых путях в системе §H[pirate_system.GetName&gen]§!, и их нападения на мирный транспорт принесли немало смертей. Мы должны защитить наш народ, чего бы это ни стоило."
 pirate.1.desc_05: "Бунтовщики с [Root.Capital.GetName&gen] создали пиратскую флотилию, превратив несколько мирных звездолётов в боевые корабли. Эти негодяи, именующие себя §S[pirate_band.GetName]§!, сеют хаос и страх на нашем уязвимом торговом пути в системе §H[pirate_system.GetName&gen]§!.\n\nИх преступления так велики, что не может быть и речи о том, чтобы сохранить им жизнь. Порядок должен быть восстановлен любой ценой."
 pirate.1.desc_06: "Преступные элементы неизменно устремляются к новым рынкам, пытаясь нажиться за счёт тех, кто честно делает свой бизнес, — и в космосе всё точно так же. Несколько подпольных криминальных организаций с [Root.Capital.GetName&gen] расширили свою деятельность и вышли в космос, превратив мирные торговые «грузовики» в боевые звездолёты.\n\nЭти преступники называют себя §S[pirate_band.GetName]§!, а их корабли угрожают нашему уязвимому торговому пути в системе §H[pirate_system.GetName&gen]§!. Нужно действовать быстро, пока ситуация не вышла из-под контроля."
 pirate.1.desc_07: "Развитие гражданских космических перелётов привело к появлению тех, кто решил нажиться на этом незаконным путём. Несколько преступных группировок с [Root.Capital.GetName&gen] превратили захваченные мирные звездолёты в боевые корабли и стали нападать на другие суда с целью грабежа.\n\nНасколько нам известно, они называют себя §S[pirate_band.GetName]§! и уже совершили несколько нападений на нашем уязвимом торговом пути в системе §H[pirate_system.GetName&gen]§!. Мы должны покарать преступников любой ценой."
 pirate.1.desc.nomad: "В системе §H[pirate_system.GetName&gen]§! обосновалась банда дезертиров и негодяев. Их корабли, украденные у прежних владельцев и доработанные новыми, теперь разоряют торговые пути, без которых невозможны наши странствия. Эти разбойники называют себя §S[pirate_band.GetName]§!; верность они хранят исключительно самим себе.\n\nВсю жизнь они провели в космосе и досконально знают наши корабли, маршруты и привычки. Нельзя допустить, чтобы они стали ещё более грозной силой."
 pirate.2.a: "Истинно верующие одержат победу."
 pirate.2.b: "Тревога всем постам. Привести флот в боевую готовность."
 pirate.2.c: "С этими отбросами будет покончено."
 pirate.2.d: "Мы не должны опускаться до их уровня."
 pirate.2.e: "Пираты. Такой мусор нам ни к чему."
 pirate.2.f: "Свобода торговли прежде всего."
 pirate.2.g: "Они предстанут перед судом."
 pirate.2.h: "Их нужно вернуть домой."
 pirate.2.i: "Проклятые пираты..."

 pirate.5.name: "Космические пираты"
 pirate.5.desc: "Корабли, встреченные нами в некоторых системах, определённо могут получать и передавать сообщения с использованием стандартных протоколов связи.\n\nВизуальные индикаторы указывают на то, что их культура связана преимущественно с космическими полётами, а некоторые наблюдаемые среди них фенотипы не соответствуют никаким из известных цивилизаций, обитающих на планетах.\n\nК сожалению, их экипажи совершенно не заинтересованы в диалоге с целью достижения взаимопонимания. Согласно перехваченным сообщениям между флотилиями, они занимаются главным образом пиратством, изредка привлекая в свои ряды радикальных представителей цивилизаций, освоивших космос."
 pirate.5.a: "Прискорбно."

 pirate.10.name: "Пиратская гавань"
 pirate.10.desc.nobirth: "[Root.GetName] сообщает, что их флотилия обнаружила присутствие значительных сил пиратов в системе [From.GetName&gen].\n\nСудя по результатам предварительного сканирования огромных кораблей и станций, на которых они укрываются, пираты в этом порту обосновались давно. Вероятно, он непрерывно эксплуатируется ещё с тех древних времён, когда эти воры и мародёры только появились на свет."
 pirate.10.desc.birth: "[Root.GetName] сообщает, что их флотилия обнаружила пиратскую станцию в системе [From.GetName&gen]. Вероятно, именно она и является источником того развращающего влияния, в результате которого некоторые изгои и преступные элементы [Root.Owner.GetName&gen] превратились в неистовых флибустьеров.\n\nЭти пираты, летающие на огромных уродливых и заметно устаревших кораблях, являются пережитками какой-то прошлой галактической эпохи — вероятно, потомками каперов со времён какой-нибудь древней войны, ставших пиратами после взаимного уничтожения и врагов, и союзников."
 pirate.10.a.nobirth: "Пиратство создаёт одинаковую угрозу для всех."
 pirate.10.a.birth: "Нужно нанести удар в самое сердце этого зла."

 pirate.15.name: "Пиратская гавань уничтожена"
 pirate.15.desc: "[killer_fleet.GetName] сообщает, что ветхие пиратские галеоны в системе [killer_fleet.solar_system.GetName&gen] уничтожены. Отставшим пиратам, оказавшимся в других системах, удалось уцелеть, но галактическое пиратство осталось в прошлом... До поры до времени.\n\nНам удалось захватить сейф-модуль с их нажитой неправедным путём добычей и передать его содержимое нашему казначейству."
 pirate.15.desc2: "[killer_fleet.GetName] сообщает, что ветхие пиратские галеоны в системе [killer_fleet.solar_system.GetName&gen] уничтожены. Отставшим пиратам, оказавшимся в других системах, удалось уцелеть, но галактическое пиратство осталось в прошлом... До поры до времени.\n\nНам удалось захватить сейф-модуль с их нажитой неправедным путём добычей. Среди прочих сокровищ в модуле обнаружился древний планшет — это невероятно, но его содержимое помогло нам лучше понять принцип работы таинственных L-врат."

 pirate.25.name: "Пиратская станция уничтожена"
 pirate.25.desc: "[pirate_slayers.GetName] уничтожает пиратскую станцию в системе [pirate_slayers.System.GetName&gen] и захватывает её сейф-модуль."

 #############################
 # Pretender Events
 #############################
 pretender.1.name: "[From.GetRegnalName] [From.GetAXX::умер<end_la>], не оставив наследников"
 pretender.1.desc_01: "[From.GetRegnalName] [From.GetAXX::покинул<end_a>] нас. На [Root.Capital.GetName&prep] объявлен семидневный траур. К несчастью, официальный наследник так и не был назван, и на трон претендуют двое.\n\nТитул [Root.GetRulerTitle] был получен сильнейшим из них, чьё новое имя — [Root.GetRulerName], но это не решило проблему."
 pretender.1.desc_02: "[From.GetRegnalName] больше не в этом скорбном мире, новое существование ожидает великого лидера впереди. К несчастью, Духи не дали нам ясных знаков и предзнаменований о том, кто должен стать преемником.\n\nПосле разгорячённых дебатов [Root.GetRulerName] становится новым лидером и принимает титул [Root.GetRulerTitle], но оппозиция по-прежнему сильна. Другие претенденты из числа высших иерархов церкви пытаются собирать голоса в свою поддержку."
 pretender.1.desc_03: "[From.GetRegnalName] [From.GetAXX::покинул<end_a>] нас, и правительство в растерянности, поскольку наследник так и не был назван. Официально преемником считается [Root.GetRulerName] благодаря широкой поддержке среди военных на [Root.Capital.GetName&prep], но ситуация остаётся нестабильной. [Root.GetRulerTitle] не является бесспорным лидером. Другой претендент собирает силы и готовится бросить вызов."
 pretender.1.desc_04: "Плоть слаба, и [From.GetRegnalName] [From.GetAXX::покинул<end_a>] нас. Наши алгоритмы не смогли вычислить оптимальную замену. Для поддержания эффективности системы был сделан случайный выбор. Теперь у нас вновь есть [Root.GetRulerTitle], чьё имя — [Root.GetRulerName] и чья задача — интерпретация непогрешимой воли Главного компьютера.\n\nОднако есть и те, кто сомневается, и те, кто считает себя более достойным такой чести."
 pretender.1.desc_05: "Прошлой ночью [From.GetAXX::наш правитель мирно скончался|||fem:наша правительница мирно скончалась] нас в своей постели. [From.GetRegnalName] [From.GetAXX::покинул<end_a>] нас, и вся [Root.GetPlanetMoon_rinfix&nom] [Root.GetName] горячо скорбит. Увы, официальный наследник так и не был назван, и это вызвало споры среди придворных.\n\n[Root.Capital.GetName] уже чествует коронованного преемника, чьё имя — [Root.GetRulerName], однако претенденты, заявляющие о своём дальнем родстве с умершим, уже начали соперничать за право носить титул [Root.GetRulerTitle]."
 pretender.1.tooltip: "Возникли новые фракции претендентов."

 henrik.710.desc: "Один [From.GetSpeciesName]. И некоторые [From.GetSpeciesNamePlural]."

