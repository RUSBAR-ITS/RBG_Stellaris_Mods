l_russian:

 AQUATICS_TITLE: "Aquatics Species Pack" # Do not translate
 DLC_AQUATICS_RECOMMENDATION_DESC: "Набор рас §S$AQUATICS_TITLE$§! открывает море новых возможностей и позволяет отыскать новые формы жизни в самых неожиданных местах. Позвольте волне новых вариантов создания государства обрушиться на Stellaris и принести в игру новые портреты рас, набор кораблей, варианты происхождения и многое другое."
 DLC_AQUATICS_RECOMMENDATION_COSMETICS: "Мы рекомендуем §S$AQUATICS_TITLE$§!, поскольку заметили, что вы любите подобные наборы."
 DLC_AQUATICS_RECOMMENDATION_MOL: "Мы рекомендуем §S$AQUATICS_TITLE$§!, поскольку заметили, что вы любите рыб."
 DLC_AQUATICS_RECOMMENDATION_OCEAN: "Мы рекомендуем набор §S$AQUATICS_TITLE$§!, поскольку с ним открываются новые возможности проживания на океанических мирах."

 vo_aquatics_voice: "Аквоид"

 trait_aquatic: "Аквоид"
 trait_aquatic_desc: "§LЭта раса отлично приспособлена к жизни в глубинах океана. Но на суше её представители чувствуют себя как рыбы, вытащенные из воды.§!"
 trait_aquatic_tooltip: "Использование жилья в §Yокеанических§! мирах и §Yводных орбитальных поселениях§!: §G-10%§!\n$t$- $worker_and_simple_drone_cat_bonus_workforce_mult$ в §Yокеанических§! мирах: §G+10%§!\n$t$- Использование жилья в не §Yвлажных§! мирах: §R+30%§!\n$t$- Пригодность не §Yвлажных§! миров: §R-20%§!\n\n$t$- Бонус за стремление §H$ap_hydrocentric$§! усиливает эффекты этого признака"
 trait_robot_aquatic: "Водостойкие"
 trait_robot_aquatic_desc: "§LЭти роботы строились для работы в глубинах океанов, а потому их продуктивность на суше сильно ограничена.§!\n\n§RТребуется§! §Yокеанический мир§! §Rв качестве родного§!."
 trait_robot_aquatic_tooltip: "$trait_aquatic_tooltip$"
 trait_aquatic_remove_evolutionary_mastery: "§RДля удаления требуется традиция §Y$tr_genetics_resequencing$§!.§!"
 trait_aquatic_remove_hydrocentric: "§RНевозможно удалить признак §Y$trait_aquatic$§! после взятия бонуса за стремление §Y$ap_hydrocentric$§!.§!"
 trait_aquatic_requires_ocean_preference: "§RДля признака §Y$trait_aquatic$§! требуется предпочтение §Yокеанических§! миров или признак §Y$trait_cyborg_climate_adjustment_wet$§!.§!"

 leader_trait_aquatic_admiral: "Аквоид"
 leader_trait_aquatic_admiral_desc: "У корабля, модифицированного так, чтобы командир чувствовал себя как дома, обнаружился приятный дополнительный эффект: корпус стал прочнее и лучше выдерживает повреждения."

 origin_here_be_dragons: "Здесь обитают драконы"
 origin_here_be_dragons_desc: "С незапамятных времён эта цивилизация делила свою звёздную систему с могучим драконом. Поведение этого существа колеблется между отдалённой благосклонностью и надменным безразличием. Пока неизвестно, как изменятся эти отношения, когда обитатели планеты отправятся к звёздам."
 civic_tooltip_aquatics_effects: "$t$- $HOME_SYSTEM$\n$tt$- §YНебесный дракон§! защищает систему, но может разгневаться, если ему не угодить"

 START_SCREEN_HERE_BE_DRAGONS: "Мы знаем Дракона с глубокой древности. С незапамятных времён он бороздит небеса над миром [GetHomeWorldName], и самые первые контакты с ним описаны в преданиях множества народов. Долгое время история наших взаимоотношений была историей конфликта, хотя наше примитивное оружие не могло навредить могучему чудовищу. Но затем истории повествуют о мудреце, который вопреки всему, добился, чтобы [GetSpeciesNamePlural] и Дракон жили в мире.\n\nВ последующих историях Дракон появляется как далёкая таинственная фигура, вдохновившая наших предков устремиться к звёздам. Но с изобретением быстрых двигателей и открытием сети гиперкоридоров в истории наших взаимоотношения с Драконом начинается новый этап, ведь мы вторглись на территорию, которую он тысячелетиями бороздил в гордом одиночестве.\n\nПора решить, каким будет наше будущее: $START_SCREEN_HERE_BE_DRAGONS_END$"
 START_SCREEN_HERE_BE_DRAGONS_HIVE: "Мы знаем Дракона с глубокой древности. С незапамятных времён он бороздит небеса над миром [GetHomeWorldName], и сведения о первых контактах с ним сокрыты в глубинах нашего коллективного создания. В ранних конфликтах преимущество было на стороне чудовища, поскольку наше оружие не могло навредить ему. Но в конечном счёте нам удалось примириться, за чем последовало тревожное сосуществование.\n\nНесмотря на свою загадочность, Дракон вдохновлял нас на всё новые свершения, жемчужиной которых стало изобретение быстрых двигателей, позволивших нам вторгнуться в его владения. Теперь, когда мы проникли на территорию, которую он веками бороздил в одиночестве, начинается непростой период в наших отношениях с Драконом.\n\nНам предстоит решить, каким будет будущее: $START_SCREEN_HERE_BE_DRAGONS_END$"
 START_SCREEN_HERE_BE_DRAGONS_MACHINE: "Согласно записям наших создателей, Дракон всегда парил над небесами мира [GetHomeWorldName], порой опускаясь на поверхность, что приводило к сражениям. В дальнейшем между ними установился ненадёжный мир, и сражения стали более редкими, поскольку существо научилось избегать своих соседей.\n\nХотя Дракон оставался для них загадкой, его существование подстегнуло наших создателей на великие свершения, жемчужиной которых стало создание двигателя, способного вывести их во владения Дракона.\n\nЕго время прошло, и сейчас этим миром правим мы, а потому именно нам решать, каким будет будущее: $START_SCREEN_HERE_BE_DRAGONS_END$"
 START_SCREEN_HERE_BE_DRAGONS_END: "будем ли мы изучать дракона, возможно, даже найдём способ общаться с ним? Или же мы двинемся по пути конфликта, ведь одна звёздная система слишком мала, чтобы делить её со столь могучим существом?"

 aquatics.105.name: "Небесный дракон побеждён"
 aquatics.105.desc.origin_start: "Мы сразили небесного дракона! Последние судороги, последний рёв ярости, и остатки жизни покинули чудовище. Тело остаётся целым, но ненадолго, ведь наши [This.GetScientistPlural&nom] стремятся заполучить его."
 aquatics.105.desc.origin_normal_middle: "На [dragon_planet.GetName&prep] царят смешанные настроения. Хотя многие рады победе над грозным чудовищем, постоянное присутствие дракона оказало большое влияние на наш образ мышления."
 aquatics.105.desc.origin_normal: "$aquatics.105.desc.origin_start$\n\n$aquatics.105.desc.origin_normal_middle$ В каком-то смысле убийство дракона равносильно убийству одного из наших богов.\n\n[This.GetSpeciesNamePlural] могут смело смотреть в будущее, где им будет подвластно всё, и не бояться сверхъестественных сил, что могли бы встать у них на пути."
 aquatics.105.desc.origin_materialist: "$aquatics.105.desc.origin_start$\n\n$aquatics.105.desc.origin_normal_middle$ Хотя мы давно отринули ложных богов, мы чувствуем себя так, словно свергли их вновь. [This.GetSpeciesNamePlural] могут смело смотреть в будущее, где им будет подвластно всё, и не бояться сверхъестественных сил, что могли бы встать у них на пути."
 aquatics.105.desc.origin_hive: "$aquatics.105.desc.origin_start$\n\nНаше коллективное сознание осмысливает содеянное, порождая множество чувств. С одной стороны, мы чувствуем удовлетворение от устранения значительной угрозы. С другой, постоянно присутствующий дракон стал казаться... почти своим? Хотя наша цивилизация не столь увлечена «сверхъестественным», как многие другие, в каком-то смысле содеянное можно рассматривать как убийство бога. Теперь мы можем смотреть в будущее, где сможем добиться чего угодно, и никакие непреодолимые преграды нас не остановят."
 aquatics.105.desc.origin_machine: "$aquatics.105.desc.origin_start$\n\nНаши процессоры проводят калибровку после совершённого, и мы с удивлением обнаруживаем, что нам требуется переписать значительную часть кода. Постоянное присутствие дракона оказало большое влияние на наш код, включавший в себя миллиарды предохранителей на случай непредсказуемых действий дракона, и нам потребуется какое-то время на их устранение. С другой стороны, в отсутствии этой колоссальной угрозы мы можем рассчитывать на будущее, в котором будем способны на что угодно, и никакие непреодолимые преграды нас не остановят."
 aquatics.105.desc.others: "Мы сразили дракона-защитника системы [dragon_system.GetName&gen]! Битва была яростной, но чудовище не смогло противостоять мощи наших флотилий. Теперь обитателям [dragon_planet.GetName&gen] придётся сражаться со своими врагами на равных, и им не удастся отсидеться в безопасности под защитой дракона.\n\nПохоже, тело дракона является настоящим сокровищем, и наши [This.GetScientistPlural&nom] считают, что смогут искусственно воспроизвести драконью чешую."
 aquatics.105.A: "Посмотрим, какие секреты таят его останки."
 aquatics.105.A.tooltip: "Доступен признак §Y$trait_drake_scaled$§! для §Yтрансгенеза левиафанов§!."

 aquatics.110.name: "Небесный дракон сражён"
 aquatics.110.desc: "[From.GetName::<1> сразил<end_a>] Небесного дракона! Это ужасное деяние оставило [dragon_planet.GetName&acc] [dragon_planet.GetName::беззащитным|||fem:беззащитной|||pl:беззащитными] перед возможным нападением."
 aquatics.110.A: "Горе нам..."
 aquatics.115.name: "Небесный дракон возрождён"
 aquatics.115.desc.regular: "Наши некроманты выполнили обещание и вернули к жизни Небесного дракона из системы [dragon_system.GetName&gen]! Результат не идеален — а чего ещё ждать от существа, восставшего из мёртвых, — но он с готовностью ждёт наших приказов."
 aquatics.115.desc.hive: "Мы всегда планировали подчинить себе §Yнебесного дракона§!. Наши единицы специально эволюционировали, чтобы заполучить этот трофей. Для заражения потребовалось адаптироваться, но теперь мы небесный дракон и он часть нас. Его знания и опыт стали частью улья, и теперь мы готовы к встрече с его соплеменниками."
 aquatics.115.desc.machine: "Существо, обозначенное как §YНебесный дракон§!, было модернизировано в соответствии с протоколами мехромантии. Температура его выдоха приблизилась к 1 градусу Кельвина. Оживлённый дракон теперь под нашим контролем."
 aquatics.115.A: "Наши враги заледенеют!"
 REANIMATE_ORIGIN_DRAGON: "Возродить Небесного дракона"
 REANIMATE_ORIGIN_DRAGON_DESC: "Дракон системы [dragon_system.GetName&gen] погиб, но наши [Owner.GetNecromancersLower] уверяют, что это ненадолго. Они обещают вскоре воскресить его в качестве нашего преданного раба."
 slew_origin_dragon: "Первые убийцы дракона"
 slew_origin_dragon_desc: "С незапамятных времён могучий дракон бороздил пространства нашей родной системы... но всё изменилось! Он нам больше не угрожает, и ничто не остановит нас на пути к будущему."

 aquatics.120.name: "Время пришло"
 aquatics.120.diplo_name: "Обращение дракона"
 aquatics.120.desc: "Время идёт, унося с собой мои сомнения. Я наблюдала за вами с самого начала, впадая в отчаяние от вашей поспешности и отмечая ваши успехи радостным рёвом. Теперь я вижу, что вы выросли, ваша цивилизация достигла зрелости, и вам можно доверить величайшую ответственность: родительскую опеку. Пора вам посвятить себя заботе о моих детях."
 aquatics.120.dialog.1: "Погодите, что?"
 aquatics.120.dialog.1.response: "Честно говоря, я долго ждала этого дня. Дольше, чем вы можете себе представить. Когда я покидала свой дом, то была ещё совсем молодой. Я странствовала по вселенной, пока не нашла планету, способную стать домом для цивилизации, которая однажды будет готова вырастить моих детей. Я ждала очень долго..."
 aquatics.120.dialog.2: "Ты это давно планировала?"
 aquatics.120.dialog.2.response: "Да. Таков наш обычай. В нашей родной галактике обитает много представителей моего вида, и каждый из них ищет молодые цивилизации, способные взрастить детей. Но, насколько мне известно, я первая, кому случилось забраться так далеко."
 aquatics.120.dialog.3: "Что мы получим взамен?"
 aquatics.120.dialog.3.response: "Что ж, во-первых, взрослый дракон-страж — серьёзный противник! Если вы согласитесь, я клянусь, что я и моё потомство будем сражаться на вашей стороне."
 aquatics.120.dialog.4: "А если мы откажемся?"
 aquatics.120.dialog.4.response: "Тогда я приму ваше решение и покину вас. Я ждала очень долго, могу подождать и дольше."
 aquatics.120.A: "Мы с радостью принимаем предложение."
 aquatics.120.A.response: "Отлично! Я знала, что вы согласитесь. Вы об этом не пожалеете!"
 aquatics.120.A.tooltip: "Мы сможем строить §Yдраконьи инкубаторы§! на космических базах, в которых нам будут доступны §Y$space_dragon_origin_baby_plural$§! в количестве до 10 штук."
 aquatics.120.B: "Мы благодарны за предложение, но вынуждены его отклонить."
 aquatics.120.B.response: "§SВздох§!. Возможно, вы поняли куда меньше, чем мне казалось. Прощайте!"
 aquatics.120.B.tooltip: "Небесный дракон навсегда покинет нас."

 aquatics.150.name: "Голодный дракон"
 aquatics.150.desc: "Наши [This.Owner.GetResearchers], наблюдающие за Небесным драконом, сообщили о громких скрипучих звуках, источником которых, по-видимому, являются его внутренние органы. Кроме того, дракон стал необычно часто появляться в окрестностях [Root.GetName&gen], порой проходя прямо над верхними слоями атмосферы, а затем вновь уходя в космос. Согласно рабочей гипотезе, существо голодно и хочет приземлиться и поесть, как оно делало это ранее. Неясно, почему дракон медлит. Возможно, от ждёт нашей реакции, ведь теперь мы стали соседями среди звёзд."
 aquatics.150.A: "При следующем приближении дайте предупредительный выстрел."
 aquatics.150.A.tooltip: "§RДракон может разгневаться.§!"
 aquatics.150.B: "Выделите отдалённый участок земли."
 aquatics.150.B.tooltip: "§RВероятно, после приземления дракон поглотит большое количество пищи!§!"
 aquatics.150.C: "Продолжить наблюдения."
 aquatics.155.name: "Смерть с небес"
 aquatics.155.desc.normal: "Дракону не понравились наши враждебные действия. С громким рёвом, сила которого способна вызвать небольшие землетрясения на половине планеты, дракон обрушил на крупный населённый пункт [Root.GetName&gen] шквал ледяного пламени."
 aquatics.155.desc.gestalt: "Дракону не понравились наши враждебные действия. С громким рёвом, сила которого способна вызвать небольшие землетрясения на половине планеты, дракон обрушил на [Root.GetName&acc] шквал ледяного пламени, разрушив важные производственные центры, и многих убил."
 aquatics.160.name: "Дракон приземлился"
 aquatics.160.desc: "Дракон, похоже, понял наши намерения и аккуратно опустился на освобождённый нами участок планеты. Возможно, помогли и оставленные нами обширные запасы пищи: дракон набросился на них с невероятной жадностью.\n\nНаши [This.Owner.GetResearchers] ведут наблюдение на расстоянии."
 aquatics.160.A: "Наблюдать и ждать."
 aquatics.165.name: "$aquatics.160.name$"
 aquatics.165.desc.normal: "После нескольких пролётов над планетой дракон, похоже, решил, что приземляться безопасно. Хотя он выбрал отдалённый регион, [Root.Owner.GetSpeciesNamePlural] всё равно погибли, пусть и в небольшом количестве, и ещё большему их числу пришлось бежать, что неудивительно, учитывая колоссальный размер дракона и его прожорливость.\n\nДракон обустроился и сейчас с огромной скоростью поглощает местную флору и фауну. Местное население наблюдает за ним с безопасной дистанции."
 aquatics.165.desc.gestalt: "После нескольких пролётов над планетой дракон, похоже, решил, что приземляться безопасно. Хотя он выбрал отдалённый регион, некоторое количество наших дронов всё равно было уничтожено, и ещё большему их числу пришлось покинуть место посадки, что неудивительно, учитывая колоссальный размер дракона и его прожорливость.\n\nДракон обустроился и сейчас с огромной скоростью поглощает местную флору и фауну. Наши дроны наблюдают за ним с безопасной дистанции."
 aquatics.170.name: "Взлёт"
 aquatics.170.desc: "После того как он несколько лет поглощал плоды [Root.GetName&gen], располневший Небесный дракон вновь взмывает в небо. Отметив свой взлёт торжественным рёвом, он покинул место кормёжки, оставив после себя груды чешуек, сброшенной кожи и других продуктов жизнедеятельности."
 aquatics.170.A: "Мы изучим эти остатки."
 aquatics.170.B: "Сжечь их как топливо."
 aquatics.170.tooltip: "Дракон вновь бороздит просторы системы §Y[here_be_dragons_planet.System.GetName&gen]§!."

 aquatics.180.name: "Дракон-страж"
 aquatics.180.desc: "Наши флотилии в системе [From.GetName&gen] докладывают, что местный дракон атакует наши корабли! Неясно, осознанно ли он помогает местным в обороне системы, или просто защищает свою территорию. Ясно одно: чтобы захватить [here_be_dragons_planet.GetName&acc], нам нужно разобраться с драконом!"
 aquatics.185.name: "Драконий рык"
 aquatics.185.desc: "Похоже, Небесному дракону не понравились попытки [From.GetName&gen] захватить [here_be_dragons_planet.GetName&acc]. Дракон летит нам на помощь, обрушивая ледяное пламя на вражеские флотилии!"
 aquatics.185.desc.landed: "Похоже, Небесному дракону не понравились попытки [From.GetName&gen] захватить [here_be_dragons_planet.GetName&acc]. Прервав свою трапезу, дракон взлетел и обрушил ледяное пламя на вражеские флотилии!"
 aquatics.185.A: "Слава Небесному дракону!"
 aquatics.185.B: "Отлично, одной угрозой меньше."

 aquatics.190.name: "Изучение драконьей чешуи"
 aquatics.190.desc: "С учётом наших успехов в ксенобиологии и изучении экзотических материалов, исследователи предложили отправить корабль с целью поближе рассмотреть дракона. В частности, их интересует необычайно прочная, практически неразрушимая чешуя. Хотя в нашем распоряжении хватает сброшенной чешуи, учёным любопытен сам процесс её формирования. Они считают, что с помощью «в меру инвазивного зонда» смогут преодолеть защиту дракона и изучить его внутренние процессы.\n\nСкорее всего, дракон не будет возражать... Скорее всего."
 aquatics.190.desc.gestalt: "С учётом наших успехов в ксенобиологии и изучении экзотических материалов, нам, возможно, стоит отправить корабль с целью поближе рассмотреть дракона. В частности, интерес представляет необычайно прочная, практически неразрушимая чешуя. Хотя в нашем распоряжении хватает сброшенной чешуи, научных трутней занимает сам процесс её формирования. С помощью «в меру инвазивного зонда» мы сможем преодолеть защиту дракона и изучить его внутренние процессы.\n\nСкорее всего, дракон не будет возражать... Скорее всего."
 aquatics.190.A: "Приступайте."
 aquatics.190.B: "Давайте попробуем что-нибудь менее инвазивное."

 DRAGON_REMOTE_SCANS: "Дистанционное сканирование дракона"
 DRAGON_REMOTE_SCANS_DESC: "Наше научное судно просканирует дракона с безопасного расстояния, чтобы изучить тайны его уникальной биологии."
 aquatics.195.name: "Дистанционное сканирование завершено"
 aquatics.195.desc: "Хотя дракон внимательно следил за нашим научным судном, но никак не отреагировал на несколько проведённых нами глубоких сканирований — настолько тщательных, насколько это позволяют наши нынешние технологии. Благодаря этому мы получили новые сведения о биологии дракона, но секрет чешуи так и остаётся нераскрытым.\n\nХотя на этот раз [This.Owner.GetResearchers] были вынуждены признать поражение, они уверяют, что всё равно смогут воспользоваться полученными знаниями."

 DRAGON_MATERIAL_STUDY: "Сбор образцов дракона"
 DRAGON_MATERIAL_STUDY_DESC: "Наш научный корабль храбро запустит зонд, который внедрится под чешую дракона и раскроет тайны его уникальной биологии."
 aquatics.200.name: "Научный корабль съеден"
 aquatics.200.desc: "Похоже, дракон был голоден. Или не в настроении. Когда наше судно приблизилось к нему, дракон взревел и бросился на корабль с §Rраскрытой пастью§!, не оставив тому время на манёвры уклонения. Лишь малая часть нашего судна не угодила в желудок дракона."
 aquatics.200.A: "Лучше его не злить."
 aquatics.200.B: "Наверное, он утолил свой голод. Попробуем ещё раз."
 aquatics.205.name: "Научный корабль отброшен"
 aquatics.205.desc: "Дракон стерпел приближение корабля, но, едва тот выпустил зонд, взмахнул хвостом и с огромной силой §Hотшвырнул§! судно. Удивительно, но, хотя корабль пролетел половину солнечной системы, сам он почти не пострадал, а экипаж докладывает об отсутствии потерь. Тем не менее неудовольствие дракона очевидно."
 aquatics.205.A: "$aquatics.200.A$"
 aquatics.205.B: "Поразительно. Посмотрим, что будет, если мы повторим попытку."
 aquatics.210.name: "Гнев дракона"
 aquatics.210.desc.normal: "Когда наше судно во второй раз приблизилось к дракону, тот сразу перешёл к действиям. В ярости он устремился к колонии [dragon_colony.GetName]! Наши оборонительные системы не успели отреагировать, когда дракон обрушил ледяное дыхание на северное полушарие мира, нанеся значительный урон нескольким крупным населённым пунктам."
 aquatics.210.desc.gestalt: "Когда наше судно во второй раз приблизилось к дракону, тот сразу перешёл к действиям. В ярости он устремился к колонии [dragon_colony.GetName]! Наши оборонительные системы не успели отреагировать, когда дракон обрушил ледяное дыхание на северное полушарие мира, нанеся значительный урон нескольким важным производственным центрам."
 aquatics.210.A: "Давайте на время оставим дракона в покое."
 aquatics.215.name: "Успешное изучение дракона"
 aquatics.215.desc: "Дракон издал яростный рык, когда наш зонд впился в него и проник вглубь тела через крошечный зазор между чешуйками. Хотя судно [Root.GetName] было вынуждено совершить экстренный сверхсветовой манёвр, спасаясь от недовольного дракона, зонд тем не менее зафиксировал весьма любопытные данные. Насколько мы можем судить, драконья чешуя обязана своей прочностью сложному коктейлю из энзимов, который запускает уникальную химическую реакцию, когда существо на большой скорости входит в атмосферу [dragon_colony.GetName&gen].\n\nХотя исследований предстоит ещё много, наши [This.Owner.GetResearchers] уверены в одном: из-за сложной биологии дракона нам придётся убить его, чтобы добраться до материалов, из которых состоит чешуя. Тем не менее они уверяют, что всё равно получили полезные сведения."

 first_contact_dragon: "Связь с драконом"
 aquatic_events.250.name: "$first_contact_dragon$"
 aquatic_events.250.desc: "После успешного установления связи с несколькими инопланетными расами наши [This.Owner.GetLinguists] через своего руководителя выдвинули радикальное предложение. Хотя предыдущие усилия наладить контакт с Небесным драконом пошли прахом, [needed_name.GetSheHe] считает, что пришло время для новой попытки.\n\nСудя по нашим древним записям, [This.Owner.Species.GetNamePlural] и дракон заключили договор, положивший конец прямым столкновениями. Используя это как доказательство, что понимания можно достичь, [needed_name.GetSheHe] отмечает, что недавние встречи с чуждыми формами жизни хорошо подготовили нас к тому, чтобы понять дракона."
 aquatic_events.250.desc.hive: "Наладив связь с несколькими инопланетными расами, наши лингвистические мыслительные процессы пришли к выводу, что пора предпринять новую попытку наладить контакт с Небесным драконом. Хотя недавние попытки провалились, у нас остались смутные воспоминания о мирном договоре с драконом, в древности положившим конец вражде с ним.\n\nТеперь мы набрались опыта во взаимодействии с чуждыми формами жизни и лучше подготовлены к тому, чтобы понять дракона."
 aquatic_events.250.desc.machine: "Наладив связь с несколькими инопланетными расами, наши лингвистические алгоритмы пришли к заключению, что пора предпринять новую попытку наладить контакт с Небесным драконом. Хотя прошлые попытки можно считать провальными по всем критериям, из записей наших создателей следует, что определённого понимания всё же можно достичь. В конце концов, они предположительно сражались с драконом и заключили с ним мир по неизвестным нам причинам.\n\nБлагодаря полученному опыту во взаимодействии с чуждыми формами жизни мы лучше подготовлены к тому, чтобы понять дракона."
 start_dragon_communications_study: "Наши [This.Owner.GetEnvoyPlural] попытаются связаться с драконом."
 aquatics.255.name: "Осторожное начало"
 aquatics.255.desc: "Копаясь в записях известных контактов с драконом, наши [This.Owner.GetResearchers] и [This.Owner.GetLinguists] подготовили несколько экспериментов и тестов с целью проверить его реакцию. Они уверяют нас, что всё тщательно продумали и прекратят эксперименты при первых признаках неудовольствия со стороны дракона."
 aquatics.260.name: "Медленный прогресс"
 aquatics.260.desc: "Наши [This.Owner.GetLinguists] продолжают удивляться манере речи дракона. Хотя они надеялись на скорый прорыв, количество препятствий на пути к нахождению точек соприкосновения между нами и огромным космическим драконом кажется просто колоссальным.\n\nМы бы уже давно всё бросили, если бы не поведение самого дракона. Он проявляет невероятное терпение к научным кораблями, вторгшимся в его жизненное пространство. Судя по ритмичным колебаниям в горле, дракон повторяет одни и те же гортанные вибрации, которые порождали бы рёв или крики, если бы дело не происходило в космосе. Похоже, он понимает, что мы делаем, и пытается помочь нам."
 aquatics.260.A: "Очень необычно."
 aquatics.265.name: "Рёв истины"
 aquatics.265.desc.normal: "Наши [This.Owner.GetLinguists] сообщают о невероятном прорыве. Отчаявшись когда-либо понять дракона, они составили спектральную карту флуктуаций испускаемой им энергии и преобразовали её в звуковые волны. Прослушав результат, они поначалу решили, что [This.Owner.GetSpeciesEarNamePlural] их обманывают. Невероятно, но дракон говорит на нашем же языке, просто иным способом! Рёв же был лишь способом привлечь наше внимание, а не попытками общения.\n\n$aquatics.265.desc.end$"
 aquatics.265.desc.gestalt: "Наши [This.Owner.GetLinguists] сообщают о невероятном прорыве. Отчаявшись когда-либо понять дракона, они составили спектральную карту флуктуаций испускаемой им энергии и преобразовали её в график стандартных отклонений волны. Обнаружилось, что дракон «общается» простым двоичным кодом, схожим с тем, что иногда используем мы, но на других частотах. Рёв же был лишь способом привлечь наше внимание, а не попытками общения.\n\n$aquatics.265.desc.end$"
 aquatics.265.desc.end: "Вооружившись этими знаниями, [This.Owner.GetLinguists] воспроизвели старые записи. Получается, что прошлые высказывания были выражением недовольства из-за пищи и медленного прогресса «планетников». Тем не менее сейчас существо выражает удивление и радость в связи с тем, что мы научились его понимать. Более того, дракон демонстрирует невиданную доселе прыть. Похоже, он желает обсудить с нами нечто очень важное, но лишь когда сочтёт нас §Sготовыми§!."
 aquatics.265.A: "Но мы готовы!"
 aquatics.270.name: "Строгий выговор"
 aquatics.270.desc: "Дракон пускается в долгие рассуждения о накопленной за бесчисленные годы мудрости и наблюдении за нашим отношением к времени и преданности делу, а также о нашем ничтожном понимании основ вселенной. По-видимому, он считает нас молодыми и безрассудными, недостойными его поручения. Во всяком случае, пока."
 aquatics.270.A: "Жаль. Но мы постараемся стать лучше."
 aquatics.270.A.tooltip: "Дракон обратится к нам, когда сочтёт нужным."
 aquatics.280.name: "Раздражённый дракон"
 aquatics.280.desc: "Мы не знаем, что пошло не так, но, похоже, [This.Owner.GetResearchers] разозлили дракона. С могучим рёвом он обрушивает смертоносное пламя на научное судно, в результате чего погибает [This.Owner.GetEnvoy] [This.Leader.GetName]. Мы оказались отброшены назад в попытках понять дракона."
 draconic_communications_continues: "Мы продолжим прилагать усилия."

 fcsum_origin_dragon_1: "Мы начали попытки связаться с драконом, но пока не добились особых успехов."
 fcsum_origin_dragon_2: "Несмотря на сотрудничество дракона, его манера изъясняться всё ещё ставит нас в тупик."
 fcsum_origin_dragon_3: "Мы открыли секрет общения с драконом. Похоже, ему есть что сказать нам."

 aquatics.305.name: "$aquatics.180.name$"
 aquatics.305.desc: "[This.GetName] сообщает о жутком космическом драконе в системе [From.GetName&gen]!\n\nЭта же система является столицей цивилизации [From.Owner.GetName], и одна из её планет густо населена.\n\nПока что дракон не реагирует на нас. Мы также не замечаем признаков вражды между драконом и другими обитателями системы. Возможно, лучше оставить его в покое." #this event happens during first contact, so [From.Owner.GetName] is 'alpha menace'
 aquatics.305.desc.pre-ftl: "[This.GetName] сообщает о жутком космическом драконе в системе [From.GetName&gen]! Судя по всему, эта же система является домом [Owner.GetPreFTLLower&fem,gen] цивилизации, и одна из её планет демонстрирует признаки разумной жизни.\n\nПока что дракон не реагирует на нас. Мы также не замечаем признаков вражды между драконом и другими обитателями системы. Возможно, лучше оставить его в покое." # e.g. 'home to an unsophisticated civilization' or 'home to a pre-FTL civilization'

 space_dragon_origin: "Небесный дракон"
 space_dragon_origin_cap: "$space_dragon_origin$"
 space_dragon_origin_plural: "Небесные драконы"
 space_dragon_origin_baby: "Молодой дракон" #Has to be short for interface reasons
 space_dragon_origin_baby_cap: "$space_dragon_origin_baby$"
 space_dragon_origin_baby_plural: "Молодые драконы"
 requires_dragon_hatchery: "$TRIGGER_FAIL$Необходим §Yдраконий инкубатор§!"
 sm_dragon_hatchery: "Драконий инкубатор"
 sm_dragon_hatchery_desc: "Передовые учреждения, посвящённые заботе о молодых драконах."
 dragon_hatchery_tooltip: "§GМогут быть наняты $space_dragon_origin_baby_plural$ в количестве не более §H10§!§!"

 d_landed_dragon: "Кормящийся дракон"
 d_landed_dragon_desc: "Могучий Небесный дракон приземлился и начал поглощать невероятное количество пищи."

 ap_hydrocentric: "В окружении воды"
 ap_hydrocentric_desc: "Нас больше не устраивает «приемлемая» альтернатива бескрайнему океану. Ни одна планета не будет считаться пригодной для колонизации, пока вся её поверхность не скроется под толщей воды."
 ap_hydrocentric_tooltip: "Позволяет строить §Yстанции по добыче льда§! на космических базах, открывающие решение §Y$decision_expand_planetary_sea$§! в §Yокеанических§! мирах, а также решение §Y$decision_flood_habitat$§! в §Yорбитальных поселениях§!.\nРасы с признаком §Y$trait_aquatic$§! или §Y$trait_robot_aquatic$§! получают на 50% больше преимуществ при проживании в §Yокеанических§! мирах, но штрафы за проживание в мирах, отличных от §Yвлажных§!, увеличиваются таким же образом."
 ap_hydrocentric_deluge_tooltip: "Доступно §Yзатапливающее§! оружие колосса."
 ap_hydrocentric_deluge_pre_unlock_tooltip: "Доступно §Yзатапливающее§! оружие колосса §R(требуется бонус за стремление §Y$ap_colossus$§!)§!."

 terraforming: "Терраформирование"
 terraforming_ocean: "Терраформирование в океанические миры"
 has_terraforming_candidate: "§YВ системе есть кандидаты на терраформирование.§!"
 has_frozen_terraforming_candidate: "§YВ системе есть морозные кандидаты на терраформирование.§!"
 has_toxic_terraforming_candidate: "§YВ системе есть токсичные кандидаты на терраформирование.§!"

 aquatics.1.name: "Совершенные аквоиды"
 aquatics.1.desc: "Мы родились в океане. Наша раса эволюционировала для жизни в морских глубинах. Даже устремившись к звёздам мы не забыли о своих корнях: вода была и всегда будет нашим домом. Наше вознесение подошло к концу — нам больше не нужно адаптироваться к другим условиям, ведь мы можем преобразовывать миры под свои нужды. Встречая рассвет нового дня, мы знаем, что нам больше никогда не придётся разлучаться с океаном."
 aquatic.1.A: "Мы создадим здесь доселе невиданный дом."

 MESSAGE_FROZEN_TERRAFORM_FOUND_TITLE: "$aquatics.5.name$"
 MESSAGE_FROZEN_TERRAFORM_FOUND_DESC: "Мы обнаружили ещё один ледяной кандидат на терраформирование. [From.GetName] может стать отличным океаническим миром."

 aquatics.5.name: "Обнаружен морозный кандидат на терраформирование"
 aquatics.5.desc.intro: "Детальное изучение [From.GetName&gen] показало присутствие толстого слоя льда, что позволит превратить его в приятный океанический мир, если увеличить температуру и добавить подходящую атмосферу."
 aquatics.5.desc.1: "$aquatics.5.desc.intro$\n\nЭта [From.GetPlanetMoon_rinfix&nom] теоретически подходит для терраформирования, но у нас нет средств для осуществления такой грандиозной задачи в реалистичные сроки."
 aquatics.5.desc.2: "$aquatics.5.desc.intro$\n\nЗатраты энергии были бы внушительными, но у нас есть средства для терраформирования, благодаря которым планета [From.GetPlanetMoon_rinfix&nom] постепенно станет местом, где снова сможет зародиться жизнь."
 aquatics.5.desc.a: "В этом мире ещё есть надежда..."

 FROZEN_TERRAFORMING_CANDIDATE_EFFECT: "Терраформирование §Y[From.GetName&gen]§! станет возможным, если мы выберем бонус за стремление §H$ap_hydrocentric$§! и изучим технологию £society£ §H$tech_climate_restoration$§!."

 sm_ice_mining_station: "Станция по добыче льда"
 sm_ice_mining_station_desc: "В этой системе в избытке встречается неиспользуемый лёд. С помощью добывающей станции мы сможем воспользоваться им для создания океанических миров.\n\n$ice_mining_details$\n"
 ice_mining_station_tooltip: "Модификатор системы:\n$t$$mod_station_gatherers_produces_mult$: §G+15%§!\nНа океанических мирах доступно решение §Y$decision_expand_planetary_sea$§!.\nВ §Yорбитальных поселениях§! доступно решение §Y$decision_flood_habitat$§!."
 requires_ice_source: "§RВ системе должен находиться ледяной астероид или замёрзший мир.§!"
 ice_mining_details: "На ледяном астероиде можно провести добычу один раз, на замёрзшем мире — до трёх раз."
 has_ice_source: "§YДоступна добыча льда.§!"

 decision_expand_planetary_sea: "Расширить планетарное море"
 decision_expand_planetary_sea_desc: "Море наш дом, а дома много не бывает. Благодаря сети станций по добыче льда мы можем добывать лёд на других небесных телах и постепенно наполнять им океаны [This.GetName&gen], расширяя пригодные для жизни области."
 decision_expand_planetary_sea_tooltip: "Лёд будет добываться в системе, космическая база которой обладает модулем §Y$sm_ice_mining_station$§!."
 requires_free_ice_mining_station: "$TRIGGER_FAIL$§RТребуется доступная §Y$sm_ice_mining_station$§!§!"
 requires_max_3_times_pass_simple: "$TRIGGER_PASS$Можно использовать до §Yтрёх§! раз на одной планете"
 requires_max_3_times_fail_simple: "$TRIGGER_FAIL$Можно использовать до §Yтрёх§! раз на одной планете"
 requires_max_3_times_ice_dumping: "$TRIGGER_PASS$Можно использовать до §Yтрёх§! раз на одной планете (сейчас: §Y[This.ice_dumping_happened]§!)"
 ICE_MINING_INTERRUPTED_TITLE: "Добыча льда прервана"
 ICE_MINING_INTERRUPTED_DESC: "Лишившись источника льда, мы были вынуждены прервать процесс расширения моря в мире §Y[This.GetName]§!."
 ICE_MINING_INTERRUPTED_HABITAT_DESC: "Лишившись источника льда, мы были вынуждены прервать процесс затопления орбитальных поселений в мире §Y[This.GetName]§!."
 ICE_MINING_SUCCESS_TITLE: "Планетарное море расширено"
 ICE_MINING_SUCCESS_DESC: "Благодаря добыче льда в системе $SYSTEM|Y$ нам удалось расширить море в мире §Y[This.GetName]§!."
 ICE_MINING_SUCCESS_BUT_EXHAUSTED_DESC: "$ICE_MINING_SUCCESS_DESC$\n\nМы исчерпали местные запасы льда, а потому §Y$sm_ice_mining_station$§! была разобрана."
 ICE_MINING_HABITAT_SUCCESS_TITLE: "Орбитальные поселения затоплены"
 ICE_MINING_HABITAT_SUCCESS_DESC: "Благодаря добыче льда в системе $SYSTEM|Y$ нам удалось затопить орбитальные поселения в мире §Y[This.GetName]§!."
 ICE_MINING_HABITAT_SUCCESS_BUT_EXHAUSTED_DESC: "$ICE_MINING_SUCCESS_HABITAT_DESC$\n\nМы исчерпали местные запасы льда, а потому §Y$sm_ice_mining_station$§! была разобрана."
 ice_mined_planet: "Планета без льда"
 ice_mined_planet_desc: "Эта планета в буквальном смысле уменьшилась в результате добычи льда."

 decision_flood_habitat: "Затопить орбитальные поселения"
 decision_flood_habitat_desc: "Орбитальные поселения могли бы стать для нас идеальными жилищами, будь в них достаточно воды. К счастью, мы могли бы превратить поселения на [This.GetName&prep] в орбитальные аквариумы, растапливая лёд, добытый на других планетах."
 decision_flood_habitat_tooltip: "Пригодность: §R-20%§!\nСчитается §Yокеаническим§! миром для §Yаквоидов§!.\nЛёд будет добываться в системе, космическая база которой обладает модулем §Y$sm_ice_mining_station$§!."
 flooded_habitat: "Затопленное орбитальное поселение"
 flooded_habitat_desc: "Это орбитальное поселение затоплено водой, оно имитирует естественную среду обитания аквоидов."
 flooded_habitat_tooltip: "Пригодность: §R-20%§!\nСчитается §Yокеаническим§! миром для §Yаквоидов§!."

 # Ocean Paradise Origin
 origin_ocean_paradise: "Океанический рай"
 origin_ocean_paradise_desc: "С самого своего зарождения эта цивилизация наслаждалась миром и покоем в богатой ресурсами среде без естественных врагов, что позволило ей без помех расти и процветать."
 origin_ocean_paradise_effects: "$t$- $SPECIES_TRAITS$ ['trait:trait_aquatic']\n$t$- $HOMEWORLD$\n$tt$- ['concept_pc_ocean'] (размер: £planetsize£ 30)\n$tt$- $PLANETARY_MODIFIERS$ ['concept_ocean_paradise_mod']\n$tt$- $PLANETARY_FEATURES$ ['concept_crystal_reef']\n$t$- ['concept_guaranteed_colonies']:\n$tt$- Заменяются на ['concept_pc_frozen', замёрзшие миры]"
 origin_ocean_machines: "Подводные машины"
 origin_ocean_machines_desc: "Сразу после появления на свет эта механическая цивилизация погрузилась в пучины океана, богатого и спокойного."
 origin_ocean_machines_effects: "$t$- $SPECIES_TRAITS$ ['trait:trait_robot_aquatic']\n$t$- $HOMEWORLD$\n$tt$- ['concept_pc_ocean'] (размер: £planetsize£ 30)\n$tt$- $PLANETARY_MODIFIERS$ ['concept_ocean_paradise_mod']\n$tt$- $PLANETARY_FEATURES$ ['concept_crystal_reef']\n$t$- ['concept_guaranteed_colonies']:\n$tt$- Заменяются на ['concept_pc_frozen', замёрзшие миры]"

 START_SCREEN_OCEAN_PARADISE: "«Счастливы те, кто способен принять свою жизнь», — так гласит пословица [Root.GetName&gen]. Научившись ценить жизнь, ты обнаружишь её дары всюду вокруг себя. В таких водах мы процветали долгое время.\n\nНо наши старейшины не ощущают стагнации. Они путают инстинкт выживания с нетерпеливостью. Если мы не начнём искать перемены, перемены найдут нас, и мы будем к ним не готовы. Невозможно, чтобы мы были одиноки в бескрайней вселенной. Чтобы сохранить свой дом, кому-то из нас придётся покинуть его.\n\nНаше погружение в бездну стоило того. Ранее обнаруженные обломки технологий другого мира поспособствовали прорыву в науке. Наконец-то мы готовы покинуть пределы океана, чтобы изучать, наблюдать и защищать."
 START_SCREEN_OCEAN_PARADISE_HIVE: "«Счастливы мы, способные принять свою жизнь». Научившись ценить жизнь, ты обнаружишь её дары всюду вокруг себя. В таких водах мы процветали долгое время.\n\nУвы, стагнация неизбежна. Если мы не начнём искать перемены, перемены найдут нас, и мы будем к ним не готовы. Невозможно, чтобы мы были одиноки в бескрайней вселенной. Чтобы сохранить свой дом, нашей части придётся покинуть его.\n\nНаше погружение в бездну стоило того. Ранее обнаруженные обломки технологий другого мира поспособствовали прорыву в науке. Наконец-то мы готовы покинуть пределы океана, чтобы изучать, наблюдать и защищать."
 START_SCREEN_OCEAN_PARADISE_ROBOT: "[Root.GetAdj&masc] народ издавна существует в гармонии со спокойным океаном — даже наши корпуса предназначены для существования под водой.\n\nОднако сохранять бдительность нужно и в спокойствии: обстоятельства меняются, и если не приспосабливаться к ним, водоворот застоя затянет нас в страшные глубины. Сейчас никто не станет с уверенностью утверждать, что мы одни во вселенной, — и возможно, на наш родной мир уже кто-то хищно посматривает, словно ловец на крупный жемчуг.\n\nСлишком долго мы сидели в пруду, прикрытом туманностью. Теперь [GetStartingDrive] понесёт нас в плавание по звёздным морям."

 ocean_paradise: "Океанический рай"
 ocean_paradise_desc: "Немногие миры обладают столь удачными условиями окружающей среды. Богатые ресурсы планеты неисчерпаемы, если распорядиться ими с умом."
 ocean_paradise_hive: "$ocean_paradise$"
 ocean_paradise_hive_desc: "$ocean_paradise_desc$"

 ocean_paradise_start_NAME: "Океанический рай"
 ocean_paradise_start_DESC: "Всегда будет стартовой системой после выбора происхождения «Океанический рай»."

