 building_coordinated_fulfillment_center_1: "Центр координированного обслуживания"
 building_coordinated_fulfillment_center_1_plural: "Центр координированного обслуживания"
 building_coordinated_fulfillment_center_1_desc: "Хотя некоторые могут счесть практики, используемые в этом центре, опасными и недальновидными, спорить с их продуктивностью невозможно."
 building_coordinated_fulfillment_center_2: "Универсальный центр согласования продуктивности" #N.B. Corporate speak, doesn't need to mean anything...
 building_coordinated_fulfillment_center_2_desc: "Благодаря неустанной обработке числовой информации и скрупулёзным исследованиям можно вывести продуктивность промышленности на ранее недостижимый уровень. Даже если в результате остаётся не так уж много времени на прочую деятельность, вроде размножения или заботы об окружающей среде."
 building_coordinated_fulfillment_center_tooltip: "§RЭтот мир будет нещадно эксплуатироваться. Со временем он превратится в опустошённый.§!"

 civic_tooltip_not_relentless_industrialists: "НЕТ гражданской модели ['concept_industrialist_civics']"
 concept_industrialist_civics: "Неудержимые промышленники"
 concept_industrialist_civics_desc: "К гражданским моделям группы «$concept_industrialist_civics$» относятся:\n- ['civic:civic_relentless_industrialists']\n- ['civic:civic_corporate_relentless_industrialists']"

 toxoids.5.name: "Непомерная эксплуатация [Root.GetName&gen]"
 toxoids.5.desc: "Эксплуатация [Root.GetName&gen] привела к значительным и, возможно, необратимым последствиям для окружающей среды. Промышленное загрязнение привело к радикальным климатическим изменениям из-за неконтролируемых выбросов парниковых газов, а из-за неконтролируемых утечек радиации значительные области стали непригодны для жизни без специальных средств защиты.\n\nНастал переломный момент. Если мы ничего не изменим и не начнём бороться с нашим влиянием на экологию планеты, то катастрофы не избежать. Нас ждёт негостеприимный и радиоактивный мир в стиле самых страшных прогнозов о конце света, с бурлящими морями и безжизненными пустошами."

 relentless_industrialists_situation: "Экологическая деградация [Target.GetName&gen]"
 relentless_industrialists_situation_type: "Экологическая деградация"
 relentless_industrialists_situation_desc: "Если ничего не предпринять, эксплуатация ресурсов [Target.GetName&gen] быстро превратит его в опустошённый мир. Необходимо определиться с решением этой проблемы: стоит ли нам изменить подход, или же подобный исход является приемлемой либо даже предпочтительной ценой промышленного развития?"
 relentless_industrialists_situation_monthly_change_tooltip: "$situation_monthly_change_tooltip_approaches_dependent$\nКроме того, реформа правительства с отказом от гражданской модели §Y$civic_relentless_industrialists$§! отменит этот инцидент."
 approach_take_no_action: "Ничего не предпринимать"
 approach_climate_do_nothing_tooltip: "Этот мир превратится в §Yопустошённый§!. Наши §Y$building_coordinated_fulfillment_center_1_plural$§! будут оказывать ещё большие эффекты."
 approach_cleanup_efforts: "Попытаться устранить последствия"
 approach_climate_cleanup_efforts_tooltip: "Этот мир НЕ превратится в §Yопустошённый§!. Но наши §Y$building_coordinated_fulfillment_center_1_plural$§! теперь будет требовать $r_unity_acc$ для содержания."
 approach_embrace_change: "Принять изменения"
 approach_climate_embrace_change_tooltip: "Мы изучим процесс, чтобы найти безопасный способ превращения миров в §Yопустошённые§!. Штрафы к росту поселений, которые накладывают §Y$building_coordinated_fulfillment_center_1_plural$§!, будут снижены. Откроются соответствующие возможности для §Yтерраформирования§!."
 approach_become_environmentalist: "Упор на защиту окружающей среды"
 stage_cleanup: "Попытки устранить последствия"
 stage_cataclysm_1: "Климатический сдвиг"
 stage_cataclysm_2: "Необратимый катаклизм"
 relentless_industrialists_situation_cleanup_tooltip: "Нашим мирам больше не грозит опасность стать §Yопустошёнными§!.\nНаши §Y$building_coordinated_fulfillment_center_1_plural$§! теперь требуют значительных затрат £unity£ §Yединства§! на содержание."
 relentless_industrialists_situation_completion_tooltip: "§Y[Target.GetName]§! станет §Yопустошённым миром§!.\nВ зависимости от выбранного §Yподхода§! могут появиться дополнительные эффекты."
 relentless_industrialists_situation_locked_tooltip: "§RСлишком поздно менять подход к инциденту.§!"

 toxoids.10.name: "Достигнут переломный момент"
 toxoids.10.desc: "Экологический ущерб [Target.GetName&dat] стал необратимым. Никакие действия не в силах остановить расширение радиоактивных пустошей. Увы, население восприняло эти новости без особого энтузиазма, и митингующие толпы осуждают действия наших властей и заявляют, что наша неудержимая жажда наживы «всё разрушила»."
 toxoids.10.A: "Жаль, что они не видят наших приоритетов."
 toxoids.10.A.tooltip: "Мы получим штрафы к стабильности, пока наши планеты превращаются в опустошённые миры."

 toxoids.15.name: "$toxoids.10.name$"
 toxoids.15.desc: "Экологический ущерб [Target.GetName&dat] стал необратимым. Никакие действия не в силах остановить расширение радиоактивных пустошей. Население отреагировало дружным безразличием, ещё глубже уйдя в работу в отчаянных попытках выполнить трудовые нормы на следующий месяц..."
 toxoids.15.A: "Как и положено."

 toxoids.25.name: "Во имя прогресса"
 toxoids.25.desc: "Преображение завершено: [Target.GetName] теперь представляет собой безжизненные радиоактивные пустоши. Но куда важнее то, что наша промышленность уцелела и мы готовы выполнить поставленные задачи. А остальное неважно."
 toxoids.25.A: "Это допустимая цена."
 toxoids.25.A.tooltip: "Наши §Y$building_coordinated_fulfillment_center_1_plural$§! теперь обеспечивают ещё лучшие бонусы к промышленности."

 toxoids.30.name: "Знание о преобразовании"
 toxoids.30.desc: "Преображение завершено: [Target.GetName] теперь представляет собой безжизненные радиоактивные пустоши. Наши [Owner.GetResearchers] изучили процесс и обещают, что смогут безопасно воспроизвести его на других мирах, хотя некоторые с опаской относятся к этому знанию, не понимая, зачем оно нам нужно."
 toxoids.30.desc.thisisfine: "Преображение завершено: [Target.GetName] теперь представляет собой безжизненные радиоактивные пустоши. Наши [Owner.GetResearchers] изучили процесс и обещают, что смогут безопасно воспроизвести его на других мирах, если потребуется."
 toxoids.30.A: "Знание — сила."
 toxoids.30.A.tooltip: "Теперь мы можем терраформировать планеты в §Yопустошённые миры§!."

 toxoids.35.name: "Мир [Target.GetName] восстановлен"
 toxoids.35.desc: "Наш проект по очистке [Target.GetName&gen] спас его от неминуемой катастрофы. Климат вернулся в норму, а мы получили достаточно знаний, чтобы предотвращать подобное в будущем, не снижая наших амбициозных производственных целей. Впрочем, всё же придётся выделять часть ресурсов для борьбы с последствиями..."
 toxoids.35.A: "Всё хорошо, что хорошо кончается."
 toxoids.35.A.tooltip: "Наши §Y$building_coordinated_fulfillment_center_1_plural$§! теперь требуют £unity£ $unity$ на содержание."

 TOMB_WORLD_FROM_INDUSTRY_MESSAGE_TYPE_TITLE: "Безжалостная эксплуатация"
 TOMB_WORLD_FROM_INDUSTRY_MESSAGE_TYPE_DESC: "После долгих лет пагубных климатических изменений, вызванных нашей алчной промышленностью, мир §Y[This.GetName]§! стал §Yопустошённым§!."
 relentless_industrialists_tomb: "Экологическая деградация"
 relentless_industrialists_tomb_desc: "Неограниченная эксплуатация превратила эту планету в радиоактивную пустыню. Население в ужасе от случившегося."
 requires_not_relentless_industrialists_situation: "$TRIGGER_FAIL$§RНевозможно терраформировать мир [This.GetName] из-за активного инцидента §Y$relentless_industrialists_situation_type$§!.§!"

 relentless_industrialists_policies_activated: "Теперь мы можем изменить политику §Y$policy_relentless_industrialists_policy$§! в меню политик.\n\n"

 policy_relentless_industrialists_policy: "Промышленники"
 policy_relentless_industrialists_policy_desc: "Жить значит эксплуатировать. Но у привычной нам эксплуатации есть свои последствия. Мы можем направить энергию на добычу дополнительных ресурсов или на снижение эффектов."
 relentless_industrialists_full_steam_ahead_name: "Полный вперёд"
 relentless_industrialists_full_steam_ahead: "$relentless_industrialists_full_steam_ahead_name$"
 relentless_industrialists_full_steam_ahead_desc: "Наша промышленность не знает ограничений.\n\n§Y$building_coordinated_fulfillment_center_1_plural$§! получают дополнительные бонусы к производству."
 relentless_industrialists_study_name: "Ради науки!"
 relentless_industrialists_study: "$relentless_industrialists_study_name$"
 relentless_industrialists_study_desc: "Облучение планеты может многому нас научить.\n\nПозволяет нам терраформировать планеты в §Yопустошённые миры§!.\n§Y$building_coordinated_fulfillment_center_1_plural$§! накладывают менее жёсткие штрафы к пригодности."
 relentless_industrialists_cleanup_name: "Расчистка"
 relentless_industrialists_cleanup: "$relentless_industrialists_cleanup_name$"
 relentless_industrialists_cleanup_desc: "Мы предпримем меры по снижению нашего влияния на окружающую среду.\n\nПланеты, где есть §Y$building_coordinated_fulfillment_center_1_plural$§!, больше не будут со временем превращаться в §Yопустошённые миры§!, но на их содержание будет расходоваться £unity£ §Yединство§!."

 RELENTLESS_INDUSTRIALISTS_STUDY_PROJECT: "Секрет безопасной радиации"
 RELENTLESS_INDUSTRIALISTS_STUDY_PROJECT_DESC: "Мы изучим, как безопасно облучить планету, не доставляя населению излишних неудобств."

 toxoids.45.desc: "Наши [This.GetResearchers] изучили промышленные процессы облучения и сообщают, что теперь смогут безопасно превращать живые экосистемы в радиоактивные земли, не причиняя излишних проблем местному населению."

 ### Scavengers
 civic_scavengers: "Мусорщики"
 civic_scavengers_desc: "В этом обществе нет такого понятия, как «мусор», и даже в самое трудное военное время бригады утилизаторов сопровождают боевые флотилии, выгребая из обломков всё более-менее ценное."
 civic_scavengers_effects: "$t$- Изучение §Hобломков§! приносит £physics£ £society£ £engineering£ §Yочки исследований§! и возвращает часть §Yресурсов§!, затраченных на производство уничтоженных кораблей\n$t$- Из некоторых §Hобломков§! можно получить §Hкорабли§!"
 civic_corporate_scavengers_effects: "$civic_scavengers_effects$\n$t$- $BRANCH_OFFICE_BUILDING$ £building£ ['building:building_industrial_subsidiary'] $megacorp_civic_branch_office_building_effect$"
 civic_corporate_scavengers: "Отдел реконструкции"
 civic_corporate_scavengers_desc: "$civic_scavengers_desc$"

 trait_incubator: "Инкубаторы"
 incubator_tooltip: "Меняет скорость роста поселений на значение от §G+30%§! до §R-10%§! обратно пропорционально количеству поселений в колонии."
 trait_incubator_desc: "§LВ изоляции или при недостаточной численности расы с этим признаком адаптируются и могут сосредоточиться на воспроизводстве населения невероятными по меркам других рас темпами. Но при большой численности эффект начинает работать в обратную сторону, затрудняя размножение.§!"

 trait_inorganic_breath: "Токсичное дыхание"
 inorganic_breath_tooltip: "Каждые $pop_group_unit$ £pop£ §Hпоселений§! в статусе раба или выше производят 0.02 £exotic_gases£ §Yэкзотических газов§! в месяц."
 trait_inorganic_breath_desc: "§LНемного токсичные методы пищеварения этой расы делают состав её дыхания довольно экзотическим.§!"

 trait_noxious: "Вредоносные"
 noxious_tooltip: "Счастье невредоносных поселений: §R$@noxious_happiness_penalty|0%$§!\n$t$- Счастье за каждое невредоносное поселение (подверженное влиянию счастья): §G+$@noxious_happiness_bonus|0%$§! (макс.: §G+40%§!)"
 trait_noxious_desc: "§LРядом с подобными поселениями крайне неприятно находиться, поскольку никто не в силах вынести их присутствие.§!"
 noxious_stock: "Вредоносные поселения не могут быть скотом"
 mod_pop_non_noxious_happiness: "Ядовитый сосед"

 trait_exotic_metabolism: "Экзотический метаболизм"
 exotic_metabolism_tooltip: "£exotic_gases£ Содержание в экзотических газах: §R+0.125§!\n$t$- £mod_logistic_growth_mult£ $MOD_LOGISTIC_GROWTH_MULT$: §G+25%§!\n$t$- £mod_pop_environment_tolerance£ $MOD_POP_ENVIRONMENT_TOLERANCE$: §G+25%§!"
 trait_exotic_metabolism_desc: "§LМетаболизм, основанный на экзотических — и дорогих — газах, значительно усиливает способности этой расы.§!"

 ap_detox: "Детоксикация"
 ap_detox_desc: "Новейшие достижения в области терраформирования позволят нам вдохнуть жизнь в планеты, ранее считавшиеся безоговорочно мёртвыми и не подлежащими спасению."
 detox_tox_worlds: "Позволяет терраформировать §Yтоксичные кандидаты на терраформирование§! в пригодные.\nКоличество таких миров в пределах наших границ: §Y[This.num_toxic_terraform_candidates]§!."
 MESSAGE_TOXIC_TERRAFORM_FOUND_TITLE: "$toxoids.500.name$"
 MESSAGE_TOXIC_TERRAFORM_FOUND_DESC: "Токсичный мир [From.GetName] на удивление оказался кандидатом на терраформирование. Если его очистить, он может когда-нибудь стать для нас домом."
 MESSAGE_TERRAFORMING_EVENT_TITLE: "Событие терраформирования"

 toxoids.500.name: "Токсичный кандидат на терраформирование"
 toxoids.500.desc.intro: "Подробное изучение [From.GetName&gen] показало, что, несмотря на ядовитые газы, делающие атмосферу непригодной для дыхания, в принципе мир может поддерживать подходящую атмосферу. При достаточных усилиях мы могли бы разбить токсины в атмосфере на безопасные составляющие."
 toxoids.500.desc.1: "$toxoids.500.desc.intro$\n\nЭта [From.GetPlanetMoon_rinfix&nom] теоретически подходит для терраформирования, но у нас нет средств для осуществления такой грандиозной задачи в реалистичные сроки."
 toxoids.500.desc.2: "$toxoids.500.desc.intro$\n\nЗатраты энергии были бы внушительными, но у нас есть средства для терраформирования, благодаря которым планета [From.GetPlanetMoon_rinfix&nom] постепенно станет местом, где снова сможет зародиться жизнь."
 toxoids.500.a: "Какой потенциал для пробуждения..."
 TOXIC_TERRAFORMING_CANDIDATE_EFFECT: "Мир §Y[From.GetName]§! можно терраформировать, если мы выберем бонус за стремление §H$ap_detox$§!."

 d_tainted_snowcaps: "£blocker£ Загрязнённые полярные шапки"
 d_poisonous_algae: "£blocker£ Ядовитые водоросли"
 d_venomous_insects: "£blocker£ Ядовитые насекомые"
 d_unpleasant_atmosphere: "£blocker£ Неприятная атмосфера"
 d_rotten_soil: "£blocker£ Гнилая почва"
 d_tainted_snowcaps_desc: "Последние токсичные остатки некогда огромных ядовитых гор, преобладавших на этом мире."
 d_poisonous_algae_desc: "Ядовитые водоросли пережили первичную очистку мира. Они недостаточно агрессивные, чтобы воспрепятствовать колонизации, но приспосабливаются к любым условиям и создают трудности."
 d_venomous_insects_desc: "Уцелевшие стаи ядовитых вредителей, которые, как мы думали, вымерли ещё на раннем этапе терраформирования."
 d_unpleasant_atmosphere_desc: "Лишь мерзкий привкус и отвратительный запах в воздухе напоминают о токсичном прошлом этой планеты."
 d_rotten_soil_desc: "Даже эта гнилая почва пригодится нам после процесса обновления."

 ### Overtuned

 trait_spliced_adaptability: "Генная адаптация"
 trait_spliced_adaptability_desc: "§LНесколько генетических правок и добавок позволят пережить почти что угодно. Этот процесс сопровождается допустимым количеством смертей от побочных эффектов.§!"
 spliced_adaptability_tooltip: "Приспособленность: §G+20%§!"
 trait_juiced_power: "Мощный коктейль"
 trait_juiced_power_desc: "§LВозможность по желанию выделять адреналин и мощные гормоны роста привели к значительному росту силы. Главное — не обращать внимания на внутренние разрывы.§!"
 juiced_power_tooltip: "$BONUS_WORKFORCE_FOR$ категории «$WORKERS_NO_ICON$»: §G+5%§!\n$t$- $soldier_jobs_bonus_workforce_mult$: §G+15%§!"
 trait_crack_miner: "Урождённый шахтёр"
 trait_crack_miner_desc: "§LПревосходная координация, почти неограниченная выносливость и самоочищающиеся лёгкие позволили создать идеальные бригады шахтёров. Увы, без солнечного света они становятся нервными.§!"
 crack_miner_tooltip: "Эффективность ['concept_planet_miners', шахтёрских] должностей: §G+15%§!"
 trait_farm_hands: "Лишние конечности"
 trait_farm_hands_desc: "§LЧем больше конечностей, тем продуктивнее фермер. Некоторые конечности могут работать даже когда их владелец спит. Слухи о новых конечностях, задушивших своего владельца, согласно расследованию, необоснованны.§!"
 farm_hands_tooltip: "Эффективность ['concept_planet_farmers', фермерских] должностей: §G+15%§!"
 trait_technical_skill: "Технический талант"
 trait_technical_skill_desc: "§LДополнительные внутренние органы позволяют физически ощущать электрические и магнитные поля. Главное — игнорировать сообщения о случаях, когда рабочие слышали крики или голоса около реакторов.§!"
 technical_skill_tooltip: "Эффективность ['concept_planet_technician', технических] должностей: §G+15%§!"
 trait_commercial_genius: "Коммерческий гений"
 trait_commercial_genius_desc: "§LСлегка приглушив доброжелательность и убавив эмпатию, можно искусственно разжечь искру торговой гениальности. Погоня за абсолютным коммерческим превосходством перевешивает любые последствия.§!"
 trait_commercial_genius_tooltip: "Эффективность ['concept_planet_traders', торговых] должностей: §G+25%§!"
 trait_crafted_smiles: "Искусственная улыбка"
 trait_crafted_smiles_desc: "§LНебольшое изменение черт лица, изменение развития мышц и, разумеется, дополнительные вещества помогли создать идеальную улыбку. Неизменную.§!"
 crafted_smiles_tooltip: "Эффективность ['concept_planet_influential', влиятельных] должностей: §G+15%§!"
 trait_low_maintenance: "Низкое содержание"
 trait_low_maintenance_desc: "§LСнижение потребления, экскреции и остальных показателей сделало представителей этой расы вдвое лучше за половину цены. Но потребность в богатой протеином пище выросла.§!"
 low_maintenance_tooltip: "Потребление товаров массового спроса населением: §G-10%§!"
 trait_artificial_intelligence: "Улучшенный разум"
 trait_artificial_intelligence_desc: "§LЧем больше мозгов, тем лучше думается. В тело пациента в стратегических местах внедрены дополнительные мыслительные органы, увеличивающие умственные способности. Пусть даже эти органы не всегда сходятся во мнениях.§!"
 artificial_intelligence_tooltip: "Эффективность ['concept_planet_researchers', исследовательских] должностей: §G+10%§!"
 trait_gene_mentorship: "Генное руководство"
 trait_gene_mentorship_desc: "§LСовместив генетически изменённое «инстинктивное понимание» с внешними химическими стимуляторами, нам удалось значительно ускорить процесс обучения. Правда, у некоторых в результате развилась обострённая паранойя.§!"
 gene_mentorship_tooltip: "Прирост опыта лидера: §G+30%§!"
 trait_expressed_tradition: "Выраженная традиция"
 trait_expressed_tradition_desc: "§LФанатизм по требованиям: вера — это просто коктейль из гормонов, доведённый нами до совершенства. А вот куда приведёт эта вера — это уже вопрос руководства.§!"
 expressed_tradition_tooltip: "Эффективность ['concept_planet_bureaucrats', бюрократических] должностей: §G+10%§!"
 trait_elevated_synapses: "Улучшенные синапсы"
 trait_elevated_synapses_desc: "§LНаш мозг как вычислительное устройство работает не на все 100%. Однако нам удалось выйти за рамки обычных возможностей. В случае ошибки попробуйте выключить и включить снова.§!"
 elevated_synapses_tooltip: "Эффективность ['concept_planet_researchers', исследовательских] должностей: §G+20%§!"
 trait_preplanned_growth: "Спланированный рост"
 trait_preplanned_growth_desc: "§LСпланированная фертильность, спланированный интерес, спланированная совместимость. Рост населения по требованию во имя сильного и стабильного населения — с парой небольших правок. Ревнивым индивидам предписывается срочно направиться в ближайший центр фертильности для обязательного обучения.§!"
 preplanned_growth_tooltip: "Скорость роста поселений: §G+30%§!\n$t$- Использование жилья поселениями: §G-10%§!"
 trait_excessive_endurance: "Излишняя стойкость"
 trait_excessive_endurance_desc: "§LВ этих представителях лучшие гены адаптации доведены до предела. Средний показатель в 30% мутаций показывает, что эксперимент вышел отчасти стабильным и успешным.§!"
 excessive_endurance_tooltip: "Приспособленность: §G+30%§!\n$t$- $MOD_POP_BONUS_WORKFORCE_MULT$: §G+5%§!"

 edict_damn_the_consequences: "Плевать на последствия"
 edict_damn_the_consequences_desc: "Этот указ доводит наши генные модификации до предела, удваивая их эффекты, но при этом провоцируя большее количество ужасающих побочных эффектов, включая спонтанное воспламенение.\n\n§R«Плевать на последствия» игнорирует ['concept_edict_fund', фонд указов] и всегда потребляет 80% ежемесячного прироста £unity£ единства.§!"
 edict_damn_the_consequences_effects: "Все положительные эффекты §Hразогнанных§! признаков удваиваются."

 # Deposit for Exotic Metabolism

 d_exotic_mountain: "Экзотические горы"
 d_exotic_mountain_desc: "В недрах этих гор таятся огромные запасы экзотических газов, которые лежат в основе нашей биологии."

