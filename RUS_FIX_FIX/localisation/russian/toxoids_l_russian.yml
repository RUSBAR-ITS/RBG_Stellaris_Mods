 decision_activate_dimensional_manipulation_device: "Активировать устройство для манипуляции измерениями"
 decision_activate_dimensional_manipulation_device_desc: "То, что внешне кажется маленьким, можно увеличить изнутри с помощью устройства, украденного у феи $NAME_Syamelle$."
 d_dimensional_manipulation_device: "Устройство для манипуляции измерениями"
 d_dimensional_manipulation_device_desc: "Устройство, украденное у феи $NAME_Syamelle$. Оно способно манипулировать измерениями и расширять небольшие пространства."
 dimensional_manipulation_device_tooltip: "$district_orders_demesne_plural$ теперь дают §G+0.5§! ячеек сооружений и §G+1§! жилья."
 dimensional_manipulation_device_tooltip_short: "£mod_planet_max_buildings_add£ §G+0.5§! £housing£ §G+1§! за $district_orders_demesne$"
 syamelles_curse: "Проклятие $NAME_Syamelle$"
 syamelles_curse_desc: "Таинственное существо прокляло нас, лишив возможности испытывать любовь и влечение. Но в то же время мы получили возможность воспроизводства механическими методами."
 syamelles_curse_habitat: "Любовное проклятие"
 syamelles_curse_habitat_desc: "Эффекты проклятия $NAME_Syamelle$ сильнее всего ощущаются в ставке ордена. Идея физической близости стала настолько неестественной, что оруженосцам приходится выискивать новые способы восполнения населения."
 syamelles_curse_habitat_tooltip: "$MOD_POP_GROWTH_SPEED_REDUCTION$: §R100%§!\n£mod_bonus_pop_growth£ $MOD_BONUS_POP_GROWTH$ за каждые $pop_group_unit$ [squire.GetIcon] [squire_rinfix.GetName]: §G+0.10§!"
 syamelles_blessing: "Благословение $NAME_Syamelle$"
 syamelles_blessing_desc: "Таинственное существо благословило нас после недолгой, но бурной встречи. Нас переполняет новая сила, и каждое свидание открывает новые возможности..."
 syamelles_blessing_synth: "$syamelles_blessing$"
 syamelles_blessing_synth_desc: "$syamelles_blessing_desc$"

 r_toxic_god: "Утроба токсичной сущности"
 r_toxic_god_desc: "Некоторые считали, что сущность, от которой осталась эта утроба, обладала божественной мощью. Далёкое от божественности создание мертво, и этот трофей единственное тому свидетельство."
 r_toxic_god_knights_passive_effect: "§YОрбитальная станция:§! $major_orbital_knights$"
 r_toxic_god_knights_effect: "Доступно §Yрешение§! §Yосвятить колонию§! и основать в ней §Y$building_order_castle$§!."

 building_order_castle: "Замок ордена"
 building_order_castle_desc: "Орден Токсичного бога основал замок в этой колонии. В ней расположился отряд рыцарей и оруженосцев."

 decision_consecrate_habitat_knights: "Освятить орбитальное поселение"
 decision_consecrate_habitat_knights_desc: "Мы освятим это орбитальное поселение с помощью артефакта, найденного во время наших странствий. С этого момента он будет считаться базой рыцарей, а орден воздвигнет на нём новый замок и владение."
 decision_consecrate_habitat_knights_effect: "Специализировать это орбитальное поселение за счёт §Yзала ордена§! и £building£ §Yзамка ордена§!.\n§Y$building_order_castle$§! даёт должности [knight.GetIcon] рыцарей и [squire.GetIcon] оруженосцев.\n§RЕго нельзя разрушить.§!"
 decision_consecrate_arkship_knights: "Освятить корабль-ковчег"
 decision_consecrate_arkship_knights_desc: "Мы освятим этот корабль-ковчег с помощью артефакта, найденного во время наших странствий. С этого момента он будет считаться базой рыцарей, а орден воздвигнет на нём новый замок и владение."
 decision_consecrate_arkship_knights_effect: "Специализировать этот корабль-ковчег за счёт §Yзала ордена§! и £building£ §Yзамка ордена§!.\n§Y$building_order_castle$§! даёт должности [knight.GetIcon] рыцарей и [squire.GetIcon] оруженосцев.\n§RЕго нельзя разрушить.§!"
 requires_another_consecration: "$TRIGGER_FAIL$Требуется активировать §Yутробу токсичной сущности§!."

 arkship_knights_detox: "Очистить мир"
 arkship_knights_detox_ship_button: "$arkship_knights_detox_effect$\n\n$arkship_knights_detox_desc$"
