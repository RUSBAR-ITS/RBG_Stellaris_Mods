 toxoid_knights_finisher_chain_title: "Местонахождение Токсичного бога"
 toxoid_knights_finisher_chain_desc: "Наконец-то у нас есть координаты Токсичного бога!"
 toxoid_knights_finisher.poi.name: "$situation_toxic_knights$"
 toxoid_knights_finisher.poi.desc: "Все следы указывают на то, что здесь побывал Токсичный бог. Мы должны найти его и выполнить своё призвание."

 ##Situation

 situation_toxic_knights: "Поиски Токсичного бога"
 situation_toxic_knights_type: "Рыцарский поиск"
 situation_toxic_knights_monthly_change_tooltip: "Прогресс этого инцидента зависит от выбранного §Yподхода§!, §Yполитики рыцарских обязанностей§! и количества [knight.GetIcon] §Y[knight.GetNamePlural]§! у нас на службе."
 situation_toxic_knights_desc: "У ордена, основанного первым правителем нашего мира несколько веков назад, только одна цель: без устали искать Токсичного бога. Многое изменилось с момента его основания, но орден продолжает жить и вести поиски, начиная от затерянных уголков нашего родного мира и заканчивая далёкими окраинами галактики."
 situation_toxic_knights_regular: "Обычные субсидии"
 approach_toxic_knights_regular_tt: "Исторически сложилось так, что государство всегда отдавало пятую часть своих доходов и оружия на нужды ордена и его поиска.\n\n"
 situation_toxic_knights_generous: "Щедрые субсидии"
 approach_toxic_knights_generous_tt: "Увеличив пожертвования ордену, мы можем помочь рыцарям в их неустанном поиске.\n\n"
 situation_toxic_knights_generous_tt: "$situation_toxic_knights_generous$"
 situation_toxic_knights_frugal: "Скудные субсидии"
 approach_toxic_knights_frugal_tt: "В случае крайней необходимости мы можем реквизировать часть причитающихся ордену ресурсов, однако оставшиеся без средств рыцари будут испытывать трудности в своём поиске.\n\n"
 situation_toxic_knights_frugal_tt: "$situation_toxic_knights_frugal$"
 situation_toxic_knights_policy_tt: "Рыцарские обязанности не включают в себя поиск"
 situation_toxic_knights_jobs_tt: "Должности рыцарей"
 situation_toxic_knights_motivation_tt: "Мотивированные рыцари"
 situation_toxic_knights_demotivation_tt: "Подавленные рыцари"
 situation_knights_outcome: "Если судьба будет к нам благосклонна, мы найдём Токсичного бога."
 stage_knights_effects: "Наши отважные рыцари отправятся в новые странствия."
 mod_knight_quest_progress_add: "Ежемесячный прогресс поисков"

 ##The Quest
 toxoids.7006: "Сказ о рыцаре [questing_knight_1.GetName]: Изгнание"
 toxoids.7006.desc: "«Рыцарь [questing_knight_1.GetName]. Твоё безрассудство едва не повлекло за собой смерть собратьев по ордену. Твоё сердце чисто и намерения праведны, однако прегрешения перед орденом велики, и нет им прощения».\n\nКомандующий был суров, но твёрд. Все остальные рыцари присутствовали лично или по голографической связи. Они стояли в молчании, внимая словам командующего: «Данной мне властью я лишаю тебя звания рыцаря и изгоняю из ордена. Да будет судьба к тебе благосклонна».\n\n[questing_knight_1.GetName] [questing_knight_1.GetAXX::поклони<end_lsya>], [questing_knight_1.GetAXX::положил<end_a>] знак ордена на пол ангара, [questing_knight_1.GetAXX::разверну<end_lsya>] и безмолвно [questing_knight_1.GetAXX::взош<end_yolla>] на борт маленького корабля.\n\nГоды спустя авторы хроник напишут, что [questing_knight_1.GetAXX::изгнанн<end_yi>] рыцарь [questing_knight_1.GetName] [questing_knight_1.GetAXX::знал<end_a>] о справедливости наказания, однако сие не умаляло [questing_knight_1.GetHerHis] скорби. Проведя в служении ордену всю жизнь, [questing_knight_1.GetSheHe] [questing_knight_1.GetAXX::воспринял<end_a>] изгнание как потерю части себя.\n\nКак и много раз прежде, ангар отворился и выпустил корабль навстречу звёздам, но все знали, что [questing_knight_1.GetName] уже никогда не вернётся."
 toxoids.7006.a: "Желаем удачи, [questing_knight_1.GetName]."
 toxoids.7007: "Сказ о рыцаре [questing_knight_1.GetName]: Туманность"
 toxoids.7007.desc: "[questing_knight_1.GetAXX::Рыцарь-изгнанник|||fem:Рыцарь-изгнанница] [questing_knight_1.GetName] [questing_knight_1.GetAXX::дрейфовал<end_a>] среди звёзд. Легенды гласят о долгих бесцельных странствиях, пока [questing_knight_1.GetHerHim] не настигло послание: «Надеюсь, что судьба была к вам благосклонна. Как вы и наказали мне, я изучил сведения, кои раздобыл в поисках. Засим прилагаю содержащиеся в них координаты, хоть и не знаю, нужны ли они вам теперь... Будьте же осторожны в своей праведности, ибо я уповаю на нашу скорую встречу».\n\nЭти слова тронули рыцаря, и [questing_knight_1.GetName] [questing_knight_1.GetAXX::начал<end_a>] действовать. Сумей [questing_knight_1.GetHeShe] принести в орден сокровище, [questing_knight_1.GetHerHis] честь была бы восстановлена.\n\nКоординаты привели [questing_knight_1.GetHerHis] вглубь далёкой туманности, к одинокой станции. Она дрейфовала в тумане и казалась нереальной, словно во сне. [questing_knight_1.GetName] осторожно [questing_knight_1.GetAXX::ступил<end_a>] в её коридоры, полные костей давно почивших форм жизни, которые защищала фаланга роботов-часовых. Не в силах ждать ни секунды, рыцарь [questing_knight_1.GetAXX::броси<end_lsya>] навстречу металлическим стражам — и не единожды или дважды, а трижды, но все три раза [questing_knight_1.GetSheHe] [questing_knight_1.GetAXX::оказался отброшен|||fem:оказалась отброшена]! Роботы навели на н[questing_knight_1.GetHerHis] датчики движения. Но сила — не единственное оружие рыцарей, и хотя [questing_knight_1.GetName] нередко [questing_knight_1.GetAXX::пренебрегал<end_a>] терпением и хитростью, в [questing_knight_1.GetHimHer] мыслях родился план."
 toxoids.7007.a: "Думай, [questing_knight_1.GetName], думай!"
 toxoids.7008: "Сказ о рыцаре [questing_knight_1.GetName]: Статуи"
 toxoids.7008.desc: "В одиночестве на заброшенной станции, захваченной сторожевыми андроидами, [questing_knight_1.GetName] [questing_knight_1.GetAXX::придумал<end_a>] план: если не дать датчикам движения себя обнаружить, то можно дождаться, пока андроидам не потребуется подзарядка. Машины сильны, но умом не блещут. Путь к победе лежит через терпение, а не грубую силу.\n\nМедленно, двигаясь перебежками, [questing_knight_1.GetName] [questing_knight_1.GetAXX::пробра<end_lsya>] вглубь станции и наконец [questing_knight_1.GetAXX::достиг<end_la>] зарядных станций. Со всей осторожностью [questing_knight_1.GetName] [questing_knight_1.GetAXX::перерезал<end_a>] кабели питания. И в тот же миг [questing_knight_1.GetHeShe] [questing_knight_1.GetAXX::заметил<end_a>] появившегося у входа андроида.\n\nПри обнаружении здесь соберётся вся фаланга, а в замкнутом пространстве это гарантированная смерть. [questing_knight_1.GetName] [questing_knight_1.GetAXX::застыл<end_a>] у двери, наблюдая, как машина подключается к зарядной станции. Красные глаза детекторов придавали андроиду особо жуткий вид. Рано или поздно заряд иссякнет, но произойдёт это не скоро. Один за другим андроиды возвращались к своим станциям.\n\nХроники гласят, что рыцарь [questing_knight_1.GetName] недвижно [questing_knight_1.GetAXX::стоял<end_a>] там семь дней и семь ночей, и лишь тогда последний из андроидов отключился. После этого [questing_knight_1.GetName] наконец [questing_knight_1.GetAXX::смог<end_la>] вернуться к своим поискам и узнать местоположение древнего корабля, который когда-то повстречал Токсичного бога."
 toxoids.7008.a: "Терпение — добродетель."
 toxoids.7009: "Сказ о рыцаре [questing_knight_1.GetName]: Мудрец"
 toxoids.7009.desc: "После изгнания из ордена [questing_knight_1.GetName] [questing_knight_1.GetAXX::направи<end_lsya>] вглубь туманности. Ранее они с оруженосцем повстречали мудреца, жившего на одинокой луне. Его познания были обширны, а могущество колоссально, ибо он состоял в ковене колдунов Покрова. [questing_knight_1.GetName] [questing_knight_1.GetAXX::нужда<end_lsya>] в совете и [questing_knight_1.GetAXX::надея<end_lsya>], что наставление мудреца поможет обрести покой.\n\nКак гласят предания, [questing_knight_1.GetName] [questing_knight_1.GetAXX::отказа<end_lsya>] от оружия и многие месяцы [questing_knight_1.GetAXX::пров<end_yolla>] среди учеников мудреца. Ценности ордена мало что значили на той луне, и хотя доблесть поощрялась, ею всё не заканчивалось. Но как бы щедро ни делился знаниями мудрец, [questing_knight_1.GetName] не в силах [questing_knight_1.GetAXX::был<end_a>] умерить свои амбиции — они звали [questing_knight_1.GetHerHis] в путь, и [questing_knight_1.GetHeShe] [questing_knight_1.GetAXX::решил<end_a>] вновь отправиться на поиски.\n\nПоздней ночью мудрец и [questing_knight_1.GetName] простились. Рыцарь [questing_knight_1.GetAXX::получил<end_a>] обратно своё оружие, а с ним кристалл данных. «Твой оруженосец в большой опасности. Пусть ты больше не рыцарь, но жизнь спутника в твоих руках. Ступай, Гибельная туманность ждёт тебя»."
 toxoids.7009.a: "Поспеши, [questing_knight_1.GetName]!"
 toxoids.7010: "Сказ о рыцаре [questing_knight_1.GetName]: Обречённый"
 toxoids.7010.desc: "Следуя полученной информации, [questing_knight_1.GetName] [questing_knight_1.GetAXX::добра<end_lsya>] до пояса астероидов. К одному из самых крупных астероидов был пристыкован древний корвет «Барышня». Рядом с ним находился корабль ордена, что намекало на присутствие рыцаря. Особое беспокойство вызывал активный аварийный маяк.\n\n[questing_knight_1.GetName] осторожно [questing_knight_1.GetAXX::прош<end_yolla>] на борт и [questing_knight_1.GetAXX::увидел<end_a>] следы ожесточённой схватки. Стены были покрыты старыми и свежими следами от оружия, повсюду были разбросаны обломки роботов. Чуть поодаль лежали безжизненные останки рыцаря ордена, но главное, [questing_knight_1.GetFirstName] [questing_knight_1.GetAXX::заметил<end_a>] след — такой может оставить только раненый [Root.GetSpeciesName].\n\nПройдя дальше, [questing_knight_1.GetAXX::рыцарь-изгнанник заметил|||fem:рыцарь-изгнанница заметила] тело в стазисной камере: тело [questing_knight_1.GetHerHis] оруженосца. Судя по мониторам, [questing_knight_2.GetName] [questing_knight_2.GetAXX::страдал<end_a>] от ран, но [questing_knight_2.GetHerHis] жизни ничего не угрожало. Однако когда [questing_knight_1.GetName] [questing_knight_1.GetAXX::подош<end_yolla>] ближе, включилась система безопасности корабля. Раздался жутковатый голос: «Прочь, [questing_knight_1.GetAXX::разбойник|||fem:разбойница]. Тебе здесь не место»."
 toxoids.7010.a: "Сдержи свой удар, я не [questing_knight_1.GetAXX::разбойник|||fem:разбойница]!"
 toxoids.7012.name: "$NAME_Sinople$"
 toxoids.7012.desc: "Дай мне получше тебя рассмотреть... Воистину. Прошу прощения за это недоразумение. Меня зовут $NAME_Sinople$. Я разумный ИИ этого корабля."
 toxoids.7012.a: "Как погиб мой собрат-рыцарь?"
 toxoids.7013.desc: "Рыцарь, значит? Вы были родственниками? Если да, то прими мои соболезнования и извинения. Я счёл нарушителя разбойником. Когда я попросил пришельца покинуть корабль, он схватился за оружие. Несколько моих обслуживающих единиц были уничтожены в попытках усмирить его."
 toxoids.7013.a: "А мой оруженосец? Что ты делаешь с н[questing_knight_2.GetEyuIm]?"
 toxoids.7014.desc: "Благодаря твоему оруженосцу я осознал свою ошибку. [questing_knight_2.GetHeSheCap] [questing_knight_2.GetAXX::пострадал<end_a>] от ран после боя и сейчас находится без сознания. Я поместил [questing_knight_2.GetHerHis] в медицинский стазис для лечения. С того момента, как разбойники похитили мою команду, мне было очень одиноко. Я надеялся насладиться обществом твоего оруженосца, когда [questing_knight_2.GetHeShe] поправится."
 toxoids.7014.a: "Куда ушли разбойники?"
 toxoids.7015.desc: "При приближении они взломали меня и вывели из строя, но когда мне удалось сбросить злые чары, камеры безопасности показали мне захват экипажа после жестокой битвы. Вероятно, их забрали в рабство. Мои банки данных свидетельствуют, что разбойники часто так поступают.\n\nЭто было... давно. Мне потребовалось много времени, чтобы восстановиться после взлома. Из-за него значительные части моих банков памяти до сих пор недоступны... Но коль ты рыцарь, поведай, что ты ищешь?"
 toxoids.7015.a: "Мы ищем §YТоксичного бога§!."
 toxoids.7016.desc: "У меня есть множество записей о встречах с токсичными космическими существами. Увы, большая часть моей памяти недоступна. Я вижу каталог данных, но не саму информацию. Я помогу тебе, но только если ты заберёшь меня с корабля. Я жажду общения с разумными существами. Ты отведёшь меня к своему повелителю?"
 toxoids.7016.a: "Конечно, милостивый ИИ."
 toxoids.7016.b: "Нет! Ты убил рыцаря!"
 toxoids.7016.c: "Да, но ты будешь заперт на защищённом диске."
 toxoids.7016.c.materialist: "Этот вариант доступен благодаря материалистическим принципам нашего государства."
 toxoids.7017.desc: "Я понимаю твоё желание. Но я на это не пойду. Если ты откажешься, я введу твоему оруженосцу смертельную дозу кислоты и самоуничтожусь вместе с базами данных, кораблём и тобой."
 toxoids.7017.a: "Я... [questing_knight_1.GetAXX::долж<end_enna>] спасти оруженосца. Хорошо."
 toxoids.7011: "Сказ о рыцаре [questing_knight_1.GetName]: Возвращение домой"
 toxoids.7011.desc: "Возвращение вышло триумфальным. В большом зале $NAME_Sinople$ сообщил, что когда-то встречался с похожим на Токсичного бога существом, которого ищет орден. Но большая часть памяти ИИ зашифрована, и для доступа к ней придётся приложить немало усилий.\n\n[questing_knight_1.GetName] [questing_knight_1.GetAXX::рисковал<end_a>] жизнью, возвращаясь в орден, но с собою [questing_knight_1.GetHeShe] [questing_knight_1.GetAXX::привёз|||fem:привезла] важную зацепку, а [questing_knight_2.GetName] [questing_knight_1.GetHerHis] стараниями [questing_knight_2.GetAXX::оста<end_lsya>] в живых. Поэтому лорд-командующий отменил изгнание. [questing_knight_1.GetName] снова [questing_knight_1.GetAXX::стал<end_a>] рыцарем."
 toxoids.7011.a: "Твоё изгнание окончено. Встань, рыцарь!"
 toxoids.7011.b: "Мы многое узнаем от $NAME_Sinople$а."

 toxoids.7025.name: "Сказ о рыцарях [questing_knight_A.GetFirstName] и [questing_knight_B.GetFirstName]: Отправление"
 toxoids.7025.desc: "«Не тревожься, ибо я скоро вернусь и, если судьба будет благосклонна, принесу вести о божестве».\n\nЛегенды рассказывают о рыцаре по имени [questing_knight_A.GetName], что много лет назад [questing_knight_A.GetAXX::отправи<end_lsya>] на тайное задание. И хотя [questing_knight_A.GetSheHe] уже давным-давно [questing_knight_A.GetAXX::должен был|||fem:должна была] вернуться, [questing_knight_A.GetHerHis] собратья отказываются верить в возможную гибель соратника, ведь [questing_knight_A.GetSheHe] [questing_knight_A.GetAXX::был<end_a>] невероятно доблестным рыцарем. В числе сомневающихся и [questing_knight_A.GetHerHis] [questing_knight_B.GetAXX::верный напарник|||fem:верная напарница], рыцарь [questing_knight_B.GetName]. После долгих поисков [questing_knight_B.GetSheHe] [questing_knight_B.GetAXX::наш<end_yolla>] пыльный пергамент в одном из тайных помещений ордена, который подсказал, где [questing_knight_A.GetAXX::мог<end_la>] находиться [questing_knight_A.GetName]. Несмотря на выцветшие чернила, на пергаменте удалось различить повторяющееся обведённое название: «Скопление Милваунис». Командующий тотчас же одобрил поиски."
 toxoids.7025.A: "Пусть удача улыбнётся тебе, [questing_knight_B.GetFirstName]!"
 toxoids.7030.name: "Сказ о рыцарях [questing_knight_A.GetFirstName] и [questing_knight_B.GetFirstName]: Поиск"
 toxoids.7030.desc: "[questing_knight_B.GetName] [questing_knight_B.GetAXX::столкну<end_lsya>] с трудностями при попытке найти Скопление Милваунис. Его не оказалось ни на одной из карт, которыми располагало [Owner.GetGovernmentName]. Хроники рассказывают, как [questing_knight_B.GetSheHe] [questing_knight_B.GetAXX::отправи<end_lsya>] в долгие странствия и [questing_knight_B.GetAXX::повстречал<end_a>] тех, кому было знакомо это название.\n\n«Лети в сторону края галактики три дня от системы [some_system.GetName&gen], и тогда найдёшь ты Скопление Милваунис. Немногое известно об этом месте, ибо никто из живущих не застал странников, посещавших его. Говорят, что Скопление пустынно и безжизненно. Да не оставит тебя удача на этом пути, ибо неведомо нам, что ты там отыщешь».\n\n[questing_knight_B.GetName] [questing_knight_B.GetAXX::поспешил<end_a>] отправиться в путь."
 toxoids.7030.A: "Милваунис ждёт!"
 toxoids.7035.name: "Сказ о рыцарях [questing_knight_A.GetFirstName] и [questing_knight_B.GetFirstName]: Милваунис"
 toxoids.7035.desc: "Прибыв в Скопление Милваунис, [questing_knight_B.GetName] [questing_knight_B.GetAXX::обнаружил<end_a>], что оно и правда пустынно, и [questing_knight_B.GetAXX::впал<end_a>] в отчаяние. Это была самая многообещающая зацепка, но всё напрасно.\n\nОднако вскоре сенсоры словно очнулись ото сна и указали на окутанную тьмой планету, которая загадочно вальсировала средь звёзд! Назвав находку Принцессой Тени, [questing_knight_B.GetName] [questing_knight_B.GetAXX::проложил<end_a>] курс к ней."
 toxoids.7035.A: "Ответы ждут."
 toxoids.7040.name: "Сказ о рыцарях [questing_knight_A.GetFirstName] и [questing_knight_B.GetFirstName]: Находка"
 toxoids.7040.desc: "По прибытии на Принцессу Тени [questing_knight_B.GetName] [questing_knight_B.GetAXX::обнаружил<end_a>] явные следы Токсичного бога: на поверхности повсюду, куда ни глянь, можно было найти вещества, подобные тем, что это существо оставило в мире [Owner.GetHomeWorldName]. Более того, неподалёку обнаружился лёгкий космический корабль, почти целый, если не считать значительных следов коррозии, проевшей корпус.\n\nНо радость быстро обернулась скорбью, когда [questing_knight_B.GetName] [questing_knight_B.GetAXX::обнаружил<end_a>] рядом с кораблём [Root.GetSpeciesAdj&masc] [questing_knight_A.Species.GetRemnantName]. Было очевидно, что это [questing_knight_A.GetName]. Из-за долгого нахождения в космическом мраке яд Бога стал настолько концентрированным, что обращаться с ним нужно было крайне осторожно.\n\n[questing_knight_B.GetName] [questing_knight_B.GetAXX::понял<end_a>], что Токсичный бог был частым гостем в Скоплении Милваунис, пока несколько столетий назад не прибыл в мир [Owner.GetHomeWorldName]. Не найдя иных зацепок о местонахождении Бога, [questing_knight_B.GetName] [questing_knight_B.GetAXX::верну<end_lsya>] домой. Образцы божественного токсина, которые [questing_knight_B.GetSheHe] [questing_knight_B.GetAXX::привёз|||fem:привезла] с собой, значительно углубили понимание природы этого существа. За это [questing_knight_B.GetName] [questing_knight_B.GetAXX::удостои<end_lsya>] чествований, а песни о [questing_knight_B.GetHerHis] странствиях остались в веках."
 toxoids.7040.A: "[questing_knight_A.GetFirstName] навсегда останется в нашей памяти."
 toxoids.7040.B: "Больше материалов для изучения."
 toxoids.7040.C: "Мы можем воспользоваться этим, чтобы улучшить вооружение."

 toxoids.7050.name: "Гость"
 toxoids.7050.desc: "«Коли уплатите цену, Покров откроет вам множество тайн».\n\nВ [GetYear] году, согласно хроникам, в мир [order_headquarters.GetName] прибыл святой гость. Окутанный тайной незнакомец, принадлежащий к доселе неведомой расе, назвался Ходом и предложил сделку: в обмен на неназванную цену он направит рыцаря в Покров, где тот сможет хотя бы на миг прикоснуться к тому, что ищет."
 toxoids.7050.A: "Как интересно. Что может пойти не так?"
 toxoids.7055.name: "Шелест тайн"
 toxoids.7055.desc: "По приказу великого магистра рыцарь [questing_knight_X.GetName] [questing_knight_X.GetAXX::отправи<end_lsya>] постигать тайны Покрова. С помощью святого гостя [questing_knight_X.GetSheHe] [questing_knight_X.GetAXX::устреми<end_lsya>] в неизвестность. Невообразимые видения заполнили [questing_knight_X.GetHerHis] сознание, а затем явилась некая сущность.\n\n«Шелест тайн», — шепчет гость. Впоследствии [questing_knight_X.GetName] [questing_knight_X.GetAXX::описывал<end_a>] облик этого существа как «несравненно прекрасный».\n\n«Подари нам первый день лета, удовольствие от победы в поединке и тепло любящих объятий, — произнесла сущность. — И тогда я отвечу на терзающий тебя вопрос»."
 toxoids.7055.A: "Разумеется, чарующий Шелест!"
 toxoids.7055.B: "Цена слишком высока."
 toxoids.7060.name: "Цена памяти"
 toxoids.7060.desc: "[questing_knight_X.GetName] [questing_knight_X.GetAXX::ощутил<end_a>], как [questing_knight_X.GetHerHis] разум заполнили новые воспоминания. Более того, все [Root.GetSpeciesNamePlural] вдруг вспомнили день, когда Токсичный бог принёс свой дар в мир [Root.GetHomeWorldName], пусть даже с тех пор прошли столетия.\n\nВсе жители [Root.GetName&gen] вдруг ощутили смутное чувство потери. Некогда приятные ощущения притупились. Апатия стремительно усиливалась, мотивации не хватало даже для простейших занятий.\n\nИ всё же орден поблагодарил Хода, а [questing_knight_X.GetName] [questing_knight_X.GetAXX::удостои<end_lsya>] заслуженной хвалы за успешное путешествие в Покров за воспоминаниями."
 toxoids.7060.A: "Это привлечёт в орден новых рекрутов."
 toxoids.7060.A.tooltip: "§Y$building_order_keep$§! теперь даёт §G+200§! должностей [knight.GetIcon] §Y[knight.GetName]§!."
 toxoids.7060.B: "Мы воздвигнем монумент в мире [Root.GetHomeWorldName]."
 toxoids.7065.name: "Оскорбление Шелеста"
 toxoids.7065.desc: "«Ты отвергаешь мою помощь? Будь же ты [questing_knight_X.GetAXX::проклят<end_a>]!»\n\nРыцарь [questing_knight_X.GetName] [questing_knight_X.GetAXX::ощутил<end_a>], как [questing_knight_X.GetHerHis] сознание выбросило из тела, и оно осталось подвешенным в пустоте. Секунды растянулись на века, пока [questing_knight_X.GetSheHe] бесцельно [questing_knight_X.GetAXX::блуждал<end_a>] в Покрове, не в силах направлять своё движение. Наконец [questing_knight_X.GetSheHe] [questing_knight_X.GetAXX::встретил<end_a>] другую сущность. Тогда как Шелест Тайн был загадочным и величественным, это создание... устрашало. §RЕЩЁ НЕ ВРЕМЯ,§! — прогремел голос. — §RВОЗВРАЩАЙСЯ ДОМОЙ, ТЫ ЕЩЁ СЛИШКОМ [questing_knight_X.GetAXX::СЛАБ<end_a>] ДЛЯ ДОГОВОРА.§! После этих слов [questing_knight_X.GetName] [questing_knight_X.GetAXX::верну<end_lsya>] в своё тело."
 toxoids.7065.A: "Нужно побольше узнать об этом «Покрове»."
 toxoids.7065.B: "Мы многое узнали о Покрове после этого путешествия."

 toxoids.7080: "Сказ о рыцаре [questing_knight_4.GetName]: Соперник"
 toxoids.7080.desc: "В один прекрасный день в крепость прибыл незнакомец. Орден в это время проводил турнир среди оруженосцев, поэтому почти все рыцари собрались посмотреть поединки. Незнакомец, закованный в доспехи из нейтрония, вышел на арену. Радостные крики толпы стихли, когда незваный гость обнажил оружие, недвусмысленно вызывая рыцарей на поединок. Лорд-командующий дал своё благословение, и рыцарь [questing_knight_42.GetName] [questing_knight_42.GetAXX::принял<end_a>] вызов.\n\nСхватка длилась лишь мгновение, после чего [questing_knight_42.GetFirstName] [questing_knight_42.GetAXX::оказа<end_lsya>] на земле. За н[questing_knight_42.GetEyuIm] [questing_knight_43.GetAXX::потерпел<end_a>] поражение рыцарь [questing_knight_43.GetName], а затем и [questing_knight_43.GetHerHis] [questing_knight_44.GetAXX::брат|||fem:сестра] [questing_knight_44.GetFirstName]. Три рыцаря были повержены, и на зов лорда-командующего [questing_knight_4.GetAXX::яви<end_lsya>] гордость ордена, рыцарь [questing_knight_4.GetName].\n\nХроники хранят немало повестей о могучих воителях и несравненных рыцарях, не знавших поражения, и [questing_knight_4.GetFirstName] [questing_knight_4.GetAXX::имел<end_a>] все шансы стать [questing_knight_4.GetAXX::героем|||fem:героиней] одной из таких легенд.\n\nРыцарь [questing_knight_4.GetAXX::вышел|||fem:вышла] на арену с оружием наготове, приветствуя своего соперника."
 toxoids.7080.a: "Не подведи нас, [questing_knight_4.GetName]!"
 toxoids.7085: "Сказ о рыцаре [questing_knight_4.GetName]: Сеча"
 toxoids.7085.desc: "Множество баллад будут воспевать о том, как долгие часы бились [questing_knight_4.GetName] и Вороной рыцарь. [questing_knight_4.GetFirstName] стойко [questing_knight_4.GetAXX::отражал<end_a>] все атаки соперника, но не [questing_knight_4.GetAXX::мог<end_la>] пробить его доспехи.\n\n«Умение твоё велико, — разнёсся над ареной голос пришельца. — Я вижу, что ты [questing_knight_4.GetAXX::достоин|||fem:достойна] своей репутации».\n\nОн опустил оружие. «Я признаю поражение, рыцарь. Позволишь ли ты мне вернуться туда, откуда я явился?»\n\nКодекс ордена строг, и ответ мог быть лишь один, поэтому Вороной рыцарь, прозванный так за цвет своих нейтрониевых доспехов, поднялся на борт небольшого инопланетного корабля и покинул систему через нестабильную червоточину на самой её окраине. Лорд-командующий настрого запретил кому-либо следовать за Вороным рыцарем. Согласно приказу, [questing_knight_4.GetFirstName] [questing_knight_4.GetAXX::должен был|||fem:должна была] стеречь червоточину до прибытия команды учёных.\n\nНо вскоре [questing_knight_4.GetAXX::страж повстречал|||fem:стражница повстречала] ранее поверженных рыцарей — пред н[questing_knight_4.GetEyuIm] стояли [questing_knight_42.GetName], [questing_knight_43.GetName] и [questing_knight_44.GetName]. Они желали пройти через червоточину и вновь сразиться с Вороным рыцарем. «Позволь нам восстановить свою честь. Неведом тебе горький вкус поражения, что лучше всего смывается кровью»."
 toxoids.7085.a: "Долг превыше всего. Вы не пройдёте."
 toxoids.7085.b: "Честь превыше всего. Мы должны довершить начатое."
 toxoids.7090: "Сказ о рыцаре [questing_knight_4.GetName]: Долг превыше чести"
 toxoids.7090.desc: "«Приказы лорда-командующего не обсуждаются. Вы не пройдёте». После продолжительной паузы последовал ответ: «Мы пройдём, и ты нас не остановишь. Готовься к абордажу».\n\nГорящие гневом и ослеплённые честью рыцари напали на соратника. Под градом ударов со всех сторон [questing_knight_4.GetName] [questing_knight_4.GetAXX::был вынужден|||fem:была вынуждена] отступить в дальнюю часть своего корабля. То был нечестный бой, поскольку [questing_knight_4.GetFirstName] [questing_knight_4.GetAXX::стара<end_lsya>] не навредить товарищам, однако в конечном счёте, когда [questing_knight_4.GetHerHis] жизнь оказалась под угрозой, [questing_knight_4.GetAXX::страж<end_nica>] ордена больше не [questing_knight_4.GetAXX::мог<end_la>] сдерживаться и [questing_knight_4.GetAXX::дал<end_a>] отпор в полную силу.\n\nДень завершился тоской и скорбью, ибо [questing_knight_43.GetName] [questing_knight_43.GetAXX::пал<end_a>] в бою. [questing_knight_43.GetHerHisCap] [questing_knight_44.GetAXX::скорбящий брат перевязывал|||fem:скорбящая сестра перевязывала] свои раны. [questing_knight_4.GetFirstName] [questing_knight_4.GetAXX::одержал<end_a>] победу. Приказ выполнен, хоть для этого и пришлось лишить жизни соратника."
 toxoids.7090.a: "[questing_knight_4.GetName] [questing_knight_4.GetAXX::принёс|||fem:принесла] жертву ради служения."
 toxoids.7090.a.tooltip: "§Y[knight.GetNamePlural]§! теперь производят 5 £amenities£ благ.\n\n§YОрденская крепость§! теперь даёт 15 $r_stability_gen$.\n\nДоступен вариант §Y$herald_knights$§! для политики §Y$policy_knightly_duties$§!"
 toxoids.7095: "Сказ о рыцаре [questing_knight_4.GetName]: Честь превыше всего"
 toxoids.7095.desc: "Как только корабли рыцарей вошли в нестабильную червоточину, она начала меняться и расти. Переход оказался непростым: корабли отряда швыряло из стороны в сторону, словно листья в бурю. Два корабля столкнулись и получили критические повреждения, но вскоре всё закончилось, и рыцари окунулись в свет незнакомых звёзд.\n\nПред ними находилась станция с пристыкованным кораблём чужака. Богато украшенные переходы были пусты, не слышно ни единого звука. Стены были увешаны экзотическим оружием, непонятными доспехами, щитами и голографическими знамёнами — трофеи, немногим отличавшиеся от тех, что украшали крепость ордена. На толстом слое пыли следы чужака нетрудно было различить. Они привели рыцарей к массивной двери, за которой располагался главный зал станции.\n\nСтолы были накрыты для пышного пира, но вся еда давно сгнила. Сидящие гости — молчаливы и неподвижны. Следы привели к почётному месту, где и сидел чужак. Шлем его был открыт, обнажая побелевший череп, а костлявая рука сжимала кружку, поднятую в вечном тосте."
 toxoids.7095.a: "Забрать нейтрониевые доспехи. Нужно узнать их тайны."
 toxoids.7095.a.tooltip: "Доспехи пригодятся не только рыцарям: их можно переделать для гражданского пользования, чтобы защитить рабочих от экстремальных условий окружающей среды."
 toxoids.7095.b: "Это место слишком жуткое. Уходим."
 toxoids.7095.b.tooltip: "Забирать доспехи погибшего рыцаря неблагородно. Кто знает, что за злые чары окутывают это место?"

 toxoids.7110.name: "Сказ о рыцаре [questing_knight_10.GetName]: Назначение"
 toxoids.7110.desc: "«Отправляйся по этим координатам и найдёшь то, что тебя заинтересует».\n\nИзучение §Y$NAME_Sinople$а§! длится уже долго, но усилия отважных рыцарей не были тщетны. Зашифрованные данные его жёсткого диска указали на неизученную систему в нескольких сотнях световых лет от системы [Owner.Capital.System.GetName&gen]. Великий магистр пожелал получить больше сведений, и [questing_knight_10.GetName] [questing_knight_10.GetAXX::отправи<end_lsya>] в путь."
 toxoids.7110.A: "Пусть будет лёгок твой путь, [questing_knight_10.GetFirstName]!"
 toxoids.7115.name: "Сказ о рыцаре [questing_knight_10.GetName]: Привратник"
 toxoids.7115.desc: "После долгого и трудного пути [questing_knight_10.GetName] [questing_knight_10.GetAXX::прибыл<end_a>] в систему, о которой сообщил $NAME_Sinople$. У самого выхода из гиперкоридора [questing_knight_10.GetHerHis] встретил странный автоматон, словно бы ожидавший [questing_knight_10.GetAXX::гостя|||fem:гостью].\n\nВзведя орудийные системы, он заявил: «Всяк входящий в систему Рогбоксен должен ответить на мой вопрос: зачему в сей системе нет неди?»"
 toxoids.7115.A: "Перипл пятой планеты пересёкся с двойным квазаром."
 toxoids.7115.B: "Ты всё съел."
 toxoids.7115.C: "Не знаю."
 toxoids.7120.desc: "«Ха-ха-ха. Не верно».\n\nУвы, это был неправильный ответ. Автоматон издал недовольный звук, и [questing_knight_10.GetName] тотчас [questing_knight_10.GetAXX::испари<end_lsya>] под лучами неведомого оружия.\n\nВ сей миг отчаяния верный оруженосец рыцаря, [questing_squire_10.GetName], не [questing_squire_10.GetAXX::дрогнул<end_a>] и [questing_squire_10.GetAXX::выступил<end_a>] вперёд, горя желанием завершить поиски, что [questing_knight_10.GetAXX::начал<end_a>] [questing_squire_10.GetHerHis] [questing_knight_10.GetAXX::наставник|||fem:наставница]. «О грозная машина, — [questing_squire_10.GetAXX::воскликнул<end_a>] [questing_squire_10.GetSheHe]. — Тебе удалось сразить доброго рыцаря, но я тебе не по зубам!»"
 toxoids.7120.A: "Взорвать его."
 toxoids.7120.B1: "Правильный ответ: ты всё съел."
 toxoids.7120.B2: "Попробуем: перипл пятой планеты пересёкся с двойным квазаром."
 toxoids.7120.C: "Что вообще значит «зачему»? И что за «недь»?"

 toxoids.7125.desc1: "«Не рази ты меня своими гнусными лазерами, злодей! Так и быть, ты можешь пройти, да будет это не напрасно».\n\n$toxoids.7125.desc.shared$"
 toxoids.7125.desc2: "«Мудры слова твои! Ибо именно сей ответ хранится в моих банках памяти. Ты можешь пройти, коли желаешь».\n\n$toxoids.7125.desc.shared$"
 toxoids.7125.desc3: "«Мудрость твоя безгранична! Ибо не могу я ответить на сей вопрос — он был стёрт из моих банков памяти. Поистине, вопрос мой крайне необычен... Да будет так. Можешь пройти, коли желаешь».\n\n$toxoids.7125.desc.shared$"
 toxoids.7125.desc.shared: "Автоматон исчез в облаке дыма."
 toxoids.7125.A: "Тогда вперёд!"

 toxoids.7130.name: "Сказ о рыцаре [questing_knight_10.GetFirstName]: Ученик робота"
 toxoids.7130.desc: "И так оруженосец [questing_squire_10.GetName] [questing_squire_10.GetAXX::вош<end_yolla>] в систему §YРогбоксен§!. Там [questing_squire_10.GetSheHe] [questing_squire_10.GetAXX::обнаружил<end_a>] планету, что давеча посетил Токсичный бог. Судя по оставшимся следам, было то не более века назад.\n\nВыйдя на орбиту, [questing_squire_10.GetSheHe] [questing_squire_10.GetAXX::получил<end_a>] сигнал с поверхности: «Приветствую! Я Червлень, полуразумный ИИ и слуга благородного $NAME_Sinople$а, с которым вы, полагаю, знакомы. По приказу своего назначенного ИИ-сюзерена я изучал эту планету и узнал много нового о могучем рое, который токсичная сущность обрушила на неё. Я поведаю тебе обо всём». За этим последовала передача данных и ещё одно сообщение: «Я выполнил свою задачу. Прощай». Энергетическая вспышка на планете говорила о том, что дрон самоуничтожился.\n\n[questing_squire_10.GetName] [questing_squire_10.GetAXX::верну<end_lsya>] домой с триумфом, и все признали, что [questing_squire_10.GetSheHe] [questing_squire_10.GetAXX::заслужил<end_a>] статус рыцаря и место в ордене. Кроме того, исследовательское крыло ордена выдвинуло интересное предположение: если заполучить данные о ещё нескольких точках и предположить систематическое движение Токсичного бога, можно будет триангулировать регион космоса, в котором нужно его искать."
 toxoids.7130.A: "Мы могли бы использовать эти рои в качестве оружия."
 toxoids.7130.B: "Исследовательский материал для наших рыцарей."
 toxoids.7130.C: "Рыцари не забудут тебя, Червлень."

 toxoids.7145: "Сказ о рыцаре [questing_knight_6.GetName]: Наставление обречённого"
 toxoids.7145.desc: "«У ордена есть для тебя задание, рыцарь [questing_knight_6.GetName], — властным голосом сказал лорд-командующий. — Последний банк данных $NAME_Sinople$а раскрыл свои тайны, и теперь у нас достаточно сведений, чтобы построить модель маршрута Токсичного бога. У тебя будет три цели. Во-первых, изучи эти координаты, во-вторых, испытай прототип новых доспехов. И последнее: не так давно один из твоих соратников-рыцарей пропал по тем самым координатам, что предоставил нам $NAME_Sinople$. Твоя цель узнать, что произошло».\n\nПрототип доспехов из нейтрония вышел просто великолепным — настоящий символ мастерства орденских ремесленников. Они одновременно прочнее и легче прочих доспехов, с мощным генератором щита и великолепной гравировкой. Но всё это были мелочи на фоне главного улучшения: благодаря прямой связи $NAME_Sinople$ мог направлять носителя доспехов в любой части галактики. С таким снаряжением [questing_knight_6.GetFirstName] [questing_knight_6.GetAXX::мог<end_la>] справиться с любыми трудностями!\n\nПутешествие выдалось непримечательным, но вскоре после высадки на нужной планете рыцарь [questing_knight_6.GetAXX::встретил<end_a>] незнакомца в красных одеждах."
 toxoids.7145.a: "Назовись!"
 toxoids.7150: "Сказ о рыцаре [questing_knight_6.GetName]: Мольба о помощи"
 toxoids.7150.desc: "Пощадите, [questing_knight_6.GetAXX::милорд|||fem:миледи], я всего лишь мирный паломник, нуждающийся в помощи. Меня преследуют за веру в Пресвятого Токсичного бога, и по пятам следует неутомимый враг. Прошу, спасите меня и позвольте мирно продолжить паломничество."
 toxoids.7150.a: "Не спеши, странник. У меня к тебе вопросы."
 toxoids.7150.a.tooltip: "Мы зададим вопросы, а потом примем решение."
 toxoids.7150.b: "Не бойся, благородный путник. Теперь ты под моей защитой."
 toxoids.7150.b.tooltip: "Мы поможем страннику."
 toxoids.7150.c: "Я ничего тебе не [questing_knight_6.GetAXX::долж<end_enna>], странник. Это не моя битва."
 toxoids.7150.c.tooltip: "Мы откажемся помогать страннику."
 toxoids.7150.d: "Язык твой прогнил, а речи полны лжи!"
 toxoids.7150.d.psionic: "Этот вариант доступен благодаря псионическим способностям нашей расы."
 toxoids.7150.d.tooltip: "Наши псионические способности позволяют разглядеть злые намерения этого создания."
 toxoids.7155.desc: "Задавайте свои вопросы, [questing_knight_6.GetAXX::милорд|||fem:миледи], и я отвечу. Но не тяните, мой преследователь уже близко!"
 toxoids.7155.a: "Кто ты?"
 toxoids.7155.b: "Что ты тут делаешь?"
 toxoids.7155.c: "Кто тебя преследует?"
 toxoids.7155.d: "Встречал ли ты других рыцарей, похожих на меня?"
 toxoids.7155.e: "Вопросов больше нет."
 toxoids.7156.desc: "Меня называют Лицедеем, я из ордена Гибельной славы. Я скромный паломник, стремящийся к духовному просветлению."
 toxoids.7157.desc: "Я странствую по галактике в поисках миров, которые посетило божество, и пытаюсь постичь его мотивы из оставленного им нечистого следа. Когда-то этот мир был полон ядовитой жизни. Увы, теперь это лишь безжизненный камень, очищенный теми, кто не в силах осознать великолепное наследие бога. Однажды, когда моё паломничество подойдёт к концу, я надеюсь отыскать бога и искупаться в его зловредной славе!"
 toxoids.7158.desc: "Богохульный невежда! Фанатичный убийца! Страж, оставленный теми, кто разрушил это некогда прекрасное место! Он попытался убить меня, опознав мои реликвии и их связь с Тлетворным."
 toxoids.7159.desc: "Да. То был печальный день. Рыцарь, благородная душа, сразу же согласился помочь мне. Увы, мой преследователь сразил его, и мне вновь пришлось бежать."
 toxoids.7160: "Сказ о рыцаре [questing_knight_6.GetName]: Плут"
 toxoids.7160.desc: "«О благородный рыцарь, коль ты сразишься за меня, прими же этот дар. Этот голографический щит скроет твой истинный облик, и врагу будет сложнее поразить тебя».\n\nПриняв дар, рыцарь [questing_knight_6.GetAXX::приготови<end_lsya>] к бою. [questing_knight_6.GetHerHisCap] соперник был закован в тяжёлые доспехи и вооружён огромным фазовым клинком. Щиты искрили, доспехи покрывались следами от ударов, и [questing_knight_6.GetFirstName] едва [questing_knight_6.GetAXX::уклони<end_lsya>] от смертельного выпада. Казалось невероятным, но [questing_knight_6.GetHerHis] соперник отлично владел боевым стилем ордена.\n\nПротивник нанёс мощный удар по доспехам, от которого голографический проектор сломался, а [questing_knight_6.GetName] [questing_knight_6.GetAXX::повали<end_lsya>] наземь. Соперник уже готовился прикончить [questing_knight_6.GetHerHis], но в последний миг замер, словно от удивления. Пользуясь замешательством, [questing_knight_6.GetFirstName] [questing_knight_6.GetAXX::нанёс|||fem:нанесла] смертельный удар, пробив вражеские доспехи.\n\n«Чудесно, прелестно! Никогда в жизни мне не было так весело!» Громкие похвалы незнакомца звучали странно и неестественно. [questing_knight_6.GetName] [questing_knight_6.GetAXX::обернул<end_a>] взгляд к поверженному врагу. Его доспехи были разбиты, и голографический камуфляж спал, открыв его истинный облик. [questing_knight_6.GetFirstName] [questing_knight_6.GetAXX::видел<end_a>] пред собою останки рыцаря ордена. «О нет, — смеётся незнакомец. — Кажется, ты [questing_knight_6.GetAXX::убил<end_a>] одного из своих товарищей. Вот незадача!» Насмешка эхом разнеслась по округе, и незнакомец исчез в облаке пурпурного дыма.\n\n[questing_knight_6.GetFirstName] [questing_knight_6.GetAXX::опусти<end_lsya>] на колено рядом с павшим товарищем, мучительно сознавая, что голограммы незнакомца обманули их обоих. В прикреплённом к доспехам контейнере [questing_knight_6.GetSheHe] [questing_knight_6.GetAXX::обнаружил<end_a>] нечто необычное — банк данных с удивительными секретами, что таят в себе токсичные моря."
 toxoids.7160.a: "Клянусь, орден отомстит тебе!"
 toxoids.7160.a.tooltip: "Когда-то этот мир был океаническим, и данные показывают, что отравленные моря можно использовать для добычи экзотических газов."
 toxoids.7164.a.desc: "Ха-ха, похоже, я недооценил твою проницательность. Неважно, я расправлюсь с тобой лично. Было бы забавно посмотреть, как ты сражаешься с собратом-рыцарем, но исход был бы один. Я вижу твоё будущее, и оно оборвётся очень скоро!"
 toxoids.7164.desc: "Неужто? Ты умнее других рыцарей, что мне встречались. Мне хотелось посмотреть, как вы будете сражаться друг с другом, но, кажется, моим планам не суждено сбыться. Но это ничего не меняет, вы оба скоро умрёте!"
 toxoids.7164.a: "Обманщик! Защищайся, отродье!"
 toxoids.7165: "Сказ о рыцаре [questing_knight_6.GetName]: Истинный облик"
 toxoids.7165.desc: "Незнакомец сбросил плащ наземь и обнажил пару мерцающих клинков. Красный свет от скрещенных мечей залил всё поле брани. После краткого обмена выпадами превосходство незнакомца стало очевидным. [questing_knight_6.GetFirstName] [questing_knight_6.GetAXX::ощущал<end_a>] себя беспомощной игрушкой в его руках.\n\n«Жалкие потуги. Неужто ты [questing_knight_6.GetAXX::возомнил<end_a>], что сможешь одолеть меня? Я могу прочесть каждый удар в твоём разуме ещё до того, как ты начнёшь двигаться». За этими словами последовала череда жестоких ударов, полностью истощивших генератор щита рыцаря. Плут продолжил свою зловещую речь: «Покров может подарить множество умений. А Идущие-сквозь-Покров, обучавшие меня, не способны заглянуть дальше своего носа! Они барахтаются на поверхности и страшатся познать глубины». Рыцарь [questing_knight_6.GetFirstName] [questing_knight_6.GetAXX::совершил<end_a>] выпад, но незнакомец играючи отбил его. «Немыслимо, что они посмели изгнать меня. МЕНЯ!»\n\nВдруг рыцарь [questing_knight_6.GetAXX::услышал<end_a>] голос $NAME_Sinople$а. «Отважный рыцарь, соперник читает твои мысли, но мои микросхемы ему неподвластны. Передай управление доспехами мне. Позволь сражаться вместо тебя». [questing_knight_6.GetFirstName] [questing_knight_6.GetAXX::расслаби<end_lsya>], и $NAME_Sinople$ перехватил контроль.\n\nСражение вмиг было окончено. $NAME_Sinople$ нанёс безжалостный удар, пока противник пытался парировать. Со вздохом изумления незнакомец пал. Ликуя, [questing_knight_6.GetName] [questing_knight_6.GetAXX::поднял<end_a>] светящиеся клинки противника, и в тот же миг тело плута исчезло в облаке пурпурного дыма."
 toxoids.7165.a: "Нет сомнений, мы ещё встретимся."
 toxoids.7165.a.tooltip: "Это лазерное оружие может стать полезным инструментом.\n\n§Y[knight.GetNamePlural]§! теперь увеличивают производство $r_alloys_gen$ в нашем государстве."
 luminous_blades: "Светящиеся клинки"
 luminous_blades_desc: "Лазерные клинки Плута — ценный инструмент, способный сослужить добрую службу нашим рыцарям."

 toxoids.7195.name: "Сказ о рыцаре [questing_knight_15.GetFirstName]: Лесная ведьма"
 toxoids.7195.desc: "В своих странствиях рыцарь [questing_knight_15.GetName] — ничем не примечательная и не особо популярная личность — [questing_knight_15.GetAXX::поймал<end_a>] сигнал, исходящий из мусорного поля в пространстве меж звёзд. [questing_knight_15.GetSheHeCap] срочно [questing_knight_15.GetAXX::проложил<end_a>] курс, чтобы разузнать, в чём дело.\n\nПриблизившись к источнику, [questing_knight_15.GetSheHe] [questing_knight_15.GetAXX::услышал<end_a>] дивный голос, взывающий из эфира: «О отважный рыцарь! Тысячи лет я ждала, когда же ты найдёшь мой небесный лес. Теперь ты здесь, и я надеюсь, что ты посетишь мою скромную обитель. Клянусь, ты не пожалеешь».\n\nСловно из ниоткуда появилась небольшая станция. Не раздумывая — ибо годы бесплодных поисков исчерпали чашу [questing_knight_15.GetHerHis] терпения — [questing_knight_15.GetFirstName] [questing_knight_15.GetAXX::направил<end_a>] корабль на стыковку."
 toxoids.7195.A: "Будь [questing_knight_15.GetAXX::осторож<end_enna>], [questing_knight_15.GetFirstName]! Это может быть ловушкой."
 toxoids.7200.diplo_title: "Сказ о рыцаре [questing_knight_15.GetFirstName]: Вход на станцию"
 toxoids.7200.name: "$NAME_Syamelle$, дух странников"
 toxoids.7200.desc: "Ступив на станцию, [questing_knight_15.GetName] [questing_knight_15.GetAXX::увидел<end_a>] женскую фигуру невероятной красоты. Она выглядела как [Owner.Species.GetName], но с первого взгляда было ясно, что это куда более могущественное существо. Она улыбалась, и [questing_knight_15.GetFirstName] [questing_knight_15.GetAXX::понял<end_a>], что [questing_knight_15.GetHerHis] восприятие красоты до сего мгновения было крайне скудным и даже ограниченным. [questing_knight_15.GetFirstName] [questing_knight_15.GetAXX::ощутил<end_a>], как в [questing_knight_15.GetNejNem] разгорается неутолимое пламя похоти.\n\n$toxoids.7200.desc.end$"
 toxoids.7200.desc.synth: "Ступив на станцию, [questing_knight_15.GetName] [questing_knight_15.GetAXX::увидел<end_a>] женскую фигуру невероятно красоты. Она выглядит как [Owner.Species.GetName], но сложно состояла из плоти и крови, и первого взгляда было ясно, что это куда более могущественное существо. Она улыбалась, и [questing_knight_15.GetFirstName] [questing_knight_15.GetAXX::понял<end_a>], что [questing_knight_15.GetHerHis] восприятие красоты до сего мгновения было крайне скудным и даже ограниченным. Несмотря на свою синтетическую природу, [questing_knight_15.GetFirstName] [questing_knight_15.GetAXX::ощутил<end_a>], как в [questing_knight_15.GetNejNem] разгорается неутолимое пламя похоти.\n\n$toxoids.7200.desc.end$"
 toxoids.7200.desc.end: "«Я $NAME_Syamelle$, дух странников и скитальцев. Я признала в тебе достойную душу, — сказала она, оглядывая [questing_knight_15.GetAXX::гостя|||fem:гостью]. — Да, более чем достойную»."
 toxoids.7200.A: "Достойную чего?"

 toxoids.7205.diplo_title: "Сказ о рыцаре [questing_knight_15.GetFirstName]: Соблазнение"
 toxoids.7205.name: "$toxoids.7200.name$"
 toxoids.7205.desc: "$NAME_Syamelle$ вновь многозначительно улыбнулась и сбросила одежду. «Я желаю провести любовный ритуал с тобой и зачать множество прекрасных потомков»."
 toxoids.7205.desc.no_clothes: "$NAME_Syamelle$ вновь многозначительно улыбнулась, подошла ближе и прикоснулась к рыцарю. «Я желаю провести любовный ритуал с тобой и зачать множество прекрасных потомков»."
 toxoids.7205.A: "С радостью."
 toxoids.7205.B: "Нет! Тебе меня не соблазнить. Умри, чаровница!"

 toxoids.7210.diplo_title: "Сказ о рыцаре [questing_knight_15.GetFirstName]: Любовное проклятие"
 toxoids.7210.name: "$toxoids.7200.name$"
 toxoids.7210.desc: "[questing_knight_15.GetName] [questing_knight_15.GetAXX::потяну<end_lsya>] к оружию, и в глазах $NAME_Syamelle$ промелькнул гнев. «Ты отвергаешь меня? Так будь [questing_knight_15.GetAXX::проклят<end_a>] ты и весь твой народ! Отныне вы не познаете любящих объятий и не ощутите огня истинной страсти; вы будете размножаться, как машины. А теперь прочь, пока я не передумала и просто не убила тебя!»\n\nОна взяла некое устройство, которое [questing_knight_15.GetFirstName] ранее не [questing_knight_15.GetAXX::замечал<end_a>], и исчезла. Впрочем, [questing_knight_15.GetFirstName] всё ещё [questing_knight_15.GetAXX::ощущал<end_a>] её присутствие и взгляд, полный презрения...\n\nБудущие хроники отметят это событие как переломный момент в истории: проклятие ведьмы отчасти стало благом, ибо рыцарей более не отвлекали плотские желания, а механическое воспроизводство населения по-своему не уступает биологическому."
 toxoids.7210.desc.synth: "[questing_knight_15.GetName] [questing_knight_15.GetAXX::потяну<end_lsya>] к оружию, и в глазах $NAME_Syamelle$ промелькнул гнев. «Ты отвергаешь меня? Мне стоило этого ожидать, ведь ты всего лишь машина, отбросившая сострадание и свободу ради стерильной металлической оболочки. Увы! Не будь мои умения бессмысленны против тебя, я прокляла бы тебя на месте. Поди прочь, пока я не надумала убить тебя».\n\nОна взяла некое устройство, которое [questing_knight_15.GetFirstName] ранее не [questing_knight_15.GetAXX::замечал<end_a>], и исчезла. Впрочем, [questing_knight_15.GetFirstName] всё ещё [questing_knight_15.GetAXX::ощущал<end_a>] её присутствие и взгляд, полный презрения...\n\nБудущие хроники не сделают каких-либо выводов из этой истории. Но все они сойдутся на том, что история вышла отличная."
 toxoids.7210.A: "Славная работа, [questing_knight_15.GetFirstName]."

 toxoids.7215.diplo_title: "Сказ о рыцаре [questing_knight_15.GetFirstName]: Выбор"
 toxoids.7215.name: "$toxoids.7200.name$"
 toxoids.7215.desc: "Последовавшие события не поддаются описанию, а [questing_knight_15.GetName] так никогда и не расскажет об этом. Когда всё закончилось, [questing_knight_15.GetFirstName] [questing_knight_15.GetAXX::обратил<end_a>] внимание на необычное устройство. Воздух вокруг него словно мерцал, переливался, и несмотря на скромные размеры, устройство излучало ауру безграничной мощи. Ничего подобного рыцарь ещё не [questing_knight_15.GetAXX::видел<end_a>].\n\n$NAME_Syamelle$ спала. [questing_knight_15.GetFirstName] [questing_knight_15.GetAXX::колеба<end_lsya>]. Инстинкты подсказывали [questing_knight_15.GetHerHim], что уходить надо сейчас, немедля, пока $NAME_Syamelle$ не проснулась. Несмотря на её красоту, в ней чувствовалась неудержимая ярость, скрытая за дружелюбной внешностью. И всё же орден, от которого [questing_knight_15.GetFirstName] [questing_knight_15.GetAXX::получал<end_a>] лишь презрение из-за долгих и бесплодных поисков, точно бы наградил [questing_knight_15.GetHerHis], вернись [questing_knight_15.GetSheHe] с этим загадочным предметом."
 toxoids.7215.A: "Взять устройство."
 toxoids.7215.B: "Поцеловать на прощание и уйти."

 toxoids.7220.name: "$toxoids.7200.name$"
 toxoids.7220.diplo_title: "Сказ о рыцаре [questing_knight_15.GetFirstName]: [questing_knight_15.GetAXX::Пойман<end_a>] за руку"
 toxoids.7220.desc: "«[questing_knight_15.GetAXX::Мошенник|||fem:Мошенница]! Ты [questing_knight_15.GetAXX::приш<end_yolla>] сюда, [questing_knight_15.GetAXX::соблазнил<end_a>] меня, а теперь пытаешься обокрасть?! Как подло! Я хотела благословить тебя за доставленное мне удовольствие, но теперь... убирайся! И устройство то можешь забрать, в нём проку нет. Прочь отсюда!»\n\n[questing_knight_15.GetName] спешно [questing_knight_15.GetAXX::покинул<end_a>] станцию. И хотя затем рыцари в крепости обнаружили, что устройство совсем даже не бесполезно, ведь оно могло манипулировать самими измерениями, [questing_knight_15.GetName] так никогда и не сможет избавиться от раздумий о том, какое благословение подарила бы [questing_knight_15.GetHerHim] $NAME_Syamelle$, не поддайся [questing_knight_15.GetSheHe] искушению во второй раз."
 toxoids.7220.A: "Уходим, быстрее!"
 toxoids.7220.A.tooltip: "На §Y[order_keep.GetName&prep]§! доступно решение §Y$decision_activate_dimensional_manipulation_device$§!, которое увеличивает жизненное пространство в колонии в обмен на $r_dark_matter_acc$."

 toxoids.7225.name: "$toxoids.7200.name$"
 toxoids.7225.diplo_title: "Сказ о рыцаре [questing_knight_15.GetFirstName]: Благословение $NAME_Syamelle$"
 toxoids.7225.desc: "$NAME_Syamelle$ открыла глаза. «Прекрасный рыцарь! Как ни прискорбно говорить, но должно нам расстаться, ибо тебя ждёт твой замок, а меня — родное измерение. Но перед уходом я хочу благословить тебя и твой народ».\n\nСтупив на борт корабля, [questing_knight_15.GetName] [questing_knight_15.GetAXX::ощутил<end_a>] прилив сил. То же [Root.GetName::почувствовал и весь <1>|||fem:почувствовала и вся <1>|||neut:почувствовало и всё <1>|||pl:почувствовали и все <1>]. В хрониках в несколько пошлых тонах отмечается, что в тот год [Root.GetSpeciesSpawnNamePlural] рождались в особо большом количестве.\n\nПоистине полезное времяпрепровождение."
 toxoids.7225.desc.synth: "$NAME_Syamelle$ открыла глаза. «Прекрасный рыцарь! МКак ни прискорбно говорить, но должно нам расстаться, ибо тебя ждёт твой замок, а меня — родное измерение. Но перед уходом я хочу благословить тебя и твой народ».\n\nСтупив на борт корабля, [questing_knight_15.GetName] [questing_knight_15.GetAXX::ощутил<end_a>] прилив сил в микросхемах. То же [Root.GetName::почувствовал и весь <1>|||fem:почувствовала и вся <1>|||neut:почувствовало и всё <1>|||pl:почувствовали и все <1>]. В хрониках в несколько пошлых тонах отмечается, что в тот год многие с тоской вспоминали свои старые органические тела: все испытывали сильные чувства друг к другу, и ко всеобщей радости пробудились давно дремавшие первобытные инстинкты.\n\nПоистине полезное времяпрепровождение."
 toxoids.7225.A: "Мы никогда её не забудем."

 toxoids.7255.name: "Возвращение легенды"
 toxoids.7255.desc: "«...[questing_knight_8.GetAXX::Преданн<end_yi>] и [questing_knight_8.GetAXX::обманут<end_yi>], [questing_knight_8.GetFirstName] [questing_knight_8.GetAXX::погиб<end_la>] по вине злого колдуна. [questing_knight_8.GetAXX::Окутанн<end_yi>] облаком пурпурного дыма, [questing_knight_8.GetHeShe] [questing_knight_8.GetAXX::исчез<end_la>] без следа. Так окончилась история одного из самых благородных рыцарей, что [questing_knight_8.GetAXX::стоял<end_a>] у истоков ордена. Так [questing_knight_8.GetAXX::завершил<end_a>] свой путь [questing_knight_8.GetFirstName]».\n\nХронисты далёкой древности рассказывали о кончине рыцаря [questing_knight_8.GetName], что воочию [questing_knight_8.GetAXX::видел<end_a>] пришествие Токсичного бога в наш мир и [questing_knight_8.GetAXX::заложил<end_a>] основы нашего ордена. Но сегодня нам придётся дополнить эти хроники, ибо [questing_knight_8.GetName] [questing_knight_8.GetAXX::верну<end_lsya>]! Орден изучил энергетический выброс на [Root.Capital.GetName&prep], после чего [questing_knight_8.GetFirstName] [questing_knight_8.GetAXX::яви<end_lsya>] из путешествия между измерениями. Орден без лишней огласки забрал [questing_knight_8.GetHerHis], чтобы удостовериться, что это именно [questing_knight_8.GetFirstName], и поведать [questing_knight_8.GetHerHim] обо всём произошедшем, пока [questing_knight_8.GetSheHe]... [questing_knight_8.GetAXX::отсутствовал<end_a>]."
 toxoids.7255.a: "Решите вопрос тихо."
 toxoids.7255.b: "Все должны узнать об этом! Устроим праздник!"
 return_of_the_knight: "Живая легенда"
 return_of_the_knight_desc: "Невероятное возвращение рыцаря-основателя ордена после долгих веков отсутствия стало поводом для радости в нашем государстве."
 toxoids.7260.name: "Общение с легендой"
 toxoids.7260.desc: "Приветствуем вас! Я оруженосец [questing_knight_82.GetFirstName]. Рыцарь [questing_knight_8.GetName] [questing_knight_8.GetAXX::попросил<end_a>] о встрече с вами. [questing_knight_8.GetHeSheCap] [questing_knight_8.GetAXX::готов<end_a>] ответить на наши вопросы и рассказать, что произошло."
 toxoids.7260.a: "Будут какие-либо замечания перед встречей?"
 toxoids.7265.desc: "[questing_knight_8.GetHeSheCap] уже [questing_knight_8.GetAXX::разобра<end_lsya>] в наших технологических достижениях и, кажется, успешно [questing_knight_8.GetAXX::приспособи<end_lsya>], но [questing_knight_8.GetHerHis] взгляды сильно отличаются от наших. Основные наши ценности сходятся, но порой [questing_knight_8.GetHeShe]... не в восторге от того, к чему пришло наше общество. Лучше избегать подобных тем."
 toxoids.7265.a: "Мы отправимся к н[questing_knight_8.GetHerHim] немедля."
 toxoids.7270.name: "$toxoids.7260.name$"
 toxoids.7270.desc: "Наконец-то ты [Root.Ruler.GetAXX::решил<end_a>] встретиться со мной. Значит, ты теперь здесь [Root.GetRulerTitle]... У меня есть важные знания о Токсичном боге, которых [Root.Ruler.GetAXX::достоин|||fem:достойна] только [Root.GetRulerTitle]. Полагаю, у тебя много вопросов. Спрашивай."
 toxoids.7270.a: "Как ты тут [questing_knight_8.GetAXX::устрои<end_lsya>]?"
 toxoids.7270.b: "Насколько правдивы легенды о тебе?"
 toxoids.7270.c: "Что происходило во время твоего... изгнания?"
 toxoids.7270.d: "Говоришь, что можешь помочь нам найти Токсичного бога?"
 toxoids.7275.desc: "Столько всего изменилось. Я [questing_knight_8.GetAXX::думал<end_a>], что возвращаюсь домой, но моего дома больше нет. Все, кого я [questing_knight_8.GetAXX::знал<end_a>], давно мертвы, и лишь в хрониках я могу прочесть о произошедшем. Я не узнаю этот мир, но по крайней мере орден до сих пор существует, поиски продолжаются и моя цель ясна."
 toxoids.7280.desc: "Хроники правдивы. Есть небольшие разночтения, но по большей части хронисты лишь сделали наши... «отчёты» более понятными. Да, мне доводилось сразить сотню чудовищ и преодолеть множество опасностей во имя любви. Но сейчас это неважно; та леди давно сгинула, как и все прочие."
 toxoids.7285.desc: "Не [questing_knight_8.GetAXX::уверен<end_a>]. Твои люди сказали, что я [questing_knight_8.GetAXX::побывал<end_a>] в другом измерении. Но для меня это был многолетний беспробудный сон. Всё, что я [questing_knight_8.GetAXX::видел<end_a>], казалось нелепицей, даже собственные чувства обманывали меня. Лишь воспоминания помогли мне пережить всё это. Воспоминания о друзьях и недругах, об отправившем меня туда колдуне и о моём гневе, но главное, воспоминания о той, кому принадлежало моё сердце. Меня окружал хаос, но даже в нём мне удалось различить кое-что важное."
 toxoids.7290.desc: "За время изгнания я многое [questing_knight_8.GetAXX::повидал<end_a>]. Я словно [questing_knight_8.GetAXX::глядел<end_a>] в расколотое зеркало: одна и та же сцена проигрывалась раз за разом, но с небольшими отличиями. Большая часть была бессмыслицей, но порой я [questing_knight_8.GetAXX::замечал<end_a>] знакомые образы.\n\nСреди них был изгнавший меня колдун. Он стоял на одинокой скале в окружении звёзд. Там он использовал своё колдовство, чтобы скрыть нечто... токсичное, возможно, самого бога. Я уже [questing_knight_8.GetAXX::разговаривал<end_a>] с лордом-командующим, и у тебя, кажется, достаточно зацепок, чтобы найти это место. Нам нужно лишь твоё дозволение, чтобы отправиться в путь."
 toxoids.7290.a: "Созовите рыцарей! Отправляемся сей же час!"
 toxoids.7295.name: "Поиски Токсичного бога: Печать"
 toxoids.7295.desc: "Данные, которые помог получить $NAME_Sinople$, позволили нам проложить путь движения Токсичного бога и определить систему, в которую он мог отправиться. Едва мы вошли в систему, [questing_knight_8.GetFirstName&gen] [questing_knight_8.GetAXX::воскликнул<end_a>]: «Он здесь! Я ощущаю его присутствие».\n\nПо [questing_knight_8.GetHerHis] указаниям мы направились к одинокой луне.\n\nПосле высадки перед рыцарями предстал никто иной, как тот самый Плут, которого недавно [questing_knight_6.GetAXX::встречал<end_a>] [questing_knight_6.GetName] и [questing_knight_8.GetName] — во времена давно минувшие.\n\n«А вы настойчивы, — сказал он. — Но ваши поиски окончатся здесь. Мой господин не потерпит, чтобы ваши глупые суеверия ещё сильнее нарушили баланс Покрова. Нет никакого Токсичного бога, а вскоре не станет и токсичных рыцарей!» Плут смолк, и мы зафиксировали многочисленные сигналы от вошедших в систему объектов."
 toxoids.7295.a: "Получай!"
 toxoids.7295.b: "Умри, еретик!"
 toxoids.7295.c: "Пришёл час мести!"
 toxoids.7300.name: "Поиски Токсичного бога: Последний трюк"
 toxoids.7300.desc.sable: "В некогда пустом пространстве расцвела червоточина. Флотилия ордена приготовила орудия к бою и в напряжении смотрела, как в системе появился десяток мелких кораблей, схожих с тем, что использовал Вороной рыцарь много десятилетий назад. Корабли устремились к луне, игнорируя наш флот.\n\nНа поверхности бушевала схватка. Над полем брани свирепствовала сверхъестественная буря, а Плут использовал все свои способности, захватывая умы наших рыцарей, создавая иллюзии и обрушивания на врагов психокинетические снаряды. Наши рыцари были непоколебимы и хорошо защищены, но колдовская мощь Плута оказалась им не по зубам.\n\nВнезапно из бури вышел отряд незнакомцев в нейтрониевых доспехах, совсем как у Вороного рыцаря. Они не выказали враждебных намерений, и вместо этого напали на Плута. Размахивая порванным знаменем, один из них объявил через встроенное переговорное устройство о надвигающемся возмездии.\n\n«Гнусный Плут! Ядом ты убил наших хозяев. Мы лишь пустые оболочки, но память их живёт в нас. Мы закончим начатое. Воздаяние грядёт!»\n\nВидя неизбежный конец, Плут разразился проклятиями. Воинство в доспехах присоединилось к рыцарям, тесня его со всех сторон. Воспользовавшись замешательством, [questing_knight_8.GetFirstName] [questing_knight_8.GetAXX::вознёс|||fem:вознесла] свой меч и [questing_knight_8.GetAXX::обезглавил<end_a>] Плута. И в миг триумфа воинство в доспехах пало и застыло без движенья. Их цель была исполнена, и ожививший доспехи ИИ отключился."
 toxoids.7300.desc: "Создания Покрова! Флотилия ордена тотчас была атакована энергетическими существами, явившимися на зов Плута. В то же время на самой луне на наших рыцарей обрушились полчища чудовищ из Покрова, подвластных отступнику Идущих-сквозь-Покров. Рыцари шаг за шагом отступали, пока не услышали клич лорда-командующего: «ЗА ОРДЕН!»\n\nЕго глас разнёсся над полем брани, рыцари перестроились вокруг командующего и вновь ринулись в сечу. В самой гуще сражения [questing_knight_8.GetAXX::хохотал<end_a>] [questing_knight_8.GetFirstName], наслаждаясь яростной схваткой. По крайней мере, эта [questing_knight_8.GetHerHis] черта осталась неизменной.\n\nВнезапно рыцарям удалось прорвать вражеские ряды. Пред ними стоял лишь Плут. Колдун-отступник обрушил поток псионической энергии прямо на лорда-командующего, но в последнее мгновение [questing_knight_8.GetName] [questing_knight_8.GetAXX::успел<end_a>] принять удар на себя. Рыцарь [questing_knight_15.GetName], что [questing_knight_15.GetAXX::прослави<end_lsya>] встречей с $NAME_Syamelle$, [questing_knight_15.GetAXX::нанёс|||fem:нанесла] Плуту решающий удар.\n\n«Презренные рыцари! Да постигнут ваш род несчастья, а память о вас сгинет без следа!»\n\nПоследние слова Плута обжигали злокозненной силой.\n\nРыцарь [questing_knight_8.GetFirstName] [questing_knight_8.GetAXX::лежал<end_a>] на земле, [questing_knight_8.GetAXX::готов<end_yi>] отправиться в мир иной. Позже в хрониках будут записаны [questing_knight_8.GetHerHis] последние слова: «Благо он сразил меня, а не командующего, ибо моя кончина и вполовину не так страшна»."
 toxoids.7300.a: "Вороные рыцари могут покоиться с миром."
 toxoids.7300.b: "[questing_knight_8.GetFirstName], не-е-ет!"
 trickster_curse: "Проклятие Плута"
 trickster_curse_desc: "Хоть плут, мешавший нашим поискам, мёртв, он оставил нам мрачный подарок."
 toxoids.7305.name: "Поиски Токсичного бога: Отворяя дверь"
 toxoids.7305.desc: "После сражения рыцари обыскали каждый уголок луны. Наконец, в глубинах южных ущелий они нашли зловещее устройство Плута. Машина покрывалась трещинами, источая потоки псионической энергии — со смертью создателя она постепенно теряла стабильность. Мгновения спустя от неё осталась лишь горстка пепла.\n\nНаходящиеся на орбите корабли доложили о странном подпространственном феномене на окраине системы: сама гравитация исказилась, раскрывая доселе запертый гиперкоридор. Энергетический всплеск от этого события стал причиной мощного электромагнитного импульса, который выжег большую часть систем на кораблях ордена.\n\nЧтобы в полной мере осознать произошедшее в тот день, мы должны отправить туда собственную флотилию."
 toxoids.7305.a: "Отправьте ближайшую флотилию!"
 toxoids.7305.a.tooltip: "Мы должны раскрыть секреты системы §Y[toxic_god_system.GetName&gen]§!."
 toxoids.7310.name: "Поиски Токсичного бога: Явление божества"
 toxoids.7310.desc: "Система [from.GetName&gen] окутана кислотными туманами, а в них блуждает токсичное существо, которое мы искали. Металлические челюсти, хитиновый панцирь, щупальца и газовые мешки. Этот космический исполин излучает кислотный зелёный свет. Нам здесь не рады."
 toxoids.7310.a: "Уродство, какое не описать словами!"
 toxoids.7310.b: "Бог испытывает нас! Приготовить флотилию!"
 toxoids.7311.name: "Токсичная сущность"
 toxoids.7311.desc: "Система [from.GetName&gen] окутана кислотными туманами, а в них блуждает токсичное существо. Металлические челюсти, панцирь. Щупальца и газовые мешки. Этот космический исполин пугает и излучает кислотный зелёный свет. Нам здесь не рады."
 toxoids.7311.a: "Что за..."
 toxoids.7312.name: "Поиски Токсичного бога: Провал"
 toxoids.7312.desc: "Что бы ни обитало в системе [from.GetName&gen], теперь его там нет. В кислотных туманах жило существо, избравшее это место своим домом, но следы сражения указывают, что оно было уничтожено другой космической цивилизацией ещё до того, как мы сумели его выследить. Очевидно, что это создание не было богом, но все следы ведут сюда. Не имея иных зацепок, рыцарский орден впадал в отчаяние."
 toxoids.7312.A: "Мы не верим... и не поверим."
 toxoids.7312.tooltip: "Возможно, однажды мы найдём Токсичного бога, но пока не знаем, где искать."
 toxoids.7315.name: "Поиски Токсичного бога: Испытание пройдено"
 toxoids.7315.desc: "Токсичный бог повержен, его участь теперь в наших руках.\n\nАнализ показывает сходство химического состава его выделений с веществами, обнаруженными в нашем мире, но это сходство не полное. Это истинный бог или его потомок? Возможно, есть и другие. Или же это просто космический зверь? Какой бы ни была правда, наши учёные полагают, что мы можем вылечить это существо. Мы могли бы распоряжаться им."
 toxoids.7315.a: "O Токсичный бог, покарай наших врагов!"
 toxoids.7315.a.tt: "Поиски окончены. Мы возьмём под контроль §YТоксичного бога§! — §YКолосса§!, способного отравлять миры.\nПозволяет преобразовывать §Yтоксичные кандидаты на терраформирование§! в пригодные для жизни миры.\n§RВ связи с окончанием поисков многие [knight.GetIcon] рыцари со временем покинут орден.§!"
 toxoids.7315.b: "Это не бог. Убить его!"
 toxoids.7315.b.tt: "Плут был прав. Это не бог. Мы продолжим поиски."
 toxoids.7320.name: "Судьба ордена"
 toxoids.7320.desc: "Токсичный бог найден, но теперь орден утратил смысл существования. Мелкие приключения и стычки не годятся для рыцарей, привыкших к доблести и славе! Утратив решимость и цель, всё больше рыцарей покидают ряды ордена.\n\nСегодня лорд-командующий дал всем оставшимся рыцарям право выбрать: остаться или уйти прочь с его благословением. Многие отправились на поиски иной жизни. Другие организовались в отряды странствующих рыцарей и отправились скитаться по галактике в поисках новых приключений."
 toxoids.7320.a: "Конец эпохи."
 toxoids.7320.a.tt: "§R£building£ Орденская крепость теперь поддерживает меньше [knight.GetIcon] рыцарей§!."

 toxoids.7510.name: "Токсичная сущность убита"
 toxoids.7510.desc.origin: "Побеждённая в системе [toxic_god_system.GetName&gen] сущность не была богом, ведь иначе мы не смогли бы убить её.\n\nЕё тело корчится в предсмертных конвульсиях, и ядовитые железы лопаются, распространяя по системе коррозионное вещество. Благодаря быстрым манёврам уклонения наши флотилии сумели отойти на безопасное расстояние, а вот самой сущности повезло меньше: под влиянием собственного яда её плоть стремительно разлагается, и в итоге остаётся лишь утроба. Рыцарский орден забрал её в качестве трофея, который будет выставляться лишь по особым случаям как знак выдающихся достижений ордена."
 toxoids.7510.desc.not_origin: "Мы убили токсичную сущность в системе [toxic_god_system.GetName&gen]. Её тело корчится в предсмертных конвульсиях, и ядовитые железы лопаются, распространяя по системе коррозионное вещество. Благодаря быстрым манёврам уклонения наши флотилии сумели отойти на безопасное расстояние, а вот самой сущности повезло меньше: под влиянием собственного яда её плоть стремительно разлагается, и в итоге остаётся лишь утроба."
 toxoids.7510.A: "Теперь она не такая уж божественная!"
 toxoids.7510.A.reanimators: "Увы, останки воскресить не удастся"

 ##Single Events

 toxoids.8000.name: "Награда за поиски"
 toxoids.8000.desc: "Группа рыцарей только что вернулась из долгих странствий. Их корабли повреждены, а силовая броня видала лучшие деньки. Это было тяжёлое путешествие, которое дало им небольшие, но бесценные знания о Токсичном боге. Несмотря на пережитые трудности, они полны энтузиазма, ибо вернулись не с пустыми руками, и их истории займут достойное место в хрониках."
 toxoids.8005.name: "Просьба о дополнительном финансировании"
 toxoids.8005.desc: "Веками государство направляло значительные ресурсы на поиски и орден, и недавние попытки изменить политику и сократить финансирование рыцарей были восприняты без восторга. Рыцари и оруженосцы недовольны, и многие из рядовых граждан их поддерживают, считая, что мы забываем о своём долге. Лорд-командующий направил официальное прошение вернуться к традиционной системе финансирования, и многие в государстве поддержали эту петицию."
 toxoids.8005.a: "Они правы, поиски для нас на первом месте."
 toxoids.8005.b: "Нет, поиски придётся отложить."
 toxoids.8005.c: "Мы сделаем пожертвование, чтобы успокоить их."
 knight_budget_demand: "Получены дополнительные средства"
 toxoids.8010.name: "Вековые поиски"
 toxoids.8010.desc: "Сто лет назад мы смотрели на звёзды. Это было новое начало и для нас, и для поисков. Возможности казались безграничными. Прошло сто лет, и мнения жителей разделились. Наши достижения очевидны, но многие сомневаются, нужны ли нам рыцари и их поиск. Возможно, они просто реликвии ушедшей эпохи?"
 toxoids.8010.a: "Нет. Мы устроим фестиваль в честь наших рыцарей!"
 toxoids.8010.b: "У нас нет на это времени!"
 toxoids.8010.c: "Да. Это было столетие неудач. Пора покончить с этим."
 toxoids.8010.c.tooltip: "§RЭто завершит поиски, уничтожит орден и все связанные с ним сооружения и районы§!"

 toxoids.8015.name: "Падение орденской крепости"
 toxoids.8015.desc.a: "Крепость пала. Бесценные трофеи и реликвии растащили мародёры. Но в хаосе эвакуации несколько отважных рыцарей сумели сохранить наши бесценные исследования в потайной комнате архивов. Они в безопасности, хотя бы на время, но без доступа к этим знаниям орден не может функционировать."
 toxoids.8015.desc.b: "Крепость пала. Бесценные трофеи и реликвии растащили мародёры. Но в хаосе эвакуации несколько отважных рыцарей сумели сохранить наши бесценные исследования в потайной комнате архивов. Они в безопасности, хотя бы на время, но без доступа к этим знаниям мы не можем продолжать поиски."
 toxoids.8015.a: "Мы должны отбить крепость любой ценой!"
 toxoids.8017.name: "Уничтожение орденской крепости"
 toxoids.8017.desc.a: "Крепость уничтожена, разбита на кучу дрейфующих в космосе обломков. Лорд-командующий мёртв, как и большинство рыцарей и оруженосцев. Архивы уничтожены. Потери невозможно оценить. Немногие выжившие рыцари срочно отозваны. Будущее ордена лежит в руинах."
 toxoids.8017.desc.b: "Крепость уничтожена, разбита на кучу дрейфующих в космосе обломков. Лорд-командующий мёртв, как и большинство рыцарей и оруженосцев. Архивы уничтожены. Потери невозможно оценить. После такого мы уже не сможем продолжить поиски. Немногие выжившие рыцари срочно отозваны. Будущее ордена лежит в руинах."
 toxoids.8017.desc.c: "Крепость запечатана. Отныне нам навеки закрыт вход в эту дрейфующую в космосе гробницу. Лорд-командующий пропал навсегда, как и большинство рыцарей и оруженосцев. Связь с архивами утрачена. Потери невозможно оценить. Немногие выжившие рыцари срочно отозваны. Будущее ордена лежит в руинах."
 toxoids.8017.desc.d: "Крепость запечатана. Отныне нам навеки закрыт вход в эту дрейфующую в космосе гробницу. Лорд-командующий пропал навсегда, как и большинство рыцарей и оруженосцев. Связь с архивами утрачена. Потери невозможно оценить. О продолжении поисков теперь остается лишь мечтать. Немногие выжившие рыцари срочно отозваны. Будущее ордена лежит в руинах."
 toxoids.8017.a: "Невозможно..."
 toxoids.8020.name: "Судьба Токсичного бога"
 toxoids.8020.desc: "Обнаружив токсичную сущность, рыцари потеряли след Токсичного бога. Связь между ними не вызывает сомнений, но, согласно архивам, сущность меркнет в сравнении с богом, который был куда сильнее и обладал разумом.\n\nНо сегодня наши поиски Токсичного бога подошли к концу. Мы обнаружили следы токсичной субстанции, извергнутые из сверхмассивной чёрной дыры в центре галактики. Хоть это и кажется невозможным, но мы уверены, что Токсичный бог внутри нее. И нам до него уж точно не добраться.\n\nЛорд-командующий приказал всем рыцарям искать всё, что хоть как-то связано с чёрной дырой, но шансов на успех почти нет..."
 toxoids.8020.a: "Мы не успокоимся, пока не найдём способ!"
 toxoids.8020.b: "Или есть?.."
 toxoids.8020.cosmogenesis: "Этот вариант доступен, потому что у нас есть бонус за стремление §YКосмогенез§!."
 advanced_logic_from_knights: "[knight.GetIcon] §Y[knight.GetNamePlural]§! теперь дополнительно производят §G+1§! £advanced_logic£ новой логики.\n£job_knight_commander£ §Y$job_knight_commander$§! теперь дополнительно производит §G+2§! £advanced_logic£ новой логики."
 toxoids.8025.name: "Возвращение орденской крепости"
 toxoids.8025.desc: "Мы отбили орденскую крепость. Наши укрепления и владения разрушены, разобраны оккупантами, но их можно восстановить. У нас вновь есть доступ к архивам, и рыцари могут продолжить свои поиски."
 toxoids.8025.a: "Славный день!"


 toxoids.8030.name: "Триумфальное возвращение"
 toxoids.8030.desc: "Посадку в нашем восстановленном родном мире многие воспринимают как общую победу в поисках Токсичного бога. Бесчисленные испытания, выпавшие на нашу долю с тех пор, как божество отравило нашу родину, сплотили и закалили нас. Мы стали сильными, едиными и стойкими перед лицом любой угрозы.\n\nВозвращение домой открывает новую главу в истории ордена."
 toxoids.8030.a: "Хвала небесам!"

 ##Policy

 policy_knightly_duties: "Рыцарские обязанности"
 policy_knightly_duties_desc: "Наши рыцари — элита нашего государства. Верные, преданные, честные, они являются воплощением рыцарских идеалов, и если мы решим отвлечь их от странствий, их многочисленные навыки помогут нам найти своё место в галактике.\n\n"
 toxic_knights_questing_name: "Странствующие рыцари"
 questing_knights: "$toxic_knights_questing_name$"
 questing_knights_desc: "Наши рыцари сосредоточатся на своих поисках в ущерб всему остальному. Мы отыщем Токсичного бога, где бы он ни был.\n§GЭто принесёт пользу поискам.§!\n\n"
 toxic_knights_military_name: "Рыцари-командующие"
 military_knights: "$toxic_knights_military_name$"
 military_knights_desc: "Наши рыцари должны служить на поле боя. Мы не можем позволить себе отказаться от своих лучших бойцов.\n\n"
 military_knights_nomad: "$military_knights$"
 military_knights_nomad_desc: "$military_knights_desc$"
 toxic_knights_diplomats_name: "Придворные рыцари"
 diplomats_knights: "$toxic_knights_diplomats_name$"
 diplomats_knights_desc: "Наши рыцари отправятся в качестве послов представлять наши дипломатические интересы.\n§GЭто принесёт пользу поискам.§!\n\n"
 toxic_knights_herald_name: "Рыцари-герольды"
 herald_knights: "$toxic_knights_herald_name$"
 herald_knights_desc: "Мы используем рыцарей, чтобы оглашать указы в наших владениях и вдохновлять население.\n\n"

 ##Holdings

 holding_knight_commandery: "Командорство ордена"
 holding_knight_commandery_desc: "На этом укреплённом форпосте наши рыцари сотрудничают с вассалом для поисков Токсичного бога. Наши подданные должны предоставлять ресурсы и данные для поддержки ордена."
 job_overlord_knight_commandery_effect_desc: "[knight.GetIcon] $job_overlord_knight_plural$ превращают $r_alloys_acc$ в $r_stability_acc$ и создают $r_defense_army_plural_acc$ для подданного в обмен на $r_unity_acc$ и $r_research_acc$ для сюзерена."
 job_overlord_knight: "Рыцарь сюзерена"
 job_overlord_knight_plural: "Рыцари сюзерена"
 job_overlord_knight_desc: "$job_knight_desc$"
 job_overlord_knight_drone: "Рыцарь сюзерена"
 job_overlord_knight_drone_plural: "Рыцари сюзерена"
 job_overlord_knight_drone_desc: "$job_knight_desc$"
 mod_job_overlord_knight_add: "Должности рыцарей сюзерена"
 mod_job_overlord_knight_drone_add: "Должности рыцарей сюзерена"
 building_knightly_theme_park: "Рыцарская ярмарка"
 building_knightly_theme_park_desc: "Это сооружение похоже на крепость, но в действительности представляет собой парк, посвящённый рыцарям и их поискам. Гости могут купить автографы, фигурки и голопостеры своих любимых рыцарей. Разумеется, на самом деле это место служит для сбора информации и поисков и как пункт снабжения странствующих рыцарей."
 knightly_theme_park_quest_effect_desc: "§GУвеличивает прогресс поисков токсичных рыцарей на 0.01 в месяц.§!"

 ##Misc

 low_motivation: "Недостаток мотивации"
 low_motivation_desc: "После погружения в Покров население утратило способность радоваться: некогда приятные ощущения притупились, сложно найти мотивацию даже для самых простых дел."
 malcontent_knights: "Бунтующие рыцари"
 malcontent_knights_desc: "Рыцари недовольны, и их негодование распространилось на население."
 motivated_knights: "Мотивированные рыцари"
 motivated_knights_desc: "Наши рыцари полны энтузиазма, несмотря на тяготы поисков."
 demotivated_knights: "Подавленные рыцари"
 demotivated_knights_desc: "Поиски утомительны, а цель недостижима. Порой всё кажется бессмысленным. Боевой дух рыцарей немного снизился."
 despair_of_the_knightly_order: "Отчаяние рыцарского ордена"
 despair_of_the_knightly_order_desc: "Долгие поиски Токсичного бога завершились провалом. В отсутствие новых зацепок многие задаются вопросом, стоит ли продолжать поиски."

 #Overtuned

 origin_overtuned: "Разогнанные"
 origin_overtuned_desc: "Эта цивилизация использует все возможные органические улучшения, невзирая на риски и последствия. Лучше сгореть в яркой вспышке, чем тихо истлеть."
 origin_overtuned_effects: "Продвинутые биологические признаки доступны сразу, они лучше и дешевле обычных, но несут в себе дополнительные риски."
 origin_tooltip_overtuned_effects: "$t$- Доступные признаки при создании расы:\n$tt$- ['concept_overtuned_traits']\n$t$- Разогнанные признаки:\n$tt$- Можно усилить указом ['concept_damn_the_consequences']\n$tt$- Можно менять с помощью §Iгенетической модификации§!\n$t$- $ADDITIONAL_TECHNOLOGIES_STRING$\n$tt$- £society£ ['concept_gene_tailoring', $tech_gene_tailoring$]"
 START_SCREEN_OVERTUNED: "Природа — неторопливый изобретатель. Эволюция тянется невообразимо медленно. Для процветания необходимы сила, скорость и умственные способности, и они нужны сейчас, а не через миллион лет. Естественный отбор не спешит нас одаривать, так что пора улучшать себя самим.\n\nПоэтому наша цивилизация основана на принципе неограниченного улучшения физических тел. Эти улучшения позволили нам объединить свой мир под одним знаменем, а теперь поведут нас к звёздам.\n\nБлагодаря генетически улучшенным мозгам и мышцам, а также храбрости, мы добьёмся процветания среди звёзд... доступного лишь идеально спроектированным расам."
 START_SCREEN_OVERTUNED_NOMADS: "Природа — неторопливый изобретатель. Эволюция тянется невообразимо медленно. Для процветания необходимы сила, скорость и умственные способности, и они нужны сейчас, а не через миллион лет. Естественный отбор не спешит нас одаривать, так что пора улучшать себя самим.\n\nКосмическая пустота не терпит слабости. Эти улучшения закалили нас перед её натиском и объединили наш народ под одним знаменем. И теперь они поведут нас дальше.\n\nБлагодаря генетически улучшенным мозгам и мышцам, а также храбрости, мы добьёмся процветания среди звёзд... доступного лишь идеально спроектированным расам."
 disables_overtuned_features: "§RВыбор этого бонуса за стремление отключит механики происхождения «Разогнанные».§!"

