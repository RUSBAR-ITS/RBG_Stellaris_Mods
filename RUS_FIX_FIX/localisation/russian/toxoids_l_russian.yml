l_russian:

 TOXOIDS_TITLE: "Toxoids Species Pack" # Do not translate
 DLC_TOXOIDS_RECOMMENDATION_DESC: "С набором рас §S$TOXOIDS_TITLE$§! вы сможете заявить о себе, представляя самые живучие и упорные расы в Stellaris! Эксплуатируйте токсичные миры, рискуйте будущим планет ради сиюминутных выгод и приносите значительные жертвы ради выживания во враждебной галактике."
 DLC_TOXOIDS_RECOMMENDATION_COSMETICS: "Мы рекомендуем §S$TOXOIDS_TITLE$§!, поскольку заметили, что вы любите подобные наборы."
 DLC_TOXOIDS_RECOMMENDATION_POST_APOCALYPTIC: "Мы рекомендуем §S$TOXOIDS_TITLE$§!, поскольку вы выбрали государство с апокалиптической тематикой."
 DLC_TOXOIDS_RECOMMENDATION_ENVIRONMENTALIST: "Мы рекомендуем §S$TOXOIDS_TITLE$§! в качестве альтернативы выбранному вами государству, учитывая его взаимоотношения с окружающей средой."
 DLC_TOXOIDS_RECOMMENDATION_WASTEFUL_ADAPTIVE: "Мы рекомендуем §S$TOXOIDS_TITLE$§!, поскольку ваша раса хорошо вписывается в тематику расточительства и приспосабливаемости."
 DLC_TOXOIDS_RECOMMENDATION_VOID_DWELLERS: "Мы рекомендуем §S$TOXOIDS_TITLE$§!, поскольку происхождение «$origin_toxic_knights$» добавляет новые возможности игры с орбитальными поселениями."

 #Knights of the Toxic God

 origin_toxic_knights: "Рыцари Токсичного бога"
 origin_toxic_knights_desc: "Сотни лет назад родной мир этой расы посетила токсичная сущность. Последовавшая экологическая катастрофа разрушила половину мира, но способствовала объединению выживших, поклоняющихся Токсичному богу. Для поисков бога был создан рыцарский орден, и хотя многое изменилось с тех пор, их поиски продолжаются."
 origin_toxic_knights_shared_effects: "$t$- Инцидент: ['concept_knights_quest']\n$t$- Доступные политики: §IРыцарские обязанности§!\n$t$- $AVAILABLE_HOLDINGS$ £building£ ['concept_knight_commandery']"
 origin_toxic_knights_effects: "$t$- $HOMEWORLD$\n$tt$- ['concept_toxic_features']\n$tt$- Уникальное ['concept_pc_habitat', орбитальное поселение]:\n$ttt$- £building£ ['concept_order_keep', $building_order_keep$]\n$ttt$- £district£ ['concept_orders_demesne', $district_orders_demesne$]\n$ttt$- Должности ['concept_politician', политиков] заменяются на ['concept_order_jobs', орденские]\n$origin_toxic_knights_shared_effects$"

 origin_toxic_knights_negative_effects: "$t$- $INITIAL_POPS$ §R-300§!"
 origin_toxic_knights_nomadic: "$origin_toxic_knights$"
 origin_toxic_knights_nomadic_desc: "$origin_toxic_knights_desc$"
 origin_toxic_knights_nomadic_effects: "$t$- $HOME_SYSTEM$\n$tt$- ['concept_toxic_features'] у бывшего родного мира\n$t$- Столичный ['concept_arkship', корабль-ковчег]:\n$tt$- £building£ ['building:building_order_keep']\n$tt$- £district£ ['concept_orders_demesne', $district_orders_demesne$]\n$t$$origin_toxic_knights_shared_effects$"
 origin_toxic_knights_nomadic_negative_effects: "$t$- Нельзя ['concept_arkship_settle', осесть], пока не будут завершены ['concept_knights_quest', поиски Токсичного бога]\n$t$- $INITIAL_POPS$ §R-1100§!"
 toxic_knights_settling_unlocked_tt: "§GНаши поиски завершены. Теперь орден может ['concept_arkship_settle', осесть].§!"
 arkship_settle_knights_keep_only_tt: "$TRIGGER_FAIL$§RМы не можем бросить крепость.§!"
 SETTLE_BLOCKED_BY_KNIGHTS_QUEST: "$TRIGGER_FAIL$§RОрден не станет селиться на планете, пока поиски не будут завершены.§!"
 START_SCREEN_TOXIC_KNIGHTS: "Давным-давно наша планета была разобщена. Мелочные короли непрерывно враждовали друг с другом, а население гибло во имя их амбиций. Но с приходом первого верховного короля всё изменилось. Новый лидер сумел выковать доселе невиданное королевство.\n\nНо главной чертой верховного короля была набожность. Началась война против отринувших бога, но еретики не уступали. Молитвы короля были услышаны, и в наш мир явился Токсичный бог. Его присутствие было недолгим, но он отравил земли неверующих. Выжившие поклялись в верности верховному королю. Впервые за всю историю наш мир объединился.\n\nВскоре Токсичный бог покинул нас, и король вознамерился отыскать его. Для этого он основал рыцарский орден, и на протяжении последующих веков эти отважные воители вели поиски, но всё было напрасно. Токсичный бог давно покинул наш мир. Следующая глава поисков будет начертана среди звёзд. С помощью могущественных реликвий орден построил нашу первую орбитальную станцию. Этот могучий бастион станет отправной точкой в их путешествии в глубины космоса."
 START_SCREEN_TOXIC_KNIGHTS_CORPORATE: "Давным-давно наша планета была разобщена. Мелочные короли непрерывно враждовали друг с другом, а население гибло во имя их амбиций. Но с приходом первого верховного короля всё изменилось. Новый лидер сумел выковать доселе невиданное королевство.\n\nНо главной чертой верховного короля была набожность. Началась война против отринувших бога, но еретики не уступали. Молитвы короля были услышаны, и в наш мир явился Токсичный бог. Его присутствие было недолгим, но он отравил земли неверующих. Выжившие поклялись в верности верховному королю. Впервые за всю историю наш мир объединился.\n\nВскоре Токсичный бог покинул нас, и король вознамерился отыскать его. Для этого он основал рыцарский орден, и на протяжении последующих веков эти отважные воители вели поиски, но всё было напрасно. Сами же поиски оказались дорогостоящим проектом. Со временем королевство изыскивало всё новые способы извлечения прибыли, чтобы поддержать рыцарей. Живя и потребляя, каждый гражданин поддерживает поиски, а наши воители стали всеобщими кумирами.\n\nТоксичный бог давно покинул наш мир, и следующая глава поисков будет начертана среди звёзд. С помощью могущественных реликвий орден построил нашу первую орбитальную станцию. Этот могучий бастион станет отправной точкой в их путешествии в глубины космоса."
 START_SCREEN_TOXIC_KNIGHTS_NOMADS: "Давным-давно наша планета была разобщена. Мелочные короли непрерывно враждовали друг с другом, а население гибло во имя их амбиций. Но с приходом первого верховного короля все изменилось. Новый лидер сумел выковать доселе невиданное королевство.\n\nНо главной чертой верховного короля была набожность. Началась война против отринувших бога, но еретики не уступали. Молитвы короля были услышаны, и в наш мир явился Токсичный бог. Его присутствие было недолгим, но он отравил земли неверующих. Выжившие поклялись в верности верховному королю. Впервые за всю историю наш мир объединился.\n\nХотя Токсичный бог покинул нас, его влияние продолжило распространяться и вскоре сделало мир непригодным для жизни. Король вознамерился спасти нас. Для этого он основал рыцарский орден, и на протяжении последующих веков эти отважные воители вели поиски, но все было напрасно. Токсичный бог давно покинул наш мир. Следующая глава поисков будет начертана среди звёзд. С помощью могущественных реликвий орден построил наш первый корабль-ковчег — мобильную крепость, которая станет домом последним из нас, пока мы блуждаем в поисках среди звёзд."
 job_knight: "Рыцарь"
 job_knight_plural: "Рыцари"
 job_knight_desc: "Хорошо обученные, прекрасно образованные и добродетельные. Рыцари олицетворяют лучшие черты нашего общества, и они посвятили себя поискам Токсичного бога."
 job_knight_effect_desc: "[knight.GetIcon] [knight.GetNamePlural] превращают $r_alloys_acc$ в $r_unity_acc$ и $r_research_acc$, увеличивают $r_naval_capacity_acc$ и создают $r_defense_army_plural_acc$.\nЗавершение §Yрыцарских поисков§! может повысить их эффективность."
