 concept_toxic_blocker: "Токсичное препятствие"
 concept_toxic_blocker_desc: "£blocker£ §H$concept_toxic_blockers$§! остаются после очищения, когда §Hтоксичный мир§! ['concept_terraforming', терраформируется] в ['concept_habitable_world', пригодный для жизни].\n\nОни бывают следующими:\n- $d_tainted_snowcaps$\n- $d_poisonous_algae$\n- $d_venomous_insects$\n- $d_unpleasant_atmosphere$\n- $d_rotten_soil$"
 concept_toxic_blockers: "Токсичные препятствия"
 concept_toxic_blockers_desc: "$concept_toxic_blocker_desc$"
 arkship_knights_detox_desc: "§LТоксичное небо — не преграда для истинно верующих. Корабль-ковчег рассеет едкую атмосферу мира и выкачает все токсины из почвы, и в этом новом мире сможет существовать жизнь.§!"
 arkship_knights_detox_activity_key: "Очищает мир от токсинов"
 arkship_knights_detox_progress_activity_key: "Очищает мир (§Y$PROGRESS$%§!)"
