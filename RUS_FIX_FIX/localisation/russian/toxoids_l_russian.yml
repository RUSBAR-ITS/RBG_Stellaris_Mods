 building_toxic_bath: "Мутагенные ванны"
 building_toxic_bath_tt: "Модификаторы от сооружения усиливаются за счёт £district£ развития района.\n$zone_industrial$, $zone_foundry$ или $zone_factory$ удвоит модификаторы от сооружения."
 building_toxic_bath_hive: "Мутагенные резервуары"
 building_toxic_bath_machine: "Ёмкости для гиперсмазки"
 building_toxic_bath_desc: "Хотя мутагенные ванны являются продвинутыми терапевтическими центрами и их положительное влияние на здоровье хорошо изучено, некоторые всё равно с отвращением относятся к используемым в них методам. Каждая капля жидкости из этих ванн обладает большей мутагенностью, чем большинство запрещённых в галактике веществ."
 building_toxic_bath_hive_desc: "Мутагенные резервуары наглядно демонстрируют, каких высот может достичь улей при полной концентрации на обслуживании непрерывно растущего сознания."
 building_toxic_bath_machine_desc: "Ёмкости для гиперсмазки являются наиболее логичным ответом на проблемы с трением, перегревом и статическим электричеством при обслуживании сложных модулей."

