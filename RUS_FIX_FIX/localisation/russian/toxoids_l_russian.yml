 planet_knights: "Рыцари"
 job_knight_plural_and_commander_with_icon: "£job_knight_commander£ $job_knight_commander_plural$ и [knight.GetIcon] [knight.GetNamePlural]"

 job_squire: "Оруженосец"
 job_squire_plural: "Оруженосцы"
 job_squire_plural_with_icon: "[squire.GetIcon] [squire.GetNamePlural]"
 job_squire_desc: "Чтобы стать рыцарем, нужно готовиться долгие годы. Те, кто стремится вступить в орден, должны сперва послужить рыцарям, обучаясь на их примере и пытаясь сделать их благородную жизнь более удобной."
 job_squire_effect_desc: "[squire.GetIcon] [squire.GetNamePlural] производят $r_amenities_acc$ и повышают §Yэффективность работы§! §Y[knight.GetIcon] [knight.GetNamePlural]§!."
 mod_job_squire_add: "Должности [squire_rinfix.GetName]"
 mod_job_squire_per_pop: "§G+1§! должность [squire.GetName] за каждые $VALUE$ поселений"
 mod_job_squire_per_pop_short: "\n§G+1§! £mod_job_squire_add£ за каждые $VALUE$ £pop£"

 knights_more_unity_tooltip: "[knight.GetIcon] §Y[knight.GetNamePlural]§! будут производить ещё §G+2§! £unity£ единства, а их §Yсодержание§! повысится на §R15%§!.\n£job_knight_commander£ §Y$job_knight_commander$§! будет производить ещё §G+4§! £unity£ единства."
 knights_more_research_tooltip: "[knight.GetIcon] §Y[knight.GetNamePlural]§! будут производить ещё §G+1§! £physics_research£ £society_research£ £engineering_research£ исследований, а их §Yсодержание§! повысится на §R15%§!.\n£job_knight_commander£ §Y$job_knight_commander$§! будет производить ещё §G+2§! £physics_research£ £society_research£ £engineering_research£ исследований."

 job_knight_commander: "Лорд-командующий"
 job_knight_commander_plural: "Лорды-командующие"
 job_knight_commander_desc: "Рыцари достойны и отважны — это лучшие представители нашего общества. Но даже они нуждаются в руководстве. Они с радостью отправятся туда, куда укажет лорд-командующий."
 job_knight_commander_effect_desc: "£job_knight_commander£ $job_knight_commander_plural$ превращают $r_alloys_acc$ в $r_unity_acc$ и $r_amenities_acc$ и увеличивают £mod_country_naval_cap_add£ §Yвместимость флота§!.\nЗавершение §Yрыцарских поисков§! может повысить их эффективность."
 job_knight_commander_research_effect_desc: "£job_knight_commander£ $job_knight_commander_plural$ превращают $r_alloys_acc$ в $r_unity_acc$, $r_research_acc$ и $r_amenities_acc$ и увеличивают £mod_country_naval_cap_add£ §Yвместимость флота§!.\nЗавершение §Yрыцарских поисков§! может повысить их эффективность."
 mod_job_knight_commander_add: "Должности лордов-командующих"
 mod_job_knight_commander_per_pop: "§G+1§! должность лорда-командующего за каждые $VALUE$ поселений"
 mod_job_knight_commander_per_pop_short: "\n§G+1§! £mod_job_knight_commander_add£ за каждые $VALUE$ £pop£"

 planet_squires: "Оруженосцы"
 district_orders_demesne: "Владения ордена"
 district_orders_demesne_plural: "Владения ордена"
 district_orders_demesne_desc: "Орден не удовольствуется лишь одним замком или космической базой! Он может процветать только на обширных пространствах, в мирах и системах, изобилующих садами и охотничьими угодьями."

