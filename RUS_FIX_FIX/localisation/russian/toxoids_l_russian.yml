 building_order_keep: "Орденская крепость"
 building_order_keep_desc: "Ставка ордена — дом для его рыцарей. В нём можно найти обширные архивы и многочисленные трофеи, накопленные за долгую и яркую историю."
 building_order_keep_effect: "§RЭто сооружение нельзя снести или отключить!§!\n\n"
 toxic_knights_start_NAME: "Наследие токсичного бога"
 toxic_knights_start_DESC: "Стандартная стартовая система при выборе происхождения «$origin_toxic_knights$»."
 toxic_knights_sol_start_NAME: "Токсичный бог (Солнце)"
 toxic_knights_sol_start_DESC: "Возможная стартовая система происхождения «$origin_toxic_knights$» с Солнцем в качестве базы."

 d_toxic_god_pools_most_venemous: "Крайне ядовитые пруды"
 d_toxic_god_pools_most_venemous_desc: "Токсичный бог оставил после себя множество крайне ядовитых прудов, из которых можно извлечь остатки его отравы."
 d_toxic_god_pools_most_venemous_upgraded: "Крайне смертоносные токсины"
 d_toxic_god_pools_most_venemous_upgraded_desc: "Токсичный бог оставил после себя множество крайне ядовитых прудов, из которых можно извлечь остатки его отравы. Благодаря стараниям рыцарей Токсичного бога мы можем собрать этот яд и распорядиться им по своему усмотрению."
 d_toxic_god_pestilential_wasteland: "Чумные пустоши"
 d_toxic_god_pestilential_wasteland_desc: "Не все достойны благословения божества. Его уход разорил многие земли, которые не восстановятся уже никогда."
 d_toxic_god_pestilential_wasteland_upgraded: "Возвращённая эпидемия"
 d_toxic_god_pestilential_wasteland_upgraded_desc: "$d_toxic_god_pestilential_wasteland_desc$ Однако найденная рыцарями броня позволила нам трудиться в этих краях без вреда для себя."
 d_toxic_god_deitys_swarms: "Божественный рой"
 d_toxic_god_deitys_swarms_desc: "Вслед за божеством распространились и начали процветать доселе неизвестные этому миру насекомые. Их пагубное присутствие продолжает терзать нас, пока мы пытаемся возделывать эти земли."
 d_toxic_god_deitys_swarms_upgraded: "Укрощённые рои"
 d_toxic_god_deitys_swarms_upgraded_desc: "Вслед за божеством распространились и начали процветать доселе неизвестные этому миру насекомые. Мы овладели искусством их разведения, ибо они вкусны, а яд их силён."
 d_toxic_god_blight_upon_the_land: "Очаг проказы"
 d_toxic_god_blight_upon_the_land_desc: "Говорят, что божество пришло в гнев и поразило эти земли. От того, что когда-то стояло здесь, почти ничего не осталось."
 d_toxic_god_blight_upon_the_land_upgraded: "Чумной памятник"
 d_toxic_god_blight_upon_the_land_upgraded_desc: "Говорят, что божество прогневалось и поразило эти земли. От того, что когда-то стояло здесь, почти ничего не осталось, но мы возвели памятник, черты которого напоминают об этом моменте."
 d_toxic_god_envenomed_seas: "Отравленные моря"
 d_toxic_god_envenomed_seas_desc: "Даже моря не спаслись от гибельного прикосновения Токсичного бога."
 d_toxic_god_envenomed_seas_upgraded: "Дары океанов"
 d_toxic_god_envenomed_seas_upgraded_desc: "Наши рыцари вернули технологию сбора экзотических газов из вод, осквернённых прикосновением Токсичного бога."

 d_knights_calibrator: "Икс-калибратор ордена"
 d_knights_calibrator_desc: "Наиболее почитаемая реликвия ордена, на которой держится вся его цитадель."

