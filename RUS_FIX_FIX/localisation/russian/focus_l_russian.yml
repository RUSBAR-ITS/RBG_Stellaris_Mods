 development.100.name: "Завершить первый контакт"
 development.100.desc: ""
 development.100.hint: "Отправьте £science_ship£ ['concept_science_ship', научный корабль] изучать £system£ ['concept_systems', системы], пока не начнётся §Hпервый контакт§!. Назначьте ['concept_envoy', посла] ответственным за установление контакта и завершите его."
 development.100.lore: "§L«В момент, когда встречаются две цивилизации, ход истории изменяется. Приведёт ли эта перемена к войне или миру, зависит от одного слова». — Посол Датри Яконна§!"
 development.100.req: "Завершён первый контакт"
