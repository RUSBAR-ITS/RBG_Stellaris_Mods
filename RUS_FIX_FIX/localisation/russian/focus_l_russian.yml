 conquest.400.success: "$TRIGGER_PASS$$conquest.400.req$"

 conquest.405.name: "Пережить тотальную войну"
 conquest.405.desc: ""
 conquest.405.hint: "Постарайтесь не погибнуть в ходе ['concept_total_war', тотальной войны]."
 conquest.405.lore: "§L«Они сожгли наши миры, разметали наши флотилии и оставили нас умирать. Но мы выжили. И мы всё помним».§!"
 conquest.405.req: "Пережита тотальная война"
 conquest.405.fail: "$TRIGGER_FAIL$$conquest.405.req$"
 conquest.405.success: "$TRIGGER_PASS$$conquest.405.req$"

 conquest.410.name: "Сразиться с ханом"
 conquest.410.desc: ""
 conquest.410.hint: "Проведите сражение с ['concept_fleet', флотилией] §HХана§!."
 conquest.410.lore: "§L«Нашей первой ошибкой было то, что мы его недооценили. Второй — то, что мы понадеялись на возможность совершить третью».§!"
 conquest.410.req: "Проведено сражение с ханом"
 conquest.410.fail: "$TRIGGER_FAIL$$conquest.410.req$"
 conquest.410.success: "$TRIGGER_PASS$$conquest.410.req$"

 conquest.415.name: "Сразиться с Серой бурей"
 conquest.415.desc: ""
 conquest.415.hint: "Проведите сражение с ['concept_fleet', флотилией] §HСерой бури§!."
 conquest.415.lore: "§L«Нахальная моноформа».§!"
 conquest.415.req: "Проведено сражение с Серой бурей"
 conquest.415.fail: "$TRIGGER_FAIL$$conquest.415.req$"
 conquest.415.success: "$TRIGGER_PASS$$conquest.415.req$"

 conquest.420.name: "Победить угасшую империю"
 conquest.420.desc: ""
 conquest.420.hint: "Сражайтесь с ['concept_fallen_empire', угасшей империей] до тех пор, пока не покорите последнюю её £planet£ ['concept_planet', планету]."
 conquest.420.lore: "§L«Они называли нас выскочками. Мы называем их обедом».§!"
 conquest.420.req: "Побеждена угасшая империя"
 conquest.420.fail: "$TRIGGER_FAIL$$conquest.420.req$"
 conquest.420.success: "$TRIGGER_PASS$$conquest.420.req$"

 conquest.430.name: "Построить боевой корабль-ковчег"
 conquest.430.desc: ""
 conquest.430.hint: "Чтобы построить новый §Hбоевой корабль-ковчег§!, выберите существующий £arkship£ ['concept_arkship', ковчег], нажмите §HПостроить мегасооружение§!, а затем задайте класс корабля."
 conquest.430.lore: "§L«Пусть они составляют звёздные карты. Пусть изучают пустоту. Мы же заставим их пугливо оглядываться, пока они заняты этой ерундой». – Стратег Юра Венн, «Назначение силы»§!"
 conquest.430.req: "Построен боевой корабль-ковчег"
 conquest.430.fail: "$TRIGGER_FAIL$$conquest.430.req$"
 conquest.430.success: "$TRIGGER_PASS$$conquest.430.req$"

 conquest.500.name: "Построить мегаверфь"
 conquest.500.desc: ""
 conquest.500.hint: "Исследовав технологию £society£ §Hмегаверфи§! найдите подходящую ['concept_star', звезду] и с помощью £construction_ship£ ['concept_construction_ship', строительного корабля] постройте ['concept_megastructure', мегасооружение] §H$tech_mega_shipyard$§!."
 conquest.500.lore: "§L«Империи, которая строит быстрее и больше, чем её соперники, нет нужды с ними воевать». — Стратег Нейн Арвогади, «Об экономике войны»§!"
 conquest.500.req: "Построена мегаверфь"
 conquest.500.fail: "$TRIGGER_FAIL$$conquest.500.req$"
 conquest.500.success: "$TRIGGER_PASS$$conquest.500.req$"

 conquest.505.name: "Обладать тремя подданными"
 conquest.505.desc: ""
 conquest.505.hint: "Во вкладке $contacts_view_tab_contacts$ в £interface£ ['concept_contacts_view', списке контактов] объявите ['concept_subjugation_war', войну на подчинение] другим ['concept_empires', государствам] и победите их.$focus_other$"
 conquest.505.lore: "§L«Подданный — это не союзник, а ресурс. Который нужно взращивать, контролировать и при необходимости исправлять». — Канцлер Вель Вухглаам§!"
 conquest.505.req: "Есть три подданных"
 conquest.505.fail: "$TRIGGER_FAIL$$conquest.505.req$"
 conquest.505.success: "$TRIGGER_PASS$$conquest.505.req$"

 conquest.510.name: "Завоевать 10 планет"
 conquest.510.desc: ""
 conquest.510.hint: "В £interface£ ['concept_claims_view', обзоре притязаний] выдвиньте ['concept_claims', притязания] на £colony£ ['concept_colonies', колонии] другого ['concept_empire', государства]. Во вкладке $contacts_view_tab_contacts$ в £interface£ ['concept_contacts_view', списке контактов] объявите ['concept_war', войну] за выдвинутые §Hпритязания§!. Высадите ['concept_armies', армию] на планеты, чтобы захватить их, а затем закончите войну."
 conquest.510.lore: "§L«Завоевание — это не разрушение, это перенаправление. Мудрейшие из наций не растут — они поглощают».§!"
 conquest.510.req: "Завоёвано 10 планет"
 conquest.510.fail: "$TRIGGER_FAIL$$conquest.510.req$"
 conquest.510.success: "$TRIGGER_PASS$$conquest.510.req$"

 conquest.515.name: "Воскресить левиафана"
 conquest.515.desc: ""
 conquest.515.hint: "Во вкладке $situation_log_view_tab_situation_log$ в £interface£ ['concept_situation_log_view', журнале] найдите ['concept_special_project', особый проект] по воскрешению левиафана и выполните его."
 conquest.515.lore: "§L«Только воскрешённый левиафан может быть полезным левиафаном».§!"
 conquest.515.req: "Воскрешён левиафан"
 conquest.515.fail: "$TRIGGER_FAIL$$conquest.515.req$"
 conquest.515.success: "$TRIGGER_PASS$$conquest.515.req$"

 conquest.520.name: "Создать анклав наёмников"
 conquest.520.desc: ""
 conquest.520.hint: "Выполните условия, перечисленные в окне ['concept_fleet', флотилии], чтобы создать анклав наёмников."
 conquest.520.lore: "§L«Наёмники подобны кометам: яркие, жестокие и любоваться ими лучше издалека».§!"
 conquest.520.req: "Создан анклав наёмников"
 conquest.520.fail: "$TRIGGER_FAIL$$conquest.520.req$"
 conquest.520.success: "$TRIGGER_PASS$$conquest.520.req$"

 conquest.525.name: "Построить 10 линкоров"
 conquest.525.desc: ""
 conquest.525.hint: "Во вкладке $fleet_management_view_tab_fleet_manager$ в £interface£ ['concept_fleet_management_view', обзоре управления флотилиями] или на ['concept_shipyard', верфи] постройте десять §Hлинкоров§!."
 conquest.525.lore: "§L«Выкованные на орбите и оборудованные по последнему слову науки, линкоры — жемчужина любой армады».§!"
 conquest.525.req: "Построено 10 линкоров"
 conquest.525.fail: "$TRIGGER_FAIL$$conquest.525.req$"
 conquest.525.success: "$TRIGGER_PASS$$conquest.525.req$"

 conquest.530.name: "Построить 2 титана"
 conquest.530.desc: ""
 conquest.530.hint: "Во вкладке $fleet_management_view_tab_fleet_manager$ в £interface£ ['concept_fleet_management_view', обзоре управления флотилиями] или на ['concept_shipyard', верфи] постройте два §Hтитана§!."
 conquest.530.lore: "§L«Карты будут перекроены согласно тому, куда укажет величественный титан».§!"
 conquest.530.req: "Построено 2 титана"
 conquest.530.fail: "$TRIGGER_FAIL$$conquest.530.req$"
 conquest.530.success: "$TRIGGER_PASS$$conquest.530.req$"

 conquest.535.name: "Построить джаггернаут"
 conquest.535.desc: ""
 conquest.535.hint: "Во вкладке $fleet_management_view_tab_fleet_manager$ в £interface£ ['concept_fleet_management_view', обзор управления флотилиями] или на ['concept_shipyard', верфи] постройте один §Jджаггернаут§!."
 conquest.535.lore: "§L«Кузница, крепость и приговор — вот что такое джаггернаут».§!"
 conquest.535.req: "Построен 1 джаггернаут"
 conquest.535.fail: "$TRIGGER_FAIL$$conquest.535.req$"
 conquest.535.success: "$TRIGGER_PASS$$conquest.535.req$"

 conquest.540.name: "Разместить установку «Опустошителя»"
 conquest.540.desc: "(осевая установка корабля-ковчега)"
 conquest.540.hint: "Чтобы разместить §Hосевую установку§! на £arkship£ ['concept_arkship', корабле-ковчеге], откройте вкладку §H$ARKSHIP_CONTROLS$§! в £interface£ ['concept_colony_view', обзоре колонии] на полностью улучшенном §Hкорабле-ковчеге§!. Щёлкните по §Hячейке осевой установки§! и выберите §Hустановку «Опустошителя»§! из списка."
 conquest.540.lore: "§L«По команде на всех палубах выключают свет. Обитатели ковчега ждут, затаив дыхание, в полной темноте, а потом пустота вспыхивает. Экипаж называет это «долгим мгновением.§!"
 conquest.540.req: "Размещена установка «Опустошителя»"
 conquest.540.fail: "$TRIGGER_FAIL$$conquest.540.req$"
 conquest.540.success: "$TRIGGER_PASS$$conquest.540.req$"

