 development.105.hint: "Чтобы поддержать рост £pop£ ['concept_pop', населения], обеспечьте им достаточно £housing£ ['concept_housing', жилья] в £colony£ ['concept_colonies', колониях].$focus_other$"
 development.105.lore: "§L«Империя могущественна лишь настолько, насколько она способна прокормить тех, кто называет её своим домом». — Куратор Аркан Тиот§!"
 development.105.req: "Накоплено 7000 населения"
 development.105.fail: "$TRIGGER_FAIL$$development.105.req$"
 development.105.success: "$TRIGGER_PASS$$development.105.req$"

 development.105_1.name: "Накопить 10000 населения"
 development.105_1.desc: ""
 development.105_1.hint: "Чтобы поддержать рост £pop£ ['concept_pop', населения], обеспечьте им достаточно £housing£ ['concept_housing', жилья] в £colony£ ['concept_colonies', колониях].$focus_other$"
 development.105_1.lore: "§L«Мы размораживаем тех, кто нам нужен, а не тех, кто нам дорог». – Директива 1142 отдела гибернации§!"
 development.105_1.req: "Накоплено 10000 населения"
 development.105_1.fail: "$TRIGGER_FAIL$$development.105_1.req$"
 development.105_1.success: "$TRIGGER_PASS$$development.105_1.req$"

 development.110.name: "Продвигать фракцию"
 development.110.desc: ""
 development.110.hint: "Во вкладке §H$government_view_tab_factions$§! в £interface£ ['concept_government_view', обзоре правительства] нажмите на кнопку §H$POP_FACTION_MANAGE$§! и продвиньте ['concept_faction', фракцию]."
 development.110.lore: "§L«Секрет лидерства не в том, чтобы стараться всем понравиться. Важно разочаровывать всех достаточно медленно, чтобы они не взбунтовались».§!"
 development.110.req: "Фракция получила продвижение"
 development.110.fail: "$TRIGGER_FAIL$$development.110.req$"
 development.110.success: "$TRIGGER_PASS$$development.110.req$"

 development.125.name: "Довести прирост минералов до +50"
 development.125.desc: ""
 development.125.hint: "Чтобы повысить прирост £minerals£ ['concept_minerals', минералов], стройте £district£ ['concept_mining_districts', горнодобывающие районы] в £interface£ ['concept_colony_view', обзоре колонии], £mining_station£ ['concept_mining_stations', добывающие станции] на орбитах богатых минералами ['concept_celestial_objects', небесных тел] или закупайте их на £market£ ['concept_market', рынке] в рамках ежемесячной сделки."
 development.125.lore: "§L«Бури, обогащай и снова бури».§!"
 development.125.req: "Прирост минералов достиг +50"
 development.125.fail: "$TRIGGER_FAIL$$development.125.req$"
 development.125.success: "$TRIGGER_PASS$$development.125.req$"

 development.130.name: "Добиться хороших отношений"
 development.130.desc: ""
 development.130.hint: "Во вкладке $contacts_view_tab_contacts$ в £interface£ ['concept_contacts_view', списке контактов] выберите вариант §HУлучшить отношения§! и назначьте доступного ['concept_envoy', посла]."
 development.130.lore: "§L«Дипломатия строится не на доверии. Она строится на интересах. Найдёшь общие интересы, и враги станут партнёрами. Не найдёшь — партнёры станут препятствиями».§!"
 development.130.req: "Установлены хорошие отношения с другим государством"
 development.130.fail: "$TRIGGER_FAIL$$development.130.req$"
 development.130.success: "$TRIGGER_PASS$$development.130.req$"

 development.135.name: "Нанять чиновника"
 development.135.desc: ""
 development.135.hint: "В £interface£ ['concept_leaders_view', обзоре лидеров] наймите ['concept_leader', лидера] — £official£ ['concept_scientist', чиновника].$focus_other$"
 development.135.lore: "§L«Империи возвышаются и погибают. Вечны только документы».§!"
 development.135.req: "Нанят чиновник"
 development.135.fail: "$TRIGGER_FAIL$$development.135.req$"
 development.135.success: "$TRIGGER_PASS$$development.135.req$"

 development.140.name: "Собрать ресурсы"
 development.140.desc: ""
 development.140.hint: "Откройте £interface£ §Hобзор флотилии§! £arkship£ ['concept_arkship', корабля-ковчега], выберите действие §H$arkship_harvest_resources$§! и укажите подходящую ['concept_planet', планету]"
 development.140.lore: "§L«Нам не обязательно владеть миром, чтобы извлечь из него пользу».§!"
 development.140.req: "Собраны ресурсы"
 development.140.fail: "$TRIGGER_FAIL$$development.140.req$"
 development.140.success: "$TRIGGER_PASS$$development.140.req$"

 development.200.name: "Заключить пакт о ненападении"
 development.200.desc: ""
 development.200.hint: "Во вкладке $contacts_view_tab_contacts$ в £interface£ ['concept_contacts_view', списке контактов] предложите другому ['concept_empire', государству] заключить этот ['concept_diplomatic_pact', дипломатический пакт]."
 development.200.lore: "§L«Пакт о ненападении — это не мир. Это лишь соглашение о том, что пока сотрудничество выгоднее войны».§!"
 development.200.req: "Заключён пакт о ненападении"
 development.200.fail: "$TRIGGER_FAIL$$development.200.req$"
 development.200.success: "$TRIGGER_PASS$$development.200.req$"

 development.205.name: "Заключить пакт о взаимной защите"
 development.205.desc: ""
 development.205.hint: "Во вкладке $contacts_view_tab_contacts$ в £interface£ ['concept_contacts_view', списке контактов] предложите другому ['concept_empire', государству] заключить этот ['concept_diplomatic_pact', дипломатический пакт]."
 development.205.lore: "§L«Ничто так не сближает две империи, как общий страх перед третьей».§!"
 development.205.req: "Заключён пакт о взаимной защите"
 development.205.fail: "$TRIGGER_FAIL$$development.205.req$"
 development.205.success: "$TRIGGER_PASS$$development.205.req$"

 development.215.name: "Назначить чиновника губернатором"
 development.215.desc: ""
 development.215.hint: "Во вкладке $colony_view_tab_planet_summary$ в £interface£ ['concept_colony_view', обзоре колонии] или в £interface£ ['concept_planets_and_sector_view', обзоре планет и секторов] назначьте £official£ ['concept_official', чиновника] на пост ['concept_governor', губернатора] £sector£ ['concept_sector', сектора] или £planet£ ['concept_planet', планеты]."
 development.215.lore: "§L«Вождя восхваляют. Полководца боятся. Но настоящий управленец не таков: когда он делает работу правильно, этого никто не замечает». — Префект Флент шар Астатенн§!"
 development.215.req: "Чиновник назначен губернатором"
 development.215.fail: "$TRIGGER_FAIL$$development.215.req$"
 development.215.success: "$TRIGGER_PASS$$development.215.req$"

 development.220.name: "Вступить в Галактическое сообщество"
 development.220.desc: ""
 development.220.hint: "Примите приглашение вступить в ['concept_galactic_community', Галактическое сообщество] или откройте §H$concept_galactic_community$§! над £interface£ ['concept_outliner', планировщиком], когда оно будет сформирована, и подайте заявку на вступление."
 development.220.lore: "§L«Когда-то мы были одиноким семенем. Теперь мы — часть сада, что цветёт среди звёзд». — Чёрные Лепестки, первый спикер Галактического сообщества§!"
 development.220.req: "Членство в Галактическом сообществе"
 development.220.fail: "$TRIGGER_FAIL$$development.220.req$"
 development.220.success: "$TRIGGER_PASS$$development.220.req$"

 development.225.name: "Получить одолжение"
 development.225.desc: ""
 development.225.hint: "Во вкладке $contacts_view_tab_contacts$ в £interface£ ['concept_contacts_view', списке контактов] свяжитесь с другим ['concept_empire', государством] и выберите вариант §HУлучшить отношения§!, пока оно не даст вам ['concept_favor', одолжение].$focus_other$"
 development.225.lore: "§L«Одолжения — это не деньги, но расходятся они как монеты. У них нет веса, но они склоняют чаши весов дипломатии».§!"
 development.225.req: "Получено одолжение"
 development.225.fail: "$TRIGGER_FAIL$$development.225.req$"
 development.225.success: "$TRIGGER_PASS$$development.225.req$"

 development.230.name: "Повысить уровень чиновника"
 development.230.desc: ""
 development.230.hint: "Дайте £official£ ['concept_official', чиновнику] место в ['concept_council', совете], сделайте его ['concept_governor', губернатором], представителем в ['concept_galactic_community', Галактическом сообществе] или в ['concept_federation', федерации].\n\nЧиновник будет зарабатывать ценный опыт, который поможет ему повысить уровень и приобрести новые ['concept_leader_traits', черты].."
 development.230.lore: "§L«Первый урок управления: если все недовольны, значит, вы, скорее всего, всё делаете правильно». — Испытание скукой, официальное руководство§!"
 development.230.req: "Повышен уровень чиновника"
 development.230.fail: "$TRIGGER_FAIL$$development.230.req$"
 development.230.success: "$TRIGGER_PASS$$development.230.req$"

 development.235.name: "Выполнить контракт «$arkship_harvest_resources$»"
 development.235.desc: ""
 development.235.hint: "Примите контракт §H$arkship_harvest_resources$§! на £interface£ ['concept_galaxy_map', карте галактики], а затем прикажите ['concept_logistic_ships', логистическому кораблю] §Hсобрать ресурсы§!."
 development.235.lore: "§L«Во время сбора в добывающих отсеках кипит работа: все переборки покрываются конденсатом, а бригады трудятся посменно, чтобы оборудование не простаивало. Камни мы отдаём, а себе оставляем репутацию».§!"
 development.235.req: "Выполнен контракт «$arkship_harvest_resources$»"
 development.235.fail: "$TRIGGER_FAIL$$development.235.req$"
 development.235.success: "$TRIGGER_PASS$$development.235.req$"

 development.300.name: "Построить рой Дайсона"
 development.300.desc: "(производящий\n80 £energy£)"
 development.300.hint: "Исследовав технологию £physics£ §Hроя Дайсона§!, найдите подходящую ['concept_star', звезду] и с помощью £construction_ship£ ['concept_construction_ship', строительного корабля] постройте £megastructure£ ['concept_megastructure', мегасооружение] §H$tech_dyson_swarm$§!."
 development.300.lore: "§L«Мы взглянули на эту звезду и подумали: а что если мы обложим её налогами?»§!"
 development.300.req: "Построен рой Дайсона"
 development.300.fail: "$TRIGGER_FAIL$$development.300.req$"
 development.300.success: "$TRIGGER_PASS$$development.300.req$"

 development.305.name: "Построить дуговую печь"
 development.305.desc: "(в системе с 15 планетами)"
 development.305.hint: "Исследовав технологию £engineering£ §Hдуговой печи§!, найдите §Hрасплавленный мир§! в £system£ ['concept_system', системе] с как минимум 15 £planet£ ['concept_planets', планетами] и с помощью £construction_ship£ ['concept_construction_ship', строительного корабля] постройте £megastructure£ ['concept_megastructure', мегасооружение] §H$tech_orbital_arc_furnace$§!."
 development.305.lore: "§L«Солнце касается горизонта, и на мгновение вся конструкция вспыхивает золотом. Тысячи километров конструкций и стали... Это наша работа. Мы превратили эту планету в кузницу».§!"
 development.305.req: "Построена дуговая печь"
 development.305.fail: "$TRIGGER_FAIL$$development.305.req$"
 development.305.success: "$TRIGGER_PASS$$development.305.req$"

 development.310.name: "Заполучить три расы"
 development.310.desc: ""
 development.310.hint: "Во вкладке $contacts_view_tab_contacts$ в £interface£ ['concept_contacts_view', списке контактов] предложите другому ['concept_empire', государству] заключить ['concept_diplomatic_pact', дипломатический пакт] §H$PACT_migration_treaty$§!.$focus_other$"
 development.310.lore: "§L«Галактика обширна, полна знаний, умений и идей. Зачем ограничиваться лишь одним способом мышления?»§!"
 development.310.req: "В составе государства три расы"
 development.310.fail: "$TRIGGER_FAIL$$development.310.req$"
 development.310.success: "$TRIGGER_PASS$$development.310.req$"

 development.315.name: "Основать федерацию"
 development.315.desc: ""
 development.315.hint: "Во вкладке $contacts_view_tab_contacts$ в £interface£ ['concept_contacts_view', списке контактов] свяжитесь с другим ['concept_empire', государством] и предложите ему объединиться в ['concept_federation', федерацию].$focus_other$"
 development.315.lore: "§L«Пусть это соглашение служит свидетельством нашей решимости: того, что мы предпочли единство раздору, диалог войне и общую судьбу среди звёзд». — Преамбула к Галактической конвенции§!"
 development.315.req: "Основана федерация"
 development.315.fail: "$TRIGGER_FAIL$$development.315.req$"
 development.315.success: "$TRIGGER_PASS$$development.315.req$"

 development.320.name: "Вступить в Совет"
 development.320.desc: ""
 development.320.hint: "Увеличьте свой ['concept_diplomatic_weight', дипломатический вес], чтобы на следующих выборах вас избрали в ['concept_galactic_council', Галактический совет]."
 development.320.lore: "§L«Истинная сила не в армиях и флотилиях, но в палатах, где принимаются решения».§!"
 development.320.req: "В Галактическом совете"
 development.320.fail: "$TRIGGER_FAIL$$development.320.req$"
 development.320.success: "$TRIGGER_PASS$$development.320.req$"

 development.325.name: "Получить чиновника-ветерана"
 development.325.desc: "(достигшего 4-го уровня)"
 development.325.hint: "$development.230.hint$"
 development.325.lore: "§L«К концу дня уставать должны работники, а не начальники». — Главный магистрат Ир'Б ва'Бир§!"
 development.325.req: "Есть чиновник 4-го уровня"
 development.325.fail: "$TRIGGER_FAIL$$development.325.req$"
 development.325.success: "$TRIGGER_PASS$$development.325.req$"

 development.330.name: "Открыть 10 филиалов"
 development.330.desc: ""
 development.330.hint: "$core_focus_139.hint$"
 development.330.lore: "§L«Независимая экономика процветает: мегакорпорация открывает десятый филиал", — заявляет местный чиновник».§!"
 development.330.req: "Открыто 10 филиалов"
 development.330.fail: "$TRIGGER_FAIL$$development.330.req$"
 development.330.success: "$TRIGGER_PASS$$development.330.req$"

 development.335.name: "Расчистить планету под карьер"
 development.335.desc: ""
 development.335.hint: "Откройте £interface£ §Hобзор флотилии§! £arkship£ ['concept_arkship', корабля-ковчега], выберите действие §H$arkship_strip_mine$§! и укажите подходящую ['concept_planet', планету]"
 development.335.lore: "§L«По-хорошему это называется добычей. В реальности же это потрошение. Но какая разница? Главное заполнить трюмы».§!"
 development.335.req: "Планета расчищена под карьер"
 development.335.fail: "$TRIGGER_FAIL$$development.335.req$"
 development.335.success: "$TRIGGER_PASS$$development.335.req$"

 development.400.name: "5-й уровень федерации"
 development.400.desc: ""
 development.400.hint: "Назначьте £official£ ['concept_official', чиновника] в ['concept_federation', федерацию] и накапливайте §Hопыт федерации§!."
 development.400.lore: "§L«Пять уровней правительства, сотня комитетов, тысяча совещаний — и каким-то образом это делает нас сильнее».§!"
 development.400.req: "В федерации 5-го уровня"
 development.400.fail: "$TRIGGER_FAIL$$development.400.req$"
 development.400.success: "$TRIGGER_PASS$$development.400.req$"

 development.405.name: "Построить сферу Дайсона"
 development.405.desc: ""
 development.405.hint: "Исследовав технологию £physics£ §Hсферы Дайсона§!, улучшите £megastructure£ ['concept_megastructure', мегасооружение] §Hрой Дайсона§! до §Hсферы Дайсона§!.$focus_other$"
 development.406.hint: "Исследовав технологию £physics£ §Hсферы Дайсона§!, найдите подходящую ['concept_star', звезду] и с помощью £construction_ship£ ['concept_construction_ship', строительного корабля] постройте £megastructure£ ['concept_megastructure', мегасооружение] §H$tech_dyson_sphere$§!.$focus_other$"
 development.405.lore: "§L«Высшая цивилизация не борется за ресурсы — она их определяет». — Продвижение третьего ранга§!"
 development.405.req: "Построена сфера Дайсона"
 development.405.fail: "$TRIGGER_FAIL$$development.405.req$"
 development.405.success: "$TRIGGER_PASS$$development.405.req$"

 development.410.name: "Построить мир-кольцо"
 development.410.desc: ""
 development.410.hint: "Исследовав технологию £physics£ §Hмира-кольца§!, найдите подходящую ['concept_star', звезду] и с помощью £construction_ship£ ['concept_construction_ship', строительного корабля] постройте £megastructure£ ['concept_megastructure', мегасооружение] §H$tech_ring_world$§!.$focus_other$"
 development.410.lore: "§L«Кольцо так красиво сверкало в свете нашего солнца. Но потом на него пали тени захватчиков...» — Дневник Аддавва уви-Ваддива, стандартный год 174§!"
 development.410.req: "Построен мир-кольцо"
 development.410.fail: "$TRIGGER_FAIL$$development.410.req$"
 development.410.success: "$TRIGGER_PASS$$development.410.req$"

 development.415.name: "Обладать тремя чиновниками 5-го уровня"
 development.415.desc: ""
 development.415.hint: "$development.230.hint$"
 development.415.lore: "§L«За долгие десятилетия работы эти управленцы стали мастерами политики, переговоров и спихивания ответственности на других».§!"
 development.415.req: "Есть три чиновника 5-го уровня"
 development.415.fail: "$TRIGGER_FAIL$$development.415.req$"
 development.415.success: "$TRIGGER_PASS$$development.415.req$"

 development.420.name: "Создать маршрутную линию"
 development.420.desc: "(из 5 маршрутных станций)"
 development.420.hint: "Постройте £waystation£ ['concept_waystations', маршрутные станции] в соседних системах, чтобы создать £wayline£ ['concept_wayline', маршрутную линию]."
 development.420.lore: "§L«Одну станцию вряд ли кто-то заметит. Но соедини несколько — и сможешь заявить галактике о себе».§!"
 development.420.req: "Есть маршрутная линия из 5 станций"
 development.420.fail: "$TRIGGER_FAIL$$development.420.req$"
 development.420.success: "$TRIGGER_PASS$$development.420.req$"

 development.425.name: "Иметь 3 корабля-ковчега"
 development.425.desc: ""
 development.425.hint: "Чтобы построить новый £arkship£ ['concept_arkship', корабль-ковчег], выберите существующий §Hковчег§!, нажмите §HПостроить мегасооружение§!, а затем задайте класс ковчега."
 development.425.lore: "§L«Один корабль держит курс к краю галактики, второй — к её пылающему сердцу, а третий — к ещё неизведанным звёздам».§!"
 development.425.req: "Есть 3 корабля-ковчега"
 development.425.fail: "$TRIGGER_FAIL$$development.425.req$"
 development.425.success: "$TRIGGER_PASS$$development.425.req$"

 development.435.name: "Построить гражданский корабль-ковчег"
 development.435.desc: ""
 development.435.hint: "Чтобы построить новый §Hгражданский корабль-ковчег§!, выберите существующий £arkship£ ['concept_arkship', ковчег], нажмите §HПостроить мегасооружение§!, а затем задайте класс корабля."
 development.435.lore: "§L«Город мечтает разрастись вширь. Корабль-ковчег грезит о новых горизонтах». – Архивариус Тол Эннара, «О городах и ковчегах»§!"
 development.435.req: "Построен гражданский корабль-ковчег"
 development.435.fail: "$TRIGGER_FAIL$$development.435.req$"
 development.435.success: "$TRIGGER_PASS$$development.435.req$"

 development.500.name: "Построить межзвёздную ассамблею"
 development.500.desc: ""
 development.500.hint: "Исследовав технологию £society£ §Hмежзвёздной ассамблеи§!, найдите подходящую ['concept_star', звезду] и с помощью £construction_ship£ ['concept_construction_ship', строительного корабля] постройте £megastructure£ ['concept_megastructure', мегасооружение] §H$tech_interstellar_assembly$§!.$focus_other$"
 development.500.lore: "§L«Контролировать дискуссию — значит контролировать ход истории». — Верховный канцлер Сагу, дочь Туб§!"
 development.500.req: "Построена межзвёздная ассамблея"
 development.500.fail: "$TRIGGER_FAIL$$development.500.req$"
 development.500.success: "$TRIGGER_PASS$$development.500.req$"

 development.505.name: "Довести прирост товаров массового спроса до +3000"
 development.505.desc: ""
 development.505.hint: "$core.124.hint$"
 development.505.lore: "§L«Они их не едят. Они не используют их для расширения. Они их просто... выставляют на обозрение. Неэффективность индивидов порой сводит с ума».§!"
 development.505.req: "Ежемесячный прирост товаров массового спроса составляет +3000"
 development.505.fail: "$TRIGGER_FAIL$$development.505.req$"
 development.505.success: "$TRIGGER_PASS$$development.505.req$"

 development.510.name: "Поднять мнение 10 государств до +200"
 development.510.desc: ""
 development.510.hint: "$development.100.hint$"
 development.510.lore: "§L«Как же утомительно всем так сильно нравиться».§!"
 development.510.req: "Мнение 10 государств поднято до +200"
 development.510.fail: "$TRIGGER_FAIL$$development.510.req$"
 development.510.success: "$TRIGGER_PASS$$development.510.req$"

 development.515.name: "Разместить яйцо исполина"
 development.515.desc: ""
 development.515.hint: "Чтобы разместить §Hяйцо исполина§!, выберите ['concept_construction_ship', строительный корабль], нажмите §HПостроить мегасооружение§!, выберите яйцо исполина и разместите его на орбите подходящего §Hгазового гиганта§!."
 development.515.lore: "§L«Мы подняли глаза и увидели, как его тень скользнула по луне. Это был не корабль. И не буря. Нечто огромное... и живое». — Запись очевидца, Колония E-91§!"
 development.515.req: "Размещено яйцо исполина"
 development.515.fail: "$TRIGGER_FAIL$$development.515.req$"
 development.515.success: "$TRIGGER_PASS$$development.515.req$"

 development.520.name: "Построить центр генных исследований"
 development.520.desc: ""
 development.520.hint: "Постройте ['concept_building', сооружение] §HЦентр генных исследований§! в одной из колоний в свободной ячейке для сооружений."
 development.520.lore: "§L«Если мы не должны изменять свой геном, то почему он так легко изменяется?»§!"
 development.520.req: "Построен центр генных исследований"
 development.520.fail: "$TRIGGER_FAIL$$development.520.req$"
 development.520.success: "$TRIGGER_PASS$$development.520.req$"

 development.525.name: "Разместить главную верфь"
 development.525.desc: "(осевая установка корабля-ковчега)"
 development.525.hint: "Чтобы разместить §Hосевую установку§! на £arkship£ ['concept_arkship', корабле-ковчеге], откройте вкладку §H$ARKSHIP_CONTROLS$§! в £interface£ ['concept_colony_view', ббзоре колонии] на полностью улучшенном §Hкорабле§!. Щёлкните по §Hячейке осевой установки§! и выберите §Hглавную верфь§! из списка."
 development.525.lore: "§L«Мы корректируем курс, выходим на орбиты, дрейфуем — а верфь продолжает работать, несмотря ни на что».§!"
 development.525.req: "Размещена главная верфь"
 development.525.fail: "$TRIGGER_FAIL$$development.525.req$"
 development.525.success: "$TRIGGER_PASS$$development.525.req$"

