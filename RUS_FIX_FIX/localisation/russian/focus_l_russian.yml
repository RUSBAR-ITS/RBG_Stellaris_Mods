# Focus Cards

 focus_exploration: "Приоритет на исследования"
 focus_conquest: "Приоритет на завоевания"
 focus_development: "Приоритет на развитие"
 focus_core: "Основной приоритет"

 focus_check_timeline: "Найдите новую задачу во вкладке §H$TIMELINE$§!."

 MESSAGE_FOCUS_COMPLETED_TITLE: "Задача выполнена"
 MESSAGE_EXPLORATION_FOCUS_COMPLETED_TITLE: "$MESSAGE_FOCUS_COMPLETED_TITLE$"
 MESSAGE_EXPLORATION_FOCUS_COMPLETED_DESC: "§Y$focus_exploration$§!\n$focus_check_timeline$"
 MESSAGE_CONQUEST_FOCUS_COMPLETED_TITLE: "$MESSAGE_FOCUS_COMPLETED_TITLE$"
 MESSAGE_CONQUEST_FOCUS_COMPLETED_DESC: "§Y$focus_conquest$§!\n$focus_check_timeline$"
 MESSAGE_DEVELOPMENT_FOCUS_COMPLETED_TITLE: "$MESSAGE_FOCUS_COMPLETED_TITLE$"
 MESSAGE_DEVELOPMENT_FOCUS_COMPLETED_DESC: "§Y$focus_development$§!\n$focus_check_timeline$"
 MESSAGE_CORE_FOCUS_COMPLETED_TITLE: "$MESSAGE_FOCUS_COMPLETED_TITLE$"
 MESSAGE_CORE_FOCUS_COMPLETED_DESC: "§Y$focus_core$§!\n$focus_check_timeline$"

 MESSAGE_EXPLORATION_FOCUS_COMPLETED_SETTING: "Приоритет завершён ($FOCUS_CARD_TYPE_EXPLORATION$)"
 MESSAGE_CONQUEST_FOCUS_COMPLETED_SETTING: "Приоритет завершён ($FOCUS_CARD_TYPE_CONQUEST$)"
 MESSAGE_DEVELOPMENT_FOCUS_COMPLETED_SETTING: "Приоритет завершён ($FOCUS_CARD_TYPE_DEVELOPMENT$)"
 MESSAGE_CORE_FOCUS_COMPLETED_SETTING: "Приоритет завершён ($FOCUS_CARD_TYPE_CORE$)"

 focus_check_progression: "Щёлкните по кнопке §HПрогресс§! на вкладке §H$TIMELINE$§!, чтобы увидеть награды."

 MESSAGE_FOCUS_PROGRESSION_TITLE: "Награда за приоритет"
 MESSAGE_EXPLORATION_FOCUS_REWARD_TITLE: "$MESSAGE_FOCUS_PROGRESSION_TITLE$"
 MESSAGE_EXPLORATION_FOCUS_REWARD_DESC: "§Y$focus_exploration$§!\n$focus_check_progression$"
 MESSAGE_CONQUEST_FOCUS_REWARD_TITLE: "$MESSAGE_FOCUS_PROGRESSION_TITLE$"
 MESSAGE_CONQUEST_FOCUS_REWARD_DESC: "§Y$focus_conquest$§!\n$focus_check_progression$"
 MESSAGE_DEVELOPMENT_FOCUS_REWARD_TITLE: "$MESSAGE_FOCUS_PROGRESSION_TITLE$"
 MESSAGE_DEVELOPMENT_FOCUS_REWARD_DESC: "§Y$focus_development$§!\n$focus_check_progression$"

 MESSAGE_EXPLORATION_FOCUS_REWARD_SETTING: "Прогресс приоритета ($FOCUS_CARD_TYPE_EXPLORATION$)"
 MESSAGE_CONQUEST_FOCUS_REWARD_SETTING: "Прогресс приоритета ($FOCUS_CARD_TYPE_CONQUEST$)"
 MESSAGE_DEVELOPMENT_FOCUS_REWARD_SETTING: "Прогресс приоритета ($FOCUS_CARD_TYPE_DEVELOPMENT$)"

 focus_other: "\n\n§tЕсть и другие способы.§!"

###################
# Core Focus Cards
###################

 core.100.name: "Построить сооружение"
 core.100.desc: ""
 core.100.hint: "Во вкладке $colony_view_tab_planet_summary$ в £interface£ ['concept_colony_view', обзоре колонии] щёлкните по доступной §Hячейке сооружений§! и выберите £building£ ['concept_building', сооружение] для строительства."
 core.100.lore: "§L«Сегодня — стройка. Завтра — цивилизация».§!"
 core.100.req: "Построено сооружение"
 core.100.fail: "$TRIGGER_FAIL$$core.100.req$"
 core.100.success: "$TRIGGER_PASS$$core.100.req$"

 core.102.name: "Основать колонию"
 core.102.desc: ""
 core.102.hint: "С помощью £colony_ship£ ['concept_colony_ship', колониального корабля] заселите пригодную для жизни £planet£ ['concept_planet', планету]."
 core.102.lore: "§L«Новый мир — это не просто новый актив, это ответственность». — Руководство по управлению колониями, издание 223-е.§!"
 core.102.req: "Основана колония"
 core.102.fail: "$TRIGGER_FAIL$$core.102.req$"
 core.102.success: "$TRIGGER_PASS$$core.102.req$"

 core.104.name: "Построить добывающую станцию"
 core.104.desc: ""
 core.104.hint: "С помощью £construction_ship£ ['concept_construction_ship', строительного корабля] постройте £mining_station£ ['concept_mining_station', добывающую станцию] на орбите подходящего ['concept_celestial_object', небесного тела]."
 core.104.lore: "§L«Для кого-то это просто астероид. Для нас же — куча кредитов в удобной оболочке».§!"
 core.104.req: "Построена добывающая станция"
 core.104.fail: "$TRIGGER_FAIL$$core.104.req$"
 core.104.success: "$TRIGGER_PASS$$core.104.req$"

 core.104_1.name: "Построить маршрутную станцию"
 core.104_1.desc: ""
 core.104_1.hint: "С помощью £construction_ship£ ['concept_logistic_ship', логистического корабля] постройте £waystation£ ['concept_waystation', маршрутную станцию] в подходящей £system£ ['concept_system', системе]."
 core.104_1.lore: "§L«Мудрый путник не строит запруды. Он пьёт из реки, наполняет флягу и идёт дальше».§!"
 core.104_1.req: "Построена маршрутная станция"
 core.104_1.fail: "$TRIGGER_FAIL$$core.104_1.req$"
 core.104_1.success: "$TRIGGER_PASS$$core.104_1.req$"

 core.106.name: "Специализировать колонию"
 core.106.desc: "(кроме столичной)"
 core.106.hint: "Откройте £interface£ ['concept_colony_view', обзор] не столичной колонии, перейдите во вкладку $colony_view_tab_planet_summary$ и смените её ['concept_designation', специализацию]."
 core.106.lore: "§L«Формально специализации колоний повышают их эффективность. На деле же это просто попытка сделать вид, будто освоение этих бесхозных камней — это часть "экономической стратегии"».§!"
 core.106.req: "Изменена специализация колонии"
 core.106.fail: "$TRIGGER_FAIL$$core.106.req$"
 core.106.success: "$TRIGGER_PASS$$core.106.req$"

 core.106_1.name: "Специализировать колонию"
 core.106_1.desc: "(кроме столичной)"
 core.106_1.hint: "Откройте £interface£ ['concept_colony_view', обзор] не столичного £arkship£ ['concept_arkship', корабля-ковчега], перейдите во вкладку $colony_view_tab_planet_summary$ и смените его ['concept_designation', специализацию]."
 core.106_1.lore: "§L«У каждого корабля есть цель. Стоит её озвучить — и пути назад уже не будет».§!"
 core.106_1.req: "Изменена специализация корабля-ковчега"
 core.106_1.fail: "$TRIGGER_FAIL$$core.106_1.req$"
 core.106_1.success: "$TRIGGER_PASS$$core.106_1.req$"

 core.108.name: "Построить модуль космической базы"
 core.108.desc: ""
 core.108.hint: "Во вкладке $starbase_view_tab_command$ в £interface£ ['concept_starbase_view', обзоре космической базы] выберите доступный для строительства §Hмодуль§!."
 core.108.lore: "§L«Нам обещали приключение, но забыли сказать про месяцы тишины и рециркулируемого воздуха. Затем наконец включился торговый узел — хотя бы ради него уже можно было остаться».§!"
 core.108.req: "Построен модуль космической базы"
 core.108.fail: "$TRIGGER_FAIL$$core.108.req$"
 core.108.success: "$TRIGGER_PASS$$core.108.req$"

 core.110.name: "Построить сооружение космической базы"
 core.110.desc: ""
 core.110.hint: "Во вкладке $starbase_view_tab_command$ в £interface£ ['concept_starbase_view', обзоре космической базы] выберите доступное для строительства §Hсооружение§!."
 core.110.lore: "§L«Расположение в галактике определяет функцию космической базы. Сооружения его уточняют». — Орбитальное проектирование: теория и практика§!"
 core.110.req: "Построена пристройка космической базы"
 core.110.fail: "$TRIGGER_FAIL$$core.110.req$"
 core.110.success: "$TRIGGER_PASS$$core.110.req$"

 core.112.name: "Принять традицию"
 core.112.desc: ""
 core.112.hint: "Во вкладке $society_management_view_tab_traditions$ в £interface£ ['concept_society_management_view', обзоре управления обществом] примите ['concept_tradition', традицию]."
 core.112.lore: "§L«Народ без традиций не имеет цели. Народ, связанный традициями, стагнирует. Мудрость заключается в том, чтобы разумно выбирать, что сохранить, а что отбросить».§!"
 core.112.req: "Принята традиция"
 core.112.fail: "$TRIGGER_FAIL$$core.112.req$"
 core.112.success: "$TRIGGER_PASS$$core.112.req$"

 core.114.name: "Принять указ"
 core.114.desc: ""
 core.114.hint: "Во вкладке §H$government_view_tab_policies_and_edicts$§! в £interface£ ['concept_government_view', обзоре правительства] примите ['concept_edict', указ]."
 core.114.lore: "§L«Внимание, граждане! Официально вступил в действие Указ 827-B. Руководство по исполнению приводится в разделе 34, пункте 12. Желаем вам продуктивного дня!»§!"
 core.114.req: "Принят указ"
 core.114.fail: "$TRIGGER_FAIL$$core.114.req$"
 core.114.success: "$TRIGGER_PASS$$core.114.req$"

 core.116.name: "Запустить 3 программы"
 core.116.desc: ""
 core.116.hint: "Когда завершается подготовка какой-либо ['concept_agenda', программы], откройте вкладку $government_view_tab_council$ в £interface£ ['concept_government_view', обзоре правительства] и запустите её, а затем выберите другую."
 core.116.lore: "§L«Правитель без программы подобен космическому кораблю без курса».§!"
 core.116.req: "Запущено 3 программы"
 core.116.fail: "$TRIGGER_FAIL$$core.116.req$"
 core.116.success: "$TRIGGER_PASS$$core.116.req$"

 core.118.name: "Накопить 1000 энергокредитов"
 core.118.desc: ""
 core.118.hint: "Чтобы добывать £energy£ ['concept_energy', энергокредиты], стройте £district£ ['concept_generator_districts', энергетические районы] во вкладке $colony_view_tab_planet_summary$ в £interface£ ['concept_colony_view', обзоре колонии].\n\nТакже можно строить £mining_station£ ['concept_mining_stations', добывающие станции] на орбитах богатых энергией ['concept_celestial_objects', небесных тел], покупать £energy£ §H$energy_acc$§! на £market£ ['concept_market', рынке] или у других ['concept_empires', государств].$focus_other$"
 core.118.lore: "§L«Не в энергокредитах счастье, а в торговле!»§!"
 core.118.req: "Накоплено 1000 энергокредитов"
 core.118.fail: "$TRIGGER_FAIL$$core.118.req$"
 core.118.success: "$TRIGGER_PASS$$core.118.req$"

 core.118_1.name: "Иметь низкий запас оперативных резервов"
 core.118_1.desc: ""
 core.118_1.hint: "Чтобы потратить £operational_reserves£ ['concept_operational_reserves', оперативные резервы], смените §Hподход к инциденту§! на §H$situation_nomad_economy_full_spending$§! и не ['scripted_action:arkship_harvest_resources', собирайте ресурсы] с помощью £arkship£ ['concept_arkship', корабля-ковчега] или £construction_ship£ ['concept_logistic_ship', логистического корабля].$focus_other$"
 core.118_1.lore: "§L«Не стоит экономить. Ресурсов полно — нужно только знать, где их искать».§!"
 core.118_1.req: "Низкий запас оперативных резервов"
 core.118_1.fail: "$TRIGGER_FAIL$$core.118_1.req$"
 core.118_1.success: "$TRIGGER_PASS$$core.118_1.req$"

 core.120.name: "Накопить 1000 минералов"
 core.120.desc: ""
 core.120.hint: "Чтобы добывать £minerals£ ['concept_minerals', минералы], стройте £district£ ['concept_mining_districts', горнодобывающие районы] во вкладке $colony_view_tab_planet_summary$ в £interface£ ['concept_colony_view', обзоре колонии].\n\nТакже можно строить £mining_station£ ['concept_mining_stations', добывающие станции] на орбитах богатых минералами ['concept_celestial_objects', небесных тел], покупать £minerals£ §H$minerals_acc$§! на £market£ ['concept_market', рынке] или у других ['concept_empires', государств].$focus_other$"
 core.120.lore: "§L«Будете дышать слишком глубоко — заработаете силикоз. Задержите дыхание — потеряете сознание. В любом случае компания урежет зарплату».§!"
 core.120.req: "Накоплено 1000 минералов"
 core.120.fail: "$TRIGGER_FAIL$$core.120.req$"
 core.120.success: "$TRIGGER_PASS$$core.120.req$"

 core.120_1.name: "Иметь высокий запас оперативных резервов"
 core.120_1.desc: ""
 core.120_1.hint: "Чтобы увеличить £operational_reserves£ ['concept_operational_reserves', оперативные резервы], ['scripted_action:arkship_harvest_resources', собирайте ресурсы] с помощью £arkship£ ['concept_arkship', корабля-ковчега] или £construction_ship£ ['concept_logistic_ship', логистического корабля].\n\nТакже можно купить £energy£ §H$energy_acc$§! или £minerals£ §H$minerals_acc$§! на £market£ ['concept_market', рынке].$focus_other$"
 core.120_1.lore: "§L«Отложи немного сегодня, чтобы не нуждаться завтра. Так говорили первые интенданты».§!"
 core.120_1.req: "Высокий запас оперативных резервов"
 core.120_1.fail: "$TRIGGER_FAIL$$core.120_1.req$"
 core.120_1.success: "$TRIGGER_PASS$$core.120_1.req$"

 core.122.name: "Накопить 1000 пищи"
 core.122.desc: ""
 core.122.hint: "Чтобы добывать £food£ ['concept_food', пищу], стройте £district£ ['concept_farming_districts', аграрные районы] во вкладке $colony_view_tab_planet_summary$ в £interface£ ['concept_colony_view', обзоре колонии].\n\nТакже можно покупать £food£ §H$food_acc$§! на £market£ ['concept_market', рынке] или у других ['concept_empires', государств].$focus_other$"
 core.122.lore: "§L«Сытое государство — сильное государство. Голодное государство рискует стать чьим-то чужим государством».§!"
 core.122.req: "Накоплено 1000 пищи"
 core.122.fail: "$TRIGGER_FAIL$$core.122.req$"
 core.122.success: "$TRIGGER_PASS$$core.122.req$"

 core.122_1.name: "Накопить 3000 пищи"
 core.122_1.desc: ""
 core.122_1.hint: "Чтобы добывать £food£ ['concept_food', пищу], стройте £district£ ['concept_farming_districts', аграрные районы] во вкладке $colony_view_tab_planet_summary$ в £interface£ ['concept_colony_view', обзоре колонии].\n\nТакже можно покупать £food£ §H$food_acc$§! на £market£ ['concept_market', рынке] или у других ['concept_empires', государств].$focus_other$"
 core.122_1.lore: "§L«Странникам нельзя голодать, ведь следующая звезда всегда дальше, чем кажется».§!"
 core.122_1.req: "Накоплено 3000 пищи"
 core.122_1.fail: "$TRIGGER_FAIL$$core.122_1.req$"
 core.122_1.success: "$TRIGGER_PASS$$core.122_1.req$"

 core.124.name: "Накопить 1000 товаров массового спроса"
 core.124.desc: ""
 core.124.hint: "Чтобы производить £consumer_goods£ ['concept_consumer_goods', товары массового спроса], стройте £district£ ['concept_industrial_districts', промышленные районы] и £building£ ['building:building_factory_1', гражданские предприятия] во вкладке $colony_view_tab_planet_summary$ в £interface£ ['concept_colony_view', обзоре колонии]\n\nТакже можно покупать £consumer_goods£ §H$consumer_goods_acc$§! на £market£ ['concept_market', рынке] или у других ['concept_empires', государств].$focus_other$"
 core.124.lore: "§L«Товары массового спроса — это двигатель прогресса, культуры и всеобщего довольства. Что в них входит? Предметы роскоши? Современные инструменты? Очень удобная шляпа? Да».§!"
 core.124.req: "Накоплено 1000 товаров массового спроса"
 core.124.fail: "$TRIGGER_FAIL$$core.124.req$"
 core.124.success: "$TRIGGER_PASS$$core.124.req$"

 core.124_1.name: "Накопить 2000 товаров массового спроса"
 core.124_1.desc: ""
 core.124_1.hint: "$core.124.hint$"
 core.124_1.lore: "§L«На ковчеге каждая деталь должна пройти две проверки: проверку качества и проверку временем».§!"
 core.124_1.req: "Накоплено 2000 товаров массового спроса"
 core.124_1.fail: "$TRIGGER_FAIL$$core.124_1.req$"
 core.124_1.success: "$TRIGGER_PASS$$core.124_1.req$"

 core.126.name: "Накопить 1000 сплавов"
 core.126.desc: ""
 core.126.hint: "Чтобы производить £alloys£ ['concept_alloys', сплавы], стройте £district£ ['concept_industrial_districts', промышленные районы] во вкладке $colony_view_tab_planet_summary$ в £interface£ ['concept_colony_view', обзоре колонии].\n\nТакже можно покупать £alloys£ §H$alloys_acc$§! на £market£ ['concept_market', рынке] или у других ['concept_empires', государств].$focus_other$"
 core.126.lore: "§L«Пускай сплавы и не роскошный товар, но попробуйте построить линкор из добрых намерений».§!"
 core.126.req: "Накоплено 1000 сплавов"
 core.126.fail: "$TRIGGER_FAIL$$core.126.req$"
 core.126.success: "$TRIGGER_PASS$$core.126.req$"

 core.127.name: "Построить скопление улья"
 core.127.desc: ""
 core.127.hint: "Постройте £district£ ['concept_hive_district', скопление улья] в £colony£ ['concept_colony', колонии]."
 core.127.lore: "§L«Больше туннелей. Больше дронов. Больше улья. Всегда больше».§!"
 core.127.req: "Построено скопление улья"
 core.127.fail: "$TRIGGER_FAIL$$core.127.req$"
 core.127.success: "$TRIGGER_PASS$$core.127.req$"

 core.127_1.name: "Построить коллективный биом"
 core.127_1.desc: ""
 core.127_1.hint: "Постройте £district£ §H$district_craglands$§! в £colony£ ['concept_colony', колонии]."
 core.127_1.lore: "§L«В начале была планета».§!"
 core.127_1.req: "Построен коллективный биом"
 core.127_1.fail: "$TRIGGER_FAIL$$core.127_1.req$"
 core.127_1.success: "$TRIGGER_PASS$$core.127_1.req$"

 core.128.name: "Построить городской район"
 core.128.desc: ""
 core.128.hint: "Во вкладке $colony_view_tab_planet_summary$ в £interface£ ['concept_colony_view', обзоре колонии] постройте £district£ ['concept_city_district', городской район]."
 core.128.lore: "§L«Панорама города — это мера амбиций его жителей. Чем выше мы строим, тем дальше устремляются их мечты».§!"
 core.128.req: "Построен городской район"
 core.128.fail: "$TRIGGER_FAIL$$core.128.req$"
 core.128.success: "$TRIGGER_PASS$$core.128.req$"

 core.128_1.name: "Построить жилые палубы"
 core.128_1.desc: ""
 core.128_1.hint: "Во вкладке $colony_view_tab_planet_summary$ в £interface£ ['concept_colony_view', обзоре колонии] постройте £district£ §Hжилые палубы§!."
 core.128_1.lore: "§L«Мощные двигатели несут нас к цели, а рынки и залы заседаний не дают забыть о ней». – Пословица кочевников§!"
 core.128_1.req: "Построены жилые палубы"
 core.128_1.fail: "$TRIGGER_FAIL$$core.128_1.req$"
 core.128_1.success: "$TRIGGER_PASS$$core.128_1.req$"

 core.129.name: "Построить центральный комплекс"
 core.129.desc: ""
 core.129.hint: "Во вкладке $colony_view_tab_planet_summary$ в £interface£ ['concept_colony_view', обзоре колонии] постройте £district£ ['concept_nexus_district', центральный комплекс]."
 core.129.lore: "§L«Новые центральные комплексы — это новые модули. Отрицательных сторон нет. За исключением случаев отклонения от нормы. В таких случаях полагается рекалибровка».§!"
 core.129.req: "Построен центральный комплекс"
 core.129.fail: "$TRIGGER_FAIL$$core.129.req$"
 core.129.success: "$TRIGGER_PASS$$core.129.req$"

 core.130.name: "Построить промышленный район"
 core.130.desc: ""
 core.130.hint: "Во вкладке $colony_view_tab_planet_summary$ в £interface£ ['concept_colony_view', обзоре колонии] постройте £district£ ['concept_industrial_district', промышленный район]."
 core.130.lore: "§L«Главный признак прогресса — дым от предприятий».§!"
 core.130.req: "Построен промышленный район"
 core.130.fail: "$TRIGGER_FAIL$$core.130.req$"
 core.130.success: "$TRIGGER_PASS$$core.130.req$"

 core.132.name: "Построить энергетический район"
 core.132.desc: ""
 core.132.hint: "Во вкладке $colony_view_tab_planet_summary$ в £interface£ ['concept_colony_view', обзоре колонии] постройте £district£ ['concept_generator_district', энергетический район]."
 core.132.lore: "§L«Энергия это среда, в которой проявляется всё сущее». — Абдбаал§!"
 core.132.req: "Построен энергетический район"
 core.132.fail: "$TRIGGER_FAIL$$core.132.req$"
 core.132.success: "$TRIGGER_PASS$$core.132.req$"

 core.132_1.name: "Построить поле фотосинтеза"
 core.132_1.desc: ""
 core.132_1.hint: "Во вкладке $colony_view_tab_planet_summary$ в £interface£ ['concept_colony_view', обзоре колонии] постройте £district£ §Hполе фотосинтеза§!."
 core.132_1.lore: "§L«Этот мир утолял жажду светом, как мы — простой водой». — Зосира К'Тун§!"
 core.132_1.req: "Построено поле фотосинтеза"
 core.132_1.fail: "$TRIGGER_FAIL$$core.132_1.req$"
 core.132_1.success: "$TRIGGER_PASS$$core.132_1.req$"

 core.132_2.name: "Построить реакторные установки"
 core.132_2.desc: ""
 core.132_2.hint: "Во вкладке $colony_view_tab_planet_summary$ в £interface£ ['concept_colony_view', обзоре колонии] постройте £district£ §Hреакторные установки§!."
 core.132_2.lore: "§L«Нижние палубы корабля гудят не переставая. Со временем к этому гулу привыкаешь, и самым страшным становится тишина».§!"
 core.132_2.req: "Построены реакторные установки"
 core.132_2.fail: "$TRIGGER_FAIL$$core.132_2.req$"
 core.132_2.success: "$TRIGGER_PASS$$core.132_2.req$"

 core.134.name: "Построить горнодобывающий район"
 core.134.desc: ""
 core.134.hint: "Во вкладке $colony_view_tab_planet_summary$ в £interface£ ['concept_colony_view', обзоре колонии] постройте £district£ ['concept_mining_district', горнодобывающий район]."
 core.134.lore: "§L«Богатство мира не витает в небесах, оно скрыто в земле. Копайте глубже, и вас будет ждать процветание».§!"
 core.134.req: "Построен горнодобывающий район"
 core.134.fail: "$TRIGGER_FAIL$$core.134.req$"
 core.134.success: "$TRIGGER_PASS$$core.134.req$"

 core.134_1.name: "Постройте полую гору"
 core.134_1.desc: ""
 core.134_1.hint: "Во вкладке $colony_view_tab_planet_summary$ в £interface£ ['concept_colony_view', обзоре колонии] постройте £district£ §Hполую гору§!."
 core.134_1.lore: "§L«В горе, как в древесном стволе, течёт живительная сила».§!"
 core.134_1.req: "Построена полая гора"
 core.134_1.fail: "$TRIGGER_FAIL$$core.134_1.req$"
 core.134_1.success: "$TRIGGER_PASS$$core.134_1.req$"

 core.134_2.name: "Построить район оружейной инженерии"
 core.134_2.desc: ""
 core.134_2.hint: "Во вкладке $colony_view_tab_planet_summary$ в £interface£ ['concept_colony_view', обзоре колонии] постройте £district£ ['concept_district_ark_military', район оружейную инженерию]."
 core.134_2.lore: "§L«На планетах гражданские и солдаты живут порознь. Наш же дом и есть наше оружие».§!"
 core.134_2.req: "Построен район оружейной инженерии"
 core.134_2.fail: "$TRIGGER_FAIL$$core.134_2.req$"
 core.134_2.success: "$TRIGGER_PASS$$core.134_2.req$"

 core.134_3.name: "Построить район обслуживания"
 core.134_3.desc: ""
 core.134_3.hint: "Во вкладке $colony_view_tab_planet_summary$ в £interface£ ['concept_colony_view', обзоре колонии] постройте £district£ §Hрайон обслуживания§!."
 core.134_3.lore: "§L«Пассажиры видят люстру, а экипаж — проводку».§!"
 core.134_3.req: "Построен район обслуживания"
 core.134_3.fail: "$TRIGGER_FAIL$$core.134_3.req$"
 core.134_3.success: "$TRIGGER_PASS$$core.134_3.req$"

 core.136.name: "Построить аграрный район"
 core.136.desc: ""
 core.136.hint: "Во вкладке $colony_view_tab_planet_summary$ в £interface£ ['concept_colony_view', обзоре колонии] постройте £district£ ['concept_farming_district', аграрный район]."
 core.136.lore: "§L«Первый урожай был скуден. Но едва новые зёрна коснулись наших языков, нам стало ясно, что этот мир нас прокормит».§!"
 core.136.req: "Построен аграрный район"
 core.136.fail: "$TRIGGER_FAIL$$core.136.req$"
 core.136.success: "$TRIGGER_PASS$$core.136.req$"

 core.136_1.name: "Построить лес-сад"
 core.136_1.desc: ""
 core.136_1.hint: "Во вкладке $colony_view_tab_planet_summary$ в £interface£ ['concept_colony_view', обзоре колонии] постройте £district£ §Hлес-сад§!."
 core.136_1.lore: "§L«Дай миру достаточно — и он распустится, слово цветок».§!"
 core.136_1.req: "Построен лес-сад"
 core.136_1.fail: "$TRIGGER_FAIL$$core.136_1.req$"
 core.136_1.success: "$TRIGGER_PASS$$core.136_1.req$"

 core.136_2.name: "Построить бортовые фермы"
 core.136_2.desc: "(или палубы корабля ковчега)"
 core.136_2.hint: "Во вкладке $colony_view_tab_planet_summary$ в £interface£ ['concept_colony_view', обзоре колонии] постройте £district£ §Hбортовые фермы§!."
 core.136_2.lore: "§L«Говорят, жители планет выращивают пищу прямо в почве, под губительным светом звёзд. Какое безрассудство».§!"
 core.136_2.req: "Построены бортовые фермы"
 core.136_2.fail: "$TRIGGER_FAIL$$core.136_2.req$"
 core.136_2.success: "$TRIGGER_PASS$$core.136_2.req$"

 core.138.name: "Принять решение колонии"
 core.138.desc: ""
 core.138.hint: "Откройте список ['concept_decisions', решений] колонии во вкладке $colony_view_tab_management$ в £interface£ ['concept_colony_view', обзоре колонии] и примите одно из них."
 core.138.lore: "§L«Колонисты любят решительных лидеров — но ровно до тех пор, пока решения им по нраву».§!"
 core.138.req: "Принято решение колонии"
 core.138.fail: "$TRIGGER_FAIL$$core.138.req$"
 core.138.success: "$TRIGGER_PASS$$core.138.req$"

 core_focus_139.name: "Учредить филиал"
 core_focus_139.desc: ""
 core_focus_139.hint: "Чтобы открыть ['concept_branch_office', филиал], заключите ['concept_diplomatic_pacts', коммерческий пакт] с владельцем мира, где вы хотите это сделать. §HПреступный синдикат§! может пропустить этот шаг (поскольку ведёт дела подпольно)."
 core_focus_139.lore: "§L«Сегодня это лишь филиал, а завтра — основа всей их экономики». — Исполнительный директор Ителла Кикси'дольф, Отдел экспансии§!"
 core_focus_139.req: "Открыт филиал"
 core_focus_139.fail: "$TRIGGER_FAIL$$core_focus_139.req$"
 core_focus_139.success: "$TRIGGER_PASS$$core_focus_139.req$"

 core.140.name: "Выполнить контракт"
 core.140.desc: ""
 core.140.hint: "Примите £contract£ ['concept_contracts', контракт] на £interface£ ['concept_galaxy_map', карте галактики] и выполните его задачи."
 core.140.lore: "§L«Первый контракт — это шанс доказать, что наши слова не расходятся с делами, а говорим мы всегда то, что думаем.§!"
 core.140.req: "Выполнен контракт"
 core.140.fail: "$TRIGGER_FAIL$$core.140.req$"
 core.140.success: "$TRIGGER_PASS$$core.140.req$"

 core.200.name: "Завершить подготовку корабля-ковчега"
 core.200.desc: ""
 core.200.hint: "Завершите все задачи §Hподготовки корабля-ковчега§!, перечисленные во вкладке $situation_log_view_tab_situation_log$ в £interface£ ['concept_situation_log_view', журнале]."
 core.200.lore: "§L«Пусть нам повезёт, и мы найдём поломки раньше, чем они найдут нас!» – надпись на стене ремонтного отсека №7§!"
 core.200.req: "Завершена подготовка корабля-ковчега"
 core.200.fail: "$TRIGGER_FAIL$$core.200.req$"
 core.200.success: "$TRIGGER_PASS$$core.200.req$"

 core.300.name: "Выполнить 3 контракта"
 core.300.desc: ""
 core.300.hint: "Примите £contract£ ['concept_contracts', контракты] на £interface£ ['concept_galaxy_map', карте галактики] и выполните их задачи."
 core.300.lore: "§L«Второй контракт — новый кирпичик в фундаменте репутации».§!"
 core.300.req: "Выполнено 3 контракта"
 core.300.fail: "$TRIGGER_FAIL$$core.300.req$"
 core.300.success: "$TRIGGER_PASS$$core.300.req$"

 core.400.name: "Выполнить 7 контрактов"
 core.400.desc: ""
 core.400.hint: "Примите £contract£ ['concept_contracts', контракты] на £interface£ ['concept_galaxy_map', карте галактики] и выполните их задачи."
 core.400.lore: "§L«Мы сотрудничали с разными портами, станциями и государствами. Наши клиенты подтвердят, что мы всегда укладываемся в сроки».§!"
 core.400.req: "Выполнено 7 контрактов"
 core.400.fail: "$TRIGGER_FAIL$$core.400.req$"
 core.400.success: "$TRIGGER_PASS$$core.400.req$"

 core.500.name: "Выполнить 15 контрактов"
 core.500.desc: ""
 core.500.hint: "Примите £contract£ ['concept_contracts', контракты] на £interface£ ['concept_galaxy_map', карте галактики] и выполните их задачи."
 core.500.lore: "§L«Государства рождаются и умирают. Репутация, заработанная должным образом, живёт вечно».§!"
 core.500.req: "Выполнено 15 контрактов"
 core.500.fail: "$TRIGGER_FAIL$$core.500.req$"
 core.500.success: "$TRIGGER_PASS$$core.500.req$"

##########################
# Exploration Focus Cards
##########################

 exploration.100.name: "Изучить аномалию"
 exploration.100.desc: ""
 exploration.100.hint: "Обнаружив £anomaly£ ['concept_anomaly', аномалию], назначьте £scientist£ ['concept_scientist', учёного] на её изучение."
 exploration.100.lore: "§L«Бессмысленных сигналов не бывает. Каждый щелчок, каждый отголосок что-то значит. Вопрос в том, что именно».§!"
 exploration.100.req: "Изучена аномалия"
 exploration.100.fail: "$TRIGGER_FAIL$$exploration.100.req$"
 exploration.100.success: "$TRIGGER_PASS$$exploration.100.req$"

 exploration.105.name: "Изучить систему"
 exploration.105.desc: ""
 exploration.105.hint: "Полностью изучите £system£ ['concept_system', систему] с помощью £science_ship£ ['concept_science_ship', научного корабля]."
 exploration.105.lore: "§L«Никакая экспансия невозможна без понимания звёзд, на которые мы собираемся предъявить права». — Введение в звёздную картографию, издание 7-е§!"
 exploration.105.req: "Изучена система"
 exploration.105.fail: "$TRIGGER_FAIL$$exploration.105.req$"
 exploration.105.success: "$TRIGGER_PASS$$exploration.105.req$"

 exploration.110.name: "Завершить особый проект"
 exploration.110.desc: ""
 exploration.110.hint: "Во вкладке $situation_log_view_tab_situation_log$ в £interface£ ['concept_situation_log_view', журнале] найдите ['concept_special_project', особый проект] и выполните его."
 exploration.110.lore: "§L«Вы думаете, сложно интерпретировать данные? Нет, сложно убедить других в том, что ваши открытия имеют ценность».§!"
 exploration.110.req: "Завершён особый проект"
 exploration.110.fail: "$TRIGGER_FAIL$$exploration.110.req$"
 exploration.110.success: "$TRIGGER_PASS$$exploration.110.req$"

 exploration.115.name: "Обнаружить инопланетную жизнь"
 exploration.115.desc: ""
 exploration.115.hint: "Изучайте £system£ ['concept_systems', системы] с помощью £science_ship£ ['concept_science_ship', научного корабля], пока не найдёте инопланетную жизнь."
 exploration.115.lore: "§L«Вопрос не в том, найдём ли мы жизнь на других планетах, но в том, когда это случится. И тогда нам придётся задать вопрос: поймём ли мы, что видим перед собой?»§!"
 exploration.115.req: "Обнаружена инопланетная жизнь"
 exploration.115.fail: "$TRIGGER_FAIL$$exploration.115.req$"
 exploration.115.success: "$TRIGGER_PASS$$exploration.115.req$"

 exploration.120.name: "Получить постоянный вариант исследований"
 exploration.120.desc: ""
 exploration.120.hint: "Изучайте £anomaly£ ['concept_anomalies', аномалии], £archaeology£ ['concept_archaeology_site', места археологических раскопок] и ['concept_debris', обломки], оставшиеся после космических сражений. Вы можете получить §Hпостоянный вариант исследований§!, который будет доступен до тех пор, пока вы его не изучите."
 exploration.120.lore: "§L«Настоящий прогресс — это не скачок вперёд, это тысяча осторожных шажков в неизвестность». — Принципы научных изысканий, том III§!"
 exploration.120.req: "Получен постоянный вариант исследований"
 exploration.120.fail: "$TRIGGER_FAIL$$exploration.120.req$"
 exploration.120.success: "$TRIGGER_PASS$$exploration.120.req$"

 exploration.125.name: "Нанять учёного"
 exploration.125.desc: ""
 exploration.125.hint: "В £interface£ ['concept_leaders_view', обзоре лидеров] наймите ['concept_leader', лидера] — £scientist£ ['concept_scientist', учёного].$focus_other$"
 exploration.125.lore: "§L«Ищете кого-нибудь, кто сможет составить модель квантовой сингулярности бюджет? Ну ищите».§!"
 exploration.125.req: "Нанят учёный"
 exploration.125.fail: "$TRIGGER_FAIL$$exploration.125.req$"
 exploration.125.success: "$TRIGGER_PASS$$exploration.125.req$"

 exploration.200.name: "Завершить археологические раскопки"
 exploration.200.desc: ""
 exploration.200.hint: "Назначьте £scientist£ ['concept_scientist', учёного] на £archaeology£ ['concept_archaeology_site', археологические раскопки] и докопайтесь до истины."
 exploration.200.lore: "§L«Ещё одна древняя империя, ещё одно мрачное предупреждение. Казалось бы, пора бы уже нам чему-нибудь научиться».§!"
 exploration.200.req: "Завершены археологические раскопки"
 exploration.200.fail: "$TRIGGER_FAIL$$exploration.200.req$"
 exploration.200.success: "$TRIGGER_PASS$$exploration.200.req$"

 exploration.205.name: "Повысить уровень учёного"
 exploration.205.desc: ""
 exploration.205.hint: "Назначьте £science_ship£ ['concept_science_ship', научный корабль] под командованием £scientist£ ['concept_scientist', учёного] изучать £system£ ['concept_systems', системы] и исследовать £anomaly£ ['concept_anomalies', аномалии]. Также можно назначить учёного ['concept_governor', губернатором] или дать ему место в ['concept_council', совете].\n\nУчёный будет зарабатывать ценный опыт, который поможет ему повысить уровень и приобрести новые ['concept_leader_traits', черты]."
 exploration.205.lore: "§L«Знание — это не цель, но путь, который открывается лишь тем, кто осмелится на него вступить». — Путь учёного: рост через понимание§!"
 exploration.205.req: "Повышен уровень учёного"
 exploration.205.fail: "$TRIGGER_FAIL$$exploration.205.req$"
 exploration.205.success: "$TRIGGER_PASS$$exploration.205.req$"

 exploration.210.name: "Понаблюдать за досветовой цивилизацией"
 exploration.210.desc: ""
 exploration.210.hint: "С помощью £construction_ship£ ['concept_construction_ship', строительного корабля] постройте §Hстанцию наблюдения§! на орбите планеты с §Hдосветовой цивилизацией§!."
 exploration.210.lore: "§L«В настоящий момент вероятность того, что эта цивилизация самоуничтожится до того, как откроет сверхсветовые перелёты, составляет 3 к 1. Делайте ставки».§!"
 exploration.210.req: "Установлено наблюдение за досветовой цивилизацией"
 exploration.210.fail: "$TRIGGER_FAIL$$exploration.210.req$"
 exploration.210.success: "$TRIGGER_PASS$$exploration.210.req$"

 exploration.215.name: "Назначить учёного губернатором"
 exploration.215.desc: ""
 exploration.215.hint: "Во вкладке $colony_view_tab_planet_summary$ в £interface£ ['concept_colony_view', обзоре колонии] или в £interface£ ['concept_planets_and_sector_view', обзоре планет и секторов] назначьте £scientist£ ['concept_scientist', учёного] на пост ['concept_governor', губернатора] £sector£ ['concept_sector', сектора] или £planet£ ['concept_planet', планеты]."
 exploration.215.lore: "§L«Наука не прислуживает традициям и не покоряется прошлому. Мир под началом учёных всегда будет миром в движении». — Куратор Расса Тош, «Размышления о руководстве»§!"
 exploration.215.req: "Учёный назначен губернатором"
 exploration.215.fail: "$TRIGGER_FAIL$$exploration.215.req$"
 exploration.215.success: "$TRIGGER_PASS$$exploration.215.req$"

 exploration.220.name: "Пройти через червоточину"
 exploration.220.desc: ""
 exploration.220.hint: "Исследовав технологию £physics£ §Hстабилизации червоточин§! отправьте £science_ship£ ['concept_science_ship', научный корабль] исследовать §Hчервоточину§! и пройти через неё."
 exploration.220.lore: "§L«Обратите внимание, что предоставляемое институтом страхование жизни не покрывает исчезновение из реальности вследствие пространственно-временного парадокса».§!"
 exploration.220.req: "Червоточина пройдена"
 exploration.220.fail: "$TRIGGER_FAIL$$exploration.220.req$"
 exploration.220.success: "$TRIGGER_PASS$$exploration.220.req$"

 exploration.225.name: "Заключить соглашение об исследованиях"
 exploration.225.desc: ""
 exploration.225.hint: "Во вкладке $contacts_view_tab_contacts$ в £interface£ ['concept_contacts_view', списке контактов] предложите другому ['concept_empire', государству] заключить этот ['concept_diplomatic_pact', дипломатический пакт]."
 exploration.225.lore: "§L«Два ума решат задачу быстрее, чем один. Две цивилизации? Их научные возможности безграничны».§!"
 exploration.225.req: "Заключено соглашение об исследованиях"
 exploration.225.fail: "$TRIGGER_FAIL$$exploration.225.req$"
 exploration.225.success: "$TRIGGER_PASS$$exploration.225req$"

 exploration.230.name: "Выполнить контракт «$contract_deep_scan$»"
 exploration.230.desc: ""
 exploration.230.hint: "Примите контракт §H$contract_deep_scan$§! на £interface£ ['concept_galaxy_map', карте галактики], а затем прикажите £arkship£ ['concept_arkship', кораблю-ковчегу] провести §Hглубокое сканирование§! в указанной ['concept_system', системе]."
 exploration.230.lore: "§L«Мы научились считывать малейшие изменения гравитации и различать даже самый тихий гул камней вдалеке. Космос благоволит внимательным».§!"
 exploration.230.req: "Выполнен контракт «$contract_deep_scan$»"
 exploration.230.fail: "$TRIGGER_FAIL$$exploration.230.req$"
 exploration.230.success: "$TRIGGER_PASS$$exploration.230.req$"

 exploration.300.name: "Построить рой Дайсона"
 exploration.300.desc: "(производящий\n30 £physics£, £society£ или £engineering£)"
 exploration.300.hint: "Исследовав технологию £physics£ §Hроя Дайсона§!, найдите подходящую ['concept_star', звезду] и с помощью £construction_ship£ ['concept_construction_ship', строительного корабля] постройте £megastructure£ ['concept_megastructure', мегасооружение] §H$tech_dyson_swarm$§!."
 exploration.300.lore: "§L«Когда стоишь на наблюдательной палубе и смотришь, как разворачиваются первые спутники... Внутри что-то меняется. Мысль о том, что мы можем обуздать свет звезды, опьяняет». — Главный конструктор Тиг Бори, МКС Д'Тума§!"
 exploration.300.req: "Построен рой Дайсона, производящий не менее §Y30§! £physics£, £society£ или £engineering£"
 exploration.300.fail: "$TRIGGER_FAIL$$exploration.300.req$"
 exploration.300.success: "$TRIGGER_PASS$$exploration.300.req$"

 exploration.305.name: "Получить помощь в исследованиях от анклава"
 exploration.305.desc: ""
 exploration.305.hint: "Установив контакт, откройте вкладку $contacts_view_tab_contacts$ в списке контактов и попросите §Hпомощь в исследовании§! у §HОрдена кураторов§!."
 exploration.305.lore: "§L«Я спросил куратора, что стало величайшим научным открытием в истории. Они улыбнулся и ответил: "Оно ещё грядёт"».§!"
 exploration.305.req: "Получена помощь в исследованиях от анклава"
 exploration.305.fail: "$TRIGGER_FAIL$$exploration.305.req$"
 exploration.305.success: "$TRIGGER_PASS$$exploration.305.req$"

 exploration.310.name: "Построить 5 научных лабораторий"
 exploration.310.desc: ""
 exploration.310.hint: "Во вкладке $colony_view_tab_planet_summary$ в £interface£ ['concept_colony_view', обзоре колонии] постройте пять научных лабораторий в одной или нескольких £colony£ ['concept_colonies', колониях]."
 exploration.310.lore: "§L«Пять новых лабораторий, а мы всё равно не понимаем, куда уходят гранты».§!"
 exploration.310.req: "Построено 5 научных лабораторий"
 exploration.310.fail: "$TRIGGER_FAIL$$exploration.310.req$"
 exploration.310.success: "$TRIGGER_PASS$$exploration.310.req$"

 exploration.315.name: "Изучить астральный разлом"
 exploration.315.desc: ""
 exploration.315.hint: "Исследовав технологию £physics£ §Hразломной сферы§!, назначьте £scientist£ ['concept_scientist', учёного] на ['concept_archaeology_site', астральный разлом] и пройдите события внутри."
 exploration.315.lore: "§L«Он нарушает законы физики, ломает время и может стереть нас из бытия. Естественно, нам нужно было в него залезть».§!"
 exploration.315.req: "До конца изучен астральный разлом"
 exploration.315.fail: "$TRIGGER_FAIL$$exploration.315.req$"
 exploration.315.success: "$TRIGGER_PASS$$exploration.315.req$"

 exploration.320.name: "Получить учёного-ветерана"
 exploration.320.desc: "(достигшего 4-го уровня)"
 exploration.320.hint: "$exploration.205.hint$"
 exploration.320.lore: "§L«Настоящий учёный не накапливает знания, но культивирует парадигмы».§!"
 exploration.320.req: "Есть учёный-ветеран"
 exploration.320.fail: "$TRIGGER_FAIL$$exploration.320.req$"
 exploration.320.success: "$TRIGGER_PASS$$exploration.320.req$"

 exploration.325.name: "Терраформировать 3 мира"
 exploration.325.desc: ""
 exploration.325.hint: "Исследовав технологию £society£ §Hизменения формы суши§!, найдите подходящую для ['concept_terraforming', терраформирования] £planet£ ['concept_planet', планету] и начните процесс."
 exploration.325.lore: "§L«Вы читали журнал изменений для последнего цикла терраформирования? Они добавили пляжи!»§!"
 exploration.325.req: "Терраформировано 3 мира"
 exploration.325.fail: "$TRIGGER_FAIL$$exploration.325.req$"
 exploration.325.success: "$TRIGGER_PASS$$exploration.325.req$"

 exploration.400.name: "Изучить повторяющуюся технологию"
 exploration.400.desc: ""
 exploration.400.hint: "Найдите в £interface£ ['concept_technology_view', окне технологий] §Hповторяющуюся технологию§!, значок которой выделен особой рамкой, и изучите её."
 exploration.400.lore: "§L«Ещё один прорыв, ещё один скачок вперёд. Но где же горизонт? Он не приближается ни на шаг». — Главный научный сотрудник Эли Канто§!"
 exploration.400.req: "Изучена повторяющаяся технология"
 exploration.400.fail: "$TRIGGER_FAIL$$exploration.400.req$"
 exploration.400.success: "$TRIGGER_PASS$$exploration.400.req$"

 exploration.405.name: "Завладеть сооружением угасшей империи"
 exploration.405.desc: ""
 exploration.405.hint: "Победите ['concept_fallen_empire', угасшую империю].$focus_other$"
 exploration.405.lore: "§L«Узрите величие древних! Теперь бы понять, как оно работает...»§!"
 exploration.405.req: "Захвачено сооружение угасшей империи"
 exploration.405.fail: "$TRIGGER_FAIL$$exploration.405.req$"
 exploration.405.success: "$TRIGGER_PASS$$exploration.405.req$"

 exploration.410.name: "Изучить обломки угасшей империи"
 exploration.410.desc: ""
 exploration.410.hint: "После космического сражения с ['concept_fallen_empire', угасшей империей] отправьте к месту боя £science_ship£ ['concept_science_ship', научный корабль] и выполните ['concept_special_project', особый проект]."
 exploration.410.lore: "§L«При изучении наследия древних нужно задаваться вопросом: угасли они из-за своей мощи или несмотря на неё?» — Разбитые короны: исследование галактического заката§!"
 exploration.410.req: "Изучены обломки угасшей империи"
 exploration.410.fail: "$TRIGGER_FAIL$$exploration.410.req$"
 exploration.410.success: "$TRIGGER_PASS$$exploration.410.req$"

 exploration.415.name: "Изучить обломки кризиса"
 exploration.415.desc: ""
 exploration.415.hint: "После космического сражения с §Hкризисом§! отправьте к месту боя £science_ship£ ['concept_science_ship', научный корабль] и выполните ['concept_special_project', особый проект]."
 exploration.415.lore: "§L«Понять оружие — значит сделать шаг к тому, чтобы взять его на вооружение. Вопрос в том, возможно ли сделать шаг назад». — Адмирал Хаск'Валгам, «О масштабах власти»§!"
 exploration.415.req: "Изучены обломки кризиса"
 exploration.415.fail: "$TRIGGER_FAIL$$exploration.415.req$"
 exploration.415.success: "$TRIGGER_PASS$$exploration.415.req$"

 exploration.420.name: "Обладать тремя учёными 5-го уровня"
 exploration.420.desc: ""
 exploration.420.hint: "$exploration.205.hint$"
 exploration.420.lore: "§L«Три учёных — три теории. И три довода в пользу того, что остальные двое несут белиберду».§!"
 exploration.420.req: "Есть три учёных 5-го уровня"
 exploration.420.fail: "$TRIGGER_FAIL$$exploration.420.req$"
 exploration.420.success: "$TRIGGER_PASS$$exploration.420.req$"

 exploration.425.name: "Построить научный корабль-ковчег"
 exploration.425.desc: ""
 exploration.425.hint: "Чтобы построить новый §Hнаучный корабль-ковчег§!, выберите существующий £arkship£ ['concept_arkship', ковчег], нажмите §HПостроить мегасооружение§!, а затем задайте класс корабля."
 exploration.425.lore: "§L«Их библиотеки погибли вместе с планетами. Наши же снабжены двигателями, что никогда не замолкают. Скорее у вселенной закончатся тайны, чем у нас любопытство . — Профессор Лиенн Торади, речь перед выпускниками академии наук ковчега§!"
 exploration.425.req: "Построен научный корабль-ковчег"
 exploration.425.fail: "$TRIGGER_FAIL$$exploration.425.req$"
 exploration.425.success: "$TRIGGER_PASS$$exploration.425.req$"

 exploration.500.name: "Построить научный комплекс"
 exploration.500.desc: ""
 exploration.500.hint: "Исследовав технологию £physics£ §Hнаучного комплекса§!, найдите подходящую £planet£ ['concept_planet', планету] или ['concept_star', звезду] и с помощью £construction_ship£ ['concept_construction_ship', строительного корабля] постройте £megastructure£ ['concept_megastructure', мегасооружение] §H$tech_science_nexus$§!."
 exploration.500.lore: "§L«С этим научным комплексом мы сможем разгадать любую загадку. Хотя некоторые из них разгадывать ещё рано».§!"
 exploration.500.req: "Построен научный комплекс"
 exploration.500.fail: "$TRIGGER_FAIL$$exploration.500.req$"
 exploration.500.success: "$TRIGGER_PASS$$exploration.500.req$"

 exploration.505.name: "Производить 1000 исследований в месяц"
 exploration.505.desc: ""
 exploration.505.hint: "Постройте больше ['building:building_research_lab_1', научных лабораторий]. Во вкладке $colony_view_tab_planet_summary$ в £interface£ ['concept_colony_view', обзоре колонии] смените ['concept_designation', специализацию] колонии на §H$col_research$§!.$focus_other$"
 exploration.505.lore: "§L«Оказывается, наши "показатели инноваций" в этом квартале просели. Может быть, если бы мы тратили меньше времени на планёрки, мы бы совершали больше прорывов».§!"
 exploration.505.req: "Производится 1000 исследований в месяц"
 exploration.505.fail: "$TRIGGER_FAIL$$exploration.505.req$"
 exploration.505.success: "$TRIGGER_PASS$$exploration.505.req$"

 exploration.510.name: "Активировать реликвии 10 раз"
 exploration.510.desc: "(одну или несколько)"
 exploration.510.hint: "Во вкладке $discoveries_view_tab_relics$ в £interface£ ['concept_discoveries_view', обзоре открытий] активируйте одну или несколько ['concept_relics', реликвий] 10 раз."
 exploration.510.lore: "§L«Мы обнаружили полные спецификации этой реликвии на древней электронной доске обсуждений. Активировать её будет проще простого».§!"
 exploration.510.req: "Активировано 10 реликвий"
 exploration.510.fail: "$TRIGGER_FAIL$$exploration.510.req$"
 exploration.510.success: "$TRIGGER_PASS$$exploration.510.req$"

 exploration.600.name: "Найти левиафана"
 exploration.600.desc: ""
 exploration.600.hint: "Изучайте £system£ ['concept_systems', системы] с помощью £science_ship£ ['concept_science_ship', научного корабля], пока не найдёте левиафана."
 exploration.600.lore: "§L«Поиски левиафана — опасная затея. И когда мы найдём одного, нам нужно будет ответить на вопрос: что мы предпримем в присутствии столь грандиозной мощи?»§!"
 exploration.600.req: "Найден левиафан"
 exploration.600.fail: "$TRIGGER_FAIL$$exploration.600.req$"
 exploration.600.success: "$TRIGGER_PASS$$exploration.600.req$"

#######################
# Conquest Focus Cards
#######################

 conquest.100.name: "Нанять командира"
 conquest.100.desc: ""
 conquest.100.hint: "В ['concept_leaders_view', обзоре лидеров] наймите ['concept_leader', лидера] — £commander£ ['concept_commander', командира].$focus_other$"
 conquest.100.lore: "§L«Лучшие командиры не спрашивают о довольствии. Они спрашивают, скоро ли в бой».§!"
 conquest.100.req: "Нанят командир"
 conquest.100.fail: "$TRIGGER_FAIL$$conquest.100.req$"
 conquest.100.success: "$TRIGGER_PASS$$conquest.100.req$"

 conquest.105.name: "Улучшить космическую базу"
 conquest.105.desc: ""
 conquest.105.hint: "Во вкладке $starbase_view_tab_command$ в £interface£ ['concept_starbase_view', обзоре космической базы] улучшите ['concept_starbase', космическую базу] до следующего уровня."
 conquest.105.lore: "§L«Хорошая космическая база служит предупреждением. Мы не для красоты их строим, а чтобы наши партнёры подумали дважды».§!"
 conquest.105.req: "Улучшена космическая база"
 conquest.105.fail: "$TRIGGER_FAIL$$conquest.105.req$"
 conquest.105.success: "$TRIGGER_PASS$$conquest.105.req$"

 conquest.105_1.name: "Улучшить маршрутную станцию"
 conquest.105_1.desc: ""
 conquest.105_1.hint: "Во вкладке $waystation_view_tab_waystation$ в £interface£ ['concept_waystation_view', обзоре маршрутной станции] улучшите £waystation£ ['concept_waystation', маршрутную станцию] до следующего уровня."
 conquest.105_1.lore: "§L«Мы строители, а не завоеватели. Звёзды дают нам всё, что нужно».§!"
 conquest.105_1.req: "Улучшена маршрутная станция"
 conquest.105_1.fail: "$TRIGGER_FAIL$$conquest.105_1.req$"
 conquest.105_1.success: "$TRIGGER_PASS$$conquest.105_1.req$"

 conquest.110.name: "Построить 5 корветов"
 conquest.110.desc: ""
 conquest.110.hint: "Во вкладке $fleet_management_view_tab_fleet_manager$ в £interface£ ['concept_fleet_management_view', обзоре управления флотилиями] или на ['concept_shipyard', верфи] постройте пять §Hкорветов§!."
 conquest.110.lore: "§L«Быстрые, дешёвые и заменимые. Вслух этого никто не говорит, но экипажи всё понимают». — Илш на-Сутар, 3-я экспедиционная флотилия§!"
 conquest.110.req: "Построено 5 корветов"
 conquest.110.fail: "$TRIGGER_FAIL$$conquest.110.req$"
 conquest.110.success: "$TRIGGER_PASS$$conquest.110.req$"

 conquest.111.name: "Клонировать 5 космических амёб"
 conquest.111.desc: ""
 conquest.111.hint: "Во вкладке $fleet_management_view_tab_fleet_manager$ в £interface£ ['concept_fleet_management_view', обзоре управления флотилиями] или в ['concept_beastport', зверопорте] клонируйте пять космических амёб."
 conquest.111.lore: "§L«Взять живую тварь и превратить её в оружие. Для одних это прогресс. Для других — богохульство. История запомнит лишь тех, кто останется в живых». — Доктор Хаск'Зумон, «Генетика и искусство войны»§!"
 conquest.111.req: "Клонировано 5 космических амёб"
 conquest.111.fail: "$TRIGGER_FAIL$$conquest.111.req$"
 conquest.111.success: "$TRIGGER_PASS$$conquest.111.req$"

 conquest.112.name: "Произвести 5 «Мучителей»"
 conquest.112.desc: ""
 conquest.112.hint: "Во вкладке $fleet_management_view_tab_fleet_manager$ в £interface£ ['concept_fleet_management_view', обзоре управления флотилиями] или на ['concept_shipyard', верфи] создайте пять §HМучителей§!."
 conquest.112.lore: "§L«Мы зовём их Мучителями не просто так». — Нара на-Телкан, 4-я экспедиционная флотилия§!"
 conquest.112.req: "Произведено 5 «Мучителей»"
 conquest.112.fail: "$TRIGGER_FAIL$$conquest.112.req$"
 conquest.112.success: "$TRIGGER_PASS$$conquest.112.req$"

 conquest.115.name: "Построить 3 оборонительных платформы"
 conquest.115.desc: ""
 conquest.115.hint: "Во вкладке $starbase_view_tab_defenses$ в £interface£ ['concept_starbase_view', обзоре космической базы] постройте три §Hоборонительные платформы§!."
 conquest.115.lore: "§L«Их не строят на века. Их задача — продержаться столько, чтобы уничтожить кого-нибудь из врагов».§!"
 conquest.115.req: "Построено 3 оборонительных платформы"
 conquest.115.fail: "$TRIGGER_FAIL$$conquest.115.req$"
 conquest.115.success: "$TRIGGER_PASS$$conquest.115.req$"

 conquest.120.name: "Объявить соперника"
 conquest.120.desc: ""
 conquest.120.hint: "Во вкладке $contacts_view_tab_contacts$ в £interface£ ['concept_contacts_view', списке контактов] объявите другое ['concept_empire', государство] своим ['concept_rival', соперником]."
 conquest.120.lore: "§L«Величие империи измеряется не числом её сторонников, но силой её соперников».§!"
 conquest.120.req: "Объявлен соперник"
 conquest.120.fail: "$TRIGGER_FAIL$$conquest.120.req$"
 conquest.120.success: "$TRIGGER_PASS$$conquest.120.req$"

 conquest.125.name: "Выиграть битву флотилий"
 conquest.125.desc: ""
 conquest.125.hint: "Составьте мощную ['concept_fleet', флотилию] во вкладке $fleet_management_view_tab_fleet_manager$ в £interface£ ['concept_fleet_management_view', обзоре управления флотилиями]. Выберите флотилию в £interface£ ['concept_outliner', планировщике], на £interface£ ['concept_system_map', карте звёздной системы] или на £interface£ ['concept_galaxy_map', карте галактики] и отправьте сражаться с противником."
 conquest.125.lore: "§L«У их адмирала была безупречная стратегия. Но наши корабли были больше».§!"
 conquest.125.req: "Выиграна битва флотилий"
 conquest.125.fail: "$TRIGGER_FAIL$$conquest.125.req$"
 conquest.125.success: "$TRIGGER_PASS$$conquest.125.req$"

 conquest.200.name: "Исследовать новые виды вооружений"
 conquest.200.desc: ""
 conquest.200.hint: "Найдите в £interface£ ['concept_technology_view', окне технологий] какой-либо вид вооружения, например §Hлазеры§! в категории £physics£ ['concept_physics_research', физических исследований] или §Hракеты§! в категории £engineering£ ['concept_engineering_research', инженерных исследований], и изучите его."
 conquest.200.lore: "§L«Войны выигрываются не на поле боя. Они выигрываются в лаборатории». — Игви-Инор, 2-й штурмовой рой§!"
 conquest.200.req: "Исследован новый вид вооружений"
 conquest.200.fail: "$TRIGGER_FAIL$$conquest.200.req$"
 conquest.200.success: "$TRIGGER_PASS$$conquest.200.req$"

 conquest.205.name: "Повысить уровень командира"
 conquest.205.desc: ""
 conquest.205.hint: "Отправьте ['concept_fleet', флотилию] под командованием £commander£ ['concept_commander', командира] в бой. Также можно назначить командира ['concept_governor', губернатором] или дать ему место в ['concept_council', совете].\n\nКомандир будет зарабатывать ценный опыт, который поможет ему повысить уровень и приобрести новые ['concept_leader_traits', черты].."
 conquest.205.lore: "§L«Салаги учатся, как сражаться. Опытные командиры учатся, когда дать бой». — Новые доктрины войны в космосе§!"
 conquest.205.req: "Повышен уровень командира"
 conquest.205.fail: "$TRIGGER_FAIL$$conquest.205.req$"
 conquest.205.success: "$TRIGGER_PASS$$conquest.205.req$"

 conquest.210.name: "Построить 20 эсминцев"
 conquest.210.desc: ""
 conquest.210.hint: "Во вкладке $fleet_management_view_tab_fleet_manager$ в обзоре управления флотилиями создайте и пополните одну или несколько ['concept_fleets', флотилий] суммарно 20 §Hэсминцами§!, либо постройте их на ['concept_shipyard', верфи] вручную."
 conquest.210.lore: "§L«И бронированные — удар держат, и дешёвые — не жалко потерять. Со слов командования, "выгодная инвестиция"».§!"
 conquest.210.req: "Построено 20 эсминцев"
 conquest.210.fail: "$TRIGGER_FAIL$$conquest.210.req$"
 conquest.210.success: "$TRIGGER_PASS$$conquest.210.req$"

 conquest.211.name: "Иметь 10 космических амёб — маток"
 conquest.211.desc: ""
 conquest.211.hint: "Во вкладке $fleet_management_view_tab_fleet_manager$ в обзоре управления флотилиями создайте и пополните одну или несколько ['concept_fleets', флотилий] суммарно 10 §Hкосмическими амёбами — матками§!. Также можно клонировать §Hкосмических амёб§! в ['concept_beastport', зверопорте], либо дать им расплодиться самостоятельно."
 conquest.211.lore: "§L«Для нас она — оружие. Для своих детей же — дом».§!"
 conquest.211.req: "Есть 10 космических амёб-маток"
 conquest.211.fail: "$TRIGGER_FAIL$$conquest.211.req$"
 conquest.211.success: "$TRIGGER_PASS$$conquest.211.req$"

 conquest.212.name: "Произвести 20 «Ткачей»"
 conquest.212.desc: ""
 conquest.212.hint: "Во вкладке $fleet_management_view_tab_fleet_manager$ в £interface£ ['concept_fleet_management_view', обзоре управления флотилиями] или на ['concept_shipyard', верфи] и создайте 20 §HТкачей§!."
 conquest.212.lore: "§L«Ткач — это не просто боевой корабль; это множитель силы — та нить, что связывает рассеянную флотилию в единый смертоносный организм». — Синаптическая военная доктрина, том 4§!"
 conquest.212.req: "Произведено 20 «Ткачей»"
 conquest.212.fail: "$TRIGGER_FAIL$$conquest.212$"
 conquest.212.success: "$TRIGGER_PASS$$conquest.212$"

 conquest.215.name: "Объявить войну"
 conquest.215.desc: ""
 conquest.215.hint: "Во вкладке $contacts_view_tab_contacts$ в £interface£ ['concept_contacts_view', списке контактов] объявите ['concept_war', войну] другому ['concept_empires', государству]."
 conquest.215.lore: "§L«За честь, за империю, за судьбу! Вперёд!» — Боевой клич 54-й штурмовой армии§!"
 conquest.215.req: "Объявлена война"
 conquest.215.fail: "$TRIGGER_FAIL$$conquest.215.req$"
 conquest.215.success: "$TRIGGER_PASS$$conquest.215.req$"

 conquest.220.name: "Назначить командира губернатором"
 conquest.220.desc: ""
 conquest.220.hint: "Во вкладке $colony_view_tab_planet_summary$ в £interface£ ['concept_colony_view', обзоре колонии] или в £interface£ ['concept_planets_and_sector_view', обзоре планет и секторов] назначьте £commander£ ['concept_commander', командира] на пост ['concept_governor', губернатора] £sector£ ['concept_sector', сектора] или £planet£ ['concept_planet', планеты]."
 conquest.220.lore: "§L«Поезда теперь ходят по расписанию. Но и патрули тоже».§!"
 conquest.220.req: "Командир назначен губернатором"
 conquest.220.fail: "$TRIGGER_FAIL$$conquest.220.req$"
 conquest.220.success: "$TRIGGER_PASS$$conquest.220.req$"

 conquest.300.name: "Получить командира-ветерана"
 conquest.300.desc: "(достигшего 4-го уровня)"
 conquest.300.hint: "$conquest.205.hint$"
 conquest.300.lore: "§L«Военный опыт прибавляет не мудрости, а эффективности». — Адмирал Кол'дольф§!"
 conquest.300.req: "Есть командир-ветеран"
 conquest.300.fail: "$TRIGGER_FAIL$$conquest.300.req$"
 conquest.300.success: "$TRIGGER_PASS$$conquest.300.req$"

 conquest.305.name: "Победить в войне"
 conquest.305.desc: ""
 conquest.305.hint: "Во вкладке $contacts_view_tab_contacts$ в £interface£ ['concept_contacts_view', списке контактов] объявите ['concept_war', войну] другому ['concept_empires', государству]. Постройте сильную £fleet_size£ ['concept_fleet', флотилию], уничтожайте вражеские силы и оккупируйте ключевые £planets£ ['concept_colonies', колонии], пока не добьётесь победы."
 conquest.305.lore: "§L«Победа — не финал, а новая ноша. Глупцы празднуют триумф; мудрые готовятся к его последствиям». — Мастер Хуава, «Лезвие клинка»§!"
 conquest.305.req: "Одержана победа в войне"
 conquest.305.fail: "$TRIGGER_FAIL$$conquest.305.req$"
 conquest.305.success: "$TRIGGER_PASS$$conquest.305.req$"

 conquest.310.name: "Нанять наёмников"
 conquest.310.desc: ""
 conquest.310.hint: "Установив контакт, откройте вкладку $contacts_view_tab_contacts$ в списке контактов и наймите ['concept_fleet' флотилию] у §Hанклава наёмников§!."
 conquest.310.lore: "§L«Купить верность невозможно, но можно взять её в аренду до победы».§!"
 conquest.310.req: "Наняты наёмники"
 conquest.310.fail: "$TRIGGER_FAIL$$conquest.310.req$"
 conquest.310.success: "$TRIGGER_PASS$$conquest.310.req$"

 conquest.315.name: "Создать 10 армий"
 conquest.315.desc: ""
 conquest.315.hint: "Во вкладке $starbase_view_tab_armies$ в обзоре космической базы или во вкладке $colony_view_tab_armies$ в обзоре колонии наймите 10 ['concept_armies', армий]."
 conquest.315.lore: "§L«Враг считает солдат. Мы считаем биомассу».§!"
 conquest.315.req: "Создано 10 армий"
 conquest.315.fail: "$TRIGGER_FAIL$$conquest.315.req$"
 conquest.315.success: "$TRIGGER_PASS$$conquest.315.req$"

 conquest.320.name: "Принудить планету к капитуляции"
 conquest.320.desc: "(орбитальной бомбардировкой)"
 conquest.320.hint: "Разместите ['concept_fleet', флотилию] на орбите вражеской £colony£ ['concept_colony', колонии] — начнётся §Hорбитальная бомбардировка§!. Вместо того чтобы штурмовать планету ['concept_armies', армиями], пусть её бомбит ваша §Hфлотилия§!, пока §Hколония§! не сдастся."
 conquest.320.lore: "§L«Осада это состязание не силы, но выносливости. Или планета выстоит и флотилия сгорит, или выстоит флотилия и планета сдастся». — Ренток шар Платт, «Затяжная война»§!"
 conquest.320.req: "Планета принуждена к сдаче"
 conquest.320.fail: "$TRIGGER_FAIL$$conquest.320.req$"
 conquest.320.success: "$TRIGGER_PASS$$conquest.320.req$"

 conquest.325.name: "Завоевать родной мир"
 conquest.325.desc: ""
 conquest.325.hint: "В £interface£ ['concept_claims_view', обзоре притязаний] выдвиньте ['concept_claims', притязание] на £colony£ ['concept_colonies', колонию] в начальном §Hродном мире§! другого ['concept_empire', государства]. Во вкладке $contacts_view_tab_contacts$ в £interface£ ['concept_contacts_view', списке контактов] объявите ['concept_war', войну] за выдвинутое §Hпритязание§!. Высадите ['concept_armies', армию] в §Hродном мире§!, чтобы захватить его, а затем закончите войну."
 conquest.325.lore: "§L«Они называли эту планету сердцем своей империи. Теперь оно бьётся для нас».§!"
 conquest.325.req: "Завоёван родной мир"
 conquest.325.fail: "$TRIGGER_FAIL$$conquest.325.req$"
 conquest.325.success: "$TRIGGER_PASS$$conquest.325.req$"

 conquest.325_1.name: "Захватить корабль-ковчег"
 conquest.325_1.desc: ""
 conquest.325_1.hint: "Во вкладке $contacts_view_tab_contacts$ в £interface£ ['concept_contacts_view', списке контактов] объявите ['concept_war', войну] с поводом §H$war_goal_wg_nomad_raid$§! другому £nomad£ ['concept_nomadic_empire', кочевому государству]. По её итогам будут захвачены все £arkship£ ['concept_arkships', корабли-ковчеги], выведенные из строя."
 conquest.325_1.lore: "§L«Там, где заканчивались их записи в навигационном журнале, начинались наши».§!"
 conquest.325_1.req: "Захвачен корабль-ковчег"
 conquest.325_1.fail: "$TRIGGER_FAIL$$conquest.325_1.req$"
 conquest.325_1.success: "$TRIGGER_PASS$$conquest.325_1.req$"

 conquest.330.name: "Выполнить контракт «$contract_raid_planet_small$»"
 conquest.330.desc: ""
 conquest.330.hint: "Примите контракт §H$contract_raid_planet_small$§! на £interface£ ['concept_galaxy_map', карте галактики] и прикажите ['concept_fleets', флотилии] провести §Hбомбардировку§! ['concept_colonies', колоний] указанного государства."
 conquest.330.lore: "§L«Мы не спрашиваем, чем клиенту так не угодили какие-то миры».§!"
 conquest.330.req: "Выполнен контракт «$contract_raid_planet_small$»"
 conquest.330.fail: "$TRIGGER_FAIL$$conquest.330.req$"
 conquest.330.success: "$TRIGGER_PASS$$conquest.330.req$"

 conquest.400.name: "Обладать тремя командирами 5-го уровня"
 conquest.400.desc: ""
 conquest.400.hint: "$conquest.205.hint$"
 conquest.400.lore: "§L«Опытные командиры появляются не благодаря тренировкам или зубрёжке теории. Они закаляются бездной».§!"
 conquest.400.req: "Есть три командира 5-го уровня"
