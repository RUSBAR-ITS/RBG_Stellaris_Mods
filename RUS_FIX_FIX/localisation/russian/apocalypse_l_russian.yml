 end_trade_3: "Действие нашего текущего соглашения с муутаганцами о торговле ресурсами будет прекращено."
 leviathans.105.e: "Мы решили прекратить наше соглашение о торговле ресурсами."
 leviathans.105.e.response: "Очень хорошо. Мы немедленно сообщим нашим грузовым кораблям, что их миссия отменяется, и им нужно возвращаться на базу.\n\nДайте нам знать, если измените своё решение!"
 leviathans.171.name: "Торговля энергией отменена"
 leviathans.171.desc: "Теперь, когда наши энергетические резервы исчерпаны, мы больше не можем выполнять наши торговые обязательства по сделкам, которые касаются этого ресурса. Все соглашения такого рода с торговыми анклавами отменены."
 leviathans.171.a: "Это нехорошо."
 enclave_mineral_trade_ended: "Недостаточно £energy£ §Hэнергокредитов§! для поддержания соглашений о ресурсах с анклавами торговцев."
 leviathans.173.name: "Торговля минералами отменена"
 leviathans.173.desc: "Теперь, когда наши запасы минералов исчерпаны, мы больше не можем выполнять наши торговые обязательства по сделкам, которые касаются этого ресурса. Все соглашения такого рода с торговыми анклавами отменены."
 enclave_energy_trade_ended: "Недостаточно £energy£ §Hэнергокредитов§! для сохранения соглашений о ресурсах с торговыми анклавами."
 leviathans.175.name: "Торговля пищей отменена"
 leviathans.175.desc: "Теперь, когда наши запасы пищи исчерпаны, мы больше не можем обмениваться ими. Все соглашения о таком обмене с торговыми анклавами отменены."
 enclave_food_trade_ended: "Недостаточно £food£ §Hпищи§! для поддержания соглашений о ресурсах с анклавами торговцев."

 leviathans.111.e: "Это всё."

 colossus_victim: "Колоссальный гражданский кризис"
 colossus_victim_desc: "Травма национального масштаба, полученная в результате атаки колосса, нашла своё выражение в смене идеологических воззрений у широких слоёв населения."

 decision_make_holy_world: "Священная планета"
 decision_make_holy_world_desc: "Нам нужен неколонизированный §Y$pc_gaia$§! в пределах наших владений, чтобы объявить его священным. Пока смертные не оскверняют его, и он находится в наших границах, эта священная планета будет давать нам следующее: £unity£ §Y$country_base_unity_produces_mult$§! §G+10%§!."

 apoc.200.name: "Кандидат на статус священного мира"
 apoc.200.desc: "Несколько ясновидцев и экспертов по теологии независимо друг от друга подтвердили, что планета §Y[holy_target.GetName]§! в системе [holy_target.System.GetName&gen] достойна особого почитания.\n\nОфициальное признание обязательно повысит ценность этого мистического мира в глазах общественности."
 apoc.200.a: "Да [holy_target.GetName::будет <1> священным|||fem:будет <1> священной|||pl:будут <1> священными]."
 apoc.200.a.tooltip: "Добавить модификатор §Y$holy_player_planet$§!"

 apoc.201.name: "Не найден кандидат на статус священного мира"
 apoc.201.desc: "Наши лучшие ясновидцы опубликовали доклад, в котором сообщается о том, что среди планет нашего государства нет ни одного места духовной связи."
 apoc.201.a.tooltip: "Расход £influence£ влияния на указы возмещается."

 holy_player_planet: "Священный мир"
 holy_player_planet_desc: "Эта планета не осквернена разумной жизнью и считается священной."
 has_holy_player_planet: "Поклонение миру"
 has_holy_player_planet_desc: "Мы объявили необитаемый мир в наших границах священным местом."

 has_world_worship: "$TRIGGER_FAIL$§RНами уже определён§! §Y$holy_player_planet$§!"
 has_holy_world_candidate: "$TRIGGER_FAIL$§RВ наших границах нет неколонизированного §Yидеального мира§!§!"
 make_holy_world_effect: "Мы начинаем поиск подходящей планеты, чтобы сделать её священной."

 opinion_cracked_my_uninhabited_world: "Раскололи нашу незаселённую планету"
 opinion_cracked_an_uninhabited_world: "Раскололи незаселённую планету"
 opinion_worships_our_holy_world: "Почитают священный мир"

 action.91.name: "Восстановлен форпост!"
 action.91.desc: "Мы вернули контроль над системой §Y[Root.System.GetName&gen]§! и восстановили наш §Y$starbase_outpost$§! на орбите вокруг звезды."

 DAILY_PROGRESS: "Ежедневный прогресс: $VAL|Y$"
 SHIP_DESIGNER_NAME_USED: "§RЭто название уже занято для проекта корабля другого размера§!"
 DESIGN_IS_BUILDING: "§RСейчас строится корабль по этому проекту§!"
 DESIGN_BLOCKED_BY_AUTO_BUILD: "§RРучное проектирование кораблей невозможно, если включена функция автопроектирования.§!"
 SHIP_DESIGNER_NAME_USED_BY_ANOTHER_STARBASE: "§RНазвание этого проекта сейчас используется станцией $NAME|Y$§!"

 opinion_dead_captives: "Убитые пленники"

 vultaum_homeworld: "Родной мир вультаумцев"
 vultaum_homeworld_desc: "Древняя родина вультаумцев. Несмотря на то, что планета была разрушена, и жизнь здесь более невозможна, на её поверхности до сих пор можно найти руины огромных городов."
 vultaum_minerals: "Обломки орбитального комплекса"
 vultaum_minerals_desc: "Тысячелетия назад с этой планетой столкнулся какой-то орбитальный комплекс вультаумцев. Поверхность испещрена его обломками."
 vultaum_energy: "Аэростатное добывающее предприятие"
 vultaum_energy_desc: "Некогда на этом газовом гиганте размещалась целая сеть аэростатных заводов, на которых вультаумцы добывали гелий-3."
 yuht_homeworld: "Родной мир юутов"
 yuht_homeworld_desc: "На этой планете зародилась древняя цивилизация юутов. Орбитальные бомбардировки уничтожили почти все сооружения на поверхности, но под землёй до сих пор находятся заброшенные жилища, которые можно изучить."
 yuht_minerals: "Богатый пояс астероидов"
 yuht_minerals_desc: "Юуты активно использовали этот богатый пояс астероидов, и добываемые здесь минералы поддерживали медленную, но уверенную экспансию их межзвёздной империи."
 yuht_energy: "Солнечные коллекторы"
 yuht_energy_desc: "На орбите этого газового гиганта юуты некогда разместили солнечные коллекторы. Невероятно, но некоторые из этих древних устройств до сих пор работают."
 first_league_homeworld: "Столица Первой лиги"
 first_league_homeworld_desc: "Этот мавзолей планетарного масштаба некогда служил великолепным административным центром Первой лиги. Жизнь здесь больше невозможна, но повсюду можно найти развалины города, который занимал всю поверхность планеты."
 first_league_minerals: "Покинутые добывающие станции"
 first_league_minerals_desc: "Во времена расцвета Первой лиги этот пояс астероидов был плотно заселён. На тысячах их можно найти покинутые добывающие станции."
 first_league_energy: "Техническая платформа"
 first_league_energy_desc: "На этом газовом гиганте некогда размещались огромные технические платформы для обслуживания сотен тысяч грузовых кораблей торгового флота Первой лиги. Некоторые устройства для передачи энергии функционируют до сих пор."
 irassian_homeworld: "Родной мир ирассианцев"
 irassian_homeworld_desc: "Несмотря на последующие попытки стерилизовать поверхность посредством орбитальной бомбардировки, древняя родина ирассианцев до сих пор скрывает невероятное количество артефактов их развитой цивилизации."
 irassian_minerals: "Бывшее стояночное место"
 irassian_minerals_desc: "Некогда здесь располагалась большая стоянка ирассианского звёздного флота, обломки которой усеивают пространство вокруг планеты и падают на её поверхность, создавая богатые запасы минеральных ресурсов."
 irassian_energy: "Место производства энергии"
 irassian_energy_desc: "Этот газовый гигант служил основным местом выработки энергии для Ирассианского конкордата на ранней стадии его межзвёздной экспансии. Планету до сих пор опоясывает плотный слой древних орбитальных энергостанций."

