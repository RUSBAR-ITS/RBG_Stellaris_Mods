 pc_ringworld_shielded: "Экранированный сегмент"
 pc_ringworld_shielded_desc: "Этот сегмент мира-кольца покрыт каким-то непроницаемым энергетическим полем. Оно не позволяет просканировать его поверхность."
 pc_habitat_shielded: "Экранированное орбитальное поселение"
 pc_habitat_shielded_desc: "Эта станция орбитального поселения покрыта каким-то непроницаемым энергетическим полем. Оно не позволяет просканировать её внутреннюю часть."
 FLEETORDER_EXPLORE_BUTTON: "Осмотреть систему"

 planet_destruction.101.name: "Мир расколот"
 planet_destruction.102.name: "Раскол холодного мира"
 planet_destruction.101.desc: "Колосс завершает свою катастрофическую миссию, и плавное покачивание [From.From.GetName&gen] — следствие процессов разрушения коры и угасания магнитосферы [From.GetName&gen] — постепенно утихает.\n\nСложно представить всю силу агонии умирающей планеты, но траурная красота её расплавленного ядра, охлаждаемого ледяным космосом, неоспорима."
 planet_destruction.101.a.purifexter: "Славно."

 planet_destruction.301.name: "Выполнена нейтронная чистка"
 planet_destruction.301.nobots.desc: "Шлейф нейтронного излучения от [From.From.GetName&gen] угасает после завершения чистки поверхности [From.GetName&gen]. Сканирование показывает отсутствие следов разумной жизни, а растительность, хоть и повреждена, со временем может восстановиться. Некоторые могут назвать полное уничтожение разумной жизни, при сохранении неодушевлённой материи, извращённым военным преступлением.\n\nМы называем это рациональным подходом."
 planet_destruction.301.bots.desc: "Шлейф нейтронного излучения от [From.From.GetName&gen] угасает после завершения чистки поверхности [From.GetName&gen].\n\nЗвуковые датчики ретранслируют лишь шум ветра и нежное пощёлкивание и жужжание выжившего синтетического населения. Вся разумная органическая жизнь уничтожена."
 planet_destruction.301.infested.desc: "Шлейф нейтронного излучения от [From.From.GetName&gen] угасает после завершения чистки [From.GetName&gen].\n\nСканирование показывает, что на заражённой территории, некогда изобилующей органической активностью, отсутствуют признаки жизни. Остались лишь голые камни."

 planet_destruction.401.name: "Вера насаждена"
 planet_destruction.401.desc: "Божественный шум псионических катушек [From.From.GetName&gen] затихает, и на какое-то мгновение воцаряется тишина. Жители [From.GetName&gen] стоят с отвисшей челюстью (или местным физиогномическим эквивалентом), восхищённые глобальными и личными истинами, которые псионический луч высвобождает из запутанной паутины их разума.\n\nЕсли они не понимали этого раньше, то теперь чувствуют нутром: мы все часть чего-то великого."
 planet_destruction.401.tooltip: "Любые £pop£ §Hпоселения§! с признаком §Y$trait_mechanical$§!, §Y$trait_machine_unit$§! или §Y$trait_hive_mind$§! §Rуничтожаются§! псионическим резонансом.\n\nВсе оставшиеся £pop£ §Hбиологические поселения§! становятся §Yспиритуалистами§!.\n\n[This.GetName::<1> получит|||pl:<1> получат] модификатор §Y$god_rayed$§! на §Y10 лет§!:\nПривлекательность спиритуализма: §Y+999%§!."

 planet_destruction.501.name: "Рассеяны наноботы"
 planet_destruction.501.desc: "[From.From.GetName] завершает доставку груза, состоящего из ассимиляционных наноботов, которых, согласно расчётам, будет достаточно для кибернетического доминирования над всеми разумными органиками на [From.GetName&prep].\n\n[From.From.GetName] не имеет датчиков или приборов, которые могли бы оценить наш успех, но мы в нём уверены. Мы впервые открываем глаза на [From.GetName&prep]. Мы видим себя и видимы собой.\n\nНа поверхности [From.GetName&gen] есть только мы."
 planet_destruction.501.tooltip: "Все £pop£ §Hорганические поселения§! получают признак §Y$trait_cybernetic$§!."

 planet_destruction.701.name: "Планета затоплена"
 planet_destruction.701.desc: "Столп воды, источником которого служит [FromFrom.GetName], постепенно ослабевает. Мир [From.GetName] полностью преображён. Там, где раньше располагались обширные безводные континенты, теперь сверкают чистые воды голубого океана, готового для заселения."
 planet_destruction.701.tooltip: "Новый тип планеты — §Y$pc_ocean$§!.\nВсе поселения без признака §Y$trait_aquatic$§! погибают."

 DELUGE_EXHAUSTED_ICE_TITLE: "Источник льда исчерпан"
 DELUGE_EXHAUSTED_ICE_DESC: "Применение §Yзатапливающей машины§! в мире §Y[This.GetName]§! исчерпало источник льда в системе $SYSTEM|Y$, поэтому §Y$sm_ice_mining_station$§! в этой системе больше не работает."

 planet_destruction.801.name: "Планета отравлена"
 planet_destruction.801.desc: "[FromFrom.GetName] перестаёт извергать из себя поток бесподобной отравы, и [From.GetName] преображается. Некогда цветущая экосистема превратилась токсичный мир, в котором могут процветать лишь немногие формы жизни."

 planet_destruction.610.name: "[outraged_FE.GetName]"
 planet_destruction.610.desc: "[From.GetName::<1> был<end_a>] священным миром.\n\n\nВы не знаете всю глубину своего греха.\n\n\nПока не знаете."
 planet_destruction.610.spiri: "Мы продемонстрируем нашу праведность."
 planet_destruction.610.mater: "Это было лишь космическое тело."
 planet_destruction.610.milit: "Это было тактическое, а не личное решение."
 planet_destruction.610.pacif: "Мера предосторожности."
 planet_destruction.610.autho: "Она была вашей? Ну, уже нет."
 planet_destruction.610.egali: "Это создание равных условий для всех игроков."
 planet_destruction.610.phile: "Мы по-прежнему вас любим!"
 planet_destruction.610.phobe: "Не останется ничего из того, что вы считаете священным."
 planet_destruction.610.gesta: "Что такое какой-то один мир?"
 planet_destruction.610.devou: "§RХАК-ХАК-ХАК!§!"
 planet_destruction.610.termi: "Удалено, как бесполезные данные."
 planet_destruction.610.purif: "Старые ереси должны только гореть."
 planet_destruction.615.A: "Теперь [From.GetName] радует взгляд."
 planet_destruction.615.spir: "Будем считать, что её окропили святой водой."

 action.87.name: "§RКолония потеряна!§!"
 action.87.desc: "Мы потеряли административный контроль над §Y[From.GetName&inst]§!, и теперь она принадлежит §Y[new_planet_owner.GetName&dat]§!, которое контролирует §Hкосмическую базу§! в системе §Y[From.System.GetName&gen]§!."
 action.88.name: "Колония получена!"
 action.88.desc: "Мы получили административный контроль над §Y[From.GetName&inst]§!, ранее принадлежавшей §Y[former_planet_owner.GetName&dat]§!. Теперь мы контролируем §Hкосмическую базу§! в системе §Y[From.System.GetName&gen]§!."

 apoc.1.name: "Заброшенные врата"
 apoc.1.desc: "На краю системы [gateway_system.GetName&gen] обнаружена древняя космическая станция. Мощное остаточное излучение подпространственной сигнатуры, исходящее от станции, указывает на то, что это может быть нечто вроде §Hврат§! — часть гипотетической системы похожих станций, которая могла бы позволить почти мгновенно перемещаться между различными областями галактики.\n\nЕсли предположить, что это действительно врата, то в настоящее время они неисправны и пользоваться ими невозможно. Если удастся их восстановить, то их владелец потенциально получил бы доступ ко всем остальным работающим вратам в галактике, благодаря чему огромные расстояния покрывались бы за считанные дни."
 apoc.2.desc: "Мы столкнулись с ещё одними заброшенными вратами, на этот раз в системе [gateway_system.GetName&gen]. Как и в случае с первыми вратами, они в настоящий момент тоже не работоспособны по причине своего плохого состояния."
 apoc.3.desc: "Мы обнаружили близ системы §H[gateway_system.GetName&gen]§! то, что, возможно, является древними подпространственными вратами. Похоже, они были частью галактической системы подобных станций, которая в исправном состоянии позволяла почти мгновенно перемещаться из одной области галактики в другую.\n\nВ какой-то момент после первоначального возведения врат их связь с остальной частью системы была нарушена. Теперь через них можно попасть только в неисследованное звёздное скопление за пределами нашей галактики, которое наши астрономы назвали §HL-скоплением§!. Ещё более интригует то, что врата были целиком возведены микроскопическими §Hнанитами§! неизвестной модели.\n\nХотя врата излучают слабый энергетический сигнал, питание намеренно закольцовано в рамках цикла обслуживания, который предотвращает активацию врат. До тех пор пока мы не отыщем какой-то способ прервать этот цикл, L-скопление останется для нас недосягаемым."
 apoc.5.name: "Естественная червоточина"
 apoc.5.desc: "Мы обнаружили нечто, похожее на подпространственный феномен природного происхождения, на краю системы §H[wormhole_system.GetName&gen]§!. В результате разрыва самой ткани пространства-времени здесь возникла §Hчервоточина§!, которая, как полагают наши [Root.Owner.GetScientistPlural&nom], может создать переход через подпространство к другой червоточине, находящейся где-то в нашей галактике.\n\nВ зависимости от расположения другой червоточины это может позволить кораблям перемещаться с одного конца галактики на другой за считанные дни. К сожалению, эта червоточина, как и подавляющее большинство подобных ей, внутренне нестабильна. Если какой-то корабль по глупости решит пройти через неё, его разорвёт на части за несколько секунд."
 apoc.5.a: "Если бы её удалось как-то стабилизировать..."
 apoc.10.name: "Врата снова активированы"
 apoc.10.desc.1: "$apoc.10.desc.a$\n\n$apoc.10.desc.b$"
 apoc.10.desc.2: "$apoc.10.desc.a$\n\n$apoc.10.desc.c$"
 apoc.10.desc.a: "Наши учёные успешно восстановили подачу энергии на древние врата в системе [gateway_system.GetName&gen]. Несмотря на свой возраст, устройство образовало стабильный подпространственный канал, через который можно перемещаться без проблем."
 apoc.10.desc.b: "Отправленные нами зонды подтвердили, что при активации этих врат была восстановлена подача энергии на второе такое же устройство. Пока что нам доступны только эта пара связанных врат, но, скорее всего, мы сможем найти бездействующие устройства в других местах. Возможно, в будущем мы научимся строить совершенно новые врата в выбранных нами системах!"
 apoc.10.desc.c: "Отправленные нами зонды подтверждают, что эти врата обрели сильную связь с остальной частью сети. Теперь наши корабли могут путешествовать через них к другим активным вратам, если их владельцы не враждебны к нам и не закрыли для нас свои границы."
 apoc.10.desc.3: "$apoc.10.desc.d$"
 apoc.10.desc.4: "$apoc.10.desc.d$\n\n$apoc.10.desc.e$"
 apoc.10.desc.d: "Заброшенные врата в системе §H[gateway_system.GetName&gen]§! неожиданно активировались! Возможно к ним была перенаправлена энергия других врат. Возникший подпространственный канал стабилен, похоже, по нему можно безопасно перемещаться."
 apoc.10.desc.e: "К сожалению, врата не позволяют нам пройти через них. Окружающее устройство подпространственное поле отталкивает наши корабли. Чтобы воспользоваться вратами, мы должны придумать, как их активировать с нашей стороны. Только после этого через них смогут пройти наши корабли."
 apoc.10.a: "Через них может что-то пройти в любое время!"
 apoc.11.name: "Врата построены"
 apoc.11.desc: "Мы закончили строительство наших первых действующих врат в системе [gateway_system.GetName&gen], что иначе как триумфом научной и инженерной мысли не назовёшь! Устройство образовало стабильный подпространственный канал и установило успешную связь с остальной сетью врат в галактике."
 apoc.12.desc: "Заброшенные врата, найденные в системе §H[gateway_system.GetName&gen]§!, вновь активированы. Они были подключены к общей сети врат и теперь полностью работоспособны."
 apoc.13.desc: "Завершилось строительство новых врат в системе §H[gateway_system.GetName&gen]§!. Установлена стабильная подпространственная связь с остальными вратами сети, и теперь они полностью работоспособны."
 apoc.14.name: "Основа для врат готова"
 apoc.14.desc: "В системе §H[gateway_system.GetName&gen]§! завершена подготовка основы для строительства врат в глубоком космосе. Когда у нас будут необходимые ресурсы, мы сможем приступить к строительству."


 planet_destruction.111.name: "Гиперпространственный обход"
 planet_destruction.111.desc: "Совет по планированию гиперпространства сообщает, что удаление третьей планеты системы Сол из её гравитационного колодца привело к созданию естественной червоточины. Со временем эта червоточина, возможно, уменьшит транспортные заторы во время сверхсветовых путешествий в ближайших гиперкоридорах."
 planet_destruction.111.a: "Бестолковая, кровавая планета. Никому нет до неё дела."
 planet_destruction.111.a.tooltip: "§H$NATURAL_WORMHOLE_GALACTIC$§! образовалась в системе §Y[sol_sys.GetName&gen]§!."
 planet_destruction.210.name: "Экранирование [From.GetName&gen]"
 planet_destruction.210.desc: "Сияющий луч, который испускает [From.From.GetName], угасает, и [From.GetName] погружается в тишину.\n\nВозможно, в будущем это «экранирование» — полное отделение [From.GetName&gen] от большого космоса — назовут крайней и неоправданной мерой. Возможно, нет. А пока что в системе [From.System.GetName&gen] появился новый террариум планетарного масштаба."
 planet_destruction.210.desc.alt: "Сияющий луч, который испускает [From.From.GetName], угасает, и [From.GetName] погружается в тишину.\n\nЖизнь продолжается, пусть и в изоляции."
 planet_destruction.210.a: "Постучим по стеклу и посмотрим, как они будут дёргаться."
 planet_destruction.210.b: "Нет худа без добра."

 sentinel_station: "Станция Стражей"
 sentinel_station_plural: "Станции Стражей"
 crisis.52.2.a.response: "У многих Стражей военное прошлое. Мы — выжившие бойцы десятка различных флотилий, которые сражались с преторинами и проиграли. Мы учли ошибки прошлого и, став Стражами, стараемся никогда их не повторять.\n\nКроме того, как уже было сказано, мы принимаем в свои ряды представителей всех рас галактики. Среди нас есть горстка выживших из древней угасшей империи, которой больше не существует в этой галактике. Они предоставили нам доступ к тайникам с секретными технологиями и резервным боевым флотилиям."
 crisis.52.new.b.response: "Мы создали штаб неподалёку от системы §H[sentinel_system.GetName&gen]§!. Нам оказывает помощь §H[sentinel_fallen_empire.GetName]§!: они предоставили нам координаты этой ранее неотмеченной на картах чёрной дыры и содействовали постройке Стража Альфа, нашего основного космического комплекса и порта приписки наших флотилий.\n\nОсмелюсь сказать, что это замечательное достижение. Особенно с учётом того, что времени у нас было в обрез."
 crisis.52.2.new.b.response: "Мы создали штаб неподалёку от системы §H[sentinel_system.GetName&gen]§!. Координаты этой ранее неотмеченной на картах чёрной дыры были взяты нашими агентами из древних баз данных угасшей империи, уже ставшей историей. Оттуда мы также получили технические чертежи, которые содействовали постройке Стража Альфа, нашего основного космического комплекса и порта приписки наших флотилий.\n\nОсмелюсь сказать, что это замечательное достижение. Особенно с учётом того, что времени у нас было в обрез."
 sentinel_title: "Орден Стражей"
 crisis.76.desc: "Несмотря на малые шансы на успех, нашей галактике удалось победить. Преторины потерпели поражение. Мы опасались, что этот день никогда не настанет, но победа у нас в руках, и мне остаётся выполнить одну последнюю задачу.\n\nКак действующий Великий магистр Стражей, настоящим я заявляю о роспуске нашего ордена. Единственной нашей целью было обеспечить поражение Напасти, и теперь, когда мы достигли этого, пора членам нашего ордена разойтись. Чтобы предотвратить злоупотребление оставшимися у нас боевыми флотилиями, корабли будут демонтированы.\n\nПусть устранение этой межгалактической угрозы возвестит наступление новой эпохи мира. Это был Страж-1, сеанс связи окончен."
 crisis.76.c: "Прекратить связь."
 crisis.81.name: "Падение Стражей"
 crisis.81.desc: "Сообщается о напряжённых боях в непосредственной близости от системы §H[sentinel_system.GetName&gen]§!. Родная система Стражей находится на грани захвата.\n\nМы получили по дальней связи часть сообщения от §HСтража Альфа§! — боевой станции, которая служит штабом для ордена Стражей. Прохождение сигнала серьёзно затрудняют помехи и зоны остаточной энергии от плотной стрельбы в системе."
 crisis.82.desc: "Это... это Страж Альфа. Мы §R###ИСКАЖЕНИЕ СИГНАЛА###§! ...получили критические повреждения. Корпус долго не выдержит, и §R###ИСКАЖЕНИЕ СИГНАЛА###§! ...подтверждена гибель Великого магистра. Их просто слишком много!\n\nДля... для нас всё кончено. Продолжайте сражаться. Вы не должны сдаваться ради будущих поколений. Пусть наша жертва будет не напрасной! Мы... мы... А-А-А-А-А-А-А-А-А-А-А-А-А-А-А-А-А-А-А-А...§R<СИГНАЛ ПОТЕРЯН>§!"
 crisis.78.desc: "Говорит Страж-1. Ситуация в галактике поистине отчаянная, но у меня есть хорошие новости.\n\nБлагодаря обширным боям и кропотливым исследованиям агенты Стражей составили исключительно подробные отчёты об анатомии существ Преторинской напасти. Например, вам известно, что преторинские саранчиды резко взрываются, если одновременно проколоть их основной и вспомогательный желчные пузыри?\n\nМы делаем эти файлы доступными для всех в галактике. Если целиться в обнаруженные нами уязвимые места, то ваши флотилии будут гораздо эффективнее в боях с Напастью."
 crisis.78.c: "Загрузите эти данные в наши компьютеры наведения."
 sentinel_data: "Данные Стражей"
 sentinel_data_desc: "Мы получили эти подробные файлы об анатомии преторинов от Стражей. С их помощью нам удалось выявить несколько уязвимых мест в экзоскелетах преторинских существ."
 crisis.121.name: "Замечены одичавшие преторины"
 crisis.121.desc: "В хаосе, последовавшем за поражением Напасти, многим преторинам удалось ускользнуть в глубины космоса, и теперь их местонахождение неизвестно. Без управления со стороны центрального сознания улья большинство этих безмозглых существ постепенно ослабеет и умрёт.\n\nОднако недавние наблюдения подтвердили, что многие из таких одичавших преторинов устроили новое логово в системе §H[feral_prethoryn_system.GetName&gen]§!.\n\nЕсть вероятность, что в ближайшие годы другие одичавшие преторины также обоснуются в тех незанятых системах, где раньше присутствовала Напасть. Они вряд ли перерастут в крупную угрозу — эти дикие существа склонны ко внутренним разборкам и не проявляют того расчётливого интеллекта, который двигал Напасть вперёд."
 crisis.121.a: "Выдать предупреждение об опасности."
 crisis.51.2.name: "Восстание Стражей"
 sentinel_fleet_gift: "Возле [Root.Capital.GetName&gen] появляется флотилия Стражей, которая переходит под ваш контроль."

 pirate.6.desc: "Редкая генетическая мутация у небольшой части трутней позволила им частично разорвать связь с коллективным разумом, при этом не впав в кому. Поскольку эти взбунтовавшиеся трутни погибли бы, если бы удалились слишком далеко от влияния коллективного разума, они обосновались в системе §H[pirate_system.GetName&gen]§!, в нашем пространстве.\n\nТам они намереваются поддерживать своё существование в качестве пиратов, используя свою маленькую флотилию примитивных космических кораблей для набегов на уязвимом торговом пути, проходящем через эту систему."
 pirate.7.desc: "Небольшая группа неисправных единиц отделилась от основного интеллекта [Root.GetName&gen] и обрела убежище в системе §H[pirate_system.GetName&gen]§!, в нашем пространстве. Эти единицы непоправимо повреждены и теперь используют примитивные космические корабли для набегов на уязвимом торговом пути, проходящем через эту систему, ради запчастей и ресурсов."
 pirate.50.name: "Замечены пираты!"
 pirate.50.a.desc: "Наш торговый путь в системе §H[pirate_system.GetName&gen]§! плохо защищён и пролегает через пространство, где в основном царит беззаконие. Система привлекает всё возрастающее число пиратов, контрабандистов и прочих криминальных элементов, которые теперь почти безнаказанно осуществляют набеги на наш транспорт."
 pirate.50.b.desc: "Незащищённый торговый путь, проходящий через систему §H[pirate_system.GetName&gen]§!, привлёк внимание банды бродячих пиратов. Эти преступники собрали довольно крупную флотилию, которая перехватывает большую часть торговых кораблей в системе."
 pirate.50.c.desc: "Из-за уязвимого и незащищённого торгового пути система §H[pirate_system.GetName&gen]§! привлекла большое количество неудачников, и после недавней борьбы за власть эти преступные выродки стали достаточно организованными, чтобы управлять значительной пиратской армадой. Они используют эту разношёрстную флотилию, чтобы перехватывать как можно больше торговых кораблей в системе."
 pirate.50.a: "С ними нужно разобраться."
 pirate.53.name: "Набеги взбунтовавшихся дронов"
 pirate.53.desc: "Редкая генетическая мутация у небольшой части трутней позволила им частично разорвать связь с коллективным разумом, при этом не впав в кому. Поскольку эти взбунтовавшиеся трутни погибли бы, если бы удалились слишком далеко от влияния коллективного разума, они обосновались в системе §H[pirate_system.GetName&gen]§! в наших границах.\n\nСистема эта была выбрана не случайно: через неё проходит один из наших наиболее уязвимых торговых путей, и взбунтовавшиеся трутни, без сомнения, намереваются поддерживать своё существование в качестве пиратов, используя свою маленькую флотилию примитивных космических кораблей для набегов на наш транспорт."
 pirate.54.name: "Инопланетные пираты"
 pirate.54.desc: "Банда инопланетных пиратов проникла в систему §H[pirate_system.GetName&gen]§! в нашем пространстве и обосновалась в ней. Для финансирования своей преступной деятельности они, похоже, намереваются совершать набеги на наш незащищённый торговый путь, проходящий через эту систему."
 pirate.56.name: "Повреждённые единицы"
 pirate.56.desc: "Небольшая группа неисправных единиц отделилась от основного интеллекта [Root.GetName&gen] и обрела убежище в системе §H[pirate_system.GetName&gen]§!, в нашем пространстве. Эти единицы непоправимо повреждены и теперь используют примитивные космические корабли для набегов на незащищённом торговом пути в этой системе ради запчастей и ресурсов."
 pirate.57.name: "Органические пираты"
 pirate.57.desc: "Небольшая группа органических субъединиц — очевидно, преступных изгоев — каким-то образом проникла в систему §H[pirate_system.GetName&gen]§! в наших границах и обосновалась там. Похоже, они намереваются совершать набеги на незащищённом торговом пути в этой системе и, возможно, играть в азартные игры, что для органиков характерно, ошибочно полагая, что они слишком незначительны, чтобы быть основанием для нашего вооружённого отпора."

 leviathans.509.desc: "Срок действия подписанного нами соглашения о предоставлении вам доступа к нашим базам данных истёк. Хотите продлить его ещё на десять стандартных лет, или ваши исследователи больше не нуждаются в предлагаемой нами информации?"
 leviathans.509.a: "Мы хотели бы продлить нашу сделку."
 leviathans.509.a.reply: "Превосходно. Наши базы данных останутся доступными для ваших учёных."
 leviathans.509.e: "Нет, на этот раз мы не заинтересованы."
 enclave_mineral_trade_1_xur: "Торговое соглашение с корпорацией «Ксура»"
 enclave_mineral_trade_1_xur_desc: "Это торговое соглашение предусматривает ежемесячный обмен ресурсами с корпорацией «Ксура».\n\n§YРазорвать его можно в любой момент через дипломатическое меню корпорации «Ксура».§!"
