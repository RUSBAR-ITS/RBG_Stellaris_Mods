 action.82.name: "Бомбардировка [From.GetName&gen]"
 action.82.desc: "Флотилия §H[From.From.GetName&gen]§! уничтожила население §H[From.GetName&gen]§!! В результате массированной и безжалостной бомбардировки все населённые пункты были методично стёрты с лица планеты, и она превратилась в облучённую пустошь, едва ли пригодную для жизни."
 action.82.a: "Мы должны отомстить за такую жестокость!"
 action.83.desc: "Наши силы докладывают о завершении орбитальной бомбардировки §H[From.GetName&gen]§!. Все населённые пункты были методично ликвидированы, и теперь облучённая [From.GetPlanetMoon_rinfix&nom] пригодна для жизни лишь минимально."
 bombed_to_tomb_world: "§Y[From.GetName::<1> становится|||pl:<1> становятся] опустошённым миром без населения.§!"

 god_rayed: "Божественный свет"
 god_rayed_desc: "Воздействие Божественной длани сохраняется в атмосфере, почве, местной флоре и фауне."
 uneasy_faith: "Бремя веры"
 uneasy_faith_desc: "Население в какой-то степени осознаёт, что источник их религиозного пыла находится не только в них самих."
 neutron_bombarded: "Нейтронная бомбардировка"
 neutron_bombarded_desc: "Экосистема планеты до сих пор восстанавливается от разрушительного воздействия нейтронного чистильщика."

