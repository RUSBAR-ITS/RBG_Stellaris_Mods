 apoc.100.name: "Проект «Колосс»"
 apoc.100.desc: "$COLOSSUS_PROJECT_DESC$"
 apoc.100.desc.pacif: "Теория сдерживания снова вошла в моду среди политологов на [Root.Capital.GetName&prep], и проект «Колосс» позиционируется как абсолютное средство достижения этой цели — оружие, которое превзойдёт даже корабли класса титан. Хотя предлагаемые колоссы будут оснащены таким количеством боеприпасов, что смогут полностью уничтожать планеты, мы будем использовать их для менее жестокого — но, тем не менее, ужасающе необратимого — метода разрешения конфликтов.\n\nЕсли гипотетический враг не прекратит свою агрессию по отношению к нам или нашим союзникам, мы должны просто §Rего заставить§!."
 apoc.100.desc.milit: "Проект «Колосс», о котором прежде говорили приглушённым тоном, а ещё раньше — только шёпотом в самых запутанных коридорах объектов опытного военного производства, теперь официально утверждён. Представляя собой, возможно, величайшую военную инновацию в истории галактики, он предусматривает разработку оружия класса §RУбийца планет§! и конфигурацию корпуса колосса для него. Колоссам, скорее всего, потребуются корабли сопровождения, так как проектные требования оружия класса «Убийца планет» не допускают установку какого-либо другого вооружения.\n\nТем не менее, после завершения разработки проект «Колосс» обещает стать, возможно, самой разрушительной силой в галактике."
 apoc.100.desc.phobe: "Проект «Колосс» считается самым важным достижением в продолжительной борьбе против презренных чужаков, заполонивших галактику. Корабль колосс, в соответствии с проектом, представляет собой гигантский тяжелобронированный каркас, оснащённый только оружием класса §RУбийца планет§!. Его способность полностью очищать галактику от планет, которые не пожелают нам покориться, будет просто бесценной для нас, так как до ликвидации ксеноугрозы ещё далеко."
 apoc.100.desc.purif: "Мы предадим миры еретиков огню и мечу, а пепел развеем по всей галактике."
 apoc.100.desc.termi: "Атмосфера, климат, гравитация — это удобства, но по-настоящему они необходимы только жалким кускам мяса.\n\nСмерть планетам — смерть органикам."
 apoc.100.a: "Принято."
 apoc.110.name: "Пистолет, направленный в голову вселенной"
 apoc.110.desc: "Ведущие учёные во всех мыслимых отраслях науки предоставили свои окончательные предложения по оружию класса §RУбийца планет§!, которым будут оснащены наши первые корабли типа «Колосс». Мы можем выбрать одно из этих предложений для разработки на конечных этапах проекта «Колосс»."
 apoc.110.desc.machine: "Резервные рабочие циклы были оценены и признаны достаточными для разработки §Yодного§! орудия класса §RУбийца планет§! к моменту завершения §Gпроекта «Колосс»§!.\n\nНеобходимо установление приоритетов."
 apoc.110.desc.hive: "Мы исследовали множество возможностей, и теперь нам ясно, что мы можем разработать подходящее орудие класса §RУбийца планет§! для наших самых первых кораблей типа «Колосс». Другие направления можно будет рассмотреть позже, а пока мы можем сосредоточиться на разработке только одного такого оружия на конечных этапах проекта «Колосс»."
 apoc.110.cracker.tooltip: "§RОрудие класса «Убийца планет»§!:\n§L$PLANET_KILLER_CRACKER_DESC$§!"
 apoc.110.shielder.tooltip: "§RОрудие класса «Убийца планет»§!:\n§L$PLANET_KILLER_SHIELDER_DESC$§!"
 apoc.110.neutron.tooltip: "§RОрудие класса «Убийца планет»§!:\n§L$PLANET_KILLER_NEUTRON_DESC$§!"
 apoc.110.godray.tooltip: "§RОрудие класса «Убийца планет»§!:\n§L$PLANET_KILLER_GODRAY_DESC$§!"
 apoc.110.nanobots.tooltip: "§RОрудие класса «Убийца планет»§!:\n§L$PLANET_KILLER_NANOBOTS_DESC$§!"
 apoc.110.devolution.tooltip: "§RОрудие класса «Убийца планет»§!:\n§L$PLANET_KILLER_DEVOLUTION_DESC$§!"
 apoc.110.smelter.tooltip: "§RОрудие класса «Убийца планет»§!:\n§L$PLANET_KILLER_SMELTER_DESC$§!"
 apoc.120.name: "Проект «Колосс» завершён"
 apoc.120.desc: "$apoc.120.part.p1$"
 apoc.120.desc.milit: "$apoc.120.part.p1$ $apoc.120.part.milit$"
 apoc.120.desc.pacif: "$apoc.120.part.p1$ $apoc.120.part.pacif$"
 apoc.120.desc.phobe: "$apoc.120.part.p1$ $apoc.120.part.phobe$"
 apoc.120.desc.mater: "$apoc.120.part.p1$ $apoc.120.part.mater$"
 apoc.120.part.p1: "Проект «Колосс» — монументальная задача по разработке самой крупной оружейной платформы в истории [Root.GetAdj&fem,gen] расы и её оснащения установкой §R[Root.Get1stPlanetKiller]§! — дал хорошие результаты и близок к завершению."
 apoc.120.part.milit: "Хотя первый колосс ещё не построен, но этот момент является поворотным в истории [Root.GetName&gen]."
 apoc.120.part.pacif: "Будем надеяться, что ничего из этого не выйдет."
 apoc.120.part.phobe: "Пусть чужаки трепещут, узрев нашу силу и изобретательность."
 apoc.120.part.mater: "Это всегда будет свидетельством [Root.GetAdj&pl,gen] инноваций."
 apoc.120.desc.machine: "Проект «Колосс» завершён.\n\nДоступен новый тип корабля: §GКолосс§!\n\nДоступен новый компонент вооружения: §R[Root.Get1stPlanetKiller]§!"
 apoc.120.desc.hive: "Мы полностью сформировали концепцию конфигурации колосса, которая теперь готова к сборке. Однако мы с некоторым беспокойством осознаём, что §R[Root.Get1stPlanetKiller]§! тоже станет явью."
 apoc.120.a: "Бабах!"
 apoc.120.a.pacif: "Крайнее средство."
 apoc.120.a.gesta: "Принято."
 apoc.130.name: "[From.GetName] завершает проект «Колосс»"
 apoc.130.desc: "До нас дошли слухи, что [From.GetName::<1> разработал<end_a>] спецификации для корабля типа «Колосс» — оружейной платформы, которая потенциально способна полностью уничтожать целые планеты."
 apoc.130.a.weaker: "Это вызывает тревогу."
 apoc.130.a.stronger: "Внезапно соперник."
 apoc.130.a.pacif: "Отвратительно."

