 sacrifice_harmony_5: "$edict_sacrifice_harmony$"
 sacrifice_harmony_5_desc: "$sacrifice_harmony_mod_desc$"
 sacrifice_harmony_mod_overlord: "$edict_sacrifice_harmony$"
 sacrifice_harmony_mod_overlord_desc: "Наш сюзерен провёл странный, но в то же время гармоничный ритуал. Часть наших граждан принесли в жертву, но остальные чувствуют себя как никогда живыми."

 edict_sacrifice_bounty: "Жертвоприношение: Изобилие"
 edict_sacrifice_bounty_desc: "Самые преданные среди нас готовы встретить свою судьбу, уверенные, что их жертва станет залогом нашего благополучия. Пусть смерть расчистит дорогу для кипящей жизни, славной в самой своей сути!"
 edict_sacrifice_bounty_tooltip: "§RУмрут все [mortal_initiate.GetIcon] [mortal_initiate.GetNamePlural].§! Каждая жертва повышает вероятность увеличить производство £minerals£ минералов и £energy£ энергии. $edict_sacrifice_unity_boost$"
 sacrifice_bounty_mod: "Дополнительное жертвоприношение: Изобилие"
 sacrifice_bounty_mod_desc: "Самые преданные среди нас встретили свою судьбу, и их жертва стала залогом нашего благополучия. Пусть смерть расчистит дорогу для кипящей жизни, славной в самой своей сути!"
 sacrifice_bounty_1: "$edict_sacrifice_bounty$"
 sacrifice_bounty_1_desc: "$sacrifice_bounty_mod_desc$"
 sacrifice_bounty_2: "$edict_sacrifice_bounty$"
 sacrifice_bounty_2_desc: "$sacrifice_bounty_mod_desc$"
 sacrifice_bounty_3: "$edict_sacrifice_bounty$"
 sacrifice_bounty_3_desc: "$sacrifice_bounty_mod_desc$"
 sacrifice_bounty_4: "$edict_sacrifice_bounty$"
