 sacrifice_togetherness_mod_overlord: "$edict_sacrifice_togetherness$"
 sacrifice_togetherness_mod_overlord_desc: "Сюзерен провёл странный, но в то же время захватывающий ритуал. Некоторых из наших граждан принесли в жертву, но мы ощущаем непривычное единение."

 edict_sacrifice_harmony: "Жертвоприношение: Гармония"
 edict_sacrifice_harmony_desc: "Самые преданные среди нас готовы встретить свою судьбу. Их жертва — это время радостного прославления смысла нашего существования. Каждый день, что прожили жертвы, посвящён благоденствию нашей расы."
 edict_sacrifice_harmony_tooltip: "§RУмрут все [mortal_initiate.GetIcon] [mortal_initiate.GetNamePlural].§! Каждая жертва увеличивает вероятность получить дополнительный прирост счастья поселений. $edict_sacrifice_unity_boost$"
 sacrifice_harmony_mod: "Дополнительное жертвоприношение: Гармония"
 sacrifice_harmony_mod_desc: "Самые преданные среди встретили свою судьбу. Их жертва укрепит нашу гармонию. Каждый день, что прожили жертвы, посвящён благоденствию нашей расы."
