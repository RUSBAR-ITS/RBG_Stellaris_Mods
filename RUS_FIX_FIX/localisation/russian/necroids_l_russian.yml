 trait_necrophage: "Некрофаг"
 trait_necrophage_desc: "§LЭта раса практически бессмертных существ размножается, поглощая поселения других видов.§!"
 trait_necrophage_gestalt_tooltip: "§PМодификаторы продуктивности поселения не влияют на поселения с коллективным разумом.§!"
 building_necrophage_elevation_chamber: "Камера вознесения"
 building_necrophage_elevation_chamber_desc: "Ожидающие трансформации проводят свои дни в камере вознесения за изучением обрядов и ритуалов, которые практикуют [This.Owner.GetSpeciesNamePlural]."
 building_necrophage_elevation_chamber_desc_hive: "Ожидающие трансформации проводят свои дни в камере вознесения, готовясь к объединению с [This.Owner.GetAdj&masc,inst] коллективным сознанием."
 disables_necrophage_growth: "§PЭто £building£ сооружение препятствует росту поселений §Yнекрофагов§!!§!"
 necrophage_elevation_timer_tooltip: "Следующая церемония вознесения на §Y[This.GetName&prep]§! состоится §Y[This.necrophage_elevation_timer]§!.\n\n"
 building_necrophage_elevation_chamber_scaling_tooltip: "Чтобы [necro_apprentice.GetIcon] [necro_apprentice.GetNamePlural] не заканчивались, количество должностей меняется от §Y100§! до §Y300§! в зависимости от §Yроста поселений§!.\n\n"
 building_necrophage_house_of_apotheosis: "Дом апофеоза"
 building_necrophage_house_of_apotheosis_desc: "Строение, где будущие [This.Owner.GetSpeciesNamePlural] могут провести последние дни в своём изначальном виде в окружении немыслимой роскоши."
 building_necrophage_house_of_apotheosis_desc_hive: "Строение, где будущие [This.Owner.GetAdj&pl] единицы могут провести свои последние дни вне улья в окружении немыслимой роскоши, как мы её понимаем."
 job_necro_apprentice_effect_desc_base: "Раз в §Y10§! лет в ходе §Yритуала вознесения§! [necro_apprentice.GetIcon] [necro_apprentice.GetNamePlural] трансформируются, возрождаясь как §Y[This.Owner.GetSpeciesNamePlural]§!."
 job_necro_apprentice_effect_desc: "[necro_apprentice.GetIcon] [necro_apprentice.GetNamePlural] превращают $r_consumer_goods_acc$ и $r_food_acc$ в $r_unity_acc$ и $r_amenities_acc$.\n$job_necro_apprentice_effect_desc_base$"
 job_necro_apprentice_effect_lithoid_desc: "[necro_apprentice.GetIcon] [necro_apprentice.GetNamePlural] превращают $r_consumer_goods_acc$ и $r_minerals_acc$ в $r_unity_acc$ и $r_amenities_acc$.\n$job_necro_apprentice_effect_desc_base$"
 job_necro_apprentice_effect_hive_desc: "[necro_apprentice.GetIcon] [necro_apprentice.GetNamePlural] превращают $r_food_acc$ в $r_unity_acc$ и $r_amenities_acc$.\n$job_necro_apprentice_effect_desc_base$"
 job_necro_apprentice_effect_hive_lithoid_desc: "[necro_apprentice.GetIcon] [necro_apprentice.GetNamePlural] превращают $r_minerals_acc$ в $r_unity_acc$ и $r_amenities_acc$.\n$job_necro_apprentice_effect_desc_base$"
 NO_CULTURE_SHOCK: "$TRIGGER_FAIL$§RПланета не испытывает §Y$culture_shock_bronze_age$§!§!"
 job_necro_apprentice: "Некрофит"
 job_necro_apprentice_plural: "Некрофиты"
 job_necro_apprentice_plural_with_icon: "[necro_apprentice.GetIcon] [necro_apprentice.GetNamePlural]"
 job_necro_apprentice_desc: "После долгих лет упорной работы, предваряющей пышный §Yритуал вознесения§!, те несчастные, что были рождены вне высшей касты, наконец-то смогут стать частью элиты."
 job_necro_apprentice_desc_hive: "После долгих лет упорной работы те несчастные, что были рождены вне нашего коллективного сознания, смогут пройти церемонию единения. [Owner.GetGovernmentName] и весь [Owner.GetSpeciesAdj&masc] народ счастливы стать одним целым с ним."
 NECRO_APPRENTICE_JOB_TRIGGER: "Эту должность могут занимать только поселения, которые не являются роботами или представителями доминирующей расы."
 mod_job_necro_apprentice_add: "Должности [necro_apprentice_rinfix.GetName]"
 mod_job_necro_apprentice_per_pop: "§G+1§! должность [necro_apprentice_rinfix.GetName] за каждые $VALUE$ поселений"
 mod_job_necro_apprentice_per_pop_short: "\n§G+1§! £mod_job_necro_apprentice_add£ за каждые $VALUE$ £pop£"
 planet_necro_apprentices: "Должности некрофитов"
 POP_ATTRACTION_NECROPHAGE_NEG: "§R- £pop£ Поселение является некрофагом и размножается, поглощая представителей других рас§!"
 RULER_JOB_NECROPHAGE_TRIGGER: "Эту должность могут занимать только некрофаги, не подвергаемые геноциду."
 opinion_necrophage: "Некрофаг"
 opinion_necrophage_our_species: "Поглощают нашу расу"
 disables_necrophage_features: "§RВыбор этого бонуса за стремление отключит механики некрофагов.§!"
 MESSAGE_NECROPHAGE_POPS_NECROPHAGED_TITLE: "Поглощённые поселения"
 MESSAGE_NECROPHAGE_POPS_NECROPHAGED: "Мы обратили $VALUE|Y$ £pop£ §Hпоселений§! в нашу расу в ходе церемонии вознесения в мире $PLANET|Y$."

 START_SCREEN_NECROPHAGE_BASE: "В недавнем прошлом мир [GetHomeWorldName] служил домом ничем не примечательному виду. Сторонний наблюдатель счёл бы, что они следуют по обычному извилистому пути развития с чередующимися периодами развития и упадка. Но никто не знал, что этот же мир служил домом второму разумному виду: нам. Тысячи лет мы, [GetSpeciesNamePlural], оставались незаметными для хозяев этого мира. Мы оставались слухами, ночными кошмарами, страшной сказкой для непослушного молодняка. Но они ошибались, сбрасывая нас со счетов.\n\nС ростом их технологического прогресса мы всё глубже проникали в их общество."
 START_SCREEN_NECROPHAGE: "В недавнем прошлом мир [GetHomeWorldName] служил домом ничем не примечательному виду. Сторонний наблюдатель счёл бы, что они следуют по обычному извилистому пути развития с чередующимися периодами развития и упадка. Но никто не знал, что этот же мир служил домом второму разумному виду: нам. Тысячи лет мы, [GetSpeciesNamePlural], оставались незаметными для хозяев этого мира. Мы оставались слухами, ночными кошмарами, страшной сказкой для непослушного молодняка. Но они ошибались, сбрасывая нас со счетов.\n\nС ростом их технологического прогресса мы всё глубже проникали в их общество. Их конец был быстрым и кровавым. Мы безжалостно захватили контроль над миром, низведя предшественников до статуса слуг, из которых в ходе медленного поглощения должны получиться [GetSpeciesNamePlural]. И теперь, вооружившись недавно открытым секретом сверхсветовых перелётов, мы готовы захватить звёзды и переделать все расы в галактике по своему образу и подобию!"
 START_SCREEN_NECROPHAGE_PEACEFUL: "$START_SCREEN_NECROPHAGE_BASE$ Со временем нам удалось захватить власть над планетой, превратив наших предшественников в слуг. Мы постепенно поглотили их, и сейчас почти все они [GetSpeciesNamePlural].\n\nТеперь, вооружённые недавно открытой технологией сверхсветовых путешествий, мы готовы дотянуться до звёзд и занять своё место среди космических государств галактики!"
 START_SCREEN_NECROPHAGE_HIVE: "$START_SCREEN_NECROPHAGE_BASE$ Наконец, мы были готовы действовать. Превосходство нашего коллективного сознания было очевидным: мы безжалостно захватили контроль над миром, низведя предшественников до статуса слуг, которые со временем должны были стать частью коллективного разума, имя которому [GetSpeciesName].\n\nИ теперь, вооружившись недавно открытым секретом сверхсветовых перелётов, мы готовы захватить звёзды и переделать все расы в галактике по своему образу и подобию!"
 START_SCREEN_NECROPHAGE_NOMADS: "В недавнем прошлом великий корабль-ковчег, который потом станет нашим, перевозил ничем не примечательный вид. Сторонний наблюдатель счёл бы, что они следуют по обычному извилистому пути развития с чередующимися периодами инноваций и упадка. Но никто не знал, что этот же корабль служил домом второму разумному виду: нам.\n\nТысячи лет мы, [GetSpeciesNamePlural], оставались незамеченными в забытых коридорах и запечатанных отсеках корабля. Мы были слухами, ночными кошмарами, страшной сказкой для непослушного молодняка. Но они ошибались, сбрасывая нас со счетов.\n\nПока они двигали вперёд свой технологический прогресс, мы все глубже проникали в их общество.\n\nИх конец был быстрым и кровавым. Мы безжалостно захватили контроль над кораблём, низведя предшественников до статуса слуг, из которых в ходе медленного поглощения должны получиться [GetSpeciesNamePlural].\n\nКорабль-ковчег теперь наш и курс ему задаём мы. Мы готовы проложить собственный путь через пустоту космоса и переделать все расы в галактике по своему образу и подобию!"
 necroids.2.name: "Церемония вознесения на [Root.Capital.GetName&prep]"
 necroids.2.desc: "С тех пор как [Root.GetSpeciesNamePlural] захватили мир [Root.Capital.GetName], трансформация, в ходе которой [necrophage_species.GetNamePlural] превращаются в представителей [Root.GetSpeciesAdj&masc,gen] вида, была окутана завесой ритуала. Каждые десять лет — очередной срок как раз подходит к концу — «ученики» собираются в камере вознесения на особую церемонию. Всё, что происходит с ними внутри, является строжайшей тайной, известной лишь немногим избранным, но вернувшиеся уже принадлежат к расе [Root.GetSpeciesNamePlural]."
 necroids.2.desc.gestalt: "С тех пор как [Root.GetSpeciesNamePlural] захватили мир [Root.Capital.GetName], трансформация, в ходе которой [necrophage_species.GetNamePlural] превращаются в представителей [Root.GetAdj&masc,gen] вида, была окутана завесой ритуала. Каждые десять лет — очередной срок как раз подходит к концу — «ученики» собираются в камере вознесения на особую церемонию. Всё, что происходит с ними внутри, является строжайшей тайной, известной лишь нашему коллективному сознанию, но вернувшиеся уже являются [Root.GetSpeciesAdj&pl,inst] единицами."
 necroids.2.A: "Начнём приготовления!"
 necroids.2.A.tooltip: "В конце года все §H[necro_apprentice.GetNamePlural]§! мира §H[Root.Capital.GetName]§! преобразуются, и из них получатся §H[Root.GetSpeciesNamePlural]§!.\n\nЭта церемония будет проходить каждые §H10§! лет и затронет все [Root.GetAdj&pl] миры, где есть §H$building_necrophage_elevation_chamber$§!."

 ### Sacrificial Temple (Death Cult) by Gemma Thomson

 building_sacrificial_temple_1: "Жертвенный храм"
 building_sacrificial_temple_1_desc: "Святое место, где суровые священники и упорные ученики возносят свои молитвы и раз за разом проходят через кровавый цикл, призванный обеспечить наше процветание."
 building_sacrificial_temple_2: "Мрачный голографический храм"
 building_sacrificial_temple_2_desc: "Технологические улучшения этого священного строения позволили учиться с большим прилежанием, взращивая верность в пределах его изменчивых стен."
 building_sacrificial_temple_3: "Храм великой жертвы"
 building_sacrificial_temple_3_desc: "Место высшей святости, в котором поля мультисенсорного погружения позволяют верующим почтить все [This.Owner.GetAdj&pl] жертвы — прошлые, настоящие и будущие."
 job_death_priest: "Жрец смерти"
 job_death_priest_plural: "Жрецы смерти"
 job_death_priest_desc: "Духовное руководство над массами принадлежит тем, кто в нужный час принесёт в жертву своих наиболее преданных учеников."
 job_death_priest_effect_desc: "£job_death_priest£ $job_death_priest_plural$ превращают $r_consumer_goods_acc$ в $r_unity_acc$, $r_society_acc$ и $r_amenities_acc$."
 mod_job_death_priest_add: "Должности жрецов смерти"
 mod_job_death_priest_per_pop: "§G+1§! должность жреца смерти за каждые $VALUE$ поселений"
 mod_job_death_priest_per_pop_short: "\n§G+1§! £mod_job_death_priest_add£ за каждые $VALUE$ £pop£"
 job_death_priest_icon: "£job_death_priest£"
 job_mortal_initiate: "Посвящённый смерти"
 job_mortal_initiate_plural: "Посвящённые смерти"
 job_mortal_initiate_desc: "Эти наиболее верные ученики посвятили остаток своих дней улучшению общества, и их учёба окончится добровольной жертвой."
 job_mortal_initiate_effect_desc: "[mortal_initiate.GetIcon] [mortal_initiate.GetNamePlural] производят $r_unity_acc$, $r_society_acc$ и $r_amenities_acc$."
 mod_job_mortal_initiate_add: "Должности [mortal_initiate_rinfix.GetName]"
 mod_job_mortal_initiate_per_pop: "§G+1§! должность [mortal_initiate_rinfix.GetName] за каждые $VALUE$ поселений"
 mod_job_mortal_initiate_per_pop_short: "\n§G+1§! £mod_job_mortal_initiate_add£ за каждые $VALUE$ £pop£"
 jobs_death_priest_and_mortal_initiate_effect_desc: "$job_death_priest_effect_desc$\n$job_mortal_initiate_effect_desc$"

 edict_sacrifice_unity_boost: "\n\nУвеличивает £unity£ единство, которое производят £job_death_priest£ жрецы смерти при активном указе.\n"

 edict_sacrifice_dummy: "Жертвоприношения"
 edict_sacrifice_dummy_desc: "Самые преданные среди нас готовы встретить свою судьбу, уверенные, что их жертва станет залогом нашего благополучия. С жертвоприношениями §HЕдинение§!, §HГармония§! и §HИзобилие§! им больше не нужно ждать."
 edict_sacrifice_dummy_tooltip: "§RУмрут все [mortal_initiate.GetIcon] [mortal_initiate.GetNamePlural].§! Каждая жертва даёт дополнительное £unity£ единство, счастье поселений или производство £minerals£ минералов и £energy£ энергии в зависимости от выбранного ритуала. $edict_sacrifice_unity_boost$"

 sacrifice_death_priest_mod: "Значительная жертва"
 sacrifice_death_priest_mod_desc: "Множество самых праведных встретило свою судьбу, что произвело на наших жрецов неизгладимое впечатление."

 edict_sacrifice_togetherness: "Жертвоприношение: Единение"
 edict_sacrifice_togetherness_desc: "Самые преданные среди нас готовы встретить свою судьбу, тем самым сплотив наше общество. Пусть наше единение осветит тёмное одиночество космоса!"
 edict_sacrifice_togetherness_tooltip: "§RУмрут все [mortal_initiate.GetIcon] [mortal_initiate.GetNamePlural].§! Каждая жертва увеличивает вероятность получить дополнительное £unity£ единство. $edict_sacrifice_unity_boost$"
 sacrifice_togetherness_mod: "Дополнительное жертвоприношение: Единение"
 sacrifice_togetherness_mod_desc: "Самые преданные среди нас встретили свою судьбу. Их жертва укрепляет наше единение. Пусть же оно осветит тёмное одиночество космоса!"
 sacrifice_togetherness_1: "$edict_sacrifice_togetherness$"
