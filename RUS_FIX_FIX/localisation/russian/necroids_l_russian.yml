 ### Necrophage Origin by Pierre du Plessis

 origin_necrophage: "Некрофаг"
 origin_necrophage_desc: "Эта цивилизация развивалась как паразит, вынужденный питаться другими разумными формами жизни, чтобы существовать. После её появления на галактической арене другие виды будут либо вовлечены в неё, либо станут её пищей. Для некрофага третьего не дано."
 origin_tooltip_necrophage_effects: "$t$- $HOMEWORLD$ £building£ ['concept_necrophage_elevation_chamber']\n$t$- $SPECIES_TRAITS$ ['concept_necrophage_trait']\n$t$- 2400 £pop£ §Yпрепатентных поселений§!\n$t$- ['concept_guaranteed_colonies']:\n$tt$- Заменяются на ['concept_preftl_civilizations', досветовые цивилизации]"
 origin_tooltip_necrophage_negative_effects: "$t$- Только £pop£ §Yпоселения некрофагов§! могут быть £pop_cat_ruler£ §Y$pop_cat_ruler_plural_inst$§! и §Yлидерами§!"

