 sacrifice_bounty_mod_overlord: "$edict_sacrifice_bounty$"
 sacrifice_bounty_mod_overlord_desc: "Наш сюзерен провёл странный, но плодотворный ритуал. Некоторые из нас были принесены в жертву, но остальные буквально лучатся энергией."

 MESSAGE_OVERLORD_SACRIFICE_TITLE: "Посвящённые смерти принесены в жертву"
 MESSAGE_OVERLORD_SACRIFICE_DESC: "§YПосвящённые смерти§!, работающие на сюзерена в сооружении §Y$holding_sacrificial_shrine$§!, были принесены в жертву."

 necroids.200.name: "Жертва ради [root.GetAdj&neut,gen] единения"
 necroids.200.desc: "[root.GetName&acc] окутала почти осязаемая тишина. Паломники со всех уголков государства собрались в местах поклонения, чтобы завести новых друзей и встретиться со старыми.\n\nНовые [mortal_initiate.GetNamePlural] наблюдали за ритуалами нашего общества и участвовали в них, и теперь их молчаливая процессия вызывает у собравшихся улыбки и слёзы. Верховный жрец смерти [capital_scope.GetName&gen] прочитал ободряющую проповедь, призывая верующих взращивать и беречь свои отношения и оказывать друг другу поддержку.\n\nКаждый раз, когда [mortal_initiate.GetName] проходит в зал жертвоприношений, над толпой проносится вздох. Каждая жертва встретила свой конец, оставив после себя наследие добродетели."
 necroids.200.tooltip.base: "[mortal_initiate.GetIcon] [mortal_initiate.GetNamePlural] принесены в жертву, и мы получили §Hдополнительные§!"
 necroids.200.tooltip.1: "$necroids.200.tooltip.base$ §H+6% £unity£ к производству единства§!."
 necroids.200.tooltip.2: "$necroids.200.tooltip.base$ §H+12% £unity£ к производству единства§!."
 necroids.200.tooltip.3: "$necroids.200.tooltip.base$ §H+18% £unity£ к производству единства§!."
 necroids.200.tooltip.4: "$necroids.200.tooltip.base$ §H+24% £unity£ к производству единства§!."
 necroids.200.tooltip.5: "$necroids.200.tooltip.base$ §H+30% £unity£ к производству единства§!."

 necroids.201.name: "Жертва ради [root.GetAdj&fem,gen] гармонии"
 necroids.201.desc: "Возбуждённый шёпот разносится над [root.GetName&inst]. Паломники с энтузиазмом ждут начала церемонии, несмотря на усталость от длительного путешествия.\n\nНовые [mortal_initiate.GetNamePlural] наблюдали за ритуалами нашего общества и участвовали в них, и теперь их молчаливую процессию встречают тёплыми словами благодарности. Верховный жрец смерти [capital_scope.GetName&gen] прочёл истовую проповедь, призывая верующих радоваться каждому моменту. В наивысший момент церемонии [mortal_initiate.GetNamePlural] направились в зал жертвоприношений под бурные овации. Каждый из них встретил свой конец, оставив после себя наследие добродетели."
 necroids.201.tooltip.1: "$necroids.200.tooltip.base$ §H+10% £happiness£ к счастью поселений§!."
 necroids.201.tooltip.2: "$necroids.200.tooltip.base$ §H+20% £happiness£ к счастью поселений§!."
 necroids.201.tooltip.3: "$necroids.200.tooltip.base$ §H+30% £happiness£ к счастью поселений§!."
 necroids.201.tooltip.4: "$necroids.200.tooltip.base$ §H+40% £happiness£ к счастью поселений§!."
 necroids.201.tooltip.5: "$necroids.200.tooltip.base$ §H+50% £happiness£ к счастью поселений§!."

 necroids.202.name: "Жертва ради процветания [root.GetName&gen]"
 necroids.202.desc: "Ощущение благополучия воцарилось на [root.GetName&prep], когда паломники собрались в местах поклонения. Некоторые из них принесли дары, и многие воспользовались услугами многочисленных киосков и уличных торговцев, обслуживающих святые места.\n\n[mortal_initiate.GetNamePlural] этого цикла прошли через множество ритуалов, и их молчаливая процессия украшена яркими гирляндами. Верховный жрец смерти [capital_scope.GetName&gen] прочёл вдохновляющую проповедь, обещая время процветания и благополучия для всех.\n\nКогда проповедь подошла к концу, [mortal_initiate.GetNamePlural] направились в зал жертвоприношений, где встретили свой конец, оставив после себя наследие добродетели."
 necroids.202.tooltip.1: "$necroids.200.tooltip.base$ §H+6% к производству £minerals£ минералов и £energy£ энергии§!."
 necroids.202.tooltip.2: "$necroids.200.tooltip.base$ §H+12% к производству £minerals£ минералов и £energy£ энергии§!."
 necroids.202.tooltip.3: "$necroids.200.tooltip.base$ §H+18% к производству £minerals£ минералов и £energy£ энергии§!."
 necroids.202.tooltip.4: "$necroids.200.tooltip.base$ §H+24% к производству £minerals£ минералов и £energy£ энергии§!."
 necroids.202.tooltip.5: "$necroids.200.tooltip.base$ §H+30% к производству £minerals£ минералов и £energy£ энергии§!."

 ### Reanimators by Pierre du Plessis

 civic_reanimated_armies: "Реаниматоры"
 civic_reanimated_armies_desc: "В этом обществе смерть не является причиной игнорировать мобилизацию. Мастера некромантии возрождают тела умерших и создают из них армии и стражей, вселяющих страх в сердца низших смертных."
 disabled_by_synthetic_ascension: "Несовместимо с §Yсинтетическим возвышением§!"
 civic_tooltip_reanimated_armies_effects: "$t$- §Y£job_soldier£ $job_soldier_plural$§! заменяются на §Y£job_necromancer£ некромантов§!\n$t$- $AVAILABLE_BUILDINGS$\n$tt$- £building£ ['building:building_dread_encampment']\n$t$- $AVAILABLE_HOLDINGS$\n$tt$- £building£ ['building:holding_dread_outpost']\n$t$- Побеждённые §Yорганические армии§! иногда возрождаются как §Yармии мёртвых§!\n$t$- Некоторых побеждённых органических §Yлевиафанов§! можно воскресить\n$t$- $reanimator_effect_desc$"

 building_dread_encampment: "Лагерь ужаса"
 building_dread_encampment_desc: "Лучше скрыть деятельность некромантов от ранимой общественности. Негоже посторонним видеть, как поднимаются армии мёртвых."
 job_necromancer_effect_desc: "£job_necromancer£ $job_necromancer_plural$ превращают $r_consumer_goods_acc$ в $r_physics_acc$, $r_society_acc$, увеличивают $r_naval_capacity_acc$ и создают £defense_army£ §Yоборонительные армии мёртвых§!."
 building_dread_encampment_tt: "- $undead_army_recruitment_tt$\n- $undead_defense_army_recruitment$"
 undead_army_recruitment_tt: "Позволяет нанимать §Y$undead_army_plural$§!"
 undead_army: "Армия мёртвых"
 undead_army_desc: "Мёртвые солдаты, поднятые некромантами из своих могил. Они не боятся смерти, а их внешний вид и ярость в бою вселяют ужас в сердца врагов!"
 undead_army_plural: "Армии мёртвых"
 giant_undead_army: "Армия гигантских мертвецов"
 giant_undead_army_desc: "Гигантский скелет, готовый сеять хаос во вселенной. Он не станет церемониться с завоёвываемой планетой."
 giant_undead_army_plural: "Армии гигантских мертвецов"
 undead_defense_army_recruitment: "Заменяет §Yпланетарные $defense_army_plural$§! на §Y$undead_defense_army_plural$§!"
 undead_defense_army: "Оборонительная армия мёртвых"
 undead_defense_army_plural: "Оборонительные армии мёртвых"
 undead_defense_army_desc: "Мёртвые воины, поднятые из могил волей некромантов, защищают наши планеты от любых угроз!"
 necromancer: "$job_necromancer$"
 job_necromancer: "Некромант"
 job_necromancer_plural: "Некроманты"
 job_necromancer_plural_with_icon: "£job_necromancer£ $job_necromancer_plural$"
 job_necromancer_desc: "Нелегко поднимать мёртвых для службы в рядах войск. Только наиболее умелые специалисты владеют тайным мастерством, необходимым для достижения этой цели!"
 planet_necromancers: "Должности некромантов"
 mod_job_necromancer_add: "Должности некромантов"
 mod_job_necromancer_per_pop: "§G+1§! должность некроманта за каждые $VALUE$ поселений"
 mod_job_necromancer_per_pop_short: "\n§G+1§! £mod_job_necromancer_add£ за каждые $VALUE$ £pop£"

 galactic_features.385.reanimated: "Пусть поработают [Owner.GetNecromancersUpper]."
 distar.218.name: "Воспрянь!"
 distar.218.desc.regular: "После сложного и длительного ритуала §Yматриарх тиянки§! возвращается из мира мёртвых, чтобы послужить нашим интересам."
 distar.218.desc.hive: "Воскрешение §Yматриарха тиянки§! далось с большим трудом. Хотя мы получили уже немало опыта в подчинении его отпрысков, наши кордицептовые [root.GetNecromancersLower&nom] выбились из сил, пытаясь справиться с постоянной регенерацией матриарха. Но в конечном счёте мы восторжествовали. Никакой мёртвой ткани не сравниться с нами в скорости адаптации.\n\nТеперь, подчинив матриарха, мы дёргаем огромными жгутиками."
 distar.218.desc.machine: "§YМатриарх тиянки§! был перезагружен и перепрофилирован. Теперь это колоссальное создание будет служить нам как органический модуль. Его матриархальные протоколы заблокированы, и этот левиафан будет действовать под нашим контролем."
 distar.5016.desc.regular: "Наши некроманты вернули тело §YПорождения пустоты§! к яйцу, откуда оно появилось на свет, и вырастили новое Порождение, которое будет верно служить нам."
 distar.5016.desc.hive: "Возвращение §Yпорождения пустоты§! в яйцо и повторная инкубация оказались невероятно эффективными. С помощью оставшейся в яйце зародышевой материи наши [root.GetNecromancersLower&nom] без труда подчинили труп.\n\nСущество стало нашей марионеткой, теперь мы управляем его полётом."
 distar.5016.desc.machine: "При помощи протоколов мехромантии мы оживили уничтоженное §Yпорождение пустоты§!. Мы изготовили для него новые крылья из экспериментального биосплава."
 it_hungers: "Оно голодно."
 leviathans.675.desc.regular: "Упорный труд наших некромантов вновь принёс свои плоды: §Yэфирный дракон§! вернулся к жизни. Результат слияния сознаний выглядит жутко и движется с трудом, но если его раскалённое дыхание всё ещё работает, можно считать это успехом."
 leviathans.675.desc.hive: "Поначалу биология §Yэфирного дракона§! казалась неприступной. Вместо захвата центральной нервной системы нам пришлось заменить все нервы [root.GetIndividualNamePlural&inst].\n\nПосмотрим, удастся ли заставить этот труп рычать."
 leviathans.675.desc.machine: "Анализ остова §Yэфирного дракона§! показывает, что его возраст превышает 922337203685477580-\n\n§RОШИБКА: ПРЕВЫШЕН РАЗМЕР РЕЕСТРА.§!\n\nДальнейшее изучение будет проще, поскольку мы заменили его внутреннюю структуру нашими экспериментальными реакторами."
 ancrel.4026.desc.regular: "Дракон вновь расправляет крылья. Прожорливая §YШард§! возвращается в систему [from.solar_system.GetName&gen], чтобы охранять для нас Рубрикатор!"
 ancrel.4026.desc.hive: "Некогда жадная и одинокая §YШард§! утихла. Мы захватили её безжизненное тело и избавились от личности и речевых центров. После удаления этих нестабильных систем её перегретое дыхание в нашем распоряжении."
 ancrel.4026.desc.machine: "Мы задействовали протоколы мехромантии и оживили биологическое существо под названием §YШард§!. Синаптические импульсы находятся в пределах ожидаемых параметров. Огромный дракон реактивирован и теперь подчиняется нашим командам."
 distar.340.desc: "Новость о смерти амёбы по имени [Root.Fleet.GetName] мгновенно распространилась по [Root.Owner.GetName&dat]. Народ охвачен горем, ведь амёба долгое время была верным другом всего нашего вида. Однако некроманты отреагировали на вести по-своему — они не на шутку взбудоражились и теперь утверждают, что могут принести народу утешение и сделать так, что [Root.Fleet.GetName] к нам вернётся."
 distar.340.desc.science: "Новость о смерти амёбы по имени [Root.Fleet.GetName] мгновенно распространилась по [Root.Owner.GetName&dat], но больше всего из-за этого переживает [amoeba_finding_scientist.GetAXX::ведущ<end_ii> учён<end_yi>] [amoeba_finding_scientist.GetName]. Именно [amoeba_finding_scientist.GetSheHe] [amoeba_finding_scientist.GetAXX::отыскал<end_a>] заблудшую и беспомощную юную космическую амёбу, [amoeba_finding_scientist.GetAXX::наблюдал<end_a>] за тем, как она взрослеет под [amoeba_finding_scientist.GetHerHis] чутким руководством, и в итоге [amoeba_finding_scientist.GetAXX::потерял<end_a>] её.\n\nВозможно, [amoeba_finding_scientist.GetName] уже никогда не оправится от потери этого молчаливого спутника."
 distar.340.a: "Восстань, [Root.Fleet.GetName]! ВОССТАНЬ!"
 distar.340.b: "Не будите спящую амёбу."
 distar.59.desc: "§Y[reanimated_amoeba.Fleet.GetName]§! снова ожила?! Или, по крайней мере, вновь способна двигаться. Мы не знаем, что именно сделали [amoeba_finding_scientist.GetName] с коллегами, но благодаря их безграничному отчаянию и безумному гению наша любимая амёба снова с нами."
 distar.59.desc.science: "§Y[reanimated_amoeba.Fleet.GetName]§! снова ожила?! Или, по крайней мере, вновь способна двигаться. Мы не знаем, что именно сделали наши некроманты, но благодаря их безграничному отчаянию и безумному гению наша любимая амёба снова с нами."

 REANIMATE_TIYANKI_MATRIARCH: "Оживление матриарха тиянки"
 REANIMATE_TIYANKI_MATRIARCH_DESC: "Наши [Owner.GetNecromancersLower&nom] придумали смелый план — вернуть матриарха тиянки из мёртвых и поставить её к нам на службу."
 REANIMATE_VOIDSPAWN: "Оживление побеждённого Порождения пустоты"
 REANIMATE_VOIDSPAWN_DESC: "Наши [Owner.GetNecromancersLower&nom] предлагают использовать их тайное ремесло, чтобы возродить §YПорождение пустоты§! и включить его в состав нашего военного флота."
 REANIMATE_ROCK_BRAIN: "Оживление каменного мозга"
 REANIMATE_ROCK_BRAIN_DESC: "Что бы там ни думало это древнее существо, вселенная за пределами его поглощённого собой сознания продолжает вертеться. Используя древние знания и последние достижения науки, наши некроманты могут вложить ложные идеи прямо в мозг окаменевшего создания."
 REANIMATE_GUARDIAN_DRAGON: "Воскрешение эфирного дракона"
 REANIMATE_GUARDIAN_DRAGON_DESC: "Наши [Owner.GetNecromancersLower&nom] верят, что им по силам вновь разжечь искру жизни в §Yэфирном драконе§! с помощью ритуалов и науки. Они хотят использовать плазму ближайшей звезды и прикрепить к трупу кордицептовые двигатели."
 REANIMATE_SHARD_DRAGON: "Оживление Шард"
 REANIMATE_SHARD_DRAGON_DESC: "Труп §YШард§!, погибели крыс, хранительницы Рубрикатора, беспомощно движется по орбите соседней звезды. Наши [Owner.GetNecromancersLower&nom] считают, что раз уж при жизни это существо охраняло Рубрикатор, то и после смерти оно будет служить новым владельцам артефакта."
 REANIMATE_LOST_AMOEBA: "Оживление заблудшей амёбы"
 REANIMATE_LOST_AMOEBA_DESC: "Наши некроманты твёрдо намерены вернуть покойную амёбу к жизни. Мы пока не понимаем как."
 REANIMATE_LOST_AMOEBA_DESC_SCIENCE: "Наши некроманты и [amoeba_finding_scientist.GetName] твёрдо намерены вернуть покойную амёбу к жизни. Мы пока не понимаем как."

 # Mechromancy AP event
 necroids.20.name: "Внедрено улучшение мехромантии"
 necroids.20.desc: "Успешное внедрение протоколов мехромантии позволит нам оживлять определенных погибших левиафанов. Органические компоненты уступают механическим улучшениям. Мы сможем синтезировать плоть и создать копию органической жизни."
 necroids.20.a: "Функции реаниматора активированы."

 ### Galactic Memorials (Memorialists) by Gemma Thomson

 building_galactic_memorial_1: "Святилище упокоения"
 building_galactic_memorial_1_desc: "Этот скромный мемориал направляет мысли и способствует пониманию неоднозначной природы смерти и конца."
 building_galactic_memorial_2: "Столп смерти"
 building_galactic_memorial_2_desc: "Мрачное место, посвящённое размышлениям о смерти, где могут храниться записи о множестве концов."
 building_galactic_memorial_3: "Галактический мемориал"
 building_galactic_memorial_3_desc: "Монументальная библиотека, где хранятся все понятые и непонятые знания о конце, записанные для неопределённого будущего."
 building_galactic_memorial_regular_tooltip: "§HСвятилища упокоения§! увеличивают §Hпривлекательность руководящих принципов§! в §Hопустошённых§! и §Hреликтовых мирах§!"
 building_galactic_memorial_gestalt_tooltip: "§HСвятилища упокоения§! снижают §Hотклонение от нормы§! в §Hопустошённых§! и §Hреликтовых мирах§!"
 job_death_chronicler: "Хронист смерти"
 job_death_chronicler_plural: "Хронисты смерти"
 job_death_chronicler_desc: "Энтропия — вотчина этих учёных, наблюдающих и записывающих проявления смерти и её всевозможные последствия."
 job_death_chronicler_effect_desc: "£job_death_chronicler£ $job_death_chronicler_plural$ превращают $r_consumer_goods_acc$ в $r_unity_acc$, $r_stability_acc$ и:[GetCivilianSpiMatOutput][GetCivilianEgalAuthOutput][GetCivilianMilPacOutput][GetCivilianXenoOutput]\n\nЭффекты £job_death_chronicler£ хронистов смерти зависят от принципов государства.\n\n"
 job_death_chronicler_simple_effect_desc: "£job_death_chronicler£ $job_death_chronicler_plural$ превращают $r_consumer_goods_acc$ в $r_unity_acc$ и $r_stability_acc$, а также дают §Hзависящие от принципов§! модификаторы для [civilian.GetIcon] [civilian_rinfix.GetName]"
 chronicle_drone: "$job_chronicle_drone$"
 job_chronicle_drone: "Хронист"
 job_chronicle_drone_plural: "Хронисты"
 job_chronicle_drone_desc: "Эти специализированные единицы изучают энтропию и окончательный распад как противоположность их собственному непрерывному существованию."
 job_chronicle_drone_effect_desc: "£job_chronicle_drone£ $job_chronicle_drone_plural$ превращают $r_energy_acc$ (или $r_food_acc$) в $r_unity_acc$ и $r_stability_acc$"
 mod_job_death_chronicler_add: "Должности хронистов смерти"
 mod_job_death_chronicler_per_pop: "§G+1§! должность хрониста смерти за каждые $VALUE$ поселений"
 mod_job_death_chronicler_per_pop_short: "\n§G+1§! £mod_job_death_chronicler_add£ за каждые $VALUE$ £pop£"
 mod_job_chronicle_drone_add: "Должности хронист"
 mod_job_chronicle_drone_per_pop: "§G+1§! должность хрониста за каждые $VALUE$ поселений"
 mod_job_chronicle_drone_per_pop_short: "\n§G+1§! £mod_job_chronicle_drone_add£ за каждые $VALUE$ £pop£"
 action.62.memorialist.a: "О них будут помнить."

 ### Permanent Employment by Victor Haeggman
 civic_permanent_employment: "Постоянная занятость"
 civic_permanent_employment_desc: "Эта мегакорпорация гарантирует, что её сотрудники никогда не останутся без работы. То есть вообще никогда. Когда наступает урочный час, работника переводят на выполнение более простых функций, чтобы он мог и дальше своим трудом оплачивать долги и семейные расходы."
 civic_tooltip_permanent_employment_effects: "$t$- $AVAILABLE_BUILDINGS$\n$tt$- £building£ ['building:building_posthumous_employment_center']\n$t$- $AVAILABLE_HOLDINGS$\n$tt$- £building£ ['building:holding_reemployment_center']\n$t$- Некоторых побеждённых органических левиафанов можно воскресить"
 civic_tooltip_corporate_permanent_employment_effects: "$civic_tooltip_permanent_employment_effects$\n$t$- $BRANCH_OFFICE_BUILDING$ £building£ ['building:building_food_conglomerate'] $megacorp_civic_branch_office_building_effect$"
 job_reassigner: "Супервайзер"
 job_reassigner_desc: "Супервайзеры следят за тем, чтобы после смерти гражданина мегакорпорации его тело продолжало трудиться до выполнения обязательств контракта."
 job_reassigner_plural: "Супервайзеры"
 job_reassigner_effect_desc: "£job_necromancer£ [reassigner.GetNamePlural] превращают $r_consumer_goods_acc$ и $r_food_acc$ (или аналог) в £mod_logistic_growth_mult£ §Yежемесячный рост поселений органиков§!. Все созданные £pop£ поселения получают признак §Y$trait_zombie$§!."
 planet_reassigners: "Должности супервайзеров"
 mod_job_reassigner_add: "Должности [reassigner_rinfix.GetName]"
 trait_zombie: "Зомби"
 trait_zombie_desc: "§LОстанки некогда разумного создания, ныне пригодные только для выполнения самых элементарных функций.§!"
 TRAIT_ZOMBIE_EFFECT: "$MOD_POP_BONUS_WORKFORCE_MULT$: §R-25%§!\n$t$- $civilian_and_maintenance_drone_cat_bonus_workforce_mult$: §R-50%§!\n$t$- Обслуживание поселений снижено на: §G100%§!\n$t$- Нельзя создавать §Yлидеров§!\n$t$- Должности §Y$pop_cat_ruler_plural_gen$§! и §Y$pop_cat_specialist_plural_gen$§! недоступны"
 building_posthumous_employment_center: "Центр посмертной занятости"
 building_posthumous_employment_center_desc: "В центрах посмертной занятости лишённые разума тела умерших обретают новый смысл существования и получают ещё одну возможность выплатить долги."
 edict_sacrifice_bounty_zombie: "$edict_sacrifice_bounty$"
 edict_sacrifice_bounty_zombie_desc: "Самые преданные среди нас готовы встретить свою судьбу, уверенные, что их жертва станет залогом нашего благополучия. Наша смерть повысит котировки акций корпорации, а тела наши продолжат служить ей даже после смерти."
 edict_sacrifice_bounty_zombie_tooltip: "$edict_sacrifice_bounty_tooltip$\nУвеличивает £mod_logistic_growth_mult£ §Yежемесячный рост поселений органиков§! на §G+1§! для всех £job_necromancer£ [reassigner_rinfix.GetName]."

 necroids.260.name: "Самые послушные работники"
 necroids.260.desc: "Едва совет директоров собрался на голографическую встречу, чтобы обсудить рост продаж продуктов гигиены для зомби, как в конференц-зал ворвался один из руководителей отдела реанимированных активов. «Один из зомби в мире §Y[debt_free_zombie.Planet.GetName]§! смог полностью отработать свой долг!», — с ходу выпалил менеджер, ещё не осознавая, что оказался в присутствии высокого начальства. В зале воцарилась гробовая тишина — а затем начался форменный хаос. Каждый из собравшихся директоров требовал немедленно разъяснить, как это происшествие скажется на доступности реанимированной рабочей силы.\n\nПосле длительных расчётов выяснилось, что событие было из ряда вон выходящим. Выплатить долги были способны лишь умершие, чьих тел хватило на сотню лет труда, — в общем, совершенно мизерное количество. Если они уйдут на заслуженный отдых, наша галактическая корпорация этого даже не заметит."
 necroids.260.a: "Они заслужили свободу. Пусть отдохнут."
 necroids.260.b: "Надо просто пририсовать пару нулей к их долгам."

 zombie_contract_manipulation: "Манипуляция контрактами зомби"
 zombie_contract_manipulation_desc: "Это государство внесло некоторые поправки в контракты, связывающие работников-зомби. Теперь у них вообще нет шансов отработать свой долг."

 ### Cordypectic Drones by Victor Haeggman
 civic_hive_cordyceptic_drones: "Кордицептовые дроны"
 civic_hive_cordyceptic_drones_desc: "Крайне специализированные дроны, способные заражать простых носителей и отдавать простейшие команды, являются основой космической обороны этого улья."
 civic_tooltip_cordyceptic_drones: "$t$- В начале игры есть §G3§! §Hвоскрешённых амёбы§!\n$t$- Побеждённая органическая космическая фауна автоматически воскрешается\n$t$- Некоторых побеждённых органических левиафанов можно воскресить\n$t$- $reanimator_effect_desc$\n$t$- Убийство космической фауны даёт £genetic_material£ ['concept_dna', генетический материал]"
 civic_wilderness_cordyceptic_drones: "Кордицептовые симбионты"
 civic_wilderness_cordyceptic_drones_desc: "Крайне специализированные грибы-симбионты позволяют дикому сознанию защищаться, заражая примитивных носителей и отдавая им простейшие команды."

 MESSAGE_REANIMATION_COMPLETE_TITLE: "Воскрешение завершено"
 MESSAGE_REANIMATION_COMPLETE_TIYANKI_DESC: "Новая группа воскрешённых тиянки ожидает наших приказов в системе $SYSTEM|Y$. Следующая группа уже готовится."
 MESSAGE_REANIMATION_AMOEBA_TIYANKI_DESC: "Новая группа воскрешённых амёб ожидает наших приказов в системе $SYSTEM|Y$. Следующая группа уже готовится."

 necroids.310.name: "Антивирус"
 necroids.310.desc: "Преторины попытались проникнуть в §Rнас§!!\n\nВнегалактические захватчики мгновенно захватили наших [root.GetNecromancersLower&acc]. После этого чужеродная сущность начала захватывать ближайших [root.GetIndividualNamePlural&acc]. Нам пришлось уничтожить всю группу, чтобы защитить мир [Root.GetName]."
 necroids.310.a: "Их нужно было уничтожить."

 sm_cordyceptic_reanimation_facility: "Центр кордицептовой реанимации"
 sm_cordyceptic_reanimation_facility_desc: "§LВ обычных обстоятельствах нам пришлось бы искать недавно погибших подопытных для воскрешения, но благодаря системе размножения мы можем внедряться на раннем этапе, тем самым получая стабильный приток носителей.§!\n"
 requires_tiyanki_spawning_system: "§RДолжно быть построено в системе §YТияна Век§!, §YТиюн Орт§! или §YАмор Альвео§!.§!"
 sm_cordyceptic_reanimation_facility_desc_modifier: "Находясь в системе, полной биологической жизни, будет производить §Yреанимированную флотилию§! раз в §G5 лет§!."
