l_russian:

 LIMBO_2_PROJECT: "Лимб: второй шанс"
 LIMBO_2_PROJECT_DESC: "Мы могли бы дать вымершей расе древних инопланетян второй шанс на жизнь, загрузив их нейронные сканограммы в тела роботов."

 GHOST_SHIP_PROJECT: "Изучить «корабль-призрак»"
 GHOST_SHIP_PROJECT_DESC: "Покинутый научный корабль уже долгие века патрулирует систему Иллоса. Чем вызван его одинокий полёт?"

 GHOST_SHIP_PROJECT_02: "Ответить дитя «$NAME_Hillos_ship$»"
 GHOST_SHIP_PROJECT_02_DESC: "Похоже, телепатический лепет в системе Иллоса принадлежит искусственному сознанию, заточённому на борту корабля-призрака «$NAME_Hillos_ship$»"

 ANCIENT_MANUFACTORIUM_PROJECT: "Включить подземный комплекс"
 ANCIENT_MANUFACTORIUM_PROJECT_DESC: "Приготовления сделаны. Пришло время запустить древнюю технику, подключив комплекс к энергосистеме планеты!"

 STRATOVENTS_PROJECT: "Изучение стратосферных каналов"
 STRATOVENTS_PROJECT_DESC: "Изучить уникальные стратосферные каналы на §Y[planet.GetName&prep]§! и их значение для космической фауны."
