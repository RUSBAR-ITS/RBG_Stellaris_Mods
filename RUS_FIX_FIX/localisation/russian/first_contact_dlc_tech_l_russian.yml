 STARBASE_CLOAKING_STRENGTH_DESC: "§E§HЭффективность маскировки§! — это показатель стабильности маскировочного поля, излучаемого станцией. Чем выше стабильность, тем более продвинутые датчики нужны, чтобы её обнаружить.§!"
 CLOAKING_EXCEPTIONAL_STARBASE_DESC: "\nЭта станция способна разворачивать исключительно динамическое маскировочное поле. Её невозможно обнаружить обычными датчиками."
 CLOAKING_EXCEPTIONAL_STARBASE_CAN_BE_IMPROVED: "Последующие усовершенствования позволят станции избегать обнаружения всё более продвинутыми комплексами обнаружения."
 CLOAKING_STRENGTH_0_STARBASE_DESC: "\nЭта станция неспособна разворачивать маскировочное поле."
 CLOAKING_STRENGTH_1_STARBASE_DESC: "\nЭта станция способна разворачивать нестабильное маскировочное поле, скрывающее её только от самых примитивных датчиков."
 CLOAKING_STRENGTH_2_STARBASE_DESC: "\nЭта станция способна разворачивать простое маскировочное поле, скрывающее её от простых систем обнаружения."
 CLOAKING_STRENGTH_3_STARBASE_DESC: "\nЭта станция способна разворачивать маскировочное поле умеренной силы, скрывающее её от стандартных датчиков."
 CLOAKING_STRENGTH_4_STARBASE_DESC: "\nЭта станция способна разворачивать динамическое маскировочное поле, скрывающее её от продвинутых датчиков."
 CLOAKING_STRENGTH_5_STARBASE_DESC: "\nЭта станция способна разворачивать невероятно сложное маскировочное поле, скрывающее её от любых систем обнаружения, кроме самых высокотехнологичных."
