 # Insight Technologies

 tech_unusual_senses: "Необычное восприятие"
 tech_unusual_senses_desc: "Нет ничего более изобретательного, чем эволюция. Изучив, как общества, не овладевшие сверхсветовыми перелётами, воспринимают своё окружение, мы разработали новые способы обнаружения чужих кораблей."
 tech_unusual_senses_effect: "§HСтанции слежения§! дают §G+1§! к силе обнаружения и дальности действия сенсоров за каждые §Y3§! §Hкомплекса обнаружения§!."
 sm_listening_post_unusual_senses_desc: "Каждые §Y3§! §Hкомплекса обнаружения§! дают:\n$t$Сила обнаружения: §G+1§!\n$t$Дальность действия сенсоров: §G+1§!"
 tech_new_numbers: "Новые числа"
 tech_new_numbers_desc: "Изучив несколько обществ, не овладевших сверхсветовыми перелётами, мы узнали, что подходы к астрофизическим расчётам могут быть необычайно разнообразными. Наши учёные даже вывели новые формулы."
 tech_trinary_computing: "Троичное исчисление"
 tech_trinary_computing_desc: "Каждому обществу свойственны свои подходы к логистике и вычислениям. Неизвестные прежде способы мышления облегчили нам приспособление к сооружениям других государств."

 tech_atmospheric_orbital_mechanics: "Атмосферная орбитальная механика"
 tech_atmospheric_orbital_mechanics_desc: "Благодаря богатому опыту наблюдения за досветовыми за обществами мы теперь можем значительно оптимизировать содержание наблюдательных форпостов по всему государству."
 mod_stations_upkeep_mult: "Содержание станций"

 tech_predatory_tactics: "Повадки хищников"
 tech_predatory_tactics_desc: "Пронаблюдав, как хитрые представители досветовых цивилизаций подбираются к врагу, скрывая друг друга, мы передали эти знания нашим пилотам. Теперь они могут перемещаться быстрее, не нарушая маскировку."
 tech_predatory_tactics_effect: "Потеря субсветовой скорости из-за маскировки: §G-50%§!"
 very_low_cloaking_predator: "$tech_predatory_tactics$"
 low_cloaking_predator: "$tech_predatory_tactics$"
 medium_cloaking_predator: "$tech_predatory_tactics$"
 high_cloaking_predator: "$tech_predatory_tactics$"
 very_high_cloaking_predator: "$tech_predatory_tactics$"
 exceptional_cloaking_predator: "$tech_predatory_tactics$"

 tech_satisfying_insults: "Умелые оскорбления"
 tech_satisfying_insults_desc: "Удачно подобранные слова могут ранить сильнее меча. Теперь мы можем оскорблять прародителей наших собеседников на нескольких языках."
 tech_satisfying_insults_effect: "Даёт преимущество за оскорбление другого государства раз в §Y5 лет§!."
 satisfying_insult_cooldown: "\n\nПолучить преимущество за §Hумелое оскорбление§! можно будет только после окончания текущего модификатора."
 gain_satisfying_insult_recently: "\n\nМы получим модификатор §HУмелое оскорбление§! на 5 лет, а также §G50§! £influence£ влияния."
 MESSAGE_SATISFYING_INSULTS_TITLE: "Доступно умелое оскорбление"
 MESSAGE_SATISFYING_INSULTS: "Наши лингвисты придумали новое умелое оскорбление. Осталось подобрать подходящую цель."
 satisfying_insult_recently: "Умелое оскорбление"
 satisfying_insult_recently_desc: "Это было очень остроумно!"

 tech_compact_living: "Компактное проживание"
 tech_compact_living_desc: "Ни одной цивилизации пока так и не удалось решить вопрос стабильно эффективного управления в разрастающихся границах, но мы нашли удачную полумеру: изучив целое множество видов и форм правления, мы добились отличного равновесия между гибкостью и функциональностью."

 tech_alien_topography: "Инопланетная топография"
 tech_alien_topography_desc: "Любая цивилизация процветает лишь там, где это позволяют условия. Проанализировав расположение большинства самых успешных досветовых цивилизаций, мы поняли, как увеличить пользу от колоний."

 tech_xeno_aesthetics: "Инопланетная эстетика"
 tech_xeno_aesthetics_desc: "Проанализировав работы художников — представителей самых разных культур, мы выработали общий принцип: изучив культуру и искусство той или иной цивилизации, мы получим преимущество в войне с ней."

 tech_lost_building_methods: "Утраченные способы строительства"
 tech_lost_building_methods_desc: "Любая достаточно долго существующая цивилизация может похвастаться неповторимыми грандиозными чудесами — творением рук далёких предков. К счастью, мы описали этих предков ещё тогда, когда они впервые заселили примитивные планеты."

 tech_supreme_alloy: "Превосходный сплав"
 tech_supreme_alloy_desc: "Сплав, который мы когда-то считали безупречным, оказался с изъянами. Тщательно задокументировав процессы очистки на планетах без сверхсветовых двигателей, наши учёные смогли синтезировать идеальный металл."

 tech_ordered_retreat: "Организованное отступление"
 tech_ordered_retreat_desc: "Безусловно, военную науку двигают вперёд победители, но наблюдение за проигравшими на планетах без сверхсветовых двигателей помогло нам эффективнее организовывать отступления."

 tech_temple_of_transportation: "Храм транспортировки"
 tech_temple_of_transportation_desc: "Многие, даже самые разные цивилизации сходятся в одном: транспортные сети по-настоящему объединяют. Пусть у нас и нет паровых двигателей, но сети гиперретрансляторов ничем не хуже."

 SENSOR_DEVICE_VALUE: "Датчик станции: §G$VALUE|0$§!"
 HYPERLANE_DETECTION_RANGE_DESC: "§E§H$HYPERLANE_RANGE$§! — максимальное расстояние обнаружения гиперкоридоров этой станцией.§!"
 SENSOR_RANGE_DESC: "§E§H$SENSOR_RANGE$§! — максимальное расстояние действия датчиков этой станции.§!"

 MESSAGE_FLEET_FORCED_TO_DECLOAK_MESSAGE_TYPE_TITLE: "Принудительный сброс маскировки"
 MESSAGE_FLEET_FORCED_TO_DECLOAK: "Флотилия $FLEET$ была обнаружена в системе $SYSTEM|H$ и оказалась вынуждена сбросить маскировку!"

 GO_TO_preFTL_PLANET: "Перейти к колонии"
 GO_TO_preFTL_PLANET_tt: "Щёлкните, чтобы посетить планету досветовой цивилизации."
 GO_TO_OBSERVATION_POST: "Перейти к наблюдательному форпосту"
 GO_TO_OBSERVATION_POST_tt: "Щёлкните, чтобы посетить наблюдательный форпост на орбите планеты досветовой цивилизации."

 CLOAKING_DETECTION_TITLE: "Обнаружение маскировки"
 CLOAKING_DETECTION_SENSOR_tt: "Эта система находится в зоне действия датчиков станции, оснащённой комплексом обнаружения. Она может обнаруживать замаскированные флотилии с менее эффективной маскировкой."
 CLOAKING_DETECTION_DECLOAK_tt: "В этой системе наша флотилия будет обнаружена и вынуждена сбросить маскировку."
