# Detection Array
 sm_detection_array: "Комплекс обнаружения"
 sm_detection_array_plural: "Комплексы обнаружения"
 sm_detection_array_desc: "Мощный блок внешних датчиков, способный обнаруживать замаскированные флотилии.\n"

 sm_dark_matter_detector: "Резонатор на тёмной материи"
 sm_dark_matter_detector_desc: "Это устройство возбуждает тёмную материю и приводит её в резонансное состояние. Комплексы обнаружения начинают действовать эффективнее.\n"
 sm_dark_matter_detector_desc_modifier: "Каждые §Y3§! §Hкомплекса обнаружения§! дают:\n$t$Сила обнаружения: §G+1§!"

 sm_dark_matter_listening_post: "Станция слежения на тёмной материи"
 sm_dark_matter_listening_post_desc: "Система датчиков этой станции слежения усилена за счёт автономного резонатора на тёмной материи, что даёт ей непревзойдённую способность к обнаружению маскировки.\n"

 # Cloaking Strength and Detection Levels
 CLOAKING_STRENGTH: "Сила маскировки"
 CLOAKING_STRENGTH_VALUE: "$CLOAKING_STRENGTH$: $VALUE|0$"
 FLEET_CLOAKING_STRENGTH_DESC: "§E§HСила маскировки§! — это показатель стабильности маскировочного поля, окружающего флотилию. Чем стабильнее маскировочное поле, тем меньше штрафов получает замаскированная флотилия. Максимальная стабильность флотилии определяется по кораблю с наименьшим индивидуальным показателем силы маскировки.§!"
 SHIP_CLOAKING_STRENGTH_DESC: "$FLEET_CLOAKING_STRENGTH_DESC$"
 CLOAKING_DETECTION: "Сила обнаружения"
 CLOAKING_DETECTION_VALUE: "$CLOAKING_DETECTION$: $VALUE|0$"
 CLOAKING_DETECTION_DESC: "§E§HСила обнаружения§! — это показатель чувствительности комплексов обнаружения, установленных на станции. Чем выше чувствительность комплексов обнаружения, тем более мощные маскировочные поля они способны преодолевать.§!"
 CLOAKING_DEVICE_VALUE: "Генератор маскировочного поля: §G+$VALUE|0$§!"
 FLEET_CLOAKING_ACTIVE_EFFECTS: "При маскировке эта флотилия получает следующие штрафы:"
 FLEET_CLOAKING_LEVEL_THRESHOLDS: "Повышение силы маскировки уменьшает штрафы.\nСнижение силы маскировки увеличивает штрафы.\n\n$SHIP_SHIELD_REDUCTION_CLOAKING$ применяется к каждому кораблю отдельно и зависит от установленного генератора маскировочных полей"
 FLEET_VIEW_ACTIVATE_CLOAK: "Включить маскировку"
 FLEET_VIEW_ACTIVATE_CLOAK_DESC: "Эта флотилия §Yне замаскирована§!.\nПриказать включить маскировку, которая скрывает флотилию от обнаружения обычными датчиками. $CLOAKING_COOLDOWN_TOOLTIP$"
 STARBASE_ACTIVATE_CLOAK_DESC: "Эта станция §Yне замаскирована§!.\nПриказать включить маскировку, которая скрывает станцию от обнаружения обычными датчиками. $CLOAKING_COOLDOWN_TOOLTIP$"
 FLEET_VIEW_DEACTIVATE_CLOAK: "Выключить маскировку"
 FLEET_VIEW_DEACTIVATE_CLOAK_DESC: "Эта флотилия §Yзамаскирована§!.\nПриказать отключить маскировку, что позволит обнаружить флотилию обычными датчиками. $CLOAKING_COOLDOWN_TOOLTIP$"
 STARBASE_DEACTIVATE_CLOAK_DESC: "Эта станция §Yзамаскирована§!.\nПриказать отключить маскировку, что позволит обнаружить станцию обычными датчиками. $CLOAKING_COOLDOWN_TOOLTIP$"
 CLICK_TO_DEACTIVATE_CLOAKING: "§GЩёлкните, чтобы отключить маскировку.§!"
 CLICK_TO_ACTIVATE_CLOAKING: "§GЩёлкните, чтобы включить маскировку.§!"
 FLEET_SHIPS_CANT_CLOAK: "§RКорабли в этой флотилии неспособны маскироваться§!"
 STARBASE_CANT_CLOAK: "§RЭта станция не способна маскироваться.§!"
 FLEET_SHIPS_CANT_CLOAK_COOLDOWN: "\n§RГенератор маскировочного поля перезаряжается. Включить маскировку можно будет через §Y$VALUE$§! дн.§!"
 FLEET_SHIPS_CANT_CLOAK_COMBAT: "§RМаскировка в бою невозможна§!"
