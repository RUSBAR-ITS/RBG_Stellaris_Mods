 CLOAKING_STRENGTH_3_DESC: "\nЭта флотилия способна разворачивать маскировочное поле номинальной стабильности с некоторыми ограничениями на $CLOAKING_PENALTY_MODS$."
 CLOAKING_STRENGTH_4_DESC: "\nЭта флотилия способна разворачивать высокостабильное маскировочное поле с малозначительными ограничениями на $CLOAKING_PENALTY_MODS$."
 CLOAKING_STRENGTH_5_DESC: "\nЭта флотилия способна разворачивать весьма стабильное маскировочное поле с незначительными ограничениями на $CLOAKING_PENALTY_MODS$."
