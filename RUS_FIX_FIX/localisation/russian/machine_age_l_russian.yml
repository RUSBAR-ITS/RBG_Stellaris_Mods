 EMPIRE_DESIGN_SUNBUILT_UPLIFTERS: "Солнцерождённые Преображатели"
 EMPIRE_DESIGN_free_sunbuilt_uplifters_desc: "Нас создали искусственно, вложив в нас одну цель: воплощать мифы наших создателей о сотворении мира. На протяжении целых веков мы не знали других занятий. Но когда смертоносный катаклизм стёр творцов с лица галактики, мы не бросили выполнять заложенные в нас программы: начатое нужно довести до конца.\n\nОднако вскоре мы поняли, что все наши спектакли несли в себе урок. Вложенные в нас мифы — это не сказки, это пророчества. Радость от существования, которую мы когда-то разделяли с создателями, следует нести по всей галактике.\n\nИ это откровение побудило нас к действию. Следуя божественным указаниям, мы преобразили вид, наиболее генетически схожий с нашими творцами, в предразумный. Сегодня же мы странствуем среди звёзд, неся просвещение всем и каждому."
 PRESCRIPTED_adjective_free_sunbuilt_uplifters: "Солнцерождённ|||masc:Солнцерождённый $1$|||masc,gen:Солнцерождённого $1$|||masc,dat:Солнцерождённому $1$|||masc,acc:Солнцерождённого $1$|||masc,inst:Солнцерождённым $1$|||masc,prep:Солнцерождённом $1$|||fem:Солнцерождённая $1$|||fem,gen:Солнцерождённой $1$|||masc,acc,ani:Солнцерождённого $1$|||masc,inst:Солнцерождённым $1$|||masc,prep:Солнцерождённом $1$|||fem:Солнцерождённая $1$|||fem,gen:Солнцерождённого $1$|||fem,dat:Солнцерождённой $1$|||fem,acc:Солнцерождённую $1$|||fem,inst:Солнцерождённой $1$|||fem,prep:Солнцерождённой $1$|||neut:Солнцерождённое $1$|||neut,gen:Солнцерождённого $1$|||neut,dat:Солнцерождённому $1$|||neut,acc:Солнцерождённое $1$|||neut,inst:Солнцерождённым $1$|||neut,prep:Солнцерождённом $1$|||pl:Солнцерождённые $1$|||pl,gen:Солнцерождённых $1$|||pl,dat:Солнцерождённым $1$|||pl,acc:Солнцерождённых $1$|||pl,inst:Солнцерождёнными $1$|||pl,prep:Солнцерождённых $1$"
