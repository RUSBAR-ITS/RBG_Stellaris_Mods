 cosmogenesis_victim: "Последствия"
 cosmogenesis_victim_desc: "В галактике бушевали беспощадные и разрушительные гравитационные аномалии."

 ##########################
 # CYBERNETIC CREED ORIGIN
 ##########################
 origin_cybernetic_creed: "Кибернетический культ"
 origin_cybernetic_creed_desc: "§RВнимание! Будет доступен только ['concept_cybernetic_ascension', кибернетический] путь возвышения.§!\n\nЭто общество следует божественному призванию, стремясь к слиянию пречистого тела со священной механикой. Имплант — новый бог."
 origin_tooltip_cybernetic_creed_effects: "$t$- $HOMEWORLD$ £building£ ['concept_cybernetic_creed_infrastructure']\n$t$- Вскоре после начала игры появляются фракции ['concept_cybernetic_creed', кибернетического культа]\n$t$- $SPECIES_TRAITS$ ['trait:trait_cyborg_ritualistic_implants']\n$t$- $GUARANTEED_RESEARCH_OPTION_STRING$\n$tt$- £engineering£ ['concept_integrated_cybernetics', $tech_integrated_cybernetics$]\n$t$- Доступные должности:\n$tt$- ['concept_cybernetic_creed_jobs']"
 START_SCREEN_CYBERNETIC_CREED: "Нас ведёт сакральное стремление объединить [Owner.Species.GetFleshTypeCyberCreed&acc] и машину. История нашего народа знает немало неудачных экспериментов, но сегодня божественная воля указывает нам путь. Разработав ритуальные импланты, мы сделали первый шаг на пути к священному симбиозу.\n\nОднако подлинный потенциал кибернетики ещё только предстоит познать. Эти импланты — ничто по сравнению с тем, что ждёт нас в дальнейшем.\n\nИ всё же в наших рядах ещё нет согласия. Представители разных конфессий спорят друг с другом, какой должна стать вершина нашего развития. Как только мы найдём ответ на этот вопрос, новый священный союз [Owner.Species.GetFleshTypeCyberCreed&gen] и технологий поможет нам избавиться от эволюционных ограничений.\n\n$machine_age.1090.pray$"
 START_SCREEN_CYBERNETIC_CREED_NOMADS: "Нас ведёт сакральное стремление объединить [Owner.Species.GetFleshTypeCyberCreed&acc] и машину. Мы, рождённые в пустоте, давно поняли, что единственный способ выжить в космосе — это усовершенствовать свою плоть. История нашего народа знает немало неудачных экспериментов, но сегодня божественная воля указывает нам путь. Разработав ритуальные импланты, мы сделали первый шаг на пути к священному симбиозу.\n\nОднако подлинный потенциал кибернетики ещё только предстоит познать. Эти импланты — ничто по сравнению с тем, что ждёт нас в дальнейшем.\n\nИ всё же в наших рядах ещё нет согласия. Представители разных конфессий спорят друг с другом, какой должна стать вершина нашего развития. Как только мы найдём ответ на этот вопрос, новый священный союз [Owner.Species.GetFleshTypeCyberCreed&gen] и технологий поможет нам избавиться от эволюционных ограничений. Мы превратимся в новый вид, станем истинными детьми пустоты и будем путешествовать по ней без страха.\n\n$machine_age.1090.pray$"
