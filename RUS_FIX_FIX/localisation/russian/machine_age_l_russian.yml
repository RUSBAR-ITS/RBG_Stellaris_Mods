 cosmogenesis_alloy_ductility_bad_desc: "Внесённая в реальность поправка сделала сплавы более хрупкими."
 cosmogenesis_altered_nutrition: "Модифицирование питательности"
 cosmogenesis_altered_nutrition_desc: "Внесённая в реальность поправка сделала пищу более питательной."
 cosmogenesis_altered_nutrition_bad: "$cosmogenesis_altered_nutrition$"
 cosmogenesis_altered_nutrition_bad_desc: "Внесённая в реальность поправка сделала пищу менее питательной."
 cosmogenesis_shroud_tear: "Истончение барьера с Покровом"
 cosmogenesis_shroud_tear_desc: "Грань между нашим измерением и Покровом слегка размылась."
