 ### Auto-Modding Traits
 automodding_trait_tooltip_all: "['concept_automodding_traits', $concept_automodding_traits$] автоматически подстраиваются под выполняемую £pop£ поселением задачу."
 automodding_trait_biological_tooltip: "$automodding_trait_tooltip_all$\n\n§Y$trait_auto_mod_biological$§! выбирают модификаторы из ['concept_automodding_biological', ряда биологических признаков]"
 automodding_trait_robotic_tooltip: "$automodding_trait_tooltip_all$\n\n§Y$trait_auto_mod_robotic$§! выбирают модификаторы из ['concept_automodding_robotic', ряда механических признаков]"
 automodding_trait_overtuned_tooltip: "$automodding_trait_tooltip_all$\n\n§Y$trait_auto_mod_overtuned$§! выбирают модификаторы из ['concept_automodding_overtuned', ряда разогнанных признаков]"
 automodding_trait_cyborg_tooltip: "$automodding_trait_tooltip_all$\n\n§Y$trait_auto_mod_cyborg$§! выбирают модификаторы из ['concept_automodding_cyborg', ряда кибернетических признаков]"
 trait_auto_mod_biological: "Профессиональная геномика"
 trait_auto_mod_biological_desc: "Генные нити снабжены эпигенетическими триггерами, обеспечивающими приспособление к специфике рабочего места. Благодаря этому происходит динамическая оптимизация экспрессии гена под условия труда его носителя."
 trait_auto_mod_cyborg: "Универсальные аугментации"
 trait_auto_mod_cyborg_desc: "Универсальные порты подключения позволяют заменять аугментации по мере необходимости, чтобы всегда соответствовать производственным требованиям."
 trait_auto_mod_robotic: "Адаптивные тела"
 trait_auto_mod_robotic_desc: "Эта система способна проводить динамическую реконфигурацию компонентов, чтобы соответствовать производственным требованиям, и подстраивать производительность под различные задачи."
 trait_auto_mod_overtuned: "Скоротечное совершенство"
 trait_auto_mod_overtuned_desc: "Современные эпигенетические триггеры значительно повышают физическую и умственную работоспособность за счёт резкого уменьшения продолжительности жизни. Ведь лучше вспыхнуть, чем медленно тлеть."
 concept_automodding_trait: "Адаптивный признак"
 concept_automodding_traits: "Адаптивные признаки"
 concept_automodding_trait_desc: "- В зависимости от должности модификаторы объединяются с другими из определённого списка признаков.\n- Эффекты признаков масштабируются в зависимости от того, какой процент группы поселений ими обладает.\n- Ежемесячно проходящие проверку £pop£ §Hпоселения§!, у которых есть §Y$concept_automodding_traits$§! (в каждой колонии): §G100§!\n- £building£ Сооружения для прироста и сборки поселений увеличивают количество ежемесячно обновляемых £pop£ §Hавтомодифицируемых поселений§!"
 concept_automodding_biological: "Список биологических признаков для автомодификации"
 concept_automodding_biological_desc: "- ['trait:trait_traditional']\n- ['trait:trait_thrifty']\n- ['trait:trait_intelligent']\n- ['trait:trait_industrious']\n- ['trait:trait_agrarian']\n- ['trait:trait_ingenious']\n- ['trait:trait_charismatic']"
 concept_vocational_traits: "Профессиональные признаки"
 concept_vocational_traits_desc: "$concept_vocational_traits$ — это расовые признаки, которые поселения с признаком ['trait:trait_auto_mod_biological'] получают автоматически в зависимости от занимаемой должности.\n$concept_automodding_biological_desc$"
 concept_fleeting_excellence_traits: "Признаки скоротечного совершенства"
 concept_fleeting_excellence_traits_desc: "$concept_fleeting_excellence_traits$ — это расовые признаки, которые поселения с признаком ['trait:trait_auto_mod_overtuned'] получают автоматически в зависимости от занимаемой должности.\n$concept_automodding_overtuned_desc$"
 concept_automodding_overtuned: "Список разогнанных признаков для автомодификации"
 concept_automodding_overtuned_desc: "- ['trait:trait_expressed_tradition']\n- ['trait:trait_commercial_genius']\n- ['trait:trait_artificial_intelligence']\n- ['trait:trait_crack_miner']\n- ['trait:trait_farm_hands']\n- ['trait:trait_technical_skill']\n- ['trait:trait_crafted_smiles']"
 concept_adaptive_frames_traits: "Признаки адаптивных тел"
 concept_adaptive_frames_traits_desc: "$concept_adaptive_frames_traits$ — это расовые признаки, которые поселения с признаком ['trait:trait_auto_mod_robotic'] получают автоматически в зависимости от занимаемой должности.\n$concept_automodding_robotic_desc$"
 concept_automodding_robotic: "Список механических признаков для автомодификации"
 concept_automodding_robotic_desc: "- ['trait:trait_robot_propaganda_machines']\n- ['trait:trait_robot_trading_algorithms']\n- ['trait:trait_robot_logic_engines']\n- ['trait:trait_robot_power_drills']\n- ['trait:trait_robot_harvesters']\n- ['trait:trait_robot_superconductive']\n- ['trait:trait_robot_emotion_emulators']"
 concept_universal_augmentations_traits: "Признаки универсальных аугментаций"
 concept_universal_augmentations_traits_desc: "$concept_universal_augmentations_traits$ — это расовые признаки, которые поселения с признаком ['trait:trait_auto_mod_cyborg'] получают автоматически в зависимости от занимаемой должности.\n$concept_automodding_cyborg_desc$"
 concept_automodding_cyborg: "Список кибернетических признаков для автомодификации"
 concept_automodding_cyborg_desc: "- ['trait:trait_cyborg_propaganda_machines']\n- ['trait:trait_cyborg_trading_algorithms']\n- ['trait:trait_cyborg_logic_engines']\n- ['trait:trait_cyborg_power_drills']\n- ['trait:trait_cyborg_harvesters']\n- ['trait:trait_cyborg_superconductive']\n- ['trait:trait_cyborg_stainless_steel_smile']"

