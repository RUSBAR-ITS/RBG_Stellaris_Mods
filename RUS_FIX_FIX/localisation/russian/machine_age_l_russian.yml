 # Player Facing Situation Events
 crisis.8999.name: "Королева вернулась"
 crisis.8999.desc: "Идеи Сетаны вызывают у нас беспокойство, а её действия наводят на мысли о наличии у неё скрытых целей.\n\nНам нужно выделить средства на то, чтобы выяснить её истинные намерения, но при этом не навлечь на себя её гнев."
 crisis.8999.a: "Возможно ли её остановить?"
 crisis.8999.a.tooltip: "Внезапное появление Сетаны — это уникальная ситуация, которую нельзя оставлять без внимания."
 crisis.9000.name: "Нарушение связи"
 crisis.9000.desc: "Мы обнаружили частоту, которой пользуются конвои и станции Сетаны для передачи сигналов бедствия.\n\nЕсли действовать быстро и решительно, мы можем устраивать налёты, при этом не выдавая себя. Однако каждый такой налёт должен оканчиваться победой, иначе мы лишь навлечём на себя гнев Сетаны."
 crisis.9000.a: "Что же возят эти конвои?"
 crisis.9000.a.tooltip: "Победы над конвоями и форпостами Сетаны больше не будут накладывать штрафы на отношения с Сетаной."
 crisis.9010.name: "Прорыв"
 crisis.9010.desc: "До сегодняшнего дня технологическое превосходство Сетаны надёжно защищало её от атак. Однако благодаря стараниям учёных мы стали лучше понимать, как именно устроена её оборона. Теперь, вооружившись этим знанием, мы можем попытаться её преодолеть.\n\nЭта новая технология может оказаться палкой о двух концах. Она позволит нам наконец-то вступить в открытый конфликт с самопровозглашённой королевой, однако после этого не останется никаких сомнений в нашей непокорности."
 crisis.9010.a: "Нужно подготовиться. От этого зависит судьба нашей галактики."
 crisis.9010.a.tooltip: "Скоро нам придётся вступить в открытое столкновение с Сетаной. Любой акт агрессии, с её стороны или нашей, раскроет карты и приведёт к началу полномасштабной войны на уничтожение."

