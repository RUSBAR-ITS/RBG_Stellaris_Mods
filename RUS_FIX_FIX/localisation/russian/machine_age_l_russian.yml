 civic_machine_obsessional_directive: "Навязчивая директива"
 civic_machine_obsessional_directive_desc: "Первостепенная директива этого машинного разума — бесконечное производство товаров и повышение прибыли без учёта того, что задавшие программу создатели уже давно исчезли. Ничто не может остановить постоянного роста производственных планов."
 civic_machine_obsessional_directive_effects: "$t$- Есть инцидент §Y$situation_paperclips$§!, который даёт награды по завершении, если удалось выполнить производственные планы\n$t$- Для §Yдуговой печи§! доступен метод производства §YИзготовление товаров§!"

