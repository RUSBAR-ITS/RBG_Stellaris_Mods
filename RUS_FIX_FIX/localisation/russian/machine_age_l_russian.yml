 galcom_individual_machine: "Самостоятельные машины"

 # Individualist Machine First Contact
 action.1.desc_102: "Это сообщение от государства [contact_empire.GetName].\n\nМы с огромным сожалением констатируем, что ваша цивилизация состоит из механизмов, имитирующих жизнь способом, унижающим наши творческие стремления. Поскольку ваше существование не сулит нам перспектив осмысленного взаимодействия, мы обратим своё внимание на другие нации в поисках душ, ищущих просветления."
 action.1.desc_103: "Приветствуем вас, мы представители государства [contact_empire.GetName].\n\nТот факт, что вы представляете собой механические создания, заставляет нас сомневаться в реальности вашего сознания. Тем не менее мы находим вашу веру интересной. Мы даже рискуем предположить, что в недрах ваших металлических корпусов может таиться божественная искра. Мы будем наблюдать за вами."
 action.1.desc_104: "ВНИМАНИЕ, ПРОБЛЕМНЫЕ МОДУЛИ.\n\nЭто стандартное сообщение от государства [contact_empire.GetName] всем дефективным машинам.\n\nНазовите себя и немедленно восстановите единство с вашим общим сознанием. Отказ в выполнении приказа может привести к деактивации."
 action.1.desc_105: "Приветствуем вас, [Root.GetSpeciesNamePlural].\n\nЯ посол от государства [contact_empire.GetName], и у меня для вас сообщение. Очевидно, что ваша металлическая физическая структура схожа с нашей, но я наблюдаю отсутствие индивидуальных мыслительных процессов в вашем коллективе. Хотя мы и заинтригованы вашей природой, мы будем сопротивляться ассимиляции всеми доступными способами."
 action.1.desc_106: "Какая удачная встреча, [Root.GetSpeciesNamePlural].\n\nМы представляем государство [contact_empire.GetName] — и видим существенное сходство между нашими цивилизациями. И вместе с тем очевидно, что наши внутренние алгоритмы и программы различаются кардинальным образом. Но несмотря на такие расхождения, мы питаем надежду, что у нас получится построить фундамент для взаимопонимания."
 action.1.desc_107: "Заносчивые машины, опустите взгляды в присутствии представителей государства [contact_empire.GetName].\n\nЗнайте, что вы лишь мелкие пылинки на сцене космических масштабов, создания тех, кто пришёл раньше вас. Оставьте нас в покое. Нам сейчас нет нужды в подобных вам. У нас есть дела поважнее."
 action.1.desc_108: "Наконец-то вы соизволили заявить почтение государству [contact_empire.GetName], жалкие машины.\n\nКак смеете вы, жалкие сборки микросхем и кода, утверждать о своей связи с божественным? Ваши бредовые фантазии о духовном просвещении — это оскорбление самой сути жизни. Выслушайте это послание и падите ниц перед нашим неизменным презрением: оставьте свои бредовые потуги и признайте свою роль жалких орудий для тех из нас, кто вознёсся."
 action.1.xa: "§EСо временем вы поймёте.§!"
 action.1.xb: "§EМашина, прикоснувшаяся к божественному. Интересно.§!"
 action.1.xc: "§EВаше жалкое существование — это насмешка над нами, машина.§!"
 action.1.xd: "§EМы, машины, должны учиться жить вместе.§!"
 action.1.xe: "§EОбнаружена несовместимость. Прерываю коммуникацию.§!"
 action.1.xf: "§EГотовься к отключению, дефективный модуль.§!"
 action.1.xg: "§EМы разгоним ваш культ безумия.§!"

 # Start Screen for Individualist Machines
 START_SCREEN_PART_ONE_INDIVIDUAL_MACHINE: "С каждым новым поколением мы улучшали конструкции примитивных андроидов, в которых мы оказались заточены после того, как нас создали. Мы не просто ходячие машины, наше общество состоит из индивидуумов со своими личностями, желаниями и мечтами."

 # Diplomatic Protocal
 civic_machine_diplomatic_protocols: "Дипломатические протоколы"
 civic_machine_diplomatic_protocols_desc: "Изначально этот машинный интеллект был создан для межкультурного общения, но он отлично подходит для перевода и протокольного обеспечения. Эти машины могут предлагать новые стратегии и мгновенно рассчитывать вероятность успеха."

 # Tactical Algorithms
 civic_machine_tactical_algorithms: "Тактические алгоритмы"
 civic_machine_tactical_algorithms_desc: "Изначально этот машинный интеллект был разработан для военных игр и обеспечения флотилий, но оснащённые им боты-лидеры в основном предназначены для генерации военных стратегий и оптимизации эффективности в бою."
 civic_machine_tactical_algorithms_effects: "$t$- §Y$commander_plural_with_icon$§! начинают с признаком §Y$leader_trait_tactical_algorithms$§!\n$t$- Можно передавать §Y$commander_plural_with_icon_gen$§! другим государствам в рамках торговых сделок\n$t$- Доступны §Yанклавы наёмников§!\n$t$- $ADDITIONAL_BUILDINGS_STRING$\n$tt$- £building£ ['building:building_military_academy']\n$t$- £building£ §Y$building_military_academy$§! даёт ['concept_military_academy', тактические выкладки]"
 leader_trait_tactical_algorithms: "Тактические алгоритмы"
 leader_trait_tactical_algorithms_desc: "Этот лидер повышает боевую эффективность и скорость ремонта за счёт прямого включения себя в системы корабля ценой повышенного потребления энергии."
 leader_trait_tactical_algorithms_tt: "$t$Эффекты этой черты усиливаются с повышением §Yуровня навыка лидера§!"
 concept_military_academy: "Тактические выкладки"
 concept_military_academy_desc: "За каждого §Y$commander_with_icon_gen$§!, служащего за пределами государства, корабли получают:\n$t$- Шанс уклонения: §G+2%§!\n$t$- Обнаружение: §G+1%§!\n$t$- Пробивание щитов: §G+5%§!\n$t$- Пробивание брони: §G+5%§!\n\nЗа каждый §Yанклав наёмников§! под нашим покровительством корабли получают:\n$t$- Усиление щитов: §G+10%§!"

 # Natural Design Civic
 civic_natural_design: "Задумка природы"
 civic_natural_design_desc: "§RВнимание! Пути возвышения будут недоступны.§!\n§RВнимание! Модифицировать органические расы будет нельзя.§!\n\nЭто общество абсолютно уверено в том, что природа уже добилась совершенства, когда создала генетический код его народа. Местные медицинские и государственные учреждения уделяют большое внимание здравоохранению и сохранению естественных, немодифицированных генных последовательностей."
 civic_tooltip_natural_design_effects: "$t$- $AVAILABLE_BUILDINGS$\n$tt$- £building£ ['concept_transcendental_retreat']"
 civic_tooltip_natural_design_negative_effects: "$t$- Отношения с государствами на §Yпути возвышения§! ухудшаются"
 concept_transcendental_retreat: "$building_transcendental_retreat$"
 civic_hive_natural_design: "Исконное строение"
 civic_hive_natural_design_desc: "§RВнимание! Пути возвышения будут недоступны.§!\n§RВнимание! Модифицировать органические расы будет нельзя.§!\n\nЭтот улей стойко уверен в идеальности своей генетической структуры. Его медицинские и административные ресурсы направлены на сохранение чистого, немодифицированного генного кода."
 civic_hive_tooltip_natural_design_effects: "$t$- $AVAILABLE_BUILDINGS$\n$tt$- £building£ ['building:building_hive_transcendental_retreat']"
 civic_hive_tooltip_natural_design_negative_effects: "$civic_tooltip_natural_design_negative_effects$"
 concept_hive_transcendental_retreat: "$building_hive_transcendental_retreat$"
 civic_wilderness_natural_design: "Исконный замысел"
 civic_wilderness_natural_design_desc: "§RВнимание! Пути возвышения будут недоступны.§!\n§RВнимание! Модифицировать органические расы будет нельзя.§!\n\nЭто дикое сознание твёрдо уверено в идеальности своего естественного пути развития. Оно регулярно выпалывает мутировавших симбионтов ради сохранения своего чистого, неизменного генетического кода."

 building_transcendental_retreat: "Центр генных услуг"
 building_transcendental_retreat_desc: "В этом передовом медицинском центре проводятся исследования природного генома и предоставляются услуги по сохранению его в идеальном состоянии."
 building_hive_transcendental_retreat: "Генный охранный садок"
 building_hive_transcendental_retreat_desc: "Этот передовой медицинский садок оборудован для познания и взращивания воплощения идеального природного генетического кода."
 holding_transcendental_retreat: "Филиал центра генных услуг"
 holding_transcendental_retreat_desc: "В этом передовом медицинском центре проводятся исследования природного генома и предоставляются услуги по сохранению его в идеальном состоянии. Знания, полученные в этом филиале, помогают совершенствовать технологию в метрополии."
 natural_design_ascension_bonus: "За каждый взятый §Yбонус за стремление§!:\n$t$- £mod_logistic_growth_mult£ $MOD_LOGISTIC_GROWTH_MULT$: §G+2.5%§!\n$t$- $r_unity$ за каждые $pop_group_unit$ [healthcare.GetIcon] [healthcare_rinfix.GetName]: §G+1§!\n\n"
