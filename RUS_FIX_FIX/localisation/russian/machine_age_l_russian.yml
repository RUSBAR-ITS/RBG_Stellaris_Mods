 machine_age.1100.name: "Будущее нашей веры"
 machine_age.1100.desc: "Сегодня мы слились воедино — не только телом и умом, но и душой. Никакие догмы больше не властны над нами. Божественное слияние — личный путь для каждого верующего и единый для всех нас.\n\n$machine_age.govswapnotice$\n\n$machine_age.1090.pray$"
 machine_age.1100.a: "Наша вера крепка, как союз [Owner.Species.GetFleshTypeCyberCreed&gen] и машины."
