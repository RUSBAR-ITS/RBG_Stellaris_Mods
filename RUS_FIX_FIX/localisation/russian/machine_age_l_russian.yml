 pft_cyber_creed_labor: "$CYBERCREED_labor$"
 pft_cyber_creed_labor_desc: "Коммуна Труда неустанно присматривает за всеми смиренными послушниками и их имплантами, движимая искренней верой в священность трудолюбия. Познать божественное может только тот, кто своим потом окропляет землю.\n\n§LПринцип «Спиритуализм»§!"
 cyber_creed_labor: "$CYBERCREED_labor$"
 pft_cyber_creed_war: "$CYBERCREED_war$"
 pft_cyber_creed_war_desc: "Храмовники Стали стоят на страже наших священных тел, душ и кибернетики. Их импланты — важнейший элемент суровых учений и боевых умений.\n\n§LПринцип «Спиритуализм»§!"
 cyber_creed_war: "$CYBERCREED_war$"
 pft_cyber_creed_construction: "$CYBERCREED_construction$"
 pft_cyber_creed_construction_desc: "Братство Молота производит продукцию высочайшего качества. Благодаря своим имплантам они стали лучшими ремесленниками в нашем государстве.\n\n§LПринцип «Спиритуализм»§!"
 cyber_creed_construction: "$CYBERCREED_construction$"
 pft_cyber_creed_research: "$CYBERCREED_research$"
 pft_cyber_creed_research_desc: "Хор Разума — это подобный улью коллектив исследователей и инженеров. В медитативном трансе они способны мгновенно обмениваться информацией со своими собратьями по вере.\n\n§LПринцип «Спиритуализм»§!"
 cyber_creed_research: "$CYBERCREED_research$"
 pft_cyber_creed_general: "Объединённые конфессии"
 pft_cyber_creed_general_desc: "Объединённые конфессии под руководством временного союза техножрецов избавились от всех радикальных верований. Это совершенно не пошатнуло их стремление осуществить божественное слияние — наоборот, теперь никакие догмы не станут мешать этому славному свершению.\n\n§LПринцип «Спиритуализм»§!"
