 concept_mega_engineering_desc: "- $MOD_COUNTRY_RESOURCE_MAX_ADD$: §G+20000§!\n- §I$UNLOCKS_FEATURE$§! «Восстановление мегасооружений» \n\n§L$tech_mega_engineering_desc$§!"

 machine_age.3400.name: "Топливо для кузни"
 machine_age.3400.desc: "Даже издали система [From.GetName&gen] казалась идеальным кандидатом. Теперь же, после полного исследования системы, сомнений не осталось: расплавленный мир и газовый гигант, обилие астероидов и лун — идеальное место для новой дуговой печи.\n\nСледующим логичным шагом станет отправка строительного корабля и начало работ. Пора зажечь печь."
 ideal_furnace_system_poi: "Идеальная система-кузня"
 ideal_furnace_system_name: "[From.GetName]"
 ideal_furnace_system_desc: "Идеальная система для постройки второй дуговой печи."
 ideal_furnace_system: "Обнаружена идеальная система"
 ideal_furnace_chain_title: "Топливо для кузни"
 ideal_furnace_chain_desc: "Мы обнаружили идеальную систему для постройки второй дуговой печи."
 machine_age.3405.name: "Дуговой горизонт"
 machine_age.3405.desc: "Дуговая печь в нашей родной системе доказала жизнеспособность концепции и стала свидетельством наших амбиций и гениальности. Теперь в системе [from.GetName&gen] пылает вторая печь.\n\nРезультат наших трудов станет не просто источником ресурсов. Он открывает двери созданию проектов титанических размеров и масштабов. Мы словно бы оказались на грани бескрайнего горизонта, будущее открыто перед нами.\n\nНас не сдерживает ничего, кроме нашего воображения."

 ##########################
 # SYNTHETIC FERTILITY
 ##########################
 # Event Chain
 synthetic_fertility_chain_title: "$origin_synthetic_fertility$"
 synthetic_fertility_chain_desc: "Мы лишились способности к размножению. Наш родной мир полон брошенных образовательных центров. Детские площадки опустели. Однажды настанет день, когда умрёт последний представитель нашего народа. Нашей надеждой является репозиторий личностей.\n\nДля возвращения в реальный мир мы должны разработать синтетические тела и достаточно сложный позитронный мозг."

 # Origin Text
 origin_synthetic_fertility: "Синтетическая репродуктивность"
 origin_synthetic_fertility_desc: "§RВнимание! Будет доступен только ['concept_synthetic_ascension', синтетический] путь возвышения.§!\n\nКогда-то это общество процветало, но новая генетическая болезнь лишила эту расу способности к размножению. Оказавшись перед лицом вымирания, они решили доверить своё будущее цифровому спасению."
 origin_tooltip_synthetic_fertility_effects: "$t$- $INITIAL_POPS$ §G+900§!\n$t$- $SPECIES_TRAITS$ ['concept_pathogenic_genes']\n$t$- $HOMEWORLD$\n$tt$- Размер: £planetsize£ 20\n$tt$- £blocker£ ['concept_abandoned_cities']: +2\n$tt$- £building£ ['concept_identity_repository']\n$tt$- £building£ ['concept_abandoned_gene_clinic']\n$t$- Инцидент: ['concept_identity_rescue']\n$t$- $ADDITIONAL_TECHNOLOGIES_STRING$\n$tt$- ['concept_synth_ai']\n$t$- $GUARANTEED_RESEARCH_OPTION_STRING$\n$tt$- £engineering_research£ ['concept_robotic_workers']"
 origin_tooltip_synthetic_fertility_negative_effects: "- £pop£ §HНаселение§! убывает"
 START_SCREEN_SYNTHETIC_FERTILITY: "Ранние попытки работать с искусственным сознанием привели к революции и породили полноценное цифровое сообщество, размыв грань между физическим и виртуальным мирами. Успех был настолько значительным, что мы расслабились, поверив, что у нас будет ещё множество поколений для инноваций и исследований.\n\nМы ошибались.\n\nКогда новая болезнь атаковала наш генетический код, мы лишились способности к размножению. Наши лучшие умы оказались не в силах найти лекарство. Старение и сокращение населения привело к панике.\n\nВ отчаянии мы расширили цифровое хранилище и создали достаточно «пространства» для сохранения своих личностей. Но такой ли жизни мы желаем? Теперь нашей главной целью стало создание синтетических тел и достаточно сложного позитронного мозга, которые позволили бы нам остаться в физическом мире."

 # Concepts
 concept_synthetic_ascension: "Синтетическое возвышение"
 concept_synthetic_ascension_desc: "$ap_synthetic_evolution_desc$"
 concept_pathogenic_genes: "$trait_pathogenic_genes$"
 concept_pathogenic_genes_desc: "- §RНе могут колонизировать планеты или переселяться§!\n- §RНе могут размножаться естественным путём§!\n\n§L$trait_pathogenic_genes_desc$§!"
