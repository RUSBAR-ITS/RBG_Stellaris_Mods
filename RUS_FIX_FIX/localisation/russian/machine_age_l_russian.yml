 machine_age.1070.h.tooltip: "$machine_age.1070.intro$ изучению тайн вселенной."
 machine_age.1070.i: "Трудовая десятина."
 machine_age.1070.i.tooltip: "$machine_age.1070.intro$ производству товаров первой необходимости."
