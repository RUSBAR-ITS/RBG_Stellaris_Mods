 leader_trait_robotic_surrogate_desc: "Этот громоздкий и медленный робот является суррогатом для оцифрованного лидера из репозитория личностей."

 # Buildings
 building_identity_repository: "Репозиторий личностей"
 building_identity_repository_tt: "Этот репозиторий содержит следующее количество личностей: §Y[Owner.GetTotalIdentities]§!. $building_identity_repository_scaling$"
 building_identity_repository_scaling: "\n\nКаждая личность увеличивает производительность репозитория и стоимость его содержания. Этот показатель распределяется между всеми репозиториями в наших колониях.\n"
 building_identity_repository_desc: "До момента смерти тела разум подвергается оцифровке. В безопасности репозитория мы продолжаем трудиться на благо общества."
 building_abandoned_gene_clinic: "Заброшенная генная клиника"
 building_abandoned_gene_clinic_tt: "§RНельзя снести, заменить или восстановить§!"
 building_abandoned_gene_clinic_desc: "Когда мы потеряли способность производить потомство естественным способом, наше медицинское сообщество соорудило эту современнейшую генную клинику. Как многие другие объекты нашей инфраструктуры, теперь она стоит заброшенная — постоянное напоминание о постигшей нас беде и об острой нужде в новом пути спасения."

 # Situation Events
 machine_age.3100.name: "Цифровое спасение"
 machine_age.3100.desc: "Медицина бессильна, и наш лучший шанс на спасение лежит в оцифровке населения в §Yрепозитории личностей§!. Однако это лишь временное решение. В дальнейшем планируется разработать синтетические тела и сложный позитронный мозг. По нашим расчётам, у нас достаточно времени на завершение исследований, если мы бросим на это все силы.\n\nС помощью передовых ИИ наши лучшие эксперты уже подготовили чертежи роботов, которые станут первым шагом на пути к синтетическому спасению."
 machine_age.3100.a: "Это должно сработать."
 machine_age.3110.name: "Рабочие-роботы"
 machine_age.3110.desc: "Наши исследования роботизированных тел завершены. $building_abandoned_gene_clinic$ превращена в роботостроительные заводы, прототипы усовершенствованы и испытаны. Пока что этим рудиментарным системам недостаёт вычислительных мощностей, чтобы вместить индивидуальные сознания, но они могут частично заменить убывающую рабочую силу. Позитронное подключение позволит обитателям цифрового пространства повышать производительность этих роботов за счёт опыта и знаний.\n\nВ то же время наши системы искусственного интеллекта разработали чертежи новых перспективных андроидов. Наши стареющие инженеры готовы приступить к работе."
 machine_age.3110.a: "Одна стадия завершена."
 machine_age.3110.a.tooltip: "[Root.Capital.GetName]:\n- §Y$building_robot_assembly_plant$§!: §G+1§! \n- £pop£ §HМеханические поселения§!: §G+300§!"
 machine_age.3115.name: "Усовершенствование андроидов"
 machine_age.3115.desc: "Этот прорыв в технологии робототехники позволит нам колонизировать другие планеты, а наше механизированное население теперь сможет выполнять более сложные задачи.\n\nНаши ИИ-системы считают, что следующим шагом нам следует воспроизвести их позитронные матрицы в синтетических телах. Этот серьёзный научный проект позволит нам вернуть оцифрованное сознание в естественный мир."
 machine_age.3115.a: "Нам нельзя сдаваться."
 machine_age.3120.name: "Последний шаг"
 machine_age.3120.desc: "Наша титаническая работа наконец-то увенчалась успехом. Нам удалось создать рабочий позитронный мозг, достаточно сложный, чтобы вместить наши личности.\n\nХоть мы и не можем победить смертность, бремя биологического существования нас скоро перестанет ограничивать."
 machine_age.3120.a: "Пришло время нашего синтетического пробуждения."
 machine_age.3120.a.tooltip: "Чтобы получать эти события, мы должны принять §Yтрадиции синтетиков§!."
 machine_age.3125.name: "Цифровая мечта"
 machine_age.3125.both: "Наши сборочные линии и эксперты по синтетизации готовы запустить грандиозный процесс переноса личностей в позитронные мозги и синтетические тела."
 machine_age.3125.desc: "$machine_age.3125.both$\n\nМы начнём с тех, кто до сих пор проживает в физическом мире в надежде раз и навсегда покончить с генетической болезнью. Расширенные вычислительные мощности синтетического мозга позволят нам даже превзойти возможности старых биологических тел.$synth.105.end$"
 machine_age.3125.nobody.desc: "$machine_age.3125.both$\n\nНе имея присутствия в реальном мире, мы должны как можно скорее построить первый прототип. Расширенные вычислительные мощности синтетического мозга позволят нам даже превзойти возможности старых биологических тел.$synth.105.end$"
 machine_age.3125.a: "Начнём же перенос личностей."
 machine_age.3125.a.tooltip: "Любые оставшиеся биологические поселения начнут переселяться в синтетические тела."
 machine_age.3200.name: "Цифровое чистилище"
 machine_age.3200.desc: "Сбылись наши самые худшие страхи.\n\nПоследние наши физические тела погибли. Хотя оцифрованные сознания удалось спасти и сохранить в репозитории личностей, у нас всё ещё нет технологий переноса разума в искусственный мозг.\n\nПока мы не закончим исследования, нашим цифровым лидерам придётся взаимодействовать с реальным миром через роботов-посредников."
 machine_age.3305.name: "Виртуальное спасение"
 machine_age.3305.desc: "Мы обеспечили выживание нашего народа, перенеся сознания либо в новые синтетические тела, либо в репозиторий личностей.\n\nОднако возникла новая проблема. Созданное нами цифровое «пространство» для оцифрованных личностей задумывалось как временное решение, но обитатели репозитория привыкли к такому существованию и теперь не очень-то хотят возвращаться в реальный мир.\n\nМы могли бы позволить им остаться там, но можно и попытаться убедить их переселиться в новые синтетические тела."
 machine_age.3305.a: "Пусть наслаждаются нирваной."
 machine_age.3305.a.tooltip: "Эти оцифрованные сознания останутся в §Yрепозитории личностей§! и продолжат помогать нашим согражданам."
 machine_age.3305.b: "Мы сильнее вместе."
 machine_age.3305.b.tooltip: "Мы поместим оставшиеся цифровые личности в имеющиеся синтетические тела, а для остальных построим новые носители. §Y$building_identity_repository$§! будет ликвидирован."
 machine_age.3310.name: "Синтетическое перерождение"
 machine_age.3310.desc: "Уже много десятилетий [Root.Owner.GetSpeciesNamePlural] не держали на руках новорождённого младенца. Пускай нам больше никогда не испытать этого чувства, но сегодня у нашего народа снова появилась надежда.\n\nМы разработали §Yличностные комплексы§! — новейшие центры, в которых мы сможем копировать существующие личности, фактически создавая новых соплеменников.\n\nМы можем создавать новые личности, случайным образом комбинируя их из элементов нескольких уже существующих сознаний. Или же мы можем симулировать естественный процесс формирования личности, взращивая «ядра разума» в открытом виртуальном пространстве."
 machine_age.3310.a: "Мы будем смешивать наши умы."
 machine_age.3310.building_tooltip.a.tt: "$unlock_edict_tt$ ['concept_edict_subsidized_identity_backups']\n$unlock_edict_tt$ ['concept_edict_optimized_identity_creation']\n\n$synth.405.a.tt$\n§YДоступно сооружение:§! $building_identity_complex$"
 machine_age.3310.b: "Иногда можно положиться на природу."
 machine_age.3310.building_tooltip.b.tt: "$unlock_edict_tt$ ['concept_edict_subsidized_identity_backups']\n$unlock_edict_tt$ ['concept_edict_optimized_identity_creation']\n\n$synth.405.b.tt$\n§YДоступно сооружение:§! $building_identity_complex$"
 machine_age.3315.name: "Заря эпохи синтетиков"
 machine_age.3315.desc: "Сегодня мы завершаем наш путь к цифровому преобразованию. Никто не сможет отрицать колоссальных размеров проделанной работы и жертв, на которые нам пришлось пойти.\n\nСегодня мы — новая, полностью оцифрованная и синтетическая раса. Теперь нам не страшны болезни. Теперь нас не сковывают ограничения генетики.\n\nМы вольны строить ту реальность, какую захотим."
 machine_age.3315.a: "Да здравствует синтетическое будущее!"
 machine_age.3315.a.tooltip: "Завершает цепочку событий: §Y$origin_synthetic_fertility$§!."
 machine_age.3315.a.tt: "§Y[This.Owner.GetSpeciesNamePlural]§! получают признак ['concept_synthetic_dawn']"

 synthetic_dawn: "Заря синтетиков"
 synthetic_dawn_desc: "Мы наконец преобразили себя, став полностью цифровым синтетическим народом, вольным творить любую реальность по своему желанию."
 trait_robot_synthetic_dawn: "Синтетическое спасение"
 trait_robot_synthetic_dawn_desc: "Эта синтетическая раса отринула своё биологическое прошлое и пришла к расцвету в новом, цифровом облике."

 concept_synthetic_dawn: "$trait_robot_synthetic_dawn$"

