 civic_augmentation_bazaars: "Базары аугментаций"
 civic_augmentation_bazaars_desc: "§RВнимание! Будет доступен только ['concept_cybernetic_ascension', кибернетический] путь возвышения.§!\n\nУдешевление кибернетических продуктов привело к появлению стихийных рынков с продавцами уценённых имплантов, сомнительными клиниками и яркой неоновой рекламой. Синергия плоти и механизмов теперь доступна любому желающему, вне зависимости от уровня доходов."
 civic_tooltip_augmentation_bazaars_effects: "$t$- Доступные признаки при создании расы:\n$tt$- ['concept_universal_augmentations_traits']\n$t$- $AVAILABLE_BUILDINGS$\n$tt$- £building£ ['concept_augmentation_bazaars']\n$t$- $AVAILABLE_HOLDINGS$\n$tt$- £building£ ['concept_augmentation_bazaars_branch']\n$t$- £job_executive£ §Y$job_executive_plural$§! заменяются на £job_augmentation_merchant£ §Yторговцев аугментациями§!"

