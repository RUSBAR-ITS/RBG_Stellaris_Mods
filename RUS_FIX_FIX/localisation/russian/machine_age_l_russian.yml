 cosmogenesis_needle_DESC: "Этот корабль, способный переписывать реальность, одним своим существованием нарушает все законы вселенной. Спроектирован он с одной целью: пробить горизонт событий чёрной дыры и погрузиться прямо в сердце сингулярности, где бесконечная плотность порождает бесконечное тяготение."
 cosmogenesis_needle_MEGASTRUCTURE_DETAILS: "Чтобы вознестись в сотворённую лично нами реальность, нужно переселить всю цивилизацию на Иглу горизонта. Лишь тогда мы сможем навсегда покинуть эту вселенную."

