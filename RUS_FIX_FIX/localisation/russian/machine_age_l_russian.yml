 ##########################
 # ARC WELDERS ORIGIN
 ##########################

 origin_arc_welders: "Дуговые сварщики"
 origin_arc_welders_desc: "Их планета безжизненна, но родная система полна богатств. Для их разработки эти машины построили проект невиданных доселе масштабов. Теперь в небе над их головами нависает могучая §H$tech_orbital_arc_furnace$§! — но её изобретательные создатели стремятся к ещё большему.\n\nГалактика ждёт, возможности бесконечны. Нужно только умение их реализовать."
 origin_tooltip_arc_builders_effects: "$t$- $HOMEWORLD$ Стартовые £district£ ['concept_mining_district', горнодобывающие районы] заменяются на £district£ ['concept_generator_district', энергетические районы]\n$origin_tooltip_arc_builders_nomadic_effects$"
 origin_tooltip_arc_builders_negative_effects: " Размер родного мира: £planetsize£ 15\n$t$$origin_tooltip_arc_builders_nomadic_negative_effects$"
 START_SCREEN_ARC_WELDERS: "После многих лет хищнической эксплуатации поверхность [Root.Capital.GetName&gen] совершенно лишена ресурсов. Но в небесах над ней таятся несметные богатства, и, вооружённые амбициями и изобретательностью, мы готовы построить новый дом в космосе.\n\nСтроительство первого этапа дуговой мечи было колоссальным предприятием, и потенциал его неизмерим. Очевидный следующий шаг — закончить проект и вывести его на полную мощность: только тогда мы сможем добывать ресурсы всей нашей системы. Но что таится за пределами наших границ? Какие невероятные возможности ждут наших талантливых инженеров?\n\nС открытием путешествий быстрее скорости света наши проекты больше не ограничиваются одной системой. Теперь вся галактика — наш чертёжный стол. Пора приступать к работе."
 origin_arc_welders_nomadic: "$origin_arc_welders$"
 origin_arc_welders_nomadic_desc: "Их флотилии всегда в пути, но они наткнулись на столь богатую систему, что пролететь мимо было бы безумием. Чтобы извлечь эти богатства, машины взялись за грандиозный проект — масштабнее всех, что были у них раньше. Теперь могучая §Hдуговая печь§! сковала расплавленный мир, но работа этих искусных инженеров ещё далека от завершения.\n\nГалактика ждёт, возможности бесконечны. Нужно лишь проявить изобретательность."
 origin_tooltip_arc_builders_nomadic_effects: "$t$- $HOME_SYSTEM$ ['concept_pc_molten'] с ['concept_arc_furnace', дуговой печью]\n$t$- $ADDITIONAL_TECHNOLOGIES_STRING$\n$tt$- £engineering_research£ ['concept_orbital_arc_furnace', $tech_orbital_arc_furnace$]\n$t$- После строительства второй §Yдуговой печи§!:\n$tt$- $GUARANTEED_RESEARCH_OPTION_STRING$\n$ttt$- £engineering_research£ ['concept_mega_engineering', $tech_mega_engineering$]"
 origin_tooltip_arc_builders_nomadic_negative_effects: "- $INITIAL_POPS$ §R-300§!"
 START_SCREEN_ARC_WELDERS_NOMADIC: "Мы не любим подолгу оставаться на одном месте, но мы не могли просто пролететь мимо этой системы. Не использовать её богатства было бы глупо. Поэтому мы построили дуговую печь — чудо инженерной мысли, которое превращает неистовую энергию расплавленного мира в материю. Если мы сможем раскрыть весь потенциал нашего изобретения, оно станет отличным подспорьем в снабжении наших флотилий топливом.\n\nНо ресурсы одной системы не безграничны. Во вселенной наверняка есть другие расплавленные миры. Ради повышения эффективности мы должны найти их.\n\nТеперь вся галактика — наш чертёжный стол. Пора приступать к работе."

 concept_arc_furnace: "$orbital_arc_furnace_1$"
 concept_arc_furnace_desc: "$EFFECTS$\n$orbital_arc_furnace_1_mod_tooltip$\n\n§L$tech_orbital_arc_furnace_desc$§!"

 concept_orbital_arc_furnace: "$tech_orbital_arc_furnace$"
