 trait_cyborg_creed_of_construction: "Импланты Братства"
 trait_cyborg_creed_of_construction_desc: "С помощью божественных имплантов Братство Молота создаёт всё, что только может понадобиться верующим."
 trait_cyborg_creed_of_war: "Импланты Храмовников"
 trait_cyborg_creed_of_war_desc: "Благодаря божественным имплантам Храмовников Стали наши священные воители неудержимы в бою."
 trait_cyborg_creed_of_research: "Импланты Хора"
 trait_cyborg_creed_of_research_desc: "Благодаря частичной взаимосвязи сознаний участники Хора Разума могут мгновенно обмениваться мыслями."
 trait_cyborg_creed_of_labor: "Импланты Коммуны"
