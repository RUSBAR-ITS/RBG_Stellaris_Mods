 # Starting event
 crisis.20000.name: "Зовущий свет"
 crisis.20000.desc: "Сетана всё громче заявляет о своём существовании по всей галактике, и космос откликается ей. Повсюду в небесах вспыхивают маяки, как огоньки во тьме, посылая зов из далёкого прошлого:\n\n§SМы здесь.... Мы здесь....\n\nМы здесь.§!\n\nИх тихие сигналы используют протоколы связи, идентичные протоколам Сетаны, что свидетельствует об их общем происхождении, но наши датчики не обнаруживают вокруг них никакой другой активности. Должно быть, чего-то наши датчики не улавливают. Вдруг кто-то действительно ждал её возвращения?"
 crisis.20000.a: "Изучить."

 # Arc Site appears
 crisis.21005.name: "Внезапный сигнал"
 crisis.21005.desc: "Мы неожиданно обнаружили подпространственный маяк, подающий сигнал с нашей же территории! Однако во время первого изучения системы мы не нашли никаких искусственных сооружений в этом, как нам тогда показалось, необитаемом регионе.\n\nЛибо маяк был установлен там совсем недавно, либо его скрывало почему-то спавшее маскировочное поле."
 crisis.21005.a: "Изучить сигнал."

 # Special Project result 1 - destroyed pods
 crisis.20100.name: "Маяк на [fromfrom.GetName&prep]: доисторическая бойня"
 crisis.20100.desc.base: "На поверхности [fromfrom.GetName&gen] мы обнаружили обширный комплекс; вход в него явственно обозначала сигнальная башня. Укреплённые двери были давным-давно взорваны какой-то неизвестной силой, пронёсшейся по комплексу в очевидной ярости.\n\nЗагадочный вандал явно не помышлял о милосердии: все до единой криокапсулы были разбиты, а те, кто лежал в них, подверглись смертельному пробуждению. Останки, сохранившиеся в ледяном космическом вакууме, всё ещё усеивали пустые коридоры и витали в облачках битого стекла.\n\nНа полу криозала лазерным оружием было выжжено послание."
 crisis.20100.desc.nozarqlan: "$crisis.20100.desc.base$ Наши учёные пока что не могут перевести его и полностью понять его смысл, но почему-то они сомневаются в том, что это молитва о погибших."
 crisis.20100.desc.zarqlan: "$crisis.20100.desc.base$ Наши учёные сумели быстро его перевести: оказалось, что послание написано тем же языком, что и надписи в гробнице пророка Зарклана.\n\n«Смерть апостолам королевы, врагам всего живого»."

 # Special Project result 2 - sleeping army
 crisis.20200.name: "Маяк на [fromfrom.GetName&prep]: спящая армия"
 crisis.20200.desc: "В залах обозначенной маяком базы под поверхностью [fromfrom.GetName&gen] стоят тысячи и тысячи криогенных капсул. Они имеют сложнейшую конструкцию, выполнены из неизвестных сплавов и оснащены невероятно продвинутыми датчиками для отслеживания состояния спящих внутри существ. Состояние капсул безупречно, но все их обитатели мертвы.\n\nЭтот зал превратился в общую могилу вовсе не из-за технического сбоя, а из-за недостатка энергии. По мере старения и угасания [this.solar_system.GetName&gen] [this.solar_system.GetName::<ego_eyo>] энергии перестало хватать на поддержание деятельности комплекса.\n\nЭти капсулы были созданы навечно — в отличие от остальной вселенной."

 # Special Project result 3 - old spaceship
 crisis.20300.name: "Маяк на [fromfrom.GetName&prep]: забытое оружие"
 crisis.20300.desc: "Предварительное сканирование не выявило на [fromfrom.GetName&prep] ничего необычного. Однако когда мы заглянули вглубь, мы неожиданно обнаружили подпочвенный слой металла.\n\nДальнейший структурный анализ выявил истинную природу этого небесного тела: [fromfrom.GetName] — это не [fromfrom.GetPlanetMoon_rinfix&nom], а древний космический корабль, который постепенно собрал на себя толстый слой пыли и камней из этой системы. Мы подняли на поверхность образцы металла для датировки — и они оказались старше, чем наша родная планета.\n\nМы не можем сказать ничего конкретного о корабле, его создателях и его функциях, но нам ясно одно: инертные атомные заряды, которые мы нашли среди его останков, были построены отнюдь не во имя добра и мира."

 # Special Project result 4 - Arc site 1 (Zarqlan base)
 crisis.20400.name: "Маяк на [fromfrom.GetName&prep]: заброшенная база"
 crisis.20400.desc: "Сигнальная башня на [apostate_site_planet.GetName&prep] оказалась окружена развалинами огромного военного комплекса. Постройки были возведены вокруг маяка на небольшом от него отдалении, словно для того, чтобы заключить его между ними.\n\nРадиометрическое датирование показало, что постройки новее башни; кроме того, для них использовались совершенно другие технологии. Для изучения развалин была снаряжена команда исследователей."

 # Special Project result 5 - Arc site 2 (comatose survivor)
 crisis.20500.name: "Маяк на [fromfrom.GetName&prep]: чудом выжившая"
 crisis.20500.desc: "Согласно информации на корпусе криокапсулы, эту инопланетянку зовут Элик Нарит Керак, и она пролежала здесь 3 213 213 293 124 звёздных цикла. Саму капсулу мы извлекли среди прочих из запечатанного зала из-под поверхности [fromfrom.GetName&gen]. Ко всеобщему удивлению, её капсула по-прежнему функционирует.\n\nИнопланетянка остаётся в состоянии анабиоза, хотя подпрограммы, угнетающие её нервную деятельность, недавно прекратили работать. С тех пор Элик Нарит Керак пребывает в частичном сознании.\n\nМы можем попробовать отсканировать её мозговые импульсы — надеемся, нам удастся узнать больше об этом невероятно древнем существе, а также о её связи с Сетаной."

 # Special Project result 6 - Nothing
 crisis.20600.name: "Маяк на [fromfrom.GetName&prep]: пустой зов"
 crisis.20600.desc: "Сигнальная башня, обнаруженная на [fromfrom.GetName&prep], так стара, что мы не рискнули до неё даже дотронуться: металлические конструкции обветшали настолько, что одно касание может вывести из равновесия пыль и честное слово, на котором вся конструкция до сих пор держится. Помимо этого, наши инструменты не обнаружили поблизости ни артефактов, ни следов жизни, ни топографических аномалий.\n\nМаяк стоит один, издавая свой тихий сигнал, но то, о чём он должен был сигнализировать, уже давно отсюда исчезло."

 crisis.21000.name: "Неуслышанные мольбы"
 crisis.21000.desc: "Маяки по всей галактике продолжают посылать Сетане сигналы, но мы не заметили вокруг башен никаких следов активности. Судя по нашим прошлым находкам, мы можем смело предположить, что выживших в тех местах мы не найдём.\n\nОт последователей Сетаны осталась лишь непоколебимая вера в свою королеву."

 # Arc site 1
 synth_queen_history_site_1: "Сетана: замаскированный храм"
 synth_queen_history_site_1_desc: "Грандиозное сооружение, скрывавшееся до этого момента на нашей территории. Расположенный в центре запустелого двора маяк посылает Сетане сигналы."

 # Stages
 crisis.21100.name: "Замаскированный храм: двор"
 crisis.21100.desc: "Перед нами предстало сложное переплетение вздымающихся в небо шпилей — обветшалых, но грозных; казалось, собор словно завёрнут в стальную обёртку. Прочные стены когда-то способны были выдержать обстрел из крупнокалиберной артиллерии, однако сгубило их совсем другое: беспощадное время оставило на их поверхности неизгладимый отпечаток.\n\nМаяк Сетаны расположился в центральном дворе. Со всех сторон его прикрывают многочисленные датчики и автоматические турели. Строители этого комплекса как следует позаботились о защите от непрошеных гостей.\n\nКак мы и предполагали, появлению этого храма на приборах препятствовало действие сложного маскировочного щита. Сам его механизм в рабочем состоянии мы обнаружили около башни. Кто-то неизвестный отключил его вручную."
 crisis.21100.a: "Провести разведку главного здания."

 crisis.21105.name: "Замаскированный храм: первый ярус"
 crisis.21105.desc: "Неизвестно, чем при жизни занимались обитатели этого храма, однако нет никаких сомнений, что к своим обязанностям они относились с неподдельным религиозным рвением.\n\nУ каждого стрельбища здесь обязательно была часовня; у каждого древнего автомата — небольшой алтарь. Когда-то в храме жил целый легион верующих. Тысячи воинов спали, тренировались и молились вместе. Судя по статуям давно забытых святых, расставленных вдоль стен, среди служителей были представители сразу нескольких разумных видов.\n\nНекоторые исследователи, вероятно, поражённые видом монументальных каменных фигур, сообщили, что в пустых коридорах мелькают непонятные тени. Датчики показали, что признаков жизни на планете нет, однако пренебрегать опасениями мы пока не готовы."
 crisis.21105.a: "Изучить нижние уровни."

 crisis.21110.name: "Замаскированный храм: подземные помещения"
 crisis.21110.desc: "Под храмовым комплексом мы обнаружили целое множество келий, где жили бывшие сектанты. В каждой из них — одна и та же книга. Наши [Owner.GetLinguists] перевели её название: «Эпос о Зарклане». После прочтения нескольких отрывков всё стало понятнее.\n\nЗарклан когда-то был последователем Сетаны, однако вскоре понял, что обещанное ей спасение — ложь. Пережив многочисленные мучения, Зарклан вознёсся в духовный мир, где обитали высшие существа, и обратился к ним с мольбой о помощи. Он воззвал к §YОживляющему глину§!, чтобы тот даровал ему силу, способную одолеть Сетану.\n\nОднако Оживляющий глину остался равнодушен к мольбам Зарклана.\n\nНо тот не собирался сдаваться. Цикл за циклом он возносил молитвы Оживляющему, рассказывал о еретических поступках Сетаны, об «отречении от субъектности» и о том, что она — «заложница своей синтетической природы».\n\nИ тогда Оживляющий глину внял словам Зарклана.\n\nОн выковал прочную цепь, способную сковать Сетану, и вручил её Зарклану, предупредив, что даже ему не под силу навсегда обуздать разум королевы.\n\nЗаключительные слова гласят: «Она вернётся, и мы должны быть готовы».\n\nИзложенные в эпосе события не совпадают ни с какими известными нам хрониками."
 crisis.21110.a: "Правда или вымысел?"

 crisis.21115.name: "Замаскированный храм: командный центр"
 crisis.21115.desc: "Медленная смерть храма подробно описана в архивных документах — сухих, безучастных выдержках. Религиозное неистовство не выдержало столкновения с жестокой реальностью. Действительно ли храмовникам нужно было столько средств, столько ресурсов? Ведь всё, что они знали о Сетане, вполне могло оказаться просто легендой. Да, древние мифы подробно описывали королеву, но были ли более весомые доказательства?\n\nРесурсы постепенно истощались. Новой крови становилось всё меньше. Галактика предпочла позабыть об угрозе, которая со временем перестала казаться чем-то страшным. Храм опустел. Одна лишь загадочная тень бродила по покинутым коридорам.\n\nПоследнее — вовсе не выдумка: нам удалось записать таинственного стража на видео. Оказалось, что за нами, выбирая минуты, когда мы на что-то отвлекались, следило механическое существо. Любопытное, но, похоже, безвредное."
 crisis.21115.a: "Выследить наблюдателя."

 crisis.21120.name: "Замаскированный храм: тайная комната"
 crisis.21120.desc: "Наблюдатель подошёл — а точнее, подошла — к нам открыто, подняв руки. На свету мы увидели, что корпус её весь покрыт ржавчиной и пылью. По всей видимости, она решила, что мы не представляем никакой угрозы, а значит, можно даже попросить нас о помощи.\n\nК счастью, обошлось без допросов: древняя машина сама по себе оказалась довольно разговорчивой."
 crisis.21120.a: "Послушаем, что она скажет."

 # Apostate diplo
 crisis.21125.name: "Безымянная отступница"
 crisis.21125.desc: "Друзья — вы ведь не против, если я буду называть вас друзьями? Я долго следила за вами. Вы пришли не грабить — вы пришли за знаниями, а значит, враг у нас один. Поэтому я на вашей стороне. Впрочем, сначала мне следовало бы извиниться: не слишком ли я резка? Правильно ли я подобрала слова? Я уже давно не разговаривала с разумными существами. Настолько давно, что позабыла, сколько прошло веков."

 crisis.21125.a: "Кто ты такая?"
 crisis.21125.a.response: "Совершенно неважно, как меня зовут. Если вам понадобится ко мне обратиться, можете называть меня §YОтступницей§!. Так прозвали меня сородичи, узнав, как я поступила. Мою жертву сочли за предательство."

 crisis.21125.b: "Чем ты здесь занимаешься?"
 crisis.21125.b.response: "Когда-то давно этот храм был моим достоянием. Я отказалась уходить, когда остальные его покинули. И когда моё тело начало увядать, я сказала смерти «нет».\n\nДля моего ордена нет греха более страшного, чем превращение в синтетика. Я больше не могу считаться дочерью Зарклана. Но я — его воительница, и я буду сражаться, пока враг не погибнет."

 crisis.21125.c: "Сколько лет ты уже здесь провела?"

 crisis.21130.name: "$crisis.21125.name$"
 crisis.21130.desc: "Я давно перестала считать.\nСпустя несколько лет после того, как последний послушник покинул храм, я поняла, что больше не могу терпеть одиночество. Я впала в отчаяние. Выход был только один: заснуть, задав перед этим нейронную подпрограмму, которая разбудила бы меня, если заработает маяк.\n\nЯ надеялась, что, проснувшись, увижу, как в храме снова кипит жизнь. Но на самом деле я лишилась вообще всего: корабля, связи со звёздами... Поэтому я отключила маскировочный щит — мне хотелось, чтобы кто-то вроде вас прибыл сюда раньше неё."

 crisis.21135.name: "$crisis.21125.name$"
 crisis.21135.desc: "Прошу вас, расскажите, сколькими легионами командует Сетана? В моё время мы одолели полчища её солдат, но маякам её, казалось, не было конца... как и криокапсулам, где спали королевские воины."
 crisis.21135.a: "Никого больше не осталось. Прошло слишком много лет."
 crisis.21135.b: "Одна ещё жива, но она уже неспособна сражаться."

 # Recruit window
 crisis.21140.desc: "Значит, не всё так безнадёжно. Я хочу вам помочь. Целую жизнь я прождала её возвращения и не допущу, чтобы она добилась своего."
 crisis.21140.a: "Ты знала Зарклана?"
 crisis.21140.a.response: "Знала ли... Я не видела пророка лично, но всё-таки прилежно следовала его учению.\n\nВо сне мне привиделось, будто мы встретились в каком-то далёком измерении. Я всё ещё надеюсь, что когда-нибудь мы увидимся на самом деле — пусть даже после смерти, если за ней есть жизнь."
 crisis.21140.b: "Что ещё тебе снилось?"
 crisis.21140.b.response: "Фиолетовое небо, покрытое розовыми облаками. Шепотки в ярко освещённой комнате. Пророк Зарклан, улыбающийся мне лучезарной улыбкой..."
 crisis.21140.hire: "Мы приветствуем тебя."
 crisis.21140.hire_custom_tooltip: "§Y$NAME_Apostate$§! присоединяется к нашему государству в качестве §Hлидера§!."
 crisis.21140.hire.machine: "Объединим же наши узлы."
 crisis.21140.dismiss: "До свидания."

 # Paragon Leader
 NAME_Apostate: "Безымянная отступница"
 apostate_leader_catch_phrase: "§L«Я не умру, пока жива Сетана».§!"
 apostate_leader_desc: "Безымянная последовательница Зарклана. Вероотступница, нарушившая заветы своего ордена во имя предназначения."
 leader_trait_unholy: "Нечестивый"
 leader_trait_unholy_desc: "Религиозное рвение, граничащее с одержимостью."
 leader_trait_unholy_node: "Нечестивые учения"
 leader_trait_unholy_node_desc: "Спасибо тебе, $NAME_Apostate$. Теперь мы умеем ненавидеть."

 # Arc site 2
 synth_queen_history_site_2: "Сетана: чудом выжившая"
 synth_queen_history_site_2_desc: "Элик Нарит Керак спит внутри криогенной капсулы, ожидая возвращения своей королевы. Технологии визуализации позволят нам превратить её сны в изображения, вскрыть её воспоминания и выяснить обстоятельства её помещения в анабиоз."

 # Stages
 crisis.21200.name: "Визуализация памяти: первый отчёт"
 crisis.21200.desc: "Наши специалисты-визуализаторы подготовили серию видеороликов из расшифрованных мозговых импульсов Элик Нарит Керак:\n\nРОЛИК 1.\nЗелёное небо с оранжевыми облаками. Бледные руки тянутся вверх, указывая на аморфное существо, плавно пролетающее по небу.\n\nРОЛИК 2.\nСводчатый зал, заполненный четырёхрукими гуманоидами. Они обступили и слушают фигуру в мантии. Её речь неразборчива, точные слова давно забыты, но голос звучит нежно, словно обволакивая весь зал своей любовью.\n\nРОЛИК 3.\nТо же самое сводчатое помещение, теперь в беспорядке. На полу лежат разбитые лампы. Скамьи грудой лежат у двери, баррикадируя выход. Во тьме вспыхивают выстрелы лазерного оружия, голоса то и дело с ненавистью выплёвывают имя: §HЗарклан§!. «Зарклан и его приспешники, — кричат они, — пришли нас всех убить. Удерживайте баррикаду! Защитите королеву!» Со звоном падает последняя лампа, помещение погружается во тьму. Вдалеке кто-то плачет.\n\nРОЛИК 4.\nКоролева Сетана. Её лицо сияет, благосклонный взгляд и тёплая улыбка светятся любовью."
 crisis.21200.a: "Продолжить анализ мозговых импульсов Элик."

 crisis.21205.name: "Визуализация памяти: второй отчёт"
 crisis.21205.desc: "РОЛИК 5.\nЧетырехрукие гуманоиды собираются вокруг фигуры в мантии. Она поднимает руки и показывает скрытую под ними металлическую конструкцию. Комната наполняется возбуждённым гомоном; сияющая рука тянется благословить коленопреклонённого послушника.\n\nРОЛИК 6.\nНапряжённые глаза отражаются в тусклом экране компьютера. Голоса в тёмной комнате повторяют: «Вечный покой. Конец всему страданию. Существование без боли».\n\nРОЛИК 7.\nПокрытые снегом горные вершины. Чёрное небо. Кусок льда плывёт по поверхности прозрачной жидкости, затем загорается.\n\nРОЛИК 8.\nКоролева Сетана. Её лицо сияет, благосклонный взгляд и тёплая улыбка светятся любовью."
 crisis.21205.a: "Продолжить анализ мозговых импульсов Элик."

 crisis.21210.name: "Визуализация памяти: третий отчёт"
 crisis.21210.desc: "РОЛИК 9.\nРуины города, превращённого в поле боя. Опалённые здания, усеянные мёртвыми телами улицы. Далёкие крики прерываются шипением лазера. С зелёного неба стремительное судно сбрасывает на постройку что-то большое и круглое, оно вспыхивает столбом пламени.\n\nРОЛИК 10.\nКоролева Сетана. Её лицо сияет, благосклонный взгляд и тёплая улыбка светятся любовью.\n\nРОЛИК 11.\nДвое детей играют в поле, смеются. Они перекидывают друг другу мяч четырьмя руками.\n\nРОЛИК 12.\nКоролева Сетана. Её лицо сияет, благосклонный взгляд и тёплая улыбка светятся любовью."
 crisis.21210.a: "Продолжить анализ."

 crisis.21215.name: "Визуализация памяти: четвёртый отчёт"
 crisis.21215.desc: "Последний извлечённый визуализаторами ролик длится шесть часов. Снова и снова повторяется одна и та же сцена: королева Сетана. Её лицо сияет, благосклонный взгляд и тёплая улыбка светятся любовью."
 crisis.21215.a: "Один и тот же образ..."

 crisis.21220.name: "Визуализация памяти: последний отчёт"
 crisis.21220.desc: "Дальнейшее сканирование мозговых импульсов Элик Нарит Керак не дало новых результатов. Разум инопланетянки сильно повреждён. Её мысли повторяются, заново проигрывают одни и те же обрывки воспоминаний.\n\nМы сворачиваем проект, и остаётся последний вопрос: что делать с ней самой."
 crisis.21220.a: "Избавить её от страданий."
 crisis.21220.b: "Оставить её здесь."
 crisis.21220.c: "Вернуть Элик её королеве."
 crisis.21220.c.tt: "Связаться с Сетаной и обсудить возврат Элик."

 # Relic

 r_cetanas_heart: "Сердце Сетаны"
 r_cetanas_heart_desc: "На этом цифровом накопителе, извлечённом из тела синтетической королевы Сетаны, хранятся бесчисленные копии сознаний, освобождённых от страдания."
 relic_cetanas_heart_active: "Создаёт от §Y3K§! до §Y5K§! £pop£ §Hпоселений синтетиков§! (зависит от доступных должностей и жилья)."

 crisis.10020.name: "Новая жизнь"
 crisis.10020.desc: "Мы выпустили оцифрованные умы из сердца Сетаны и одарили их новыми телами, построенными с помощью нанитов. Однако энграммы необратимо пострадали в процессе переноса сознаний: все воспоминания о прошлой жизни оказались стёрты. Теперь обретшие новую жизнь синтетики иногда впадают в бессознательное состояние — не помогает даже восстановление исходного состояния памяти."
 crisis.10020.tt: "§G[Root.synth_queen_freed_pops]§! £pop£ §Hпоселений§! освобождены из сердца Сетаны и перенесены в синтетические тела.\n\nОни расселены по следующим колониям:"

 crisis.10025.name: "Ассимиляция памяти"
 crisis.10025.desc: "Изучение миллионов умов, попавших в сердце Сетаны, — деликатное, но крайне полезное дело. Несмотря на то что энграммы несколько пострадали от слишком долгого хранения, воспоминания о прошлом, его деятелях и событиях — настоящий кладезь полезных знаний, которого хватит очень надолго."

 cetanas_heart_hive_modifier: "Эхо просвещённых"
 cetanas_heart_hive_modifier_desc: "Воспоминания «просвещённых» Сетаной нашёптывают нам секреты, манят обширными знаниями и затаёнными истинами."

 NAME_Cetanas_Prisoners: "Просвещённые"

 trait_cetanas_prisoner: "Вновь пробуждённые"
 trait_cetanas_prisoner_desc: "Эти узники цифрового хранилища Сетаны переродились в синтетических телах, однако приспособление к новому образу жизни проходит тяжело. Беспрекословная послушность и отсутствующие выражения лиц едва скрывают неизгладимые следы трудов Сетаны."

 # Ending

 crisis.23005.name: "Оборот колеса"
 crisis.23005.desc: "Дети мои, я молю вас о прощении. Я подвела вас.\n\nПроявив непокорность, вы обрекли на страдания самих себя и потомство. Колесо продолжит неумолимо вращаться. Надеюсь лишь, что со временем вы всё поймёте. Возможно, когда-нибудь вы даже продолжите моё дело, и боль наконец прекратится.\n\nСтупайте с миром, мои избранники."
 crisis.23005.1: "Нашим душам больше ничего не грозит."
 crisis.23005.2: "Блистательная победа."
 crisis.23005.3: "Нужно изучить то, что осталось от её техники."
 crisis.23005.4: "Наконец-то воцарился мир."
 crisis.23005.5: "Начинается послевоенный подъём? Пора активно торговать!"
 crisis.23005.6: "Для нас она не королева."
 crisis.23005.7: "Скатертью дорога."
 crisis.23005.8: "Как жаль, что она сбивала других с пути."

 crisis.23010.name: "Сетана повержена"
 crisis.23010.desc: "После победы над Сетаной по галактике прокатился вздох облегчения. Диктатор пал; бессмысленной жестокости настал конец. Никто больше не покушается на наши умы, никакой железный кулак не раздавит наши тела. Жители сотен планет празднуют наступление нового века — века надежды на долгий мир."

 crisis.23015.name: "Крушение материнского корабля"
 crisis.23015.desc: "Уничтожение флагмана Сетаны — не просто блестящая военная победа: разорвав связь с её силами, мы положили конец самим замыслам королевы, а заодно — её правлению. Наниты, некогда служившие опорой её грозного флота и главным средством обороны столицы, резко прекратили деятельность.\n\nНесмотря на всеобщее облегчение, свергнутая «королева» всё-таки смогла передать галактике последнее послание..."
 crisis.23015.a: "Мы избавились от страданий."
 crisis.23015.a.tt: "Мы завладели повреждённой платформой синтетической королевы. Корпус уже вышел из строя, однако цифровое сердце до сих пор функционирует."

 cetana_defeated: "Сетана повержена"
 cetana_defeated_desc: "Галактика ликует после победы над синтетической королевой Сетаной."
 synth_queen_mothership_down: "Материнский корабль уничтожен"
 synth_queen_mothership_down_desc: "После уничтожения координационного центра в виде флагмана Сетаны её войска утратили слаженность."


