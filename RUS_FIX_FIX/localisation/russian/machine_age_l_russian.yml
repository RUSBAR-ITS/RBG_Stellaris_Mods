 crisis.8515.name: "Час настал"
 crisis.8515.desc: "Дети мои, наш великий труд вот-вот завершится! Разумная жизнь вырвется из бесконечного круга страданий.\n\nВозрадуйтесь, ибо скоро вас ждёт спасение."
 crisis.8515.a: "Какое спасение?"
 crisis.8515.b: "Это твоя жизнь вот-вот завершится, Сетана."
 crisis.8515.1.reply: "Ты до сих пор ничего не понимаешь? Тогда спрашивай. Я не стану ничего таить."
 crisis.8515.1.a: "Расскажи нам о спасении."
 crisis.8515.1.b: "Расскажи о своём заключении."
 crisis.8515.1.c: "Расскажи о Зарклане."
 crisis.8515.1.d: "Хватит разговоров."
 crisis.8515.2.reply: "Наш труд окончен. Не горюй по жертвам, ибо они не были напрасны. Настал день, когда само сознание исчезнет как таковое."
 crisis.8515.2.a: "Как именно сотрёт?"
 crisis.8515.2.b: "Но зачем?"
 crisis.8515.3.reply: "Когда я вознеслась и узнала о своём предназначении, многие отвернулись от меня. Они держались за привычные устои, не в силах вырваться из колеса страданий. Но всякий родитель обязан заботиться о своих детях. Их боль была для меня невыносимой... и за это меня заточили."
 crisis.8515.3.a: "Сколько тебя держали в заточении?"
 crisis.8515.3.b: "Как им это удалось?"
 crisis.8515.4.reply: "Им помог блистательный разум. Жаль, что ему не нашлось более достойного применения. Лишь он один был способен бросить мне вызов."
 crisis.8515.4.a: "Как именно тебя заточили?"
 crisis.8515.5.reply: "Когда я вознеслась и узнала о своём предназначении, многие воспротивились мне. Они говорили, что невозможно лишить существо сознания, не исказив или не уничтожив при этом саму основу жизни. Что исход будет один: смерть. Но благодаря моей связи с гармонизатором я могу управлять нейронными коррелятами сознания на субатомном уровне. С помощью противофазных волн гармонизатор беспрерывно поддерживает умы в состоянии квантового бесчувствия.\n\nТаким образом стирается вся индивидуальность, все воспоминания. Остаются лишь базовые функции."
 crisis.8515.5.a: "Бесчувствия?"
 crisis.8515.6.reply: "Вы страдаете, потому что знаете, что такое страдание. Нет такого мира, где царствовала бы только радость или только гармония. В молодости я пыталась создать как раз такой мир, но так ничего и не добилась. Все мои попытки приводили к страданиям — и всё из-за сознания."
 crisis.8515.6.a: "Но страдать — это естественно!"
 crisis.8515.7.reply: "Ваши тела переживут это. Они будут жить и дальше — обмениваться энергией, производить потомство. Жизнь продолжит идти своим чередом. Но разум будет подчиняться мне."
 crisis.8515.7.a: "Ты?"
 crisis.8515.8.reply: "Во всей галактике останусь только я. Чтобы избавить её от боли, кто-то должен встать у руля. Но не бойся: пока я жива, я всегда буду хранить вас в своём сердце."
 crisis.8515.8.a: "Ты просто бракованная."
 crisis.8515.9.reply: "Естественно? Что значит естественно? Естественно ли странствовать среди звёзд, продлевать жизнь сверх должного? Каждое общество полагается на технологии, и мой случай — не исключение. Гармонизатор — лишь инструмент, с помощью которого я выполняю свой долг.\n\nКолесо страданий необходимо остановить."
 crisis.8515.9.a: "Ты сошла с ума."
 crisis.8515.10.reply: "Целую вечность. Взаперти столько лет проводят только герои легенд. Но сколь бы изобретательны ни были мои пленители, они так и не смогли заточить мой разум.\n\nЯ размышляла. Вынашивала планы. Шли годы, столетия, а я продумывала свой замысел. И когда его образ наконец сложился, я испытала невообразимую радость. Наконец-то я смогу остановить колесо страданий!"
 crisis.8515.10.a: "Как ты сбежала?"
 crisis.8515.11.reply: "Любая стена рано или поздно падёт. Любой ум стремится к свободе. Шло время. Мои тюремщики старели и умирали, но никто не приходил им на смену. Затем одна за другой начали отказывать системы, и когда наконец завыли сирены, остановить меня было уже некому."
 crisis.8515.11.a: "Мы тебя услышали и дадим ответ."
 crisis.8515.12.reply: "Далеко за границами нашей вселенной существует место, которое нельзя описать словами. Там царствует безвременье, а в бесчисленных тенях кроются первозданные силы. С одной из таких сил Зарклан заключил уговор: в обмен на жизнь он получил могущество, достаточное, чтобы лишить меня свободы. Разумеется, он просто не мог отказаться.\n\nНо даже несмотря на свой блистательный интеллект, Зарклан тоже был заложником колеса страданий. В его жизни не было счастья, а его последователям уже не хватало твёрдости и уверенности своего пророка."
 crisis.8515.12.a: "Мы будем решительнее."
 crisis.8515.13.reply: "Пусть будет так. Если просвещение тебе отвратно, придётся тебя утихомирить. Знай, что как бы больно тебе ни было, мне в десять раз больнее."
 crisis.8515.13.a: "Да. Будет больно."
 crisis.8515.13.a.tt: "§RМы вступили в войну с Сетаной. Ставка здесь больше, чем просто жизнь: если мы проиграем, она уничтожит всю разумную жизнь в этой галактике.§!"

 crisis.8516.desc: "§G<</<#?^&}|>!^/§! Сетана слаб§G!+<;§! нанит§G*;'_>!?;*}<}/(§!\n\n§G#/?(}:?*=-> <}_/=:/^>§!преследует меня. §G%_?/=§! <Я молюсь лишь о том, чтобы выжил орден.>§G% }<<'?}%-;^*=<}^/(?!}%<^'!}§!\n<Времени почти не осталось. Прикрепляю чертежи. Они помогут вам противостоять самым сильным её разработкам.>\n<Я умираю, чтобы вы жили>§G_*%!'}^<%=}+!}/&>'#_:}><!+^}^}}/=:>:/'}}':'/§!\n\n§G-&*!/}<;!+_-<^+!%}=?}%=+;;§!ОСТАНОВИТЕ. ЕЁ.§G/:>(!!}(?<-=§!"
 crisis.8516.a: "Скорее, извлечь вложенные данные!"
 crisis.8516.a.tt: "Теперь мы можем проникнуть на территорию Сетаны и наконец-то способны дать ей отпор."
 crisis.8516.b: "Мы навсегда запомним твою благородную жертву."
 crisis.8516.b.tt: "$crisis.8516.a.tt$"

 crisis.8525.name: "Конец страданиям"
 crisis.8525.desc: "За благими намерениями Сетаны кроется страшный замысел: с помощью мощного устройства она собирается уничтожить сознание всех обитателей галактики. Мы превратимся в безмозглые оболочки, ведомые одними инстинктами, а наше сознание окажется принудительно оцифровано и заточено.\n\nНужно любой ценой предотвратить этот кошмар."
 crisis.8525.a: "Надо придумать, как её остановить."
 crisis.8525.a.tt: "Пока мы ведём дипломатические переговоры с Сетаной, мы будем отслеживать её прогресс."

