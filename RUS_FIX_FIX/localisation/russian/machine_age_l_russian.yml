 machine_age.1070.k.tooltip: "$machine_age.1070.intro$ изготовлению штучных товаров высокого качества."
 machine_age.1075.name: "Кровь и микросхемы"
 machine_age.1075.desc: "Настал час божественного слияния.\n\nОсталось лишь построить во всех колониях священные §Yцентры аугментации§!, чтобы приступить к вознесению."
 machine_age.1075.a: "$machine_age.1090.pray$"
 machine_age.1075.a.tooltip: "Начинается полная аугментация верующих. Все остальные действия конклава возобновятся только по завершении божественного слияния.\n\n§RНеобходимо действие:§!\nПостройте $building_augmentation_center$, чтобы продолжить инцидент §Y$situation_cybernetic_creed_cyberization$§!."
 machine_age.1090.name: "Будущее нашей плоти"
 machine_age.1090.desc: "Наш долгий путь почти закончился. Священное слияние породило союз [Owner.Species.GetFleshTypeCyberCreed&gen] и машины — все подвластны божественной воле. Остался последний шаг — вживление священных имплантов."
 machine_age.1090.construction: "$machine_age.1090.desc$ §Y$CYBERCREED_construction$§! требует, чтобы наши тела превратились в божественные инструменты.\n\n$machine_age.govswapnotice$\n\n$machine_age.1090.pray$"
 machine_age.1090.war: "$machine_age.1090.desc$ §Y$CYBERCREED_war$§! требуют, чтобы верующие перевоплотились в божественное оружие.\n\n$machine_age.govswapnotice$\n\n$machine_age.1090.pray$"
 machine_age.1090.research: "$machine_age.1090.desc$ §Y$CYBERCREED_research$§! обещает раскрыть тайны вселенной, объединив сознания всех нас в единую сеть.\n\n$machine_age.govswapnotice$\n\n$machine_age.1090.pray$"
