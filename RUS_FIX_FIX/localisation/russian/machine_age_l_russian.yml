 # Galcom Resolutions
 resolution_galactic_focus_crisis_synth_queen: "Приоритет: Сетана"
 resolution_galactic_focus_crisis_synth_queen_desc: "Сетана несёт угрозу всей жизни в галактике. Если мы не объединимся, чтобы остановить её, она уничтожит нас всех. Мы должны сделать борьбу с этим кризисом приоритетом галактики."
