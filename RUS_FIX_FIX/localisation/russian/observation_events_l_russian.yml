 observation.202.hive_pre_ftl.desc: "$observation.202.start$\n\n$observation.202.hive_mind.end$"
 observation.202.reg_pre_ftl.desc.gestalt: "$observation.202.gestalt.start$\n\n$observation.202.reg.end$"
 observation.202.hive_pre_ftl.desc.gestalt: "$observation.202.gestalt.start$\n\n$observation.202.hive_mind.end$"

 observation.203.name: "Оперативники захвачены на [pre_ftl_planet.GetName&prep]"

 observation.203.start: "[GetPreFTLUpper&masc] народ c [pre_ftl_planet.GetName&gen] послал войска. Они прибыли на место крушения шаттла раньше, чем мы успели эвакуировать исследовательскую группу, и захватили выживших в плен."
 observation.203.gestalt.start: "[GetPreFTLUpper&masc] народ с [pre_ftl_planet.GetName&gen], послал войска. Они прибыли на место крушения шаттла раньше, чем мы успели эвакуировать исследовательскую группу, и захватили независимо действующих оперативников в плен."
 observation.203.reg.end: "[GetPreFTLUpper&pl] существа охраняют все подходы к месту катастрофы, и нет сомнения в том, что их лучшие учёные сейчас изучают всё, что им удалось там найти.\n\nТеперь у них есть неоспоримые доказательства того, что в космосе существует разумная жизнь. Неизвестно, как это скажется на их развитии..."
 observation.203.hive_mind.end: "[GetPreFTLUpper&pl] существа охраняют все подходы к месту катастрофы и, несомненно, изучают всё, что им удалось там найти.\n\nТеперь у них есть неоспоримые доказательства того, что в космосе существует разумная жизнь. Неизвестно, как это скажется на их развитии..."

