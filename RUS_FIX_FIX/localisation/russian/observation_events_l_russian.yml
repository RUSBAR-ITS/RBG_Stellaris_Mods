 observation.203.hive_pre_ftl.desc.gestalt: "$observation.203.gestalt.start$\n\n$observation.203.hive_mind.end$"
 observation.203.a: "Это нехорошо."

# Nuclear War, everyone dead, planet is a tomb world
 observation.205.name: "Ядерная война на [pre_ftl_planet.GetName&prep]"

 observation.205.reg.start: "Несколько государств на [pre_ftl_planet.GetName&prep] объединились против соседа, который сбил наш шаттл, а затем отказался делиться технологиями, добытыми на месте крушения."
 observation.205.hive_mind.start: "При беспрецедентном стечении обстоятельств несколько видов сознаний на [pre_ftl_planet.GetName&prep] объединились против соседа, который сбил наш шаттл, а затем отказался делиться технологиями, добытыми на месте крушения."
 observation.205.end: "После скоротечной войны с применением обычного оружия стороны обменялись мощными ядерными ударами. Теперь [pre_ftl_planet.GetPlanetMoon_rinfix&nom] почти целиком лежит в руинах.\n\nНа поверхности не осталось уцелевших. Погибли все, включая наших учёных, захваченных в плен. Окружающей среде нанесён значительный урон."
 observation.205.gestalt.end: "После скоротечной войны с применением обычного оружия стороны обменялись мощными ядерными ударами. Теперь [pre_ftl_planet.GetPlanetMoon_rinfix&nom] почти целиком лежит в руинах.\n\nНа  поверхности не осталось уцелевших. Погибли все, в том числе наши [GetIndividualNamePlural&nom], захваченные в плен. Окружающей среде нанесён значительный урон."

 observation.205.reg_pre_ftl.desc: "$observation.205.reg.start$\n\n$observation.205.end$"
 observation.205.hive_pre_ftl.desc: "$observation.205.hive_mind.start$\n\n$observation.205.end$"
 observation.205.reg_pre_ftl.desc.gestalt: "$observation.205.reg.start$\n\n$observation.205.gestalt.end$"
 observation.205.hive_pre_ftl.desc.gestalt: "$observation.205.hive_mind.start$\n\n$observation.205.gestalt.end$"

 observation.205.a: "Эх, если бы нам тогда удалось спасти шаттл..."

# Nuclear War, everyone dead, planet is a toxic world
 observation.206.name: "$observation.205.name$"

 observation.206.reg.start: "$observation.205.reg.start$"
 observation.206.hive_mind.start: "$observation.205.hive_mind.start$"
 observation.206.end: "После скоротечной войны с применением обычного оружия стороны обменялись мощными ядерными ударами. Теперь [pre_ftl_planet.GetPlanetMoon_rinfix&nom] почти целиком лежит в руинах.\n\nОт населения на поверхности остался только пепел. [pre_ftl_planet.GetName] больше не сможет поддерживать жизнь. Среди миллиардов погибших оказались и наши учёные, захваченные в плен."
 observation.206.gestalt.end: "После скоротечной войны с применением обычного оружия стороны обменялись мощными ядерными ударами. Теперь [pre_ftl_planet.GetPlanetMoon_rinfix&nom] почти целиком лежит в руинах.\n\nОт населения на поверхности остался только пепел. [pre_ftl_planet.GetName] больше не сможет поддерживать жизнь. Среди миллиардов погибших оказались и наши [GetIndividualNamePlural&nom], захваченные в плен."

 observation.206.reg_pre_ftl.desc: "$observation.206.reg.start$\n\n$observation.206.end$"
 observation.206.hive_pre_ftl.desc: "$observation.206.hive_mind.start$\n\n$observation.206.end$"
 observation.206.reg_pre_ftl.desc.gestalt: "$observation.206.reg.start$\n\n$observation.206.gestalt.end$"
 observation.206.hive_pre_ftl.desc.gestalt: "$observation.206.hive_mind.start$\n\n$observation.206.gestalt.end$"

 observation.206.a: "$observation.205.a$"

# Nuclear War, pre-ftls regress to stone age, planet is a tomb world
 observation.207.name: "$observation.205.name$"

 observation.207.reg.start: "$observation.205.reg.start$"
 observation.207.hive_mind.start: "$observation.205.hive_mind.start$"
 observation.207.end: "После скоротечной войны с применением обычного оружия стороны обменялись мощными ядерными ударами. Теперь [pre_ftl_planet.GetPlanetMoon_rinfix&nom] почти целиком лежит в руинах.\n\n[pre_ftl_planet.GetPlanetMoonCap_rinfix&dat] был нанесён катастрофический урон: уничтожены все крупные города и свыше 90% населения. Из-под завалов уже выбрались немногочисленные выжившие, но наши исследователи прогнозируют, что цивилизация [pre_ftl_planet.GetPlanetMoon_rinfix&gen] теперь значительно откатится в своём развитии. Среди миллиардов погибших оказались и наши учёные, захваченные в плен."
 observation.207.gestalt.end: "После скоротечной войны с применением обычного оружия стороны обменялись мощными ядерными ударами. Теперь [pre_ftl_planet.GetPlanetMoon_rinfix&nom] почти целиком лежит в руинах.\n\n[pre_ftl_planet.GetPlanetMoonCap_rinfix&dat] был нанесён катастрофический урон: уничтожены все крупные города и свыше 90% населения. Из-под завалов уже выбрались немногочисленные выжившие, но мы прогнозируем, что цивилизация [pre_ftl_planet.GetPlanetMoon_rinfix&gen] теперь значительно откатится в своём развитии. Среди миллиардов погибших оказались и наши [root.GetIndividualNamePlural&nom], захваченные в плен."

 observation.207.reg_pre_ftl.desc: "$observation.207.reg.start$\n\n$observation.207.end$"
 observation.207.hive_pre_ftl.desc: "$observation.207.hive_mind.start$\n\n$observation.207.end$"
 observation.207.reg_pre_ftl.desc.gestalt: "$observation.207.reg.start$\n\n$observation.207.gestalt.end$"
 observation.207.hive_pre_ftl.desc.gestalt: "$observation.207.hive_mind.start$\n\n$observation.207.gestalt.end$"

 observation.207.a: "$observation.205.a$"

 observation.209.name: "Новое оружие на [pre_ftl_planet.GetName&prep]"

 observation.209.reg_pre_ftl.desc: "Государство на [pre_ftl_planet.GetName&prep], сбившее наш шаттл, принудило захваченных в плен учёных разрабатывать для его армии новое оружие. Получив такое преимущество, оно захватило нескольких соседей и теперь пытается объединить [pre_ftl_planet.GetPlanetMoon_rinfix&acc] под своей властью."
 observation.209.hive_pre_ftl.desc: "Сознание на [pre_ftl_planet.GetName&prep], сбившее наш шаттл, принудило захваченных в плен учёных разрабатывать для его армии новое оружие. Получив такое преимущество, оно захватило несколько соседних ульев и теперь пытается объединить [pre_ftl_planet.GetPlanetMoon_rinfix&acc] под своей властью."
 observation.209.reg_pre_ftl.desc.gestalt: "Государство на [pre_ftl_planet.GetName&prep], сбившее наш шаттл, принудило захваченные в плен единицы разрабатывать для его армии новое оружие. Получив такое преимущество, оно захватило нескольких соседей и теперь пытается объединить [pre_ftl_planet.GetPlanetMoon_rinfix&acc] под своей властью."
 observation.209.hive_pre_ftl.desc.gestalt: "Сознание на [pre_ftl_planet.GetName&prep], сбившее наш шаттл, принудило захваченных в плен [root.GetIndividualName&acc] разрабатывать для его армии новое оружие. Получив такое преимущество, оно захватило нескольких соседей и теперь пытается объединить [pre_ftl_planet.GetPlanetMoon_rinfix&acc] под своей властью."

 observation.209.a: "Это недопустимо!"

 observation.211.name: "Сделка с заложниками"

 observation.211.reg.start: "Государство на [pre_ftl_planet.GetName&prep], которое сбило наш шаттл, направило в космос открытое сообщение через один из своих спутников. Судя по всему, оно предназначено нам."
 observation.211.hive_mind.start: "Сознание на [pre_ftl_planet.GetName&prep], которое сбило наш шаттл, направило в космос открытое сообщение через один из своих спутников. Судя по всему, оно предназначено нам."
 observation.211.end: "Они требуют, чтобы мы поделились с ними продвинутыми технологиями, а взамен обещают вернуть учёных, захваченных на месте крушения шаттла. Если мы откажемся, они публично казнят пленников и покажут это в прямом эфире по своему примитивному телевидению."
 observation.211.gestalt.end: "Они требуют, чтобы мы поделились с ними продвинутыми технологиями. Взамен нам обещают, что все [GetIndividualNamePlural&nom], захваченные на месте крушения шаттла, будут возвращены. Если мы откажемся, они публично казнят пленников и покажут это в прямом эфире по своему примитивному телевидению."

 observation.211.reg_pre_ftl.desc: "$observation.211.reg.start$\n\n$observation.211.end$"
 observation.211.hive_pre_ftl.desc: "$observation.211.hive_mind.start$\n\n$observation.211.end$"
 observation.211.reg_pre_ftl.desc.gestalt: "$observation.211.reg.start$\n\n$observation.211.gestalt.end$"
 observation.211.hive_pre_ftl.desc.gestalt: "$observation.211.hive_mind.start$\n\n$observation.211.gestalt.end$"
 observation.211.a: "Безопасность учёных превыше всего."
 observation.211.a.gestalt: "Безопасность наших автономных единиц превыше всего."
 observation.211.b: "Они ещё к такому не готовы."

 observation.212.name: "Заложники казнены"

 observation.212.desc: "Наши учёные, захваченные в плен на [pre_ftl_planet.GetName&prep], стали жертвами чудовищного спектакля. Их продемонстрировали в прямом эфире как «инопланетных чудовищ»."
 observation.212.desc.mach: "Наши научные единицы, захваченные в плен на [pre_ftl_planet.GetName&prep], стали жертвами чудовищного спектакля. Их продемонстрировали в прямом эфире как «ужасные машины, прилетевшие со звёзд»."
 observation.212.a: "Прискорбно!"

# Smuggler Outpost
 observation.301.name: "Форпост контрабандистов"
 observation.301.desc: "Наш наблюдательный форпост над [pre_ftl_planet.GetName&inst] обнаружил нелегальное поселение на поверхности. Судя по всему, там расположились [Root.GetSpeciesNamePlural]-контрабандисты и прочие криминальные элементы [Root.GetName&gen].\n\nКонтрабандисты уже несколько раз вступали в контакт [GetPreFTLLower&pl,inst] местными, в том числе с летальным исходом. Мы должны скорейшим образом разрешить ситуацию и не позволить преступникам нанести ещё больший ущерб."
 observation.301.a: "Провести зачистку."
 observation.301.b: "Что такого может натворить горстка контрабандистов?"
 observation.302.name: "Рейд против контрабандистов"
 observation.302.desc: "Наши наземные силы нанесли стремительный удар по форпосту контрабандистов на [pre_ftl_planet.GetName&prep]. После короткой перестрелки уцелевшие преступники были арестованы и отправлены на орбиту. Пустые строения уничтожены с помощью взрывчатых устройств.\n\nМы полагаем, что культурное заражение удалось сохранить на минимальном уровне. Кроме того, было изъято большое количество нелегальных товаров. Прибыль от операции поступит в бюджет."
 observation.302.a: "Это достойная победа."
 observation.303.name: "Контрабандная торговля оружием"
 observation.303.desc: "Мы опоздали: [GetPreFTLLower&pl] существа на [pre_ftl_planet.GetName&prep] начали получать от контрабандистов современное оружие и простейшие наркотические стимуляторы в обмен на драгоценные металлы и рабов.\n\nМежду местными группировками началась война. Дорвавшись до нового высокотехнологичного оружия, они практически перебили друг друга. На этом этапе культурное заражение можно считать необратимым."
 observation.303.a: "Это катастрофа."

# Scientist Abduction
 observation.1001.name: "Предложение о похищении"
 observation.1001.desc: "На [pre_ftl_planet.GetName&prep] обитают [owner.GetPreFTLLower&pl] [pre_ftl_country.GetSpeciesNamePlural], но среди них есть [abducted_scientist.GetAXX::учёный, подающий|||fem:учёная, подающая] большие надежды. В своих блестящих исследованиях [abducted_scientist.GetSheHe] значительно [abducted_scientist.GetAXX::опередил<end_a>] коллег, а кое-что из [abducted_scientist.GetHerHis] идей революционно даже по нашим меркам.\n\nХотя благодаря [abducted_scientist.GetHerHim] технический прогресс [pre_ftl_country.GetSpeciesNamePlural&gen] явно ускорится, [abducted_scientist.GetHerHis] потенциал лишь растрачивается на этот [owner.GetPreFTLLower&masc] народ. В наших усовершенствованных лабораториях [abducted_scientist.GetAXX::он мог|||fem:она могла] бы заняться настоящей наукой."
 observation.1001.a: "Составьте сценарий похищения."
 observation.1001.b: "[abducted_scientist.GetHeSheCap] всё ещё [owner.GetPreFTLLower&masc] житель. Не стоит отбирать [abducted_scientist.GetHisHer] у народа."
 observation.1002.name: "Похищение удалось"
 observation.1002.desc: "Наши агенты успешно похитили [abducted_scientist.GetAXX::учёного|||fem:учёную] из [pre_ftl_country.GetName&gen]! Один из наших наземных челноков перехватил [abducted_scientist.GetHerHis] автомашину, когда [abducted_scientist.GetAXX::он возвращался|||fem:она возвращалась] домой поздно ночью после работы, и вывел её из строя при помощи электромагнитного импульса.\n\nВременно [abducted_scientist.GetAXX::парализованного учёного|||fem:парализованную учёную] доставили на челнок, а его телохранителям выборочно почистили память. Мы уверены, что сможем «убедить» [abducted_scientist.GetAXX::хорошего учёного|||fem:хорошую учёную] поработать на нас."
 observation.1002.tt: "К нам присоединится §Y[abducted_scientist.GetAXX::гениальный учёный|||fem:гениальная учёная] 6-го уровня расы [pre_ftl_country.GetSpeciesName]§!."
 observation.1003.name: "Похищение не удалось"
 observation.1003.desc: "К сожалению, наша попытка похитить [abducted_scientist.GetAXX::учёного|||fem:учёную] из [pre_ftl_country.GetName&gen] провалилась. Один из наших наземных челноков перехватил [abducted_scientist.GetHerHis] автомашину, но когда луч левитации переносил [abducted_scientist.GetAXX::парализованного учёного|||fem:парализованную учёную] в грузовой отсек, появился [pre_ftl_country.GetSpeciesAdj&masc] атмосферный истребитель.\n\nЧелнок сумел безопасно вернуться на орбиту, но луч левитации пришлось отключить, и [abducted_scientist.GetAXX::учён<end_yi>]... короче говоря, падение было долгим. Будем надеяться, что вину за его смерть [pre_ftl_country.GetSpeciesName] возложат на соперничающие с ними страны."
 observation.1004.name: "Прорыв на [pre_ftl_planet.GetName&prep]!"
 observation.1004.desc: "[abducted_scientist.GetAXX::Учёный, которого|||fem:Учёная, которую] мы давно приметили на [pre_ftl_planet.GetName&prep], [abducted_scientist.GetAXX::проявил<end_a>] недюжинный талант. Благодаря [abducted_scientist.GetHisHer] острому аналитическому уму и нестандартному подходу к исследованиям [pre_ftl_country.GetName] переживает технологическую революцию."
 observation.1004.a: "Нет слов!"

# Defense Force
 observation.1101.name: "[pre_ftl_planet.GetName]: Оперативная группа по борьбе с инопланетянами"
 observation.1101.desc: "Явно в ответ на наши действия многие [GetPreFTLLowerPlural&nom] [pre_ftl_country.GetSpeciesAdj&pl] государства на [pre_ftl_planet.GetName&prep] моментально позабыли о своих склоках и основали новую надгосударственную военную организацию.\n\nСогласно местным СМИ, эта оперативная группа будет защищать [pre_ftl_planet.GetPlanetMoon_rinfix&acc] от «враждебной деятельности, которую неизвестное инопланетное ведомство ведёт против всей [pre_ftl_country.GetSpeciesAdj&pl,gen] расы»."
# Interceptions
 observation.1102.name: "[pre_ftl_planet.GetName]: Деятельность оперативной группы"
 observation.1102.desc: "Разведывательные видеоматериалы, отснятые нашим наблюдательным форпостом на орбите [pre_ftl_planet.GetName&gen], подтвердили возникновение на её поверхности нескольких новых военных баз и радиолокационных комплексов под контролем надгосударственной оперативной группы по борьбе с инопланетянами, которую основали [pre_ftl_country.GetSpeciesNamePlural].\n\nМы наблюдаем беспрецедентный уровень сотрудничества между местными державами, ведь нашим полётам, выполняемым с целью похищения, теперь регулярно мешают атмосферные истребители, принадлежащие этой группе. Несмотря на наше технологическое превосходство, они только в силу своего количества смогли сбить несколько наших похищающих челноков!"
 observation.1102.a: "Это повредит нашим активным наблюдениям."
# Observation Post Lost
 observation.1103.name: "[pre_ftl_planet.GetName]: Потеря наблюдательного форпоста"
 observation.1103.desc: "Наш наблюдательный форпост на орбите [pre_ftl_planet.GetName&gen] уничтожен! Причиной стала крупная ракета класса «Земля — космос», выпущенная с одной из военных баз под контролем надгосударственной оперативной группы, которую основали [pre_ftl_country.GetSpeciesNamePlural].\n\nМы до сих пор не можем точно сказать, как им удалось выяснить местонахождение форпоста, так как были приняты масштабные меры предосторожности, чтобы [pre_ftl_country.GetSpeciesNamePlural] не узнали о его существовании. Согласно одной теории, аборигены сумели осуществить инженерный анализ технологий, полученных из наших сбитых челноков."
 observation.1103.a: "Это возмутительно!"
# Strike
 observation.1105.name: "[pre_ftl_planet.GetName]: Точечный удар"
 observation.1105.desc: "Персонал нашего наблюдательного форпоста на орбите [pre_ftl_planet.GetName&gen] попросил помочь им решить проблему с оперативной группой по борьбе с инопланетянами, которую [pre_ftl_country.GetSpeciesNamePlural] создали в ответ на наши активные наблюдения. Несмотря на то что данная организация является архаичной по нашим меркам, она научилась эффективно мешать проводимым нами похищениям.\n\nИх главная база была обнаружена в [pre_ftl_planet.GetAMountainFeature] [pre_ftl_planet.GetPlanetMoon_rinfix&gen]. Орбитальная бомбардировка будет неэффективной, но стремительный налёт, выполненный хорошо вооружённым ударным отрядом, позволит захватить базу врасплох. С её разрушением приносящая столько неудобств [pre_ftl_country.GetSpeciesAdj&fem] оперативная группа прекратит своё существование."
 observation.1105.a: "Так и сделайте."
 observation.1105.b: "Нет, нам не следует ещё больше восстанавливать их против нас..."
 observation.1106.name: "[pre_ftl_planet.GetName]: Успешный удар"
 observation.1106.desc: "Наша миссия по уничтожению основной базы надгосударственной оперативной группы, которую основали [pre_ftl_country.GetSpeciesNamePlural], завершилась полным успехом! Когда наш ударный отряд проник на базу, её защитники со своим скудным вооружением не смогли справиться с нашими квалифицированными оперативниками.\n\nЗаложив заряды взрывчатого вещества глубоко внутри базы, ударный отряд был спешно эвакуирован ожидающими его челноками. От этой назойливой оперативной группы теперь ничего не осталось."
 observation.1106.a: "Миссия выполнена успешно."
 observation.1107.name: "[pre_ftl_planetGetName]: Неудавшийся удар"
 observation.1107.desc: "Наша миссия по уничтожению основной базы надгосударственной оперативной группы, которую основали [pre_ftl_country.Owner.GetSpeciesNamePlural], потерпела фиаско! Несколько челноков, перевозивших наш ударный отряд, были сбиты скрытыми зенитными средствами ещё до того, как долетели до базы. Когда оставшиеся оперативники наконец добрались до входа на базу, они встретили неожиданно упорное сопротивление.\n\nПоскольку [pre_ftl_country.Owner.GetSpeciesName] ожидали скорое прибытие подкрепления, командир ударного отряда в конце концов отдал приказ отступать. К сожалению, когда наши эвакуационные челноки прорывались на орбиту, их перехватило крупное соединение атмосферных истребителей. Потери были огромными."
 observation.1107.a: "Это катастрофа!"
# Disbanded
 observation.1104.name: "[pre_ftl_planet.GetName]: Роспуск оперативной группы"
 observation.1104.desc: "Надгосударственная оперативная группа, которую государства [pre_ftl_country.GetSpeciesName] основали для срыва нашей деятельности на [pre_ftl_planet.GetName&prep], распущена! Хотя они каким-то образом смогли одержать несколько важных побед в бою с нашими челноками и командами похитителей, некоторые основатели организации решили прекратить финансирование и отказаться от данного проекта.\n\nРазведка объясняет такой неожиданный поворот событий внутренними распрями и дипломатическими уловками между державами [pre_ftl_country.GetSpeciesName]."
 observation.1104.a: "Приятно, пусть и неожиданно."

# Malfunctioning Implants
 observation.1201.name: "[pre_ftl_planet.GetName]: Сбой имплантов"
 observation.1201.desc: "В рамках нашей деятельности по наблюдению на [pre_ftl_planet.GetName&prep] команды похитителей провели хирургические операции по установлению имплантов в мозг некоторых подопытных [pre_ftl_country.GetSpeciesName&gen], чтобы отслеживать их и наблюдать за их поведением. К сожалению, из-за производственного дефекта многие из этих имплантов дали сбой и сейчас оказывают... негативный эффект на поведение наших подопытных.\n\nБыло немало самоубийств и не менее трёх случаев буйной истерии. Наши [root.GetResearcherPlural_rinfix&nom] с наблюдательного форпоста попросили помощи в сборе оставшихся подопытных и удалении имплантов, пока инцидентов не стало больше."
 observation.1201.a: "Нужно разрешить эту ситуацию."
 observation.1201.b: "Это не наша проблема."
 observation.1202.name: "[pre_ftl_planet.GetName]: Импланты удалены"
 observation.1202.desc: "Команды похитителей с нашего наблюдательного форпоста на орбите [pre_ftl_planet.GetName&gen] совместно с экипажем [Root.GetName&gen] быстро собрали оставшихся подопытных [pre_ftl_country.GetSpeciesNamePlural&gen], которым в мозг были установлены неисправные импланты.\n\nХирургический персонал наблюдательного форпоста заменил импланты на исправные, и подопытные вернулись на поверхность [pre_ftl_planet.GetPlanetMoon_rinfix&gen]. [Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] [Root.Leader.GetAXX::сообщил<end_a>] о неожиданном бонусе: из извлечённых имплантов, несмотря на их дефекты, удалось получить массу полезной информации."
 observation.1202.a: "Хоть какая-то польза."
 observation.1203.name: "[pre_ftl_planet.GetName]: Импланты не удалены"
 observation.1203.desc: "Дефектные импланты мозга воздействовали на последних из наших подопытных [pre_ftl_country.GetSpeciesName&gen] на [pre_ftl_planet.GetName&prep]. Многие пришли в полное исступление, выкрикивая случайные сегменты кода из языка программирования, который [Root.GetSpeciesName] использовали в их имплантах, и яростно нападая на любой объект в непосредственной близости."
 observation.1203.a: "Как такое могло случиться?"
 observation.1205.name: "[pre_ftl_planet.GetName]: импланты приняты"
 observation.1205.desc: "Раса [pre_ftl_country.GetSpeciesName] на [pre_ftl_planet.GetName&prep] занялась собственными исследованиями оставленных нами имплантов. Каким-то образом эти [GetPreFTLLower&pl] существа смогли опередить нас и разработать кибертехнологии, более совместимые с их анатомией."
 observation.1205.a: "Нет слов!"
 observation.1205.tt: "Раса §Y[pre_ftl_country.GetSpeciesName]§! осваивает §Yкибернетику§!."

# Ethic Shifts
 observation.1301.name: "Смена принципов на [pre_ftl_planet.GetName&prep]"
 observation.1301.xenophobe: "Мы заметили значительные перемены в поведении [GetPreFTLLowerPlural&gen] [pre_ftl_country.GetSpeciesNamePlural&gen] на [pre_ftl_planet.GetName&prep]. Их общество стало более замкнутым, и теперь они проявляют гораздо меньшую благосклонность к чужакам.\n\nПохоже, некоторую роль в этом сыграли наши полёты и похищения в рамках активного наблюдения за их [pre_ftl_planet.GetPlanetMoon_rinfix&inst]. [pre_ftl_country.GetSpeciesNamePlural] теперь более настороженно относятся ко всему неизвестному."
 observation.1301.xenophile: "Мы заметили значительные перемены в поведении [GetPreFTLLowerPlural&gen] [pre_ftl_country.GetSpeciesNamePlural&gen] на [pre_ftl_planet.GetName&prep]. Их общество стало более открытым, и теперь они проявляют гораздо большую благосклонность к чужакам.\n\nПохоже, некоторую роль в этом сыграли наши полёты в рамках активного наблюдения за их [pre_ftl_planet.GetPlanetMoon_rinfix&inst]. [pre_ftl_country.GetSpeciesNamePlural] теперь с большим любопытством относятся ко всему неизвестному."
 observation.1301.spiritualist: "Некоторые из наших команд похитителей с наблюдательного форпоста на орбите [pre_ftl_planet.GetName&gen] использовали двигатели своих челноков, чтобы выжигать большие круги и сложные фигуры на полях зерновых, которые на [pre_ftl_planet.GetPlanetMoon_rinfix::этом|||fem:этой] [pre_ftl_planet.GetPlanetMoon_rinfix&prep] выращивают [GetPreFTLLower&pl] [pre_ftl_country.GetSpeciesNamePlural].\n\nЭкипажи челноков получили серьёзный выговор за эту выходку, однако круги на полях уже приобрели какое-то духовное значение для местных жителей. Вокруг этих фигур [pre_ftl_country.GetSpeciesNamePlural] создали новую религию, которая набирает популярность с пугающей скоростью."
 observation.1301.materialist: "Некоторые из наших команд похитителей с наблюдательного форпоста на орбите [pre_ftl_planet.GetName&gen] использовали двигатели своих челноков, чтобы выжигать большие круги и сложные фигуры на полях зерновых, которые на [pre_ftl_planet.GetPlanetMoon_rinfix::этом|||fem:этой] [pre_ftl_planet.GetPlanetMoon_rinfix&prep] выращивают [GetPreFTLLower&pl] [pre_ftl_country.GetSpeciesNamePlural].\n\nЭкипажи челноков получили серьёзный выговор за эту выходку, однако местные жители теперь уверены, что в кругах на полях скрыт какой-то математический смысл. Для изучения этих фигур [pre_ftl_country.GetSpeciesNamePlural] создали новую научную организацию, которая набирает популярность с пугающей скоростью."

# Nuclear War, everyone dead, planet is a tomb world
 observation.1402.name: "Ядерная война на [pre_ftl_planet.GetName&prep]"

 observation.1402.reg.start: "На [pre_ftl_planet.GetName&prep] недавно начались масштабные военные действия между несколькими крупнейшими державами."
 observation.1402.hive_mind.start: "На [pre_ftl_planet.GetName&prep] недавно начались масштабные военные действия между несколькими сознаниями."
 observation.1402.end: "Пока наши исследователи вели наблюдение с орбиты, конфликт на поверхности стремительно развивался, и дело дошло до обмена ядерными ударами.\n\nНасколько мы можем судить, в ядерном огне погибло всё население [pre_ftl_planet.GetPlanetMoon_rinfix&gen], а окружающей среде нанесён значительный урон."
 observation.1402.gestalt.end: "Пока наши [root.GetIndividualNamePlural&nom] вели наблюдение с орбиты, конфликт на поверхности стремительно развивался, и дело дошло до обмена ядерными ударами.\n\nНасколько мы можем судить, в ядерном огне погибло всё население [pre_ftl_planet.GetPlanetMoon_rinfix&gen], а окружающей среде нанесён значительный урон."

 observation.1402.reg_pre_ftl.desc: "$observation.1402.reg.start$\n\n$observation.1402.end$"
