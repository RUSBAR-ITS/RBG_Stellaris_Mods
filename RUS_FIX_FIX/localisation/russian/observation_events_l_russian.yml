# Nuclear War, pre-ftls regress to stone age, planet is a tomb world
 observation.1406.name: "$observation.1402.name$"

 observation.1406.reg.start: "$observation.1402.reg.start$"
 observation.1406.hive_mind.start: "$observation.1402.hive_mind.start$"
 observation.1406.end: "Пока наши исследователи вели наблюдение с орбиты, конфликт на поверхности стремительно развивался, и дело дошло до обмена ядерными ударами.\n\n[pre_ftl_planet.GetPlanetMoonCap_rinfix&dat] был нанесён катастрофический урон: уничтожены все крупные города и свыше 90% населения. Из-под завалов уже выбрались немногочисленные выжившие, но наши исследователи прогнозируют, что цивилизация [pre_ftl_planet.GetPlanetMoon_rinfix&gen] теперь значительно откатится в своём развитии."
 observation.1406.gestalt.end: "Пока наши исследователи вели наблюдение с орбиты, конфликт на поверхности стремительно развивался, и дело дошло до обмена ядерными ударами.\n\n[pre_ftl_planet.GetPlanetMoonCap_rinfix&dat] был нанесён катастрофический урон: уничтожены все крупные города и свыше 90% населения. Из-под завалов уже выбрались немногочисленные выжившие, но мы прогнозируем, что цивилизация [pre_ftl_planet.GetPlanetMoon_rinfix&gen] теперь значительно откатится в своём развитии."

 observation.1406.reg_pre_ftl.desc: "$observation.1406.reg.start$\n\n$observation.1406.end$"
 observation.1406.hive_pre_ftl.desc: "$observation.1406.hive_mind.start$\n\n$observation.1406.end$"
 observation.1406.reg_pre_ftl.desc.gestalt: "$observation.1406.reg.start$\n\n$observation.1406.gestalt.end$"
