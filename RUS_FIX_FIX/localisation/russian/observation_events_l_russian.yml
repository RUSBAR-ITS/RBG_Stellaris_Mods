# Research Proposal
 observation.1501.name: "Исследовательское предложение"
 observation.1501.desc: "Наши учёные с наблюдательного форпоста над [pre_ftl_planet.GetName&inst] запросили помощь научного корабля, чтобы собрать образцы с поверхности. Они бы хотели похитить несколько [GetPreFTLLower&pl,gen] существ, чтобы провести над ними эксперименты. Затем подопытным сотрут память и вернут их на [pre_ftl_planet.GetPlanetMoon_rinfix&acc]."
 observation.1501.a: "Это поможет нам лучше узнать их."
 observation.1501.b: "Нет, их нужно оставить в покое."
 observation.1501.b.tt: "§Y$mission_passive_observation$§! теперь производит §G+2§! $r_unity_acc$\n§R$mission_passive_observation$ нельзя будет сменить!§!"
 observation.1502.desc: "[Root.GetName::<1> выполнил<end_a>] научное задание на [pre_ftl_planet.GetName&prep]. Опустившись как можно ближе к поверхности под покровом ночи, шаттлы научного корабля с помощью ЭМ-излучения остановили несколько архаичных автомобилей, оснащённых двигателями внутреннего сгорания. Находившиеся там [GetPreFTLLower&pl] существа были усыплены и взяты на борт. Другие группы в это время провели анатомическое вскрытие нескольких крупных домашних животных.\n\nОперация прошла почти незаметно для населения [pre_ftl_planet.GetPlanetMoon_rinfix&gen], если не считать нескольких сообщений о «странных огнях» и инцидента с кругами на полях, которые были намеренно выжжены двигателями одного из шаттлов. Эта группа получила выговор."
 observation.1502.a: "Хорошая работа."

# Special Projects for events above.
 EXTRACT_MISSING_SCIENTIST: "Вытащить пропавшего учёного"
 EXTRACT_MISSING_SCIENTIST_DESC: "Один из наших учёных сбежал, и [GetPreFTLLower&pl] общества на [pre_ftl_planet.GetName&prep] теперь почитают его как живое божество. Мы должны провести операцию по его устранению — силой, если потребуется."
 SHUTTLE_INTERCEPTED: "Спасти выживших с шаттла"
 SHUTTLE_INTERCEPTED_DESC: "Аборигены [pre_ftl_planet.GetName&gen] сбили один из наших шаттлов, и нам нужно эвакуировать выживших оперативников, прежде чем их захватят местные власти."
 ABDUCT_SCIENTIST_PROJECT: "Похитить [GetPreFTLLower&masc,gen] учёного"
 ABDUCT_SCIENTIST_PROJECT_DESC: "На [pre_ftl_planet.GetName&prep] обитает [GetPreFTLLower&masc] народ — [pre_ftl_country.GetSpeciesNamePlural], но среди них обнаружен блестящий учёный. Он растрачивает свои видные способности на [GetPreFTLLower&masc] мир, хотя мог бы стать подспорьем в наших собственных научно-исследовательских проектах. Приводится в исполнение план, согласно которому мы должны его похитить и «убедить» работать на нас."
 DEFENSE_FORCE_STRIKE_PROJECT: "Уничтожить местную оборонную группу"
 DEFENSE_FORCE_STRIKE_PROJECT_DESC: "Государства [pre_ftl_country.GetSpeciesName] на [pre_ftl_planet.GetName&prep] объединились и создали оперативную группу по борьбе с инопланетянами, в задачу которой входит срыв нашей деятельности в их родном мире. Мы этого не потерпим. Мы должны нанести карательный удар по основной базе этой организации."
 IMPLANT_MALFUNCTIONS_PROJECT: "Удалить неисправные импланты"
 IMPLANT_MALFUNCTIONS_PROJECT_DESC: "Некоторые [GetPreFTLLower&pl] [pre_ftl_country.GetSpeciesNamePlural], обитающие на [pre_ftl_planet.GetName&prep], стали нашими подопытными: мы установили им в мозг импланты, но теперь у нас проблемы. Было немало неисправностей, результатом чего становилось буйное поведение и, в некоторых случаях, смертельный исход. Нам нужно удалить эти импланты, пока из-за них не возникло ещё больше проблем."
 PROBE_ALIENS_PROJECT: "Провести зондирование чужаков"
 PROBE_ALIENS_PROJECT_DESC: "Наши учёные хотят набрать группу подопытных из числа аборигенов [pre_ftl_planet.GetName&gen]. По завершении экспериментов их вернут на [pre_ftl_planet.GetPlanetMoon_rinfix&acc], стерев воспоминания о произошедшем."

