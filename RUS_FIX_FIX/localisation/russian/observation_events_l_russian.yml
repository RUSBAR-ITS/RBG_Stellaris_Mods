l_russian:

# Observation Events from base game
# Refactored as part of the 3.7 "Canis Minor" update.

# Asteroid Sighted!
 observation.2.name: "[pre_ftl_planet.GetName&dat] угрожает астероид"
 observation.2.desc: "Небольшая астрометрическая лаборатория на нашем наблюдательном форпосте над [pre_ftl_planet.GetName&inst] обнаружила астероид класса 4 на траектории прямого столкновения. Если мы ничего не предпримем, он врежется в [GetRandomCompassDirection] полушарие [pre_ftl_planet.GetPlanetMoon_rinfix&gen] с такой силой, что это приведёт к уничтожению всего живого.\n\nСогласно политике невмешательства, мы ограничиваемся пассивным наблюдением, но в данном случае большинство наших учёных убеждены, что следует сделать исключение. Бездействие означает страшную смерть для [pre_ftl_country.GetName&gen] на [pre_ftl_planet.GetName&prep]."
 observation.2.a: "Непростая ситуация."
# Asteroid Impacts Pre-FTL planet.
 observation.4.name: "Астероид врезается в [pre_ftl_planet.GetName&acc]"
 observation.4.desc: "Как и прогнозировалось, астероид, направлявшийся к [pre_ftl_planet.GetName&dat], врезался в [pre_ftl_planet.GetPlanetMoon_rinfix&acc] и нанёс непоправимый урон всей экосистеме. Учёным на наблюдательном форпосте оставалось лишь молча созерцать, как гибнет далеко внизу большая часть [GetPreFTLLower&fem,gen] цивилизации, которую они изучали."
 observation.4.a: "Трагично, но мы не имели права вмешиваться."
 observation.4.a.tt: "§Y[pre_ftl_country.GetName]§! откатывается в §Yпредыдущую эпоху§!."
# Asteroid Collides with Observation Post.
 observation.5.name: "Наблюдательный форпост уничтожен"
 observation.5.desc: "Исследователи с наблюдательного форпоста над [pre_ftl_planet.GetName&inst] использовали свои орбитальные двигатели для выхода на траекторию прямого столкновения с приближающимся астероидом. Они пожертвовали собой, чтобы спасти [pre_ftl_planet.GetPlanetMoon_rinfix&acc]. Никто из персонала не выжил.\n\nОчевидно, они не могли смириться с мыслью о возможной гибели цивилизации, которую они изучали столько лет."
 observation.5.a: "Это удар для науки!"
# Observing Empire Destroys Asteroid
 observation.7.name: "Астероид уничтожен"
 observation.7.desc: "Астероид, направлявшийся к [pre_ftl_planet.GetName&dat], был уничтожен прежде, чем успел достичь [pre_ftl_planet.GetPlanetMoon_rinfix&gen]. Фрагменты, попавшие в атмосферу, сгорели, не причинив никому вреда.\n\nАборигены [pre_ftl_country.GetName&gen] смогли полюбоваться зрелищным метеоритным дождём. Они даже не догадываются, что едва не погибли..."
 observation.7.a: "Так и должно быть."
# Third Party Destroys Asteroid (Event for Third Party)
 observation.8.name: "$observation.7.name$"
 observation.8.desc: "$observation.7.desc$"
 observation.8.a: "$observation.7.a$"
# Third Party Destroys Asteroid (Event for Observing Empire)
 observation.9.name: "$observation.7.name$"
 observation.9.desc: "$observation.7.desc$"
 observation.9.a: "$observation.7.a$"
# Pre-FTL civilization Diverts Asteroid (Event for Observing Empire)
 observation.10.name: "Астероид отклонён"
 observation.10.desc: "[pre_ftl_country.GetName] в последней отчаянной попытке спасти свой родной мир бьёт по астероиду ядерными ракетами. Несмотря на недостаточный боевой заряд, орбитальная механика сделала своё дело: [GetPreFTLLower&pl] существа с [pre_ftl_planet.GetName&gen] успешно сбили астероид с курса."
 observation.10.a: "Нет слов!"
 observation.10.a.tt: "§Y[pre_ftl_country.GetName]§! получает §G+25%§! к научно-техническому прогрессу на 24 месяца."

# Missing Scientist
 observation.101.name: "[missing_scientist.GetAXX::Пропавш<end_ii> учён<end_yi>"
 observation.101.desc: "Нам доложили об исчезновении [missing_scientist.GetAXX::учёного|||fem:учёной] с наблюдательного форпоста на орбите [pre_ftl_planet.GetName&gen]. [missing_scientist.GetAXX::Он<end_a> принимал<end_a>] участие в скрытной операции по сбору образцов растительности на поверхности [pre_ftl_planet.GetPlanetMoon_rinfix&gen], но не [missing_scientist.GetAXX::верну<end_lsya>] на корабль с остальной [missing_scientist.GetAXX::<ego_eyo>] группой.\n\nМы ведём поиски аккуратно, чтобы местные [GetPreFTLLower&pl] обитатели не встревожились, но пока безуспешно."
 observation.101.a: "Продолжайте поиски."
 observation.102.name: "[missing_scientist.GetAXX::Учёный найден мёртвым|||fem:Учёная найдена мёртвой]"
 observation.102.desc: "Нам наконец удалось отыскать тело [missing_scientist.GetAXX::учёного|||fem:учёной], [missing_scientist.GetAXX::пропавшего|||fem:пропавшей] на [pre_ftl_planet.GetName&prep]... по крайней мере, то, что от [missing_scientist.GetAXX::н<ego_eyo>] осталось. Судя по всему, [missing_scientist.GetAXX::он<end_a> стал<end_a>] жертвой местного крупного хищника. Это большая потеря для научной группы, зато теперь мы можем быть уверены, что [GetPreFTLLower&pl] существа по-прежнему не подозревают о нашем присутствии."
 observation.102.a: "Директива не нарушена."
 observation.103.name: "Странные известия с [pre_ftl_planet.GetName&gen]"
 observation.103.desc: "Мы получили странные донесения от наблюдателей со станции на орбите [pre_ftl_planet.GetName&gen]. Одно из местных королевств возглавил некий загадочный религиозный деятель, и теперь там используют технологии, многократно превосходящие уровень развития этой цивилизации. Не связано ли это с [missing_scientist.GetAXX::нашим пропавшим сотрудником|||fem:нашей пропавшей сотрудницей]?"
 observation.104.desc: "Здравствуйте, друзья. Как много времени прошло...\n\nСначала я [missing_scientist.GetAXX::хотел<end_a>] бы извиниться, что вам пришлось потратить на поиски так много времени и сил. Моё исчезновение на [pre_ftl_planet.GetName&prep] было вполне преднамеренным.\n\nПонимаете ли, эти [GetPreFTLLower&pl] существа считают меня божеством... а почему бы и нет? После долгих размышлений я [missing_scientist.GetAXX::понял<end_a>], что мой долг — принести им истинную цивилизацию."
 observation.104.a: "Что на вас нашло?!"
 observation.104.a.response: "Я [missing_scientist.GetAXX::устал<end_a>]. Меня утомили все эти недальновидные этические ограничения и постоянные издёвки коллег. Но больше всего мне надоела эта проклятая директива о невмешательстве.\n\nХА! Это же полный бред! Наш ДОЛГ — вмешиваться в [GetPreFTLLower&pl] культуры, обучать их, создавать из них нечто прекрасное! Тихо наблюдать издалека — всего лишь позорный способ уйти от ответственности."
 observation.104.b: "Вы должны немедленно эвакуироваться!"
 observation.104.b.response: "Боюсь, для этого слишком поздно. Я больше не [missing_scientist.GetAXX::намерен<end_a>] подчиняться приказам тех, кого не считаю себе ровней. Мой интеллект был в вашем распоряжении, и как БЕЗДАРНО вы им распоряжались!\n\nЗдесь ко мне относятся с почтением, которого я заслуживаю. Теперь это мой дом. Накопленные знания и прихваченные с собой чертежи позволят мне ускорить развитие этой расы и привести её к золотому веку."
 observation.104.c: "Вы сошли с ума."
 observation.104.c.response: "Отнюдь! Я в абсолютно здравом рассудке. [Root.GetName] неминуемо [Root.GetName::погибн<end_etut>]. Вы слепцы, если не видите всех признаков этого.\n\nДа, возможно, на это уйдёт ещё десять или сто лет, но такой исход неизбежен, ваш мир рухнет. И когда вы наконец-то сами себя уничтожите вашим бездействием, галактика будет принадлежать юным расам, полным сил и энергии. Именно такую цивилизацию я создаю сейчас.\n\nМне больше нечего сказать. Прощайте."
 observation.105.name: "[missing_scientist.GetAXX::Бегл<end_yi> учён<end_yi>] собирается с силами"
 observation.105.desc: "Недавно мы получили тревожные новости с [pre_ftl_planet.GetName&gen]. Похоже, [missing_scientist.GetAXX::наш<end_a> бегл<end_yi> учён<end_yi>] собирается с силами. [missing_scientist.GetAXX::Он<end_a> дал<end_a>] одному из феодальных королевств доступ к продвинутому оружию, и теперь оно пытается завоевать [pre_ftl_planet.GetPlanetMoon_rinfix::весь|||fem:всю|||neut:всё] [pre_ftl_planet.GetPlanetMoon_rinfix&acc] во имя своего «божества».\n\nМы составили план по [missing_scientist.GetAXX::<ego_eyo>] насильственной экстрадиции, но для этого потребуется наземная операция. Трудно сказать, какое воздействие это окажет на местное население, ведь многие обожествляют [missing_scientist.GetAXX::<ego_eyo>]."
 observation.105.a: "Запускайте операцию. [missing_scientist.GetAXX::Его|||fem:Её] надо устранить."
 observation.105.b: "Всё станет только хуже..."
 observation.106.name: "Успешная эвакуация"
 observation.106.desc: "Операция по возвращению [missing_scientist.GetAXX::беглого учёного|||fem:беглой учёной] с [pre_ftl_planet.GetName&gen] прошла успешно! [owner.GetPreFTLUpper&pl] создания гибли сотнями. Они бросались на наши войска с самоубийственным отчаянием, чтобы спасти [missing_scientist.GetAXX::своего «бога»|||fem:свою «богиню»].\n\nТеперь [missing_scientist.GetAXX::<im_ei>] займутся судебные органы, но нельзя забывать о том, какое влияние все эти события оказали на цивилизацию [pre_ftl_planet.GetPlanetMoon_rinfix&gen]. Мало того, что у них остались некоторые наши технологии, так ещё их божество похитили пришельцы со звёзд."
 observation.106.a: "По крайней мере, с одной проблемой мы разобрались."
 observation.107.name: "Религиозные конфликты на [pre_ftl_planet.GetName&prep]"
 observation.107.desc: "После успешной экстрадиции [missing_scientist.GetAXX::нашего беглого учёного|||fem:нашей беглой учёной] на [pre_ftl_planet.GetName&prep] разразилась война. Созданное [missing_scientist.GetAXX::<im_ei>] государство раскололось на враждующие фракции, каждая со своей интерпретацией религиозных догм.\n\nСражения ведутся с особой жестокостью из-за того, что в руках аборигенов оказалось оружие массового уничтожения. Враждующие стороны уже взорвали несколько радиоактивных «грязных бомб», и, судя по всему, конфликт лишь разгорается."
 observation.107.a: "Всё это добром не кончится..."
 observation.108.name: "[pre_ftl_planet.GetName::<1> успокаива<end_etyut>ся]"
 observation.108.desc: "После того как мы забрали с [pre_ftl_planet.GetName&gen] [missing_scientist.GetAXX::беглого учёного|||fem:беглую учёную], обстановка там постепенно становится спокойнее. Без [missing_scientist.GetAXX::н<ego_eyo>] аборигены не смогут разобраться с оставшимися чертежами. Теперь они возвращаются к своим [GetPreFTLLower&pl,dat] обычаям и образу жизни."
 observation.108.a: "Хоть какие-то хорошие новости."
 observation.109.name: "Ракета сбила наблюдательный форпост!"
 observation.109.desc: "Считанные часы назад несколько ракет «земля — космос» были выпущены с поверхности [pre_ftl_planet.GetName&gen] по нашему наблюдательному форпосту! Станция уничтожена, никто не уцелел.\n\nНет никаких сомнений, что [GetPreFTLLower&neut] население [pre_ftl_planet.GetPlanetMoon_rinfix&gen] продолжает развиваться невиданными темпами, несмотря на то, что мы лишили их так [missing_scientist.GetAXX::называемого «бога»|||fem:называемой «богини»]. Вероятно, технологии, которые [missing_scientist.GetAXX::он<end_a> им предоставил<end_a>], спровоцировали научную революцию."
 observation.109.a: "Вот поэтому мы придерживаемся политики невмешательства."
 observation.110.desc: "Да защитят меня духи! Вы похожи на [missing_scientist.GetAXX::нашего Спасителя|||fem:нашу Спасительницу], но я вижу разницу. [missing_scientist.GetAXX::Он<end_a> говорил<end_a>] о демонах, которые попытаются выдать себя за [missing_scientist.GetAXX::н<ego_eyo>]. [missing_scientist.GetAXX::Он<end_a> предвещал<end_a>], что однажды они могут сойти с небес и попытаться похитить [missing_scientist.GetAXX::<ego_eyo>]. Пророчество сбылось, и я не сомневаюсь, что это ваших рук дело.\n\nГде [missing_scientist.GetAXX::наш<end_a> Спаситель<end_nica>], презренное существо?! Я требую, чтобы [missing_scientist.GetAXX::<ego_eyo>] немедленно освободили!"
 observation.110.a: "[missing_scientist.GetAXX::Ваш<end_a> «Спаситель<end_nica>» — инопланетн<end_yi> учён<end_yi]."
 observation.110.a.response: "Оставьте эти богохульные речи! Порочить имя [missing_scientist.GetAXX::Святого Спасителя|||fem:Святой Спасительницы] — непростительный грех, который карается смертью. Лишь благодаря [missing_scientist.GetAXX::<ego_eyo>] священным инструментам наша цивилизация сумела подняться так высоко. Я прощу ваше преступление, если вы вернёте нам [missing_scientist.GetAXX::Святого Спасителя|||fem:Святую Спасительницу]."
 observation.110.b: "[missing_scientist.GetAXX::Он<end_a> был<end_a> казн<end_yonna>] за преступления против вашего народа."
 observation.110.b.response: "Убийцы. Подлые, бесчестные демоны.\n\nПрипомните мои слова: это преступление не останется безнаказанным. Пусть даже на это у нас уйдёт тысяча лет, но мой народ сотрёт в пыль ваше нечистое государство."
 observation.110.c: "Хорошо. Мы готовы отдать [missing_scientist.GetAXX:<ego_eyo>] вам."
 observation.110.c.response: "Да простит [missing_scientist.GetAXX::Свят<end_oi> Спаситель<end_nica>] все ваши грехи, демоны. Возможно, для вас ещё есть надежда."
 observation.111.desc: "Полагаю, мне следует поблагодарить вас за то, что вы позволили мне вернуться к последователям. Я даже забуду старые обиды, несмотря на жизнь в заключении, нелепые методы психодиагностики и несправедливое отношение в целом. Главное, оставьте мой народ в покое, и мы сможем сосуществовать мирно. Космоса хватит на всех."
 observation.111.a: "Посмотрим."
 observation.112.desc: "Считанные часы тому назад ракеты «земля — космос» были выпущены с поверхности [pre_ftl_planet.GetName&gen] по нашему наблюдательному форпосту, находившемуся на высокой орбите! Станция уничтожена, никто не уцелел.\n\nЦивилизация на [pre_ftl_planet.GetPlanetMoon_rinfix&prep] развивается невиданными темпами — им помогает [missing_scientist.GetAXX::наш<end_a> бегл<end_yi> учён<end_yi>]. Пора начать рассматривать их как потенциальную угрозу. Кроме того, мы лишились возможности отстранить [missing_scientist.GetAXX::<ego_eyo>] от власти..."

# Shuttle Intercepted
 observation.201.name: "Авария шаттла на [pre_ftl_planet.GetName&prep]"
 observation.201.reg_pre_ftl.desc: "В ходе скрытной операции по сбору данных на [pre_ftl_planet.GetName&prep] один из наших шаттлов перехватила эскадрилья истребителей местного государства. Двигатель шаттла пострадал от попадания ракеты, и он рухнул в безлюдной местности.\n\nМы должны действовать быстро, чтобы эвакуировать всех выживших, прежде чем [GetPreFTLLower&pl] местные доберутся до места катастрофы. Необходимо уничтожить все следы нашего присутствия!"
 observation.201.hive_pre_ftl.desc: "В ходе скрытной операции по сбору данных на [pre_ftl_planet.GetName&prep] один из наших шаттлов перехватила эскадрилья истребителей, принадлежащая неопознанному разуму. Двигатель шаттла пострадал от попадания ракеты, и он рухнул в безлюдной местности.\n\nМы должны действовать быстро, чтобы эвакуировать всех выживших, прежде чем [GetPreFTLLower&pl] местные доберутся до места катастрофы. Необходимо уничтожить все следы нашего присутствия!"
 observation.201.reg_pre_ftl.desc.gestalt: "Шаттл XB-23-968H, выполняющий операцию V45-BM по скрытому наблюдению на [pre_ftl_planet.GetName&acc], сообщил о критических неполадках после его перехвата эскадрильей атмосферных истребителей, принадлежащих неопознанному государству. Мы обнаружили, что шаттл находится в необитаемом регионе.\n\nВсе автономные единицы нужно эвакуировать, а любые свидетельства нашего присутствия — уничтожить, прежде чем [GetPreFTLLower&pl] местные доберутся до места катастрофы."
 observation.201.hive_pre_ftl.desc.gestalt: "Наш шаттл, отправленный выполнять операцию по скрытному наблюдению на [pre_ftl_planet.GetName&prep], был перехвачен эскадрильей атмосферных истребителей, после чего сообщил о критических неполадках. Мы обнаружили, что он упал в необитаемом регионе.\n\nПока [GetPreFTLLower&pl] существа не добрались до места крушения, необходимо эвакуировать [GetIndividualNamePlural::всех автономных|||fem:все автономные] [GetIndividualNamePlural&acc] и уничтожить любые свидетельства нашего присутствия."
 observation.201.a: "У нас мало времени."

 observation.202.name: "Оперативники эвакуированы с [pre_ftl_planet.GetName&gen]"

 observation.202.start: "Оперативникам корабля [Root.GetName] удалось эвакуировать всех выживших с места падения шаттла на [pre_ftl_planet.GetName&prep]. Оставшиеся обломки были уничтожены контролируемым взрывом, после которого не осталось ничего, кроме небольшого кратера. Его и обнаружат [GetPreFTLLower&pl] существа."
 observation.202.gestalt.start: "Оперативникам корабля [Root.GetName] удалось эвакуировать несколько автономных единиц с места падения шаттла на [pre_ftl_planet.GetName&prep]. Оставшиеся обломки были уничтожены контролируемым взрывом, после которого не осталось ничего, кроме небольшого кратера. Его и обнаружат [GetPreFTLLower&pl] существа."
 observation.202.reg.end: "Государство, где произошёл инцидент, без сомнения, обвинит в нарушении границы соседей. Мы надеемся, что это происшествие не окажет существенного влияния на его естественное развитие."
 observation.202.hive_mind.end: "Коллективное сознание, на территории которого произошёл инцидент, без сомнения, обвинит в нарушении границы соседей. Мы надеемся, что это происшествие не окажет существенного влияния на его естественное развитие."

