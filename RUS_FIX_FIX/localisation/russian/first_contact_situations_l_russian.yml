 ## Events

 # Starting event
 preftl.2001.name: "Эпидемия"
 preftl.2001.can_not_help.desc: "$preftl.2001.can_help.desc$\n\nМы решили, что [owner.GetPreFTLLower&pl] миры обойдутся без нашего вмешательства, но разве можно сидеть сложа руки в такой страшный час?"
 preftl.2001.can_help.desc: "[from.owner.capital_scope.GetName] страдает от новой болезни — зоонозной чумы. Отсутствие у врачей необходимого оборудования уже приводит к массовым страданиям и гибели."
 preftl.2001.perpetrator.desc: "Болезнь, которую мы распространили среди ничего не подозревающих жителей, вышла из-под контроля. Отсутствие у врачей необходимого оборудования уже приводит к массовым страданиям и гибели."
 preftl.2001.a: "Наблюдать и изучать"
 approach_watch_tooltip: "Мы сможем почерпнуть любопытные знания. Этот подход нельзя будет сменить."
 approach_singularity_tooltip_fail: "Менять подход уже слишком поздно."
 preftl.2001.b: "Оказывать помощь"
 approach_aid_tooltip: "Помогать нуждающимся — наш долг. Этот подход нельзя будет сменить."
 preftl.2001.c: "Распространить болезнь"
 approach_promote_disease_tooltip: "Эта чума — превосходный инструмент для получения новых знаний. Возможно, она даже поможет нам целиком стереть разумную жизнь с лица планеты. Этот подход нельзя будет сменить."

 preftl.2006.name: "Религиозная одержимость"
 preftl.2006.desc.intro: "[Target.GetName] продолжает страдать от пандемии зоонозной чумы. Заражены почти все крупные поселения. По мере роста смертности сам масштаб катастрофы"
 preftl.2006.desc: "$preftl.2006.desc.intro$ привёл к резкому появлению религиозных сект и культов предвестников конца света."
 preftl.2006.a: "Наставить их на истинный путь."
 plague_01_spiritualist: "Истово верующие"
 plague_01_spiritualist_desc: "В самые тяжёлые времена сбившиеся с пути находят утешение в духовном."
 plague_01_militarist: "$plague_01_spiritualist$"
 plague_01_militarist_desc: "$plague_01_spiritualist_desc$"


 preftl.2007.name: "Полевые командиры"
 preftl.2007.desc: "$preftl.2006.desc.intro$ кажется беспрецедентным. На руинах прежнего порядка вполне ожидаемо возникают многочисленные группировки голодных до власти командиров."
 preftl.2007.a: "Помочь сильнейшим."

 preftl.2008.name: "Ангелы милосердия"
 preftl.2008.desc: "Наши попытки помочь сдержать болезнь на [Target.GetName&prep] не остались незамеченными: в разговорах между собой местные жители всё чаще упоминают «ангелов» — чудесных существ, дарующих утешение и спасение."
 preftl.2008.a: "Это должно было произойти."

 preftl.2009.name: "Демонические создания"
 preftl.2009.desc: "Наши попытки сдержать чуму на [Target.GetName&prep] привлекли внимание: в разговорах между собой местные жители всё чаще упоминают «демонов» — страшных существ, борющихся с болезнью с помощью нечестивого колдовства."

 preftl.2010.name: "Свирепствующая инфекция"
 preftl.2010.desc: "Наши попытки распространить болезнь на [Target.GetName&prep] приносят плоды: чума активно распространяется через тайно заражённые нами источники пищи. Сейчас заражены все поселения, а выжившие слишком слабы, чтобы избавиться от покойников."
 preftl.2010.a: "Хватит. Пора прекратить страдания."
 tt_end_the_suffering: "Чтобы прекратить эпидемию, нам придётся раскрыть себя и вложить немалое количество ресурсов."
 d_mass_graves: "Массовые захоронения"
 d_mass_graves_desc: "Эпидемия катастрофических масштабов уничтожила большую часть мирового населения и оставила после себя пустые равнины, простирающиеся до горизонта. Безжизненный пейзаж, последнее пристанище бесчисленных душ умерших."

 preftl.2011.name: "Выживание сильнейших"
 preftl.2011.desc: "Наши попытки распространить болезнь на [Target.GetName&prep] принесли плоды. Чума активно распространяется, оставляя за собой лишь заваленные гниющими трупами города.\n\nОднако немалая часть населения обладает врождённым иммунитетом. Дальнейшее изучение их генома может оказаться полезным для наших иммунологов."
 preftl.2011.a: "Добыть образец."

 preftl.2020.name.outro: "Дальнейшие попытки оказать помощь, не раскрывая нашу настоящую природу, потребуют немалого количества ресурсов."
 preftl.2020.name: "Огромный спрос"
 preftl.2020.desc: "Слухи о чудесах, что творят ангелы на [Target.GetName&prep], распространяются всё быстрее. К нашим врачам стекаются беженцы, молящие о помощи. $preftl.2020.name.outro$"
 preftl.2020.a: "Конспирация превыше всего."
 preftl.2020.b: "Рассказать им правду."

 preftl.2021.name: "Сила веры"
 preftl.2021.desc: "Слухи о демонах, без устали трудящихся на [Target.GetName&prep], распространяются всё быстрее. К нашим врачам стекаются фанатики, жаждущие [Root.GetBloodType&gen]. $preftl.2020.name.outro$"

 preftl.2025.name: "Синдром спасителя"
 preftl.2025.desc: "На [Target.GetName&prep] появилось сразу несколько так называемых мессий — пророков, обещающих своей пастве божественное спасение. Эти обещания мгновенно привлекли немало отчаявшихся последователей. Теперь к страданиям от пандемии прибавились жестокие столкновения между соперничающими сектами."
 preftl.2025.a: "Тернист путь к божественной истине."

 preftl.2026.name: "Истинный пророк"
 preftl.2026.desc: "[Target.GetName] наконец-то может вздохнуть свободно: чума закончилась. Благодаря нашим усилиям выжившие сплотились вокруг пророка, возвещающего истинную веру. В благодарность за помощь местное священство предложило нам услуги своего представителя — по их утверждениям, весьма способного чиновника."
 preftl.2026.a: "Хвала Всевышнему."
 plague_03_spiritualist: "Оправданные средства"
 plague_03_spiritualist_desc: "Ещё одно общество открыло глаза и приняло истинную веру. Наше слово слышат по всей галактике."
 plague_03_militarist: "$plague_03_spiritualist$"
 plague_03_militarist_desc: "Ещё одна планета получила возможность защитить себя в этой жестокой галактике."
 true_prophet_tt: "К нашему государству присоединяется опытный чиновник."
 leader_trait_zealot: "Непоколебимая вера"
 leader_trait_true_prophet_desc: "Этот лидер заглянул в бездну и с тех пор обладает незыблемой верой."
 leader_trait_zealot_desc: "Этот лидер заглянул в бездну и с тех пор обладает незыблемой верой."

 preftl.2030.name: "Изорванные флаги"
 preftl.2030.desc: "Население [Target.GetName&gen], истощённое, больное и едва не сошедшее с ума от беспрерывного горя и бесконечных войн, вряд ли ждёт светлое будущее."
 plague_05: "Изорванные флаги"
 plague_05_desc: "Когда кризис становится нормой, жертвы либо гибнут, либо бьются насмерть."

 preftl.2031.name: "Блистательное знамя"
 preftl.2031.desc: "[Target.GetName] наконец-то может вздохнуть свободно: чума закончилась. Поддержанная нами фракция сплотила население под своим знаменем. В благодарность за помощь правящая хунта предложила нам услуги своего командира — по их утверждениям, превосходно проявившего себя на поле боя."
 preftl.2031.a: "Сила есть добродетель."
 brilliant_banner_tt: "К нашему государству присоединяется опытный командир."
 leader_trait_plague_hardened: "Закалка чумой"
 leader_trait_plague_hardened_desc: "Этот командир узрел саму бездну и с тех пор может похвастать острым и прочным умом."

 preftl.2035.name: "Апокалипсис сегодня"
 preftl.2035.desc: "Благодаря нашим тщательным усилиям чума полностью опустошила [Target.GetName&acc]. Немногие выжившие теперь наблюдают стремительный крах цивилизации. Подтолкнуть их к окончательной гибели будет несложно.\n\nМы унаследуем опустевший мир."

 preftl.2040.name: "Укреплённый иммунитет"
 preftl.2040.desc: "Образец, добытый нами с [Target.GetName&gen], уже принёс научные результаты. Мутация, защищающая носителя от чумы, может справляться и с большинством других видов инфекций.\n\nПрактическое применение этой находки займёт некоторое время, но первые результаты уже весьма многообещающи."

 preftl.2049.name: "Непостоянные условия"
 preftl.2049.desc: "Стремительная смена обстановки на [Target.GetName&prep] исключает любые наблюдения за пандемией. Пока что придётся приостановить все исследовательские работы на этом мире."

 preftl.2063.intro: "[Target.GetName] молчит. Лишь ветер колышет траву на опустевших равнинах. Дома, где когда-то кипела жизнь, теперь молчаливо взирают на нас своими окнами."
 preftl.2063.name: "Безмолвный мир"
 preftl.2063.desc: "$preftl.2063.intro$\n\nНаселение планеты уничтожено. Чума закончилась."

 preftl.2051.name: "Мёртвый мир"
 preftl.2051.desc: "$preftl.2063.intro$ Наша задача выполнена: население планеты уничтожено. Этот мир готов принять наших колонистов."
 dead_world_tt: "Население [Target.GetName&gen] уничтожено."

 preftl.2062.name: "Массовая гибель"
 preftl.2062.desc: "По мере того как чума продолжает терзать население [Target.GetName&gen], количество покойников и умирающих растёт огромными темпами.\n\nЛекарства нет. Страдания можно только облегчить, но не предотвратить."

 preftl.2065.name: "С широко раскрытыми душами"
 preftl.2065.desc: "Наш ответ на пандемию на [Target.GetName&prep] больше нельзя скрывать. Население в предсмертном отчаянии обратило взгляд к звёздам. Нашими стараниями их души готовы принять истину. Что будет дальше, пока ещё неясно."
 opinion_plague_situation_01: "Благодарное население"
 minds_open_tt: "Жители [Target.GetName&gen] стали лучше о нас думать."

 preftl.2070.name: "Непоколебимая вера"
 preftl.2070.desc: "[Target.GetName] наконец-то может вздохнуть спокойно: чума закончилась. Вместе с ней закончилась и эпоха пророков; теперь вместо них процветают полноценные религии. Народ, обретший новый смысл жизни, начинает восстанавливать разрушенную цивилизацию."

 preftl.2075.name: "Хозяева полей брани"
 preftl.2075.desc: "[Target.GetName] наконец-то может вздохнуть спокойно: чума закончилась. Вместе с ней закончилась и эпоха самозваных командиров; теперь вместо них процветают полноценные общины воинов. Народ, стремящийся поскорее забыть пережитое, теперь ждёт твёрдых и решительных действий от своих лидеров."

 preftl.2080.name: "Благодарное население"
 preftl.2080.desc: "Благодаря нашим тщательным усилиям самые страшные последствия чумы, бушующей на [Target.GetName&prep], удалось пресечь. Однако скрывать нашу истинную природу больше невозможно. Местные жители поняли, что их спасли пришельцы с другой планеты. Преисполнившись благодарности, они теперь с надеждой глядят на звёзды."
 plague_02: "Наслаждение благодарностью"
 plague_02_desc: "Спасение целой планеты — достойный повод для радости."

 grateful_populace_tt: "Жители [Target.GetName&gen] стали лучше о нас думать."

 preftl.2085.name: "Массовый экзорцизм"
 preftl.2085.desc: "Самые страшные последствия чумы, бушующей на [Target.GetName&prep], удалось сдержать. Впрочем, вместо благодарности выжившие, преисполненные праведной ярости, обрушились на «демонов», стремящихся погубить их культуру. Оказавшись не в силах противостоять такой травле, наши гуманитарные работники были вынуждены покинуть планету. Местное население, не осознавая ещё истину в полном масштабе, теперь нервно посматривает на звёзды."
 preftl.2085.a: "Неблагодарные существа."
 plague_04: "Праведный гнев"
 plague_04_desc: "Нас отвергли существа, которым отраднее прозябать в своём невежестве, чем принять нашу помощь. В будущем мы будем больше думать о своих интересах."
 opinion_plague_situation_03: "Неблагодарность"
 mass_exorcism_tt: "Жители [Target.GetName&gen] стали хуже о нас думать."

 preftl.2090.name: "Источник молодости"
 preftl.2090.desc: "[Target.GetName] наконец-то может вздохнуть спокойно: чума закончилась. Одновременно с этим закончилось и наше изучение крепкого иммунитета местных жителей. Теперь перед нами стоит выбор: поделиться этой технологией только с нашими правителями или со всем населением в целом. Правящее сословие наверняка по достоинству оценит перспективы долголетия, но благодарность населения тоже принесёт свои плоды."
 preftl.2090.desc.hive: "[Target.GetName] наконец-то может вздохнуть спокойно: чума закончилась. Одновременно с этим закончилось и наше изучение крепкого иммунитета местных жителей. Несомненно, это знание нам пригодится, но теперь перед нами стоит выбор: поделиться им только с нашими правителями или со всеми единицами в целом."
 preftl.2090.desc.machine: "[Target.GetName] наконец-то может вздохнуть спокойно: чума закончилась. Одновременно с этим закончилось и наше изучение крепкого иммунитета местных жителей. [Owner.GetName] заслуживает плодов этого знания."
 preftl.2090.a: "Всё лучшее лидерам."
 preftl.2090.b: "Благо населения превыше всего."
 opinion_plague_situation_02: "Долгая благодарность"
 young_leaders: "Омоложённые правители"
 young_people: "Омоложённое население"

 ### Organic Singularity Situation
 situation_pre_ftl_singularity: "Органическая сингулярность"
 situation_pre_ftl_singularity_type: "Событие «Сингулярность»"
 situation_pre_ftl_singularity_desc: "Население [Target.GetName&gen] столкнулось с представителем нового биологического вида. Ему свойственны узловое сознание и способность производить сложные операции. Налаживание контакта с этим существом может в долгосрочной перспективе вызвать органическую сингулярность."
 situation_pre_ftl_singularity_monthly_change_tooltip: "Выбранный нами подход определит скорость накопления прогресса в этой §Yситуации§!."

 approach_watch_singularity: "Наблюдать и изучать"
 approach_watch_singularity_tooltip: "Наблюдение за происходящим обогатит нас новыми знаниями."
 approach_allow_tooltip: "Изменить выбранный подход невозможно."
 approach_prevent_singularity: "Помешать"
 approach_prevent_singularity_tooltip: "Предотвращение сингулярности потребует постоянной траты ресурсов. Этот подход нельзя будет сменить."
 approach_promote_singularity: "Помочь"
 approach_promote_singularity_tooltip: "Способствование наступлению сингулярности потребует значительной затраты ресурсов. Этот подход нельзя будет сменить."
 situation_singularity_stage_one: "Наступление сингулярности"

 # Starting event
 preftl.2101.name: "Открыто узловое сознание"
 preftl.2101.desc: "[from.owner.GetSpeciesAdj&pl] исследователи открыли на [from.owner.capital_scope.GetName&prep] ранее неизвестный науке вид моллюскоидов. По отдельности каждого из них едва ли можно назвать разумным, но при физическом соединении двух или более особей они образуют полуразумный узел. Теоретически в этих узлах может начаться экспоненциальный рост когнитивных способностей.\n\nПроще говоря, жители [from.owner.capital_scope.GetName&gen] наткнулись на биологический компьютер. Со временем это открытие может стать началом органической сингулярности."
 preftl.2101.can_not_help.desc: "$preftl.2101.desc$\n\nМы решили, что [owner.GetPreFTLLower&pl] миры обойдутся без нашего вмешательства, но разве можно оставаться в стороне?"
 preftl.2101.a: "Наблюдать и изучать"
 preftl.2101.b: "Предотвратить сингулярность"
 preftl.2101.c: "Поспособствовать сингулярности"

 #Organic Singularity Events

 preftl.2110.name: "Блаженное неведение"
 preftl.2110.desc: "Жители [Target.GetName&gen], даже не подозревая о грозящей им опасности, продолжают проводить эксперименты над узловым сознанием. Сделанные им расчёты применяются везде — от строительства до образования.\n\nЗатормозить эти эксперименты будет нелегко, но, заразив водоёмы планеты генетически модифицированным вирусом, мы сможем ослабить когнитивные способности отдельных узлов.\n\nРазумеется, как и в случае с любой другой неиспытанной технологией, мы идём на риск с неизвестными последствиями."
 preftl.2110.a: "Внедрить вирус."

 preftl.2115.name: "Биологические вычислители"
 preftl.2115.desc: "Последовательно проводимые на [Target.GetName&prep] эксперименты привели к тому, что её население начало пользоваться узловым сознанием в качестве примитивного мыслящего устройства.\n\nОбретя возможность мгновенно проводить сложнейшие вычисления, местные учёные придали научно-техническому прогрессу совершенно немыслимый темп."

 preftl.2120.name: "Экспоненциальный рост"
 preftl.2120.desc: "[Target.GetName] всё быстрее приближается к органической сингулярности.\n\nУзловое сознание значительно перестроило сельское хозяйство, обеспечив населению богатые урожаи и здоровую пищу. Принятие решений всё чаще перекладывается на условные плечи биологического компьютера."
 exponential_growth_tt: "Уровень жизни на наблюдаемой планете значительно вырастет."

 preftl.2125.name: "Они что-то подозревают"
 preftl.2125.desc: "Наши агенты на [Target.GetName&prep] выпустили модифицированный вирус в водоёмы. Согласно первичным донесениям, производительность узлового сознания значительно снизилась.\n\nК сожалению, сохранить тайну удалось не до конца. Среди местного населения начинают ходить слухи о вмешательстве со стороны чужаков."

 preftl.2130.name: "Органическая идиллия"
 preftl.2130.desc: "[Target.GetName] теперь почти целиком зависит от узлового сознания. Этот биологический компьютер теперь единолично принимает все административные решения, и результаты не описать иначе, как «поразительные».\n\nЭкономика бурно растёт, а уровень жизни поднялся на высоту, о которой каких-то двадцать лет назад невозможно было даже мечтать."

 preftl.2135.name: "Непростая синергия"
 preftl.2135.desc: "На [Target.GetName&prep] появились первые ростки нового уровня сознания. Впрочем, как поняли наши наблюдатели, у биокомпьютера есть собственные планы.\n\nВ стремлении «оптимизировать» свою деятельность узловое сознание решило ограничить некоторые элементарные удобства. Работа, которая раньше требовала ручного труда, теперь всё чаще выполняется автоматически. Местное правительство не может (или не хочет) прекратить этот процесс.\n\nВсё больше жителей начинают испытывать тревогу от происходящего."

 preftl.2136.name: "Процветающий союз"
 preftl.2136.ftl.desc: "Развитие узлового сознания на [Target.GetName&prep] стабилизировалось. Очевидно, этому миру больше не грозит сингулярность.\n\nОднако в результате мощного научного рывка [Target.GetName] полноценно [Target.GetName::освоил<end_a>] технологию сверхсветовых двигателей. Агенты правительства быстро захватили всю звёздную систему и разобрали наш наблюдательный форпост."
 preftl.2136.preftl.desc: "Развитие узлового сознания на [Target.GetName&prep] стабилизировалось. Новые научные и социальные достижения теперь случаются реже, чем раньше.\n\nОчевидно, этой планете больше не грозит сингулярность. Вместо этого общество полностью интегрировалось со своим биокомпьютером. Благодаря ему выросла новая, здоровая и ни в чём не нуждающаяся цивилизация."
 thriving_union_tt: "Цивилизация на [Target.GetName&prep] достигает нового уровня технического и социального прогресса."
 preftl.2136.a: "Наши притязания на систему нельзя игнорировать."
 preftl.2136.b: "Великий день для их цивилизации."

 preftl.2140.name: "Единая власть"
 preftl.2140.desc: "На [Target.GetName&prep] возникла сингулярность.\n\nСпустя много лет экспоненциального роста узловое сознание полностью себя осознало и мгновенно укрепило свою власть, сделав её абсолютной. Население планеты превратилось в марионеток, многие навсегда распрощались со свободой и теперь существуют лишь для того, чтобы обслуживать нужды улья."
 preftl.2140.a: "Естественный порядок возобладал."

 preftl.2145.name: "Альтернативная программа"
 preftl.2145.desc: "Наши попытки приблизить наступление сингулярности на [Target.GetName&prep] уже приносят результаты.\n\nПочти весь мир опутан единой сетью узлового сознания, которое уже начинает принимать за местных жителей даже самые бытовые решения. Однако в стремлении «оптимизировать» свою деятельность оно избавилось от некоторых элементарных удобств, а потому обитатели планеты начинают подозревать, что моллюскоид действует вовсе не ради их блага."
 preftl.2145.a: "Это было неизбежно."

 preftl.2150.name: "По крайней мере они съедобные"
 preftl.2150.intro: "Подвергнув узловое сознание на [Target.GetName&prep] генетической модификации, мы уничтожили возможность перехода на новый уровень сознания в зародыше."
 preftl.2150.desc: "$preftl.2150.intro$ Теперь можно с уверенностью сказать, что сингулярность предотвращена.\n\nМестное население всё ещё активно пользуется связанными моллюскоидами для расчётов, но для многих стало приятным открытием, что эти существа — отличный источник белка."
 preftl.2150.a: "И все довольны."

 preftl.2155.name: "Случайная вспышка"
 preftl.2155.desc: "$preftl.2150.intro$ К сожалению, заражение водоёмов новым для этой планеты вирусом привело к неожиданным осложнениям. Сначала заразилась местная фауна, а затем — и разумное население.\n\nНам удалось предотвратить сингулярность, но, вне всяких сомнений, зарождающаяся цивилизация понесла от этого невосполнимый ущерб."

 preftl.2160.name: "Единение"
 preftl.2160.desc: "На [Target.GetName&prep] наступила сингулярность. Спустя всего несколько часов после возвышения коллективный разум поглотил более 90% населения планеты. На немногих оставшихся идёт охота.\n\nНа наших глазах зарождается единое сознание."
 preftl.2160.tt: "[Target.Owner.GetName] становится коллективным разумом."

 preftl.2165.name: "Единая судьба"
 preftl.2165.desc: "Ситуация, за которой мы наблюдали, пришла к резкому завершению.\n\nВ нашей вселенной вечны только перемены. К добру или к худу, рано или поздно мы столкнёмся с новой подобной ситуацией."

 singularity_situation_01: "Экспоненциальный рост"
 exponential_growth_01_desc: "Благодаря стремительному технологическому прогрессу уровень жизни растёт."
 singularity_situation_02: "Экспоненциальный рост"
 singularity_situation_02_desc: "$exponential_growth_01_desc$"
 singularity_situation_03: "Съедобные машины"
 edible_machines_03_desc: "Эти думающие устройства оказались на удивление вкусными. Не сингулярность, но тоже неплохо."
 singularity_situation_04: "Съедобные машины"
 singularity_situation_04_desc: "$edible_machines_03_desc$"
 singularity_situation_05: "Затягивание поясов"
 singularity_situation_05_desc: "Для повышения производительности на планете резко сокращаются бюджетные инвестиции."
 singularity_situation_06: "Бурное развитие исследований"
 singularity_situation_06_desc: "Благодаря открытию думающих машин учёные добиваются невероятных результатов."
 singularity_situation_07: "Рабы компьютера"
 singularity_situation_07_desc: "Органическая сингулярность вылилась в полное подчинение населения планеты."

