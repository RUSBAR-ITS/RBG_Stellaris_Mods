 # Starting event
 preftl.2167.name: "Новый мировой порядок"
 preftl.2167.desc: "На [from.owner.capital_scope.GetName&prep] появился харизматичный лидер, проповедующий радикальную доктрину всеобщего объединения. На пути нового мирового правительства стоит лишь одна группа относительно плохо вооружённых повстанцев."
 preftl.2167.can_not_help.desc: "$preftl.2167.desc$\n\nМы решили, что [owner.GetPreFTLLower&pl] миры без нашего вмешательства, но разве можно оставаться в стороне?"
 preftl.2167.a: "Наблюдать и изучать"
 preftl.2167.b: "Помочь лидеру"
 preftl.2167.c: "Помочь мятежникам"
 new_world_order_offensive_army: "Силы объединителей"
 new_world_order_offensive_army_desc: "Патриоты, вставшие на защиту своей раздробленной родины."
 new_world_order_defensive_army: "Повстанческие силы"
 new_world_order_defensive_army_desc: "$new_world_order_offensive_army_desc$"
 NAME_Pro_Unification_Faction: "Фракция объединителей"
 increase_aid_tt: "Дальнейшая поддержка ненамного повысит шансы на благоприятный исход."
 arm_them_tt: "Предоставление современных вооружений значительно повысит шансы на благоприятный исход."

 preftl.2170.name: "Укрепление"
 preftl.2170.desc: "У повстанцев на [Target.GetName&prep] мрачные перспективы: силы объединителей захватили власть в большинстве населённых центров планеты. [Target.Owner.GetRulerName] насаждает единство железным кулаком. Любые протесты мгновенно подавляются."
 preftl.2170.a: "Усилить помощь повстанцам."
 preftl.2170.b: "Мы можем помощь объединителям ещё больше."

 preftl.2175.name: "Военные преступления"
 preftl.2175.desc: "На [Target.GetName&prep] бушуют бои: силы объединителей и повстанцев продолжают сражаться не на жизнь, а на смерть. В этой борьбе обе стороны отбросили любые правила и открыто применяют запрещённые методы ведения войны."
 preftl.2175.a: "Повстанцам как никогда нужна наша помощь."
 preftl.2175.b: "Усилить поддержку объединителей."

 preftl.2180.name: "Полные карманы"
 preftl.2180.a.desc: "На [Target.GetName&prep] продолжается гражданская война, силы объединителей уже почти одержали окончательную победу.\n\nТем временем далеко в тылу местные чиновники пользуются любой возможностью обогатиться. Сдерживать голоса недовольных им пока что удаётся, но население уже в курсе разгула коррупции."
 preftl.2180.b.desc: "Бои между объединителями и повстанцами на [Target.GetName&prep] приняли характер изнурительной позиционной войны. В укреплениях с обеих сторон всё чаще начали появляться полевые командиры, которые обогащаются за счёт взяток и коррупции. Как это повлияет на ход конфликта, пока неизвестно."
 preftl.2180.a: "Разжечь гражданские беспорядки."
 preftl.2180.b: "Поручить агентам легитимизировать режим."

 preftl.2185.name: "Подавить и уничтожить"
 preftl.2185.a.desc: "Нестабильность, вызванная коррупцией и неэффективным управлением местных лидеров на [Target.GetName&prep], привела к росту народной поддержки повстанцев.\n\n[Target.Owner.GetRulerName] [Target.Owner.RulerGetAXX::приказал<end_a>] войскам провести ряд карательных операций в крупных городских центрах, чтобы подавить восстания."
 preftl.2185.b.desc: "Растущая коррупция и неэффективное управление со стороны местных лидеров на [Target.GetName&prep] привели к падению поддержки войны со стороны населения. Военные командиры с обеих сторон вынуждены силой подавлять гражданские беспорядки."
 preftl.2185.a: "Повысить логистическую поддержку."

 preftl.2190.name: "Демонстрация силы"
 preftl.2190.a.desc: "На [Target.GetName&prep] войска повстанцев отступают по всем фронтам, [Target.Owner.GetRulerName] празднует триумф.\n\nОднако на фасаде нового мирового порядка уже начали показываться трещины: высокопоставленные чиновники плетут козни против победоносных военачальников, а в коридорах власти рыскают охочие до наживы лизоблюды.\n\nНовому правителю скоро предстоит битва на совершенно новом фронте."
 preftl.2190.b.desc: "Ни одна из сторон так и не смогла захватить полный контроль, и [Target.GetName::<1> погрузи<end_lsya>]. Повсюду борются за власть мелкие полевые командиры, тут и там, как грибы после дождя, возникают новые радикальные движения. Планету продолжают сотрясать величайшие волнения в её истории, и мир на этой земле, похоже, наступит нескоро."
 preftl.2190.a: "Начать вооружать силы повстанцев."

 preftl.2195.name: "Всеобщая революция"
 preftl.2195.a.desc: "Возмущённый коррумпированностью и развратом чиновников народ [Target.GetName&gen] взял в руки оружие в поддержку повстанцев. В каждом городе и в каждой деревне бушует пожар революции."
 preftl.2195.b.desc: "На [Target.GetName&prep] царит хаос.\n\nПо сельской местности в поисках пропитания рыскают банды разбойников, [Target.Owner.GetRulerName] пытается удержать контроль, но императорская власть ослабла и заканчивается едва ли не у ворот дворца.\n\nЕсли не наступит каких-нибудь радикальных перемен, силы объединителей в скором времени ждёт поражение."
 preftl.2195.a: "Начать вооружать объединителей."

 preftl.2200.name: "Хватка самодержца"
 preftl.2200.desc: "Проявив чудеса стратегического мышления, [Target.Owner.GetRulerName] [Target.Owner.RulerGetAXX::сломил<end_a>] сопротивление на планете. Тайные агенты в рядах повстанцев помогли организовать координированное наступление по всем фронтам. Генералы повстанцев не успели сориентироваться, и их позиции были быстро смяты. \n\n[Target.GetName] теперь единая планета."
 preftl.2200.a: "Вечная память павшим."

 preftl.2205.name: "Нулевой год"
 preftl.2205.a.desc: "События разворачиваются совершенно неожиданным образом: [Target.Owner.GetRulerName] [Target.Owner.RulerGetAXX::потерял<end_a>] власть.\n\nОбъединившись с группой беспринципных военачальников в рядах действующего режима, силы повстанцев смогли организовать координированное наступление по всем фронтам. Командиры объединителей не успели сориентироваться, и их позиции были быстро смяты.\n\nЛидера режима провели закованным в цепи по улицам столицы и казнили. Победоносные повстанцы дали регионам право самим проводить свою политику. После многих лет войны на планете наконец наступает хрупкий мир."
 preftl.2205.b.desc: "[Target.Owner.GetRulerName] [Target.Owner.RulerGetAXX::потерял<end_a>] власть.\n\nЛидера режима провели закованным в цепи по улицам столицы и казнили. Победоносные повстанцы дали регионам право самим проводить свою политику. После многих лет войны на планете наконец наступает хрупкий мир."
 preftl.2205.a: "Со временем [Target.Owner.GetRulerName] ещё станет для них добрым воспоминанием."

 nwo_situation_01: "Триумф автократии"
 nwo_situation_01_desc: "Сила несёт единство, единство несёт счастье."
 nwo_situation_02: "Освобождённые флаги"
 nwo_situation_02_desc: "Разноликое общество несёт счастье. Счастье несёт единство."
 nwo_situation_03: "Усиление помощи"
 nwo_situation_03_desc: "Эти ресурсы помогут закончить конфликт быстро и справедливо."