 situation_pre_ftl_plague_monthly_change_tooltip: "$situation_monthly_change_tooltip_no_control$"
 situation_pre_ftl_plague_outcome_tooltip: "Когда-нибудь эта чума закончится. Что останется после неё — зависит от нас."

