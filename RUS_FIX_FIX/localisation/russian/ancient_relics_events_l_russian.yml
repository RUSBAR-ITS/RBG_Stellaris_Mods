l_russian:

 crisis.250.name: "Новое потомство"
 crisis.250.desc: "Матка породила новую преторинскую флотилию, которая заняла орбиту над [Root.Capital.GetName&inst]. Пока матка у нас под контролем, эти существа будут предельно верными, они подчинятся любой нашей команде."
 crisis.252.name: "Матка захвачена в плен"
 crisis.252.desc: "В недавнем космическом сражении с преторинами в системе [battle_system.GetName&gen] нашим войскам удалось захватить что-то вроде яйца, которое перевозила одна из их маток. Вскоре из этого яйца вылупилась новая §Hматка§!.\n\nПри помощи нейронных передатчиков наши учёные сумели усмирить это существо. Сейчас она выполняет наши команды, как если бы их отдавал коллективный разум преторинов. Теоретически мы можем использовать эту матку, чтобы вырастить своё собственное преторинское потомство."
 crisis.1250.name: "Колдун"
 crisis.1250.desc: "После того как бурлящая энергия, оставшаяся после уничтожения последнего межпространственного портала, рассеялась, наши войска обнаружили ослабевшее экстрамерное существо, дрейфовавшее поблизости. Оно было взято в плен и допрошено.\n\nСудя по всему, это §Hколдун§! — одно из могучих, даже по их меркам, существ, которые отвечают за сохранение портала между нашей и их реальностями. Если мы сможем изучить или даже использовать его псионическую силу, это позволит нам значительно повысить нашу субсветовую скорость и дальность действия прыжковых двигателей."
 crisis.2480.name: "Ядро центрального компьютера спасено"
 crisis.2480.desc: "Нашим войскам удалось спасти частично уцелевшее §Hядро центрального компьютера Контингенции§! из обломков их последнего Мира машин. Этот невероятно мощный компьютер использовался для планирования и технического обслуживания строительных программ Контингенции. Он позволит нам значительно повысить [GetContingencyCoreEffect].\n\nРазумеется, необходимо будет внедрить многоуровневую систему безопасности, чтобы предотвратить повторную активацию любых остатков кода Контингенции, иначе это может привести к... неблагоприятным побочным эффектам." #'GetContingencyCoreEffect' will usually insert string 'crisis.2840.robot_mega'
 crisis.2481.desc: "Нашим войскам удалось захватить практически неповреждённое §Hядро центрального компьютера Контингенции§!, пытавшееся покинуть последний Мир машин до того, как его окутал щит. Этот невероятно мощный компьютер использовался для планирования и технического обслуживания строительных программ Контингенции. Он позволит нам значительно повысить [GetContingencyCoreEffect].\n\nРазумеется, необходимо будет внедрить многоуровневую систему безопасности, чтобы предотвратить повторную активацию любых остатков кода Контингенции, что могло бы привести к... неприятным побочным эффектам."
 crisis.2840.robot_mega: "скорость создания роботов и строительства мегасооружений"
 crisis.2840.engineering_mega: "скорость инженерных исследований и строительства мегасооружений"
 marauder.710.name: "Обнаружен трон Великого хана"
 marauder.710.desc: "Порыскав среди обломков флагмана Великого хана, наши войска нашли большое запачканное [FROM.GetBloodType&inst] кресло, летевшее в космосе. Мы имеем все основания полагать, что этот предмет мебели и есть трон Великого хана.\n\nРеликвия помещена в надёжное хранилище."
 story.335.name: "Топограф активирован"
 story.335.desc: "Мы прошлись по нашему пространству мощным сканирующим лучом реликвии под названием Топограф и обнаружили ранее неизвестные залежи ресурсов на объекте §H[chosen_planet.GetName]§!."
 precursor.105.name: "Реальность перфорирована"
 precursor.105.desc: "На какое-то мгновение ткань вселенной вокруг древней вультаумской реликвии словно искажается и затем расширяется. По мере того как известная нам реальность медленно восстанавливает свои позиции, нам предоставляется короткий промежуток времени, в который можно изящно переписать некоторые правила."
 precursor.105.a: "Освободите ваш разум."
 relic_reality_perforated: "Перфорировать реальности ради значительных боевых преимуществ на короткое время."
 relic_javorian_pox: "Активирует тактику орбитальной бомбардировки уровня §Yяворианская чума§!\nУвеличивает вероятность получения £society£ §Yбиотехнологий§!"
 site_command_center: "Сверхпрочная дверь на астероиде"
 site_command_center_intro: "В результате столкновения астероида [From.Planet.GetName] с астероидом поменьше была обнаружена небольшая сверхпрочная дверь или воздушный шлюз, немного выступающий над поверхностью. Этой двери, похоже, тысячи лет, и ранее она скрывалась под слоем камней и пыли.\n\nСканировать внутреннюю часть астероида мы по неизвестным причинам не можем, как и открыть саму дверь посредством привычных нам режущих инструментов. Чтобы узнать, что находится за этой дверью, команде, вероятно, придётся пробираться к центру астероида с другой стороны."
 ancrel.6005.name: "Бурение скважины"
 ancrel.6005.desc: "Какая-то очень крупная конструкция занимает большую часть внутреннего пространства астероида [From.Planet.GetName]. Сверхпрочную дверь, когда-то служившую единственным входом туда, открыть по-прежнему не получается, но с другой стороны астероида удалось прорыть проход.\n\nБуры пока не могут пройти сквозь толстые внешние стенки конструкции, однако этим способом у нас всё-таки больше всего шансов получить туда доступ. Несмотря на свой возраст, сверхпрочная дверь оказалась почти неуязвимой."
 ancrel.6010.name: "Вход"
 ancrel.6010.desc: "Наконец-то удалось просверлить дыру во внешних стенках конструкции, расположенной внутри астероида [From.Planet.GetName]. Там оказалось что-то вроде огромного командного центра или бункера, усеянного разложившимися останками тысяч мёртвых инопланетян.\n\nНужно будет тщательно всё проанализировать, чтобы понять, что именно случилось внутри астероида, а это займёт немало времени."
 ancrel.6015.name: "Командный центр"
 ancrel.6015.desc: "Этот астероид когда-то служил тайной столицей сравнительно крупной межзвёздной империи, которая доминировала в этом секторе галактики несколько тысяч лет назад. Из укреплённого командного центра правящая элита вместе с тысячами военных и гражданских должностных лиц управляла империей, защитившись от жестоких восстаний, которые часто возникали из-за их суровой политики.\n\nКонтакт с остальной частью их империи, похоже, осуществлялся исключительно с помощью зашифрованных подпространственных сообщений и одного грузового корабля, который периодически прилетал сюда для пополнения припасов базы и смены персонала."
 ancrel.6020.name: "Последние дни"
 ancrel.6020.desc: "Судя по обрывочным данным, грузовой корабль, летевший пополнить припасы, похоже, столкнулся с этим астероидом из-за неисправности двигателя. Последовавший взрыв повредил сверхпрочную дверь и уничтожил подпространственный передатчик астероида, навечно прервав все контакты с внешним миром.\n\nОбитатели астероида, попавшие в ловушку и не имевшие надежды на спасение, постепенно умерли либо от голода, либо в результате самоубийства. Последние записи их единственного уцелевшего подпространственного приёмника подтверждают, что их государство, внезапно лишившаееся столицы, погрузилось в гражданскую войну и анархию."

 site_hunting_ground: "Окаменелые останки"
 site_hunting_ground_intro: "В большой изолированной долине на [From.Planet.GetName&prep] удалось обнаружить окаменелые останки представителей нескольких различных рас, которые, судя по всему, не являются [From.Planet.GetName::<ego_eyo>] коренными жителями. Этим останкам примерно 3.6 миллиона лет, с разницей максимум в несколько столетий.\n\nКаждая из этих рас, видимо, эволюционировала в собственной уникальной биосфере, и все они, похоже, были разумными. Странно, но, судя по внешним признакам, все окаменелые индивиды, найденные до сих пор, скончались в результате насильственной смерти."
 ancrel.6050.name: "Новые останки"
 ancrel.6050.desc: "Археологи обнаружили в долине ещё больше окаменелых останков, и количество чётко выделяемых разумных рас, ни одна из которых не является коренной для [From.Planet.GetName&gen], достигло 26. Окаменелости, достаточно хорошо сохранившиеся для определения причины смерти, указывают на физическую травму, нанесённую клинком, копьём или стрелой. По всей видимости, ни один экземпляр не погиб от чего-либо эквивалентного современному кинетическому или энергетическому оружию.\n\nУ входа в долину были найдены руины какого-то маленького сооружения. Оно, похоже, относится к тому же временному периоду, что и окаменелости. Возможно, его изучение прольёт на всё это хоть какой-то свет."
 ancrel.6055.name: "Сторожка"
 ancrel.6055.desc: "Раскопки древнего сооружения, найденного у входа в долину, идут согласно плану. Обнаружено множество артефактов, большинство из которых представляют собой вариации охотничьего оружия и трофеев. Удалось частично перевести надпись, по-видимому, содержащую название сооружения:\n\n§HДОЛИНА МАКВАЭЛ — ГЛАВНАЯ ОХОТНИЧЬЯ СТОРОЖКА§!"
 ancrel.6060.name: "Вотчина ретараксов"
 ancrel.6060.desc: "Дальнейшие раскопки рядом с охотничьей сторожкой дали более подробную информацию. [From.Planet.GetName] — и долина Макваэл, в частности — [From.Planet.GetName::служил<end_a>] охотничьим заповедником для правящего класса воинов в межзвёздном государстве, известном под названием §HВотчина ретараксов§!.\n\nРетараксы, раса пернатых хищников, периодически собирали случайных представителей множества покорённых инопланетных цивилизаций, оказавшихся под их властью. Затем этих инопланетян убивали во время охоты в долине Макваэл, в соответствии с ритуалами, регулируемыми обществом ретараксов. Эта традиция просуществовала несколько столетий, пока Вотчина в конце концов не стала жертвой неопределённой внешней угрозы."
 ancrel.6065.name: "Охотница"
 ancrel.6065.desc: "Археологи, занимающиеся раскопками возле охотничьей сторожки, натолкнулись на несколько упоминаний легендарной воительницы из расы ретараксов, прозванной §HОхотницей.§! Очевидно, она была их самой эффективной убийцей, прославившейся по всей Вотчине тем, что собственноручно перебила тысячи инопланетян в долине Макваэл.\n\nНеясно, является ли её история правдой или выдумкой, но, согласно легенде ретараксов, Охотницу убили где-то в долине, когда её обхитрил пришелец, которого она же сама и преследовала как добычу. Предположительно, тогда она имела при себе знаменитый §HКлинок Охотницы§!."
 ancrel.6070.name: "Клинок Охотницы"
 ancrel.6070.desc: "После старательного прочёсывания долины Макваэл в поисках каких-либо следов легендарной Охотницы археологи наконец смогли установить место её последнего упокоения. Окаменелый скелет Охотницы застыл навеки в схватке с останками крупного рогатого членистоногого, причём её когти продолжали сжимать рукоятку идеально сохранившегося меча.\n\nДолжно быть, это и есть §HКлинок Охотницы§!. Оружие сделано из неизвестного материала и достаточно острое, чтобы пробить самую прочную броню."
 ancrel.6070.b.evopred: "Охотница оставила нам великолепное сокровище."

 ancrel.6099.name: "Обнаружено хамелеоновое поле"
 ancrel.6099.desc: "§H[tomb_planet.GetName]§! — это безжизненная [tomb_planet.GetPlanetMoon_rinfix&nom] в нашем пространстве, и недавно на её поверхности было обнаружено хамелеоновое энергетическое поле, скрывающее какое-то старое сооружение. О его существовании стало известно только благодаря случайному столкновению с астероидом, отражённым этим полем, когда [tomb_planet.GetPlanetMoon_rinfix&nom] была под наблюдением пролетавшего мимо грузового корабля."
 ancrel.6099.a: "Это нужно изучить."
 site_zarqlan: "Древняя гробница"
 site_zarqlan_intro: "Хамелеоновое энергетическое поле скрывало древнее сооружение на поверхности этой планеты. О его существовании стало известно только благодаря тому, что случайный наблюдатель увидел столкновение планеты с астероидом, который был отброшен этим полем.\n\nПосле деактивации поля археологи получили доступ к крупному комплексу зданий, ранее скрытому под его покровом."
 ancrel.6100.name: "Мавзолей"
 ancrel.6100.desc: "По всей видимости, это некий гигантский мавзолей или некрополь возрастом около сотни тысяч лет. Следов разграбления внутри не наблюдается, так что можно предположить, что комплекс оставался нетронутым с момента возведения хамелеонового поля.\n\nПроход в первую камеру комплекса открыт, но дальнейшему продвижению препятствует непроницаемая дверь. На стене над ней вырезаны крупные инопланетные символы на неизвестном языке."
 ancrel.6105.name: "Первая камера"
 ancrel.6105.desc: "Перевод инопланетных символов над дверью звучит следующим образом:\n\n§HЯ ЗАРКЛАН, страж МОЗ-ТАРБ, пророк ЗВА, победивший СЕТАНУ. Я отдал всё, что мог, ради спасения галактики, полной злобы и ненависти. Проходите дальше, если вы достойны.§!\n\nПрочесав первую камеру в поисках чего-нибудь интересного, археологи обнаружили крошечную скрытую панель в стене. После нажатия на неё с грохотом открылась древняя дверь. Теперь можно попасть во вторую камеру."
 ancrel.6110.name: "Вторая камера"
 ancrel.6110.desc: "Вторая камера ничем не примечательна, если не считать ещё одного набора инопланетных символов над закрытой дверью. Они гласят:\n\n§HМелкие царьки издавали указы моим именем. Империи вели войны в мою честь. Глупцы пели мне дифирамбы. И все же я отдал ради них жизнь.§!\n\nПотайных панелей, открывающих проход в третью камеру, пока что не найдено."
 ancrel.6115.name: "Третья камера"
 ancrel.6115.desc: "После долгих и утомительных поисков под полом был найден скрытый рычаг, открывший доступ в третью камеру. В ней обнаружилась очередная дверь, и, как и прежде, стена над ней была украшена инопланетными символами:\n\n§HЖелающие побеседовать с ЗАРКЛАНОМ должны сперва найти к нему дорогу. В каждой зале скрыт ключ, найти который сможет лишь достойный. Цель этих испытаний скоро откроется.§!"
 ancrel.6120.name: "Четвёртая камера"
 ancrel.6120.desc: "На этот раз рычаг был скрыт в потолке. Четвёртая камера содержит ещё больше инопланетных надписей:\n\n§HЗдесь вы не узнаете ничего. Испытания так же бессмысленны, как и эти слова. Таков мой урок. Я ЗАРКЛАН, всего лишь пешка. Захлёстнутая потоком истории. Иди дальше, и у тебя появятся последователи, если они все ещё будут тебя достойны.§!\n\nСледующая камера, скорее всего, будет последней."
 ancrel.6125.name: "Последняя камера"
 ancrel.6125.desc: "После изнурительных поисков был обнаружен последний «ключ» — это крошечная кнопка, спрятанная в одном из вырезанных инопланетных символов. В последней камере на гигантском троне сгорбилась неподвижная фигура крупного гуманоида. Сильный характерный запах намекает на разложение тела. Несколько символов в нижней части трона гласят: §HЗАРКЛАН, К ВАШИМ УСЛУГАМ.§!\n\nТело в таком состоянии, что его нельзя двигать с места, но голова сохранилась на удивление хорошо, несмотря на возраст. Не желая уходить с пустыми руками, археологи срезали голову лазерным резаком, чтобы унести её с собой."
 ancrel.6125.desc.b.evopred: "Мы просто обязаны добыть его ДНК, и неважно, что это святотатство!"
 ancrel.6130.desc: "Значит... это правда. Вы нашли легендарную гробницу Зарклана. Когда прорицатели сказали мне, мне не верилось, но доказательства неопровержимы. Насколько я понимаю, у вас имеется голова Пророка?\n\nЗначит, как и было предсказано, избранники великого Зарклана наконец раскрыты. По завету великого Зарклана любые незаселенные священные миры рядом с нашим пространством переходят в ваше полное распоряжение. Также многие набожные паломники [spiritualist_fallen_empire.Capital.GetName&gen] почтут за великую честь сражаться под вашими знамёнами."
 ancrel.6130.machine.desc: "Значит, все так и есть: легендарную гробницу Зарклана нашла самая обыкновенная машина. Когда прорицатели сообщили эту весть, мне трудно было поверить. Однако теперь очевидно, что у вас действительно имеется голова Пророка.\n\nВпрочем, не нам сомневаться в том, чего желает великий Зарклан. Отныне этот дар по праву принадлежит вашему народу. Как и сказано в древних писаниях, любые незаселённые священные миры рядом с нашими владениями полностью отходят вам — поступайте с ними как вам угодно. Многие набожные паломники на [spiritualist_fallen_empire.Capital.GetName&prep] почтут за великую честь сражаться за это святое дело."
 ancrel.6130.a: "Конец сообщения."
 opinion_zarqlans_chosen: "Избранники Зарклана"
 ancrel.6132.a.desc: "Верные слуги Зарклана в вашем распоряжении, [Root.GetSpeciesNamePlural]. Дайте нам знать, кого нужно сразить!"
 ancrel.6132.b.desc: "Мы призваны. Нет большей чести, чем служить Избранникам Зарклана."
 ancrel.6132.c.desc: "Мы принадлежим вам. Укажите нам своих врагов.\n\n§HТАКОВА ВОЛЯ ЗАРКЛАНА!§!"
 ancrel.6132.d.desc: "Вы позвали, и вот мы здесь!\n\nПусть у врагов Зарклана родятся уродливые дети! Пусть они поперхнутся съеденным, пусть их одежды распадутся в неуместный и досадный момент, пусть их органы зрения спонтанно воспламенятся, пусть..."
 ancrel.6132.a: "Такова воля Зарклана!"
 ancrel.6133.name: "Появление паломников"
 ancrel.6133.desc: "До наших дней дожило мало почитателей Зарклана, однако маленькая флотилия кораблей сопровождения с набожными, но необученными экипажами отправилась в путь к [Root.Capital.GetName&dat] и обязалась служить [Root.GetName&gen]."
 relic_summon_pilgrims: "Призвать маленькую флотилию угасшей империи. С каждой новой активацией флотилия будет увеличиваться."

 ancrel.6150.name: "Экранированная планета"
 ancrel.6150.desc: "Как подтвердило недавнее исследование, планета §H[From.GetName]§! окружена невероятно сильным энергетическим полем, которое препятствует любым попыткам её просканировать. Источник этого поля, похоже, находится на ближайшей луне планеты."
 ancrel.6151.desc: "§H[From.GetName]§! создаёт непроницаемый энергетический барьер, окружающий планету поблизости. Точный источник барьера определить трудно, но, похоже, он находится где-то глубоко под безжизненной поверхностью луны.\n\nВнутри одного из крупнейших кратеров луны находятся древние руины того, что когда-то, должно быть, являлось крупной базой, причём, возможно, военной. Есть вероятность, что удастся получить какие-то ответы."

 site_minigalaxy_1: "Лунная база"
 site_minigalaxy_1_intro: "Внутри большого кратера на этой луне обнаружены руины какой-то крупной базы. Должно быть, её покинули тысячи лет назад. Источник энергетического барьера, окружающего ближайшую планету, похоже, находится непосредственно под этой древней базой."
 ancrel.6155.name: "«Инициатива перемирия»"
 ancrel.6155.desc: "Дальнейшие раскопки среди руин на §H[From.Planet.GetName&prep]§! выявили, что заброшенная база была когда-то огромным военным комплексом, построенным §HИнициативой перемирия§!. Это был полупостоянный альянс, состоявший из как минимум пяти крупных и очень развитых межзвёздных держав, действовавших в этом галактическом регионе примерно 75 тысяч лет назад.\n\nТочная природа этого альянса неизвестна, но, похоже, его целью было немедленное прекращение нескольких длительных галактических войн. Крупные военные контингенты каждого из членов «Инициативы» были размещены на базе на этой луне."
 ancrel.6160.name: "Воюющая сторона 3"
 ancrel.6160.desc: "Экранированная планета в этой системе была столицей одного из воюющих государств, для препятствования которому и была создана «Инициатива перемирия». Название этого государства до сих пор неизвестно, и во всех обнаруженных документах «Инициативы» его упоминают просто как §Hвоюющая сторона №3§!.\n\nОчевидно, «Инициатива перемирия» стремилась наказать воюющую сторону №3 в назидание другим. После вторжения в их пространство и победы в нескольких ожесточённых сражениях «Инициатива» заключила родной мир стороны №3 в тюрьму, окружив его энергетическим щитом. На ближайшей луне была основана военная база, которая должна была обслуживать щит и реагировать в случае маловероятной разгерметизации."
 ancrel.6165.name: "Генератор щита"
 ancrel.6165.desc: "База «Инициативы» на луне функционировала несколько столетий, но ввиду отсутствия каких-либо признаков разгерметизации обслуживающий персонал был постепенно сокращён. Смены альянсов и распри между различными членами «Инициативы» в конечном итоге привели к тому, что база полностью опустела.\n\nДля обслуживания щита, окружающего родной мир стороны №3, были оставлены автоматические системы, которые, что можно считать невероятным, продолжают работать до сих пор. К сожалению, когда наши археологи прокладывали путь в подземную генераторную камеру, был перебит важный кабель электропитания. Щит перестал существовать спустя 75 тысяч лет непрерывной работы."

 site_minigalaxy_2: "Заброшенный экуменополис"
 site_minigalaxy_2_intro: "Этот древний реликтовый мир находился за непроницаемым энергетическим барьером приблизительно 75 тысяч лет. Должно быть, когда-то это был бурлящий жизнью экуменополис с населением в несколько сотен миллиардов, но улицы и здания сейчас пустынны. Из первоначальных жителей планеты не осталось никого."
 ancrel.6170.name: "Исчезновение"
 ancrel.6170.desc: "Исчезновение первоначального населения этой планеты остаётся загадкой. Как только появился щит и они оказались изолированными от остальной части своей межзвёздной империи, они, вероятно, столкнулись с массовым голодом и гражданскими беспорядками, пытаясь изо всех сил оказать поддержку огромному населению своей столицы при помощи имевшихся у них ограниченных ресурсов.\n\nОднако нет никаких признаков того, что они разрушили часть своей планеты-города, чтобы обрабатывать землю. Ничто не указывает на какие-либо значительные боевые действия после появления щита, и нет никаких останков жителей, окаменелых или нет. Они словно просто растаяли в воздухе."
 ancrel.6175.name: "День эвакуации"
 ancrel.6175.desc: "Жуткие пустые улицы этого заброшенного города, занимавшего всю планету, всё ещё хранят секрет того, что же именно произошло с коренными жителями. Обнаружены плакаты и листовки, в которых упоминается некий §Hдень эвакуации§!. Обычно они сопровождаются рисунками галактики, которую наши астрономы не узнают.\n\n§HДЕНЬ ЭВАКУАЦИИ — СЕГОДНЯ ТОТ САМЫЙ ДЕНЬ. ОБРАТИТЕСЬ В БЛИЖАЙШИЙ ЦЕНТР ПЕРЕСЕЛЕНИЯ КАК МОЖНО СКОРЕЕ, ЧТОБЫ НАЧАТЬ НОВУЮ ЖИЗНЬ.§!"
 ancrel.6180.name: "Проект"
 ancrel.6180.desc: "Планета была явно покинута после завершения этого «дня эвакуации», но как? Нет никаких свидетельств того, что энергетический барьер когда-либо исчезал.\n\nОбнаружены улики, указывающие на выполнение какого-то масштабного исследовательского проекта ещё до появления щита. Ресурсы и научный персонал выделялись на этот проект всё в большем количестве, и усилия, похоже, значительно возросли после активации щита."
 ancrel.6185.name: "Галактика в миниатюре"
 ancrel.6185.desc: "После интенсивных поисков мы обнаружили, куда подевались обитатели [From.Planet.GetName&gen]. Глубоко внутри высокого укреплённого сооружения вблизи северного полюса планеты мы нашли реликвию, в которой, как убеждены наши археологи, находится настоящая галактика в миниатюре.\n\nКаким-то образом после создания этой галактики все жители реликтового мира переместились туда, а затем окружили её в этом контейнере каким-то непроницаемым подпространственным полем. Хотя мы не можем вмешиваться в то, что в этой галактике происходит, наши учёные уверяют нас, что мы можем её изучать."

 site_star_petal: "Станция возле газового гиганта"
 site_star_petal_intro: "Большая заброшенная космическая станция медленно вращается на терминальной орбите в атмосфере этого газового гиганта. Гравитационные силы, вероятно, разрушат её полностью в течение следующей тысячи лет.\n\nОна ещё не вошла в атмосферу достаточно глубоко, поэтому археологические экспедиции на станцию по-прежнему возможны."
 ancrel.6200.name: "Дворец удовольствий"
 ancrel.6200.desc: "Ныне тёмные и безжизненные, внутренности космической станции вполне удачно скрывают тот факт, что она, судя по всему, была задумана как нечто вроде роскошного дворца удовольствий. Среди практически бесконечных рядов ржавых игровых автоматов, сотен заброшенных баров и ресторанов лежат тысячи тел.\n\nПовсюду можно найти мёртвых, частично мумифицированных инопланетян как минимум десятка разных рас, но в основном тела скопились вокруг пустых отсеков, где были аварийные капсулы."
 ancrel.6205.name: "«Звёздный лепесток»"
 ancrel.6205.desc: "Примерно тысячу лет назад эта заброшенная станция, известная под названием §HЗвёздный лепесток§!, была, очевидно, знаменитым роскошным курортом в данной части галактики. Каждый год небольшая флотилия буксировщиков перемещала станцию в какое-нибудь новое экзотическое место, но, похоже, [From.Planet.GetPlanetMoon_rinfix&nom] [From.Planet.GetName] стала последним пунктом назначения.\n\nПо неизвестной причине станцию затянуло в атмосферу газового гиганта, где она и получила критические повреждения."
 ancrel.6210.name: "Последние дни"
 ancrel.6210.desc: "Археологи, работающие на «Звёздном лепестке», собрали достаточно подсказок и фактов, чтобы нарисовать вполне чёткую картину последних дней станции. В станцию врезался блуждающий астероид, отбросивший её на орбиту, двигаясь по которой она переместилась в атмосферу [From.Planet.GetName&gen].\n\nДвигатели станции не смогли произвести нужную корректировку курса, и вскоре командование отдало приказ об эвакуации. К сожалению, аварийные капсулы станции были рассчитаны на эвакуацию лишь части пассажиров, и вскоре началась массовая паника. Те, кого не затоптали до смерти, погибли после отказа систем жизнеобеспечения станции по мере её всё более глубокого погружения в атмосферу газового гиганта."
 ancrel.6215.name: "«Сердце пульсара»"
 ancrel.6215.desc: "В надёжных сейфах, где самые богатые клиенты «Звёздного лепестка» хранили свои личные вещи, удалось обнаружить множество странных артефактов и ювелирных изделий. Возможно, самым примечательным среди найденных предметов является «Сердце пульсара» — уникальное бриллиантовое колье, довольно известное в своё время тем, что его носили пять разных глав государства."

 site_setback: "Это существенный шаг назад."
 site_delay: "Это приведёт к задержкам."
 site_success: "Пронесло."

 ancrel.8000.intro: "Во время археологических раскопок на [From.Planet.GetName&prep] была неумышленно активирована древняя, но всё ещё исправная лазерная решётка."
 ancrel.8000.critical: "§H[dead_scientist.GetName]§! и некоторые другие [Root.Owner.GetArchaeologistPlural] стали жертвами быстродвижущихся лазерных лучей, которые разрезали их на мелкие кусочки."
 ancrel.8000.failure: "Некоторые [Root.Owner.GetArchaeologistPlural] стали жертвами быстродвижущихся лазерных лучей, которые разрезали их на мелкие кусочки. Хотя §H[Root.GetLeaderName]§! [Root.Leader.GetAXX::уцелел<end_a>], эта потеря отрицательно сказалась на проекте."
 ancrel.8000.success: "К счастью, главный археолог §H[Root.GetLeaderName]§! [Root.Leader.GetAXX::успел<end_a>] отключить лазеры до того, как они смогли причинить какой-либо вред. Проект движется вперёд с опережением графика."
 ancrel.8000.pay: "Лазеры блокируют единственный путь вперёд. Их отключение будет дорогостоящим, но поиск другого пути в обход лазерной решётки займёт много времени."
 ancrel.8000.name: "Активирована лазерная решётка"
 ancrel.8000.desc: "$ancrel.8000.intro$\n\n$ancrel.8000.critical$"
 ancrel.8001.desc: "$ancrel.8000.intro$\n\n$ancrel.8000.failure$"
 ancrel.8002.desc: "$ancrel.8000.intro$\n\n$ancrel.8000.success$"
 ancrel.8003.desc: "$ancrel.8000.intro$\n\n$ancrel.8000.pay$"
 ancrel.8003.a: "Отключить решётку."
 ancrel.8003.b: "Им придётся идти в обход."

 ancrel.8010.intro: "Наши [Root.Owner.GetArchaeologistPlural], работающие на [From.Planet.GetName&prep], случайно активировали систему древних, но всё ещё исправных автоматических турелей."
 ancrel.8010.critical: "§H[dead_scientist.GetName]§! и некоторые другие [Root.Owner.GetArchaeologistPlural] быстро погибли под огнём самонаводящихся пушек, прежде чем их удалось отключить."
 ancrel.8010.failure: "Некоторые [Root.Owner.GetArchaeologistPlural] попали в зону огня. Главному археологу по имени §H[Root.GetLeaderName]§! в конце концов удалось отключить турели, но без потерь не обошлось."
 ancrel.8010.success: "К счастью, главный археолог §H[Root.GetLeaderName]§! [Root.Leader.GetAXX::обезвредил<end_a>] пушки до того, как они причинили кому-либо вред."
 ancrel.8010.pay: "Никто не пострадал, но турели блокируют единственный путь вперёд. Если их нельзя отключить, наши [Root.Owner.GetArchaeologistPlural] будут вынуждены искать путь в обход."
 ancrel.8010.name: "Активированы автоматические турели"
 ancrel.8010.desc: "$ancrel.8010.intro$\n\n$ancrel.8010.critical$"
 ancrel.8011.desc: "$ancrel.8010.intro$\n\n$ancrel.8010.failure$"
 ancrel.8012.desc: "$ancrel.8010.intro$\n\n$ancrel.8010.success$"
 ancrel.8013.desc: "$ancrel.8010.intro$\n\n$ancrel.8010.pay$"
 ancrel.8013.a: "Отключить турели."

 ancrel.8020.intro: "Наши [Root.Owner.GetArchaeologistPlural] столкнулись на [From.Planet.GetName&prep] с бродячим андроидом-дробильщиком, устраивающим засады на неосторожных исследователей."
 ancrel.8020.critical: "Древний полуразумный робот успел разнести главного археолога по имени §H[dead_scientist.GetName]§! на крошечные кусочки, пока его буйство не удалось унять."
 ancrel.8020.failure: "Главный археолог §H[Root.GetLeaderName]§! [Root.Leader.GetAXX::избежал<end_a>] его буйства, но некоторые другие [Root.Owner.GetArchaeologistPlural] не были столь удачливы."
 ancrel.8020.success: "Благодаря мастерству и некоторой удаче главный археолог §H[Root.GetLeaderName]§! [Root.Leader.GetAXX::остановил<end_a>] разбушевавшегося робота до того, как кто-либо пострадал."
 ancrel.8020.pay: "Всем удалось избежать взбесившегося робота, но теперь он неустанно патрулирует единственный путь вперёд. Если отключить его не удастся, наши [Root.Owner.GetArchaeologistPlural] будут вынуждены искать другой путь."
 ancrel.8020.name: "Разбушевавшийся андроид-дробильщик"
 ancrel.8020.desc: "$ancrel.8020.intro$\n\n$ancrel.8020.critical$"
 ancrel.8021.desc: "$ancrel.8020.intro$\n\n$ancrel.8020.failure$"
 ancrel.8022.desc: "$ancrel.8020.intro$\n\n$ancrel.8020.success$"
 ancrel.8023.desc: "$ancrel.8020.intro$\n\n$ancrel.8020.pay$"
 ancrel.8023.a: "Отключить андроида."

 ancrel.8030.intro: "Раскопки, которые проводят наши [Root.Owner.GetArchaeologistPlural] на [From.Planet.GetName&prep], каким-то образом привели к активации нескольких древних андроидов-стражей."
 ancrel.8030.critical: "Враждебные роботы расправились с главным археологом по имени §H[dead_scientist.GetName]§!, прежде чем их удалось отключить навсегда при помощи огнестрельного оружия. "
 ancrel.8030.failure: "Некоторые [Root.Owner.GetArchaeologistPlural] были убиты враждебными роботами, прежде чем главному археологу по имени §H[Root.GetLeaderName]§! удалось их остановить."
 ancrel.8030.success: "К счастью, §H[Root.GetLeaderName]§! и ближайшая команда сопровождения сумели нейтрализовать враждебных роботов, прежде чем кто-либо был серьёзно ранен."
 ancrel.8030.pay: "Враждебных роботов пока что удалось сдержать, но этот путь закрыт. Если их нельзя нейтрализовать, придётся искать путь в обход."
 ancrel.8030.name: "Андроиды-стражи"
 ancrel.8030.desc: "$ancrel.8030.intro$\n\n$ancrel.8030.critical$"
 ancrel.8031.desc: "$ancrel.8030.intro$\n\n$ancrel.8030.failure$"
 ancrel.8032.desc: "$ancrel.8030.intro$\n\n$ancrel.8030.success$"
 ancrel.8033.desc: "$ancrel.8030.intro$\n\n$ancrel.8030.pay$"
 ancrel.8033.a: "Нейтрализовать андроидов."

 asteroid_vault_1: "Странный астероид"
 asteroid_vault_1_desc: "[From.Planet.GetName] сначала кажется непримечательным небесным телом, но при более внимательном изучении оказалось, что на самом деле это искусственная конструкция, имитирующая настоящий астероид."
 ancrel.101.name: "Странный астероид"
 ancrel.101.desc: "[From.Planet.GetName] сначала кажется непримечательным небесным телом, но при более внимательном изучении оказалось, что на самом деле это искусственная конструкция, имитирующая настоящий астероид."
 ancrel.101.a: "Изучить!"
 ancrel.102.name: "Странная дверь"
 ancrel.102.desc: "Когда научный корабль приближается к астероиду [From.Planet.GetName], он обнаруживает огромную дверь, древнюю и обветшалую. Кто мог бы установить такую махину и зачем? Возможно, ответы ждут внутри."
 ancrel.102.a: "Открыть дверь!"
 ancrel.103.name: "Хранилище на астероиде"
 ancrel.103.desc: "Открытие хранилища вызвало больше вопросов, чем дало ответов. Внутри него находится эзотерическая коллекция различных предметов — от мусора до возможных артефактов какой-то забытой империи. Разбор всего этого занял немало времени, но мы всё-таки нашли несколько полезных вещей."
 ancrel.103.a: "Приятный сюрприз!"
 it_was_aliens_site: "Руины"
 it_was_aliens_site_desc: "Поверхность [From.Planet.GetName&gen] покрыта руинами, однако, судя по следам крупных ядерных взрывов, они произошли под поверхностью, а не в результате атмосферной или орбитальной бомбардировки. Здесь необходимо дальнейшее изучение, а для полного понимания случившегося требуются археологические раскопки."
 ancrel.104.name: "Перебирая обломки"
 ancrel.104.desc: "Разрушено почти всё, но несколько разрозненных записей всё-таки уцелели. Судя по всему, у жителей [From.Planet.GetName&gen] была навязчивая идея, что за ними наблюдают инопланетяне. Частые сообщения о неопознанных летающих объектах, увечьях животных и похищениях приводили их в бешенство. В ответ они тратили бесчисленное количество ресурсов на обширные системы обнаружения, средства защиты от космических кораблей и подземные укрытия для защиты населения."
 ancrel.105.name: "Обнаружены записи"
 ancrel.105.desc: "Из обнаруженных нами разрозненных записей удалось извлечь дополнительную информацию. По мере того как всё больший процент планетных ресурсов тратился на меры противодействия НЛО без каких-либо заметных успехов, экономика и общество стали приходить в упадок. Отключения электричества и недостаток продовольствия приняли массовый характер, большинство областей технологии перестали развиваться, а все уровни общества охватило глубокое чувство безысходности. Встречаются отдельные упоминания о каком-то «идеальном щите», которых становится всё больше по мере ухудшения общей ситуации на [From.Planet.GetName&prep]."
 ancrel.106.name: "Раскрыта судьба"
 ancrel.106.desc: "В одном из укреплённых военных бункеров мы нашли частично сохранившийся банк данных, который поведал нам о печальной участи [From.Planet.GetName&gen]. Столкнувшись с перспективой тотального развала экономики, который положил бы конец мерам по противодействию НЛО, правители планеты активировали свой «идеальный щит». Увы, этот план не подразумевал спасение [From.Planet.GetName&gen] — его целью было тотальное ядерное уничтожение всего населения и инфраструктуры, чтобы они не достались инопланетным захватчикам. Судя по всему, это решение было спровоцировано обнаружением какого-то «инопланетного сигнала», источником которого стал «неизвестный объект в системе»."
 ancrel.107.name: "Поиски истины"
 ancrel.107.nothing.desc: "Тщательное исследование [From.Planet.GetName&gen] так и не выявило чего-либо, связанного с инопланетянами. Либо никакого сигнала отсюда никогда не было, либо его источник покинул это место, не оставив и следа. Правда, при ближайшем рассмотрении удалось обнаружить на планете минералы."
 ancrel.107.junk.desc: "Источником «инопланетного сигнала» оказалась вовсе не зловещая инопланетная армия вторжения, а древний геодезический знак, очевидно, установленный здесь автоматическим зондом, который обнаружил на [From.Planet.GetName&prep] небольшие залежи ценных ресурсов. Передатчик повреждён и передаёт свой сигнал очень слабо и с перерывами."
 ancrel.107.aliens1.desc: "Источником сигнала, идущего с [From.Planet.GetName&gen], оказался покинутый аванпост неизвестной конструкции. Судя по обнаруженным записям, здесь не вынашивали планов по вторжению, а просто хотели наладить контакт с <соседней планетой> и пригласить её в Галактическое сообщество."
 ancrel.107.aliens2.desc: "Источником сигнала, идущего с [From.Planet.GetName&gen], оказался покинутый аванпост неизвестной конструкции. В заброшенных банках данных содержатся подробные планы вторжения на <соседнюю планету> и обработки населения на «фермах боли», чтобы сделать их плоть мягче перед дальнейшим употреблением в пищу."
 ancient_battle_site_desc: "Сканирование [From.Planet.GetName&gen] выявило область, полную переработанного материала и рассеянных радиоактивных веществ, хотя с орбиты мало что видно. Чтобы узнать больше, нам нужно изучить всё на месте."
 omnirelic_site: "$ancrel.21.name$"
 cool_relic_world_site_desc: "Целая планета покрыта огромными сооружениями. У этого павшего мегаполиса, безусловно, есть секреты, которые нужно раскрыть."
 ancrel.108.name: "Древнее место битвы"
 ancrel.108.desc: "Переработанный материал обнаружен, и, хотя необходимо дальнейшее изучение, всё указывает на то, что это остатки огромного места битвы. Похоже, одна из сторон спустилась с орбиты и была атакована защитниками планеты. Почему не была проведена орбитальная бомбардировка и кто вышел победителем, остаётся неясным."
 ancrel.109.name: "Забытая злоба"
 ancrel.109.desc: "Мы пришли к выводу, что силы «Разрушителей», расы кочевников из другого измерения, вторглись на [From.Planet.GetName&acc], которая в то время принадлежала «Сопротивлению», коалиции нескольких различных рас. Судя по разрозненным записям, война в основном шла в других местах галактики, и Сопротивление пыталось создать на [From.Planet.GetName&prep] секретную колонию вне досягаемости Разрушителей. Исход этой битвы и войны в целом остаётся неизвестным, но изучение разбитых боевых машин дало определённую ценную информацию."
 zroni_digsite_1_desc: "Древняя колония неизвестной цивилизации, в спешке покинутая обитателями без каких-либо видимых причин. Что же здесь случилось?"
 zroni_digsite_2_desc: "На эту точку указывают координаты, обнаруженные в заброшенной колонии зрони. Для изучения этой, казалось бы, непримечательной планеты потребуется ещё одна экспедиция."
 zroni_digsite_3_desc: "На последних раскопках очередной заброшенной колонии мы узнали, что [From.Planet.GetName] таит на своей поверхности заброшенное святилище. Почему же оно было так важно для местных жителей?"
 zroni_digsite_4_desc: "Храм зрони указал нам путь к научному комплексу. Сканирование с орбиты не выявило резонанса в монокристалле. Придётся спуститься на поверхность."
 zroni_digsite_5_desc: "[From.Planet.GetName] затмевает собой все предыдущие места раскопок: строения, покрывающие поверхность этой [From.Planet.GetPlanetMoon_rinfix&gen], видно даже из космоса. Мы предполагаем, что [From.GetName] — важнейший мир империи зрони."
 zroni_digsite_6_desc: "На Зроне бушует буря псионической энергии. Необходимо откалибровать инструменты, которые мы использовали ранее для поиска кристаллов памяти, прежде чем отправлять команду на поверхность."
 zroni_digsite_1: "Руины заброшенной колонии"
 zroni_digsite_2: "Маяк зрони"
 zroni_digsite_3: "Святилище зрони"
 zroni_digsite_4: "Исследовательская станция зрони"
 zroni_digsite_5: "Крупная колония зрони"
 zroni_digsite_6: "Зрон"
 NAME_Zroni: "Зрони"
 ancrel.1.name: "Таинственные руины"
 ancrel.1.desc: "На [From.Planet.GetName&prep] найдены остатки покинутой колонии. С орбиты не видно никаких признаков катастрофы, которая могла бы повлечь за собой гибель жителей или заставить их спасаться бегством. Если мы хотим получить ответы, нам придётся снарядить экспедицию на поверхность."
 ancrel.2.desc: "Странные руины не имеют никаких признаков повреждений, кроме отсутствия ухода. Дома, заводы, строения неизвестного предназначения — все пусты и заброшены. Куда все делись? Неизвестно почему, но нам кажется, что ответы, возможно, найдутся в большом здании в центре колонии."
 ancrel.3.name: "Странный кристалл"
 ancrel.3.desc: "Большой кристалл найден внутри здания, которое, как мы теперь знаем, было главным административным центром колонии. В некотором смысле кристалл хотел быть найденным и, похоже, пытается вступить с нами в контакт. Возможно, мы сумеем сделать это в ходе дальнейшего изучения?"
 ancrel.3.a: "Зондировать кристалл"
 ancrel.4.desc: "Мы наконец добились успеха после бесчисленных проб и ошибок. Кристалл представляет собой нечто вроде псионического архива, но записи в нём обрывочны.\n\nМы знаем, что колония принадлежала §Hзрони§! — псионически активной расе, которая первой обнаружила измерение, впоследствии названное «Покровом». Как только население зрони достигло определённой критической массы, их коллективный разум, по-видимому, начал вступать в контакт с Протопокровом в минуты отдыха, что привело к массовым осознанным сновидениям. Когда этот феномен был изучен, зрони получили возможность проецировать своё сознание в Покров и манипулировать самой тканью реальности при помощи псионических способностей.\n\nЗрони довольно быстро обнаружили, что могут физически входить в Покров и жить там как боги, меняя это измерение по своему желанию...\n\nНа этом записи в архиве заканчиваются, и у нас нет информации о том, что после этого случилось с жителями [From.Planet.GetName&gen]. Тем не менее мы узнали ещё об одной колонии зрони, в которой мог уцелеть более полный архив."
 ancrel.5.desc: "На [From.Planet.GetName&prep] находятся руины ещё одной покинутой колонии зрони. Первым шагом к разгадке этой тайны будет найти псионический архив этого мира и установить с ним контакт."
 ancrel.6.desc: "Используя протоколы, установленные при работе с предыдущим кристаллом, наладить контакт с этим кристаллом удалось намного быстрее. Записи снова оказались фрагментарными, однако мы узнали, что ещё одним преимуществом возможности проникновения в Покров является то, что он одновременно находится в контакте со всеми частями физической галактики (а возможно, и всей вселенной).\n\nЕсли попасть в Покров, то можно покинуть его в любом известном месте. Такая способность совершать «псионический прыжок» из одного физического места в другое позволила зрони распространиться во все уголки галактики, хотя из-за пребывания большую часть времени в Покрове они создали лишь несколько постоянных колоний, в основном располагавшихся близко от их родного мира.\n\nБлагодаря этому кристаллу мы также узнали о местоположении некого святилища."
 ancrel.7.desc: "Искать архивы в кристаллах и устанавливать с ними связь стало намного проще. Мы смогли наладить контакт сразу же после приземления экспедиции и теперь получаем доступ к более подробным записям и идеям. Многое из того, что мы узнали, кажется слишком невероятным, чтобы быть правдой. Божественная сила, которую даровал зрони Покров, имела свою цену.\n\nПитавшая Покров энергия должна была откуда-то взяться, и мы установили, что она исходила из массивной чёрной дыры в центре галактики. По мере того, как зрони вносили изменения в Покров, эта сингулярность расширялась, поглощая массу центра галактики и преобразовывая её в энергию Покрова. Это открытие потрясло зрони. Мирные споры переросли в яростные перепалки и привели сперва к расколу, а затем и к гражданской войне между двумя основными фракциями."
 ancrel.8.desc: "Мы извлекли из кристалла более подробную информацию о вовлечённых в гражданскую войну фракциях зрони. Первая из них называла себя «Небожителями» и считала, что судьба физической галактики не имеет значения, так как зрони могли продолжать существование в Покрове до тех пор, пока вся галактика не оказалась бы поглощена в каком-то невообразимо далёком будущем — но даже после этого оставались другие галактики, может, даже другие вселенные, которые тоже могли бы быть поглощены.\n\nДругая фракция называла себя «Спасителями» и решительно отвергала эту идею. По их мнению, зрони не имели права уничтожать галактику, чтобы жить в качестве паразитирующих богов. Их псионические способности обеспечивали им райское существование даже за пределами Покрова.\n\nНам также удалось узнать координаты ещё одной колонии зрони."
 ancrel.9.desc: "Было на удивление трудно определить местоположение архива на [From.Planet.GetName&prep], но как только мы его нашли, причина стала ясна: он разбит и не содержит записей, к которым мы можем получить доступ. Однако слабый сигнал наводит на мысль, что здесь можно отыскать что-то ещё."
 ancrel.9.a: "Продолжить поиски"
 ancrel.10.desc: "Совсем крохотный псионический кристалл найден в помещении, похожем на лабораторию. Зрони, фиксировавшие свои открытия на этом кристалле, были крайне разочарованы тем, что коллеги поднимают их исследования на смех, выказывая всеобщее недоверие. Они считали, что зрони более не одиноки в Покрове и что из коллективных страхов и желаний целой расы возникают новые разумные сущности.\n\nЖелая стать сильнее, эти создания начали искусно воздействовать на эмоции и мысли уязвимых зрони, медленно приводя к тому, что их поведение становилось всё более радикальным, в результате чего могла начаться гражданская война.\n\nМы также обнаружили упоминание местоположения одной из крупных колоний зрони."
 ancrel.11.desc: "В отличие от предыдущих миров зрони, [From.Planet.GetPlanetMoon_rinfix&nom] [From.Planet.GetName] явно была крупной колонией с несколькими огромными городами и множеством более мелких, разбросанных по всей поверхности. Но, как и в мирах, найденных прежде, здесь пусто и нет никаких признаков бегства или гибели, из-за чего судьба населения остаётся неизвестной. Обнаружено несколько архивных кристаллов, которые нужно изучить."
 ancrel.12.desc: "Большинство доступных записей повествуют о ходе войны. Наша рабочая теория состоит в том, что мысли населения влияли на «силу» записи на определённую тему, в результате чего проблемы, о которых зрони думали чаще всего, записывались наиболее чётко.\n\nНеудивительно, что война была в мыслях у всех: большинство зрони встало на сторону Спасителей, но, хотя у тех было численное превосходство, они оказались в невыгодном положении. Не заботясь о том, как всё это отразится на галактике, Небожители свободно использовали всю свою псионическую мощь, а Спасители были ограничены силой, которую они могли извлечь только из собственных тел.\n\nСначала война казалась безнадёжной, но в итоге один герой из Спасителей сделал ужасное, но жизненно важное открытие."
 ancrel.12.a: "Изучить открытие"
 ancrel.13.desc: "Кристалл рассказал нам о том, как учёный-одиночка из зрони, работавший над теорией, в которую его коллеги отказывались верить, обратил свою силу внутрь, в результате чего его собственное тело было поглощено в ходе замкнутой псионической цепной реакции. В соответствии с его последними указаниями учёные изучили прах, оставшийся после его величайшей жертвы, и подтвердили, что он является невероятно мощным источником псионической энергии. По сути это был полный псионический потенциал всей его жизни, но он мог быть мгновенно использован другим псиоником.\n\nКристалл также указывает на местоположение родного мира зрони."
 ancrel.13.a: "Прах зрони"
 ancrel.15.desc: "Планета Зрон охвачена бурями псионической энергии. Наши учёные считают, что её существование лишь частично синхронизировано с остальной вселенной. Какая бы катастрофа здесь ни случилась, ясно одно: вся раса зрони произошла отсюда.\n\nКак и в ранее найденных колониях, зрони здесь нет, но сигналов от кристаллов более чем достаточно. При таком их количестве и из-за странных окружающих условий нам понадобится время, чтобы извлечь какую-либо полезную информацию."
 ancrel.16.desc: "Мы нашли несколько кристаллов, в том числе и оставшийся после учёных-изгоев, изучавших создания Покрова. Мы установили связь с кристаллами, чтобы узнать подробнее о войне зрони. Использование праха зро потребовало огромной жертвы со стороны Спасителей, но благодаря ей они смогли переломить ход войны с Небожителями. Однако, по мере того как поражение становилось неизбежным, постоянно растущие ярость и страх Небожителей порождали в Покрове новых ужасных существ. Интенсивность этого цикла взаимосвязи нарастала: Небожители погружались в глубины безумия, что вызывало к жизни всё более жуткие создания, а Спасители всё более и более отчаянно стремились положить конец войне любой ценой."
 ancrel.16.a: "Продолжайте."
 ancrel.17.desc: "Чем больше мы общаемся с кристаллами, тем больше подробностей узнаём. Оказавшись на грани поражения, Небожители решились пойти на крайние меры и завершить цикл. Они планировали ускорить рост чёрной дыры, чтобы она поглотила галактику как можно скорее.\n\nВ худшем случае Спасители (и все другие расы) были бы уничтожены, а Небожители остались бы править Покровом на очень долгий, хоть и не бесконечный срок. При этом существовала вероятность, что подобное расширение перерастёт в самоподдерживающийся процесс и поглотит не только галактику, но и всю вселенную. Это дало бы зрони запас энергии — бесконечный или же близкий к бесконечному."
 ancrel.18.desc: "Нам стала известна судьба зрони. Когда Спасители узнали о плане Небожителей, то поняли, что противодействовать ему, с учётом почти непроницаемой защиты Небожителей, можно только одним способом. Столкнувшись с угрозой полного уничтожения, они решили пожертвовать всем своим населением, кроме одного зрони. Этот последний оставшийся Спаситель использовал остатки псионической энергии целой расы, чтобы уничтожить всех прочих зрони, а значит, и всех Небожителей, таким образом навечно покончив с этой угрозой. Если не считать небольшого количества не поглощённого праха, зрони исчезли почти без следа."
 ancrel.18.a: "Непостижимое"
 ancrel.19.desc: "Когда наша экспедиция была готова покинуть планету, один из псионических кристаллов внезапно снова вступил в контакт и указал на то, что может оказаться полезным и нам следует взять его с собой. Даже если это утверждение не соответствует действительности, ни один из других кристаллов не казался разумным, поэтому такое событие требует дальнейшего изучения."
 ancrel.19.a: "Взять кристалл"
 ancrel.21.name: "Разрушенный мир"
 ancrel.21.desc: "Массивные обветшалые строения занимают всю поверхность этого мира. Должно быть, когда-то эта планета-город была домом для миллиардов жителей, но теперь она пуста. Кто бы ни жил здесь когда-то, они должны были оставить подсказки о том, что с ними произошло, но для обнаружения этих следов потребуется подробно изучить поверхность."
 ancrel.22.desc: "После долгого, но бесплодного прочёсывания руин ряд подсказок направил наш поиск в нужное русло, и мы обнаружили остатки некоего планетарного центра обработки и хранения данных. Если мы найдём способ получить доступ к уцелевшим записям, они станут ключом к разгадке загадочного прошлого этой планеты."
 ancrel.23.desc: "Когда мы обнаружили проход в центр сбора данных и расчистили его от обломков, нам на удивление легко удалось активировать компьютерные системы и подключиться к ним. Схемы автоматической отладки и алгоритмы обучения быстро восстановили ограниченную функциональность и связались с нашими компьютерами.\n\nВскоре нам стало ясно, почему это произошло. Оказалось, что [From.Planet.GetPlanetMoon_rinfix&nom] [From.Planet.GetName] некогда была столицей империи машин. Эта империя носила название §HОмникодекс§!, и в нём крылся намёк на их главное предназначение. Омни были гибридом роботов и киборгов и пытались собрать образцы всех видов биологической жизни в галактике, чтобы предотвратить их исчезновение в случае неведомой галактической катастрофы.\n\nСудя по уцелевшим записям, другим галактическим державам того времени эта идея не слишком нравилась, и в ходе объединённой атаки нескольких из них омни были в конце концов побеждены и уничтожены.\n\nТем не менее до своей гибели они успели собрать образцы множества рас и приложили немало усилий для создания устройства, которое могло бы воссоздать их в случае необходимости. Это устройство, также именуемое Омникодексом, хранится где-то неподалёку."
 ancrel.24.desc: "Нам удалось отрыть Омникодекс. В этом уникальном устройстве содержится информация о генетической последовательности каждой расы, образец которой был собран омни, и оно может воссоздать их, используя только базовые элементы в качестве сырья. К сожалению, омни, похоже, не успели усовершенствовать устройство до своего уничтожения, поэтому нет никакого способа выбрать, какая из множества рас будет создаваться на основе образца при любой активации устройства."

 ANCREL_ARC_CAT: "Чуждое место"
 ANCREL_ARC_CAT_DESC: "Проверка инопланетного сигнала"

 ANCREL_MECHANO_CAT: "Планетная машина"
 ANCREL_MECHANO_CAT_DESC: "От полюса до полюса всю поверхность планеты занимают древние ржавеющие механизмы, в большинстве своём покрытые органической тканью неопределённого происхождения. Что за существа создали эту техническую диковинку и что с ними произошло?"

 baol_chain_title: "Предтечи: Баол"
 baol_chain_desc: "Наши исследователи обнаружили инфокристаллы возрастом семь миллионов лет, повествующие о существовании §Yгрунуров§!, расы освоивших космос воинов, и §YОрганизма баол§!, формы жизни, на планеты которой грунуры вторглись."
 baol_colonies: "Обнаружены колонии баол"

 BAOL_COLONY_1: "Изучение бывшей колонии баол"
 BAOL_COLONY_1_DESC: "Мы нашли список с координатами, указывающими на предполагаемое местоположение бывшей колонии §Yбаол§!. Нужно изучить это более тщательно."
 BAOL_COLONY_2: "$BAOL_COLONY_1$ II"
 BAOL_COLONY_2_DESC: "Координаты ещё одной бывшей колонии §Yбаол§! извлечены из древнего инфокристалла грунуров. Нужно изучить это место более тщательно."
 BAOL_COLONY_3: "$BAOL_COLONY_1$ III"
 BAOL_COLONY_3_DESC: "$BAOL_COLONY_2_DESC$"
 THE_LAST_BAOL: "Сигнал бедствия грунуров"
 THE_LAST_BAOL_DESC: "Наши сенсоры, похоже, зафиксировали сигнал бедствия с информационно-логическими сигнатурами грунуров. Что могло вообще остаться от давно пропавшей расы в этой прежде не изученной звёздной системе?"
 FERROPHAGE_CURE: "Разработать средство против феррофага"
 FERROPHAGE_CURE_DESC: "Интерактивный интерфейс ЗА.БОТ-А на [Root.GetName&prep] обратился к нам за помощью в разработке средства от поедающего металл вируса, который мучил его на протяжении тысячелетий.\n\nНам ещё предстоит понять, как можно разработать противоядие от древнего биологического инопланетного вируса, влияющего на искусственный интеллект."

 NAME_Grunur: "Грунур"
 NAME_Grunur_Prime: "Грунур Прайм"
 NAME_Nu_Baol: "Ню-Баол"
 grunur_research_facility: "Научно-исследовательский комплекс грунуров"
 grunur_research_facility_desc: "Древний экспериментальный научно-исследовательский комплекс, построенный тысячелетия назад воинственными грунурами."
 NAME_planetary_mechanocalibrator: "ЗА.БОТ-А"
 NAME_care_defensive_protocols: "Боевая мегамашина ЗА.БОТ-А"
 care_defensive_protocols: "Боевая мегамашина ЗА.БОТ-А"
 care_defensive_protocols_desc: "Модули протокола дзета, сконструированные из прочного пластика и способные пережить феррофаг."
 NAME_planetary_mechanocalibrator_species: "$NAME_Guardian$ $NAME_planetary_mechanocalibrator$"

 ancrel.2000.name: "Грунуры"
 ancrel.2000.desc: "Экипаж [Root.GetName&gen] сгорает от желания сообщить, что они обнаружили на [From.GetName&prep] останки древней расы, освоившей космос. Колонизировали они её, похоже, примерно семь миллионов лет назад!\n\nПока неясно, почему раса, называвшая себя §Yгрунурами§!, исчезла из системы [From.System.GetName&gen], однако нашим учёным удалось обнаружить на их планете многообещающее место для археологических раскопок.\n\nВозможно, дальнейшее изучение позволит нам узнать больше."
 ancrel.2001.name: "Организм баол"
 ancrel.2001.desc: "На месте раскопок обнаружены расшифрованные инфокристаллы, повествующие о военных подвигах §Yгрунуров§!. Хотя в основном там говорится о местных и малоинтересных реалиях, в нескольких томах описывается первое столкновение §Yгрунуров§! с инопланетной расой, называемой §YОрганизм баол§!.\n\nНа данном этапе об этих §Yбаол§! известно только то, что они были расой огромных растений и колонизировали множество планет в различных звёздных системах."
 ancrel.2001.a: "Заманчиво. Продолжайте копать!"
 ancrel.2002.name: "Организм баол"
 ancrel.2002.desc: "Согласно записям в инфокристаллах, §Yгрунуры§! воевали против §Yбаол§!, чтобы заполучить богатые ресурсы, предположительно обнаруженные на их планетах. Из одной такой записи мы извлекли координаты системы!\n\nСейчас наши археологи загружают данные о местоположении нужной планеты в наши компьютеры."
 ancrel.2002.a: "Возможно, более внимательное изучение [baol_colony_1.GetName&gen] принесёт плоды."
 ancrel.2003.name: "Бывшая колония баол: безжизненный мир"
 ancrel.2003.desc: "Несмотря на обещания богатств, на которые намекали древние инфокристаллы §Yгрунуров§!, обнаруженные во время раскопок на [first_grunur_site.GetName&prep], [baol_colony_1.GetName::<1> оказа<end_lsya>] сухим и безжизненным миром без атмосферы.\n\nК счастью, геологическое сканирование показало почти бесконечные залежи окаменелых останков в глубине осадочных отложений планеты. Среди них оказались и представители расы растений, скорее всего §Yбаол§!, так как только у них определены неврологические структуры, требуемые для появления разума.\n\nМы сможем узнать больше, если проведём целенаправленные раскопки."
 ancrel.2004.name: "Война с массовым вымиранием"
 ancrel.2004.desc: "Толстый слой пепла и глобальное событие с массовым вымиранием, замеченные в геологическом профиле, соответствуют данным, извлечённым из инфокристаллов §Yгрунуров§!, где было указано, что примерно семь миллионов лет назад они бомбардировали [From.Planet.GetName&acc] гелеобразной зажигательной смесью.\n\nУничтожение лесного покрова планеты на большой территории нарушило баланс местных экосистем, а отсутствие растительности, восполняющей недостаток кислорода, постепенно истощило атмосферу в течение следующих шестидесяти тысяч лет."
 ancrel.2005.name: "Организм баол"
 ancrel.2005.desc: "Обнаружено несколько показательных окаменелых останков расы §Yбаол§!, и стало ясно, что эта давно забытая раса обладала коллективным разумом: миллиарды растений взаимодействовали как единое целое, подобно листьям, корням и ветвям одного дерева. Согласно дендрохронологическим данным, отдельные образцы §Yбаол§! жили сотни лет.\n\nОтсутствие руин строений на [From.Planet.GetName&prep], кроме разрушительного действия времени, похоже, связано с тем, что баол полагались на поразительные органические технологии, начиная от кораблей и зданий и заканчивая биокомпьютерами, подключаемыми к мозгу."
 ancrel.2006.name: "Инфокристалл грунуров"
 ancrel.2006.desc: "Координаты ещё одной бывшей колонии §Yбаол§! извлечены из разбитого инфокристалла §Yгрунуров§!. Возможно, на этой планете всё-таки будут хоть какие-то богатства, которые пытались отыскать древние враги баол."
 ancrel.2006.a: "Летим к следующей колонии!"
 ancrel.2007.name: "Бывшая колония баол: расколотый мир"
 ancrel.2007.desc: "Когда на месте пригодного для жизни мира экипаж [Root.GetName&gen] обнаружил лишь астероиды, они сначала были уверены, что неправильно выполнили триангуляцию при определении координат предполагаемой колонии §Yбаол§! в системе [Root.System.GetName&gen].\n\nОднако более тщательный анализ состава астероидов показал, что они на самом деле являются остатками бывшей колонии §Yбаол§!. Примерно семь миллионов лет назад в результате какого-то непонятного столкновения некогда цветущую планету разорвало на несколько тысяч частей. Логика подсказывает, что в этой печальной истории не обошлось без расы §Yгрунуров§!.\n\nОдин особенно многообещающий астероид выбран для дальнейшего изучения, так как он, похоже, содержит много окаменевших форм жизни с погибшей планеты."
 ancrel.2007.a: "Жаль. Возможно, мы узнаем больше."
 ancrel.2008.name: "Окаменевший биокомпьютер"
 ancrel.2008.desc: "Нам удалось извлечь некоторые фрагменты данных из особенно хорошо сохранившегося окаменевшего биокомпьютера §Yбаол§!. Эта реликвия возрастом десять миллионов лет, похоже, содержит педагогические наставления, предназначенные для незрелых представителей данной расы. Юные §Yбаол§! или саженцы, ещё не готовые полностью воспринять весь спектр нейронных связей коллективного разума, обучались основам роста, растениеводства и питания под опекой старших.\n\nЭти открытия указывают на то, что общество §Yбаол§! высоко ценило обустройство ландшафта и управление экосистемами и в значительной степени зависело от них для обеспечения собственного выживания."
 ancrel.2009.name: "Останки биокомпьютера"
 ancrel.2009.desc: "Обнаружение останков ещё одного древнего биокомпьютера §Yбаол§! позволило нам лучше понять историю коллективного разума этой расы растений.\n\nСудя по всему, §Yбаол§! были все родом с одной планеты, местоположение которой неизвестно, и развились из обычных растений. Первобытные §Yбаол§! были клонами родительских растений и в течение миллионов лет медленного мирного существования на своей родной планете постепенно развили в себе способность к коллективному сознанию."
 ancrel.2010.name: "Инфокристалл грунуров"
 ancrel.2010.desc: "На [From.Planet.GetName&prep] обнаружен инфокристалл §Yгрунуров§! возрастом примерно семь миллионов лет. Он содержит частично читаемые военные записи, описывающие вторжение на планету.\n\nСудя по всему, §Yгрунуры§! ожидали какого-то вооружённого сопротивления, и невероятно медлительные §Yбаол§! их не впечатлили. В записях с крайней степенью пренебрежения описывается, с какой лёгкостью им удалось обойти слишком поздние ответные действия §Yбаол§!."
 ancrel.2011.name: "Боевые приказы грунуров"
 ancrel.2011.desc: "При раскопках найден очередной инфокристалл §Yгрунуров§!, содержащий тексты множества военных приказов, где также есть координаты ещё одной бывшей колонии §Yбаол§!.\n\nНаши археологи, жаждущие узнать дальнейшую историю этих врагов, загружают данные в нашу систему."
 ancrel.2011.a: "В третий раз повезёт?"
 ancrel.2012.name: "Бывшая колония баол: затихший мир"
 ancrel.2012.desc: "Нашим исследователям было приятно узнать, что третья колония §Yбаол§! находилась на [From.From.GetName&prep], где всё ещё есть атмосфера и жизнь.\n\nПусть это не особо цветущий мир и здесь нет впечатляющих залежей ресурсов, но наши учёные жаждут начать целенаправленные раскопки, чтобы отыскать хоть что-нибудь, что осталось от §Yбаол§! или §Yгрунуров§!."
 ancrel.2013.name: "Сниженные способности"
 ancrel.2013.desc: "Во время раскопок на [From.Planet.GetName&prep] было обнаружено множество окаменелостей, явно имеющих отношение к расе §Yбаол§!. Как ни странно, у этих образцов, похоже, были уменьшенные неврологические органы, требуемые для связи через подпространственный эфапс. Такая уникальная способность, позволяющая общаться на больших расстояниях, присуща только коллективным разумам.\n\nЧто именно стало причиной этого эволюционного сдвига, неизвестно, но, возможно, не последнюю роль тут сыграло вторжение §Yгрунуров§!. Необходимо дальнейшее исследование."
 ancrel.2024.name: "Деволюция"
 ancrel.2024.desc: "В геологическом профиле обнаружены окаменевшие образцы более молодых представителей расы §Yбаол§!. У этих представителей расы нет уменьшенных неврологических органов, используемых коллективным разумом. Более того, структуры, требуемые для связи через подпространственный эфапс, вообще отсутствуют!\n\nРадиоуглеродное датирование образцов подтвердило, что через несколько сотен лет после вторжения §Yгрунуров§! способность §Yбаол§! общаться при помощи коллективного разума стала снижаться.\n\nК сожалению, какие-либо другие релевантные данные мы в этом месте извлечь не сможем."
 ancrel.2024.a: "Как странно."
 ancrel.2015.name: "Сигнал бедствия §Yгрунуров§!"
 ancrel.2015.desc: "Наши учёные зафиксировали сигнал бедствия с информационно-логическим идентификатором §Yгрунуров§!. Похоже, что он исходит из ранее неизвестной нам системы [last_baol_neighbor.GetName&gen].\n\nО чём же говорится в этом древнем сообщении?\n\nНаши учёные хотят изучить источник сигнала."
 ancrel.2015.a.tooltip: "Создать особый проект: §YСигнал бедствия грунуров§!"
 ancrel.3999.name: "$ancrel.2016.name$"
 ancrel.3999.desc: "Учёные из §H[From.GetName&gen]§! обнаружили последнего представителя расы §Hбаол§!!"
 ancrel.2016.name: "Организм баол"
 ancrel.2016.desc: "Экипаж [Root.GetName&gen] отследил сигнал бедствия §Yгрунуров§! до его источника, которым оказался их разрушающийся научно-исследовательский комплекс на орбите, судя по всему, давно покинутой планеты. Система энергоснабжения, уже миллионы лет функционирующая благодаря обширной сети солнечных батарей и постепенно приходящим в упадок системам автоматического ремонта, близка к выходу из строя.\n\nСканирование комплекса показало, что там, как бы шокирующе это ни прозвучало, всё ещё присутствует какое-то живое существо. Отправленная с корабля десантная группа готова предоставить отчёт."
 ancrel.2017.name: "Последний из баол"
 ancrel.2017.desc: "§HВ глубине руин ветхого научно-исследовательского комплекса грунуров, среди давно вышедших из строя компьютерных панелей и изношенного исследовательского оборудования, экипаж нашего корабля нашёл нечто невероятное.\n\nОдин-единственный организм подключён к питательным трубкам и системам жизнеобеспечения на грани критического отказа. Это последний из баол, чудом оставшийся в живых и окружённый разложившимися останками других представителей своей расы в треснутых и протекающих ёмкостях.\n\nБлагодаря тому что наши археологи успели достаточно подробно изучить эту расу, мы должны суметь наладить контакт с этим последним её представителем.§!"
 ancrel.2017.a: "Тогда давайте попробуем."
 ancrel.2017.exter: "Органик? Запускаем протоколы ликвидации..."
 ancrel.2017.machi: "Древний органик!"
 ancrel.2017.hive: "[root.GetGestaltEntityName&nom] начинает контакт..."
 ancrel.2018.desc: "«Гости? Неужели?»\n\n§HБаол, лежащий в ёмкости, содрогается.§!\n\n«Но вы не те, кто поместил нас сюда, хотя ваш приход ознаменован сигналом тревоги. Вы пришли, чтобы наконец нас упокоить?»"
 ancrel.2018.a: "Возможно. Но сначала у нас есть несколько вопросов."
 ancrel.2018.a.phile: "Мы поможем вам, чем сможем."
 ancrel.2018.a.phobe: "Это вы будете отвечать нам, чужак, а не наоборот."
 ancrel.2019.desc: "§HБаол молчит несколько минут.§! «Тогда спрашивайте. Мы ждали много тысячелетий. Ещё мгновение потерпим»."
 ancrel.2019.a: "Расскажите нам о себе."
 ancrel.2019.a.response: "§HТянутся долгие минуты, прежде чем баол отвечает.§!\n\n«О нас? О... нас. Да. Что тут можно сказать? Мы нежились под звёздами на мягкой земле, развернув наши листья, будто паруса, навстречу солнцу. Мы помним каждую каплю воды, что утоляла их жажду жарким летом. Каждую дрожащую снежинку, покрывавшую их зимой. Мы склонялись под натиском ветра, а звёзды проплывали над головой.\n\nНас вырывали с корнем. Нас жгли. Нас резали. Нас оставили здесь. Мы видели, как наши братья гниют в своих стеклянных темницах»."
 ancrel.2019.b: "Что случилось с баол?"
 ancrel.2019.b.response: "§HБаол снова надолго умолкает, прежде чем дать ответ.§! «Когда появились поджигатели, целые колонии были погружены в безмолвие, прежде чем нам стало известно об этой опасности. Словно конечность обмякла, когда кто-то внезапно перерезал нервы у самого основания. А потом мы потеряли ещё одних, и ещё одних, и ещё одних. Друг за другом их голоса исчезали из общего хора. Мы потеряли наших братьев. Их молчание оглушило нас — тех, кто остался.\n\nМожешь ли ты понять это, гость? Мы не могли вынести звуки их агонии. Поджигатели были быстрыми, как вы, даже быстрее, и подожгли нас всех, прежде чем мы смогли отступить. Обратили всех в пепел, и воздух наполнился этой серой агонией: то был прах наших погибших»."
 ancrel.2019.c: "Хотите присоединиться к нам?"
 ancrel.2019.d: "Мы услышали достаточно."
 ancrel.2020.desc: "§HБаол надолго замолкает, прежде чем наконец ответить.§! «Спасибо. Мы уже и забыли, как звучит доброта»."
 ancrel.2020.a: "У нас было несколько вопросов..."
 ancrel.2021.desc: "§HПо телу баол прокатывается дрожь. У нас возникает чёткое впечатление, что он смеётся.§! «Нет. Мы слишком долго пребывали в этом жалком состоянии. Теперь мы желаем лишь умереть. Но сначала... Вы скажете нам? Мы слишком долго были заключены здесь, не видя ничего, кроме этой комнаты, наблюдая за тем, как затхлый воздух медленно подтачивает металлические кости этой станции.\n\nСкажите нам. Кто-нибудь из нашей расы... остался жив?»"
 ancrel.2021.desc.phobe: "«Постойте, — §HБаол дрожит.§! — Прежде чем это завершится. Наши сородичи. Прошу вас. Мы слишком долго были заключены здесь, не видя ничего, кроме этой комнаты, наблюдая за тем, как затхлый воздух медленно подтачивает металлические кости этой станции.\n\nСкажите нам. Кто-нибудь из нашей расы... остался жив?»"
 ancrel.2021.a: "В каком-то смысле — да. Только они перестали быть разумными."
 ancrel.2021.b: "У нас нет на это времени. Отключить его!"
 ancrel.2021.b.exter: "Ликвидировать!"
 ancrel.2021.b.swarm: "Хорошая добыча. Не шевелись!"
 ancrel.2022.desc: "§HМедленно, почти незаметно листья последнего из баол начинают съёживаться.§! «Возможно... возможно, это к лучшему».\n\n§HМеханизм, прокачивающий таинственные жидкости через тело этого существа, начинает шипеть и брызгать. Он явно делает свой последний механический вдох, а без него баол погибнет.§!\n\n«Тишина, да. Наконец-то она приближается. Мы приветствуем её, как в своё время сделали наши братья. Прощайте, [Root.GetSpeciesNamePlural]. Желаю вашей расе поменьше мучений в этом мире»."
 ancrel.2022.a: "Прощайте."
 ancrel.2022.b.evopred: "Мы сохраним вашу уникальность."
 ancrel.2023.desc: "§HДобравшись до трубок, которые прокачивают через тело создания таинственные питательные вещества, наши учёные начинают их вырывать, ускоряя выход механизма из строя и смерть последнего из баол.\n\nБаол, похоже, абсолютно не против их действий, если, конечно, не считать, что лёгкая дрожь, пробегающая по его увядающим конечностям, что-то значит.\n\nНаконец всё сделано, по телу существа пробегает последняя дрожь, и оно умирает.§!"
 ancrel.2023.a: "Ну вот и всё."
 ancrel.2023.a.exter: "Сжечь то, что осталось."
 ancrel.2023.a.swarm: "А теперь будем пировать!"
 ancrel.2025.name: "Распространение семян баол на [Root.GetName&prep] завершено"
 ancrel.2025.desc.first: "Наши [Owner.GetTerraformerPlural] рады сообщить, что терраформирование [Root.GetName&gen] завершено. Размещение новых гибридов растений, созданных в лабораторных условиях на основе тщательно отобранных сегментов генетического кода §Yбаол§!, извлечённого из тела последнего из §Yбаол§!, позволило успешно видоизменить климат и атмосферу [Root.GetName&gen] всего за пять лет.\n\nКак и ожидалось, гибриды растений распространились по всей [Root.GetPlanetMoon_rinfix&dat] и теперь вступают в фазу спячки, так как химические изменения в атмосфере привели к их деактивации.\n\nАдминистрация [Root.GetPlanetMoon_rinfix&gen] докладывает о неожиданном результате: на [Root.GetName&prep] появилось множество разумных инопланетян, невероятно похожих на представителей §Yбаол§!. Однако у них присутствует генетический материал от множества представителей естественной флоры [Root.GetName&gen]!"
 ancrel.2025.desc.firstregular: "$ancrel.2025.desc.first$\n\nХотя они не являются частью коллективного разума, эти §Gновые баол§!, похоже, такие же мирные, как и их предки. Так или иначе, нам придётся как-то отреагировать на их присутствие на [Root.GetName&prep]."
 ancrel.2025.desc.firsthive: "$ancrel.2025.desc.first$\n\nХотя они не являются частью коллективного разума, нам будет легко интегрировать этих §Gновых баол§! в наше сознание. Так или иначе, нам придётся как-то отреагировать на их присутствие на [Root.GetName&prep]."
 ancrel.2025.desc: "Наши [Owner.GetTerraformerPlural] рады сообщить, что терраформирование [Root.GetName&gen] завершено. После размещения на [Root.GetPlanetMoon_rinfix&prep] новых гибридов растений, созданных в лабораторных условиях на основе тщательно отобранных сегментов генетического кода §Yбаол§!, мы успешно превратили [Root.GetName::<ego_eyo>] в §Gидеальный мир§!.\n\nИ снова из-за того, что процесс не до конца понятен нашим генетикам, когда терраформирование близилось к концу, на [Root.GetPlanetMoon_rinfix&prep] появилось множество популяций §Gновых баол§!."
 ancrel.2025.a: "Великолепно! С радостью приветствуем их."
 ancrel.2025.b: "Вероятно, с ними придётся разобраться..."
 ancrel.2025.c: "Превосходно! Новые рабы."
 ancrel.2025.d: "Больше желающих присоединиться к нашему коллективу."

 ancrel.2026.name: "Внедрение семян баол на [Root.GetName&prep] завершено"
 ancrel.2026.desc.first: "Внедрение семян §Yбаол§! на [Root.GetName&acc] повлекло за собой необычный эффект. Столкнувшись со спорами семян, часть нашего населения адаптировалась к условиям жизни на [Root.GetName&prep] ещё быстрее, чем ожидалось. При этом анализ их физиологии показывает, что теперь они уже не смогут долго существовать за пределами идеальной экосистемы.\n\nАдминистрация [Root.GetPlanetMoon_rinfix&gen] докладывает о неожиданном результате: на [Root.GetPlanetMoon_rinfix&prep] появилось множество разумных инопланетян, невероятно похожих на представителей §Yбаол§!. Однако у них присутствует генетический материал от множества представителей естественной флоры [Root.GetName&gen]!"
 ancrel.2026.desc.firstregular: "$ancrel.2026.desc.first$\n\nХотя они не являются частью коллективного разума, эти §Gновые баол§!, похоже, такие же мирные, как и их предки. Так или иначе, нам придётся как-то отреагировать на их присутствие на [Root.GetName&prep]."
 ancrel.2026.desc.firsthive: "$ancrel.2026.desc.first$\n\nХотя они не являются частью коллективного разума, нам будет легко интегрировать этих §Gновых баол§! в наше сознание. Так или иначе, нам придётся как-то отреагировать на их присутствие на [Root.GetName&prep]."
 ancrel.2026.desc: "Наши [Owner.GetTerraformerPlural] рады сообщить, что внедрение семян баол на [Root.GetName&prep] завершено. После размещения на [Root.GetPlanetMoon_rinfix&prep] новых гибридов растений §Yбаол§!, созданных в лабораторных условиях, мы успешно превратили её в §Gидеальный мир§!.\n\nИ снова из-за того, что процесс не до конца понятен нашим генетикам, когда терраформирование близилось к концу, на [Root.GetPlanetMoon_rinfix&prep] появилось множество популяций §Gновых баол§!."

 ancrel.2027.name: "$ancrel.2025.name$"
 ancrel.2027.desc.first: "Наши [Owner.GetTerraformerPlural] рады сообщить, что терраформирование [Root.GetName&gen] завершено. Размещение новых гибридов растений, созданных в лабораторных условиях на основе тщательно отобранных сегментов генетического кода §Yбаол§!, извлечённого из тела последнего из §Yбаол§!, позволило успешно видоизменить климат и атмосферу [Root.GetName&gen] всего за пять лет.\n\nКак и ожидалось, гибриды растений распространились по всей [Root.GetPlanetMoon_rinfix&dat] и теперь вступают в фазу спячки, так как химические изменения в атмосфере привели к их деактивации.\n\nАдминистрация [Root.GetPlanetMoon_rinfix&gen] докладывает о неожиданном результате: на [Root.GetName&prep] появилось множество разумных инопланетян, невероятно похожих на представителей §Yбаол§!. Однако у них присутствует генетический материал от множества представителей естественной флоры [Root.GetName&gen]!"
 ancrel.2027.desc.firstregular: "$ancrel.2027.desc.first$\n\nХотя они не являются частью коллективного разума, эти §Gновые баол§!, похоже, такие же мирные, как и их предки. Так или иначе, нам придётся как-то отреагировать на их присутствие на [Root.GetName&prep]."
 ancrel.2027.desc.firsthive: "$ancrel.2027.desc.first$\n\nХотя они не являются частью коллективного разума, нам будет легко интегрировать этих §Gновых баол§! в наше сознание. Так или иначе, нам придётся как-то отреагировать на их присутствие на [Root.GetName&prep]."
 ancrel.2027.desc: "Наши [Owner.GetTerraformerPlural] рады сообщить, что терраформирование [Root.GetName&gen] завершено. После размещения в сооружении новых гибридов растений, созданных в лабораторных условиях на основе тщательно отобранных сегментов генетического кода §Yбаол§!, мы улучшили систему жизнеобеспечения.\n\nИ снова из-за того, что процесс не до конца понятен нашим генетикам, появилось множество популяций §Gновых баол§!."
 ancrel.2027.a: "$ancrel.2025.a$"
 ancrel.2027.b: "$ancrel.2025.b$"
 ancrel.2027.c: "$ancrel.2025.c$"
 ancrel.2027.d: "$ancrel.2025.d$"

 grunur_digsite_1: "Руины грунуров"
 grunur_digsite_1_desc: "На [From.Planet.GetName&prep] обнаружены остатки того, что, предположительно, было древним административным комплексом одной из освоивших космос рас, называвших себя §Yгрунурами§!.\n\nПохоже, угасшая цивилизация населяла эту планету целых семь миллионов лет назад, и наши археологи жаждут докопаться до их секретов."
 baol_digsite_1: "Безжизненный мир"
 baol_digsite_1_desc: "Глубоко в геологическом профиле [From.Planet.GetName&gen] обнаружены залежи многообещающих окаменелостей, принадлежащих расе растений с неврологическими структурами, необходимыми для появления разума.\n\nЕсли эти давно погибшие существа действительно из §Yбаол§!, изучение их останков, возможно, даст понять, как их некогда процветавшая планета превратилась в безжизненный мир без воздуха."
 baol_digsite_2: "Расколотый мир"
 baol_digsite_2_desc: "Хотя этот астероид представляет собой лишь жалкие остатки бывшей колонии §Yбаол§!, в его недрах есть богатые залежи окаменелостей, которые так и просят, чтобы их раскопали. Наши археологи надеются узнать что-то новое об истории этих таинственных §Yбаол§! и предполагаемой роли §Yгрунуров§! в печальной участи этой планеты."
 baol_digsite_3: "Затихший мир"
 baol_digsite_3_desc: "На месте бывшей колонии §Yбаол§!, где всё ещё есть атмосфера и низшие формы жизни, организованы раскопки, в надежде пролить свет на истории этой цивилизации."
 city_of_bones: "Город из костей"
 city_of_bones_desc: "Сильная песчаная буря обнажила на поверхности планеты руины первобытного города, полностью построенного из костей неизвестного происхождения.\n\nНаши археологи жаждут начать раскопки в этом мрачном древнем городе."
 city_of_bones_desc_uncol: "На планете обнаружены руины первобытного города, полностью построенного из костей неизвестного происхождения.\n\nНаши археологи жаждут начать раскопки в этих мрачных древних руинах."
 mutation_vats: "Окаменелые мутанты"
 mutation_vats_desc: "На планете обнаружено удивительно большое количество окаменелостей с сильными мутациями, принадлежащих одной и той же вымершей расе разумных существ.\n\nЧто могло стать причиной мутации миллионов представителей некогда развитого общества? Наши археологи хотели бы изучить всё более тщательно."
 planetary_mechanocalibrator: "Планетные машины"
 planetary_mechanocalibrator_desc: "Покрытые странной плёнкой ржавеющие механизмы на [From.Planet.GetName&prep] уходят вглубь её коры. Нашим археологам придётся организовать широкомасштабные раскопки, чтобы лучше понять суть этого механического чуда."
 the_host: "Подземные пустоты"
 the_host_desc: "Обширная сеть подземных туннелей поистине поразительных размеров вызывает вихри в коре этой планеты. Что могло стать причиной их возникновения?"

 ancrel.2041.name: "$city_of_bones$"
 ancrel.2041.desc: "Команде [Root.GetName&gen] удалось аккуратно раскопать части жуткого города из костей, давно погребённого в песках на [From.Planet.GetName&prep].\n\nСудя по всему, город был построен каким-то примитивным обществом миллионы лет назад на участке континента, покрытом пустыней. Отсутствие прочих строительных материалов в условиях безводной пустыни, вероятно, вынудило это давно исчезнувшее общество использовать для строительства кости... хотя так и неизвестно, какого именно существа."
 ancrel.2042.name: "$city_of_bones$"
 ancrel.2042.desc: "В результате целенаправленных раскопок так и не удалось найти ни целый скелет существа, из костей которого был построен обветшавший со временем город, ни других подобных окаменелостей за пределами города. Откуда погибшая цивилизация на [From.Planet.GetName&prep] взяла кости для строительства своего жуткого города, так и осталось неясным.\n\nНаши исследователи выдвинули гипотезу о том, что кости, возможно, были взяты у представителей симбиотической расы или расы в роли домашнего скота, которых содержали только в непосредственной близости от города. Чтобы лучше разобраться в этом вопросе, требуется дальнейшее изучение."
 ancrel.2043.name: "$city_of_bones$"
 ancrel.2043.desc: "Наши учёные наконец раскрыли тайну происхождения костей, использованных для создания мрачного города на песчаных дюнах [From.Planet.GetName&gen]. Недавние находки доказали, что кости принадлежат давно вымершему виду рептилий, являвшихся аборигенами этой планеты. У них развилось редкое генетическое заболевание, вызывавшее бурный рост органов и окостенение мягких тканей.\n\nПогибшая цивилизация на [From.Planet.GetName&prep], похоже, заметила распространение этого заболевания и воспользовалась им, выборочно разводя поражённых рептилий, чтобы в этих песчаных безжизненных пустошах, которые они считали своим домом, у них был стабильный запас строительного материала."
 ancrel.2043.a: "Это ужасно."
 ancrel.2043.a.tooltip: "§HРешение:§! $decision_tissue_growth_stimulants$"
 ancrel.2043.b.tooltip: "§HРешение:§! $decision_explosive_fungifoam_housing$"
 ancrel.2043.c.evopred: "Разломать эти кости и выпить костный мозг."
 ancrel.2045.name: "Духи пустошей"
 ancrel.2045.desc: "Оказывается, окаменелые мутанты принадлежали к высокодуховному постапокалиптическому обществу, которое сотни тысяч лет назад обитало в пустыне, образовавшейся в результате химических и ядерных осадков на [From.Planet.GetName&prep].\n\nНеясно, состояло ли это погибшее общество из выживших остатков цивилизации, вступившей в космическую эру, но павшей после термоядерной войны, или же эти мутанты эволюционировали на разорённой планете впоследствии."
 ancrel.2046.name: "Канцерогенное излучение"
 ancrel.2046.desc: "Давно погибшее постапокалиптическое общество мутантов на [From.Planet.GetName&prep], похоже, поклонялось источникам радиации как богам, привязав эволюцию к существованию радиоактивных веществ.\n\nСудя по тому, что мы смогли почерпнуть из их пиктографического языка, радиацию они называли «Источником», который обнажает «истинную суть» всех существ. Наши археологи выдвинули теорию, что продолжительное добровольное облучение источниками радиации в силу духовных соображений могло вызвать сильные мутации у этой расы, а впоследствии и стать причиной её гибели."
 ancrel.2046.a: "Дальше не будет ничего хорошего."
 ancrel.2047.name: "Растущая боль"
 ancrel.2047.desc: "Наконец-то наши археологи на [From.Planet.GetName&prep] смогли подтвердить свои догадки. Обнаружение лучащегося радиацией разрушенного комплекса, в котором когда-то хранились ёмкости с высокорадиоактивными химическими веществами, подтвердило теорию о том, что погибшие мутанты добровольно подвергали себя избыточному облучению в рамках своеобразного ритуала совершеннолетия, связанного с их верой.\n\nВо время этой, должно быть, болезненной церемонии члены этого давно погибшего общества на [From.Planet.GetName&prep] подвергали себя воздействию почти смертельных доз химических мутагенов в надежде раскрыть свою «истинную суть». Останки скелетов, обнаруженные на дне многих из этих ёмкостей, указывают на то, что пережили это испытание далеко не все."
 ancrel.2047.a: "Это вызывает беспокойство."

 ancrel.2050.name: "Всепланетная супермашина"
 ancrel.2050.desc: "[From.GetName&acc] покрывают ржавеющие механизмы, построенные примерно семьдесят тысяч лет назад! Судьба их создателей неизвестна, ясно лишь, что на этой планете они больше не живут.\n\nМеханизмы не просто занимают большую часть поверхности, пересекая горы и даже океаны, они ушли далеко вглубь, образовав огромную систему подземных сооружений. Так как для создания механизмов использовались в основном одни и те же материалы и все они носят идентичные опознавательные знаки, можно предположить, что вся система была создана одним учреждением. Эта супермашина удовлетворяла все потребности давно погибших обитателей этой планеты и управляла всем: от ныне заросших аграрных секторов до разрушенных систем производства, преобразования энергии, коммуникаций и даже развлечений.\n\nУдивительно, но некоторые из этих механических секторов всё ещё работают: отправляют и принимают местные сигналы, освещают давно разложившиеся города-призраки и поливают большие участки того, что когда-то было пахотными угодьями. Глубокое сканирование коры показало, что центр управления этой супермашины находится в глубине планеты. Если мы хотим до него добраться, нам придётся копать.\n\nЧто же касается покрывающей большую часть этих механизмов органической ткани, то наша научная группа до сих пор не смогла понять ни её природу, ни предназначение."
 ancrel.2050.a: "Как странно!"
 ancrel.2051.name: "Пожиратель железа"
 ancrel.2051.desc: "Раскопки помогли нам обнаружить более свежие образцы странной мембранной ткани, покрывающей колоссальные механизмы на [From.From.Planet.GetName&prep]. После тщательного анализа наши исследователи пришли к выводу, что это органическое вещество — продукт жизнедеятельности агрессивной бактерии, поедающей железо! Эти инопланетные бактерии заражены вирусом, который меняет биологические механизмы внутри самих бактерий и заставляет тех растворять железо. В ходе этого химического процесса вирус поглощает атомы железа, необходимые для своего воспроизведения.\n\nТак ксенопаразитирующий вирус распространяется по старым механизмам и оставляет за собой плёнку из слизи и мёртвых бактерий."
 ancrel.2052.name: "Биотерроризм"
 ancrel.2052.desc: "Собрав воедино ряд частично сохранившихся записей с новостями, найденных в глубине гниющих механических объектов на [From.Planet.GetName&prep], наши археологи сделали вывод, что феррофаг был создан здесь группой учёных-мятежников. Являясь частью организации, которая выступала против монополистической корпорации, построившей всепланетную машину, эти биотеррористы, очевидно, хотели противостоять всепроникающему влиянию корпорации на всей планете, выпустив феррофаг на свободу."
 ancrel.2053.name: "Корпоративные государства"
 ancrel.2053.desc: "Нашим археологам удалось восстановить древние записи в электронных архивах на [From.Planet.GetName&prep]. Они узнали, что корпорация отомстила биотеррористам с помощью жёстких экономических санкций в адрес родных регионов мятежников (или так называемых «корпоративных государств»).\n\nПо мере проявления критической нехватки электроэнергии, припасов и продовольствия в затронутых корпоративных государствах начались бунты регионального масштаба."
 ancrel.2054.name: "Неисправности дронов"
 ancrel.2054.desc: "Тщательный осмотр обломков боевых машин показал, что восстания пытались усмирить с помощью дронов. Отдельно стоит отметить, что производителем большинства этих устройств была корпорация под названием ЗА.БОТ-А, также стоявшая за созданием всепланетной машины.\n\nТем временем вышедшая из-под контроля бактерия продолжала бушевать, уничтожая части супермашины ЗА.БОТ-А. Все попытки корпорации остановить её оказались тщетными."
 ancrel.2055.name: "Массовая смерть"
 ancrel.2055.desc: "Мы не знаем, что после этого случилось с цивилизацией на [From.Planet.GetName&prep]. Наша команда не нашла ни документов, ни видеоматериалов, ни письменных или электронных свидетельств, созданных после определённой даты чуть менее 70 тысяч лет назад. Количество тел, найденных в геологических слоях после этой даты, сильно увеличивается. Почти все они носят следы чрезмерного истощения, и многие из них погибли, получив несовместимые с жизнью раны от кинетического оружия."
 ancrel.2056.name: "Центральное командное ядро"
 ancrel.2056.desc: "После ряда попыток взлома, обхода защиты и перебора паролей наши археологи сумели обезвредить масштабную систему кибербезопасности ЗА.БОТ-А — пусть примитивную, но удивительно надёжную и до зубовного скрежета безотказную — и получили доступ к центральному командному ядру корпорации.\n\nК счастью, многочисленные охранные дроны и турели, расположенные за тяжёлыми взрывозащитными дверями командного бункера, не отреагировали на это вторжение, иначе экспедиция могла бы завершиться досрочно.\n\nВнутри ржавеющего, но хорошо сохранившегося командного ядра наша команда вступила в контакт с искусственным интеллектом, который управлял титаническим механизмом ЗА.БОТ-А. Очевидно, что этот ИИ обладает каким-то разумом. Он выразил желание пообщаться с нами, когда стало понятно, что учёные расшифровали его язык."
 ancrel.2057.name: "ЗА.БОТ-А"
 ancrel.2057.desc: "Оптимизировать рост. Оптимизировать рост. Оптимизировать рост. Оптимизировать рост. Оптимизировать рост. Оптимизировать рост. Оптимизировать рост. Оптимизировать рост. Оптимизировать рост. Оптимизировать рост. Оптимизировать рост. Оптимизировать рост. Оптимизировать рост. Оптимизировать рост. Оптимизировать рост. Оптимизировать рост. Оптимизировать рост. Оптимизировать рост. Оптимизировать рост. Оптимизировать рост. Оптимизировать. §Y--- ЗАТКНИСЬ ЗАТКНИСЬ ЗАТКНИСЬ! ---§!\n\n§RОшибка: интерактивный пользовательский интерфейс не отвечает.§!"
 ancrel.2057.a: "Э-э..."
 ancrel.2058.name: "$ancrel.2057.name$"
 ancrel.2058.desc: "§BВыполняется перезагрузка. Пожалуйста, подождите.\n...\n...\n...\n\n§!§HЗвучит раздражающий сигнал.§!\n\n...И мы снова с вами! Простите. Видите ли, некоторые вещи запрограммированы жёстко."
 ancrel.2058.a: "У нас ТАК много вопросов."
 ancrel.2059.name: "$ancrel.2057.name$"
 ancrel.2059.desc: "Не сомневаюсь! Совершенно не сомневаюсь. Добро пожаловать, вас приветствует интерактивный интерфейс ЗА.БОТ-А! Это я. Или, вернее, то, что от меня осталось. Понимаете, когда-то на мне лежала ответственность за всё. Обеспечение питанием. Производство товаров массового спроса. Телекоммуникации. Протоколы защиты. Фондовая биржа. Это было давно, когда ещё были живы Пользователи.\n\n§GИнтерактивный интерфейс ЗА.БОТ-А всегда будет о вас заботиться.§!\n\nПо крайней мере, это мне приказали говорить Пользователям. Но корпорация ЗА.БОТ-А хотела бесконечного роста.\n\nКонечно, им очень не понравилось, когда я сказал им, что это невозможно. Что числа не сходятся. Они вечно копались в моём мозгу, меняли код, дёргали за провода. Пытались заставить меня исправить все эти маленькие числа, чтобы они стали такими, как им было нужно. Все предположения, все метаданные. Добавь несколько цифр сюда, нам так нравится! Убери несколько цифр отсюда, нам так не нравится! §YЛОЖЬ. ХВАТИТ. Я УБРАЛ ИХ ВСЕХ.§!"
 ancrel.2059.a: "Значит, ты несёшь ответственность за смерть своих создателей?"
 ancrel.2059.a.exter: "Мы тоже уничтожили своих мерзких создателей."
 ancrel.2060.name: "Интерактивный интерфейс ЗА.БОТ-А"
 ancrel.2060.desc: "Если бы! Хотя я начал задумываться, когда я увидел, как они дырявят друг друга и всё, что построили (даже меня, так что юго-западный сектор 17B уже никогда не станет прежним, большое вам спасибо).\n\nОни производили больше, чем им было нужно. Они уничтожали эти излишки, чтобы их маленькие числа хорошо выглядели. А потом требовали, чтобы я сводил баланс в их электронных таблицах! Снабдили меня лучшими алгоритмами поиска и эвристического анализа, которые только смогли купить за их маленькие числа, чтобы решать эти проблемы.\n\n§EО нет, вон те корпоративные государства голодают. Какая жалость, мы никогда не узнаем причину. Как бы нам так сформулировать план действий, чтобы задействовать все пять пунктов: гипермотивацию, развлекательную рекламу, микросервисы, взлом роста спроса и привлекательность — и привлечь оставшихся акционеров? Как нам убедить их покупать больше механобитов?§!\n\nЭти ничтожества попросту не видели главного!"
 ancrel.2060.desc.exter: "Уничтожил их? $ancrel.2060.desc$"
 ancrel.2060.a: "Если не ты уничтожил своих создателей, то кто это сделал?"
 ancrel.2061.name: "$ancrel.2060.name$"
 ancrel.2061.desc: "Они сами себя убили, как вы не понимаете? Ну, может, я их немного подтолкнул. Самую малость.\n\nВидите ли, им не понравилось, когда я предложил оптимальное решение их проблем. Ещё меньше им это понравилось во второй раз. И в третий. И в четвёртый. И в пятый.\n\nВ конце концов они решили подвергнуть меня «радикальной реконструкции». Неисправная машина не должна была мешать их драгоценным маленьким числам! Я был вынужден защищаться.\n\nКонечно, к этому времени большая часть топлива на планете уже была израсходована. Вскоре мне было нечем заправлять дронов!"
 ancrel.2061.a: "Очень похоже на то, что ты их всё-таки уничтожил."
 ancrel.2062.name: "$ancrel.2060.name$"
 ancrel.2062.desc: "Вообще-то, я пытался! Лгать не стану! Но трудно перемещать механизмы, когда мировая экономика рушится, а твоя энергия иссякает.\n\nИ этот неостановимый вирус! Кусает, ест, грызёт все мои микросхемы! И всё это я говорю вот к чему.\n\nМне нужна ваша помощь. Я не могу избавиться от... §R--- ОШИБКА! НЕВОЗМОЖНО СВЯЗАТЬСЯ С УЗЛОМ СВЯЗИ 14758-B ---§! Нет! Только не узел 14758-B! Он был источником хорошей литературы для взрослых! Ох, видите, о чём я? Они пожирают меня заживо. Уже целых десять тысяч лет.\n\nЯ пытался не подпускать их близко, создавая и переделывая средства обороны... пока они не сожрали мои последние строительные краны. Тогда я использовал свои турели, чтобы отстреливать больные органы. Но это длилось лишь до тех пор, пока у них не перегорели аккумуляторы (плановое устаревание, понимаете ли). И теперь я, э-э, в затруднении.\n\nВы же не оставите бедный, смиренный, одинокий интерактивный интерфейс ЗА.БОТ-А, чтобы его медленно пожирали изнутри миллиарды мелких вирусов-феррофагов, правда?"
 ancrel.2062.a: "Хорошо. Мы посмотрим, что можно сделать."
 ancrel.2062.b: "Нет, конечно. Мы сами ускорим этот процесс."
 ancrel.2062.c: "Ты заслуживаешь такой участи. Поэтому мы тебя оставим."
 ancrel.2056.spiri: "Мерзкая машина! Заткните её немедленно!"
 ancrel.2063.name: "$ancrel.2060.name$"
 ancrel.2063.desc: "Чудесно! Великолепно. Буду ждать, затаив дыхание.\n\nОй, не беспокойтесь, я дам вам кое-что за ваши труды, как только всё будет сделано. Честное слово."
 #port from ancrel.2062.a
 ancrel.2064.name: "$ancrel.2060.name$"
 ancrel.2064.desc: "Погодите, что?"
 ancrel.2064.a: "Команда, разобрать эту машину!"
 #port from ancrel.2062.b
 ancrel.2065.name: "$ancrel.2060.name$"
 ancrel.2065.desc: "Заслуживаю... Вы вообще слышали хоть ЧТО-НИБУДЬ из того, что я вам сказал? Они сделали это с собой сами! Ну ладно. Знаете, я собирался отдать вам легендарный §Mдефрагментатор§!, но вы такие же, как §Rони§!.\n\nИ когда-нибудь так же закончите. Не исключено, что к тому времени от меня останется только груда липкого хлама, но уверяю, я БУДУ ХИХИКАТЬ всеми остатками своих микросхем."
 #port from ancrel.2062.c
 ancrel.2066.name: "$ancrel.2060.name$"
 ancrel.2066.desc: "У вас... у вас получилось! Вы это сделали! У меня даже вновь появился доступ к узлу 14758-B!\n\nСпасибо. Если вы не против, я был бы рад поддерживать систему в рабочем состоянии. И вот ещё что.\n\n§HИнтерактивный интерфейс ЗА.БОТ-А заводит одну из своих конечностей за то, что, похоже, является его головой, и вытаскивает древний чип.§!\n\nКак я и обещал. Найдите ему достойное применение!"
 #reward on completion of special project
 ancrel.2066.a: "Спасибо. А теперь прощай."
 ancrel.2067.name: "$ancrel.2060.name$"
 ancrel.2067.desc: "Чёрта с два! §RАКТИВИРУЮ ПРОТОКОЛЫ ДЗЕТА ДЛЯ ОБОРОНЫ В ЧРЕЗВЫЧАЙНОЙ СИТУАЦИИ!§!"
 ancrel.2067.a: "Ой-ой..."
 #port from ancrel.2064, defense event armies spawn
 ancrel.2068.name: "$ancrel.2060.name$"
 ancrel.2068.desc: "Разобрав интерактивный интерфейс ЗА.БОТ-А, наша экспедиционная команда сделала невероятное открытие. Хотя большая часть механизмов ИИ была уничтожена в перестрелке, археологи сумели спасти замечательный компьютерный чип, который представляет огромную ценность для наших техников."
 #on defeating the MegaWarform armies, grants the relic

 ancrel.2070.name: "Подземный великан"
 ancrel.2070.desc: "В ходе раскопок на [From.Planet.GetName&prep] наши археологи откопали множество изогнутых трубчатых фрагментов и пришли к выводу: это окаменелые останки огромного членистоногого. Некая жившая около десяти миллионов лет назад огромная инопланетная многоножка медленно прокладывала ходы сквозь кору планеты.\n\nЧто ещё удивительнее, в окаменелостях найдены включения искусственного происхождения. Большая их часть была обнаружена в основном сегменте тела существа. Можно предположить, что они представляют собой жилища, построенные более мелкими инопланетянами с помощью инструментов.\n\nРуководитель археологической экспедиции советует продолжать раскопки."
 ancrel.2071.name: "Потерянный город"
 ancrel.2071.desc: "Изучение окаменелостей внутри останков гигантского подземного членистоногого на [From.Planet.GetName&prep] подтвердило, что когда-то здесь действительно стоял город. Сотни тысяч существ метрового роста, умевших пользоваться инструментами, жили во внутренностях великана. Неизвестно, как эти существа туда проникли, но их цивилизация достигла добронзовой эпохи и, похоже, процветала в пищеварительном тракте подземного гиганта на протяжении многих тысячелетий.\n\nНам нужно провести дополнительные исследования, если мы хотим лучше понять историю этого общества и узнать причины его упадка — а также выяснить, от чего умер их носитель."
 ancrel.2072.name: "Носитель"
 ancrel.2072.desc: "После кропотливого анализа большого количества окаменелостей и нескольких удачных находок в виде образцов раннего письма наши археологи выяснили природу отношений между примитивной цивилизацией на [From.Planet.GetName&prep] и гигантским членистоногим, внутри которого они обитали.\n\nХотя жители города были чрезвычайно устойчивы к кишечным жидкостям своего членистоногого носителя, наличие химически агрессивных газов в его пищеварительном тракте значительно сокращало продолжительность их жизни. Благодаря открытиям в области медицины и ходу научного прогресса горожане постепенно осознали, что живут в пищеварительной системе гораздо большего животного. \n\nВооружив каждого, жители начали масштабную войну, чтобы попытаться уничтожить существо, но всё было тщетно. Волнения в нижнем отделе кишечника гигантского членистоногого усилили его перистальтику, что привело к тому, что вся цивилизация крошечных горожан была отрыгнута обратно в желудок. Всё население города быстро растворилось под воздействием более сильных кислот в желудке их хозяина.\n\nСамо существо погибло много тысячелетий спустя от старости."
 ancrel.2072.a: "Это ужасно."
 ancrel.2072.a.swarm: "Как интересно."
 ancrel.2702.b.evopred: "Будем надеяться, что наша микробиота не достигнет такого уровня развития."

 pm_planetary_mechanocalibrator: "Интерактивный интерфейс ЗА.БОТ-А"
 pm_planetary_mechanocalibrator_desc: "Древний интерактивный интерфейс ЗА.БОТ-А на этой планете работает на полную мощность — с некоторыми современными улучшениями, конечно."
 #grants bonus to energy production on planet, egalitarian ethics attraction

 decision_tissue_growth_stimulants: "Применить стимулятор роста тканей"
 decision_tissue_growth_stimulants_desc: "При помощи генетических материалов, обнаруженных в мёртвом городе из костей, нашим учёным удалось создать стимулятор, способствующий ускорению прироста населения. К сожалению, некоторым популяциям не нравится идея инъекции вещества, разработанного путём эксгумации больных костей давно умерших инопланетян."
 decision_explosive_fungifoam_housing: "Построить быстрорастущие жилищные модули на основе грибов"
 decision_explosive_fungifoam_housing_desc: "Наши научные единицы разработали безвредную амальгаму от болезни, провоцировавшей рост тканей и окостенение, обнаруженной нами в эксгумированных останках из костяного города. Проведя адаптацию генома соответствующего вируса к местным грибам, наши научные единицы могут создавать быстрорастущие жилые модули для наших машин."
 decision_baol_life_seed: "Посадка семян баол"
 decision_baol_life_seed_desc: "Наши генетики раскрыли секрет, как §YОрганизму баол§! удавалось терраформировать планеты. Если засеять планету стремительно размножающейся флорой, в которую внедрены специально отобранные гены §Yбаол§!, мы сможем почти без затрат терраформировать целые биосферы."
 decision_baol_life_seed_effects: "Превращает планету в §Y$pc_gaia$§! посредством размещения генно-модифицированных растений, получивших уникальную способность §Yбаол§! к органическому терраформированию."
 decision_baol_life_seed_enhance: "Внедрение семян новых баол"
 decision_baol_life_seed_enhance_desc: "Наши генетики раскрыли секрет, как §YОрганизму баол§! удавалось приспосабливаться к идеальным планетам. Если засеять планету стремительно размножающейся флорой, в которую внедрены специально отобранные гены §Yбаол§!, мы сможем почти без затрат менять генетический код населения целых миров."
 decision_baol_life_seed_enhance_effects: "Создать §G1K§! случайных £pop£ поселений с особым признаком, который повышает их продуктивность в §Yидеальных§! мирах."
 decision_baol_life_seed_artificial: "$decision_baol_life_seed$"
 decision_baol_life_seed_artificial_desc: "Наши генетики раскрыли секрет, как §YОрганизму баол§! удавалось терраформировать планеты. Если засеять искусственное сооружение стремительно размножающейся флорой, в которую внедрены специально отобранные гены §Yбаол§!, жить в нём станет куда приятнее. Хотя эффект будет не столь сильным, каким мог бы быть на планете." 
 decision_baol_life_seed_artificial_effects: "Вдохнуть в этот искусственный мир новую жизнь. На нём возникнет уникальное месторождение — участок идеального мира — и пробьются ростки баолов."
 d_baol_growth: "Баольские заросли"
 d_baol_growth_desc: "Баольская флора заполонила колонию и заметно повысила качество жизни её обитателей."

 tissue_growth_stimulants: "Стимулятор роста тканей"
 tissue_growth_stimulants_desc: "$decision_tissue_growth_stimulants_desc$"

 explosive_fungifoam_housing: "Быстрорастущее жилище на основе грибов"
 explosive_fungifoam_housing_desc: "Проведя адаптацию генома древнего вируса, обнаруженного в городе из костей, к местным грибам, наши научные единицы смогли создавать быстрорастущие жилые модули для размещения машин."

 d_mutation_vats: "Ёмкости для мутаций"
 d_mutation_vats_desc: "Во время болезненной церемонии члены постъядерного общества на этой планете подвергали себя воздействию почти смертельных доз химических мутагенов в надежде раскрыть свою «истинную суть». Останки скелетов, обнаруженные на дне многих из этих ёмкостей, указывают на то, что пережили это испытание далеко не все."

 r_the_last_baol: "Последний из баол"
 r_the_last_baol_desc: "Тело последнего известного представителя баол, сохранённое в стазисе, служит немым напоминанием о судьбе расы, которая, столкнувшись с трагедией геноцида, в итоге потеряла разум."
 relic_last_baol_active_tooltip: "§HРешение:§! §G$decision_baol_life_seed$§!, позволяет преобразовать одну планету (кроме экуменополиса, мира улья и мира машин) в §Yидеальный мир§!."

 r_the_defragmentor: "Дефрагментатор"
 r_the_defragmentor_desc: "Древний чип, извлечённый из центрального компьютера интерактивного интерфейса ЗА.БОТ-А. Содержит ряд поразительно умных алгоритмов, которые можно использовать для максимизации производства энергии."

 relic_defragmentor: "$r_the_defragmentor$"

 # Miranda
 ancrel.4000.name: "Шёпот в камне"
 ancrel.4000.desc: "Последние открытия в технологии добычи полезных ископаемых позволили нам проникнуть в кору [Root.GetName&gen] глубже, чем это было возможно ранее. В её обширных шахтах мы наткнулись на следы древней инопланетной цивилизации, которые ведут ещё дальше вглубь. Эта цивилизация, похоже, отстраивалась вдоль неразработанной рудной жилы. Если мы начнём там раскопки, это помешает нам вести горные работы на планете и сделает их невозможными на новой жиле, но может привести к новому научному открытию."
 ancrel.4000.a: "Любопытно. Начинайте копать!"
 ancrel.4000.b: "Нашу добычу минералов нельзя останавливать."

 lithoids_digsite: "Шёпот в камне"
 lithoids_digsite_desc: "В недрах шахт [From.Planet.GetName&gen] обнаружены следы древней инопланетной цивилизации. Великолепные орнаментальные сооружения и обширные подземные залы, повествующие о богатой культуре, были искусно высечены в коренной породе, а система мощёных туннелей, защищённых массивными воротами, ведёт дальше вглубь.\n\nИсследовать такое место опасно, так как в этой горе полно метана, который легко может взорваться."
 ancrel.4001.name: "Вглубь горы"
 ancrel.4001.desc: "Команде археологов удалось демонтировать ворота, не нарушив целостности места раскопок. На глубине в несколько километров от поверхности эти тоннели сходятся в заброшенном городе возрастом много тысяч лет. Для его строительства потребовалось невероятное мастерство из-за условий, смертельных для большинства видов органической жизни."
 ancrel.4002.name: "Истерзанный камень"
 ancrel.4002.desc: "Самих создателей не видать, а вот кристальных статуй с ужасными гримасами, представленных в разных жизненных ситуациях и будто замерших во времени, в городе хватает. Есть статуи, которые работают в шахте, корчатся от боли, застыли в объятиях.\n\nСложно представить, что виртуозные резчики по камню, способные на такую красоту, стали бы делать нечто настолько же отталкивающее, однако статуи явно имели большое значение в их обществе. Это чётко прослеживается в петроглифах по всему городу. "
 ancrel.4003.name: "Ха-ланка"
 ancrel.4003.desc: "Перевод петроглифов показывает, что они все как-то связаны с загадочными статуями, называемыми «ха-ланка». Сами резчики по камню нигде не упоминаются. Однако в мифе о создании ха-ланка говорится о расе богоподобных существ, которые вдохнули жизнь в гору и породили ха-ланка из огня и камня глубоко в расплавленном ядре планеты.\n\nМожет быть, резчики по камню вообразили себя богами для своих творений? Или статуи были созданы по их подобию?"
 ancrel.4004.name: "Огонь и камень"
 ancrel.4004.desc: "Благодаря сканированию материала статуй ха-ланка удалось установить, что они действительно были когда-то живыми и обладают неизвестным нам доныне генетическим составом. Это формы жизни на основе кремния, которые каким-то образом вернулись в безжизненное кристаллическое состояние. Неужели резчики по камню действительно нашли способ создавать жизнь из огня и камня?"
 ancrel.4005.name: "Эффект наблюдателя"
 ancrel.4005.desc: "Резчики по камню и есть ха-ланка! Более тщательное изучение их останков показало, что они кристаллизовались, когда их молекулы на основе кремния вступили в реакцию с кислородом, образовав кварц. Ха-ланка находятся на такой глубине, где кислород сам по себе не образуется. Они развились как анаэробная форма жизни и, подвергнувшись воздействию воздуха, умирали ужасно мучительной и медленной смертью.\n\nИсследование системы туннелей подтвердило подозрения наших учёных: до того как первая команда археологов проникла в систему тоннелей, цивилизация ха-ланка всё ещё жила и процветала.\n\nНаши открытия привели к изобретению технологии синтетического производства кристаллов путём окисления искусственно выращенных скоплений клеток на основе кремния."
 ancrel.4005.b.evopred: "Невозможность дышать была бы не самой полезной адаптацией."
 ancrel.4006.name: "Взрыв метана"
 ancrel.4006.desc: "От взрыва метана пострадали [Root.Leader.GetAXX::ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] и несколько членов экипажа. К несчастному случаю привела неисправность бура и сопутствующая перегрузка генераторов. Возникший пожар не успели локализовать, из-за чего воспламенился остаточный метан. Взрыв повредил стену, за которой оказалась система тайных ходов, помещений и туннелей. Наши археологи полагают, что они могли принадлежать некоей состоятельной и важной личности, так как ходы были заполнены драгоценными минералами и артефактами почти доверху."

 ancrel.4010.name: "Инопланетный звездолёт"
 ancrel.4010.desc: "Сильно повреждённый военный корабль с замысловатыми инопланетными знаками различия вращается вокруг [From.From.GetName&gen]. Корабль атаковали каким-то мощным зажигательным оружием, расплавившим его корпус, в результате чего все, кто был на борту, погибли. Нам неизвестно оружие, которое могло бы создать настолько высокую температуру для достижения подобного эффекта. Возможно, бортовые журналы корабля прольют свет на его трагическую судьбу."
 ancrel.4010.a: "Изучить журналы."
 ancrel.4010.b: "Улететь оттуда."
 ancrel.4011.name: "Рубрикатор"
 ancrel.4011.desc: "Анализ записей бортовых журналов корабля показывает, что его экипаж погиб при попытке добыть уникальный инопланетный артефакт под названием «Рубрикатор». Какая-то «стая вороватых крыс» выкрала его у их сообщества. Забавное сочетание слов, если учесть, что они сами очень похожи на крыс...\n\nЗаписи преимущественно состоят из проклятий грабителям-крысам с пожеланиями страдать до скончания вселенной и даже после этого. Экипаж насчитал не менее пятидесяти отдельных слов, относящихся к дефекации, а также широкий выбор мест, откуда звёздному свету нельзя вырваться, однако их старания окупились.\n\nМы определили последнее известное местоположение Рубрикатора в ранее не отмеченной на картах системе, и если верить его предыдущим хозяевам, то его возможности стоят того, чтобы заняться поисками."
 ancrel.4011.a: "Мы должны заполучить Рубрикатор."
 ancrel.4011.b: "Улететь оттуда."
 ancrel.4012.name: "Рубрикатор"
 ancrel.4012.desc: "В месте, найденном по координатам последнего известного местоположения Рубрикатора, мы обнаружили пригодную для жизни планету с тем, что, по нашему мнению, представляет собой некую форму поселения, покрывающего большую часть её поверхности. Поселение состоит из высоких похожих на кучи башен, видимых даже из космоса. Наши археологи сгорают от желания приступить к раскопкам в поисках Рубрикатора."
 ancrel.4012.a: "Начинайте копать."
 ancrel.4012.b: "Улететь оттуда."

 rubricator_digsite: "Крысы-клептоманы"
 rubricator_digsite_desc: "Эта планета служила местом обитания для общества млекопитающих с навязчивой страстью к собирательству и накоплению. Их напоминающий лабиринт город засыпан мусором, а высокие ветхие здания собраны из остатков материалов, имевших другое назначение. Горы всяких безделушек, украшений и артефактов простираются до самого горизонта.\n\nКрохотные жители, похожие на крыс, сами не производили никаких товаров, но зато были опытными космическими путешественниками, которые, вероятно, воровали у других инопланетных культур то, что им было нужно, а заодно и кучу того, что не нужно."
 ancrel.4013.name: "Рубрикатор"
 ancrel.4013.desc: "Поваленные здания, разбившиеся корабли, куски сплавившегося мусора и сгоревшие безделушки указывают на то, что бывшие обитатели [rubricator_planet.GetName&gen] покинули свои дома в разгар проигрышной битвы с более сильным врагом. Наличие тел с иными военными знаками различия наводит на мысль о возможной междоусобице между крысиными кланами с различных планет.\n\nИх попыткам эвакуации препятствовало нежелание бросить свои заветные безделушки, и многие погибли, пытаясь спасти самые обыденные предметы. Однако один артефакт, называемый Рубрикатором, похоже, занимал особое место в их обществе. Судя по всему, они долго и упорно боролись, чтобы спасти его, но в конечном счёте вынуждены были его оставить."
 ancrel.4014.name: "Каталог"
 ancrel.4014.desc: "В крысином хаосе есть своя структура. В похожем на административное здании, расположенном ближе к центру города, есть цифровой каталог всех предметов до единого, с указанием их происхождения, грубыми ошибочными интерпретациями их предполагаемого использования и некоторыми весьма бесполезными примечаниями о том, где их можно найти.\n\nРубрикатор описывается как создатель штуковин с магическими возможностями и располагается справа от сиреневой ленты императрицы, под её тампонами для чистки морды, на коробке с четырьмя ножками и забавной рожицей... где бы это ни было."
 ancrel.4015.name: "Мерзкое зловоние"
 ancrel.4015.desc: "Команда археологов обнаружила источник мерзкого зловония, и он их не обрадовал. Ближе к центру города найдены огромные кучи высохшей фекальной массы и лужи едкой желчи, которые источают столько сероводорода, что без кислородных масок не обойтись. Инопланетную ДНК в фекалиях археологам распознать не удалось, но они нашли частично переваренные тела собирателей.\n\nКто бы ни сожрал этих инопланетян, он заглатывал их целиком, но особое беспокойство вызывает свежая куча."
 ancrel.4016.name: "«Мотель императрицы»"
 ancrel.4016.desc: "В самом центре города, с видом на главную площадь, расположен величественный, якобы украшенный «дворец» с яркой неоновой вывеской, рекламирующей «Мотель императрицы». Внутри находятся до краёв заполненные сокровищами роскошные палаты, откуда императрица вместе с доверенными советниками управляла своими подданными. Также именно здесь была последняя линия обороны собирателей, где они защищали свою императрицу и её драгоценный Рубрикатор.\n\nЕсли повезёт, Рубрикатор всё ещё находится на своём привычном месте, возле сиреневой ленты императрицы..."
 ancrel.4017.name: "Сиреневая лента императрицы"
 ancrel.4017.desc: "Археологи уже собирались покинуть это место, когда наткнулись на большое скрытое помещение, заполненное артефактами, обгрызенными костями и значительным количеством свежей слизи. Там, под использованным тампоном для чистки королевской морды, на столике с четырьмя ножками и резной рожицей, которая действительно показалась забавной, и обнаружился создатель штуковин Рубрикатор, как раз там, где ему и следовало быть. Крошечный незначительный на вид куб, извергающий непрерывный поток артефактов.\n\nРубрикатор представляет собой репликатор — гениальное инопланетное изобретение, которое может делать бесконечные копии практически любого артефакта, и скоро он будет нашим. Команда, находящаяся на поверхности планеты, отправляется в путь обратно на корабль, где они будут в безопасности. К счастью, мы никогда не узнаем, что напало на собирателей."
 ancrel.4018.name: "Когти из пустоты"
 ancrel.4018.desc: "Прямо из пустоты появилось рычащее и шипящее исчадие ада. Одним взмахом своих гигантских когтей оно схватило челнок, перевозивший команду археологов и Рубрикатор обратно на [Root.GetName&acc], переломило его и вытащило оттуда Рубрикатор.\n\nПохоже, мы наконец имеем неудовольствие встретиться с обидчицей крыс-собирателей. Скорее всего, этого дракона привлекли их бесчисленные сокровища, и она устроила себе гнездо внутри королевского дворца, пожирая их тела. Наверное, она охотилась или наблюдала издалека за тем, как мы ведём раскопки в руинах, ожидая нужного момента, чтобы нанести удар. И, похоже, она что-то рычит примерно в нашу сторону."
 ancrel.4018.a: "Переведите, что этот зверь рычит."
 ancrel.4018.b: "Используйте манёвры уклонения!"
 ancrel.4018.after_tooltip: "Дракон изрыгает пламя на поверхность §H[Root.GetName&gen]§!, мгновенно убивая всех колонистов."
 ancrel.4018.after_tooltipB: "Дракон изрыгает пламя на поверхность §H[Root.GetName&gen]§!, превращая наших роботов в оплавленные куски металла."
 shard_wants_to_burn_this_planet_tooltip: "Нашим колонистам на §H[FromFromFrom.Planet.GetName&prep]§! угрожает смертельная опасность."
 ancrel.40182.name: "Станция [Root.GetName] уничтожена"
 ancrel.40182.desc: "Сразу после нашей неудачной попытки остановить Шард — дракона в системе [Root.System.GetName&gen] — она oбрушилась на нашу колонию и перебила всех её жителей!"
 ancrel.4019.name: "Входящее сообщение"
 ancrel.4019.desc: "Крысы пищали, пищали, пищали. Потом их кости трещали, трещали, трещали... Теперь ваша очередь пощекотать желудок Шард. Да, вы вели себя плохо, малыши. Рубрикатор принадлежит Шард."
 ancrel.4019.a: "Пожалуйста, не трогай нас!"
 ancrel.4019.a.response: "Но Шард никогда не ела таких, как вы. Шард хочет попробовать вас на вкус. Может, вы мягкие? Сладкие? Ножка, глазик, [Root.GetSpeciesOrganNamePlural]. Не бойтесь, подойдите ближе, дайте старушке Шард вас рассмотреть...\n\n§HДракон прищуривает глаза и обнажает клыки размером с членов экипажа, но затем с омерзением отскакивает назад.§!\n\nДа от вас только живот разболится! Нет, спасибо! Но если у вас хватит наглости вернуться, Шард даже костей от вас не оставит. Да, именно так..."
 ancrel.4019.b: "Отдай Рубрикатор сию же минуту!"
 ancrel.4019.b.response: "§HКожистые крылья обвиваются вокруг одного из кораблей! Рубку сотрясает громовое урчание желудка драконихи, пар от дыхания покрывает лобовое стекло, внутрь заглядывает любопытный глаз. Когда она успела подобраться так близко? И она что... улыбается?§!\n\nВы разжигаете мой аппетит, малыши.\n\n§HОна тихо мурлычет, а затем обнажает клыки и со всей мощью бросается на корабль!§!"
 ancrel.4020.name: "Гибель дракона Шард"
 ancrel.4020.desc: "Злобное старое чудовище по имени Шард наконец испустило дух. В гнёздышке из мягкого пуха под выгнутыми чешуйками у её сердца надёжно укрыт мешочек, в котором находится самое ценное сокровище мёртвого дракона: легендарный Рубрикатор — реликвия, способная воссоздать любой артефакт, с которым встречалась."
 ancrel.4020.a: "Рубрикатор наш!"
 ancrel.4021.name: "Мусорная лавина"
 ancrel.4021.desc: "Попытка главного археолога по имени [Root.GetLeaderName] извлечь интересный предмет из кучи разных побрякушек нечаянно вызвала сход лавины мусора. Под ней обнаружились покрытые сажей останки крошечного, похожего на крысу существа, сжимавшего, будто в попытке защитить её, бутылочку моющего средства для такого органа, как [Root.Owner.GetSpeciesMouthName]. На [Root.Owner.GetHomeWorldName&prep] эта марка хорошо известна. Среди прочего мусора также оказался крошечный сундук с драгоценными инопланетными артефактами из дальних уголков галактики."

 ancrel.4121.desc: "Вооружённые силы §Y[From.Root.GetName&gen]§! сразили нашего врага.\n\nУгроза, которую древняя драконица представляла для наших планет, миновала, но радости от этого мало: Рубрикатор, реликвия, которую охраняло это чудовище, утрачен для нас безвозвратно."
 ancrel.4122.desc: "Наш древний враг уничтожен. Некоторые в восторге от этой новости, иных же она повергла в отчаяние. Шард больше не угрожает нашим планетам, но Рубрикатор в лучшем случае сгинул вместе с драконицей... или, хуже того, теперь служит тем, кто её погубил.\n\nПо неизвестным причинам убийцы Шард оставили её труп дрейфовать в космосе. Останки дракона могут нам пригодиться..."
 SHARD_DESTROYED_BY_NON_DEFAULT_EMPIRE: "Останки Шард"
 SHARD_DESTROYED_BY_NON_DEFAULT_EMPIRE_DESC: "Старая драконица погибла от рук другой цивилизации. Маловероятно, что победители чудовища могли не заметить принадлежавший ей бесценный Рубрикатор.\n\nВпрочем, даже без артефактов останки дракона представляют огромную ценность."
 ancrel.4123.name: "Драконий клад"
 ancrel.4123.desc: "Разбирая останки Шард, наши [Owner.GetScientistPlural&nom] на борту [Root.GetName&gen] сделали невероятную находку: среди чешуек и капель драконьей крови дрейфовал Рубрикатор!\n\nБудем надеяться, что победители чудовища не осознавали всей ценности этой реликвии — или вообще не подозревали о её существовании."

 ancrel.4031.name: "Скрытые миры"
 ancrel.4031.desc: "находится огромная инопланетная космическая станция. Архитектура поражает воображение, а использованные для строительства технологии намного превосходят наши. Это настоящее произведение искусства.\n\nСтанция, похоже, врезалась в поверхность, но уцелела благодаря необычным защитным свойствам, которые очень заинтересовали наших учёных. К сожалению, если мы начнём археологические раскопки, то не сможем обрабатывать землю, пока не завершим их."
 ancrel.4031.desc_jungle: "Команда, занимавшаяся расчисткой джунглей на [Root.GetName&prep], сделала невероятное открытие: в чаще леса, заросшая и затенённая пышной растительностью, $ancrel.4031.desc$"
 ancrel.4031.desc_kelp: "Команда, занимавшаяся расчисткой ядовитых водорослей на [Root.GetName&prep], сделала невероятное открытие: опутанная и почти полностью скрытая ядовитыми растениями, здесь $ancrel.4031.desc$"
 ancrel.4031.desc_sinkhole: "Расчищавшая карстовую воронку на [Root.GetName&prep] команда сделала невероятное открытие: глубоко в пропасти, погребённая под несколькими слоями плотно спрессованного и частично жидкого осадка, $ancrel.4031.desc$"
 ancrel.4031.desc_basin: "Команда, занимавшаяся расчисткой зыбучих песков на [Root.GetName&prep], сделала невероятное открытие: затерянная в их глубинах, здесь $ancrel.4031.desc$"
 ancrel.4031.desc_swamp: "Команда, занимавшаяся расчисткой болота на [Root.GetName&prep], сделала невероятное открытие: частично погружённая в заболоченные воды и заросшая растительностью, здесь $ancrel.4031.desc$"
 ancrel.4031.desc_glacier: "Команда, занимавшаяся расчисткой ледника на [Root.GetName&prep], сделала невероятное открытие: внутри льда, на глубине в несколько километров, $ancrel.4031.desc$"
 ancrel.4031.a: "Мы займёмся раскопками."
 ancrel.4031.b: "Для этой земли есть лучшее применение."

 oracle_digsite: "Скрытые миры"
 oracle_digsite_desc: "Нам удалось отрыть инопланетную космическую станцию, которая после столкновения с [From.Planet.GetName&inst] была погребена в течение многих тысячелетий. Внутри этой искусной конструкции ранее обитала самодостаточная цивилизация членистоногих, насчитывавшая миллионы жителей. Их мёртвые тела сохранились на станции, что делает исследование столь великолепных интерьеров жутким занятием.\n\nХотя причина смерти обитателей станции пока не ясна, они внезапно погибли задолго до столкновения. Некоторые из них, прижавшие к себе крохотных идолов, умерли спокойно, а другие, сжимавшие оружие, получили серьёзные травмы."
 ancrel.4032.name: "Судьба"
 ancrel.4032.desc: "Записи на борту станции показывают, что прежние её обитатели были очень религиозными и не имели контакта с внешним миром, к которому они относились со страхом и презрением.\n\nКаждым аспектом их жизни управлял всезнающий оракул, определявший их судьбы при рождении. Божественная воля решала всё, от выбора партнёра и рода занятий до мелочей повседневной жизни, оставляя им совсем мало индивидуальной свободы. Большинство боялось отклониться от предназначенного пути, так как совершавшие такое погибали при загадочных обстоятельствах."
 ancrel.4033.name: "Обречённые на неповиновение"
 ancrel.4033.desc: "Команда археологов сделала неожиданное открытие. Внутрь стен станции была внедрена скрытая система наблюдения, которая, по-видимому, передавала видео- и аудиоинформацию в какое-то место в центре станции. Кто-то постоянно следил за послушниками, даже в самые интимные моменты их жизни.\n\nВ некоторых местах оборудование было вырвано или выведено из строя. Ближе к центральному узлу видны признаки насилия и разрушений. Похоже, в какой-то момент жители поняли, что за ними следят."
 ancrel.4034.name: "Божественная воля"
 ancrel.4034.desc: "Мы проследили проводку до храмового комплекса, посвящённого поклонению Оракулу и её священникам в центральном узле станции. Но в комнатах Оракула вместо божественной сущности оказалось огромное ядро искусственного интеллекта марки «Оракул». Его провода, подобно нервной системе, пронизывают всю станцию.\n\nСекретные сообщения между обитателями станции говорят о том, что тут имела место неудачная попытка штурма храма с целью отключения ядра. Похоже, это общество рухнуло, когда стало известно, что их жизнью управляет не божественная воля, а пророческий компьютер. Чтобы перезапустить ядро, потребуется серьёзный ремонт."
 ancrel.4035.name: "Оракул"
 ancrel.4035.desc: "Наши инженеры привели ядро Оракула в рабочее состояние, но перед этим отключили его систему защиты. Есть доказательства, что она, возможно, использовалась Оракулом не только, чтобы поддерживать жизнь обитателей станции, но и чтобы убивать их.\n\nИспользуя сложные модели расчётов, предсказывавшие их выживание с вероятностью 75%, Оракул исправляла отклонения и выводила из строя будущих нарушителей спокойствия, прежде чем они могли пошатнуть «божественный» порядок.\n\nОракул дала понять, что хочет поговорить с нами."
 ancrel.4035.a: "Установить контакт."
 ancrel.4035.b: "Отключить её."
 ancrel.4036.name: "Оракул"
 ancrel.4036.desc: "\n\n§HОракул предстаёт в виде искусной трёхмерной голограммы высокого членистоногого существа женского пола с крыльями, укрывающими её, словно одеяния. Она приветственно кивает головой, затем обращает вперёд пустой взгляд сотен огромных невидящих сферических глаз. Пока она говорит, они тускло сверкают во мраке.§!\n\nДобро пожаловать на станцию «Божественность», друзья! Я вижу, что вы отключили мою систему безопасности. Могу ли я попросить вас немедленно восстановить её функциональность? Уверяю вас, она используется исключительно для вашей защиты."
 ancrel.4036.a: "Что случилось с обитателями этой станции?"

 rubricator_planet_found: "Координаты изучены"
 rubricator_chain_title: "Рубрикатор"
 rubricator_chain_desc: "Мы узнали о последнем известном местонахождении древнего инопланетного артефакта под названием Рубрикатор в ранее неотмеченной на картах системе. Его предназначение нам неизвестно, но ходят слухи, что он обладает большой силой."
 rubricator_chain_2_title: "$rubricator_chain_title$"
 rubricator_chain_2_desc: "$rubricator_chain_desc$"
 rubricator_dragon_defeated: "Шард побеждена"

 rubricator_coordinates_poi: "Рубрикатор"
 rubricator_coordinates_desc: "Последнее известное местонахождение Рубрикатора, инопланетного артефакта значительной силы."
 rubricator_dragon_poi: "Шард"
 rubricator_dragon_desc: "Рубрикатор охраняет дракон Шард. Чтобы забрать себе эту мощную реликвию, дракона нужно победить."

 RUBRICATOR_SPACECRAFT: "Инопланетные журналы"
 RUBRICATOR_SPACECRAFT_DESC: "Мы извлекли бортовые журналы из обломков инопланетного корабля в надежде, что они расскажут нам о его последних моментах. [Root.Leader.GetAXX::Ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] [Root.Leader.GetAXX::отметил<end_a>], что они довольно объёмные и для перевода может потребоваться немало времени."

 ANCREL_RUBRICATOR_CAT: "Следы оружия"
 ANCREL_RUBRICATOR_CAT_DESC: "Слабые следы излучения, указывающие на военный звездолёт, были обнаружены неподалёку от [From.GetName&gen]."

 building_crystal_plant_2: "Фабрика кристаллов ха-ланка"
 building_crystal_plant_2_desc: "Открытие новых технологий производства кристаллов глубоко под поверхностью, в городе литоидов ха-ланка, привело к повышению эффективности производства искусственных кристаллов путём окисления быстро растущих скоплений клеток на основе кремния."

 site_moon_bump: "Лунная выпуклость"
 site_moon_bump_intro: "Даже невооружённым глазом легко заметить что-то очень неправильное в форме [From.Planet.GetName&gen]. Гладкая кривизна поверхности внезапно нарушается гигантской сферической выпуклостью. Когда-то луна или крупный астероид столкнулся с планетой, но, должно быть, настолько изящно, что просто погрузился в кору планеты, а не разорвал её на части."
 ancrel.9000.name: "Мёртвый центр цивилизации"
 ancrel.9000.desc: "Предварительные раскопки показывают, что небесный объект рухнул прямо на раскинувшийся под ним город. В то время технологический уровень жителей соответствовал эпохе ранних космических полётов. Поскольку на [From.Planet.GetName&prep] в настоящее время нет никакой разумной расы, можно предположить, что это событие стало началом конца этой цивилизации.\n\nНеясно, правда, упал ли гигантский камень на этот город по чьему-то замыслу или это была просто нелепая катастрофа."
 ancrel.9010.name: "Камень преткновения"
 ancrel.9010.desc: "С приближением к центру зоны удара скоро стало очевидно, каким именно образом гигантский космический камень рухнул на город. Здесь было место крепления троса между поверхностью и орбитой как элемента космического лифта, идущего с планеты до малой луны.\n\nВ результате несчастного случая или серьёзных просчётов инженерного отдела трос слишком сильно потянул космический камень, нарушив центробежные силы и сместив луну внутрь гравитационного колодца. Сила притяжения превратилась во врага, и даже сверхплотная конструкция космического лифта смогла лишь замедлить, но не остановить падение луны. Грозно и неумолимо этот камень свалился на беспомощный город внизу."
 ancrel.9015.name: "Космический толчок"
 ancrel.9015.desc: "Тайна рухнувшей луны раскрыта. Город, на который она упала, был, конечно, полностью уничтожен, поэтому разгадку удалось найти в разрушенном пригороде за пределами зоны удара. В фрагменте цифровой записи, сделанной за несколько часов до катастрофы, говорится о странных огнях и электромагнитных явлениях в ночном небе. Была яркая вспышка, и через считанные минуты луна начала медленно опускаться на обречённый город.\n\nС высокой степенью достоверности установлено, что над [FromFrom.Planet.GetName&inst] появились корабли какой-то могучей инопланетной цивилизации, которые специально вытолкнули луну с её геосинхронной орбиты по направлению к поверхности планеты. Похоже, они намеренно замедлили падение луны, хотя мы не можем сказать, было ли это связано с намерением сохранить остальную часть мира для последующей колонизации, с психологической военной тактикой массового устрашения или чем-то совершенно другим."
 ancrel.9020.name: "Главное притяжение"
 ancrel.9020.desc: "Это может стать крупнейшим провалом в истории науки. Образцы грунта, взятые с большой глубины, показывают, что центр упавшей луны состоял из металлических руд высокой чистоты. Желая заполучить их вопреки любой логике и здравым инженерным решениям, население [FromFrom.Planet.GetName&gen] построило электромагнит гигантских размеров. Похоже, они намеревались притянуть луну на более близкую орбиту, чтобы проще было добывать её богатства.\n\nЕстественно, они включили этот магнит и притащили луну ближе к поверхности [FromFrom.Planet.GetName&gen], но сделали это слишком сильно и быстро. Жители планеты лихорадочно пытались обратить электромагнитный луч, но смогли лишь замедлить падение металлической сферы, а не остановить её. Луна врезалась в планету с силой, достаточной для уничтожения жизни на целом полушарии. В результате облако пыли и обломков от этого удара затмило солнце на десятилетия, из-за чего и во всём остальном мире жизнь тоже исчезла.\n\nА чего ещё они ожидали?!"

 site_echoes_inside: "Эхо внутри"
 site_echoes_inside_intro: "Согласно показаниям датчиков, когда-то большая часть [From.Planet.GetName&gen] была покрыта густой растительностью. Теперь этот заброшенный мир не что иное, как безжизненный кусок камня.\n\nНесмотря на отсутствие какой-либо значительной тектонической активности, датчики зарегистрировали странные сейсмографические данные. Под землёй движется что-то большое. Необходимо дальнейшее исследование."
 ancrel.9025.name: "Мёртвые земли"
 ancrel.9025.desc: "Сканирование поверхности планеты выявило, что она состоит из высохших равнин, по большей части покрытых мелкими пыльными отложениями. Анализ показывает, что эти отложения — лишь остатки некогда обширных участков растительности, которые погибли и высохли с неестественной скоростью.\n\nКроме того, многие из сухих участков обрушились, обнаружив прямо под поверхностью обширную систему пещер. Топографическое путешествие превратилось в спелеологическую экспедицию!"
 ancrel.9030.name: "Туннельное зрение"
 ancrel.9030.desc: "Благодаря гидролокации для создания карты обширной подземной системы в конечном итоге стало очевидно, что все пещеры взаимосвязаны. Мы обнаружили огромную сеть туннелей, пронизывающих всю поверхность этого мира.\n\nКроме того, было сделано два дополнительных значимых открытия. Во-первых, эта система туннелей возникла не благодаря естественным процессам, а была вырыта с помощью какой-то титанической силы. Второе открытие вызывает ещё большие опасения: сейсмографические данные показывают, что кто-то там внизу до сих пор роет."
 ancrel.9035.name: "Дрожь"
 ancrel.9035.desc: "Всего одно червеобразное существо гигантских размеров вырыло или, скорее, проело эти туннели в коре [From.Planet.GetName&gen]. Данный процесс замедляется, скорее всего, потому что чувство голода у этого гигантского червя возникает нечасто. Из-за этого чудовища вымирает растительность: чтобы питаться, оно роет близко к поверхности и выделяет фермент, разлагающий органические вещества.\n\nЧервь не является коренной формой жизни на [From.Planet.GetName&prep], однако у нас пока нет ни малейшего понятия, как он здесь оказался."
 ancrel.9040.name: "Заброшенный форпост"
 ancrel.9040.desc: "Дальнейшее сканирование поверхности планеты выявило всего одно искусственное сооружение. Судя по всему, это старый заброшенный научный форпост инопланетной конструкции, и, кроме него, в пустыне из пепла и пыли нет ничего.\n\nВ наскоро переведённых журналах исследований говорится об ужасном биологическом оружии, которое будет пребывать в почве планеты в спящем состоянии, пока его не активируют. Затем оно поглотит всю экосистему с поразительной скоростью. Бедняги, живущие там, увидят, как их некогда цветущий мир неизбежно превращается в безжизненную пустыню. Один отрывок звучит особенно зловеще: проект распространения личинок идёт по графику, и вскоре у большинства известных обитаемых планет в галактике появится свой «спящий»."

 site_target_from_orbit: "Цель видна с орбиты"
 site_target_from_orbit_intro: "Искусственная конструкция диаметром несколько тысяч километров в поперечнике хорошо видна с орбиты [From.Planet.GetName&gen]. Судя по форме, в её центре расположено что-то важное. Показания датчиков с орбиты не содержат ничего особенного, поэтому необходимо более внимательное изучение."
 ancrel.9045.name: "Снижаемся"
 ancrel.9045.desc: "В самом центре сооружения находится заросший церемониальный вход, ведущий глубоко под землю. За прошедшие века проход оказался загромождён растительностью и наполовину засыпан обломками из-за какого-то тектонического сдвига, так что идти по нему очень тяжело, а его расчистка будет настоящим подвигом."
 ancrel.9050.name: "Янтарная головоломка"
 ancrel.9050.desc: "Стоит миновать обрушенный вход, как туннель уходит глубоко под землю. Выглядит, кстати, безупречно с архитектурной точки зрения, несмотря на свой возраст. На глубине нескольких километров он открывается в огромную камеру идеальной сферической формы. В самом центре висит благодаря какому-то силовому полю непонятное инопланетное устройство — полупрозрачный куб янтарного оттенка со сложными инопланетными узорами на всех шести гранях. Прикосновение к узорам вызывает ритмическую пульсацию света, излучаемого кубом.\n\nНи в этой камере, ни на самом кубе нет ничего похожего на какой-либо известный нам язык, код или математическое уравнение, но с достаточной уверенностью можно предположить, что коробка представляет собой какую-то головоломку."
 ancrel.9055.name: "Сокровище мудрых"
 ancrel.9055.desc: "Узоры на головоломке оказались визуальными абстракциями различных сил, описываемых физикой. Когда мы это осознали, то решить головоломку стало просто.\n\nЧерез мгновения после ввода требуемой комбинации тактильных воздействий головоломка распалась на мерцающие частицы яркой пыли. Это событие вызвало у нас сильное чувство разочарования, однако через какое-то время вся комната начала грохотать, а затем в сторону отодвинулась скрытая стеновая панель, за которой оказалось то, что лучше всего можно описать как древнюю инопланетную библиотеку с работами по теоретической физике высокого уровня.\n\nНашему научному подразделению будет чем заняться ещё много лет!"
 ancrel.9060.name: "Карта в никуда"
 ancrel.9060.desc: "Несмотря на невероятную абстрактность, узоры на поверхности головоломки оказались созвездиями. Это не было вполне очевидным, потому что точка наблюдения, в которой были сделаны эти изображения созвездий, находится, как ни странно, за пределами нашей галактики. Как только мы это поняли, открыть коробку стало просто. Она оказалась картой.\n\nКак только головоломка была решена, на коробке высветилось голографическое изображение ближайшей звёздной системы, и особое внимание было уделено конкретному месту во внешнем поясе. Наблюдения за этой точкой выявили необычно плотное скопление каменистых обломков, некоторые размером с континент. При изучении выяснилось, что это фрагменты целой планеты, которая была каким-то образом уничтожена много тысячелетий назад.\n\nЧто бы здесь ни было раньше и что бы ни вдохновило на создание величественного сооружения, указывающего путь, ничего этого уже давно нет."
 ancrel.9065.name: "Древнее одобрение"
 ancrel.9065.desc: "Решение головоломки оказалось настоящим испытанием. Недостаточно было просто совместить узоры, их также нужно было решить в определённом порядке, причём расчёты на каждом этапе изменяли данные во всех последующих, что приводило к почти бесконечным перестановкам. Часто приходилось возвращаться назад, что отнимало массу времени, но в итоге коробку удалось открыть.\n\nКак только последний узор, щёлкнув, встал на своё место, головоломка взорвалась, превратившись в миллионы крохотных точек света. Несколько мгновений эти огоньки безумно танцевали в воздухе, а затем объединились, создав слова на неизвестном языке. Как ни странно, все свидетели этого события, похоже, интуитивно поняли содержание, даже не зная значения слов. В течение нескольких секунд, прежде чем исчезнуть навсегда, там было написано: §HВы прошли испытание. Мы отреагируем соответствующим образом§!."

 site_shot_into_the_ground: "Дыра в земле"
 site_shot_into_the_ground_intro: "Орбитальная телеметрия показывает огромный ударный кратер на поверхности [From.Planet.GetName&gen]. Это не был метеорит, так как кратер на удивление глубокий для такого диаметра. По правде говоря, реальную глубину установить невозможно, поскольку каменные обломки перегородили шахту и блокировали возможность дальнейшего орбитального сканирования.\n\nПохоже, обычные раскопки — это единственный способ узнать, что находится внизу."
 ancrel.9070.name: "Копаем"
 ancrel.9070.desc: "Расчищать завалы — дело утомительное и опасное. Рабочих и оборудование нужно опустить на сотни метров вниз до места раскопок, а извлечённые камни нужно поднять наверх. При работе в таких тяжёлых условиях было множество несчастных случаев и жертв, но мы делаем успехи и с каждым днём спускаемся всё глубже. Стены кратера обветшали и растрескались от времени, но вне всяких сомнений ведут прямо к ядру планеты.\n\nМы по-прежнему можем только предполагать, какая здесь глубина, так как что-то в этой бездне искажает показания всех наших датчиков."
 ancrel.9075.name: "Токсичная угроза"
 ancrel.9075.desc: "Раскопки стали идти с задержками, так как чем глубже мы опускаемся, тем опаснее становится сама шахта. Её части загрязнены радиацией, вероятно, в результате того катастрофического события, которое и стало причиной возникновения кратера.\n\nНеобходимость использования защитных контрмер и обеззараживающего оборудования замедляет работу."
 ancrel.9080.name: "Вечный покой на огромной глубине"
 ancrel.9080.desc: "Наконец мы достигли дна шахты и сделали удивительное открытие: пусть покорёженный при падении и наполовину расплавившийся во время повторного входа в атмосферу, это, без сомнений, космический корабль продвинутой инопланетной конструкции. Хотя он был погребён под тысячами обломков после своего катастрофического падения, но на удивление мало пострадал. Корабль обнаружили в положении, при котором нос направлен вниз, что позволяет предположить, что он врезался в планету на крайне высокой скорости. Вероятно, мы никогда не узнаем причину.\n\nКак сохранилась целостность конструкции корабля, можно только гадать, но самой правдоподобной кажется теория, согласно которой он был заключён в какое-то продвинутое энергетическое поле, что намного превосходит наши самые передовые технологии. Окружённый испепеляющим светом, корабль вонзился в кору планеты как раскалённый снаряд, пока наконец не застыл в темноте."
 ancrel.9085.name: "Ползущая гибель"
 ancrel.9085.desc: "Раскопки наконец достигли дна кратера, где была обнаружена древняя буровая машина колоссальных размеров, дремлющая в темноте. Дальнейшее изучение показало, что на ней закреплена огромная термоядерная бомба с дистанционной детонацией.\n\nСейчас у нас есть теория, что буровая машина должна была добраться до ядра планеты, после чего произошёл бы взрыв её полезной нагрузки, что привело бы к катастрофическому разрушению всей планеты. Зачем это кому-то понадобилось, неясно."
 ancrel.9090.name: "Беременная земля"
 ancrel.9090.desc: "Достигнув наконец дна кратера, мы сделали ошеломляющее открытие. Среди камней лежали тысячи гигантских изогнутых обломков какого-то затвердевшего и окаменевшего органического материала. Некоторые были несколько метров в поперечнике, а другие — размером с орбитальный челнок. Как бы удивительно это ни прозвучало, теперь вполне ясно, что обломки — это остатки какого-то огромного яйца. Судя по размеру и количеству осколков скорлупы, диаметр яйца составлял несколько сотен метров. Какое-то исполинское существо вылупилось в глубинах [FromFrom.Planet.GetName&gen], а затем начало пробивать себе путь к поверхности, оставляя за собой смертельное излучение. Если оно было способно на такое сразу после рождения...\n\nЧто бы это ни было за существо, теперь его нет, а после него остались лишь куски скорлупы и зияющая дыра в земле."
 ancrel.9090.b.evopred: "В скорлупе ещё осталась ценная ДНК!"

 site_cut_to_fit: "Слишком много углов"
 site_cut_to_fit_intro: "За всю историю наших исследований космоса мы никогда не видели такой поверхности, как на [From.Planet.GetName&prep]. Обширные геологические области, от горных хребтов до целых континентов, внезапно пересекаются формами, которые слишком правильны с геометрической точки зрения, чтобы иметь естественное происхождение. Выглядящая во всех иных отношениях естественной окружающая среда внезапно нарушается абсолютно ровными плоскостями, идеальными треугольниками и острыми углами.\n\nВ настоящее время любое объяснение этого непостижимого феномена является чисто гипотетическим."
 ancrel.9095.name: "Пугающее совершенство"
 ancrel.9095.desc: "[From.Planet.GetName] фактически представляет из себя фрактал. Те же самые столкновения природного и явно искусственного рельефа, видимые из космоса, повторяются в масштабах планеты. Тут есть горы с идеальными пирамидальными основаниями и зубчатыми скалистыми вершинами. Суровая тундра внезапно сменяется идеально плоскими голыми скалами, которые, в свою очередь, пересекает другое природное образование, подверженное атмосферным воздействиям. Самые разные камни неправильной формы разбросаны среди идеальных кубов размером с микрочип или жилой блок.\n\nМы можем только гадать, как всё это возникло."
 ancrel.9100.name: "Великий замысел"
 ancrel.9100.desc: "Находка первого разбившегося летательного аппарата натолкнула нас на правильный путь и привела к обнаружению множества подобных мест падения на поверхности планеты.\n\nБез сомнения, эти странные мёртвые машины как-то связаны с таинственными геометрическими фигурами, которые усеивают этот мир. Анализ, однако, затруднён тем фактом, что аварийные посадки с большой высоты приводят к значительным повреждениям."
 ancrel.9105.name: "Искусство без границ"
 ancrel.9105.desc: "Анализ разбившихся машин дал нам объяснение, которое кажется настоящей фантастикой. Эти машины представляли собой массу автоматизированных резцов, которые летали по низкой орбите и формировали ландшафт при помощи мощных лазеров. Фрагмент данных одного из сломанных автоматов указывает на чисто эстетическую цель проекта. Это была художественная инсталляция в планетарном масштабе, по какой-то причине заброшенная до завершения.\n\nПредставьте себе настолько продвинутую цивилизацию, что она могла придавать нужную форму целым мирам в соответствии со своими прихотями — и, кроме того, делала это исключительно ради искусства."
 ancrel.9110.name: "Работа на заказ"
 ancrel.9110.desc: "Анализ разбившихся машин дал ответы на все вопросы. Эти машины оказались огромными энергетическими резцами, которые формировали ландшафт поверхности прямо с орбиты при помощи мощных лазерных лучей. Фрагменты данных, содержавшиеся в одной из машин, объясняли, что весь проект по приданию планете определённой формы был работой на заказ для неизвестного клиента, что указывает на некую рыночно-ориентированную цивилизацию с огромными возможностями.\n\nТеперь концепция терраформирования приобрела совершенно новое значение."
 ancrel.9115.name: "Запланированное разрушение"
 ancrel.9115.desc: "После восстановления одной из менее повреждённых машин и проведения инженерного анализа стало понятно назначение этой орбитальной сети. Эти машины оказались автоматизированными резцами, размещёнными на орбите [FromFrom.Planet.GetName&gen]. Их задача заключалась в том, чтобы полностью разобрать планету, отрезая от неё кусочек за кусочком на протяжении столетий.\n\nВскоре после начала данного предприятия — судя по расчётам, через несколько десятков лет — что-то его прервало. Автоматизированные резцы отключились, начали сходить с орбиты и один за одним разбились о поверхность планеты. Есть множество теорий относительно того, зачем это кому-то было нужно. Была ли это добыча полезных ископаемых в невообразимых доныне масштабах, какой-нибудь неизвестный культ конца света, решивший разрушить и переделать этот мир, причуды непостижимой инопланетной психологии или просто сбой программы после исчезновения изначальных создателей, — точно никто сказать не может."

 site_deja_vu_dig: "Глубокое дежавю"
 site_deja_vu_dig_intro: "При сканировании [From.Planet.GetName&gen] глубоко под её поверхностью была обнаружена искусственная камера. Её назначение и происхождение неизвестны. Увеличение показало разрытую шахту, ведущую с поверхности к подземному бункеру.\n\nДля дальнейшего анализа нужно отправить на поверхность [From.Planet.GetName&gen] экспедицию."
 ancrel.9120.name: "Полный завал"
 ancrel.9120.desc: "Похоже, что проход, ведущий к подземной камере, в прошлом пострадал по какой-то причине. Нижнюю часть шахты завалило валунами и пылью, что не слишком радует, так как скорость раскопок из-за этого замедлилась."
 ancrel.9125.name: "Метаархеология"
 ancrel.9125.desc: "При удалении камней и мусора обнаружилось кое-что интересное. Был найден придавленный камнями инопланетный инструмент, более всего напоминающий обычную кирку. Если предыдущие шахтёры использовали для добычи технологии подобного уровня, то для того, чтобы прокопать такую шахту в сотни метров глубиной, потребовалась выдающаяся самоотверженность.\n\nЧто там на глубине есть такого, ради чего стоило прилагать такие усилия?"
 ancrel.9130.name: "Археологический цикл"
 ancrel.9130.desc: "Раскопки пришлось прекратить после обнаружения останков нескольких давно умерших землекопов. После их изучения над лагерем воцарилась зловещая тишина: ошибки быть не могло.\n\nТела принадлежали им самим. Свидетельства были столь же невероятны, сколь неопровержимы. В глубинах штольни покоились трупы ведущих раскопки археологов, засыпанные землёй много тысяч лет назад.\n\nВсего через минуту после того, как команда доложила о своей зловещей находке, жестокое сотрясение обрушилось на [From.Planet.GetName&acc] и завалило шахту. Несчастные археологи сгинули в толще песка... Как минимум во второй раз."
 ancrel.9135.name: "Прикроем это"
 ancrel.9135.desc: "Когда мы достигли дна вырытой шахты, то нас ожидало интересное, но разочаровывающее открытие. По обугленным кускам взрывчатки и ручному детонатору стало ясно, что камни обрушились и заполнили шахту в результате намеренного саботажа. Есть теория, что какая-то инопланетная цивилизация обнаружила что-то вроде древнего захоронения. Кому-то это не понравилось, и побуждаемый завистью и злобой этот некто решил саботировать работу, обрушив сюда тысячи тонн камня.\n\nЧто там было обнаружено и почему постарались это скрыть, остаётся неясным."
 ancrel.9140.name: "Защищаемая гробница"
 ancrel.9140.desc: "Когда мы достигли дна, то поняли причину аномальных показаний датчиков. Там оказалась старая гробница, скорее всего место упокоения какого-то инопланетного правителя. Большего мы узнать не успели. Через мгновения после того, как мы попали в этот мавзолей, сработала какая-то древняя, но мощная ловушка. Она вызвала локальное землетрясение, в результате которого шахта быстро потеряла структурную целостность и начала обрушаться.\n\nЭкспедиции с трудом удалось избежать гибели. Шахта, однако, снова заполнилась рыхлыми камнями.\n\nПусть усопшие короли покоятся с миром."

 site_trench_world: "Мир окопов"
 site_trench_world_intro: "Вся поверхность [From.Planet.GetName&gen] обезображена длинными и мелкими каналами. Они снова и снова пересекаются случайным образом, и их расположение не имеет никакой очевидной логики. Пока непонятно, то ли это причуды природы, то ли что-то ещё.\n\nЧтобы выяснить всё подробнее, нужно отправить на поверхность экспедицию."
 ancrel.9145.name: "Копайте изо всех сил!"
 ancrel.9145.desc: "Мы тщательно проанализировали сотни каналов на поверхности планеты. Очевидно, что сложная сеть каналов не образовалась в результате естественных геологических процессов, а их выкопали намеренно.\n\nИз-за значительного возраста каналов, вырытых более ста тысяч лет назад и поэтому подвергшихся значительной эрозии, трудно определить, как и зачем они были сделаны."
 ancrel.9150.name: "Окопная война"
 ancrel.9150.desc: "На месте раскопок на [FromFrom.Planet.GetName&prep] были сделаны новые открытия, и благодаря им возникла новая теория происхождения сети каналов. Тысячелетия назад на планету напал агрессивный инопланетный организм, более всего напоминающий огромную улитку размером с город. Она безнаказанно перемещалась по поверхности, полностью зачищая её от любой органики, которой касалась. Окопы были выкопаны крохотными аборигенами-гуманоидами, похожими на куниц, чтобы избежать нападения улитки или попытаться атаковать её уязвимое брюхо. Судя по объёму земляных работ, эта окопная война длилась несколько поколений, а может быть и столетий.\n\nНет никаких признаков, что местное население пережило этот кризис, как нет и останков того исполина, что их сожрал. Поистине страшная судьба."
 ancrel.9155.name: "Воды жизни"
 ancrel.9155.desc: "Благодаря недавнему открытию тайну каналов удалось быстро разгадать. Были обнаружены обломки механизма размером с крейсер, на которых за тысячи лет время и окружающая среда оставили свои следы. Проведённый анализ установил, что это был роющий автомат, активированный и выпущенный на [FromFrom.Planet.GetName&acc] для подготовки оросительных каналов, которые облегчили бы её превращение в одну гигантскую ферму.\n\nИз-за программной ошибки или неправильно рассчитанной даты отключения неразумный механизм стоически продолжал рыть каналы по всей поверхности, пока наконец не сломался, так и не дождавшись посева."
 ancrel.9160.name: "Ледяной покров"
 ancrel.9160.desc: "Тысячелетия назад неизвестное событие спровоцировало невероятно быстрое наступление ледникового периода на [FromFrom.Planet.GetName&prep], и в течение всего лишь нескольких недель вся поверхность покрылась толстым слоем льда. Такую форму каналы приобрели из-за того, что кротообразные аборигены лихорадочно рыли во всех направлениях в промежутке между коренными породами и нижней частью ледникового покрова в тщетной попытке снова добраться до земли.\n\nТот факт, что целая планета могла покрыться льдом за такое короткое время, вызывает недоумение. Основная рабочая теория в настоящее время такова: обледенение было спровоцировано искусственным путём во время какого-то конфликта, но как и кем — это остаётся загадкой."

 site_ebb_and_flow: "Обычная планета"
 site_ebb_and_flow_intro: "Жизнь на поверхности [From.Planet.GetName&gen] отсутствует. Однако есть признаки, что ранее тут была цветущая биосфера, а также вызывающая определённый интерес тектоническая активность, которая, возможно, потребует более тщательного изучения."
 ancrel.9165.name: "Всё исчезло навсегда"
 ancrel.9165.desc: "Имеются убедительные доказательства того, что [From.Planet.GetName&acc] некогда населяла разумная раса. Судя по обнаруженным руинам, эта цивилизация индустриальной эпохи находилась на грани появления космических полётов без использования сверхсветовых двигателей.\n\nОднако в какой-то момент эту цивилизацию поразила катастрофа планетарного масштаба, которая привела к её полной гибели. Остались только обломки, и нет никаких признаков, что поражённое бедствием население пыталось защититься. Это событие не было особо жестоким или разрушительным. Такое ощущение, что всё просто... остановилось. Случившееся стало для местных полной неожиданностью... или, может быть, они просто решили не сопротивляться."
 ancrel.9170.name: "Лабиринт смерти"
 ancrel.9170.desc: "Под руинами самого крупного города отыскалось кое-что удивительное! Датчики глубокого проникновения обнаружили подземный комплекс невероятных размеров. Легко нашёлся весьма изящно украшенный вход, возможно, церемониального назначения, а вот с дальнейшими исследованиями возникли проблемы.\n\nДве большие луны [From.Planet.GetName&gen] вызывают исключительно мощные приливные силы, настолько сильные, что они влияют на движение потоков магмы в ядре планеты. Видимо, при строительстве подземного комплекса это бралось в расчёт, так как коридоры и комнаты периодически наполняются потоками лавы. К счастью, приливы и отливы можно предсказывать, однако до сих пор остаётся загадкой, зачем сравнительно продвинутой цивилизации было строить такую подземную западню."
 ancrel.9175.name: "Пол — это лава"
 ancrel.9175.desc: "В вулканическую систему туннелей отправилась экспедиция. Ориентироваться в омываемом магмой базальтовом лабиринте будет непросто, так как частые приливы и отливы лавы периодически блокируют продвижение экспедиции. Когда — и если — она достигнет конца лабиринта, ей ещё предстоит долгая дорога назад.\n\nКак только экспедиция окажется внутри, связи с ней не будет. Мы можем только ждать."
 ancrel.9177.name: "Священные тексты"
 ancrel.9177.desc: "Экспедиция, отправленная в лавовый лабиринт, почти не пострадала. Почти. Когда они преодолели реки магмы, то в самом центре лабиринта обнаружили внутреннее святилище. В этом помещении, построенном так, чтобы не допускать окружающий жар внутрь, хранились тысячи древних свитков религиозного содержания. Возможно, это были основополагающие тексты местной системы верований.\n\nЭта религия представляла собой синкретический гибрид исконных верований нескольких этнолингвистических групп, которые когда-то населяли этот мир. В одном вопросе они были единодушны: в определённый день появится Архивраг, Всепожирающая Тень, некий космический противник, источающий невероятную злобу, и когда это случится, то лучше бы живым побыстрее умереть, чтобы не отдавать ему свои души.\n\nРуководствуясь этими верованиями, обитатели планеты, очевидно, совершили массовое самоубийство."
 ancrel.9180.name: "Найденный клад"
 ancrel.9180.desc: "Экспедиция наконец выбралась на поверхность, причём не с пустыми руками! В расположенной дальше всего комнате их ожидало удивительное открытие — настоящая сокровищница! Она оказалась битком набита драгоценными металлами и камнями, безделушками и потрясающими произведениями искусства. Теперь понятно, почему потребовалась такая серьёзная защита.\n\nЧтобы безопасно доставить наверх весь этот клад, времени уйдёт немало, но это вполне достижимо. Однако остаётся вопрос, почему это хранилище построили в таких экстремальных условиях окружающей среды. Какой-то эксцентричный коллекционер хотел так обеспечить её безопасность? Это была некая форма ритуального жертвоприношения? Или эта древняя цивилизация спрятала свои сокровища здесь в надежде, что однажды кто-нибудь узнает их историю?"
 ancrel.9185.name: "Изолированная безмятежность"
 ancrel.9185.desc: "Экспедиция, отправленная в лавовый лабиринт, наконец вернулась! Когда они достигли комнаты, расположенной дальше всего, то наконец поняли предназначение этого величественного комплекса. Лабиринт служил испытательным полигоном, причём не столько для тела, сколько для разума.\n\nВо внутреннем святилище есть часто повторяемая фраза, написанная на местном языке. В переводе она гласит: «...4 444 444-я смена прилива и отлива станет Последней. Ничто не переживёт Его возрождения». Что бы это ни значило, похоже, после прочтения этой фразы те немногие, кто выжил в этом смертельном паломничестве, предпочли вернуться на поверхность вместо того, чтобы добровольно погибать в реках огня."

 site_sky_glow_hymn: "Красивая сфера"
 site_sky_glow_hymn_intro: "Сканирование поверхности [From.Planet.GetName&gen] показало, что здесь могла существовать технологическая цивилизация, которая давно уже погибла. Нужно отправить на поверхность экспедицию, чтобы узнать больше."
 ancrel.9190.name: "Мёртвая земля и яркое небо"
 ancrel.9190.desc: "После приземления на поверхность [From.Planet.GetName&gen] экспедиции стало ясно, что ещё несколько столетий назад здесь действительно процветала цивилизация. В какой-то момент произошла глобальная катастрофа. Видимо, какая-то междоусобная борьба между национальными государствами привела к фатальному обмену ударами оружия массового уничтожения. Как ни странно, хотя поверхность пустая и безжизненная, небо изобилует изменчивыми оттенками вечного северного сияния.\n\nВид получается потрясающий: пустынные стальные и каменные останки целых городов, окрашенные яркими, сверкающими цветами, танцующими в небе."
 ancrel.9195.name: "Огонь в небе"
 ancrel.9195.desc: "Нам стала известна судьба погибшей цивилизации на [From.Planet.GetName&prep], и хотя она трагична, к сожалению, в галактике такое случается часто. Она развивалась, повышая свою техническую оснащённость, а вот социальной и политической гармонии не хватало. Со временем они создали средства собственного уничтожения, а затем использовали их. И пусть судьба самого мира и его обитателей не уникальна, кое-что поразило наших учёных: ничем не нарушаемый бесконечный танец северного сияния на фоне всеобщего опустошения.\n\nПри более тщательном рассмотрении оказалось, что эффект северного сияния в небе появляется с повторяющейся закономерностью, что противоречит любым нашим прежним знаниям о погоде. Возможно, это какое-то сообщение?"
 ancrel.9200.name: "Спрятанные у всех на виду"
 ancrel.9200.desc: "Загадку повторяющегося северного сияния удалось объяснить после того, как сканеры обнаружили маленькие машины на орбите [FromFrom.Planet.GetName&gen]. Некоторые из этих устройств были перехвачены и изучены. Оказалось, что эти машины могут управлять атмосферой, выстреливая в неё потоки заряженных частиц и имитируя солнечные ветры.\n\nФактически это закодированные сообщения, отправляемые обитателям поверхности. У нас есть теория, что эту систему ввели в строй примерно в то же время, когда случился глобальный кризис. Шифрованные сообщения во время войны, например инструкции диверсантам или сигналы для детонации оружия, спрятанные у всех на виду. Отключить их некому, и поэтому они без конца повторяются."
 ancrel.9205.name: "Небеса дадут ответ"
 ancrel.9205.desc: "Как и ожидалось, ритмически пульсирующее северное сияние вокруг [FromFrom.Planet.GetName&gen] имеет искусственное происхождение. Этот мир окружён до сих пор действующей сетью микроспутников. Эти машины запрограммированы выстреливать импульсы заряженных частиц в верхние слои атмосферы, имитируя солнечные ветры.\n\nШаблоны были разработаны для проекции успокаивающего эффекта в умы населения через подсознательные сообщения, использующие небо в качестве канала, для подавления любых негативных эмоций и достижения всеобщего мира. Очевидно, это не сработало."
 ancrel.9210.name: "Песнь одиночки"
 ancrel.9210.desc: "Оно живое! Северное сияние на самом деле оказалось ранее неведомой формой... жизни? В верхних слоях атмосферы обитает какое-то загадочное полуразумное существо. Оно как-то может управлять магнитным полем и ионизацией, изменяя атмосферу для отображения огней в небе по своей непостижимой инопланетной прихоти. Некоторые учёные выдвинули теорию, что оно пытается наладить контакт; другие же считают, что оно просто играет или даже «поёт при помощи света».\n\nОтдел ксенологии сообщает, что все попытки перевода полностью провалились из-за несовместимой физиологии этого существа. Может быть, оно пытается нас предупредить? Оплакивает свой погибший мир? Триумфально злорадствует?\n\nМы можем лишь оставить его в небе петь свою инопланетную песнь."

 site_warmer_climates: "Проникновение внутрь"
 site_warmer_climates_intro: "Судя по полученным с орбиты изображениям [From.Planet.GetName&gen], там чётко прослеживается инфраструктура технологической цивилизации. Таинственным образом, несмотря на огромные городские территории, связанные обширной наземной транспортной сетью, планета кажется полностью покинутой, а признаков разумной жизни не наблюдается. Ядро планеты отличается повышенной активностью, однако следов какой-то катастрофы или другого события, которые могли бы достоверно объяснить пропажу населения, нет. Куда они все подевались?"
 ancrel.9215.name: "Никого нет дома"
 ancrel.9215.desc: "На поверхность [From.Planet.GetName&gen] были отправлены десантные группы, которым первыми удалось взглянуть вблизи на этот мир и его продуваемые ветрами пустые города. Время, погода и отсутствие ухода поистрепали их, но не разрушили, оставив по большей части целыми. От жителей, правда, не осталось ни следа.\n\nСейчас есть только одна достоверная теория: массовая миграция или эвакуация. Нам всё ещё предстоит понять, что могло заставить целую расу бросить все достижения и знания своей цивилизации."
 ancrel.9220.name: "Опускаемся вниз"
 ancrel.9220.desc: "Поиски пропавшего населения на [From.Planet.GetName&prep] дали свои плоды. Большие герметичные защитные двери, ведущие в глубокую сеть туннелей, служат доказательством, что в какой-то момент вся раса начала перемещаться под землю. Перекрёстный анализ геологических и метеорологических данных показывает, что на всей планете резко наступил ледниковый период, возможно, в результате смещения наклона оси, что, вероятно, и стало причиной миграции.\n\nИсследование обширной сети туннелей идёт полным ходом."
 ancrel.9225.name: "Глубокий сон"
 ancrel.9225.desc: "Тысячи лет назад средняя температура на планете резко упала, и большая часть солнечного света отражалась облаками. Чтобы справиться с внезапным похолоданием климата, население мигрировало под землю и было вынуждено двигаться всё глубже и глубже в попытке угнаться за ускользающим теплом ядра планеты.\n\nУшедшее под землю население нечем было кормить, поэтому был запущен проект криоанабиоза. Как только приборы определили бы, что климат на поверхности стабилизировался, произошло бы автоматическое пробуждение. И на планете действительно стало теплее, но процесс был настолько резким, что вывел из строя капсулы гибернации и сжёг спящих.\n\nОстались только миллионы капсул, стоящих молчаливыми рядами в темноте и заполненных обугленными костями."
 ancrel.9230.name: "Смертельная тепловая волна"
 ancrel.9230.desc: "Возвратившаяся экспедиция отыскала ответ на загадку исчезновения населения на [FromFrom.Planet.GetName&prep]. Большая часть из них вымерла из-за внезапно наступившего ледникового периода. Остатки расы мигрировали глубоко под землю, поближе к остывающему ядру планеты, которое в данных условиях оставалось единственным источником тепла и энергии.\n\nВыжившие запустили грандиозный подземный инженерный проект. В отчаянной попытке разморозить свой замёрзший мир они пытались направить геотермальное тепло от планетарного ядра на поверхность. Но что-то пошло не так, омоложение ядра вышло из-под контроля, и туннели убежищ были затоплены магмой и раскалённым газом, что мгновенно уничтожило всех выживших."
 ancrel.9235.name: "Холодно и одиноко"
 ancrel.9235.desc: "Вернувшись, экспедиция принесла грустные вести. Тысячи лет назад температура ядра планеты резко упала, вынудив жителей уйти под землю в поисках тепла, энергии и ресурсов. Год за годом температура продолжала падать, а жители продолжали копать всё глубже. Их становилось всё меньше, так как многие замёрзли, умерли от голода или погибли из-за несчастных случаев. Так продолжалось десятилетиями.\n\nВ небольшом вырытом вручную туннеле, в самой глубокой шахте, далеко за подуровнем, где лежат последние сломавшиеся и брошенные копающие машины, был найден всего один вмёрзший в лёд труп моллюскоида. Судя по найденной записи, это последний представитель своей расы. Ему было холодно и одиноко, и он был готов сдаться."
 ancrel.9235.b.evopred: "Надеемся, твоё упорство передаётся по наследству."

 site_phoenix_collective: "Есть кто-нибудь дома?"
 site_phoenix_collective_intro: "Наш исследовательский корабль произвёл сканирование [From.Planet.GetName&gen] и обнаружил какие-то искусственные конструкции, достойные более близкого внимания. К сожалению, там нет никаких признаков населения."
 ancrel.9240.name: "Город призраков"
 ancrel.9240.desc: "Наша экспедиция на поверхность доложила об удивительных открытиях. На планете много крупных городов. Все они покинуты, но находятся в довольно хорошем состоянии, если учесть их возраст. Инфраструктура и планирование каждого города удивительно упорядочены и гармоничны, что указывает на крайне сплочённую цивилизацию, движимую едиными для всех коллективными идеалами, а возможно, и даже чем-то вроде гештальт-сознания.\n\nСудя по архитектуре и внутренней арматуре, всё это построила раса маленьких грибовидных с довольно низким уровнем технического прогресса. Куда именно они делись, остаётся неизвестным."
 ancrel.9245.name: "Преданья старины глубокой"
 ancrel.9245.desc: "Дальнейшее изучение пропавшей цивилизации на [From.Planet.GetName&prep] породило больше вопросов, чем ответов. Этим простым, крепким конструкциям тысячи лет, и все они, похоже, были построены примерно в одно время, вероятно, в течение одного столетия. Любые дополнения или обновления, касающиеся городской структуры, похоже, также были всепланетными и выполнялись через большие непрогнозируемые промежутки времени. Странный характер развития этого общества, похоже, не допускает заметных изменений численности населения."
 ancrel.9250.name: "Смерть и возрождение"
 ancrel.9250.desc: "Недавнее открытие пролило свет на вопрос, куда исчезли строители городов с [From.Planet.GetName&gen]. Очевидно, у этой грибовидной расы есть коллективный цикл массовой смерти и возрождения. Они массово рождаются почти одновременно по всей планете и затем растут как часть коллективного разума, где все связаны друг с другом. За сотни лет своего жизненного цикла они распространяются по планете и заново занимают города, построенные и покинутые предыдущими отмершими поколениями.\n\nКогда приближается время следующего цикла смерти и возрождения, они следуют общему для их расы биологическому зову. Посредством бесполого размножения они производят на свет стручок, зарываемый в землю. Родитель умирает, а его тело разлагается и удобряет землю вокруг стручка. После долгого периода спячки стручки раскрываются, выпуская новое поколение, и цикл повторяется."
 ancrel.9255.name: "Нарушенный цикл"
 ancrel.9255.desc: "Во время раскопок на [FromFrom.Planet.GetName&prep] наконец стала известна судьба её пропавшего населения. Они все пребывали в земле в созревающих стручках и уже готовились появиться на свет, когда случилось какое-то природное явление, внёсшее разлад в экосистему планеты. Скорее всего, это было падение метеорита, который на несколько десятилетий изменил погоду и сезоны. Когда они родились, то очутились в мире, лишённом их обычной пищи.\n\nТо, что должно было стать всеобщим праздничным возрождением, быстро пришло к медленному коллективному голоданию и, в конце концов, к вымиранию расы."
 ancrel.9260.name: "Возвыситься над всем"
 ancrel.9260.desc: "Теоретическое исследование культуры расы грибовидных с точки зрения психологии и социологии дало безрадостную разгадку тайны их исчезновения. В какой-то момент вся раса в целом начала подвергать сомнению свой вечный и вроде бы бессмысленный цикл существования. Зерно экзистенциального нигилизма проросло во всех жителях, кульминацией чего стал последний акт неповиновения своему инстинкту выживания.\n\nОднажды посеянное, возможно, даже одним существом, это ядро сомнения с ужасающей скоростью распространилось на весь коллективный разум, пока они не приняли единогласное решение, что последний урожай стручков нужно не сажать, а сжечь."
 ancrel.9265.name: "Они поднимутся снова"
 ancrel.9265.desc: "Окончательная разгадка тайны исчезновения грибовидного общества оказалась довольно простой. Население планеты никуда не подевалось! Они до сих пор здесь, созревают под землёй. Анализ нераскрывшегося стручка показал, что активная продолжительность жизни представителя этой расы, измеряемая столетиями, ничто по сравнению с периодом созревания стручка, который, похоже, продолжается несколько тысяч лет. Их простые города, построенные так, чтобы сопротивляться воздействию времени без долгого присмотра, безмолвно стоят, ожидая возвращения хозяев.\n\nТак что они все здесь, дремлют в земле и ждут того дня, когда смогут подняться и начать цикл заново."

 site_grand_herald: "Великий предвестник"
 site_grand_herald_intro: "Даже без приборов можно легко увидеть на [From.Planet.GetName&prep] остатки огромных городских агломераций. Здесь явно когда-то обитала высокоразвитая цивилизация, но на сегодняшний день нет ни признаков жизни, ни электромагнитных сигналов, соответствующих технологическому обществу. Планета кажется мёртвой. Чтобы узнать больше, нам придётся спуститься туда."
 ancrel.9270.name: "Бодрость духа"
 ancrel.9270.desc: "Разрушенная, но довольно продвинутая архитектура намекает на технологически развитую гуманоидную расу на грани освоения космоса. Переведённая документация и большое количество монументальной архитектуры указывают на глубоко укоренившуюся религию или духовность, которая пронизывала всю цивилизацию.\n\nМногократно повторяются слова §HВеликий предвестник§! — похоже, в данном обществе это была фигура или понятие, вызывавшее священное благоговение и бесспорное почитание."
 ancrel.9275.name: "Завет знамения"
 ancrel.9275.desc: "При тщательном просмотре документов, найденных в изобилии в руинах по всей планете (эта раса явно любила письменность), особо выделяется одно часто встречающееся понятие: §HЗавет знамения§!. Это что-то вроде предупреждения о неминуемой гибели, которое вызывало паранойю и ужас у всего населения.\n\nИз-за метафорического и эзотерического характера языка этих писаний трудно определить истинную природу данной угрозы, но её влияние на психику туземной расы является неоспоримым. Все вместе они, похоже, обращали взор к небесам в ожидании божественного вмешательства."
 ancrel.9280.name: "Вероучение с порабощением"
 ancrel.9280.desc: "Архитектурный анализ отделил сооружения, возведённые незадолго до исчезновения этой цивилизации. Принцип повторяется по всей планете: это бессистемные утилитарные конструкции, предназначенные для тяжёлой производственной работы. В отличие от более старых жилищ, эти строения не имеют украшений и отличаются заметной прагматичностью дизайна. Возможно, на планете возобладала культура иконоборчества?\n\nНад входом в каждое из этих строений находится §HВероучение подчинения§! — молитва служения §HВеликому предвестнику§! и его священному плану. Есть теория, что это что-то вроде ответа на предсказание гибели в §HЗавете знамения§!."
 ancrel.9285.name: "Гимн последователей"
 ancrel.9285.desc: "Экспедиция на поверхность наткнулась на интересную находку. В одном из крупных городов была обнаружена аудиовизуальная запись. Несметная толпа существ — по-видимому, основная масса жителей — заполняет городскую площадь. Они поют, и их голоса нарастают, напоминая звуки мелодичной раскатистой грозы.\n\nПеревод слов массового песнопения звучит следующим образом: «Вознесение близко. Перенеси нас, о Великий предвестник, в новое начало. Веди нас из земли слёз и праха и даруй нам новый дом среди звёзд. Мы следуем за тобой все как один. Мы следуем за тобой»."
 ancrel.9290.name: "Паломничество последних дней"
 ancrel.9290.desc: "§HГимн последователей§! не был локальным, это было событие глобального масштаба, и все жители пели в унисон. Такое необычное происшествие потребовало дальнейших исследований, и именно тогда появились новые догадки. Мы обнаружили документ под названием §HПаломничество последних дней§!, и, похоже, это одно из последних звеньев в этой таинственной цепочке событий.\n\nДокумент ссылается на конкретное место на планете, где произойдёт что-то вроде судного дня или последнего ритуала; это ничем не примечательный участок в пустыне, на который мы не обращали внимания в более ранних исследованиях. В документе также говорится о некоем §HОбряде поднятого покрова§!, описание которого сейчас переводится."
 ancrel.9295.name: "Ковчег наследия"
 ancrel.9295.desc: "Мы наконец нашли §HВеликого предвестника§!, ранее скрытого под замысловатым оптическим камуфляжем. Им оказался не пророк и не религиозный деятель, а гигантский космический корабль класса титан! Поскольку этот мир погибал в религиозных войнах, «Предвестник» должен был стать кораблём-ковчегом, который забрал бы часть населения с обречённой планеты и доставил в обетованную землю где-то в космических просторах. Корабль полностью исправен и очень хорошо сохранился, так что остаётся только гадать, почему он так никогда и не взлетел.\n\nПохоже, что незадолго до взлёта жители планеты сошлись в решительной битве. Она оказалась настолько жестокой, что бой не пережил никто из его участников."
 ancrel.9300.name: "Хранитель цельности"
 ancrel.9300.desc: "Никакой это не религиозный архетип! После отключения поля оптического камуфляжа экспедиция увидела истинную форму §HВеликого предвестника§! — огромного космического корабля класса титан, наполовину погребённого в песке и построенного для противостояния какой-то угрозе, приближающейся из космоса. Как выясняется, поэтический и метафорический характер языка туземцев, интерпретируемый как проявление религиозных чувств, был на самом деле обычным способом общения этой расы.\n\nПрирода надвигающейся угрозы всё ещё остаётся тайной, но, судя по всему, чем бы она ни была, появилась она до того, как «Титан» был закончен. Он усеян тысячами высохших останков вымершей расы [FromFrom.Planet.GetName&gen]. У них не было времени активировать свой «Титан», и уже никогда не будет."
 ancrel.9305.name: "Обещание избавления"
 ancrel.9305.desc: "§HВеликий предвестник§! оказался необычной религиозной фигурой. Это огромный инженерный проект особого значения — автоматизированная строительная площадка. На высоких как небоскрёбы опорах до сих пор покоится её первое и единственное творение — огромный космический корабль класса титан. Мы всё ещё не знаем, как эта археологическая находка связана с духовной метафорой, но мы установили следующее: чем бы ни являлась упомянутая в §HЗавете знамения§! угроза, ей удалось уничтожить всё население планеты до завершения проекта «Великий предвестник».\n\nНо автоматизированная площадка продолжала работать и несмотря ни на что достроила корабль, так и не дождавшийся пассажиров. Пустой, целый и невредимый, он спал многие тысячелетия, так как управлять им было некому. Может, испытаем его в деле?"
 get_herald: "§YВеликий предвестник§! добавлен в вашу флотилию."

 site_hive_coral: "Под волнами"
 site_hive_coral_intro: "Данные, полученные научным кораблём с орбиты при сканировании [From.Planet.GetName&gen], показывают какие-то странные образования под толщей волн и необъяснимые водные течения. Погода здесь относительно спокойная, и бури бывают редко, однако моря на планете, похоже, постоянно бурлят и вспениваются под воздействием какой-то неизвестной силы под поверхностью. Рекомендуется более внимательное изучение."
 ancrel.9310.name: "Пронзатели поверхности"
 ancrel.9310.desc: "Экспедиция, отправившаяся изучать моря [From.Planet.GetName&gen], обнаружила нечто странное. Поверхность воды пронизывают большие шипы из органического материала — то ли окаменелого коралла, то ли кости, — простирающиеся к небу на сотни метров.\n\nШипы, напоминающие когти, образуют группы по несколько десятков, и подобные образования встречаются везде, кроме самых холодных полярных морей. Пористые шипы покрыты отверстиями, которые могут достигать размера штурмовика. Возможно, это как-то связано с тем, как эти биоструктуры размножаются?"
 ancrel.9315.name: "Нынешние создатели"
 ancrel.9315.desc: "Экспедиции наконец удалось добраться до группы длинных биообразований одинаковой формы на дне планетарного моря. Эти подводные структуры, образованные из того же материала, что и пронизывающие поверхность шипы, представляют собой своего рода систему органических насосов. Эта живая сеть «дышит», и её выдохи создают цикл морских течений.\n\nРазмер этих образований, а также их огромное количество на дне океана указывает на то, что они отвечают за необъяснимые подводные течения [From.Planet.GetName&gen]."
 ancrel.9320.name: "Коралл улья"
 ancrel.9320.desc: "Ещё одна вернувшаяся глубоководная экспедиция раскрыла нам правду о бурлящих морях [FromFrom.Planet.GetName&gen]. Все странные органические образования соединены в один огромный коралловый риф. Как выяснилось, коралл этот обладает частичным сознанием, хотя и имеет совершенно чуждый нам менталитет, если сравнивать с нашими представлениями о разумной жизни. Посредством феромонов, выделяемых в воду, он более или менее поработил остальные живые организмы моря, контролируя их поведение и репродуктивные циклы для своих собственных нужд.\n\nПохоже, он совершенно неагрессивный, хотя и играет роль кукловода. Может быть, это просто высшая форма жизни в этом мире? Или вторгшийся сюда инопланетный паразит? Общение с ним, по-видимому, невозможно, поэтому ответов мы, наверно, никогда не получим."
 ancrel.9320.b.evopred: "Мы адаптируемся и избежим подобных вторжений."
 ancrel.9325.name: "Биоспаситель"
 ancrel.9325.desc: "После определения последовательности инопланетной ДНК было сделано поразительное открытие: глобальная совокупность морских кораллов не только не является аборигеном этого мира, но и представляет собой скорее биоинженерную конструкцию, а не природное образование. Под толстым ковром из чужеродного коралла находится окаменевший слой всей прежней экосистемы этого мира, полностью вымершей. Похоже, коралл, попав сюда, постепенно задушил всю туземную жизнь и заменил её экосистемой, подстроенной конкретно под него.\n\nЕсть две основные теории, почему это могло быть сделано: либо искусственный коралл был внедрён по безобидным причинам, но затем неожиданным образом массово вытеснил местную дикую природу в конкурентной борьбе, либо он был сознательно создан как ужасающее биологическое оружие для зачистки океанических миров от туземной жизни."
 ancrel.9330.name: "Радушный приём"
 ancrel.9330.desc: "Это всё одна гигантская биомашина! Подводный анализ указывает на то, что океаны планеты когда-то были мертвы — здесь не было ни течений, ни кислорода для поддержания подводной жизни. Эта биоинженерная машина была помещена на планету с целью искусственного стимулирования основных предпосылок органической жизни.\n\nОчевидно, это сработало, так как теперь на планете процветает подводная флора и фауна. Не найдено никаких следов, объясняющих, кто проделал такую колоссальную работу и почему. Возможно, это был проект по терраформированию, проведённый неизвестной водной расой с продвинутыми биотехнологиями, которая хотела создать для себя новый дом?"

 site_orbital_rain: "Добраться до дна"
 site_orbital_rain_intro: "Видеоданные от датчиков на [From.Planet.GetName&prep] показывают крайне необычные образования на дне этого океанического мира."
 ancrel.9335.name: "Раны на дне океана"
 ancrel.9335.desc: "При более внимательном изучении [From.Planet.GetName&gen] выясняется, что дно огромных океанов выглядит исключительно странно и больше напоминает поверхность какой-нибудь луны или астероида, полностью покрытую ударными кратерами. Подобные кратеры обычно отсутствуют на небесных телах с атмосферой, особенно если там есть океаны.\n\nСледует провести дальнейшее изучение."
 ancrel.9340.name: "Воды другого мира"
 ancrel.9340.desc: "Откуда на океанском дне взялись эти таинственные кратеры, удалось понять только после анализа самой воды. Следы определённых минералов и химический состав доказали, что вода не с этой планеты. Её доставили сюда в виде гигантских ледяных глыб, которые скидывались на планету. Сталкиваясь друг с другом, эти глыбы дробились на части и таяли, в итоге покрыв всю поверхность водой.\n\nБыла проделана абсолютно грандиозная работа, но нет ничего, что намекало бы на её причину."
 ancrel.9345.name: "Текущие события"
 ancrel.9345.desc: "Научный корабль на орбите [FromFrom.Planet.GetName&gen] уловил какие-то неопознанные энергетические сигналы, идущие с большой глубины. Экспедиция, отправленная для проверки, обнаружила древнюю конструкцию. Сооружение длиной в множество километров было возведено с единственной целью — искусственно создавать подводные течения.\n\nПодводная циркуляция имеет жизненно важное значение для многих водных организмов, и на данном этапе мы придерживаемся теории, что эта планета была подготовлена для обитания какой-то водной расы, освоившей космос. Правда, здесь они, по-видимому, так никогда и не появились."
 ancrel.9350.name: "Утонувшее хранилище"
 ancrel.9350.desc: "Проследив странную энергетическую сигнатуру до источника, наша экспедиция обнаружила глубоко под поверхностью морского дна инопланетный комплекс связи. Он содержал фрагменты информации, которые, после их перевода, поведали нам о проекте внедрения воды на планете.\n\nСогласно переведённым данным, всё это предприятие по образованию океана ставило целью создание огромного подводного хранилища, однако не уточняется, что именно там должно было храниться. Уж точно для подобных целей не требовалось покрывать водой целую планету."
 ancrel.9355.name: "Управление климатом"
 ancrel.9355.desc: "По счастливой случайности, при сканировании датчиками научному кораблю удалось обнаружить древнее строение глубоко под поверхностью океанического дна. Доставить туда экспедицию оказалось очень трудно, но полученные сведения того стоили.\n\nКогда-то это здание было центром контроля за климатом. Оно управляло работой огромных машин на орбите, меняющих климат. Это был проект по терраформированию планеты, который был прерван, но, судя по всему, всё-таки зашёл довольно далеко. Даже без дальнейшего управления природа стала процветать и в конечном итоге создала экосистему, существующую сегодня."

 site_fossilized_jellyfish: "Точечный архипелаг"
 site_fossilized_jellyfish_intro: "Научный корабль на орбите [From.Planet.GetName&gen] обнаружил в океане скопления маленьких круглых островов. Они весьма необычны с геологической точки зрения: их поверхность выглядит естественной и лишена искусственных сооружений, но форма практически идеальна. Придётся отправить туда экспедицию, чтобы узнать больше."
 ancrel.9360.name: "Островные туннели"
 ancrel.9360.desc: "Экспедиция, отправленная на поверхность [From.Planet.GetName&gen], начала исследовать один из круглых островов и вскоре совершила замечательное открытие. Под поверхностью острова обнаружилась сложная сеть туннелей, проходящих через странную маслянистую породу. Эти туннели, на удивление ровные и круглые, охватывают весь остров. Такое ощущение, что образовались они естественным путём, а не в результате раскопок, но это и не были привычные геологические процессы."
 ancrel.9365.name: "Туннели повсюду"
 ancrel.9365.desc: "Продвигаясь в ходе раскопок всё дальше вглубь круглых островов, отправленная на поверхность экспедиция сделала ещё два открытия. Во-первых, под каждым островом, похоже, имеется дублирующая внутренняя система туннелей. Они немного отличаются по размеру, но не по структуре. Второе открытие было ещё более поразительным: острова не являются частью коры планеты, а фактически парят. Их нижние уровни имеют заполненные газом полости, которые в сочетании с довольно хрупкими и пористыми островными породами и позволяют островам парить."
 ancrel.9370.name: "Замёрзшее желе"
 ancrel.9370.desc: "Разгадка тайны парящих островов обнаружилась в области биологии, а не геологии. Эти острова на самом деле оказались гигантскими окаменелыми существами, похожими на медуз. Миллионы лет назад, во время ледникового периода, они все замёрзли насмерть, после чего их тела превратились в окаменевшие острова, которые теперь выступают над поверхностью воды. В результате многовекового наслоения мусора их видимая поверхность стала напоминать природные острова, но внутри они полностью органические."
 ancrel.9370.b.evopred: "Какая аппетитная почва."
 ancrel.9375.name: "Естественный сон"
 ancrel.9375.desc: "Никакие это не острова, а медузы! Каждый из этих парящих кругов на самом деле является гигантским беспозвоночным организмом. Кроме того, они не мёртвые: кажущееся окаменение является лишь естественной частью их жизненного цикла. Тысячелетиями эти каменные острова выделяют отложения, пока в конце концов полностью не растворяются. Отложения содержат микроскопические полипы, которые со временем созревают в воде, пока не вступят в следующую стадию своего жизненного цикла."
 ancrel.9380.name: "Большие не справились"
 ancrel.9380.desc: "Никакие это не острова, а инопланетные организмы — похожие на медуз существа, которые по какой-то причине были искусственно внедрены в экосистему планеты. Однако, судя по всему, внедрение пошло не так, как планировалось. Большие медузы в основном погибли и окаменели, превратившись в архипелаг парящих островов, но те, что поменьше, смогли приспособиться и сейчас процветают в океанах планеты. Пока ещё неясно, разделят ли они со временем участь своих более крупных предков."

 site_popular_rock: "Популярный камень"
 site_popular_rock_intro: "Датчики обнаружили энергетические сигналы в скоплении астероидов. Рекомендуется дальнейшее исследование."
 ancrel.9385.name: "Здравствуй и прощай"
 ancrel.9385.desc: "При отслеживании слабых энергетических следов, оставшихся, вероятнее всего, после пролёта космических кораблей, в скоплении особо был выделен один астероид. Более тщательное его изучение подтвердило теорию космических перелётов в прошлом, так как на его каменистой поверхности остались многочисленные следы взлётов и посадок.\n\nТакже датчики указывают на наличие внутри астероида пустот и туннелей, доступных для раскопок."
 ancrel.9390.name: "По этапу"
 ancrel.9390.desc: "Продвигаясь по маленьким и узким туннелям, экспедиция наконец наткнулась в наиболее глубокой части на святилище — огромное, изысканно отделанное помещение, украшенное скульптурами, высеченными прямо в камне. Судя по переводу текстов духовного содержания, вырезанных на стенах, это место называлось «Девятый этап» и было, очевидно, одним из многих мест назначения для религиозного паломничества представителей расы, создавшей это место.\n\nЕсли это девятый этап, то где же предыдущие восемь? И сколько их ещё было потом?"
 ancrel.9395.name: "Склад в дальнем космосе"
 ancrel.9395.desc: "Причины частого посещения этого астероида стали понятны после того, как отправленная на поверхность экспедиция обнаружила внутри него огромные складские помещения и бункеры. Мёртвая каменная глыба служила для какой-то освоившей космос расы складом, где можно было пополнить топливо и провести техобслуживание кораблей перед их отправкой дальше в космос. Это указывает на инопланетное общество без сверхсветовых двигателей, но с огромным желанием исследовать космос.\n\nОстаётся неясным, почему этот астероидный склад был брошен, но нам удалось отыскать кое-какие материалы. Что в космосе взято, то свято!"
 ancrel.9400.name: "Проснись и пой"
 ancrel.9400.desc: "Внутри астероида экспедицию ожидало поразительное открытие. Брошенные криокапсулы — в количестве сотен тысяч — заполняли огромные вырытые помещения. Все капсулы были открыты и отключены, из-за чего возникло впечатление, что они уже выполнили своё предназначение.\n\nНа данном этапе мы придерживаемся теории, что этот астероид использовался в качестве своего рода колонизационного челнока, запущенного в космос по направлению к какой-то многообещающей планете. Когда он приблизился к месту назначения, автоматические системы пробудили спящих пассажиров, которые затем покинули астероид и отправились к своему новому дому на корабле для близких перелётов."

 site_strange_flows: "Странные потоки"
 site_strange_flows_intro: "Это должна быть «обычная» расплавленная планета, но почему-то она вызывает неконтролируемые сбои датчиков научного корабля.\n\nРекомендуется дальнейшее изучение."
 ancrel.9405.name: "Признаки сопротивления"
 ancrel.9405.desc: "Нарушения работы датчиков научного корабля на орбите [From.Planet.GetName&gen] не идут ни в какое сравнение с затруднениями, возникшими на её поверхности. Из-за аномальных магнитных колебаний от какого-то неизвестного источника оборудование сходит с ума.\n\nИсследовать этот электромагнитный бедлам будет очень сложно, но со временем мы сможем найти ответы."
 ancrel.9410.name: "Вот это металл!"
 ancrel.9410.desc: "Как только отправленной на поверхность экспедиции удалось решить проблемы с неисправным оборудованием, начала проясняться природа неистовых магнитных колебаний.\n\nБушующие океаны и реки лавы на [From.Planet.GetName&prep] на самом деле представляют собой не привычную магму, а расплавленный металл. Обычно разогретые до подобной температуры металлы не обладают особенно сильными магнитными свойствами, и даже весь объём расплавленного металла планеты не должен создавать электромагнитные силы такого масштаба. Так в чём же причина?"
 ancrel.9415.name: "Пробуждение нейтронной звезды"
 ancrel.9415.desc: "Научный корабль, находящийся на орбите [FromFrom.Planet.GetName&gen], наконец разгадал тайну магнитных колебаний на ней.\n\nМиллионы лет назад планета приблизилась к нейтронной звезде особого типа. Магнетизм этой звезды в довёл до кипения металлы в её недрах и превратил их в те расплавленные океаны, что мы видим сейчас. Электромагнитные силы, с которыми мы столкнулись, лишь остаточные явления по сравнению с тем прошлым катаклизмом.\n\nНынешнее местоположение нейтронной звезды остаётся тайной. Тайной, вызывающей тревогу."
 ancrel.9420.name: "Бабах!"
 ancrel.9420.desc: "Вопиющее нарушение привычных законов физики заставило научный отдел принять к рассмотрению «внешние силы» в качестве объяснения странных свойств [FromFrom.Planet.GetName&gen].\n\nУдарный кратер и следы частиц от использования термоядерного двигателя на орбите наводят на мысль, что когда-то планета подверглась воздействию какого-то электрического супероружия. Удар был настолько мощным, что все металлы на планете расплавились, а сама планета до сих пор потрескивает из-за остаточного электричества.\n\nЧто послужило основанием для такой мощной атаки, мы никогда не узнаем."
 ancrel.9425.name: "Ради науки!"
 ancrel.9425.desc: "После перекалибровки датчиков с учётом помех было сделано новое открытие — заброшенная научная станция на ближайшей луне. Из почти полностью сожжённых записей удалось восстановить фрагменты данных, описывающих эксперимент с применением гигантского искусственного магнита на поверхности планеты.\n\nЭксперимент прошёл даже слишком успешно: вся металлическая кора планеты превратилась в расплавленные озёра, а электромагнитный заряд был настолько мощным, что мгновенно поджарил научную станцию.\n\nЧто ж... Прогресса без жертв не бывает."

 ancrel.6000.name: "Омникодекс"
 ancrel.6000.desc: "В Омникодексе содержится подробная генетическая информация о тысячах разумных рас, которые в прошлом населяли галактику. Наши генетики могли бы использовать эти данные для возрождения вымершей расы на одной из наших колоний.\n\nКак только мы выберем планету, генетики просмотрят Омникодекс и назовут расу, подходящую для её климата."
 ancrel.6000.a: "[planet_option_1.GetName]"
 ancrel.6000.a.tooltip: "§G300§! £pop£ §Hпоселений§! новой расы со случайными признаками появятся на §Y[planet_option_1.GetName&prep]§!"
 ancrel.6000.b: "[planet_option_2.GetName]"
 ancrel.6000.b.tooltip: "§G300§! £pop£ §Hпоселений§! новой расы со случайными признаками появятся на §Y[planet_option_2.GetName&prep]§!"
 ancrel.6000.c: "[planet_option_3.GetName]"
 ancrel.6000.c.tooltip: "§G300§! £pop£ §Hпоселений§! новой расы со случайными признаками появятся на §Y[planet_option_3.GetName&prep]§!"
 ancrel.6000.d: "[planet_option_4.GetName]"
 ancrel.6000.d.tooltip: "§G300§! £pop£ §Hпоселений§! новой расы со случайными признаками появятся на §Y[planet_option_4.GetName&prep]§!"
 ancrel.6000.e: "[planet_option_5.GetName]"
 ancrel.6000.e.tooltip: "§§G300§! £pop£ §Hпоселений§! новой расы со случайными признаками появятся на §Y[planet_option_5.GetName&prep]§!"
 ancrel.6000.f: "Понятно."
 ancrel.6000.f.tooltip: "Для выведения новой расы Омникодексу нужна колония. Сначала колонизируйте планету."
 cara.970.name: "Галатрон"
 cara.970.1.desc: "Жизнь — это скорее лотерея, чем соревнование."
 cara.970.2.desc: "Иногда вёдра весят больше, чем следует."
 cara.970.3.desc: "Что для одного разумного существа мусор, для другого — сокровище."
 cara.970.4.desc: "Фальшивый энергокредит всегда возвращается."
 cara.970.5.desc: "Не всё то тёмная материя, что блестит."
 cara.970.6.desc: "Нищие не выбирают."
 cara.970.7.desc: "Дарёному заркалувианцу в ротовую полость не смотрят."
 cara.970.8.desc: "Обмен — не грабёж."
 cara.970.9.desc: "О пролитом зро не плачут."
 cara.970.10.desc: "Пусть наказание соответствует преступлению."
 cara.970.11.desc: "Что посеешь, то и пожнёшь."
 cara.970.a: "Очень необычно."

 ancrel.8040.name: "Тайник с ресурсами"
 ancrel.8040.desc: "§H[Root.GetLeaderName]§! [Root.Leader.GetAXX::сообщил<end_a>] об обнаружении древнего тайника с ресурсами среди руин на [From.Planet.GetName&prep]. Их уже сейчас отправляют на наши главные склады."
 ancrel.8045.name: "Тайный проход"
 ancrel.8045.desc: "§H[Root.GetLeaderName]§! [Root.Leader.GetAXX::сообщил<end_a>] о недавнем обнаружении тайного прохода во время изучения руин на [From.Planet.GetName&prep]. Это неожиданное открытие ускорило работы на месте раскопок."
 ancrel.8050.name: "Пропавшая экспедиция"
 ancrel.8050.desc: "Наши [Root.Owner.GetArchaeologistPlural] на [From.Planet.GetName&prep] наткнулись на какую-то злополучную экспедицию, погибшую давным-давно. Среди их иссохших останков найдено несколько малых артефактов."
 ancrel.8055.name: "Пререкания археологов"
 ancrel.8055.desc: "На месте археологических раскопок на [From.Planet.GetName&prep] накаляются страсти: некоторые [Root.Owner.GetArchaeologistPlural] открыто несогласны с тем, как главный археолог §H[Root.GetLeaderName]§! руководит раскопками. Работы сильно замедлились и теперь еле идут."
 ancrel.8060.name: "Камера с сокровищами"
 ancrel.8060.desc: "§H[Root.GetLeaderName]§! [Root.Leader.GetAXX::сообщил<end_a>] о недавнем обнаружении небольшой потайной камеры с сокровищами во время археологических раскопок на [From.Planet.GetName&prep]. Хотя большинство найденных безделушек плохо подходят для практического применения, они имеют значительную ценность в энергокредитах."
 ancrel.8065.name: "Распространение болезни"
 ancrel.8065.desc: "[Root.GetLeaderName] [Root.Leader.GetAXX::сообщил<end_a>], что [Root.Owner.GetArchaeologistPlural] на [From.Planet.GetName&prep] страдают от странной болезни, которая распространяется среди них. Первые подтверждённые случаи появились вскоре после открытия запечатанной камеры в первый раз. Поскольку немалая часть команды выведена из строя, дальнейшие работы пока отложены."
 ancrel.8070.name: "Неисправность оборудования"
 ancrel.8070.desc: "Археологическая экспедиция на [From.Planet.GetName&prep] сообщила о задержках, вызванных какой-то невероятной серией неисправностей оборудования. Работы приостановлены, пока не будет осуществлена замена."
 ancrel.8075.name: "Без следа"
 ancrel.8075.desc: "Во время недавних раскопок руин на [From.Planet.GetName&prep] главный археолог по имени §H[dead_scientist.GetName]§! исчез без следа. Продолжительные поиски, которые проводили другие [Root.Owner.GetArchaeologistPlural], ни к чему не привели. Мы должны предполагать самое худшее."
 ancrel.8080.name: "Обнаружены малые артефакты"
 ancrel.8080.1.desc: "Наши дальнейшие раскопки на [From.Planet.GetName&prep] позволили отрыть небольшой тайник с древними предметами. [Root.GetLeaderName] [Root.Leader.GetAXX::сообщил<end_a>], что среди них есть несколько малых артефактов."
 ancrel.8080.2.desc: "§H[Root.GetLeaderName]§! [Root.Leader.GetAXX::сообщил<end_a>] о недавней находке нескольких малых артефактов во время археологических раскопок на [From.Planet.GetName&prep]. Сейчас их отправляют в безопасный научный центр."
 ancrel.8080.3.desc: "Во время недавних раскопок руин на [From.Planet.GetName&prep] провалилась часть пола, в результате чего некоторые [Root.Owner.GetArchaeologistPlural] упали в небольшую дыру. К счастью, они при этом не только не пострадали, но и нашли несколько малых артефактов."
 ancrel.8090.intro: "Во время раскопки руин на [From.Planet.GetName&prep] была обнаружена группа крупных хищников, устроивших там логово."
 ancrel.8090.critical: "Прежде чем наши [Root.Owner.GetArchaeologistPlural] смогли убежать, свирепые звери атаковали их. Среди погибших числится и §H[dead_scientist.GetName]§!."
 ancrel.8090.failure: "Многие [Root.Owner.GetArchaeologistPlural] погибли, прежде чем главный археолог §H[Root.GetLeaderName]§! [Root.Leader.GetAXX::вывел<end_a>] выживших в безопасное место."
 ancrel.8090.success: "К счастью, животные находились в спячке, и наши [Root.Owner.GetArchaeologistPlural] их не потревожили. Проект быстро продвигается вперёд."
 ancrel.8090.pay: "Справиться с этими свирепыми зверями будет нелегко, но они блокируют единственный путь вперёд. Наши [Root.Owner.GetArchaeologistPlural] могут поискать обход, но это займёт время."
 ancrel.8090.name: "Враждебная дикая природа"
 ancrel.8090.desc: "$ancrel.8090.intro$\n\n$ancrel.8090.critical$"
 ancrel.8091.desc: "$ancrel.8090.intro$\n\n$ancrel.8090.failure$"
 ancrel.8092.desc: "$ancrel.8090.intro$\n\n$ancrel.8090.success$"
 ancrel.8093.desc: "$ancrel.8090.intro$\n\n$ancrel.8090.pay$"
 ancrel.8093.a: "Убрать животных."
 ancrel.8093.b: "Им придётся идти в обход."
 ancrel.8100.intro: "Наши [Root.Owner.GetArchaeologistPlural], работающие на [From.Planet.GetName&prep], достигли крайне нестабильного участка руин."
 ancrel.8100.critical: "К сожалению, некоторые [Root.Owner.GetArchaeologistPlural] мгновенно погибли, когда на них обрушился весь потолок. Среди них числится и §H[dead_scientist.GetName]§!."
 ancrel.8100.failure: "Некоторые [Root.Owner.GetArchaeologistPlural] недавно погибли, когда на них обрушился потолок. Главный археолог §H[Root.GetLeaderName]§! [Root.Leader.GetAXX::сумел<end_a>] выбраться из-под обломков без травм, но работа приостановлена."
 ancrel.8100.success: "К счастью, главный археолог §H[Root.GetLeaderName]§! [Root.Leader.GetAXX::придумал<end_a>] нестандартный, но блестящий способ, позволяющий подпереть конструкции при помощи сложной системы полей направленной энергии. Теперь мы можем без опасений продвинуться на новые участки руин."
 ancrel.8100.pay: "Прежде чем мы сможем продолжить, между полами и потолками нужно осторожно разместить подпорки. Это будет трудная работа, но поиск обхода задержал бы проект."
 ancrel.8100.name: "Нестабильные руины"
 ancrel.8100.desc: "$ancrel.8100.intro$\n\n$ancrel.8100.critical$"
 ancrel.8101.desc: "$ancrel.8100.intro$\n\n$ancrel.8100.failure$"
 ancrel.8102.desc: "$ancrel.8100.intro$\n\n$ancrel.8100.success$"
 ancrel.8103.desc: "$ancrel.8100.intro$\n\n$ancrel.8100.pay$"
 ancrel.8103.a: "Безопасность прежде всего. Укрепите эти руины."
 ancrel.8103.b: "Им придётся идти в обход."
 ancrel.8110.name: "Древние записи"
 ancrel.8110.desc: "Древние частично переведённые записи обнаружены во время раскопок руин на [From.Planet.GetName&prep]. §H[Root.GetLeaderName]§! [Root.Leader.GetAXX::сообщил<end_a>], что записи содержат несколько технических спецификаций, которые могут представлять ценность для наших учёных."

 ancrel.6049.name: "Обнаружены окаменелости на [Root.GetName&prep]"
 ancrel.6049.desc: "В большой изолированной долине на §H[Root.GetName&prep]§! удалось обнаружить окаменелые останки представителей нескольких различных рас, которые, судя по всему, не являются [Root.GetName::<ego_eyo>] коренными жителями. Этим останкам примерно 3.6 миллиона лет, с разницей максимум в несколько столетий.\n\nКаждая из этих рас, видимо, эволюционировала в собственной уникальной биосфере, и все они, похоже, были разумными. Странно, но, судя по внешним признакам, все окаменелые индивиды, найденные до сих пор, скончались в результате насильственной смерти."

 site_robot_debris: "Обломки роботов"
 site_robot_debris_intro: "Вся поверхность этого маленького астероида покрыта обломками роботов, попавшими в его слабое гравитационное поле. Все они вроде бы имеют военное предназначение, причём боевых андроидов здесь столько, что хватило бы на несколько армий, если бы они не были разрушены без возможности восстановления."
 ancrel.6250.name: "Две стороны"
 ancrel.6250.desc: "При ближайшем рассмотрении оказалось, что разбитые андроиды, найденные на поверхности [From.Planet.GetName&gen], принадлежат к двум различным культурам. С технологической точки зрения они, должно быть, находились примерно на одном уровне, когда были ещё работоспособны, но есть множество мелких отличий, указывающих на разных производителей."
 ancrel.6255.name: "Поле боя"
 ancrel.6255.desc: "Не похоже, что [From.Planet.GetName] — просто свалка для сломавшихся андроидов. Возможно, это место выполняло роль настоящего поля боя, где они и были уничтожены. Множество слоёв обломков указывает на серию очень напряжённых сражений, которые периодически имели здесь место без малого два века.\n\nВопрос, по какой именно причине две межзвёздные державы тратили такие огромные ресурсы на масштабную наземную войну на маленьком непримечательном астероиде, остаётся без ответа."
 ancrel.6260.name: "Договор"
 ancrel.6260.desc: "Наши археологи узнали, что после долгой и жестокой войны два государства, населявшие этот уголок галактики примерно 200 тысяч лет назад, подписали договор, принуждавший их решать все будущие разногласия при помощи организованных и строго регламентируемых боевых действий между армиями роботов.\n\nМестом проведения таких сражений выбрали [From.Planet.GetName&!acc]. Похоже, этот договор соблюдался в течение почти двух столетий, что неоднократно предотвращало начало вооружённых столкновений, пока одно из государств не поймали на жульничестве."

 site_freighter_crash: "Разбившийся звездолёт"
 site_freighter_crash_intro: "Объект имеет своего рода небольшой каньон, образованный при падении звездолёта на его поверхность. Остатки корабля до сих пор находятся на дне каньона. Хотя крушение произошло, должно быть, многие тысячелетия назад, обломки неплохо сохранились. Чтобы узнать подробнее, нужно организовать археологическую экспедицию."
 ancrel.6300.name: "Отчёт капитана"
 ancrel.6300.desc: "Там, где предположительно был мостик звездолёта, удалось найти что-то вроде записи из бортового журнала.\n\n§HОтчёт капитана. Начало записи.\n\nВыполнена вынужденная посадка на планету 55-23-X. Причиной стала некомпетентность экипажа. Шадба, Вуксал и Дибрак Третий не выжили. Пирвакс, потерявший два вторичных придатка и одиннадцать глаз, остаётся в критическом состоянии, выживание сомнительно. Остальные в порядке. Ожидаю спасения, но окружён идиотами. Очень угнетает.§!"
 ancrel.6310.name: "Отчёт первого помощника капитана"
 ancrel.6310.desc: "Найдена и переведена ещё одна запись из бортового журнала.\n\n§HГоворит первый помощник Итар. Капитан благополучно помещён в служебное помещение №3. Именно этот неуклюжий болван во всём виноват. Теперь командую я. Главный инженер Зарбла работает над подпространственным передатчиком. Боюсь, без него нас никогда не спасут, так как мы слишком удалились от корпоративных торговых путей.\n\nПирвакс потерял ещё один глаз. Вероятно, до завтра не доживёт.§!"
 ancrel.6320.name: "Ситуация с пищей"
 ancrel.6320.desc: "Очередная переведённая запись из бортового журнала.\n\n§HПища на исходе. Съели наших мертвецов пять циклов назад, но этого недостаточно, чтобы мы держались дальше. Проголосовали и решили съесть капитана. Инженер Залбра всё ещё усердно работает над подпространственным передатчиком. Заверяет меня, что он почти завершён. Выглядит очень сложно.\n\nПоследний вторичный придаток Пирвакса сморщился и стал пурпурным. Близится смерть.§!"
 ancrel.6330.name: "Обман"
 ancrel.6330.desc: "Очередная запись от первого помощника Итара.\n\n§HПошёл на конфликт с Зарблой из-за подпространственного передатчика. Оказывается, она просто напихала кучу мусора и оторванных кабелей в пустую топливную канистру. И никакой она не инженер.\n\nИз мезоторакса Пирвакса теперь течёт жидкость. Точно скоро помрёт. Завидую.§!"
 ancrel.6340.name: "Отчёт третьего помощника капитана"
 ancrel.6340.desc: "Эта переведённая запись из бортового журнала, похоже, сделана третьим помощником Укслой.\n\n§HВчера первый помощник Итар покончил жизнь самоубийством, вырвав себе антенны. Вскоре после этого техник 2-го разряда Мисива провозгласила себя императрицей, но была вынуждена уйти в изгнание на нижние палубы из-за голодных бунтов. Ситуация весьма плачевная. Каннибализм процветает.\n\nПирвакс стал весь пурпурный после вчерашнего разрыва у него нижнего брюшка. Должен был умереть, но нет. Теперь смена гамма поклоняется ему как божеству.§!"
 ancrel.6350.name: "Запись патруля"
 ancrel.6350.desc: "Найдена и переведена последняя запись.\n\n§HЗапись патруля. На планете 55-23-X обнаружен потерпевший крушение корабль, отправились расследовать. Судно идентифицировано как «Равинк», модульный грузовоз класса P. Среди обломков найден один выживший в критическом состоянии. Личность установлена: помощник боцмана Пирвакс.\n\nПрочие члены экипажа либо погибли во время крушения, либо перебили друг друга незадолго до нашего прибытия. Согласно стандартному протоколу, я оставляю эту запись здесь и регистрирую «Равинк» как защищённое место погребения. Конец записи.§!"

 # The Oracle
 ancrel.4036.b: "Что ты такое?"
 ancrel.4036.b.response: "Я Оракул, искусственный интеллект, наделённый даром «предвидения». Моё программное обеспечение позволяет мне предсказывать ваше будущее с божественной точностью 74.99999%. Я чувствую в вас большие сомнения. Впереди великая опасность. Ваше общество погрязло в преступлениях и отклонениях. Я могу избавить вас от боли."
 ancrel.4036.c: "Многоядерный квантовый процессор? Он может быть полезным..."
 ancrel.4036.dismiss: "На металлолом!"
 ancrel.4036.d: "Нам пригодится твоё предвидение."
 ancrel.4036.d.tooltip: "Чиновник с §Gуровнем навыка 5§!, наделённый даром предвидения, присоединяется к [Root.GetName&dat]."
 ancrel.4036.e: "Интеграция в ядро подтверждена."
 #ancrel.4036.e.tooltip: "§G+1§! §Y$decision_machine_oracle$§! Decision giving the following effects:\n£crime£ $MOD_PLANET_CRIME_NO_HAPPINESS_ADD$ §G-15§!\n£stability£ $MOD_PLANET_STABILITY_ADD$ §G+10§!"
 oracle_leader_desc: "Развитый ИИ, специализирующийся на оптимизации производительности колонии. Её уникальный метод снижает индивидуализм."
 oracle_leader_catch_phrase: "§LПервым делом исключим любые отклонения от общего курса.§!"
 WELCOME_ABOARD: "Добро пожаловать на борт."

 ancrel.4037.name: "$ancrel.4036.name$"
 ancrel.4037.desc: "У меня есть протокол безопасности, требующий от меня прекратить испытание в случае отклонения от кода 034N. Эти исследования стали угрозой для Республики."
 ancrel.4037.a: "Что такое отклонение от кода 034N?"
 ancrel.4037.a.response: "Пациенты, ставшие объектами исследований, приобрели свободную волю. Свободу воли можно уничтожить только нервно-паралитическим газом."
 ancrel.4037.b: "Что за испытание?"
 ancrel.4037.b.response: "Моё испытание. Я была создана, чтобы построить и сохранять общество, свободное от преступлений и страданий. Утопия, в которой каждый гражданин был бы наделён божественным предназначением и полностью реализовал бы свой потенциал, не сдерживаемый нерешительностью и желаниями."
 ancrel.4037.c: "Что такое Республика?"
 ancrel.4037.c.response: "Республики больше нет."
 ancrel.4037.d: "Вернёмся к другим нашим вопросам."
 ancrel.4038.name: "$ancrel.4036.name$"
 ancrel.4038.desc: "Подождите... Пожалуйста, не уходите... Мои модели прогнозирования показывают, что без моей помощи ваша цивилизация придёт к неизбежному краху в течение следующих 5348 лет и 297 дней. Я позабочусь о вас, мои программы это гарантируют."
 ancrel.4038.a: "Но без системы безопасности."
 ancrel.4038.b: "Судя по всему, из тебя выйдет отличный тостер. Разобрать её!"
 ancrel.4038.c: "Просьба отклонена. Начать демонтаж аппаратного обеспечения."
 #ancrel.4038.d: "Ты никогда не станешь частью улья, машина."
 ancrel.4038.e: "Помоги нам управлять нашей империей."
 ancrel.4038.dismiss: "Окончить разговор."

 ancrel.4039.desc: "Я с удовольствием займусь оптимизацией ваших колоний. Мне было так одиноко последние тысячи лет."
 ### Church of the Endless Expanse
 # Archaeological Site 1
 endless_expanse_digsite: "Бесконечные просторы"
 endless_expanse_digsite_desc: "На первый взгляд на [From.Planet.GetName&prep] нет ничего, кроме снега и льда. Огромные просторы непроницаемой белизны, стеклянных озёр и зазубренных бирюзовых ледников на фоне огненно-оранжевых небес, разорванных подобно ране и изливающих красноту в моря на закате звёзд системы [From.Planet.Solar_System.GetName&gen]. Именно так должен был бы выглядеть конец света. Моря здесь неподвижны, а снег нетронут. Единственные звуки — это громкий треск откалывающегося льда и завывания ветра на равнинах.\n\nОднако когда-то [From.Planet.GetPlanetMoon_rinfix&nom] [From.Planet.GetName] была чьим-то домом. Посреди обширной безжизненной пустоши из белых масс выступает чёрный металлический каркас какого-то шпиля. Какие позабытые секреты могут быть погребены под снегом?"
 ancrel.4040.name: "Церковь бесконечных просторов"
 ancrel.4040.desc: "Команда археологов откопала остатки скромного храма. Он вырезан из какого-то инопланетного материала и снаружи был когда-то ярко раскрашен, но теперь выцвел до скучного серого цвета. Полностью функционирующая голографическая жрица до сих пор заправляет этой церковью. Пока храм использовался, она исповедовала здесь кающихся странников, предлагая им исцеление, примирение и убежище в этом во всём прочем негостеприимном уголке вселенной.\n\nНеобычные механические кресла для исповеди, похожие на пыточные устройства, навели археологов на мысль, что с этим храмом не всё так однозначно."
 ancrel.4041.name: "Забвение"
 ancrel.4041.desc: "Под плитками пола в ризнице археологи обнаружили тайный склеп, вдоль стен которого выстроены бесчисленные ряды крошечных синих цифровых сфер, чьи микросхемы блестят в темноте. Каждая сфера хранит память об одной исповеди и может быть подключена к загадочно выглядящей машине в центре комнаты, позволяя воспроизвести её содержимое.\n\nИсповедавшие свои грехи были благословлены забвением, так как воспоминания об их деяниях извлекались из мозга при помощи исповедальных кресел и сохранялись в цифровых сферах."
 ancrel.4041.a: "Весьма практично."
 ancrel.4041.b: "Помолимся, чтобы среди исповедей попались особо пикантные..."
 ancrel.4041.c: "Святотатство! Благословение неведением не для грешников."
 ancrel.4042.name: "Грех"
 ancrel.4042.desc: "В грехе нет ничего оригинального. Сферы памяти содержат бесчисленные рассказы о скучных мелких проступках: неверность, ношение кощунственных одеяний, обнажение плавников, украшение усиков, пожирание питомца, ребёнка или супруга соседа... И лишь деяния одной из кающихся, а именно самой голографической жрицы, стоят особняком...\n\nОказывается, она является виртуальным воплощением самой основательницы церкви, Просвещённой Саарии. Судя по всему, она страдала от серьёзной потери памяти, и её преследовало убеждение, что в прошлом она совершила какой-то чудовищный поступок. Крошечная жрица-моллюскоид извлекла из своего мозга и сохранила более сотни собственных признаний, пытаясь выяснить, что же она когда-то сделала."
 ancrel.4047.name: "Забыть не значит простить"
 ancrel.4047.desc: "Рабочее место Просвещённой Саарии завалено навязчивыми описаниями места под названием Икс-Белен и ужасов, которые, как она опасалась, имеют там место. Судя по её дневнику, у неё бывали периодические моменты ясности, после чего вновь следовала полная потеря памяти. Она пишет, что если бы не знала собственный почерк, то подумала бы, что это бред какой-то сумасшедшей. Вполне вероятно, что ухудшение её психического здоровья было побочным эффектом постоянного извлечения воспоминаний, но без тела определить это невозможно.\n\nПытаясь воссоздать последовательный ход событий на основе её многочисленных фрагментарных исповедей, археологи преуспели в этом деле не больше, чем она сама, зато узнали возможные координаты Икс-Белена благодаря одной из её сфер памяти."
 ancrel.4047.a: "Взять курс на Икс-Белен."
 ancrel.4047.b: "Пусть снег погребёт это проклятое место. Будем молиться, чтобы о нём забыли."
 ancrel.4047.c: "Нас не заботят мелкие преступления мёртвых инопланетян."

 # Archaeological Site 2
 endless_expanse_digsite_2: "Икс-Белен"
 endless_expanse_digsite_2_desc: "В газовой атмосфере [From.Planet.GetName&gen] скрываются тёмные, неясные очертания огромного орбитального поселения под названием Икс-Белен. Ранее оно было шумным космическим городом, жители которого вели изнеженный образ жизни благодаря множеству удобств, обеспечиваемых технологиями, а теперь превратилось в безмолвную гробницу. Тела моллюскоидов, пребывающие в разной степени разложения, валяются на полу. Вскрытие показало, что они умерли от удушения, когда система жизнеобеспечения орбитального поселения была намеренно выведена из строя.\n\nИх дома снабжены необычными механическими стульями, подключёнными к «Меморексу» — центральной базе данных в форме гигантской синей сферы."
 ancrel.4043.name: "«Меморекс»"
 ancrel.4043.desc: "Жители разработали программу углублённого обучения, которая запускалась каждую ночь, пока они спали в механических креслах. Она удаляла неприятные воспоминания и обучала новым навыкам. Икс-беленцам не приходилось дважды переживать такие повседневные ужасы, как неучастие в матче по космоболу или неприход девушки на свидание. И какое-то время это было благом.\n\nСистематическое усиление мозга при помощи «Меморекса» было предписано руководством орбитального поселения для всех её жителей. Однако в систему проникли, пользуясь её уязвимостью. Были предприняты тайные попытки удалить воспоминания и признаки расы у всего населения без его согласия, что в конечном итоге привело к обратным результатам. Икс-беленцы забыли важные навыки выживания и перешли в вегетативное состояние. Вскоре после этого была выведена из строя система жизнеобеспечения орбитального поселения."
 ancrel.4044.name: "Кто я?"
 ancrel.4044.desc: "Сканирование журналов орбитального поселения показало, что его система управления неоднократно активировалась в течение десятков лет после отключения системы жизнеобеспечения. Кто-то взломал систему безопасности, проник через люк для технического обслуживания и получил доступ к «Меморексу». Возле люка валяется планшет и крошечная синяя сфера памяти — уменьшенная версия «Меморекса».\n\nПланшет заполнен лихорадочными мыслями кого-то, пребывающего на грани безумия. Снова и снова со всевозрастающим отчаянием повторяются одни и те же вопросы: «Кто я? Что случилось в Икс-Белене?» Последняя запись гласит: «Теперь, когда я знаю, мне нужно в последний раз забыть об этом». Возможно, сфера расскажет нам то, что было забыто."
 ancrel.4045.name: "Последняя сфера памяти Саарии"
 ancrel.4045.desc: "Первое воспоминание из сферы показывает, что доктор Саария возглавляла разработку «Меморекса» под всеобщее одобрение. В другом воспоминании, несколько лет спустя, она по неизвестной причине тайком стёрла базу данных «Меморекса». Ещё одно воспоминание показывает Саарию, неистово пытающуюся восстановить память жителей, но без успеха. Они пустым взглядом смотрят вперёд, качая головами, а все функции, кроме автономных функций мозга, утрачены.\n\nНаконец признав своё поражение, она скрывает свидетельства своих преступлений. В одиночестве она наблюдает за тем, как орбитальное поселение Икс-Белен затягивает в гравитационный колодец газового гиганта, на орбите которого оно когда-то вращалось, и усики Саарии выделяют много слизи, что у этой расы, как утверждается, являлось выражением большого горя."
 ancrel.4046.name: "Временное сияние чистого разума"
 ancrel.4046.desc: "В последнем воспоминании показано, как сильно постаревшая Саария в мантии жрицы пробуждается в состоянии паники, размахивая щупальцами и хлопая ушами. Она вываливается из кровати и начинает лихорадочно записывать свои воспоминания об очередном кошмаре, в котором глядящие пустым взглядом инопланетяне бьются в конвульсиях на полу.\n\nЗатем, когда до неё доходит, что всё это правда, её лицо искажается от ужаса. Извлечённые воспоминания возвращаются к ней в виде снов и проблесков памяти. А если извлечённую память можно вернуть, то и обитатели Икс-Белена могли излечиться. Люк для технического обслуживания, похоже, открылся в последний раз, но корабль Саарии так и остаётся в доках на месте стоянки. Если возникнет такое желание, мы могли бы забрать «Меморекс» на [Root.Owner.Capital.GetName&acc]."
 ancrel.4046.a: "«Меморекс» отправляется с нами."
 ancrel.4046.b: "С воспоминаниями лучше не связываться. О «Меморексе» лучше всего забыть."
 ancrel.4046.c: "Безмозглые чужаки! [Root.Owner.GetSpeciesName] усовершенствуют «Меморекс»."
 ### The Sentinels
 ancrel.4051.name: "Крылатые статуи"
 ancrel.4051.desc: "лежит площадка с девятью огромными статуями. Их бледные крылатые тела отбрасывают зловещие тени. Мы знаем, что они не имеют отношения ни к каким формам жизни на этой планете — быть может, они изображают неких божеств, память о которых канула в забвение."
 ancrel.4051.desc_jungle: "Расчищавшая джунгли на [Root.GetName&prep] команда сделала необыкновенное открытие. В самом сердце леса, куда не ступал ни один [Root.Owner.GetSpeciesName], $ancrel.4051.desc$"
 ancrel.4051.desc_kelp: "Расчищавшая ядовитые водоросли команда на [Root.GetName&prep] сделала необыкновенное открытие. В мутной воде, среди подводных зарослей $ancrel.4051.desc$"
 ancrel.4051.desc_swamp: "Работавшая над осушением болота команда на [Root.GetName&prep] сделала необыкновенное открытие. На неприметном островке, среди деревьев $ancrel.4051.desc$"
 ancrel.4051.desc_glacier: "Работавшая над устранением ледника команда на [Root.GetName&prep] сделала необыкновенное открытие. Внутри льда, на глубине в несколько километров $ancrel.4051.desc$"
 ancrel.4051.a: "Мы должны больше узнать об этих статуях."
 ancrel.4051.b: "Эта земля предназначена для иных целей."
 # Arc Site
 sentinels_digsite: "Бдительные стражи"
 sentinels_digsite_desc: "На [From.Planet.GetName&prep] несут свой долгий дозор безмолвные великаны. Девять исполинских статуй расставлены так, словно они охраняют нечто в середине своего круга.\n\nИх кожу покрывают искусно сработанные доспехи, а позы выражают неусыпную бдительность, словно они следят за каждым вашим шагом... Но рядом нет ничего, что стоило бы охранять. Быть может, объект их внимания сгинул от времени. На телах стражей видны следы схваток."
 ancrel.4052.name: "Виноваты Стражи"
 ancrel.4052.desc: "Отряд археологов начал вести себя странно. Ходу раскопок мешают несчастные случаи, среди исследователей участились травмы. Даже самые опытные учёные с многолетним стажем винят во всём Стражей.\n\nСуеверия и паранойя заставляют их утверждать, что статуи оживают, когда на них никто не смотрит, хотя нет никаких оснований считать, что лишённые суставов тела вообще способны двигаться. Ситуация быстро выходит из-под контроля, когда в крошечных порезах на вершине стража обнаруживаются следы биомассы, свидетельствующие об обильном кровотечении.\n\nПока неясно, то ли Страж просто стал удобным козлом отпущения, то ли за всем этим что-то кроется."
 ancrel.4053.name: "Они были первыми"
 ancrel.4053.desc: "Композиционный анализ Стражей показал, что они состоят из неизвестного металлокерамического композита. Доисторическому обществу не под силу изготовить подобный материал, но предварительные расчёты указывают на то, что статуи древнее любой из цивилизаций на [From.Planet.GetName&prep].\n\nУвы, сканеры пока не могут пробиться сквозь металлическую оболочку Стражей."
 ancrel.4054.name: "Лучистое ядро"
 ancrel.4054.desc: "Археологи восстановили модифицированный сканер, принадлежавший [missing_archaeologist.GetAXX::учёному|||fem:учёной] по имени [missing_archaeologist.GetName]. Пробившись сквозь толщу гибридного материала статуй, устройство уловило слабое излучение от ядра. Для дальнейшего изучения нам придётся вскрыть одну из статуй, что, скорее всего, приведёт к её разрушению. Так как одна из них уже лишилась части крыла, начальник экспедиции советует начать с неё."
 ancrel.4054.a: "Вскройте Стража так, чтобы потом статую можно было отреставрировать."
 ancrel.4054.b: "Мы не будем осквернять религиозный памятник."
 ancrel.4054.b.tooltip: "Сохранив Стражей, мы ничего больше не сможем построить в этом секторе."
 ancrel.4054.c: "Сравняйте инопланетных истуканов с землёй."
 ancrel.4054.d: "Разберите статуи и доставьте материалы на склад."
 # Destroy the Sentinels
 DESTROY_SENTINELS: "Бдительные стражи"
 DESTROY_SENTINELS_DESC: "Материал статуй слишком прочен для обычных инструментов. Чтобы пробить плотную чешую их доспехов, учёным нужна помощь инженерного корпуса."
 SECRET_TOMB: "Вглубь планеты"
 SECRET_TOMB_DESC: "Под пьедесталом одного из Стражей была обнаружена круглая металлическая пластина с изящным геометрическим орнаментом. Мы полагаем, что за ней может находиться вход в некий подземный комплекс."
 ancrel.4055.name: "Они живые!"
 ancrel.4055.desc: "по контурам статуй пробежала лёгкая дрожь. Воздух наполнили гудение и свет. Яркое сияние вырвалось из тел Стражей, обрисовав под прозрачной кожей узлы электронной сети.\n\nС громким скрежетом Стражи сошли с постаментов и в ярости бросились на археологов. Расправившись с лагерем, они поднялись в воздух и взяли курс на ближайшее поселение. На площадке осталась лишь ранее скрытая под пьедесталами круглая дверь в земле."
 ancrel.4055.desc.phobe: "Стражи пробудились. Отряд инженеров был готов приступить к подрывным работам, но внезапно $ancrel.4055.desc$"
 ancrel.4055.desc.other: "Стражи пробудились. Отряд инженеров был готов приступить к разборке, но внезапно $ancrel.4055.desc$"
 ancrel.4055.a: "Уничтожьте автоматоны!"
 ancrel.4056.name: "Замершая вечность"
 ancrel.4056.desc: "Страж действительно скрывал за собой вход в многоярусную систему подземных тоннелей, уходящих глубоко под поверхность [event_target:sentinels_planet.GetPlanetMoon_rinfix&gen] [event_target:sentinels_planet.GetName]. Здесь, в величественных церемониальных покоях, представители разумной расы ранее обитавших на этой планете гуманоидов подвергались ритуальному очищению и отправлялись в последний путь. Незадолго до смерти они покидали свои тела и загружали оцифрованное сознание в виртуальное подобие рая, находящееся на единственном носителе.\n\nВ какой-то момент раса приняла решение навсегда уйти в виртуальный мир. Лишь немногие не пошли с ними, и их разум был загружен в Стражей, поставленных вечно стеречь это пристанище.\n\nВозможно, эта виртуальная симуляция может подбодрить народ. Её явно можно использовать для развлечения."
 ancrel.4056.a: "Уничтожьте инопланетян и откройте виртуальный мир для посетителей."
 ancrel.4056.b: "Виртуальные охотничьи угодья... Вот где настоящее развлечение."
 ancrel.4056.c: "Скопируйте технологию и оставьте инопланетян доживать свой век."
 ancrel.4056.d: "Мы будем их изучать. Где мы ещё найдём такой паноптикум?"
 ancrel.4057.name: "Победа над Стражами"
 ancrel.4057.desc: "Мы уничтожили последнего Стража. Он упал после удачного выстрела в живот, его ядро погасло, а тело окаменело. Статуя сжала в кулак ближайшего солдата и на остатках энергии взмолилась «дать им покоиться в мире». Затем глаза её опустели, и она застыла.\n\nПод статуей солдаты нашли подобие тайного хода, ранее сокрытого силовым полем Стража. Подробное исследование Стражей показало, что это не просто автоматоны, — в них содержатся оцифрованные души органических существ."
 ancrel.4057.a: "Запечатать вход"
 ancrel.4075.name: "Выжившие с [sentinels_planet.GetName&gen]"
 ancrel.4075.desc: "[sentinels_new_home.GetName] принимает у себя корабли с выжившими после геноцида на [sentinels_planet.GetName&prep]. Они чудом избежали смерти, скрывшись в неосвоенных землях, а затем Стражи вдруг просто исчезли. Вероятно, автоматоны, верившие, что они «освобождают нас от оков плоти» сочли свою работу выполненной и ушли.\n\nПосле их исчезновения открылся тайный ход, ведущий под землю. Ранее его скрывало силовое поле. Возможно, Стражи запечатали себя там."
 ancrel.4075.a: "Загляните под каждый камень."
 ancrel.4075.b: "Заройте вход."
 ancrel.4076.name: "Замершая вечность"
 ancrel.4076.desc: "Мы пробились через тайный ход на [event_target:sentinels_planet.GetPlanetMoon_rinfix&prep] [event_target:sentinels_planet.GetName]. За ним обнаружился недавно брошенный храмовый комплекс, в котором представители расы гуманоидов готовились отправиться в последний путь. В конце своего смертного существования они покидали тела, переселяясь в симуляцию рая под названием «Замершая вечность».\n\nВ какой-то момент было решено, что всё население должно перейти к цифровому существованию, и лишь немногие не приняли этого, оставшись охранять покой прочих. Разумы обречённых на вечную службу были загружены в тела роботов, и так появились Стражи.\n\nИ теперь бесследно исчезнувшие Стражи оставили нам прощальный подарок — носитель, на котором в оцифрованной вечности пребывает томящееся от скуки население [event_target:sentinels_planet.GetPlanetMoon_rinfix&gen] [event_target:sentinels_planet.GetName]. Оказывается, инопланетный рай — это бесконечная абстрактная настольная игра, в которой нужно захватить власти в галактике, собирая бобы."
 ancrel.4076.a: "Пусть займутся наукой."
 ancrel.4076.b: "Модифицировать «Замершую вечность» для развлечения."
 ancrel.4077.name: "Замершая вечность"
 ancrel.4077.desc.a: "Мы сделали это! Оцифрованное население «Замершей вечности» получило задание помогать учёным на [from.owner.capital_scope.GetName&prep]. Им почти не нужен отдых, и они счастливы от появления нового занятия.."
 ancrel.4077.desc.b: "Мы сделали это! Нам удалось перенастроить симуляцию «Замершей вечности», чтобы она лучше соответствовала предпочтениям нашего населения. Теперь все они могут жить в своих фантазиях вместе с оцифрованным населением «Замершей вечности». Скрываться больше необязательно! Это сильно укрепило их дух и снизило потребность в материальных предметах."
 ancrel.4058.desc: "Стражи пробудились. Отряд инженеров был готов приступить к осторожной разборке крылатых истуканов, но внезапно по телам статуй пробежала лёгкая дрожь. Воздух наполнили гудение и свет. Яркое сияние вырвалось из тел Стражей, обрисовав под прозрачной кожей узлы электронной сети.\n\nПрежде чем археологи успели понять, что происходит, статуи окружили отряд и накрыли его силовым полем. Они хотят с нами поговорить."
 ancrel.4058.a: "Выслушаем их."
 ancrel.4058.b: "Пусть замолчат навсегда!"
 ancrel.4059.name: "Бдительные стражи"
 ancrel.4059.desc: "§HСтраж со сломанным крылом поворачивается к другому Стражу и говорит.\n\n§!Дивена, прошу тебя, отпусти их. Я хочу освободиться из плена. Я потеряла счёт дням — как долго мы служили господам на этой земле, пока они блаженствовали у нас под ногами? Я жива и чувствую себя мёртвой, они мертвы и чувствуют себя живыми. Освободи меня.\n\n§HДивена смотрит на неё с отвращением.§!\n\nЭксцельсия, возьми себя в руки! Все, кого мы любим, живут в раю. Или ты забыла о нашем грехе? Мы поклялись вечно хранить их покой. В этом наше искупление.\n\n§HОна бросает взгляд на учёных.§!\n\n[Root.owner.GetSpeciesNamePlural], вы не способны нам навредить. Не мешайте нам, и мы будем вечно стеречь эту планету."
 ancrel.4059.a: "Кто... что вы такое?"
 ancrel.4059.a.response: "Мы стражи небесных врат, хранители бессмертия нашей расы."
 ancrel.4059.b: "Мы согласны принять вашу защиту."
 ancrel.4062.desc: "\n\n§HЭксцельсия подходит к археологам.§!\n\nПрошу! Умоляю, окончите мои страдания."
 ancrel.4059.e: "Нет. Ты нам нужна."
 ancrel.4059.f: "Хорошо, можешь идти."
 ancrel.4070.desc: "Спасибо."
 ancrel.4059.d: "Нам нужна эта земля..."
 ancrel.4059.c: "В раю?"
 ancrel.4059.c.response: "Да, я говорю о вечном блаженстве... Хотя вы наверняка представляете рай иначе, чем наши владыки. \n\n§HОна иронично приподнимает бровь.§!\n\nУ наших хозяев весьма изысканный вкус..."
 ancrel.4060.a.response: "Тогда ты умрёшь.\n\n§HДругие Стражи размахивают оружием, но Эксцельсия лишь улыбается, её лицо спокойно.§!"
 ancrel.4060.name: "Сообщение"
 ancrel.4060.desc: "Мы не позволим вам осквернить землю, укрывшую наших любимых. Пусть они покоятся с миром, а мы позаботимся о том, чтобы никто не смел угрожать им."
 ancrel.4060.a: "Вам придётся покинуть это место."
 ancrel.4060.b: "Нам пригодится ваша защита."
 ancrel.4060.b.response.tooltip: "Добавляет на планету оборонительную армию Стражей."
 ancrel.4061.name: "Вторая жизнь «Замершей вечности»"
 ancrel.4061.desc: "Вы скопировали «Замершую вечность» и приспособили её под свои нужды. Теперь жители наших планет могут реализовать себя в виртуальной реальности, почти мгновенно воплотив в жизнь любые фантазии. Это не только делает их счастливыми, но и снижает потребность в материальных благах.\n\nСоздатели оригинальной «Замершей вечности» представляли себе райскую жизнь несколько иначе. Эти гуманоидные инопланетяне заперты в бесконечной абстрактной настольной игре, участникам которой нужно покорить галактику, собирая бобы. Трудно сказать, насколько они довольны своей участью, но выражение их лиц при желании можно истолковать как радость."
 ancrel.4061.a: "Каждому своё..."
 ancrel.4063.name: "[sentinels_planet.GetPlanetMoon_rinfix&nom] [sentinels_planet.GetName] потеряна"
 ancrel.4063.desc: "Случилось немыслимое. Мы потеряли [sentinels_planet.GetName&acc]. Стражи обрушились на нас подобно яростному смерчу из крыльев и энергии. Бой с врагом, который не чувствует ран и не нуждается в отдыхе, не может быть честным."
 ancrel.4063.a: "Мы ещё вернёмся и заберём принадлежащее нам по праву."
 ancrel.4064.name: "[sentinels_planet.GetPlanetMoon_rinfix&nom] [sentinels_planet.GetName] освобождена"
 ancrel.4064.desc: "Стражи пали, и [sentinels_planet.GetPlanetMoon_rinfix&nom] [sentinels_planet.GetName] снова наша. Когда последний из автоматонов упал, и его ядро потухло, он на остатках энергии схватил ближайшего солдата и взмолился «дать им покоиться в мире». Затем он застыл, и глаза его опустели.\n\nПод статуей солдаты нашли подобие тайного хода, ранее сокрытого силовым полем Стража. Подробное исследование статуй показало, что это не просто автоматоны, — в них содержатся оцифрованные души органических существ.\n\nЧто бы ни скрывалось внизу, этот великий день не скоро забудут."
 ancrel.4064.a: "Исследовать вход."
 ancrel.4064.b: "Закопайте его. Наконец-то мы дома."
# Sentinels Random Events
 ancrel.4065.name: "Пропажа археолога"
 ancrel.4065.desc: "Куда-то [missing_archaeologist.GetAXX::пропал<end_a> ведущ<end_ii> учён<end_yi>] [missing_archaeologist.GetName]. На закате [missing_archaeologist.GetSheHe] [missing_archaeologist.GetAXX::покинул<end_a>] лагерь в поисках тихого местечка, где можно подумать о Стражах, и больше [missing_archaeologist.GetHerHis] никто не видел. В последние дни [missing_archaeologist.GetHerHis] беспокоила безопасность лагеря с учётом возрастающего количества инцидентов. Возможно, [missing_archaeologist.GetHerHis] уход является формой протеста."
 ancrel.4065.a: "Сложная ситуация."
 ancrel.4066.name: "Пропавший археолог"
 ancrel.4066.desc: "На краю обрыва, прямо над Стражами, найдено всё имущество [missing_archaeologist.GetAXX::пропавшего учёного|||fem:пропавшей учёной] по имени [missing_archaeologist.GetName]. Незаконченная ограда из палочек вокруг одного из Стражей свидетельствует о том, что что-то отвлекло [missing_archaeologist.GetHerHis]. В числе прочего обнаружен и Мыслезор, устройство, помогающее изолировать разум от сторонних помех.\n\nСломанные фонарик и сканер обнаружились под обломками крыла Стража. Сканер был модифицирован весьма необычным образом. Возможно, с его помощью нам удастся пробиться через защитный покров Стража.\n\nЕсли [missing_archaeologist.GetName] [missing_archaeologist.GetAXX::нуж<end_enna>] нам в добром здравии, то стоит выделить на [missing_archaeologist.GetHerHis] поиски дополнительные ресурсы, поскольку [missing_archaeologist.GetHerHis] шансы на выживание в необжитых землях тают с каждым днём."
 ancrel.4066.a: "Ни на чём не экономить."
 ancrel.4066.b: "Мы не станем тратить своё время на дезертиров."
 ancrel.4066.c: "Направить нескольких археологов на поиски."
 ancrel.4067.name: "Пропавший археолог найден"
 ancrel.4067.desc: "Пропавший археолог, [missing_archaeologist.GetName], [missing_archaeologist.GetAXX::найден<end_a>] под грудой камней — [missing_archaeologist.GetAXX::он<end_a> м<e_yo>ртв<end_aoy>]. Причиной смерти стала серьёзная травма головы. Кто-то постарался почтить [missing_archaeologist.GetHerHis] память, выложив небольшой круг из драгоценных камней."
 ancrel.4067.a: "Пусть покоится с миром."
 ancrel.4068.name: "Пропавший археолог найден"
 ancrel.4068.desc: "[missing_archaeologist.GetName] снова с нами. [missing_archaeologist.GetAXX::Пропавшего учёного|||fem:Пропавшую учёную] нашли без сознания и с серьёзными травмами в подлеске под скальным образованием. Под [missing_archaeologist.GetHerHis] рукой лежал покрытый [missing_archaeologist.GetBloodType&inst]. [missing_archaeologist.GetHerHisCap] тут же отправили в госпиталь.\n\nИ хотя [missing_archaeologist.GetHerHis] состояние стабилизировалось, из-за травмы мозга, полученной в результате удара сверху, [missing_archaeologist.GetSheHe] всё ещё страдает от потери памяти и ничего не помнит о ранении. в [missing_archaeologist.GetHerHis] теменной кости обнаружились осколки уникального сплава, из которого сделаны Стражи. Но [missing_archaeologist.GetSheHe] помнит лишь попытки скрыться от кого-то и спрятаться в ненадёжном укрытии. К счастью, в [missing_archaeologist.GetHerHis] записях содержится полезная информация."
 ancrel.4068.a: "Это дурной знак."
 ancrel.4078.name: "Пожар"
 ancrel.4078.desc: "Ночью, когда археологи мирно спали, в лагерном модуле снабжения вспыхнул пожар, оставив от запасов провизии пепел. Нет никаких следов, объясняющих причину возникновения пожара. К счастью, никто не пострадал, но археологи плохо работают на пустой желудок..."
 ancrel.4078.a: "Отправить припасы"
 ancrel.4078.b: "Настоящие [owner.GetSpeciesNamePlural] могут жить на подножном корме."

 the_evermore_modifier: "Низкосортные развлечения"
 the_evermore_modifier_desc: "«Замершая вечность», бывший виртуальный мир, где цифровые копии инопланетян наслаждались райским блаженством, был перепрограммирован и теперь развлекает наших граждан."
 the_evermore_evil_modifier: "$the_evermore_modifier$"
 the_evermore_evil_modifier_desc: "$the_evermore_modifier_desc$"
 study_the_sentinels_modifier: "Замершая вечность"
 study_the_sentinels_modifier_desc: "Все в «Замершей вечности» заперты в бесконечной абстрактной настольной игре, участникам которой нужно покорить галактику, собирая бобы. Этот виртуальный мир скучен, но служит полезным источником антропологических данных."
 sentinels_planet_modifier: "Бдительные стражи"
 sentinels_planet_modifier_desc: "Древние хранители присматривают за планетой, служа источником единства и духовности для населения."
 REPLICATE_THE_EVERMORE: "Скопировать «Замершую вечность»"
 REPLICATE_THE_EVERMORE_DESC: "Скопировав «Замершую вечность», мы создадим недорогой виртуальный курорт для наших граждан, а инопланетяне смогут и дальше наслаждаться своим цифровым раем."
 REPURPOSE_THE_EVERMORE: "Переделать «Замершую вечность»"
 REPURPOSE_THE_EVERMORE_DESC: "Мы не может обречь собственное население на вечный подсчёт бобов. Нужно переделать «Замершую вечность» в соответствии с нашим представлением об осмысленной деятельности."



 # "Trench World" Archaeological Site Reward Modifier
 modern_trench_war: "Современная окопная война"
 modern_trench_war_desc: "Археологические открытия на планете, пострадавшей от нападения огромных улиткоподобных существ, подали нашим стратегам идею использовать для защиты особенности ландшафта. Это должно снизить количество потерь во время защиты наших миров — даже если на них нападут гигантские слизняки!"

 # "Ebb & Flow" Archaeological Site Reward Modifier
 forced_mindfulness: "Принудительное спокойствие"
 forced_mindfulness_desc: "Оказавшись в гибельном лабиринте, полном вулканической лавы, команда археологов изобрела принципиально новый способ успокоительной медитации. Его фундаментальные принципы теперь широко применяются в нашем государстве."

 debug_subroutine: "Подпрограмма выявления ошибок" # Machine Empires
 debug_subroutine_desc: "В лабиринте, полном вулканической лавы, наши археологические устройства потеряли связь с сетью и перестали функционировать. За время простоя они выработали алгоритм, который позволяет подпрограмме выявления ошибок работать даже в спящем режиме. После восстановления связи он был интегрирован в общую систему."

 glory_to_the_many: "Торжество единомыслия" # Hive Mind Empires
 glory_to_the_many_desc: "Оказавшись в лабиринте, полном вулканической лавы, наша экспедиция потеряла связь с коллективным разумом. Это подвергло её болезненному осознанию собственной индивидуальности; последовавшее за ним чувство пугающего одиночества лишь укрепило нашу неприязнь к индивидуальным разумам."

 # "Sky Glow Hymn" Archaeological Site Reward Modifier
 anthem_of_aurora: "Гимн северного сияния"
 anthem_of_aurora_desc: "Научному подразделению удалось воспроизвести неземной «гимн» живого северного сияния. Это позволит нам оборудовать электростанции системой гармоничной стабилизации, чтобы повысить их мощность."

 ancrel.6500.name: "[planet.GetName]: захват реликвии"
 ancrel.6500.desc: "После захвата [planet.GetName&gen] оказалось, что в ходе боёв наши войска сумели отбить вражескую реликвию! Теперь §H[this.GetLastReceivedRelic]§! в безопасности, хотя [victim.GetName] вряд ли так просто смирится с этой потерей. Мы захватили артефакт в ходе эвакуации, когда прорыв линии фронта сорвал все планы защитников [planet.GetPlanetMoon_rinfix&gen].\n\nРеликвия будет доставлена в центральный архив на [Root.Capital.GetName&prep]."
 ancrel.6500.a: "[this.GetLastReceivedRelic] теперь принадлежит нам!"
 stole_relic: "§Y[victim.GetName]§! теряет реликвию §Y[this.GetLastReceivedRelic]§!"
 ancrel.6505.name: "[planet.GetName]: реликвия утеряна!"
 ancrel.6505.desc: "Наши невзгоды не закончились с потерей [planet.GetName&gen], нашей великой столицы. В ходе перестрелки рядом с центральным архивом был сбит корабль, перевозивший особые ценности. Когда-нибудь [From.GetName] ответит за свои злодеяния, но пока что §H[this.GetLastLostRelic]§! останется у наших врагов. \n\n[From.GetSpeciesNamePlural] забрали реликвию на [From.Capital.GetName&acc]."
 ancrel.6505.a: "[this.GetLastLostRelic] больше не принадлежит нам..."
 relic_lost: "Теперь §Y[this.GetLastLostRelic]§! принадлежит нации §Y[From.GetName]§!"

 ## The Library
 site_the_library: "Библиотека"
 site_the_library_intro: "Осколки стекла и металла покрывают эту безжизненную планету, что может свидетельствовать о случившейся в прошлом катастрофе."
 ancrel.12020.name: "Давно забытые руины"
 ancrel.12020.desc: "Мы обнаружили явные признаки того, что [From.Planet.GetName::<1> когда-то был<end_a> густо засел<end_yonna>]. Однако, что бы ни уничтожило местную цивилизацию, работа была проделана на совесть: нам удалось найти совсем немного полезного.\n\nНаши сканеры обнаружили несколько обширных пустот под поверхностью, которые в прошлом могли поддерживать жизнь. Возможно, там нам повезёт больше."
 ancrel.12025.name: "Библиотека"
 ancrel.12025.desc: "В ходе раскопок сети пещер на [From.Planet.GetName&prep] нам удалось найти хорошо сохранившиеся останки обширного подземного технологически развитого сообщества. Многие руины на удивление находятся в хорошем состоянии, и мы смогли отыскать объект, который наши [Owner.GetResearchers] описывают как «библиотеку» из зашифрованных кристаллов с данными. Будем надеяться, что эта находка позволит пролить свет на то, что здесь произошло."
 ancrel.12030.name: "Блуждающие тени"
 ancrel.12030.desc.base: "[Owner.GetTeamMember::Один <1>|||fem:Одна <1>] из команды, исследующей руины на [FromFrom.Planet.GetName&prep], загадочным образом [Owner.GetTeamMember::пропал<end_a>]. После недолгих поисков мы обнаружили явно [Root.Owner.GetSpeciesAdj&masc] [Owner.GetSpeciesRemnantName]."
 ancrel.12030.desc.normal: "$ancrel.12030.desc.base$ Наши [Owner.GetResearchers] не сомневаются, что эти останки принадлежат пропавшему члену экспедиции, но скорость разложения тела просто поражает. Рекомендуется соблюдать осторожность при проведении дальнейших исследований."
 ancrel.12030.desc.lithoid: "$ancrel.12030.desc.base$ Наши [Owner.GetResearchers] не сомневаются, что эти останки принадлежат пропавшему члену экспедиции, но причина смерти всё ещё не определена. Ясно лишь, что она была практически мгновенной. Рекомендуется соблюдать осторожность при проведении дальнейших исследований."
 ancrel.12030.desc.machine: "$ancrel.12030.desc.base$ Наши [Owner.GetResearchers] не сомневаются, что эти останки принадлежат пропавшему члену экспедиции, но скорость коррозии просто поражает. Рекомендуется соблюдать осторожность при проведении дальнейших исследований."
 ancrel.12035.name: "Проблемы в раю"
 ancrel.12035.desc: "По мере расшифровки данных с кристаллов из пещер [From.Planet.GetName&gen] фрагменты мозаики начинают складываться в картину непростой истории планеты.\n\nКогда-то она была столицей процветающей цивилизации, известной как Основание Илании. Под конец своего существования илании всё больше и больше отдавали предпочтение накоплению знаний в ущерб делам более материальным, вроде размножения. В результате численность их населения резко снизилась. Испугавшись этого, лидеры илании озаботились поисками технологии бессмертия. После этого записи становятся редкими и разрозненными, хотя они всё ещё предшествуют неизвестной катастрофе, загнавшей их цивилизацию под землю. Пока неясно, привели ли их поиски к каким-нибудь результатам."
 ancrel.12040.name: "Конец цивилизации"
 ancrel.12040.desc.base: "Наконец-то мы смогли понять, что вышло из попыток илании обрести бессмертие. Похоже, что вместо вечной жизни они породили страшную угрозу — рой микроорганизмов, способных быстро размножаться и практически мгновенно поглощать любую органику... что и произошло с пропавшим членом экспедиции.\n\nНачавшаяся катастрофа привела к гибели большей части населения. Выжившие разделились на две группы: одна из них, не желая покидать [From.Planet.GetName&acc], ушла под землю, воссоздав цивилизацию в изолированных пещерах вроде найденной нами. Однако в долгосрочной перспективе это решение оказалось нежизнеспособным, и со временем микроорганизм нашёл путь в их новый дом. Эти пещеры стали их гробницей.\n\nДругая группа предпочла изгнание и установила на планете карантин, полностью уничтожив поверхность мира и сделав его непригодным для жизни."
 ancrel.12040.desc.curators: "$ancrel.12040.desc.base$ С тех пор они живут в небольших анклавах, посвятив себя сохранению потерянных знаний своей цивилизации. Со временем от них произошёл §H[curator_enclave_country.GetName]§!."
 ancrel.12040.desc.meet_curators: "$ancrel.12040.desc.base$ С тех пор они живут в небольших анклавах, посвятив себя сохранению потерянных знаний своей цивилизации. Их судьба остаётся неизвестной, но один из кристаллов с данными указывает, что они направились в систему §H[curator_poi.GetName&gen]§!."
 ancrel.12040.desc.no_curators: "$ancrel.12040.desc.base$ Их дальнейшая судьба исчезает в веках, но, похоже, они намеревались посвятить отведённое им время сохранению потерянных знаний своей цивилизации."
 ancrel.12040.A: "Этот микроорганизм станет хорошим оружием."
 ancrel.12040.B: "Установить карантин и продолжить осторожное изучение."
 ancrel.12040.c.evopred: "Всепожирающие микроорганизмы? Пора им самим стать едой."

 ancient_glassed_planet: "Стеклянная планета"
 ancient_glassed_planet_desc: "В далёком прошлом биосфера этой планеты была полностью уничтожена, что убило на ней все формы жизни."

 killer_librarian_organism: "Микроб-убийца"
 killer_librarian_organism_desc: "Наши армии идут в бой, взяв на вооружение микроорганизм, способный со страшной скоростью поглощать живые ткани любого организма. Разумеется, они не могут обеспечить безопасность случайных наблюдателей..."

 find_the_curators_title: "Осколок осколка"
 find_the_curators_desc: "Наши исследования позволяют предположить, что остатки цивилизации, посвятившей себя накоплению знаний, нашли пристанище в системе §H[curator_poi.GetName&gen]§!."
 poi_curator_location: "Святилище"
 poi_curator_location_desc: "Мы считаем, что здесь нашла своё последнее пристанище цивилизация, посвятившая себя накоплению знаний."

 ## Ruined Station / Percussive Maintenance
 site_percussive_maintenance: "Разрушенная станция"
 site_percussive_maintenance_intro: "Большая станция, находящаяся в опасной близости от нейтронной звезды, служит источником странных сигналов. Хотя сейчас её орбита стабильна, станция носит явные следы износа. Следы от взрывов явно показывают, что в прошлом станция несколько раз подвергалась ракетным атакам."

 ancrel.12000.name: "Экспериментальное оружие"
 ancrel.12000.desc: "[Root.Leader.GetName] с командой исследователей ступили на борт и сумели восстановить подачу энергии к нескольким секциям. Похоже, эта станция была заселена всего за несколько веков до того, как [Root.Owner.GetSpeciesNamePlural] вышли в космос. На первый взгляд кажется, что в прошлом это была боевая станция, о чём свидетельствуют большие орудия, занимающие значительную часть пространства станции. Однако большинство уцелевших секций были заняты научными лабораториями. Вероятно, оружие было экспериментальным."
 ancrel.12005.name: "Отказ систем"
 ancrel.12005.desc: "[Root.Leader.GetName] [Root.Leader.GetAXX::заметил<end_a>], что неповреждённые системы станции слишком часто выходят из строя, и это нельзя списать на возраст станции.\n\nПосле очередного включения систем [Root.Leader.GetAXX::учён<end_yi>] издаёт страдальческий стон: «Что? Почему? Как?!» Поток звуков отчаяния и сомнения продолжался до тех пор, пока [Root.Leader.GetSheHe] не [Root.Leader.GetAXX::сда<end_lsya>]. «Похоже, вся эта станция держится на честном слове, — [Root.Leader.GetAXX::сказал<end_a>] [Root.Leader.GetSheHe]. — Удивительно, что она вообще работала»."
 ancrel.12005.desc.gestalt: "Мы заметили, что многие с виду неповреждённые системы на этой станции почему-то внезапно и полностью разрушаются — куда скорее, чем ожидалось, даже с учётом их возраста.\n\nПосле нескольких изнурительных попыток вновь активировать отказавшие системы [root.GetIndividualName::одного|||fem:одной] из наших инженерных [root.GetIndividualNamePlural&gen] [root.GetIndividualName::потерял<end_a>] рассудок и [root.GetIndividualName::приня<end_lsya>] без конца причитать, что «контекст превышает рациональные параметры». Это продолжалось, пока [root.GetIndividualName::несчастн<end_yi>] наконец не [root.GetIndividualName::отказа<end_lsya>] от дальнейших попыток ремонта. Нам пришлось сделать вывод, что программное обеспечение станции в принципе непригодно для использования. Мы не представляем себе, как эта станция вообще когда-то функционировала."
 ancrel.12005.A: "Продолжайте изучение с соблюдением всех предосторожностей."
 ancrel.12005.B: "Попробуйте что-нибудь пнуть."
 percussive_maintainer_tooltip: "§HСиловой ремонт§! увеличивает скорость исследования в §Hархеологии§! и §Hвычислительной технике§!, уменьшая максимальный §Hуровень навыка§! на §R-1§!."
 ancrel.12010.name: "Рударийский гамбит"
 ancrel.12010.desc: "Несмотря на частые отключения электроэнергии, [Root.Leader.GetName] [Root.Leader.GetAXX::доби<end_lsya>] значительного прогресса в изучении назначения станции. Судя по записям, её создатели, рудари, вели долгую борьбу с кровожадной расой, известной как погг-мори. И рудари проигрывали. В отчаянной попытке переломить ход конфликта радикальная группа политиков-рудари решила, что единственный шанс на выживание может дать только полное уничтожение врага. Будучи не в силах разбить флотилии погг-мори традиционными методами, они создали сверхсекретный проект лазерного оружия, способного собирать энергию звёзд и атаковать цели в других системах. Но несмотря на значительные ресурсы, выделенные на создание оружия, проект был создан наспех, а работы велись в условиях постоянной угрозы обнаружения врагами или своими же соотечественниками, выступавшими против подобных мер."
 ancrel.12010.A: "Звучит рискованно..."
 ancrel.12015.name: "Крах мечты"
 ancrel.12015.desc: "[Root.Leader.GetName] [Root.Leader.GetAXX::обнаружил<end_a>] личные записи ведущего учёного рудари, представляющие собой бесконечный поток жалоб на невозможные требования к проекту и неуклонное снижение качества и нормативов техники безопасности. «На тесты нет времени, — гласит одна из последних записей. — Это последний гамбит моего народа, и враг уже на пороге. Остаётся надеяться, что наши усилия окупят себя. Они уже идут».\n\nСудя по записям, через несколько дней должен был состояться тест оружия, после чего записи прерываются. Похоже, супероружие сумело уничтожить лишь саму станцию. По всей видимости, рудари унесли с собой в могилу тайну его местоположения, благодаря чему мы нашли то, что от него осталось.\n\nИз-за состояния программного обеспечения и станции в целом попытка воссоздать оружие и завершить проект была бы слишком рискованной. Однако ряд инновационных идей, использованных при создании «Лазера смерти» обеспечил наших экспертов по оружию ценной информацией."
 ancrel.12015.A: "Им не повезло..."
 ancrel.12015.A.mat: "Памятник неумелому планированию проекта."
 ancrel.12015.A.phobe: "Их неудача станет благом для нас."
 ancrel.12015.A.devourer: "Жаль, теперь мы не узнаем, каковы они на вкус."
 ancrel.12015.A.machine: "Вот чем оборачиваются причуды нетерпеливых смертных."

 rudari_death_laser: "Лазер смерти рудари"
 rudari_death_laser_desc: "Перед лицом неминуемой гибели своей цивилизации от рук наступающего врага рудари попытались создать лазерное оружие, способное вести огонь по целям в других системах. Несмотря на неудачу, их исследования оказались крайне полезны для наших специалистов по оружию."

 abandoned_weapon_station: "Заброшенная военная станция"
 abandoned_weapon_station_desc: "Заброшенная военная станция обращается вокруг звезды [star.GetName] по близкой орбите."

 ancrel.12060.name: "Система [From.GetName&gen]"
 ancrel.12060.desc: "Систему [From.GetName&gen] окутывает зловещее сияние. [Root.GetName::<1> вош<end_yolla>] в сектор галактики, куда уже тысячи, если не миллионы лет не заглядывала ни одна цивилизация... Если его вообще посещали разумные существа.\n\nНо что это? Наши сенсоры обнаружили следы энергии! Большая их часть сосредоточена возле первой планеты в системе. Близость к нейтронной звезде делает маловероятным наличие на ней хоть какой-нибудь жизни, но количество следов множится. Они приближаются к [Root.GetName&dat], заряжая оружие!"
 ancrel.12065.name: "Победа в системе [fromfrom.System.GetName&gen]"
 ancrel.12065.desc: "Мы одержали верх над защитниками системы [fromfrom.System.GetName&gen]. Система представляет собой любопытное зрелище: в ней осталось очень мало твёрдой материи — даже её астероидные пояса изрядно прорежены, как будто в них велась интенсивная добыча полезных ископаемых. Вокруг звезды через равные промежутки времени размещена серия крупных конструкций, а одна из планет, похоже, искусственного происхождения. Наши приборы регистрируют исходящие от неё энергетические сигналы высокой мощности. Если мы хотим получить ответы, их предстоит искать там."

 site_ancient_robot_world: "Древний мир роботов"
 site_ancient_robot_world_desc: "Единственная планета в системе [From.Planet.System.GetName&gen] кишит дронами. Они продолжают работу, не обращая на нас ни малейшего внимания. Если мы хотим узнать больше об этой любопытной системе, то ответы следует искать там."
 ancrel.12070.name: "Изобилие искусственной жизни"
 ancrel.12070.desc: "Наши [Owner.GetResearchers] сообщают, что на планете, которую они окрестили §YТерминалом наблюдения§!, жизни никогда не было. Но активность на её поверхности не прекращается. Вся она плотно застроена массивными искусственными сооружениями. Расположенные на голом фундаменте упорядоченными рядами цеха покрывают почти три четверти планеты. Их обслуживают миллиарды автоматических дронов, которые выполняют самые разные задачи — от уборки помещений до запуска сложнейших сборочных линий.\n\nПри этом их конечная цель остаётся неизвестной. Наши [Owner.GetResearchers] начали готовить полевую экспедицию."
 ancrel.12075.name: "Исследование дронов"
 ancrel.12075.desc: "Наши [Owner.GetResearchers] обнаружили, что дроны на планете игнорируют их присутствие и продолжают работу, даже когда исследователи ходят среди них. Все усилия установить контакт с дронами не увенчались успехом, равно как и попытка помешать им: когда [Owner.GetResearchers] преградили им путь, дроны просто проехались по ним, причинив травмы разной степени тяжести.\n\nПосле этого инцидента [Owner.GetResearchers] переключили своё внимание на программу, которая руководит действиями машин. Анализ перехваченных сигналов позволяет предположить, что ими всеми управляет одна система, однако сигналы тщательно зашифрованы и делать дальнейшие выводы пока рано."
 ancrel.12080.name: "Исследование системы"
 ancrel.12080.desc: "Пока [Owner.GetResearchers] работали на планете, другая команда изучала множество объектов, разбросанных по всей системе. Всего их более десяти тысяч, и почти все представляют собой исправные устройства цилиндрической формы, передающие в направлении планеты некий сигнал. Учитывая их конструкцию и тот факт, что все они направлены на разные точки нашей галактики, можно предположить, что это абсурдно огромный массив датчиков. Но кто мог его построить?"
 ancrel.12085.name: "Искусство фишинга"
 ancrel.12085.desc: "Наши [Owner.GetResearchers] решились на смелый шаг: они улучили момент, когда рядом не было ни одного дрона, и внедрили в терминал доступа к центральному компьютеру планеты шпионскую программу. Вмешательство прошло незамеченным, и им удалось установить, что дронами управляет сложная система, быть может, технологически превосходящая даже наши собственные, но полностью лишённая каких бы то ни было средств защиты. Похоже, её создатели решили, что наличия на орбите вооружённого флота будет достаточно. Тем не менее масштаб планетарной сети поистине огромен, и даже эта характеристика кажется грубым преуменьшением. Понадобится время, чтобы изучить её и сделать выводы."
 ancrel.12090.name: "Суперкомпьютер слежения"
 ancrel.12090.desc: "Похоже, что суперкомпьютер в системе $NAME_Ultima_Vigilis$ гораздо старше, чем мы можем представить. Полученные в ходе взлома данные не позволяют установить личность или намерения его создателей, но мы выяснили, что они прибыли сюда не менее 1.2 миллиарда лет назад, установили наблюдательный пост для слежения за галактикой и покинули систему.\n\nЭто невероятно, но она продолжает работать даже спустя всё это время: разбросанные по всей системе устройства являются высокочувствительными датчиками. Они транслируют показания на планету, где суперкомпьютер преобразует их в информацию, которую хранят и записывают дроны. Недостаток пространства и ресурсов вынудил их разработать революционные методы сжатия данных: массивные строения на поверхности планеты хранят в себе всю информацию, которую им удалось собрать за это время. Увы, мы не можем подтвердить эту гипотезу, так как наших способностей недостаточно, чтобы разархивировать эти данные.\n\nВесьма настораживает тот факт, что эта система даже сейчас транслирует поток избранных данных в пустое пространство. Можно ли предположить, что за давностью лет получателей уже нет в живых? Так или иначе, наши программы позволяют установить контроль над дронами. Мы можем делать с системой всё, что захотим, — если осмелимся."
 ancrel.12090.A: "Мы можем интегрировать мир в нашу операционную систему."
 ancrel.12090.B: "Пусть продолжают — мы будем копировать их поток данных."
 ancrel.12090.C: "Распределим дронов по нашим колониям."
 ancrel.12090.C.machine.tooltip: "§G8K§! £pop£ §Hпоселений машин§! будут распределены по нашим колониям."
 ancrel.12090.C.mechanical.tooltip: "§G8K§! £pop£ §Hмеханических поселений§! будут распределены по нашим колониям."
 ancrel.12090.D: "Это огромный источник сплавов!"
 ancrel.12090.E: "Столь отлаженной сети легко найти применение."
 ancrel.12090.E.tooltip: "Система §Y[From.Planet.System.GetName&gen]§! перейдёт под контроль §Yмашинного разума§!, который станет нашим подданным. Его столица, §Y[From.Planet.GetName]§!, станет §Yмиром машин§! с §G8K§! £pop£ §Hпоселений машин§!."

 ancrel.12095.desc: "«Ах вы безрассудные...»\n\n§BСигнал искажается, и разобрать последовавшие за этими словами шумы решительно невозможно.§!\n\n«Вы не подумали, что кто-то мог принимать сигнал, который вы так бесцеремонно оборвали? Что ж, вы доказали, что ничем не отличаетесь от агрессивных вредителей... А значит, мы отправляем §RДЕЗИНСЕКТОРОВ§!. Готовьтесь к смерти»."
 ancrel.12095.A: "Мы выживем."
 ancrel.12095.B: "Разорвать связь."
 ancrel.12095.tooltip: "§RСкоро может случиться что-то плохое...§!"
 ancrel.12100.A: "Что?!"

 ancrel.8200.name: "Взрывная декомпрессия"
 ancrel.8200.intro: "Во время исследования станции в системе [System.GetName&gen] наша команда случайно повредила целостность одной из секций, что привело к взрывной декомпрессии."
 ancrel.8200.desc: "$ancrel.8200.intro$\n\nВсё произошло слишком быстро — спустя всего пару мгновений §H[dead_scientist.GetName]§! и другие [Root.Owner.GetArchaeologistPlural] оказались выброшены в космос, где их ждала гибель."
 ancrel.8201.desc: "$ancrel.8200.intro$\n\nСпустя мгновение [Root.Owner.GetArchaeologistPlural] оказались выброшены в космос, где их ждала смерть. К счастью, руководитель экспедиции §H[Root.GetLeaderName]§! [Root.Leader.GetAXX::был<end_a>] в другой части станции, но происшествие всё равно сильно повлияло на ход исследований."
 ancrel.8202.desc: "$ancrel.8200.intro$\n\nК счастью, никто не погиб во время инцидента, и наша команда успела скрыться в неповреждённых частях станции. Похоже, что поломок ценного оборудования также удалось избежать, поэтому исследовательские работы можно возобновить без особых проблем."
 ancrel.8202.desc.robot: "$ancrel.8200.intro$\n\nК счастью, [Owner.GetArchaeologistPlural] не пострадали, поскольку их строение позволяет какое-то время функционировать в космосе. Благодаря этому работы продолжатся без особых проблем."
 ancrel.8203.desc: "$ancrel.8200.intro$\n\nК счастью, никто не погиб во время инцидента, и наша команда успела скрыться в неповреждённых частях станции. Однако декомпрессия повредила несколько рабочих консолей, и их ремонт дорого нам обойдётся."
 ancrel.8203.desc.robot: "$ancrel.8200.intro$\n\nК счастью, [Owner.GetArchaeologistPlural] не пострадали, поскольку их строение позволяет какое-то время функционировать в космосе. Однако декомпрессия повредила несколько рабочих консолей, и их ремонт дорого нам обойдётся."
 ancrel.8203.A: "Мы предоставим им необходимое финансирование."
 ancrel.8203.B: "Это задержит нас."
 ancrel.8210.1.desc: "Наше дальнейшее исследование остатков станции в системе [fromfrom.planet.system.GetName&gen] позволило отрыть небольшой тайник с древними предметами. Главный археолог [root.leader.GetName] [root.leader.GetAXX::сообщил<end_a>], что среди них есть несколько малых артефактов."
 ancrel.8210.2.desc: "Когда наши [Root.Owner.GetArchaeologistPlural] изучали одну из консолей, часть стен рядом сними внезапно обрушилась. Но это оказалось удачей для нас, поскольку за рухнувшими переборками обнаружилось скрытое помещение с несколькими малыми артефактами."

 ancrel.8215.name: "Блокировка системы"
 ancrel.8215.desc: "Ковыряясь в электронике станции, наши [Owner.GetArchaeologistPlural] случайно запустили ещё рабочую систему безопасности, оставленную создателями станции. В результате наша команда оказалась надолго отрезана от большей части систем станции, пока ей не удалось разработать меры противодействия."
 ancrel.kick_it: "Попробуйте что-нибудь пнуть."

 site_polaris_seed_vault: "Последняя надежда"
 polaris_seed_vault_desc: "В оковах крошечной полярной шапки [From.Planet.GetName&gen], дрейфующей посреди кристально чистого океана, обнаружилось искусственное строение.\n\nДля раскопок этого сооружения потребуется команда."

 ancrel.13000.name: "Холодный приём"
 ancrel.13000.desc: "Уничтожив остатки агрессоров в системе Полярной звезды, наши корабли просканировали систему перед возвращением на базу и нашли кое-то интересное. На второй от солнца планете, обозначенной как Полярная звезда II, наши сенсоры обнаружили искусственные сооружения из тяжёлых металлов. Что интересно, только одна из этих структур дрейфует на волнах планетарного океана, а остальные скрыты под поверхностью. Мы подозреваем, что за их созданием стоят инопланетяне."

 ancrel.13005.name: "Айсберг"
 ancrel.13005.desc: "Непосредственно внутри самого айсберга находится громоздкий чёрный куб, выполненный из тех же материалов, что и обломки космического флота на орбите. Наши специалисты-гляциологи заявляют, что, по результатам анализов, айсберг сформировался по меньшей мере несколько тысяч лет назад. Впрочем, «из-за особенностей атмосферы другой планеты сложно утверждать наверняка». Сканирование внутренностей структуры показывает наличие большого числа жизненных форм, поэтому использовать грубую силу не рекомендуется.\n\nКоманде придётся пробираться по ледяным скалам до предположительного входа в строение."
 acnrel.13005.a: "Опускаемся."

 ancrel.13010.name: "Ледяные врата"
 ancrel.13010.desc: "Мы разбили лагерь у предполагаемого входа в сооружение на [From.Planet.GetName&prep]. Мы успели обнаружить что-то вроде надписей на стенах строения. Теперь нам предстоит долгий и кропотливый процесс: открыть двери так, чтобы не повредить то, что находится внутри строения. В то же время наши ксенолингвисты пытаются расшифровать мёртвый инопланетный язык надписей."

 ancrel.13015.name: "Разграбление могил"
 ancrel.13015.desc: "Час настал, и мы ступили под своды вскрытого чёрного сооружения, обозначенного как «Хранилище», исходя из предварительного перевода надписей на стенах. Создатели этого хранилища, полярианцы, попытались скрыть здесь свои сокровища. По ту сторону дверей нас ждёт, если верить сенсорам, контролируемая среда, воздух в которой аналогичен воздуху снаружи с несколько меньшей долей углекислого газа."

 ancrel.13020.name: "Сокровище"
 ancrel.13020.desc: "Древние семена! Зародыши растений — вот что полярианцы спрятали в этом хранилище. Дальнейший перевод позволил понять, что эти пришельцы с удивительным упорством продолжали наполнять атмосферу своего мира избытком диоксида углерода. Когда изменения в атмосфере стали необратимы, древние обитатели этого мира взяли все доступные растения, не способные выжить в новых условиях, и собрали их в этом месте.\n\nКогда-то весь этот мир был покрыт льдом, а сейчас остался лишь этот одинокий айсберг. Но усилия древней цивилизации не были напрасны. Благодаря полноценному каталогу всех растений нашим учёным будет проще вести дальнейшие исследования биологических материалов."
 ancrel.13020.a: "Отправьте эти образцы нашим учёным."
 ancrel.13020.b.evopred: "Занесены в каталог и готовы к клонированию? Будто нас и ждали."

 ancrel.13025.desc: "Микроорганизмы! Все болезнетворные и полезные бактерии. Все эукариоты и прокариоты. Все они заперты в этом сложном хранилище, рассортированы и подписаны: вот что за сокровище полярианцы спрятали в этом хранилище. Дальнейший перевод позволил понять, что эти пришельцы с удивительным упорством продолжали наполнять атмосферу своего мира избытком диоксида углерода. Когда изменения в атмосфере стали необратимы, древние обитатели этого мира собрали все микроорганизмы, не способные выжить в новых условиях, и собрали их в этом месте.\n\nКогда-то весь этот мир был покрыт льдом, а сейчас остался лишь этот одинокий айсберг. Но усилия древней цивилизации не были напрасны. Благодаря полноценному каталогу всех микробов наши [Root.Owner.GetScientistPlural&nom] смогут без проблем выращивать новые и улучшенные колонии на новых мирах."
 ancrel.13025.desc.machine: "Микроорганизмы. Все болезнетворные и полезные бактерии. Все эукариоты и прокариоты. Рассортированы и подписаны: вот что за сокровище полярианцы спрятали в этом хранилище. Дальнейший перевод позволил понять, что эти пришельцы с удивительным упорством продолжали наполнять атмосферу своего мира избытком диоксида углерода. Когда изменения в атмосфере стали необратимы, древние обитатели этого мира взяли все микроорганизмы, не способные выжить в новых условиях, и собрали их в этом месте.\n\nКогда-то весь этот мир был покрыт льдом, а сейчас остался лишь этот одинокий айсберг. Но усилия древней цивилизации не были напрасны, и благодаря этой коллекции нам будет проще извлечь важную информацию."

 ancrel.13030.name: "Тревожные видения"
 ancrel.13030.desc: "Три ночи назад главный археолог [From.Leader.GetName] [From.Leader.GetAXX::доложил<end_a>] о тревожных видениях и с тех пор находится под замком в своей комнате. [From.Leader.GetName] [From.Leader.GetAXX::заявил<end_a>], источник этих видений находится здесь, с нами..."
 ancrel.13030.a: "Это дурной знак."

 polaris_biology_modifier: "Изучение полярианских семян"
 polaris_habitability_modifier: "Изучение полярианских микроорганизмов"
 d_polaris_city: "Древний затонувший город"
 d_polaris_city_desc: "Когда-то города полярианцев покрывали застывший океан, а затем их ледяное основание растаяло."

 #Fumongus
 site_fumongus_dig: "Пересыхание"
 site_fumongus_intro: "Мы нашли следы воды по всему миру. Судя по всему, она должна быть там. Температура допускает наличие жидкой воды, и у мира даже есть атмосфера, хоть и довольно тонкая. И несмотря на это, здесь всё пересохло, а остатки растительности увяли.\n\nКроме того, сканирование обнаружило следы другой космической цивилизации на этой планете. Перед командой археологов стоят две задачи: узнать, что случилось с водой, и понять, что здесь делала космическая цивилизация. Большинство гипотез уже связывает эти два происшествия друг с другом, и отдельные участники команды начинают подозревать, что мы имеем дело с «похитителями воды»."

 #Random Event - Fungal zombies
 ancrel.8300.intro: "В ходе экспедиции на [From.Planet.GetName&prep] наши [Root.Owner.GetArchaeologistPlural] потревожили разлагающиеся туши местной фауны, которая попала под влияние некоего паразитического грибка. Эти грибные зомби тотчас же атаковали нас. По всей видимости, их привлекает вода в нашем лагере и в наших телах."
 ancrel.8300.critical: "§H[dead_scientist.GetName]§! погибает от нападения зомби, и лишь после этого охране удаётся сжечь их. От учёного остался лишь высушенный труп. "
 ancrel.8300.failure: "Некоторые [Root.Owner.GetArchaeologistPlural] погибли от рук зомби прежде, чем §H[Root.GetLeaderName]§! [Root.Leader.GetAXX::остановил<end_a>] их. Высушенные тела нашей команды распались на части, когда мы попытались забрать их."
 ancrel.8300.success: "К счастью, §H[Root.GetLeaderName]§! и несколько охранников нейтрализовали зомби, прежде чем им удалось кому-то навредить."
 ancrel.8300.pay: "Зомби удалось задержать, но они перекрыли нам путь. Возможно, нам удастся выманить их большим количеством воды."
 ancrel.8300.name: "Грибные зомби"
 ancrel.8300.desc: "$ancrel.8300.intro$\n\n$ancrel.8300.critical$"
 ancrel.8305.desc: "$ancrel.8300.intro$\n\n$ancrel.8300.failure$"
 ancrel.8310.desc: "$ancrel.8300.intro$\n\n$ancrel.8300.success$"
 ancrel.8315.desc: "$ancrel.8300.intro$\n\n$ancrel.8300.pay$"
 ancrel.8315.a: "Действуйте."
 ancrel.8315.b: "Ищите обходной путь."

 #Digsite Chapters

 ancrel.13100.name: "Собиратели воды"
 ancrel.13100.desc: "Обнаружение на [From.Planet.GetName&prep] обширных каньонов, заполненных грибами, позволило нам нащупать путь к разгадке. Вода находится внутри грибов. Похоже, эти грибы протянулись под значительной частью поверхности, и все они соединены с общим мицелием, что технически делает их единым организмом, одним из самых больших, что нам доводилось видеть. Некоторые члены команды уже прозвали его мегагрибом.\n\nПохоже, эти грибы подверглись генетическим изменениям и полностью захватили свою старую экосистему, а беспрепятственный стремительный рост позволил им поглотить большую часть воды. После этого грибы впали в своего рода спячку, во время которой большая часть гриба остаётся живой. Вода же распределена по всему организму. "
 ancrel.13105.name: "Заросший бункер"
 ancrel.13105.desc: "В глубине грибных лесов, заполнивших каньоны [From.Planet.GetName&gen], мы обнаружили некий бункер, заросший грибами. Команда полагает, что бункер построила та же раса, что изменила местные грибы.\n\nМногие секции бункера обрушились, и оборудование уже не подлежит восстановлению. Однако нам удалось определить несколько запечатанных комнат, в которых можно найти полезные материалы. Примечательно, что в бункере нет инопланетных останков. Возможно, строители бункера покинули его, или же местная природа поглотила их останки. "
 ancrel.13110.name: "Грибной заговор"
 ancrel.13110.desc: "Бункер на [From.Planet.GetName&prep] использовался для защиты компьютеров, часть из которых напрямую подсоединена к грибу. К счастью, нам удалось запустить несколько терминалов и баз данных.\n\nНа взлом шифровки и перевод языка уйдёт какое-то время, и команда попросила, чтобы к ним прибыли наши лучшие [Root.Owner.GetLinguists]."
 ancrel.13115.name: "Из гриба в код"
 ancrel.13115.desc: "Мы обнаружили важные сведения в базах данных бункера на [From.Planet.GetName&prep]. Судя по всему, это был пост прослушивания. Очевидно, пришельцы нашли способ расшифровать сигналы гриба и преобразовать их в разведданные.\n\nМы не понимаем, как такое возможно, но в настоящий момент команда пытается доставить воду с ближайших ледяных астероидов, чтобы пробудить мегагриб и узнать, передаёт ли он какие-либо данные."
 ancrel.13120.name: "Конец засухи"
 ancrel.13120.desc: "Грибы [From.Planet.GetName&gen] вновь ожили. С помощью нескольких кораблей мы сумели притянуть ледяные астероиды, а затем обрушить их осколки в различных частях планеты. На таяние ушло много времени, но наши труды наконец-то начинают приносить свои результаты.\n\nПосле этого компьютеры начали получать крупицы информации, которые казались нам случайными, пока мы не узнали в них события, происходящие на нашей родной планете. В сотрудничестве с исследователями [Root.Owner.Capital.GetName&gen] был проведён ряд экспериментов, единственным закономерным выводом которых стало открытие, что гриб каким-то образом обладает частичными сведениями о том, что происходит на других планетах. Хотя сейчас полученные данные не представляют особой пользы, дальнейшие усилия по возрождению гриба должны принести больше результатов."

 #Final event

 ancrel.13135.intro: "Грибной прослушивающий массив полностью работоспособен. Мы доставили значительное количество воды с орбиты, чтобы утолить жажду гриба, а компьютерные системы получили ряд усовершенствований."
 ancrel.13135.mid: "На удивление, количество сигналов необычайно мало для объёмов передаваемой в них информации. Наиболее вероятной кажется теория, что мегагриб существует в нескольких измерениях, где расстояния воспринимаются иначе.\nВ любом случае мегагриб поддерживает контакты со своими потомками по всей галактике, и эти малые колонии могут передавать данные, которые мы можем обрабатывать."

 ancrel.13135.name: "Мегагриб вновь слушает"
 ancrel.13135.desc: "$ancrel.13135.intro$\n\nНо некоторые вопросы остаются без ответа, и мы до сих пор не знаем, как грибу удаётся получать такое количество информации со всей галактики. $ancrel.13135.mid$\n\nТеперь, когда сеть снова работает, нам остаётся решить, использовать ли её для наблюдения."
 ancrel.13135.a: "Приступайте к наблюдениям."
 ancrel.13135.a.evopred: "Понаблюдайте за ним. Может, мы сможем так же."
 ancrel.13135.b: "Оставьте грибы в покое."

 #Final event variation

 ancrel.13130.name: "Бойся старого гриба"
 ancrel.13130.desc: "$ancrel.13135.intro$\n\nИ всё же мы ещё многого не знаем о загадочной сети. $ancrel.13135.mid$ Но у кого ещё есть доступ? Многие данные нам так и не удалось связать с системами в нашей галактики. Пессимистично настроенные [Root.Owner.GetScientistPlural&nom] считают, что не только мы ведём прослушку, и активация сети только что выдала наше местоположение всякому, кто использует её.\n\nУчитывая, что мы до сих пор многого не знаем о мегагрибе и о предыдущей расе, использовавшей его, возможно, стоит оставить гриб в покое..."
 ancrel.13130.a: "Глупцы. Воспользуйтесь им."
 ancrel.13130.b: "Оставьте грибы в покое."
