 dyson_sphere_0_MEGASTRUCTURE_DETAILS: "§Y$dyson_sphere_5$§! полностью окружает звезду, преобразуя всё излучение звезды в £energy£ энергокредиты."
 dyson_sphere_0_CONSTRUCTION_INFO_DELAYED: "§R$dyson_sphere_5$ полностью закроет солнце, превратив все планеты системы в безжизненные или замёрзшие миры.\n\nТерраформирование в таких системах невозможно.§!"
 dyson_sphere_0: "Основа сферы Дайсона"
 dyson_sphere_0_DESC: "Эта строительная станция служит базой для будущего строительства сферы Дайсона."
 dyson_sphere_1: "Каркас сферы Дайсона"
 dyson_sphere_1_DESC: "Каркас является основой для будущей сферы Дайсона и не производит никакой энергии."
 dyson_sphere_2: "Сфера Дайсона: начальная"
 dyson_sphere_2_DESC: "Частичная сфера Дайсона, работающая с эффективностью §Y25%§!."
 dyson_sphere_3:1"Сфера Дайсона: промежуточная"
 dyson_sphere_3_DESC: "Частичная сфера Дайсона, работающая с эффективностью §Y50%§!."
 dyson_sphere_4: "Сфера Дайсона: почти полная"
 dyson_sphere_4_DESC: "Частичная сфера Дайсона, работающая с эффективностью §Y75%§!."
 dyson_sphere_5: "Сфера Дайсона"
 dyson_sphere_5_DESC: "Завершённая сфера Дайсона, работающая с эффективностью §G100%§!."
