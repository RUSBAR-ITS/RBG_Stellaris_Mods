 utopia.2010.name: "Разрушенная сфера Дайсона"
 utopia.2010.a.desc: "Мы обнаружили руины огромного космического сооружения, окружающего главную звезду системы [dyson_system.GetName&gen]. Наши учёные выдвинули теорию, что, возможно, это когда-то была функционирующая §Hсфера Дайсона§! — мегасооружение, предназначенное для использования энергии звезды. Очевидно, она больше не работает, так как корпус серьёзно повреждён неизвестным типом энергетического оружия.\n\n$utopia.2010.c.desc$"
 utopia.2010.b.desc: "Мы обнаружили остатки сферы Дайсона в системе [dyson_system.GetName&gen]. Очевидно, она больше не работает, так как корпус серьёзно повреждён неизвестным типом энергетического оружия.\n\n$utopia.2010.c.desc$"
 utopia.2010.c.desc: "Также нужно отметить наличие обширных мусорных полей вокруг сферы. Хотя само мегасооружение древнее, но большая часть мусора в системе, похоже, значительно моложе. В основном он, видимо, возник в какой-то более ранний момент галактической истории в результате безжалостного столкновения двух боевых флотилий, которые, возможно, участвовали в войне для того, чтобы решить, кому достанется разрушенная сфера."
 utopia.2010.a: "С точки зрения функциональности эта сфера похожа на нашу."
 utopia.2011.name: "Сфера Дайсона восстановлена"
 utopia.2011.desc: "Мы успешно починили разрушенную сферу Дайсона в системе [From.GetName&gen]. Содержимое обширных мусорных полей, имеющихся в системе, было собрано для использования в ремонтных работах, что позволило снизить материальные затраты и устранить потенциальную навигационную опасность для рабочих бригад.\n\nЭто грандиозное мегасооружение теперь полностью работоспособно и впервые за многие тысячелетия снова производит огромное количество энергии."
 utopia.2012.name: "Разрушенный научный комплекс"
 utopia.2012.desc: "В системе [nexus_system.GetName&gen] обнаружены разрушенные останки колоссального космического объекта. Похоже, когда-то он использовался как крупный §Hнаучный комплекс§!. Несмотря на то, что объект покинут многие тысячелетия назад, его корпус по-прежнему в целом не повреждён."
 utopia.2012.a: "Концепция напоминает наш собственный научный комплекс."
 utopia.2013.name: "Научный комплекс восстановлен"
 utopia.2013.desc: "Покинутый научный комплекс в системе [From.GetName&gen] полностью отремонтирован и укомплектован персоналом из самых видных учёных [Root.GetName&gen]. Как, без сомнения, и задумывалось его создателями, это мегасооружение теперь будет использоваться для решения научных задач нашего времени."
 utopia.2014.name: "Разрушенный дозорный комплекс"
 utopia.2014.desc: "В какой-то момент галактической истории в системе [sentry_system.GetName&gen], очевидно, существовала обширная орбитальная инфраструктура невероятных масштабов, которая с тех пор систематически разрушалась. На геостационарных орбитах большинства планетарных тел системы есть крупные скопления мусора, в том числе массивные остовы нескольких космических станций.\n\nКрупнейший из них представляет собой колоссальный §Hдозорный комплекс§!. Наше первоначальное сканирование показывает, что в рабочем состоянии датчики этого комплекса были настолько мощными, что охватывали всю галактику, выдавая результаты в реальном времени."
 utopia.2014.a: "У нас уже один такой есть."
 utopia.2015.name: "Дозорный комплекс восстановлен"
 utopia.2015.desc: "Было нелегко, но нашим инженерам удалось восстановить разрушенный дозорный комплекс в системе [From.GetName&gen]. Корпуса других станций и окружавший их мусор были переработаны в строительный материал в процессе восстановления.\n\nВпервые за многие тысячелетия слышится гудение работающего комплекса. Его мощные антенны снова могут чётко показать, что происходит на другом краю галактики."

 utopia.2016.name: "Разрушенный мир-кольцо"
 utopia.2016.desc: "Разбитые остатки мира-кольца окружают звезду системы [ring_system.GetName&gen]. Все планетарные тела, которые когда-то могли здесь существовать, вероятно, были использованы в качестве материалов при строительстве этого мегасооружения.\n\nНикаких намёков на то, кто первоначально построил это чудо техники, не найдено, но, должно быть, это была очень развитая цивилизация."
 utopia.2016.a: "Так или иначе, не менее развитая, чем мы."
 utopia.2017.name: "Секция мира-кольца восстановлена"
 utopia.2017.desc: "Опираясь на то, что осталось от разрушенного мира-кольца в системе [From.GetName&gen], нашим инженерам удалось полностью восстановить одну из его секций. Новую биосферу нашим ведущим планетологам пришлось создавать почти с нуля, но теперь она считается стабильной и пригодной для обитания."
 anomaly.2576.name: "Новый металл"
 anomaly.2576.desc: "Подробное сканирование поверхности [From.GetName&gen] выявило крупный ударный кратер с обломками нескольких древних звездолётов неизвестной конструкции. Судя по всему, корабли полностью лишены систем жизнеобеспечения, что заставляет нас предполагать, что либо это были невероятно большие дроны, либо они управлялись каким-то искусственным интеллектом.\n\nИнтересно, что корпус кораблей был сделан из §Hживого металла§! — чрезвычайно редкого неорганического материала со множеством уникальных свойств. Этот металл можно «запрограммировать» на принятие определённой формы, и он будет медленно восстанавливаться в случае повреждения. В течение нескольких тысячелетий металл, уцелевший после крушения кораблей, сплавился в крупное и чрезвычайно плотное месторождение, которое потенциально можно разрабатывать ещё многие века."
 living_metal_category: "Странный кратер"
 living_metal_category_desc: "Обнаружен крупный ударный кратер, имеющий, по-видимому, искусственное происхождение."

 crisis.1011.desc: "Мы лишились колонии на [Root.GetName&prep]! Существа из другого измерения расположились на орбите, подвергли бомбардировке поверхность, а затем сожрали все формы жизни внизу. Вся биосфера [Root.GetPlanetMoon_rinfix&gen] была поглощена этими тварями, так что не осталось никаких следов жизни."

 utopia.61.name: "Поселение на орбите [From.From.From.Planet.GetName&gen] готово"
 utopia.61.desc.a: "Мы завершили строительство нашего первого орбитального поселения, и теперь наконец настала пора подготовить колониальный корабль и приземлиться на поверхность мира, который мы создали своими руками.\n\nОт механизированного ядра до самых высоких гор — каждая его гайка, болт, трещина и уголок были спроектированы так, чтобы наш новый дом среди звёзд идеально соответствовал нашим потребностям."
 utopia.61.desc.b: "Поселение на орбите [From.From.From.Planet.GetName&gen] завершено и готово к колонизации."

