l_russian:

 ####################################
 # Anomaly Categories
 ####################################
 rogue_moon_category: "Блуждающая луна"
 rogue_moon_category_desc: "Первоначальные данные, собранные на спутнике [Root.GetName], содержат неожиданные расхождения с данными о его родительской планете."
 hollow_planet_category: "Пустотелая планета"
 hollow_planet_category_desc: "Предварительное сканирование показало, что [Root.GetName] — это всего лишь пустая оболочка. Можно предположить, что это полностью искусственное творение или же когда-то это была обычная планета, которую неизвестным способом выскребли изнутри."
 strong_magnetic_category: "Сильное магнитное поле"
 strong_magnetic_category_desc: "Первоначальное сканирование показало лишь то, что [Root.GetPlanetMoon_rinfix&nom] [Root.GetName] окружена необычайно сильным магнитным полем."
 undiscovered_planetary_modifier_category: "Аномальные условия"
 undiscovered_planetary_modifier_category_desc: "Исследуйте странные условия окружающей среды на [From.GetName&prep]."

 ####################################
 # Anomaly Events
 ####################################
 anomaly.6000.name: "Блуждающая луна"
 # "parent planet" and "its primary", pending PARENTPLANET loc key implementation
 anomaly.6000.desc: "Не похоже, что [From.GetName] состоит из того же материала, что и родительская планета, а это означает, что когда-то это был блуждающий планетоид, попавший в её гравитационный колодец. Дальнейшее исследование может выявить его происхождение."
 anomaly.6001.desc: "[From.GetName] содержит базу!"
 anomaly.6002.name: "Пустотелая планета"
 anomaly.6002.desc: "После масштабного исследования был сделан вывод, что [From.GetName] не является искусственной конструкцией. Рабочая теория заключается в том, что изначально [From.GetPlanetMoon_rinfix&nom] [From.GetName] была заурядным поясом астероидов, который каким-то образом был спрессован в единое целое для сбора необходимых материалов, а затем превращён в полую сферу."
 anomaly.6003.desc: "Удивительно, но похоже, что изначально [From.GetPlanetMoon_rinfix&nom] [From.GetName] была вполне обычной, но в какой-то момент её полностью выскребли изнутри при помощи неизвестной техники ведения горных работ, в результате чего теперь [From.GetName] — это лишь пустая оболочка."
 anomaly.6004.name: "Сильное магнитное поле"
 anomaly.6004.desc: "Первоначальное сканирование показало лишь то, что [From.GetPlanetMoon_rinfix&nom] [From.GetName] окружена необычайно сильным магнитным полем. Это мешало подробному сканированию, пока корабль [Root.GetName] не подошёл ближе. Похоже, поле формируется высокоплотными металлическими рудами в коре планеты, что, вероятно, будет на руку при ведении горных работ."
 anomaly.6005.name: "Аномальные условия"
 anomaly.6005.desc: "Сканирование показывает, что [From.GetName] является довольно необычной планетой, но требуется более пристальное наблюдение."
 anomaly.6006.name: "Аномальные условия"
 anomaly.6006.desc: "Наше сканирование [From.GetName&gen] завершено, и [Root.Leader.GetAXX::ведущ<end_ii> учён<end_yi>] [Root.GetLeaderName] [Root.Leader.GetAXX::подготовил<end_a>] доклад о необычных условиях окружающей среды, обнаруженных там."
 anomaly.6006.a: "Докладывайте, [Root.GetLeaderName]."
 anomaly.6007.name: "Богатство ресурсов"
 anomaly.6007.desc: "Кора [From.From.GetName&gen], богатая легкодоступными минералами, позволит хорошо нажиться на добыче ресурсов."
 anomaly.6008.desc: "[From.From.GetName] отличается крайне нестабильной погодой: мощные бури часто возникают на ровном месте и крушат всё на поверхности. Хорошим источником энергии здесь, вероятно, смогут стать ветряные электростанции."
 anomaly.6009.desc: "На [From.From.GetName&prep] существуют крайне опасные виды животных, и поверхность кишит хищниками, поджидающими свою следующую добычу. Это открывает широкие возможности для изучения их биологии."
 anomaly.6010.desc: "[From.From.GetName::<1> пригоден|||fem:<1> пригодна|||neut:<1> пригодно|||pl:<1> пригодны] для заселения, но почти отсутствующее магнитное поле плохо защищает от космического излучения."
 anomaly.6011.desc: "[From.From.GetName::<1> облада<end_etyut>] аномально мощным магнитным полем, которое создают богатые залежи металлосодержащей руды. Оно нарушит работу наших приборов и компьютеров, но потенциальные масштабы добычи того стоят."
 anomaly.6012.desc: "Литосферные плиты [From.From.GetName&gen] очень подвижны, что приводит к мощным землетрясениям и извержениям вулканов. Залежи ценных минералов часто выталкиваются на поверхность."
 anomaly.6013.desc: "[From.From.GetName] вращается синхронно со своей звездой, поэтому на одной стороне планеты всегда царит день, а другая погружена в вечную ночь. Если здесь и существует жизнь, то, скорее всего, в сумеречных регионах, где сходятся две стороны."
 anomaly.6014.desc: "Когда-то [From.From.GetPlanetMoon_rinfix&nom] [From.From.GetName] была газовым гигантом, но из-за близости к звезде её плотная атмосфера улетучилась. Осталось лишь сверхплотное металлическое ядро, богатое минералами."
 anomaly.6015.desc: "Орбита [From.From.GetName&gen] пролегает через скопления мелких астероидов, метеоритов и роёв комет. Мощные столкновения с поверхностью происходят с пугающей частотой, подчас оставляя залежи ценных минералов."
 anomaly.6016.desc: "[From.From.GetName] обладает на удивление большим количеством естественных спутников. Вокруг планеты вращаются сотни маленьких лун и микролун, многие из которых богаты ценными минералами."
 anomaly.6017.desc: "Похоже, [From.From.GetPlanetMoon_rinfix&nom] [From.From.GetName] состоит в основном из углерода, и в её атмосфере очень мало кислорода. Она богата минералами, а извержения вулканов часто выбрасывают алмазы на поверхность."
 anomaly.6018.desc: "Феерические грозы бушуют в атмосфере [From.From.GetName&gen] с непредсказуемой периодичностью. Жителям они, вероятно, будут не в радость, зато открывают широкое поле для исследователей."
 anomaly.6019.desc: "[From.From.GetName] имеет необычно малую плотность, поэтому гравитация здесь значительно ниже, чем у большинства планет сравнимого размера."
 anomaly.6020.desc: "[From.From.GetName] имеет необычно высокую плотность и неприятно высокую гравитацию. Тем не менее, присутствие тяжёлых металлов открывает новые горизонты для наших учёных-физиков."
 anomaly.6021.desc: "[From.From.GetName&acc] создали искусственно или каким-то образом выскребли изнутри. Как и почему, мы не знаем, но ответ на эту загадку должен быть потрясающим."
 anomaly.6022.desc: " Кора [From.From.GetName&gen], изобилующая легкодоступными минералами, открывает фантастические перспективы по добыче ресурсов."
 anomaly.6023.desc: "Мы не знаем, была ли [From.From.GetPlanetMoon_rinfix&nom] [From.From.GetName] такой с самого начала или же неизвестная раса извлекла все её ресурсы. Известно лишь, что здесь очень мало минералов."
 anomaly.6024.desc: "Существа [From.From.GetName&gen] обладают колоссальными размерами и опасны даже когда не хотят причинить вред. Чем меньше разговоров о местных гигантских хищниках, тем лучше, но если кто-то из учёных наберётся смелости их изучить, то откроет кладезь ценнейших данных."
 anomaly.6025.desc: "Возможно, когда-то у [From.From.GetName&gen] был спутник, уничтоженный в результате катастрофы, или же куски породы на её орбите в своё время так и не скомпоновались. В любом случае, теперь планету окружает пояс небольших астероидов."
 anomaly.6026.desc: "Природа [From.From.GetName&gen] фантастически красива. Всякий, живущий здесь, будет постоянно открывать новые чудеса."
 anomaly.6027.desc: "Какое-то вещество в атмосфере [From.From.GetName&gen], похоже, стимулирует... репродуктивные склонности граждан. Излишне говорить о том, что полевая часть исследования была полна неловких ситуаций."
 anomaly.6028.desc: "В атмосфере [From.From.GetName&gen] присутствует естественное галлюциногенное вещество. Оно сделает граждан более счастливыми и поможет творчески решать запутанные физические задачи, но вместе с тем будет отвлекать их от других дел."
 anomaly.6029.desc: "Жизнь бьёт на [From.From.GetName&prep] ключом: быстро растущая флора и очень богатая фауна."
 anomaly.6030.desc: "Жизнь на [From.From.GetName&prep] борется за существование. Некоторые упорные виды сумели прижиться, но они слабы и тщедушны."
 anomaly.6031.desc: "Какая-то давняя катастрофа сильно загрязнила радиацией поверхность [From.From.GetName&gen]. Со временем мир стал более или менее пригодным для жизни, но здесь почти ничего не растёт."
 anomaly.6660.desc.start: "Когда наш научный корабль просканировал поверхность [From.GetName], стало ясно, что мы обнаружили нечто необычное."
 anomaly.6660.desc.default: "$anomaly.6660.desc.start$ Условия на [From.GetName&prep] совершенно не похожи на то, что мы видели раньше.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.weather: "$anomaly.6660.desc.start$ Здесь постоянно случаются сильные бури. Для исследований и добычи ресурсов эта [From.GetPlanetMoon_rinfix&nom] может нам пригодится, но заселить её будет затруднительно.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.magnetic: "$anomaly.6660.desc.start$ Местное магнитное поле имеет весьма нетипичные показатели.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.tectonic: "$anomaly.6660.desc.start$ Нестабильный характер этого небесного тела вызывает повсеместные землетрясения и извержения вулканов.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.tidal: "$anomaly.6660.desc.start$ Она вращается синхронно со своей звездой, поэтому на одной её стороне постоянно день, а на другой — ночь. Таким образом, ситуация с её пригодностью для жизни далеко не идеальна.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.tidal_mach: "$anomaly.6660.desc.start$ [From.GetPlanetMoon_rinfix&nom] вращается синхронно со своей звездой, поэтому на одной её стороне постоянно день, а на другой — ночь. Таким образом, ситуация с её пригодностью для органических форм жизни далеко не идеальна.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.impacts: "$anomaly.6660.desc.start$ Поверхность планеты перепахана нескончаемым метеоритным дождём, бомбардирующим планету огромными снарядами.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.gravity: "$anomaly.6660.desc.start$ Гравитация на планете далека от идеальной и вряд ли подойдёт для наших потенциальных поселенцев.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.gravity_mach: "$anomaly.6660.desc.start$ Хотя сила притяжения планеты далека от идеальной для поселений органиков, наши превосходные алгоритмы калибровки гравитации исправят ситуацию.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.gravity_desc_mach: "$anomaly.6660.desc.start$ Хотя гравитация планеты далека от идеальной для поселений органиков, наши превосходные алгоритмы калибровки гравитации исправят ситуацию.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.wildlife: "$anomaly.6660.desc.start$ Животные, найденные на этой планете, кажутся враждебными, поэтому колонизировать её будет непросто.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.titan: "$anomaly.6660.desc.start$ На планете обитают колоссальные формы жизни, сталкиваться с которыми, возможно, опасно.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.resources: "$anomaly.6660.desc.start$ Состав и история планеты дают нам дополнительные материалы, и мы должны воспользоваться возможностью их собрать.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.beauty: "$anomaly.6660.desc.start$ При виде её природной красоты любой разинул бы рот от благоговения. Жизнь здесь, несомненно, будет приятной для физиологически совместимых форм жизни.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.atmosphere: "$anomaly.6660.desc.start$ Атмосфера содержит особые газы, которые могут оказать воздействие на наше население, поэтому следует проявлять осторожность.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.atmosphere_mach: "$anomaly.6660.desc.start$ Атмосфера содержит газы, которые могут нарушить функционирование органической нервной системы.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.lush: "$anomaly.6660.desc.start$ Фауна, процветающая здесь без всяких проблем, могла бы предоставить нам широкие возможности по сбору столь необходимых ресурсов.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.lush_mach: "$anomaly.6660.desc.start$ Фауна, процветающая здесь безо всяких проблем, могла бы предоставить органическим формам жизни широкие возможности по сбору жизненно важных ресурсов.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.terrible: "$anomaly.6660.desc.start$ Суровый и холодный климат не благоприятствует появлению здесь поселений.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.terrible_mach: "$anomaly.6660.desc.start$ Суровый и холодный климат не благоприятствует органическим формам жизни.\n\n$anomaly.6660.desc.end$"
 anomaly.6660.desc.end: "Мы наверняка столкнёмся с ещё большим количеством подобных отклонений от нормы при исследовании новых планет, поэтому нам не следует недооценивать их влияние на нашу экспансию."
 anomaly.6660.a.tooltip: "[From.GetName] получает планетарный модификатор."

 ####################################
 # Anomaly Failure Events
 ####################################
 anomaly_failure.6000.desc: "Ничего интересного."
 anomaly_failure.6000.a: "Ну что же."

 ####################################
 # Colony Events
 ####################################
 colony_mod.1.name: "Что здесь случилось?"
 colony_mod.1.desc: "Хотя очевидно, что какая-то катастрофа в прошлом направила на [Root.GetName&acc] интенсивное излучение, всё-таки непонятно, что стало тому причиной. Эта тайна сейчас волнует всё большее число колонистов, для которых [Root.GetPlanetMoon_rinfix&nom] [Root.GetName] стала домом. В конце концов, если мы не знаем, как это произошло, кто может гарантировать, что такое не случится вновь?"
 colony_mod.1.desc_mach: "Очевидно, что в прошлом [Root.GetPlanetMoon_rinfix&nom] [Root.GetName] подверглась сильному воздействию радиации в результате какого-то бедствия. Нам ещё предстоит определить его причины и вероятность повторного возникновения."
 colony_mod.1.a: "Нам нужно докопаться до сути!"
 colony_mod.2.name: "Титаническая форма жизни"
 colony_mod.2.desc: "Для туземной жизни на [Root.GetName&prep] характерны грандиозные масштабы — гораздо большие, чем то, что считалось возможным для биологической жизни. Сейчас умы наших учёных занимает следующий вопрос: «В чём их секрет, и какая нам от этого может быть польза?» Отовсюду сыплются предложения изучить аборигенов более подробно."
 colony_mod.2.a: "Продолжайте изучение."
 colony_mod.2.b: "Нет, оставьте великанов в покое."
 colony_mod.2.c: "Убедитесь, что исследование не приносит вреда."
 colony_mod.2.d: "Возьмите образцы, там и узнаем, есть ли от них польза!"
 colony_mod.3.name: "Землетрясение!"
 colony_mod.3.desc: "Неустойчивые тектонические плиты [Root.GetName&gen] только что опять сильно сдвинулись. Из колонии начали поступать сообщения об ущербе."
 colony_mod.3.a: "Послушаем."
 colony_mod.4.name: "В поясе замечена комета"
 colony_mod.4.desc: "Население [Root.GetName&gen] сейчас наблюдает невероятно красивое зрелище. Через пояс астероидов планеты проходит комета, и это, как описывают свидетели, «грандиозно»."
 colony_mod.4.a: "Продолжайте смотреть в небо!"
 colony_mod.5.name: "Решительные меры"
 colony_mod.5.desc: "Нельзя отрицать, что атмосфера на [Root.GetName&prep] вызывает интоксикацию, хотя весьма приятную и даже полезную для некоторых целей. Однако наиболее консервативные граждане [Root.Owner.GetName&gen] настаивают на принятии решительных мер для защиты от газов, возможно, вызывающих привыкание."
 colony_mod.5.a: "Пусть замолчат!"
 colony_mod.5.b: "Нет, пусть на [Root.GetName&prep] всё будет так, как есть."
 colony_mod.6.name: "Бомбардировка"
 colony_mod.6.desc: "После тщательного исследования мы пришли к следующему выводу: [Root.GetName] — это место древнего геноцида. Насколько мы можем установить, коренное население [Root.GetName&gen] должно было вскоре освоить космос, но тут в систему прибыла гораздо более развитая раса, которая подвергла [Root.GetName&acc] орбитальной бомбардировке, а затем улетела, оставив несколько выживших, обречённых на вымирание."
 colony_mod.6.a: "Изучите следы бомбардировок, чтобы узнать больше про это оружие."
 colony_mod.7.name: "Межзвёздная война"
 colony_mod.7.desc: "После тщательного исследования мы пришли к следующему выводу: [Root.GetPlanetMoon_rinfix&nom] [Root.GetName] стала жертвой какой-то забытой войны. Кто тут жил и с кем они воевали, неизвестно, но ясно, что они были уничтожены в результате вторжения какой-то нездешней армии и последовавшей за этим битвы за планету. Это ужасное открытие, но мы хотя бы можем быть уверены, что это вряд ли повторится снова."
 colony_mod.7.a: "Изучите, что осталось на полях боя."
 colony_mod.8.name: "Самоубийство целой расы"
 colony_mod.8.desc: "Стала известной трагическая история [Root.GetName&gen]. Похоже, что давным-давно власть на ней имели две противоборствующие сверхдержавы. В какой-то момент между ними разразилась война, и конфликт нарастал до тех пор, пока вся высокоразвитая жизнь на [Root.GetName&prep] не была уничтожена в результате злоупотребления ядерным оружием."
 colony_mod.8.desc_mach: "Похоже, что давным-давно власть на [Root.GetName&prep] имели две противоборствующие сверхдержавы. В какой-то момент между ними разразилась война, и конфликт нарастал до тех пор, пока вся высокоразвитая жизнь на планете не была уничтожена в результате злоупотребления ядерным оружием."
 colony_mod.8.a: "Что могло привести их к такой судьбе?"
 colony_mod.9.name: "Мы не знаем."
 colony_mod.9.desc: "Несмотря на обширные исследования по истории [Root.GetName&gen], мы не знаем, что на ней произошло. Прошлое остаётся тайной."
 colony_mod.9.a: "Досадно."
 colony_mod.10.name: "Решительные меры"
 colony_mod.10.desc: "Атмосфера на [Root.GetName&prep] теперь очищена от вызывающих интоксикацию элементов!"
 colony_mod.11.name: "Решительные меры: прорыв"
 colony_mod.11.desc: "Атмосфера на [Root.GetName&prep] была отфильтрована с целью значительного снижения эффектов галлюциногена."
 hallucinogen_update_tooltip: "Ах, свежий воздух!"
 colony_mod.12.name: "Активность астероидов"
 colony_mod.12.desc: "[Root.GetName] в очередной раз [Root.GetName::подвергся|||fem:подверглась|||neut:подверглось|||pl:подверглись] бомбардировке астероидами, и на этот раз была уничтожена часть нашей колонии. Не нужно и говорить о том, что местное население не в восторге."
 colony_mod.12.desc_gestalt: "Вновь [Root.GetPlanetMoon_rinfix&nom] [Root.GetName] пострадала от падения астероидов, которые на этот раз уничтожили часть нашей колонии. Наши автоматические системы контроля за столкновениями указывают на повышенный риск подобных ударных воздействий и в будущем."
 colony_mod.12.a: "У нас другие приоритеты."
 colony_mod.12.b: "Нужно что-то делать!"
 colony_mod.13.name: "Система защиты от астероидов"
 colony_mod.13.desc: "Сочетание строительных технологий, использующих особо прочные материалы, и автоматических систем защиты должно уберечь колонию на [Root.GetName&prep] от столкновений с астероидами в будущем."
 irradiated_planet_tooltip: "Исследование началось..."
 colony_mod.14.name: "Космический подарок"
 colony_mod.14.desc: "Хотя падение астероида может здорово расшатать нервы, [Root.GetPlanetMoon_rinfix&nom] [Root.GetName] отделалась довольно легко: колония не пострадала."
 colony_mod.14.a: "Природные условия суровы, но наши граждане выдержат."
 colony_mod.14.b: "Нам нужно придумать, как это прекратить."
 colony_mod.16.name: "Магнитное чудо"
 colony_mod.16.desc: "В последнее время сильное магнитное поле вокруг [Root.GetName&gen] стало воздействовать на компьютеры. Странно, но данный эффект нельзя назвать просто случайными помехами, так как компьютеры, напротив, работают ещё эффективнее, чем должны. Создаётся впечатление, будто нам помогают какие-то внешние силы..."
 colony_mod.17.name: "Магнитное нарушение"
 colony_mod.17.desc: "Сильное магнитное поле вокруг [Root.GetName&gen] всегда приводило к проблемам с электронными приборами на поверхности, но в последнее время воздействие на наши компьютеры стало особенно заметным. Пока неизвестно, что вызвало такое обострение, но мы предполагаем, что эффект носит временный характер."
 colony_mod.21.name: "Землетрясение: отчёт об ущербе"
 colony_mod.21.desc: "Недавнее землетрясение, хорошо встряхнувшее нашу колонию на [Root.GetName&prep], привело к образованию крупной воронки. Всё, что было на этом месте раньше, теперь находится глубоко под землёй."
 colony_mod.22.desc: "Недавнее землетрясение, немного встряхнувшее нашу колонию на [Root.GetName&prep], не причинило ущерба и, по счастливой случайности, обнажило участок с полезными ископаемыми."
 colony_mod.23.desc: "Недавнее землетрясение, слегка встряхнувшее нашу колонию на [Root.GetName&prep], не причинило ущерба!"
 quake_report_tooltip: "Отчёты будут отправлены совсем скоро."
 quake_sinkhole_tooltip: "Появляется £blocker£ §Rворонка§!."
 titanic_troop_limit_tooltip: "Прорыв в исследованиях позволил нам тренировать титанические формы жизни таким образом, чтобы сделать из них бойцов, но подходящие экземпляры встречаются редко, поэтому одновременно мы сможем использовать лишь ограниченное количество таких войск."
 titantic_blocker_tooltip: "Нам придётся избегать этих территорий, если мы когда-нибудь окажемся там."
 good_impact_tooltip: "К счастью, астероид не причинил ущерба и обнажил некоторые полезные ископаемые на поверхности."
 colony_mod.100.name: "Планета титанов"
 colony_mod.100.desc: "[From.GetName] является домом для титанических форм жизни, причём есть среди них настолько многочисленные и опасные, что некоторые территории на планете, где они обитают, нельзя назвать гостеприимными для какой бы то ни было расы."
 colony_mod.101.name: "Изучение титанических форм жизни: успех"
 colony_mod.101.desc: "После долгих исследований учёным на [Root.GetName&prep] удалось сделать прорыв и добиться контакта с некоторыми из титанов, хотя и в ограниченных масштабах. С одной стороны, это огромные, медленные и неразговорчивые существа, а с другой — они невероятно крепкие и сильные. Некоторые из них выразили желание присоединиться к нашим вооружённым силам, для которых они, несомненно, станут очень ценным приобретением."
 titanic_recruit_tooltip: "Теперь здесь можно завербовать титанических монстров."
 titanic_recruit_phile_tooltip: "Здесь можно завербовать титанических монстров, и отныне даже те территории, где титанических форм жизни очень много, безопасны для колонистов."
 colony_mod.102.name: "Изучение титанических форм жизни: неудача"
 colony_mod.102.desc: "Ужасная цепочка событий привела к тому, что учёные на [Root.GetName&prep] разъярили местных титанических существ. Огромные существа неистовствуют в колонии, круша всё на своём пути."
 titanic_uprising_tooltip: "Титанические монстры убивают всех!"
 colony_mod.18.name: "Раскрыта тайна магнитной аномалии"
 colony_mod.18.desc: "[Root.GetName] — место нахождения невероятно сложного и искусно сделанного квантового компьютера со свойством самоорганизации. Модели погоды, туземной жизни и даже нашей собственной колонии интегрированы в него и каким-то образом используются как нейроны в сети планетарного масштаба. Мы не понимаем, как такое возможно, и не можем это контролировать, однако нам известно, что если мы организуем наши компьютеры определённым образом, [Root.GetName] повысит их продуктивность."
 colony_mod.18.a: "[Root.GetName] теперь привлекает нас ещё больше!"
 colony.3001.name: "[Root.GetName::<1> и его|||fem:<1> и её|||pl:<1> и их] таинственная луна"
 colony.3001.desc: "Прошло какое-то время с тех пор как мы заселили [Root.GetName&acc], и в данных были замечены некоторые отклонения от нормы. В частности, луна этой планеты, похоже, состоит из материала, который даже отдалённо не напоминает состав [Root.GetName&gen]. Это наводит на мысль, что спутник изначально сформировался в другое время и в другом месте, а уже позже попал в гравитационное поле планеты. Откуда именно могла появиться такая луна, как [event_target:roguemoon.Planet.GetName] — загадка."
 colony.3002.name: "Блуждающая лунная база"
 colony.3002.desc: "Тайны [event_target:roguemoon.Planet.GetName&gen] раскрыты! Подробное изучение показало, что луна имеет небольшую асимметрию, и на её обратную сторону приходится непропорционально большая часть общей массы. Мы считаем, что когда-то эта луна находилась на орбите другой планеты, но та была уничтожена взрывом в результате какого-то катаклизма.\n\nДополнительная плотность обратной стороны объясняется тем, что именно ею [event_target:roguemoon.Planet.GetName::<1> был обращён|||fem:<1> была обращена] к своей первой планете, а дополнительный материал — это часть массы той планеты, которая врезалась в луну, выбросив её с орбиты и отправив в результате на орбиту [Root.GetName&gen].\n\nМы предполагаем, что та планета была уничтожена каким-то оружием или в результате попытки создать источник энергии на основе тёмной материи, поскольку в планетарном материале, покрывающем обратную сторону луны, высока её концентрация."
 colony.3003.name: "Межпространственные путешественники"
 colony.3003.desc: "Разгадка одной тайны породила другую. Теперь мы знаем, что [event_target:roguemoon.Planet.GetName::<1> был притянут или отброшен|||fem:<1> была притянута или отброшена] на орбиту [Root.GetName&gen] из другого измерения. К сожалению, мы понятия не имеем о причинах, так как помимо немного отличающегося уровня фоновой радиации [event_target:roguemoon.Planet.GetName] ничем особо не выделяется. Ещё более непонятно, как работает обнаруженный внутри [event_target:roguemoon.Planet.GetName&gen] механизм, который, предположительно, и осуществил межпространственное перемещение. Пока мы не отбрасываем даже вариант с магией."
 colony.3005.name: "Дверь"
 colony.3005.desc: "В отдалённом районе [Root.GetName&gen] обнаружено то, что можно назвать лишь межпространственным порталом. В алгоритмах прогнозирования погоды был замечен странный воздушный поток, который, как удалось определить в итоге, был обусловлен небольшой утечкой атмосферы в портал. Скорость утечки слишком мала и никак не влияет на жизнь на [Root.GetName&prep], но само существование этого портала вызывает некоторые тревожные вопросы: например, куда он ведёт, и может ли что-то проникнуть через портал с другой стороны?"
 portal_zone_tooltip: "Межпространственный портал можно изучать на постоянной основе."
 colony.3006.name: "Измерение страданий"
 colony.3006.spir.desc: "Межпространственный портал на [Root.GetName&prep], похоже, ведёт в какой-то мир зла и тревоги. Любые контакты с материалом из этого измерения вызывают у подопытных сильные страдания, которые, если они продолжаются больше нескольких минут, вызывают настойчивые суицидальные позывы в сочетании с попытками покалечить свои органы чувств. Даже простое изучение данных, записанных в этом странном измерении, вызывает каскад ошибок в компьютерных системах или интенсивный дискомфорт у разумных существ из-за ужасающего осознания того, что при этом разрушается сама душа."
 colony.3006.desc: "Межпространственный портал на [Root.GetName&prep], похоже, ведёт в мир, противостоящий разуму на фундаментальном уровне. Любые контакты с материалом из этого измерения вызывают у подопытных сильные страдания, которые, если они продолжаются больше нескольких минут, вызывают настойчивые суицидальные позывы в сочетании с попытками покалечить свои органы чувств. Даже простое изучение данных, записанных в этом странном измерении, вызывает интенсивный дискомфорт у биологического наблюдателя и каскад ошибок в компьютерных системах."
 colony.3006.knight.desc: "Межпространственный портал на [Root.GetName&prep], похоже, ведёт в какой-то мир зла и тревоги. Любые контакты с материалом из этого измерения вызывают у подопытных сильные страдания, которые, если они продолжаются больше нескольких минут, пробуждают стремление к насилию. Даже простое изучение данных, записанных в этом странном измерении, вызывает каскад ошибок в компьютерных системах или интенсивный дискомфорт у разумных существ. Но мы узнали, что одна из реликвий ордена способна защитить своего обладателя, что позволит нам отправить сквозь портал одного рыцаря."
 colony.3006.science: "Найдите способ закрыть портал!"
 colony.3006.prayer: "Помолимся о решении этой проблемы"
 colony.3006.psi.prayer: "Может быть, псионика поможет?"
 colony.3006.rocks: "Попробуем заполнить портал камнями!"
 colony.3006.knights: "Отправьте нашего лучшего рыцаря!"
 colony.3006.keep: "Изучить портал."
 colony.3010.name: "Дверь закрыта"
 colony.3010.desc: "Портал был рассчитан на то, чтобы справиться с почти неограниченным поступлением в него энергии, но ключевое слово тут «почти». Генерируя энергию в беспрецедентном объёме и постоянно бомбардируя ею портал, мы в итоге смогли вызвать его перегрузку и схлопывание. Излишне говорить, что производство огромных объёмов энергии можно использовать для других целей."
 colony.3011.desc: "Портал, похоже, как-то отреагировал на мысли находящихся рядом наблюдателей, в особенности некоторых из них. Методом исключения удалось обнаружить большое количество представителей нашего населения, которые особенно эффективно воздействуют на портал. Объединившись, им удалось усилием воли его закрыть. Это был поучительный опыт, который убедительно доказал, что верой можно управлять и использовать её для получения ощутимых результатов."
 colony.3011.psi.desc: "Портал оказался чувствительным к псионической силе. Собрав команду одарённых личностей, мы создали псионический барьер вокруг портала, нейтрализовав его. Это был поучительный опыт, который убедительно доказал, что при помощи псионической энергии можно создавать прочные барьеры."
 colony.3011.psi_robot.desc: "Портал проявил чувствительность к псионическим сигналам. Благодаря нашим пси-модулям вокруг него был создан защитный барьер, предотвращающий несанкционированный доступ. Данные, полученные в ходе этого эксперимента, несомненно пригодятся в дальнейших исследованиях."
 colony.3012.desc: "Иногда простой ответ — самый лучший. Подорвав несколько гор, мы превратили их в гравий, который сбросили в портал. Похоже, это привело к его перегрузке. Или, возможно, намеренному отключению. Как бы то ни было, оставшийся материал мы свалили сверху на тот случай, если портал снова откроется. Опыт, полученный во время таких крупномасштабных инженерных и горных работ, пригодится нам и в других областях."
 portal_closed_tooltip: "Место нахождения портала всё ещё можно изучать, но полезной информации будет меньше."
 colony.3007.name: "Высокоэнергетическое измерение"
 colony.3007.desc: "Межпространственный портал на [Root.GetName&prep] ведёт в измерение чистой энергии, небольшое количество которой можно выкачивать через портал для собственных целей. Методы, используемые для обработки дискретных «пакетов» энергии, также потенциально могут использоваться в качестве системы вооружения."
 portal_energy_tooltip: "$job_dimensional_portal_researcher_plural$ также будут производить £energy£ энергокредиты"
 portal_void_tooltip: "$job_dimensional_portal_researcher_plural$ также будут производить £sr_dark_matter£ тёмную материю"
 colony.3008.name: "Нулевая пустота"
 colony.3008.desc: "Межпространственный портал на [Root.GetName&prep] ведёт в измерение чистой энтропии. Сложно даже получить показания датчиков, потому что сама энергия наших пеленгующих сигналов быстро рассеивается. Наша лучшая теория звучит следующим образом: эта так называемая «нулевая пустота» представляет собой измерение, в котором большая часть энергии нулевой точки отрицательная, и поэтому любая положительная энергия, которая когда-то существовала, давно израсходована. Зная это, теоретически возможно создать оружие, в котором разрушение энергии нулевой пустоты будет использоваться для наступательных целей."
 colony.3009.name: "Зеркальное отражение"
 colony.3009.desc: "Как ни странно, но по ту сторону межпространственного портала на [Root.GetName&prep] находится очень похожая на неё планета. Ещё более странно то, что через портал нам транслируется сообщение..."
 colony.3009.a: "Выведите на экран!"
 colony.3020.name: "Связь с пришельцами из портала"
 colony.3020.desc: "Это [Root.Owner.Leader.GetName], [Root.Owner.GetName]. Кто вы, пришельцы из портала?"
 colony.3020.a: "Нет, это я [Root.Owner.Leader.GetName]! А вы кто?!"
 colony.3021.desc: "Поразительно. Если вы говорите правду, то, как я полагаю, портал создаёт мостик между альтернативными измерениями. Я [Root.Owner.Leader.GetName], и вы тоже, но в какой-то момент, должно быть, произошло некое событие, в результате которого наши измерения разошлись."
 colony.3021.a: "Удивительно. Ну и как, [Root.Owner.Species.GetNamePlural]? Дела идут хорошо?"
 colony.3021.b: "Нам нужно торговать через этот портал."
 mirror_trade_reply: "У меня тоже возникла такая мысль, если мы хотим, чтобы [Root.Owner.Species.GetNamePlural] процветали!"
 colony.3022.desc: "Думаю, что так же, как и в вашем измерении. После открытия варп-двигателя мы колонизируем другие планеты из нашей столицы [Root.Owner.Capital.GetName]..."
 colony.3022.a: "Варп-двигатель? Мы путешествуем при помощи гиперкоридоров!"
 colony.3023.desc: "Гиперкоридоры? Возможно, открытие разных видов сверхсветовых путешествий стало точкой дивергенции между нашими вселенными? Значит ли это, что варп-твари вам не досаждают?"
 colony.3023.a: "Здесь нет варп-тварей. Они представляют серьёзную угрозу?"
 colony.3024.desc: "Варп-твари нападают на все известные цивилизации, угрожая всему живому. Насколько мы поняли, как только варп-прыжки в галактике достигли определённого критического уровня, варп-твари проснулись и атаковали. Несколько известных нам рас уже прекратили существование, но мы пока сдерживаем их."
 colony.3024.a: "Это ужасно. Можем ли мы помочь?"
 mirror_trade_reply2: "Да, мы должны заключить договор о торговле между измерениями для повышения благосостояния обоих наших государств. Мы ведь хотим, чтобы [Root.Owner.Species.GetNamePlural] процветали!"
 colony.3031.name: "Рост торговли между измерениями"
 colony.3031.desc: "[Root.Owner.GetName] из зеркального измерения сообщает, что их экономика на подъёме. Отмечено, что этому способствует наша торговля через портал, а также недавние победы над варп-тварями."
 colony.3032.name: "Спад торговли между измерениями"
 colony.3032.desc: "[Root.Owner.GetName] из зеркального измерения сообщает, что их экономика в упадке из-за серии поражений от придатков варп-тварей."
 colony.3032.a: "Будем надеяться, что они оправятся!"
 colony.3033.name: "ЭКСТРЕННАЯ ТРАНСЛЯЦИЯ ИЗ ПОРТАЛА"
 colony.3033.desc: "Столица [Root.Owner.Capital.GetName] поглощена. [Root.Owner.GetName] [Root.Owner.GetName::пал<end_a>]. Насколько нам известно, [Root.GetName] — это последняя существующая колония. Варп-твари повсюду! Они здесь!\n\n**§YСигнал резко обрывается§!**"
 colony.3033.a: "Алло?"
 colony.3033.b: "Вы на связи?"
 colony.3033.c: "Ответьте!"
 colony.3033.d: "Исчезли..."
 colony.3033.reply: "**§YСлышится только шипение помех§!**"
 dportal_trade_normal: "Торговля между измерениями"
 dportal_trade_normal_desc: "Торговля с нашими зеркальными двойниками принесёт выгоду обеим государствам."
 dportal_trade_normal_tooltip: "$mod_planet_physicists_amenities_produces_add$: §G+600§!"
 dportal_trade_low: "Снижение торговли между измерениями"
 dportal_trade_low_desc: "Недавние события в Зеркальной вселенной снизили объём торговли через портал."
 dportal_trade_low_tooltip: "$mod_planet_physicists_amenities_produces_add$: §G+300§!"
 dportal_trade_high: "Процветание торговли между измерениями"
 dportal_trade_high_desc: "Наши зеркальные двойники процветают, и торговля через портал резко возрастает!"
 dportal_trade_high_tooltip: "$mod_planet_physicists_amenities_produces_add$: §G+1200§!"
 dportal_trade_crisis: "Кризис между измерениями"
 dportal_trade_crisis_desc: "У наших зеркальных двойников кризис. Их торговля, страдающая от варп-тварей, находится на рекордно низком уровне, и беженцы постоянным потоком текут к нам через портал. Каждая новая волна выглядит всё более отчаявшейся."
 dportal_trade_crisis_tooltip: "$mod_planet_physicists_amenities_produces_add$: §G+200§!"

 colony.3050.name: "Тёмный рыцарь"
 colony.3050.desc: "Рыцарь [doomslayer_knight.GetName], что несколько лет назад [doomslayer_knight.GetAXX::прош<end_yolla>] сквозь портал на [root.GetName&prep], [doomslayer_knight.GetAXX::верну<end_lsya>]. Явившийся из портала тёмный, искажённый силуэт обрушил на колонию армию кошмарных тварей. По словам выживших, они слышали жуткий демонический хохот и угрозы завоевать это измерение."
 colony.3050.a: "Тревога!"
 demonic_armies_tooltip: "Несколько §Rдемонических армий§! атакуют колонию!"
 colony.3051.name: "Демоническое вторжение"
 colony.3051.desc: "[doomslayer_knight.GetName] и твари, прошедшие сквозь портал, прорвали нашу оборону и покорили мир [fromfrom.GetName]!\n\nНаходясь во власти могучей потусторонней сущности, рыцарь теперь называет себя §Y[doomslayer_knight.GetTitle] [doomslayer_knight.GetName]§!, и [doomslayer_knight.GetHerHis] демонические орды готовятся завоевать нашу галактику!\n\nВ системе ненадолго открылось ещё несколько порталов, но искажение реальности оказалось слишком велико. Вскоре все сингулярности схлопнулись, отрезав демонические полчища от родного измерения. Несмотря на это, [doomslayer_knight.GetFirstName] [doomslayer_knight.GetAXX::укрепил<end_a>] свои силы и строит планы покорения галактики."
 colony.3051.a: "Мы одолеем этих захватчиков!"
 colony.3051.b: "Да здравствует [doomslayer_knight.GetName]!"
 demonic_incursion_tooltip: "Межпространственный портал на [fromfrom.GetName&prep] закроется.\nСистема [fromfrom.solar_system.GetName&gen] §Rзахвачена§! [demonic_incursion_country.GetName&inst]."
 demonic_takeover_tooltip: "$demonic_incursion_tooltip$\n\nИграть за §R[demonic_incursion_country.GetName&acc]§!."
 colony.3055.name: "Межпространственные беженцы"
 colony.3055.desc: "Портал на [Root.GetName&prep], сквозь который несколько лет назад [doomslayer_knight.GetAXX::отправи<end_lsya>] рыцарь [doomslayer_knight.GetName], вновь пробудился силами потрёпанных мирных жителей, пытавшихся прорваться в наше измерение. По их словам, рыцарь [doomslayer_knight.GetFirstName] уже десять лет бесчинствует в их измерении, безжалостно убивая каждого встречного. Погибло так много обитателей того измерения, что их общество назвало это страшным роком. Выжившие пытаются бежать хоть куда-то. Возможно ли, что [doomslayer_knight.GetName] [doomslayer_knight.GetAXX::сош<end_yolla>] с ума из-за экзистенциальных страданий в ином измерении?"
 colony.3055.a: "Смерть захватчикам!"
 colony.3055.b: "Разрешим им остаться."
 demon_refugees_tooltip: " §Y4 поселения демонов§! появятся на [Root.GetName&prep]."
 colony.3060.name: "В ад и обратно"
 colony.3060.desc: "Рыцарь [doomslayer_knight.GetName], что несколько лет назад [doomslayer_knight.GetAXX::прош<end_yolla>] сквозь портал на [root.GetName&prep], [doomslayer_knight.GetAXX::верну<end_lsya>]. [doomslayer_knight.GetSheHeCap] [doomslayer_knight.GetAXX::сразил<end_a>] полчища демонов, и не раз [doomslayer_knight.GetHerHis] судьба висела на волоске, но в итоге [doomslayer_knight.GetSheHe] [doomslayer_knight.GetAXX::преодолел<end_a>] все испытания. Многочисленные трофеи и добытая слава сделали рыцаря легендой среди оруженосцев, которые прозвали [doomslayer_knight.GetHimHer] «Палачом Рока»."
 colony.3060.a: "[doomslayer_knight.GetFirstName] поистине [doomslayer_knight.GetAXX::отваж<end_enna>], [doomslayer_knight.GetAXX::свиреп<end_a>] и [doomslayer_knight.GetAXX::галант<end_enna>]!"
 doomslayer_quest_complete: "Трофеи Палача Рока"
 doomslayer_quest_complete_desc: "Трофеи и легенды о приключениях рыцаря в адском измерении. Источник вдохновения для множества рыцарей и оруженосцев, которые мечтают повторить этот подвиг."
