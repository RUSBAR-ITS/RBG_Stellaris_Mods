 refugees.1.name: "Появление [Root.GetSpeciesAdj]их беженцев" # Не работает с падежной системой
 refugees.1.desc.1: "Флотилия гражданских транспортных кораблей, везущих §Y[Root.GetSpeciesAdj]их§! беженцев из §Y[RefugeeEscapedFrom.GetName&gen]§!, прибыла в нашу часть космоса. Им разрешено поселиться на §H[Root.Planet.GetName&prep]§!.\n\nЭти несчастные изгои были вынуждены покинуть свои дома по приказу [RefugeeEscapedFrom.GetSpeciesAdj&pl,gen] властей. С тех пор они путешествовали от системы к системе в отчаянной попытке найти новый дом до того, как иссякнут последние остатки их немногочисленных припасов."
 refugees.1.desc.2: "Потрёпанная флотилия небольших гражданских кораблей, везущих §Y[Root.GetSpeciesAdj]их§! беженцев из §Y[RefugeeEscapedFrom.GetName&gen]§!, прибыла в нашу часть космоса. После того как мы снабдили их пищей и предоставили их раненым медицинскую помощь, беженцам было разрешено поселиться на §H[Root.Planet.GetName&prep]§!.\n\nЭти оборванные и испуганные беженцы выжили несмотря на программу ликвидации, которую [RefugeeEscapedFrom.GetSpeciesAdj&pl] власти проводят в отношении их расы. Им удалось спастись только благодаря работе наспех организованной подпольной системы перевозки и сочувственно настроенных капитанов нескольких торговых кораблей."
 refugees.1.desc.2.b: "Потрёпанная флотилия небольших гражданских кораблей, везущих §Y[Root.GetSpeciesAdj]их§! беженцев из §Y[RefugeeEscapedFrom.GetName&gen]§!, прибыла в нашу часть космоса. После того как мы снабдили их пищей и предоставили их раненым медицинскую помощь, беженцам было разрешено поселиться на §H[Root.Planet.GetName&prep]§!.\n\nЭти оборванные и испуганные беженцы выжили несмотря на то, что их безжалостно атаковали представители [RefugeeEscapedFrom.GetSpeciesAdj&fem,gen] расы. Им удалось спастись только благодаря отчаянному похищению нескольких списанных космических кораблей, хранившихся на старой судоверфи на их планете."
 refugees.1.desc.3: "Потрёпанная флотилия небольших гражданских кораблей, везущих §Y[Root.GetSpeciesAdj]их! беженцев из §Y[RefugeeEscapedFrom.GetName&gen]§!, прибыла в нашу часть космоса. После того как мы снабдили их пищей и предоставили их раненым медицинскую помощь, беженцам было разрешено поселиться на §H[Root.Planet.GetName&prep]§!.\n\nЭтих оборванных и испуганных беженцев вынуждает спасаться §H[RefugeeEscapedCrisis.GetName]§! в пространстве, принадлежащем расе [RefugeeEscapedFrom.GetSpeciesName]. Им еле удалось сбежать со своей родной §H[RefugeeEscapedPlanet.GetName&gen]§!, оставив большую часть личных вещей в этом обречённом мире, прежде чем его атаковали [RefugeeEscapedCrisis.GetSpeciesAdj&pl] силы."
 refugees.1.a: "Мы радушно принимаем их."

