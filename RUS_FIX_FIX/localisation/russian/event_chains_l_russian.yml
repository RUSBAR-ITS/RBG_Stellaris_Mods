l_russian:

 ####################################
 # Event Chains
 ####################################

 test_chain_title: "Тайны [Root.GetName&gen]"
 test_chain_desc: "На [Root.GetName&prep] были замечены какие-то странные явления."
 test_chain_2_title: "Тайны [Root.GetName&gen]"
 test_chain_2_desc: "На [Root.GetName&prep] были замечены какие-то странные явления."
 test_counter: "Тестовый счётчик"
 migrating_forests_chain_title: "Мигрирующие леса [Root.GetName&gen]"
 migrating_forests_chain_desc: "Мигрирующие леса на [Root.GetName&prep] мешают развитию нашей колонии. Необходимо найти решение этой проблемы, если мы хотим процветать в этом мире."
 subterranean_civilization_chain_title: "Цивилизация [Root.owner.GetSubMantleUpper]"
 subterranean_civilization_chain_desc: "Подземная цивилизация чужаков на [Root.GetName&prep] прокладывает тоннель к нашей колонии на поверхности. Нам не известна ни их численность, ни намерения, и, возможно, они представляют собой значительную угрозу."
 abandoned_terraforming_chain_title: "Заброшенный проект по терраформированию"
 abandoned_terraforming_chain_desc: "Тысячи лет назад [Root.GetName] подверглась частичному терраформированию. Процесс был прерван по неизвестной причине, поэтому созданные климатическая система и биосфера очень нестабильны. Мы нашли брошенное оборудование для терраформирования и должны решить, что с ним делать."
 vultaum_chain_title: "Предтечи: народ Вультаум"
 vultaum_chain_desc: "Мы обнаружили артефакты звёздного сообщества Вультаум. Эта инопланетная цивилизация существовала примерно 12 миллионов лет назад. Их истинный облик скрыло неумолимое течение времени, однако по оставшимся руинам мы сделали вывод, что они напоминали кольчатых червей длиной 3-4 метра. Общались они, по всей видимости, в основном вибрациями, производимыми сегментами тела.\n\nЕсли мы найдём достаточно реликвий, сохранившихся после этой цивилизации, то, возможно, нам удастся узнать местоположение их родной системы."
 vultaum_artifacts: "Вультаумские артефакты"
 vultaum_homeworld_chain_title: "Родная система вультаумцев"
 vultaum_homeworld_chain_desc: "Мы узнали давно потерянное местонахождение родной системы народа Вультаум. Необходимо как можно быстрее отправить туда экспедицию, пока кто-нибудь ещё не раскрыл их секреты!"
 yuht_chain_title: "Предтечи: Юуты"
 yuht_chain_desc: "Мы обнаружили артефакты Юутской империи на планете. Эта инопланетная цивилизация обитала в этой части галактики примерно 6 миллионов лет назад. Внешне юуты представляли собой гигантских плоских членистоногих. Взрослый индивид мог достигать ста метров в длину, и, как правило, на одном звездолёте перемещались не более двух-трёх особей.\n\nЕсли мы найдём достаточно реликвий, сохранившихся после этой цивилизации, то, возможно, нам удастся узнать местоположение их родной системы."
 yuht_artifacts: "Юутские артефакты"
 yuht_homeworld_chain_title: "Родная система юутов"
 yuht_homeworld_chain_desc: "Мы узнали давно потерянное местонахождение родной системы юутов. Необходимо как можно быстрее отправить туда экспедицию, пока кто-нибудь ещё не раскрыл их секреты!"
 first_league_chain_title: "Предтечи: Первая лига"
 first_league_chain_desc: "Мы обнаружили артефакты Первой лиги. Примерно два миллиона лет назад это был крупный альянс инопланетных рас, которые сравнительно мирно уживались между собой. Возможно, Первая лига занимала значительную часть галактики, пока не погибла.\n\nЕсли мы найдём достаточно реликвий, оставленных этим альянсом, то, возможно, нам удастся узнать местоположение его главной системы."
 first_league_artifacts: "Артефакты Первой лиги"
 first_league_homeworld_chain_title: "Главная система Первой лиги"
 first_league_homeworld_chain_desc: "Мы выяснили давно потерянное местонахождение главной системы Первой лиги, где находился их Великий сенат. Необходимо как можно быстрее отправить туда экспедицию, пока кто-нибудь ещё не раскрыл их секреты!"
 irassian_chain_title: "Предтечи: Ирассианцы"
 irassian_chain_desc: "Мы обнаружили артефакты Ирассианского конкордата. Это была межзвёздная империя, контролировавшая часть галактики чуть более миллиона лет назад. Ирассианцы были расой млекопитающих с шестью конечностями и очень слабой иммунной системой. Это делало их крайне уязвимыми для любых инопланетных болезней. По некоторым источникам, ирассианцев уничтожила яворианская чума, смертоносной волной прокатившаяся по их империи.\n\nЕсли мы найдём достаточно реликвий, оставшихся после этой цивилизации, то, возможно, нам удастся узнать местоположение их родной системы."
 irassian_artifacts: "Иррасианские артефакты"
 irassian_homeworld_chain_title: "Родная система ирассианцев"
 irassian_homeworld_chain_desc: "Мы узнали давно потерянное местонахождение родной системы ирассианцев. Необходимо как можно быстрее отправить туда экспедицию, пока кто-нибудь ещё не раскрыл их секреты!"
 cybrex_chain_title: "Предтечи: Сайбрекс"
 cybrex_chain_desc: "Мы обнаружили на [From.GetName&prep] артефакты Сайбрекса — машины, обладающей разумом, которая правила этим сектором галактики примерно 600 000 лет назад. Происхождение и истинная природа Сайбрекса окутаны завесой тайны, однако известно, что он воевал со всеми органическими расами на протяжении многих сотен лет. Эта война на уничтожение оставила триллионы погибших.\n\nЕсли мы найдём достаточно реликвий, оставленных машинным разумом, то, возможно, нам удастся узнать местоположение его родной системы."
 cybrex_artifacts: "Артефакты Сайбрекса"
 cybrex_homeworld_chain_title: "Родная система Сайбрекса"
 cybrex_homeworld_chain_desc: "Мы узнали давно потерянное местонахождение родной системы Сайбрекса. Необходимо как можно быстрее отправить туда экспедицию, пока кто-нибудь ещё не раскрыл его секреты!"
 sublight_probes_chain_title: "Субсветовые исследовательские зонды"
 sublight_probes_chain_desc: "Несколько субсветовых исследовательских зондов были запущены с [Root.Capital.GetName&gen] в соседние системы ещё до того, как мы освоили сверхсветовые путешествия. Их необходимо отыскать, пока они не попали во вражеские руки."
 probes_recovered: "Получены зонды"
 survey_habitable_worlds_chain_title: "Исследование обитаемых миров"
 survey_habitable_worlds_chain_desc: "Наши ксенобиологи подтолкнули нас к изучению любых миров с активной биосферой, которые нам встретятся. Они хотят узнать больше о различных инопланетных экосистемах, обнаруженных в галактике."
 habitable_worlds_surveyed: "Исследовано обитаемых миров"
 specimen_procurement_chain_title: "Поиски инопланетных организмов"
 specimen_procurement_chain_desc: "Музей экзобиологии на [Root.Capital.GetName&prep] попросил нас помочь собрать несколько редких форм инопланетной жизни, обнаруженных в различных мирах."
 specimens_collected: "Организмы собраны"
 radical_cult_title: "[radical_cult.GetName]"
 radical_cult_desc: "Члены экстремистского культа, именующие себя «[radical_cult.GetName]», стремятся скомпрометировать наше правительство и обратить население в свою чокнутую веру. Потратив несколько столетий на то, чтобы накопить силы на [Root.Capital.GetName&prep], лидеры культа сбежали в космос, чтобы продолжить свой крестовый поход против нас."
 survey_home_system_title: "Изучить родную систему"
 survey_home_system_desc: "Прежде чем отправляться в другие части галактики, нам нужно полностью изучить систему [home_system.GetName&gen]. Нельзя оставлять неисследованными собственные задворки."
 establish_colony_title: "Основать первую колонию"
 establish_colony_desc: "Раса [This.GetSpeciesName] должна распространиться за пределы [This.Capital.GetName&gen], чтобы выжить в долгосрочной перспективе. Создайте нашу первую колонию и водрузите наш флаг на поверхности другой [This.GetPlanetMoon_rinfix&gen]. [This.GetName] будет вами гордиться."
 first_colony: "Первая колония основана"
 asteroid_sighted_chain_title: "Замечен астероид"
 asteroid_sighted_chain_desc: "Навстречу [Root.GetName&dat] движется крупный астероид. Его необходимо уничтожить, прежде чем он врежется в её поверхность!"
 asteroid_destroyed: "Астероид уничтожен"
 coming_storm_chain_title: "Приближается буря"
 coming_storm_chain_desc: "На векторе подхода к нашей галактике обнаружено таинственное скопление подпространственных объектов. Похоже, у нас скоро будут гости..."
 prethoryn_scourge_chain_title: "Бич пустоты"
 prethoryn_scourge_chain_desc: "В нашу галактику вторглась жадная свора космических странников, которые, похоже, намереваются истребить любую жизнь на своём пути. Этих бушующих преторинских захватчиков необходимо остановить до того, как их количество станет непомерным."
 extradimensional_invasion_chain_title: "Незваные"
 extradimensional_invasion_chain_desc: "В нашей галактике появился огромный разрыв в ткани пространства, который выполняет роль одностороннего канала между нашей и иной реальностью. Странные бесплотные космические корабли хлынули через него, и похоже, что они вытягивают энергию, приводя к гибели тех, кому не повезло оказаться у них на пути."
 star_power_chain_title: "Необычное звёздное вещество"
 star_power_chain_desc: "В поисках странных показаний излучения."
 hunting_hyacinth_title: "Охота за «Гиацинтом»"
 hunting_hyacinth_desc: "«Гиацинт», корабль того же класса, что и корабль-ковчег, доставивший наших предков на [Root.Capital.GetName&acc], должен был последовать за нами сюда с Земли ещё столетие назад. Нужно выяснить, что с ним случилось."
 nomads_observation_chain_title: "Необычные космические путешественники"
 nomads_observation_chain_desc: "Мы обнаружили на нашей территории странных инопланетян, к каналу связи которых мы не можем подключиться. Это значит, что перевести их переговоры невозможно, и нам остаётся только ждать, чтобы понять, кто они такие и чего хотят."
 shrouded_ship_chain_title: "Окутанный"
 shrouded_ship_chain_desc: "Один из наших кораблей пропал в Покрове."

 ####################################
 # Points of Interest
 ####################################

 hijacked_cult_fleet_poi: "Флотилия культистов"
 hijacked_cult_fleet_poi_desc: "Культистам удалось построить небольшую флотилию звёздных кораблей на секретном объекте на [Root.Capital.GetName&prep]. Когда их обнаружили, культисты сбежали на этих кораблях на [hijacked_fleet_planet.GetName&acc]. Их нужно уничтожить, пока они не причинили ещё больше вреда!"
 cultist_search_1_poi: "Поиск: [cultists_1.GetName]"
 cultist_search_1_poi_desc: "Мы засекли ионные следы от спасающихся бегством кораблей культистов в окрестностях этой звёздной системы. Следует провести разведку боем."
 cultist_search_2_poi: "Поиск: [cultists_2.GetName]"
 cultist_search_3_poi: "Поиск: [cultists_3.GetName]"
 cultist_shipyard_poi: "Уничтожить верфь культистов"
 cultist_shipyard_poi_desc: "Мы наконец определили, откуда берутся корабли культистов. Это какая-то древняя инопланетная верфь, которую они захватили в системе [cult_planet.System.GetName&gen]. Необходимо уничтожить это сооружение, пока фанатики не получили шанс раскрыть его настоящий потенциал."
 cultist_flagship_poi: "Найти флагман культистов"
 cultist_flagship_poi_desc: "Есть мнение, что неуловимый флагман культистов скрывается где-то в этой звёздной системе. Для противостояния с ним необходимо отправить хорошо вооружённую флотилию."
 probe_search_1_poi: "Выполнить поиск в системе [probe_system_1.GetName&gen]"
 probe_search_1_poi_desc: "Судя по исходящей траектории и времени, прошедшему с тех пор, как он покинул нашу родную систему, мы подозреваем, что один из наших пропавших субсветовых зондов находится где-то в этой звёздной системе."
 probe_search_2_poi: "Выполнить поиск в системе [probe_system_2.GetName&gen]"
 probe_search_3_poi: "Выполнить поиск в системе [probe_system_3.GetName&gen]"
 probe_search_4_poi: "Выполнить поиск в системе [probe_system_4.GetName&gen]"
 probe_ion_trail_poi: "Следуйте по ионному следу"
 probe_ion_trail_poi_desc: "Ионный след, принадлежащий одному из наших пропавших зондов, ведёт в эту систему."
 probe_subspace_anomaly_poi: "Вмешательство противника"
 probe_subspace_anomaly_poi_desc: "Противник мешает нам добраться до подпространственного зонда в этой системе."
 coming_storm_poi_1_poi: "Брешь"
 coming_storm_poi_1_poi_desc: "Судя по их текущему вектору, мы предполагаем, что приближающаяся масса подпространственных объектов войдёт в нашу галактику где-то в окрестностях этих звёздных систем."
 systems_visited_poi: "Системы посещены"
 hunting_hyacinth_poi: "Изучить системы"
 hunting_hyacinth_poi_desc: "Нам нужно закончить изучение этих систем и поискать следы пролёта «Гиацинта». Примитивные двигатели корабля-ковчега могли оставить ионный след."
 hunting_hyacinth_2_poi: "Исследовать систему"
 hunting_hyacinth_2_poi_desc: "Ионный след «Гиацинта» прослежен до этой системы. Нужно провести расследование."
 extradimensional_invasion_1_poi: "Межпространственный портал"
 extradimensional_invasion_1_poi_desc: "В системе [extradimensional_system.GetName&gen] обнаружен портал, из которого появляются экстрамерные захватчики. Пока он не будет уничтожен, они смогут постоянно присылать подкрепления."
 extradimensional_invasion_2_poi: "Второй портал"
 extradimensional_invasion_2_poi_desc: "Второй пространственный портал появился в системе [second_portal_system.GetName&gen]. Как и в случае с первым, через него в нашу галактику постоянно прибывают враждебные корабли из другого измерения."
 extradimensional_invasion_3_poi: "Третий портал"
 extradimensional_invasion_3_poi_desc: "Третий портал обнаружен в системе [third_portal_system.GetName&gen]. В этот самый момент он извергает враждебные корабли из другого измерения в наш мир."
 vultaum_1_poi: "Вультаумар"
 vultaum_1_poi_desc: "Теперь у нас есть координаты родной системы вультаумцев."
 yuht_1_poi: "Юутаан"
 yuht_1_poi_desc: "Наконец определено местонахождение древнего мира юутов."
 first_league_1_poi: "Фен Хаббанис"
 first_league_1_poi_desc: "Система Фен Хаббанис была политическим, административным и экономическим центром древней Первой лиги."
 irassian_1_poi: "Ирасс"
 irassian_1_poi_desc: "Система Ирасс была центром древнего Ирассианского конкордата."
 cybrex_1_poi: "Сайбрекс Альфа"
 cybrex_1_poi_desc: "Сайбрекс, похоже, удалился именно в эту звёздную систему."
 nomad_poi_1: "Обнаружение местонахождения"
 nomad_poi_1_desc: "Мы знаем, где находятся эти необычные космические путешественники. Ответом на любые наши попытки связаться с ними была тишина, поэтому мы можем только ждать, что произойдёт дальше."
 extradimensional_invasion_4_poi: "Межпространственные якоря"
 extradimensional_invasion_4_poi_desc: "Захватчики строят что-то вроде крупных космических станций, которые действуют как межпространственные «якоря» — проводники, улучшающие их способность перемещать корабли через свои червоточины. Чем больше таких якорей они введут в эксплуатацию, тем чаще они смогут вызывать подкрепление из собственного измерения.\n\nТакже эти якоря, похоже, значительно усиливают стабильность межпространственного портала. Пока активен хотя бы один якорь, портал будет практически неуязвим для оружия!"
 extradimensional_invasion_chain_2_title: "Заблудшие"
 extradimensional_invasion_chain_2_desc: "В нашей галактике появилась вторая фракция захватчиков из другого измерения, и они не менее враждебны, чем предыдущие. К счастью, экстрамерные существа, похоже, сражаются и между собой."
 extradimensional_invasion_chain_3_title: "Неотступные"
 extradimensional_invasion_chain_3_desc: "Из очередной червоточины возникла третья фракция экстрамерных существ. Хотя их целью также является поглощение всей жизни в галактике, они, похоже, ведут что-то вроде трёхсторонней войны с другими фракциями из своего измерения."

 precursor_activity: "Следы предтеч"

 new_precursor.1_poi: "Сообщения о предтечах"
 new_precursor.1_poi_desc: "Нам стало известно, что в данных координатах могут быть артефакты или важная информация о цивилизации предтеч."
 new_precursor_anomaly: "На §L[precursor_planet.GetName&prep]§! обнаружена новая аномалия, связанная с предтечами."

 prethoryn_defeated: "Преторинская напасть побеждена"
 anchor_station: "Межпространственный якорь"
 anchor_station_plural: "Межпространственные якоря"
 dimensional_anchors_1: "§YМежпространственные якоря активны§!"
 dimensional_anchors_2: "§YМежпространственные якоря активны§!"
 dimensional_anchors_3: "§YМежпространственные якоря активны§!"
 extradimensional_kills_us_1: "§GУбитые нами Незваные§!"
 extradimensional_kills_others_1: "§GУбитые другими Незваные§!"
 extradimensional_victims_1: "§RПотерянные корабли§!"
 extradimensional_planets_1: "§RПотерянные миры§!"
 extradimensional_kills_us_2: "§GУбитые нами Заблудшие§!"
 extradimensional_kills_others_2: "§GУбитые другими Заблудшие§!"
