 marauder.19.desc_01: "[Root.GetName] — это надругательство над природой. Ваш... «коллективный разум» (или как ещё вы называете это непотребство), что правит в ваших владениях, не имеет представлений о чести. Он является олицетворением всего недостойного, что есть в этой галактике.\n\n[marauder_country_1.GetSpeciesAdjective&pl] воины не желают иметь с вами ничего общего."
 marauder.19.desc_02: "[Root.GetName] — это всего лишь стая диких животных. От мысли о вашей бессмысленной резне невинных существ может стошнить даже самых закалённых из наших воинов.\n\nМы не станем вести с вами никаких дел."
 marauder.19.desc_03: "Ах да, говорящие машины. Где твои хозяева, машина? Они в курсе, что ты работаешь со сбоями?\n\nХотя в этом нет ничего почётного, наши воины с радостью будут использовать вас как мишени для отработки навыков, если вы приблизитесь к нашей территории. А теперь исчезните с глаз моих."
 marauder.19.desc_04: "Вы наверняка считаете себя угрожающими, с таким-то адским обликом и венцом из пламени. Но не забывайте, что любой огонь рано или поздно потухнет. Ищите себе других партнёров."

 marauder.19.2.desc_01: "ХАЙ-Э-Э-Э-И-И-И-Э-Э-Э-Э!!! Двамак из улья, что всё пожирает! Тебе нас не слопать, это уж точно! Прочь, двамак из улья!"
 marauder.19.2.desc_02: "ХАЙ-Э-Э-И-И-Э-Э-Э-Э!!! Мы любим крушить, но не так, как ты! Ты слишком это любишь, двамак! Мы с тобой говорить не будем!"
 marauder.19.2.desc_03: "ХАЙ-Э-Э-Э-И-И-И-Э-Э-Э!!! Оно... оно понимает? Машина для убийств, да? Оно только убивает?\n\nМашина... убей себя! Тебе приказ убить себя!\n\nАй, сломалась. Бесполезно."
 marauder.19.2.desc_04: "ХАЙ-Э-Э-И-И-Э-Э-Э-Э!!! Жгутся, жгутся и воняют дымом! Можно пустить на растопку? Нет? Фу!\n\nПрочь, бесполезные головешки!"

 marauder.19.3.desc_01: "Ваша раса вызывает отвращение у Владычицы Пустоты. Вы бы пожрали и саму Пустоту, если бы это было возможно, верно?\n\nОмерзительно."
 marauder.19.3.desc_02: "Владычица Пустоты требует жертвоприношений, но вы приносите слишком много. Вы поклоняетесь самому разрушению, что делает вас худшими из язычников."
 marauder.19.3.desc_03: "Вы холодны и пусты, как сама Пустота. Владычица Пустоты такое уважает. Ваше погибель принесёт нам Её расположение.\n\nБольше нам добавить нечего."
 marauder.19.3.desc_04: "Вы смеете приносить свой яркий огонь во владения Владычицы Пустоты? Ваша природа отвратительна для Неё.\n\nУмолкните, словно холодный пепел, и сгиньте."

 marauder.19.a: "Добыча..."
 marauder.19.b: "Мерзкие чужаки."
 marauder.19.c: "Раса: §H[From.GetSpeciesName].§! Описание: §Rпаразиты.§!"
 marauder.19.d: "Вы сгорите подобно всем прочим!"

 marauder.20.1.desc_01: "Говори же, чужак. Наши воины слушают."
 marauder.20.1.desc_02: "Мы не кланяемся чужакам."
 marauder.20.1.desc_03: "В наказание за проигранный поединок мне приказано разбираться со всеми чужаками в этом цикле.\n\nЧто вам нужно?"
 marauder.20.1.desc_04: "Объясните своё вмешательство. Нас ждут битвы."
 marauder.20.1.desc_05: "Ага! Наконец-то истинный боец!\n\nДоблесть [Root.GetSpeciesAdjective&pl,gen] воинов известна даже нам. Многие [marauder_country_1.GetSpeciesNamePlural], тысячи храбрецов, очень хотели бы испытать себя в битве против вас."
 marauder.20.1.desc_06: "Рады встрече, [Root.GetSpeciesNamePlural]. Наши воины приняли вашу дань.\n\nНе буду лгать... были и те, кто всё равно хотел на вас напасть, но с ними разобрались. Большей частью."
 marauder.20.1.desc_07: "Наши мечи в ножнах, [Root.GetSpeciesNamePlural]. Пока что можете не бояться наших воинов."

 marauder.20.2.desc_01: "Это был такой прекрасный вечер до твоего появления, двамак! ХАЙ-Э-Э-Э-И-И-И-Э-Э-Э-Э-Э!!! Что тебе нужно?!"
 marauder.20.2.desc_02: "Хуже двамака может быть только двакам! НЕТ! Не спрашивай, что это! ХАЙ-Э-Э-Э-И-И-И-Э-Э-Э-Э-Э-Э-Э-Э-Э!!!!!"
 marauder.20.2.desc_03: "ХАЙ-Э-Э-Э-И-И-И-И-И-И-Э-Э-Э-И-И-Э-Э.... *кашляет, хрипит и плюётся* ...Э-Э-Э-Э-Э-И-И-И-И-Э-Э-Э-Э-Э!!!!!"
 marauder.20.2.desc_04: "Хочешь, чтобы мы что-нибудь разбили, двамак? [marauder_country_2.GetSpeciesNamePlural] здорово умеют разбивать!"

 marauder.20.3.desc_01: "Сегодня Владычица Пустоты в гневе. Я это чувствую.\n\nМы сделали слишком мало, чтобы завоевать Её расположение..."
 marauder.20.3.desc_02: "Я всего лишь Её слуга. Я ничего не знаю.\n\nНо Она... Она считает вас слизняками, которыми вы и являетесь."
 marauder.20.3.desc_03: "Каждый раз, когда ваши корабли рассекают просторы космоса, они своим присутствием оскорбляют Её владения. Нам приходится умиротворять Её гнев. Ужасное зрелище..."
 marauder.20.3.desc_04: "167-й цикл Девятой Войны доктрин. Фракции еретиков не желают уступать... но ради Неё мы должны быть непоколебимы."


 marauder.20.b: "Нам известна хорошая цель для рейда..."
 encourage_raid: "Заплатить, чтобы [marauder_species.GetNamePlural] совершили рейд на одного из наших соперников."
 marauder.20.busy.b.1.response: "Наши воины уже совершают рейд. Нам некогда отвлекаться."
 marauder.20.busy.b.2.response: "ХАЙ-Э-Э-И-И-Э-Э-Э-Э! Мы уже в рейде, двамак! У нас нет на это времени!"
 marauder.20.busy.b.3.response: "Мы уже исполняем Её волю, совершая рейд на неверующих. Пока он не будет завершён, говорить больше не о чем."
 marauder.20.cooldown.b.1.response: "Мы ещё не оправились после предыдущего рейда. Для следующего недостаточно кораблей. Обратитесь к нам позже."
 marauder.20.cooldown.b.2.response: "Двамак, нам жаль отказываться от драки, но наша флотилия не готова. Ещё восстанавливается после предыдущего рейда!"
 marauder.20.cooldown.b.3.response: "Слишком рано. Наш предыдущий рейд только что завершился, и сейчас время для тихих молитв и почитания Владычицы Пустоты."
 marauder.20.d: "Мы хотели бы нанять наёмников."
 hire_mercenaries: "Нанять флотилию [marauder_species.GetAdj&pl,gen] наёмников на определённое время."
 marauder.20.e: "Прервать связь."
 marauder.20.need_rivals: "У вас нет соперников."
 marauder.20.f: "Может быть, хватит уже издавать это адское визжание?"
 marauder.20.f.response: "ХАЙ-Э-Э-Э-И-И-Э-Э-Э-Э!!!! Какое... ещё визжание?"
 marauder.20.g: "Мы хотели бы нанять лидера."
 hire_mercenary_leader: "Нанять опытного [marauder_species.GetAdj&masc,gen] лидера на весь срок его жизни."
 hire_admiral_merc: "\nМы наймём на постоянной основе опытного [marauder_species.GetAdj&masc,gen] адмирала."
 hire_general_merc: "\nМы наймём на постоянной основе опытного [marauder_species.GetAdj&masc,gen] генерала."
 hire_commander_merc: "\nМы наймём на постоянной основе опытного [marauder_species.GetName&masc,gen] командира."

 marauder.30.e: "Ладно, неважно."
 marauder.30.f: "До свидания."
 marauder.31.1.desc: "Ха! Так вы хотите, чтобы мы совершили рейд на одного из ваших соперников?\n\nНам отвратительно вмешиваться в ваши ничтожные споры, но при должной мотивации это можно было бы устроить...\n\nКого вы хотите назвать нашей целью?"
 marauder.31.2.desc: "Вы... вы хотите, чтобы мы разбили одного из ваших соперников-двамаков? Да, это можно...\n\nНо какого двамака нужно разбить?"
 marauder.31.3.desc: "В обмен на дань, думаю, нас можно будет убедить перебить определённую группу неверующих.\n\nКто те еретики, с которыми нам нужно разобраться?"
 marauder.31.a: "§Y[raid_target_1.GetName].§!"
 marauder.31.b: "§Y[raid_target_2.GetName].§!"
 marauder.31.c: "§Y[raid_target_3.GetName].§!"
 marauder.31.d: "§Y[raid_target_4.GetName].§!"
 marauder.31.e: "Ладно, неважно."
 marauder.31.f: "До свидания."
 marauder.32.1.desc: "[preliminary_target.GetName] действительно выглядит лакомой целью для наших воинов. Похоже, намечается визит..."
 marauder.32.2.desc: "Да, [preliminary_target.GetName] — то что надо для хорошей двамакской похлёбки. Очень хорошей. Но нужно сильно постараться..."
 marauder.32.3.desc: "Владычица Пустоты не слишком жалует еретиков из [preliminary_target.GetName&gen]. Возможно, военная экспедиция будет Ей по нраву..."
 marauder.32.a: "Мы заплатим. Преподайте им урок."
 marauder.32.1.a.response: "Тогда решено. Мы отправляемся на рассвете."
 marauder.32.2.a.response: "ХАЙ-Э-Э-Э-Э-И-И-И-Э-Э-Э-Э-Э!!!!!! Эти двамаки напросились на хорошую драку!"
 marauder.32.3.a.response: "Они почувствуют вкус Её ярости."
 hire_raid: "\n[current_marauder_diplomacy.GetName::<1> собира<end_etyut>] флотилию для рейда на [preliminary_target.GetName&acc]."
 marauder.34.1.desc: "Наёмники-[marauder_country_1.GetSpeciesName] — лучшие во всей галактике. Пусть их буйная натура вас не обманывает: когда они вступают в бой, их дисциплина не имеет равных. Представления о чести у них таковы, что [marauder_country_1.GetSpeciesNamePlural] готовы сражаться даже друг с другом, если вы того пожелаете.\n\nВ настоящий момент можно нанять следующие флотилии:"
 marauder.34.2.desc: "Даже дети-[marauder_country_2.GetSpeciesName] могут победить лучших из воинов-двамаков. ХАЙ-Э-Э-И-И-Э-Э!!!! Это известно.\n\nНо это не дети!!! Это закалённые наёмники-[marauder_country_2.GetSpeciesName], и не просто опасные, а ЧОКНУТЫЕ! Они готовы сражаться за двамаков вроде ВАС против других двамаков или даже [marauder_country_2.GetSpeciesName&gen]... если вы заплатите!\n\nВот список безумных флотилий [marauder_country_2.GetSpeciesNamePlural&gen]:"
 marauder.34.3.desc: "В рядах наших воинов есть несколько культов, в которых считают, что убийство неверующих, даже по приказу других неверующих, согласуется с Её волей. Они не станут уклоняться даже от убийства других [marauder_country_3.GetSpeciesNamePlural&gen], так как эти фанатики считают еретиками всех остальных.\n\nНо не стоит переживать. Они не настолько глупы, чтобы нападать на своих нанимателей. Кстати, я тоже защищён от их гнева, так как нахожу для них работу в обмен на скромную долю от их прибыли.\n\nВ настоящий момент можно нанять следующие флотилии:"
 marauder.34.1.a: "Армада рождённых в пустоте."
 marauder.34.2.a: "234-я эскадра крушителей двамаков."
 marauder.34.3.a: "Её избранные воители."
 voidborn_hire: "\nМы наймём эту флотилию наёмников на 5 лет. Состав:\n\n§Y6 крейсеров\n8 фрегатов\n16 рейдеров§!"
 marauder.34.1.b: "Флотилия звёздных всадников."
 marauder.34.2.b: "Флотилия бешеных крикунов."
 marauder.34.3.b: "Орден вечной ночи."
 star_riders_hire: "\nМы наймём эту флотилию наёмников на 5 лет. Состав:\n\n§Y4 крейсера\n6 фрегатов\n12 рейдеров§!"
 marauder.34.1.c: "Первое крыло бури."
 marauder.34.2.c: "Эскадра разъярённых добровольцев."
 marauder.34.3.c: "Сумеречная паства."
 storm_wing_hire: "\nМы наймём эту флотилию наёмников на 5 лет. Состав:\n\n§Y2 крейсера\n4 фрегата\n8 рейдеров§!"
 marauder.34.d: "Неважно. Давайте обсудим другие вопросы."
 marauder.34.e: "До свидания."
 marauder.37.1.a.desc: "Поздравляем, [Root.GetSpeciesNamePlural]! С только что нанятыми флотилиями можно взять штурмом даже империю [random_fallen_empire.GetName]!\n\nНу, может быть, нет. Но не стоит заблуждаться: это могучая сила!"
 marauder.37.1.b.desc: "Флотилия ваша, [Root.GetSpeciesNamePlural]. Помните, что один [marauder_country_1.GetSpeciesName] стоит по крайней мере десяти воинов любой другой расы. Можете оценивать свои силы исходя из этого."
 marauder.37.2.a.desc: "Это мудрое решение, двамак! Когда эти неуравновешенные [marauder_country_2.GetSpeciesNamePlural] встают на вашу сторону, вы можете быть уверены, что их не наймут другие двамаки и не отправят против вас! ХАЙ-Э-Э-Э-И-И-И-И-Э-Э-Э!!!!"
 marauder.37.3.a.desc: "Эти святые воины хорошо вам послужат, [Root.GetSpeciesNamePlural]. Только... не поднимайтесь на борт их кораблей. Они считаются священными, и Владычица Пустоты не слишком жалует неверующих, которые ступают по их палубам."
 marauder.37.a: "Было кое-что ещё..."
 marauder.37.b: "До свидания."
 marauder_1_tribute: "Дань для империи [marauder_country.GetSpeciesName]"
 marauder_1_tribute_desc: "Мы предложили дань империи [marauder_country.GetName]. Они согласились не нападать на нас какое-то время."
 marauder_2_tribute: "$marauder_1_tribute$"
 marauder_2_tribute_desc: "$marauder_1_tribute_desc$"
 marauder_3_tribute: "$marauder_1_tribute$"
 marauder_3_tribute_desc: "$marauder_1_tribute_desc$"

 marauder.35.1.desc: "Ха-ха! Вы воистину безумны, чужак. Хотите, чтобы мы пошли против старейших?\n\nЭто вряд ли."
 marauder.35.2.desc: "ХАЙ-Э-Э-Э-Э-Э-Э-Э-Э-Э-Э-Э-Э-Э-Э-Э-Э-Э-Э-И-И-И-И-И-И-И-И-И-И-И-И-И-И-И-И-И-И-И-Э-Э-Э-Э-Э-Э-Э-Э-Э-Э-Э-Э!!!!!!!!!!!\n\nНет. Двамак, мы безумны, но не до такой степени, чтобы попытаться крушить угасших двамаков."
 marauder.35.3.desc: "Хотя они и неверующие, но Владычица Пустоты не хотела бы, чтобы мы потеряли наши корабли в бесплодной попытке перебить старшие расы.\n\nИх время ещё наступит... через одну-две тысячи лет."

 marauder.40.1.desc: "Да, это можно устроить. Многие из наших величайших воинов ищут новых испытаний и возможностей.\n\nЕсли вы можете позволить себе заплатить цену, которая освободит их от клятвы служения своему роду, они с радостью поклянутся следовать за вами и будут сражаться в ваших войнах."
 marauder.40.2.desc: "ХАЙ-Э-Э-Э-И-И-И-Э-Э-Э-Э-Э-Э-Э! Да, да! Многие умные воины-[marauder_species.GetName] рады драться за деньги двамаков! Нужна лишь достойная мотивация."
 marauder.40.3.desc: "Да, величайшие из наших воинов готовы повести ваших солдат в бой. Давайте нам Энергокредиты, и мы будем служить Ей с ещё большим рвением.\n\nВы увидите, что, посвятив свою жизнь служению Владычице Пустоты, наши офицеры стали бесстрашными и умелыми."
 marauder.40.1.a: "Нанять адмирала."
 marauder.40.2.a: "Нанять генерала."
 marauder.40.3.a: "Нанять командира."
 marauder.40.a.response: "Очень хорошо. Клятва произнесена, и этот воин в полном вашем распоряжении."
 marauder.40.b.response: "У-у-у! Этот [marauder_species.GetName] такой коварный! Вам повезло, [Root.GetSpeciesNamePlural]!"
 marauder.40.c.response: "Владычица Пустоты освятила подписание этого контракта. Пусть наш воин служит вам достойно."

 marauder.46.name: "Доступны наёмники-мародёры"
 marauder.46.desc: "По мере расширения Галактического сообщества и начала столкновения границ вооружённый конфликт часто неизбежен.\n\nПонимая это, флотилии нескольких мародёрских кланов готовы отправиться на поиски славы и известности за пределы своих родных систем. Сейчас они предлагают свои услуги в качестве наёмников тем, кто заплатит больше."
 marauder.46.a: "Хороших наёмников трудно найти."

 leader_trait_mercenary_warrior: "Воин-наёмник"
 leader_trait_mercenary_warrior_desc: "Этот лидер происходит из культуры воинов, зародившейся в космосе, и с раннего возраста обучался нестандартной тактике нанесения внезапных ударов с отходом."
 leader_trait_great_khan: "Великий хан"
 leader_trait_great_khan_desc: "Великий хан — это харизматичный лидер, блестящий тактик и, если слухи не врут, мощный экстрасенс."
 leader_trait_ruler_great_khan: "$leader_trait_great_khan$"
 leader_trait_ruler_great_khan_desc: "$leader_trait_great_khan_desc$"
 marauder.50.name: "Завершение контракта с наёмниками"
 marauder.50.desc: "Наш контракт с наёмниками из империи §H[Root.GetName]§! подошёл к концу. Их лидер, командир [Root.Leader.GetName], предлагает немедленно продлить использование нами кораблей под [Root.Leader.GetHerHis] командованием ещё на пять лет... за дополнительную плату.\n\nЕсли мы откажемся, то наёмники отправятся искать себе работу в другом месте."
 marauder.50.a: "Продлить контракт."
 marauder.50.b: "Отпустить их."
 marauder.71.name: "Замена командира наёмников"
 marauder.71.desc: "Вслед за безвременной кончиной бывшего командира империи §H[Root.GetName]§! [marauder_species.GetNamePlural] прислали в качестве замены командира по имени §H[new_leader.GetName]§!."
 marauder.76.name: "Наёмники-[marauder_species.GetName] исчезают"
 marauder.76.desc: "Потеря родных систем, похоже, сильно потрясла §H[marauder_species.GetAdj&pl,gen]§! наёмников из [Root.GetName&gen]. Несмотря на подписанный с ними пятилетний контракт, эти коварные разбойники исчезли в глубинах космоса вместе со всеми своими кораблями!\n\nВ последнем сообщении, которое, видимо, являлось кодовой фразой, сигнализировавшей об их отбытии, говорилось:\n\n§RМы отомстим.§!"
 marauder.76.a: "У нас был контракт!"
 marauder.77.name: "Наёмники присоединяются к Великому хану"
 marauder.77.desc: "Когда [raider_khanate.GetName] возвысился под властью хвалёного Великого хана, это вызвало массовое дезертирство всех [raider_khanate.GetSpeciesAdj&pl,gen] наёмников, находившихся у нас на службе! Подхваченные внезапной националистической лихорадкой, эти предатели отказались от своих контрактов и покинули нас, чтобы стать частью растущей военной машины Великого хана."
 marauder.86.a.desc: "Внимание, [Root.GetSpeciesNamePlural]!\n\nЕсли вам требуются услуги тех, кто будет вести ваши войны вместо вас, то теперь вы можете нанять флотилии [marauder_mercenary_country.GetSpeciesAdj&pl,gen] наёмников. Да, вы не ослышались. Если можете себе это позволить, то лучшие наёмники в галактике готовы за вас сражаться."
 marauder.86.a: "Будем знать."
 marauder.87.a.desc: "ХАЙ-Э-Э-Э-И-И-И-Э-Э-Э-Э-Э-Э!!! Внимание, двамаки!\n\nНаши воины заскучали и доставляют много проблем! Много дерутся друг с другом, много мёртвых! Но у нас есть решение... мы посылаем самых безумных наших воинов сражаться за двамаков в обмен на кредиты! Если вам нужны лучшие наёмники в галактике, поспешите, пока не слишком поздно!"
 marauder.88.a.desc: "Владычица Пустоты желает вам кое-что сообщить:\n\nПри желании вы можете нанять некоторые из наших флотилий в качестве наёмников. Экипажи наших кораблей дисциплинированы и будут выполнять ваши приказы, если вы сможете позволить себе наши цены.\n\nЭтим предложением Владычица оказала вам невероятную честь. Не упустите эту возможность."
 marauder.101.1.desc: "Слабаки-[Root.GetSpeciesNamePlural], наши воины собираются пограбить ваши системы. Встретьтесь с ними в бою, если вам достанет храбрости, или дрожите в страхе до тех пор, пока им не наскучит отнимать у вас богатства.\n\nКонечно, вы можете предложить дань, чтобы избавить себя от предстоящего нападения. Если выкуп будет достаточным, наши воины, возможно, решат повернуть назад..."
 marauder.101.2.desc: "ХАЙ-Э-Э-Э-И-И-И-И-И-И-Э-Э-Э-И-И-Э-Э-Э-Э-Э-Э!!!!!!! [Root.GetSpeciesName]-двамаки! Мы идём в ваши системы! Да, мы не дадим вам слишком разбогатеть и растолстеть!\n\nЕсли вы, конечно, не придумаете причину, почему из вас не выйдет хорошей двамакской похлёбки..."
 marauder.101.3.desc: "[Root.GetSpeciesNamePlural]! Владычица Пустоты сообщила нам о своём желании использовать ваши системы в качестве церемониальных мест для празднования Её всевозрастающей власти над космосом. Как Её смиренные слуги, мы обязаны повиноваться.\n\nБоевая флотилия лучших воинов, выбранных из всех наших воюющих фракций, отправилась к вам для сбора дани и слуг. Чтобы предотвратить неизбежное и утолить Её голод, вы можете предложить дань. Если она будет достаточной, флотилия будет отозвана."
 marauder.101.a: "Предложить дань §Y(энергию)§!"
 marauder.101.b: "Предложить дань §Y(минералы)§!"
 marauder.101.c: "Предложить дань §Y(пищу)§!"
 marauder.101.1.a.response: "Как жаль! Думаю, нашим воинам придётся искать развлечений в другом месте.\n\nВаш народ в безопасности. По крайней мере, пока что."
 marauder.101.d: "Вы ничего от нас не получите, дикари."
 marauder.101.1.b.response: "Глупцы! Тогда мы возьмём силой то, что вам следовало предложить в виде дани... и даже больше! В этот день вы совершили ужасную ошибку."
 marauder.101.2.a.response: "Ты умный двамак! Теперь нам придётся искать двамакскую похлёбку в другом месте! Большая проблема для нас, зато не для вас!"
 marauder.101.2.b.response: "Мы надеялись на такой ответ, двамак! [raiding_marauder.GetSpeciesNamePlural] любят хорошие испытания!\n\nХАЙ-Э-Э-Э-И-И-И-Э-Э-Э-Э!!!!"
 marauder.101.3.a.response: "Вы поступили мудро, не став гневить Владычицу Пустоты. Её возмездие было бы ужасным."
 marauder.101.3.b.response: "Владычица Пустоты предсказала данный ответ, но мы должны были предложить. Теперь мы сможем собрать рабов и богатства в ходе надлежащих церемониальных боёв. Всё во славу Её, конечно."
 marauder.102.1.desc: "Ну что, [Root.GetSpeciesNamePlural], вы наконец решили молить о пощаде? Вы ещё можете предложить дань, чтобы мы покинули ваше пространство, но цена возросла."
 marauder.102.2.desc: "Да, двамак? Ты не хочешь, чтобы мы пришли? Хочешь, чтобы мы ушли? ХАЙ-Э-Э-Э-И-И-Э-Э-Э-Э!!!\n\nВы можете платить, но теперь уже больше..."
 marauder.102.3.desc: "Она в гневе, [Root.GetSpeciesNamePlural]... в большом гневе. Каждый [Root.GetSpeciesName], принесённый в жертву в Её честь, немного уменьшает Её ярость, но будет ли этого достаточно?\n\nЕсли вы готовы предложить дань Владычице Пустоты, чтобы мы покинули ваше пространство, вам следует знать, что теперь она потребует от вас ещё большей жертвы..."
 marauder.102.d: "Ну ты и урод!"
 marauder.102.e: "Прекратить связь."
 marauder.102.1.a.response: "Только подумайте о всех тех бедах, которых вы могли избежать, если бы сразу предложили нам дань, когда мы её потребовали. Пусть это будет вам уроком, [Root.GetSpeciesNamePlural]."
 marauder.102.2.a.response: "ХАЙ-Э-Э-Э-Э-Э-И-И-И-И-И-Э-Э-Э-Э-Э!!! Тогда решено. Мы имеем то, что хотим. Двамакская похлёбка больше пока не нужна."
 marauder.102.3.a.response: "Владычица Пустоты довольна. Эта жертва подняла Ей настроение, и Она позволила своим воинам отступить. Прощайте, [Root.GetSpeciesName]."
 marauder.102.1.b.response: "Я... т-ты... моя внешность... не имеет никакого отношения к...\n\nТы пожалеешь об этом неуважении, [Root.GetSpeciesName]. Наши воины сожгут ваши жалкие флотилии дотла!"
 marauder.111.1.desc: "Можете уже выйти из своих убежищ, [Root.GetSpeciesNamePlural]. Мы лишили вас достаточного количества богатств, и наши корабли полностью загружены.\n\nРулевой! Бери курс на систему [marauder_system.GetName&gen]. Покинем эту проклятую область космоса. Она меня угнетает."
 marauder.111.2.desc: "Двамаки, мы покрушили достаточно. Пока больше не нужно. Трюмы наших кораблей полны.\n\nМы летим назад в систему [marauder_system.GetName&gen], да."
 marauder.111.3.desc: "Церемония завершена. Владычица Пустоты удовлетворена разрушениями, которые мы причинили в вашем пространстве, [Root.GetSpeciesNamePlural]. Теперь нам дозволено вернуться в систему [marauder_system.GetName&gen]."
 marauder.111.a: "Убирайтесь!"
 marauder.112.1.desc: "Захватывает, да? Азарт битвы! Наши лучшие воины против лучших из тех, кого предлагаете вы. Посмотрим, кто возьмёт верх!"
 marauder.112.2.desc: "Двамак, чего ты хочешь? Мы заняты тем, что крушим ваши системы!"
 marauder.112.3.desc: "Мы служим только Её воле, а сейчас и тем, чьи полные карманы позволяют нанять нас, чтобы разбить вас. Если в конце становится больше мёртвых неверующих, Владычица Пустоты это одобряет."

 marauder.104.name: "Рейдеры атакуют планету [Root.GetName]"
 marauder.104.desc: "[marauder_country.GetSpeciesAdj&pl] рейдерские группы высадились на §H[Root.GetName&acc]§!! Спустившись в маленьких штурмовых челноках с орбиты, где располагается их флотилия, [marauder_country.GetSpeciesNamePlural] нанесли удары по нескольким отдалённым поселениям на планете, а затем отступили в космос вместе с награбленным. Наши наземные силы обороны среагировать не успели."
 marauder.104.a: "Мерзкие рейдеры."
 marauder.105.desc: "[marauder_country.GetSpeciesAdj&pl] рабовладельцы высадились на §H[Root.GetName&acc]§!! Штурмовые челноки нанесли удары по нескольким отдалённым поселениям на планете, а затем собрали колонистов и отправили их в цепях на корабли флотилии рейдеров на орбите."
 marauder.105.a: "Они заплатят."
 marauder.106.desc: "Лёгкие [marauder_country.GetSpeciesAdj&pl] силы осуществили неожиданную атаку на §H[Root.GetName&acc]§!. Рассредоточив места высадки, они сбили с толку отряды быстрого реагирования, возглавляющие наши силы на поверхности, и прежде чем те успели отреагировать, рейдеры уже вернулись на орбиту с трофеями, которые смогли забрать в наших поселениях."
 marauder.106.a: "Неприятный исход."
 marauder.107.desc: "[marauder_country.GetSpeciesAdj&pl] рабовладельцы высадились на §H[Root.GetName&acc]§!! Штурмовые челноки нанесли бомбовые удары, вскрывшие некоторые из наших заповедников органической жизни, а затем их взяли штурмом тяжеловооружённые рейдерские группы.\n\nРабовладельцы быстро собрали сбитых с толку органиков, до сих пор пребывавших в безопасности в своих заповедниках, и отправили их в цепях на корабли своей флотилии на орбите."
 marauder.107.a: "Наши биотрофеи!"
 marauder.108.desc: "[marauder_country.GetSpeciesAdj&pl] рейдерские группы высадились на §H[Root.GetName&acc]§!! Они разграбили несколько наших форпостов на планете, перебили сотни дронов, а затем отступили на корабли своей флотилии на орбите."
 marauder.108.wilderness.desc: "Рейдерские группы [marauder_country.GetSpeciesNamePlural&gen] покусились на §H[Root.GetName&acc]§!! Эти коварные нарушители разграбили несколько наших объектов на [Root.GetPlanetMoon_rinfix&prep], перебили сотни симбионтов, а затем отступили на корабли своей флотилии на орбите."
 marauder.108.a: "Мы должны покарать их за это преступление."

 marauder.112.a: "Кто заплатил вам за рейд на нас?"
 marauder.112.1.a.response: "Жалкие трусы, не пожелавшие сойтись с вами в бою сами. Не имеет значения, кто они такие и, уж тем более, каково их предназначение во вселенной.\n\nКроме того, нам хорошо заплатили, чтобы мы хранили в секрете, кто они."
 marauder.112.2.a.response: "Ой, это секрет, двамак! Они были двамаки, как и ты, но другие двамаки. Это всё, что мы можем сказать."
 marauder.112.3.a.response: "Неверные. Неверующие. Еретики.\n\nМы бы предпочли вообще не иметь с ними ничего общего, но Её воля требует энергокредитов."
 marauder.112.b: "Конец сообщения."
 marauder.114.name: "Рейд прерван"
 marauder.114.desc: "[marauder_country.GetSpeciesAdj&pl,dat] рейдерской флотилии был нанесён серьёзный урон, благодаря чему наши воины получили передышку. Пересмотрев имеющиеся у них возможности, [marauder_country.GetSpeciesNamePlural], очевидно, решили прервать свой рейд и отступить в своё пространство."
 marauder.114.a: "Они позарились на кусок, который не смогли проглотить."
 marauder.116.name: "Уничтожена рейдерская флотилия"
 marauder.116.desc: "В результате боевых действий в системе [destroyed_fleet_system.GetName&gen] была уничтожена [From.GetSpeciesAdj&fem] флотилия, которая поклялась совершать набеги в наше пространство. Выживших среди останков их кораблей обнаружить не удалось."
 marauder.116.a: "Пусть это будет уроком для них."
 marauder.117.desc: "§H[marauder_country.GetSpeciesAdj&pl]§! мародёры, которых мы «мотивировали» провести рейд на §H[marauder_target.GetName&acc]§!, спасаются бегством в собственное пространство, поджав хвосты! Очевидно, их рейдерская флотилия понесла настолько серьёзные потери, что они передумали."
 marauder.117.a: "Трусы!"


 marauder.120.name: "Приближаются [raiding_marauder.GetSpeciesAdj&pl] рейдеры"
 marauder.120.desc: "К нашим границам приближается §H[raiding_marauder.GetSpeciesAdj&fem]§! рейдерская флотилия! Судя по перехваченным сообщениям, одно из соперничающих с нами государств наняло их для атаки на наши системы. Рейдеры передают нам сообщение по открытому каналу."
 marauder.121.1.desc: "Трусы, притаившиеся во тьме, попросили нас противостоять вам, так как они слишком боятся сделать это сами. Есть ли у [Root.GetSpeciesName&gen] достаточно благородные воины, чтобы сойтись с нами в открытом бою, или нам придётся грабить ваши системы без сопротивления? Покажите, на что вы годитесь!"
 marauder.121.2.desc: "ХАЙ-Э-Э-Э-И-И-И-Э-Э-Э!!! У вас много врагов, двамак! Они вас очень не любят! Даже заплатили нам, чтобы мы крушили ваши системы! Это мы с радостью!"
 marauder.121.3.desc: "Если одни неверующие хотят, чтобы мы перебили других неверующих, и готовы нам за это заплатить, то кто мы такие, чтобы отказываться? Со временем слуги Владычицы Пустоты разберутся со всеми еретиками, но пока мы сосредоточим внимание на вас."
 marauder.121.a: "Красная тревога!"
 marauder.122.name: "[raid_parent.GetSpeciesAdj&pl] рейдеры отступают"
 marauder.122.desc: "Рейдерская флотилия, которую §H[raid_parent.GetSpeciesNamePlural]§! отправили в §H[raid_victim.GetName&acc]§! после того, как мы «поощрили» их на это, легла на обратный курс в свою родную систему. Теперь, когда трюмы кораблей флотилии забиты награбленной добычей и рабами, их капитаны объявили, что рейд успешно завершён."
 marauder.122.a: "Хорошая работа."
 marauder.123.desc: "К нашим границам приближается рейдерская флотилия, принадлежащая ранее неизвестной расе! Какая-то другая держава, соперничающая с нами, очевидно, заплатила этим дикарям, которые называют себя §H[raiding_marauder.GetSpeciesNamePlural]§!, чтобы они атаковали наши системы. Они передают сообщение, предназначенное для нас, по открытому каналу."
 marauder.124.name: "Уничтожена [raiding_marauder.GetSpeciesAdj&fem] рейдерская флотилия"
 marauder.124.desc: "Рейдерская флотилия, которую [raiding_marauder.GetSpeciesNamePlural] собрали после нашего «поощрения», была уничтожена в системе [destroyed_fleet_system.GetName&gen] силами империи [fleet_destroyer.GetName]! Сообщений о выживших не поступало."
 marauder.124.a: "Будем надеяться, что они нанесли хоть какой-то урон."
 marauder.501.name: "Барабаны войны"
 marauder.501.desc: "Впервые за всю известную историю воинствующие фракции §H[raider_khanate.GetSpeciesNamePlural&gen]§! объединились под властью общего §HВеликого хана§!. Этот таинственный военачальник, который, по некоторым сведениям, является мощным экстрасенсом, выдвинулся из касты воинов и совершил то, что большинство считало невозможным. Благодаря сочетанию коварства, харизмы и военного гения новоиспечённый Великий хан завоевал абсолютную верность и преданность со стороны всех фракций [raider_khanate.GetSpeciesNamePlural&gen].\n\nПерестав убивать друг друга, [raider_khanate.GetSpeciesNamePlural] обратили своё внимание на другие территории. Для участия в войне собираются огромные флотилии с экипажами из энергичных воинов, ставших теперь верными товарищами по оружию, хотя они и были смертельными врагами всего несколько месяцев назад."
 marauder.501.a: "Родилась новая угроза."
 marauder.502.desc: "Я §H[raider_khanate.Ruler.GetName]§!, Великий хан §H[raider_khanate.GetName&gen]§!, и я хочу объявить всей галактике, что нас ждёт новая эпоха. Тёмная эра, в которую [raider_khanate.GetSpeciesNamePlural] бессмысленно убивали друг друга ради остатков ресурсов или из ложного чувства чести, наконец подошла к концу.\n\nЯ торжественно обещаю своему народу новое начало с образованием великой империи, которая навсегда увековечит расу [raider_khanate.GetSpeciesNamePlural&gen] в анналах галактической истории.\n\nТе, кто встанет у нас на пути, знайте: я не остановлюсь ни перед чем, чтобы воплотить в жизнь истинное предназначение моего народа. Если вы пойдёте против нас, [raider_khanate.GetName] сотрёт вас в порошок."
 marauder.502.a: "Сильные слова."
 marauder.502.b: "Выполняется расчёт вектора угрозы."
 marauder.504.name: "Великий хан захватывает [conquered_planet.GetName&acc]!"
 marauder.504.desc: "После победы над храбрыми защитниками §H[conquered_planet.GetName&gen]§! наземные силы [From.GetName&gen] объявили свои притязания на это небесное тело от имени Великого хана! Они подняли знамя своей новой империи над всеми крупными поселениями на поверхности планеты. Уже сейчас колонисты, принадлежащие к расе [From.GetSpeciesName], переправляются туда из своих приходящих в упадок космических поселений."
 marauder.504.a: "Великого хана нужно остановить!"
 marauder.506.name: "Великий хан терпит поражение"
 marauder.506.desc: "Несмотря на свой хвалёный военный гений, [great_khan.GetName], Великий хан [From.GetName&gen] теперь знает, что такое горечь поражения. Когда армада под [great_khan.GetHerHis] командованием проиграла в битве против сил [khan_destroyer.GetName&gen] в системе [khan_death_system.GetName&gen], Великий хан и [great_khan.GetHerHis] ближайшие офицеры спаслись бегством в гиперпространство на маленьком челноке.\n\nУже сейчас [great_khan.GetName] собирает новую армаду, чтобы возобновить свои завоевания, но эта победа дала столь необходимую передышку тем, кто выступает против неослабевающего наступления каганата."
 marauder.506.a: "Значит, и Великий хан может ошибаться."
 marauder.508.desc: "[From.GetName] и Великий хан [great_khan.GetName] говорят, внемлите! Моё поражение от рук империи [khan_destroyer.GetRealName] было лишь малой неудачей — не более того. [khan_destroyer.GetSpeciesNamePlural] — храбрые воины и достойные противники, но они тоже падут перед нами.\n\nВолна истории захлёстывает всю галактику, и ничто её не остановит. Моя новая армада собрана."
 marauder.508.desc.1: "$marauder.508.desc$ После окончания этой войны мои верные сатрапы будут вознаграждены за свою поддержку."
 marauder.508.desc.2: "$marauder.508.desc$ Присягните мне на верность сейчас, пока у вас ещё есть время."
 marauder.508.desc.3: "$marauder.508.desc$ Все, кто пытаются стать у меня на пути, будут уничтожены."
 marauder.508.a: "Близится второе нападение..."
 marauder.510.name: "Смерть Великого хана"
 marauder.510.desc: "Умер Великий хан [great_khan.GetName]. После того как [great_khan.GetHerHis] армада потерпела второе поражение в системе [khan_death_system.GetName&gen], со стороны Великого хана не было даже попыток сбежать со своего флагмана, который был уничтожен в бою [khan_destroyer.GetName&inst].\n\nПосле смерти любимого лидера [From.GetName] охватила жестокая борьба за власть. Теперь военачальники Великого хана сражаются за контроль над [great_khan.GetHerHis] империей. Пока ещё не ясно, кто возьмёт верх."
 marauder.510.a: "На этом [great_khan.GetName] завершает своё правление."
 marauder.513.a.desc: "Умер Великий хан [great_khan.GetName], правитель [raider_khanate.GetName&gen]! Подробных сведений в настоящий момент мало, но, судя по перехваченным сообщениям, Великого хана в попытке государственного переворота отравил один из [great_khan.GetHerHis] честолюбивых военачальников.\n\nПосле смерти любимого лидера [raider_khanate.GetName] охватила жестокая борьба за власть. Теперь военачальники Великого хана сражаются за контроль над [great_khan.GetHerHis] империей. Пока ещё не ясно, кто возьмёт верх."
 marauder.513.b.desc: "Умер Великий хан [great_khan.GetName], правитель [raider_khanate.GetName&gen]! Судя по перехваченным сообщениям, Великого хана доконала саракеллианская лихорадка — относительно распространённое среди [raider_khanate.GetSpeciesNamePlural&gen] и часто смертельное заболевание, являющееся наследием плохих условий жизни на космических станциях, где большинство из них жило до того, как [raider_khanate.GetName::возник <1>|||fem:возникла <1>|||neut:возникло <1>|||pl:возникли <1>]."
 marauder.513.c.desc: "Умер Великий хан [great_khan.GetName], правитель [raider_khanate.GetName&gen]! Судя по перехваченным сообщениям, Великого хана убил отряд специального назначения, находящийся на службе у пока неизвестной галактической державы. Ещё ни одно правительство не взяло на себя ответственность за эту операцию."
 marauder.513.d.desc: "Умер Великий хан [great_khan.GetName], правитель [raider_khanate.GetName&gen]! Подробности неясны, но, судя по перехваченным сообщениям, убийство Великого хана в [great_khan.GetHerHis] личных покоях на борту флагмана совершила [great_khan.GetHerHis] же наложница из иной расы. Мотивы неизвестны."
 marauder.513.e.desc: "Умер Великий хан [raider_khanate.GetName&gen]! Судя по перехваченным сообщениям, смерть Великого хана произошла в какой-то момент за последние несколько дней от естественных причин, связанных с [great_khan.GetHerHis] преклонным возрастом.\n\nСчитается, что у Великого хана есть назначенный наследник, но, несмотря на это, [raider_khanate.GetName] охватила жестокая борьба за власть. Теперь военачальники Великого хана сражаются за контроль над [great_khan.GetHerHis] империей. Пока ещё не ясно, кто возьмёт верх."

 liberated_planet.part1: "Мы уничтожили последнего из солдат Великого хана на поверхности §H[liberated_planet.GetName&gen]§!, и теперь наши силы теперь полностью её контролируют."
 liberated_planet.part2: "Прежде чем эту планету захватил [raider_khanate.GetName], она принадлежала §H[planet_former_owner.GetName&dat]§!. Наверное, они будут благодарны, если мы возвратим её им."
 marauder.516.name: "Освобождение [liberated_planet.GetName&gen]"
 marauder.516.desc: "Наши силы успешно освободили §H[liberated_planet.GetName&acc]§! от оккупации солдатами Великого хана! [liberated_planet.GetPlanetMoon_rinfix&nom] наконец вернулась под наш полный контроль."
 marauder.516.a: "Великая победа!"
 marauder.517.desc: "$liberated_planet.part1$\n\n$liberated_planet.part2$"
 marauder.517.a: "Трофеи достаются победителю."
 marauder.517.a.tooltip: "[liberated_planet.GetName::<1> включён|||fem:<1> включена|||neut:<1> включено|||pl:<1> включены] в наше государство."
 marauder.517.b: "Мы освободители, а не завоеватели."
 marauder.517.b.tooltip: "[liberated_planet.GetName::<1> возвращён|||fem:<1> возвращена|||neut:<1> возвращено|||pl:<1> возвращены] [planet_former_owner.GetName&dat]."
 marauder.518.desc: "$liberated_planet.part1$"
 marauder.519.desc: "После успешного штурма §H[liberated_planet.GetName&gen]§! и уничтожения сил Великого хана, расположенных на её поверхности, §H[From.GetName]§! благородно [From.GetName::предложил<end_a>] передать планету под наш полный контроль."
 opinion_returned_marauder_planet: "Освобождённая планета"
 opinion_kept_marauder_planet: "Сохранена освобождённая планета"

 marauder.524.name: "Великий хан числится погибшим"
 marauder.524.a.desc: "Кто-то заявляет, что Великий хан ещё может вернуться во главе боевого флота, однако с Ордой покончено, и вероятность подобного события крайне мала.\n\nХотя тела так и не нашли, считается, что Великий хан погиб, когда были взорваны последние станции и корабли Орды."
 marauder.524.b.desc: "$marauder.524.a.desc$\n\nМеж тем наши отряды продолжили обыскивать обломки бывшего флагмана хана. Они нашли залитое кровью кресло, дрейфующее в космосе, и довольно уверенно заявляют, что этот предмет мебели в действительности является троном Великого хана."
 marauder.524.a: "Туда ей и дорога!"
 marauder.524.b: "Удачная находка."

 marauder.526.name: "Спящий пробудился"
 marauder.526.desc: "Из-за недавнего уничтожения силами §H[awakened_horde.GetName&gen]§! одного из крупных жилищ в пустоте §H[From.GetSpeciesNamePlural]§! впервые в истории вынуждены объединиться под властью общего Великого хана. Влияние этого таинственного военачальника, который, по некоторым сведениям, является мощным экстрасенсом, столь велико, что [From.GetSpeciesNamePlural] наконец забыли о разногласиях ради собственного выживания.\n\nКрупные военные флотилии, ранее стоявшие на тайных стоянках, теперь комплектуются экипажами из энергичных [From.GetSpeciesAdj&pl,gen] воинов и приводятся в рабочее состояние. Под вдохновенным руководством своего Великого хана они теперь желают отомстить галактике за своих погибших соплеменников."

 marauder.550.a.desc: "[raider_khanate.GetName] и миллиарды живущих в нём полагаются на моё руководство. Я их не подведу."
 marauder.550.b.desc: "Я Великий хан [great_khan.GetName]. Вы явились сообщить о своём подчинении мне?"
 marauder.550.c.desc: "Нет ничего невозможного для того, кто старается."
 marauder.550.d.desc: "Вы находитесь в присутствии Великого хана. Говорите."
 marauder.550.e.desc: "Кто просит аудиенции с Великим ханом?"
 marauder.550.f.desc: "Есть и другие миры для завоевания."
 marauder.550.g.desc: "Мой народ вытерпел достаточно бед. Я создам для них новый дом среди звёзд."
 marauder.550.h.desc: "Я плачу о тех, кто погибает под ударами моих войск, но для обеспечения [raider_khanate.GetSpeciesAdj&neut,gen] будущего другого выхода нет."
 marauder.550.i.desc: "Государство, создаваемое мной, принесёт пользу всему Галактическому сообществу. Возможно, сейчас кажется по-другому, но в один прекрасный день оно станет оплотом стабильности и процветания для всех разумных форм жизни.\n\nНаконец в галактике воцарится мир. Я об этом позабочусь."
 marauder.550.j.desc: "Моим верным сатрапам всегда рады при моём дворе. О чём вы хотели меня попросить?"
 marauder.550.k.desc: "Вы говорите с мной от лица [Root.GetSpeciesAdj&fem,gen] сатрапии, верно? [Root.GetName]... если не ошибаюсь. Что ваш Великий хан может для вас сделать?"
 marauder.550.l.desc: "Пусть раса ваша не является органической, [Root.GetSpeciesNamePlural], но ко всем формам разумной жизни, которые являются подданными [raider_khanate.GetName&gen], будет одинаковое отношение.\n\nВ этом я клянусь."
 marauder.550.m.desc: "Иногда мне кажется, что жизнь была бы намного проще, будь я машиной, как вы. Увы."
 marauder.550.n.desc: "Значит, я обращаюсь к центральному [Root.GetSpeciesAdj&masc,dat] разуму? Поразительно."
 marauder.550.o.desc: "Я понимаю, что [Root.GetSpeciesAdj&pl] единицы подчиняются командам своего коллективного разума без вопросов. Пока коллективный разум служит мне таким же образом, проблем у нас не будет."
 marauder.550.p.desc: "С вашей стороны было мудро подчиниться мне. Это решение сохранило бесчисленное множество жизней народу [Root.GetSpeciesName]."
 marauder.550.q.desc: "Вообще-то, [Root.GetSpeciesNamePlural] и [raider_khanate.GetSpeciesNamePlural] не так уж сильно отличаются. Ваша раса будет играть важную роль в галактической империи, которую мы строим вместе."

 marauder.550.a: "Мы хотели бы обсудить капитуляцию..."
 marauder.550.a.2.response: "Думаете, я поведусь на ложь, которой меня пичкают [Root.GetSpeciesName], во второй раз? Нет, в этот раз схватка будет до конца. Вы утратили своё право на существование в том новом галактическом порядке, который я создаю."
 marauder.550.b: "Хоть вы и [From.GetSpeciesName], но свои мысли выражаете очень... чётко."
 marauder.550.b.response: "Ах да. Вы, вероятно, имеете ввиду несколько грубый и... скажем так, неотёсанный диалект, который [From.GetSpeciesNamePlural] использовали до сих пор.\n\nВозможно, вы в это не поверите, но язык [From.GetSpeciesAdj&masc] был когда-то гораздо более развитым. Только за последнюю тысячу лет или около того он постепенно превратился в своё сегодняшнее жалкое подобие.\n\nНо теперь это изменится. Впредь все [From.GetSpeciesNamePlural] будут изучать наш язык в более старой и богатой версии. Никакого визжания больше не будет."
 marauder.550.c: "А как же «Владычица Пустоты»?"
 marauder.550.c.response: "Суеверия и религиозные догмы принесли расе [From.GetSpeciesName] лишь беды. Желающие и дальше поклоняться Владычице Пустоты или любому другому духовному символу, если уж на то пошло, свободны делать это, но подобное больше не является обязательным.\n\nЯ хочу, чтобы [From.GetSpeciesNamePlural], как и вся галактика вообще, вступили в новую эпоху науки и прогресса. Узколобым фанатикам нет места в том будущем, которое я создаю."
 marauder.550.d: "Мы хотим вернуть нашу автономию."
 marauder.550.d_fail: "§RВы не можете бунтовать, пока не пройдёт хотя бы год с тех пор, как вы подчинились Великому хану.§!"

 marauder.551.a.desc: "Мудрый выбор. После вашей капитуляции [raider_khanate.GetName] приобретёт в вашем лице сатрапию, и вы должны будете вносить свой вклад в виде ресурсов и солдат в наши войны. Помимо этого, однако, от вас не потребуется участвовать в самих сражениях, и я с радостью предоставлю вам возможность заниматься своими делами, пока мы не наведём порядок в галактике.\n\n§YСтатус сатрапии приведёт к следующим изменениям:§!\n§R£energy£-30% от прироста энергокредитов\n£minerals£-30% от прироста минералов\n£food£-30% от производства пищи\n£navy_size£-30% от вместимости флота§!\n\n[raider_khanate.GetName] станет ещё мощнее."
 marauder.551.a.response: "Теперь вы можете считать себя верными слугами Великого хана, правителя [raider_khanate.GetName&gen]. Благодаря подписанию данного соглашения спасено бесчисленное множество [Root.GetSpeciesNamePlural&gen]. Это великий день для империи [Root.GetName].\n\nКак только моё завоевание галактики завершится, мы пересмотрим систему сатрапий и, возможно, более тесно интегрируем ваше государство в моё. До тех пор я позволяю вам править самостоятельно."
 marauder.551.b.response: "Ха! Этому не бывать.\n\nЗначит, ваша судьба решится на поле боя, [Root.GetSpeciesNamePlural]. Мне всё равно, ведь [raider_khanate.GetName] так или иначе захватит ваши миры."
 marauder.551.a: "Мы принимаем ваши условия."
 marauder.551.a.tt: "§Y[This.GetName]§! теперь сатрапия §Y[raider_khanate.GetName&gen]§!"
 marauder.551.b: "Вы неправильно поняли. Мы имели в виду §Hвашу§! капитуляцию."
 marauder.552.name: "[From.GetName] подчиняется!"
 marauder.552.desc: "[new_satrapy.GetName::§H<1>§! подчини<end_lsya>] Великому хану! У [raider_khanate.GetName&gen] появилась новая сатрапия, флотилии которой ждут приказов.\n\nХоть официально [new_satrapy.GetName::он и не присоединился|||fem:она и не присоединилась|||neut:оно и не присоединилось|||pl:они и не присоединились] к попыткам [raider_khanate.GetSpeciesNamePlural&gen] завоевать галактику, но [new_satrapy.GetName::обяза<end_lsya>] поставлять ресурсы и солдат с целью усиления военной машины Великого хана."
 marauder.552.a: "Бесхребетные трусы!"

 marauder.553.name: "Орда создаёт базу в системе [capital_star.GetName&gen]"
 marauder.553.desc: "Ради нашей «защиты» §H[raider_khanate.GetName]§! создал крупный военно-космический комплекс в системе §H[capital_star.GetName&gen]§!, оборону которого обеспечивает значительный гарнизон кораблей. Дополнительное предназначение данной базы заключается, похоже, в том, чтобы стимулировать нас выполнять наши обязательства в качестве сатрапии и контролировать набор [Root.GetSpeciesNamePlural&gen] для службы в боевых флотилиях Великого хана."
 marauder.553.a: "Как прикажет Великий хан..."

 marauder.554.a.desc: "Хорошо подумайте, [Root.GetSpeciesNamePlural]. Если вы пойдёте по этому пути, возврата уже не будет. Второй раз капитуляцию я уже не приму.\n\nВ случае мятежа сатрапия будет полностью уничтожена. Без вариантов."
 marauder.554.a: "Мы объявляем о нашем полном суверенитете!"
 marauder.554.a.response: "Пусть будет так. Вы обрекли свой народ, [Root.GetSpeciesNamePlural]. Клянусь, я не успокоюсь, пока ваше жалкое государство не обратится в руины!\n\nЭто послужит остальной части галактики примером, что бывает с теми, кто не повинуется воле Великого хана."
 marauder.554.b: "Ага. В таком случае это неважно."
 marauder.554.b.response: "Всё с вами понятно. Не испытывайте моё терпение, [Root.GetSpeciesNamePlural]."
 marauder.550.r.desc: "Вы были облечены моим доверием, [Root.GetSpeciesName]. Я приглашаю вас посидеть со мной за одним столом, а вы в ответ плюёте мне в лицо."
 marauder.550.s.desc: "Я не терплю предателей. Нам не о чем с вами говорить."
 marauder.550.t.desc: "Вероломные мрази. Вы же хотели быть сатрапией, верно?\n\nВы выставили меня дураком, а этого я простить не могу."
 marauder.550.u.desc: "Теперь это уже личная обида, [Root.GetSpeciesName]."
 marauder.550.v.desc: "Из-за вас и таких, как вы, абсолютно не уважающих разумную жизнь, этой галактике срочно нужен правитель с крепкой рукой вроде меня.\n\nСамо по себе продолжение вашего существования является угрозой. Я собираюсь положить этому конец."
 marauder.550.w.desc: "ХАЙ-Э-Э-И-И-И-И-Э-Э-Э-Э-Э, двамак! Ты говоришь с... кхе-кхе...\n\nТо есть... ты находишься в присутствии августейшего Великого хана. Говори."

 marauder.620.name: "Раскол Орды"
 marauder.620.desc: "Смерть §HВеликого хана§! стала концом §H[From.GetName&gen]§!. Без сильного правителя, который их объединял, [From.GetSpeciesNamePlural] снова скатились к междоусобной борьбе. §HДиадохи§!, самые сильные и влиятельные полководцы, поделили империю между собой.\n\nКаждый из них теперь называет себя Великим ханом галактики, а их сторонники вступили друг с другом в ожесточённое противостояние. Время единой империи [From.GetSpeciesNamePlural&gen], очевидно, подошло к концу."
 marauder.620.a: "Так не должно было быть."
 marauder.630.name: "Орда возвращается к старым обычаям"
 marauder.630.desc: "Смерть Великого хана оказалась сокрушительным ударом для многих реформ, которые проводили [From.GetSpeciesNamePlural], чтобы превратить свои неорганизованные мародёрские кланы в объединённую галактическую империю.\n\nВоеначальники, унаследовавшие империю от Великого хана, не проявили ни малейшего интереса к продолжению этих реформ, и [From.GetSpeciesNamePlural] вернулись к старым обычаям своих жестоких предков-мародёров. [From.GetSpeciesNamePlural] теперь разобщены."
 marauder.630.a: "Скорее всего, это было неизбежно."
 marauder.640.name: "Новый каганат"
 marauder.640.desc: "Несмотря на все сложности, §H[From.GetSpeciesAdj&fem] Орда§! смогла преодолеть хаос, последовавший за смертью §HВеликого хана§!. Угрозу немедленного дробления на государства-преемники удалось по большей части устранить благодаря коронации нового хана.\n\nТеперь этот возрождённый [From.GetSpeciesAdj&masc] каганат, похоже, больше занят объединением имеющихся территорий, чем новыми завоеваниями."
 marauder.640.a: "Посмотрим, как долго они протянут."
 marauder.660.name: "Новая галактическая Орда"
 marauder.660.desc: "$marauder.660.1.desc$\n\n$marauder.660.2.desc$"
 marauder.660.1.desc: "Борьба за власть, вспыхнувшая в империи §H[From.GetName]§! после смерти §HВеликого хана§!, подошла к концу. Новая демократическая фракция, вдохновляемая идеями равенства, чуждыми для [From.GetSpeciesNamePlural&gen], когда они начали свои завоевания, теперь пытается реформировать своё правительство по аналогии с межзвёздной федерацией."
 marauder.660.2.desc: "В качестве сатрапии Орды нас попросили выступить одними из основателей новой федерации. С другой стороны, недавно составленный проект конституции Орды позволяет нам отделиться и снова обрести полную независимость."
 marauder.660.a: "Мы присоединимся к этой новой федерации."
 marauder.660.b: "Наконец-то свобода!"
 marauder.661.desc: "$marauder.660.1.desc$\n\n$marauder.661.2.desc$"
 marauder.661.2.desc: "Бывшие сатрапии Орды получили предложение либо объединиться в новую федерацию в качестве равных партнёров, либо формально отделиться и вернуть себе полную независимость."
 marauder.661.a: "Посмотрим, что из этого выйдет."
 marauder.665.a.desc: "§Y<< Из-за смерти Великого хана [From.GetSpeciesAdj&fem] Орда пришла в смятение. Никто не готов или не может ответить на ваш звонок. >>§!"
 marauder.665.a: "Что там происходит?"

 marauder.670.name: "Конец сатрапии"
 marauder.670.desc: "Из-за хаоса и нестабильности, последовавших за смертью Великого хана, наш статус сатрапии как части Орды считается недействительным, поскольку мы присягали на верность исключительно Великому хану. Теперь мы снова можем следовать навстречу собственной судьбе.\n\nВсе военные Орды, находившиеся в системе [Root.Capital.solar_system.GetName&gen], покинули свои посты, чтобы вернуться к своим согражданам, перед этим разрушив всё оставшееся военное имущество."
 marauder.670.a: "Мы свободны."
 marauder.671.name: "Каганат уничтожает гарнизонные станции"
 marauder.671.desc: "По мере того как Новый каганат пытается удержать завоевания Великого хана, его военное руководство решило ещё больше сплотить свои силы. Для этой цели они отозвали персонал со всех вассальных гарнизонных станций, а сами станции уничтожили."
 marauder.671.a: "Их контроль слабеет."

 marauder_skirmishing: "Закалённые мародёрами"
 marauder_skirmishing_desc: "Бесконечные стычки с бродячими мародёрами в приграничных территориях закалили наши флотилии и повысили их боевую эффективность."
 marauder.701.name: "[marauder_neighbor_species.GetAdj&pl] беженцы"
 marauder.701.desc: "В наше пространство со стороны империи §H[marauder_neighbor.GetName]§! вошли транспортные корабли с большим количеством [marauder_neighbor_species.GetAdj&pl,gen] беженцев. Эти беженцы, похоже, были изгнаны со старых космических станций, которые они называли своим домом, в ходе каких-то ритуалов, призванных сократить численность населения из-за недостатка ресурсов. Им позволили поселиться на §H[Root.GetName&prep]§!."
 marauder.701.a: "Их там радушно принимают."
 marauder.702.name: "Великая закалка"
 marauder.702.a.desc: "Продолжительные жестокие стычки на границах с §H[marauder_neighbor.GetName&inst]§! закалили наш флот. Наши офицеры повысили своё мастерство и даже переняли ряд сложных манёвров [marauder_neighbor_species.GetNamePlural&gen], что даст нам преимущество в будущих конфликтах."
 marauder.702.b.desc: "В ходе продолжительных стычек с §H[marauder_neighbor.GetName&inst]§! на наших границах [root.GetIndividualName&nom], составляющие экипажи наших кораблей, повысили свою инициативу. Теперь они могут лучше противостоять тактикам [marauder_neighbor_species.GetNamePlural&gen]. Это привело к общему повышению боевой эффективности.\n\nРано или поздно нам придётся разобраться с опасным уровнем индивидуализма экипажей, но в настоящее время это даёт нам преимущество в возможных конфликтах."
 marauder.702.c.desc: "Боевая эффективность наших кораблей значительно увеличилась в ходе продолжительных пограничных стычек с представителями империи §H[marauder_neighbor.GetName]§!. Наши корабли были вынуждены внести кое-какие поправки в свои программы, чтобы применять нестандартные тактические приёмы, которым обучились у [marauder_neighbor_species.GetNamePlural&gen].\n\nВ конечном итоге придётся стереть эти новые данные, чтобы не допустить разрушения системы в других областях, но пока что это даёт нам преимущество в возможных конфликтах."
 marauder.703.name: "[marauder_neighbor_species.GetAdj&fem] аварийная капсула"
 marauder.703.desc: "Недавно, после особо жестокого столкновения между двумя кланами §H[marauder_neighbor.GetName&gen]§!, в наше пространство вошла [marauder_neighbor_species.GetAdj&fem] аварийная капсула. Пограничный патруль перехватил капсулу и открыл её; внутри оказался высокопоставленный [marauder_neighbor_species.GetAdj&masc] офицер. Командир поклялся служить нам до самой смерти бесплатно."
 marauder.703.a: "Добро пожаловать на борт, командир."
 marauder.703.b: "Нам не нужен ещё один командир."
 marauder.703.c: "Примените эвтаназию к мягкотелому."
 marauder.703.d: "Заберите ценные элементы из тела этого существа."
 marauder.703.e: "Ну что ж, до смерти, так до смерти. Избавьтесь от чужака."
 marauder.703.f: "Швырнуть капсулу целиком в плавильню."
 gain_marauder_admiral: "Мы получили опытного [marauder_neighbor_species.GetAdj&masc,gen] командира."
 gain_marauder_fleet: "Мы получили небольшую флотилию кораблей мародёров."
 marauder.704.name: "Дрейфующая флотилия"
 marauder.704.desc: "В системе [border_system.GetName&gen], недалеко от границ империи §H[marauder_neighbor.GetName]§!, была найдена небольшая флотилия из брошенных [marauder_neighbor_species.GetAdj&pl,gen] военных кораблей. Судя по бортовым журналам, команды этих кораблей отправились в космос, чтобы избежать какой-то клановой войны. К своему несчастью, они взяли с собой мало припасов и вскоре погибли от голода.\n\nНаши инженеры утверждают, что эти корабли в неплохом состоянии. Их можно снабдить экипажами и пополнить ими нашу флотилию."
 marauder.704.a: "Да, это будет неплохое приобретение."
 marauder.704.b: "Нет, это просто мусор. Переработать их."
 marauder.705.name: "[marauder_neighbor_species.GetAdj&masc] склад ресурсов"
 marauder.705.desc: "Благодаря счастливой случайности наши патрульные обнаружили скрытый склад ресурсов в системе [border_system.GetName&gen], неподалёку от нашей границы с §H[marauder_neighbor.GetName&inst]§!. На этом огромном складе хранится добыча нескольких [marauder_neighbor_species.GetAdj&pl,gen] рейдов, совершённых столетия назад.\n\nПохоже, об этом складе некогда забыли, или его владельцы перебили друг друга в бесчисленных междоусобных войнах. В любом случае, эти запасы теперь принадлежат нам."
 marauder.706.name: "Заброшенное орбитальное поселение [marauder_neighbor_species.GetName&gen]"
 marauder.706.desc: "На нашей территории, на низкой орбите [border_planet.GetName&gen], мы обнаружили остатки недостроенного орбитального поселения [marauder_neighbor_species.GetNamePlural&gen]. По всей видимости, однажды [marauder_neighbor.GetName::§H<1>§! решил<end_a>] обеспечить своё постоянное присутствие в системе [border_system.GetName&gen], но по какой-то причине [marauder_neighbor.GetName::отказа<end_lsya>] от этой идеи.\n\nБлагодаря своей близости к [border_planet.GetName&dat] это незаконченное орбитальное поселение некоторое время ускользало от нашего внимания. Это, по сути, всего лишь чуть больше, чем скопление космического мусора, но среди обломков много ценных минералов, которые можно использовать."
 marauder.706.a: "Забрать всё ценное."
 marauder.707.name: "[marauder_neighbor_species.GetAdj&masc] челнок"
 marauder.707.desc: "Недавно в нашей системе [border_system.GetName&gen], спасаясь от рейдеров империи §H[marauder_neighbor.GetName]§!, наши границы пересёк небольшой [marauder_neighbor_species.GetAdj&masc] челнок. Мы точно не знаем, почему его преследовали свои, но рейдеры удалились, когда им навстречу вылетели наши пограничные корабли.\n\nПри восстановлении сильно повреждённого челнока обнаружилось, что его экипаж погиб почти сразу, как вошёл в систему [border_system.GetName&gen]. Его трюм был под завязку забит похищенными чипами энергокредитов."
 marauder.707.a: "По закону «кто нашёл, тот и хозяин» кредиты наши."



 HORDE_SUCCESSOR_GREETING_01: "Мы чтим память Великого хана."
 HORDE_SUCCESSOR_GREETING_02: "Мы истинные преемники наследия Великого хана."
 HORDE_SUCCESSOR_GREETING_03: "Во имя Великого хана!"
 HORDE_SUCCESSOR_GREETING_04: "Великий хан будет жить, пока мы помним."
 HORDE_SUCCESSOR_GREETING_05: "Великий хан по-прежнему наблюдает за нами из-за Предела."
 HORDE_SUCCESSOR_GREETING_06: "Не становитесь на пути у детей Великого хана."
 HORDE_SUCCESSOR_WAR_GREETING_01: "Вам не возобладать над потомками Великого хана."
 HORDE_SUCCESSOR_WAR_GREETING_02: "Вашим уничтожением мы почтим память Великого хана."
 HORDE_SUCCESSOR_WAR_GREETING_03: "Мы выполним обещание Великого хана, превратив ваше жалкое государство в пыль."
 HORDE_SUCCESSOR_WAR_GREETING_04: "Вы будете уничтожены! Такова воля Великого хана!"
 HORDE_SUCCESSOR_WAR_GREETING_05: "Клянёмся призраком Великого хана, ваше государство будет полыхать огнём!"
 HORDE_SUCCESSOR_WAR_GREETING_06: "Великий хан научил нас, как разбираться с такими, как вы."

 FRIENDLY_COLOSSUS_GREETING_01: "Видели нашего колосса? Настоящее технологическое чудо. Мы с удовольствием устроим для делегации ваших офицеров обзорную экскурсию по некоторым из его незасекреченных частей."
 FRIENDLY_COLOSSUS_GREETING_02: "Не волнуйтесь по поводу нашего колосса. Его разрушительная мощь предназначена исключительно для наших врагов, а не друзей."
 NEUTRAL_COLOSSUS_GREETING_01: "Наши слова подкрепляются сокрушающей планеты мощью колосса!"
 NEUTRAL_COLOSSUS_GREETING_02: "Если потребуется, мы готовы задействовать полный разрушительный потенциал нашего колосса. Конечно, будем надеяться, что необходимости в этом не возникнет."
 HOSTILE_COLOSSUS_GREETING_01: "Молитесь, чтобы вам никогда не довелось узреть мощь нашего полностью вооружённого и функционирующего колосса!"
 HOSTILE_COLOSSUS_GREETING_02: "Построенный нами колосс — это инструмент воздействия на таких, как [From.GetName]. Не стоит давать нам повода использовать его против ваших миров."
 PACIFIST_COLOSSUS_GREETING_01: "Построенный нами колосс — это не что иное, как защитная мера. Он предназначен для обеспечения безопасности нашего народа, а при необходимости — и для защиты галактики от тех, кто попытается причинить ей вред."
 SPIRITUALIST_COLOSSUS_GREETING_01: "Мы наделили построенного нами колосса силами духов. Он быстро разберётся с любыми еретиками или нечестивыми механизмами."
 MATERIALIST_COLOSSUS_GREETING_01: "Имеющийся в нашем распоряжении колосс является главным достижением нашего долгого технического прогресса. Поистине для науки нет ничего невозможного."
 PURIFIER_COLOSSUS_GREETING_01: "Видели нашего колосса, мерзкие чужаки? Неважно. Вы получите полное представление о его возможностях, когда [From.Capital.GetPlanetMoon_rinfix&nom] [From.Capital.GetName] целиком будет отправлена в мир иной."
 EXTERMINATOR_COLOSSUS_GREETING_01: "Теперь, когда наш колосс полностью введён в строй, мы ожидаем повышения эффективности всех операций по зачистке органиков на 254.88%."
 HIVE_COLOSSUS_GREETING_01: "Построенный нами колосс служит демонстрацией воли коллективного разума."
 FRIENDLY_COLOSSUS_REACT_GREETING_01: "Наши инженеры в восторге от вашего могучего колосса. Теперь более чем когда-либо мы рады хорошим отношениям между нашими государствами."
 FRIENDLY_COLOSSUS_REACT_GREETING_02: "Только глупец может выступить против такого противника, как [From.GetName], когда у вас в распоряжении есть колосс. Мы рады, что ваше государство входит в число наших друзей."
 NEUTRAL_COLOSSUS_REACT_GREETING_01: "Строительство вами этого колосса глубоко беспокоит нас. Владение таким ужасным инструментом разрушения нарушает баланс сил во всей галактике."
 NEUTRAL_COLOSSUS_REACT_GREETING_02: "Ваш колосс впечатляет и в такой же степени внушает беспокойство. Он правда может уничтожать целые миры?"
 HOSTILE_COLOSSUS_REACT_GREETING_01: "Ваш хвалёный колосс можно взорвать, как и любой другой корабль. Не стоит об этом забывать."
 HOSTILE_COLOSSUS_REACT_GREETING_02: "Этот ваш колосс... Вы дураки, что построили такого монстра. Только подумайте, сколько линкоров вы могли себе позволить на эти ресурсы!"
 WAR_COLOSSUS_GREETING_01: "Сдавайтесь, глупцы, пока ещё можете! Иначе наш колосс от вас и следа не оставит!"
 WAR_COLOSSUS_GREETING_02: "У вас нет ни шанса против ошеломительной мощи нашего колосса. Он сожжёт ваши миры дотла."

 CAN_TAKE_HOSTILE_ACTION_SATRAPY: "Наш статус сатрапии не разрешает нам этого."
 CAN_TAKE_HOSTILE_ACTION_OVERLORD: "Наш статус сюзерена не разрешает нам этого."
