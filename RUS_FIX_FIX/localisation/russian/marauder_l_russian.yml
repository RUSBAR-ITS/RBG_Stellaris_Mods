l_russian:

 marauder.1.name: "Обнаружены [encountered_marauder.GetRealName]"
 marauder.1.desc: "Расшифровав то, что условно можно счесть языком, [This.Owner.GetEnvoy] [This.Leader.GetName] [This.Leader.GetAXX::приш<end_yolla>] к выводу, что §H[encountered_marauder.GetName]§! — это кочующая цивилизация, известная как §H[encountered_marauder.GetRealName]§!. Они живут в системе §H[marauder_system.GetName&gen]§! и вокруг неё на крупных космических станциях, в слишком стеснённых и убогих условиях для такого большого населения. Несмотря на это — или, возможно, благодаря этому — у них, похоже, развилась мощная военная культура. Они привыкли существовать в этой холодной пустоте и очень преуспели в искусстве ведения войны в космосе.\n\nУ [encountered_marauder.GetSpeciesNamePlural&gen] нет центрального правительства как такового. Вместо этого они разделены на несколько фракций, бесконечно соперничающих друг с другом за ресурсы и авторитет. Учитывая большую численность населения и возможность строить корабли на станциях, лишь постоянная внутренняя борьба не даёт мародёрам стать серьёзной угрозой для мира в галактике."
 marauder.1.a: "Попытайтесь установить с ними контакт."
 marauder.3.name: "Замечены воинственные [From.GetSpeciesNamePlural]"
 marauder.3.desc: "Уже в течение нескольких месяцев мы получаем разрозненные сообщения о небольших группах наёмников и каперов иной расы, действующих на границах нашей территории. Они называют себя §H[From.GetSpeciesNamePlural]§! и, очевидно, представляют собой изгнанников культуры кочевников-воинов, обитающих на перенаселённых космических станциях в системе §H[marauder_system.GetName&gen]§! и вокруг неё.\n\nМы прошли мимо их пространства без инцидентов, но они предупредили, чтобы мы не пересекали границы системы [marauder_system.GetName&gen]. У [From.GetSpeciesNamePlural&gen] нет центрального правительства как такового, но фракции, на которые они разделены, постоянно ведут между собой внутреннюю борьбу и часто осуществляют рейды в ближайшие звёздные системы. С учётом огромного населения и возможностей производства в условиях космоса [From.GetSpeciesNamePlural], скорее всего, стали бы значительной галактической силой, если бы прекратили убивать друг друга."
 marauder.5.name: "Конец [From.GetName&gen]"
 marauder.5.desc: "Некогда гордой культуры §H[From.GetSpeciesAdj&pl,gen]§! воинов-кочевников больше нет. Войска §H[marauder_killer.GetName&gen]§! уничтожили последнюю из огромных космических станций, на которых жило большинство их населения. Беженцы из числа выживших гражданских рассеялись по всей галактике.\n\nХотя могли уцелеть некоторые флотилии [From.GetSpeciesAdj&pl,gen] пиратов и наёмников, потеря их космических жилищ — это сокрушительный удар, от которого они не смогут оправиться. Их рейдам явно положен конец."
 marauder.5.a: "Само собой."
 marauder.6.name: "[marauder_species.GetNamePlural] жаждут мщения"
 marauder.6.desc: "Крупная флотилия §H[marauder_species.GetSpeciesAdj&pl,gen]§! наёмников вышла из гиперпространства в системе §H[attacked_system.GetName&gen]§!! Похоже, все выжившие отряды этих наёмников, бывшие в других местах, когда мы разгромили их последнюю космическую станцию, забыли о своих разногласиях и объединили силы.\n\nНе ясно, как им удалось добраться до системы [attacked_system.GetName&gen], не будучи обнаруженными нашими сенсорами, но они передают нам сообщение по открытому каналу."
 marauder.7.1.desc: "Подлые трусы из [Root.GetName&gen]!\n\nПоскольку вы уничтожили наши дома, мы теперь сожжём ваши. Вы сделали так, что нам больше нечего терять. Нам лишь остаётся надеяться погибнуть в бою и забрать с собой как можно больше ваших так называемых воинов на нашем пути к Великому Пределу.\n\nЗащищайтесь!"
 marauder.7.2.desc: "Двамаки [Root.GetName&gen]! Вы крушите наши дома, теперь мы крушим ваши! Мы знаем, что можем погибнуть, но постараемся забрать с собой как можно больше двамаков!\n\nСмерть всем двамакам! ХАЙ-Э-Э-Э-Э-Э-И-И-И-И-И-И-И-И-Э-Э-Э-Э-Э-Э-Э-Э-Э!!!!!!!!!!"
 marauder.7.3.desc: "Отступники из [Root.GetName&gen]!\n\nВы осквернили наши самые священные места и убили бесчисленное количество Её подданных. Вы думали, что Владычица Пустоты просто оставит эти зверства без ответа?\n\nОна требует жертвоприношения, и мы его предоставим. Это будет последним нашим деянием в этом жалком мире."
#  marauder.7.a: "Battle stations!"
 marauder.8.desc: "Крупная флотилия §H[marauder_species.GetSpeciesAdj&pl,gen]§! наёмников пересекла границу §H[From.GetName&gen]§!. Похоже, все выжившие отряды этих наёмников, бывшие в других местах, когда [From.GetName::<1> разгромил<end_a>] их последнюю космическую станцию, забыли о своих разногласиях и объединили силы.\n\nОни собираются отомстить за разрушение своих домов, и, судя по перехваченным сообщениям, их воины готовы отдать жизнь в этой кампании."
 marauder.10.name: "Появление [Root.GetAdj&pl,gen] беженцев"
 marauder.10.desc.start: "В наше пространство прибыла потрёпанная флотилия грузовых кораблей с §H[marauder_species.GetAdj&pl,inst]§! беженцами, которые спаслись после недавнего уничтожения их домов в родных системах. Им позволили поселиться на §H[Root.GetName&prep]§!."
 marauder.10.desc: "$marauder.10.desc.start$\n\nХотя эти беженцы привыкли жить на переполненных космических станциях в убогих условиях, они, похоже, хорошо приспосабливаются к своему новому дому на планете. $marauder.10.desc.end$"
 marauder.10.desc.artificial: "$marauder.10.desc.start$\n\nОни уже привыкли жить на тесных космических станциях, поэтому быстро освоились в наших искусственных поселениях. $marauder.10.desc.end$"
 marauder.10.desc.end: "Будем надеяться, что они готовы позабыть о своём прошлом налётчиков и пиратов."
 marauder.10.a: "Мы дадим им новые дома."
