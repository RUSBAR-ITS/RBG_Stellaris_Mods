 marauder.15.1.desc: "Чужаки! Мы [encountered_marauder.GetSpeciesNamePlural]. В отличие от «цивилизованных» звёздных империй галактики, у нас нет единого властелина, который бы правил нами, но меня избрали для передачи данного сообщения вам от лица всех домов.\n\nНе пытайтесь навязывать нам свои мягкие и неэффективные порядки. Можете сколько угодно отправлять свои корабли на [encountered_marauder.GetSpeciesAdj&fem,acc] территорию, но не ждите, что они вернутся. Нашим воинам будет чем развлечься.\n\nВещайте на данной частоте, только если захотите предложить нам дань... или если вам нужны наёмники и вы можете за них заплатить."
 marauder.15.2.desc: "ХАЙ-Э-Э-Э-И-И-И-И-Э-Э-Э! Ещё двамаки!\n\nЧто тебе нужно, глупый двамак? Что у тебя с лицом? Авария с реактором? Воздействие вакуума? ХАЙ-Э-Э-И-И-И-Э-Э! Посмотри на себя!\n\nМы [encountered_marauder.GetSpeciesNamePlural]. Мы охотимся на двамаков. Если явишься на территорию [encountered_marauder.GetSpeciesAdj&neut,gen] племени, мы сделаем из тебя двамакскую похлёбку. Что, не нравится? ХАЙ-Э-Э-И-И-И-И-И-Э-Э-Э-Э-Э!\n\nВозможно, ты знаешь других двамаков. Возможно, ты хочешь, чтобы они стали двамакской похлёбкой. Это можно устроить. [encountered_marauder.GetSpeciesNamePlural] не против драться за одних двамаков против других, если сойтись в цене."
 marauder.15.3.desc: "Мы [encountered_marauder.GetSpeciesNamePlural], любимые слуги §HВладычицы Пустоты§! — Всевидящего, Всезнающего и, прежде всего, Мстительного высшего существа, которое господствует над Космосом.\n\nИменно Она тысячелетия назад предложила нам покинуть планетные дома наших предков и поселиться в Её вечном царстве — холодных глубинах космоса, — чтобы мы могли охотиться на неверующих и умиротворять Её путём жертвоприношений.\n\nУвы, но Войны доктрин подорвали наши силы, и мы стали разобщённым народом, пытающимся постичь тот истинный путь, который Она для нас избрала. Однако Её расположения можно добиться посредством уничтожения еретиков из иных рас, даже если это делается по воле других еретиков. Поэтому многие из наших бойцов готовы сражаться в ваших войнах за определённую цену..."
 marauder.15.a: "Конец сообщения."

