 galactic_trawling: "Галактический траловый лов"
 council_agenda_agenda_galactic_trawling_name: "$galactic_trawling$"
 council_agenda_agenda_galactic_trawling_desc: "Открытый космос населён самыми разными формами жизни. Их следует изучить и каталогизировать."
 agenda_galactic_trawling_launch_finish: "$agenda_ref$ «$council_agenda_agenda_galactic_trawling_name$»"
