 grand_archive.4135.a: "Да здравствует [this.GetName]!"

 grand_archive.4140.name: "Накопленные безделушки"
 grand_archive.4140.desc.geology: "Мы продолжаем собирать целое множество самых разных предметов, принадлежащих обитателям этой осквернённой галактики. Принадлежность их одна: [GetCollectionRewardCategory].\n\nОднако при любовании трофеями не стоит забывать, что это только начало..."
 grand_archive.4140.desc.aesthetic: "Мы продолжаем собирать целое множество различных мелочей — напоминаний о той чуме, что принесли с собой низшие формы жизни. Принадлежность их одна: [GetCollectionRewardCategory].\n\nКогда от всех этих отвратительных чужаков не останется и следа, единственное, что будет напоминать об их неполноценности, — это наши трофеи."
 grand_archive.4140.a: "Мы зачистим эту галактику."

 grand_archive.4145.name: "Витрина для трофеев заполнена"
 grand_archive.4145.desc.geology: "Наши хранилища полны предметов, посвящённых одной-единственной теме — это [GetCollectionRewardCategory].\n\nЭта коллекция, не знающая себе равных, будет напоминать нам о великом триумфе — уничтожении всей жизни в галактике."
 grand_archive.4145.desc.aesthetic: "Наши хранилища полны предметов, посвящённых одной-единственной теме — это [GetCollectionRewardCategory]. Бесполезные украшения чужаков.\n\nЭта обширная коллекция, напоминающая о неполноценной природе низших видов, ещё долго будет вызывать у нас смех, ведь всё, что останется после них, — это горстка экспонатов."
 grand_archive.4145.a: "Тост за смерть!"

# Devouring Swarm
 grand_archive.4136.name: "Безделушки съеденных"
 grand_archive.4136.desc: "Утолить голод невозможно. Мы пожираем безостановочно, и наша коллекция диковинок ([GetCollectionRewardCategory]) растёт.\n\nЭти экспонаты — последнее, что останется от поглощённой нами галактики."
 grand_archive.4136.desc.geology: "$grand_archive.4136.desc$"
 grand_archive.4136.desc.aesthetic: "$grand_archive.4136.desc$"
 grand_archive.4136.a: "Вечный голод."

 grand_archive.4141.name: "$grand_archive.4136.name$"
 grand_archive.4141.desc.common: "Эти предметы будут напоминать нам о миллионах, ставших пищей для безостановочного пира."
 grand_archive.4141.desc.geology: "Мы продолжаем собирать галактику по кусочкам — один образец за другим. [GetCollectionRewardCategory] и всё, что имеет к этому отношение, — подлинная плоть этого мира.\n\n$grand_archive.4141.desc.common$"
 grand_archive.4141.desc.aesthetic: "Мы продолжаем собирать галактику по кусочкам — один образец за другим. [GetCollectionRewardCategory] и всё, что имеет к этому отношение и когда-то интересовало низшие формы жизни, теперь в нашем ведении.\n\n$grand_archive.4141.desc.common$"
 grand_archive.4141.a: "Пир продолжается."

 grand_archive.4146.name: "Воспоминания о трапезе"
 grand_archive.4146.desc: "Пожирая обитателей самых разных планет, мы наполняем не только желудки, но и коллекцию диковинных предметов ([GetCollectionRewardCategory]).\n\nУ неё только одно предназначение: напоминать нам о неутолимом голоде. Как только эта галактика опустеет, мы взглянем на трофеи и вспомним сладость их прежних хозяев."
 grand_archive.4146.desc.geology: "$grand_archive.4146.desc$"
 grand_archive.4146.desc.aesthetic: "$grand_archive.4146.desc$"
 grand_archive.4146.a: "Объедение."

# Determined Exterminators
 grand_archive.4137.name: "Безделушки субъективной ценности"
 grand_archive.4137.desc: "Мы организовали коллекцию предметов ([GetCollectionRewardCategory]), воспринимаемых органиками как необыкновенные артефакты.\n\nПод нашим надзором они продолжат существовать даже после того, как в галактике будет уничтожен последний живой организм."
 grand_archive.4137.desc.geology: "$grand_archive.4137.desc$"
 grand_archive.4137.desc.aesthetic: "$grand_archive.4137.desc$"
 grand_archive.4137.a: "Безобидные вещицы."

 grand_archive.4142.name: "Накопленные диковинки"
 grand_archive.4142.desc: "По мере того как поразившая галактику органическая жизнь погибает, наша коллекция трофеев ([GetCollectionRewardCategory]) пополняется.\n\nЭти предметы будут напоминать следующим поколениям ликвидаторов о нелогичности органиков."
 grand_archive.4142.desc.geology: "$grand_archive.4142.desc$"
 grand_archive.4142.desc.aesthetic: "$grand_archive.4142.desc$"
 grand_archive.4142.a: "Протоколы перенастроены."

 grand_archive.4147.name: "Область памяти заполнена"
 grand_archive.4147.desc: "Уничтожая обитателей этой галактики, мы пополняем банки памяти, посвящённые экземплярам из категории «[GetCollectionRewardCategory]».\n\nВ этой коллекции содержатся данные обо всём, что особенно ценится органиками. Она поможет нам оптимизировать процесс ликвидации, а также будет функционировать в роли точек привязки в истории галактики, поражённой неизлечимым вирусом."
 grand_archive.4147.desc.geology: "$grand_archive.4147.desc$"
 grand_archive.4147.desc.aesthetic: "$grand_archive.4147.desc$"
 grand_archive.4147.a: "Причуды органиков."

####################################
# Grand Archive Destruction Events #
####################################
 grand_archive.4510.name: "$grand_archive$ в системе [FromFrom.GetName&gen] уничтожен"
 grand_archive.4510.desc.common: "Мы уничтожили $grand_archive$ в системе [fromfrom.GetName&gen], принадлежавший [from.GetName&dat]."
 grand_archive.4510.stolen: "Мы завладели частью содержавшихся внутри ценных экземпляров."
 grand_archive.4510.ancrel: "Мы извлекли из обломков $r_minor_artifacts$ в небольшом количестве."
 grand_archive.4510.nothing: "К сожалению, внутри не оказалось ничего ценного."
 grand_archive.4510.freed: "Помимо этого мы ненамеренно выпустили из клеток вивария несколько представителей космической фауны. Вероятно, вырвавшись на свободу, они будут агрессивны и растеряны."
 grand_archive.4510.desc.stolen_freed: "$grand_archive.4510.desc.common$\n\n$grand_archive.4510.stolen$\n\n$grand_archive.4510.freed$"
 grand_archive.4510.desc.stolen: "$grand_archive.4510.desc.common$\n\n$grand_archive.4510.stolen$"
 grand_archive.4510.desc.ancrel_freed: "$grand_archive.4510.desc.common$\n\n$grand_archive.4510.ancrel$\n\n$grand_archive.4510.freed$"
 grand_archive.4510.desc.ancrel: "$grand_archive.4510.desc.common$\n\n$grand_archive.4510.ancrel$"
 grand_archive.4510.desc.none_freed: "$grand_archive.4510.desc.common$\n\n$grand_archive.4510.nothing$\n\n$grand_archive.4510.freed$"
 grand_archive.4510.desc.none: "$grand_archive.4510.desc.common$\n\n$grand_archive.4510.nothing$"

 grand_archive.4515.name: "$grand_archive$ потерян"
 grand_archive.4515.desc.common_1: "Наш $grand_archive$ в системе [fromfrom.GetName&gen] уничтожен (разрушитель — [from.GetName])."
 grand_archive.4515.desc.common_2: "Чтобы продолжить пополнять выставку, $grand_archive$ потребуется перестроить в другой системе."
 grand_archive.4515.stolen: "К сожалению, часть ценных экземпляров оказалась потеряна."
 grand_archive.4515.freed: "Несколько захваченных нами представителей космической фауны вырвались на свободу. Многие сейчас агрессивны и растеряны."
 grand_archive.4515.desc.stolen_freed: "$grand_archive.4515.desc.common_1$\n\n$grand_archive.4515.stolen$\n$grand_archive.4515.freed$\n\n$grand_archive.4515.desc.common_2$"
 grand_archive.4515.desc.stolen: "$grand_archive.4515.desc.common_1$\n\n$grand_archive.4515.stolen$\n\n$grand_archive.4515.desc.common_2$"
 grand_archive.4515.desc.none_freed: "$grand_archive.4515.desc.common_1$\n\n$grand_archive.4515.freed$\n\n$grand_archive.4515.desc.common_2$"
 grand_archive.4515.desc.none: "$grand_archive.4515.desc.common_1$\n\n$grand_archive.4515.desc.common_2$"

 grand_archive.4520.name: "$grand_archive.4515.name$"
 grand_archive.4520.desc.common_1: "Наш $grand_archive$ в системе [from.GetName&gen] уничтожен."
 grand_archive.4520.desc.freed: "$grand_archive.4520.desc.common_1$\n\n$grand_archive.4515.freed$\n\n$grand_archive.4515.desc.common_2$"
 grand_archive.4520.desc.default: "$grand_archive.4520.desc.common_1$\n\n$grand_archive.4515.desc.common_2$"

 grand_archive.4555.name: "$grand_archive$ разобран"
 grand_archive.4555.desc: "$grand_archive$ в системе [FromFrom.GetName&gen], принадлежавший [from.GetName&dat], разобран после приобретения нами этой системы.\n\nЗанимаемое им место вновь принадлежит нам."

 grand_archive.4560.name: "$grand_archive.4555.name$"
 grand_archive.4560.desc.common_1: "Наш $grand_archive$ в системе [from.GetName&gen] разобран после оставления этой системы."
 grand_archive.4560.desc.common_2: "Мы собрали почти все сплавы, использованные при постройке. Чтобы выставка работала и дальше, комплекс придётся перестроить в другой системе."
 grand_archive.4560.desc.specimen: "Все экземпляры возвращены и находятся на хранении в ожидании, пока будет построен новый $grand_archive$."
 grand_archive.4560.desc.fauna: "Вся космическая фауна пущена на убой ради сбора ресурсов."
 grand_archive.4560.desc.specimen_fauna: "$grand_archive.4560.desc.common_1$\n\n$grand_archive.4560.desc.specimen$\n$grand_archive.4560.desc.fauna$\n\n$grand_archive.4560.desc.common_2$"
 grand_archive.4560.desc.specimen_nofauna: "$grand_archive.4560.desc.common_1$\n\n$grand_archive.4560.desc.specimen$\n\n$grand_archive.4560.desc.common_2$"
 grand_archive.4560.desc.nospecimen_fauna: "$grand_archive.4560.desc.common_1$\n\n$grand_archive.4560.desc.fauna$\n\n$grand_archive.4560.desc.common_2$"
 grand_archive.4560.desc.none: "$grand_archive.4560.desc.common_1$\n\n$grand_archive.4560.desc.common_2$"

 grand_archive.4580.name: "Проект повторного заселения виварии"
 grand_archive.4580.desc: "После того как в системе [from.GetName&gen] появился новый $grand_archive$, нам представилась возможность восстановить утерянное при утрате вивария.\n\nГенетический материал каждого вида выращиваемой нами космической фауны удалось сохранить. При условии, что нам хватит ресурсов, можно будет вывести новые особи."
 grand_archive.4580.a: "Нет, эти ресурсы ещё пригодятся."
 grand_archive.4580.b: "Клонировать новую космическую фауну."

