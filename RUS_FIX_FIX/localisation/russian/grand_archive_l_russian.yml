 grand_archive.6025.name: "Пиратская засада"
 grand_archive.6025.desc: "Пока мы искали §Yклад§! на [from.GetName&prep], [fromfromfrom.Leader.GetName] [fromfromfrom.Leader.GetAXX::попал<end_a>] в засаду, подстроенную пиратской флотилией!\n\nЭти разбойники каким-то образом выследили нас и теперь хотят забрать сокровища себе. Чтобы клад достался нам, придётся одолеть флотилию, пока та не успела завладеть добычей."
 grand_archive.6025.a: "Приготовиться к бою."

