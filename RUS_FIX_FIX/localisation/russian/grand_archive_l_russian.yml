 xeno_geology_holomuseum_desc: "Многопрофильное учреждение, посвящённое хранению и изучению минеральных образований и драгоценных камней."

 aesthetic_wonders_holomuseum: "Голографический музей чудес"
 aesthetic_wonders_holomuseum_desc: "Здесь каждый может спокойно полюбоваться на чудеса нашей галактики."

 galactic_history_holomuseum: "Голографический музей истории"
