 voidlure_action_cooldown_desc: "Перезарядка пустотной приманки"
 arkship_voidlure_generic: "Приманить космическую фауну"
 arkship_voidlure_effect: "$SYSTEM_EFFECTS_HEADER$\n$t$- Приманивает §Hкосмическую фауну§! в систему.\n$t$- Мы можем приманивать только тех существ, которых уже повстречали.\n$t$- Целями могут быть только подходящие ['concept_space_fauna_home_systems', излюбленные системы].\n$t$- Приманенные существа §Hвременно дружелюбны§!.\n$t$- Существа прибывают спустя §H30-90 дней§! после приманивания.\n$t$- У всех видов приманок общее время §Hперезарядки§!."
 arkship_voidlure_cta: "§GКарта галактики: щёлкните правой кнопкой, чтобы указать подходящую систему.§!"
 arkship_voidlure_desc: "§LМассив испускает песню в пустоту, и обитающие там существа откликаются на зов.§!"
