 grand_archive.9005.name: "[fromfrom.GetName] [fromfrom.GetAXX::захвачен<end_a>] врагом"
 grand_archive.9005.desc: "Один из наших лидеров, §H[fromfrom.GetLeaderClass_rinfix&nom]§! §Y[fromfrom.GetName]§!, [fromfrom.GetAXX::попал<end_a>] в плен к [from.GetName&dat] во время битвы в системе [fromfromfrom.GetName&gen]. В обмен на [fromfrom.GetAXX::<ego_eyo>] жизнь требуют выкуп."
 grand_archive.9005.desc.second: "Как сообщалось ранее, командир [fromfrom.GetName] [fromfrom.GetAXX::попал<end_a>] в плен к [from.GetName&dat], [from.GetName::который готов|||fem:которая готова|||neut:которое готово|||pl:которые готовы] принять выкуп в обмен на [fromfrom.GetAXX::<ego_eyo>] жизнь."
 grand_archive.9005.a: "Заплатить выкуп."
 grand_archive.9005.a.tt: "[fromfrom.GetName] получит свободу и вернётся в наши ряды."
 grand_archive.9005.b: "Мы об этом подумаем."
 grand_archive.9005.c: "Мы не станем платить."

 grand_archive.9010.name: "Пройдись по доске"
 grand_archive.9010.desc: "Вражеский командир [fromfrom.GetName] остаётся в наших руках, поскольку [from.GetName] [from.GetName::отказа<end_lsya>] платить за [fromfrom.GetAXX::<ego_eyo>] возвращение. Что нам с [fromfrom.GetAXX::н<im_ei>] делать?"
 grand_archive.9010.a: "Публично казнить."
 grand_archive.9010.b: "Высадить [fromfrom.GetAXX::узника|||fem:узницу] в мире [this.GetHomeWorldName]."
 grand_archive.9010.c: "Оставить [fromfrom.GetAXX::<ego_eyo>] в заключении."

