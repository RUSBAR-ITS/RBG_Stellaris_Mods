 grand_archive.4135.name: "Безделушки низших видов"
 grand_archive.4135.desc: "По мере зачистки галактики от мерзких чужаков наша коллекция трофеев ([GetCollectionRewardCategory]) растёт.\n\nЭти экспонаты — последнее, что останется от безвозвратно заражённой галактики. Они будут придавать нам силы действовать дальше."
