 ENGULF_COMPONENT: "Пожирающая пасть"
 ENGULF_COMPONENT_EFFECT_DESC: "$ENGULF_COMPONENT_EFFECT_DESC_WILD$ §YЦель либо будет поглощена, либо перейдёт в распоряжение хозяина существа.§!"
 ENGULF_COMPONENT_EFFECT_DESC_WILD: "§YЭто существо может поглотить цель, по размерам уступающую самому кутхолоиду.§!"
 CUTHOLOID_PREYING_MAW: "Пожирающая пасть"
 CUTHOLOID_PREYING_MAW_DESC: "Иногда проглатывает небольшие вражеские корабли."
 METEOROID_SLINGER_1: "Средний метатель метеоритов"
 METEOROID_SLINGER_1_DESC: "Запускает в направлении цели тяжёлый метеорит, при попадании наносящий значительный кинетический урон."
 METEOROID_SLINGER_2: "Большой метатель метеоритов"
 METEOROID_SLINGER_2_DESC: "$METEOROID_SLINGER_1_DESC$"
 MEDIUM_PREYING_MAW: "Средняя пожирающая пасть"
 MEDIUM_PREYING_MAW_DESC: "Иногда проглатывает средние вражеские корабли."
 LARGE_PREYING_MAW: "Крупная пожирающая пасть"
 LARGE_PREYING_MAW_DESC: "Иногда проглатывает крупные вражеские корабли."
 HUGE_PREYING_MAW: "Огромная пожирающая пасть"
 HUGE_PREYING_MAW_DESC: "Иногда проглатывает огромные вражеские корабли."

 HUNT_CUTHOLOID_ATTACK_PROJECT: "Уничтожить кутхолоида в системе [solar_system.GetName&gen]"
