 grand_archive.4105.name: "$leviathans.500.name$"
 grand_archive.4105.desc.common.aesthetic_wonder: "[GetCuratorsDesignation] обратили внимание на ваше прилежное пополнение коллекции §Yкультурных чудес§!. Красота есть во всём — достаточно лишь присмотреться."
 grand_archive.4105.desc.common.historical_item: "[GetCuratorsDesignation] обратили внимание на ваше прилежное пополнение коллекции §Yистории галактики§!. Своими усилиями вы увековечили прежних владельцев этих предметов."
 grand_archive.4105.desc.common.xeno_geology: "[GetCuratorsDesignation] обратили внимание на ваше прилежное пополнение коллекции §Yксеногеологии§!. Камни нередко таят в себе историю целой галактики."

 grand_archive.4105.desc.1.common: "[GetStage1Description]\n\nПусть это вдохновит вас продолжать начатое славное дело."
 CURATORS_STAGE_1_DESC: "Ваша коллекция впечатляет, поэтому мы хотели бы предложить свои услуги. Поскольку каждый из нас заинтересован в сохранении исторической памяти, мы назначим вам в помощь специалиста в какой-либо области на ваше усмотрение."
 DEAD_CURATORS_STAGE_1_DESC: "Несмотря на потерю анклава, мы и дальше готовы предлагать вам свои услуги ради сохранения исторических ценностей — в какой-либо области на ваш выбор."
 grand_archive.4105.desc.1.xeno_geology: "$grand_archive.4105.desc.common.xeno_geology$\n\n$grand_archive.4105.desc.1.common$"
 grand_archive.4105.desc.1.aesthetic_wonder: "$grand_archive.4105.desc.common.aesthetic_wonder$\n\n$grand_archive.4105.desc.1.common$"
 grand_archive.4105.desc.1.historical_item: "$grand_archive.4105.desc.common.historical_item$\n\n$grand_archive.4105.desc.1.common$"

 grand_archive.4105.1.mineral_insight: "Помогите провести раскопки в колониях."
 grand_archive.4105.1.void_mining: "Помогите провести раскопки среди звёзд."
 grand_archive.4105.1.cultural_enrichment: "Помогите разделить их величие."
 grand_archive.4105.1.auctioneering_curation: "Помогите подыскать экземплярам новых хозяев."
 grand_archive.4105.1.historical_insight: "Подскажите, где получить новые знания."
 grand_archive.4105.1.lessons_from_the_past: "Внушите нашим лидерам мудрость былых времён."
