 CAPTURE_AMOUNT_FULL_FLEET: "Одна §Yгравитационная ловушка§! может захватить целую флотилию §Yкосмической фауны§!."

 GRAVITY_SNARE_1: "$gravity_snare$"
 GRAVITY_SNARE_STANDARD: "$gravity_snare$"
 GRAVITY_SNARE_STANDARD_TOOLTIP: "Гравитационные ловушки постоянно испускают ограниченные вспышки квантовой гравитации, надёжно удерживая добычу, у которой нет гипердвигателя. Это излучение можно поддерживать достаточно долго, чтобы ловить §Yкосмическую фауну§! и возвращать её в наши системы, где учёные будут изучать пойманных особей."
 SHIP_STAT_CONTRIBUTION_ADDATIVE_fauna_capture_chance: "$NAME$: $VALUE|Y0%$"
 SHIP_STAT_DESC_fauna_capture_chance: ""

