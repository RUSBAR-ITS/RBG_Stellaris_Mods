 tradition_archivism: "Ведение архива"
 tradition_archivism_desc: "Надлежащее хранение (и предохранение) артефактов — залог осознания своих корней будущим поколением."
 tr_archivism_adopt: "Традиции ведения архива"
 tr_archivism_finish: "Традиции ведения архива завершены"
 tr_archivism_finish_tt: "Каждая завершённая §Yкатегория§! в нашей §Yколлекции§! даёт §G$@archivism_finisher_relics_cost_mult|0%$§! к стоимости активации реликвии"
 tr_archivism_xeno_paleontology: "Ксенопалеонтология"
 tr_archivism_xeno_paleontology_delayed: "Раскрывая секреты, таящиеся среди звёзд, мы сможем узнать об ошибках других."
 tr_archivism_expert_negociation: "Искусные переговоры"
 tr_archivism_expert_negociation_delayed: "По-настоящему ценные предметы должны попадать только в правильные руки."
 tr_archivism_expert_negociation_tt: "§G+$@archivism_expert_negociation_diplo_weight|0%$§! к £diplo_weight£ §Yдипломатическому весу§! за каждый выставленный ['concept_specimen', экземпляр]."
 tr_archivism_expert_negociation_homicidal: "Галактическая жатва"
 tr_archivism_expert_negociation_homicidal_delayed: "Нас вдохновляет сбор принадлежностей чужих культур и видов."
 tr_archivism_expert_negociation_homicidal_tt: "Даёт §G+$@archivism_expert_negociation_homicidal_unity|0$§! к единству ежемесячно за каждый выставленный ['concept_specimen', экземпляр]."
 tr_archivism_frontier_archaeology: "Пограничная археология"
