 GRAVITY_SNARE_CLOAKING_PSI: "$SCIENCE_CLOAKING_PSI$"

 GRAVITY_SNARE_NO_EMERGENCY_FTL: "Гравитационные ловушки неспособны совершать экстренные сверхсветовые манёвры."
 FLEET_CANNOT_TAKE_ORDERS: "§RЭтой флотилии нельзя отдавать приказы.§!"

 MESSAGE_SPACE_CRITTER_CAPTURE_SUCCESS_TITLE: "Космическая фауна захвачена"
 MESSAGE_SPACE_CRITTER_CAPTURE_SUCCESS_DESC: "Захват фауны в системе $SYSTEM|Y$ прошёл успешно! $gravity_snare$ отправила пойманный экземпляр в виварий.\n\nПолучена новая космическая фауна:\n$CAPTURED_LIST$$RESOURCES_LIST$"
 MESSAGE_SPACE_CRITTER_CAPTURE_SUCCESS_NO_VIVARIUM_DESC: "Захват фауны в системе $SYSTEM|Y$ прошёл успешно! Поскольку в §Hвиварии§! нет места, захваченная фауна была умерщвлена и разделана на ресурсы.\n$CULLED_LIST$$RESOURCES_LIST$"
 MESSAGE_SPACE_CRITTER_CAPTURE_FAILURE_TITLE: "Попытка захвата провалилась"
 MESSAGE_SPACE_CRITTER_CAPTURE_FAILURE_DESC: "Попытка захвата в системе $SYSTEM|Y$ провалилась. $gravity_snare$, запущенная с корабля $SHIP_NAME|Y$, потеряна."

 MESSAGE_CAPTURED_SPACE_CRITTER_RETURNED_TITLE: "Новая космическая фауна"
 MESSAGE_CAPTURED_SPACE_CRITTER_RETURNED_DESC: "Новая космическая фауна помещена в виварий.\n$NEWBORN_LIST$$CULLED_LIST$$RESOURCES_LIST$"
 MESSAGE_CAPTURED_SPACE_CRITTER_RETURNED_DESC_CULLED: "\n\nСледующая фауна умерщвлена ради ресурсов:\n$CULLED_LIST$"

 CULLED_CREATURES_RESOURCE_OUTPUT_DESC: "\n\nПолученные ресурсы:\n  $RESOURCES_LIST$"

 mod_gravity_snare_cooldown_mult: "Перезарядка гравитационной ловушки"
 MOD_GRAVITY_SNARE_COST_MULT: "Стоимость гравитационной ловушки"
 MOD_SPACE_FAUNA_CULLING_REWARD_MULT: "Ресурсы от убоя"

 grand_archive.7210.name: "Гравитационные ловушки"
 grand_archive.7210.desc.common: "После того как мы изобрели §Y$gravity_snare_plural$§!, [root.GetAdjective&pl] научные корабли получили возможность запускать эти устройства."
 grand_archive.7210.desc.vivarium: "Эти не смертельные снаряды захватывают космическую фауну и переносят её в §Yвиварий§!, где захваченные экземпляры могут размножаться.\n\nИх можно умерщвлять и разделывать, чтобы добывать §Yгенетический материал§!, необходимый для клонирования и других целей."
 grand_archive.7210.desc.no_vivarium: "Эти не смертельные снаряды захватывают космическую фауну и переносят её к учёным для изучения и разделывания. Таким образом добывают §Yгенетический материал§! и ресурсы.\n\nЧтобы разводить космическую фауну, нам понадобится §Yвиварий§!. Для этого можно построить §Y$grand_archive$§! или возводить §Y[GetHatcheryPlural]§! на космических базах."

 grand_archive.7220.name: "Преторинские твари"
 grand_archive.7220.desc: "Наши §Y$gravity_snare_plural$§! не могут полноценно отслеживать и удерживать §YПреторинскую напасть§!. Наблюдая за перемещениями этих существ мы предположили, что это не отдельные существа — ими управляет некий общий разум.\n\nПри попытке поместить в виварий отдельную особь в опасности окажется не только остальная наша космическая фауна, но и [this.GetName::весь <1>|||fem:вся <1>|||pl:все <1>].\n\nМы приостановили захват этих организмов на неопределённый срок."
 grand_archive.7220.a: "Разумная мера."

 ################
 # Technologies #
 ################

 tech_galactic_archivism: "Ведение галактического архива"
 tech_galactic_archivism_desc: "Историю нашей галактики необходимо тщательно фиксировать, иначе мы ничему не научимся у предков. В этом нам поможет обширный архив."

 tech_gravity_wells: "Гравитационные ловушки"
 tech_gravity_wells_desc: "Местные сосредоточения квантовой массы способны вспышками испускать усиленную гравитацию. При грамотном распоряжении такой технологией мы теоретически сможем ловить и удерживать существ любого размера, не причиняя им вреда."
 tech_containment_vessel: "Кураторские меры содержания"
 tech_containment_vessel_desc: "В гравитационные ловушки попадается вдвое больше §Yкосмической фауны§!."

 TECH_UNLOCK_CONTAINMENT_VESSEL_TITLE: "$TECH_UNLOCK_COMPONENT_LINE$ $tech_containment_vessel$"
 TECH_UNLOCK_CONTAINMENT_VESSEL_DESC: "$tech_containment_vessel_desc$"

 tech_asteroidal_carapace: "Астероидный панцирь"
 tech_asteroidal_carapace_desc: "Раковина кутхолоида состоит из минералов, усиленных прочными биологическими волокнами. С помощью достижений современной металлургии мы сможем синтезировать это соединение."
 ASTEROIDAL_CARAPACE_ARMOR: "$tech_asteroidal_carapace$"
 ASTEROIDAL_CARAPACE_ARMOR_DESC: "$tech_asteroidal_carapace_desc$"

 tech_gravity_snare_capacity_desc: "В гравитационные ловушки попадается на §G1§! представителя §Yкосмической фауны§! больше."
 tech_gravity_snare_capacity_1: "Микросингулярные усиления"
 tech_gravity_snare_capacity_1_desc: "$tech_gravity_snare_capacity_desc$"
 tech_gravity_snare_capacity_2: "Оптимизация управления гравитацией"
 tech_gravity_snare_capacity_2_desc: "$tech_gravity_snare_capacity_desc$"
 tech_gravity_snare_capacity_3: "Доработка системы удержания"
 tech_gravity_snare_capacity_3_desc: "$tech_gravity_snare_capacity_desc$"
 gateway_snare_capacity: "Вместимость гравитационных ловушек"

 gateway_gravity_snare_capacity: "§HПуть вместимости гравитационных ловушек§!\n§EЭта технология поспособствует дальнейшим достижениям в области вместимости гравитационных ловушек.§!"

 tech_alien_cloning: "Искусственное разведение"
 tech_alien_cloning_beastmasters: "$tech_alien_cloning$"
 tech_alien_cloning_desc: "В тщательно контролируемой среде можно использовать генетический материал, собранный из умерщвлённой космической фауны, и создавать новых особей, послушных нашим командам."
 feature_alien_cloning_unlocked: "Политика §Yроста космической фауны§!"
 feature_alien_cloning_unlocked_desc: "$policy_space_fauna_growth_desc$"
 tech_alien_cloning_tt: "§HВозможность:§! Клонирование космической фауны — корветов"
 tech_improved_incubators: "Улучшенные инкубаторы"
 tech_improved_incubators_beastmasters: "$tech_improved_incubators$"
 tech_improved_incubators_desc: "Процесс искусственного выращивания организмов в инкубаторах можно доработать, ускорив начальные этапы развития в целях создания более взрослых клонов."
 tech_improved_incubators_tt: "§HВозможность:§! Клонирование космической фауны — эсминцев"
 tech_improved_incubators_tt_desc: "В инкубаторах теперь можно клонировать более крупные экземпляры §Yкосмической фауны§!, схожие по размеру с классическими эсминцами."
 tech_metabolic_gases: "Метаболические газы"
 tech_metabolic_gases_beastmasters: "$tech_metabolic_gases$"
 tech_metabolic_gases_desc: "Улучшение состава метаболических газов в инкубаторах ускорит развитие особей перед их извлечением."
 tech_metabolic_gases_tt: "§HВозможность:§! Клонирование космической фауны — линкоров"
 tech_metabolic_gases_tt_desc: "В инкубаторах теперь можно клонировать корабли космической фауны любой стадии развития и любого размера."

 BOARDING_CABLES: "Абордажные тросы"
 BOARDING_CABLES_MODULES: "$BOARDING_CABLES$"
 BOARDING_CABLES_TOOLTIP: "С небольшой вероятностью позволяют похитить вражеский корабль или захватить вражеского командира ради выкупа."
 BOARDING_CABLES_DESC: "$BOARDING_CABLES_TOOLTIP$"
 tech_boarding_cables: "$BOARDING_CABLES$"
 tech_boarding_cables_desc: "Переделанные малокалиберные артиллерийские орудия, стреляющие прочными кабелями из углеволокна с крючьями на концах. Отлично подходят для остановки вражеских кораблей и взятия их на абордаж."

 tech_controlled_mutations: "Контролируемая мутация"
 tech_controlled_mutations_desc: "Путём модификации генома можно повысить эффективность кораблей космической фауны: мы внедрим в их биомассу технологии искусственного происхождения."
 tech_controlled_mutations_2: "Улучшенная контролируемая мутация"
 tech_controlled_mutations_2_desc: "Это ещё не предел. Серьёзное вмешательство в генетику космической фауны позволит нам внедрять самые разные специализированные компоненты."

