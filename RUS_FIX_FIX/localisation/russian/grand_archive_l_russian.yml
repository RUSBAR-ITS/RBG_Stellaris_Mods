 sm_voidlure: "Пустотная приманка"
 sm_voidlure_desc: "Пустотные приманки посылают в открытый космос сигналы, привлекающие обитателей межзвёздного пространства."
 sm_voidlure_desc_know_fauna: "Пустотные приманки посылают в открытый космос сигналы, со временем приманивающие определённые разновидности космической фауны. Каждую приманку надо размещать в системе той разновидности, которую предпочитает приманиваемое существо. Привлечённые существа будут покорны в течение одного года."
