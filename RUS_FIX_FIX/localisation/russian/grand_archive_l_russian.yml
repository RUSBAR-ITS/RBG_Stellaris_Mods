 tr_domestication_finish_desc: "[GetDomesticationFinishEffectDesc]"
 tr_domestication_containment_protocols: "Меры содержания"
 tr_domestication_containment_protocols_delayed: "При содержании и перевозке крупных организмов всегда есть риск, что они как-либо навредят самим себе или получат травму. С помощью правильно подобранных умиротворяющих газов и мер содержания эту опасность можно минимизировать."
 tr_domestication_containment_protocols_tt: "Повышенный шанс захватить более редкую §Yкосмическую фауну§!."
 tr_domestication_bio_repurposing: "Биоперепрофилирование"
 tr_domestication_bio_repurposing_delayed: "Мы не тратим ничего попусту."
 tr_domestication_bio_repurposing_blocker_tt: "$r_food$ при расчистке £blocker£ §Yестественных препятствий§!: §G$@bio_repurposing_blocker_clear_food|0$§!"
 tr_domestication_bio_repurposing_tt: "Обломки, остающиеся после гибели нашей §Yкосмической фауны§!, можно исследовать, чтобы вернуть §G10%§! её стоимости.\n$tr_domestication_bio_repurposing_blocker_tt$"
 tr_domestication_bio_repurposing_reanimator_tt: "$tr_domestication_bio_repurposing_blocker_tt$"
 tr_domestication_bio_repurposing_nomads: "Космические пастухи"
 tr_domestication_bio_repurposing_nomads_delayed: "Обитающие в космической пустоте существа многое могут предложить тем, кто о них позаботится."
 tr_domestication_astrozoology: "Астрозоология"
 tr_domestication_astrozoology_delayed: "Космические обитатели уникальны: у каждого свои способны размножения и потребности в питании. Чтобы полностью раскрыть потенциал выращиваемых в неволе существ, потребуется тщательная забота."
 tr_domestication_astrozoology_tt: "При захвате или разведении космической фауны:\n$t$- Получены ресурсы за убой: §G200%§!"
 tr_domestication_metabolic_regulation: "Регуляция метаболизма"
 tr_domestication_metabolic_regulation_delayed: "Путём управления различными ключевыми ферментами и белками, влияющими на метаболизм каждого содержащегося у нас существа, мы можем искусственно контролировать их взросление."
 tr_domestication_metabolic_regulation_tt: "Доступна политика §Y$policy_metabolic_regulation$§!"
 tr_domestication_metabolic_regulation_machine_tt: "$tr_domestication_metabolic_regulation_tt$"
 tr_domestication_killer_instinct: "Инстинкт убийцы"
 tr_domestication_killer_instinct_delayed: "Обитатели открытого космоса могут полагаться только на самих себя: либо они будут защищаться, либо их вид вымрет."
 tr_domestication_killer_instinct_homicidal_delayed: "Служить нам достойны лишь самые беспощадные."

