##########
# Civics #
##########

 civic_galactic_curators: "Галактические кураторы"
 civic_galactic_curators_desc: "Эта цивилизация традиционно находит вдохновение в тщательном сборе и хранении исторических артефактов. Сегодня же, когда до тайн галактики можно дотянуться рукой, она стремится к новым знаниям."
 civic_galactic_curators_effects: "$civic_galactic_curators_effects_common$\n$t$- $entertainers_are_curators_tt$"
 civic_corporate_galactic_curators: "Опыт в области древностей"
 civic_corporate_galactic_curators_desc: "Антиквариат и предметы коллекционирования сулят хорошие деньги. Это общество понимает столь простой факт лучше других. Теперь эти эксперты ищут возможности для капиталовложений среди звёзд."
 civic_corporate_galactic_curators_effects: "$civic_galactic_curators_effects_common$\n$t$- $entertainers_are_curators_tt$\n$t$- $BRANCH_OFFICE_BUILDING$ £building£ ['building:building_public_relations_office'] $megacorp_civic_branch_office_building_effect$"
 civic_hive_galactic_curators: "Сеть смотрителей"
 civic_hive_galactic_curators_desc: "Развитию этого коллектива всегда сопутствовала одержимость к хранению и сбережению. Раньше такое поведение помогало им выживать, сегодня оно толкает их к выставлению напоказ всего, что им удаётся собрать."
 civic_hive_galactic_curators_effects: "$civic_galactic_curators_effects_common$"
 civic_machine_galactic_curators: "Сеть смотрителей"
 civic_machine_galactic_curators_desc: "Главная директива, заложенная в код этого машинного разума, — сбор и хранение."
 civic_machine_galactic_curators_effects: "$civic_galactic_curators_effects_common$"
 civic_galactic_curators_effects_common: "$t$- $GUARANTEED_RESEARCH_OPTION_STRING$\n$tt$- ['technology:tech_galactic_archivism', £society_research£ $tech_galactic_archivism$]\n$t$- Изначальные ['concept_specimen', экземпляры]\n$tt$- По одному §0обычному§! из каждой категории коллекции\n$t$- Обнаружение новых §Yэкземпляров§! или завершение §Yраскопок§! даёт $r_unity_acc$\n$t$- Стоимость услуг §Yанклава Кураторов§!: §G$@galactic_curators_curator_enclave_purchase_cost|%0$§!\n$t$- Доступен указ §Y['edict:decentralized_research', $edict_decentralized_research$]§!"
 edict_decentralized_research: "Децентрализованные исследования"
 edict_decentralized_research_desc: "Подлинное знание находится за пределами границ нашей цивилизации. Сосредоточив внимание на галактике целиком, мы сможем лучше понять самих себя."
 edict_decentralized_research_nomad: "$edict_decentralized_research$"
 edict_decentralized_research_nomad_desc: "$edict_decentralized_research_desc$"
 MOD_COUNTRY_SPECIMEN_ACQUIRE_CHANCE_MULT: "Повышенный шанс обнаружить экземпляры"

 councilor_galactic_curators: "Верховный куратор"
 councilor_galactic_curators_desc: "$TITLE$ отвечает за качество хранения всех экземпляров."
 councilor_corporate_galactic_curators: "Руководящий куратор"
 councilor_corporate_galactic_curators_desc: "$TITLE$ отвечает за выставку и продажу экземпляров."

 civic_beastmasters: "Повелители зверей"
 civic_beastmasters_desc: "Это общество достигло технологической зрелости в системе, где пасутся космические амёбы, а потому прекрасно научилось понимать этих существ. Разведение и клонирование амёб, а также забота о них идут на пользу обеим сторонам сразу."
 civic_machine_beastmasters: "Биодроны"
 civic_machine_beastmasters_desc: "Этот машинный разум когда-то непосредственно взаимодействовал с космическими биоорганизмами в родной системе и со временем провёл полную интеграцию этих могучих существ. Результатом стали полностью взаимовыгодные отношения."
 civic_hive_beastmasters: "Дикий рой"
 civic_hive_beastmasters_desc: "Этот коллективный разум представляет собой крайне легко приспосабливающуюся колонию. Он существует в симбиозе с космическими биоорганизмами из родной системы. Эти умы мыслят порознь, но преследуют единую цель."
 civic_wilderness_beastmasters: "$civic_hive_beastmasters$"
 civic_wilderness_beastmasters_desc: "Это дикое сознание открыто к симбиозу с космической фауной, населяющей его родную систему. И хотя интеграция с мутуалистическим сознанием еще не закончена, эти организмы всё же совместно стремятся к единой цели."
 civic_corporate_beastmasters: "Космические скотоводы"
 civic_corporate_beastmasters_desc: "Эта мегакорпорация, бывшая когда-то элитной гильдией скотоводов, разработала технологию выращивания космических существ и ухода за ними прямо в родной системе."

 civic_beastmasters_common_effects_1: "$t$- $ADDITIONAL_TECHNOLOGIES_STRING$\n$tt$- ['technology:tech_gravity_wells', £physics£ $tech_gravity_wells$]\n$tt$- ['technology:tech_alien_cloning', £society£ $tech_alien_cloning$]\n$t$- Доступные и построенные сооружения космической базы:\n$tt$- £building£ ['concept_beastport']"
 civic_beastmasters_ships: "Стартовые §Yвоенные корабли§! заменяются на §Yкосмических амёб§!"
 civic_beastmasters_common_effects_2: "Стартовый £genetic_material£ ['concept_dna', генетический материал]:\n$tt$- §0Обычный§! материал космической амёбы"
 civic_beastmasters_effects: "$civic_beastmasters_common_effects_1$\n$t$- $civic_beastmasters_ships$\n$t$- $civic_beastmasters_common_effects_2$"
 civic_corporate_beastmasters_effects: "$civic_beastmasters_common_effects_1$\n$t$- $civic_beastmasters_ships$\n$t$- $civic_beastmasters_common_effects_2$\n$t$- $BRANCH_OFFICE_BUILDING$ £building£ ['building:building_food_conglomerate'] $megacorp_civic_branch_office_building_effect$"
 civic_cordyceptic_beastmasters_effects: "$civic_beastmasters_common_effects_1$\n$t$- Начинают с §Yклонированной космической амёбой§! вместо §Yкосмической амёбы-нежити§!\n$t$- $civic_beastmasters_common_effects_2$"

 councilor_beastmasters: "Владыка над зверями"
 councilor_beastmasters_desc: "Крайне ответственная и престижная должность. $TITLE$ распоряжается кораблями космической фауны, в том числе их стратегическим развёртыванием."
 councilor_corporate_beastmasters: "Главный скотовод"
 councilor_corporate_beastmasters_desc: "$TITLE$ отвечает за здоровье и постоянное пополнение численности кораблей космической фауны. Эта должность требует немалых знаний в области логистики, экологии и животноводства."

 civic_tooltip_not_beastmasters: "НЕТ гражданской модели ['concept_beastmasters_civic']"
 concept_beastmasters_civic: "$civic_beastmasters$"
 concept_beastmasters_civic_desc: "К гражданским моделям группы «$concept_beastmasters_civic$» относятся:\n- ['civic:civic_beastmasters']\n- ['civic:civic_hive_beastmasters']\n- ['civic:civic_machine_beastmasters']\n- ['civic:civic_corporate_beastmasters']"

