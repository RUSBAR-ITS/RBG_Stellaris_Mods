 grand_archive.2053.name: "Пустотные черви истреблены"
 grand_archive.2053.desc: "Мы очистили последнюю систему, где обитали пустотные черви. Весь вид теперь истреблён окончательно.\n\nБольше не нужно опасаться их бомбардировок."
 grand_archive.2054.name: "Логово пустотных червей уничтожено"
 grand_archive.2054.desc: "Мы очистили родную систему пустотных червей.\n\nБольше они не смогут выращивать здесь потомство."

 voidworm_scaling: "Нарастание силы пустотных червей"
