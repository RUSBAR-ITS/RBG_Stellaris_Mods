 TREASURE_TROVE_EVENT_TOOLTIP: "§RЭтих авантюристов необходимо уничтожить, пока они не завладели ресурсами.§!"

 grand_archive.6031.name: "Пираты побеждены"
 grand_archive.6031.desc: "После победы над пиратами-авантюристами мы теперь можем завладеть кладом на [event_target:treasure_trove_planet.GetName&prep]."
 grand_archive.6031.a: "Заслуженная добыча."
 grand_archive.6035.name: "Клад потерян"
 grand_archive.6035.desc: "Пираты-авантюристы похитили §Yклад§! на [event_target:treasure_trove_planet.GetName&prep].\n\nНам не оставили ничего ценного."
 grand_archive.6035.a: "Так бывает."

