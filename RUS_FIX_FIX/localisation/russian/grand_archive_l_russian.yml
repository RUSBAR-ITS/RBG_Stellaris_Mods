 ### Primal Calling
 origin_primal_calling: "Первобытный зов"
 origin_primal_calling_desc: "Шуршит высокая трава. На уши оглушительно давит ночная тишина. Охотник собран, он резок и стремителен, как звёздный свет...\n\nЭта цивилизация глубоко связана с дикой природой. Сегодня её представители, считающие себя защитниками разнообразной (и нередко смертельной) фауны родной планеты, устремились к звёздам. Мало кто может соперничать с ними в искусстве обращения с животными, вышедшем из нравственных законов этого народа. Как эта связь проявит себя в галактическом масштабе, ещё только предстоит узнать."
 origin_tooltip_primal_calling_effects: "$t$- $HOMEWORLD$\n$tt$- $PLANETARY_MODIFIERS$ ['concept_untamed_wilds_mod']\n$t$- $AVAILABLE_BUILDINGS$ £building£ ['concept_wildlife_ranch', $wildlife_ranch$]\n$t$- $ADDITIONAL_TECHNOLOGIES_STRING$\n$tt$- £society_research£ ['technology:tech_genome_mapping']\n$t$- $GUARANTEED_RESEARCH_OPTION_STRING$\n$tt$- £society£ ['technology:tech_alien_life_studies']\n$t$После первого контакта с §Yкосмической фауной§!:\n$tt$- Можно выбрать ['concept_primal_calling_stance', подход] к космической фауне\n$tt$- Прогресс в технологии £physics_research£ ['technology:tech_gravity_wells']\n$t$- После захвата космической фауны:\n$tt$- Прогресс в технологии £society_research£ ['technology:tech_alien_cloning']\n$t$- После клонирования космической фауны:\n$tt$- Прогресс в технологии £society_research£ ['technology:tech_controlled_mutations']"
 START_SCREEN_PRIMAL_CALLING: "Даже стремительный технический прогресс не смог разорвать нашу связь с дикой фауной родного мира. Эти существа стойко сопровождали нас на протяжении долгого развития всего нашего общества. Мы — в такой же степени их защитники, в какой они — наши наставники. Мы не берём больше, чем они способны нам дать, и каждая жертва воспринимается с почестями.\n\nЕсли на непокорённых просторах космоса нам встретятся и другие дикие существа, относиться к ним мы будем с таким же уважением, как и к обитателям собственной планеты. Каждому найдётся место; ведь вместе мы сильнее, чем порознь.\n\nПервобытная страсть манит нас к звёздам. Неважно, что мы там встретим, — главное, что любое испытание мы выдержим с честью."
 START_SCREEN_PRIMAL_CALLING_NOMADS: "Мы взяли наш мир с собой. В просторных трюмах корабля-ковчега обитают создания с нашей родины. Они — наши спутники, наставники и живое напоминание о давно минувших временах. Мы не берём больше, чем они способны нам дать, и с уважением относимся к их жертвам.\n\nЕсли на непокорённых просторах космоса нам встретятся и другие дикие существа, относиться к ним мы будем точно так же. Каждому найдётся место; ведь вместе мы сильнее, чем порознь.\n\nПервобытная страсть манит нас к звёздам. Неважно, что мы там встретим, — главное, что любое испытание мы выдержим с честью."

 leader_trait_trophy_hunter: "Охотник за трофеями"
 leader_trait_trophy_hunter_desc: "Этот командир закалён трудностями и умудрён многолетним опытом, а потому превосходно разбирается в космической фауне. Любой хороший охотник умеет думать, как добыча, но совершить идеальный выстрел способны немногие."
 leader_trait_gifted_trapper: "Одарённый зверолов"
 leader_trait_gifted_trapper_desc: "Умелый исследователь, крайне осторожно подходящий к вопросу отлова и перевозки живых особей без причинения им вреда. Этот лидер настолько заботливо относится к живым существам, что вдохновляет исследователей во всех областях придерживаться более высоких стандартов."
 leader_trait_void_hunter: "Охотник пустоты"
 leader_trait_void_hunter_desc: "Опытный охотник, знающий, как расправляться с крупной дичью. Отличается терпением и точностью действий."
 leader_trait_void_hunter_2: "$leader_trait_void_hunter$ II"
 leader_trait_void_hunter_2_desc: "$leader_trait_void_hunter_desc$"
 leader_trait_void_tracker: "Следопыт пустоты"
 leader_trait_void_tracker_desc: "Этот лидер как никто иной умеет ловить дикую космическую фауну аккуратно и без вреда для здоровья."
 leader_trait_void_tracker_2: "$leader_trait_void_tracker$ II"
 leader_trait_void_tracker_2_desc: "$leader_trait_void_tracker_desc$"

 # First Contacts
 first_contact_critters.15.desc.primal_calling: "Примечательно, что в каждом стаде §Hтиянки§! действует матриархальная иерархия: каждую группу возглавляет одна самка. Они же всегда получают пищу в первую очередь, поскольку она необходима для производства особых газов, незаменимых при выращивании потомства и управлении миграцией стада. При нехватке ресурсов самцы обычно отказываются от пищи в пользу самок и отправляются на поиски пропитания, пока стадо отдыхает."
 first_contact_critters.25.desc.primal_calling: "Все особи, кроме самых молодых, всегда перемещаются в компании псевдонезависимых организмов, находящихся под влиянием секретов с содержанием РНК. Удары этих «жгутиков» имеют сложную траекторию, поэтому, несмотря на кажущееся отсутствие интеллекта, §Hкосмические амёбы§! — грозные хищники."
 first_contact_critters.35.desc.primal_calling: "По всей видимости, общение у этих существ происходит посредством хроматических изменений преломляемого света. Такой способ коммуникации позволяет выражать широкий спектр эмоций, однако его применение среди этих полуразумных форм жизни ограничено: изменения цвета обычно выражают только простые сигналы, такие как демонстрация общественного положения, агрессии или способности к размножению."
 grand_archive.2005.desc.primal_calling: "У этих паразитов отсутствует естественная способность к размножению, поэтому они вынуждены полагаться на планетарных хозяев. Популяция §Hпустотных червей§! увеличивается с помощью так называемых троек — групп скрещивания, состоящих из трёх особей. Они производят ключевой гормон, вырабатывающийся путём поглощения достаточного количества органической материи с обитаемых планет. Поскольку пустотные черви — гермафродиты, основными факторами при выборе партнёров выступают преимущественно взаимодополняющие физические черты и сходство в размерах."
 grand_archive.2900.desc.primal_calling: "Мы считаем, что предпочтения этих существ основываются не только на размере астероидов, но и на их минеральном составе. Возможно, [GetCommonMineral] — вещество, которому отдаёт предпочтение первая встреченная нами особь, — не единственное, что кажется им привлекательным, и каждая отдельная особь со временем адаптируется к условиям окружающей среды. Сканирование выявило наличие следов таких металлов во всей поверхности астероида-носителя без исключения, а также в нервной системе и пищеварительном тракте самого §Hкутхолоида§!."
 COMMON_MINERAL_1: "кобальт"
 COMMON_MINERAL_2: "платина"
 COMMON_MINERAL_3: "золото"
 COMMON_MINERAL_4: "серебро"
 COMMON_MINERAL_5: "железо"
 COMMON_MINERAL_6: "никель"
 crystalline_entity_plural: "Кристаллические организмы"

 grand_archive.1002.name: "Жизнь среди звёзд"
 grand_archive.1002.desc.default: "Пустота обманчива: на самом деле она полна жизни. Да, нам известно, что существуют [from.GetSpaceFaunaNamePlural], но кто ещё ждёт нас в глубине мирового пространства?\n\nВозможно, наша тесная связь с фауной планеты [capital_scope.GetName] окажется неуместной в галактическом масштабе, поскольку на просторах космоса может процветать совершенно новая экосистема. Мы оказались на перепутье.\n\nКем станут для нас эти существа?\n\nНадо всё тщательно взвесить: последствия нашего выбора будут отзываться на протяжении многих лет."
 grand_archive.1002.desc.homicidal: "В космической пустоте может процветать жизнь. В нашей власти либо искоренить её, либо воспользоваться ею себе на благо. Узнав, что в галактике существуют [from.GetSpaceFaunaNamePlural], мы уже не остановимся. Охота начинается. Только нам решать, кем станут эти существа: пищей... или тягловым скотом."
 grand_archive.1002.a: "Экземпляры на выставку."
 grand_archive.1002.b: "Скот нам на пользу."
 grand_archive.1002.c: "Организмы, нуждающиеся в защите."
 grand_archive.1002.d: "Новая добыча для наших охотников."
 grand_archive.1002.d.purifier: "Безжизненная груда костей."
 grand_archive.1002.e: "Разум, который необходимо поглотить."
 grand_archive.1002.f: "Партнёры по симбиозу."
 grand_archive.1002.g: "Дичь, за которой стоит погоняться."

 untamed_wilds: "Неукрощённая природа"
 untamed_wilds_desc: "Широкие охраняемые просторы, где фауна может жить и размножаться в своё удовольствие. Здесь постоянно рождаются местные особи."
 grand_archive.1010.desc: "Жители нашей колонии на [Root.GetName&prep] научились уважать границы местных §Yтитанических форм жизни§!.\n\nЭти исполинские звери будут приносить пользу нашему поселению в деле покорения границ и землеустройства."
 grand_archive.1010.a: "[owner.GetWranglerJobNamePlural] здесь добьются успеха."

