 council_agenda_agenda_astute_observation_desc: "Страницы истории нашей галактики покрыты многовековой пылью. Наша задача — усвоить её забытые уроки."
 agenda_astute_observation_launch_finish: "$agenda_ref$ «$council_agenda_agenda_astute_observation_name$»"
 agenda_astute_observation_launch_finish_desc: "$council_agenda_agenda_astute_observation_desc$"

 tradition_domestication: "Одомашнивание"
 tradition_domestication_desc: "Чтобы овладеть галактикой, надо овладеть жизнью в ней."
 tr_domestication_adopt: "Традиции одомашнивания"
 tr_domestication_finish: "Традиции одомашнивания завершены"
 tr_domestication_finish_desc_primal_calling: "$MOD_SPACE_FAUNA_EXPERIENCE_GAIN_MULT$: §G+$@domestication_finish_exp_bonus|0%$§!\n$TRADITIONS_FINISH_AP$"
