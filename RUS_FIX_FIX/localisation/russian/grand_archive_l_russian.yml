 grand_archive.5015.name: "Учреждение хранилища сокровищ"
 grand_archive.5015.desc: "§Y$celestial_chart$§! содержит архивы, позволяющие нам определять стоимость обнаруживаемых сокровищ, а значит — извлекать из них больше выгоды. Теперь мы можем построить §Yхранилище сокровищ§! в одной из колоний, где можно будет сортировать, восстанавливать и хранить ценности. Меньше всего логистических сложностей будет в следующих колониях."
 grand_archive.5015.a: "Создать хранилище сокровищ на §Y[event_target:treasure_planet_candidate_1.GetName&prep]§!."
 grand_archive.5015.b: "Создать хранилище сокровищ на §Y[event_target:treasure_planet_candidate_2.GetName&prep]§!."
 grand_archive.5015.c: "Создать хранилище сокровищ на §Y[event_target:treasure_planet_candidate_3.GetName&prep]§!."
 grand_archive.5015.d: "Создать хранилище сокровищ на §Y[event_target:treasure_planet_candidate_4.GetName&prep]§!."

