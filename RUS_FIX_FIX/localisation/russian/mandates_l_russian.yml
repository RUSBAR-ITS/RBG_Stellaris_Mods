l_russian:

 ####################################
 #	COMMON STRINGS
 ####################################

 mandate_unity_reward: "£unity£ Единство за §Y6§! месяцев (максимум 1000)"

 ####################################
 #	MANDATES
 ####################################

 MANDATE_mandate_planet_separatist: "Поддержка сепаратистов"
 MANDATE_mandate_planet_separatist_DESC: "Освободить фракцию [Root.GetPopFactionName] и сделать её независимым государством.\n\nНаграда:\n$mandate_influence_reward_t3$"
 MANDATE_mandate_emancipation: "Великое освобождение"
 MANDATE_mandate_emancipation_DESC: "Искоренить рабство в [Root.Owner.GetName&prep].\n\nНаграда:\n$mandate_influence_reward_t3$\n$mandate_happiness_reward_t1$"
 MANDATE_mandate_emancipation2: "Освобождение поселений"
 MANDATE_mandate_emancipation2_DESC: "Освободить всех [Root.Owner.GetSpeciesAdj&pl,gen] рабов в как минимум одном мире.\n\nНаграда:\n$mandate_influence_reward_t3$\n$mandate_happiness_reward_t1$"
 MANDATE_mandate_orbital_researcher: "Орбитальные исследования"
 MANDATE_mandate_orbital_researcher_DESC: "Ускорить научные исследования [Root.Owner.GetName&gen], построив как минимум четыре орбитальных §Yнаучных станции§!.\n\nНаграда:\n$mandate_unity_reward$"
 MANDATE_mandate_miner: "Космическая добыча"
 MANDATE_mandate_miner_DESC: "Увеличить запасы минералов [Root.Owner.GetName&gen], построив как минимум четыре орбитальных §Yдобывающих станции§!.\n\nНаграда:\n$mandate_influence_reward_t5$"
 MANDATE_mandate_shipwright: "Судостроение"
 MANDATE_mandate_shipwright_DESC: "Обеспечить безопасность и защиту [Root.Owner.GetSpeciesAdj&fem,gen] расы, создав к концу правления флотилии, задействующие не менее 75% от нашей общей вместимости флота.\n\nНаграда:\n$mandate_influence_reward_t5$"
 MANDATE_mandate_peacemaker: "Установление мира"
 MANDATE_mandate_peacemaker_DESC: "Остановить к концу правления все войны, в которые [Root.Owner.GetName::втянут <1>|||fem:втянута <1>|||neut:втянуто <1>|||pl:втянуты <1>].\n\nНаграда:\n$mandate_influence_reward_t5$"
 MANDATE_mandate_slaver: "Рабовладение"
 MANDATE_mandate_slaver_DESC: "Обеспечить дальнейшее процветание [Root.Owner.GetName&gen], узаконив рабство.\n\nНаграда:\n$mandate_influence_reward_t2$"
 MANDATE_mandate_xenopurger: "Борьба за чистоту"
 MANDATE_mandate_xenopurger_DESC: "Зачистить чужаков, живущих среди нас, в §Yкак минимум одной колонии§! за время правления.\n\nНаграда:\n$mandate_influence_reward_t2$\n$mandate_happiness_reward_t1$"
 MANDATE_mandate_nationalist: "Репатриация"
 MANDATE_mandate_nationalist_DESC: "Передать планеты первоначальному владельцу: §Y[parameter:country.GetName]§!.\n\nНаграда:\n$mandate_influence_reward_t3$"

 ####################################
 #	MANDATE CHAINS
 ####################################

 mandate_miner_chain_title: "Мандат: добыча минералов"
 mandate_miner_chain_desc: "[This.GetRulerTitle] [This.GetRulerName] [This.Ruler.GetAXX::пообещал<end_a>] избирателям, что увеличит £minerals£ §Yдобычу минералов§!, построив §Yдобывающие станции§! на орбитах подходящих для этого планет.\n\nНаграда:\n$mandate_unity_reward$"
 mining_stations_built: "Добывающие станции построены"

 mandate_orbresearch_chain_title: "Мандат: орбитальные исследования"
 mandate_orbresearch_chain_desc: "[This.GetRulerTitle] [This.GetRulerName] [This.Ruler.GetAXX::пообещал<end_a>] избирателям, что увеличит §Yтемп научных исследований§!, построив §Yнаучные станции§! на орбитах подходящих для этого планет.\n\nНаграда:\n$mandate_unity_reward$"
 orbresearch_built: "Научные станции построены"

 mandate_xenopurge_chain_title: "Мандат: геноцид чужаков"
 mandate_xenopurge_chain_desc: "[This.GetRulerTitle] [This.GetRulerName] [This.Ruler.GetAXX::пообещал<end_a>] избирателям, что §Yочистит§! §H[purge_planet.GetName&acc]§! от всех поселений, кроме §Y[Root.GetSpeciesAdj&pl,gen]§!.\n\nНаграда:\n$mandate_influence_reward_t2$\n$mandate_happiness_reward_t1$"
 world_purged: "Планета очищена"

 mandate_shipwright_chain_title: "Мандат: строительство кораблей"
 mandate_shipwright_chain_desc: "[This.GetRulerTitle] [This.GetRulerName] [This.Ruler.GetAXX::пообещал<end_a>] избирателям увеличить военные расходы и обещает, что §Yк концу его правления будет задействовано как минимум 75% вместимости наших флотилий§!.\n\nНаграда:\n$mandate_influence_reward_t2$"
 military_presence_maintained: "Мандат исполнен"

 mandate_fiscal_reserve_chain_title: "Мандат: накопление средств"
 mandate_fiscal_reserve_chain_desc: "[This.GetRulerTitle] [This.GetRulerName] [This.Ruler.GetAXX::пообещал<end_a>] избирателям, что будет §Yэкономить§! и §Yразумно расходовать средства§!, и поэтому §H[Root.GetName]§! накопит §Yкак минимум £energy£1000§! энергокредитов §Yк концу правления§!."

 mandate_emancipation_chain_title: "Мандат: великое освобождение"
 mandate_emancipation_chain_desc: "[This.GetRulerTitle] [This.GetRulerName] [This.Ruler.GetAXX::пообещал<end_a>] избирателям, что §Yотменит рабство§! и сделает его §Yуголовно наказуемым§! за время своего правления.\n\nНаграда:\n$mandate_influence_reward_t3$\n$mandate_happiness_reward_t1$"
 mandate_fulfilled: "Мандат исполнен"

 mandate_emancipation2_chain_title: "Мандат: освобождение поселений"
 mandate_emancipation2_chain_desc: "[This.GetRulerTitle] [This.GetRulerName] [This.Ruler.GetAXX::пообещал<end_a>] избирателям, что §Yосвободит всех рабов§! на §H[free_planet.GetName&prep]§! в ходе своего правления.\n\nНаграда:\n$mandate_influence_reward_t3$\n$mandate_happiness_reward_t1$"
 planet_freed: "Планета освобождена"

 mandate_separatist_chain_title: "Мандат: сепаратизм"
 mandate_separatist_chain_desc: "[This.GetRulerTitle] [This.GetRulerName] [This.Ruler.GetAXX::пообещал<end_a>] избирателям, что §Yосвободит§! §H[release_planet.GetName&acc]§! и сделает её независимым государством. Обратитесь к списку §Yфракций§! за подробностями.\n\nНаграда:\n$mandate_influence_reward_t3$"
 empire_released: "Государство освобождено"

 mandate_peacemaker_chain_title: "Мандат: миротворец"
 mandate_peacemaker_chain_desc: "[This.GetRulerTitle] [This.GetRulerName] [This.Ruler.GetAXX::пообещал<end_a>] избирателям, что §Yпрекратит [Root.GetSpeciesAdj&neut] участие§! во каких-либо войнах к концу правления.\n\nНаграда:\n$mandate_influence_reward_t2$"
 no_engagements: "Все конфликты остановлены"

 mandate_slaver_chain_title: "Мандат: порабощение"
 mandate_slaver_chain_desc: "[This.GetRulerTitle] [This.GetRulerName] [This.Ruler.GetAXX::пообещал<end_a>] избирателям, что §Yпоработит§! как минимум §Y500§! £pop£ §Hпоселений§! к концу своего правления.\n\nНаграда:\n$mandate_influence_reward_t2$"
 pops_enslaved: "Поселения порабощены"

 mandate_nationalist_chain_title: "Мандат: репатриация"
 mandate_nationalist_chain_desc: "[This.GetRulerTitle] [This.GetRulerName] [This.Ruler.GetAXX::пообещал<end_a>] избирателям, что §Yвернёт§! §H[ceding_empire.GetName&dat]§! его колонии к концу своего правления. Это можно осуществить с помощью списка фракций.\n\nНаграда:\n$mandate_influence_reward_t3$"
 planet_ceded: "Планета передана"

 ####################################
 #	MANDATE EVENTS
 ####################################

 mandate.1.title: "Мандат нового правителя"
 mandate.1.desc: "[Root.GetRulerName] [Root.Ruler.GetAXX::победил<end_a>] на выборах и [Root.Ruler.GetAXX::получил<end_a>] титул §Y[Root.GetRulerTitle]§! §H[Root.GetName&gen]§!.\n\nПодробности о [Root.Ruler.GetHerHis] §Yмандате§! добавлены в §Yжурнал§!."
 mandate.2.title: "Мандат нарушен"
 mandate.2.desc: "[Root.Ruler.GetAXX::Наш<end_a>] [Root.GetRulerTitle] [Root.Ruler.GetAXX::завершил<end_a>] правление, так и не выполнив предвыборные обещания."

 # Separatist
 mandate.100.title: "Мандат о поддержке сепаратистов исполнен"
 mandate.100.desc: "Выполняя предвыборное обещание, [Root.Ruler.GetAXX::наш<end_a>] [Root.GetRulerTitle] [Root.Ruler.GetAXX::освободил<end_a>] §H[released_planet.GetName&acc]§! в виде государства, которое стало §Yвассалом§! §H[Root.GetName&gen]§!."

 # Miner
 mandate.111.title: "Мандат о добыче минералов исполнен"
 mandate.111.desc: "Выполняя предвыборное обещание, [Root.Ruler.GetAXX::наш<end_a>] [Root.GetRulerTitle] [Root.Ruler.GetAXX::завершил<end_a>] строительство дополнительных добывающих станций."

 # Orbital Researcher
 mandate.121.title: "Мандат по орбитальным исследованиям исполнен"
 mandate.121.desc: "Выполняя предвыборное обещание, [Root.Ruler.GetAXX::наш<end_a>] [Root.GetRulerTitle] [Root.Ruler.GetAXX::завершил<end_a>] строительство дополнительных научных станций."

 # Xenopurger
 mandate.132.title: "Мандат о борьбе за чистоту исполнен"
 mandate.132.desc: "Выполняя предвыборное обещание, [Root.Ruler.GetAXX::наш<end_a>] [Root.GetRulerTitle] [Root.Ruler.GetAXX::очистил<end_a>] колонию [From.GetName] от чужаков, не относящихся к [Root.GetSpeciesAdj&fem,gen] расе."

 # Shipwright
 mandate.141.title: "Мандат о судостроении исполнен"
 mandate.141.desc: "Как и [Root.Ruler.GetAXX::обещал наш|||fem:обещала наша] [Root.GetRulerTitle] в своём мандате, наши флотилии теперь задействуют как минимум 75% вместимости флота."
 mandate.142.title: "Мандат нарушен"
 mandate.142.desc: "[Root.Ruler.GetAXX::Наш<end_a>] [Root.GetRulerTitle] [Root.Ruler.GetAXX::завершил<end_a>] правление, так и не выполнив цели своего мандата в срок."

 # Emancipator 1
 mandate.150.title: "Мандат о великом освобождении исполнен"
 mandate.150.desc: "Выполняя предвыборное обещание, [Root.Ruler.GetAXX::наш<end_a>] [Root.GetRulerTitle] [Root.Ruler.GetAXX::запретил<end_a>] §Yрабство§! в [Root.GetName&prep]."

 # Emancipator 2
 mandate.155.title: "Мандат по освобождению поселений исполнен"
 mandate.155.desc: "Выполняя предвыборное обещание, [Root.Ruler.GetAXX::наш<end_a>] [Root.GetRulerTitle] полностью [Root.Ruler.GetAXX::освободил<end_a>] от рабства поселения в колонии [From.GetName]."

 # Peacemaker
 mandate.161.title: "Мандат о миротворчестве исполнен"
 mandate.161.desc: "Выполняя предвыборное обещание, [Root.Ruler.GetAXX::наш<end_a>] [Root.GetRulerTitle] [Root.Ruler.GetAXX::оградил<end_a>] §H[Root.GetName&acc]§! от участия в конфликтах."
 mandate.162.title: "Мандат нарушен"
 mandate.162.desc: "$mandate.142.desc$"

 # Slaver
 mandate.171.title: "Мандат о порабощении исполнен"
 mandate.171.desc: "Выполняя предвыборное обещание, [Root.Ruler.GetAXX::наш<end_a>] [Root.GetRulerTitle] [Root.Ruler.GetAXX::поработил<end_a>] §Y500§! £pop£ §Hпоселений§!."

 # Nationalist
 mandate.180.title: "Мандат о репатриации исполнен"
 mandate.180.desc: "Выполняя предвыборное обещание, [Root.Ruler.GetAXX::наш<end_a>] [Root.GetRulerTitle] [Root.Ruler.GetAXX::уступил<end_a>] §H[ceding_empire.GetName&dat]§! захваченные колонии."
