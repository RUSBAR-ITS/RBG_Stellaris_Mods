 futureshock_chain_title: "Столкновение с будущим"
 futureshock_chain_desc: "Мы отказываемся довольствоваться тем, что дала нам природа, и стремимся преодолеть ограничения органических тел. Полномасштабное распространение имплантов проходит почти без препятствий, а те, что всё-таки есть, легко устранить. Новые возможности, которые обещают киберимпланты, вскружили голову почти каждому из нас.\n\nВеличие настолько близко, что до него почти можно дотянуться. Осталось лишь дождаться."

