 situation_cyberization_hive: "Кибернетизация"
 situation_cyberization_hive_type: "Инцидент: преображение"
 situation_cyberization_hive_desc: "Разуму улья нужны тела высочайшего качества. Кибернетические импланты помогут сделать наши единицы лучше, идеальнее, совершеннее.\nПора выйти за рамки биологических ограничений наших тел.\n\n§YПоселений, которые получат импланты в следующем месяце§!: §G[From.GetCyberPopsPerMonth]§!"
 situation_cyberization_hive_monthly_change_tooltip: "Наши тела станут синтетическими: идеальным симбиозом органики и механизмов."
 situation_cyberization_hive_outcome: "Кибернетическое население."
 stage_cyberization_hive_effects: "Нам нужно спроектировать кибернетические импланты, вживить их и преобразить себя."
 cyber.hive_government_shift.tt: "Влияет на идущий §Yпереход к кибернетическому сознанию§!."

