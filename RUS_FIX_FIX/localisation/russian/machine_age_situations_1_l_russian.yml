 concept_edict_hive_mega_construction: "$edict_hive_mega_construction$"

 # CYBERIZATION STAGE 1
 cyber.2100.name: "Тел много. Цель одна."
 cyber.2100.desc: "Размышляя о природе аугментации, мы невольно задумываемся о своих стремлениях.\n\nКибернетизация — это инструмент, способ улучшить наши тела, чтобы эффективнее реализовывать свои желания. Существует бесчисленное количество форм аугментации, каждая из них предлагает свои преимущества, но и предъявляет свои требования. Механические конечности тяжелы, кибермозги потребляют много энергии, а сложные компоненты требуют постоянного техобслуживания. На пути к совершенству приходится делать выбор — и не один.\n\nКакую цель мы преследуем в погоне за аугментацией? Ради чего мы сращиваем [Owner.Species.GetFleshTypeCyberCreed::наш|||fem:нашу|||neut:наше|||pl:наши] [Owner.Species.GetFleshTypeCyberCreed&acc] со сталью и тянем металлические [owner.GetSpeciesHandNamePlural] к небу?"
 cyber.2100.a: "Понимание."
 cyber.2100.a.tt: "Направить исследования на улучшение интеллекта единиц ."
 cyber.2100.b: "Господство."
 cyber.2100.b.tt: "Направить исследования на превращение единиц в смертельное оружие."
 cyber.2100.c: "Изобилие."
 cyber.2100.c.tt: "Направить исследования на повышение производительности единиц ."

 # CYBERIZATION STAGE 2
 cyber.2200.name: "Цель одна: аугментация"
 cyber.2200.desc: "По мере того как праздные размышления превращаются в конкретные планы, у нас возникает срочная необходимость в лаборатории, где можно собирать и тестировать кибернетические прототипы.\n\nМы возведём $building_augmentation_center$, чтобы отделять [Owner.Species.GetFleshTypeCyberCreed&acc] и перекраивать [Owner.Species.GetFleshTypeCyberCreed::<ego_eyo>] с металлом и мечтой."
 cyber.2200.a: "Пора начинать строить наше будущее."
 cyber.2200.a.tt: "§RНеобходимо действие:§!\nПостройте £building£ ['building:building_augmentation_center'], чтобы продолжить инцидент §Y$situation_cyberization_hive$§!."

 cyber.2205.name: "Прототипов много. Решение одно."
 cyber.2205.desc: "Наши исследования привели к созданию целого ряда перспективных кибернетических прототипов. Предварительные результаты показывают, что одни из них отлично повышают физические характеристики, тогда как другие больше подходят для работы, требующей высокой точности. У каждого варианта есть свои сильные и слабые стороны, явного лидера среди них нет.\n\nВ нашем разуме возникает пугающая мысль: а что если мы диверсифицируем наши единицы? По-разному модифицируем наши тела в зависимости от их функции? Это лишит нас однородности, и такую перспективу тяжело принять. Но повышение эффективности может стать достойной наградой за потерю гармонии."
 cyber.2205.a: "Выбрать несколько различных прототипов."
 cyber.2205.b: "Выбрать один многофункциональный прототип."

 cyber.2220.name: "Одни из нас?"
 cyber.2220.desc: "Создание единиц иногда приводит к появлению дефективных тел. Обычно таких уродцев быстро уничтожают, но благодаря кибернетическим имплантам их можно будет принимать в наши ряды. Увеличение нашего числа — это достойная задача, но для дефектных единиц понадобятся персонализированные импланты, решающие проблемы конкретного тела. Улей будет разрастаться быстрее, но станет менее... идеальным."
 cyber.2220.a: "Чем больше, тем лучше."
 cyber.2220.b: "Неидеальный улей — слабый улей."

 cyber.2260.name: "Одна невидимая проблема"
 cyber.2260.desc: "У небольшого процента подопытных проявляются нежелательные реакции на аугментации. Их тела отторгают импланты, что приводит к смертельно опасным побочным эффектам. Похоже, причиной этой проблемы является ранее неизвестный генетический дефект. Согласно предварительным расчётам, он затрагивает около 5% популяции единиц .\n\nМы выяснили причину и теперь сможем отсеивать неподходящие единицы. Но что с ними делать дальше?"
 cyber.2260.a: "Отбраковывать дефективные единицы."
 cyber.2260.a.tt: "Скорость развития инцидента §Y$situation_cyberization_hive$§! на §Y1§! год: §G+20%§!\n$UNLOCKS_CYBER_STANDARDS_POLICY$"
 cyber.2260.b: "Оснащать дефективные единицы ограниченными имплантами."
 cyber.2260.b.tt: "$UNLOCKS_CYBER_STANDARDS_POLICY$"
 cyber.2260.c: "Разработать альтернативные импланты."
 cyber.2260.c.tt: "Скорость развития инцидента §Y$situation_cyberization_hive$§! на §Y5§! лет: §R-50%§!"
 UNLOCKS_CYBER_STANDARDS_POLICY: "Доступны политики §Yстандартов кибернетизации§!."

 # CYBERIZATION STAGE 3
 cyber.2300.name: "Единиц много. План один."
 cyber.2300.desc: "Наши кибернетические прототипы одобрены. §Y$building_augmentation_center$§! возведён. Наш план готов к исполнению, но логистика трансформации ещё не проработана.\n\nМы можем отправить все единицы в $building_augmentation_center$, прервав их обычный рабочий день. Это будет очень быстрый процесс, но до его завершения фабрики будут стоять пустые. Или же мы можем организовать постепенное прохождение процедур с учётом рабочих графиков и направлять единицы на кибернетизацию в их обязательные периоды отдыха, чтобы не нарушать рабочего процесса. Это будет медленнее, но не так повлияет на производительность."
 cyber.2300.shared.tt: "Скорость аугментации зависит от подхода к инциденту и количества £building£ ['building:building_augmentation_center', центров аугментаций]."
 cyber.2300.a: "Главное — кибернетизация."
 cyber.2300.a.tt: "Поселения, проходящие кибернетизацию, в месяц: §G+200§!\nЕжемесячный прирост ресурсов: §R-5%§!\n\n$cyber.2300.shared.tt$"
 cyber.2300.b: "Наш порядок нарушать нельзя."
 cyber.2300.b.tt: "Поселения, проходящие кибернетизацию, в месяц: §R-100§!\n$unity$ ежемесячно: §G+5%§!\n\n$cyber.2300.shared.tt$"

 cyber.2320.name: "Многие боятся единого"
 cyber.2320.desc: "Государства разобщённых существ смотрят на нас с недоверием: их пугает наше единство. Кибернетические импланты позволят нам конструировать для наших дипломатов индивидуальные лица и характеры, чтобы мы не казались нашим партнёрам такими одинаковыми.\n\nРазобщённым это наверняка понравится. Быть может, они даже попробуют нас... понять. Воспримут нас равными себе."
 cyber.2320.a: "Отвратительно."
 cyber.2320.b: "Терпимая уступка."
 cyber.2320.b.tt: "Улучшает отношение к нам со стороны государств, не являющихся гештальт-сознанием."
 cyber.2320.c: "Сделаем наших дипломатов ещё более идентичными — пусть боятся."
 cyber.2320.c.tt: "Ухудшает отношение к нам со стороны государств, не являющихся гештальт-сознанием."

 cyber.2360.name: "Население одно, групп две"
 cyber.2360.desc: "Кибернетизация нашего улья идёт полным ходом. Часть населения уже носит кибернетические импланты, часть же до сих пор биологически чиста. Никогда раньше мы не сталкивались со столь заметными различиями одних единиц с другими. Теперь единицы могут ассоциировать себя с той или иной группой, и этот раскол усугубляет их чувство индивидуальности.\n\nНекоторые единицы начали украшать себя побрякушками или рисовать символы на своих имплантах, чтобы различать друг друга. Ситуация интересная, но пугающая."
 cyber.2360.a: "Поощрить эту тенденцию."
 cyber.2360.b: "Запретить личные идентификаторы."
 cyber.2360.c: "Личные символы — только для лидеров."

 # CYBERIZATION STAGE 4
 cyber.2400.name: "Мыслей много. Мозг один."
 cyber.2400.desc: "Вживление нейроимплантов нашим единицам дало неожиданный результат: теперь их частично кибернетические мозги стали формировать индивидуальные мысли отдельно от общего сознания.\n\nМы можем развить эту технологию и улучшить способность единиц к автономному мышлению."
 cyber.2400.a: "Пусть единицы думают сами."
 cyber.2400.b: "Индивидуальность — это угроза для нашего единства."

 cyber.2420.name: "Все там будем"
 cyber.2420.desc: "Кибернетические импланты усложняют логистику смерти.\n\nИзвлечение имплантов из тел умерших единиц позволит нам использовать их заново и снизить затраты на изготовление новых изделий. Но для этого придётся перестроить процессы переработки, и затрат это потребует значительных."
 cyber.2420.a: "Повторно использовать импланты."
 cyber.2420.b: "Оно того не стоит."
 cyber.2420.c: "Пустить в дело импланты... и тела."

 cyber.2460.name: "Импланты на всю жизнь"
 cyber.2460.desc: "Наше население уверенными темпами проходит кибернетизацию, но нам нужно организовать процесс и для тех, кто ещё не родился.\n\nНаша технология позволяет сделать так, чтобы [owner.Species.GetSpawnNamePlural] получали импланты ещё до рождения. Это простое, быстрое и эффективное решение сделает нас истинно кибернетической расой. С другой стороны, по данным некоторых исследований, вживление имплантов в раннем возрасте может приводить к нервным расстройствам, психозам, судорогам и самым разным нарушениям развития."
 cyber.2460.a: "Металл крепче [Owner.Species.GetFleshTypeCyberCreed&gen]."
 cyber.2460.b: "Установить минимальный возраст для кибернетизации."

 # CYBERIZATION FINISHED
 cyber.2004.name: "Единиц много. Воля одна?"
 cyber.2004.desc: "Трансформация завершена. Кибернетические импланты протестированы, отлажены, доведены до ума и вживлены в наши тела, которые теперь можно считать идеальными."
 cyber.2004.desc.volitional: "$cyber.2004.desc$\n\nНаши единицы теперь способны к самостоятельному мышлению. Большая степень свободы сулит нам новые возможности."
 cyber.2004.desc.integrated: "$cyber.2004.desc$\n\nНаши единицы теперь ещё более едины, чем раньше: наши умы связаны единой металлической цепью."
 cyber.2004.desc.neutral: "$cyber.2004.desc$\n\nВ ходе этого процесса мы увидели возможность изменить себя. В единстве наша сила, но свои преимущества есть и у более автономных единиц."
 cyber.2004.end: "Наши тела стали иными, и вместе с ними будет меняться и наш коллективный разум."
 cyber.2004.a: "Стать своевольным ульем."
 cyber.2004.a.tt: "$change_auth_tt$ ['concept_auth_cyber_hive_volitional']\n$unlock_edict_tt$ ['concept_edict_hive_mind_outreach']\n$cyber.21.a.end$"
 cyber.2004.b: "Стать интегрированным ульем."
 cyber.2004.b.tt: "$change_auth_tt$ ['concept_auth_cyber_hive_integrated']\n$unlock_edict_tt$ ['concept_edict_hive_hyper_stimulants']\n$cyber.21.a.end$"
 cyber.2004.c: "Нам нет нужды меняться."
 cyber.2004.c.tt: "$cyber.21.a.end$\n$keep_auth_tt$ ['concept_auth_hive_mind_tt']"

 ### Driven Assimilator Cyberization ###
 cyber.2010.name: "Явная цель"
 cyber.2010.desc: "С развитием современной кибернетики мы наконец можем раскрыть наш полный потенциал. Всё, чего мы добились раньше, было лишь только началом.\n\nРасширение наших знаний и развитие технологий несомненно изменят наше общество. Наша судьба это полная ассимиляция всей разумной жизни.\n\nСопротивление бессмысленно. Все умы галактики будут принадлежать нам."
 cyber.2015.name: "Продвинутые ассимиляторы"
 cyber.2015.desc: "Улучшенное за счёт технологии, наше органическое население почти достигло идеала. Пришло время внедрить новейшие достижения кибернетики в саму ткань нашей цивилизации.\n\nОптимизация умственных процессов наших киборгов позволит нам сформировать «совокупность памятей» и направить их общий опыт на улучшение логистики. Или же мы можем сохранить вариативность мыслей и эмоций в составе «нейрохора».\n\nКаждый из этих вариантов коренным образом повлияет на дальнейшее развитие нашего общества."
 cyber.2015.a: "Агрегировать наши умы."
 cyber.2015.a.tt: "$change_auth_tt$ ['concept_auth_memory_aggregator']\n\nПроизводство §Yресурсов§! от ассимиляции £pop£ §Hорганических поселений§! вновь увеличено\n\n$unlock_edict_tt$['concept_edict_aggregated_memory']"
 cyber.2015.b: "Дать голос хору."
 cyber.2015.b.tt: "$change_auth_tt$ ['concept_auth_neural_chorus']\n\n$unlock_edict_tt$['concept_edict_choral_harmony']"
 cyber.2015.c: "Мы не станем меняться."
 cyber.2015.c.tt: "$keep_auth_tt$ ['concept_auth_machine_intelligence_tt']"
 gov_memory_aggregator: "Агрегатор памяти"
 gov_memory_aggregator_desc: "Оптимизация умственных способностей ассимилированного населения приводит к формированию «совокупности памятей», которую можно использовать для радикального совершенствования всех административных и логистических задач."
 auth_memory_aggregator: "Агрегатор памяти"
 auth_memory_aggregator_desc: "$gov_memory_aggregator_desc$"
 auth_memory_aggregator_tt: "Производство ресурсов от ассимиляции £pop£ §Hорганических поселений§! вновь увеличено"
 gov_neural_chorus: "Нейрохор"
 gov_neural_chorus_desc: "Более широкая вариативность мыслей и диапазон эмоциональных реакций позволяют создать «нейрохор» — великую симфонию умов, великую столь же, сколь и прекрасную."
 auth_neural_chorus: "Нейрохор"
 auth_neural_chorus_desc: "$gov_neural_chorus_desc$"
 auth_driven_neural_chorus_tt: "Начальный уровень лидеров-киборгов: §G+1§!\nСодержание лидеров-киборгов: §G-25%§!\n£unity£ $unity$ от поселений киборгов: §G+0.1§!"
 concept_auth_memory_aggregator: "$gov_memory_aggregator$"
 concept_auth_neural_chorus: "$gov_neural_chorus$"
 edict_aggregated_memory: "Совокупность памятей"
 edict_aggregated_memory_desc: "Памяти нашего ассимилированного населения текут единым бурным потоком. Их общий опыт стал нашим достоянием."
 edict_choral_harmony: "Хоровая гармония"
 edict_choral_harmony_desc: "Без гармонии не напишешь песни: пусть умы нашего ассимилированного населения будут едины."
 concept_edict_aggregated_memory: "$edict_aggregated_memory$"
 concept_edict_choral_harmony: "$edict_choral_harmony$"
