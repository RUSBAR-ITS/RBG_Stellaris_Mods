 # Cyber Oligarchic Individualist
 auth_cyber_oligarchic_individualist: "Разгон вычислений ради олигархов"
 auth_cyber_oligarchic_individualist_desc: "Биочипы специалистов удалённо проходят процедуру разгона — это увеличивает производительность и позволяет правящему классу уделять больше времени политике и отдыху."
