 auth_cyber_democratic_individualist: "Демократический параллелизм"
 auth_cyber_democratic_individualist_desc: "Высокотехнологичные протоколы систем нейрозащиты позволяют гражданам непосредственно голосовать за те или иные политические решения в реальном времени.\n\nВ этом демократическом государстве проводятся регулярные выборы, на которых все граждане путём голосования выбирают себе представителя."
