 cyber_reformed_implant_taxes_tt: "Энергокредиты ежемесячно: §G+10%§!"
 cyber_market_standards: "Стандарты на рынке имплантов"
 cyber_market_standards_desc: "На производителей низкокачественных имплантов, не соответствующих стандартам, заводят уголовные дела."
 cyber_implant_weapons: "Оружейные импланты"
 cyber_implant_weapons_desc: "Гражданам разрешено вживлять себе оружейные импланты."
 cyber_implants_dismantled: "Разборка опасных имплантов"
 cyber_implants_dismantled_desc: "Правительство конфискует у населения импланты, созданные для причинения вреда другим, в целях переработки их на что-то менее опасное."
 cyber_implant_hacks: "Взломы имплантов"
 cyber_implant_hacks_desc: "Хакеры, у которых есть исходный код, отвечающий за основные контрольные функции имплантов, могут получать доступ к чужим имплантам... и управлять ими."
 cyber_counter_hacking: "Противодействие взлому имплантов"
 cyber_counter_hacking_desc: "С помощью наших коммуникационных сетей специалисты отслеживают несанкционированные взломы имплантов."
 cyber_protests: "Протесты против задержки имплантов"
 cyber_protests_desc: "Население, привыкшее к бесперебойным поставкам новых аугментаций, протестует против недавних товарных задержек."
 cyber_stop_protests: "Разгон протестующих"
 cyber_stop_protests_desc: "Стражи правопорядка разгоняют демонстрантов, протестующих против задержек поставок имплантов."

 # Policies
 policy_cyberization_standards: "Стандарты кибернетизации"
 policy_cyberization_standards_desc: "Массовое вживление имплантов необходимо для нормального функционирования общества, однако противники полной кибернетизации могут пройти лишь частичный курс."
 cyberization_standards_full_name: "Полная кибернетизация"
 cyberization_standards_full: "$cyberization_standards_full_name$"
 cyberization_standards_full_effect: "Кибернетическая черта лидеров-спиритуалистов: §Y$leader_trait_cyborg$§!\n$mod_cyborg_pop_bonus_workforce_mult$ распространяется на кибернетические поселения спиритуалистов"
 cyberization_standards_full_desc: "Долг каждого гражданина — пройти процедуру установки полного набора кибернетических имплантов.\n\n$cyberization_standards_full_effect$"
 cyberization_standards_limited_name: "Ограниченная кибернетизация"
 cyberization_standards_limited: "$cyberization_standards_limited_name$"
 cyberization_standards_limited_effect: "Кибернетическая черта лидеров-спиритуалистов: §Y$leader_trait_limited_cyborg$§!\n§R$mod_cyborg_pop_bonus_workforce_mult$ не распространяется на кибернетические поселения спиритуалистов§!"
 cyberization_standards_limited_desc: "Противники полной аугментации могут установить себе ограниченный набор имплантов.\n\n$cyberization_standards_limited_effect$"

 cyberization_standards_full_hive_name: "$cyberization_standards_full_name$"
 cyberization_standards_full_hive: "$cyberization_standards_full$"
 cyberization_standards_full_hive_effect: "§Y$mod_cyborg_pop_bonus_workforce_mult$§! распространяется на кибернетические единицы, однако они получают §R-5%§! к скорости прироста поселений."
 cyberization_standards_full_hive_desc: "Убой единиц, в телах которых есть кибернетические импланты, это необходимая жертва ради повышения эффективности.\n\n$cyberization_standards_full_hive_effect$"
 cyberization_standards_limited_hive_name: "$cyberization_standards_limited_name$"
 cyberization_standards_limited_hive: "$cyberization_standards_limited$"
 cyberization_standards_limited_hive_effect: "$MOD_POP_BONUS_WORKFORCE_MULT$ кибернетических единиц: §R-5%§!"
 cyberization_standards_limited_hive_desc: "Неисправные единицы, оборудованные примитивными имплантами, смогут и дальше приносить пользу.\n\n$cyberization_standards_limited_hive_effect$"

 # CYBERIZATION STAGE 1
 cyber.100.name: "Контроль над будущим" #Stage 1 - Start event
 cyber.100.desc.shared: "Последние достижения в области кибернетических имплантов прокладывают путь к полной перестройке общества. Тогда мы сможем избавиться от слабости биологических тел. Мы будем умнее, быстрее, сильнее."
 cyber.100.desc.shared_unplugged: "Последние достижения в области кибернетических имплантов прокладывают путь к полной перестройке общества — исключительно на наших условиях. Тогда мы сможем избавиться от слабости биологических тел и изъянов аугментаций. Мы будем умнее, сильнее, быстрее."
 cyber.100.desc: "$cyber.100.desc.shared$\n\nКорпорации наперебой выдвигают деловые предложения и прогнозируют продажи, а чиновники, напротив, выступают за доступность этой перспективной технологии с гарантией государства."
 cyber.100.desc.unplugged: "$cyber.100.desc.shared_unplugged$\n\nКорпорации наперебой выдвигают деловые предложения и прогнозируют продажи, а чиновники, напротив, выступают за доступность этой перспективной технологии с гарантией государства."
 cyber.100.desc.megacorp: "$cyber.100.desc.shared$\n\nСубподрядчики наперебой выдвигают деловые предложения и прогнозируют продажи изделий сторонних производителей, а совет директоров, напротив, выступает за сохранение нашей монополии на эту важную технологию."
 cyber.100.desc.megacorp_unplugged: "$cyber.100.desc.shared_unplugged$\n\nСубподрядчики наперебой выдвигают деловые предложения и прогнозируют продажи изделий сторонних производителей, а совет директоров, напротив, выступает за сохранение нашей монополии на эту важную технологию."
 cyber.100.a: "Мы национализируем аугментационную промышленность."
 cyber.100.a.megacorp: "Оставить собственное производство."
 cyber.100.a.tt: "$situation_cyberization_triggered_modifier$$cyber_control_government_effects$"
 cyber.100.b: "Мы приватизируем распространение."
 cyber.100.b.megacorp: "Передать эту задачу нашим филиалам."
 cyber.100.b.tt: "$situation_cyberization_triggered_modifier$$cyber_control_corporate_effects$"

 cyber.105.name: "От народа и для народа"
 cyber.105.desc: "Любители вживлять себе модификации негодуют: среднестатистический обыватель сможет позволить себе лишь малую часть разрабатываемых нами имплантов.\n\nОни утверждают, что необходимо обнародовать документацию и ослабить экологические ограничения — и тогда почти любой сможет производить и чинить импланты у себя дома."
 cyber.105.desc.megacorp: "Независимые подрядчики жалуются на недоступность многих разрабатываемых нами имплантов.\n\nОни утверждают, что необходимо открыть доступ к документации и ослабить патентные требования к производству — и тогда можно будет заняться улучшением сборки имплантов."
 cyber.105.a: "Требования написаны не просто так."
 cyber.105.a.megacorp: "Это наша интеллектуальная собственность."
 cyber.105.a.tt: "Модификатор инцидента §Y$situation_cyberization$§! не изменился."
 cyber.105.b: "Либерализовать эту отрасль."
 cyber.105.b.crafters: "Пусть народ собирает что захочет."
 cyber.105.b.megacorp: "Опубликовать схемы для широкой общественности."
 cyber.105.b.gov.tt: "Обновлён модификатор инцидента §Y$situation_cyberization$§!:\n§GДобавлено:§! $cyber_control_independent_effects$\n§RУбрано:§! $cyber_control_government_effects$"
 cyber.105.b.cor.tt: "Обновлён модификатор инцидента §Y$situation_cyberization$§!:\n§GДобавлено:§! $cyber_control_independent_effects$\n§RУбрано:§! $cyber_control_corporate_effects$"

 # Stage 1 Opportunities - Research
 cyber.120.name: "Умственная разгрузка"
 cyber.120.desc: "Научная группа выдвинула инновационное предложение: встроить в мобильные устройства наблюдательное ПО на основе ИИ. Позднее эту программу можно будет внедрить непосредственно в кибернетические импланты.\n\nТакое ПО будет отводить внимание носителей от бессмысленных задач и направлять его на продуктивную интеллектуальную деятельность. Конечно, граждане утратят какую-то долю самостоятельности, однако такая беспрецедентная возможность сделать население в разы продуктивнее выпадает не каждый день."
 cyber.120.a: "Ресурсы от превыше всего."
 cyber.120.a.spiritual: "Это настоящее благо."
 cyber.120.b: "Утрата самостоятельности — это перебор."
 cyber.120.b.spiritual: "Никакие соблазны не собьют нас со святого пути."
 cyber.120.c: "Приемлемо. Но нужен переключатель «вкл./выкл»."
 cyber.120.d: "Мы получим почти безграничную власть..."

 # Stage 1 Challenges - Research
 cyber.160.name: "Кибердиссоциация"
 cyber.160.desc: "Взгляды населения в последнее время прикованы к экранам. в эфир вышла новая драма.\n\nЕё действие разворачивается в мире, где кибернетические импланты — не роскошь, а привычный предмет обихода. Главный герой — аугментированный рабочий, страдающий от диссоциации с частично механическим телом. В трагической концовке многие зрители усмотрели едва завуалированную критику полной кибернетизации и неизбежно следующего за ней стирания [Owner.Species.GetAdj&fem,gen] личности.\n\nНастроения, порождённые просмотром телехита, быстро обернулись протестами против нашей программы. После выхода драмы в эфир количество добровольцев для испытаний имплантов упало на 60%."
 cyber.160.a: "Попробовать сформировать другое общественное мнение."
 cyber.160.b: "Ужесточить нормы в отношении имплантов."
 cyber.160.c: "Скоро это пройдёт."
 cyber.160.d: "Подвергнуть драму цензуре."
 cyber.160.e: "Запретить всё освещение в печати."

 # CYBERIZATION STAGE 2
 cyber.200.name: "Центры аугментаций"
 cyber.200.desc.gov: "Политическое противостояние вылилось в разделение ответственности за производство кибернетических улучшений: каждое государственное ведомство отвечает за определённый пункт этой программы. Мы предполагаем, что такая система, где каждому достанется своя доля, позволит участникам контролировать друг друга.\n\nОднако нужно не только рассуждать, но и действовать. Учёные утверждают, что для работы им нужен хотя бы один $building_augmentation_center$."
 cyber.200.desc.cor: "Ещё немного, и сбудутся самые смелые наши мечты. И сделать их реальностью нам помогут многочисленные корпорации в нашем государстве. Активно развивающаяся, конкурентная кибернетическая индустрия позволит нам получать новейшие продукты в кратчайшие сроки.\n\nОднако эти планы не станут реальностью сами собой. Учёным требуется хотя бы один $building_upload_center$, который станет средоточием инноваций в отрасли."
 cyber.200.desc.ind: "Наша глобальная сеть разрывается от потока сумасшедших идей: нейросинаптические аугментации, кибернетические вкусовые рецепторы... Реализовать всё это будет очень трудно и дорого, но некоторые концепции показались нам многообещающими.\n\nОднако нужно не только рассуждать, но и действовать. Сетевое сообщество утверждает, что для работы ему нужен хотя бы один $building_augmentation_center$."
 cyber.200.a.gov: "Дать разрешение на строительство."
 cyber.200.a.cor: "Одобрено."
 cyber.200.a.ind: "Согласовано."
 cyber.200.a.tt: "§RНеобходимо действие:§!\nПостройте £building£ ['building:building_augmentation_center'], чтобы продолжить инцидент §Y$situation_cyberization$§!."

 cyber.205.name: "Пробные проекты" # Stage 2 - Start event
 cyber.205.desc.shared: "Пора запускать более широкомасштабные пробные проекты. Сделать это можно будет только на планетах, где есть $building_augmentation_center$. Сами же проекты потребуют постоянной поддержки, однако почерпнутые нами знания мгновенно отразятся на продуктивности."
 cyber.205.desc.gov: "Маломасштабные испытания, проведённые исследовательскими группами за счёт правительственного бюджета, подтвердили повышение продуктивности после установки механических имплантов.\n\n$cyber.205.desc.shared$"
 cyber.205.desc.cor: "Маломасштабные испытания, проведённые на добровольцах из целевой группы, подтвердили повышение продуктивности после установки механических имплантов.\n\n$cyber.205.desc.shared$"
 cyber.205.desc.ind: "Энтузиасты, которые самостоятельно вживили себе механические импланты, подтвердили повышение продуктивности.\n\n$cyber.205.desc.shared$"
 cyber.205.a: "Улучшить $pop_cat_ruler_plural_acc$."
 cyber.205.a.tt: "£building£ ['building:building_augmentation_center',$building_augmentation_center_plural$] теперь дают:\n$t$- $mod_cyborg_ruler_bonus_workforce_mult$: §G+$@cyber_focus_ruler_workforce|0%$§!"
 cyber.205.b: "Улучшить $pop_cat_specialist_plural_gen$."
 cyber.205.b.tt: "£building£ ['building:building_augmentation_center',$building_augmentation_center_plural$] теперь дают:\n$t$- $mod_cyborg_specialist_bonus_workforce_mult$: §G+$@cyber_focus_specialist_workforce|1%$§!"
 cyber.205.c: "Улучшить $pop_cat_worker_plural_gen$."
 cyber.205.c.tt: "£building£ ['building:building_augmentation_center',$building_augmentation_center_plural$] теперь дают:\n$t$- $mod_cyborg_worker_bonus_workforce_mult$: §G+$@cyber_focus_worker_workforce|0%$§!"
 cyber.205.d: "Улучшить всех."
 cyber.205.d.tt: "£building£ ['building:building_augmentation_center',$building_augmentation_center_plural$] теперь дают:\n$t$- $mod_cyborg_pop_bonus_workforce_mult$: §G+$@cyber_focus_everyone_workforce|0%$§!"

 cyber.210.name: "Параллельное развитие"
 cyber.210.desc.gov.rival: "В распоряжении журналистов оказались свидетельства спонсированных правительством экспериментов по отслеживанию мыслей с помощью микрочипов. Если вживить подобное устройство в мозг, правительству станут досконально известны не только конфиденциальные данные, но и особенности личности."
 cyber.210.desc.cor.rival: "Представленные в суде доказательства, касающиеся разногласий вокруг товарного знака, пролили свет на проведение корпорациями экспериментов с имплантами дополненной реальности. Согласно чертежам, имплант крепится непосредственно к глазному нерву пользователя. В документации описываются преимущества для владельцев, а также возможности компаний по перехвату визуальной информации."
 cyber.210.desc.ind.rival: "Отдельные любители модифицировать свои тела уже принялись заменять конечности примитивными механическими манипуляторами. Разумеется, мы не можем гарантировать безопасность таких процедур для здоровья. Кроме того, есть опасения, что нерегламентированная установка имплантов скорее навредит обществу."
 cyber.210.a: "Это нам пригодится."
 cyber.210.a.tt: "Скорость развития инцидента §Y$situation_cyberization$§! на §Y1§! год: §G+25%§!\n\n"
 cyber.210.b: "Пора это прекращать."
 cyber.210.b.tt: "Скорость развития инцидента §Y$situation_cyberization$§! на §Y1§! год: §R-25%§!"

 # Stage 2 Opportunities - Test Results and Rival Sector
 cyber.220.name: "Координация нескольких конечностей"
 cyber.220.desc: "Учёные, работающие над нейроинтерфейсами, добились значительных успехов: им удалось создать усилитель нейросигналов, который позволяет пользователям непосредственно управлять системой искусственных конечностей, хоть и с ограниченной ловкостью. Впоследствии мы сможем внедрить этот интерфейс прямо в кибермозг и уйти от необходимости внешних устройств.\n\nВо время первоначальных экспериментов испытуемые продемонстрировали возросшую ловкость и мелкую моторику, а также повышенную боеспособность. Однако затраты на производство этих имплантов таковы, что массовое внедрение пока невозможно. Надо определиться, кто получит новую технологию первым."
 cyber.220.a: "Нашим учёным пригодятся лишние [owner.species.GetHandNamePlural]."
 cyber.220.b: "Начать укреплять армию."
 cyber.220.c: "Сначала протянем руку помощи инвалидам."
 cyber.220.d: "Никакой благотворительности! Продадим их тому, кто больше заплатит."
 cyber.220.e: "Пусть будет крепок кулак рабочего класса!"
 cyber.220.f: "Новые руки — только в руки элит."

 # Stage 2 Challenges - Test Results and Rival Sector
 cyber.260.name: "В три погибели"
 cyber.260.desc: "Пробная серия испытаний позвоночного модуля окончилось катастрофой: имплант подавал избыточное усилие на приводы и привёл к повреждению спинного мозга у нескольких испытуемых.\n\nШокирующие снимки страшных последствий мгновенно стали достоянием общественности. Количество желающих поучаствовать в испытаниях резко сократилось."
 cyber.260.a: "Приостановить все эксперименты до выработки решения."
 cyber.260.a.tt: "Скорость развития инцидента §Y$situation_cyberization$§! на §Y6§! месяцев: §R-50%§!"
 cyber.260.b: "Выплатить компенсации семьям пострадавшим."
 cyber.260.c: "Найти других добровольцев. Если понадобится — назначить."

 # CYBERIZATION STAGE 3
 cyber.300.name: "Внедрение" # Stage 3 - Start event
 cyber.300.desc: "На каждой планете, в каждом крупном городе мы создали значительные запасы механических имплантов. $job_augmentor_plural$, разработавшие эти устройства, утверждают, что ещё немного — и [Owner.Species.GetName] смогут позабыть про прежние ограничения биологических тел.\n\nНастало время сбросить груз прошлого и сделать шаг к кибернетическому будущему."
 cyber.300.a: "Начать кибернетизацию."
 cyber.300.a.tt: "Лидеры получают черту §Y$leader_trait_cyborg$§!\nПоселения получают признак ['trait:trait_cybernetic']\n\nСкорость аугментации зависит от подхода к инциденту и количества £building£ ['building:building_augmentation_center', центров аугментаций]."

 cyber.305.name: "Противники кибернетики" # Spiritualists are Cybernetic Objectors
 cyber.305.desc.shared: "У них нет даже простейших имплантов, поэтому им сложно существовать в обществе, с каждым днём всё более зависимом от технологий.\n\nЕсли мы обяжем всех жителей проходить установку полного комплекта имплантов, этим кибернетическим «дикарям» станет проще интегрироваться в общество, но эта мера вне сомнения вызовет у них отторжение."
 cyber.305.desc: "Религиозные секты, противящиеся союзу [Owner.Species.GetFleshTypeCyberCreed&gen] и машины, отказались проходить кибернетизацию. $cyber.305.desc.shared$"
 cyber.305.desc.spiritualist: "Верующие, конечно, противятся союзу [Owner.Species.GetFleshTypeCyberCreed&gen] и машины, поэтому отказались проходить кибернетизацию. $cyber.305.desc.shared$"
 cyber.305.desc.none: "Этическая сторона союза [Owner.Species.GetFleshTypeCyberCreed&gen] и машины не даёт покоя нашему обществу уже не первый год. Увы, импланты повышают эффективность своих хозяев, поэтому те, кто отказывается от кибернетизации, потенциально оказываются в уязвимом положении.\n\nЕсли мы обяжем всех жителей проходить установку имплантов, мы обеспечим равенство возможностей, но эта мера вне сомнения вызовет у противников отторжение."
 cyber.305.desc.unplugged: "Этическая сторона повторного объединения [Owner.Species.GetFleshTypeCyberCreed&gen] и машины не даёт покоя нашему обществу уже не первый год. Однако разработанные нами импланты больше не зависят от капризов ассимилировавших нас машин, а потому эффективность их крайне велика. Те, кто отказывается от их установки, потенциально оказываются в уязвимом положении.\n\nЕсли мы обяжем всех жителей проходить установку имплантов, мы обеспечим равенство возможностей, но такой подход, вне сомнения, возмутит противников кибернетизации."
 cyber.305.a: "Пускай привыкают."
 cyber.305.a.materialist: "Вера — пережиток прошлого. Мы смотрим в будущее."
 cyber.305.a.spiritualist: "Вера должна соответствовать временам."
 cyber.305.a.tt: "$cyberization_standards_full_effect$\n\nДоступна политика §Y$policy_cyberization_standards$§!\n"
 cyber.305.b: "Мы пойдём на компромисс."
 cyber.305.b.spiritualist: "Мы придём к взаимопониманию."
 cyber.305.b.tt: "$cyberization_standards_limited_effect$\n\nДоступна политика §Y$policy_cyberization_standards$§!\n"

 # Stage 3 Opportunities - Treatment of Non-Cyborgs
 cyber.320.name: "Потенциал детей"
 cyber.320.birth.desc: "Открытый недавно способ вживлять импланты новорождённым неожиданно привёл нас в тупик. С одной стороны, неонатальные импланты способны коренным образом изменить наши отношения с наукой: раскрыв врождённый кибернетический потенциал с ранних лет, мы вознесёмся на невообразимые высоты развития.$cyber.320.end.desc$"
 cyber.320.metamorphosis.desc: "Недавно наши учёные добились невероятных успехов, научившись вживлять микрочипы молодым особям. Во время метаморфоза наши личинки естественным образом поглощают механические системы. С одной стороны, внедрение аугментаций на стадии куколки позволит полностью раскрыть кибернетический потенциал и вознести нас на невообразимые высоты развития.$cyber.320.end.desc$"
 cyber.320.lithoid.desc: "Открытый недавно способ вживлять импланты едва кристаллизовавшемуся потомству неожиданно привёл нас в тупик. С одной стороны, после внедрения аугментаций молодые особи смогут образовывать естественные связи с металлическими минералами, а значит — раскрывать свой кибернетический потенциал, что вознесёт нас на невообразимые высоты развития.$cyber.320.end.desc$"
 cyber.320.root.desc: "Открытый недавно способ вживлять импланты молодым росткам неожиданно привёл нас в тупик. С одной стороны, после внедрения аугментаций новые особи смогут передавать электрические импульсы посредством усложнённой структуры гифов, а значит — раскрывать свой кибернетический потенциал, что вознесёт нас на невообразимые высоты развития.$cyber.320.end.desc$"
 cyber.320.egg.desc: "Открытый недавно способ вживлять импланты едва вылупившемуся потомству неожиданно привёл нас в тупик. С одной стороны, импланты способны коренным образом изменить их отношения с наукой: раскрыв врождённый кибернетический потенциал с ранних лет, мы вознесёмся на невообразимые высоты развития.$cyber.320.end.desc$"
 cyber.320.other.desc: "Открытый недавно способ вживлять кибернетические импланты новорождённым привёл нас в тупик. С одной стороны, неонатальные импланты способны коренным образом изменить наши отношения с наукой: раскрыв врождённый кибернетический потенциал с ранних лет, мы вознесёмся на невообразимые высоты развития.$cyber.320.end.desc$"
 cyber.320.end.desc: "\n\nС другой стороны, появление уже в детстве зависимости от кибернетических аугментаций грозит неприятными последствиями: в долгосрочной перспективе наш вид может оказаться неспособен выживать в пока ещё родных телах."
 cyber.320.a: "Таков естественный ход эволюции."
 cyber.320.b: "Не стоит лишать потомство нормального детства."

 # Stage 3 Challenges - Treatment of Non-Cyborgs
 cyber.360.name: "Проблемы превращения"
 cyber.360.desc: "В последнее время всё громче раздаются голоса жалеющих о решении пройти курс экспериментальной модификации тела. После замены ствола головного мозга на механические детали испытуемые впали в экзистенциальный ужас. Некоторые даже утверждают, что их жизнь после операции превратилась в бесконечную череду страданий.\n\nПострадавшие требуют выплатить им компенсации и спрашивают, готово ли государство взять на себя ответственность. Нам придётся дать им ответ."
 cyber.360.a: "Запретить столь экстремальные модификации."
 cyber.360.a.tt: "Скорость развития инцидента §Y$situation_cyberization$§! на §Y6§! месяцев: §R-50%§!"
 cyber.360.b: "Принести пострадавших в жертву, облегчив тем самым их участь."
 cyber.360.c: "Выделить им более сильные болеутоляющие."
 cyber.360.d: "Начать набирать испытуемых из опустившихся на дно общества."
 cyber.360.e: "Мы не несём никакой ответственности."

 # CYBERIZATION STAGE 4
 cyber.405.name: "Налоги на импланты" # Government rival
 cyber.405.desc: "Местные чиновники изо всех сил стараются поспеть за стремительно развивающейся аугментационной отраслью: их соблазняют огромная прибыль и отсутствие строгого законодательства. Немалым налогом облагается каждый этап производства — от добычи ресурсов до вживления самого импланта.\n\nИзлишняя волокита и дополнительные траты замедляют процесс полной кибернетизации."
 cyber.405.a: "Оставить налоги."
 cyber.405.b: "Отменить налоги."
 cyber.405.b.tt: "Скорость развития инцидента §Y$situation_cyberization$§!: §G+25%§!\n\n"
 cyber.405.c: "Пересмотреть налоги на аугментацию."
 cyber.405.c.tt: "Скорость развития инцидента §Y$situation_cyberization$§! на §Y1§! год: §R-10%§!"

 cyber.410.name: "Судебная война" # Government rival escalation
 cyber.410.desc: "Чтобы хоть немного усмирить пыл публики, бросившейся раскупать киберимпланты, наши законодатели старательно изобретают всё новые ограничения в области аугментации.\n\nПоследний законопроект, проводимый под лозунгами борьбы с «одержимостью» и сохранения памяти о том, кто такие [Owner.Species.GetName], устанавливает максимально допустимое содержание имплантов в теле. После превышения определённого процента владелец аугментаций больше не имеет права на защиту со стороны закона. Ведь ещё немного — и мы забудем, что мы не машины, а [Owner.Species.GetName]."
 cyber.410.a: "Не принимать законопроект."
 cyber.410.a.tt: "Скорость развития инцидента §Y$situation_cyberization$§! на §Y1§! год: §G+25%§!"
 cyber.410.b: "Найти компромисс."
 cyber.410.b.tt: "Скорость развития инцидента §Y$situation_cyberization$§! на §Y1§! год: §R-25%§!"

 cyber.415.name: "Никаких гарантий" # Corporate rival
 cyber.415.desc: "В погоне за лёгкой прибылью недобросовестные производители наводнили рынок аугментаций дешёвыми низкокачественными имплантами. Продающие их компании даже не оказывают пользователям поддержку, когда эти устройства в итоге ломаются.\n\nОсобенно большой резонанс возник после сбоя сердечного модулятора, произошедшего прямо во время концерта известного исполнителя. Владелец импланта — сам исполнитель — покинул этот мир «с огоньком»."
 cyber.415.a: "Рынок сам всё решит."
 cyber.415.a_industrial: "Всё как всегда."
 cyber.415.a.tt: "Скорость развития инцидента §Y$situation_cyberization$§!: §G+25%§!"
 cyber.415.b: "Здоровье потребителей превыше всего."
 cyber.415.c: "Наказать самых злостных нарушителей."
 cyber.415.c.tt: "Скорость развития инцидента §Y$situation_cyberization$§!: §R-25%§!"

 cyber.420.name: "Умышленно опасно" # Corporate rival escalation
 cyber.420.desc: "В последнее время на рынке появился новый, весьма сомнительный тип кибернетических имплантов, направленный исключительно на причинение вреда другим. На улицы хлынула волна распылителей токсинов, наноудавок и мозговых глушилок.\n\nПользователи утверждают, что такие импланты предназначены исключительно для самозащиты. Другие заявляют, что эти разработки не сулят ничего хорошего."
 cyber.420.a: "Пусть вооружаются."
 cyber.420.b: "Это слишком опасно."
 cyber.420.b.tt: "Скорость развития инцидента §Y$situation_cyberization$§!: §R-25%§!"
 cyber.420.b_pacifist: "Все подобные импланты нужно разобрать."
 cyber.420.b.tt_pacifist: "Пустить материалы на создание чего-нибудь более... полезного.\n\n"

 cyber.425.name: "Взлом управляющего ПО" # Independent rival
 cyber.425.desc: "В результате совместной атаки несколько хакерских групп завладели базовым ПО, без которого невозможна работа киберимплантов. Преступники угрожают опубликовать код, если мы не выполним их требования.\n\nПока что мы не сомневаемся, что это не просто угроза. Если код станет общедоступным, нам придётся переписать его. Такая долгая задержка нанесёт ощутимый удар по программе аугментации."
 cyber.425.a: "Заплатить им."
 cyber.425.b: "Переписать ПО."
 cyber.425.b.tt: "Скорость развития инцидента §Y$situation_cyberization$§! на §Y1§! год: §R-25%§!"
 cyber.425.c: "Пусть только попробуют."
 cyber.425.c.tt: "Хорошо, что лучшие хакеры работают на нас."

 cyber.430.name: "Малонадёжная аугментация" # Independent rival escalation
 cyber.430.desc.demands: "Выплата огромной суммы вымогателям, ответственным за взлом систем безопасности, не спасла нас от катастрофических последствий. Прошлой ночью весь исходный код, украденный из базы, оказался опубликован в глобальной сети. Перед утечкой хакеры высмеяли наше бессилие, опубликовав непристойное изображение.\n\nНародная обида не заставила себя ждать. Многие уже сожалеют о вживлении киберимплантов."
 cyber.430.desc.protest: "Переписывание управляющего ПО отняло немало времени и сил, а также замедлило производство.\n\nЗависимость населения от новейших имплантов стала только сильнее. Многие вышли на улицы, протестуя против задержки поставок."
 cyber.430.a: "Скоро выйдут новые модели."
 cyber.430.b: "Игнорировать их."
 cyber.430.c.demands: "Взломать злоумышленников в ответ."
 cyber.430.c.protest: "Разогнать протестующих."

 cyber.21.name: "Аугментированное население" # Situation 1 - Last event
 cyber.21.desc: "Сегодняшний день станет поворотным моментом для нашего общества. Теперь мы можем улучшать свои тела полностью интегрированными механическими модулями.\n\nПуть был долог и тернист, а преображение проходило не безболезненно. Но мы не станем горевать по утратам, поскольку сегодня нам открылся целый мир новых возможностей."
 cyber.21.a: "Мы станем сильнее."
 cyber.21.a.start: "Добавлен модификатор §Y$building_augmentation_center$§!:\n$t$"
 cyber.21.a.end: "Доступны все эффекты дерева традиций ['tradition_category:tradition_cybernetics']"
 cyber.21.a.gov.tt: "$cyber.21.a.start$$cyber_control_government_effects$\n$cyber.21.a.end$"
 cyber.21.a.cor.tt: "$cyber.21.a.start$$cyber_control_corporate_effects$\n$cyber.21.a.end$"
 cyber.21.a.ind.tt: "$cyber.21.a.start$$cyber_control_independent_effects$\n$cyber.21.a.end$"

 ### CYBERIZATION SITUATION END ###

