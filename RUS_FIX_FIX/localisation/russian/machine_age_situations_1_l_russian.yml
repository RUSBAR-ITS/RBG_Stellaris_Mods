 # Cyber Democratic Collectivist
 auth_cyber_democratic_collectivist: "Демократическая сопряжённость"
 auth_cyber_democratic_collectivist_desc: "Модули согласования сознаний позволяют полноценным киборгам обмениваться сенсорными данными и мыслительными паттернами. Нежелательные реакции на эмоционально заряженные блоки данных отсеиваются с помощью специального брандмауэра, защищающего пользователей от избыточной чувствительности к чужеродным переживаниям.\n\nВ этом демократическом государстве проводятся регулярные выборы, на которых все граждане путём голосования выбирают себе представителя."
 auth_cyber_democratic_collectivist_tt: "$auth_democratic_election_tt$\nНа £pop£ §Hпоселения киборгов§! не влияет уровень счастья\n£pop£ §HПоселения киборгов§! присоединяются к фракции §YЕдиной сети§!\n$unlock_edict_self_preservation_override$"
