 gov_cyber_democracy_collectivist_desc: "$auth_cyber_democratic_collectivist_desc$"
 pft_interlink: "Единая сеть"
 pft_interlink_desc: "Модули согласования сознаний позволяют полноценным киборгам обмениваться сенсорными данными и мыслительными паттернами. Нежелательные реакции на эмоционально заряженные блоки данных отсеиваются с помощью специального брандмауэра, защищающего пользователей от избыточной чувствительности к чужим переживаниям."
 interlink: "$pft_interlink$"
 INTERLINK_NO_DEMANDS: "Связь разумов"
 INTERLINK_NO_DEMANDS_DESC: "Единая сеть ничего не требует. Поселения киборгов, подключённые к Единой сети, свободно делятся своим опытом, не требуя никаких политических уступок."

