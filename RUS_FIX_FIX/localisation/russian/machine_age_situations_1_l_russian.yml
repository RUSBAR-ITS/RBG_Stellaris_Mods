 cyber_hive_no_cyber_babies: "Постепенная кибернетизация"
 cyber_hive_no_cyber_babies_desc: "Импланты устанавливаются постепенно, что снижает вред для развивающихся единиц."
 cyber_hive_no_individual_drones: "Запрет на индивидуальность"
