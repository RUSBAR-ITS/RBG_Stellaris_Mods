 auth_cyber_hive_volitional: "Своевольный улей"
 auth_cyber_hive_volitional_desc: "Каждая единица  — уникальная личность. Каждая мысль — уникальный взгляд, который стоит принять во внимание всему коллективу. Улей — нечто большее, чем просто сумма всех его бесчисленных составляющих."
