 leader_trait_expertise_military_theory: "Талант: военная теория"
 leader_trait_expertise_military_theory_desc: "После нескольких лет обучения этот лидер считается экспертом в вопросах военной теории."
 leader_trait_curator: "Куратор"
 leader_trait_curator_desc: "Этот лидер происходит из Ордена Кураторов. Его понимание технологий и методов исследования не имеет равных."
 leader_trait_curator_effect: "Увеличивает вероятность получить доступ к редким технологиям."
 leader_trait_curator_hive: "Принципы Кураторов"
 leader_trait_curator_hive_desc: "Этот узел познал фундаментальные учения Анклава Кураторов."
 leader_trait_curator_machine: "$leader_trait_curator_hive$"
 leader_trait_curator_machine_desc: "$leader_trait_curator_hive_desc$"
 leader_trait_towel: "Хранитель полотенца"
 leader_trait_towel_desc: "Полотенце имеет огромную психологическую силу."
 leader_trait_percussive_maintainer: "Силовой ремонт"
 leader_trait_percussive_maintainer_desc: "Любую проблему с техникой можно решить ударом сапога."

 # Ruler
 trait_ruler_corvette_focus: "Упор на производство корветов"
 trait_ruler_corvette_focus_desc: "Этот лидер намеревается наращивать строительство корветов."
 trait_ruler_destroyer_focus: "Упор на производство эсминцев"
