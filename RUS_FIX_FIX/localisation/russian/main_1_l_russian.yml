 TOOLTIP_SETUP_SECONDARY_SPECIES_NAME: "§H$SPECIES_NAME$§!\nВыберите название своей дополнительной расы."
 TOOLTIP_SETUP_SECONDARY_SPECIES_NAMELIST: "§H$CUSTOMIZE_NAME_LISTS$§!\nВыберите список имён для лидеров дополнительной расы."
