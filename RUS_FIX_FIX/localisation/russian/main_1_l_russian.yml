 leader_trait_carefree: "Беспечность"
 leader_trait_carefree_desc: "Возможно, этот лидер менее дотошен по сравнению с остальными."
 leader_trait_roamer: "Тяга к скитаниям"
 leader_trait_roamer_desc: "Этот лидер — прирождённый звёздный странник."
 leader_trait_archaeologist: "Археолог"
