 trait_ruler_logistic_understanding: "Понимание логистики"
 trait_ruler_logistic_understanding_desc: "Этот лидер хорошо осведомлён о важности должной организации цепочек снабжения."
 trait_ruler_military_pioneer: "Военный новатор"
 trait_ruler_military_pioneer_desc: "Этот лидер с энтузиазмом относится к достижениям в области военных технологий и кораблестроения."
 trait_ruler_warlike: "Воинственность"
 trait_ruler_warlike_desc: "Этот лидер не избегает конфликтов."
 trait_ruler_architectural_sense: "Знаток архитектуры"
 trait_ruler_architectural_sense_desc: "Этот лидер в глубине души является архитектором и вкладывает средства в более эффективные строительные технологии."
