 clone_army: "Армия клонов"
 clone_army_plural: "Армии клонов"
 clone_army_desc: "Специализированные клоны, достигающие зрелости за несколько месяцев. Их срок жизни — меньше десятилетия, и они напрочь лишены инициативы, зато беспрекословно выполняют приказы офицеров."
 robotic_army: "Наступательная армия роботов"
 robotic_army_plural: "Армии роботов"
 robotic_army_desc: "Безжалостные механические убийцы, созданные исключительно для войны. Они упорно добиваются поставленной цели и им не страшен низкий боевой дух, столь часто ухудшающий параметры органических солдат."
