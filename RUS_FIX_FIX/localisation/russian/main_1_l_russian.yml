 building_foundry_upkeep_1: "Завод по переработке сплавов"
 building_foundry_upkeep_1_desc: "Здесь лом и отходы превращают в ценные сплавы — никаких потерь, только эффективность."
 building_factory_upkeep_1: "Центр рециркуляции"
 building_factory_upkeep_1_desc: "Старые вещи обретают вторую жизнь: ремонт, модернизация, повторный запуск в производство."
 building_foundry_efficiency_1: "Лаборатория металлургии"
 building_foundry_efficiency_1_desc: "Сочетание теории и практики сулит прорывные технологии. Здесь металлы становятся прочнее, легче и долговечнее."
 building_factory_efficiency_1: "Сетевой проектный центр"
 building_factory_efficiency_1_desc: "Дизайнеры, инженеры и даже потребители работают вместе, чтобы создавать продукты быстрее и дешевле."

 building_research_upkeep_1: "Исследовательский склад"
 building_research_upkeep_1_desc: "Всё для учёных в одном месте: реагенты, детали, данные. Больше науки — меньше бюрократии."
 building_research_efficiency_1: "Центр анализа данных"
 building_research_efficiency_1_desc: "Горы экспериментальных данных превращаются в готовые решения, ускоряя исследования."

 diplomatic_actions: "Дипломатия"
