 trait_ruler_world_shaper: "Меняющий миры"
 trait_ruler_world_shaper_desc: "Этот лидер стремится переделать чужие миры согласно своим представлениям."
 trait_ruler_home_in_the_sky: "Родина в небе"
 trait_ruler_home_in_the_sky_desc: "Этот лидер тянется к звёздам."
