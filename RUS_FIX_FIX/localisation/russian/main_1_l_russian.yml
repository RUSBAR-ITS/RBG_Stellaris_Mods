 CRISIS_TYPE_LABEL_TOOLTIP: "§HТип кризиса§!\nОпределяет, какой ['concept_endgame_crisis', кризис финала игры] может произойти, если они не отключены в настройках §Iтяжести кризиса§!.\n\nВариант §IВсе§! означает, что все кризисы последуют друг за другом в случайном порядке, но единовременно активен будет только один.\n\nПо умолчанию: §YСлучайно§!"
