 FE_AGGRESSIVENESS: "Агрессивность ИИ"
 FE_AGGRESSIVENESS_TOOLTIP: "§HАгрессивность ИИ§!\nОпределяет вероятность того, что государства ИИ объявят войну своим врагам, и, таким образом, общее количество войн, которые начинаются в течение кампании. Независимо от параметра агрессивности, ИИ объявляет войну только в том случае, если это позволяет сделать его отношение к возможному противнику.\n\nПо умолчанию: §YНормальная§!"
 FE_DIFFICULTY: "Сложность"
 DIFFICULTY_ADJUSTED_AI_MODIFIERS: "Влияние сложности на модификаторы ИИ"
 DIFFICULTY_ADJUSTED_AI_MODIFIERS_TOOLTIP: "§H$DIFFICULTY_ADJUSTED_AI_MODIFIERS$§!\nОбщегосударственные экономические модификаторы всех государств под управлением ИИ умножаются на бонус §Yсложности§!. Например, технология, увеличивающая добычу £minerals£ минералов £job_miner£ шахтёрами на +20%, на сложности ['concept_grand_admiral'] даст ИИ-государствам бонус в +40%.\n\n§PВнимание:§! если включить этот параметр, к концу игры у ИИ-государств будет значительно более сильная экономика.\n\nПо умолчанию: §YОтключено§!"
