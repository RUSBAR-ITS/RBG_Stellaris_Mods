 GAMEVERSION: "Stellaris 4.5 «Лебедь»" # Stellaris patch names are Constellation names
 STARTUP_TEXT: "Добро пожаловать обновление Stellaris 4.5 «Лебедь» от хранителей!\n\nОбновление «Лебедь» посвящено исправлениям и доработке. Хранители сосредоточились на устранении вылетов, рассинхронов в сетевой игре и длинном списке других проблем, о которых вы нам сообщали.\n\nВ версии 4.5 появилось одно крупное изменение, которое закладывает основу для запланированного на конец этого года дополнения Willpower. Группы населения больше не разделяются по принципам: теперь у каждой группы может быть сочетание разных взглядов, а её поселения принимают доминирующие или вторичные принципы в зависимости от их привлекательности.\n\nБыла переработана вкладка политик: улучшена сортировка и добавлены новые политики доктрин, дающие больше контроля над автоматическим оснащением кораблей и космических баз. В редакторе государства также появилось больше возможностей для настройки цветов кораблей и границ на карте.\n\nStellaris теперь нативно работает на Apple Silicon, поэтому игроки на компьютерах Mac с процессорами серии M должны ощутить значительный прирост производительности.\n\nОбратите внимание: файлы сохранений из предыдущих версий игры будут несовместимы с 4.5 из-за масштабных изменений групп населения и фракций. Полный список изменений доступен по ссылке ниже.\n\nПриятной игры, и спасибо, что играете в Stellaris!"
