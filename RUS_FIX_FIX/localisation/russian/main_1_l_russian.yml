 NUM_MARAUDER_EMPIRES: "Мародёрские империи"
 FE_MARAUDER_EMPIRES_TOOLTIP: "§H$NUM_MARAUDER_EMPIRES$§!\nОпределяет максимальное количество ['concept_marauder_empires', мародёрских империй] в галактике.\n\nПо умолчанию: §Y1-3§! (['concept_fe_marauder_empires_default_rinfix', подробнее])$requires_apoc$"
 NUM_NOMAD_EMPIRES: "Случайные кочевые государства"
 FE_NOMAD_EMPIRES_TOOLTIP: "§HКоличество случайных кочевых государств.§!\nПараметр определяет, сколько государств под управлением ИИ будут ['concept_nomadic_empires', кочевыми] в начале игры.\n\nПо умолчанию: §Y0-3§! (['concept_fe_nomad_empires_default_rinfix', подробнее])"
 NUM_HABITABLE_WORLDS: "Пригодные для жизни миры"
 FE_HABITABLE_WORLDS_TOOLTIP: "§H$NUM_HABITABLE_WORLDS$§!\nОпределяет вероятность нахождения планет в зонах обитаемости звёздных систем, то есть пригодности их для жизни. Чем выше этот параметр, тем больше в галактике будет пригодных для жизни планет. Если выбрать значение §Y$FE_HABITABLE_WORLDS_RARE$§!, такие планеты будут появляться только в особых системах.\n\n§RВнимание!§! Повышение этого параметра может плохо сказаться на производительности на поздних стадиях игры.\n\nПо умолчанию: §Y1x§!"
 FE_HABITABLE_WORLDS_RARE: "Редко"
 RESOURCE_ABUNDANCE: "Обилие ресурсов"
 FE_RESOURCE_ABUNDANCE_TOOLTIP: "§HОбилие ресурсов§!\nОпределяет вероятность появления залежей ресурсов на небесных телах. При минимальном значении ресурсы будут появляться только в особых системах.\n\n§RВнимание!§! Крайние значения этого параметра могут повлиять на игровой баланс.\n\nПо умолчанию: §Y2x§!"
 FE_RANDOMIZE: "Случайно"
 FE_RANDOMIZE_EMPIRES_TOOLTIP: "При включении параметра генерируется случайное число ИИ-государств в указанном ползунком диапазоне."
 FE_RANDOMIZE_ADVANCED_EMPIRES_TOOLTIP: "При включении параметра генерируется случайное число развитых ИИ-государств в указанном ползунком диапазоне."
 FE_RANDOMIZE_FALLEN_EMPIRES_TOOLTIP: "При включении параметра генерируется случайное число угасших империй в указанном ползунком диапазоне."
 FE_RANDOMIZE_MARAUDER_EMPIRES_TOOLTIP: "При включении параметра генерируется случайное число мародёрских империй в указанном ползунком диапазоне."
 FE_RANDOMIZE_NOMAD_EMPIRES_TOOLTIP: "При включении параметра генерируется случайное число кочевых государств в указанном ползунком диапазоне."
 FE_CLUSTERED_STARTS: "Расположение государств"
 FE_CLUSTERED_STARTS_TOOLTIP: "§H$FE_CLUSTERED_STARTS$§!\nОпределяет, будут ли государства зарождаться в скоплениях или распределяться по галактике случайным образом.\n\nПо умолчанию: §YСлучайно§!"
 FE_ADVANCED_NEAR_PLAYER: "Развитые соседи"
 FE_ADVANCED_NEAR_PLAYER_TOOLTIP: "§H$FE_ADVANCED_NEAR_PLAYER$§!\nОпределяет, разрешено ли ['concept_advanced_empires', развитым ИИ-государствам] появляться возле игрока. §YВыключение§! этого параметра может привести к появлению меньшего количества развитых ИИ-государств, чем задано в настройках.\n\nПо умолчанию: §YОтключено§!"
 FE_MID_GAME: "Год середины игры"
 FE_MID_GAME_TOOLTIP: "§H$FE_MID_GAME$§!\nОпределяет, в каком году раньше всего могут произойти такие события середины игры, как ['concept_machine_uprising', восстание машин] и появление ['concept_great_khan', великого хана].\n\nПо умолчанию: §Y2300§!"
 FE_GUARANTEED_COLONIES: "Гарантированные пригодные миры"
 FE_GUARANTEED_COLONIES_TOOLTIP: "§H$FE_GUARANTEED_COLONIES$§!\nОпределяет, сколько пригодных для жизни планет такого же класса, что и ваш родной мир, гарантированно появится вблизи стартовой системы.\n\n§RВнимание!§! При отключении этого параметра есть вероятность, что вы не найдёте никаких пригодных для жизни миров рядом с родным миром.\n\nПо умолчанию: §Y2§!"
 FE_VICTORY: "Год победы"
 FE_VICTORY_TOOLTIP: "§H$FE_VICTORY$§!\nОпределяет, в каком году закончится игра, если в этот момент не идёт ['concept_endgame_crisis', кризис финала игры] или ['concept_war_in_heaven']. Победителем объявляется государство с наибольшим §Iсчётом§!. Продолжить игру можно и после этого года.\n\nУстановка этого ползунка на максимальное значение приведёт к полному отключению победы по времени.\n\nПо умолчанию: §Y2500§!"
 FE_END_GAME: "Год финала игры"
 FE_END_GAME_TOOLTIP: "§H$FE_END_GAME$§!\nОпределяет, в каком году раньше всего могут произойти такие события финала игры, как ['concept_endgame_crises', кризисы финала игры] и ['concept_fallen_empire_awakening', пробуждение угасших империй].\n\nПо умолчанию: §Y2400§!"
 FE_TECH_SPEED: "Стоимость технологий"
 FE_TECH_SPEED_TOOLTIP: "§H$FE_TECH_SPEED$§!\nОпределяет, насколько быстро обычные государства получают ['concept_technologies', технологии].\n\nПо умолчанию: §Y1x§!"
 FE_TECH_SPEED_DIFFICULTY_SCALE: "Влияние сложности на стоимость технологий"
 FE_TECH_SPEED_DIFFICULTY_SCALE_TOOLTIP: "§H$FE_TECH_SPEED_DIFFICULTY_SCALE$§!\nОпределяет, насколько затратно будет исследовать ['concept_technologies', технологии] в зависимости от выбранного уровня сложности. Сильнее влияет на продвинутые технологии.\n\nПовышение этого параметра усложнит игру, особенно на более высоких уровнях сложности.\n\nПо умолчанию: §YСреднее§!"
 DIFF_TECH_SCALING_OFF: "Нет"
 DIFF_TECH_SCALING_LOW: "Низкое"
 DIFF_TECH_SCALING_NORMAL: "Среднее"
 DIFF_TECH_SCALING_HIGH: "Высокое"
 DIFF_TECH_SCALING_EXTREME: "Очень высокое"
 DIFF_TECH_SCALING_OFF_TOOLTIP: "§H$DIFF_TECH_SCALING_OFF$§!\nСтоимость ['concept_technology', технологий] не зависит от уровня сложности."
 DIFF_TECH_SCALING_LOW_TOOLTIP: "§H$DIFF_TECH_SCALING_LOW$§!\nПовышение сложности слабо влияет на стоимость ['concept_technology', технологий]. Стоимость более продвинутых технологий повышается сильнее, чем стоимость начальных."
 DIFF_TECH_SCALING_NORMAL_TOOLTIP: "§H$DIFF_TECH_SCALING_NORMAL$§!\nПовышение сложности умеренно влияет на стоимость ['concept_technology', технологий]. Стоимость более продвинутых технологий повышается сильнее, чем стоимость начальных."
 DIFF_TECH_SCALING_HIGH_TOOLTIP: "§H$DIFF_TECH_SCALING_HIGH$§!\nПовышение сложности сильно влияет на стоимость ['concept_technology', технологий]. Стоимость более продвинутых технологий повышается сильнее, чем стоимость начальных."
 DIFF_TECH_SCALING_EXTREME_TOOLTIP: "§H$DIFF_TECH_SCALING_EXTREME$§!\nПовышение сложности слабо влияет на стоимость ['concept_technology', технологий]. Стоимость более продвинутых технологий повышается сильнее, чем стоимость начальных.\n\n§RВнимание!§! Выбор этого параметра на высоком уровне сложности может затруднить или даже сделать невозможной победу над противниками в финале игры."
 FE_TRADITION_SPEED: "Стоимость традиций"
 FE_TRADITION_SPEED_TOOLTIP: "§H$FE_TRADITION_SPEED$§!\nОпределяет, насколько быстро обычные государства получают ['concept_traditions', традиции].\n\nПо умолчанию: §Y1x§!"
 FE_NAVAL_CAPACITY_MULT: "$NAVY_SIZE_TITLE$"
 FE_NAVAL_CAPACITY_MULT_TOOLTIP: "§H$FE_NAVAL_CAPACITY_MULT$§!\nВместимость флота всех государств умножается на это значение. Все модификаторы вместимости флота также будут умножены на это значение.\n\n§RВнимание!§! Увеличение этого параметра может повлиять на производительность и игровой баланс на поздних стадиях игры.\n\nПо умолчанию: §Y1x§!"
 FE_COMMAND_LIMIT_MULT: "$COMMAND_LIMIT$"
 FE_COMMAND_LIMIT_MULT_TOOLTIP: "§H$FE_COMMAND_LIMIT_MULT$§!\nПредел управляемости флотилии всех государств умножается на это значение. Все модификаторы предела управляемости флотилии также будут умножены на это значение.\n\n§RВнимание!§! Изменение этого параметра может повлиять на игровой баланс.\n\nПо умолчанию: §Y1x§!"
 FE_CRISES: "Тяжесть кризиса"
 FE_CRISES_TOOLTIP: "§H$FE_CRISES$§!\nОпределяет силу флотилий, принадлежащих ['concept_endgame_crises', кризису финала игры]. Чем выше множитель, тем серьёзнее будет кризис.\n\nЕсли в настройках §IТип кризиса§! выбрать §IВсе§!, это значение будет умножаться на 2 за каждый пережитый кризис.\n\nНа §Yуровнях сложности от «$DIFFICULTY_ENSIGN$»§! и выше этот параметр будет также затрагивать тяжесть §Yкризиса середины игры§!.\n\nПо умолчанию: §Y0.5x-1.5x§! (['concept_fe_crises_default_rinfix', подробнее])"
 FALLEN_EMPIRE_STRENGTH_LABEL: "Сила угасших империй"
 FALLEN_EMPIRE_STRENGTH_LABEL_TOOLTIP: "§H$FALLEN_EMPIRE_STRENGTH_LABEL$§!\nПараметр определяет силу флотилий ['concept_fallen_empires', угасших] и ['concept_awakened_empires', пробуждённых империй]. Чем выше множитель, тем опаснее они будут.\n\nПо умолчанию: §Y1x§!"
 FALLEN_EMPIRE_STRENGTH_SCALE_TRIGGER: "Сила угасших империй $COMPARE$ $VALUE|Y$"
 NOT_FALLEN_EMPIRE_STRENGTH_SCALE_TRIGGER: "Сила угасших империй НЕ $COMPARE$ $VALUE|Y$"
 FE_PRIMITIVE_WORLDS: "Досветовые цивилизации и предразумные расы"
 FE_PRIMITIVE_WORLDS_TOOLTIP: "§H$FE_PRIMITIVE_WORLDS$§!\nОпределяет распространённость ['concept_preftl_civilizations', досветовых цивилизаций] и ['concept_presapient_species', предразумных рас] в галактике.\n\nЧем он выше, тем больше вероятность появления досветовых цивилизаций и предразумных рас при генерации галактики.\n\nПо умолчанию: §Y1x§!"
 FE_LOGISTIC_CEILING: "Логистический потолок роста"
 FE_LOGISTIC_CEILING_TOOLTIP: "§H$FE_LOGISTIC_CEILING$§!\nОпределяет величину бонуса к росту поселений, когда планета находится в центре своей логистической кривой. Чем он выше, тем быстрее растут поселения.\n\n§RВнимание!§! Увеличение этого параметра может ухудшить производительность и баланс на финальном этапе игры.\n\nПо умолчанию: §Y5x§!"
 FE_GROWTH_SCALE: "Необходимые очки роста"
 FE_GROWTH_SCALE_TOOLTIP: "§H$FE_GROWTH_SCALE$§!\nМасштабирует скорость роста населения в зависимости от текущего населения государства. Чем выше, тем медленнее растут поселения.\n\n§RВнимание!§! Снижение этого параметра может сильно ухудшить производительность и баланс. Вместе с понижением этого параметра рекомендуется снижать §Yлогистический потолок роста§!.\n\nПо умолчанию: §Y0.25x§!"
 FE_LOGISTICS_FLEET_UPKEEP: "Логистические затраты на содержание флотилий"
 FE_LOGISTICS_FLEET_UPKEEP_TOOLTIP: "§H$FE_LOGISTICS_FLEET_UPKEEP$§!\nПараметр определяет затраты $r_trade_gen$ на содержание флотилий, когда они не пристыкованы или находятся на вражеской территории. Чем выше значение, тем дороже будут обходиться флотилии во время войны.\n\nПо умолчанию: §Y1x§!"
 FE_LOGISTICS_PLANET_DEFICIT: "Логистические затраты при планетарном дефиците"
 FE_LOGISTICS_PLANET_DEFICIT_TOOLTIP: "§H$FE_LOGISTICS_PLANET_DEFICIT$§!\nПараметр определяет затраты $r_trade_gen$ на удовлетворение местного дефицита в колониях. Чем выше значение, тем дороже будут обходиться крайне специализированные колонии с большим дефицитом ресурсов, даже если эти ресурсы доставляются из других колоний в государстве.\n\nПо умолчанию: §Y1x§!"

