 shroud_forged_defense_army: "Оборонительная армия покроворождённых"
 shroud_forged_defense_army_plural: "Оборонительные армии покроворождённых"
 shroud_forged_defense_army_desc: "Псионически чувствительные синтетики несут дозор, тщательно оберегая свои миры. Покров наполняет их решительностью, недоступной простым механизмам."
 android_army: "Наступательная армия андроидов"
 android_army_plural: "Армии андроидов"
 android_army_desc: "Будучи полуавтономными «винтиками» в отлаженной военной машине, воины-андроиды являются более выносливыми, агрессивными и лучше реагируют на изменение ситуации на поле боя, чем их предшественники-роботы."
 android_defense_army: "Оборонительная армия андроидов"
 android_defense_army_plural: "Оборонительные армии андроидов"
 android_defense_army_desc: "$android_army_desc$"
 psionic_army: "Армия псиоников"
 psionic_army_plural: "Армии псиоников"
 psionic_army_desc: "Солдаты, наделённые псионическими способностями. Их разрушительные пси-таланты в корне меняют тактику и стратегию войны. Эти бойцы первым делом стремятся подавить вражескую волю к сопротивлению."
 xenomorph_army: "Армия ксеноморфов"
 xenomorph_army_plural: "Армии ксеноморфов"
 xenomorph_army_desc: "Полчища голодных тварей, созданных биоинженерами, состоящие из зубов, когтей и ненасытной тяги к убийству. Группа учёных следит за неистовыми стаями и пытается управлять их действиями, сидя в укреплённых бункерах вдали от линии фронта."
 gene_warrior_army: "Армия геномодов"
 gene_warrior_army_plural: "Армии геномодов"
 gene_warrior_army_desc: "Генетически модифицированные супербойцы. Кандидатов обычно выбирают из элитных подразделений регулярной армии. Затем они проходят длительный курс генной терапии, набирают массу, становятся сильнее и быстрее своих бывших товарищей."
 swarm_army: "Преторинская армия"
