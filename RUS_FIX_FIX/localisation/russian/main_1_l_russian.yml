 DIFFICULTY_GRAND_ADMIRAL_DESC: "ИИ получает огромные бонусы."
 FE_DIFFICULTY_TOOLTIP: "§HСложность§!\nОпределяет, насколько большими будут бонусы к экономике, исследованиям и вместимости флота для ИИ или игрока.\n\nДоступны следующие уровни сложности:\n- §Y$DIFFICULTY_CIVILIAN$§!: $DIFFICULTY_CIVILIAN_DESC$\n- §Y$DIFFICULTY_CADET$§!: $DIFFICULTY_CADET_DESC$\n- §Y$DIFFICULTY_ENSIGN$§!: $DIFFICULTY_ENSIGN_DESC$\n- §Y$DIFFICULTY_CAPTAIN$§!: $DIFFICULTY_CAPTAIN_DESC$\n- §Y$DIFFICULTY_COMMODORE$§!: $DIFFICULTY_COMMODORE_DESC$\n- §Y$DIFFICULTY_ADMIRAL$§!: $DIFFICULTY_ADMIRAL_DESC$\n- §Y$DIFFICULTY_GRAND_ADMIRAL$§!: $DIFFICULTY_GRAND_ADMIRAL_DESC$"
 FE_IRONMAN: "Режим «Стальная воля»"
 FE_IRONMAN_TOOLTIP: "§HРежим «Стальная воля»§!\nВ режиме «Стальная воля» недоступна командная строка с командами, а игра автоматически сохраняется в один и тот же файл. В этом режиме у вас нет права на ошибку."
 FE_EMPIRES_TOOLTIP: "§HЧисло ИИ-государств§!\nОпределяет, сколько ИИ-государств будет в галактике."
 FE_ADVANCED_EMPIRES_TOOLTIP: "§HЧисло развитых ИИ-государств§!\nОпределяет, сколько ИИ-государств начнёт игру с преимуществом в ресурсах, технологиях и населении. Развитые государства не получают никаких бонусов, кроме более сильной стартовой позиции. Этот параметр не затрагивает ['concept_fallen_empires', угасшие империи]."
 FE_IRONMAN_MULTIPLAYER: "§RРежим «Стальная воля» недоступен для сетевой игры.§!"
 FE_IRONMAN_NOCLOUD: "§RРежим «Стальная воля» требует доступа к Steam Cloud, и необходимо, чтобы игрок был подключён к Steam.§!"
 FE_IRONMAN_AUTOSAVE: "§RВы не можете изменять периодичность автосохранения в режиме «Стальная воля».§!"
 FE_GALAXY_SHAPE_TOOLTIP: "§HФорма галактики§!\nОпределяет форму карты галактики.\n\nНекоторые формы доступны только для галактик определённых §Yразмеров§!.\n\nДоступны следующие формы галактик:\n$concept_galaxy_shape_desc$"
 FE_GALAXY_SIZE_TOOLTIP: "§HРазмер галактики§!\nОпределяет количество звёздных систем в галактике. Также влияет на количество §YИИ-государств§! по умолчанию.\n\n§RВнимание!§! Увеличение этого параметра сильно влияет на производительность на поздних стадиях игры."
