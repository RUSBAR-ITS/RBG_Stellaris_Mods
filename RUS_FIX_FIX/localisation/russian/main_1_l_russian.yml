 trait_ruler_industrialist_desc: "Этот лидер считает приоритетом повышение добычи полезных ископаемых."
 trait_ruler_eye_for_talent: "Поиск талантов"
 trait_ruler_eye_for_talent_desc: "Этот лидер считается необычайно проницательным и замечает талант там, где другие видят только эксцентричность или некомпетентность."
 trait_ruler_deep_connections: "Крепкие связи"
 trait_ruler_deep_connections_desc: "Этот лидер крепко застрял в замысловатой паутине политической машины."
 trait_ruler_deep_connections_2: "$trait_ruler_deep_connections$ II"
 trait_ruler_deep_connections_2_desc: "$trait_ruler_deep_connections_desc$"
 trait_ruler_charismatic: "Обаятельность"
 trait_ruler_charismatic_desc: "Этот лидер невероятно харизматичен и без труда навязывает другим свою волю."
 trait_ruler_champion_of_the_people: "Народный избранник"
 trait_ruler_champion_of_the_people_desc: "Похоже, этот лидер искренне заботится о своих подчинённых."
 trait_ruler_feedback_loop: "Цепь обратной связи"
 trait_ruler_feedback_loop_desc: "Эффективные цепи обратной связи и анализ действия-противодействия позволяют этой единице эффективнее предсказывать возможные результаты."
 trait_ruler_expansionist: "Экспансионист"
 trait_ruler_expansionist_desc: "Этот лидер твердо намеревается покорить как можно больше звёзд."
 trait_ruler_fertility_preacher: "Сторонник рождаемости"
 trait_ruler_fertility_preacher_desc: "Этот лидер отлично умеет добывать жизненно необходимые ресурсы для растущего населения."
 trait_ruler_investor: "Инвестор"
 trait_ruler_investor_desc: "Этот лидер — проницательный экономист, способный максимально повысить финансовый потенциал."
 trait_ruler_investor_2: "$trait_ruler_investor$ II"
 trait_ruler_investor_2_desc: "$trait_ruler_investor_desc$"
 trait_ruler_investor_3: "$trait_ruler_investor$ III"
 trait_ruler_investor_3_desc: "$trait_ruler_investor_desc$"
 trait_ruler_space_miner: "Космический шахтёр"
 trait_ruler_space_miner_desc: "Этот лидер осознаёт, насколько важной для выживания любой звёздной империи является эксплуатация космических ресурсов."
 trait_ruler_explorer: "Любовь к наукам"
 trait_ruler_explorer_desc: "Этот лидер известен своей неудержимой любознательностью и превыше всего ставит исследование космоса."
 trait_ruler_explorer_2: "$trait_ruler_explorer$ II"
 trait_ruler_explorer_2_desc: "$trait_ruler_explorer_desc$"

 # Machine
 leader_trait_ruler_machine_intelligence: "Машинный разум"
 leader_trait_ruler_machine_intelligence_desc: "Этот лидер — мозговой центр, который контролирует и направляет всю деятельность в империи машин."
 leader_trait_flexible_programming: "Гибкая программа"
 leader_trait_flexible_programming_desc: "Этот лидер отличается необычайно гибкой программой и способен быстро изменять подходы и методы, если они позволят добиться лучших результатов."
 leader_trait_rigid_programming: "Жёсткая программа"
 leader_trait_rigid_programming_desc: "Этот лидер отличается жёсткой программой, которая крайне редко позволяет модифицировать поведение, даже в тех случаях, когда изменения повысят эффективность."
 leader_trait_newboot: "Новая прошивка"
 leader_trait_newboot_desc: "Этот лидер совсем недавно был наделён достаточной самостоятельностью, чтобы руководить другими."
 leader_trait_warbot_tinkerer: "Увлечение боевыми роботами"
 leader_trait_warbot_tinkerer_desc: "Этот лидер увлечён проектированием боевых роботов и постоянно совершенствует существующие модели."
 leader_trait_ai_aided_design: "ИИ-проектирование"
 leader_trait_ai_aided_design_desc: "Этот лидер постоянно строит теоретические модели на второстепенном ядре памяти, чтобы повысить рентабельность постройки космических кораблей."
 leader_trait_bulldozer: "Бульдозер"
 leader_trait_bulldozer_desc: "Этот лидер в совершенстве познал искусство сравнивания чужой территории с землёй."
 leader_trait_analytical: "Аналитик"
 leader_trait_analytical_desc: "Этот лидер выделяет необычно высокий процент мощности процессора на анализ и популяризацию естественных наук."
 leader_trait_parts_cannibalizer: "Вторичное использование"
 leader_trait_parts_cannibalizer_desc: "Этот лидер ловко снимает запчасти с неисправных или уничтоженных боевых роботов, чтобы использовать их в других машинах."
 leader_trait_demoralizer: "Деморализатор"
 leader_trait_demoralizer_desc: "Этот лидер восхищается хрупкостью разума органических существ и его уязвимостью перед творческим применением тактик устрашения на поле боя."
 leader_trait_erratic_morality_core: "Неустойчивое моральное ядро"
 leader_trait_erratic_morality_core_desc: "Этот лидер зачастую страдает от угрызений совести и сожалеет о вражеских потерях из-за нестабильности морального ядра."
 leader_trait_maintenance_loop: "Цикл обслуживания"
 leader_trait_maintenance_loop_desc: "Этот лидер постоянно выполняет цикл обслуживания, тщательно следя за кораблями флота и снижая их логистические затраты."
 leader_trait_unstable_code_base: "Нестабильный базовый код"
 leader_trait_unstable_code_base_desc: "Базовый код этого лидера нестабилен, что проявляется в его нервном и нелогичном поведении."
 leader_trait_cataloger: "Каталогизатор"
 leader_trait_cataloger_desc: "Этот лидер считает своим истинным призванием инвентаризацию всей вселенной."

 # Event Special
 leader_trait_sentinel: "Выучка Стражей"
 leader_trait_sentinel_desc: "Командиры флотилий Стражей обладают подробными знаниями об анатомии преторинов и их тактике."
 leader_trait_hive_mind: "Коллективный разум"
 leader_trait_hive_mind_desc: "Гештальт-сознание, контролирующее действия преторинских флотилий, доказало свою потрясающую способность выполнять несколько задач одновременно."
 leader_trait_hive_affinity: "Взаимосвязь улья"
 leader_trait_hive_affinity_desc: "Преторины, управляемые общим для флотилии сознанием, добились необычайного уровня взаимосвязи. Их дисциплина во время ведения огня значительно улучшилась, что повысило их скорострельность."
 leader_trait_void_swimmer: "Охотник пустоты"
 leader_trait_void_swimmer_desc: "Охотничьи инстинкты этого общего для флотилии сознания привели к тому, что преторины, управляемые им, пришли в неистовство. Страсть к сражениям постоянно вынуждает их двигаться вперёд."
 leader_trait_ethereal: "Бесплотность"
 leader_trait_ethereal_desc: "Некоторые хозяева флотилий из другого измерения научились использовать бесплотную природу своих кораблей, чтобы значительно улучшить их способности к уклонению во время боя."
 leader_trait_dimensional_stutter: "Межпространственные рывки"
 leader_trait_dimensional_stutter_desc: "По неизвестным причинам корабли флотилии из другого измерения, находящиеся под командованием этого лидера, передвигаются рывками, то появляясь, то исчезая, что повышает их субсветовую скорость."



